<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Chinese Character Study · 301–400</title>
<style>
:root{--ink:#241b16;--muted:#74665c;--paper:#f4efe5;--panel:#fbf8f1;--line:#c7b8a3;--deep:#3b2017;--good:#285c3c;--bad:#8a2f27;--gold:#9a7440}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:linear-gradient(135deg,#d7cbb8 0%,#efe7d7 52%,#d8cdbb 100%);color:var(--ink);font-family:Georgia,"Times New Roman","Noto Serif SC","Songti SC",serif;overflow:hidden}
.app{height:100vh;display:grid;grid-template-rows:auto 1fr;gap:0}
.topbar{min-height:58px;display:flex;align-items:center;gap:14px;padding:8px 18px;background:rgba(40,26,19,.93);color:#f8f1e5;border-bottom:1px solid rgba(255,255,255,.15)}
.brand{font-size:18px;font-weight:700;letter-spacing:.05em;white-space:nowrap}.brand small{font-size:12px;font-weight:400;opacity:.7;margin-left:8px}
.progress{flex:1;max-width:460px;height:7px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:#d9b578;width:1%;transition:width .25s ease}
.stat{font-size:13px;opacity:.88;white-space:nowrap}.topbtn{border:1px solid rgba(255,255,255,.28);background:transparent;color:white;border-radius:8px;padding:7px 10px;cursor:pointer}
.main{min-height:0;display:grid;grid-template-columns:minmax(390px,46%) 1fr;gap:18px;padding:18px}
.quiz{min-height:0;background:rgba(251,248,241,.97);border:1px solid #bcae9a;box-shadow:0 18px 60px rgba(54,34,22,.16);border-radius:15px;padding:18px 22px 16px;display:flex;flex-direction:column;overflow:auto}
.rankline{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.09em}
.character{text-align:center;font-family:"Noto Serif SC","Songti SC","STSong",serif;font-size:clamp(92px,11vw,164px);line-height:.95;margin:8px 0 0;color:#20130e;text-shadow:0 1px 0 #fff}
.pinyin{text-align:center;font-size:clamp(24px,2.6vw,39px);font-style:italic;color:#6f3827;margin:0 0 8px}
.front-pinyin{display:none}.prompt{text-align:center;font-size:16px;margin:2px 0 8px;color:#77675b}
button{font:600 13px/1.1 Georgia,serif;letter-spacing:.03em}
.controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:3px 0 7px}.controls .nav{display:flex;gap:6px;margin-right:6px}.ghost,.action{padding:9px 12px;border-radius:8px;cursor:pointer}.ghost{border:1px solid #b4a38e;background:#f6f0e5;color:#3e3028}.action{border:1px solid #6c4933;background:#6c4933;color:#fff}
.reveal{border-top:1px solid #d7caba;padding-top:9px;margin-top:2px;animation:fade .18s ease}.reveal-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:5px}.reveal-pinyin{font-size:clamp(27px,2.8vw,42px);font-style:italic;color:#6f3827;font-weight:700}.definition{font-size:20px;margin:0}.definition b{color:#6d3b27}.wordtitle,.extitle{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:#7a685a;margin:9px 0 4px;font-weight:700}.wordlist{display:flex;gap:6px;flex-wrap:wrap}.wordchip{background:#eee4d4;border:1px solid #d1c0a8;border-radius:7px;padding:5px 8px;line-height:1.18}.wordchip .wzh{font-family:"Noto Serif SC","Songti SC",serif;font-size:19px;font-weight:700}.wordchip .wpy{font-size:13px;font-style:italic;color:#754635}.wordchip .wen{font-size:12px;color:#66594f}.examples{display:grid;gap:5px}.example{padding:6px 9px;background:#f3ede2;border-left:3px solid #aa8558;border-radius:5px;line-height:1.22}.example-zh{font-family:"Noto Serif SC","Songti SC",serif;font-size:clamp(19px,1.65vw,25px)}.example-py{font-size:clamp(14px,1.1vw,17px);font-style:italic;color:#744b39;margin-top:2px}.example-en{font-size:clamp(13px,1vw,16px);color:#4f463f;margin-top:2px}.example em{font-style:normal;font-weight:800;color:#8d2f21;background:#ead9bf;border-radius:3px;padding:0 .05em}
.flipcard{margin-top:3px;border:1px solid #b6a58d;border-radius:10px;padding:12px 14px;background:#f4ecdd}.flipcard h3{margin:0 0 7px;font-size:15px;color:#6d594b;text-transform:uppercase;letter-spacing:.08em}.english-list{font-size:clamp(22px,2vw,32px);line-height:1.2;margin:4px 0 10px}.flipcard .reveal-pinyin{margin:0 0 6px}.further{border:1px solid #6c4933;background:transparent;color:#6c4933;border-radius:8px;padding:8px 11px;cursor:pointer}
.imagepane{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;background:rgba(33,24,19,.86);border:1px solid rgba(65,42,28,.5);border-radius:15px;overflow:hidden;box-shadow:0 18px 60px rgba(54,34,22,.18)}
.imagepane:before{content:"";position:absolute;inset:10px;border:1px solid rgba(239,220,184,.22);border-radius:10px;pointer-events:none}.art{display:block;max-width:94%;max-height:90%;width:auto;height:auto;object-fit:contain;filter:saturate(.98) contrast(1.02);box-shadow:0 8px 32px rgba(0,0,0,.28);transition:opacity .35s ease,transform .35s ease}.art.wide{max-width:98%;max-height:84%}
.imagecount{position:absolute;right:18px;bottom:14px;color:rgba(255,255,255,.72);font:12px/1.2 Georgia,serif;letter-spacing:.08em;background:rgba(0,0,0,.28);padding:5px 8px;border-radius:99px}.rotate-note{position:absolute;left:18px;bottom:14px;color:rgba(255,255,255,.64);font:12px/1.2 Georgia,serif}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@media(max-width:900px){body{overflow:auto}.app{height:auto;min-height:100vh}.main{grid-template-columns:1fr;grid-template-rows:auto minmax(360px,55vh)}.quiz{overflow:visible}.imagepane{min-height:420px}.topbar{flex-wrap:wrap}.progress{order:3;flex-basis:100%;max-width:none}}
@media(max-width:520px){.main{padding:9px;gap:9px}.quiz{padding:14px}.brand small{display:none}.character{font-size:104px}.example{font-size:20px}.topbar{padding:8px 10px}.stat.scoreStat{display:none}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">汉字 301–400 <small>recognition + study</small></div>
    <div class="progress"><i id="progressFill"></i></div>
    <div class="stat" id="cardStat"></div>
    <button class="topbtn" id="shuffleBtn">Shuffle</button>
    <button class="topbtn" id="resetBtn">Reset order</button>
  </header>

  <main class="main">
    <section class="quiz">
      <div class="rankline"><span id="rankLabel"></span></div>
      <div class="character" id="char"></div>
      <div class="pinyin front-pinyin" id="pinyin" aria-hidden="true"></div>
      <div class="prompt">Recognize the character first. Reveal for pinyin, meanings, common words, and fully translated examples.</div>
      <div class="controls">
        <div class="nav"><button class="ghost" id="prevBtn">← Previous</button><button class="ghost" id="nextBtn">Next →</button></div>
        <button class="action" id="revealBtn">Reveal</button>
        <button class="ghost" id="flipBtn">Flip</button>
      </div>
      <div id="detailArea"></div>
    </section>

    <section class="imagepane" id="imagePane">
      <img class="art" id="art" alt="Chinese art and material culture study image">
    </section>
  </main>
</div>
<script>
const BANK = [{"rank":301,"char":"完","pinyin":"wán","meanings":["complete","finish","whole"],"words":[{"zh":"完成","pinyin":"wán chéng","en":"complete; finish"},{"zh":"完全","pinyin":"wán quán","en":"completely"},{"zh":"完整","pinyin":"wán zhěng","en":"complete; intact"},{"zh":"完善","pinyin":"wán shàn","en":"perfect; improve"}],"examples":[{"zh":"我们完成了今天的工作。","pinyin":"wǒ men wán chéng le jīn tiān de gōng zuò.","en":"We finished today's work."},{"zh":"这个问题还没有完全解决。","pinyin":"zhè gè wèn tí hái méi yǒu wán quán jiě jué.","en":"This problem has not been completely solved yet."},{"zh":"请把这份名单补充完整。","pinyin":"qǐng bǎ zhè fèn míng dān bǔ chōng wán zhěng.","en":"Please make this list complete."}]},{"rank":302,"char":"设","pinyin":"shè","meanings":["set up","establish","suppose"],"words":[{"zh":"设计","pinyin":"shè jì","en":"design"},{"zh":"设备","pinyin":"shè bèi","en":"equipment"},{"zh":"假设","pinyin":"jiǎ shè","en":"suppose; hypothesis"},{"zh":"建设","pinyin":"jiàn shè","en":"construct"}],"examples":[{"zh":"他正在设计一座新桥。","pinyin":"tā zhèng zài shè jì yí zuò xīn qiáo.","en":"He is designing a new bridge."},{"zh":"实验室里有很多新设备。","pinyin":"shí yàn shì lǐ yǒu hěn duō xīn shè bèi.","en":"There is a lot of new equipment in the lab."},{"zh":"城市建设需要很长时间。","pinyin":"chéng shì jiàn shè xū yào hěn cháng shí jiān.","en":"Building a city takes a long time."}]},{"rank":303,"char":"式","pinyin":"shì","meanings":["style","form","formula","ceremony"],"words":[{"zh":"方式","pinyin":"fāng shì","en":"way; method"},{"zh":"正式","pinyin":"zhèng shì","en":"formal"},{"zh":"公式","pinyin":"gōng shì","en":"formula"},{"zh":"仪式","pinyin":"yí shì","en":"ceremony"}],"examples":[{"zh":"请用正式的语气写信。","pinyin":"qǐng yòng zhèng shì de yǔ qì xiě xìn.","en":"Please write the letter in a formal tone."},{"zh":"每个人都有自己的生活方式。","pinyin":"měi gè rén dōu yǒu zì jǐ de shēng huó fāng shì.","en":"Everyone has their own way of life."},{"zh":"婚礼仪式下午三点开始。","pinyin":"hūn lǐ yí shì xià wǔ sān diǎn kāi shǐ.","en":"The wedding ceremony begins at three in the afternoon."}]},{"rank":304,"char":"色","pinyin":"sè","meanings":["color","look","kind"],"words":[{"zh":"颜色","pinyin":"yán sè","en":"color"},{"zh":"景色","pinyin":"jǐng sè","en":"scenery"},{"zh":"出色","pinyin":"chū sè","en":"outstanding"},{"zh":"色彩","pinyin":"sè cǎi","en":"color; hue"}],"examples":[{"zh":"你最喜欢什么颜色？","pinyin":"nǐ zuì xǐ huan shén me yán sè?","en":"What color do you like best?"},{"zh":"山上的景色非常美。","pinyin":"shān shàng de jǐng sè fēi cháng měi.","en":"The scenery on the mountain is very beautiful."},{"zh":"她今天的表现很出色。","pinyin":"tā jīn tiān de biǎo xiàn hěn chū sè.","en":"Her performance today was outstanding."}]},{"rank":305,"char":"路","pinyin":"lù","meanings":["road","way","path"],"words":[{"zh":"道路","pinyin":"dào lù","en":"road"},{"zh":"路口","pinyin":"lù kǒu","en":"intersection"},{"zh":"路上","pinyin":"lù shang","en":"on the way"},{"zh":"路费","pinyin":"lù fèi","en":"travel expenses"}],"examples":[{"zh":"这条路通向海边。","pinyin":"zhè tiáo lù tōng xiàng hǎi biān.","en":"This road leads to the sea."},{"zh":"请在下一个路口右转。","pinyin":"qǐng zài xià yí gè lù kǒu yòu zhuǎn.","en":"Please turn right at the next intersection."},{"zh":"我在路上遇到了一位老朋友。","pinyin":"wǒ zài lù shang yù dào le yí wèi lǎo péng you.","en":"I met an old friend on the way."}]},{"rank":306,"char":"记","pinyin":"jì","meanings":["remember","record","mark"],"words":[{"zh":"记得","pinyin":"jì de","en":"remember"},{"zh":"记住","pinyin":"jì zhù","en":"keep in mind"},{"zh":"日记","pinyin":"rì jì","en":"diary"},{"zh":"记者","pinyin":"jì zhě","en":"reporter"}],"examples":[{"zh":"你还记得他的名字吗？","pinyin":"nǐ hái jì de tā de míng zi ma?","en":"Do you still remember his name?"},{"zh":"请记住这个电话号码。","pinyin":"qǐng jì zhù zhè gè diàn huà hào mǎ.","en":"Please remember this phone number."},{"zh":"记者正在采访当地居民。","pinyin":"jì zhě zhèng zài cǎi fǎng dāng dì jū mín.","en":"The reporter is interviewing local residents."}]},{"rank":307,"char":"南","pinyin":"nán","meanings":["south"],"words":[{"zh":"南方","pinyin":"nán fāng","en":"the south"},{"zh":"南边","pinyin":"nán bian","en":"south side"},{"zh":"南海","pinyin":"nán hǎi","en":"South China Sea"},{"zh":"江南","pinyin":"Jiāng nán","en":"south of the Yangtze"}],"examples":[{"zh":"鸟在冬天飞向南方。","pinyin":"niǎo zài dōng tiān fēi xiàng nán fāng.","en":"Birds fly south in winter."},{"zh":"学校在城市的南边。","pinyin":"xué xiào zài chéng shì de nán bian.","en":"The school is on the south side of the city."},{"zh":"江南的春天很美。","pinyin":"Jiāng nán de chūn tiān hěn měi.","en":"Spring south of the Yangtze is beautiful."}]},{"rank":308,"char":"品","pinyin":"pǐn","meanings":["article","quality","taste","product"],"words":[{"zh":"产品","pinyin":"chǎn pǐn","en":"product"},{"zh":"品质","pinyin":"pǐn zhì","en":"quality"},{"zh":"作品","pinyin":"zuò pǐn","en":"work (of art)"},{"zh":"品种","pinyin":"pǐn zhǒng","en":"variety"}],"examples":[{"zh":"这家工厂生产多种产品。","pinyin":"zhè jiā gōng chǎng shēng chǎn duō zhǒng chǎn pǐn.","en":"This factory produces many kinds of products."},{"zh":"我们非常重视产品的品质。","pinyin":"wǒ men fēi cháng zhòng shì chǎn pǐn de pǐn zhì.","en":"We place great importance on product quality."},{"zh":"这是他最有名的作品。","pinyin":"zhè shì tā zuì yǒu míng de zuò pǐn.","en":"This is his most famous work."}]},{"rank":309,"char":"住","pinyin":"zhù","meanings":["live","reside","stop"],"words":[{"zh":"住在","pinyin":"zhù zài","en":"live at"},{"zh":"住房","pinyin":"zhù fáng","en":"housing"},{"zh":"记住","pinyin":"jì zhù","en":"remember"},{"zh":"住院","pinyin":"zhù yuàn","en":"be in hospital"}],"examples":[{"zh":"我住在城市的东边。","pinyin":"wǒ zhù zài chéng shì de dōng bian.","en":"I live on the east side of the city."},{"zh":"他因为生病住院了。","pinyin":"tā yīn wèi shēng bìng zhù yuàn le.","en":"He is in the hospital because he is ill."},{"zh":"请记住我刚才说的话。","pinyin":"qǐng jì zhù wǒ gāng cái shuō de huà.","en":"Please remember what I just said."}]},{"rank":310,"char":"告","pinyin":"gào","meanings":["tell","announce","accuse"],"words":[{"zh":"告诉","pinyin":"gào su","en":"tell"},{"zh":"报告","pinyin":"bào gào","en":"report"},{"zh":"广告","p const IMAGES = ["img/01-pagoda.jpg", "img/02-interior.jpg", "img/03-bridge.jpg", "img/04-pingyao.jpg", "img/05-xian.jpg", "img/06-garden.jpg", "img/07-dalian.jpg", "img/08-hangzhou.jpg", "img/09-chengdu.jpg"];
let order = BANK.map((_,i)=>i), pos=0, state='front';

function norm(s){return (s||'').toLowerCase().replace(/[’'.,!?()\-_/]+/g,' ').replace(/\s+/g,' ').trim()}
function current(){return BANK[order[pos]]}
function safe(t){return String(t).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function mark(sentence,ch){return safe(sentence).split(safe(ch)).join('<em>'+safe(ch)+'</em>')}
function imageForPosition(){const n=IMAGES.length||1;return Math.floor(pos*n/BANK.length)%n}
function setImage(){const idx=imageForPosition(), img=$('art');img.style.opacity=.15;setTimeout(()=>{img.src=IMAGES[idx]; img.onload=()=>{img.classList.toggle('wide',img.naturalWidth/img.naturalHeight>1.75);img.style.opacity=1}},90)}
function renderDetail(mode){const c=current(), d=$('detailArea'); if(mode==='front'){d.innerHTML='';return}
 if(mode==='flip'){d.innerHTML=`<div class="flipcard"><h3>Pinyin + English</h3><div class="reveal-pinyin">${safe(c.pinyin)}</div><div class="english-list">${c.meanings.map(safe).join(' · ')}</div><button class="further" id="furtherBtn">Reveal further</button></div>`;$('furtherBtn').onclick=()=>{state='revealed';renderDetail('revealed')};return}
 const words=c.words.map(w=>`<div class="wordchip"><div class="wzh">${mark(w.zh,c.char)}</div><div class="wpy">${safe(w.pinyin)}</div><div class="wen">${safe(w.en)}</div></div>`).join('');
 const ex=c.examples.map(x=>`<div class="example"><div class="example-zh">${mark(x.zh,c.char)}</div><div class="example-py">${safe(x.pinyin)}</div><div class="example-en">${safe(x.en)}</div></div>`).join('');

$('prevBtn').onclick=()=>move(-1);$('nextBtn').onclick=()=>move(1);
