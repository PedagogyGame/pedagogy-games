<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedagogy Game</title>
<style>
  :root{
    --bg:#0b0f14;
    --surface:#121a23;
    --surface-hi:#182330;
    --edge:#26333f;
    --ink:#e3eaf2;
    --dim:#8496a8;
    --accent:#69d97f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    min-height:100vh;background:var(--bg);color:var(--ink);
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;
    display:flex;align-items:center;justify-content:center;padding:6vh 1.5rem;
  }
  main{width:100%;max-width:34rem}

  header{border-bottom:1px solid var(--edge);padding-bottom:1.5rem;margin-bottom:2.5rem}
  h1{font-size:clamp(1.9rem,6vw,2.6rem);font-weight:600;letter-spacing:.18em;text-transform:uppercase}
  .tagline{margin-top:.7rem;color:var(--dim);font-size:.95rem;letter-spacing:.06em}

  .eyebrow{
    display:block;margin-bottom:.9rem;color:var(--dim);
    font-size:.75rem;letter-spacing:.22em;text-transform:uppercase;
  }

  .card{
    display:block;position:relative;text-decoration:none;color:inherit;
    background:var(--surface);border:1px solid var(--edge);border-radius:10px;
    padding:1.6rem 1.7rem;
    transition:background .18s ease,border-color .18s ease,transform .18s ease;
  }
  .card::before{
    content:"";position:absolute;left:0;top:1.6rem;bottom:1.6rem;width:2px;
    background:var(--accent);border-radius:2px;opacity:.65;transition:opacity .18s ease;
  }
  .card:hover,.card:focus-visible{
    background:var(--surface-hi);border-color:#3a4d5e;transform:translateY(-2px);
  }
  .card:hover::before,.card:focus-visible::before{opacity:1}
  .card:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

  .card-row{display:flex;align-items:center;justify-content:space-between;gap:1rem}
  .card h2{font-size:1.35rem;font-weight:600;letter-spacing:.05em}
  .arrow{color:var(--accent);font-size:1.2rem;transition:transform .18s ease}
  .card:hover .arrow{transform:translateX(3px)}
  .card p{margin-top:.6rem;color:var(--dim);font-size:.92rem;line-height:1.6}
  .meta{margin-top:1.1rem;display:flex;flex-wrap:wrap;gap:.5rem}
  .meta span{
    font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);
    border:1px solid var(--edge);border-radius:999px;padding:.28rem .7rem;
  }

  footer{margin-top:2.5rem;color:#5d6d7d;font-size:.75rem;letter-spacing:.12em}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <header>
    <h1>Pedagogy Game</h1>
    <p class="tagline">Learn the vocabulary by living the workday.</p>
  </header>

  <span class="eyebrow">Available now</span>

  <a class="card" href="ai-labs-101.html">
    <div class="card-row">
      <h2>AI Labs 101</h2>
      <span class="arrow" aria-hidden="true">&rarr;</span>
    </div>
    <p>Thirty core AI and machine-learning terms, taught across one very normal day at a research lab. Type the term before the timer runs out and keep the lab alive.</p>
    <div class="meta">
      <span>30 terms</span>
      <span>15-second rounds</span>
      <span>Keyboard</span>
    </div>
  </a>

  <footer>BEAMWORTHY</footer>
</main>
</body>
</html>
