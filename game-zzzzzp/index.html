<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Chinese Character Study · 1901–2000</title>
<style>
:root{--ink:#1a1c28;--muted:#5c6278;--paper:#eef0f6;--panel:#f4f5f9;--line:#b4b8cc;--deep:#1c2438;--good:#2a5c3c;--bad:#8a2f27;--gold:#c4a86a}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(1200px 700px at 12% -10%,rgba(180,190,230,.35),transparent 52%),linear-gradient(180deg,#6a7290 0%,#c8ccd8 42%,#4e5468 100%);color:var(--ink);font-family:Georgia,"Times New Roman","Noto Serif SC","Songti SC",serif;overflow:hidden}
.app{height:100vh;display:grid;grid-template-rows:auto 1fr;gap:0}
.topbar{min-height:58px;display:flex;align-items:center;gap:14px;padding:8px 18px;background:rgba(22,24,42,.96);color:#e8eaf4;border-bottom:2px solid #c4a86a}
.brand{font-size:18px;font-weight:700;letter-spacing:.05em;white-space:nowrap}.brand small{font-size:12px;font-weight:400;opacity:.7;margin-left:8px}
.progress{flex:1;max-width:460px;height:7px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:#c4a86a;width:1%;transition:width .25s ease}
.stat{font-size:13px;opacity:.88;white-space:nowrap}.topbtn{border:1px solid rgba(255,255,255,.28);background:transparent;color:white;border-radius:8px;padding:7px 10px;cursor:pointer}
.main{min-height:0;display:grid;grid-template-columns:minmax(390px,46%) 1fr;gap:18px;padding:18px}
.quiz{min-height:0;background:rgba(244,248,246,.97);border:2px solid #3d4568;box-shadow:inset 0 0 0 6px #dce0ec,0 16px 48px rgba(22,24,42,.26);border-radius:4px;padding:18px 22px 16px;display:flex;flex-direction:column;overflow:auto}
.rankline{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.09em}
.character{text-align:center;font-family:"Noto Serif SC","Songti SC","STSong",serif;font-size:clamp(92px,11vw,164px);line-height:.95;margin:8px 0 0;color:#1a1c28;text-shadow:0 1px 0 #fff}
.pinyin{text-align:center;font-size:clamp(24px,2.6vw,39px);font-style:italic;color:#3d4568;margin:0 0 8px}
.front-pinyin{display:none}.prompt{text-align:center;font-size:16px;margin:2px 0 8px;color:#5c6278}
button{font:600 13px/1.1 Georgia,serif;letter-spacing:.03em}
.controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:3px 0 7px}.controls .nav{display:flex;gap:6px;margin-right:6px}.ghost,.action{padding:9px 12px;border-radius:8px;cursor:pointer}.ghost{border:1px solid #8aa8ac;background:#e8eaf2;color:#22283a}.action{border:1px solid #3d4568;background:#3d4568;color:#fff}
.reveal{border-top:1px solid #c5d4d2;padding-top:9px;margin-top:2px;animation:fade .18s ease}.reveal-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:5px}.reveal-pinyin{font-size:clamp(27px,2.8vw,42px);font-style:italic;color:#3d4568;font-weight:700}.definition{font-size:20px;margin:0}.definition b{color:#2a4a4c}.wordtitle,.extitle{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:#5c6278;margin:9px 0 4px;font-weight:700}.wordlist{display:flex;gap:6px;flex-wrap:wrap}.wordchip{background:#e4eeec;border:1px solid #c3d4d0;border-radius:7px;padding:5px 8px;line-height:1.18}.wordchip .wzh{font-family:"Noto Serif SC","Songti SC",serif;font-size:19px;font-weight:700}.wordchip .wpy{font-size:13px;font-style:italic;color:#4a5278}.wordchip .wen{font-size:12px;color:#4f5e5c}.examples{display:grid;gap:5px}.example{padding:6px 9px;background:#eef0f6;border-left:3px solid #3d4568;border-radius:5px;line-height:1.22}.example-zh{font-family:"Noto Serif SC","Songti SC",serif;font-size:clamp(19px,1.65vw,25px)}.example-py{font-size:clamp(14px,1.1vw,17px);font-style:italic;color:#4a5278;margin-top:2px}.example-en{font-size:clamp(13px,1vw,16px);color:#4f463f;margin-top:2px}.example em{font-style:normal;font-weight:800;color:#8d2f21;background:#d7e4de;border-radius:3px;padding:0 .05em}
.flipcard{margin-top:3px;border:1px solid #9ab0b0;border-radius:4px;padding:12px 14px;background:#eef0f6}.flipcard h3{margin:0 0 7px;font-size:15px;color:#4a5278;text-transform:uppercase;letter-spacing:.08em}.english-list{font-size:clamp(22px,2vw,32px);line-height:1.2;margin:4px 0 10px}.flipcard .reveal-pinyin{margin:0 0 6px}.further{border:1px solid #3d4568;background:transparent;color:#3d4568;border-radius:8px;padding:8px 11px;cursor:pointer}
.imagepane{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;background:rgba(16,18,32,.94);border:2px solid #1a2038;border-radius:4px;overflow:hidden;box-shadow:inset 0 0 0 7px rgba(196,163,106,.22),0 16px 48px rgba(22,24,42,.3)}
.imagepane:before{content:"";position:absolute;inset:8px;border:1px solid rgba(196,163,106,.5);border-radius:3px;pointer-events:none}.art{display:block;max-width:94%;max-height:90%;width:auto;height:auto;object-fit:contain;filter:saturate(.98) contrast(1.02);box-shadow:0 8px 32px rgba(0,0,0,.28);transition:opacity .35s ease,transform .35s ease}.art.wide{max-width:98%;max-height:84%}

@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@media(max-width:900px){body{overflow:auto}.app{height:auto;min-height:100vh}.main{grid-template-columns:1fr;grid-template-rows:auto minmax(360px,55vh)}.quiz{overflow:visible}.imagepane{min-height:420px}.topbar{flex-wrap:wrap}.progress{order:3;flex-basis:100%;max-width:none}}
@media(max-width:520px){.main{padding:9px;gap:9px}.quiz{padding:14px}.brand small{display:none}.character{font-size:104px}.example{font-size:20px}.topbar{padding:8px 10px}.stat.scoreStat{display:none}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">汉字 1901–2000 <small>recognition + study</small></div>
    <div class="progress"><i id="progressFill"></i></div>
    <div class="stat" id="cardStat"></div>
    <button class="topbtn" id="shuffleBtn">Shuffle</button>
    <button class="topbtn" id="resetBtn">Reset order</button>
  </header>

  <main class="main">
    <section class="quiz">
      <div class="rankline"><span id="rankLabel"></span></div>
      <div class="character" id="char"></div>
      <div class="pinyin front-pinyin" id="pinyin" aria-hidden="true"></div>
      <div class="prompt">Recognize the character first. Reveal for pinyin, meanings, common words, and fully translated examples.</div>
      <div class="controls">
        <div class="nav"><button class="ghost" id="prevBtn">← Previous</button><button class="ghost" id="nextBtn">Next →</button></div>
        <button class="action" id="revealBtn">Reveal</button>
        <button class="ghost" id="flipBtn">Flip</button>
      </div>
      <div id="detailArea"></div>
    </section>

    <section class="imagepane" id="imagePane">
      <img class="art" id="art" alt="Chinese art and material culture study image">
    </section>
  </main>
</div>
<script>
const BANK = [{"rank":1901,"char":"丑","pinyin":"chǒu","meanings":["ugly","shameful","clown","second Earthly Branch"],"words":[{"zh":"丑陋","pinyin":"chǒu lòu","en":"ugly"},{"zh":"出丑","pinyin":"chū chǒu","en":"make a fool of oneself"},{"zh":"小丑","pinyin":"xiǎo chǒu","en":"clown"},{"zh":"丑恶","pinyin":"chǒu è","en":"ugly and evil"}],"examples":[{"zh":"这幅画像把人画得很丑陋。","pinyin":"zhè fú huà xiàng bǎ rén huà de hěn chǒu lòu.","en":"This portrait makes the person look very ugly."},{"zh":"他在台上忘词，当众出丑。","pinyin":"tā zài tái shàng wàng cí, dāng zhòng chū chǒu.","en":"He forgot his lines on stage and made a fool of himself in public."},{"zh":"马戏团的小丑把孩子们逗笑了。","pinyin":"mǎ xì tuán de xiǎo chǒu bǎ hái zi men dòu xiào le.","en":"The circus clown made the children laugh."}]},{"rank":1902,"char":"劣","pinyin":"liè","meanings":["inferior","bad"],"words":[{"zh":"恶劣","pinyin":"è liè","en":"vile; nasty"},{"zh":"劣势","pinyin":"liè shì","en":"disadvantage"},{"zh":"劣质","pinyin":"liè zhì","en":"inferior quality"},{"zh":"低劣","pinyin":"dī liè","en":"poor; low-grade"}],"examples":[{"zh":"今天天气十分恶劣。","pinyin":"jīn tiān tiān qì shí fēn è liè.","en":"The weather today is extremely nasty."},{"zh":"客队在人数上处于劣势。","pinyin":"kè duì zài rén shù shàng chǔ yú liè shì.","en":"The visiting team is at a numerical disadvantage."},{"zh":"商店不得销售劣质商品。","pinyin":"shāng diàn bù dé xiāo shòu liè zhì shāng pǐn.","en":"Shops must not sell inferior-quality goods."}]},{"rank":1903,"char":"柯","pinyin":"kē","meanings":["axe handle","stem","Ke, a surname"],"words":[{"zh":"姓柯","pinyin":"xìng Kē","en":"surnamed Ke"},{"zh":"柯枝","pinyin":"kē zhī","en":"branch and stem"},{"zh":"南柯","pinyin":"Nán kē","en":"Nanke, as in the dream of Nanke"},{"zh":"柯尔克孜","pinyin":"Kē ěr kè zī","en":"Kyrgyz"}],"examples":[{"zh":"班里有一位同学姓柯。","pinyin":"bān lǐ yǒu yí wèi tóng xué xìng Kē.","en":"There is a classmate in the class surnamed Ke."},{"zh":"南柯一梦的故事流传很广。","pinyin":"Nán kē yí mèng de gù shi liú chuán hěn guǎng.","en":"The story of the Nanke dream is widely told."},{"zh":"柯尔克孜族主要生活在西北。","pinyin":"Kē ěr kè zī zú zhǔ yào shēng huó zài xī běi.","en":"The Kyrgyz people mainly live in the northwest."}]},{"rank":1904,"char":"寸","pinyin":"cùn","meanings":["cun, a traditional inch","very small"],"words":[{"zh":"一寸","pinyin":"yí cùn","en":"one cun"},{"zh":"尺寸","pinyin":"chǐ cùn","en":"size; measurements"},{"zh":"寸步","pinyin":"cùn bù","en":"a tiny step"},{"zh":"寸金难买寸光阴","pinyin":"cùn jīn nán mǎi cùn guāng yīn","en":"an inch of gold cannot buy an inch of time"}],"examples":[{"zh":"这根绳子大约三寸长。","pinyin":"zhè gēn shéng zi dà yuē sān cùn cháng.","en":"This rope is about three cun long."},{"zh":"做衣服前要量好尺寸。","pinyin":"zuò yī fu qián yào liáng hǎo chǐ cùn.","en":"Measure the size carefully before making clothes."},{"zh":"时间宝贵，真是寸金难买寸光阴。","pinyin":"shí jiān bǎo guì, zhēn shì cùn jīn nán mǎi cùn guāng yīn.","en":"Time is precious; an inch of gold cannot buy an inch of time."}]},{"rank":1905,"char":"扔","pinyin":"rēng","meanings":["throw","throw away"],"words":[{"zh":"扔掉","pinyin":"rēng diào","en":"throw away"},{"zh":"扔球","pinyin":"rēng qiú","en":"throw a ball"},{"zh":"乱扔","pinyin":"luàn rēng","en":"litter; throw about"},{"zh":"扔进","pinyin":"rēng jìn","en":"throw into"}],"examples":[{"zh":"过期的食品请扔掉。","pinyin":"guò qī de shí pǐn qǐng rēng diào.","en":"Please throw away expired food."},{"zh":"孩子们在院子里扔球。","pinyin":"hái zi men zài yuàn zi lǐ rēng qiú.","en":"The children are throwing a ball in the courtyard."},{"zh":"请不要在街上乱扔垃圾。","pinyin":"qǐng bú yào zài jiē shàng luàn rēng lā jī.","en":"Please do not litter in the street."}]},{"rank":1906,"char":"盯","pinyin":"dīng","meanings":["stare","watch closely"],"words":[{"zh":"盯着","pinyin":"dīng zhe","en":"stare at"},{"zh":"盯梢","pinyin":"dīng shāo","en":"shadow; tail someone"},{"zh":"盯紧","pinyin":"dīng jǐn","en":"keep a close watch"},{"zh":"盯防","pinyin":"dīng fáng","en":"mark closely, in sport"}],"examples":[{"zh":"猫盯着鱼缸里的金鱼。","pinyin":"māo dīng zhe yú gāng lǐ de jīn yú.","en":"The cat is staring at the goldfish in the tank."},{"zh":"后卫死死盯防对方前锋。","pinyin":"hòu wèi sǐ sǐ dīng fáng duì fāng qián fēng.","en":"The defender marked the other side's striker tightly."},{"zh":"老师盯紧了考试纪律。","pinyin":"lǎo shī dīng jǐn le kǎo shì jì lǜ.","en":"The teacher kept a close watch on exam discipline."}]},{"rank":1907,"char":"辱","pinyin":"rǔ","meanings":["insult","disgrace"],"words":[{"zh":"侮辱","pinyin":"wǔ rǔ","en":"insult; humiliate"},{"zh":"耻辱","pinyin":"chǐ rǔ","en":"shame; disgrace"},{"zh":"辱骂","pinyin":"rǔ mà","en":"abuse; hurl insults"},{"zh":"荣辱","pinyin":"róng rǔ","en":"honor and disgrace"}],"examples":[{"zh":"当众侮辱别人是不对的。","pinyin":"dāng zhòng wǔ rǔ bié rén shì bú duì de.","en":"It is wrong to insult others in public."},{"zh":"失败对他来说是一种耻辱。","pinyin":"shī bài duì tā lái shuō shì yì zhǒng chǐ rǔ.","en":"Defeat was a disgrace to him."},{"zh":"不要用脏话辱骂他人。","pinyin":"bú yào yòng zāng huà rǔ mà tā rén.","en":"Do not hurl dirty words at others."}]},{"rank":1908,"char":"匹","pinyin":"pǐ","meanings":["measure word for horses and cloth","match"],"words":[{"zh":"一匹","pinyin":"yì pǐ","en":"one, for horses or bolts"},{"zh":"匹配","pinyin":"pǐ pèi","en":"match; pair"},{"zh":"布匹","pinyin":"bù pǐ","en":"cloth; piece goods"},{"zh":"匹敌","pinyin":"pǐ dí","en":"be a match for"}],"examples":[{"zh":"草原上跑着一匹白马。","pinyin":"cǎo yuán shàng pǎo zhe yì pǐ bái mǎ.","en":"A white horse is running on the grassland."},{"zh":"这两种颜色很匹配。","pinyin":"zhè liǎng zhǒng yán sè hěn pǐ pèi.","en":"These two colors match well."},{"zh":"在棋艺上几乎无人能与他匹敌。","pinyin":"zài qí yì shàng jī hū wú rén néng yǔ tā pǐ dí.","en":"In chess skill almost no one can match him."}]},{"rank":1909,"char":"俱","pinyin":"jù","meanings":["all","together"],"words":[{"zh":"俱乐部","pinyin":"jù lè bù","en":"club"},{"zh":"面面俱到","pinyin":"miàn miàn jù dào","en":"cover every aspect"},{"zh":"与日俱增","pinyin":"yǔ rì jù zēng","en":"grow with each passing day"},{"zh":"百废俱兴","pinyin":"bǎi fèi jù xīng","en":"all neglected tasks are taken up"}],"examples":[{"z  d.innerHTML=`<div class="reveal"><div class="reveal-head"><div class="reveal-pinyin">${safe(c.pinyin)}</div><p class="definition"><b>${safe(c.char)}</b> — ${c.meanings.map(safe).join('; ')}</p></div><div class="wordtitle">Common words &amp; phrases</div><div class="wordlist">${words}</div><div class="extitle">Example sentences</div><div class="examples">${ex}</div></div>`}
function render(changeImage=true){const c=current();$('char').textContent=c.char;$('pinyin').textContent='';$('rankLabel').textContent=`Frequency rank #${c.rank}`;$('cardStat').textContent=`${pos+1} / ${BANK.length}`;$('progressFill').style.width=((pos+1)/BANK.length*100)+'%';state='front';renderDetail('front');if(changeImage)setImage()}
function move(delta){const oldImg=imageForPosition();pos=Math.max(0,Math.min(BANK.length-1,pos+delta));render(imageForPosition()!==oldImg)}
$('prevBtn').onclick=()=>move(-1);$('nextBtn').onclick=()=>move(1);
$('revealBtn').onclick=()=>{state='revealed';renderDetail('revealed')};$('flipBtn').onclick=()=>{state='flip';renderDetail('flip')};
$('shuffleBtn').onclick=()=>{for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}pos=0;render(true)};
$('resetBtn').onclick=()=>{order=BANK.map((_,i)=>i);pos=0;render(true)};
render(true);
</script>
</body>
</html>
