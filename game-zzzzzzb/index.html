<style>
:root{--ink:#161820;--muted:#6a7480;--paper:#eef1f5;--panel:#f3f5f8;--line:#c4ccd4;--deep:#1c242c;--good:#3a5060;--bad:#8a2f27;--gold:#8aa0b4}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(1200px 700px at 12% -10%,rgba(100,140,180,.32),transparent 52%),linear-gradient(180deg,#283038 0%,#d0d8e0 42%,#1a2028 100%);color:var(--ink);font-family:Georgia,"Times New Roman","Noto Serif SC","Songti SC",serif;overflow:hidden}

</style>
