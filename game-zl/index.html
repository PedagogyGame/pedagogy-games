<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The County Line — pre-algebra at speed</title>
<style>
  :root{
    --ink:#0c0a10;
    --dust:#c8a97c;
    --amber:#f2cd8a;
    --amber-dim:#a98a5c;
    --panel:#191316;
    --panel-lip:#2c2226;
    --rule:#3b2e2f;
    --hot:#d9503c;
    --hot-dim:#7a2b22;
    --cool:#7fb27a;
    --glass:rgba(20,15,18,.86);
    --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
    --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
    --sans:ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:#0b0910;overflow:hidden;
    -webkit-text-size-adjust:100%;}
  body{font-family:var(--sans);color:var(--amber);
    user-select:none;-webkit-user-select:none;}
  canvas#scene{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}

  /* ---------- centre console ---------- */
  #console{
    position:fixed;left:50%;transform:translateX(-50%);
    bottom:1.8vh;width:min(600px,92vw);z-index:3;
    background:linear-gradient(#221a1d,var(--panel));
    border:1px solid var(--panel-lip);
    border-top-color:#4a3a3d;
    border-radius:12px;
    box-shadow:0 -2px 0 rgba(255,210,150,.06) inset, 0 24px 60px rgba(0,0,0,.72);
    padding:11px 15px 9px;
  }
  .lbl{font:600 10px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--amber-dim)}

  .threatrow{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
  #threatnum{font:700 15px/1 var(--mono);color:var(--amber);font-variant-numeric:tabular-nums}
  .bar{position:relative;height:9px;border-radius:5px;background:#120d10;
       border:1px solid #33262a;overflow:hidden}
  #threatfill{position:absolute;inset:0;width:0%;border-radius:4px;
    background:linear-gradient(90deg,#8a6a3a,#c9803a 55%,var(--hot));
    transition:width .38s cubic-bezier(.2,.7,.3,1)}
  #threatfill.jump{transition:width .18s ease-out}

  .tierrow{display:flex;justify-content:space-between;align-items:baseline;
    margin:10px 0 4px;gap:10px}
  #tier{font:700 11px/1 var(--mono);letter-spacing:.16em;color:var(--amber)}
  #cost{font:400 11px/1 var(--mono);color:var(--amber-dim)}
  #clock{font:700 13px/1 var(--mono);color:var(--amber);font-variant-numeric:tabular-nums}
  .timerwrap{position:relative}
  #timefill{position:absolute;inset:0;width:100%;border-radius:4px;
    background:linear-gradient(90deg,#4d7a49,var(--cool));transform-origin:left}
  #timefill.low{background:linear-gradient(90deg,#8a3a2c,var(--hot))}
  #bonusmark{position:absolute;top:-3px;left:50%;width:1px;height:15px;
    background:var(--amber);opacity:.55}

  #qbox{min-height:3.7em;display:flex;flex-direction:column;justify-content:center;
    margin:11px 0 3px;text-align:center}
  #q{font-family:var(--serif);font-size:clamp(19px,4.4vw,27px);line-height:1.34;
     color:#fbeacd;letter-spacing:.005em}
  #note{font:400 12px/1.4 var(--sans);color:var(--amber-dim);margin-top:6px;min-height:1.2em}

  #inrow{display:flex;gap:8px;margin-top:6px}
  #ans{flex:1;min-width:0;background:#0e0a0d;border:1px solid #43333a;border-radius:8px;
    color:#fbeacd;font:600 18px/1 var(--mono);padding:11px 12px;outline:none;
    text-align:center;letter-spacing:.04em}
  #ans:focus{border-color:var(--amber-dim);box-shadow:0 0 0 3px rgba(242,205,138,.1)}
  #ans::placeholder{color:#5c4750;font-weight:400;letter-spacing:.02em}
  #go{background:linear-gradient(#3a2b2f,#241a1d);border:1px solid #554046;
    border-radius:8px;color:var(--amber);font:700 12px/1 var(--mono);letter-spacing:.16em;
    padding:0 18px;cursor:pointer}
  #go:hover{border-color:var(--amber-dim);color:#fbeacd}
  #go:active{transform:translateY(1px)}

  #verdict{text-align:center;font:700 13px/1.35 var(--mono);letter-spacing:.08em;
    min-height:1.4em;margin-top:7px}
  #verdict.ok{color:var(--cool)} #verdict.no{color:var(--hot)}

  .footrow{display:flex;justify-content:space-between;align-items:center;
    margin-top:8px;padding-top:8px;border-top:1px solid var(--rule)}
  #gauge{display:block}
  #progress{font:600 11px/1 var(--mono);letter-spacing:.14em;color:var(--amber-dim);
    font-variant-numeric:tabular-nums}
  #progress b{color:var(--amber);font-weight:700}

  /* ---------- overlays ---------- */
  #veil{position:fixed;inset:0;z-index:5;display:flex;align-items:center;
    justify-content:center;padding:24px;background:rgba(8,6,10,.9);
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
  #veil.hide{display:none}
  .card{width:min(560px,94vw);text-align:center}
  h1{font-family:var(--serif);font-weight:400;font-size:clamp(34px,8.5vw,60px);
     letter-spacing:.02em;margin:0;color:#fbeacd;line-height:1}
  .kicker{font:600 10px/1 var(--mono);letter-spacing:.34em;text-transform:uppercase;
    color:var(--amber-dim);margin-bottom:14px}
  .sub{font-family:var(--serif);font-style:italic;font-size:clamp(14px,3.4vw,17px);
    color:var(--dust);margin:12px 0 22px;line-height:1.5}
  .rules{display:grid;gap:7px;text-align:left;max-width:400px;margin:0 auto 24px;
    font:400 13px/1.45 var(--sans);color:var(--dust)}
  .rules div{display:flex;gap:11px}
  .rules span{font:700 11px/1.5 var(--mono);color:var(--amber);flex:0 0 74px;
    letter-spacing:.06em}
  .costs{display:flex;gap:6px;justify-content:center;margin:0 auto 24px;
    max-width:420px;flex-wrap:wrap}
  .costs i{font:600 10px/1 var(--mono);font-style:normal;letter-spacing:.06em;
    padding:7px 9px;border:1px solid var(--rule);border-radius:6px;color:var(--dust)}
  .costs i b{color:var(--hot);font-weight:700}
  button.big{background:linear-gradient(#3d2d31,#241a1d);border:1px solid #5d454b;
    border-radius:9px;color:var(--amber);font:700 13px/1 var(--mono);letter-spacing:.2em;
    padding:15px 34px;cursor:pointer}
  button.big:hover{border-color:var(--amber);color:#fbeacd}
  .stats{display:flex;justify-content:center;gap:26px;margin:20px 0 26px;flex-wrap:wrap}
  .stat{text-align:center}
  .stat u{display:block;text-decoration:none;font:700 26px/1 var(--mono);color:#fbeacd;
    font-variant-numeric:tabular-nums}
  .stat s{display:block;text-decoration:none;font:600 9px/1 var(--mono);letter-spacing:.16em;
    text-transform:uppercase;color:var(--amber-dim);margin-top:6px}
  .hint{font:400 11px/1.5 var(--sans);color:#6b5a52;margin-top:18px}

  /* ---------- overture: the sheet ---------- */
  #sheet{position:fixed;inset:0;z-index:7;display:flex;align-items:center;
    justify-content:center;
    background:radial-gradient(ellipse at 50% 40%,#241b18 0%,#0d0a0b 74%);
    transition:opacity .45s ease}
  #sheet.gone{opacity:0;pointer-events:none}
  #sheetwrap{position:relative;
    animation:settle 1.1s cubic-bezier(.16,.8,.3,1) both}
  @keyframes settle{from{opacity:0;transform:translateY(16px) rotate(-.9deg)}
                    to{opacity:1;transform:translateY(0) rotate(-.4deg)}}
  #sheetimg{display:block;max-height:91vh;max-width:93vw;height:auto;width:auto;
    box-shadow:0 34px 90px rgba(0,0,0,.82),0 1px 0 rgba(255,240,210,.10);
    transition:transform .34s cubic-bezier(.4,0,.85,.4),filter .34s ease-in}
  #sheet.blow #sheetwrap{animation:none;transform:rotate(-.4deg)}
  #sheet.blow #sheetimg{transform:scale(1.13);filter:brightness(3.4) contrast(.35)}

  #mathbtn{position:fixed;left:50%;bottom:5.5vh;transform:translateX(-50%);
    background:#0e0b0d;border:1px solid #55424a;border-radius:7px;color:var(--amber);
    font:400 16px/1 var(--mono);letter-spacing:.44em;text-indent:.44em;
    padding:17px 42px;cursor:pointer;
    box-shadow:0 12px 40px rgba(0,0,0,.78);transition:border-color .2s,color .2s}
  #mathbtn:hover{border-color:var(--amber);color:#fbeacd}
  #mathbtn:active{transform:translateX(-50%) translateY(1px)}
  #ruleslink{position:fixed;right:18px;bottom:18px;background:none;border:none;
    color:var(--amber);opacity:.36;font:400 11px/1 var(--mono);letter-spacing:.24em;
    cursor:pointer;padding:8px}
  #ruleslink:hover{opacity:.85}
  #flash{position:fixed;inset:0;z-index:9;background:#fff;opacity:0;
    pointer-events:none;transition:opacity .17s linear}
  #flash.on{opacity:1}
  #flash.off{opacity:0;transition:opacity .6s ease-out}

  @media (max-height:620px){
    #console{bottom:1vh;padding:10px 13px 9px}
    #qbox{min-height:3.4em;margin:10px 0 2px}
    .tierrow{margin:9px 0 4px}
  }
  @media (prefers-reduced-motion:reduce){
    #threatfill{transition:none}
    #sheetwrap{animation:none}
    #sheetimg,#flash{transition:none}
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div id="console" aria-live="polite">
  <div class="threatrow">
    <span class="lbl">Police threat</span>
    <span id="threatnum">100%</span>
  </div>
  <div class="bar"><div id="threatfill"></div></div>

  <div class="tierrow">
    <span id="tier">TIER I</span>
    <span id="cost">miss: +25%</span>
    <span id="clock">20s</span>
  </div>
  <div class="bar timerwrap"><div id="timefill"></div><div id="bonusmark"></div></div>

  <div id="qbox"><div id="q">&nbsp;</div><div id="note"></div></div>

  <div id="inrow">
    <input id="ans" autocomplete="off" autocorrect="off" autocapitalize="off"
           spellcheck="false" inputmode="text" placeholder="12   -4   3.5   3/4   1 1/2">
    <button id="go">GO</button>
  </div>
  <div id="verdict"></div>

  <div class="footrow">
    <svg id="gauge" width="106" height="40" viewBox="0 0 106 40" aria-label="fuel gauge">
      <path d="M14 33 A 39 39 0 0 1 92 33" fill="none" stroke="#3b2e2f" stroke-width="2.5"/>
      <path d="M14 33 A 39 39 0 0 1 27 11" fill="none" stroke="#7a2b22" stroke-width="2.5"/>
      <text x="10" y="39" font-family="ui-monospace,monospace" font-size="8" fill="#a98a5c">E</text>
      <text x="90" y="39" font-family="ui-monospace,monospace" font-size="8" fill="#a98a5c">F</text>
      <text x="50" y="10" font-family="ui-monospace,monospace" font-size="7" fill="#6b5a52"
            text-anchor="middle" letter-spacing="1.4">FUEL</text>
      <g id="needle" transform="rotate(0 53 33)">
        <line x1="53" y1="33" x2="53" y2="6" stroke="#f2cd8a" stroke-width="1.7"
              stroke-linecap="round"/>
      </g>
      <circle cx="53" cy="33" r="3" fill="#2c2226" stroke="#5d454b" stroke-width="1"/>
    </svg>
    <span id="progress">MILE <b>0</b> / 100</span>
  </div>
</div>

<div id="veil" class="hide">
  <div class="card" id="card"></div>
</div>

<script>
/* =========================================================
   THE COUNTY LINE
   Pre-algebra at speed. Single file, no dependencies.
   ========================================================= */

// ---- helpers ----
const R = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = a => a[Math.floor(Math.random() * a.length)];
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) { const t = b; b = a % b; a = t; } return a; };
const frac = (n, d) => { if (d < 0) { n = -n; d = -d; } const g = gcd(n, d) || 1; const N = n / g, D = d / g; return D === 1 ? String(N) : N + '/' + D; };
const r2 = x => Math.round(x * 100) / 100;
// a proper fraction n/d already in lowest terms
const pf = (dmin, dmax) => { let n, d; do { d = R(dmin, dmax); n = R(1, d - 1); } while (gcd(n, d) !== 1); return [n, d]; };
const sup = { 2: '\u00b2', 3: '\u00b3', 4: '\u2074', 5: '\u2075' };
const money = v => (Math.round(v * 100) / 100).toFixed(2).replace(/\.00$/, '');

// Each generator returns { q, a, disp?, tol? }
const BANK = [

  // ============ TIER 1 — arithmetic you should already own ============
  { t: 1, k: 'add', f: () => { const a = R(12, 89), b = R(11, 60); return { q: `${a} + ${b} = ?`, a: a + b }; } },

// ---- answer parsing ----
function parseAns(s) {
  s = String(s).trim().toLowerCase();
  s = s.replace(/[\u2212\u2013\u2014]/g, '-').replace(/[$%,]/g, '').replace(/\s+/g, ' ').trim();
  if (!s) return null;
  let m = s.match(/^(-?\d+)\s+(\d+)\/(\d+)$/);
  if (m) { const w = +m[1], n = +m[2], d = +m[3]; if (!d) return null; return w + (w < 0 ? -1 : 1) * n / d; }
  m = s.match(/^(-?\d*\.?\d+)\/(-?\d*\.?\d+)$/);
  if (m) { const d = +m[2]; if (!d) return null; return +m[1] / d; }
  if (/^-?\d*\.?\d+$/.test(s) && s !== '-' && s !== '.') return +s;
  return null;
}

/* ---------------- tier configuration ---------------- */
const TIERS = {
  1:{name:'TIER I',   secs:20, miss:25},
  2:{name:'TIER II',  secs:30, miss:18},
  3:{name:'TIER III', secs:45, miss:12},
  4:{name:'TIER IV',  secs:60, miss:7}
};
const CORRECT_DROP = 2;    // threat reduction for a normal correct answer
const BONUS_DROP   = 10;   // reduction when answered in half the allotted time or less
const START_THREAT = 100;
const CAUGHT_AT    = 200;
const RUN_LENGTH   = 100;
const GAS_LEVEL    = 0.375; // three eighths, pinned there all game

// how the four tiers are mixed as the run goes on
const CURVE = [
  {upTo:20,  w:[55,35,10, 0]},
  {upTo:45,  w:[30,40,25, 5]},
  {upTo:70,  w:[12,33,40,15]},
  {upTo:90,  w:[ 5,22,45,28]},
  {upTo:100, w:[ 0,12,48,40]}
];
function tierFor(i){
  const row = CURVE.find(r => i <= r.upTo) || CURVE[CURVE.length-1];
  const tot = row.w.reduce((a,b)=>a+b,0);
  let r = Math.random()*tot;
  for(let t=0;t<4;t++){ r -= row.w[t]; if(r<=0) return t+1; }
  return 3;
}

/* ---------------- game state ---------------- */
const S = {
  running:false, threat:START_THREAT, idx:0, right:0, wrong:0, bonuses:0,
  cur:null, tier:1, allotted:20, left:20, waiting:false, lastKey:'',
  gas:GAS_LEVEL, over:false
};

const $ = id => document.getElementById(id);
const elQ=$('q'), elNote=$('note'), elAns=$('ans'), elVerdict=$('verdict'),
      elTier=$('tier'), elCost=$('cost'), elClock=$('clock'),
      elTime=$('timefill'), elThreat=$('threatfill'), elThreatNum=$('threatnum'),
      elProg=$('progress'), elNeedle=$('needle'), elVeil=$('veil'), elCard=$('card');

const reduced = matchMedia('(prefers-reduced-motion:reduce)').matches;

/* needle sweeps from -63deg (empty) to +63deg (full) */
function setNeedle(frac){
  elNeedle.setAttribute('transform','rotate('+(-63 + frac*126).toFixed(2)+' 53 33)');
}
setNeedle(GAS_LEVEL);

function paintThreat(jump){
  const pct = (S.threat - START_THREAT) / (CAUGHT_AT - START_THREAT) * 100;
  elThreat.classList.toggle('jump', !!jump);
  elThreat.style.width = Math.max(0,Math.min(100,pct)) + '%';
  elThreatNum.textContent = Math.round(S.threat) + '%';
}

/* ---------------- question flow ---------------- */
function nextQuestion(){
  if(S.idx >= RUN_LENGTH){ finish(true); return; }
  S.idx++;
  S.tier = tierFor(S.idx);
  const pool = BANK.filter(g => g.t === S.tier && g.k !== S.lastKey);
  const g = pick(pool.length ? pool : BANK.filter(x => x.t === S.tier));
  S.lastKey = g.k;
  S.cur = g.f();

  const cfg = TIERS[S.tier];
  S.allotted = cfg.secs; S.left = cfg.secs; S.waiting = false;

  elTier.textContent = cfg.name;
  elCost.textContent = 'miss: +' + cfg.miss + '%';
  elQ.innerHTML = S.cur.q;
  elNote.textContent = '';
  elVerdict.textContent = ''; elVerdict.className = '';
  elAns.value = ''; elAns.disabled = false;
  elProg.innerHTML = 'MILE <b>' + (S.idx-1) + '</b> / ' + RUN_LENGTH;
  elTime.classList.remove('low');
  elTime.style.width = '100%';
  elClock.textContent = cfg.secs + 's';
  if(!isTouch()) elAns.focus();
}

function submit(){
  if(!S.running || S.waiting || !S.cur) return;
  const v = parseAns(elAns.value);
  if(v === null){
    elNote.textContent = 'Enter a number — 12, -4, 3.5, 3/4 or 1 1/2 all work.';
    return;
  }
  const tol = S.cur.tol || 1e-6;
  judge(Math.abs(v - S.cur.a) <= tol, false);
}

function judge(correct, timedOut){
  S.waiting = true;
  elAns.disabled = true;
  const used = S.allotted - S.left;

  if(correct){
    S.right++;
    const fast = used <= S.allotted/2;
    if(fast) S.bonuses++;
    S.threat = Math.max(START_THREAT, S.threat - (fast ? BONUS_DROP : CORRECT_DROP));
    elVerdict.className = 'ok';
    elVerdict.textContent = fast
      ? 'CLEAN \u2014 GAINED GROUND  \u2212' + BONUS_DROP + '%'
      : 'CORRECT  \u2212' + CORRECT_DROP + '%';
    paintThreat(fast);
  } else {
    S.wrong++;
    S.threat = Math.min(CAUGHT_AT, S.threat + TIERS[S.tier].miss);
    elVerdict.className = 'no';
    elVerdict.textContent = (timedOut ? 'TOO SLOW' : 'POTHOLE') +
      '  +' + TIERS[S.tier].miss + '%';
    elNote.textContent = 'Answer: ' + (S.cur.disp !== undefined ? S.cur.disp : S.cur.a);
    paintThreat(true);
    hitPothole();
  }
  elProg.innerHTML = 'MILE <b>' + S.idx + '</b> / ' + RUN_LENGTH;

  if(S.threat >= CAUGHT_AT){ finish(false); return; }
  setTimeout(nextQuestion, correct ? 850 : 1750);
}

/* ---------------- start / finish ---------------- */
function startRun(){
  Object.assign(S,{running:true, threat:START_THREAT, idx:0, right:0, wrong:0,
                   bonuses:0, waiting:false, lastKey:'', gas:GAS_LEVEL, over:false});
  setNeedle(GAS_LEVEL);
  paintThreat(false);
  elVeil.classList.add('hide');
  nextQuestion();
}

function finish(escaped){
  S.running = false; S.over = true; S.waiting = true;
  elAns.disabled = true;
  if(escaped){
    showCard(true);
  } else {
    /* the needle has read three eighths all game. now it doesn't. */
    const t0 = performance.now();
    const from = S.gas;
    (function drop(now){
      const k = Math.min(1,(now - t0)/700);
      S.gas = from * (1 - k*k);
      setNeedle(S.gas);
      if(k < 1) requestAnimationFrame(drop); else setTimeout(()=>showCard(false), 620);
    })(t0);
    elVerdict.className = 'no';
    elVerdict.textContent = 'OUT OF ROAD';
  }
}

function statBlock(){
  const acc = S.right + S.wrong ? Math.round(S.right/(S.right+S.wrong)*100) : 0;
  return '<div class="stats">' +
    '<div class="stat"><u>'+S.idx+'</u><s>miles</s></div>' +
    '<div class="stat"><u>'+acc+'%</u><s>accuracy</s></div>' +
    '<div class="stat"><u>'+S.bonuses+'</u><s>clean runs</s></div>' +
    '<div class="stat"><u>'+Math.round(S.threat)+'%</u><s>final threat</s></div></div>';
}

function showCard(escaped){
  if(escaped){
    elCard.innerHTML =
      '<div class="kicker">County line</div>' +
      '<h1>You made it</h1>' +
      '<p class="sub">A hundred miles of bad road and not one of them caught you. ' +
      'The lights fall away behind the ridge.</p>' +
      statBlock() +
      '<button class="big" id="again">RUN IT AGAIN</button>';
  } else {
    elCard.innerHTML =
      '<div class="kicker">Mile ' + S.idx + '</div>' +
      '<h1>They had you</h1>' +

}

/* the sheet blows out and you are already moving */
function intoTheRun(){
  const sheet = $('sheet'), fl = $('flash');
  if(sheet.classList.contains('gone')) return;
  if(reduced){ sheet.classList.add('gone'); startRun(); return; }
  sheet.classList.add('blow');

    sheet.classList.add('gone');
    startRun();
    fl.classList.remove('on'); fl.classList.add('off');
    setTimeout(() => { fl.className = ''; }, 700);
  }, 200);
}

const SANS = '"Helvetica Neue",Helvetica,Arial,sans-serif';
const LANE = 0.40;   // how far right of the road centre we ride, in road half-widths

/* ---- roadside furniture, streamed past the camera ---- */
const MAXZ = 64;
let props = [], traffic = [], nextCar = 1.6;
let adDeck = [], adIdx = 0;
function dealAd(){
  if(adIdx >= adDeck.length){
    adDeck = ADS.slice();
    for(let i=adDeck.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      const t = adDeck[i]; adDeck[i] = adDeck[j]; adDeck[j] = t;
    }
    adIdx = 0;
  }
  return adDeck[adIdx++];
}
const STREAMS = [
  {t:'cactus',    c: 7, gap:()=>1.4 + Math.random()*4.4},
  {t:'sign',      c:15, gap:()=>12  + Math.random()*15 },
  {t:'building',  c:24, gap:()=>18  + Math.random()*26 },
  {t:'billboard', c:19, gap:()=>27  + Math.random()*21 }
];

function makeProp(t, z0){
  const p = {t, z0, side: Math.random()<0.5 ? -1 : 1};
  if(t === 'sign')      p.side =  1;                        // signs face our lane
  if(t === 'billboard') p.side = Math.random()<0.80 ? 1 : -1;
  if(t === 'cactus'){
    p.off = 1.05 + Math.random()*1.55;
    p.h   = 0.18 + Math.random()*0.24;
    p.arms= Math.random()<0.72 ? (Math.random()<0.45 ? 2 : 1) : 0;
    p.aSide = Math.random()<0.5 ? -1 : 1;
  } else if(t === 'sign'){
    p.off  = 0.99 + Math.random()*0.10;
    p.kind = pick(['mile','warn','warn','speed']);
    p.num  = pick([35,45,55,55,65]);
  } else if(t === 'building'){
    p.off  = 1.75 + Math.random()*2.9;
    p.kind = pick(['shed','shed','silo','tower']);
    p.w    = 0.10 + Math.random()*0.10;
    p.lit  = Math.random() < 0.6;
  } else {
    p.off = 1.52 + Math.random()*0.30;
    p.ad  = dealAd();                       // every game gets its turn
    p.pitch = (p.ad.alt && Math.random() < 0.5) ? p.ad.alt : p.ad.pitch;
  }
  return p;
}

function feedWorld(dt){
  for(const s of STREAMS){
    while(s.c < scroll + MAXZ){ props.push(makeProp(s.t, s.c)); s.c += s.gap(); }
  }
  for(let i=props.length-1;i>=0;i--) if(props[i].z0 - scroll < 0.55) props.splice(i,1);

  nextCar -= dt * speed;
  if(nextCar <= 0){
    traffic.push({z: MAXZ + 5, big: Math.random() < 0.24, drift: Math.random()*6.28});
    nextCar = 1.4 + Math.random()*4.0;
  }
  for(let i=traffic.length-1;i>=0;i--){
    traffic[i].z -= dt * speed * 3.4 * 2.15;   // closing speed: ours plus theirs
    if(traffic[i].z < 0.5) traffic.splice(i,1);
  }
}

function hitPothole(){
  if(reduced){ speed = 0.55; return; }
  jolt = 1; joltT = 0; speed = 0.4; flash = 1;
  for(let i=0;i<22;i++){
    dust.push({
      x: W*0.5 + (Math.random()-0.5)*W*0.8,
      y: H*0.92 + Math.random()*H*0.08,
      vx: (Math.random()-0.5)*3.2, vy: -0.7 - Math.random()*2.2,
      r: 6 + Math.random()*22, a: 0.5 + Math.random()*0.4
    });
  }
}

const rr = (x,y,w,h,r) => { ctx.beginPath(); ctx.roundRect(x,y,w,h,r); };
const shade = (r,g,b,k) => 'rgb('+(r*k|0)+','+(g*k|0)+','+(b*k|0)+')';

/* =============== the frame =============== */
function drawScene(dt, now){
  const horizon = H*0.40, depth = H - horizon, cx = W*0.5;
  const roadK = (W*0.86)/depth, C = depth;
  const lane = LANE*roadK;                 // lateral drift per pixel of depth
  const rcx = d => cx - lane*d;            // where the road's centre line sits

  speed += (1 - speed) * Math.min(1, dt*1.6);
  scroll += dt * speed * 3.4;
  feedWorld(dt);

  if(!panelBox || (++panelTick % 14 === 0 && jolt < 0.002)) measurePanel();

  ctx.clearRect(0,0,W,H);
  ctx.save();

  /* camera jolt — a low car finding a hole in the road */
  jx = 0; jy = 0;
  if(jolt > 0.002){
    joltT += dt;
    const k = jolt * Math.exp(-joltT*7);
    jx = Math.sin(joltT*47)*k*7; jy = Math.sin(joltT*33)*k*20;
    if(joltT > 1.1) jolt = 0;
  }
  ctx.translate(jx, jy);
  /* the cabin and the console shake together */
  elConsole.style.transform = 'translateX(-50%) translate('+jx.toFixed(2)+'px,'+jy.toFixed(2)+'px)';

  /* ---- sky ---- */
  let g = ctx.createLinearGradient(0,0,0,horizon);
  g.addColorStop(0,'#141126'); g.addColorStop(0.45,'#332742');
  g.addColorStop(0.78,'#7a4a44'); g.addColorStop(1,'#c8763a');
  ctx.fillStyle = g; ctx.fillRect(-40,-40,W+80,horizon+41);

  g = ctx.createRadialGradient(cx,horizon,0,cx,horizon,W*0.42);
  g.addColorStop(0,'rgba(255,196,110,.5)'); g.addColorStop(1,'rgba(255,196,110,0)');
  ctx.fillStyle = g; ctx.fillRect(-40,horizon-H*0.3,W+80,H*0.3+2);

  ridge(horizon, W*0.055, '#241d33', 0.9, 17);
  ridge(horizon, W*0.030, '#1a1526', 1.7, 29);

  /* ---- ground and road ---- */
  ctx.fillStyle = '#2a211d'; ctx.fillRect(-40,horizon,W+80,H-horizon+40);
  for(let y = horizon+1; y < H+30; y += 2){
    const d = y-horizon, z = C/d, hw = roadK*d;
    const ph = Math.floor(z*2.2 + scroll) & 1;
    const lit = 1 - Math.min(1,d/depth)*0.35;
    const rx = rcx(d);
    ctx.fillStyle = ph ? shade(58,50,46,lit) : shade(50,43,40,lit);
    ctx.fillRect(rx-hw, y, hw*2, 2);
    ctx.fillStyle = ph ? shade(74,60,44,lit) : shade(64,52,38,lit);
    ctx.fillRect(rx-hw-hw*0.10, y, hw*0.10, 2);
    ctx.fillRect(rx+hw,          y, hw*0.10, 2);
  }

  /* centre line */
  const DASH = 3.2, LEN = 1.5;
  for(let n=0;n<40;n++){
    const z0 = n*DASH - (scroll % DASH), z1 = z0+LEN;
    if(z1 <= 0.06) continue;
    const yA = horizon + C/Math.max(z1,0.06), yB = horizon + C/Math.max(z0,0.06);
    if(yB < horizon || yA > H) continue;
    const dA = yA-horizon, dB = Math.min(yB,H)-horizon;
    const wA = roadK*dA*0.020, wB = roadK*dB*0.020;
    const xA = rcx(dA), xB = rcx(dB);
    ctx.fillStyle = 'rgba(228,199,138,'+(0.30+0.45*Math.min(1,dA/depth))+')';
    ctx.beginPath();
    ctx.moveTo(xA-wA,yA); ctx.lineTo(xA+wA,yA);
    ctx.lineTo(xB+wB,Math.min(yB,H)); ctx.lineTo(xB-wB,Math.min(yB,H));
    ctx.fill();
  }

  /* telephone poles */
  const PS = 7.5;
  for(let n=0;n<16;n++){
    const z = n*PS - (scroll % PS);
    if(z <= 0.30) continue;
    const y = horizon + C/z; if(y > H*1.4) continue;
    const hw = roadK*(y-horizon), s = (y-horizon)/depth;
    const ph = H*0.34*s, pw = Math.max(1, W*0.006*s);
    for(const side of [-1,1]){
      const px = rcx(y-horizon) + side*(hw*1.30);
      if(px < -80 || px > W+80) continue;
      ctx.fillStyle = 'rgba(18,14,20,'+(0.55+0.4*s)+')';
      ctx.fillRect(px-pw/2, y-ph, pw, ph);
      ctx.fillRect(px-pw*2.6, y-ph*0.88, pw*5.2, Math.max(1,pw*0.7));
    }
  }

  /* ---- everything standing beside the road, plus oncoming traffic,
          painted far to near ---- */
  const items = [];
  for(const p of props)   items.push({z: p.z0 - scroll, p});
  for(const c of traffic) items.push({z: c.z, c});
  items.sort((a,b) => b.z - a.z);

  for(const it of items){
    if(it.z < 0.55) continue;
    const y = horizon + C/it.z, s = (y-horizon)/depth;
    if(s > 4.2) continue;
    const hw = roadK*(y-horizon);
    const rx = rcx(y-horizon);
    if(it.c){ drawOncoming(it.c, rx - hw*0.50, y, s, hw, now); continue; }
    const p = it.p, x = rx + p.side*hw*p.off;
    if(x < -W*0.8 || x > W*1.8) continue;
    const fade = Math.min(1, Math.max(0, (s - 0.012) / 0.075));
    if(fade <= 0.01) continue;
    ctx.save(); ctx.globalAlpha = fade;
    if(p.t === 'cactus')         drawCactus(p,x,y,s);
    else if(p.t === 'sign')      drawSign(p,x,y,s);
    else if(p.t === 'building')  drawBuilding(p,x,y,s);
    else                         drawBillboard(p,x,y,s);
    ctx.restore();
  }

  /* haze, flash, dust */
  ctx.fillStyle = 'rgba(200,169,124,.05)';
  for(let i=0;i<5;i++){
    const y = horizon + (i+1)/6*depth*0.55;
    ctx.fillRect(0, y + Math.sin(now/2200+i)*4, W, depth*0.05);
  }
  if(flash > 0.01){
    flash -= dt*2.4;
    ctx.fillStyle = 'rgba(217,80,60,'+(flash*0.16)+')';
    ctx.fillRect(-40,-40,W+80,H+80);
  }
  for(let i=dust.length-1;i>=0;i--){
    const p = dust[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.045; p.a -= dt*0.7; p.r += dt*22;
    if(p.a <= 0){ dust.splice(i,1); continue; }
    ctx.fillStyle = 'rgba(190,160,116,'+p.a.toFixed(3)+')';
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.2832); ctx.fill();
  }

  /* ---- the cabin ---- */
  glassTint();
  drawCabinTop();
  drawMirror(now);
  drawFreshener(now);
  drawDashboard(now);
  drawSeatsAndRiders(now);
  headlightSweep(now);

  g = ctx.createRadialGradient(cx,H*0.46,H*0.28, cx,H*0.46,H*0.92);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,.62)');
  ctx.fillStyle = g; ctx.fillRect(-40,-40,W+80,H+80);
  ctx.restore();
}

function ridge(horizon, amp, col, freq, seed){
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.moveTo(-40,horizon+2);
  for(let x=-40;x<=W+40;x+=14){
    const t = x/W*freq;
    const y = horizon - amp*(0.45 + 0.32*Math.sin(t*3.1+seed)
              + 0.20*Math.sin(t*7.7+seed*1.7) + 0.12*Math.sin(t*13.3+seed*0.6));
    ctx.lineTo(x,y);
  }
  ctx.lineTo(W+40,horizon+2); ctx.closePath(); ctx.fill();
}

/* =============== roadside props =============== */
function drawCactus(p,x,y,s){
  const h = H*p.h*s, w = Math.max(1, h*0.16);
  ctx.fillStyle = 'rgba(13,11,17,'+Math.min(1,0.5+s*1.6)+')';
  rr(x-w/2, y-h, w, h, w*0.5); ctx.fill();
  if(p.arms >= 1) cactusArm(x, y-h*0.58, w, h, p.aSide);
  if(p.arms >= 2) cactusArm(x, y-h*0.40, w, h*0.74, -p.aSide);
}
function cactusArm(x,y,w,h,dir){
  const reach = h*0.30, rise = h*0.34;
  ctx.beginPath();
  ctx.lineWidth = w*0.85; ctx.strokeStyle = ctx.fillStyle;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.moveTo(x, y);
  ctx.lineTo(x + dir*reach, y);
  ctx.lineTo(x + dir*reach, y - rise);
  ctx.stroke();
}

function drawSign(p,x,y,s){
  const ph = H*0.115*s, pw = Math.max(1, H*0.006*s);
  ctx.fillStyle = 'rgba(16,13,18,.95)';
  ctx.fillRect(x-pw/2, y-ph, pw, ph);

  if(p.kind === 'warn'){
    ctx.save(); ctx.translate(x, y-ph-sw*0.42); ctx.rotate(Math.PI/4);

    ctx.strokeStyle = '#16120e'; ctx.lineWidth = Math.max(1,sw*0.035);
    rr(-sw*0.24,-sw*0.24,sw*0.48,sw*0.48,sw*0.03); ctx.stroke();
    ctx.restore();
    if(sw > 40){
      ctx.fillStyle = '#16120e';
      ctx.font = '700 '+(sw*0.34).toFixed(0)+'px '+SANS;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('!', x, y-ph-sw*0.40);
    }
  } else if(p.kind === 'speed'){
    const w = sw*0.46, h = sw*0.62;
    ctx.fillStyle = '#ddd6c8'; rr(x-w/2, y-ph-h, w, h, w*0.06); ctx.fill();
    if(w > 26){
      ctx.fillStyle = '#1a1614'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '700 '+(h*0.16).toFixed(0)+'px '+SANS;
      ctx.fillText('SPEED', x, y-ph-h*0.78);
      ctx.fillText('LIMIT', x, y-ph-h*0.60);
      ctx.font = '700 '+(h*0.40).toFixed(0)+'px '+SANS;
      ctx.fillText(String(p.num), x, y-ph-h*0.30);
    }
  } else {
    const w = sw*0.98, h = sw*0.44;
    ctx.fillStyle = '#2c5c3a'; rr(x-w/2, y-ph-h, w, h, w*0.03); ctx.fill();
    ctx.strokeStyle = 'rgba(230,225,210,.7)'; ctx.lineWidth = Math.max(1,w*0.012);
    rr(x-w*0.46, y-ph-h*0.93, w*0.92, h*0.86, w*0.02); ctx.stroke();
    if(w > 44){
      const left = S.running ? Math.max(0, RUN_LENGTH - S.idx) : RUN_LENGTH;
      ctx.fillStyle = '#e8e2d2'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '700 '+(h*0.21).toFixed(0)+'px '+SANS;
      ctx.fillText('COUNTY LINE', x, y-ph-h*0.66);
      ctx.font = '700 '+(h*0.36).toFixed(0)+'px '+SANS;
      ctx.fillText(left + ' MI', x, y-ph-h*0.28);

}

function drawBuilding(p,x,y,s){
  const w = W*p.w*s;
  ctx.fillStyle = 'rgba(15,12,19,'+Math.min(1,0.55+s*1.5)+')';
  if(p.kind === 'silo'){
    const h = w*2.3;
    rr(x-w*0.22, y-h, w*0.44, h, w*0.04); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x, y-h, w*0.24, w*0.20, 0, Math.PI, 0); ctx.fill();
  } else if(p.kind === 'tower'){
    const legs = w*1.5, tank = w*0.62;
    ctx.lineWidth = Math.max(1,w*0.045); ctx.strokeStyle = ctx.fillStyle;
    ctx.beginPath();
    ctx.moveTo(x-w*0.30,y); ctx.lineTo(x-tank*0.34, y-legs);
    ctx.moveTo(x+w*0.30,y); ctx.lineTo(x+tank*0.34, y-legs);
    ctx.moveTo(x-w*0.18,y-legs*0.45); ctx.lineTo(x+w*0.18,y-legs*0.45);
    ctx.stroke();
    rr(x-tank*0.40, y-legs-tank*0.62, tank*0.80, tank*0.62, tank*0.10); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x-tank*0.40, y-legs-tank*0.62); ctx.lineTo(x, y-legs-tank*0.95);
    ctx.lineTo(x+tank*0.40, y-legs-tank*0.62); ctx.closePath(); ctx.fill();
  } else {
    const h = w*0.62;
    ctx.fillRect(x-w/2, y-h, w, h);
    ctx.beginPath();
    ctx.moveTo(x-w*0.56, y-h); ctx.lineTo(x, y-h-w*0.30);
    ctx.lineTo(x+w*0.56, y-h); ctx.closePath(); ctx.fill();
    if(p.lit && w > 22){
      ctx.fillStyle = 'rgba(255,198,120,.72)';
      ctx.fillRect(x-w*0.13, y-h*0.72, w*0.26, h*0.26);
    }
  }
}

/* split a long name across two balanced lines, like the game tiles do */
function wrapName(txt){
  const w = txt.split(' ');
  if(w.length < 2) return [txt];
  let best = [txt], bd = 1e9;
  for(let i=1;i<w.length;i++){
    const a = w.slice(0,i).join(' '), b = w.slice(i).join(' ');
    const d = Math.abs(a.length - b.length);
    if(d < bd){ bd = d; best = [a,b]; }
  }
  return best;
}

/* fit a line of text inside a width, return the px size used */
function fitFont(txt, maxW, px, weight){
  ctx.font = weight+' '+px.toFixed(1)+'px '+SANS;
  const w = ctx.measureText(txt).width;
  if(w > maxW){ px *= maxW/w; ctx.font = weight+' '+px.toFixed(1)+'px '+SANS; }
  return px;
}

function drawBillboard(p,x,y,s){
  const bw = H*1.08*s, bh = bw*0.50;
  const lift = H*0.32*s;
  const top = y - lift - bh;
  const ad = p.ad;

  /* posts */
  const pw = Math.max(1, bw*0.030);
  ctx.fillStyle = 'rgba(12,10,15,.95)';
  ctx.fillRect(x-bw*0.30-pw/2, top+bh*0.92, pw, lift+bh*0.08);
  ctx.fillRect(x+bw*0.30-pw/2, top+bh*0.92, pw, lift+bh*0.08);

  /* panel */
  ctx.fillStyle = '#08080b';
  rr(x-bw/2, top, bw, bh, bw*0.022); ctx.fill();

  /* neon frame, same look as the game tiles */
  ctx.save();
  ctx.strokeStyle = ad.col;
  ctx.lineWidth = Math.max(1, bw*0.013);
  ctx.shadowColor = ad.col; ctx.shadowBlur = Math.max(2, bw*0.055);
  rr(x-bw*0.472, top+bh*0.055, bw*0.944, bh*0.89, bw*0.018); ctx.stroke();
  ctx.restore();

  if(bw < 78) return;                       // too far off to read

  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const inner = bw*0.84;

  /* the cheesy part */
  ctx.fillStyle = 'rgba(236,228,212,.90)';
  const pitch = p.pitch || ad.pitch;
  const n = pitch.length, lh = bh*0.165;
  for(let i=0;i<n;i++){
    fitFont(pitch[i], inner, bh*0.140, '600');
    ctx.fillText(pitch[i], x, top + bh*0.275 + (i-(n-1)/2)*lh);
  }

  /* the game */
  ctx.fillStyle = ad.col;
  ctx.shadowColor = ad.col; ctx.shadowBlur = bw*0.03;
  const target = bh*0.235;
  ctx.font = '700 '+target.toFixed(1)+'px '+SANS;
  let nameLines = [ad.name];
  if(ctx.measureText(ad.name).width > inner) nameLines = wrapName(ad.name);
  if(nameLines.length === 1){
    fitFont(nameLines[0], inner, target, '700');
    ctx.fillText(nameLines[0], x, top + bh*0.70);
  } else {
    const nh = bh*0.198;
    for(let i=0;i<2;i++){
      fitFont(nameLines[i], inner, target*0.88, '700');
      ctx.fillText(nameLines[i], x, top + bh*0.600 + i*nh);
    }
  }
  ctx.restore();

  /* lamp wash along the bottom lip */
  const g = ctx.createLinearGradient(0, top+bh, 0, top+bh*0.55);
  g.addColorStop(0,'rgba(255,236,190,.10)'); g.addColorStop(1,'rgba(255,236,190,0)');
  ctx.fillStyle = g; ctx.fillRect(x-bw/2, top+bh*0.55, bw, bh*0.45);
}

/* =============== oncoming traffic =============== */
function drawOncoming(c, x, y, s, hw, now){
  const cw = (c.big ? W*0.225 : W*0.163) * s;
  const ch = cw * (c.big ? 0.78 : 0.56);
  x += Math.sin(now/900 + c.drift) * hw * 0.012;
  if(y - ch > H + 60) return;

  /* headlight wash thrown down the road */
  const g = ctx.createRadialGradient(x, y-ch*0.20, 0, x, y-ch*0.20, cw*1.9);
  g.addColorStop(0,'rgba(255,232,178,'+Math.min(.45,0.10+s*0.5)+')');
  g.addColorStop(1,'rgba(255,232,178,0)');
  ctx.fillStyle = g;
  ctx.fillRect(x-cw*2, y-ch*2.2, cw*4, ch*3.4);

  ctx.fillStyle = '#0e0c12';
  rr(x-cw/2, y-ch*0.62, cw, ch*0.62, cw*0.07); ctx.fill();          // body
  rr(x-cw*0.33, y-ch*(c.big?1.20:0.98), cw*0.66, ch*(c.big?0.62:0.40), cw*0.05);
  ctx.fill();                                                        // cab
  ctx.fillStyle = 'rgba(120,138,168,.20)';
  rr(x-cw*0.27, y-ch*(c.big?1.13:0.92), cw*0.54, ch*0.26, cw*0.03); ctx.fill();

  const r = Math.max(1, cw*0.062);
  ctx.fillStyle = 'rgba(255,240,200,.96)';
  ctx.beginPath(); ctx.arc(x-cw*0.33, y-ch*0.24, r, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.arc(x+cw*0.33, y-ch*0.24, r, 0, 6.2832); ctx.fill();
  if(c.big && cw > 40){
    ctx.fillStyle = 'rgba(255,168,90,.75)';
    for(let i=-2;i<=2;i++) ctx.fillRect(x+i*cw*0.10-cw*0.016, y-ch*1.24, cw*0.032, cw*0.032);
  }
}

/* the big mirror. everything you're running from lives in here. */
function drawMirror(now){
  const mw = Math.max(272, Math.min(W*0.31, 500));
  const mh = mw*0.335;
  const mx = W*0.5 - mw/2, my = H*0.042;

  ctx.fillStyle = '#0a080d';
  ctx.fillRect(W*0.5-mw*0.020, my-H*0.035, mw*0.040, H*0.045);

  ctx.fillStyle = '#100c10';
  rr(mx-6, my-6, mw+12, mh+12, 12); ctx.fill();
  ctx.strokeStyle = 'rgba(242,205,138,.16)'; ctx.lineWidth = 1;
  rr(mx-6, my-6, mw+12, mh+12, 12); ctx.stroke();

  ctx.save();
  rr(mx,my,mw,mh,8); ctx.clip();

  const hz = my + mh*0.36;
  let g = ctx.createLinearGradient(0,my,0,hz);
  g.addColorStop(0,'#0d0b1c'); g.addColorStop(1,'#3a2b3c');
  ctx.fillStyle = g; ctx.fillRect(mx,my,mw,hz-my);
  ctx.fillStyle = '#1d1719'; ctx.fillRect(mx,hz,mw,mh-(hz-my));
  ctx.fillStyle = '#2c2523';
  const mLane = mw*0.20;                     /* mirrored, so it leans the other way */
  ctx.beginPath();
  ctx.moveTo(mx+mw*0.5-mw*0.035, hz); ctx.lineTo(mx+mw*0.5+mw*0.035, hz);
  ctx.lineTo(mx+mw*1.06+mLane, my+mh); ctx.lineTo(mx-mw*0.06+mLane, my+mh);
  ctx.closePath(); ctx.fill();

  const DASH = 3.2, Cm = mh*0.62;
  for(let n=0;n<26;n++){
    const z0 = n*DASH - (scroll % DASH), z1 = z0+1.5;
    if(z1<=0.16) continue;
    const yA = hz + Cm/Math.max(z1,0.16), yB = hz + Cm/Math.max(z0,0.16);
    if(yA > my+mh) continue;
    const s = (yA-hz)/(mh*0.64);
    ctx.fillStyle = 'rgba(210,180,130,'+(0.16+0.3*Math.min(1,s))+')';
    ctx.fillRect(mx+mw*0.5-mw*0.008*(1+s*3) + mLane*s, yA, mw*0.016*(1+s*3),
                 Math.max(1, Math.min(yB,my+mh)-yA));
  }

  const p = Math.max(0, Math.min(1, (S.threat-START_THREAT)/(CAUGHT_AT-START_THREAT)));
  copCar(mx+mw*0.50, hz, mw, mh, Math.pow(p,1.25),        0.00, now, 1);
  copCar(mx+mw*0.50, hz, mw, mh, Math.pow(p,1.25)*0.72,  -0.26, now, 0.82);

  g = ctx.createLinearGradient(mx,my,mx+mw,my+mh);
  g.addColorStop(0,'rgba(255,255,255,.055)');
  g.addColorStop(0.42,'rgba(255,255,255,0)');
  g.addColorStop(0.58,'rgba(255,255,255,.03)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(mx,my,mw,mh);
  ctx.restore();
}

function copCar(baseX, hz, mw, mh, p, lateral, now, dim){
  const s  = 0.055 + 0.50*p;
  const cw = mw*s, ch = cw*0.60;
  const y  = hz + (mh*0.58)*Math.pow(p,1.05) + ch*0.10;
  const x  = baseX + lateral*mw*(0.16 + 0.5*p);
  if(y - ch > hz + mh) return;

  ctx.save();
  ctx.globalAlpha = dim;
  const g = ctx.createRadialGradient(x, y+ch*0.35, 0, x, y+ch*0.35, cw*1.5);
  g.addColorStop(0,'rgba(255,226,168,'+(0.16+0.30*p)+')');
  g.addColorStop(1,'rgba(255,226,168,0)');
  ctx.fillStyle = g;
  ctx.fillRect(x-cw*1.6, y-ch, cw*3.2, ch*2.6);

  ctx.fillStyle = '#100d13';
  rr(x-cw/2, y-ch*0.62, cw, ch*0.62, cw*0.06); ctx.fill();
  ctx.fillStyle = '#1a1620';
  rr(x-cw*0.34, y-ch*0.98, cw*0.68, ch*0.42, cw*0.05); ctx.fill();
  ctx.fillStyle = 'rgba(120,140,170,.22)';
  rr(x-cw*0.28, y-ch*0.92, cw*0.56, ch*0.28, cw*0.03); ctx.fill();

  ctx.fillStyle = 'rgba(255,238,196,.95)';
  ctx.beginPath(); ctx.arc(x-cw*0.34, y-ch*0.22, Math.max(1,cw*0.055), 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.arc(x+cw*0.34, y-ch*0.22, Math.max(1,cw*0.055), 0, 6.2832); ctx.fill();

  const blink = Math.floor(now/230) & 1;
  const bw = cw*0.46, by = y-ch*1.06, bh = Math.max(2, ch*0.13);
  ctx.fillStyle = '#0c0a0e'; ctx.fillRect(x-bw/2, by, bw, bh);
  ctx.shadowBlur = 14*(0.4+p);
  ctx.fillStyle = blink ? '#ff3b30' : '#3f2020';
  ctx.shadowColor = blink ? 'rgba(255,59,48,.9)' : 'transparent';
  ctx.fillRect(x-bw/2, by, bw*0.46, bh);
  ctx.fillStyle = blink ? '#243a8a' : '#4a6cff';
  ctx.shadowColor = blink ? 'transparent' : 'rgba(74,108,255,.9)';
  ctx.fillRect(x+bw*0.04, by, bw*0.46, bh);
  ctx.shadowBlur = 0;
  ctx.restore();
}

/* the little tree on the mirror, swinging the whole way */
function drawFreshener(now){
  const mw = Math.max(272, Math.min(W*0.31, 500));
  const ax = W*0.5 + mw*0.40, ay = H*0.042 + mw*0.335;
  const sway = reduced ? 0 : Math.sin(now/700)*0.13 + jx*0.010;
  ctx.save();
  ctx.translate(ax, ay); ctx.rotate(sway);
  ctx.strokeStyle = 'rgba(220,200,170,.30)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0, H*0.034); ctx.stroke();
  const t = H*0.030;
  ctx.fillStyle = 'rgba(78,112,74,.92)';
  ctx.beginPath();
  ctx.moveTo(0, H*0.034);
  ctx.lineTo(-t*0.38, H*0.034 + t*0.42); ctx.lineTo(-t*0.20, H*0.034 + t*0.42);
  ctx.lineTo(-t*0.46, H*0.034 + t*0.80); ctx.lineTo(-t*0.16, H*0.034 + t*0.80);
  ctx.lineTo(-t*0.16, H*0.034 + t*0.96); ctx.lineTo( t*0.16, H*0.034 + t*0.96);
  ctx.lineTo( t*0.16, H*0.034 + t*0.80); ctx.lineTo( t*0.46, H*0.034 + t*0.80);
  ctx.lineTo( t*0.20, H*0.034 + t*0.42); ctx.lineTo( t*0.38, H*0.034 + t*0.42);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

/* headlights raking across the inside of the car as one goes by */
function headlightSweep(now){
  for(const c of traffic){
    if(c.z > 5.4 || c.z < 0.5) continue;
    const k = 1 - Math.abs(c.z - 2.3)/3.1;
    if(k <= 0) continue;
    const t = Math.min(1, Math.max(0, (5.4 - c.z)/4.9));
    const x = W*0.52 - t*t*W*0.86;
    const g = ctx.createRadialGradient(x, H*0.60, 0, x, H*0.60, W*0.50);
    g.addColorStop(0,'rgba(255,226,170,'+(0.20*k*(c.big?1.35:1)).toFixed(3)+')');
    g.addColorStop(0.55,'rgba(255,214,150,'+(0.06*k).toFixed(3)+')');
    g.addColorStop(1,'rgba(255,214,150,0)');
    ctx.fillStyle = g; ctx.fillRect(-40,-40,W+80,H+80);
  }
}

/* =============== the cabin =============== */
function glassTint(){
  const g = ctx.createRadialGradient(W*0.5,H*0.42,H*0.20, W*0.5,H*0.42,W*0.80);
  g.addColorStop(0,'rgba(200,169,124,0)'); g.addColorStop(1,'rgba(200,169,124,.10)');
  ctx.fillStyle = g; ctx.fillRect(-40,-40,W+80,H+80);
}

/* headliner, visors, pillars, grab handle */
function drawCabinTop(){
  ctx.fillStyle = '#0a080d';
  ctx.beginPath();
  ctx.moveTo(-40,-40); ctx.lineTo(W+40,-40); ctx.lineTo(W+40,H*0.030);
  ctx.quadraticCurveTo(W*0.5, H*0.082, -40, H*0.030);
  ctx.closePath(); ctx.fill();

  /* sun visors, folded up either side of the mirror */
  ctx.fillStyle = '#131017';
  for(const side of [-1,1]){
    const vx = W*0.5 + side*W*0.245;
    ctx.save(); ctx.translate(vx, H*0.052); ctx.rotate(side*0.026);
    rr(-W*0.115, -H*0.020, W*0.230, H*0.040, H*0.008); ctx.fill();
    ctx.strokeStyle = 'rgba(242,205,138,.09)'; ctx.lineWidth = 1;
    rr(-W*0.115, -H*0.020, W*0.230, H*0.040, H*0.008); ctx.stroke();
    ctx.restore();
  }

  /* A-pillars */
  ctx.fillStyle = '#0a080d';
  ctx.beginPath();
  ctx.moveTo(-40,-40); ctx.lineTo(W*0.088,-40);
  ctx.quadraticCurveTo(W*0.030,H*0.46, -40,H*0.82);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(W+40,-40); ctx.lineTo(W*0.912,-40);
  ctx.quadraticCurveTo(W*0.970,H*0.46, W+40,H*0.82);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(242,205,138,.07)'; ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(W*0.088,0); ctx.quadraticCurveTo(W*0.030,H*0.46, 0,H*0.82); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(W*0.912,0); ctx.quadraticCurveTo(W*0.970,H*0.46, W,H*0.82); ctx.stroke();

  /* grab handle over the passenger door */
  ctx.fillStyle = '#171219';
  rr(W*0.945, H*0.075, W*0.045, H*0.016, H*0.008); ctx.fill();
  ctx.strokeStyle = 'rgba(242,205,138,.10)'; ctx.lineWidth = 1;
  rr(W*0.945, H*0.075, W*0.045, H*0.016, H*0.008); ctx.stroke();
}

/* dash top, binnacle, wheel, vents, and the housing the console sits in */
function drawDashboard(now){
  const top = H*0.615;

  /* scuttle and dash face */
  ctx.fillStyle = '#150f12';
  ctx.beginPath();
  ctx.moveTo(-40,H+40); ctx.lineTo(-40,top+H*0.05);
  ctx.quadraticCurveTo(W*0.5, top-H*0.035, W+40, top+H*0.05);
  ctx.lineTo(W+40,H+40); ctx.closePath(); ctx.fill();

  /* wiper arms parked at the base of the glass */
  ctx.strokeStyle = 'rgba(9,7,11,.9)'; ctx.lineWidth = Math.max(1.4, H*0.005);
  ctx.lineCap = 'round';
  for(const [sx,ex] of [[0.20,0.44],[0.56,0.80]]){
    const y0 = top + H*0.030 - Math.abs(0.5-sx)*H*0.028;
    ctx.beginPath();
    ctx.moveTo(W*sx, y0);
    ctx.quadraticCurveTo(W*(sx+ex)/2, y0 - H*0.020, W*ex, y0 - H*0.004);
    ctx.stroke();
  }

  /* dash top highlight */
  ctx.strokeStyle = 'rgba(242,205,138,.13)'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(0,top+H*0.05);
  ctx.quadraticCurveTo(W*0.5, top-H*0.035, W, top+H*0.05);
  ctx.stroke();

  /* defroster slot along the base of the glass */
  ctx.strokeStyle = 'rgba(242,205,138,.07)'; ctx.lineWidth = Math.max(1.5, H*0.006);
  ctx.beginPath();
  ctx.moveTo(W*0.20, top+H*0.043);
  ctx.quadraticCurveTo(W*0.5, top-H*0.020, W*0.80, top+H*0.043);
  ctx.stroke();

  /* the dash smeared back at us in the windscreen */
  const rg = ctx.createLinearGradient(0, top-H*0.10, 0, top-H*0.005);
  rg.addColorStop(0,'rgba(214,178,124,0)'); rg.addColorStop(1,'rgba(214,178,124,.075)');
  ctx.fillStyle = rg;
  ctx.beginPath();
  ctx.moveTo(W*0.10, top+H*0.02);
  ctx.quadraticCurveTo(W*0.5, top-H*0.055, W*0.90, top+H*0.02);
  ctx.lineTo(W*0.90, top-H*0.10); ctx.lineTo(W*0.10, top-H*0.10);
  ctx.closePath(); ctx.fill();

  /* instrument binnacle in front of the driver */
  const bx = W*0.155, by = top + H*0.052;
  ctx.fillStyle = '#100c10';
  ctx.beginPath();
  ctx.moveTo(bx-W*0.105, by+H*0.10);
  ctx.quadraticCurveTo(bx, by-H*0.052, bx+W*0.105, by+H*0.10);
  ctx.closePath(); ctx.fill();
  const gg = ctx.createRadialGradient(bx,by+H*0.012,0, bx,by+H*0.012,W*0.085);
  gg.addColorStop(0,'rgba(242,190,110,.20)'); gg.addColorStop(1,'rgba(242,190,110,0)');
  ctx.fillStyle = gg;
  ctx.fillRect(bx-W*0.11, by-H*0.06, W*0.22, H*0.17);
  ctx.strokeStyle = 'rgba(242,205,138,.16)'; ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(bx-W*0.105, by+H*0.10);
  ctx.quadraticCurveTo(bx, by-H*0.052, bx+W*0.105, by+H*0.10);
  ctx.stroke();

  /* steering wheel — top of the rim clears the driver's shoulder */
  const wx = W*0.155, wy = top + H*0.10, wr = H*0.145;
  ctx.strokeStyle = '#141017'; ctx.lineWidth = Math.max(3, H*0.017);
  ctx.beginPath(); ctx.ellipse(wx, wy, wr, wr*0.42, 0, Math.PI*1.02, Math.PI*1.98); ctx.stroke();
  ctx.strokeStyle = 'rgba(242,205,138,.11)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.ellipse(wx, wy, wr, wr*0.42, 0, Math.PI*1.02, Math.PI*1.98); ctx.stroke();
  /* a hand at ten o'clock */
  ctx.fillStyle = '#0b090e';
  ctx.beginPath();
  ctx.ellipse(wx-wr*0.80, wy-wr*0.30, H*0.021, H*0.014, -0.5, 0, 6.2832); ctx.fill();

  /* the console housing, wrapped around the question panel */
  if(panelBox){
    const b = panelBox, m = Math.max(9, W*0.008);
    ctx.fillStyle = '#100b0e';
    rr(b.l-m, b.t-m, b.w+m*2, b.h+m*2+H*0.06, 16); ctx.fill();
    ctx.strokeStyle = 'rgba(242,205,138,.12)'; ctx.lineWidth = 1.2;
    rr(b.l-m, b.t-m, b.w+m*2, b.h+m*2+H*0.06, 16); ctx.stroke();

    /* air vents either side of the stack */
    for(const side of [-1,1]){
      const vx = side < 0 ? b.l-m-W*0.052 : b.l+b.w+m+W*0.012;
      const vy = b.t + H*0.012, vw = W*0.040, vh = H*0.045;
      if(vx < 0 || vx+vw > W) continue;
      ctx.fillStyle = '#0b080b'; rr(vx,vy,vw,vh,H*0.006); ctx.fill();
      ctx.strokeStyle = 'rgba(242,205,138,.10)'; ctx.lineWidth = 1;
      rr(vx,vy,vw,vh,H*0.006); ctx.stroke();
      ctx.fillStyle = 'rgba(242,205,138,.08)';
      for(let i=1;i<=3;i++) ctx.fillRect(vx+vw*0.10, vy+vh*i/4, vw*0.80, Math.max(1,vh*0.045));
    }

    /* shifter and handbrake, down where the seats meet */
    const sxx = b.l - m - W*0.030, syy = b.t + b.h*0.66;
    if(sxx > W*0.06){
      ctx.strokeStyle = '#151018'; ctx.lineWidth = Math.max(2, W*0.007);
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(sxx, syy+H*0.075); ctx.lineTo(sxx-W*0.006, syy); ctx.stroke();
      ctx.fillStyle = '#1c151d';
      ctx.beginPath(); ctx.ellipse(sxx-W*0.006, syy-H*0.006, W*0.014, H*0.016, 0, 0, 6.2832);
      ctx.fill();
    }
    const hxx = b.l + b.w + m + W*0.030, hyy = b.t + b.h*0.72;
    if(hxx < W*0.94){
      ctx.strokeStyle = '#151018'; ctx.lineWidth = Math.max(2, W*0.006);
      ctx.beginPath();
      ctx.moveTo(hxx, hyy+H*0.070); ctx.lineTo(hxx+W*0.020, hyy);
      ctx.stroke();
    }
  }
}

/* front seats, the two of them, and their belts */
function drawSeatsAndRiders(now){
  const bob = reduced ? 0 : Math.sin(now/540)*2.2;
  const set = [
    {x:W*0.155, headY:H*0.345 + bob,      hr:H*0.077, sw:H*0.215, style:'hat',   out:-1},
    {x:W*0.895, headY:H*0.375 - bob*0.7,  hr:H*0.072, sw:H*0.200, style:'scarf', out: 1}
  ];
  for(const r of set) drawSeat(r);
  for(const r of set) drawRider(r, now);
  for(const r of set) drawBelt(r);
}

function drawSeat(r){
  const sx = r.x + r.out*W*0.052;
  const w  = r.sw*1.10, top = r.headY + r.hr*0.55;
  /* a shade lighter than the people, so the two read apart */
  ctx.fillStyle = '#171319';
  rr(sx-w/2, top, w, H-top+40, w*0.16); ctx.fill();
  /* headrest, clear of the head on the outboard side */
  rr(sx + r.out*w*0.16 - w*0.21, r.headY - r.hr*1.30, w*0.42, r.hr*1.55, w*0.15);
  ctx.fill();
  ctx.fillStyle = '#100c12';
  rr(sx + r.out*w*0.16 - w*0.15, r.headY - r.hr*1.16, w*0.30, r.hr*1.20, w*0.10);
  ctx.fill();
  /* bolster seam and stitching down the outer edge */
  ctx.strokeStyle = 'rgba(242,205,138,.10)'; ctx.lineWidth = 1.3;
  ctx.beginPath();
  ctx.moveTo(sx + r.out*w*0.34, top + r.hr*0.35);
  ctx.lineTo(sx + r.out*w*0.34, H);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(242,205,138,.055)'; ctx.lineWidth = 1;
  ctx.setLineDash([H*0.012, H*0.014]);
  ctx.beginPath();
  ctx.moveTo(sx + r.out*w*0.10, top + r.hr*0.55);
  ctx.lineTo(sx + r.out*w*0.10, H);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawRider(r, now){
  const {x:cx, headY, hr, sw, style} = r;
  ctx.save();
  ctx.fillStyle = '#08070c';
  ctx.beginPath();
  ctx.moveTo(cx-sw, H+10);
  ctx.bezierCurveTo(cx-sw*0.98, headY+hr*2.5, cx-hr*1.45, headY+hr*1.15, cx-hr*0.92, headY+hr*0.80);
  ctx.lineTo(cx+hr*0.92, headY+hr*0.80);
  ctx.bezierCurveTo(cx+hr*1.45, headY+hr*1.15, cx+sw*0.98, headY+hr*2.5, cx+sw, H+10);
  ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx, headY, hr*0.92, hr, 0, 0, 6.2832); ctx.fill();

  if(style === 'hat'){
    ctx.beginPath(); ctx.ellipse(cx, headY-hr*0.42, hr*1.62, hr*0.30, 0, 0, 6.2832); ctx.fill();
    ctx.beginPath(); rr(cx-hr*0.80, headY-hr*1.30, hr*1.60, hr*0.95, hr*0.34); ctx.fill();
  } else {
    ctx.beginPath(); ctx.ellipse(cx, headY+hr*0.86, hr*1.16, hr*0.42, 0, 0, 6.2832); ctx.fill();
    const f = reduced ? 0 : Math.sin(now/300);
    ctx.beginPath();
    ctx.moveTo(cx+hr*0.9, headY+hr*0.6);
    ctx.quadraticCurveTo(cx+hr*2.4, headY+hr*(1.1+f*0.35), cx+hr*3.6, headY+hr*(0.35+f*0.9));
    ctx.quadraticCurveTo(cx+hr*2.5, headY+hr*(1.7+f*0.3), cx+hr*0.9, headY+hr*1.25);
    ctx.closePath(); ctx.fill();
  }

  ctx.strokeStyle = 'rgba(242,205,138,.15)'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.ellipse(cx, headY, hr*0.92, hr, 0, Math.PI*0.15, Math.PI*0.85);
  ctx.stroke();
  ctx.restore();
}

function drawBelt(r){
  const {x:cx, headY, hr, sw, out} = r;
  ctx.save();
  ctx.strokeStyle = 'rgba(150,126,104,.30)';
  ctx.lineWidth = Math.max(3, hr*0.20);
  ctx.beginPath();
  ctx.moveTo(cx + out*sw*0.62, headY + hr*1.15);
  ctx.quadraticCurveTo(cx + out*sw*0.16, headY + hr*2.5, cx - out*sw*0.30, H);
  ctx.stroke();
  ctx.restore();
}

/* ---------------- main loop ---------------- */
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now-last)/1000); last = now;

  if(S.running && !S.waiting && S.cur){
    S.left -= dt;
    if(S.left <= 0){ S.left = 0; judge(false, true); }
    const k = S.left / S.allotted;
    elTime.style.width = (k*100).toFixed(1) + '%';
    elTime.classList.toggle('low', k < 0.25);
    elClock.textContent = Math.ceil(S.left) + 's';
  }

  drawScene(dt, now);
  requestAnimationFrame(frame);
}

resize();
paintThreat(false);
requestAnimationFrame(frame);
</script>
</body>
