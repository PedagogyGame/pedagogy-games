<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Chinese Character Study · 1801–1900</title>
<style>
:root{--ink:#1a2420;--muted:#5a6e64;--paper:#eef4f0;--panel:#f4f8f4;--line:#b4c8bc;--deep:#1c3a2c;--good:#2a5c3c;--bad:#8a2f27;--gold:#c4b06a}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(1200px 700px at 12% -10%,rgba(180,220,190,.38),transparent 52%),linear-gradient(180deg,#7a9a88 0%,#c5d8cc 42%,#5e7a6c 100%);color:var(--ink);font-family:Georgia,"Times New Roman","Noto Serif SC","Songti SC",serif;overflow:hidden}
.app{height:100vh;display:grid;grid-template-rows:auto 1fr;gap:0}
.topbar{min-height:58px;display:flex;align-items:center;gap:14px;padding:8px 18px;background:rgba(16,40,32,.96);color:#e8f4ee;border-bottom:2px solid #c4b06a}
.brand{font-size:18px;font-weight:700;letter-spacing:.05em;white-space:nowrap}.brand small{font-size:12px;font-weight:400;opacity:.7;margin-left:8px}
.progress{flex:1;max-width:460px;height:7px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:#c4b06a;width:1%;transition:width .25s ease}
.stat{font-size:13px;opacity:.88;white-space:nowrap}.topbtn{border:1px solid rgba(255,255,255,.28);background:transparent;color:white;border-radius:8px;padding:7px 10px;cursor:pointer}
.main{min-height:0;display:grid;grid-template-columns:minmax(390px,46%) 1fr;gap:18px;padding:18px}
.quiz{min-height:0;background:rgba(244,248,246,.97);border:2px solid #2d5c48;box-shadow:inset 0 0 0 6px #dce8e0,0 16px 48px rgba(16,40,32,.26);border-radius:4px;padding:18px 22px 16px;display:flex;flex-direction:column;overflow:auto}
.rankline{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.09em}
.character{text-align:center;font-family:"Noto Serif SC","Songti SC","STSong",serif;font-size:clamp(92px,11vw,164px);line-height:.95;margin:8px 0 0;color:#1a2420;text-shadow:0 1px 0 #fff}
.pinyin{text-align:center;font-size:clamp(24px,2.6vw,39px);font-style:italic;color:#2d5c48;margin:0 0 8px}
.front-pinyin{display:none}.prompt{text-align:center;font-size:16px;margin:2px 0 8px;color:#5a6e64}
button{font:600 13px/1.1 Georgia,serif;letter-spacing:.03em}
.controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:3px 0 7px}.controls .nav{display:flex;gap:6px;margin-right:6px}.ghost,.action{padding:9px 12px;border-radius:8px;cursor:pointer}.ghost{border:1px solid #8aa8ac;background:#e8f2ea;color:#1e3430}.action{border:1px solid #2d5c48;background:#2d5c48;color:#fff}
.reveal{border-top:1px solid #c5d4d2;padding-top:9px;margin-top:2px;animation:fade .18s ease}.reveal-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:5px}.reveal-pinyin{font-size:clamp(27px,2.8vw,42px);font-style:italic;color:#2d5c48;font-weight:700}.definition{font-size:20px;margin:0}.definition b{color:#2a4a4c}.wordtitle,.extitle{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:#5a6e64;margin:9px 0 4px;font-weight:700}.wordlist{display:flex;gap:6px;flex-wrap:wrap}.wordchip{background:#e4eeec;border:1px solid #c3d4d0;border-radius:7px;padding:5px 8px;line-height:1.18}.wordchip .wzh{font-family:"Noto Serif SC","Songti SC",serif;font-size:19px;font-weight:700}.wordchip .wpy{font-size:13px;font-style:italic;color:#3a6a58}.wordchip .wen{font-size:12px;color:#4f5e5c}.examples{display:grid;gap:5px}.example{padding:6px 9px;background:#eef4f0;border-left:3px solid #2d5c48;border-radius:5px;line-height:1.22}.example-zh{font-family:"Noto Serif SC","Songti SC",serif;font-size:clamp(19px,1.65vw,25px)}.example-py{font-size:clamp(14px,1.1vw,17px);font-style:italic;color:#3a6a58;margin-top:2px}.example-en{font-size:clamp(13px,1vw,16px);color:#4f463f;margin-top:2px}.example em{font-style:normal;font-weight:800;color:#8d2f21;background:#d7e4de;border-radius:3px;padding:0 .05em}
.flipcard{margin-top:3px;border:1px solid #9ab0b0;border-radius:4px;padding:12px 14px;background:#eef4f0}.flipcard h3{margin:0 0 7px;font-size:15px;color:#3a6a58;text-transform:uppercase;letter-spacing:.08em}.english-list{font-size:clamp(22px,2vw,32px);line-height:1.2;margin:4px 0 10px}.flipcard .reveal-pinyin{margin:0 0 6px}.further{border:1px solid #2d5c48;background:transparent;color:#2d5c48;border-radius:8px;padding:8px 11px;cursor:pointer}
.imagepane{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;background:rgba(14,32,26,.94);border:2px solid #1a3a2c;border-radius:4px;overflow:hidden;box-shadow:inset 0 0 0 7px rgba(196,163,106,.22),0 16px 48px rgba(16,40,32,.3)}
.imagepane:before{content:"";position:absolute;inset:8px;border:1px solid rgba(196,163,106,.5);border-radius:3px;pointer-events:none}.art{display:block;max-width:94%;max-height:90%;width:auto;height:auto;object-fit:contain;filter:saturate(.98) contrast(1.02);box-shadow:0 8px 32px rgba(0,0,0,.28);transition:opacity .35s ease,transform .35s ease}.art.wide{max-width:98%;max-height:84%}

@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@media(max-width:900px){body{overflow:auto}.app{height:auto;min-height:100vh}.main{grid-template-columns:1fr;grid-template-rows:auto minmax(360px,55vh)}.quiz{overflow:visible}.imagepane{min-height:420px}.topbar{flex-wrap:wrap}.progress{order:3;flex-basis:100%;max-width:none}}
@media(max-width:520px){.main{padding:9px;gap:9px}.quiz{padding:14px}.brand small{display:none}.character{font-size:104px}.example{font-size:20px}.topbar{padding:8px 10px}.stat.scoreStat{display:none}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">汉字 1801–1900 <small>recognition + study</small></div>
    <div class="progress"><i id="progressFill"></i></div>
    <div class="stat" id="cardStat"></div>
    <button class="topbtn" id="shuffleBtn">Shuffle</button>
    <button class="topbtn" id="resetBtn">Reset order</button>
  </header>

  <main class="main">
    <section class="quiz">
      <div class="rankline"><span id="rankLabel"></span></div>
      <div class="character" id="char"></div>
      <div class="pinyin front-pinyin" id="pinyin" aria-hidden="true"></div>
      <div class="prompt">Recognize the character first. Reveal for pinyin, meanings, common words, and fully translated examples.</div>
      <div class="controls">
        <div class="nav"><button class="ghost" id="prevBtn">← Previous</button><button class="ghost" id="nextBtn">Next →</button></div>
        <button class="action" id="revealBtn">Reveal</button>
        <button class="ghost" id="flipBtn">Flip</button>
      </div>
      <div id="detailArea"></div>
    </section>

    <section class="imagepane" id="imagePane">
      <img class="art" id="art" alt="Chinese art and material culture study image">
    </section>
  </main>
</div>
<script>
const BANK = [{"rank":1801,"char":"隶","pinyin":"lì","meanings":["subordinate","scribe","clerical script"],"words":[{"zh":"奴隶","pinyin":"nú lì","en":"slave"},{"zh":"隶属","pinyin":"lì shǔ","en":"be subordinate to"},{"zh":"隶书","pinyin":"lì shū","en":"clerical script"},{"zh":"直隶","pinyin":"Zhí lì","en":"Zhili, old name for Hebei"}],"examples":[{"zh":"古代有许多奴隶在田间劳动。","pinyin":"gǔ dài yǒu hěn duō nú lì zài tián jiān láo dòng.","en":"In ancient times many slaves labored in the fields."},{"zh":"这个部门隶属于教育部。","pinyin":"zhè gè bù mén lì shǔ yú jiào yù bù.","en":"This department is subordinate to the Ministry of Education."},{"zh":"他正在临摹一张隶书。","pinyin":"tā zhèng zài lín mó yì zhāng lì shū.","en":"He is copying a piece of clerical script."}]},{"rank":1802,"char":"履","pinyin":"lǚ","meanings":["shoe","tread","carry out"],"words":[{"zh":"履行","pinyin":"lǚ xíng","en":"carry out; fulfill"},{"zh":"履历","pinyin":"lǚ lì","en":"curriculum vitae"},{"zh":"步履","pinyin":"bù lǚ","en":"gait; footsteps"},{"zh":"西装革履","pinyin":"xī zhuāng gé lǚ","en":"in a suit and leather shoes"}],"examples":[{"zh":"双方必须履行合同。","pinyin":"shuāng fāng bì xū lǚ xíng hé tong.","en":"Both sides must fulfill the contract."},{"zh":"请把履历表填好交给人事部。","pinyin":"qǐng bǎ lǚ lì biǎo tián hǎo jiāo gěi rén shì bù.","en":"Please fill in the CV form and give it to personnel."},{"zh":"老人步履缓慢地走上楼梯。","pinyin":"lǎo rén bù lǚ huǎn màn de zǒu shàng lóu tī.","en":"The old person climbed the stairs with a slow gait."}]},{"rank":1803,"char":"涨","pinyin":"zhǎng","meanings":["rise","swell"],"words":[{"zh":"涨价","pinyin":"zhǎng jià","en":"rise in price"},{"zh":"上涨","pinyin":"shàng zhǎng","en":"go up"},{"zh":"高涨","pinyin":"gāo zhǎng","en":"run high; surge"},{"zh":"涨潮","pinyin":"zhǎng cháo","en":"rising tide"}],"examples":[{"zh":"最近蔬菜又涨价了。","pinyin":"zuì jìn shū cài yòu zhǎng jià le.","en":"Vegetable prices have gone up again recently."},{"zh":"河水因暴雨而上涨。","pinyin":"hé shuǐ yīn bào yǔ ér shàng zhǎng.","en":"The river rose because of the rainstorm."},{"zh":"海边黄昏时开始涨潮。","pinyin":"hǎi biān huáng hūn shí kāi shǐ zhǎng cháo.","en":"The tide begins to rise at dusk by the sea."}]},{"rank":1804,"char":"耀","pinyin":"yào","meanings":["shine","dazzle","glory"],"words":[{"zh":"照耀","pinyin":"zhào yào","en":"shine upon"},{"zh":"荣耀","pinyin":"róng yào","en":"glory; honor"},{"zh":"炫耀","pinyin":"xuàn yào","en":"show off"},{"zh":"耀眼","pinyin":"yào yǎn","en":"dazzling"}],"examples":[{"zh":"阳光照耀着大地。","pinyin":"yáng guāng zhào yào zhe dà dì.","en":"The sunlight shines upon the land."},{"zh":"获奖是全队的荣耀。","pinyin":"huò jiǎng shì quán duì de róng yào.","en":"Winning the prize is the glory of the whole team."},{"zh":"正午的阳光十分耀眼。","pinyin":"zhèng wǔ de yáng guāng shí fēn yào yǎn.","en":"The midday sun is extremely dazzling."}]},{"rank":1805,"char":"扭","pinyin":"niǔ","meanings":["twist","turn","wring"],"words":[{"zh":"扭转","pinyin":"niǔ zhuǎn","en":"turn around; reverse"},{"zh":"扭伤","pinyin":"niǔ shāng","en":"sprain"},{"zh":"扭头","pinyin":"niǔ tóu","en":"turn one's head"},{"zh":"扭曲","pinyin":"niǔ qū","en":"distort; twist"}],"examples":[{"zh":"球队努力扭转落后的局面。","pinyin":"qiú duì nǔ lì niǔ zhuǎn luò hòu de jú miàn.","en":"The team tried hard to reverse the losing situation."},{"zh":"他跑步时扭伤了脚踝。","pinyin":"tā pǎo bù shí niǔ shāng le jiǎo huái.","en":"He sprained his ankle while running."},{"zh":"她扭头向窗外看去。","pinyin":"tā niǔ tóu xiàng chuāng wài kàn qù.","en":"She turned her head and looked out the window."}]},{"rank":1806,"char":"坛","pinyin":"tán","meanings":["altar","forum","world of a pursuit"],"words":[{"zh":"论坛","pinyin":"lùn tán","en":"forum"},{"zh":"花坛","pinyin":"huā tán","en":"flower bed"},{"zh":"祭坛","pinyin":"jì tán","en":"altar"},{"zh":"体坛","pinyin":"tǐ tán","en":"the sports world"}],"examples":[{"zh":"网上论坛讨论很热烈。","pinyin":"wǎng shàng lùn tán tǎo lùn hěn rè liè.","en":"Discussion on the online forum is very heated."},{"zh":"公园中央有一座圆形花坛。","pinyin":"gōng yuán zhōng yāng yǒu yí zuò yuán xíng huā tán.","en":"There is a round flower bed in the center of the park."},{"zh":"天坛是北京著名的祭坛。","pinyin":"Tiān tán shì Běi jīng zhù míng de jì tán.","en":"The Temple of Heaven is a famous altar in Beijing."}]},{"rank":1807,"char":"拨","pinyin":"bō","meanings":["allocate","poke","dial"],"words":[{"zh":"拨款","pinyin":"bō kuǎn","en":"allocate funds"},{"zh":"拨打","pinyin":"bō dǎ","en":"dial; call"},{"zh":"拨开","pinyin":"bō kāi","en":"push aside"},{"zh":"挑拨","pinyin":"tiǎo bō","en":"incite; sow discord"}],"examples":[{"zh":"政府拨款修建新学校。","pinyin":"zhèng fǔ bō kuǎn xiū jiàn xīn xué xiào.","en":"The government allocated funds to build a new school."},{"zh":"请拨打这个电话号码。","pinyin":"qǐng bō dǎ zhè gè diàn huà hào mǎ.","en":"Please dial this telephone number."},{"zh":"他拨开树枝，看见了小路。","pinyin":"tā bō kāi shù zhī, kàn jiàn le xiǎo lù.","en":"He pushed aside the branches and saw the path."}]},{"rank":1808,"char":"沃","pinyin":"wò","meanings":["fertile","rich"],"words":[{"zh":"肥沃","pinyin":"féi wò","en":"fertile"},{"zh":"沃土","pinyin":"wò tǔ","en":"rich soil"},{"zh":"沃野","pinyin":"wò yě","en":"fertile plain"},{"zh":"沃野千里","pinyin":"wò yě qiān lǐ","en":"a thousand li of fertile land"}],"examples":[{"zh":"这片土地十分肥沃。","pinyin":"zhè piàn tǔ dì shí fēn féi wò.","en":"This land is extremely fertile."},{"zh":"农民珍惜家乡的沃土。","pinyin":"nóng mín zhēn xī jiā xiāng de wò tǔ.","en":"Farmers cherish the rich soil of their hometown."},{"zh":"华北平原沃野千里。","pinyin":"Huá běi píng yuán wò yě qiān lǐ.","en":"The North China Plain is a thousand li of fertile land."}]},{"rank":1809,"char":"绘","pinyin":"huì","meanings":["draw","paint"],"words":[{"zh":"绘画","pinyin":"huì huà","en":"painting; drawing"},{"zh":"描绘","pinyin":"miáo huì","en":"depict"},{"zh":"绘图","pinyin":"huì tú","en":"draw a chart or map"},{"zh":"绘声绘色","pinyin":"huì shēng huì sè","en":"vivid; lifelike"}],"examples":[{"zh":"她从小就喜欢绘画。","pinyin":"tā cóng xiǎo jiù xǐ huan huì huà.","en":"She has liked painting since childhood."},{"zh":"小说生动地描绘了乡村生活。","pinyin":"xiǎo shuō shēng dòng de miáo huì le xiāng cūn shēng huó.","  const words=c.words.map(w=>`<div class="wordchip"><div class="wzh">${mark(w.zh,c.char)}</div><div class="wpy">${safe(w.pinyin)}</div><div class="wen">${safe(w.en)}</div></div>`).join('');
 const ex=c.examples.map(x=>`<div class="example"><div class="example-zh">${mark(x.zh,c.char)}</div><div class="example-py">${safe(x.pinyin)}</div><div class="example-en">${safe(x.en)}</div></div>`).join('');
 d.innerHTML=`<div class="reveal"><div class="reveal-head"><div class="reveal-pinyin">${safe(c.pinyin)}</div><p class="definition"><b>${safe(c.char)}</b> — ${c.meanings.map(safe).join('; ')}</p></div><div class="wordtitle">Common words &amp; phrases</div><div class="wordlist">${words}</div><div class="extitle">Example sentences</div><div class="examples">${ex}</div></div>`}
function render(changeImage=true){const c=current();$('char').textContent=c.char;$('pinyin').textContent='';$('rankLabel').textContent=`Frequency rank #${c.rank}`;$('cardStat').textContent=`${pos+1} / ${BANK.length}`;$('progressFill').style.width=((pos+1)/BANK.length*100)+'%';state='front';renderDetail('front');if(changeImage)setImage()}
function move(delta){const oldImg=imageForPosition();pos=Math.max(0,Math.min(BANK.length-1,pos+delta));render(imageForPosition()!==oldImg)}
$('prevBtn').onclick=()=>move(-1);$('nextBtn').onclick=()=>move(1);
$('revealBtn').onclick=()=>{state='revealed';renderDetail('revealed')};$('flipBtn').onclick=()=>{state='flip';renderDetail('flip')};
$('shuffleBtn').onclick=()=>{for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}pos=0;render(true)};
$('resetBtn').onclick=()=>{order=BANK.map((_,i)=>i);pos=0;render(true)};
render(true);
</script>
</body>
</html>
