<html lang="en">
<head>

<title>Chinese Character Study · 2301–2400</title>
<style>
:root{--ink:#14241c;--muted:#5c7064;--paper:#eef4f0;--panel:#f2f7f3;--line:#b4c8bc;--deep:#1a3024;--good:#2a5c3c;--bad:#8a2f27;--gold:#b8a060}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(1200px 700px at 12% -10%,rgba(140,190,160,.32),transparent 52%),linear-gradient(180deg,#3a5c4c 0%,#c4d4c8 42%,#2a4438 100%);color:var(--ink);font-family:Georgia,"Times New Roman","Noto Serif SC","Songti SC",serif;overflow:hidden}
.app{height:100vh;display:grid;grid-template-rows:auto 1fr;gap:0}
.topbar{min-height:58px;display:flex;align-items:center;gap:14px;padding:8px 18px;background:rgba(18,36,28,.96);color:#e8f0ea;border-bottom:2px solid #b8a060}
.brand{font-size:18px;font-weight:700;letter-spacing:.05em;white-space:nowrap}.brand small{font-size:12px;font-weight:400;opacity:.7;margin-left:8px}
.progress{flex:1;max-width:460px;height:7px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:#b8a060;width:1%;transition:width .25s ease}
.stat{font-size:13px;opacity:.88;white-space:nowrap}.topbtn{border:1px solid rgba(255,255,255,.28);background:transparent;color:white;border-radius:8px;padding:7px 10px;cursor:pointer}
.main{min-height:0;display:grid;grid-template-columns:minmax(390px,46%) 1fr;gap:18px;padding:18px}
.quiz{min-height:0;background:rgba(244,248,246,.97);border:2px solid #3a5c50;box-shadow:inset 0 0 0 6px #dce8e0,0 16px 48px rgba(18,36,28,.26);border-radius:4px;padding:18px 22px 16px;display:flex;flex-direction:column;overflow:auto}
.rankline{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.09em}
.character{text-align:center;font-family:"Noto Serif SC","Songti SC","STSong",serif;font-size:clamp(92px,11vw,164px);line-height:.95;margin:8px 0 0;color:#14241c;text-shadow:0 1px 0 #fff}
.pinyin{text-align:center;font-size:clamp(24px,2.6vw,39px);font-style:italic;color:#3a5c50;margin:0 0 8px}
.front-pinyin{display:none}.prompt{text-align:center;font-size:16px;margin:2px 0 8px;color:#5c7064}
button{font:600 13px/1.1 Georgia,serif;letter-spacing:.03em}
.controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:3px 0 7px}.controls .nav{display:flex;gap:6px;margin-right:6px}.ghost,.action{padding:9px 12px;border-radius:8px;cursor:pointer}.ghost{border:1px solid #8aa8ac;background:#e8f0ea;color:#243830}.action{border:1px solid #3a5c50;background:#3a5c50;color:#fff}
.reveal{border-top:1px solid #c5d4d2;padding-top:9px;margin-top:2px;animation:fade .18s ease}.reveal-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:5px}.reveal-pinyin{font-size:clamp(27px,2.8vw,42px);font-style:italic;color:#3a5c50;font-weight:700}.definition{font-size:20px;margin:0}.definition b{color:#2a4a4c}.wordtitle,.extitle{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:#5c7064;margin:9px 0 4px;font-weight:700}.wordlist{display:flex;gap:6px;flex-wrap:wrap}.wordchip{background:#e4eeec;border:1px solid #c3d4d0;border-radius:7px;padding:5px 8px;line-height:1.18}.wordchip .wzh{font-family:"Noto Serif SC","Songti SC",serif;font-size:19px;font-weight:700}.wordchip .wpy{font-size:13px;font-style:italic;color:#4a6a5c}.wordchip .wen{font-size:12px;color:#4f5e5c}.examples{display:grid;gap:5px}.example{padding:6px 9px;background:#eef4f0;border-left:3px solid #3a5c50;border-radius:5px;line-height:1.22}.example-zh{font-family:"Noto Serif SC","Songti SC",serif;font-size:clamp(19px,1.65vw,25px)}.example-py{font-size:clamp(14px,1.1vw,17px);font-style:italic;color:#4a6a5c;margin-top:2px}.example-en{font-size:clamp(13px,1vw,16px);color:#4f463f;margin-top:2px}.example em{font-style:normal;font-weight:800;color:#8d2f21;background:#d7e4de;border-radius:3px;padding:0 .05em}
.flipcard{margin-top:3px;border:1px solid #9ab0b0;border-radius:4px;padding:12px 14px;background:#eef4f0}.flipcard h3{margin:0 0 7px;font-size:15px;color:#4a6a5c;text-transform:uppercase;letter-spacing:.08em}.english-list{font-size:clamp(22px,2vw,32px);line-height:1.2;margin:4px 0 10px}.flipcard .reveal-pinyin{margin:0 0 6px}.further{border:1px solid #3a5c50;background:transparent;color:#3a5c50;border-radius:8px;padding:8px 11px;cursor:pointer}
.imagepane{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;background:rgba(14,24,18,.94);border:2px solid #1a3024;border-radius:4px;overflow:hidden;box-shadow:inset 0 0 0 7px rgba(196,163,106,.22),0 16px 48px rgba(18,36,28,.3)}
.imagepane:before{content:"";position:absolute;inset:8px;border:1px solid rgba(196,163,106,.5);border-radius:3px;pointer-events:none}.art{display:block;max-width:94%;max-height:90%;width:auto;height:auto;object-fit:contain;filter:saturate(.98) contrast(1.02);box-shadow:0 8px 32px rgba(0,0,0,.28);transition:opacity .35s ease,transform .35s ease}.art.wide{max-width:98%;max-height:84%}

@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@media(max-width:900px){body{overflow:auto}.app{height:auto;min-height:100vh}.main{grid-template-columns:1fr;grid-template-rows:auto minmax(360px,55vh)}.quiz{overflow:visible}.imagepane{min-height:420px}.topbar{flex-wrap:wrap}.progress{order:3;flex-basis:100%;max-width:none}}
@media(max-width:520px){.main{padding:9px;gap:9px}.quiz{padding:14px}.brand small{display:none}.character{font-size:104px}.example{font-size:20px}.topbar{padding:8px 10px}.stat.scoreStat{display:none}}
</style>
</head>

ā gāng gāng qǔ dé le shuò shì xué wèi.","en":"He has just obtained a master's degree."}]},{"rank":2305,"char":"钓","pinyin":"diào","meanings":["fish with a hook"],"words":[{"zh":"钓鱼","pinyin":"diào yú","en":"go fishing"},{"zh":"钓竿","pinyin":"diào gān","en":"fishing rod"},{"zh":"垂钓","pinyin":"chuí diào","en":"angle; fish"},{"zh":"沽名钓誉","pinyin":"gū míng diào yù","en":"fish for fame"}],"examples":[{"zh":"周末他喜欢去河边钓鱼。","pinyin":"zhōu mò tā xǐ huan qù hé biān diào yú.","en":"On weekends he likes to go fishing by the river."},{"zh":"老人坐在岸边垂钓。","pinyin":"lǎo rén zuò zài àn biān chuí diào.","en":"The old man sat on the bank angling."}]},{"rank":2306,"char":"蝶","pinyin":"dié","meanings":["butterfly"],"words":[{"zh":"蝴蝶","pinyin":"hú dié","en":"butterfly"},{"zh":"蝶泳","pinyin":"dié yǒng","en":"butterfly stroke"},{"zh":"彩蝶","pinyin":"cǎi dié","en":"colored butterfly"}],"examples":[{"zh":"园里飞着几只蝴蝶。","pinyin":"yuán lǐ fēi zhe jǐ zhī hú dié.","en":"Several butterflies are flying in the garden."},{"zh":"她在比赛中游蝶泳。","pinyin":"tā zài bǐ sài zhōng yóu dié yǒng.","en":"She swam the butterfly stroke in the contest."}]},{"rank":2307,"char":"膝","pinyin":"xī","meanings":["knee"],"words":[{"zh":"膝盖","pinyin":"xī gài","en":"knee"},{"zh":"双膝","pinyin":"shuāng xī","en":"both knees"},{"zh":"促膝","pinyin":"cù xī","en":"sit knee to knee"},{"zh":"膝下","pinyin":"xī xià","en":"at the knees, of children"}],"examples":[{"zh":"他踢球时把膝盖摔伤了。","pinyin":"tā tī qiú shí bǎ xī gài shuāi shāng le.","en":"He hurt his knee playing football."},{"zh":"老人双膝跪在佛像前。","pinyin":"lǎo rén shuāng xī guì zài fó xiàng qián.","en":"The old man knelt on both knees before the Buddha image."}]},{"rank":2308,"char":"姚","pinyin":"Yáo","meanings":["Yao, a surname"],"words":[{"zh":"姓姚","pinyin":"xìng Yáo","en":"surnamed Yao"},{"zh":"姚明","pinyin":"Yáo Míng","en":"Yao Ming"}],"examples":[{"zh":"他姓姚，是东北人。","pinyin":"tā xìng Yáo, shì dōng běi rén.","en":"He is surnamed Yao and is from the northeast."},{"zh":"姚明曾经是著名篮球运动员。","pinyin":"Yáo Míng let order = BANK.map((_,i)=>i), pos=0, state='front';

function norm(s){return (s||'').toLowerCase().replace(/[’'.,!?()\-_/]+/g,' ').replace(/\s+/g,' ').trim()}

function safe(t){return String(t).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function mark(sentence,ch){return safe(sentence).split(safe(ch)).join('<em>'+safe(ch)+'</em>')}
function imageForPosition(){const n=IMAGES.length||1;return Math.floor(pos*n/BANK.length)%n}
function setImage(){const idx=imageForPosition(), img=$('art');img.style.opacity=.15;setTimeout(()=>{img.src=IMAGES[idx]; img.onload=()=>{img.classList.toggle('wide',img.naturalWidth/img.naturalHeight>1.75);img.style.opacity=1}},90)}
function renderDetail(mode){const c=current(), d=$('detailArea'); if(mode==='front'){d.innerHTML='';return}
 if(mode==='flip'){d.innerHTML=`<div class="flipcard"><h3>Pinyin + English</h3><div class="reveal-pinyin">${safe(c.pinyin)}</div><div class="english-list">${c.meanings.map(safe).join(' · ')}</div><button class="further" id="furtherBtn">Reveal further</button></div>`;$('furtherBtn').onclick=()=>{state='revealed';renderDetail('revealed')};return}
 const words=c.words.map(w=>`<div class="wordchip"><div class="wzh">${mark(w.zh,c.char)}</div><div class="wpy">${safe(w.pinyin)}</div><div class="wen">${safe(w.en)}</div></div>`).join('');

function render(changeImage=true){const c=current();$('char').textContent=c.char;$('pinyin').textContent='';$('rankLabel').textContent=`Frequency rank #${c.rank}`;$('cardStat').textContent=`${pos+1} / ${BANK.length}`;$('progressFill').style.width=((pos+1)/BANK.length*100)+'%';state='front';renderDetail('front');if(changeImage)setImage()}
function move(delta){const oldImg=imageForPosition();pos=Math.max(0,Math.min(BANK.length-1,pos+delta));render(imageForPosition()!==oldImg)}
$('prevBtn').onclick=()=>move(-1);$('nextBtn').onclick=()=>move(1);
