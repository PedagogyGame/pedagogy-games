<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Chair</title>
<style>
  :root {
    --bg: #f3eee4;
    --surface: #fff9f0;
    --surface-2: #ebe4d6;
    --fg: #241e18;
    --muted: #6e665c;
    --subtle: #8f877c;
    --primary: #3a5f52;
    --primary-fg: #f6f1e8;
    --border: #d4cbbd;
    --danger: #8b3a2a;
    --ok: #2f6b4f;
    --shadow: 0 0 0 1px color-mix(in oklab, var(--fg) 8%, transparent),
      0 1px 2px color-mix(in oklab, var(--fg) 6%, transparent),
      0 18px 40px color-mix(in oklab, var(--fg) 8%, transparent);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: Georgia, "Times New Roman", serif;
    color: var(--fg);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  button:not(:disabled), [role="button"]:not(:disabled) { cursor: pointer; }
  h1, h2, h3 { text-wrap: balance; margin: 0; }
  p { text-wrap: pretty; }
  .wrap { position: relative; min-height: 100dvh; overflow-x: hidden; }
  .bg {
    position: fixed; inset: 0; z-index: -1; background: var(--bg);
  }
  .bg img {
    width: 100%; height: 100%; object-fit: cover; object-position: center 40%;
  }
  .wash {
    position: absolute; inset: 0;
    background: linear-gradient(180deg,
      color-mix(in oklab, var(--bg) 78%, transparent) 0%,
      color-mix(in oklab, var(--bg) 32%, transparent) 38%,
      color-mix(in oklab, var(--bg) 62%, transparent) 100%);
  }
  header.top { padding: 12px 16px; }
  .brand {
    background: none; border: 0; padding: 0;
    font-size: 1.15rem; letter-spacing: -0.02em;
  }
  .page { max-width: 64rem; margin: 0 auto; padding: 8px 16px 48px; }
  .page.narrow { max-width: 48rem; }
  .page.slim { max-width: 36rem; }
  .kicker {
    font-family: system-ui, sans-serif;
    font-size: 0.75rem; font-weight: 600;
    letter-spacing: 0.22em; text-transform: uppercase; color: var(--primary);
    margin: 0;
  }
  .hero { font-size: clamp(2.8rem, 8vw, 4.5rem); line-height: 0.95; margin: 12px 0 0; }
  .lede { max-width: 28rem; color: var(--muted); line-height: 1.55; }
  .grid { display: grid; gap: 12px; margin-top: 28px; }
  @media (min-width: 640px) { .grid { grid-template-columns: 1fr 1fr; } }
  .panel {
    background: color-mix(in oklab, var(--surface) 92%, transparent);
    box-shadow: var(--shadow);
    border: 0;
    border-radius: 16px;
    padding: 18px 20px;
    text-align: left;
    width: 100%;
  }
  .panel:hover { background: var(--surface); }
  .panel h3 { font-size: 1.6rem; line-height: 1.15; }
  .panel .blurb { color: var(--muted); font-size: 0.95rem; line-height: 1.5; margin: 6px 0 0; font-family: system-ui, sans-serif; }
  .meta {
    display: flex; flex-wrap: wrap; gap: 8px 20px;
    margin-top: 16px; font-family: system-ui, sans-serif;
    font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--subtle);
  }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 44px; padding: 0 16px; border-radius: 8px; border: 0;
    font-family: system-ui, sans-serif; font-size: 0.9rem; font-weight: 600;
  }
  .btn.primary { background: var(--primary); color: var(--primary-fg); }
  .btn.secondary { background: var(--surface); color: var(--fg); box-shadow: 0 0 0 1px var(--border); }
  .btn.ghost { background: transparent; }
  .btn.ghost:hover { background: color-mix(in oklab, var(--fg) 6%, transparent); }
  a.btn { text-decoration: none; color: inherit; }
  .hud { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: flex-end; }
  .seats { display: flex; gap: 4px; }
  .seat { width: 22px; height: 30px; opacity: 0.2; }
  .seat.on { opacity: 1; }
  .seat svg { display: block; }
  .label { font-family: system-ui, sans-serif; font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0; }
  .num { font-size: 1.2rem; margin: 2px 0 0; font-variant-numeric: tabular-nums; }
  .meter { margin: 14px 0 10px; }
  .meter .bar { height: 10px; background: color-mix(in oklab, var(--fg) 10%, transparent); border-radius: 999px; overflow: hidden; }
  .meter .fill {
    height: 100%; border-radius: 999px;
    background: linear-gradient(90deg, color-mix(in oklab, var(--primary) 55%, var(--fg)), var(--primary));
    width: 0%;
  }
  .timer { display: flex; align-items: center; gap: 12px; }
  .timer .bar { flex: 1; height: 6px; background: color-mix(in oklab, var(--fg) 10%, transparent); border-radius: 999px; overflow: hidden; }
  .timer .fill { height: 100%; background: var(--primary); width: 100%; }
  .timer .fill.urgent { background: var(--danger); }
  .timer .sec { width: 3rem; text-align: right; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
  .q { margin-top: 16px; }
  .q h2 { font-size: clamp(1.25rem, 3vw, 1.85rem); line-height: 1.3; margin-top: 8px; }
  .choices { display: grid; gap: 8px; margin-top: 16px; }
  .choice {
    display: flex; gap: 12px; align-items: flex-start;
    min-height: 48px; padding: 12px; border-radius: 10px;
    background: transparent; border: 0; box-shadow: 0 0 0 1px var(--border);
    text-align: left; font-family: system-ui, sans-serif; font-size: 0.95rem; line-height: 1.4;
  }
  .choice .ltr { width: 1.2rem; color: var(--muted); font-family: Georgia, serif; }
  .choice.ok { background: color-mix(in oklab, var(--ok) 14%, transparent); box-shadow: 0 0 0 1px var(--ok); }
  .choice.bad { background: color-mix(in oklab, var(--danger) 16%, transparent); box-shadow: 0 0 0 1px var(--danger); }
  .toast { font-family: system-ui, sans-serif; font-size: 0.9rem; color: var(--muted); margin-top: 14px; }
  .toast.leave { color: var(--danger); }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (min-width: 640px) { .stats { grid-template-columns: 1fr 1fr 1fr; } }
  .stats dt { font-family: system-ui, sans-serif; font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .stats dd { margin: 4px 0 0; font-size: 1.5rem; font-variant-numeric: tabular-nums; }
  input[type="search"], .search {
    width: 100%; height: 44px; border: 0; border-radius: 10px; padding: 0 12px;
    background: var(--surface); box-shadow: 0 0 0 1px var(--border);
    font-family: system-ui, sans-serif; font-size: 0.95rem; color: var(--fg);
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
  .chip {
    height: 36px; padding: 0 12px; border: 0; border-radius: 8px;
    background: var(--surface); font-family: system-ui, sans-serif; font-size: 0.85rem;
  }
  .chip.on { background: var(--primary); color: var(--primary-fg); }
  .term-list { display: grid; gap: 8px; padding: 0; margin: 16px 0 0; list-style: none; }
  .term-list li { padding: 12px 16px; }
  .term-list h3 { font-size: 1.25rem; }
  .term-list p { margin: 4px 0 0; color: var(--muted); font-family: system-ui, sans-serif; font-size: 0.9rem; }
  .how p { color: var(--muted); font-family: system-ui, sans-serif; line-height: 1.6; }
  .right { text-align: right; font-family: system-ui, sans-serif; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="bg" id="backdrop">
    <img id="bgimg" alt="" />
    <div class="wash"></div>
  </div>
  <header class="top"><button class="brand" id="home" type="button">The Chair</button></header>
  <main id="app"></main>
</div>

ion":"Hair cut specifically to contour the client's face.","level":2,"category":"cut"},{"term":"Finish","definition":"The final styling stage and appearance of the haircut.","level":2,"category":"style"},{"term":"Foils","definition":"Metal sheets used to isolate specific strands during coloring.","level":2,"category":"color"},{"term":"Fringe","definition":"The front section of hair cut to fall over the forehead.","level":2,"category":"cut"},{"term":"Guard","definition":"A plastic attachment for clippers that dictates the exact cutting length.","level":2,"category":"tools"},{"term":"Guide","definition":"A cut section of hair used as a length reference for subsequent sections.","level":2,"category":"technique"},{"term":"Hard part","definition":"A distinct parted line shaved directly into the scalp with a trimmer.","level":2,"category":"cut"},{"term":"Heat protectant","definition":"A product applied to shield hair from thermal styling damage.","level":2,"category":"product"},{"term":"High fade","definition":"A fade transition that starts high up on the sides and back.","level":2,"category":"fade"},{"term":"Lineup","definition":"Creating clean boundaries around the forehead, temples, and neck.","level":2,"category":"cut"},{"term":"Low fade","definition":"A fade transition that starts low, sitting just above the ears.","level":2,"category":"fade"},{"term":"Lowlights","definition":"Selected strands of hair dyed darker to create depth.","level":2,"category":"color"},{"term":"Matte","definition":"A product finish that absorbs light and leaves no shine.","level":2,"category":"product"},{"term":"Mid fade","definition":"A fade transition that begins around the middle of the sides.","level":2,"category":"fade"},{"term":"Mousse","definition":"A lightweight styling foam used for volume or curl enhancement.","level":2,"category":"product"},{"term":"Natural neckline","definition":"A finish that follows the client's organic hair growth.","level":2,"category":"cut"},{"term":"Neckline e cutting length.","level":3,"category":"tools"},{"term":"Balayage","definition":"A hand-painted hair lightening technique for natural dimension.","level":3,"category":"color"},{"term":"Blending shears","definition":"Scissors with fine teeth used to remove faint lines between lengths.","level":3,"category":"tools"},{"term":"Blocked neckline","definition":"A sharp, straight horizontal line cut across the back of the neck.","level":3,"category":"cut"},{"term":"Blood-exposure procedure","definition":"The required safety protocol for handling accidental cuts.","level":3,"category":"sanitation"},{"term":"Blunt cut","definition":"Hair cut straight across to create a solid, weighty line.","level":3,"category":"cut"},{"term":"Booth rental","definition":"A setup where a professional rents workspace and operates independently.","level":3,"category":"business"},{"term":"Bulk","definition":"A concentration of hair that makes an area appear or feel heavy.","level":3,"category":"anatomy"},{"term":"Burst fade","definition":"A semicircular fade centered around the ear.","level":3,"category":"fade"},{"term":"Chair rental","definition":"Leasing a specific station within a larger shop.","level":3,"category":"business"},{"term":"Chemical damage","definition":"Weakened or broken hair caused by excessive treatments.","level":3,"category":"chemistry"},{"term":"Client retention","definition":"The rate at which customers return to the shop for future services.","level":3,"category":"business"},{"term":"Clipper-over-comb","definition":"Cutting hair that protrudes through a comb using clippers.","level":3,"category":"technique"},{"term":"Color formula","definition":"The exact mixture of color products and developer used.","level":3,"category":"color"},{"term":"Commission","definition":"Compensation based on a percentage of service revenue.","level":3,"category":"business"},{"term":"Debulk","definition":"The action of removing excess thickness before detailing.","level":3,"category":"technique"},{"term":"Demi-permanent color","definition":"Color that deposits pigment with moderate longevity.","level":3,"category":"color"},{"term":"Density","definition":"The number of hair strands growing per square inch of the scalp.","level":3,"category":"anatomy"},{"term":"Detailing","definition":"The final precision work to perfect lines and soften blends.","level":3,"category":"technique"},{"term":"Developer","definition":"A hydrogen-peroxide solution mixed with color to activate it.","level":3,"category":"chemistry"},{"term":"Disinfection","definition":"Destroying most harmful microorganisms using EPA-registered liquids.","level":3,"category":"sanitation"},{"term":"Double process","definition":"A two-step color service, typically lightening followed by toning.","level":3,"category":"color"},{"term":"Dusting","definition":"Trimming only the extreme tips of the hair to remove damage.","level":3,"category":"cut"},{"term":"Edger","definition":"A smaller, fine-toothed clipper used for close detailing.","level":3,"category":"tools"},{"term":"Elasticity","definition":"The hair's ability to stretch and return to its original shape.","level":3,"category":"anatomy"},{"term":"Enhancement","definition":"Temporary color sprays applied to make hairlines look sharper.","level":3,"category":"color"},{"term":"EPA-registered disinfectant","definition":"An approved antimicrobial liquid used to sanitize tools.","level":3,"category":"sanitation"},{"term":"Foil shaver","definition":"An electric finishing tool used to take stubble down to bare skin.","level":3,"category":"tools"},{"term":"Freehand","definition":"Cutting hair visually without the strict guide of a comb or guard.","level":3,"category":"technique"},{"term":"Glaze","definition":"A semi-permanent color service used to add high shine.","level":3,"category":"color"},{"term":"Gloss","definition":"A color service used primarily to adjust tone and add luster.","level":3,"category":"color"},{"term":"Growth pattern","definition":"The natural direction in which a person's hair emerges from the scalp.","level":3,"category":"anatomy"},{"term":"Guideline","definition":"The initial cut established around the head that determines a fade's placement.","level":3,"category":"technique"},{"term":"Keratin treatment","definition":"A smoothing chemical service that reduces frizz.","level":3,"category":"chemistry"},{"term":"Lever","definition":"The side mechanism on clippers that opens or closes the cutting blade.","level":3,"category":"tools"},{"term":"Lightener","definition":"A professional chemical product used to strip pigment from hair.","level":3,"category":"chemistry"},{"term":"Line","definition":"A visible, heavy boundary where different hair lengths meet.","level":3,"category":"cut"},{"term":"Neck strip","definition":"A disposable paper barrier placed between the skin and the cape.","level":3,"category":"sanitation"},{"term":"New growth","definition":"Untreated hair that has grown in since the last chemical service.","level":3,"category":"color"},{"term":"No guard","definition":"Using clippers bare-bladed without a plastic attachment.","level":3,"category":"technique"},{"term":"One-length cut","definition":"Hair cut to a single perimeter length without internal layers.","level":3,"category":"cut"},{"term":"Overprocessing","definition":"Severe structural damage caused by leaving chemicals on too long.","level":3,"category":"chemistry"},{"term":"Patch test","definition":"A skin test used to check for potential allergic reactions.","level":3,"category":"sanitation"},{"term":"Perimeter","definition":"The outer boundary or distinct outline of the entire haircut.","level":3,"category":"cut"},{"term":"Retail","definition":"Salon products sold directly to clients for home use.","level":3,"category":"business"},{"term":"Root lift","definition":"A styling technique focused on creating vertical volume at the scalp.","level":3,"category":"style"},{"term":"Root shadow","definition":"A darker color applied at the th used to erase faint lines between lengths. Which shears?"}],"contrasts":[{"prompt":"Which fade is taken to bare skin at its shortest point, without specifying a foil shaver or razor?","answer":"Bald fade","options":["Bald fade","Shadow fade","Taper","Mid fade"]},{"prompt":"Which fade is taken completely to the skin with a foil shaver or razor?","answer":"Skin fade","options":["Skin fade","Low fade","Taper","Burst fade"]},{"prompt":"Which fade dips lower behind the ear instead of staying level?","answer":"Drop fade","options":["Drop fade","High fade","Burst fade","Shadow fade"]},{"prompt":"Which is a gradual shortening isolated only to the sideburns and neckline?","answer":"Taper","options":["Taper","High fade","Undercut","Burst fade"]},{"prompt":"Which neckline follows the client's organic hair growth?","answer":"Natural neckline","options":["Natural neckline","Blocked neckline","Squared neckline","Rounded neckline"]},{"prompt":"Which neckline is a sharp straight horizontal line across the nape?","answer":"Blocked neckline","options":["Blocked neckline","Natural neckline","Rounded neckline","Fringe"]},{"prompt":"Which neckline has ninety-degree corners across the nape?","answer":"Squared neckline","options":["Squared neckline","Rounded neckline","Natural neckline","Hard part"]},{"prompt":"Which term is the formal pre-service discussion of goals and limitations?","answer":"Consultation","options":["Consultation","Consult","Rebook","Turn"]},{"prompt":"Which term is simply the shortened shop word for that pre-service talk?","answer":"Consult","options":["Consult","Consultation","Service ticket","Rotation"]},{"prompt":"Which process destroys all microbial life, typically in an autoclave?","answer":"Sterilization","options":["Sterilization","Disinfection","Turnover","Contact time"]},{"prompt":"Which process destroys most harmful microorganisms with EPA-registered liquids?","answer":"Disinfection","options":["Disinfection","Sterilization","Patch test","Strand test"]},{ function shuffle(arr) {
  const copy = arr.slice();
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}
function pickN(arr, n) { return shuffle(arr).slice(0, n); }
function clamp(n, a, b) { return Math.min(b, Math.max(a, n)); }
function penaltyFor(level) { return level === 2 ? 20 : level === 3 ? 25 : 30; }
function baseSeconds(level) { return level === 2 ? 15 : level === 3 ? 17 : 20; }
function secondsFor(kind, level, prompt, options) {
  let s = baseSeconds(level);
  if (kind === "scenario" || kind === "contrast") s += 2;
  if (kind === "definition") s += 3;
  if (prompt.length > 110) s += 2;
  if (prompt.length > 170) s += 2;
  if (Math.max(...options.map((o) => o.length)) > 70) s += 2;
  return Math.min(24, Math.max(15, s));
}
function kindLabel(kind) {
  return kind === "term" ? "Name the term" : kind === "definition" ? "What does this mean" : kind === "scenario" ? "On the floor" : "Call it";
}
function scoreShift(track, answers, completed, maxStreak) {
  const mult = track === "floor" ? 1 : track === "professional" ? 1.35 : track === "master" ? 1.7 : 1.5;
  let points = 0;
  for (const a of answers) {
    if (!a.correct) continue;
    points += 100;
    if (a.fast) points += 50;
    points += Math.round(Math.max(0, 8 - a.elapsed) * 4);
  }
  points += maxStreak * 20;
  if (completed) points += 200;
  return Math.round(points * mult);
}
function readBest() {
  try { return JSON.parse(localStorage.getItem(BEST_KEY) || "{}"); } catch { return {}; }
}
function writeBest(best) {
  try { localStorage.setItem(BEST_KEY, JSON.stringify(best)); } catch {}
}

const TERM_BY_NAME = new Map(DATA.terms.map((t) => [t.term, t]));

function distractors(target, count) {
  const sameCat = DATA.terms.filter((t) => t.term !== target.term && t.category === target.category);
  const sameLv = DATA.terms.filter((t) => t.term !== target.term && t.level === target.level);
  const pool = sameCat.length >= count ? sameCat : sameCat.concat(sameLv);
  const uniq = new Map(pool.map((t) => [t.term, t]));
  uniq.delete(target.term);
  let picked = pickN([...uniq.values()], count);
  if (picked.length < count) {
    const fb = DATA.terms.filter((t) => t.term !== target.term && !uniq.has(t.term));
    picked = picked.concat(pickN(fb, count - picked.length));
  }
  return picked;
}
function makeTermQ(term) {
  const options = shuffle([term.term, ...distractors(term, 3).map((t) => t.term)]);
  return { id: "term-" + term.term, kind: "term", level: term.level, prompt: term.definition, options, answer: term.term, seconds: secondsFor("term", term.level, term.definition, options), penalty: penaltyFor(term.level) };
}
function makeDefQ(term) {
  const options = shuffle([term.definition, ...distractors(term, 3).map((t) => t.definition)]);
  return { id: "def-" + term.term, kind: "definition", level: term.level, prompt: term.term, options, answer: term.definition, seconds: secondsFor("definition", term.level, term.term, options), penalty: penaltyFor(term.level) };
}
function makeSceneQ(term, prompt) {
  const options = shuffle([term.term, ...distractors(term, 3).map((t) => t.term)]);
  return { id: "scene-" + term.term, kind: "scenario", level: term.level, prompt, options, answer: term.term, seconds: secondsFor("scenario", term.level, prompt, options), penalty: penaltyFor(term.level) };
}
function buildForLevel(level, count) {
  const terms = shuffle(DATA.terms.filter((t) => t.level === level));
  const scenes = shuffle(DATA.scenarios.filter((s) => TERM_BY_NAME.get(s.term)?.level === level));
  const contrasts = shuffle(DATA.contrasts.filter((c) => TERM_BY_NAME.get(c.answer)?.level === level));
  const used = new Set();
  const out = [];
  const takeS = Math.min(Math.ceil(count * 0.25), scenes.length);
  const takeC = Math.min(Math.ceil(count * 0.15), contrasts.length);
  const takeD = Math.min(Math.ceil(count * 0.25), terms.length);
  for (const s of scenes) {
    if (out.length >= takeS) break;
    const t = TERM_BY_NAME.get(s.term);
    if (!t || used.has(t.term)) continue;
    used.add(t.term); out.push(makeSceneQ(t, s.prompt));
  }
  for (const c of contrasts) {
    if (out.filter((q) => q.kind === "contrast").length >= takeC) break;
    if (used.has(c.answer)) continue;
    used.add(c.answer);
    const t = TERM_BY_NAME.get(c.answer);
    const options = shuffle(c.options.slice());
    out.push({ id: "contrast-" + c.answer, kind: "contrast", level: t.level, prompt: c.prompt, options, answer: c.answer, seconds: secondsFor("contrast", t.level, c.prompt, options), penalty: penaltyFor(t.level) });
  }
  let d = 0;
  for (const t of terms) {
    if (d >= takeD) break;
    if (used.has(t.term)) continue;
    used.add(t.term); out.push(makeDefQ(t)); d++;
  }
  for (const t of terms) {
    if (out.length >= count) break;
    if (used.has(t.term)) continue;
    used.add(t.term); out.push(makeTermQ(t));
  }
  return shuffle(out).slice(0, count);
}
function buildShift(track) {
  if (track === "mixed") return buildForLevel(2, 4).concat(buildForLevel(3, 4), buildForLevel(4, 4));
  return buildForLevel(track === "floor" ? 2 : track === "professional" ? 3 : 4, 12);
}

    return `<button class="panel" data-start="${id}">
      <h3>${m.label}</h3>
      <p class="blurb">${m.blurb}</p>
      <div class="meta"><span>${m.seconds}</span><span>Miss ${m.miss}</span>${best[id] ? `<span>Best ${best[id]}</span>` : ""}</div>
    </button>`;
  }).join("");
  document.getElementById("app").innerHTML = `<div class="page">
    <p class="kicker">Walk-in quiz</p>
    <h1 class="hero">The Chair</h1>
    <p class="lede">A timed floor test for barbers and stylists. Hold the Hair Master meter. Keep the bench full. Wrong calls walk a guest out the door.</p>
    <div class="grid">${cards}</div>
    <div class="row">
      <a class="btn secondary" href="/download">Save HTML file</a>
      <button class="btn ghost" data-view="how">How a shift works</button>
      <button class="btn ghost" data-view="study">Study the book</button>
      <button class="btn ghost" data-view="board">Shop board</button>
    </div>
  </div>`;
}

function renderPlay() {
  setBg("chair");
  const q = state.questions[state.index];
  if (!q) return;
  const last = state.answers[state.answers.length - 1];
  const revealing = state.phase === "reveal";
  const choices = q.options.map((opt, i) => {
    let cls = "choice";
    if (revealing && opt === q.answer) cls += " ok";
    else if (revealing && state.selected === i) cls += " bad";
    return `<button class="${cls}" data-pick="${i}" ${revealing ? "disabled" : ""}><span class="ltr">${LETTERS[i]}</span><span>${esc(opt)}</span></button>`;
  }).join("");
  const ratio = Math.max(0, state.remaining / q.seconds);
  const urgent = state.remaining <= 5;
  const toast = state.toast ? `<p class="toast ${state.toast.kind === "leave" || state.toast.kind === "gone" ? "leave" : ""}">${esc(state.toast.text)}</p>` : "";
  const missLine = revealing && last && !last.correct
    ? `<p class="toast">${last.timedOut ? "Time. " : "Not that. "}Correct term: <strong>${esc(q.answer)}</strong></p>` : "";
  document.getElementById("app").innerHTML = `<div class="page narrow">
    <div class="hud">
      <div style="display:flex;align-items:flex-end;gap:12px">${seats(state.waiting)}<div><p class="label">Waiting</p><p class="num">${state.waiting}</p></div></div>
      <div class="right"><p class="label">${LEVEL_LABEL[q.level]} · ${state.index + 1} / 12</p><p class="num" style="color:${state.streak > 1 ? "var(--primary)" : "var(--subtle)"}">${state.streak > 1 ? state.streak + " streak" : "Keys 1–4"}</p></div>
    </div>
    <div class="meter">
      <div class="hud"><p class="label">Hair Master</p><p class="num" style="color:${state.meter <= 25 ? "var(--danger)" : "var(--primary)"}">${state.meter}%</p></div>
      <div class="bar"><div class="fill" style="width:${state.meter}%"></div></div>
    </div>
    <div class="timer">
      <div class="bar"><div class="fill ${urgent ? "urgent" : ""}" id="tfill" style="width:${ratio * 100}%"></div></div>
      <span class="sec" id="tsec">${Math.max(0, state.remaining).toFixed(1)}</span>
    </div>
    <section class="panel q">
      <p class="kicker">${kindLabel(q.kind)}</p>
      <h2>${esc(q.prompt)}</h2>
      ${q.kind === "definition" ? '<p class="blurb">Choose the matching definition.</p>' : ""}
      <div class="choices">${choices}</div>
      ${missLine}
    </section>
    ${toast}
  </div>`;
}

function renderResult() {
  setBg("chair");
  const correct = state.answers.filter((a) => a.correct).length;
  const fast = state.answers.filter((a) => a.fast).length;
  const completed = state.answers.length >= state.questions.length && state.meter > 0;
  const accuracy = state.answers.length ? Math.round((correct / state.answers.length) * 100) : 0;
  const score = scoreShift(state.track, state.answers, completed, state.maxStreak);
  const rank = !completed && state.meter <= 0 ? "Off the chair" : accuracy >= 90 && state.meter >= 80 ? "Master of the Chair" : accuracy >= 75 ? "Chair ready" : accuracy >= 55 ? "Journeyman" : "Apprentice";
  const best = Math.max(state.best[state.track] || 0, score);
  document.getElementById("app").innerHTML = `<div class="page slim">
    <p class="kicker">${TRACKS[state.track].label} shift</p>
    <h1 class="hero" style="font-size:2.6rem">${rank}</h1>
    <p class="lede">${completed ? `You held the chair. ${state.waiting} still waiting.` : "The meter ran out before the last ticket."}</p>
    <dl class="panel stats" style="margin-top:20px">
      <div><dt>Score</dt><dd>${score.toLocaleString()}</dd></div>
      <div><dt>Accuracy</dt><dd>${accuracy}%</dd></div>
      <div><dt>Fast calls</dt><dd>${fast}</dd></div>
      <div><dt>Correct</dt><dd>${correct}/${state.answers.length}</dd></div>
      <div><dt>Best streak</dt><dd>${state.maxStreak}</dd></div>
      <div><dt>Meter</dt><dd>${state.meter}%</dd></div>
    </dl>
    <p class="toast">Best on this book: <strong>${best}</strong></p>
    <div class="row">
      <button class="btn primary" data-start="${state.track}">Run it back</button>
      <button class="btn secondary" data-view="title">Change the book</button>
      <button class="btn ghost" data-view="board">Shop board</button>
    </div>
  </div>`;
}

function renderHow() {
  setBg("shop");
  document.getElementById("app").innerHTML = `<div class="page slim">
    <div class="hud"><div><p class="kicker">House rules</p><h1 class="hero" style="font-size:2.4rem">How a shift works</h1></div>
    <button class="btn secondary" data-view="title">Back</button></div>
    <div class="panel how" style="margin-top:20px">
      <p>You take twelve tickets. Each one is a definition, a reverse lookup, a floor scenario, or a contrast between two close terms.</p>
      <p>The clock is fifteen seconds on short Floor language, stretching to twenty on longer copy and Master questions.</p>
      <p>The Hair Master meter starts at 80%. A miss or a timeout drops it by 20% on the Floor, 25% in Professional, and 30% in Master. A correct answer in half the allotted time adds 10%. A regular correct adds 4%.</p>
      <p>After a miss, the right term stays on the ticket for two seconds. Misses also walk a guest off the waiting bench. Fast calls can sit someone back down.</p>
      <p>If the meter hits zero, you are off the chair.</p>
    </div>
  </div>`;
}

function renderStudy(query, level, category) {
  setBg("shop");
  query = query || "";
  level = level || "all";
  category = category || "all";
  const cats = ["fade","cut","style","color","tools","sanitation","business","anatomy","chemistry","technique","product"];
  const list = DATA.terms.filter((t) => {
    if (level !== "all" && String(t.level) !== String(level)) return false;
    if (category !== "all" && t.category !== category) return false;
    const n = query.trim().toLowerCase();
    if (!n) return true;
    return t.term.toLowerCase().includes(n) || t.definition.toLowerCase().includes(n);
  });
  document.getElementById("app").innerHTML = `<div class="page narrow">
    <div class="hud"><div><p class="kicker">The book</p><h1 class="hero" style="font-size:2.4rem">Study</h1></div>
    <button class="btn secondary" data-view="title">Back</button></div>
    <input class="search" id="qsearch" type="search" placeholder="Search a term or definition" value="${esc(query)}" style="margin-top:18px" />
    <div class="chips" id="lvls">
      ${[["all","All books"],["2","Floor"],["3","Professional"],["4","Master"]].map(([v,l]) => `<button class="chip ${level===v?"on":""}" data-level="${v}">${l}</button>`).join("")}
    </div>
    <div class="chips" id="cats">
      <button class="chip ${category==="all"?"on":""}" data-cat="all">All desks</button>
      ${cats.map((c) => `<button class="chip ${category===c?"on":""}" data-cat="${c}">${c}</button>`).join("")}
    </div>
    <p class="toast">${list.length} terms</p>
    <ul class="term-list">${list.map((t) => `<li class="panel"><div class="hud"><h3>${esc(t.term)}</h3><span class="label">${LEVEL_LABEL[t.level]} · ${t.category}</span></div><p>${esc(t.definition)}</p></li>`).join("")}</ul>
  </div>`;
  const input = document.getElementById("qsearch");
  input.focus();
  input.setSelectionRange(input.value.length, input.value.length);
  input.oninput = () => renderStudy(input.value, level, category);
  document.getElementById("lvls").onclick = (e) => {
    const b = e.target.closest("[data-level]");
    if (b) renderStudy(document.getElementById("qsearch").value, b.dataset.level, category);
  };
  document.getElementById("cats").onclick = (e) => {
    const b = e.target.closest("[data-cat]");
    if (b) renderStudy(document.getElementById("qsearch").value, level, b.dataset.cat);
  };
}

function renderBoard() {
  setBg("shop");
  const entries = Object.entries(state.best);
  const body = entries.length
    ? `<ul class="term-list">${entries.map(([t,s]) => `<li class="panel hud"><span>${TRACKS[t]?.label || t}</span><strong class="num">${s}</strong></li>`).join("")}</ul>`
    : `<p class="panel toast">No local bests yet. Finish a shift and it stays on this desk.</p>`;
  document.getElementById("app").innerHTML = `<div class="page slim">
    <div class="hud"><div><p class="kicker">Front desk</p><h1 class="hero" style="font-size:2.4rem">Shop board</h1></div>
    <button class="btn secondary" data-view="title">Back</button></div>
    ${body}
  </div>`;
}

function render() {
  window.scrollTo(0, 0);
  if (state.view === "title") renderTitle();
  else if (state.view === "play") renderPlay();
  else if (state.view === "result") renderResult();
  else if (state.view === "how") renderHow();
  else if (state.view === "study") renderStudy();
  else if (state.view === "board") renderBoard();
}

function stopLoop() {
  if (raf) cancelAnimationFrame(raf);
  raf = 0;
}

function startLoop() {
  stopLoop();
  lastNow = 0;
  revealAcc = 0;
  const loop = (now) => {
    if (!lastNow) lastNow = now;
    const dt = Math.min((now - lastNow) / 1000, 0.1);
    lastNow = now;
    if (document.hidden) { raf = requestAnimationFrame(loop); return; }
    const q = state.questions[state.index];
    if (!q) return;
    if (state.phase === "answering") {
      state.remaining -= dt;
      state.elapsed += dt;
      const tfill = document.getElementById("tfill");
      const tsec = document.getElementById("tsec");
      if (tfill) {
        tfill.style.width = Math.max(0, state.remaining / q.seconds) * 100 + "%";
        tfill.classList.toggle("urgent", state.remaining <= 5);
      }
      if (tsec) tsec.textContent = Math.max(0, state.remaining).toFixed(1);
      if (state.remaining <= 0) {
        state.remaining = 0;
        applyOutcome(false, false, true, q.seconds, null);
        return;
      }
    } else if (state.phase === "reveal") {
      revealAcc += dt;
      if (revealAcc >= 2) {
        advance();
        return;
      }
    }
    raf = requestAnimationFrame(loop);
  };
  raf = requestAnimationFrame(loop);
}

function start(track) {
  state.view = "play";
  state.track = track;
  state.questions = buildShift(track);
  state.index = 0;
  state.meter = 80;
  state.waiting = 5;
  state.answers = [];
  state.streak = 0;
  state.maxStreak = 0;
  state.phase = "answering";
  state.selected = null;
  state.toast = { kind: "stay", text: "Five on the bench. Your chair is open." };
  const q = state.questions[0];
  state.remaining = q ? q.seconds : 15;
  state.elapsed = 0;
  render();
  startLoop();
}

function applyOutcome(correct, fast, timedOut, elapsed, picked) {
  if (state.phase !== "answering") return;
  const q = state.questions[state.index];
  if (!q) return;
  if (correct) {
    state.streak += 1;
    state.meter = clamp(state.meter + (fast ? 10 : 4), 0, 100);
    if (fast && state.waiting < 5) {
      state.waiting += 1;
      state.toast = { kind: "fast", text: NAMES[Math.floor(Math.random()*NAMES.length)] + " sat down. Fast call — Hair Master +10%." };
    } else if (fast) {
      state.toast = { kind: "fast", text: "Half-time call. Hair Master +10%." };
    } else {
      state.toast = { kind: "stay", text: "Clean. Hair Master +4%." };
    }
  } else {
    state.streak = 0;
    state.meter = clamp(state.meter - q.penalty, 0, 100);
    if (state.waiting > 0) {
      state.waiting -= 1;
      const who = NAMES[Math.floor(Math.random()*NAMES.length)];
      state.toast = { kind: state.meter <= 0 ? "gone" : "leave", text: state.meter <= 0 ? who + " left. You are off the chair." : who + " stood up and walked out. Hair Master −" + q.penalty + "%." };
    } else {
      state.toast = { kind: state.meter <= 0 ? "gone" : "leave", text: state.meter <= 0 ? "The bench is empty. You are off the chair." : "Miss. Hair Master −" + q.penalty + "%." };
    }
  }
  state.maxStreak = Math.max(state.maxStreak, state.streak);
  state.answers.push({ correct, fast, timedOut, elapsed, picked });
  state.phase = "reveal";
  state.selected = picked == null ? -1 : q.options.indexOf(picked);
  revealAcc = 0;
  render();
  startLoop();
}

function pick(i) {
  if (state.phase !== "answering") return;
  const q = state.questions[state.index];
  const picked = q.options[i];
  const correct = picked === q.answer;
  const fast = correct && state.elapsed <= q.seconds / 2;
  applyOutcome(correct, fast, false, state.elapsed, picked);
}

function advance() {
  if (state.phase !== "reveal") return;
  const next = state.index + 1;
  const done = state.meter <= 0 || next >= state.questions.length;
  if (done) {
    const correct = state.answers.filter((a) => a.correct).length;
    const completed = state.answers.length >= state.questions.length && state.meter > 0;
    const accuracy = state.answers.length ? Math.round((correct / state.answers.length) * 100) : 0;
    const score = scoreShift(state.track, state.answers, completed, state.maxStreak);
    if (score > (state.best[state.track] || 0)) {
      state.best[state.track] = score;
      writeBest(state.best);
    }
    state.phase = "over";
    state.view = "result";
    stopLoop();
    render();
    return;
  }
  state.index = next;
  state.phase = "answering";
  state.selected = null;
  state.remaining = state.questions[next].seconds;
  state.elapsed = 0;
  render();
  startLoop();
}

document.getElementById("home").onclick = () => {
  stopLoop();
  state.view = "title";
  render();
};
document.getElementById("app").addEventListener("click", (e) => {
  const startBtn = e.target.closest("[data-start]");
  if (startBtn) { start(startBtn.dataset.start); return; }
  const viewBtn = e.target.closest("[data-view]");
  if (viewBtn) { stopLoop(); state.view = viewBtn.dataset.view; render(); return; }
  const pickBtn = e.target.closest("[data-pick]");
  if (pickBtn) { pick(Number(pickBtn.dataset.pick)); }
});
window.addEventListener("keydown", (e) => {
  if (state.view !== "play" || state.phase !== "answering") return;
  const map = { "1":0,"2":1,"3":2,"4":3,a:0,b:1,c:2,d:3 };
  const i = map[e.key.toLowerCase()];
  if (i === undefined) return;
  pick(i);
});

render();
</script>
</body>
</html>
