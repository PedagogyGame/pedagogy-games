<title>Chinese Character Study · 3201–3300</title>
<style>
:root{--ink:#142018;--muted:#5a7868;--paper:#eef4f0;--panel:#f2f7f4;--line:#b8ccc4;--deep:#1a2820;--good:#3a6850;--bad:#8a2f27;--gold:#5a9070}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(1200px 700px at 12% -10%,rgba(80,150,110,.32),transparent 52%),linear-gradient(180deg,#243830 0%,#c8d8d0 42%,#18241c 100%);color:var(--ink);font-family:Georgia,"Times New Roman","Noto Serif SC","Songti SC",serif;overflow:hidden}
.app{height:100vh;display:grid;grid-template-rows:auto 1fr;gap:0}
.topbar{min-height:58px;display:flex;align-items:center;gap:14px;padding:8px 18px;background:rgba(16,32,24,.96);color:#e4f0e8;border-bottom:2px solid #5a9070}
.brand{font-size:18px;font-weight:700;letter-spacing:.05em;white-space:nowrap}.brand small{font-size:12px;font-weight:400;opacity:.7;margin-left:8px}
.progress{flex:1;max-width:460px;height:7px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:#5a9070;width:1%;transition:width .25s ease}
.stat{font-size:13px;opacity:.88;white-space:nowrap}.topbtn{border:1px solid rgba(255,255,255,.28);background:transparent;color:white;border-radius:8px;padding:7px 10px;cursor:pointer}
.main{min-height:0;display:grid;grid-template-columns:minmax(390px,46%) 1fr;gap:18px;padding:18px}
.quiz{min-height:0;background:rgba(242,247,244,.97);border:2px solid #3a6858;box-shadow:inset 0 0 0 6px #dce8e0,0 16px 48px rgba(16,32,24,.26);border-radius:4px;padding:18px 22px 16px;display:flex;flex-direction:column;overflow:auto}

.character{text-align:center;font-family:"Noto Serif SC","Songti SC","STSong",serif;font-size:clamp(92px,11vw,164px);line-height:.95;margin:8px 0 0;color:#142018;text-shadow:0 1px 0 #fff}
.pinyin{text-align:center;font-size:clamp(24px,2.6vw,39px);font-style:italic;color:#3a6858;margin:0 0 8px}
.front-pinyin{display:none}.prompt{text-align:center;font-size:16px;margin:2px 0 8px;color:#5a7868}
button{font:600 13px/1.1 Georgia,serif;letter-spacing:.03em}
.controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:3px 0 7px}.controls .nav{display:flex;gap:6px;margin-right:6px}.ghost,.action{padding:9px 12px;border-radius:8px;cursor:pointer}.ghost{border:1px solid #6a9080;background:#e4f0e8;color:#1a2820}.action{border:1px solid #3a6858;background:#3a6858;color:#fff}
.reveal{border-top:1px solid #b8d0c4;padding-top:9px;margin-top:2px;animation:fade .18s ease}.reveal-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:5px}.reveal-pinyin{font-size:clamp(27px,2.8vw,42px);font-style:italic;color:#3a6858;font-weight:700}.definition{font-size:20px;margin:0}.definition b{color:#2a4838}.wordtitle,.extitle{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:#5a7868;margin:9px 0 4px;font-weight:700}.wordlist{display:flex;gap:6px;flex-wrap:wrap}.wordchip{background:#e4f0e8;border:1px solid #b8d0c4;border-radius:7px;padding:5px 8px;line-height:1.18}.wordchip .wzh{font-family:"Noto Serif SC","Songti SC",serif;font-size:19px;font-weight:700}.wordchip .wpy{font-size:13px;font-style:italic;color:#3a6858}.wordchip .wen{font-size:12px;color:#4f6458}.examples{display:grid;gap:5px}.example{padding:6px 9px;background:#eef4f0;border-left:3px solid #3a6858;border-radius:5px;line-height:1.22}.example-zh{font-family:"Noto Serif SC","Songti SC",serif;font-size:clamp(19px,1.65vw,25px)}.example-py{font-size:clamp(14px,1.1vw,17px);font-style:italic;color:#3a6858;margin-top:2px}.example-en{font-size:clamp(13px,1vw,16px);color:#3f5448;margin-top:2px}.example em{font-style:normal;font-weight:800;color:#8d2f21;background:#d0e4d8;border-radius:3px;padding:0 .05em}
.flipcard{margin-top:3px;border:1px solid #80a090;border-radius:4px;padding:12px 14px;background:#eef4f0}.flipcard h3{margin:0 0 7px;font-size:15px;color:#3a6858;text-transform:uppercase;letter-spacing:.08em}.english-list{font-size:clamp(22px,2vw,32px);line-height:1.2;margin:4px 0 10px}.flipcard .reveal-pinyin{margin:0 0 6px}.further{border:1px solid #3a6858;background:transparent;color:#3a6858;border-radius:8px;padding:8px 11px;cursor:pointer}
.imagepane{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;background:rgba(16,28,20,.94);border:2px solid #1a2820;border-radius:4px;overflow:hidden;box-shadow:inset 0 0 0 7px rgba(80,140,110,.22),0 16px 48px rgba(16,32,24,.3)}
.imagepane:before{content:"";position:absolute;inset:8px;border:1px solid rgba(80,140,110,.5);border-radius:3px;pointer-events:none}.art{display:block;max-width:94%;max-height:90%;width:auto;height:auto;object-fit:contain;filter:saturate(.98) contrast(1.02);box-shadow:0 8px 32px rgba(0,0,0,.28);transition:opacity .35s ease,transform .35s ease}.art.wide{max-width:98%;max-height:84%}

@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@media(max-width:900px){body{overflow:auto}.app{height:auto;min-height:100vh}.main{grid-template-columns:1fr;grid-template-rows:auto minmax(360px,55vh)}.quiz{overflow:visible}.imagepane{min-height:420px}.topbar{flex-wrap:wrap}.progress{order:3;flex-basis:100%;max-width:none}}
@media(max-width:520px){.main{padding:9px;gap:9px}.quiz{padding:14px}.brand small{display:none}.character{font-size:104px}.example{font-size:20px}.topbar{padding:8px 10px}.stat.scoreStat{display:none}}
</style>
</head>
