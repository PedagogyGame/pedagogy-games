<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Chinese Word Study · 201–300</title>
<style>
:root{--ink:#15241c;--muted:#5a7464;--paper:#eef5ef;--panel:#f4f8f4;--line:#c4d4c8;--deep:#1a2c22;--good:#3d6b58;--bad:#8a2f27;--gold:#b8a050;--celadon:#3d6b58;--inkstone:#243830}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(1100px 640px at 10% -8%,rgba(61,107,88,.40),transparent 54%),linear-gradient(180deg,#243830 0%,#d4ddd0 44%,#1a241c 100%);color:var(--ink);font-family:Georgia,"Times New Roman","Noto Serif SC","Songti SC",serif;overflow:hidden}
.app{height:100vh;display:grid;grid-template-rows:auto 1fr;gap:0}
.topbar{min-height:58px;display:flex;align-items:center;gap:14px;padding:8px 18px;background:linear-gradient(90deg,#1a2c22,#3d6b58 46%,#1a2c22);color:#eaf2ea;border-bottom:3px solid #b8a050;box-shadow:0 1px 0 #2a4034}
.brand{font-size:18px;font-weight:700;letter-spacing:.06em;white-space:nowrap}.brand small{font-size:12px;font-weight:400;opacity:.72;margin-left:8px}
.progress{flex:1;max-width:460px;height:7px;background:rgba(255,255,255,.14);border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:linear-gradient(90deg,#b8a050,#3d6b58);width:1%;transition:width .25s ease}
.stat{font-size:13px;opacity:.9;white-space:nowrap}.topbtn{border:1px solid rgba(184,160,80,.55);background:transparent;color:#eaf2ea;border-radius:4px;padding:7px 10px;cursor:pointer}
.main{min-height:0;display:grid;grid-template-columns:minmax(400px,46%) 1fr;gap:18px;padding:18px}
.quiz{min-height:0;background:rgba(244,248,244,.98);border:3px solid #3d6b58;box-shadow:inset 0 0 0 7px #e6efe8,inset 0 0 0 8px #b8a050,0 18px 50px rgba(26,36,28,.32);border-radius:2px;padding:20px 24px 16px;display:flex;flex-direction:column;overflow:auto}
.rankline{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.12em}
.character{text-align:center;font-family:"Noto Serif SC","Songti SC","STSong",serif;font-size:clamp(78px,9.2vw,128px);line-height:.95;margin:10px 0 2px;color:#15241c;text-shadow:0 1px 0 #fff;letter-spacing:.04em}
.pinyin{text-align:center;font-size:clamp(22px,2.4vw,36px);font-style:italic;color:#3d6b58;margin:0 0 8px}
.front-pinyin{display:none}.prompt{text-align:center;font-size:15px;margin:2px 0 10px;color:#5a7464}
button{font:600 13px/1.1 Georgia,serif;letter-spacing:.03em}
.controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:3px 0 8px}.controls .nav{display:flex;gap:6px;margin-right:6px}
.ghost,.action{padding:9px 12px;border-radius:4px;cursor:pointer}.ghost{border:1px solid #3d6b58;background:#eef5ef;color:#1a2c22}.action{border:1px solid #243830;background:#3d6b58;color:#fff}
.reveal{border-top:1px solid #c4d4c8;padding-top:10px;margin-top:2px;animation:fade .18s ease}
.reveal-head{margin-bottom:6px}.reveal-pinyin{font-size:clamp(26px,2.7vw,40px);font-style:italic;color:#3d6b58;font-weight:700}
.glosses{font-size:clamp(20px,2vw,30px);line-height:1.25;margin:4px 0 8px;color:#15241c}.glosses b{color:#3d6b58}
.wordtitle,.extitle,.chartitle{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#5a7464;margin:10px 0 5px;font-weight:700}
.charlist{display:flex;gap:8px;flex-wrap:wrap}
.charchip{background:#e6efe8;border:1px solid #c4d4c8;border-radius:4px;padding:7px 10px;min-width:92px;box-shadow:inset 0 0 0 1px rgba(184,160,80,.35)}
.charchip .wzh{font-family:"Noto Serif SC","Songti SC",serif;font-size:28px;font-weight:700;line-height:1;color:#3d6b58}
.charchip .wpy{font-size:13px;font-style:italic;color:#3d6b58}.charchip .wen{font-size:12px;color:#4a6054}
.examples{display:grid;gap:6px}
.example{padding:7px 10px;background:#eef5ef;border-left:4px solid #3d6b58;border-radius:3px;line-height:1.24}
.example-zh{font-family:"Noto Serif SC","Songti SC",serif;font-size:clamp(18px,1.6vw,24px)}
.example-py{font-size:clamp(13px,1.05vw,16px);font-style:italic;color:#3d6b58;margin-top:2px}
.example-en{font-size:clamp(13px,1vw,16px);color:#3a5044;margin-top:2px}
.example em{font-style:normal;font-weight:800;color:#6a2418;background:#e4dcc0;border-radius:3px;padding:0 .06em}
.flipcard{margin-top:3px;border:1px solid #b8a050;border-radius:3px;padding:12px 14px;background:#eef5ef}
.flipcard h3{margin:0 0 7px;font-size:13px;color:#3d6b58;text-transform:uppercase;letter-spacing:.1em}
.english-list{font-size:clamp(22px,2vw,32px);line-height:1.25;margin:4px 0 10px}
.flipcard .reveal-pinyin{margin:0 0 6px}
.further{border:1px solid #3d6b58;background:transparent;color:#3d6b58;border-radius:4px;padding:8px 11px;cursor:pointer}
.imagepane{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;background:rgba(26,36,28,.95);border:3px solid #243830;border-radius:2px;overflow:hidden;box-shadow:inset 0 0 0 7px rgba(184,160,80,.28),0 18px 50px rgba(26,36,28,.34)}
.imagepane:before{content:"";position:absolute;inset:9px;border:1px solid rgba(184,160,80,.55);border-radius:1px;pointer-events:none}
.art{display:block;max-width:94%;max-height:90%;width:auto;height:auto;object-fit:contain;filter:saturate(1.02) contrast(1.03);box-shadow:0 8px 32px rgba(0,0,0,.32);transition:opacity .35s ease,transform .35s ease}.art.wide{max-width:98%;max-height:84%}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@media(max-width:900px){body{overflow:auto}.app{height:auto;min-height:100vh}.main{grid-template-columns:1fr;grid-template-rows:auto minmax(360px,55vh)}.quiz{overflow:visible}.imagepane{min-height:420px}.topbar{flex-wrap:wrap}.progress{order:3;flex-basis:100%;max-width:none}}
@media(max-width:520px){.main{padding:9px;gap:9px}.quiz{padding:14px}.brand small{display:none}.character{font-size:72px}.topbar{padding:8px 10px}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">词语 201–300 <small>most common words</small></div>
    <div class="progress"><i id="progressFill"></i></div>
    <div class="stat" id="cardStat"></div>
    <button class="topbtn" id="shuffleBtn">Shuffle</button>
    <button class="topbtn" id="resetBtn">Reset order</button>
  </header>
  <main class="main">
    <section class="quiz">
      <div class="rankline"><span id="rankLabel"></span></div>
      <div class="character" id="char"></div>
      <div class="pinyin front-pinyin" id="pinyin" aria-hidden="true"></div>
      <div class="prompt">Recognize the word first. Reveal for dictionary English, each character, and three fully translated examples.</div>
      <div class="controls">
        <div class="nav"><button class="ghost" id="prevBtn">← Previous</button><button class="ghost" id="nextBtn">Next →</button></div>
        <button class="action" id="revealBtn">Reveal</button>
        <button class="ghost" id="flipBtn">Flip</button>
      </div>
      <div id="detailArea"></div>
    </section>
    <section class="imagepane" id="imagePane">
      <img class="art" id="art" alt="Study image">
    </section>
  </main>
</div>
<script>
const BANK = [{"rank":201,"word":"去年","pinyin":"qù nián","en":["last year"],"chars":[{"ch":"去","py":"qù","en":"go; last (in 去年)"},{"ch":"年","py":"nián","en":"year"}],"examples":[{"zh":"去年村里下了大雪。","pinyin":"qù nián cūn lǐ xià le dà xuě.","en":"Last year the village had heavy snow."},{"zh":"他去年才搬到这儿。","pinyin":"tā qù nián cái bān dào zhèr.","en":"He only moved here last year."},{"zh":"去年的收成比今年差。","pinyin":"qù nián de shōu cheng bǐ jīn nián chà.","en":"Last year's harvest was worse than this year's."}]},{"rank":202,"word":"明年","pinyin":"míng nián","en":["next year"],"chars":[{"ch":"明","py":"míng","en":"next (day/year); bright"},{"ch":"年","py":"nián","en":"year"}],"examples":[{"zh":"明年我们再上山。","pinyin":"míng nián wǒ men zài shàng shān.","en":"Next year we will go up the mountain again."},{"zh":"把这件事留到明年。","pinyin":"bǎ zhè jiàn shì liú dào míng nián.","en":"Leave this matter until next year."},{"zh":"明年春天把树栽上。","pinyin":"míng nián chūn tiān bǎ shù zāi shàng.","en":"Plant the trees next spring."}]},{"rank":203,"word":"最近","pinyin":"zuì jìn","en":["recently","lately","nearest"],"chars":[{"ch":"最","py":"zuì","en":"most"},{"ch":"近","py":"jìn","en":"near; recent"}],"examples":[{"zh":"最近雨下得勤。","pinyin":"zuì jìn yǔ xià de qín.","en":"It has rained often recently."},{"zh":"他最近很少出门。","pinyin":"tā zuì jìn hěn shǎo chū mén.","en":"He has seldom gone out lately."},{"zh":"最近的那口井水很清。","pinyin":"zuì jìn de nà kǒu jǐng shuǐ hěn qīng.","en":"The nearest well has very clear water."}]},{"rank":204,"word":"目前","pinyin":"mù qián","en":["at present","currently"],"chars":[{"ch":"目","py":"mù","en":"eye"},{"ch":"前","py":"qián","en":"front; before"}],"examples":[{"zh":"目前家里还缺柴。","pinyin":"mù qián jiā lǐ hái quē chái.","en":"At present the house still lacks firewood."},{"zh":"目前这条路还通。","pinyin":"mù qián zhè tiáo lù hái tōng.","en":"This road is still open at present."},{"zh":"目前不必着急。","pinyin":"mù qián bú bì zhāo jí.","en":"There is no need to hurry at present."}]},{"rank":205,"word":"当时","pinyin":"dāng shí","en":["at that time","then"],"chars":[{"ch":"当","py":"dāng","en":"at (a time); serve as"},{"ch":"时","py":"shí","en":"time"}],"examples":[{"zh":"当时天已经黑了。","pinyin":"dāng shí tiān yǐ jīng hēi le.","en":"At that time it was already dark."},{"zh":"当时我还小。","pinyin":"dāng shí wǒ hái xiǎo.","en":"I was still young then."},{"zh":"当时河里的水没这么深。","pinyin":"dāng shí hé lǐ de shuǐ méi zhè me shēn.","en":"The river was not this deep at that time."}]},{"rank":206,"word":"原来","pinyin":"yuán lái","en":["originally","as it turns out"],"chars":[{"ch":"原","py":"yuán","en":"original; source"},{"ch":"来","py":"lái","en":"come"}],"examples":[{"zh":"原来这里是一片林子。","pinyin":"yuán lái zhè lǐ shì yí piàn lín zi.","en":"Originally this was a stretch of woods."},{"zh":"原来你早就到了。","pinyin":"yuán lái nǐ zǎo jiù dào le.","en":"So it turns out you arrived long ago."},{"zh":"锅里原来还有饭。","pinyin":"guō lǐ yuán lái hái yǒu fàn.","en":"There was rice in the pot to begin with."}]},{"rank":207,"word":"首先","pinyin":"shǒu xiān","en":["first of all","first"],"chars":[{"ch":"首","py":"shǒu","en":"head; first"},{"ch":"先","py":"xiān","en":"first; earlier"}],"examples":[{"zh":"首先把火生上。","pinyin":"shǒu xiān bǎ huǒ shēng shàng.","en":"First of all light the fire."},{"zh":"过河首先要看水深。","pinyin":"guò hé shǒu xiān yào kàn shuǐ shēn.","en":"To cross the river one must first look at the depth."},{"zh":"他首先想到的是家里。","pinyin":"tā shǒu xiān xiǎng dào de shì jiā lǐ.","en":"What he thought of first was home."}]},{"rank":208,"word":"最后","pinyin":"zuì hòu","en":["finally","last","in the end"],"chars":[{"ch":"最","py":"zuì","en":"most"},{"ch":"后","py":"hòu","en":"after; behind"}],"examples":[{"zh":"最后一班船已经走了。","pinyin":"zuì hòu yì bān chuán yǐ jīng zǒu le.","en":"The last boat has already gone."},{"zh":"他走在最后。","pinyin":"tā zǒu zài zuì hòu.","en":"He walked last."},{"zh":"我们最后还是回到村里。","pinyin":"wǒ men zuì hòu hái shi huí dào cūn lǐ.","en":"In the end we still returned to the village."}]},{"rank":209,"word":"其中","pinyin":"qí zhōng","en":["among them","of which"],"chars":[{"ch":"其","py":"qí","en":"its; that"},{"ch":"中","py":"zhōng","en":"middle; among"}],"examples":[{"zh":"十个人，其中三个是本村的。","pinyin":"shí ge rén, qí zhōng sān ge shì běn cūn de.","en":"Ten people, among them three are of this village."},{"zh":"这些书其中有一本是他的。","pinyin":"zhè xiē shū qí zhōng yǒu yì běn shì tā de.","en":"Among these books there is one that is his."},{"zh":"两条路，其中一条更近。","pinyin":"liǎng tiáo lù, qí zhōng yì tiáo gèng jìn.","en":"Two roads, of which one is nearer."}]},{"rank":210,"word":"部分","pinyin":"bù fen","en":["part","section"],"chars":[{"ch":"部","py":"bù","en":"part; section"},{"ch":"分","py":"fen","en":"divide; portion"}],"examples":[{"zh":"墙的一部分已经倒了。","pinyin":"qiáng de yí bù fen yǐ jīng dǎo le.","en":"A part of the wall has already fallen."},{"zh":"先做完这部分。","pinyin":"xiān zuò wán zhè bù fen.","en":"Finish this part first."},{"zh":"米的一部分要留作种子。","pinyin":"mǐ de yí bù fen yào liú zuò zhǒng zi.","en":"A part of the rice is to be kept for seed."}]},{"rank":211,"word":"全部","pinyin":"quán bù","en":["all","the whole","entire"],"chars":[{"ch":"全","py":"quán","en":"all; whole"},{"ch":"部","py":"bù","en":"part; section"}],"examples":[{"zh":"把柴全部搬进屋。","pinyin":"bǎ chái quán bù bān jìn wū.","en":"Carry all the firewood into the house."},{"zh":"这件事我全部知道。","pinyin":"zhè jiàn shì wǒ quán bù zhī dào.","en":"I know this matter in its entirety."},{"zh":"灯全部点上了。","pinyin":"dēng quán bù diǎn shàng le.","en":"All the lamps have been lit."}]},{"rank":212,"word":"许多","pinyin":"xǔ duō","en":["many","a great many"],"chars":[{"ch":"许","py":"xǔ","en":"allow; perhaps"},{"ch":"多","py":"duō","en":"many"}],"examples":[{"zh":"山上有许多野花。","pinyin":"shān shàng yǒu xǔ duō yě huā.","en":"There are many wild flowers on the mountain."},{"zh":"他读过许多旧书。","pinyin":"tā dú guo xǔ duō jiù shū.","en":"He has read a great many old books."},{"zh":"过了许多年，桥还在。","pinyin":"guò le xǔ duō nián, qiáo hái zài.","en":"Many years have passed, and the bridge is still there." const IMAGES = ["img/01-rapeseed.jpg", "img/02-siheyuan.jpg", "img/03-hutong.jpg", "img/04-garden.jpg", "img/05-calligraphy.jpg", "img/06-bamboo-studio.jpg", "img/07-huashan.jpg", "img/08-huangshan-pine.jpg", "img/09-interior.jpg", "img/10-karst.jpg", "img/11-sutra.jpg", "img/12-old-temple.jpg", "img/13-beijing-metro.jpg", "img/14-water-town.jpg", "img/15-night-lake.jpg"];
let order = BANK.map((_,i)=>i), pos=0, state='front';
const $=id=>document.getElementById(id);
function current(){return BANK[order[pos]]}
function safe(t){return String(t).replace(/[&<>"']/g,m=>({'&':'&','<':'<','>':'>','"':'"',"'":'&#039;'}[m]))}
function mark(sentence,w){return safe(sentence).split(safe(w)).join('<em>'+safe(w)+'</em>')}
function imageForPosition(){const n=IMAGES.length||1;return Math.floor(pos*n/BANK.length)%n}
function setImage(){const idx=imageForPosition(), img=$('art');img.style.opacity=.15;setTimeout(()=>{img.src=IMAGES[idx]; img.onload=()=>{img.classList.toggle('wide',img.naturalWidth/img.naturalHeight>1.75);img.style.opacity=1}},90)}
function renderDetail(mode){const c=current(), d=$('detailArea'); if(mode==='front'){d.innerHTML='';return}
 if(mode==='flip'){d.innerHTML=`<div class="flipcard"><h3>Pinyin + English</h3><div class="reveal-pinyin">${safe(c.pinyin)}</div><div class="english-list">${c.en.map(safe).join(' · ')}</div><button class="further" id="furtherBtn">Reveal further</button></div>`;$('furtherBtn').onclick=()=>{state='revealed';renderDetail('revealed')};return}
 const chars=c.chars.map(w=>`<div class="charchip"><div class="wzh">${safe(w.ch)}</div><div class="wpy">${safe(w.py)}</div><div class="wen">${safe(w.en)}</div></div>`).join('');
 const ex=c.examples.map(x=>`<div class="example"><div class="example-zh">${mark(x.zh,c.word)}</div><div class="example-py">${safe(x.pinyin)}</div><div class="example-en">${safe(x.en)}</div></div>`).join('');
 d.innerHTML=`<div class="reveal"><div class="reveal-head"><div class="reveal-pinyin">${safe(c.pinyin)}</div><p class="glosses"><b>${safe(c.word)}</b> — ${c.en.map(safe).join('; ')}</p></div><div class="chartitle">Characters in this word</div><div class="charlist">${chars}</div><div class="extitle">Example sentences</div><div class="examples">${ex}</div></div>`}
function render(changeImage=true){const c=current();$('char').textContent=c.word;$('pinyin').textContent='';$('rankLabel').textContent=`Word frequency #${c.rank}`;$('cardStat').textContent=`${pos+1} / ${BANK.length}`;$('progressFill').style.width=((pos+1)/BANK.length*100)+'%';state='front';renderDetail('front');if(changeImage)setImage()}
function move(delta){const oldImg=imageForPosition();pos=Math.max(0,Math.min(BANK.length-1,pos+delta));render(imageForPosition()!==oldImg)}
$('prevBtn').onclick=()=>move(-1);$('nextBtn').onclick=()=>move(1);
$('revealBtn').onclick=()=>{state='revealed';renderDetail('revealed')};$('flipBtn').onclick=()=>{state='flip';renderDetail('flip')};
$('shuffleBtn').onclick=()=>{for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}pos=0;render(true)};
$('resetBtn').onclick=()=>{order=BANK.map((_,i)=>i);pos=0;render(true)};
render(true);
</script>
