<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atmosphere Explorer</title>
  <style>
    /* Reset and Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #050510;
      color: #fff;
      overflow: hidden;
      user-select: none;
    }

    /* Grid Layout */
    .game-container {
      display: grid;
      grid-template-columns: 12% 1fr 15%;
      height: 100vh;
      width: 100vw;
    }

    /* Left Sidebar: Ruler */
    .left-sidebar {
      grid-column: 1;
      border-right: 1px solid rgba(255, 255, 255, 0.2);
      background: linear-gradient(to right, #000000, #0a0a1a);
      overflow-y: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .ruler-container {
      position: absolute;
      top: 50%; /* Center the active mark */
      width: 100%;
      transition: transform 0.1s ease-out;
    }

    .ruler-mark {
      height: 60px; /* Space between 5-mile increments */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-end;
      padding-right: 15px;
      position: relative;
      color: rgba(255, 255, 255, 0.5);
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .ruler-mark .data-text {
      font-size: 10px;
      text-align: right;
      line-height: 1.2;
    }

    .ruler-mark .tick {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 10px;
      height: 1px;
      background-color: rgba(255, 255, 255, 0.5);
    }

    .ruler-mark.active {
      color: #ffffff;
    }
    
    .ruler-mark.active .data-text {
      font-weight: bold;
    }

    .ruler-mark.active .tick {
      width: 18px;
      background-color: #ffffff;
    }

    /* Center Canvas: Interactive World */
    .center-canvas {
      grid-column: 2;
      position: relative;
      overflow: hidden;
      cursor: grab;
    }

    .center-canvas:active {
      cursor: grabbing;
    }

    #world {
      position: absolute;
      bottom: 0;
      width: 100%;
      transform-origin: bottom center;
      display: flex;
      flex-direction: column-reverse; /* Builds from ground up */
    }

    /* Atmosphere Layers */
    .layer {
      width: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: bold;
      color: rgba(255,255,255,0.3);
      text-transform: uppercase;
      letter-spacing: 5px;
      transition: background-color 0.3s;
    }

    .layer:hover {
      border: 2px dashed rgba(255,255,255,0.5);
    }

    /* Relative Heights (1px = approx 0.1 miles for scale, but exaggerated for gameplay) */
    #core { height: 300px; background: linear-gradient(#ff3300, #ffcc00); }
    #mantle { height: 400px; background: linear-gradient(#990000, #ff3300); }
    #crust { height: 50px; background: linear-gradient(#3d2817, #5c4033); border-top: 4px solid #2d4c1e; }
    #troposphere { height: 400px; background: linear-gradient(#87CEEB, #4682B4); }
    #stratosphere { height: 600px; background: linear-gradient(#4682B4, #1E90FF); }
    #mesosphere { height: 800px; background: linear-gradient(#1E90FF, #00008B); }
    #thermosphere { height: 1200px; background: linear-gradient(#00008B, #050510); }
    #exosphere { height: 1500px; background: #050510; }

    /* Thunderstorm Cloud */
    #thunderstorm {
      position: absolute;
      bottom: 20px;
      left: 20%;
      width: 300px;
      height: 350px;
      background: radial-gradient(circle, #555, #222);
      border-radius: 50px 50px 20px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 20px 30px rgba(0,0,0,0.5);
    }
    
    .lightning {
      position: absolute;
      bottom: -50px;
      width: 4px;
      height: 100px;
      background-color: #fff;
      box-shadow: 0 0 15px #fff, 0 0 30px #0ff;
      transform: rotate(15deg);
      opacity: 0;
      animation: flash 4s infinite;
    }

    @keyframes flash {
      0%, 95%, 98% { opacity: 0; }
      96%, 99% { opacity: 1; }
    }

    /* Right Sidebar: Quiz */
    .right-sidebar {
      grid-column: 3;
      border-left: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      justify-content: center;
      padding-top: 50px; /* Upper two thirds positioning */
      background: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII='); /* Subtle noise */
    }

    .quiz-box {
      width: 85%;
      height: fit-content;
      min-height: 250px;
      background: rgba(220, 208, 185, 0.15); /* Silver-goldish translucent */
      backdrop-filter: blur(12px);
      border: 1px solid rgba(220, 208, 185, 0.4);
      border-radius: 12px;
      padding: 25px 15px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .quiz-title {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: rgba(255,255,255,0.7);
      margin-bottom: 10px;
    }

    .quiz-prompt {
      font-size: 22px;
      font-weight: bold;
      color: #fff;
      margin-bottom: 20px;
    }

    #feedback {
      min-height: 24px;
      font-size: 16px;
      margin-bottom: 20px;
      font-weight: bold;
    }

    .correct-text { color: #4ade80; }
    .wrong-text { color: #f87171; }

    #next-btn {
      display: none;
      background: rgba(255,255,255,0.2);
      border: 1px solid #fff;
      color: #fff;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.2s;
    }

    #next-btn:hover {
      background: rgba(255,255,255,0.4);
    }
    
    /* Utility for highlighting correct layers */
    .highlight {
      background-color: rgba(255, 255, 255, 0.2) !important;
      border: 2px solid #fff;
    }

  </style>
</head>
<body>

  <div class="game-container">
    
    <!-- Left Sidebar: Data Ruler -->
    <aside class="left-sidebar">
      <div class="ruler-container" id="ruler-container">
        <!-- Generated by JS -->
      </div>
    </aside>

    <!-- Center Canvas: Interactive World -->
    <main class="center-canvas" id="canvas">
      <div id="world">
        <!-- Above Surface (96% focus) -->
        <div class="layer" id="exosphere" data-layer="Exosphere">Exosphere</div>
        <div class="layer" id="thermosphere" data-layer="Thermosphere">Thermosphere</div>
        <div class="layer" id="mesosphere" data-layer="Mesosphere">Mesosphere</div>
        <div class="layer" id="stratosphere" data-layer="Stratosphere">Stratosphere</div>
        <div class="layer" id="troposphere" data-layer="Troposphere">
          Troposphere
          <div id="thunderstorm" data-layer="Cumulonimbus Cloud">
            <span style="font-size: 1rem; color: #fff;">Storm System</span>
            <div class="lightning"></div>
          </div>
        </div>
        
        <!-- Below Surface -->
        <div class="layer" id="crust" data-layer="Crust">Crust</div>
        <div class="layer" id="mantle" data-layer="Mantle">Mantle</div>
        <div class="layer" id="core" data-layer="Core">Core</div>
      </div>
    </main>

    <!-- Right Sidebar: Quiz Box -->
    <aside class="right-sidebar">
      <div class="quiz-box">
        <div class="quiz-title">Study Mode</div>
        <div class="quiz-prompt">Locate: <br><span id="target-term" style="color:#dcd0b9;">Stratosphere</span></div>
        <div id="feedback"></div>
        <button id="next-btn">Next</button>
      </div>
    </aside>

  </div>

  <script>
    // --- 1. Map Data Generation for Ruler ---
    const rulerContainer = document.getElementById('ruler-container');
    const PIXELS_PER_MILE = 10; // Scale factor for the center canvas
    const MAX_ALTITUDE_MILES = 400; 
    
    // Generate ruler marks every 5 miles
    for (let miles = -20; miles <= MAX_ALTITUDE_MILES; miles += 5) {
      const mark = document.createElement('div');
      mark.className = 'ruler-mark';
      mark.dataset.miles = miles;
      
      // Calculate realistic-ish dummy data based on altitude
      let temp, density, wind;
      if (miles < 0) {
        temp = 100 + (Math.abs(miles) * 50); // Gets hotter underground
        density = "Solid";
        wind = "0 mph";
      } else if (miles <= 7) { // Troposphere
        temp = Math.max(-60, 60 - (miles * 17)); // Drops
        density = (100 - (miles * 12)).toFixed(1) + "%";
        wind = (10 + (miles * 5)) + " mph";
      } else if (miles <= 31) { // Stratosphere
        temp = -60 + ((miles - 7) * 2.5); // Rises due to ozone
        density = Math.max(1, 20 - (miles * 0.5)).toFixed(1) + "%";
        wind = "50 mph (Jet)";
      } else if (miles <= 53) { // Mesosphere
        temp = Math.max(-130, 0 - ((miles - 31) * 6)); // Drops
        density = "< 1%";
        wind = "Variable";
      } else { // Thermosphere/Exosphere
        temp = -130 + ((miles - 53) * 10); // Spikes
        density = "Near Vacuum";
        wind = "Solar Winds";
      }

      mark.innerHTML = `
        <div class="data-text">
          <b>${miles} mi</b><br>
          Temp: ${Math.floor(temp)}°F<br>
          Den: ${density}<br>
          Wind: ${wind}
        </div>
        <div class="tick"></div>
      `;
      // Append in reverse so highest altitude is at the top of the container
      rulerContainer.insertBefore(mark, rulerContainer.firstChild);
    }

    // --- 2. Canvas Panning and Zooming ---
    const canvas = document.getElementById('canvas');
    const world = document.getElementById('world');
    
    let isDragging = false;
    let startY, currentY = 0, initialY = 0;
    let scale = 1;

    // Set initial position so surface is near the bottom
    currentY = -700; 
    world.style.transform = `translateY(${currentY}px) scale(${scale})`;

    canvas.addEventListener('mousedown', (e) => {
      isDragging = true;
      startY = e.clientY - currentY;
    });

    window.addEventListener('mouseup', () => {
      isDragging = false;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      e.preventDefault();
      currentY = e.clientY - startY;
      updateWorldTransform();
      syncRuler();
    });

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomAmount = 0.1;
      if (e.deltaY < 0) {
        scale = Math.min(scale + zoomAmount, 3); // Max zoom in
      } else {
        scale = Math.max(scale - zoomAmount, 0.3); // Max zoom out
      }
      updateWorldTransform();
    });

    function updateWorldTransform() {
      world.style.transform = `translateY(${currentY}px) scale(${scale})`;
    }

    // --- 3. Sync Ruler to Canvas Position ---
    function syncRuler() {
      // Calculate which altitude is roughly in the vertical center of the screen
      // This is a simplified math mapping linking canvas scroll to ruler offset
      const centerOffset = currentY / scale;
      const rulerTranslation = centerOffset * 0.5; // Adjust speed of ruler moving
      
      rulerContainer.style.transform = `translateY(${-rulerTranslation}px)`;

      // Highlight the active mark closest to the center
      const marks = document.querySelectorAll('.ruler-mark');
      marks.forEach(m => m.classList.remove('active'));
      
      // Rough estimation for visual effect
      const activeIndex = Math.floor(marks.length / 2) + Math.floor(rulerTranslation / 60);
      if(marks[activeIndex]) {
        marks[activeIndex].classList.add('active');
      }
    }
    
    // Initial sync
    syncRuler();

    // --- 4. Quiz Logic ---
    const questions = [
      "Stratosphere",
      "Cumulonimbus Cloud",
      "Troposphere",
      "Mesosphere",
      "Thermosphere",
      "Exosphere",
      "Mantle",
      "Core"
    ];
    
    let currentQuestionIndex = 0;
    const targetTermEl = document.getElementById('target-term');
    const feedbackEl = document.getElementById('feedback');
    const nextBtn = document.getElementById('next-btn');
    const layers = document.querySelectorAll('[data-layer]');

    function loadQuestion() {
      targetTermEl.textContent = questions[currentQuestionIndex];
      feedbackEl.textContent = "";
      nextBtn.style.display = "none";
      layers.forEach(l => l.classList.remove('highlight'));
    }

    world.addEventListener('click', (e) => {
      // Only trigger if we aren't dragging
      const targetLayer = e.target.closest('[data-layer]');
      
      if (targetLayer && nextBtn.style.display === "none") {
        const clickedTerm = targetLayer.dataset.layer;
        const correctTerm = questions[currentQuestionIndex];

        if (clickedTerm === correctTerm) {
          feedbackEl.innerHTML = `<span class="correct-text">Correct!</span>`;
          targetLayer.classList.add('highlight');
          nextBtn.style.display = "block"; // Allow them to examine, then click Next
        } else {
          feedbackEl.innerHTML = `<span class="wrong-text">Incorrect, that is the ${clickedTerm}.</span>`;
        }
      }
    });

    nextBtn.addEventListener('click', () => {
      currentQuestionIndex++;
      if (currentQuestionIndex >= questions.length) {
        currentQuestionIndex = 0; // Loop back for fun
      }
      loadQuestion();
    });

    // Initialize first question
    loadQuestion();

  </script>
</body>
</html>
