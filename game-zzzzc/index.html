<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atmosphere Explorer Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: Arial, sans-serif;
      background-color: #050510;
      color: #fff;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      user-select: none;
    }

    /* Grid Layout: 3 Columns */
    .game-container {
      display: grid;
      grid-template-columns: 10% 1fr 15%;
      width: 100vw;
      height: 100vh;
    }

    /* Left Sidebar: Ruler */
    .left-sidebar {
      grid-column: 1;
      border-right: 1px solid rgba(255, 255, 255, 0.2);
      background: #000;
      position: relative;
      overflow: hidden;
    }

    .ruler-track {
      position: absolute;
      width: 100%;
      left: 0;
      top: 0;
    }

    .ruler-mark {
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 8px;
      position: relative;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .ruler-mark .data-text {
      font-size: 9px;
      text-align: right;
      color: rgba(255, 255, 255, 0.6);
      line-height: 1.1;
    }

    .ruler-mark .tick {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 8px;
      height: 1px;
      background-color: rgba(255, 255, 255, 0.4);
    }

    .ruler-mark.active .data-text {
      color: #fff;
      font-weight: bold;
    }

    .ruler-mark.active .tick {
      width: 14px;
      background-color: #fff;
    }

    /* Center Canvas: Interactive World */
    .center-canvas {
      grid-column: 2;
      position: relative;
      overflow: hidden;
      cursor: grab;
      background: #000;
    }

    .center-canvas:active {
      cursor: grabbing;
    }

    #world {
      position: absolute;
      left: 0;
      width: 100%;
      transform-origin: top center;
      display: flex;
      flex-direction: column; /* Top of atmosphere down to core */
    }

    /* Atmosphere & Earth Layers */
    .layer {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: bold;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      letter-spacing: 3px;
      border-bottom: 2px dashed rgba(255,255,255,0.1);
      position: relative;
      cursor: pointer;
    }

    .layer:hover {
      color: #fff;
      background-color: rgba(255,255,255,0.05);
    }

    /* Heights scaled for gameplay block sizing */
    #exosphere { height: 600px; background: #050510; }
    #thermosphere { height: 700px; background: linear-gradient(#00008B, #050510); }
    #mesosphere { height: 500px; background: linear-gradient(#1E90FF, #00008B); }
    #stratosphere { height: 600px; background: linear-gradient(#4682B4, #1E90FF); }
    #troposphere { height: 500px; background: linear-gradient(#87CEEB, #4682B4); }
    #crust { height: 100px; background: #3d2817; border-top: 6px solid #2d4c1e; }
    #mantle { height: 500px; background: linear-gradient(#ff3300, #990000); }
    #core { height: 400px; background: radial-gradient(circle, #ffcc00, #ff3300); }

    /* Thunderstorm Cloud Element */
    #thunderstorm {
      position: absolute;
      bottom: 50px;
      left: 25%;
      width: 260px;
      height: 220px;
      background: radial-gradient(circle, #666, #222);
      border-radius: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      box-shadow: 0 15px 25px rgba(0,0,0,0.6);
    }
    
    .lightning {
      position: absolute;
      bottom: -40px;
      width: 3px;
      height: 80px;
      background-color: #fff;
      box-shadow: 0 0 10px #fff, 0 0 20px #0ff;
      transform: rotate(15deg);
      animation: flash 3s infinite;
    }

    @keyframes flash {
      0%, 90%, 96% { opacity: 0; }
      92%, 98% { opacity: 1; }
    }

    /* Right Sidebar: Quiz Box */
    .right-sidebar {
      grid-column: 3;
      border-left: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 40px;
      background: #080812;
    }

    .quiz-box {
      width: 85%;
      background: rgba(220, 208, 185, 0.15);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(220, 208, 185, 0.4);
      border-radius: 10px;
      padding: 20px 10px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .quiz-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.7);
      margin-bottom: 8px;
    }

    .quiz-prompt {
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      margin-bottom: 15px;
    }

    #feedback {
      min-height: 20px;
      font-size: 14px;
      margin-bottom: 15px;
      font-weight: bold;
    }

    .correct-text { color: #4ade80; }
    .wrong-text { color: #f87171; }

    #next-btn {
      display: none;
      background: rgba(255,255,255,0.2);
      border: 1px solid #fff;
      color: #fff;
      padding: 8px 16px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      margin: 0 auto;
    }

    #next-btn:hover {
      background: rgba(255,255,255,0.4);
    }
    
    .highlight {
      border: 3px solid #fff !important;
      background-color: rgba(255,255,255,0.2) !important;
    }
  </style>
</head>
<body>

  <div class="game-container">
    
    <!-- Left Sidebar: Ruler -->
    <aside class="left-sidebar">
      <div class="ruler-track" id="ruler-track"></div>
    </aside>

    <!-- Center Canvas: Interactive World -->
    <main class="center-canvas" id="canvas">
      <div id="world">
        <!-- Atmosphere down to Core structured top-to-bottom -->
        <div class="layer" id="exosphere" data-layer="Exosphere">Exosphere</div>
        <div class="layer" id="thermosphere" data-layer="Thermosphere">Thermosphere</div>
        <div class="layer" id="mesosphere" data-layer="Mesosphere">Mesosphere</div>
        <div class="layer" id="stratosphere" data-layer="Stratosphere">Stratosphere</div>
        <div class="layer" id="troposphere" data-layer="Troposphere">
          Troposphere
          <div id="thunderstorm" data-layer="Cumulonimbus Cloud">
            <span style="font-size: 0.8rem;">Storm Cloud</span>
            <div class="lightning"></div>
          </div>
        </div>
        <div class="layer" id="crust" data-layer="Crust">Crust</div>
        <div class="layer" id="mantle" data-layer="Mantle">Mantle</div>
        <div class="layer" id="core" data-layer="Core">Core</div>
      </div>
    </main>

    <!-- Right Sidebar: Quiz -->
    <aside class="right-sidebar">
      <div class="quiz-box">
        <div class="quiz-title">Study & Quiz Mode</div>
        <div class="quiz-prompt">Locate:<br><span id="target-term" style="color:#dcd0b9;">Stratosphere</span></div>
        <div id="feedback"></div>
        <button id="next-btn">Next Question</button>
      </div>
    </aside>

  </div>

  <script>
    // --- 1. Populate Ruler Track (-20 miles to +400 miles) ---
    const rulerTrack = document.getElementById('ruler-track');
    for (let miles = 400; miles >= -20; miles -= 5) {
      const mark = document.createElement('div');
      mark.className = 'ruler-mark';
      
      let temp, density, wind;
      if (miles < 0) {
        temp = 100 + (Math.abs(miles) * 40);
        density = "Solid";
        wind = "0 mph";
      } else if (miles <= 7) {
        temp = Math.max(-60, 60 - (miles * 15));
        density = (100 - (miles * 12)).toFixed(0) + "%";
        wind = (10 + (miles * 4)) + " mph";
      } else if (miles <= 31) {
        temp = -60 + ((miles - 7) * 2);
        density = "15%";
        wind = "45 mph";
      } else if (miles <= 53) {
        temp = -120;
        density = "< 1%";
        wind = "25 mph";
      } else {
        temp = 200;
        density = "Vacuum";
        wind = "Solar";
      }

      mark.innerHTML = `
        <div class="data-text">
          <b>${miles} mi</b><br>
          ${Math.floor(temp)}°F | ${density} | ${wind}
        </div>
        <div class="tick"></div>
      `;
      rulerTrack.appendChild(mark);
    }

    // --- 2. Panning and Zooming Engine ---
    const canvas = document.getElementById('canvas');
    const world = document.getElementById('world');

    let translateY = -500; // Starting view offset
    let scale = 1;
    let isDragging = false;
    let startY = 0;

    function updateTransform() {
      world.style.transform = `translateY(${translateY}px) scale(${scale})`;
      // Sync ruler tracking position smoothly
      rulerTrack.style.transform = `translateY(${translateY * 0.4}px)`;
    }

    updateTransform();

    canvas.addEventListener('mousedown', (e) => {
      isDragging = true;
      startY = e.clientY - translateY;
    });

    window.addEventListener('mouseup', () => {
      isDragging = false;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      translateY = e.clientY - startY;
      updateTransform();
    });

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomIntensity = 0.1;
      if (e.deltaY < 0) {
        scale = Math.min(scale + zoomIntensity, 2.5);
      } else {
        scale = Math.max(scale - zoomIntensity, 0.4);
      }
      updateTransform();
    }, { passive: false });

    // --- 3. Quiz Game Logic ---
    const questions = [
      "Stratosphere",
      "Cumulonimbus Cloud",
      "Troposphere",
      "Mesosphere",
      "Thermosphere",
      "Exosphere",
      "Crust",
      "Mantle",
      "Core"
    ];

    let qIndex = 0;
    const targetTermEl = document.getElementById('target-term');
    const feedbackEl = document.getElementById('feedback');
    const nextBtn = document.getElementById('next-btn');
    const allLayers = document.querySelectorAll('[data-layer]');

    function setQuestion() {
      targetTermEl.textContent = questions[qIndex];
      feedbackEl.textContent = "";
      nextBtn.style.display = "none";
      allLayers.forEach(l => l.classList.remove('highlight'));
    }

    world.addEventListener('click', (e) => {
      const target = e.target.closest('[data-layer]');
      if (!target) return;

      const clickedName = target.dataset.layer;
      const correctName = questions[qIndex];

      if (clickedName === correctName) {
        feedbackEl.innerHTML = `<span class="correct-text">Correct! It's the ${correctName}.</span>`;
        target.classList.add('highlight');
        nextBtn.style.display = "block";
      } else {
        feedbackEl.innerHTML = `<span class="wrong-text">That's the ${clickedName}. Keep looking!</span>`;
      }
    });

    nextBtn.addEventListener('click', () => {
      qIndex = (qIndex + 1) % questions.length;
      setQuestion();
    });

    setQuestion();
  </script>
</body>
</html>
