<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cursus — the Latin race course</title>
<style>
:root{
  --ink:#0f2233;
  --ink-soft:#4a6274;
  --frost:rgba(255,255,255,.90);
  --frost-thin:rgba(255,255,255,.72);
  --rule:rgba(15,34,51,.13);
  --green:#2c7a4b;
  --blue:#1d63b5;
  --black:#1a1f26;
  --red:#c9372c;
  --sun:#e08a1e;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  padding:18px;
  background:#bcd9ef;
}
#slope{
  position:fixed;inset:0;z-index:0;
  background-size:cover;background-position:center;
  transition:opacity .4s;
}
#slope::after{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(ellipse 80% 70% at 50% 45%, rgba(255,255,255,.30), transparent 72%),
    linear-gradient(to bottom, rgba(255,255,255,.10), rgba(15,34,51,.22));
}

#course{position:relative;z-index:1;width:100%;max-width:640px}

/* ---- sign bar ---- */
.signbar{
  display:flex;align-items:center;gap:12px;
  background:var(--frost);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.7);
  border-radius:3px;
  padding:11px 14px;
  box-shadow:0 6px 22px rgba(15,34,51,.22);
  margin-bottom:11px;
}
.mark{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  font-weight:800;font-size:12px;letter-spacing:.22em;text-transform:uppercase;
  white-space:nowrap;
}
.tally{
  margin-left:auto;
  font-family:"SF Mono","Courier New",monospace;
  font-size:11px;letter-spacing:.09em;color:var(--ink-soft);white-space:nowrap;
}
#slopeBtn{
  font:inherit;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-soft);background:rgba(15,34,51,.07);
  border:1px solid var(--rule);border-radius:2px;
  padding:5px 9px;cursor:pointer;white-space:nowrap;
}
#slopeBtn:hover{background:rgba(15,34,51,.14);color:var(--ink)}
#slopeBtn:focus-visible{outline:2px solid var(--sun);outline-offset:2px}

/* ---- momentum ---- */
.mom{
  display:flex;align-items:center;gap:11px;
  background:var(--frost-thin);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.6);border-radius:3px;
  padding:9px 14px;margin-bottom:16px;
  box-shadow:0 4px 16px rgba(15,34,51,.16);
}
.mom-label{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  font-size:9px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;
  color:var(--ink-soft);white-space:nowrap;
}
.gauge{flex:1;height:6px;background:rgba(15,34,51,.14);border-radius:3px;overflow:hidden}
.gauge span{display:block;height:100%;width:50%;border-radius:3px;
  background:linear-gradient(90deg,var(--blue),#4aa3d8);
  transition:width .45s cubic-bezier(.2,.7,.3,1),background .45s}
.gauge.low span{background:linear-gradient(90deg,#96271e,var(--red))}

/* ---- the gate ---- */
.gate{
  background:var(--frost);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.75);border-radius:4px;
  padding:30px 24px 28px;text-align:center;
  box-shadow:0 14px 40px rgba(15,34,51,.26);
  border-top:4px solid var(--blue);
}
.gate.t1{border-top-color:var(--green)}
.gate.t2{border-top-color:var(--blue)}
.gate.t3{border-top-color:var(--black)}

.runline{
  display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:18px;
}
.badge{width:13px;height:13px;flex:none}
.badge.t1{border-radius:50%;background:var(--green)}
.badge.t2{background:var(--blue)}
.badge.t3{background:var(--black);transform:rotate(45deg);width:12px;height:12px}
.runname{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  font-size:9.5px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;
  color:var(--ink-soft);
}

.phrase{
  font-size:clamp(24px,6vw,40px);
  letter-spacing:.055em;line-height:1.22;
  text-transform:uppercase;
  word-break:break-word;
}
.phrase.gloss{
  text-transform:none;letter-spacing:.005em;
  font-size:clamp(19px,4.4vw,27px);
  color:var(--ink);
  font-style:italic;
}

/* ---- gates / choices ---- */
#choices{display:grid;gap:8px;margin-top:14px}
.pick{
  display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;
  font:inherit;font-size:15.5px;line-height:1.45;color:var(--ink);
  background:var(--frost-thin);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.6);
  border-left:3px solid rgba(15,34,51,.22);
  border-radius:3px;padding:12px 14px;cursor:pointer;
  box-shadow:0 4px 14px rgba(15,34,51,.14);
  transition:background .15s,border-color .15s,transform .15s;
}
.pick:hover:not(:disabled){background:rgba(255,255,255,.97);border-left-color:var(--blue);transform:translateX(3px)}
.pick:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.pick:disabled{cursor:default}
.num{
  font-family:"SF Mono","Courier New",monospace;font-size:11px;
  color:var(--ink-soft);padding-top:3px;min-width:14px;
}
.pick.right{background:rgba(44,122,75,.92);color:#fff;border-left-color:#1c5433}
.pick.right .num{color:rgba(255,255,255,.75)}
.pick.wrong{background:rgba(201,55,44,.90);color:#fff;border-left-color:#8e2118}
.pick.wrong .num{color:rgba(255,255,255,.75)}
.pick.faded{opacity:.42}

/* ---- call ---- */
#call{
  margin-top:12px;min-height:58px;
  background:var(--frost);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.7);border-radius:3px;
  box-shadow:0 6px 20px rgba(15,34,51,.18);
  padding:0;overflow:hidden;
}
#call:empty{display:none}
#call .inner{padding:13px 15px}
.call-head{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  font-size:10px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;margin-bottom:6px;
}
.call-head.ok{color:var(--green)}
.call-head.bad{color:var(--red)}
.call-body{font-size:14.5px;line-height:1.58;color:#22394c}
.call-body strong{letter-spacing:.02em}
.call-body em{color:#0d4a7a;font-style:italic}

#next{
  display:none;margin-top:12px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;
  color:#fff;background:var(--ink);border:none;border-radius:3px;
  padding:13px 26px;cursor:pointer;box-shadow:0 6px 18px rgba(15,34,51,.3);
}
#next:hover{background:#1c3d5a}
#next:focus-visible{outline:2px solid var(--sun);outline-offset:3px}

/* ---- lodge ---- */
#lodge{
  display:none;text-align:center;
  background:var(--frost);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.75);border-radius:4px;
  padding:44px 24px 38px;box-shadow:0 14px 40px rgba(15,34,51,.26);
}
#lodge .rank{font-size:clamp(26px,7vw,40px);letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px}
#lodge .note{font-size:15px;line-height:1.65;color:#22394c;max-width:400px;margin:0 auto 24px}
#lodge .fig{
  font-family:"SF Mono","Courier New",monospace;font-size:11.5px;letter-spacing:.08em;
  color:var(--ink-soft);margin-bottom:26px;line-height:1.9;
}
#again{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;
  color:#fff;background:var(--ink);border:none;border-radius:3px;
  padding:13px 26px;cursor:pointer;
}
#again:hover{background:#1c3d5a}
#again:focus-visible{outline:2px solid var(--sun);outline-offset:3px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:430px){
  .gate{padding:24px 16px 22px}
  .pick{font-size:14.5px;padding:11px 12px}
  .mark{font-size:10.5px;letter-spacing:.15em}
  #slopeBtn{font-size:9px;padding:4px 7px}
}
</style>
</head>
<body>

<div id="slope"></div>

<main id="course">
  <div class="signbar">
    <div class="mark">Cursus</div>
    <button id="slopeBtn" type="button">Pine Peak</button>
    <div class="tally" id="tally">·</div>
  </div>

  <div class="mom">
    <div class="mom-label">Momentum</div>
    <div class="gauge" id="gauge"><span id="gaugeFill"></span></div>
    <div class="mom-label" id="momNum">50</div>
  </div>

  <section id="run">
    <div class="gate" id="gateCard">
      <div class="runline">
        <div class="badge" id="badge"></div>
        <div class="runname" id="runname">Green run · read the sign</div>
      </div>
      <div class="phrase" id="phrase">Sine qua non</div>
    </div>

    <div id="choices"></div>
    <div id="call"></div>
    <button id="next" type="button">Next gate</button>
  </section>

  <section id="lodge">
    <div class="rank" id="rank"></div>
    <p class="note" id="note"></p>
    <div class="fig" id="fig"></div>
    <button id="again" type="button">Take the lift back up</button>
  </section>
</main>

   t:1 green circle · t:2 blue square · t:3 black diamond
   ============================================================ */

const RUNS = {
  1:{label:"Green run", cls:"t1"},
  2:{label:"Blue run",  cls:"t2"},
  3:{label:"Black diamond", cls:"t3"}
};

const RANKS = [
  {min:.94,name:"Princeps Montis",note:"First of the mountain. You took every gate, on the black diamond as cleanly as the green."},
  {min:.84,name:"Magister Cursus",note:"Master of the course. Fast line, tight turns, almost nothing left on the hill."},
  {min:.72,name:"Peritus",       note:"Practiced. You know the run; a few gates on the steep pitch still get away."},
  {min:.58,name:"Viator",        note:"You get down honestly. The blues are yours, the diamonds are not yet."},
  {min:.42,name:"Discipulus",    note:"Still taking lessons. Stay on the green until the words come without thinking."},
  {min:.00,name:"Tiro",          note:"The rope tow is that way. No shame in it — everyone starts on the flats."}
];

const S={queue:[],i:0,mom:50,right:0,wrong:0,streak:0,best:0,locked:false,slope:0};
const $=id=>document.getElementById(id);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};

function setSlope(n){
  S.slope=(n+SLOPES.length)%SLOPES.length;
  $("slope").style.backgroundImage='url("'+SLOPES[S.slope].src+'")';
  $("slopeBtn").textContent=SLOPES[S.slope].name;
}

function start(){
  S.queue=[...shuffle(TERMS.filter(t=>t.t===1)),
           ...shuffle(TERMS.filter(t=>t.t===2)),
           ...shuffle(TERMS.filter(t=>t.t===3))];
  Object.assign(S,{i:0,mom:50,right:0,wrong:0,streak:0,best:0,locked:false});
  $("lodge").style.display="none";
  $("run").style.display="block";
  render();
}

function gauge(){
  $("gaugeFill").style.width=S.mom+"%";
  $("momNum").textContent=Math.round(S.mom);
  $("gauge").classList.toggle("low",S.mom<28);
}

function render(){
  S.locked=false;
  const term=S.queue[S.i];
  const run=RUNS[term.t];
  const reversed=Math.random()<0.3;

  $("tally").textContent="GATE "+(S.i+1)+"/"+S.queue.length+"  ·  STREAK "+S.streak;
  gauge();

  const card=$("gateCard");
  card.className="gate "+run.cls;
  $("badge").className="badge "+run.cls;
  $("runname").textContent=run.label+" · "+(reversed?"name the phrase":"read the sign");

  const p=$("phrase");
  p.textContent=reversed?term.d:term.l;
  p.classList.toggle("gloss",reversed);

  const pool=TERMS.filter(x=>x!==term);
  const near=shuffle(pool.filter(x=>x.t===term.t));
  const far=shuffle(pool.filter(x=>x.t!==term.t));
  const opts=shuffle([term,...[...near,...far].slice(0,3)]);

  const box=$("choices");
  box.innerHTML="";
  opts.forEach((o,n)=>{
    const b=document.createElement("button");
    b.type="button";
    b.className="pick";
    b.innerHTML='<span class="num">'+(n+1)+'</span><span>'+(reversed?o.l:o.d)+'</span>';
    b.onclick=()=>answer(b,o===term,term,opts);
    box.appendChild(b);
  });

  $("call").innerHTML="";
  $("next").style.display="none";
}

function answer(btn,correct,term,opts){
  if(S.locked)return;
  S.locked=true;

  [...document.querySelectorAll(".pick")].forEach((b,n)=>{
    b.disabled=true;
    if(opts[n]===term)b.classList.add("right");
    else if(b===btn)b.classList.add("wrong");
    else b.classList.add("faded");
  });

  if(correct){
    S.right++;S.streak++;S.best=Math.max(S.best,S.streak);
    S.mom=Math.min(100,S.mom+6+Math.min(4,Math.floor(S.streak/3)));
    $("call").innerHTML='<div class="inner"><div class="call-head ok">Clean gate'
      +(S.streak>=3?' · '+S.streak+' in a row':'')+'</div>'
      +'<div class="call-body"><strong>'+term.l+'</strong> — '+term.d+'. '+term.n+'</div></div>';
  }else{
    S.wrong++;S.streak=0;
    S.mom=Math.max(0,S.mom-9);
    $("call").innerHTML='<div class="inner"><div class="call-head bad">Gate missed</div>'
      +'<div class="call-body"><strong>'+term.l+'</strong> — '+term.d+'. '+term.n+'</div></div>';
  }
  gauge();

  if(S.mom<=0){setTimeout(()=>finish(true),950);return;}

  const nx=$("next");
  nx.textContent=(S.i+1>=S.queue.length)?"Ski in to the lodge":"Next gate";
  nx.style.display="inline-block";
  nx.focus({preventScroll:true});
}

function advance(){
  S.i++;
  if(S.i>=S.queue.length){finish(false);return;}
  render();
}

function finish(stalled){
  $("run").style.display="none";
  $("lodge").style.display="block";
  const asked=S.right+S.wrong;
  const pct=asked?S.right/asked:0;
  const r=stalled?RANKS[RANKS.length-1]:RANKS.find(x=>pct>=x.min);
  $("rank").textContent=r.name;
  $("note").textContent=stalled
    ? "You ran out of momentum and stopped on the flats. "+r.note
    : r.note;
  $("fig").innerHTML=
    S.right+" of "+asked+" gates cleared<br>longest clean run · "+S.best
    +"<br>momentum at the bottom · "+Math.round(S.mom);
}

$("next").onclick=advance;
$("again").onclick=start;
$("slopeBtn").onclick=()=>setSlope(S.slope+1);

document.addEventListener("keydown",e=>{
  if($("lodge").style.display==="block"){ if(e.key==="Enter")start(); return; }
  if(!S.locked&&e.key>="1"&&e.key<="4"){
    const b=document.querySelectorAll(".pick")[+e.key-1];
    if(b)b.click();
  }else if(S.locked&&(e.key==="Enter"||e.key===" ")){
    e.preventDefault();
    if($("next").style.display!=="none")advance();
  }
});

setSlope(0);
start();
</script>
</body>
</html>
