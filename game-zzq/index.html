<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cursus Honorum — Latin in the Forum</title>
<style>
:root{
  --marble:#e9dfcb;
  --marble-d:#b6a88d;
  --stone-ink:#241c15;
  --night:rgba(30,22,26,.80);
  --night-hi:rgba(52,40,44,.86);
  --rule:rgba(233,223,203,.20);
  --torch:#f0a03c;
  --torch-hi:#ffd98a;
  --porphyry:#a8433a;
  --laurel:#7d9464;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  color:var(--marble);
  background:#140f14;
  display:flex;align-items:center;justify-content:center;
  padding:18px;
}

/* ============ scene ============ */
#scene{
  position:fixed;top:50%;left:50%;
  width:max(100vw, calc(100vh * 1.8333));
  height:max(100vh, calc(100vw / 1.8333));
  transform:translate(-50%,-50%);
  z-index:0;overflow:hidden;
}
#plate{
  position:absolute;inset:0;
  background-size:cover;background-position:center;
}

/* --- live fire, drawn each frame over the dimmed cores --- */
#fire{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

/* --- foliage taking the evening breeze --- */
.leaf{position:absolute;pointer-events:none}
.leaf img{
  position:absolute;inset:0;width:100%;height:100%;
  transform-origin:50% 100%;
  animation:breeze 10s ease-in-out infinite alternate;
  will-change:transform;
}
@keyframes breeze{
  0%  {transform:skewX(calc(var(--a) * -1deg)) scaleY(1)}
  100%{transform:skewX(calc(var(--a) *  1deg)) scaleY(1.004)}
}

/* --- people, shifting their weight over half a minute or more --- */
.per{position:absolute;pointer-events:none}
.per img{
  position:absolute;inset:0;width:100%;height:100%;
  transform-origin:50% 100%;
  animation:shift 44s ease-in-out infinite alternate;
  will-change:transform;
}
@keyframes shift{
  0%  {transform:skewX(calc(var(--a) * -1deg))}
  100%{transform:skewX(calc(var(--a) *  1deg))}
}

/* --- the flock, drifting --- */
#flock{position:absolute;pointer-events:none}
#flock img{
  position:absolute;inset:0;width:100%;height:100%;
  animation:soar 88s ease-in-out infinite alternate;
  will-change:transform;
}
@keyframes soar{
  0%  {transform:translate(-1.2%, .5%)}
  50% {transform:translate( .6%, -.6%)}
  100%{transform:translate( 2.2%, .2%)}
}

#scene::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse 78% 66% at 50% 46%, transparent 42%, rgba(16,11,15,.52) 100%),
    linear-gradient(to bottom, rgba(16,11,15,.34), rgba(16,11,15,.50));
}

/* ============ interface ============ */
#forum{position:relative;z-index:1;width:100%;max-width:640px}

.caps{
  font-size:10px;letter-spacing:.28em;text-transform:uppercase;
  color:var(--marble-d);white-space:nowrap;
}

.lintel{
  display:flex;align-items:center;gap:14px;
  background:var(--night);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--rule);
  padding:11px 15px;margin-bottom:10px;
  box-shadow:0 8px 26px rgba(0,0,0,.45);
}
.lintel .title{
  font-size:12px;letter-spacing:.30em;text-transform:uppercase;color:var(--torch);
}
.lintel .tally{margin-left:auto;font-size:10.5px;letter-spacing:.20em;color:var(--marble-d);white-space:nowrap}

.gauge-row{
  display:flex;align-items:center;gap:12px;
  background:rgba(30,22,26,.62);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--rule);
  padding:9px 15px;margin-bottom:16px;
  box-shadow:0 6px 20px rgba(0,0,0,.38);
}
.gauge{flex:1;height:6px;background:rgba(0,0,0,.45);overflow:hidden}
.gauge span{display:block;height:100%;width:50%;
  background:linear-gradient(90deg,#8a6a2e,var(--torch));
  transition:width .45s cubic-bezier(.2,.7,.3,1),background .45s}
.gauge.low span{background:linear-gradient(90deg,#5e211c,var(--porphyry))}

/* ---- the inscribed base ---- */
.base{
  position:relative;
  background:linear-gradient(168deg,#f2e9d6 0%,#e2d6bd 52%,#c9bb9e 100%);
  color:var(--stone-ink);
  padding:32px 24px 30px;text-align:center;
  box-shadow:0 18px 44px rgba(0,0,0,.52), inset 0 1px 0 rgba(255,255,255,.7);
  border-top:1px solid rgba(255,255,255,.6);
}
.base::before{
  content:"";position:absolute;inset:9px;border:1px solid rgba(36,28,21,.17);pointer-events:none;
}
.office{
  display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:17px;
}
.grade{
  font-size:9.5px;letter-spacing:.16em;
  border:1px solid rgba(36,28,21,.42);
  padding:2px 6px;color:#4b3a2b;
}
.office .caps{color:#6a5540}

.phrase{
  font-size:clamp(24px,6vw,40px);
  letter-spacing:.07em;line-height:1.22;text-transform:uppercase;
  color:#7d2b26;
  text-shadow:0 1px 0 rgba(255,255,255,.55), 0 -1px 0 rgba(36,28,21,.22);
  word-break:break-word;
}
.phrase.gloss{
  text-transform:none;letter-spacing:.005em;font-style:italic;
  font-size:clamp(19px,4.4vw,27px);color:#2f251b;text-shadow:0 1px 0 rgba(255,255,255,.5);
}

/* ---- answers ---- */
#choices{display:grid;gap:8px;margin-top:14px}
.pick{
  display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;
  font:inherit;font-size:15.5px;line-height:1.45;color:var(--marble);
  background:var(--night);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--rule);
  padding:12px 15px;cursor:pointer;
  box-shadow:0 6px 18px rgba(0,0,0,.36);
  transition:background .15s,border-color .15s,transform .15s;
}
.pick:hover:not(:disabled){background:var(--night-hi);border-color:rgba(240,160,60,.55);transform:translateX(3px)}
.pick:focus-visible{outline:2px solid var(--torch);outline-offset:2px}
.pick:disabled{cursor:default}
.num{font-size:11px;letter-spacing:.1em;color:var(--torch);padding-top:3px;min-width:16px}
.pick.right{background:rgba(125,148,100,.34);border-color:var(--laurel)}
.pick.wrong{background:rgba(168,67,58,.34);border-color:var(--porphyry)}
.pick.wrong .num{color:#e6a49c}
.pick.faded{opacity:.40}

/* ---- verdict ---- */
#verdict{margin-top:12px}
#verdict:empty{display:none}
#verdict .inner{
  background:var(--night);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--rule);padding:13px 16px;
  box-shadow:0 6px 20px rgba(0,0,0,.4);
}
.vh{font-size:10px;letter-spacing:.26em;text-transform:uppercase;margin-bottom:7px}
.vh.ok{color:var(--laurel)}
.vh.bad{color:#d4736a}
.vb{font-size:14.5px;line-height:1.6;color:rgba(233,223,203,.86)}
.vb em{color:var(--torch-hi);font-style:italic}

#onward{
  display:none;margin-top:12px;font:inherit;
  font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;
  color:#241c15;background:var(--marble);border:none;
  padding:13px 26px;cursor:pointer;box-shadow:0 8px 22px rgba(0,0,0,.42);
}
#onward:hover{background:#fff8e9}
#onward:focus-visible{outline:2px solid var(--torch);outline-offset:3px}

/* ---- close ---- */
#curia{
  display:none;text-align:center;
  background:var(--night);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--rule);padding:46px 24px 40px;
  box-shadow:0 18px 44px rgba(0,0,0,.5);
}
#curia .rank{font-size:clamp(26px,7vw,40px);letter-spacing:.14em;text-transform:uppercase;color:var(--torch);margin-bottom:14px}
#curia .note{font-size:15px;line-height:1.66;color:rgba(233,223,203,.82);max-width:400px;margin:0 auto 26px}
#curia .fig{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--marble-d);line-height:2;margin-bottom:28px}
#restart{
  font:inherit;font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;
  color:#241c15;background:var(--marble);border:none;padding:13px 26px;cursor:pointer;
}
#restart:hover{background:#fff8e9}
#restart:focus-visible{outline:2px solid var(--torch);outline-offset:3px}

@media (prefers-reduced-motion:reduce){
  .leaf img,#flock img,.per img{animation:none!important}
  *{transition:none!important}
}
@media (max-width:430px){
  .base{padding:26px 16px 24px}
  .pick{font-size:14.5px;padding:11px 12px}
  .lintel .title{font-size:11px;letter-spacing:.2em}
  .lintel{gap:10px}
}
</style>
</head>
<body>

<div id="scene">
  <div id="plate"></div>
  <div id="canopy"></div>
  <div id="flock"></div>
  <div id="crowd"></div>
  <canvas id="fire"></canvas>
</div>

<main id="forum">
  <div class="lintel">
    <div class="title">Cursus Honorum</div>
    <div class="tally" id="tally">·</div>
  </div>

  <div class="gauge-row">
    <div class="caps">Auctoritas</div>
    <div class="gauge" id="gauge"><span id="gaugeFill"></span></div>
    <div class="caps" id="gaugeNum">50</div>
  </div>

  <section id="stage">
    <div class="base">
      <div class="office">
        <span class="grade" id="grade">I</span>
        <span class="caps" id="office">Quaestura · read the stone</span>
      </div>
      <div class="phrase" id="phrase">Sine qua non</div>
    </div>

    <div id="choices"></div>
    <div id="verdict"></div>
    <button id="onward" type="button">Next stone</button>
  </section>

  <section id="curia">
    <div class="rank" id="rank"></div>
    <p class="note" id="note"></p>
    <div class="fig" id="fig"></div>
    <button id="restart" type="button">Stand again</button>
  </section>
</main>

/* ---------------------------------------------------------------
   FIRE — every flame is drawn live. The photograph has its cores
   dimmed, so this canvas is supplying the actual light.
   --------------------------------------------------------------- */
const cv=$("fire"), ctx=cv.getContext("2d");
const STILL=matchMedia("(prefers-reduced-motion:reduce)").matches;

function lightTex(size,stops){
  const c=document.createElement("canvas");c.width=c.height=size;
  const g=c.getContext("2d");
  const rg=g.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  for(const[p,col]of stops)rg.addColorStop(p,col);
  g.fillStyle=rg;g.fillRect(0,0,size,size);
  return c;
}
const GLOW=lightTex(160,[[0,"rgba(255,178,96,.50)"],[.20,"rgba(248,146,54,.26)"],
                         [.52,"rgba(212,102,28,.085)"],[1,"rgba(176,78,18,0)"]]);
const CORE=lightTex(112,[[0,"rgba(255,251,236,1)"],[.16,"rgba(255,235,178,.94)"],
                         [.42,"rgba(255,180,84,.44)"],[.78,"rgba(242,132,42,.10)"],
                         [1,"rgba(232,112,30,0)"]]);

let W=0,H=0;
function fit(){
  const dpr=Math.min(2,devicePixelRatio||1);
  W=cv.clientWidth; H=cv.clientHeight;
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}

/* four incommensurate waves, and every lamp burns at its own rate,
   so no two flames ever fall into step */
for(const L of LAMPS) L.k = .84 + ((L.seed*37)%100)/100 * .34;

function flick(t,s,k){
  const u=t*k;
  const v=.58+.20*Math.sin(u*1.15+s)
            +.13*Math.sin(u*1.94+s*1.7)
            +.09*Math.sin(u*3.36+s*0.6)
            +.06*Math.sin(u*5.65+s*2.3);
  return v<.12?.12:v>1?1:v;
}

function draw(ms){
  const t=ms/1000;
  ctx.clearRect(0,0,W,H);
  ctx.globalCompositeOperation="lighter";
  for(const L of LAMPS){
    const s=L.seed, f=STILL?.62:flick(t,s,L.k);
    const x=L.x/100*W, y=L.y/100*H;
    const r=Math.max(1.1, L.r/100*W)*L.s;

    /* pool of light on the stonework */
    const gr=r*5.0+W*.0022*(1+.5*L.s);
    const gs=gr*(.90+.22*f);
    ctx.globalAlpha=(.19+.30*f)*L.g;
    ctx.drawImage(GLOW,x-gs,y-gs,gs*2,gs*2);

    /* the flame itself — leans, stretches, never sits still */
    const sway=STILL?0:r*.30*Math.sin(t*.95*L.k+s*3.1);
    const cw=r*(1.55+.55*f), ch=cw*(1.55+.45*f);
    ctx.globalAlpha=(.60+.36*f)*(.55+.45*L.g);
    ctx.drawImage(CORE,x-cw/2+sway,y-ch*.60,cw,ch);
  }
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation="source-over";
}

let raf=null;
function loop(ms){ draw(ms); raf=requestAnimationFrame(loop); }
function run(){
  fit();
  if(STILL){draw(0);return;}
  if(raf===null)raf=requestAnimationFrame(loop);
}
addEventListener("resize",()=>{fit();if(STILL)draw(0);});
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
  else if(!STILL&&raf===null)raf=requestAnimationFrame(loop);
});
run();

function start(){
  S.queue=[...shuffle(TERMS.filter(t=>t.t===1)),
           ...shuffle(TERMS.filter(t=>t.t===2)),
           ...shuffle(TERMS.filter(t=>t.t===3))];
  Object.assign(S,{i:0,auct:50,right:0,wrong:0,streak:0,best:0,locked:false});
  $("curia").style.display="none";
  $("stage").style.display="block";
  render();
}

function gauge(){
  $("gaugeFill").style.width=S.auct+"%";
  $("gaugeNum").textContent=Math.round(S.auct);
  $("gauge").classList.toggle("low",S.auct<28);
}

function render(){
  S.locked=false;
  const term=S.queue[S.i], g=GRADES[term.t];
  const reversed=Math.random()<0.3;

  $("tally").textContent=roman(S.i+1)+" of "+roman(S.queue.length)+"  ·  Streak "+S.streak;
  gauge();
  $("grade").textContent=g.num;
  $("office").textContent=g.name+" · "+(reversed?"name the phrase":"read the stone");

  const p=$("phrase");
  p.textContent=reversed?term.d:term.l;
  p.classList.toggle("gloss",reversed);

  const pool=TERMS.filter(x=>x!==term);
  const near=shuffle(pool.filter(x=>x.t===term.t));
  const far=shuffle(pool.filter(x=>x.t!==term.t));
  const opts=shuffle([term,...[...near,...far].slice(0,3)]);

  const box=$("choices");
  box.innerHTML="";
  opts.forEach((o,n)=>{
    const b=document.createElement("button");
    b.type="button";b.className="pick";
    b.innerHTML='<span class="num">'+roman(n+1)+'</span><span>'+(reversed?o.l:o.d)+'</span>';
    b.onclick=()=>answer(b,o===term,term,opts);
    box.appendChild(b);
  });

  $("verdict").innerHTML="";
  $("onward").style.display="none";
}

function answer(btn,correct,term,opts){
  if(S.locked)return;
  S.locked=true;

  [...document.querySelectorAll(".pick")].forEach((b,n)=>{
    b.disabled=true;
    if(opts[n]===term)b.classList.add("right");
    else if(b===btn)b.classList.add("wrong");
    else b.classList.add("faded");
  });

  if(correct){
    S.right++;S.streak++;S.best=Math.max(S.best,S.streak);
    S.auct=Math.min(100,S.auct+6+Math.min(4,Math.floor(S.streak/3)));
    $("verdict").innerHTML='<div class="inner"><div class="vh ok">Acclaimed'
      +(S.streak>=3?' · '+S.streak+' running':'')+'</div>'
      +'<div class="vb"><strong>'+term.l+'</strong> — '+term.d+'. '+term.n+'</div></div>';
  }else{
    S.wrong++;S.streak=0;
    S.auct=Math.max(0,S.auct-9);
    $("verdict").innerHTML='<div class="inner"><div class="vh bad">The Forum murmurs</div>'
      +'<div class="vb"><strong>'+term.l+'</strong> — '+term.d+'. '+term.n+'</div></div>';
  }
  gauge();

  if(S.auct<=0){setTimeout(()=>finish(true),950);return;}

  const nx=$("onward");
  nx.textContent=(S.i+1>=S.queue.length)?"Hear the result":"Next stone";
  nx.style.display="inline-block";
  nx.focus({preventScroll:true});
}

function advance(){
  S.i++;
  if(S.i>=S.queue.length){finish(false);return;}
  render();
}

function finish(spent){
  $("stage").style.display="none";
  $("curia").style.display="block";
  const asked=S.right+S.wrong, pct=asked?S.right/asked:0;
  const r=spent?RANKS[RANKS.length-1]:RANKS.find(x=>pct>=x.min);
  $("rank").textContent=r.name;
  $("note").textContent=spent
    ? "Your auctoritas was spent before the stones ran out. "+r.note
    : r.note;
  $("fig").innerHTML=
    S.right+" of "+asked+" read true<br>longest run · "+S.best
    +"<br>auctoritas · "+Math.round(S.auct);
}

$("onward").onclick=advance;
$("restart").onclick=start;

document.addEventListener("keydown",e=>{
  if($("curia").style.display==="block"){if(e.key==="Enter")start();return;}
  if(!S.locked&&e.key>="1"&&e.key<="4"){
    const b=document.querySelectorAll(".pick")[+e.key-1];
    if(b)b.click();
  }else if(S.locked&&(e.key==="Enter"||e.key===" ")){
    e.preventDefault();
    if($("onward").style.display!=="none")advance();
  }
});

start();
</script>
</body>
</html>
