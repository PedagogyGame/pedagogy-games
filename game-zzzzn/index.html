<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ravenswick Brewery — Movement-Native Restart</title>
<style>
:root{--bg:#05090d;--panel:rgba(12,18,24,.9);--edge:rgba(239,205,135,.22);--text:#f5e8c8;--muted:#b7a680;--gold:#e5bc62;--water:#56b8e8;--hot:#e99042;--wort:#d7ad4b;--green:#7eb879;--brick:#3c291f;--mortar:#211713;--wood:#5d3b25;--iron:#2c363b;--copper:#b7682f}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit}
#game{position:relative;width:100vw;height:100vh;overflow:hidden;background:radial-gradient(circle at 50% 30%,#102232,#05090d 72%);user-select:none}
#viewport{position:absolute;inset:0;overflow:hidden;cursor:grab;touch-action:none}#viewport.dragging{cursor:grabbing}
#world{width:100%;height:100%;display:block}.roomHit{fill:transparent;pointer-events:all;cursor:pointer}.roomHit:hover{fill:rgba(255,220,130,.025)}
.glass{background:linear-gradient(180deg,rgba(21,28,35,.9),rgba(9,13,17,.82));border:1px solid var(--edge);box-shadow:0 18px 42px rgba(0,0,0,.3);backdrop-filter:blur(12px)}
#brand{position:absolute;left:16px;top:16px;z-index:20;padding:10px 14px;border-radius:16px;font-weight:800;letter-spacing:.13em;font-size:14px;pointer-events:none}#brand small{display:block;margin-top:3px;font-size:9px;letter-spacing:.2em;color:var(--muted)}
#controls{position:absolute;right:14px;top:14px;z-index:20;display:flex;gap:7px;padding:7px;border-radius:18px}.btn{border:1px solid rgba(239,205,135,.14);background:rgba(255,255,255,.04);color:var(--text);padding:8px 11px;border-radius:12px;cursor:pointer;font-weight:650}.btn:hover,.btn.active{border-color:rgba(239,205,135,.42);background:rgba(229,188,98,.13)}
#roomBar{position:absolute;left:50%;bottom:14px;z-index:20;transform:translateX(-50%);display:flex;gap:5px;padding:7px;border-radius:17px;max-width:calc(100vw - 310px);overflow:auto}.roomBtn{white-space:nowrap;border:1px solid rgba(239,205,135,.12);background:rgba(255,255,255,.03);color:#e7d8b5;padding:7px 10px;border-radius:999px;cursor:pointer;font-size:11px;font-weight:700}.roomBtn:hover{border-color:rgba(239,205,135,.35)}
#status{position:absolute;left:14px;bottom:14px;z-index:20;width:270px;padding:10px 12px;border-radius:16px;font-size:11px;color:var(--muted);line-height:1.42}#status b{color:#f5e8c8}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#79c879;box-shadow:0 0 10px rgba(121,200,121,.55);margin-right:6px}
#info{position:absolute;z-index:30;display:none;width:min(360px,calc(100vw - 24px));padding:14px 15px;border-radius:18px}.infoK{font-size:10px;color:var(--muted);letter-spacing:.15em;text-transform:uppercase}.infoT{font-size:19px;font-weight:800;margin:4px 0 6px}.infoD{font-size:13px;line-height:1.45;color:#d9ccab}.close{position:absolute;right:8px;top:8px;width:28px;height:28px;border-radius:50%;border:1px solid rgba(239,205,135,.14);background:rgba(255,255,255,.04);color:var(--text);cursor:pointer}
svg text{font-family:Georgia,"Times New Roman",serif}.roomTitle{font-size:17px;letter-spacing:1.8px;fill:#edcf83;font-weight:700}.subLabel{font-size:10px;fill:#bda77a;letter-spacing:1.2px}.beam{fill:#2a1d17;stroke:#634634;stroke-width:4}.worker{filter:drop-shadow(0 2px 2px rgba(0,0,0,.45))}.skin{fill:#c99b70}.shirt{fill:#d8d2c4}.vest{fill:#55534d}.pants{stroke:#26343c;stroke-width:9;stroke-linecap:round}.boot{stroke:#17191a;stroke-width:5;stroke-linecap:round}.arm{stroke:#d6cfc1;stroke-width:8;stroke-linecap:round}.forearm{stroke:#c99b70;stroke-width:6;stroke-linecap:round}.tool{stroke:#987249;stroke-width:5;stroke-linecap:round}.metal{stroke:#768187;fill:none}.pipe{fill:none;stroke:#927348;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.steam{fill:rgba(235,229,210,.35)}.bubble{fill:rgba(255,241,196,.15);stroke:rgba(255,238,183,.65);stroke-width:1}.flow{fill:none;stroke-linecap:round;stroke-width:5;stroke-dasharray:10 13;opacity:.7}.nightLamp{fill:#ffd98c;filter:url(#glow)}
@media(max-width:850px){#brand{display:none}#controls{left:8px;right:8px;justify-content:flex-end}#roomBar{display:none}#status{width:190px;font-size:10px}}
</style>
</head>

<g id="cooler"><rect x="970" y="345" width="150" height="145" rx="12" fill="#1f2d33" stroke="#729aa7" stroke-width="4"/><path id="wortCool" class="flow" d="M985 375H1105V460H985Z" stroke="#df963f"/><path id="waterCool" class="flow" d="M1105 390H995V445H1105" stroke="#58bce9"/><g stroke="#9eb3ba" stroke-width="5"><line x1="1000" y1="370" x2="1000" y2="465"/><line x1="1020" y1="370" x2="1020" y2="465"/><line x1="1040" y1="370" x2="1040" y2="465"/><line x1="1060" y1="370" x2="1060" y2="465"/><line x1="1080" y1="370" x2="1080" y2="465"/></g></g>

<div id="info" class="glass"><button id="closeInfo" class="close">×</button><div class="infoK" id="infoK"></div><div class="infoT" id="infoT"></div><div class="infoD" id="infoD"></div></div>

<script>
const NS='http://www.w3.org/2000/svg',svg=document.getElementById('world'),viewport=document.getElementById('viewport');
const S=(tag,a={})=>{const e=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);return e};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let view={x:0,y:0,w:1600,h:900},drag=false,lx=0,ly=0;function setView(){svg.setAttribute('viewBox',`${view.x} ${view.y} ${view.w} ${view.h}`)}
function focus(x,y,w,h){view={x,y,w,h};setView()}function overview(){view={x:0,y:0,w:1600,h:900};setView()}
viewport.addEventListener('wheel',e=>{e.preventDefault();const r=viewport.getBoundingClientRect(),mx=view.x+(e.clientX-r.left)/r.width*view.w,my=view.y+(e.clientY-r.top)/r.height*view.h,f=Math.exp(e.deltaY*.001);const nw=clamp(view.w*f,300,1800),nh=nw*900/1600;view.x=mx-(mx-view.x)*nw/view.w;view.y=my-(my-view.y)*nh/view.h;view.w=nw;view.h=nh;setView()},{passive:false});
viewport.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag=true;lx=e.clientX;ly=e.clientY;viewport.setPointerCapture(e.pointerId);viewport.classList.add('dragging')});viewport.addEventListener('pointermove',e=>{if(!drag)return;const r=viewport.getBoundingClientRect();view.x-=(e.clientX-lx)/r.width*view.w;view.y-=(e.clientY-ly)/r.height*view.h;lx=e.clientX;ly=e.clientY;setView()});viewport.addEventListener('pointerup',e=>{drag=false;viewport.classList.remove('dragging');try{viewport.releasePointerCapture(e.pointerId)}catch{}});
const roomDefs={
'Malt house':[90,105,390,200,'Malt handling','Workers shovel and rake malt while a roller mill waits at the right.'],
'Grain elevator':[440,105,185,200,'Vertical grain handling','Buckets circulate up one side and return down the other.'],
'Yeast room':[595,105,360,200,'Yeast preparation','A worker tends crocks and a yeast vessel; foam moves independently.'],
'Hop store':[930,105,580,200,'Hop storage','A worker handles hop sacks and hanging hops.'],
'Mash tun':[95,280,495,265,'Mashing','A slow rotating rake mixes grist with hot liquor; the worker moves with the task.'],
'Copper house':[570,280,380,265,'Boiling','Two copper kettles boil wort while a worker tends the valves.'],
'Cooler':[930,280,230,265,'Wort cooling','Orange wort and blue cooling water move through separate paths.'],
'Fermentation':[1140,280,360,265,'Fermentation','Bubbles rise through four fermenters while the worker checks the vessels.'],
'Engine':[95,525,495,340,'Power transmission','The flywheel, crank, connecting rod and piston are mechanically coupled.'],
'Pump room':[570,525,380,340,'Pumping','The pump wheel drives a crank and reciprocating plunger.'],
'Cellar / bottling':[930,525,570,340,'Packaging and cellar','Bottles advance under filler nozzles while cellar casks remain nearby.']};
const roomBar=document.getElementById('roomBar');for(const[n,d]of Object.entries(roomDefs)){const b=document.createElement('button');b.className='roomBtn';b.textContent=n;b.onclick=()=>focus(d[0],d[1],d[2],d[3]);roomBar.appendChild(b)}
const info=document.getElementById('info');document.querySelectorAll('.roomHit').forEach(h=>h.addEventListener('click',e=>{if(drag)return;const n=h.dataset.room,d=roomDefs[n],r=viewport.getBoundingClientRect();document.getElementById('infoK').textContent=d[4];document.getElementById('infoT').textContent=n;document.getElementById('infoD').textContent=d[5];info.style.left=clamp(e.clientX+12,12,innerWidth-380)+'px';info.style.top=clamp(e.clientY-25,70,innerHeight-190)+'px';info.style.display='block'}));document.getElementById('closeInfo').onclick=()=>info.style.display='none';document.getElementById('reset').onclick=overview;
// Populate vessels and mechanisms
const bucketsG=document.getElementById('buckets'),bucketEls=[];for(let i=0;i<10;i++){const g=S('g');g.appendChild(S('path',{d:'M-9 -5H9L7 7H-7Z',fill:'#9b7338',stroke:'#d4ad63','stroke-width':1.4}));bucketsG.appendChild(g);bucketEls.push(g)}
const crocks=document.getElementById('yeastCrocks');for(let i=0;i<7;i++){crocks.appendChild(S('path',{d:`M${660+i*32} 168h22v30q0 10-11 10t-11-10Z`,fill:'#b69d76',stroke:'#6f593e','stroke-width':2}))}
const foam=document.getElementById('yeastFoam'),foamEls=[];for(let i=0;i<20;i++){const c=S('circle',{r:2+(i%4)*.7,fill:'#fff3d5',opacity:.72});foam.appendChild(c);foamEls.push({e:c,ph:Math.random()})}
function addBoil(id,cx){const g=document.getElementById(id);for(let i=0;i<20;i++){const c=S('circle',{r:2+(i%4),fill:'#f4cb76',opacity:.35});g.appendChild(c);c.dataset.i=i;c.dataset.cx=cx}}
addBoil('boilA',100);addBoil('boilB',100);
const tanks=document.getElementById('fermentTanks');[1190,1270,1350,1430].forEach(x=>{const g=S('g');g.innerHTML=`<path d="M${x-34} 350V465Q${x} 490 ${x+34} 465V350Z" fill="#6f4b2a" stroke="#a77a43" stroke-width="4"/><ellipse cx="${x}" cy="350" rx="34" ry="13" fill="#d6b765"/><rect x="${x-4}" y="326" width="8" height="22" fill="#b18b4c"/>`;tanks.appendChild(g)});
const fbg=document.getElementById('fermentBubbles'),fb=[];for(let i=0;i<80;i++){const c=S('circle',{class:'bubble',r:2+(i%4)*.6});fbg.appendChild(c);fb.push({e:c,tank:i%4,ph:Math.random(),spd:.08+Math.random()*.08,dx:(Math.random()-.5)*48})}
const spokes=document.getElementById('spokes');for(let i=0;i<8;i++){const a=i*Math.PI/4;spokes.appendChild(S('line',{x1:365,y1:690,x2:365+78*Math.cos(a),y2:690+78*Math.sin(a),stroke:'#77705b','stroke-width':5}))}

function animateWorker(w,t){const q=t+w.ph,sw=Math.sin(q),fast=Math.sin(q*2);w.r.setAttribute('transform',`translate(${w.x} ${w.y+Math.abs(fast)*.8}) scale(${w.s})`);let a=0,b=0;switch(w.task){case'shovel':a=18+Math.sin(q*.9)*25;b=-20-Math.sin(q*.9)*20;break;case'rake':a=15+Math.sin(q*.65)*18;b=-15-Math.sin(q*.65)*14;break;case'yeast':a=25+Math.sin(q*.8)*12;b=-25-Math.sin(q*.8)*12;break;case'hop':a=18+Math.sin(q)*18;b=-18-Math.sin(q)*14;break;case'mash':a=20+Math.sin(q*.7)*20;b=-22-Math.sin(q*.7)*16;break;case'valve':a=28+Math.sin(q*1.1)*15;b=-28-Math.sin(q*1.1)*15;break;case'inspect':a=10+Math.sin(q*.55)*8;b=-12-Math.sin(q*.55)*8;break;case'engine':a=15+Math.sin(q*1.4)*20;b=-16-Math.sin(q*1.4)*18;break;case'pump':a=22+Math.sin(q*1.5)*22;b=-20-Math.sin(q*1.5)*20;break;case'bottle':a=12+Math.sin(q*1.7)*14;b=-12-Math.sin(q*1.7)*14;break}rot(w.parts.arm1,a,-12,-69);rot(w.parts.fore1,b,-25,-45);rot(w.parts.arm2,-a,12,-69);rot(w.parts.fore2,-b,25,-48);rot(w.parts.leg1,sw*4,-6,-32);rot(w.parts.leg2,-sw*4,7,-32);if(w.parts.toolEl)rot(w.parts.toolEl,(a-b)*.25,0,-28)}
