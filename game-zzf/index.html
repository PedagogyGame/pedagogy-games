<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electric Motor Anatomy Game</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: #2c3e50;
            color: #ecf0f1;
            margin: 0;
            padding: 20px;
        }

        h1 {
            margin-bottom: 5px;
        }

        #game-ui {
            margin-bottom: 20px;
        }

        #target-display {
            font-size: 28px;
            font-weight: bold;
            color: #f1c40f;
            margin: 10px 0;
            min-height: 40px;
        }

        #score-board {
            font-size: 20px;
        }

        #feedback {
            height: 24px;
            font-weight: bold;
            color: #e74c3c;
        }

        /* The container that holds both the image and the hotspots */
        /* It rotates, so the hotspots perfectly track the image parts */
        #motor-container {
            position: relative;
            display: inline-block;
            margin: 40px auto;
            width: 600px; /* Adjust based on your image size */
            height: 600px;
            transition: transform 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 50%; /* Makes rotation look cleaner */
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            background-color: #fff;
            overflow: hidden;
        }

        #motor-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none; /* Prevents image from blocking hotspot clicks */
        }

        /* Invisible clickable areas */
        .hotspot {
            position: absolute;
            cursor: pointer;
            z-index: 10;
            /* Hidden by default so there are no hints */
            background-color: transparent; 
            border: none;
        }

        /* Toggle this class via the debug button to calibrate your boxes */
        .debug-mode .hotspot {
            background-color: rgba(231, 76, 60, 0.4);
            border: 2px dashed #e74c3c;
        }

        .debug-mode .hotspot:hover {
            background-color: rgba(46, 204, 113, 0.5);
        }

        button.debug-btn {
            margin-top: 20px;
            padding: 8px 16px;
            background-color: #7f8c8d;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Electric Motor Anatomy Game</h1>
    
    <div id="game-ui">
        <div id="score-board">Points: <span id="score">0</span></div>
        <div id="target-display">Loading sequence...</div>
        <div id="feedback"></div>
    </div>

    <div id="motor-container">
        <img id="motor-image" src="cartoon-motor.png" alt="Electric Motor">
        
        </div>

    <button class="debug-btn" onclick="toggleDebug()">Toggle Calibration Mode</button>

    <script>
        // Game State
        let currentStep = 0;
        let score = 0;

        // Sequence of questions and exact coordinates for each part
        // IMPORTANT: You must adjust top, left, width, height, and angle for your specific cartoon image!
        const gameSequence = [
            { id: "housing", name: "Housing / Frame", angle: 0, top: "2%", left: "2%", width: "96%", height: "96%" },
            { id: "stator", name: "Stator", angle: 45, top: "15%", left: "15%", width: "70%", height: "70%" },
            { id: "windings", name: "Windings / Coils", angle: 90, top: "25%", left: "25%", width: "50%", height: "50%" },
            { id: "rotor", name: "Rotor", angle: 135, top: "35%", left: "35%", width: "30%", height: "30%" },
            { id: "armature", name: "Armature", angle: 180, top: "40%", left: "40%", width: "20%", height: "20%" },
            { id: "commutator", name: "Commutator", angle: 225, top: "45%", left: "20%", width: "10%", height: "10%" },
            { id: "brushes", name: "Brushes", angle: 270, top: "42%", left: "15%", width: "5%", height: "16%" },
            { id: "shaft", name: "Shaft", angle: 315, top: "48%", left: "0%", width: "100%", height: "4%" },
            { id: "bearings", name: "Bearings", angle: 360, top: "45%", left: "10%", width: "5%", height: "10%" }
        ];

        const container = document.getElementById("motor-container");

        // Initialization: Create hotspots dynamically
        function initGame() {
            gameSequence.forEach(part => {
                const spot = document.createElement("div");
                spot.className = "hotspot";
                spot.id = "hs-" + part.id;
                spot.dataset.part = part.name;
                
                // Set CSS mapping
                spot.style.top = part.top;
                spot.style.left = part.left;
                spot.style.width = part.width;
                spot.style.height = part.height;
                
                // Add click listener
                spot.addEventListener("click", handleInteraction);
                
                container.appendChild(spot);
            });

            // Start the first question
            loadQuestion();
        }

        function loadQuestion() {
            if (currentStep >= gameSequence.length) {
                document.getElementById('target-display').innerText = "Game Complete!";
                document.getElementById('target-display').style.color = "#2ecc71";
                document.getElementById('feedback').innerText = "You successfully identified all parts.";
                container.style.transform = "rotate(0deg)"; // Reset rotation
                return;
            }

            const currentPart = gameSequence[currentStep];
            
            // Update UI
            document.getElementById('target-display').innerText = `Identify the: ${currentPart.name}`;
            document.getElementById('feedback').innerText = "";
            document.getElementById('feedback').style.color = "#e74c3c"; // reset to red for errors
            
            // Rotate the entire engine so the part is favorably positioned
            container.style.transform = `rotate(${currentPart.angle}deg)`;
        }

        function handleInteraction(event) {
            // If game is over, do nothing
            if (currentStep >= gameSequence.length) return;

            const clickedPartName = event.target.dataset.part;
            const currentPartName = gameSequence[currentStep].name;

            // Stop event bubbling so clicking a nested hotspot doesn't register twice
            event.stopPropagation();

            if (clickedPartName === currentPartName) {
                // Correct!
                score += 100;
                document.getElementById('score').innerText = score;
                document.getElementById('feedback').style.color = "#2ecc71";
                document.getElementById('feedback').innerText = "Correct!";
                
                // Disable the clicked hotspot so it doesn't block underlying parts later
                event.target.style.display = "none";
                
                currentStep++;
                
                // Slight delay before next question so they see the "Correct!" message
                setTimeout(loadQuestion, 800);
            } else {
                // Wrong!
                score = Math.max(0, score - 25); // Deduct points, min score 0
                document.getElementById('score').innerText = score;
                document.getElementById('feedback').innerText = "Incorrect. Look closely and try again!";
            }
        }

        // If user clicks the container but misses all hotspots
        container.addEventListener("click", function(e) {
            if (e.target.id === "motor-container" && currentStep < gameSequence.length) {
                score = Math.max(0, score - 25);
                document.getElementById('score').innerText = score;
                document.getElementById('feedback').innerText = "You missed! Click directly on the part.";
            }
        });

        // Debug mode function to help you calibrate your CSS percentages
        function toggleDebug() {
            container.classList.toggle("debug-mode");
        }

        // Start game
        window.onload = initGame;
    </script>
</body>
</html>
