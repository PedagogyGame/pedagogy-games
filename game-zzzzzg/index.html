<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Chinese Character Study · 1001–1100</title>
<style>
:root{--ink:#241b16;--muted:#74665c;--paper:#f4efe5;--panel:#fbf8f1;--line:#c7b8a3;--deep:#3b2017;--good:#285c3c;--bad:#8a2f27;--gold:#9a7440}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(1200px 700px at 12% -10%,rgba(255,248,230,.4),transparent 52%),linear-gradient(180deg,#c3b7a2 0%,#d6cebc 42%,#b9ad97 100%);color:var(--ink);font-family:Georgia,"Times New Roman","Noto Serif SC","Songti SC",serif;overflow:hidden}
.app{height:100vh;display:grid;grid-template-rows:auto 1fr;gap:0}
.topbar{min-height:58px;display:flex;align-items:center;gap:14px;padding:8px 18px;background:rgba(28,22,17,.96);color:#f8f1e5;border-bottom:2px solid #c4a46a}
.brand{font-size:18px;font-weight:700;letter-spacing:.05em;white-space:nowrap}.brand small{font-size:12px;font-weight:400;opacity:.7;margin-left:8px}
.progress{flex:1;max-width:460px;height:7px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:#d9b578;width:1%;transition:width .25s ease}
.stat{font-size:13px;opacity:.88;white-space:nowrap}.topbtn{border:1px solid rgba(255,255,255,.28);background:transparent;color:white;border-radius:8px;padding:7px 10px;cursor:pointer}
.main{min-height:0;display:grid;grid-template-columns:minmax(390px,46%) 1fr;gap:18px;padding:18px}
.quiz{min-height:0;background:rgba(252,248,239,.97);border:1.5px solid #6e5744;box-shadow:inset 0 0 0 5px #f3eadc,0 16px 48px rgba(40,28,18,.22);border-radius:6px;padding:18px 22px 16px;display:flex;flex-direction:column;overflow:auto}
.rankline{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.09em}
.character{text-align:center;font-family:"Noto Serif SC","Songti SC","STSong",serif;font-size:clamp(92px,11vw,164px);line-height:.95;margin:8px 0 0;color:#20130e;text-shadow:0 1px 0 #fff}
.pinyin{text-align:center;font-size:clamp(24px,2.6vw,39px);font-style:italic;color:#6f3827;margin:0 0 8px}
.front-pinyin{display:none}.prompt{text-align:center;font-size:16px;margin:2px 0 8px;color:#77675b}
button{font:600 13px/1.1 Georgia,serif;letter-spacing:.03em}
.controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:3px 0 7px}.controls .nav{display:flex;gap:6px;margin-right:6px}.ghost,.action{padding:9px 12px;border-radius:8px;cursor:pointer}.ghost{border:1px solid #b4a38e;background:#f6f0e5;color:#3e3028}.action{border:1px solid #6c4933;background:#6c4933;color:#fff}
.reveal{border-top:1px solid #d7caba;padding-top:9px;margin-top:2px;animation:fade .18s ease}.reveal-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:5px}.reveal-pinyin{font-size:clamp(27px,2.8vw,42px);font-style:italic;color:#6f3827;font-weight:700}.definition{font-size:20px;margin:0}.definition b{color:#6d3b27}.wordtitle,.extitle{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:#7a685a;margin:9px 0 4px;font-weight:700}.wordlist{display:flex;gap:6px;flex-wrap:wrap}.wordchip{background:#eee4d4;border:1px solid #d1c0a8;border-radius:7px;padding:5px 8px;line-height:1.18}.wordchip .wzh{font-family:"Noto Serif SC","Songti SC",serif;font-size:19px;font-weight:700}.wordchip .wpy{font-size:13px;font-style:italic;color:#754635}.wordchip .wen{font-size:12px;color:#66594f}.examples{display:grid;gap:5px}.example{padding:6px 9px;background:#f3ede2;border-left:3px solid #aa8558;border-radius:5px;line-height:1.22}.example-zh{font-family:"Noto Serif SC","Songti SC",serif;font-size:clamp(19px,1.65vw,25px)}.example-py{font-size:clamp(14px,1.1vw,17px);font-style:italic;color:#744b39;margin-top:2px}.example-en{font-size:clamp(13px,1vw,16px);color:#4f463f;margin-top:2px}.example em{font-style:normal;font-weight:800;color:#8d2f21;background:#ead9bf;border-radius:3px;padding:0 .05em}
.flipcard{margin-top:3px;border:1px solid #b6a58d;border-radius:10px;padding:12px 14px;background:#f4ecdd}.flipcard h3{margin:0 0 7px;font-size:15px;color:#6d594b;text-transform:uppercase;letter-spacing:.08em}.english-list{font-size:clamp(24px,2.2vw,34px);line-height:1.2;margin:0 0 10px}.further{border:1px solid #6c4933;background:transparent;color:#6c4933;border-radius:8px;padding:8px 11px;cursor:pointer}
.imagepane{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;background:rgba(24,18,14,.9);border:1.5px solid #4a3728;border-radius:6px;overflow:hidden;box-shadow:inset 0 0 0 7px rgba(239,220,184,.14),0 16px 48px rgba(40,28,18,.24)}
.imagepane:before{content:"";position:absolute;inset:9px;border:1px solid rgba(239,220,184,.3);border-radius:2px;pointer-events:none}.art{display:block;max-width:94%;max-height:90%;width:auto;height:auto;object-fit:contain;filter:saturate(.98) contrast(1.02);box-shadow:0 8px 32px rgba(0,0,0,.28);transition:opacity .35s ease,transform .35s ease}.art.wide{max-width:98%;max-height:84%}
.imagecount{position:absolute;right:18px;bottom:14px;color:rgba(255,255,255,.72);font:12px/1.2 Georgia,serif;letter-spacing:.08em;background:rgba(0,0,0,.28);padding:5px 8px;border-radius:99px}.rotate-note{position:absolute;left:18px;bottom:14px;color:rgba(255,255,255,.64);font:12px/1.2 Georgia,serif}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@media(max-width:900px){body{overflow:auto}.app{height:auto;min-height:100vh}.main{grid-template-columns:1fr;grid-template-rows:auto minmax(360px,55vh)}.quiz{overflow:visible}.imagepane{min-height:420px}.topbar{flex-wrap:wrap}.progress{order:3;flex-basis:100%;max-width:none}}
@media(max-width:520px){.main{padding:9px;gap:9px}.quiz{padding:14px}.brand small{display:none}.character{font-size:104px}.example{font-size:20px}.topbar{padding:8px 10px}.stat.scoreStat{display:none}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">汉字 1001–1100 <small>recognition + study</small></div>
    <div class="progress"><i id="progressFill"></i></div>
    <div class="stat" id="cardStat"></div>
    <button class="topbtn" id="shuffleBtn">Shuffle</button>
    <button class="topbtn" id="resetBtn">Reset order</button>
  </header>

  <main class="main">
    <section class="quiz">
      <div class="rankline"><span id="rankLabel"></span><span id="imageCycleLabel">image changes every 12 questions</span></div>
      <div class="character" id="char"></div>
      <div class="pinyin front-pinyin" id="pinyin" aria-hidden="true"></div>
      <div class="prompt">Recognize the character first. Reveal for pinyin, meanings, common words, and fully translated examples.</div>
      <div class="controls">
        <div class="nav"><button class="ghost" id="prevBtn">← Previous</button><button class="ghost" id="nextBtn">Next →</button></div>
        <button class="action" id="revealBtn">Reveal</button>
        <button class="ghost" id="flipBtn">Flip</button>
      </div>
      <div id="detailArea"></div>
    </section>

    <section class="imagepane" id="imagePane">
      <img class="art" id="art" alt="Chinese art and material culture study image">
      <div class="rotate-note">historical image gallery</div>
      <div class="imagecount" id="imageCount"></div>
    </section>
  </main>
</div>
<script>
const BANK = [{"rank":1001,"char":"玉","pinyin":"yù","meanings":["jade","beautiful"],"words":[{"zh":"玉米","pinyin":"yù mǐ","en":"corn"},{"zh":"玉石","pinyin":"yù shí","en":"jade"},{"zh":"宝玉","pinyin":"bǎo yù","en":"precious jade"},{"zh":"玉器","pinyin":"yù qì","en":"jade ware"}],"examples":[{"zh":"地里种着玉米。","pinyin":"dì lǐ zhòng zhe yù mǐ.","en":"Corn is planted in the field."},{"zh":"这块玉石很珍贵。","pinyin":"zhè kuài yù shí hěn zhēn guì.","en":"This piece of jade is very precious."},{"zh":"博物馆里陈列着许多玉器。","pinyin":"bó wù guǎn lǐ chén liè zhe hěn duō yù qì.","en":"Many jade objects are displayed in the museum."}]},{"rank":1002,"char":"镇","pinyin":"zhèn","meanings":["town","suppress","garrison"],"words":[{"zh":"城镇","pinyin":"chéng zhèn","en":"towns"},{"zh":"镇压","pinyin":"zhèn yā","en":"suppress"},{"zh":"镇静","pinyin":"zhèn jìng","en":"calm"},{"zh":"乡镇","pinyin":"xiāng zhèn","en":"villages and towns"}],"examples":[{"zh":"这是一个安静的小城镇。","pinyin":"zhè shì yí gè ān jìng de xiǎo chéng zhèn.","en":"This is a quiet little town."},{"zh":"请保持镇静。","pinyin":"qǐng bǎo chí zhèn jìng.","en":"Please stay calm."},{"zh":"乡镇经济正在发展。","pinyin":"xiāng zhèn jīng jì zhèng zài fā zhǎn.","en":"The economy of villages and towns is developing."}]},{"rank":1003,"char":"雪","pinyin":"xuě","meanings":["snow"],"words":[{"zh":"下雪","pinyin":"xià xuě","en":"snow"},{"zh":"雪花","pinyin":"xuě huā","en":"snowflake"},{"zh":"雪山","pinyin":"xuě shān","en":"snow mountain"},{"zh":"滑雪","pinyin":"huá xuě","en":"ski"}],"examples":[{"zh":"昨天晚上下雪了。","pinyin":"zuó tiān wǎn shang xià xuě le.","en":"It snowed last night."},{"zh":"孩子们喜欢玩雪花。","pinyin":"hái zi men xǐ huan wán xuě huā.","en":"Children like playing with snowflakes."},{"zh":"冬天人们去滑雪。","pinyin":"dōng tiān rén men qù huá xuě.","en":"In winter people go skiing."}]},{"rank":1004,"char":"午","pinyin":"wǔ","meanings":["noon"],"words":[{"zh":"中午","pinyin":"zhōng wǔ","en":"noon"},{"zh":"下午","pinyin":"xià wǔ","en":"afternoon"},{"zh":"午饭","pinyin":"wǔ fàn","en":"lunch"},{"zh":"午夜","pinyin":"wǔ yè","en":"midnight"}],"examples":[{"zh":"中午我们一起吃饭。","pinyin":"zhōng wǔ wǒ men yì qǐ chī fàn.","en":"We eat together at noon."},{"zh":"下午有一场会议。","pinyin":"xià wǔ yǒu yì chǎng huì yì.","en":"There is a meeting in the afternoon."},{"zh":"午饭已经准备好了。","pinyin":"wǔ fàn yǐ jīng zhǔn bèi hǎo le.","en":"Lunch is already prepared."}]},{"rank":1005,"char":"练","pinyin":"liàn","meanings":["practice","train"],"words":[{"zh":"练习","pinyin":"liàn xí","en":"practice"},{"zh":"训练","pinyin":"xùn liàn","en":"train"},{"zh":"熟练","pinyin":"shú liàn","en":"skilled"},{"zh":"练功","pinyin":"liàn gōng","en":"practice martial arts"}],"examples":[{"zh":"每天都要练习汉字。","pinyin":"měi tiān dōu yào liàn xí Hàn zì.","en":"One should practice Chinese characters every day."},{"zh":"运动员正在训练。","pinyin":"yùn dòng yuán zhèng zài xùn liàn.","en":"The athletes are training."},{"zh":"他的技术很熟练。","pinyin":"tā de jì shù hěn shú liàn.","en":"His technique is very skilled."}]},{"rank":1006,"char":"迫","pinyin":"pò","meanings":["compel","urgent","press"],"words":[{"zh":"强迫","pinyin":"qiáng pò","en":"force"},{"zh":"迫切","pinyin":"pò qiè","en":"urgent"},{"zh":"压迫","pinyin":"yā pò","en":"oppress"},{"zh":"被迫","pinyin":"bèi pò","en":"be forced to"}],"examples":[{"zh":"请不要强迫他。","pinyin":"qǐng bú yào qiáng pò tā.","en":"Please do not force him."},{"zh":"这个问题很迫切。","pinyin":"zhè gè wèn tí hěn pò qiè.","en":"This problem is very urgent."},{"zh":"他被迫离开了家乡。","pinyin":"tā bèi pò lí kāi le jiā xiāng.","en":"He was forced to leave his hometown."}]},{"rank":1007,"char":"爷","pinyin":"yé","meanings":["grandfather","sir"],"words":[{"zh":"爷爷","pinyin":"yé ye","en":"paternal grandfather"},{"zh":"老爷","pinyin":"lǎo ye","en":"master; old gentleman"},{"zh":"老天爷","pinyin":"lǎo tiān yé","en":"Heaven"},{"zh":"大爷","pinyin":"dà ye","en":"uncle (polite)"}],"examples":[{"zh":"爷爷每天早晨去公园。","pinyin":"yé ye měi tiān zǎo chén qù gōng yuán.","en":"Grandpa goes to the park every morning."},{"zh":"老天爷终于下雨了。","pinyin":"lǎo tiān yé zhōng yú xià yǔ le.","en":"Heaven finally sent rain."},{"zh":"大爷，请问车站怎么走？","pinyin":"dà ye, qǐng wèn chē zhàn zěn me zǒu?","en":"Sir, how do I get to the station?"}]},{"rank":1008,"char":"篇","pinyin":"piān","meanings":["piece of writing","mw for articles"],"words":[{"zh":"一篇","pinyin":"yì piān","en":"one (article)"},{"zh":"篇幅","pinyin":"piān fu","en":"length (of a text)"},{"zh":"篇章","pinyin":"piān zhāng","en":"chapter; piece"},{"zh":"诗篇","pinyin":"shī piān","en":"psalm; poem"}],"examples":[{"zh":"他写了一篇文章。","pinyin":"tā xiě le yì piān wén zhāng.","en":"He wrote an article."},{"zh":"这篇小说篇幅很长。","pinyin":"zhè piān xiǎo shuō piān fu hěn cháng.","en":"This novella is quite long."},{"zh":"请把这篇课文读一遍。","pinyin":"qǐng bǎ zhè piān kè wén dú yí biàn.","en":"Please read this lesson once."}]},{"rank":1009,"char":"肉","pinyin":"ròu","meanings":["meat","flesh"],"words":[{"zh":"牛肉","pinyin":"niú ròu","en":"beef"},{"zh":"猪肉","pinyin":"zhū ròu","en":"pork"},{"zh":"肌肉","pinyin":"jī ròu","en":"muscle"},{"zh":"肉类","pinyin":"ròu lèi","en":"meats"}],"examples":[{"zh":"今晚吃牛肉。","pinyin":"jīn wǎn chī niú ròu.","en":"Tonight we are eating beef."},{"zh":"运动可以增强肌肉。","pinyin":"yùn dòng kě yǐ zēng qiáng jī ròu.","en":"Exercise can strengthen the muscles."},{"zh":"这种肉类很新鲜。","pinyin":"zhè zhǒng ròu lèi hěn xīn xiān.","en":"This kind of meat is very fresh."}]},{"rank":1010,"char":"嘴","pinyin":"zuǐ","meanings":["mouth","beak"],"words":[{"zh":"嘴巴","pinyin":"zuǐ ba","en":"mouth"},{"zh":"嘴唇","pinyin":"zuǐ chún","en":"lips"},{"zh":"张嘴","pinyin":"zhāng zuǐ","en":"open one's mouth"},{"zh":"插嘴","pinyin":"chā zuǐ","en":"interrupt"}],"examples":[{"zh":"请把嘴巴闭上。","pinyin":"qǐng bǎ zuǐ ba bì shàng.","en":"Please close your mouth."},{"zh":"他的嘴唇很干。","pinyin":"tā de zuǐ chún hěn gān.","en":"His lips are very dry."},{"zh":"别人说话时不要插嘴。","pinyin":"bié rén shuō huà shí bú yào chā zuǐ.","en":"Do not interrupt when others are speaking."}]},{"rank":1011,"char":"馆","pinyin":"guǎn","meanings":["hall","shop","embassy"],"words":[{"zh":"图书馆","pinyin":"tú s const IMAGES = ["img/01-pavilion-scroll.jpg", "img/02-calligraphy-scroll.jpg", "img/03-two-letters.jpg", "img/04-sealed-letter.jpg", "img/05-hk-alley.jpg", "img/06-sedan-chairs.jpg", "img/07-hanging-knives.jpg", "img/08-boulevard.jpg", "img/09-modern-block.jpg", "img/10-plaza-clock.jpg", "img/11-bookstore-street.jpg", "img/12-sign-alley.jpg", "img/13-bamboo-studio.jpg"];
let order = BANK.map((_,i)=>i), pos=0, state='front';
const $=id=>document.getElementById(id);
function norm(s){return (s||'').toLowerCase().replace(/[’'.,!?()\-_/]+/g,' ').replace(/\s+/g,' ').trim()}
function current(){return BANK[order[pos]]}
function safe(t){return String(t).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function mark(sentence,ch){return safe(sentence).split(safe(ch)).join('<em>'+safe(ch)+'</em>')}
function imageForPosition(){return Math.floor(pos/12)%IMAGES.length}
function setImage(){const idx=imageForPosition(), img=$('art');img.style.opacity=.15;setTimeout(()=>{img.src=IMAGES[idx]; img.onload=()=>{img.classList.toggle('wide',img.naturalWidth/img.naturalHeight>1.75);img.style.opacity=1};$('imageCount').textContent=`IMAGE ${idx+1} / ${IMAGES.length}`},90)}
function renderDetail(mode){const c=current(), d=$('detailArea'); if(mode==='front'){d.innerHTML='';return}
 if(mode==='flip'){d.innerHTML=`<div class="flipcard"><h3>English equivalents</h3><div class="english-list">${c.meanings.map(safe).join(' · ')}</div><button class="further" id="furtherBtn">Reveal further</button></div>`;$('furtherBtn').onclick=()=>{state='revealed';renderDetail('revealed')};return}
 const words=c.words.map(w=>`<div class="wordchip"><div class="wzh">${mark(w.zh,c.char)}</div><div class="wpy">${safe(w.pinyin)}</div><div class="wen">${safe(w.en)}</div></div>`).join('');
 const ex=c.examples.map(x=>`<div class="example"><div class="example-zh">${mark(x.zh,c.char)}</div><div class="example-py">${safe(x.pinyin)}</div><div class="example-en">${safe(x.en)}</div></div>`).join('');
 d.innerHTML=`<div class="reveal"><div class="reveal-head"><div class="reveal-pinyin">${safe(c.pinyin)}</div><p class="definition"><b>${safe(c.char)}</b> — ${c.meanings.map(safe).join('; ')}</p></div><div class="wordtitle">Common words &amp; phrases</div><div class="wordlist">${words}</div><div class="extitle">Example sentences</div><div class="examples">${ex}</div></div>`}
function render(changeImage=true){const c=current();$('char').textContent=c.char;$('pinyin').textContent='';$('rankLabel').textContent=`Frequency rank #${c.rank}`;$('cardStat').textContent=`${pos+1} / ${BANK.length}`;$('progressFill').style.width=((pos+1)/BANK.length*100)+'%';state='front';renderDetail('front');if(changeImage)setImage()}
function move(delta){const oldImg=imageForPosition();pos=Math.max(0,Math.min(BANK.length-1,pos+delta));render(imageForPosition()!==oldImg)}
$('prevBtn').onclick=()=>move(-1);$('nextBtn').onclick=()=>move(1);
$('revealBtn').onclick=()=>{state='revealed';renderDetail('revealed')};$('flipBtn').onclick=()=>{state='flip';renderDetail('flip')};
$('shuffleBtn').onclick=()=>{for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}pos=0;render(true)};
