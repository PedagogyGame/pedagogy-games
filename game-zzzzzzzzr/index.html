<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#1d2128" />
    <title>Ten Miles</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Source+Sans+3:wght@300;400;500&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;500&display=swap&text=%E5%8D%81%E9%87%8C%E9%87%91%E5%B1%B1%E5%B2%AD%E9%95%BF%E5%9F%8E%E9%BE%99%E5%B3%AA%E5%8F%A3%E7%A0%96%E5%9E%9B%E5%B0%86%E5%86%9B%E6%A5%BC%E6%B2%99%E9%BB%91%E5%B0%8F%E5%A4%A7%E5%90%8E%E5%B7%9D%E8%8A%B1%E4%B8%9C%E4%BA%94%E7%9C%BC%E5%8F%B8%E9%A9%AC%E5%8F%B0%E5%A4%A9%E6%A2%AF%E4%BB%99%E5%A5%B3%E6%A1%A5%E6%9C%9B%E4%BA%AC" rel="stylesheet" />
    <link rel="stylesheet" href="./assets/ten-miles.css" />
  </head>
  <body class="on-title">
    <div id="vignette"></div>
    <div id="hud">
      <div id="place"></div>
      <div class="hud-foot">
        <div id="hud-dir">toward Wangjing Lou →</div>
        <div id="miles">0.0 / 10.0 mi</div>
        <div id="hud-bar"><i id="hud-bar-fill"></i></div>
      </div>
      <button type="button" id="btn-touch-pause" aria-label="Pause">❙❙</button>
    </div>
    <div id="touch"><div id="stick-base"><div id="stick-knob"></div></div></div>
    <div id="title">
      <div class="veil"></div>
      <div class="copy">
        <div class="kicker">Jinshanling · Wangjing Lou</div>
        <h1>Ten Miles</h1>
        <div class="han" lang="zh">金山岭长城 · 十里</div>
        <p class="sub">the empty wall, out and back</p>
        <nav class="menu">
          <button type="button" id="btn-continue" class="hidden">Continue</button>
          <button type="button" id="btn-new">New Walk</button>
          <button type="button" id="btn-settings">Settings</button>
        </nav>
        <p class="hint" id="title-hint">click to walk</p>
      </div>
      <p class="credit">WASD walk · Shift stride · Mouse look · Esc pause</p>
    </div>
    <div id="pause" class="screen gone">
      <div class="veil thin"></div>
      <div class="copy">
        <p class="kicker">paused</p>
        <nav class="menu">
          <button type="button" id="btn-resume">Resume</button>
          <button type="button" id="btn-pause-settings">Settings</button>
          <button type="button" id="btn-title">Return to title</button>
        </nav>
      </div>
    </div>
    <div id="settings" class="screen gone">
      <div class="veil thin"></div>
      <div class="copy">
        <p class="kicker">settings</p>
        <div class="sliders">
          <label><span>Mouse</span><input id="set-sens" type="range" min="0.3" max="2.5" step="0.05" /></label>
          <label><span>Footsteps</span><input id="set-foot" type="range" min="0" max="1" step="0.01" /></label>
          <label><span>Wind</span><input id="set-wind" type="range" min="0" max="1" step="0.01" /></label>
          <label><span>Quality <em id="quality-now"></em></span>
            <select id="set-quality"><option value="auto">Auto</option><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select>
          </label>
        </div>
        <nav class="menu">
          <button type="button" id="btn-fullscreen">Fullscreen</button>
          <button type="button" id="btn-settings-back">Back</button>
        </nav>
      </div>
    </div>
    <div id="ending" class="screen gone">
      <div class="veil"></div>
      <div class="copy end">
        <p class="end-line">Ten miles.</p>
        <p class="end-line delay">The wall is still empty.</p>
        <p class="end-line delay2">You are back at Longyukou.</p>
        <nav class="menu end-menu">
          <button type="button" id="btn-again">Walk again</button>
          <button type="button" id="btn-sit">Sit with the view</button>
        </nav>
      </div>
    </div>
    <noscript>Ten Miles needs JavaScript and WebGL.</noscript>
    <script src="./assets/tex.js"></script>
    <script src="./assets/ten-miles.js"></script>
  </body>
</html>
