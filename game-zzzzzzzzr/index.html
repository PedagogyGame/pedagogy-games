<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ten Miles</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Source+Sans+3:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="./assets/index-D9HHkgH4.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CpNSX7Qb.css">
  </head>
  <body>
    <div id="vignette"></div>
    <div id="hud">
      <div id="place"></div>
      <div id="miles">0.0 / 10.0 mi</div>
    </div>
    <div id="title">
      <div class="veil"></div>
      <div class="copy">
        <div class="kicker">Jinshanling · Wangjing Lou</div>
        <h1>Ten Miles</h1>
        <p class="sub">the empty wall, out and back</p>
        <nav class="menu">
          <button type="button" id="btn-continue" class="hidden">Continue</button>
          <button type="button" id="btn-new">New Walk</button>
          <button type="button" id="btn-settings">Settings</button>
        </nav>
        <p class="hint" id="title-hint">click to walk</p>
      </div>
    </div>
    <div id="pause" class="screen gone">
      <div class="veil thin"></div>
      <div class="copy">
        <p class="kicker">paused</p>
        <nav class="menu">
          <button type="button" id="btn-resume">Resume</button>
          <button type="button" id="btn-pause-settings">Settings</button>
          <button type="button" id="btn-title">Return to title</button>
        </nav>
      </div>
    </div>
    <div id="settings" class="screen gone">
      <div class="veil thin"></div>
      <div class="copy">
        <p class="kicker">settings</p>
        <div class="sliders">
          <label>
            <span>Mouse</span>
            <input id="set-sens" type="range" min="0.3" max="2.5" step="0.05" />
          </label>
          <label>
            <span>Footsteps</span>
            <input id="set-foot" type="range" min="0" max="1" step="0.01" />
          </label>
          <label>
            <span>Wind</span>
            <input id="set-wind" type="range" min="0" max="1" step="0.01" />
          </label>
        </div>
        <nav class="menu">
          <button type="button" id="btn-fullscreen">Fullscreen</button>
          <button type="button" id="btn-settings-back">Back</button>
        </nav>
      </div>
    </div>
    <div id="ending" class="screen gone">
      <div class="veil"></div>
      <div class="copy end">
        <p class="end-line">Ten miles.</p>
        <p class="end-line delay">The wall is still empty.</p>
        <p class="end-line delay2">You are back at Longyukou.</p>
        <nav class="menu end-menu">
          <button type="button" id="btn-again">Walk again</button>
          <button type="button" id="btn-sit">Sit with the view</button>
        </nav>
      </div>
    </div>
  </body>
</html>
