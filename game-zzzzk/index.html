<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Kitchen Food Safety Game</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            background-color: #000;
        }

        #game-container {
            width: 100%;
            height: 100%;
            background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('image_0.png');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            color: #e0e0e0;
            padding: 20px;
            box-sizing: border-box;
        }

        #game-header {
            width: 100%;
            background: rgba(0, 30, 0, 0.8);
            border: 2px solid #00f000;
            padding: 10px;
            text-align: center;
            font-size: 1.2em;
            text-shadow: 0 0 5px #00f000;
        }

        #timer {
            color: #f00;
            font-weight: bold;
            font-size: 1.5em;
        }

        #game-interface {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 80%;
            height: 60%;
            background: rgba(20, 20, 20, 0.9);
            border: 4px solid #333;
            border-radius: 10px;
            padding: 20px;
            box-sizing: border-box;
        }

        #part1-section, #part2-section, #results-section {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        #part1-section.active, #part2-section.active, #results-section.active {
            display: flex;
        }

        /* Part 1 Styles */
        #pathogen-image-container {
            width: 80%;
            height: 70%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #555;
            margin-bottom: 20px;
            overflow: hidden;
            background: #000;
        }

        #pathogen-image {
            max-width: 100%;
            max-height: 100%;
            display: block;
        }

        /* Part 2 Styles */
        #definition-container {
            width: 90%;
            height: 40%;
            border: 2px solid #555;
            padding: 15px;
            margin-bottom: 20px;
            overflow-y: auto;
            font-size: 1em;
            line-height: 1.4;
            background: #1a1a1a;
        }

        /* Answer Buttons */
        #answer-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
            margin-top: auto;
        }

        .answer-button {
            background-color: #2a2a2a;
            border: 2px solid #444;
            color: #e0e0e0;
            padding: 15px;
            font-size: 1.1em;
            cursor: pointer;
            transition: background 0.2s;
            text-align: center;
            text-transform: capitalize;
            text-decoration: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .answer-button:hover {
            background-color: #3a3a3a;
        }

        .answer-button.correct {
            background-color: #006600;
            border-color: #00f000;
        }

        .answer-button.wrong {
            background-color: #660000;
            border-color: #f00000;
        }

        /* Results */
        #results-container {
            text-align: center;
            font-size: 1.5em;
        }

        #results-title {
            color: #00f000;
            font-size: 2em;
            text-shadow: 0 0 10px #00f000;
            margin-bottom: 20px;
        }

        #results-text {
            margin-bottom: 30px;
        }

        .result-pass {
            color: #00f000;
        }

        .result-fail {
            color: #f00;
        }

        #restart-button {
            padding: 15px 30px;
            font-size: 1.2em;
            cursor: pointer;
            background-color: #00f000;
            color: #000;
            border: none;
            font-family: 'Courier New', Courier, monospace;
        }

    </style>
</head>
<body>
    <div id="game-container">
        <div id="game-header">
            PATHOGEN IDENTIFICATION PROTOCOL // PART: <span id="part-indicator">1</span> // QUESTION: <span id="question-number">1</span>/<span id="total-questions">1</span>
            // SCORE: <span id="score">0</span>
            // <span id="pass-fail-text">95% PASS REQ.</span>
            // <span id="timer">15</span> SEC
        </div>

        <div id="game-interface">
            <!-- Part 1: Images -->
            <div id="part1-section" class="active">
                <div id="pathogen-image-container">
                    <img id="pathogen-image" src="" alt="Pathogen Visualization">
                </div>
                <div id="answer-grid">
                    <button class="answer-button" data-index="0"></button>
                    <button class="answer-button" data-index="1"></button>
                    <button class="answer-button" data-index="2"></button>
                    <button class="answer-button" data-index="3"></button>
                </div>
            </div>

            <!-- Part 2: Definitions -->
            <div id="part2-section">
                <div id="definition-container">
                    <!-- Definition text goes here -->
                </div>
                <div id="answer-grid">
                    <button class="answer-button" data-index="0"></button>
                    <button class="answer-button" data-index="1"></button>
                    <button class="answer-button" data-index="2"></button>
                    <button class="answer-button" data-index="3"></button>
                </div>
            </div>

            <!-- Results Screen -->
            <div id="results-section">
                <div id="results-title"></div>
                <div id="results-text"></div>
                <button id="restart-button">RESTART GAME</button>
            </div>
        </div>
    </div>

    <script>
        const part1Data = [
            { imageSrc: 'image_agent_tag_15862206015505682373', correctAnswer: 'Salmonella spp.', description: 'A group of foodborne bacteria associated with gastrointestinal illness; common sources include poultry, eggs, meat, and produce.' },
            { imageSrc: 'image_agent_tag_15862206015505678370', correctAnswer: 'Campylobacter jejuni', description: 'A curved, spiral-like bacterium strongly associated with raw or undercooked poultry, unpasteurized milk, and contaminated water.' },
            { imageSrc: 'image_agent_tag_15862206015505678835', correctAnswer: 'E. coli O157:H7', description: 'Disease-causing *E. coli* strains that produce Shiga toxin; some strains, including O157:H7, can cause severe illness.' },
            { imageSrc: 'image_agent_tag_15862206015505680509', correctAnswer: 'Listeria monocytogenes', description: 'A bacterium of particular concern in refrigerated ready-to-eat foods and for vulnerable people; it is a strong fit for cold-room or deli-slicer levels.' },
            { imageSrc: 'image_agent_tag_15862206015505680323', correctAnswer: 'Staphylococcus aureus', description: 'A bacterium commonly carried on human skin and in nasal passages; food contamination often follows poor hand hygiene or bare-hand contact.' },
            { imageSrc: 'image_agent_tag_15862206015505679951', correctAnswer: 'Clostridium perfringens', description: 'A spore-forming bacterium often associated with foods such as meat and gravy held or cooled improperly in large batches.' },
            { imageSrc: 'image_agent_tag_15862206015505679393', correctAnswer: 'Clostridium botulinum', description: 'A spore-forming bacterium capable of producing botulinum neurotoxin under low-oxygen conditions.' },
            { imageSrc: 'image_agent_tag_15862206015505679579', correctAnswer: 'Bacillus cereus', description: 'A spore-forming bacterium associated particularly with improperly held rice, pasta, and other starchy foods.' },
            { imageSrc: 'image_agent_tag_15862206015505679765', correctAnswer: 'Shigella spp.', description: 'Bacteria spread primarily by fecal–oral contamination, including contaminated hands and ready-to-eat food.' },
            { imageSrc: 'image_agent_tag_15862206015505678742', correctAnswer: 'Vibrio vulnificus', description: 'A bacterium associated with raw or undercooked oysters and other seafood; infection can be particularly serious for susceptible people.' },
            { imageSrc: 'image_agent_tag_15862206015505680881', correctAnswer: 'Vibrio parahaemolyticus', description: 'A seafood-associated bacterium, often linked to raw or undercooked shellfish.' },
            { imageSrc: 'image_agent_tag_15862206015505679486', correctAnswer: 'Yersinia enterocolitica', description: 'A bacterium associated with pork and, less commonly, unpasteurized milk.' },
            { imageSrc: 'image_agent_tag_15862206015505680602', correctAnswer: 'Coliforms', description: 'A broad group of bacteria often used as sanitation or water-quality indicators.' },
            { imageSrc: 'image_agent_tag_15862206015505680137', correctAnswer: 'Norovirus', description: 'A highly contagious virus commonly spread through infected people, contaminated food, surfaces, utensils, and vomiting events.' },
            { imageSrc: 'image_agent_tag_15862206015505713809', correctAnswer: 'Hepatitis A Virus', description: 'A virus transmitted by the fecal–oral route through contaminated food, water, or an infected handler.' },
            { imageSrc: 'image_agent_tag_15862206015505682280', correctAnswer: 'Giardia duodenalis', description: 'A protozoan parasite associated with contaminated water and food washed with unsafe water.' },
            { imageSrc: 'image_agent_tag_15862206015505679021', correctAnswer: 'Cryptosporidium', description: 'A protozoan parasite that forms hardy oocysts and can be transmitted through contaminated water and produce.' },
            { imageSrc: 'image_agent_tag_15862206015505680230', correctAnswer: 'Cyclospora cayetanensis', description: 'A protozoan parasite associated with fresh produce, including herbs, berries, and leafy items.' },
            { imageSrc: 'image_agent_tag_15862206015505679672', correctAnswer: 'Toxoplasma gondii', description: 'A protozoan parasite associated with undercooked meat and, in other contexts, cat feces.' },
            { imageSrc: 'image_agent_tag_15862206015505682187', correctAnswer: 'Trichinella spp.', description: 'Parasitic roundworms associated with undercooked pork and wild game.' },
            { imageSrc: 'image_agent_tag_15862206015505680974', correctAnswer: 'Anisakis', description: 'A parasitic nematode associated with raw or undercooked marine fish.' },
            { imageSrc: 'image_agent_tag_15862206015505680695', correctAnswer: 'Mold', description: 'A type of fungus that can spoil food; certain molds may produce mycotoxins, but visible mold itself does not identify a specific toxin.' },
            { imageSrc: 'image_agent_tag_15862206015505679114', correctAnswer: 'Biofilm', description: 'A protective community of microorganisms attached to a surface and embedded in a self-produced matrix.' },
            { imageSrc: 'image_agent_tag_15862206015505678928', correctAnswer: 'Aflatoxin Structure', description: 'A mycotoxin associated with certain molds and with foods such as grains, nuts, dried foods, and corn.' },
            { imageSrc: 'image_agent_tag_15862206015505681067', correctAnswer: 'Ochratoxin A Structure', description: 'A mycotoxin that can occur in mold-affected food commodities, including grains, dried foods, and coffee.' },
            { imageSrc: 'image_agent_tag_15862206015505678556', correctAnswer: 'Fumonisin Structure', description: 'A mycotoxin most often associated with corn and corn-based products.' },
            { imageSrc: 'image_agent_tag_15862206015505678649', correctAnswer: 'Patulin Structure', description: 'A mycotoxin associated especially with damaged or moldy apples and apple products.' },
            { imageSrc: 'image_agent_tag_15862206015505679207', correctAnswer: 'Histamine Molecule', description: 'An illness caused by high histamine in certain time-temperature-abused fish; it is not eliminated by ordinary cooking.' },
            { imageSrc: 'image_agent_tag_15862206015505678463', correctAnswer: 'Marine Toxin Structure', description: 'A naturally occurring toxin found in some reef fish; cooking does not reliably destroy it.' },
            { imageSrc: 'image_agent_tag_15862206015505680044', correctAnswer: 'Selamectin/Marine Compound Structure', description: 'A group of toxins that can accumulate in molluscan shellfish exposed to toxin-producing algae.' },
            { imageSrc: 'image_agent_tag_15862206015505679858', correctAnswer: 'Botulinum Neurotoxin Diagram', description: 'The potent toxin produced by certain *C. botulinum* strains under suitable low-oxygen conditions.' },
            { imageSrc: 'image_agent_tag_15862206015505680416', correctAnswer: 'Staphylococcal Enterotoxin Diagram', description: 'A heat-stable toxin that may be formed when *S. aureus* grows in food under improper time-temperature conditions.' },
            { imageSrc: 'image_agent_tag_15862206015505680788', correctAnswer: 'Mycotoxin Formulas', description: 'FDA identifies aflatoxins, fumonisins, patulin, ochratoxin A, and several others as mycotoxins relevant to human food.' },
        ];

        const part2Data = [
            { correctAnswer: 'B. cereus emetic toxin (Cereulide structure)', definition: 'Toxins associated with *B. cereus* growth in improperly held foods, particularly cooked starches.' },
            { correctAnswer: 'Chlorine sanitizer residue', definition: 'Excess sanitizer remaining on a food-contact surface because of incorrect concentration, procedure, or rinsing requirements.' },
            { correctAnswer: 'Quaternary ammonium compound (quat) residue', definition: 'Residue from quat-based sanitizer caused by incorrect dilution or use.' },
            { correctAnswer: 'Broken glass', definition: 'A physical contamination hazard from damaged glassware, light fixtures, containers, or serviceware.' },
            { correctAnswer: 'Hair / foreign material', definition: 'Unintended nonfood material in food, usually linked to inadequate personal hygiene or poor protective practices.' },
            { correctAnswer: 'Cross-contamination', definition: 'Transfer of harmful microorganisms, allergens, chemicals, or foreign material from one object, surface, person, or food to another.' },
            { correctAnswer: 'Hand contamination', definition: 'Contamination transferred from an employee’s hands, especially after restroom use, raw-food handling, face touching, illness, or inadequate handwashing.' },
            { correctAnswer: 'Contaminated wiping cloth', definition: 'A cloth that spreads contamination when it is reused on food-contact surfaces or stored improperly.' },
            { correctAnswer: 'Dirty dish', definition: 'Ware carrying food debris, grease, microorganisms, allergen residue, or chemical residue before correct warewashing.' },
            { correctAnswer: 'Standing-water contamination', definition: 'Increased contamination risk from pooled water that supports microbial persistence and attracts debris.' },
            { correctAnswer: 'Aerosolized contamination', definition: 'Contamination dispersed through droplets or aerosols, such as during vomiting incidents or high-pressure spray.' },
            { correctAnswer: 'Improper dish-machine temperature', definition: 'A warewashing failure in which wash or final-rinse temperatures do not meet the machine’s required operating conditions.' },
            { correctAnswer: 'Sanitizing', definition: 'Treatment that reduces microorganisms on a cleaned food-contact surface to safer levels; it does not replace cleaning.' },
            { correctAnswer: 'Air drying', definition: 'Letting sanitized ware dry without towel contact, reducing recontamination risk.' },
            { correctAnswer: 'Food-contact surface', definition: 'Any surface that normally touches food, including plates, utensils, cutting boards, mixers, slicers, and some equipment parts.' },
            { correctAnswer: 'Ready-to-eat food', definition: 'Food intended to be eaten without further cooking that would destroy contaminants.' },
        ];

        // All possible pathogen names for distractor options
        const allPathogenNames = [
            'Salmonella spp.', 'Campylobacter jejuni', 'E. coli O157:H7', 'Listeria monocytogenes', 'Staphylococcus aureus', 'Clostridium perfringens', 'Clostridium botulinum', 'Bacillus cereus', 'Shigella spp.', 'Vibrio vulnificus', 'Vibrio parahaemolyticus', 'Yersinia enterocolitica', 'Coliforms', 'Norovirus', 'Hepatitis A Virus', 'Giardia duodenalis', 'Cryptosporidium', 'Cyclospora cayetanensis', 'Toxoplasma gondii', 'Trichinella spp.', 'Anisakis', 'Mold', 'Biofilm', 'Aflatoxin Structure', 'Ochratoxin A Structure', 'Fumonisin Structure', 'Patulin Structure', 'Histamine Molecule', 'Marine Toxin Structure', 'Selamectin/Marine Compound Structure', 'Botulinum Neurotoxin Diagram', 'Staphylococcal Enterotoxin Diagram', 'Mycotoxin Formulas',
            'B. cereus emetic toxin (Cereulide structure)', 'Chlorine sanitizer residue', 'Quaternary ammonium compound (quat) residue', 'Broken glass', 'Hair / foreign material', 'Cross-contamination', 'Hand contamination', 'Contaminated wiping cloth', 'Dirty dish', 'Standing-water contamination', 'Aerosolized contamination', 'Improper dish-machine temperature', 'Sanitizing', 'Air drying', 'Food-contact surface', 'Ready-to-eat food',
            'Bacillus anthracis', 'Clostridium difficile', 'E. coli (non-pathogenic)', 'Pseudomonas aeruginosa', 'Mycobacterium tuberculosis', 'Candida albicans', 'Aspergillus niger', 'Acanthamoeba', 'Leishmania donovani', 'Trypanosoma cruzi', 'Echinococcus granulosus', 'Tinea pedis', 'Cyanotoxin Structure', 'T-2 toxin Structure', 'Diatom structure', 'Ricin molecule', 'Diphtheria toxin diagram', 'Cholera toxin diagram', 'Pesticide residue', 'Arsenic contamination', 'Cadmium contamination', 'Lead contamination', 'Mercury contamination', 'Tree-nut allergen', 'Egg allergen', 'Wheat allergen', 'Fish fragment', 'Plastic fragment', 'Soil contamination', 'Worn cutting board', 'Improper cooling'
        ];

        let currentPart = 1;
        let currentQuestionIndex = 0;
        let score = 0;
        let timer;
        let timeRemaining = 15;
        let canAnswer = true;
        let currentData = [];

        const elements = {
            gameContainer: document.getElementById('game-container'),
            partIndicator: document.getElementById('part-indicator'),
            questionNumber: document.getElementById('question-number'),
            totalQuestions: document.getElementById('total-questions'),
            score: document.getElementById('score'),
            passFailText: document.getElementById('pass-fail-text'),
            timer: document.getElementById('timer'),
            gameInterface: document.getElementById('game-interface'),
            part1Section: document.getElementById('part1-section'),
            pathogenImage: document.getElementById('pathogen-image'),
            answerGrid: document.querySelectorAll('#answer-grid'),
            part1AnswerButtons: document.querySelectorAll('#part1-section .answer-button'),
            part2AnswerButtons: document.querySelectorAll('#part2-section .answer-button'),
            part2Section: document.getElementById('part2-section'),
            definitionContainer: document.getElementById('definition-container'),
            resultsSection: document.getElementById('results-section'),
            resultsTitle: document.getElementById('results-title'),
            resultsText: document.getElementById('results-text'),
            restartButton: document.getElementById('restart-button')
        };

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function getOptions(correctAnswer) {
            let options = [correctAnswer];
            let distractorPool = allPathogenNames.filter(name => name !== correctAnswer);
            shuffle(distractorPool);
            options.push(...distractorPool.slice(0, 3));
            return shuffle(options);
        }

        function loadQuestion() {
            canAnswer = true;
            timeRemaining = 15;
            elements.timer.textContent = timeRemaining;

            currentData = (currentPart === 1) ? part1Data : part2Data;
            const currentItem = currentData[currentQuestionIndex];
            
            elements.questionNumber.textContent = currentQuestionIndex + 1;
            elements.totalQuestions.textContent = currentData.length;
            elements.score.textContent = score;

            // Reset buttons
            const activeButtons = (currentPart === 1) ? elements.part1AnswerButtons : elements.part2AnswerButtons;
            activeButtons.forEach(btn => {
                btn.className = 'answer-button';
                btn.textContent = '';
            });

            // Set content based on part
            const options = getOptions(currentItem.correctAnswer);

            if (currentPart === 1) {
                elements.part1Section.classList.add('active');
                elements.part2Section.classList.remove('active');
                elements.passFailText.textContent = '95% PASS REQ.';
                elements.partIndicator.textContent = '1';
                elements.pathogenImage.src = currentItem.imageSrc;
                elements.part1AnswerButtons.forEach((btn, index) => {
                    btn.textContent = options[index];
                });
            } else {
                elements.part2Section.classList.add('active');
                elements.part1Section.classList.remove('active');
                elements.passFailText.textContent = 'FINAL CHECK';
                elements.partIndicator.textContent = '2';
                elements.definitionContainer.innerHTML = `<p>${currentItem.definition}</p>`;
                elements.part2AnswerButtons.forEach((btn, index) => {
                    btn.textContent = options[index];
                });
            }

            startTimer();
        }

        function startTimer() {
            clearInterval(timer);
            timer = setInterval(() => {
                timeRemaining--;
                elements.timer.textContent = timeRemaining;
                if (timeRemaining <= 0) {
                    clearInterval(timer);
                    handleAnswer(null); // Time out
                }
            }, 1000);
        }

        function handleAnswer(selectedOptionIndex) {
            if (!canAnswer) return;
            canAnswer = false;
            clearInterval(timer);

            const activeButtons = (currentPart === 1) ? elements.part1AnswerButtons : elements.part2AnswerButtons;
            const correctOption = currentData[currentQuestionIndex].correctAnswer;
            
            let isCorrect = false;
            let selectedButton = null;

            activeButtons.forEach(btn => {
                if (btn.textContent === correctOption) {
                    btn.classList.add('correct');
                }
                if (selectedOptionIndex !== null && btn.getAttribute('data-index') == selectedOptionIndex) {
                    selectedButton = btn;
                }
            });

            if (selectedOptionIndex !== null) {
                if (selectedButton.textContent === correctOption) {
                    score++;
                    isCorrect = true;
                    elements.score.textContent = score;
                } else {
                    selectedButton.classList.add('wrong');
                }
            } else {
                // Time out condition, show wrong
            }

            currentQuestionIndex++;

            setTimeout(() => {
                if (currentQuestionIndex < currentData.length) {
                    loadQuestion();
                } else {
                    handlePartEnd();
                }
            }, 1500); // Wait before next question
        }

        function handlePartEnd() {
            if (currentPart === 1) {
                const percentage = (score / part1Data.length);
                if (percentage >= 0.95) {
                    // Passed Part 1
                    currentPart = 2;
                    currentQuestionIndex = 0;
                    // Reset score for Part 2? Or accumulate? Accumulate for final.
                    loadQuestion();
                } else {
                    // Failed Part 1, restart
                    showResults(false, percentage);
                }
            } else {
                // End of Part 2, final results
                const totalCorrect = score;
                const totalQuestions = part1Data.length + part2Data.length;
                const percentage = totalCorrect / totalQuestions;
                // Final passing requirement not specified, but the 95% was for Part 1. 
                // We will show a pass if they finished.
                showResults(true, percentage);
            }
        }

        function showResults(passedAll, percentage) {
            elements.part1Section.classList.remove('active');
            elements.part2Section.classList.remove('active');
            elements.resultsSection.classList.add('active');

            const scorePercent = Math.round(percentage * 100);

            if (currentPart === 1 && !passedAll) {
                elements.resultsTitle.textContent = "PROTOCOL FAILURE";
                elements.resultsTitle.className = 'result-fail';
                elements.resultsText.innerHTML = `<p>Identification accuracy: ${scorePercent}%.</p><p>A score of 95% is required to proceed to the next verification stage.</p><p>Please restart Stage 1.</p>`;
                elements.restartButton.textContent = "RESTART PART 1";
            } else {
                elements.resultsTitle.textContent = "PROTOCOL COMPLETE";
                elements.resultsTitle.className = 'result-pass';
                elements.resultsText.innerHTML = `<p>All validation checks complete.</p><p>Total accuracy: ${scorePercent}%.</p><p>You are certified for dish room operations.</p>`;
                elements.restartButton.textContent = "COMPLETE RESTART";
            }
        }

        // Event Listeners for Answer Buttons
        elements.part1AnswerButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                handleAnswer(e.target.getAttribute('data-index'));
            });
        });

        elements.part2AnswerButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                handleAnswer(e.target.getAttribute('data-index'));
            });
        });

        elements.restartButton.addEventListener('click', () => {
            if (elements.restartButton.textContent === "RESTART PART 1") {
                // Restart Part 1 only, reset score for Part 1
                currentPart = 1;
                currentQuestionIndex = 0;
                score = 0;
            } else {
                // Complete restart
                currentPart = 1;
                currentQuestionIndex = 0;
                score = 0;
            }
            elements.resultsSection.classList.remove('active');
            loadQuestion();
        });

        // Initialize game
        loadQuestion();

    </script>
</body>
</html>
