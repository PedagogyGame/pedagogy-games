<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Kitchen Food Safety Game</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            background-color: #000;
        }

        #game-container {
            width: 100%;
            height: 100%;
            /* Added a dark, moody kitchen/dishroom background from Unsplash */
            background-image: linear-gradient(rgba(10, 15, 10, 0.85), rgba(10, 15, 10, 0.85)), url('https://images.unsplash.com/photo-1587513725838-89c0926d2e9e?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            color: #e0e0e0;
            padding: 20px;
            box-sizing: border-box;
        }

        #game-header {
            width: 100%;
            background: rgba(0, 30, 0, 0.8);
            border: 2px solid #00f000;
            padding: 10px;
            text-align: center;
            font-size: 1.2em;
            text-shadow: 0 0 5px #00f000;
            box-shadow: 0 0 15px rgba(0, 240, 0, 0.2);
        }

        #timer {
            color: #ff3333;
            font-weight: bold;
            font-size: 1.5em;
            text-shadow: 0 0 8px #ff0000;
        }

        #game-interface {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 80%;
            max-width: 1000px;
            height: 70%;
            background: rgba(15, 15, 15, 0.95);
            border: 2px solid #333;
            border-radius: 5px;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        #part1-section, #part2-section, #results-section {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        #part1-section.active, #part2-section.active, #results-section.active {
            display: flex;
        }

        /* Part 1 Styles */
        #pathogen-image-container {
            width: 100%;
            height: 60%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid #444;
            margin-bottom: 20px;
            overflow: hidden;
            background: #000;
            border-radius: 4px;
        }

        #pathogen-image {
            max-width: 100%;
            max-height: 100%;
            display: block;
            object-fit: contain;
        }

        /* Part 2 Styles */
        #definition-container {
            width: 100%;
            height: 50%;
            border: 1px solid #444;
            padding: 25px;
            margin-bottom: 20px;
            overflow-y: auto;
            font-size: 1.3em;
            line-height: 1.5;
            background: #111;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            border-radius: 4px;
        }

        /* Answer Buttons */
        #answer-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
            margin-top: auto;
        }

        .answer-button {
            background-color: #1a1a1a;
            border: 1px solid #555;
            color: #d0d0d0;
            padding: 15px;
            font-size: 1.1em;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 3px;
        }

        .answer-button:hover {
            background-color: #2a2a2a;
            border-color: #888;
            color: #fff;
        }

        .answer-button.correct {
            background-color: #004400;
            border-color: #00f000;
            color: #00f000;
        }

        .answer-button.wrong {
            background-color: #440000;
            border-color: #f00000;
            color: #ff6666;
        }

        /* Results */
        #results-container {
            text-align: center;
            font-size: 1.5em;
        }

        #results-title {
            color: #00f000;
            font-size: 2.5em;
            text-shadow: 0 0 10px #00f000;
            margin-bottom: 20px;
            margin-top: 40px;
        }

        #results-text {
            margin-bottom: 40px;
            font-size: 1.2em;
            line-height: 1.6;
            text-align: center;
        }

        .result-pass {
            color: #00f000;
        }

        .result-fail {
            color: #ff3333 !important;
            text-shadow: 0 0 10px #ff0000 !important;
        }

        #restart-button {
            padding: 15px 40px;
            font-size: 1.2em;
            cursor: pointer;
            background-color: #000;
            color: #00f000;
            border: 2px solid #00f000;
            font-family: 'Courier New', Courier, monospace;
            transition: all 0.2s;
        }
        
        #restart-button:hover {
            background-color: #00f000;
            color: #000;
        }

    </style>
</head>
<body>
    <div id="game-container">
        <div id="game-header">
            PATHOGEN IDENTIFICATION PROTOCOL // STAGE: <span id="part-indicator">1</span> // SCAN: <span id="question-number">1</span>/<span id="total-questions">1</span>
            // ACCURACY: <span id="score">0</span>
            // <span id="pass-fail-text">95% PASS REQ.</span>
            // TIMER: <span id="timer">15</span> SEC
        </div>

        <div id="game-interface">
            <!-- Part 1: Images -->
            <div id="part1-section" class="active">
                <div id="pathogen-image-container">
                    <img id="pathogen-image" src="" alt="Pathogen Visualization">
                </div>
                <div id="answer-grid">
                    <button class="answer-button" data-index="0"></button>
                    <button class="answer-button" data-index="1"></button>
                    <button class="answer-button" data-index="2"></button>
                    <button class="answer-button" data-index="3"></button>
                </div>
            </div>

            <!-- Part 2: Definitions -->
            <div id="part2-section">
                <div id="definition-container">
                    <!-- Definition text goes here -->
                </div>
                <div id="answer-grid">
                    <button class="answer-button" data-index="0"></button>
                    <button class="answer-button" data-index="1"></button>
                    <button class="answer-button" data-index="2"></button>
                    <button class="answer-button" data-index="3"></button>
                </div>
            </div>

            <!-- Results Screen -->
            <div id="results-section">
                <div id="results-title"></div>
                <div id="results-text"></div>
                <button id="restart-button">REBOOT SYSTEM</button>
            </div>
        </div>
    </div>

    <script>
        // Updated with direct Wikimedia Commons / CDC direct image file paths
        const part1Data = [
            { imageSrc: 'https://commons.wikimedia.org/wiki/Special:FilePath/SalmonellaNIAID.jpg', correctAnswer: 'Salmonella spp.', description: 'A group of foodborne bacteria associated with gastrointestinal illness; common sources include poultry, eggs, meat, and produce.' },
            { imageSrc: 'https://commons.wikimedia.org/wiki/Special:FilePath/Campylobacter_jejuni_5778_lores.jpg', correctAnswer: 'Campylobacter jejuni', description: 'A curved, spiral-like bacterium strongly associated with raw or undercooked poultry, unpasteurized milk, and contaminated water.' },
            { imageSrc: 'https://commons.wikimedia.org/wiki/Special:FilePath/Esch_coli.jpg', correctAnswer: 'E. coli O157:H7', description: 'Disease-causing E. coli strains that produce Shiga toxin; some strains, including O157:H7, can cause severe illness.' },
            { imageSrc: 'https://commons.wikimedia.org/wiki/Special:FilePath/Listeria_monocytogenes_PHIL_2287_lores.jpg', correctAnswer: 'Listeria monocytogenes', description: 'A bacterium of particular concern in refrigerated ready-to-eat foods.' },
            { imageSrc: 'https://commons.wikimedia.org/wiki/Special:FilePath/Staphylococcus_aureus,_50,000x,_USDA,_ARS,_EMU.jpg', correctAnswer: 'Staphylococcus aureus', description: 'A bacterium commonly carried on human skin and in nasal passages.' },
            { imageSrc: 'https://commons.wikimedia.org/wiki/Special:FilePath/Clostridium_perfringens.jpg', correctAnswer: 'Clostridium perfringens', description: 'A spore-forming bacterium often associated with meat and gravy cooled improperly.' },
            { imageSrc: 'https://commons.wikimedia.org/wiki/Special:FilePath/Clostridium_botulinum_zoom.jpg', correctAnswer: 'Clostridium botulinum', description: 'A spore-forming bacterium capable of producing botulinum neurotoxin under low-oxygen conditions.' },
            { imageSrc: 'https://commons.wikimedia.org/wiki/Special:FilePath/Bacillus_cereus_and_Escherichia_coli.jpg', correctAnswer: 'Bacillus cereus', description: 'A spore-forming bacterium associated particularly with improperly held rice, pasta, and other starchy foods.' },
            { imageSrc: 'https://commons.wikimedia.org/wiki/Special:FilePath/ShigellaBoydii.jpg', correctAnswer: 'Shigella spp.', description: 'Bacteria spread primarily by fecal–oral contamination, including contaminated hands.' },
            { imageSrc: 'https://commons.wikimedia.org/wiki/Special:FilePath/Vibrio_vulnificus_01.jpg', correctAnswer: 'Vibrio vulnificus', description: 'A bacterium associated with raw or undercooked oysters and other seafood.' },
            { imageSrc: 'https://commons.wikimedia.org/wiki/Special:FilePath/Vibrio_parahaemolyticus.jpg', correctAnswer: 'Vibrio parahaemolyticus', description: 'A seafood-associated bacterium, often linked to raw or undercooked shellfish.' },
            { imageSrc: 'https://commons.wikimedia.org/wiki/Special:FilePath/Yersinia_enterocolitica.jpg', correctAnswer: 'Yersinia enterocolitica', description: 'A bacterium associated with pork and, less commonly, unpasteurized milk.' },
            { imageSrc: 'https://commons.wikimedia.org/wiki/Special:FilePath/MacConkey_agar_with_E._coli.jpg', correctAnswer: 'Coliforms', description: 'A broad group of bacteria often used as sanitation or water-quality indicators.' },
            { imageSrc: 'https://commons.wikimedia.org/wiki/Special:FilePath/Norovirus_virions_white_background_NIH_21348.jpg', correctAnswer: 'Norovirus', description: 'A highly contagious virus commonly spread through infected people and vomiting events.' },
            { imageSrc: 'https://commons.wikimedia.org/wiki/Special:FilePath/Hepatitis_A_virus_02.jpg', correctAnswer: 'Hepatitis A Virus', description: 'A virus transmitted by the fecal–oral route through contaminated food, water, or an infected handler.' },
            { imageSrc: 'https://commons.wikimedia.org/wiki/Special:FilePath/Giardia_lamblia_SEM_8698_lores.jpg', correctAnswer: 'Giardia duodenalis', description: 'A protozoan parasite associated with contaminated water and food washed with unsafe water.' },
            { imageSrc: 'https://commons.wikimedia.org/wiki/Special:FilePath/Cryptosporidium_parvum_oocysts.jpg', correctAnswer: 'Cryptosporidium', description: 'A protozoan parasite that forms hardy oocysts and can be transmitted through contaminated water.' },
            { imageSrc: 'https://commons.wikimedia.org/wiki/Special:FilePath/Cyclospora_cayetanensis_stained.jpg', correctAnswer: 'Cyclospora cayetanensis', description: 'A protozoan parasite associated with fresh produce, including herbs, berries, and leafy items.' },
            { imageSrc: 'https://commons.wikimedia.org/wiki/Special:FilePath/Toxoplasma_gondii.jpg', correctAnswer: 'Toxoplasma gondii', description: 'A protozoan parasite associated with undercooked meat and cat feces.' },
            { imageSrc: 'https://commons.wikimedia.org/wiki/Special:FilePath/Trichinella_spiralis.jpg', correctAnswer: 'Trichinella spp.', description: 'Parasitic roundworms associated with undercooked pork and wild game.' },
            { imageSrc: 'https://commons.wikimedia.org/wiki/Special:FilePath/Anisakis_simplex.jpg', correctAnswer: 'Anisakis', description: 'A parasitic nematode associated with raw or undercooked marine fish.' },
            { imageSrc: 'https://commons.wikimedia.org/wiki/Special:FilePath/Aflatoxin_B1_skeletal.svg', correctAnswer: 'Aflatoxin Structure', description: 'A mycotoxin associated with certain molds and foods such as grains and nuts.' },
            { imageSrc: 'https://commons.wikimedia.org/wiki/Special:FilePath/Ochratoxin_A.svg', correctAnswer: 'Ochratoxin A Structure', description: 'A mycotoxin that can occur in mold-affected coffee and grains.' },
            { imageSrc: 'https://commons.wikimedia.org/wiki/Special:FilePath/Fumonisin_B1.svg', correctAnswer: 'Fumonisin Structure', description: 'A mycotoxin most often associated with corn and corn-based products.' },
            { imageSrc: 'https://commons.wikimedia.org/wiki/Special:FilePath/Patulin.svg', correctAnswer: 'Patulin Structure', description: 'A mycotoxin associated especially with damaged or moldy apples.' },
            { imageSrc: 'https://commons.wikimedia.org/wiki/Special:FilePath/Histamine.svg', correctAnswer: 'Histamine Molecule', description: 'An illness caused by high histamine in time-temperature-abused fish.' },
            { imageSrc: 'https://commons.wikimedia.org/wiki/Special:FilePath/CTX1B.svg', correctAnswer: 'Ciguatoxin Structure', description: 'A naturally occurring toxin found in some reef fish.' },
            { imageSrc: 'https://commons.wikimedia.org/wiki/Special:FilePath/Saxitoxin.svg', correctAnswer: 'Saxitoxin Structure', description: 'A group of toxins that can accumulate in molluscan shellfish.' },
            { imageSrc: 'https://commons.wikimedia.org/wiki/Special:FilePath/Botulinum_toxin_3BTA.png', correctAnswer: 'Botulinum Neurotoxin', description: 'The potent toxin produced by C. botulinum.' },
            { imageSrc: 'https://commons.wikimedia.org/wiki/Special:FilePath/Enterotoxin_type_B.png', correctAnswer: 'Staphylococcal Enterotoxin', description: 'A heat-stable toxin formed when S. aureus grows in food.' }
        ];

        const part2Data = [
            { correctAnswer: 'B. cereus emetic toxin', definition: 'Toxins associated with <i>B. cereus</i> growth in improperly held foods, particularly cooked starches like rice.' },
            { correctAnswer: 'Chlorine sanitizer residue', definition: 'Excess sanitizer remaining on a food-contact surface because of incorrect concentration, procedure, or rinsing requirements.' },
            { correctAnswer: 'Quaternary ammonium compound', definition: 'Residue from quat-based sanitizer caused by incorrect dilution or use at the three-compartment sink.' },
            { correctAnswer: 'Broken glass', definition: 'A physical contamination hazard from damaged glassware, light fixtures, containers, or serviceware.' },
            { correctAnswer: 'Hair / foreign material', definition: 'Unintended nonfood material in food, usually linked to inadequate personal hygiene or poor protective practices.' },
            { correctAnswer: 'Cross-contamination', definition: 'Transfer of harmful microorganisms, allergens, chemicals, or foreign material from one object, surface, person, or food to another.' },
            { correctAnswer: 'Hand contamination', definition: 'Contamination transferred from an employee’s hands, especially after restroom use, raw-food handling, or inadequate handwashing.' },
            { correctAnswer: 'Contaminated wiping cloth', definition: 'A cloth that spreads contamination when it is reused on food-contact surfaces or stored improperly outside of a sanitizer bucket.' },
            { correctAnswer: 'Dirty dish', definition: 'Ware carrying food debris, grease, microorganisms, allergen residue, or chemical residue before correct warewashing.' },
            { correctAnswer: 'Standing-water contamination', definition: 'Increased contamination risk from pooled water that supports microbial persistence and attracts debris.' },
            { correctAnswer: 'Aerosolized contamination', definition: 'Contamination dispersed through droplets or aerosols, such as during vomiting incidents or high-pressure spray.' },
            { correctAnswer: 'Improper dish-machine temperature', definition: 'A warewashing failure in which wash or final-rinse temperatures do not meet the machine’s required operating conditions.' },
            { correctAnswer: 'Sanitizing', definition: 'Treatment that reduces microorganisms on a cleaned food-contact surface to safer levels; it does not replace cleaning.' },
            { correctAnswer: 'Air drying', definition: 'Letting sanitized ware dry without towel contact, reducing recontamination risk.' },
            { correctAnswer: 'Food-contact surface', definition: 'Any surface that normally touches food, including plates, utensils, cutting boards, mixers, slicers, and some equipment parts.' },
            { correctAnswer: 'Ready-to-eat food', definition: 'Food intended to be eaten without further cooking that would destroy contaminants.' }
        ];

        // All possible pathogen names for distractor options
        const allPathogenNames = [
            'Salmonella spp.', 'Campylobacter jejuni', 'E. coli O157:H7', 'Listeria monocytogenes', 'Staphylococcus aureus', 'Clostridium perfringens', 'Clostridium botulinum', 'Bacillus cereus', 'Shigella spp.', 'Vibrio vulnificus', 'Vibrio parahaemolyticus', 'Yersinia enterocolitica', 'Coliforms', 'Norovirus', 'Hepatitis A Virus', 'Giardia duodenalis', 'Cryptosporidium', 'Cyclospora cayetanensis', 'Toxoplasma gondii', 'Trichinella spp.', 'Anisakis', 'Mold', 'Biofilm', 'Aflatoxin Structure', 'Ochratoxin A Structure', 'Fumonisin Structure', 'Patulin Structure', 'Histamine Molecule', 'Ciguatoxin Structure', 'Saxitoxin Structure', 'Botulinum Neurotoxin', 'Staphylococcal Enterotoxin', 'Mycotoxin Formulas',
            'B. cereus emetic toxin', 'Chlorine sanitizer residue', 'Quaternary ammonium compound', 'Broken glass', 'Hair / foreign material', 'Cross-contamination', 'Hand contamination', 'Contaminated wiping cloth', 'Dirty dish', 'Standing-water contamination', 'Aerosolized contamination', 'Improper dish-machine temperature', 'Sanitizing', 'Air drying', 'Food-contact surface', 'Ready-to-eat food',
            'Bacillus anthracis', 'Clostridium difficile', 'E. coli (non-pathogenic)', 'Pseudomonas aeruginosa', 'Mycobacterium tuberculosis', 'Candida albicans', 'Aspergillus niger', 'Acanthamoeba', 'Ricin molecule', 'Diphtheria toxin', 'Pesticide residue', 'Arsenic contamination', 'Cadmium contamination', 'Lead contamination', 'Mercury contamination', 'Tree-nut allergen', 'Wheat allergen', 'Worn cutting board', 'Improper cooling'
        ];

        let currentPart = 1;
        let currentQuestionIndex = 0;
        let score = 0;
        let timer;
        let timeRemaining = 15;
        let canAnswer = true;
        let currentData = [];

        const elements = {
            gameContainer: document.getElementById('game-container'),
            partIndicator: document.getElementById('part-indicator'),
            questionNumber: document.getElementById('question-number'),
            totalQuestions: document.getElementById('total-questions'),
            score: document.getElementById('score'),
            passFailText: document.getElementById('pass-fail-text'),
            timer: document.getElementById('timer'),
            gameInterface: document.getElementById('game-interface'),
            part1Section: document.getElementById('part1-section'),
            pathogenImage: document.getElementById('pathogen-image'),
            answerGrid: document.querySelectorAll('#answer-grid'),
            part1AnswerButtons: document.querySelectorAll('#part1-section .answer-button'),
            part2AnswerButtons: document.querySelectorAll('#part2-section .answer-button'),
            part2Section: document.getElementById('part2-section'),
            definitionContainer: document.getElementById('definition-container'),
            resultsSection: document.getElementById('results-section'),
            resultsTitle: document.getElementById('results-title'),
            resultsText: document.getElementById('results-text'),
            restartButton: document.getElementById('restart-button')
        };

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function getOptions(correctAnswer) {
            let options = [correctAnswer];
            let distractorPool = allPathogenNames.filter(name => name !== correctAnswer);
            shuffle(distractorPool);
            options.push(...distractorPool.slice(0, 3));
            return shuffle(options);
        }

        function loadQuestion() {
            canAnswer = true;
            timeRemaining = 15;
            elements.timer.textContent = timeRemaining;

            currentData = (currentPart === 1) ? part1Data : part2Data;
            
            // Safety check for end of array
            if (currentQuestionIndex >= currentData.length) {
                handlePartEnd();
                return;
            }

            const currentItem = currentData[currentQuestionIndex];
            
            elements.questionNumber.textContent = currentQuestionIndex + 1;
            elements.totalQuestions.textContent = currentData.length;
            elements.score.textContent = score;

            // Reset buttons
            const activeButtons = (currentPart === 1) ? elements.part1AnswerButtons : elements.part2AnswerButtons;
            activeButtons.forEach(btn => {
                btn.className = 'answer-button';
                btn.textContent = '';
            });

            // Set content based on part
            const options = getOptions(currentItem.correctAnswer);

            if (currentPart === 1) {
                elements.part1Section.classList.add('active');
                elements.part2Section.classList.remove('active');
                elements.passFailText.textContent = '95% PASS REQ.';
                elements.partIndicator.textContent = '1';
                elements.pathogenImage.src = currentItem.imageSrc;
                elements.part1AnswerButtons.forEach((btn, index) => {
                    btn.textContent = options[index];
                });
            } else {
                elements.part2Section.classList.add('active');
                elements.part1Section.classList.remove('active');
                elements.passFailText.textContent = 'FINAL CHECK';
                elements.partIndicator.textContent = '2';
                elements.definitionContainer.innerHTML = `<p>${currentItem.definition}</p>`;
                elements.part2AnswerButtons.forEach((btn, index) => {
                    btn.textContent = options[index];
                });
            }

            startTimer();
        }

        function startTimer() {
            clearInterval(timer);
            timer = setInterval(() => {
                timeRemaining--;
                elements.timer.textContent = timeRemaining;
                if (timeRemaining <= 0) {
                    clearInterval(timer);
                    handleAnswer(null); // Time out
                }
            }, 1000);
        }

        function handleAnswer(selectedOptionIndex) {
            if (!canAnswer) return;
            canAnswer = false;
            clearInterval(timer);

            const activeButtons = (currentPart === 1) ? elements.part1AnswerButtons : elements.part2AnswerButtons;
            const correctOption = currentData[currentQuestionIndex].correctAnswer;
            
            let selectedButton = null;

            activeButtons.forEach(btn => {
                if (btn.textContent === correctOption) {
                    btn.classList.add('correct');
                }
                if (selectedOptionIndex !== null && btn.getAttribute('data-index') == selectedOptionIndex) {
                    selectedButton = btn;
                }
            });

            if (selectedOptionIndex !== null) {
                if (selectedButton.textContent === correctOption) {
                    score++;
                    elements.score.textContent = score;
                } else {
                    selectedButton.classList.add('wrong');
                }
            }

            currentQuestionIndex++;

            setTimeout(() => {
                if (currentQuestionIndex < currentData.length) {
                    loadQuestion();
                } else {
                    handlePartEnd();
                }
            }, 1200); // 1.2 second pause to see correct answer before next question
        }

        function handlePartEnd() {
            if (currentPart === 1) {
                const percentage = (score / part1Data.length);
                if (percentage >= 0.95) {
                    // Passed Part 1
                    currentPart = 2;
                    currentQuestionIndex = 0;
                    loadQuestion();
                } else {
                    // Failed Part 1, restart
                    showResults(false, percentage);
                }
            } else {
                // End of Part 2, final results
                const totalCorrect = score;
                const totalQuestions = part1Data.length + part2Data.length;
                const percentage = totalCorrect / totalQuestions;
                showResults(true, percentage);
            }
        }

        function showResults(passedAll, percentage) {
            elements.part1Section.classList.remove('active');
            elements.part2Section.classList.remove('active');
            elements.resultsSection.classList.add('active');

            const scorePercent = Math.round(percentage * 100);

            if (currentPart === 1 && !passedAll) {
                elements.resultsTitle.textContent = "PROTOCOL FAILURE";
                elements.resultsTitle.className = 'result-fail';
                elements.resultsText.innerHTML = `<p>Stage 1 Identification Accuracy: <strong>${scorePercent}%</strong>.</p><p>A score of 95% is required to proceed to the administrative Stage 2.</p><p>Dish room operations suspended. Please review the manual and restart.</p>`;
                elements.restartButton.textContent = "RESTART STAGE 1";
            } else {
                elements.resultsTitle.textContent = "PROTOCOL COMPLETE";
                elements.resultsTitle.className = 'result-pass';
                elements.resultsText.innerHTML = `<p>All validation checks complete.</p><p>Total Accuracy: <strong>${scorePercent}%</strong>.</p><p>You are officially certified for dish room hazard identification.</p>`;
                elements.restartButton.textContent = "COMPLETE RESTART";
            }
        }

        // Event Listeners for Answer Buttons
        elements.part1AnswerButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                handleAnswer(e.target.getAttribute('data-index'));
            });
        });

        elements.part2AnswerButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                handleAnswer(e.target.getAttribute('data-index'));
            });
        });

        elements.restartButton.addEventListener('click', () => {
            if (elements.restartButton.textContent === "RESTART STAGE 1") {
                currentPart = 1;
                currentQuestionIndex = 0;
                score = 0;
            } else {
                // Complete restart
                currentPart = 1;
                currentQuestionIndex = 0;
                score = 0;
            }
            elements.resultsSection.classList.remove('active');
            loadQuestion();
        });

        // Initialize game (shuffle part 1 data so it's different every time)
        shuffle(part1Data);
        loadQuestion();

    </script>
</body>
</html>
