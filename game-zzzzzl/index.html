<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Chinese Character Study · 1501–1600</title>
<style>
:root{--ink:#2a1612;--muted:#7a5c54;--paper:#f6efe8;--panel:#fbf6ef;--line:#d2b8a4;--deep:#5c221c;--good:#2a5c3c;--bad:#8a2f27;--gold:#d4a45a}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(1200px 700px at 12% -10%,rgba(255,220,190,.38),transparent 52%),linear-gradient(180deg,#c4a090 0%,#dcc8b4 42%,#b08978 100%);color:var(--ink);font-family:Georgia,"Times New Roman","Noto Serif SC","Songti SC",serif;overflow:hidden}
.app{height:100vh;display:grid;grid-template-rows:auto 1fr;gap:0}
.topbar{min-height:58px;display:flex;align-items:center;gap:14px;padding:8px 18px;background:rgba(72,22,18,.96);color:#f8efe4;border-bottom:2px solid #d4a45a}
.brand{font-size:18px;font-weight:700;letter-spacing:.05em;white-space:nowrap}.brand small{font-size:12px;font-weight:400;opacity:.7;margin-left:8px}
.progress{flex:1;max-width:460px;height:7px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:#d4a45a;width:1%;transition:width .25s ease}
.stat{font-size:13px;opacity:.88;white-space:nowrap}.topbtn{border:1px solid rgba(255,255,255,.28);background:transparent;color:white;border-radius:8px;padding:7px 10px;cursor:pointer}
.main{min-height:0;display:grid;grid-template-columns:minmax(390px,46%) 1fr;gap:18px;padding:18px}
.quiz{min-height:0;background:rgba(251,246,239,.97);border:2px solid #7a3228;box-shadow:inset 0 0 0 6px #f0ddd0,0 16px 48px rgba(72,22,18,.26);border-radius:4px;padding:18px 22px 16px;display:flex;flex-direction:column;overflow:auto}
.rankline{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.09em}
.character{text-align:center;font-family:"Noto Serif SC","Songti SC","STSong",serif;font-size:clamp(92px,11vw,164px);line-height:.95;margin:8px 0 0;color:#2a1612;text-shadow:0 1px 0 #fff}
.pinyin{text-align:center;font-size:clamp(24px,2.6vw,39px);font-style:italic;color:#7a3228;margin:0 0 8px}
.front-pinyin{display:none}.prompt{text-align:center;font-size:16px;margin:2px 0 8px;color:#7a5c54}
button{font:600 13px/1.1 Georgia,serif;letter-spacing:.03em}
.controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:3px 0 7px}.controls .nav{display:flex;gap:6px;margin-right:6px}.ghost,.action{padding:9px 12px;border-radius:8px;cursor:pointer}.ghost{border:1px solid #c4a090;background:#f6ebe3;color:#3a241e}.action{border:1px solid #7a3228;background:#7a3228;color:#fff}
.reveal{border-top:1px solid #e0c8b8;padding-top:9px;margin-top:2px;animation:fade .18s ease}.reveal-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:5px}.reveal-pinyin{font-size:clamp(27px,2.8vw,42px);font-style:italic;color:#7a3228;font-weight:700}.definition{font-size:20px;margin:0}.definition b{color:#6a2e24}.wordtitle,.extitle{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:#7a5c54;margin:9px 0 4px;font-weight:700}.wordlist{display:flex;gap:6px;flex-wrap:wrap}.wordchip{background:#f3e6d8;border:1px solid #dcc4b0;border-radius:7px;padding:5px 8px;line-height:1.18}.wordchip .wzh{font-family:"Noto Serif SC","Songti SC",serif;font-size:19px;font-weight:700}.wordchip .wpy{font-size:13px;font-style:italic;color:#7a4a3c}.wordchip .wen{font-size:12px;color:#6a584e}.examples{display:grid;gap:5px}.example{padding:6px 9px;background:#f6ebe0;border-left:3px solid #c45a3a;border-radius:5px;line-height:1.22}.example-zh{font-family:"Noto Serif SC","Songti SC",serif;font-size:clamp(19px,1.65vw,25px)}.example-py{font-size:clamp(14px,1.1vw,17px);font-style:italic;color:#7a4a3c;margin-top:2px}.example-en{font-size:clamp(13px,1vw,16px);color:#4f463f;margin-top:2px}.example em{font-style:normal;font-weight:800;color:#7a2e28;background:#edd8c8;border-radius:3px;padding:0 .05em}
.flipcard{margin-top:3px;border:1px solid #d2b8a4;border-radius:4px;padding:12px 14px;background:#f6ebe3}.flipcard h3{margin:0 0 7px;font-size:15px;color:#7a4a3c;text-transform:uppercase;letter-spacing:.08em}.english-list{font-size:clamp(22px,2vw,32px);line-height:1.2;margin:4px 0 10px}.flipcard .reveal-pinyin{margin:0 0 6px}.further{border:1px solid #7a3228;background:transparent;color:#7a3228;border-radius:8px;padding:8px 11px;cursor:pointer}
.imagepane{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;background:rgba(42,16,14,.94);border:2px solid #5c241c;border-radius:4px;overflow:hidden;box-shadow:inset 0 0 0 7px rgba(212,164,90,.22),0 16px 48px rgba(72,22,18,.3)}
.imagepane:before{content:"";position:absolute;inset:8px;border:1px solid rgba(212,164,90,.5);border-radius:3px;pointer-events:none}.art{display:block;max-width:94%;max-height:90%;width:auto;height:auto;object-fit:contain;filter:saturate(.98) contrast(1.02);box-shadow:0 8px 32px rgba(0,0,0,.28);transition:opacity .35s ease,transform .35s ease}.art.wide{max-width:98%;max-height:84%}

@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@media(max-width:900px){body{overflow:auto}.app{height:auto;min-height:100vh}.main{grid-template-columns:1fr;grid-template-rows:auto minmax(360px,55vh)}.quiz{overflow:visible}.imagepane{min-height:420px}.topbar{flex-wrap:wrap}.progress{order:3;flex-basis:100%;max-width:none}}
@media(max-width:520px){.main{padding:9px;gap:9px}.quiz{padding:14px}.brand small{display:none}.character{font-size:104px}.example{font-size:20px}.topbar{padding:8px 10px}.stat.scoreStat{display:none}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">汉字 1501–1600 <small>recognition + study</small></div>
    <div class="progress"><i id="progressFill"></i></div>

      <div class="controls">
        <div class="nav"><button class="ghost" id="prevBtn">← Previous</button><button class="ghost" id="nextBtn">Next →</button></div>
        <button class="action" id="revealBtn">Reveal</button>
        <button class="ghost" id="flipBtn">Flip</button>
      </div>
      <div id="detailArea"></div>
    </section>

    <section class="imagepane" id="imagePane">
      <img class="art" id="art" alt="Chinese art and material culture study image">
    </section>
  </main>
</div>

凤","pinyin":"lóng fèng","en":"dragon and phoenix"},{"zh":"凤尾","pinyin":"fèng wěi","en":"phoenix tail"},{"zh":"凤冠","pinyin":"fèng guān","en":"phoenix coronet"}],"examples":[{"zh":"墙上绣着一只凤凰。","pinyin":"qiáng shàng xiù zhe yì zhī fèng huáng.","en":"A phoenix is embroidered on the wall."},{"zh":"婚礼上有龙凤图案。","pinyin":"hūn lǐ shàng yǒu lóng fèng tú àn.","en":"There are dragon-and-phoenix patterns at the wedding."},{"zh":"新娘戴着凤冠。","pinyin":"xīn niáng dài zhe fèng guān.","en":"The bride is wearing a phoenix coronet."}]},{"rank":1505,"char":"慧","pinyin":"huì","meanings":["intelligent","bright"],"words":[{"zh":"智慧","pinyin":"zhì huì","en":"wisdom"},{"zh":"聪慧","pinyin":"cōng huì","en":"intelligent"},{"zh":"慧眼","pinyin":"huì yǎn","en":"discerning eye"},{"zh":"慧心","pinyin":"huì xīn","en":"intelligent mind"}],"examples":[{"zh":"这部书充满智慧。","pinyin":"zhè bù shū chōng mǎn zhì huì.","en":"This book is full of wisdom."},{"zh":"这孩子十分聪慧。","pinyin":"zhè hái zi shí fēn cōng huì.","en":"This child is extremely intelligent."},{"zh":"老师有一双慧眼。","pinyin":"lǎo shī yǒu yì shuāng huì yǎn.","en":"The teacher has a discerning eye."}]},{"rank":1506,"char":"媒","pinyin":"méi","meanings":["matchmaker","medium","media"],"words":[{"zh":"媒体","pinyin":"méi tǐ","en":"media"},{"zh":"媒介","pinyin":"méi jiè","en":"medium"},{"zh":"媒人","pinyin":"méi rén","en":"matchmaker"},{"zh":"传媒","pinyin":"chuán méi","en":"mass media"}],"examples":[{"zh":"这件事上了媒体。","pinyin":"zhè jiàn shì shàng le méi tǐ.","en":"This matter appeared in the media."},{"zh":"语言是交流的媒介。","pinyin":"yǔ yán shì jiāo liú de méi jiè.","en":"Language is a medium of communication."},{"zh":"村里请了一位媒人。","pinyin":"cūn lǐ qǐng le yí wèi méi rén.","en":"The village invited a matchmaker."}]},{"rank":1507,"char":"佩","pinyin":"pèi","meanings":["wear (at the waist)","admire"],"words":[{"zh":"佩服","pinyin":"pèi fu","en":"admire"},{"zh":"佩戴","pinyin":"pèi dài","en":"wear (a badge, etc.)"},{"zh":"敬佩","pinyin":"jìng pèi","en":"esteem"},{"zh":"玉佩","pinyin":"yù pèi","en":"jade pendant"}],"examples":[{"zh":"我很佩服他的勇气。","pinyin":"wǒ hěn pèi fu tā de yǒng qì.","en":"I greatly admire his courage."},{"zh":"请佩戴好工牌。","pinyin":"qǐng pèi dài hǎo gōng pái.","en":"Please wear your work badge properly."},{"zh":"盒子里有一块玉佩。","pinyin":"hé zi lǐ yǒu yí kuài yù pèi.","en":"There is a jade pendant in the box."}]},{"rank":1508,"char":"愤","pinyin":"fèn","meanings":["anger","indignation"],"words":[{"zh":"愤怒","pinyin":"fèn nù","en":"fury"},{"zh":"气愤","pinyin":"qì fèn","en":"indignant"},{"zh":"愤恨","pinyin":"fèn hèn","en":"resent"},{"zh":"悲愤","pinyin":"bēi fèn","en":"grief and indignation"}],"examples":[{"zh":"他的脸上露出愤怒。","pinyin":"tā de liǎn shàng lù chū fèn nù.","en":"Fury showed on his face."},{"zh":"听到这话，大家都很气愤。","pinyin":"tīng dào zhè huà, dà jiā dōu hěn qì fèn.","en":"Hearing this, everyone was indignant."},{"zh":"不要把愤恨藏在心里。","pinyin":"bú yào bǎ fèn hèn cáng zài xīn lǐ.","en":"Do not hide resentment in your heart."}]},{"rank":1509,"char":"扑","pinyin":"pū","meanings":["pounce","rush at","swat"],"words":[{"zh":"扑灭","pinyin":"pū miè","en":"put out (a fire)"},{"zh":"扑向","pinyin":"pū xiàng","en":"pounce toward"},{"zh":"扑空","pinyin":"pū kōng","en":"fail to find someone"},{"zh":"扑鼻","pinyin":"pū bí","en":"assail the nostrils"}],"examples":[{"zh":"消防队及时扑灭了大火。","pinyin":"xiāo fáng duì jí shí pū miè le dà huǒ.","en":"The fire brigade put the blaze out in time."},{"zh":"孩子扑向妈妈的怀里。","pinyin":"hái zi pū xiàng mā ma de huái lǐ.","en":"The child pounced into mother's arms."},{"zh":"花香扑鼻。","pinyin":"huā xiāng pū bí.","en":"The fragrance of the flowers assailed the nostrils."}]},{"rank":1510,"char":"龄","pinyin":"líng","meanings":["age","years"],"words":[{"zh":"年龄","pinyin":"nián líng","en":"age"},{"zh":"高龄","pinyin":"gāo líng","en":"advanced age"},{"zh":"保龄","pinyin":"bǎo líng","en":"bowling (in 保龄球)"},{"zh":"同龄","pinyin":"tóng líng","en":"of the same age"}],"examples":[{"zh":"请填写你的年龄。","pinyin":"qǐng tián xiě nǐ de nián líng.","en":"Please fill in your age."},{"zh":"两位同龄 let order = BANK.map((_,i)=>i), pos=0, state='front';

function norm(s){return (s||'').toLowerCase().replace(/[’'.,!?()\-_/]+/g,' ').replace(/\s+/g,' ').trim()}

function safe(t){return String(t).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}

function renderDetail(mode){const c=current(), d=$('detailArea'); if(mode==='front'){d.innerHTML='';return}
 if(mode==='flip'){d.innerHTML=`<div class="flipcard"><h3>Pinyin + English</h3><div class="reveal-pinyin">${safe(c.pinyin)}</div><div class="english-list">${c.meanings.map(safe).join(' · ')}</div><button class="further" id="furtherBtn">Reveal further</button></div>`;$('furtherBtn').onclick=()=>{state='revealed';renderDetail('revealed')};return}
