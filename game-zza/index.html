<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Horse Care & Barn Jargon — Vocabulary Game</title>
  <style>
    :root {
      --panel-bg: rgba(28, 22, 16, 0.82);
      --accent: #d4a574;
      --accent-glow: #e8c9a0;
      --danger: #c45c4a;
      --success: #6a9e6e;
      --text: #f5efe6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: #1a140f;
      color: var(--text);
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    /* ========== FARM BACKGROUND ========== */
    #farm {
      position: fixed;
      inset: 0;
      background: linear-gradient(to bottom, #7ba3c9 0%, #a8c5d9 35%, #c9d8b8 55%, #8fa86a 100%);
      overflow: hidden;
    }

    /* Rolling hills - layered */
    .hill {
      position: absolute;
      bottom: 0;
      width: 160%;
      height: 55%;
      border-radius: 50% 50% 0 0;
      left: -30%;
    }
    .hill1 { background: #6b8f4e; height: 42%; z-index: 1; }
    .hill2 { background: #5a7d42; height: 36%; left: -10%; width: 140%; z-index: 2; }
    .hill3 { background: #4a6b38; height: 28%; left: -40%; width: 180%; z-index: 3; }

    /* Driveway */
    .driveway {
      position: absolute;
      bottom: 18%;
      left: 42%;
      width: 16%;
      height: 38%;
      background: linear-gradient(to top, #8b7355, #a89070);
      clip-path: polygon(20% 100%, 80% 100%, 95% 0%, 5% 0%);
      z-index: 4;
      opacity: 0.85;
    }

    /* Barn (left of driveway) */
    .barn {
      position: absolute;
      bottom: 32%;
      left: 18%;
      width: 220px;
      height: 140px;
      z-index: 5;
    }
    .barn-body {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 90px;
      background: #8b4513;
      border: 3px solid #5c2e0a;
    }
    .barn-roof {
      position: absolute;
      bottom: 85px;
      left: -15px;
      width: 250px;
      height: 55px;
      background: #5c2e0a;
      clip-path: polygon(0% 100%, 50% 0%, 100% 100%);
    }
    .barn-door {
      position: absolute;
      bottom: 0;
      left: 35%;
      width: 30%;
      height: 55px;
      background: #3d1f08;
      border: 2px solid #2a1505;
    }
    .barn-window {
      position: absolute;
      top: 18px;
      left: 15%;
      width: 22px;
      height: 22px;
      background: #d4c4a0;
      border: 2px solid #3d1f08;
    }
    .barn-window.right { left: auto; right: 15%; }

    /* Farmhouse (right of driveway) */
    .house {
      position: absolute;
      bottom: 34%;
      right: 14%;
      width: 160px;
      height: 120px;
      z-index: 5;
    }
    .house-body {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 75px;
      background: #c4a882;
      border: 2px solid #8b7355;
    }
    .house-roof {
      position: absolute;
      bottom: 70px;
      left: -12px;
      width: 184px;
      height: 45px;
      background: #6b4423;
      clip-path: polygon(0% 100%, 50% 0%, 100% 100%);
    }
    .house-door {
      position: absolute;
      bottom: 0;
      left: 40%;
      width: 22%;
      height: 40px;
      background: #5c3a1e;
    }
    .house-window {
      position: absolute;
      top: 12px;
      left: 12%;
      width: 20px;
      height: 20px;
      background: #e8d9b5;
      border: 2px solid #5c3a1e;
    }
    .house-window.right { left: auto; right: 12%; }

    /* Fence lines */
    .fence {
      position: absolute;
      height: 18px;
      background: repeating-linear-gradient(
        90deg,
        #5c4030 0px,
        #5c4030 8px,
        transparent 8px,
        transparent 22px
      );
      z-index: 6;
      border-top: 3px solid #4a3222;
      border-bottom: 2px solid #4a3222;
    }
    .fence-mid {
      bottom: 26%;
      left: 5%;
      width: 35%;
    }
    .fence-right {
      bottom: 24%;
      right: 5%;
      width: 28%;
    }

    /* Horses (peaceful) */
    .horse {
      position: absolute;
      font-size: 42px;
      z-index: 7;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.3));
      transition: transform 0.4s ease;
    }
    .horse-near-barn {
      bottom: 29%;
      left: 32%;
      font-size: 48px;
    }
    .horse-paddock {
      bottom: 23%;
      left: 48%;
      font-size: 40px;
    }
    .horse-far1 {
      bottom: 38%;
      left: 72%;
      font-size: 28px;
      opacity: 0.9;
    }
    .horse-far2 {
      bottom: 41%;
      left: 82%;
      font-size: 24px;
      opacity: 0.85;
    }
    .horse-far3 {
      bottom: 36%;
      left: 8%;
      font-size: 26px;
      opacity: 0.9;
    }

    /* Subtle idle sway */
    @keyframes sway {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-3px) rotate(1.5deg); }
    }
    .horse.idle {
      animation: sway 3.5s ease-in-out infinite;
    }
    .horse-near-barn.idle { animation-duration: 4.2s; }
    .horse-paddock.idle { animation-duration: 3.8s; animation-delay: 0.6s; }
    .horse-far1.idle { animation-duration: 5s; animation-delay: 1.1s; }

    /* Escaping horse (hidden until fail) */
    #escape-horse {
      position: absolute;
      bottom: 24%;
      left: 52%;
      font-size: 46px;
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      filter: drop-shadow(0 3px 4px rgba(0,0,0,0.4));
    }
    #escape-horse.running {
      opacity: 1;
      animation: jumpAndRun 2.8s ease-in forwards;
    }
    @keyframes jumpAndRun {
      0%   { transform: translate(0, 0) scale(1) rotate(0deg); }
      12%  { transform: translate(10px, -55px) scale(1.05) rotate(-8deg); }
      22%  { transform: translate(40px, -20px) scale(1) rotate(5deg); }
      100% { transform: translate(520px, -80px) scale(0.35) rotate(0deg); opacity: 0; }
    }

    /* Soft ambient particles (hay/dust) */
    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(255, 240, 200, 0.35);
      border-radius: 50%;
      pointer-events: none;
      z-index: 8;
      animation: drift linear infinite;
    }
    @keyframes drift {
      0%   { transform: translateY(0) translateX(0); opacity: 0; }
      10%  { opacity: 0.5; }
      90%  { opacity: 0.3; }
      100% { transform: translateY(-120px) translateX(40px); opacity: 0; }
    }

    /* ========== UI OVERLAY ========== */
    #ui {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      pointer-events: none;
    }

    .panel {
      background: var(--panel-bg);
      border: 2px solid rgba(212, 165, 116, 0.45);
      border-radius: 16px;
      padding: 28px 36px;
      width: min(640px, 92vw);
      box-shadow: 0 12px 40px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.08);
      pointer-events: auto;
      backdrop-filter: blur(6px);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      gap: 16px;
    }

    .score-box, .timer-box {
      background: rgba(0,0,0,0.35);
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 1.05rem;
      font-weight: 600;
      min-width: 110px;
      text-align: center;
    }
    .score-box span { color: var(--accent-glow); }
    .timer-box.urgent { color: var(--danger); animation: pulse 0.6s ease infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .progress-track {
      height: 6px;
      background: rgba(255,255,255,0.12);
      border-radius: 3px;
      margin-bottom: 22px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-glow));
      border-radius: 3px;
      transition: width 0.1s linear;
    }
    .progress-fill.urgent {
      background: linear-gradient(90deg, var(--danger), #e88a7a);
    }

    .definition {
      font-size: 1.35rem;
      line-height: 1.45;
      text-align: center;
      margin-bottom: 22px;
      min-height: 3.2em;
      color: #f8f1e6;
      font-weight: 500;
    }

    .input-row {
      display: flex;
      gap: 12px;
    }
    #answer {
      flex: 1;
      padding: 14px 18px;
      font-size: 1.2rem;
      border: 2px solid rgba(212, 165, 116, 0.5);
      border-radius: 10px;
      background: rgba(0,0,0,0.4);
      color: #fff;
      outline: none;
      transition: border-color 0.2s;
    }
    #answer:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(212, 165, 116, 0.25);
    }
    #answer::placeholder {
      color: rgba(255,255,255,0.35);
    }

    button {
      padding: 14px 22px;
      font-size: 1.05rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: var(--accent);
      color: #2a1f14;
      transition: background 0.2s, transform 0.1s;
    }
    button:hover { background: var(--accent-glow); }
    button:active { transform: scale(0.97); }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .feedback {
      margin-top: 16px;
      text-align: center;
      font-size: 1.05rem;
      min-height: 1.5em;
      font-weight: 500;
    }
    .feedback.correct { color: #8dcc92; }
    .feedback.wrong { color: #e89a8e; }

    /* Start / End screens */
    .screen {
      text-align: center;
    }
    .screen h1 {
      font-size: 2rem;
      margin-bottom: 8px;
      color: var(--accent-glow);
      letter-spacing: 0.5px;
    }
    .screen p {
      opacity: 0.85;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .screen .stats {
      background: rgba(0,0,0,0.3);
      border-radius: 10px;
      padding: 14px;
      margin: 18px 0;
      font-size: 1.05rem;
    }
    .hidden { display: none !important; }

    .bonus-flash {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.8rem;
      font-weight: 700;
      color: #f0d78c;
      text-shadow: 0 0 12px rgba(240, 215, 140, 0.8);
      pointer-events: none;
      z-index: 60;
      animation: bonusPop 0.9s ease-out forwards;
    }
    @keyframes bonusPop {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
      30%  { opacity: 1; transform: translate(-50%, -60%) scale(1.15); }
      100% { opacity: 0; transform: translate(-50%, -90%) scale(1); }
    }

    .small {
      font-size: 0.9rem;
      opacity: 0.7;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div id="farm">
    <div class="hill hill1"></div>
    <div class="hill hill2"></div>
    <div class="hill hill3"></div>
    <div class="driveway"></div>

    <!-- Barn -->
    <div class="barn">
      <div class="barn-roof"></div>
      <div class="barn-body">
        <div class="barn-window"></div>
        <div class="barn-window right"></div>
        <div class="barn-door"></div>
      </div>
    </div>

    <!-- House -->
    <div class="house">
      <div class="house-roof"></div>
      <div class="house-body">
        <div class="house-window"></div>
        <div class="house-window right"></div>
        <div class="house-door"></div>
      </div>
    </div>

    <div class="fence fence-mid"></div>
    <div class="fence fence-right"></div>

    <!-- Peaceful horses -->
    <div class="horse horse-near-barn idle">🐴</div>
    <div class="horse horse-paddock idle">🐴</div>
    <div class="horse horse-far1 idle">🐴</div>
    <div class="horse horse-far2 idle">🐴</div>
    <div class="horse horse-far3 idle">🐴</div>

    <!-- Escape horse (animated on fail) -->
    <div id="escape-horse">🐴</div>
  </div>

  <div id="ui">
    <!-- START SCREEN -->
    <div class="panel screen" id="start-screen">
      <h1>Horse Care & Barn Jargon</h1>
      <p>A definition appears. Type the correct term before time runs out.</p>
      <p class="small">Correct answers in the first 10 seconds earn a +10% bonus.<br>
         Wrong answers cost 20–30% depending on difficulty.</p>
      <button id="btn-start" style="margin-top:12px; padding:14px 36px;">Start Game</button>
    </div>

    <!-- PLAY SCREEN -->
    <div class="panel hidden" id="play-screen">
      <div class="header">
        <div class="score-box">Score: <span id="score">100</span>%</div>
        <div class="timer-box" id="timer-display">15s</div>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progress"></div>
      </div>
      <div class="definition" id="definition">Loading…</div>
      <div class="input-row">
        <input type="text" id="answer" placeholder="Type the term…" autocomplete="off" spellcheck="false" />
        <button id="btn-submit">Submit</button>
      </div>
      <div class="feedback" id="feedback"></div>
    </div>

    <!-- END SCREEN -->
    <div class="panel screen hidden" id="end-screen">
      <h1 id="end-title">Session Complete</h1>
      <div class="stats" id="end-stats"></div>
      <button id="btn-restart">Play Again</button>
    </div>
  </div>

  <script>
    // ========== VOCABULARY ==========
    const TERMS = [
      // Original core
      { term: "Gelding", definition: "Castrated male horse", difficulty: 1 },
      { term: "Mare", definition: "Adult female horse", difficulty: 1 },
      { term: "Stallion", definition: "Uncastrated adult male horse", difficulty: 1 },
      { term: "Foal", definition: "Young horse under about one year old", difficulty: 1 },
      { term: "Yearling", definition: "Horse between roughly one and two years old", difficulty: 1 },
      { term: "Hand", definition: "Standard horse-height measurement equal to four inches", difficulty: 1 },
      { term: "Withers", definition: "Highest point of the shoulders; where height is measured", difficulty: 2 },
      { term: "Sound", definition: "Free from noticeable lameness or movement problems", difficulty: 2 },
      { term: "Lame", definition: "Moving abnormally because of pain or injury", difficulty: 1 },
      { term: "Off", definition: "Barn shorthand meaning something appears abnormal with the horse", difficulty: 2 },
      { term: "Turnout", definition: "Putting a horse outside in a paddock or pasture", difficulty: 1 },
      { term: "Bring in", definition: "Retrieve horses from turnout and return them to the barn", difficulty: 1 },
      { term: "Paddock", definition: "Relatively small fenced turnout area", difficulty: 1 },
      { term: "Dry lot", definition: "Turnout area with little or no grass", difficulty: 2 },
      { term: "Pasture board", definition: "Boarding arrangement where the horse primarily lives outdoors", difficulty: 2 },
      { term: "Stall rest", definition: "Confinement to a stall, usually for medical recovery", difficulty: 2 },
      { term: "Muck out", definition: "Remove manure and soiled bedding from a stall", difficulty: 1 },
      { term: "Pick the stall", definition: "Remove manure and wet spots without replacing all bedding", difficulty: 2 },
      { term: "Strip a stall", definition: "Remove essentially all bedding for a complete cleaning", difficulty: 2 },
      { term: "Bedding", definition: "Shavings, straw, pellets, or other material covering a stall floor", difficulty: 1 },
      { term: "Hay net", definition: "Hanging net or bag used to feed hay", difficulty: 1 },
      { term: "Flake", definition: "Common barn unit for a section of a hay bale", difficulty: 1 },
      { term: "Concentrate", definition: "Grain or manufactured feed given in addition to forage", difficulty: 2 },
      { term: "Hard feed", definition: "Barn term for grain, pellets, or concentrates", difficulty: 2 },
      { term: "Forage", definition: "Hay, pasture grass, and similar fibrous feed", difficulty: 1 },
      { term: "Easy keeper", definition: "Horse that maintains weight on relatively little feed", difficulty: 2 },
      { term: "Hard keeper", definition: "Horse that has difficulty maintaining body weight", difficulty: 2 },
      { term: "Body condition score", definition: "Standardized rating of a horse's fat coverage (often shortened to BCS)", difficulty: 2, aliases: ["bcs", "body condition score (bcs)"] },
      { term: "Colic", definition: "General term for abdominal pain; an important equine emergency", difficulty: 1 },
      { term: "Founder", definition: "Common barn term associated with severe laminitis affecting the feet", difficulty: 2 },
      { term: "Thrush", definition: "Bacterial/fungal-associated infection of the frog area of the hoof", difficulty: 2 },
      { term: "Pick out feet", definition: "Clean packed dirt, manure, and stones from the hooves", difficulty: 1 },
      { term: "Frog", definition: "V-shaped, softer structure on the underside of the hoof", difficulty: 2 },
      { term: "Farrier", definition: "Professional who trims hooves and applies shoes when needed", difficulty: 1 },
      { term: "Barefoot", definition: "Horse maintained without horseshoes", difficulty: 1 },
      { term: "Tack", definition: "Collective term for riding and handling equipment", difficulty: 1 },
      { term: "Halter", definition: "Headgear used for leading and tying a horse", difficulty: 1 },
      { term: "Lead rope", definition: "Rope attached to the halter for handling the horse", difficulty: 1 },
      { term: "Cross-ties", definition: "Two ties securing a horse from either side while grooming or tacking", difficulty: 2 },
      { term: "Spook", definition: "Easily startled behavior, or the act of suddenly reacting to something frightening", difficulty: 1, aliases: ["spooky"] },

      // Additions
      { term: "Weanling", definition: "Young horse that has been weaned from its dam, typically 4–12 months old", difficulty: 2 },
      { term: "Colt", definition: "Young intact male horse, generally under four years old", difficulty: 1 },
      { term: "Filly", definition: "Young female horse, generally under four years old", difficulty: 1 },
      { term: "Pony", definition: "Equine measuring under 14.2 hands at the withers", difficulty: 1 },
      { term: "Cribbing", definition: "Stable vice of grabbing a solid object with the teeth and sucking air", difficulty: 2, aliases: ["windsucking", "wind sucking"] },
      { term: "Weaving", definition: "Side-to-side rocking motion, usually performed at the stall door or fence", difficulty: 2 },
      { term: "Cast", definition: "Horse that has rolled and become stuck against a wall or object and cannot get up", difficulty: 2 },
      { term: "Banking", definition: "Piling bedding against the walls of a stall to help prevent a horse from getting cast", difficulty: 3, aliases: ["bank"] },
      { term: "Abscess", definition: "Localized infection (commonly in the hoof) that often causes sudden severe lameness", difficulty: 2 },
      { term: "Laminitis", definition: "Inflammation of the sensitive laminae inside the hoof; founder is the more advanced form", difficulty: 2 },
      { term: "Choke", definition: "Esophageal obstruction, usually from feed; the horse is distressed but can still breathe", difficulty: 2 },
      { term: "Rain rot", definition: "Bacterial skin infection that appears as scabby, matted hair, especially after wet weather", difficulty: 2 },
      { term: "Float", definition: "The process of filing sharp enamel points off a horse's teeth", difficulty: 2, aliases: ["floating", "floating teeth", "float teeth"] },
      { term: "Coggins", definition: "Blood test for equine infectious anemia (EIA); required for most travel and boarding in the U.S.", difficulty: 2 },
      { term: "Tack room", definition: "Dedicated storage room for saddles, bridles, blankets, and other equipment", difficulty: 1 },
      { term: "Wash rack", definition: "Dedicated area (usually with drainage and cross-ties) for bathing horses", difficulty: 2, aliases: ["wash stall"] },
      { term: "Automatic waterer", definition: "Self-filling water system in stalls or pastures that still needs daily checking", difficulty: 2 },
      { term: "Round pen", definition: "Circular enclosure used for lunging, groundwork, and starting young horses", difficulty: 2 },
      { term: "Stall board", definition: "Boarding arrangement in which the horse lives primarily in a stall", difficulty: 2 },
      { term: "Longe", definition: "Working a horse in a circle on a long line", difficulty: 2, aliases: ["lunge", "lunging", "longeing", "lungeing"] },
      { term: "Green", definition: "Young or inexperienced horse under saddle or in handling", difficulty: 2 },
      { term: "Schoolmaster", definition: "Experienced, reliable horse used for teaching riders", difficulty: 2 },
      { term: "Bombproof", definition: "Very calm and unflappable horse; ideal for beginners", difficulty: 2, aliases: ["quiet"] },
      { term: "Barn sour", definition: "Horse that becomes anxious or resistant when separated from the barn or herd mates", difficulty: 3, aliases: ["herd-bound", "herd bound", "buddy sour", "buddy-sour"] },
      { term: "Grazing muzzle", definition: "Device worn on the head to limit grass intake while still allowing the horse to drink", difficulty: 2 },
      { term: "Fly mask", definition: "Mesh mask that protects the eyes and face from insects", difficulty: 1 },
      { term: "Cooler", definition: "Lightweight sheet used to help a sweaty horse dry without chilling", difficulty: 2 },
      { term: "Blanket", definition: "Protective covering of various weights (stable sheet, rain sheet, medium or heavy blanket)", difficulty: 1, aliases: ["sheet", "turnout blanket", "turnout sheet"] }
    ];

    // ========== GAME STATE ==========
    let score = 100;
    let currentIndex = 0;
    let shuffled = [];
    let timerId = null;
    let timeLeft = 0;
    let totalTime = 15;
    let questionStart = 0;
    let correctCount = 0;
    let wrongCount = 0;
    let answered = false;

    // DOM
    const startScreen = document.getElementById("start-screen");
    const playScreen = document.getElementById("play-screen");
    const endScreen = document.getElementById("end-screen");
    const definitionEl = document.getElementById("definition");
    const answerInput = document.getElementById("answer");
    const feedbackEl = document.getElementById("feedback");
    const scoreEl = document.getElementById("score");
    const timerDisplay = document.getElementById("timer-display");
    const progressEl = document.getElementById("progress");
    const escapeHorse = document.getElementById("escape-horse");

    // ========== HELPERS ==========
    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function normalize(str) {
      return str.toLowerCase().trim().replace(/[–—-]/g, " ").replace(/\s+/g, " ");
    }

    function isCorrect(input, item) {
      const n = normalize(input);
      if (n === normalize(item.term)) return true;
      if (item.aliases) {
        return item.aliases.some(a => normalize(a) === n);
      }
      return false;
    }

    function getTimeFor(item) {
      // Base on difficulty + a little length
      const base = item.difficulty === 1 ? 15 : item.difficulty === 2 ? 17 : 20;
      const lenBonus = item.term.length > 12 ? 2 : 0;
      return base + lenBonus;
    }

    function getPenalty(item) {
      return item.difficulty === 1 ? 20 : item.difficulty === 2 ? 25 : 30;
    }

    function updateScoreDisplay() {
      scoreEl.textContent = Math.round(score);
    }

    function createParticles() {
      for (let i = 0; i < 12; i++) {
        const p = document.createElement("div");
        p.className = "particle";
        p.style.left = Math.random() * 100 + "%";
        p.style.bottom = (10 + Math.random() * 40) + "%";
        p.style.animationDuration = (6 + Math.random() * 8) + "s";
        p.style.animationDelay = (Math.random() * 8) + "s";
        document.getElementById("farm").appendChild(p);
      }
    }

    // ========== GAME FLOW ==========
    function startGame() {
      score = 100;
      correctCount = 0;
      wrongCount = 0;
      currentIndex = 0;
      shuffled = shuffle(TERMS);
      updateScoreDisplay();
      startScreen.classList.add("hidden");
      endScreen.classList.add("hidden");
      playScreen.classList.remove("hidden");
      nextQuestion();
    }

    function nextQuestion() {
      if (currentIndex >= shuffled.length) {
        endGame();
        return;
      }

      answered = false;
      feedbackEl.textContent = "";
      feedbackEl.className = "feedback";
      answerInput.value = "";
      answerInput.disabled = false;
      answerInput.focus();

      const item = shuffled[currentIndex];
      definitionEl.textContent = item.definition;
      totalTime = getTimeFor(item);
      timeLeft = totalTime;
      questionStart = Date.now();

      updateTimerUI();
      clearInterval(timerId);
      timerId = setInterval(tick, 100);
    }

    function tick() {
      const elapsed = (Date.now() - questionStart) / 1000;
      timeLeft = Math.max(0, totalTime - elapsed);
      updateTimerUI();

      if (timeLeft <= 0 && !answered) {
        handleTimeout();
      }
    }

    function updateTimerUI() {
      const secs = Math.ceil(timeLeft);
      timerDisplay.textContent = secs + "s";
      const pct = (timeLeft / totalTime) * 100;
      progressEl.style.width = pct + "%";

      if (timeLeft <= 5) {
        timerDisplay.classList.add("urgent");
        progressEl.classList.add("urgent");
      } else {
        timerDisplay.classList.remove("urgent");
        progressEl.classList.remove("urgent");
      }
    }

    function submitAnswer() {
      if (answered) return;
      const item = shuffled[currentIndex];
      const val = answerInput.value;
      if (!val.trim()) return;

      answered = true;
      clearInterval(timerId);
      answerInput.disabled = true;

      const elapsed = (Date.now() - questionStart) / 1000;
      const fast = elapsed <= 10;

      if (isCorrect(val, item)) {
        correctCount++;
        let msg = "Correct!";
        if (fast) {
          score += 10;
          msg = "Correct! +10% bonus";
          showBonusFlash();
        }
        feedbackEl.textContent = msg;
        feedbackEl.className = "feedback correct";
        updateScoreDisplay();
        setTimeout(() => {
          currentIndex++;
          nextQuestion();
        }, 900);
      } else {
        handleWrong(item);
      }
    }

    function handleTimeout() {
      if (answered) return;
      answered = true;
      clearInterval(timerId);
      answerInput.disabled = true;
      handleWrong(shuffled[currentIndex], true);
    }

    function handleWrong(item, timedOut = false) {
      wrongCount++;
      const penalty = getPenalty(item);
      score = Math.max(0, score - penalty);
      updateScoreDisplay();

      const prefix = timedOut ? "Time's up! " : "Incorrect. ";
      feedbackEl.textContent = prefix + "The term was: " + item.term;
      feedbackEl.className = "feedback wrong";

      // Trigger escape animation
      triggerEscape();

      setTimeout(() => {
        currentIndex++;
        nextQuestion();
      }, 2200);
    }

    function triggerEscape() {
      escapeHorse.classList.remove("running");
      // Force reflow
      void escapeHorse.offsetWidth;
      escapeHorse.classList.add("running");
      setTimeout(() => {
        escapeHorse.classList.remove("running");
      }, 2900);
    }

    function showBonusFlash() {
      const el = document.createElement("div");
      el.className = "bonus-flash";
      el.textContent = "+10%";
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 950);
    }

    function endGame() {
      clearInterval(timerId);
      playScreen.classList.add("hidden");
      endScreen.classList.remove("hidden");

      const total = correctCount + wrongCount;
      const accuracy = total ? Math.round((correctCount / total) * 100) : 0;

      document.getElementById("end-title").textContent =
        score >= 100 ? "Well Done!" : score >= 70 ? "Solid Session" : "Keep Studying";

      document.getElementById("end-stats").innerHTML = `
        Final Score: <strong>${Math.round(score)}%</strong><br>
        Correct: ${correctCount} &nbsp;|&nbsp; Missed: ${wrongCount}<br>
        Accuracy: ${accuracy}%
      `;
    }

    // ========== EVENTS ==========
    document.getElementById("btn-start").addEventListener("click", startGame);
    document.getElementById("btn-restart").addEventListener("click", startGame);
    document.getElementById("btn-submit").addEventListener("click", submitAnswer);

    answerInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") submitAnswer();
    });

    // Init particles
    createParticles();
  </script>
</body>
</html>
