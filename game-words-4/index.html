<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Chinese Word Study · 301–400</title>
<style>
:root{--ink:#1c1610;--muted:#6a5848;--paper:#f3eadc;--panel:#f7f1e6;--line:#d4c4a8;--deep:#2a2018;--good:#6b4a28;--bad:#8a2f27;--gold:#c9a45a;--vermilion:#9a3a28;--bronze:#6b4a28}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(1100px 640px at 12% -8%,rgba(154,58,40,.32),transparent 54%),linear-gradient(180deg,#2a2018 0%,#e4d4bc 46%,#1c1610 100%);color:var(--ink);font-family:Georgia,"Times New Roman","Noto Serif SC","Songti SC",serif;overflow:hidden}
.app{height:100vh;display:grid;grid-template-rows:auto 1fr;gap:0}
.topbar{min-height:58px;display:flex;align-items:center;gap:14px;padding:8px 18px;background:linear-gradient(90deg,#2a2018,#9a3a28 42%,#6b4a28 78%,#2a2018);color:#f4ead8;border-bottom:3px solid #c9a45a;box-shadow:0 1px 0 #5a2818}
.brand{font-size:18px;font-weight:700;letter-spacing:.06em;white-space:nowrap}.brand small{font-size:12px;font-weight:400;opacity:.72;margin-left:8px}
.progress{flex:1;max-width:460px;height:7px;background:rgba(255,255,255,.14);border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:linear-gradient(90deg,#c9a45a,#9a3a28);width:1%;transition:width .25s ease}
.stat{font-size:13px;opacity:.9;white-space:nowrap}.topbtn{border:1px solid rgba(201,164,90,.55);background:transparent;color:#f4ead8;border-radius:4px;padding:7px 10px;cursor:pointer}
.main{min-height:0;display:grid;grid-template-columns:minmax(400px,46%) 1fr;gap:18px;padding:18px}
.quiz{min-height:0;background:rgba(247,241,230,.98);border:3px solid #9a3a28;box-shadow:inset 0 0 0 7px #efe4d0,inset 0 0 0 8px #c9a45a,0 18px 50px rgba(28,22,16,.32);border-radius:2px;padding:20px 24px 16px;display:flex;flex-direction:column;overflow:auto}
.rankline{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.12em}
.character{text-align:center;font-family:"Noto Serif SC","Songti SC","STSong",serif;font-size:clamp(78px,9.2vw,128px);line-height:.95;margin:10px 0 2px;color:#1c1610;text-shadow:0 1px 0 #fff;letter-spacing:.04em}
.pinyin{text-align:center;font-size:clamp(22px,2.4vw,36px);font-style:italic;color:#9a3a28;margin:0 0 8px}
.front-pinyin{display:none}.prompt{text-align:center;font-size:15px;margin:2px 0 10px;color:#6a5848}
button{font:600 13px/1.1 Georgia,serif;letter-spacing:.03em}
.controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:3px 0 8px}.controls .nav{display:flex;gap:6px;margin-right:6px}
.ghost,.action{padding:9px 12px;border-radius:4px;cursor:pointer}.ghost{border:1px solid #6b4a28;background:#f3eadc;color:#2a2018}.action{border:1px solid #5a2418;background:#9a3a28;color:#fff}
.reveal{border-top:1px solid #d4c4a8;padding-top:10px;margin-top:2px;animation:fade .18s ease}
.reveal-head{margin-bottom:6px}.reveal-pinyin{font-size:clamp(26px,2.7vw,40px);font-style:italic;color:#9a3a28;font-weight:700}
.glosses{font-size:clamp(20px,2vw,30px);line-height:1.25;margin:4px 0 8px;color:#1c1610}.glosses b{color:#9a3a28}
.wordtitle,.extitle,.chartitle{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#6a5848;margin:10px 0 5px;font-weight:700}
.charlist{display:flex;gap:8px;flex-wrap:wrap}
.charchip{background:#efe4d0;border:1px solid #d4c4a8;border-radius:4px;padding:7px 10px;min-width:92px;box-shadow:inset 0 0 0 1px rgba(201,164,90,.35)}
.charchip .wzh{font-family:"Noto Serif SC","Songti SC",serif;font-size:28px;font-weight:700;line-height:1;color:#9a3a28}
.charchip .wpy{font-size:13px;font-style:italic;color:#6b4a28}.charchip .wen{font-size:12px;color:#5a4a3a}
.examples{display:grid;gap:6px}
.example{padding:7px 10px;background:#f3eadc;border-left:4px solid #6b4a28;border-radius:3px;line-height:1.24}
.example-zh{font-family:"Noto Serif SC","Songti SC",serif;font-size:clamp(18px,1.6vw,24px)}
.example-py{font-size:clamp(13px,1.05vw,16px);font-style:italic;color:#9a3a28;margin-top:2px}
.example-en{font-size:clamp(13px,1vw,16px);color:#4a3c30;margin-top:2px}
.example em{font-style:normal;font-weight:800;color:#9a3a28;background:#ead4b0;border-radius:3px;padding:0 .06em}
.flipcard{margin-top:3px;border:1px solid #c9a45a;border-radius:3px;padding:12px 14px;background:#f3eadc}
.flipcard h3{margin:0 0 7px;font-size:13px;color:#6b4a28;text-transform:uppercase;letter-spacing:.1em}
.english-list{font-size:clamp(22px,2vw,32px);line-height:1.25;margin:4px 0 10px}
.flipcard .reveal-pinyin{margin:0 0 6px}
.further{border:1px solid #6b4a28;background:transparent;color:#6b4a28;border-radius:4px;padding:8px 11px;cursor:pointer}
.imagepane{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;background:rgba(28,22,16,.95);border:3px solid #9a3a28;border-radius:2px;overflow:hidden;box-shadow:inset 0 0 0 7px rgba(201,164,90,.28),0 18px 50px rgba(28,22,16,.34)}
.imagepane:before{content:"";position:absolute;inset:9px;border:1px solid rgba(201,164,90,.55);border-radius:1px;pointer-events:none}
.art{display:block;max-width:94%;max-height:90%;width:auto;height:auto;object-fit:contain;filter:saturate(1.02) contrast(1.03);box-shadow:0 8px 32px rgba(0,0,0,.32);transition:opacity .35s ease,transform .35s ease}.art.wide{max-width:98%;max-height:84%}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@media(max-width:900px){body{overflow:auto}.app{height:auto;min-height:100vh}.main{grid-template-columns:1fr;grid-template-rows:auto minmax(360px,55vh)}.quiz{overflow:visible}.imagepane{min-height:420px}.topbar{flex-wrap:wrap}.progress{order:3;flex-basis:100%;max-width:none}}
@media(max-width:520px){.main{padding:9px;gap:9px}.quiz{padding:14px}.brand small{display:none}.character{font-size:72px}.topbar{padding:8px 10px}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">词语 301–400 <small>most common words</small></div>
    <div class="progress"><i id="progressFill"></i></div>
    <div class="stat" id="cardStat"></div>
    <button class="topbtn" id="shuffleBtn">Shuffle</button>
    <button class="topbtn" id="resetBtn">Reset order</button>
  </header>
  <main class="main">
    <section class="quiz">
      <div class="rankline"><span id="rankLabel"></span></div>
      <div class="character" id="char"></div>
      <div class="pinyin front-pinyin" id="pinyin" aria-hidden="true"></div>
      <div class="prompt">Recognize the word first. Reveal for dictionary English, each character, and three fully translated examples.</div>
      <div class="controls">
        <div class="nav"><button class="ghost" id="prevBtn">← Previous</button><button class="ghost" id="nextBtn">Next →</button></div>
        <button class="action" id="revealBtn">Reveal</button>
        <button class="ghost" id="flipBtn">Flip</button>
      </div>
      <div id="detailArea"></div>
    </section>
    <section class="imagepane" id="imagePane">
      <img class="art" id="art" alt="Study image">
    </section>
  </main>
</div>
<script>
const BANK = [{"rank":301,"word":"每天","pinyin":"měi tiān","en":["every day"],"chars":[{"ch":"每","py":"měi","en":"every"},{"ch":"天","py":"tiān","en":"day"}],"examples":[{"zh":"他每天天不亮就起身。","pinyin":"tā měi tiān tiān bù liàng jiù qǐ shēn.","en":"He rises every day before it is light."},{"zh":"这口井每天都有人来打水。","pinyin":"zhè kǒu jǐng měi tiān dōu yǒu rén lái dǎ shuǐ.","en":"People come to this well for water every day."},{"zh":"把窗打开，让风每天通一通。","pinyin":"bǎ chuāng dǎ kāi, ràng fēng měi tiān tōng yi tōng.","en":"Open the window and let the wind through every day."}]},{"rank":302,"word":"有时","pinyin":"yǒu shí","en":["sometimes"],"chars":[{"ch":"有","py":"yǒu","en":"have"},{"ch":"时","py":"shí","en":"time"}],"examples":[{"zh":"有时夜里会下雨。","pinyin":"yǒu shí yè lǐ huì xià yǔ.","en":"Sometimes it rains in the night."},{"zh":"他有时走山路，有时走河边。","pinyin":"tā yǒu shí zǒu shān lù, yǒu shí zǒu hé biān.","en":"Sometimes he takes the mountain road, sometimes the river."},{"zh":"灯有时亮，有时灭。","pinyin":"dēng yǒu shí liàng, yǒu shí miè.","en":"The lamp is sometimes lit, sometimes out."}]},{"rank":303,"word":"立刻","pinyin":"lì kè","en":["immediately","at once"],"chars":[{"ch":"立","py":"lì","en":"stand; immediately"},{"ch":"刻","py":"kè","en":"quarter-hour; moment"}],"examples":[{"zh":"听见叫门，他立刻起身。","pinyin":"tīng jiàn jiào mén, tā lì kè qǐ shēn.","en":"Hearing the knock, he rose at once."},{"zh":"火要立刻扑灭。","pinyin":"huǒ yào lì kè pū miè.","en":"The fire must be put out immediately."},{"zh":"信到了，立刻回一封。","pinyin":"xìn dào le, lì kè huí yì fēng.","en":"When the letter arrived, reply at once."}]},{"rank":304,"word":"不久","pinyin":"bù jiǔ","en":["soon","before long","not long"],"chars":[{"ch":"不","py":"bù","en":"not"},{"ch":"久","py":"jiǔ","en":"long (time)"}],"examples":[{"zh":"不久天就要亮了。","pinyin":"bù jiǔ tiān jiù yào liàng le.","en":"It will be light before long."},{"zh":"他走了不久又回来。","pinyin":"tā zǒu le bù jiǔ yòu huí lái.","en":"He had not been gone long before he came back."},{"zh":"雨不久就会停。","pinyin":"yǔ bù jiǔ jiù huì tíng.","en":"The rain will stop soon."}]},{"rank":305,"word":"长期","pinyin":"cháng qī","en":["long-term","for a long period"],"chars":[{"ch":"长","py":"cháng","en":"long"},{"ch":"期","py":"qī","en":"period"}],"examples":[{"zh":"他长期住在山上。","pinyin":"tā cháng qī zhù zài shān shàng.","en":"He has lived on the mountain for a long period."},{"zh":"这是一项长期的活。","pinyin":"zhè shì yí xiàng cháng qī de huó.","en":"This is long-term work."},{"zh":"井要长期照看，不能荒。","pinyin":"jǐng yào cháng qī zhào kàn, bù néng huāng.","en":"The well must be looked after over the long term and not left to go to waste."}]},{"rank":306,"word":"期间","pinyin":"qī jiān","en":["period","during","in the course of"],"chars":[{"ch":"期","py":"qī","en":"period"},{"ch":"间","py":"jiān","en":"interval"}],"examples":[{"zh":"收麦期间大家都在田里。","pinyin":"shōu mài qī jiān dà jiā dōu zài tián lǐ.","en":"During the wheat harvest everyone is in the fields."},{"zh":"下雨期间不要过河。","pinyin":"xià yǔ qī jiān bú yào guò hé.","en":"Do not cross the river during the rain."},{"zh":"这一期间村里很安静。","pinyin":"zhè yì qī jiān cūn lǐ hěn ān jìng.","en":"In this period the village is very quiet."}]},{"rank":307,"word":"过程","pinyin":"guò chéng","en":["process","course"],"chars":[{"ch":"过","py":"guò","en":"pass"},{"ch":"程","py":"chéng","en":"journey; rule"}],"examples":[{"zh":"修桥的过程比想象的长。","pinyin":"xiū qiáo de guò chéng bǐ xiǎng xiàng de cháng.","en":"The process of mending the bridge was longer than imagined."},{"zh":"把这件事的过程说一遍。","pinyin":"bǎ zhè jiàn shì de guò chéng shuō yí biàn.","en":"Tell the course of this matter once through."},{"zh":"学习是一个慢慢的过程。","pinyin":"xué xí shì yí ge màn man de guò chéng.","en":"Study is a slow process."}]},{"rank":308,"word":"结束","pinyin":"jié shù","en":["end","finish","conclude"],"chars":[{"ch":"结","py":"jié","en":"tie; conclude"},{"ch":"束","py":"shù","en":"bind; bunch"}],"examples":[{"zh":"今天的活到这儿结束。","pinyin":"jīn tiān de huó dào zhèr jié shù.","en":"Today's work ends here."},{"zh":"雨停了，这场麻烦才结束。","pinyin":"yǔ tíng le, zhè chǎng má fan cái jié shù.","en":"The rain stopped, and only then did this trouble conclude."},{"zh":"故事结束得很快。","pinyin":"gù shi jié shù de hěn kuài.","en":"The story ends very quickly."}]},{"rank":309,"word":"停止","pinyin":"tíng zhǐ","en":["stop","cease"],"chars":[{"ch":"停","py":"tíng","en":"stop"},{"ch":"止","py":"zhǐ","en":"halt"}],"examples":[{"zh":"钟声停止以后，村子静了。","pinyin":"zhōng shēng tíng zhǐ yǐ hòu, cūn zi jìng le.","en":"After the bell ceased, the village was still."},{"zh":"请停止一会儿，喝口茶。","pinyin":"qǐng tíng zhǐ yí huìr, hē kǒu chá.","en":"Please stop a while and drink some tea."},{"zh":"风一直没有停止。","pinyin":"fēng yì zhí méi yǒu tíng zhǐ.","en":"The wind has not stopped at all."}]},{"rank":310,"word":"保持","pinyin":"bǎo chí","en":["keep","maintain","preserve"],"chars":[{"ch":"保","py":"bǎo","en":"protect; keep"},{"ch":"持","py":"chí","en":"hold"}],"examples":[{"zh":"把火保持着，别灭了。","pinyin":"bǎ huǒ bǎo chí zhe, bié miè le.","en":"Keep the fire; do not let it go out."},{"zh":"这条路要保持畅通。","pinyin":"zhè tiáo lù yào bǎo chí chàng tōng.","en":"This road must be kept open."},{"zh":"他始终保持着原来的脾气。","pinyin":"tā shǐ zhōng bǎo chí zhe yuán lái de pí qi.","en":"He has all along kept his original temper."}]},{"rank":311,"word":"获得","pinyin":"huò dé","en":["obtain","gain","win"],"chars":[{"ch":"获","py":"huò","en":"catch; obtain"},{"ch":"得","py":"dé","en":"get"}],"examples":[{"zh":"他终于获得了回信。","pinyin":"tā zhōng yú huò dé le huí xìn.","en":"He finally obtained a reply."},{"zh":"好收成是从辛苦里获得的。","pinyin":"hǎo shōu cheng shì cóng xīn kǔ lǐ huò dé de.","en":"A good harvest is gained from hard work."},{"zh":"这件事获得了大家的同意。","pinyin":"zhè jiàn shì huò dé le dà jiā de tóng yì.","en":"This matter obtained everyone's consent."}]},{"rank":312,"word":"失去","pinyin":"shī qù","en":["lose"],"chars":[{"ch":"失","py":"shī","en":"lose"},{"ch":"去","py":"qù","en":"go; away"}],"examples":[{"zh":"钥匙失去了，门开不了。","pinyin":"yào shi shī qù le, mén kāi bù liǎo.","en":"The key is lost; the door will not open." const IMAGES = ["img/01-temple-bridge.jpg", "img/02-dacheng-hall.jpg", "img/03-river-boat.jpg", "img/04-kai-shu-page.jpg", "img/05-old-alley.jpg", "img/06-food-street.jpg", "img/07-hangzhou.jpg", "img/08-zhengding-street.jpg", "img/09-lakeside-pagodas.jpg", "img/10-erlitou-marks.jpg", "img/11-pagoda.jpg", "img/12-weaving.jpg", "img/13-suzhou-street.jpg", "img/14-observatory.jpg", "img/15-oracle-bone.jpg"];
let order = BANK.map((_,i)=>i), pos=0, state='front';
const $=id=>document.getElementById(id);
function current(){return BANK[order[pos]]}
function safe(t){return String(t).replace(/[&<>"']/g,m=>({'&':'&','<':'<','>':'>','"':'"',"'":'&#039;'}[m]))}
function mark(sentence,w){return safe(sentence).split(safe(w)).join('<em>'+safe(w)+'</em>')}
function imageForPosition(){const n=IMAGES.length||1;return Math.floor(pos*n/BANK.length)%n}
function setImage(){const idx=imageForPosition(), img=$('art');img.style.opacity=.15;setTimeout(()=>{img.src=IMAGES[idx]; img.onload=()=>{img.classList.toggle('wide',img.naturalWidth/img.naturalHeight>1.75);img.style.opacity=1}},90)}
function renderDetail(mode){const c=current(), d=$('detailArea'); if(mode==='front'){d.innerHTML='';return}
 if(mode==='flip'){d.innerHTML=`<div class="flipcard"><h3>Pinyin + English</h3><div class="reveal-pinyin">${safe(c.pinyin)}</div><div class="english-list">${c.en.map(safe).join(' · ')}</div><button class="further" id="furtherBtn">Reveal further</button></div>`;$('furtherBtn').onclick=()=>{state='revealed';renderDetail('revealed')};return}
 const chars=c.chars.map(w=>`<div class="charchip"><div class="wzh">${safe(w.ch)}</div><div class="wpy">${safe(w.py)}</div><div class="wen">${safe(w.en)}</div></div>`).join('');
 const ex=c.examples.map(x=>`<div class="example"><div class="example-zh">${mark(x.zh,c.word)}</div><div class="example-py">${safe(x.pinyin)}</div><div class="example-en">${safe(x.en)}</div></div>`).join('');
 d.innerHTML=`<div class="reveal"><div class="reveal-head"><div class="reveal-pinyin">${safe(c.pinyin)}</div><p class="glosses"><b>${safe(c.word)}</b> — ${c.en.map(safe).join('; ')}</p></div><div class="chartitle">Characters in this word</div><div class="charlist">${chars}</div><div class="extitle">Example sentences</div><div class="examples">${ex}</div></div>`}
function render(changeImage=true){const c=current();$('char').textContent=c.word;$('pinyin').textContent='';$('rankLabel').textContent=`Word frequency #${c.rank}`;$('cardStat').textContent=`${pos+1} / ${BANK.length}`;$('progressFill').style.width=((pos+1)/BANK.length*100)+'%';state='front';renderDetail('front');if(changeImage)setImage()}
function move(delta){const oldImg=imageForPosition();pos=Math.max(0,Math.min(BANK.length-1,pos+delta));render(imageForPosition()!==oldImg)}
$('prevBtn').onclick=()=>move(-1);$('nextBtn').onclick=()=>move(1);
$('revealBtn').onclick=()=>{state='revealed';renderDetail('revealed')};$('flipBtn').onclick=()=>{state='flip';renderDetail('flip')};
$('shuffleBtn').onclick=()=>{for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}pos=0;render(true)};
$('resetBtn').onclick=()=>{order=BANK.map((_,i)=>i);pos=0;render(true)};
render(true);
