<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Chinese Character Study · 1601–1700</title>
<style>
:root{--ink:#142428;--muted:#4e6a70;--paper:#eef4f2;--panel:#f4f8f6;--line:#a8c0c4;--deep:#1c3a44;--good:#2a5c3c;--bad:#8a2f27;--gold:#c4a36a}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(1200px 700px at 12% -10%,rgba(190,230,236,.38),transparent 52%),linear-gradient(180deg,#8aa4a8 0%,#c5d4d0 42%,#7a9298 100%);color:var(--ink);font-family:Georgia,"Times New Roman","Noto Serif SC","Songti SC",serif;overflow:hidden}
.app{height:100vh;display:grid;grid-template-rows:auto 1fr;gap:0}
.topbar{min-height:58px;display:flex;align-items:center;gap:14px;padding:8px 18px;background:rgba(18,40,46,.96);color:#e8f4f2;border-bottom:2px solid #c4a36a}
.brand{font-size:18px;font-weight:700;letter-spacing:.05em;white-space:nowrap}.brand small{font-size:12px;font-weight:400;opacity:.7;margin-left:8px}
.progress{flex:1;max-width:460px;height:7px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:#c4a36a;width:1%;transition:width .25s ease}
.stat{font-size:13px;opacity:.88;white-space:nowrap}.topbtn{border:1px solid rgba(255,255,255,.28);background:transparent;color:white;border-radius:8px;padding:7px 10px;cursor:pointer}
.main{min-height:0;display:grid;grid-template-columns:minmax(390px,46%) 1fr;gap:18px;padding:18px}
.quiz{min-height:0;background:rgba(244,248,246,.97);border:2px solid #2d555c;box-shadow:inset 0 0 0 6px #dce8e6,0 16px 48px rgba(18,40,46,.26);border-radius:4px;padding:18px 22px 16px;display:flex;flex-direction:column;overflow:auto}
.rankline{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.09em}
.character{text-align:center;font-family:"Noto Serif SC","Songti SC","STSong",serif;font-size:clamp(92px,11vw,164px);line-height:.95;margin:8px 0 0;color:#142428;text-shadow:0 1px 0 #fff}
.pinyin{text-align:center;font-size:clamp(24px,2.6vw,39px);font-style:italic;color:#2d555c;margin:0 0 8px}
.front-pinyin{display:none}.prompt{text-align:center;font-size:16px;margin:2px 0 8px;color:#4e6a70}
button{font:600 13px/1.1 Georgia,serif;letter-spacing:.03em}
.controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:3px 0 7px}.controls .nav{display:flex;gap:6px;margin-right:6px}.ghost,.action{padding:9px 12px;border-radius:8px;cursor:pointer}.ghost{border:1px solid #8aa8ac;background:#e8f2f0;color:#1e3438}.action{border:1px solid #2d555c;background:#2d555c;color:#fff}
.reveal{border-top:1px solid #c5d4d2;padding-top:9px;margin-top:2px;animation:fade .18s ease}.reveal-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:5px}.reveal-pinyin{font-size:clamp(27px,2.8vw,42px);font-style:italic;color:#2d555c;font-weight:700}.definition{font-size:20px;margin:0}.definition b{color:#2a4a4c}.wordtitle,.extitle{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:#4e6a70;margin:9px 0 4px;font-weight:700}.wordlist{display:flex;gap:6px;flex-wrap:wrap}.wordchip{background:#e4eeec;border:1px solid #c3d4d0;border-radius:7px;padding:5px 8px;line-height:1.18}.wordchip .wzh{font-family:"Noto Serif SC","Songti SC",serif;font-size:19px;font-weight:700}.wordchip .wpy{font-size:13px;font-style:italic;color:#3a5560}.wordchip .wen{font-size:12px;color:#4f5e5c}.examples{display:grid;gap:5px}.example{padding:6px 9px;background:#eef4f2;border-left:3px solid #3d6a70;border-radius:5px;line-height:1.22}.example-zh{font-family:"Noto Serif SC","Songti SC",serif;font-size:clamp(19px,1.65vw,25px)}.example-py{font-size:clamp(14px,1.1vw,17px);font-style:italic;color:#3a5560;margin-top:2px}.example-en{font-size:clamp(13px,1vw,16px);color:#4f463f;margin-top:2px}.example em{font-style:normal;font-weight:800;color:#8d2f21;background:#d7e4de;border-radius:3px;padding:0 .05em}
.flipcard{margin-top:3px;border:1px solid #9ab0b0;border-radius:4px;padding:12px 14px;background:#eef4f2}.flipcard h3{margin:0 0 7px;font-size:15px;color:#3a5560;text-transform:uppercase;letter-spacing:.08em}.english-list{font-size:clamp(22px,2vw,32px);line-height:1.2;margin:4px 0 10px}.flipcard .reveal-pinyin{margin:0 0 6px}.further{border:1px solid #2d555c;background:transparent;color:#2d555c;border-radius:8px;padding:8px 11px;cursor:pointer}
.imagepane{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;background:rgba(16,32,38,.94);border:2px solid #1a3a40;border-radius:4px;overflow:hidden;box-shadow:inset 0 0 0 7px rgba(196,163,106,.22),0 16px 48px rgba(18,40,46,.3)}
.imagepane:before{content:"";position:absolute;inset:8px;border:1px solid rgba(196,163,106,.5);border-radius:3px;pointer-events:none}.art{display:block;max-width:94%;max-height:90%;width:auto;height:auto;object-fit:contain;filter:saturate(.98) contrast(1.02);box-shadow:0 8px 32px rgba(0,0,0,.28);transition:opacity .35s ease,transform .35s ease}.art.wide{max-width:98%;max-height:84%}

@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@media(max-width:900px){body{overflow:auto}.app{height:auto;min-height:100vh}.main{grid-template-columns:1fr;grid-template-rows:auto minmax(360px,55vh)}.quiz{overflow:visible}.imagepane{min-height:420px}.topbar{flex-wrap:wrap}.progress{order:3;flex-basis:100%;max-width:none}}
@media(max-width:520px){.main{padding:9px;gap:9px}.quiz{padding:14px}.brand small{display:none}.character{font-size:104px}.example{font-size:20px}.topbar{padding:8px 10px}.stat.scoreStat{display:none}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">汉字 1601–1700 <small>recognition + study</small></div>
    <div class="progress"><i id="progressFill"></i></div>
    <div class="stat" id="cardStat"></div>
    <button class="topbtn" id="shuffleBtn">Shuffle</button>
    <button class="topbtn" id="resetBtn">Reset order</button>
  </header>

  <main class="main">
    <section class="quiz">
      <div class="rankline"><span id="rankLabel"></span></div>
      <div class="character" id="char"></div>
      <div class="pinyin front-pinyin" id="pinyin" aria-hidden="true"></div>
      <div class="prompt">Recognize the character first. Reveal for pinyin, meanings, common words, and fully translated examples.</div>
      <div class="controls">
        <div class="nav"><button class="ghost" id="prevBtn">← Previous</button><button class="ghost" id="nextBtn">Next →</button></div>
        <button class="action" id="revealBtn">Reveal</button>
        <button class="ghost" id="flipBtn">Flip</button>
      </div>
      <div id="detailArea"></div>
    </section>

    <section class="imagepane" id="imagePane">
      <img class="art" id="art" alt="Chinese art and material culture study image">
    </section>
  </main>
</div>
<script>
const BANK = [{"rank":1601,"char":"陶","pinyin":"táo","meanings":["pottery","cultivate","Tao"],"words":[{"zh":"陶瓷","pinyin":"táo cí","en":"ceramics"},{"zh":"陶醉","pinyin":"táo zuì","en":"be intoxicated"},{"zh":"陶冶","pinyin":"táo yě","en":"cultivate; mould"},{"zh":"陶器","pinyin":"táo qì","en":"earthenware"}],"examples":[{"zh":"博物馆里陈列着古代陶瓷。","pinyin":"bó wù guǎn lǐ chén liè zhe gǔ dài táo cí.","en":"Ancient ceramics are displayed in the museum."},{"zh":"他陶醉在音乐之中。","pinyin":"tā táo zuì zài yīn yuè zhī zhōng.","en":"He was intoxicated by the music."},{"zh":"读书可以陶冶性情。","pinyin":"dú shū kě yǐ táo yě xìng qíng.","en":"Reading can cultivate the temperament."}]},{"rank":1602,"char":"兽","pinyin":"shòu","meanings":["beast","wild animal"],"words":[{"zh":"野兽","pinyin":"yě shòu","en":"wild beast"},{"zh":"兽医","pinyin":"shòu yī","en":"veterinarian"},{"zh":"怪兽","pinyin":"guài shòu","en":"monster"},{"zh":"兽性","pinyin":"shòu xìng","en":"brutality"}],"examples":[{"zh":"森林里有许多野兽。","pinyin":"sēn lín lǐ yǒu hěn duō yě shòu.","en":"There are many wild beasts in the forest."},{"zh":"这只狗需要看兽医。","pinyin":"zhè zhī gǒu xū yào kàn shòu yī.","en":"This dog needs to see a veterinarian."},{"zh":"故事里出现了一只怪兽。","pinyin":"gù shi lǐ chū xiàn le yì zhī guǎi shòu.","en":"A monster appeared in the story."}]},{"rank":1603,"char":"帐","pinyin":"zhàng","meanings":["tent","curtain","mosquito net"],"words":[{"zh":"帐篷","pinyin":"zhàng peng","en":"tent"},{"zh":"蚊帐","pinyin":"wén zhàng","en":"mosquito net"},{"zh":"营帐","pinyin":"yíng zhàng","en":"camp tent"},{"zh":"青纱帐","pinyin":"qīng shā zhàng","en":"green gauze canopy"}],"examples":[{"zh":"他们在河边支起帐篷。","pinyin":"tā men zài hé biān zhī qǐ zhàng peng.","en":"They pitched a tent by the river."},{"zh":"夏天要挂上蚊帐。","pinyin":"xià tiān yào guà shàng wén zhàng.","en":"In summer one should hang up a mosquito net."},{"zh":"士兵们住在营帐里。","pinyin":"shì bīng men zhù zài yíng zhàng lǐ.","en":"The soldiers live in the camp tents."}]},{"rank":1604,"char":"饰","pinyin":"shì","meanings":["decorate","ornament","play the part of"],"words":[{"zh":"装饰","pinyin":"zhuāng shì","en":"decorate"},{"zh":"首饰","pinyin":"shǒu shì","en":"jewelry"},{"zh":"掩饰","pinyin":"yǎn shì","en":"cover up"},{"zh":"饰品","pinyin":"shì pǐn","en":"ornament"}],"examples":[{"zh":"房间装饰得很漂亮。","pinyin":"fáng jiān zhuāng shì de hěn piào liang.","en":"The room is decorated very prettily."},{"zh":"盒子里放着几件首饰。","pinyin":"hé zi lǐ fàng zhe jǐ jiàn shǒu shì.","en":"There are several pieces of jewelry in the box."},{"zh":"不要掩饰自己的错误。","pinyin":"bú yào yǎn shì zì jǐ de cuò wù.","en":"Do not cover up your own mistakes."}]},{"rank":1605,"char":"贷","pinyin":"dài","meanings":["lend","loan","pardon"],"words":[{"zh":"贷款","pinyin":"dài kuǎn","en":"loan"},{"zh":"信贷","pinyin":"xìn dài","en":"credit"},{"zh":"借贷","pinyin":"jiè dài","en":"borrow or lend"},{"zh":"责无旁贷","pinyin":"zé wú páng dài","en":"be one's unshirkable duty"}],"examples":[{"zh":"他们向银行申请贷款。","pinyin":"tā men xiàng yín háng shēn qǐng dài kuǎn.","en":"They applied to the bank for a loan."},{"zh":"小企业需要信贷支持。","pinyin":"xiǎo qǐ yè xū yào xìn dài zhī chí.","en":"Small businesses need credit support."},{"zh":"保护环境是每个人责无旁贷的事。","pinyin":"bǎo hù huán jìng shì měi gè rén zé wú páng dài de shì.","en":"Protecting the environment is everyone's unshirkable duty."}]},{"rank":1606,"char":"昌","pinyin":"chāng","meanings":["prosperous","flourishing"],"words":[{"zh":"昌盛","pinyin":"chāng shèng","en":"prosperous"},{"zh":"南昌","pinyin":"Nán chāng","en":"Nanchang"},{"zh":"昌明","pinyin":"chāng míng","en":"flourishing and enlightened"},{"zh":"昌盛时期","pinyin":"chāng shèng shí qī","en":"a flourishing period"}],"examples":[{"zh":"国家日益昌盛。","pinyin":"guó jiā rì yì chāng shèng.","en":"The country grows more prosperous day by day."},{"zh":"南昌是一座历史悠久的城市。","pinyin":"Nán chāng shì yí zuò lì shǐ yōu jiǔ de chéng shì.","en":"Nanchang is a city with a long history."},{"zh":"科学日益昌明。","pinyin":"kē xué rì yì chāng míng.","en":"Science grows more flourishing and enlightened."}]},{"rank":1607,"char":"叙","pinyin":"xù","meanings":["narrate","chat","preface"],"words":[{"zh":"叙述","pinyin":"xù shù","en":"narrate"},{"zh":"叙谈","pinyin":"xù tán","en":"chat"},{"zh":"叙事","pinyin":"xù shì","en":"narrate events"},{"zh":"追叙","pinyin":"zhuī xù","en":"recount the past"}],"examples":[{"zh":"请把经过叙述一遍。","pinyin":"qǐng bǎ jīng guò xù shù yí biàn.","en":"Please narrate what happened once through."},{"zh":"老朋友见面叙谈往事。","pinyin":"lǎo péng you jiàn miàn xù tán wǎng shì.","en":"Old friends met and chatted about the past."},{"zh":"这是一篇叙事散文。","pinyin":"zhè shì yì piān xù shì sǎn wén.","en":"This is a narrative essay."}]},{"rank":1608,"char":"躺","pinyin":"tǎng","meanings":["lie down"],"words":[{"zh":"躺下","pinyin":"tǎng xia","en":"lie down"},{"zh":"躺椅","pinyin":"tǎng yǐ","en":"deck chair"},{"zh":"躺平","pinyin":"tǎng píng","en":"lie flat"},{"zh":"躺着","pinyin":"tǎng zhe","en":"be lying"}],"examples":[{"zh":"他累了，想躺下休息。","pinyin":"tā lèi le, xiǎng tǎng xia xiū xi.","en":"He is tired and wants to lie down and rest."},{"zh":"阳台上有一把躺椅。","pinyin":"yáng tái shàng yǒu yì bǎ tǎng yǐ.","en":"There is a deck chair on the balcony."},{"zh":"病人躺着不能起来。","pinyin":"bìng rén tǎng zhe bù néng qǐ lai.","en":"The patient is lying down and cannot get up."}]},{"rank":1609,"char":"钢","pinyin":"gāng","meanings":["steel"],"words":[{"zh":"钢铁","pinyin":"gāng tiě","en":"steel and iron"},{"zh":"钢笔","pinyin":"gāng bǐ","en":"fountain pen"},{"zh":"钢板","pinyin":"gāng bǎn","en":"steel plate"},{"zh":"炼钢","pinyin":"liàn gāng","en":"smelt steel"}],"examples":[{"zh":"这座桥是用钢铁建成的。","pinyin":"zhè zuò qiáo shì yòng gāng tiě jiàn chéng de.","en":"This bridge is built of steel and iron."},{"zh":"请用钢笔填写表格。","pinyin":"qǐng yòng gāng bǐ tián xiě biǎo gé.","en":"Please fill in the form with a fountain pen."},{"zh":"工厂正在炼钢。","pinyin":"gōng chǎng zhèng zài liàn gāng.","en":"The factory is smelting steel."}]},{"rank":1610,"char":"沟","pinyin":"gōu","meanings":["ditch","gully","groove"],"words":[{"zh":"水沟","pinyin":"shuǐ gōu","en":"ditc function renderDetail(mode){const c=current(), d=$('detailArea'); if(mode==='front'){d.innerHTML='';return}
