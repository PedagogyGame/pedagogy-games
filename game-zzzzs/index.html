<style>
  :root {
    --bg: #0b0f0c;
    --elev: #121814;
    --subtle: #18201b;
    --fg: #ecebe3;
    --muted: #9aa394;
    --subtle-fg: #6e776c;
    --border: color-mix(in oklab, var(--fg) 12%, transparent);
    --border-strong: color-mix(in oklab, var(--fg) 22%, transparent);
    --accent: #c9d0c4;
    --accent-fg: #0b0f0c;
    --moss: #7d9a6e;
    --mat: #e6dfd1;
    --correct: #7d9a6e;
    --wrong: #c26a62;
    --chip: #161d18;
    --correct-soft: #7d9a6e29;
    --wrong-soft: #c26a6229;
    --display: "Newsreader", "Iowan Old Style", Palatino, serif;
    --sans: "Figtree", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  button:not(:disabled), [role="button"]:not(:disabled) { cursor: pointer; }
  h1, h2, h3 { font-family: var(--display); text-wrap: balance; font-weight: 500; }
  p { text-wrap: pretty; }
  a { color: inherit; }
  .wrap { max-width: 72rem; margin: 0 auto; padding: 1.25rem 1.5rem 2.5rem; display: flex; flex-direction: column; gap: 1.25rem; }
  header.top { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: space-between; align-items: flex-start; }
  .kicker { font-size: 0.75rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--moss); margin: 0; }
  h1 { font-size: clamp(2rem, 1.4rem + 2vw, 3rem); margin: 0.25rem 0 0; letter-spacing: -0.03em; line-height: 1; }
  .lede { max-width: 36rem; color: var(--muted); font-size: 0.9rem; line-height: 1.55; margin: 0.5rem 0 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .chip { min-width: 5rem; border: 1px solid var(--border); background: var(--chip); border-radius: 0.75rem; padding: 0.5rem 0.75rem; text-align: center; }
  .chip span { display: block; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--subtle-fg); font-weight: 500; }
  .chip b { font-family: var(--display); font-size: 1.125rem; font-weight: 500; font-variant-numeric: tabular-nums; }
  .grid2 { display: grid; gap: 1rem; }
  @media (min-width: 960px) { .grid2 { grid-template-columns: 1fr 1fr; } .play-grid { direction: ltr; } .play-grid .ask { order: 1; } .play-grid .photo { order: 2; } }
  .card { background: var(--elev); border: 1px solid var(--border); border-radius: 1rem; padding: 1.5rem 1.75rem; }
  .card h2 { font-size: clamp(1.75rem, 1.2rem + 1.4vw, 2.25rem); margin: 0.35rem 0 0; letter-spacing: -0.02em; }
  .muted { color: var(--muted); font-size: 0.9rem; line-height: 1.55; }
  .choices, .plays { display: grid; gap: 0.5rem; margin-top: 1.25rem; }
  .playbtn, .choice, .ghost, .primary, .navbtn {
    border: 1px solid var(--border); background: var(--subtle); color: var(--fg);
    border-radius: 0.75rem; padding: 0.7rem 1rem; text-align: left; font: inherit;
    transition: border-color 150ms ease, background 150ms ease, opacity 150ms ease;
  }
  .playbtn { display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; }
  .playbtn:hover, .choice:hover:not(:disabled), .ghost:hover, .navbtn:hover { border-color: var(--border-strong); }
  .playbtn small { display: block; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--moss); font-weight: 500; }
  .playbtn span { font-size: 0.9rem; font-weight: 500; }
  .playbtn em { font-style: normal; color: var(--subtle-fg); font-size: 0.75rem; }
  .choice { display: flex; align-items: center; gap: 0.75rem; min-height: 3rem; background: transparent; }
  .choice:disabled { cursor: default; }
  .letter { width: 2rem; height: 2rem; border-radius: 999px; border: 1px solid var(--border-strong); display: grid; place-items: center; font-size: 0.75rem; font-weight: 500; color: var(--muted); flex: none; }
  .choice.ok { border-color: var(--correct); background: var(--correct-soft); animation: pulse 900ms ease-out 0s 2; }
  .choice.ok .letter { border-color: var(--correct); color: var(--correct); }
  .choice.bad { border-color: var(--wrong); background: var(--wrong-soft); }
  .choice.bad .letter { border-color: var(--wrong); color: var(--wrong); }
  .choice.dim { opacity: 0.55; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 color-mix(in oklab, var(--correct) 45%, transparent); }
    70% { box-shadow: 0 0 0 8px transparent; }
    100% { box-shadow: 0 0 0 0 transparent; }
  }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; margin-top: 1.25rem; }
  .ghost { background: transparent; min-height: 2.75rem; font-size: 0.8rem; color: var(--subtle-fg); }
  .primary { background: var(--accent); color: var(--accent-fg); font-weight: 500; font-size: 0.9rem; min-height: 2.75rem; }
  .primary:disabled { background: var(--subtle); color: var(--subtle-fg); }
  .primary:not(:disabled):active { transform: scale(0.98); }
  .bar { height: 1px; background: var(--border); border-radius: 99px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--moss); width: 0; transition: width 500ms ease; }
  .photo-card { padding: 0; overflow: hidden; }
  .mat { padding: 0.85rem; }
  .mat-inner { background: var(--mat); border-radius: 0.75rem; overflow: hidden; }
  .mat-inner img, .ph { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; background: var(--subtle); }
  .ph { display: grid; place-items: center; color: var(--muted); font-size: 0.9rem; }
  .ident { border-top: 1px solid var(--border); padding: 1.15rem 1.5rem 1.35rem; }
  .ident .label { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--subtle-fg); font-weight: 500; }
  .ident h3 { font-size: clamp(1.5rem, 1.2rem + 1vw, 1.9rem); margin: 0.4rem 0 0; }
  .ident .latin { font-style: italic; color: var(--muted); font-size: 0.9rem; margin: 0.15rem 0 0; }
  .verdict { font-size: 0.75rem; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; margin: 0.75rem 0 0; }
  .verdict.ok { color: var(--correct); }
  .verdict.bad { color: var(--wrong); }
  dl.facts { margin: 1rem 0 0; display: grid; gap: 0.75rem; }
  dl.facts dt { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--moss); font-weight: 500; }
  dl.facts dd { margin: 0.25rem 0 0; color: var(--muted); font-size: 0.9rem; line-height: 1.5; }
  .credit { display: flex; justify-content: space-between; gap: 0.75rem; margin-top: 1rem; font-size: 0.75rem; color: var(--subtle-fg); }
  .credit a { color: var(--muted); text-decoration: none; white-space: nowrap; }
  .credit a:hover { color: var(--fg); }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-top: 1.25rem; }
  .stat { border: 1px solid var(--border); background: var(--subtle); border-radius: 0.75rem; padding: 0.75rem 1rem; }
  .stat dt { font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--subtle-fg); }
  .stat dd { margin: 0.25rem 0 0; font-family: var(--display); font-size: 1.5rem; font-variant-numeric: tabular-nums; }
  .hint { font-size: 0.75rem; color: var(--subtle-fg); margin: 1.15rem 0 0; }
  .stack { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 1.25rem; }
  .results { max-width: 36rem; margin: 0 auto; width: 100%; }
  .search { width: 100%; height: 3rem; border-radius: 0.75rem; border: 1px solid var(--border); background: var(--bg); color: var(--fg); padding: 0 1rem; font: inherit; margin-top: 1.15rem; outline: none; }
  .search:focus { border-color: var(--border-strong); }
  .guide-list { list-style: none; padding: 0; margin: 1rem 0 0; display: grid; gap: 0.5rem; }
  @media (min-width: 640px) { .guide-list { grid-template-columns: 1fr 1fr; } }
  @media (min-width: 960px) { .guide-list { grid-template-columns: 1fr 1fr 1fr; } }
  .guide-list button { display: flex; width: 100%; gap: 0.75rem; align-items: center; background: var(--subtle); border: 1px solid var(--border); border-radius: 0.75rem; padding: 0.5rem; text-align: left; color: inherit; font: inherit; }
  .guide-list img { width: 3.5rem; height: 3.5rem; object-fit: cover; border-radius: 0.5rem; background: var(--bg); flex: none; }
  .guide-list b { display: block; font-weight: 500; font-size: 0.9rem; }
  .guide-list i { display: block; font-size: 0.75rem; color: var(--muted); }
  .guide-list small { display: block; margin-top: 0.2rem; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--subtle-fg); }
  .modal { position: fixed; inset: 0; background: color-mix(in oklab, var(--bg) 72%, transparent); display: flex; align-items: flex-end; justify-content: center; padding: 1rem; z-index: 20; }
  @media (min-width: 640px) { .modal { align-items: center; } }
  .modal .sheet { width: 100%; max-width: 32rem; max-height: 90dvh; overflow: auto; background: var(--elev); border: 1px solid var(--border); border-radius: 1rem; padding: 1.25rem; }
  .modal img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 0.75rem; background: var(--mat); }
  .hidden { display: none !important; }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>

pes have dinner-plate blooms; millifloras cover themselves in small ones.", "feature": "Funnel-shaped flowers with a sticky, slightly hairy calyx; many modern series are self-cleaning.", "prefers": "Full sun or very bright light; even moisture or a light dry-down. Collapses in deep shade and in constantly wet peat.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/5/55/PetuniaFlower.JPG/1280px-PetuniaFlower.JPG", "wiki": "https://en.wikipedia.org/wiki/Petunia_%C3%97_atkinsiana", "credit": "Wikimedia Commons · PetuniaFlower.JPG"}, {"id": "kalanchoe", "commonName": "Kalanchoe", "latin": "Kalanchoe blossfeldiana", "family": "Crassulaceae", "group": "succulent", "region": "Madagascar; forced as a holiday pot plant in northern greenhouses.", "fact": "A short-day plant: flower buds form only after several weeks of long nights — the same trick used on poinsettias.", "feature": "Glossy succulent leaves and dense cymes of four-petaled flowers in red, orange, yellow, or pink.", "prefers": "Bright sun or a south window; dry soil between waterings. Cool nights or short days set buds; warm, wet nights keep it vegetative.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/8/8d/Kalanchoe_blossfeldiana_3.jpg/1280px-Kalanchoe_blossfeldiana_3.jpg", "wiki": "https://en.wikipedia.org/wiki/Kalanchoe_blossfeldiana", "credit": "Wikimedia Commons · Kalanchoe blossfeldiana 3.jpg"}, {"id": "chrysanthemum", "commonName": "Chrysanthemum", "latin": "Chrysanthemum × morifolium", "family": "Asteraceae", "group": "daisy", "region": "East Asia; China’s floral emblem and the autumn pot mum of florists everywhere.", "fact": "Pot mums are short-day plants. Growers black-cloth the benches to trigger bloom on a calendar, not the season.", "feature": "Composite heads — discs of tiny florets ringed (or fully packed) with ray florets in every florist color but true blue.", "prefers": "Full sun or a bright window; even moisture. Cool nights around 50–60°F keep flowers from fading; heat plus drought browns the petals.", "image": "https://upload.wikimedia.org/wikipedia/commons/8/84/Chrysanthemum.JPG", "wiki": "https://en.wikipedia.org/wiki/Chrysanthemum_%C3%97_morifolium", "credit": "Wikimedia Commons · Chrysanthemum.JPG"}, {"id": "potted-rose", "commonName": "Miniature rose", "latin": "Rosa", "family": "Rosaceae", "group": "shrub", "region": "Garden roses originated in China and Europe; mini patio types are forced year-round as gift plants.", "fact": "A potted mini rose is a real woody rose, not a temporary florist trick — it can live for years if given a real outdoor season.", "feature": "Scaled-down hybrid-tea or cluster blooms on thorny canes, usually 6–18 inches in a pot.", "prefers": "Full sun or the brightest window; even moisture, never bone-dry. Cool outdoor nights or a winter rest; hot, dark rooms drop buds.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/5/5e/Rosa_Peace_1945.jpg/1280px-Rosa_Peace_1945.jpg", "wiki": "https://en.wikipedia.org/wiki/Garden_roses", "credit": "Wikimedia Commons · Rosa Peace 1945.jpg"}, {"id": "begonia", "commonName": "Begonia", "latin": "Begonia", "family": "Begoniaceae", "group": "bedding", "region": "Tropics worldwide; wax, Rieger, and tuberous types fill shade benches and indoor pots.", "fact": "Begonias have lopsided leaves — one side of the blade is larger than the other — a trait almost unique among bedding plants.", "feature": "Waxy or succulent foliage and clusters of male and female flowers on the same plant; Rieger types carry rose-like doubles.", "prefers": "Bright shade or morning sun; evenly moist mix. Cool, dry air or harsh noon sun scorches leaves; soggy peat rots the crowns.", "image": "https://upload.wikimedia.org/wikipedia/commons/f/fb/Begonia_obliqua00.jpg", "wiki": "https://en.wikipedia.org/wiki/Begonia", "credit": "Wikimedia Commons · Begonia obliqua00.jpg"}, {"id": "impatiens", "commonName": "Impatiens", "latin": "Impatiens walleriana", "family": "Balsaminaceae", "group": "bedding", "region": "Eastern Africa; the classic shade annual, with New Guinea and SunPatiens types for brighter spots.", "fact": "Ripe seed pods explode at a touch — the name means ‘impatient.’ Downy mildew nearly erased the old walleriana from benches in the 2010s.", "feature": "Flat, spurred flowers sitting on juicy, translucent stems; New Guinea types have larger blooms and bronze or variegated leaves.", "prefers": "Shade or morning sun (SunPatiens take full sun); even moisture. Drought wilts them in an hour; cold wet soil is fatal.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/2/28/Impatienswalleriana.jpg/1280px-Impatienswalleriana.jpg", "wiki": "https://en.wikipedia.org/wiki/Impatiens_walleriana", "credit": "Wikimedia Commons · Impatienswalleriana.jpg"}, {"id": "poinsettia", "commonName": "Poinsettia", "latin": "Euphorbia pulcherrima", "family": "Euphorbiaceae", "group": "holiday", "region": "Pacific-slope Mexico; a winter greenhouse crop from the U.S. to Europe.", "fact": "The red ‘petals’ are bracts. True flowers are the tiny yellow cyathia in the center. Aztec gardens grew it long before it was a Christmas plant.", "feature": "Milky latex sap and a ring of colored bracts around a cluster of cyathia; modern types hold color for months.", "prefers": "Bright indoor light; even moisture, never soggy. Needs long nights to color; warm drafts or a dark corner drop bracts.", "image": "https://upload.wikimedia.org/wikipedia/commons/e/e1/Weihnachtsstern_-_gro%C3%9F.jpg", "wiki": "https://en.wikipedia.org/wiki/Poinsettia", "credit": "Wikimedia Commons · Weihnachtsstern - groß.jpg"}, {"id": "pansy", "commonName": "Pansy", "latin": "Viola × wittrockiana", "family": "Violaceae", "group": "bedding", "region": "Hybridized in 19th-century Britain from European violas; a cool-season pot and bedding staple.", "fact": "The French pensée means ‘thought.’ The face-like blotch is a nectar guide painted for bees, not for gardeners.", "feature": "Five overlapping petals, the lower one spurred, often with a dark mask; smaller violas lack the full ‘face.’", "prefers": "Full sun or light shade in cool weather; even moisture. Thrives in 40–60°F; heat above 75°F stretches and stops bloom.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b8/PansyScan_%28cropped%29.jpg/1280px-PansyScan_%28cropped%29.jpg", "wiki": "https://en.wikipedia.org/wiki/Pansy", "credit": "Wikimedia Commons · PansyScan (cropped).jpg"}, {"id": "marigold", "commonName": "Marigold", "latin": "Tagetes", "family": "Asteraceae", "group": "daisy", "region": "Mexico and Central America; French (T. patula) and African (T. erecta) types fill summer pots.", "fact": "The scent is a defense: thiophenes in the roots suppress soil nematodes, which is why they are companion-planted with vegetables.", "feature": "Pinnate, gland-dotted foliage and pompon or single daisy heads in yellow, gold, and mahogany.", "prefers": "Full sun; moderate water, slightly dry between drinks. Rich, wet soil makes foliage at the expense of flowers.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e7/French_marigold_Tagetes_patula.jpg/1280px-French_marigold_Tagetes_patula.jpg", "wiki": "https://en.wikipedia.org/wiki/Tagetes_patula", "credit": "Wikimedia Commons · French marigold Tagetes patula.jpg"}, {"id": "cyclamen", "commonName": "Cyclamen", "latin": "Cyclamen persicum", "family": "Primulaceae", "group": "indoor", "region": "Eastern Mediterranean; florist cyclamen is a winter greenhouse pot, not the hardy garden species.", "fact": "Petals sweep backward like a shuttlecock. The plant stores food in a flattened tuber that sits half out of the mix.", "feature": "Marbled heart-shaped leaves and nodding flowers with reflexed petals in white, pink, magenta, or scarlet.", "prefers": "Cool bright rooms (50–65°F) or an east window; water the rim, not the tuber crown. Heat or wet crowns collapse it.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/6/68/Yagur_%E2%80%93_Nesher%2C_the_Green_Path_%E2%80%93_Mount_Carmel_016.JPG/1280px-Yagur_%E2%80%93_Nesher%2C_the_Green_Path_%E2%80%93_Mount_Carmel_016.JPG", "wiki": "https://en.wikipedia.org/wiki/Cyclamen_persicum", "credit": "Wikimedia Commons · Yagur – Nesher, the Green Path – Mount Carmel 016.JPG"}, {"id": "hydrangea", "commonName": "Hydrangea", "latin": "Hydrangea macrophylla", "family": "Hydrangeaceae", "group": "shrub", "region": "Japan; florist hydrangeas are forced in pots for Mother’s Day and Easter.", "fact": " mophead color is a soil-chemistry trick: aluminum plus acid mix makes blue; alkaline mix without aluminum makes pink.", "feature": "Huge corymbs of sterile showy sepals; florist types are mopheads, not the lace-cap wild form.", "prefers": "Bright indirect light or morning sun; constantly moist mix. Wilts fast in heat; dry peat scorches the heads.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/2/21/%28Natural%29_Hydrangea_macrophylla%2C_Iwafune%2C_Isumi%2C_Chiba%2C_Japan_2.jpg/1280px-%28Natural%29_Hydrangea_macrophylla%2C_Iwafune%2C_Isumi%2C_Chiba%2C_Japan_2.jpg", "wiki": "https://en.wikipedia.org/wiki/Hydrangea_macrophylla", "credit": "Wikimedia Commons · (Natural) Hydrangea macrophylla, Iwafune, Isumi, Chiba, Japan 2.jpg"}, {"id": "anthurium", "commonName": "Anthurium", "latin": "Anthurium andraeanum", "family": "Araceae", "group": "tropical", "region": "Colombia and Ecuador rainforests; a year-round tropical pot and cut-flower crop.", "fact": "The ‘flower’ is a waxy spathe. The real flowers are the tiny dots packed on the spadix — and they can last two months.", "feature": "Glossy heart-shaped spathe (red, pink, white, or green) with a contrasting yellow or white spadix.", "prefers": "Bright indirect light or filtered sun; evenly moist, airy mix and high humidity. Direct sun burns; cold below 60°F stalls it.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/8/8b/AnthuriumAndraenum.jpg/1280px-AnthuriumAndraenum.jpg", "wiki": "https://en.wikipedia.org/wiki/Anthurium_andraeanum", "credit": "Wikimedia Commons · AnthuriumAndraenum.jpg"}, {"id": "peace-lily", "commonName": "Peace lily", "latin": "Spathiphyllum", "family": "Araceae", "group": "tropical", "region": "Tropical Americas; among the most sold indoor flowering plants.", "fact": "It is a dramatic wilter — leaves flop as a water alarm, then recover. NASA-list fame is overstated; a roomful would be needed to clean air.", "feature": "Glossy lance leaves and a white spathe cupping a pale spadix; not a true lily.", "prefers": "Medium to bright indirect light, or it will still live in shade with fewer spathes; even moisture. Soggy mix or ice-cold water browns tips.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/4/49/Peace_lily_-_1_-_cropped.jpg/1280px-Peace_lily_-_1_-_cropped.jpg", "wiki": "https://en.wikipedia.org/wiki/Spathiphyllum_wallisii", "credit": "Wikimedia Commons · Peace lily - 1 - cropped.jpg"}, {"id": "hyacinth", "commonName": "Hyacinth", "latin": "Hyacinthus orientalis", "family": "Asparagaceae", "group": "bulb", "region": "Eastern Mediterranean; forced in pots and glasses for late-winter scent.", "fact": "One of the strongest florist scents — a single spike can perfume a room. The bulbs are poisonous, a leftover defense.", "feature": "A dense raceme of waxy, star-tubular florets on a thick scape rising from strap leaves.", "prefers": "Cool bright light while in bloom; modest water. Needs a long cold period to spike; warm rooms shorten the display.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/8/82/Hyacinth_flower.jpg/1280px-Hyacinth_flower.jpg", "wiki": "https://en.wikipedia.org/wiki/Hyacinthus_orientalis", "credit": "Wikimedia Commons · Hyacinth flower.jpg"}, {"id": "tulip", "commonName": "Tulip", "latin": "Tulipa", "family": "Liliaceae", "group": "bulb", "region": "Central Asia to Turkey; potted ‘French’ and triumph types are ice-cooled then forced.", "fact": "Tulip mania was about bulbs as futures, not bouquets. A potted tulip is a one-shot display — the bulb is spent by forcing.", "feature": "A single cup (or double, lily-flowered, or parrot) on a smooth scape; leaves are broad, glaucous, and few.", "prefers": "Cool bright rooms or outdoor chill; even moisture. Heat opens and drops petals in days; darkness stretches the stem.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/9/9e/%D7%A6%D7%91%D7%A2%D7%95%D7%A0%D7%99%D7%9D.JPG/1280px-%D7%A6%D7%91%D7%A2%D7%95%D7%A0%D7%99%D7%9D.JPG", "wiki": "https://en.wikipedia.org/wiki/Tulipa_gesneriana", "credit": "Wikimedia Commons · צבעונים.JPG"}, {"id": "daffodil", "commonName": "Daffodil", "latin": "Narcissus", "family": "Amaryllidaceae", "group": "bulb", "region": "Western Europe and the Mediterranean; paperwhites and Tête-à-Tête fill winter pots.", "fact": "All narcissus contain lycorine — squirrels leave them alone. Paperwhites skip the chill and bloom on a sunny windowsill.", "feature": "A central corona (trumpet or cup) ringed by six tepals; bulbs in a cluster for potted displays.", "prefers": "Cool bright light; even moisture. Paperwhites take a warm sill; garden daffodils need a cold period or they stay leafy.", "image": "https://upload.wikimedia.org/wikipedia/commons/a/a4/Narcissus_pseudonarcissus_flower_300303.jpg", "wiki": "https://en.wikipedia.org/wiki/Narcissus_pseudonarcissus", "credit": "Wikimedia Commons · Narcissus pseudonarcissus flower 300303.jpg"}, {"id": "calibrachoa", "commonName": "Calibrachoa", "latin": "Calibrachoa", "family": "Solanaceae", "group": "bedding", "region": "Southern South America; sold as Million Bells, a trailer for baskets.", "fact": "Looks like a mini petunia but has a different chromosome count — the two will not hybridize, despite the resemblance.", "feature": "Small petunia-like tubes covering a trailing mound; self-cleaning in most modern series.", "prefers": "Full sun; slightly dry between waterings in an acidic mix. Iron chlorosis in alkaline peat; shade cuts bloom to nothing.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/f/fb/Calibrachoa_flower_red.jpg/1280px-Calibrachoa_flower_red.jpg", "wiki": "https://en.wikipedia.org/wiki/Calibrachoa", "credit": "Wikimedia Commons · Calibrachoa flower red.jpg"}, {"id": "primrose", "commonName": "Primrose", "latin": "Primula", "family": "Primulaceae", "group": "indoor", "region": "Northern Hemisphere woodlands; florist primulas are winter pot plants from Europe and China.", "fact": "Some florist primulas (P. obconica) can raise a rash — primin in the hairs. Polyanthus types are the familiar clustered ‘primrose.’", "feature": "A rosette of crinkled leaves and a nest of five-petaled flowers with a contrasting eye.", "prefers": "Cool bright rooms or outdoor chill; even moisture. Heat above 70°F collapses it; dry peat wilts the rosette overnight.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/a/ad/Prole%C4%87no_cve%C4%87e_3.JPG/1280px-Prole%C4%87no_cve%C4%87e_3.JPG", "wiki": "https://en.wikipedia.org/wiki/Primula_vulgaris", "credit": "Wikimedia Commons · Prolećno cveće 3.JPG"}, {"id": "african-violet", "commonName": "African violet", "latin": "Streptocarpus ionanthus", "family": "Gesneriaceae", "group": "indoor", "region": "Tanzania and Kenya; the classic windowsill flowering houseplant, formerly Saintpaulia.", "fact": "It can bloom almost year-round under fluorescent light. Water on the fuzzy leaves spots them — a famous houseplant gotcha.", "feature": "A flat rosette of hairy, succulent leaves and five-lobed flowers in violet, pink, white, or bicolor.", "prefers": "Bright indirect light or a north/east window; even moisture from the saucer. Cold water or a soggy crown starts rot.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a0/Saintpaulia_ionantha.jpg/1280px-Saintpaulia_ionantha.jpg", "wiki": "https://en.wikipedia.org/wiki/Streptocarpus_sect._Saintpaulia", "credit": "Wikimedia Commons · Saintpaulia ionantha.jpg"}, {"id": "gerbera", "commonName": "Gerbera daisy", "latin": "Gerbera jamesonii", "family": "Asteraceae", "group": "daisy", "region": "South Africa (Transvaal daisy); a leading cut flower and a compact pot crop.", "fact": "The ‘stem’ is a scape — leafless. Heads come in nearly every color, which is why florists treat gerbera as a paintbox daisy.", "feature": "A large, flat composite head with a dark or green disc and long ray florets; leaves are lobed and hairy.", "prefers": "Full sun or a very bright window; water when the top inch dries. Crowns rot if planted deep or kept wet in cool rooms.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/0/0b/Gerbera_jamesonii_%28Asteraceae%29.jpg/1280px-Gerbera_jamesonii_%28Asteraceae%29.jpg", "wiki": "https://en.wikipedia.org/wiki/Gerbera_jamesonii", "credit": "Wikimedia Commons · Gerbera jamesonii (Asteraceae).jpg"}, {"id": "lavender", "commonName": "Lavender", "latin": "Lavandula", "family": "Lamiaceae", "group": "aromatic", "region": "Mediterranean basin; English (L. angustifolia) and Spanish types sold as scented patio pots.", "fact": "The perfume sits in glandular hairs on calyx and leaf, not in the tiny corollas. Bees work it even in hot, dry wind.", "feature": "Spikes of small two-lipped flowers above silvery, needle-like foliage on woody stems.", "prefers": "Full sun and sharp drainage, or a gritty pot mix. Wet, rich soil or shade turns it woody and silent.", "image": "https://upload.wikimedia.org/wikipedia/commons/4/40/Lavandula_angustifolia_-_K%C3%B6hler%E2%80%93s_Medizinal-Pflanzen-087.jpg", "wiki": "https://en.wikipedia.org/wiki/Lavandula_angustifolia", "credit": "Wikimedia Commons · Lavandula angustifolia - Köhler–s Medizinal-Pflanzen-087.jpg"}, {"id": "dianthus", "commonName": "Dianthus", "latin": "Dianthus", "family": "Caryophyllaceae", "group": "bedding", "region": "Europe and Asia; pot carnations, pinks, and Sweet William share the clove-scented family.", "fact": "‘Pink’ the color is named after the flower, not the other way around — from the jagged, ‘pinked’ petal edge.", "feature": "Fringed or pinked petals, often with a darker eye, on blue-green grass-like foliage.", "prefers": "Full sun; dryish, alkaline, well-drained mix. Heat plus wet peat invites stem rot; shade makes floppy stems.", "image": "https://upload.wikimedia.org/wikipedia/commons/3/3b/W_carnation4051.jpg", "wiki": "https://en.wikipedia.org/wiki/Dianthus_caryophyllus", "credit": "Wikimedia Commons · W carnation4051.jpg"}, {"id": "azalea", "commonName": "Azalea", "latin": "Rhododendron simsii", "family": "Ericaceae", "group": "shrub", "region": "China; florist azaleas are forced in cool greenhouses as gift plants.", "fact": "An acid-soil specialist. Tap water with lime yellows the leaves in weeks. Many florist azaleas are not winter-hardy outdoors.", "feature": "Clusters of funnel flowers covering a small evergreen shrub; stamens often protrude from a five-lobed corolla.", "prefers": "Cool bright light; constantly moist, acidic peat. Heat, hard water, or a dry root ball drops buds and leaves.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/6/67/Rhododendron_simsii-bunga_2-Lany_pirna.jpg/1280px-Rhododendron_simsii-bunga_2-Lany_pirna.jpg", "wiki": "https://en.wikipedia.org/wiki/Rhododendron_simsii", "credit": "Wikimedia Commons · Rhododendron simsii-bunga 2-Lany pirna.jpg"}, {"id": "african-daisy", "commonName": "African daisy", "latin": "Osteospermum", "family": "Asteraceae", "group": "daisy", "region": "South Africa; a cool-season patio pot that closes its rays at night.", "fact": "Many types have spoon-tipped ray florets. The flowers shut in low light — a solar tracker, not a wilt.", "feature": "Daisy heads with a dark or metallic disc and rays in purple, white, peach, or bicolor; slightly succulent foliage.", "prefers": "Full sun; moderate water with a dry-down. Heat above the 80s pauses bloom; wet, rich mix makes leaves, not flowers.", "image": "https://upload.wikimedia.org/wikipedia/commons/f/fc/Dimorphoteca_ecklonis%2C_Botanical_garden_of_Barcelona.jpg", "wiki": "https://en.wikipedia.org/wiki/Dimorphotheca_ecklonis", "credit": "Wikimedia Commons · Dimorphoteca ecklonis, Botanical garden of Barcelona.jpg"}, {"id": "hibiscus", "commonName": "Hibiscus", "latin": "Hibiscus rosa-sinensis", "family": "Malvaceae", "group": "tropical", "region": "Tropical Asia; the potted tropical hibiscus of conservatories and patios.", "fact": "Individual blooms last a day, but a plant in growth opens new ones daily. The column of fused stamens is a mallow signature.", "feature": "Large five-petaled disks with a prominent staminal column; glossy evergreen foliage on a woody shrub.", "prefers": "Full sun or a south window; even moisture in heat. Cool nights below 50°F or dry roots drop buds overnight.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/2/21/Hibiscus_Brilliant.jpg/1280px-Hibiscus_Brilliant.jpg", "wiki": "https://en.wikipedia.org/wiki/Hibiscus_%C3%97_rosa-sinensis", "credit": "Wikimedia Commons · Hibiscus Brilliant.jpg"}, {"id": "fuchsia", "commonName": "Fuchsia", "latin": "Fuchsia", "family": "Onagraceae", "group": "hanging", "region": "Central and South America and New Zealand; a hanging-basket and shade-pot classic.", "fact": "The hanging ‘ballerina’ flower is four reflexed sepals over a corolla skirt. Hummingbirds, not bees, are the wild pollinators.", "feature": "Pendent bicolor blooms (often red sepals, purple skirt) on opposite leaves; many are natural trailers.", "prefers": "Morning sun or bright shade; even moisture and cool nights. Heat above 80°F plus dry wind strips buds.", "image": "https://upload.wikimedia.org/wikipedia/commons/8/83/Fuchsia_magellanica.jpg", "wiki": "https://en.wikipedia.org/wiki/Fuchsia_magellanica", "credit": "Wikimedia Commons · Fuchsia magellanica.jpg"}, {"id": "mandevilla", "commonName": "Mandevilla", "latin": "Mandevilla", "family": "Apocynaceae", "group": "tropical", "region": "Central and South America; sold as Dipladenia when compact, as Mandevilla when vining.", "fact": "Milky sap and a funnel flower like a tropical petunia. Compact ‘Dipladenia’ types are just dwarfed mandevillas.", "feature": "Five-lobed pinwheel trumpets in pink, red, or white on glossy opposite leaves; twinning stems on a trellis.", "prefers": "Full sun or a bright patio; even moisture. Cold below 50°F yellows leaves; shade makes vine and no flowers.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/8/8c/Flower-center142058.jpg/1280px-Flower-center142058.jpg", "wiki": "https://en.wikipedia.org/wiki/Mandevilla_sanderi", "credit": "Wikimedia Commons · Flower-center142058.jpg"}, {"id": "vinca", "commonName": "Madagascar periwinkle", "latin": "Catharanthus roseus", "family": "Apocynaceae", "group": "bedding", "region": "Madagascar; a heat-proof bedding and pot plant, source of vincristine and vinblastine.", "fact": "The alkaloids that treat childhood leukemia were first isolated from this garden annual — one of pharmacology’s famous plants.", "feature": "Five-petaled, pinwheel flowers with a contrasting eye on glossy, opposite leaves; milky sap.", "prefers": "Full sun and heat; dry between waterings. Cool wet soil is its enemy; it blooms through drought that stops petunias.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a6/Vinca_%28Catharanthus_roseus%29_cultivada_em_Bag%C3%A9%2C_RS%2C_Brasil_-_55231652268.jpg/1280px-Vinca_%28Catharanthus_roseus%29_cultivada_em_Bag%C3%A9%2C_RS%2C_Brasil_-_55231652268.jpg", "wiki": "https://en.wikipedia.org/wiki/Catharanthus_roseus", "credit": "Wikimedia Commons · Vinca (Catharanthus roseus) cultivada em Bagé, RS, Brasil - 55231652268.jpg"}, {"id": "verbena", "commonName": "Verbena", "latin": "Verbena", "family": "Verbenaceae", "group": "bedding", "region": "Americas; hybrid trailing verbenas dominate mixed patio pots.", "fact": "A butterfly magnet with a long nectar tube. Many garden ‘verbenas’ are now classed in Glandularia, split from Verbena.", "feature": "Flat clusters of five-lobed florets on square stems; often trailing, with toothed leaves.", "prefers": "Full sun; dryish, airy mix. Shade plus wet peat brings powdery mildew; heat is welcome if roots drain.", "image": "https://upload.wikimedia.org/wikipedia/commons/3/38/Eisenkraut%2C_Passau.JPG", "wiki": "https://en.wikipedia.org/wiki/Verbena", "credit": "Wikimedia Commons · Eisenkraut, Passau.JPG"}, {"id": "lobelia", "commonName": "Lobelia", "latin": "Lobelia erinus", "family": "Campanulaceae", "group": "bedding", "region": "Southern Africa; the true-blue trailer of spring baskets.", "fact": "True blue is rare in bedding plants. Lobelia’s two-lipped flower has a white eye that bees use as a landing mark.", "feature": "Tiny fan-like flowers packed on trailing stems; foliage is small, fine, and often bronzed.", "prefers": "Sun or light shade in cool weather; even moisture. Heat above the mid-70s shuts it down until nights cool.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/8/8a/Lobelia_close-up_%28aka%29.jpg/1280px-Lobelia_close-up_%28aka%29.jpg", "wiki": "https://en.wikipedia.org/wiki/Lobelia_erinus", "credit": "Wikimedia Commons · Lobelia close-up (aka).jpg"}, {"id": "bacopa", "commonName": "Bacopa", "latin": "Chaenostoma cordatum", "family": "Scrophulariaceae", "group": "bedding", "region": "South Africa; sold as Sutera or Bacopa, a white-or-pink trailer for mixed bowls.", "fact": "Not the medicinal Bacopa monnieri. This one is a scroph, grown because it foams with five-petaled stars all summer if never dried out.", "feature": "A cascade of small white, pink, or lavender stars on opposite, slightly sticky leaves.", "prefers": "Sun or light shade; never dry — one hard wilt and it drops every bud. Heat is fine if the pot stays moist.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/2/21/Suteracordatasnowflk.jpg/1280px-Suteracordatasnowflk.jpg", "wiki": "https://en.wikipedia.org/wiki/Chaenostoma_cordatum", "credit": "Wikimedia Commons · Suteracordatasnowflk.jpg"}, {"id": "salvia", "commonName": "Salvia", "latin": "Salvia splendens", "family": "Lamiaceae", "group": "bedding", "region": "Brazil; scarlet sage is the red bedding salvia. Mealycup sage (S. farinacea) is the blue pot type.", "fact": "The ‘petals’ of scarlet sage are mostly a colored calyx and a long corolla tube built for hummingbirds.", "feature": "Square stems, opposite leaves, and vertical spikes of tubular two-lipped flowers in red, purple, or white.", "prefers": "Full sun; even moisture. Shade makes lanky spikes; drought pauses bloom until the next flush.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/7/70/Mudas_de_alegrias-de-jardim%2C_ou_s%C3%A1lvia_01.jpg/1280px-Mudas_de_alegrias-de-jardim%2C_ou_s%C3%A1lvia_01.jpg", "wiki": "https://en.wikipedia.org/wiki/Salvia_splendens", "credit": "Wikimedia Commons · Mudas de alegrias-de-jardim, ou sálvia 01.jpg"}, {"id": "lantana", "commonName": "Lantana", "latin": "Lantana camara", "family": "Verbenaceae", "group": "tropical", "region": "Tropical Americas; a heat-loving pot shrub, invasive in some warm climates.", "fact": "Florets often change color as they age, signaling pollinators which heads still have nectar. Berries are toxic.", "feature": "Dome-shaped clusters of tiny four-lobed florets, often two-toned, on coarse, aromatic foliage.", "prefers": "Full sun and heat; dry between waterings. Rich, wet soil makes leaves; cold nights stop flowering.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/5/52/LantanaFlowerLeaves.jpg/1280px-LantanaFlowerLeaves.jpg", "wiki": "https://en.wikipedia.org/wiki/Lantana_camara", "credit": "Wikimedia Commons · LantanaFlowerLeaves.jpg"}, {"id": "portulaca", "commonName": "Moss rose", "latin": "Portulaca grandiflora", "family": "Portulacaceae", "group": "succulent", "region": "South America; a drought-proof summer pot and rock-garden trailer.", "fact": "Flowers open only in sun and close by late afternoon — a solar clock. The leaves store water like a tiny succulent.", "feature": "Rose-like satiny blooms on a mat of cylindrical, fleshy leaves; often mixed neon colors in one pot.", "prefers": "Full blazing sun; dry, sandy mix. Shade or wet peat keeps the flowers shut and the stems rotten.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/9/98/PortulacaGrandiflora.jpg/1280px-PortulacaGrandiflora.jpg", "wiki": "https://en.wikipedia.org/wiki/Portulaca_grandiflora", "credit": "Wikimedia Commons · PortulacaGrandiflora.jpg"}, {"id": "zinnia", "commonName": "Zinnia", "latin": "Zinnia elegans", "family": "Asteraceae", "group": "daisy", "region": "Mexico; dwarf pot series and cutting types share the same genus.", "fact": "Among the easiest flowers from seed. Powdery mildew is the usual failure, not cold or drought.", "feature": "Stiff, dahlia-like composite heads on sandpapery opposite leaves; pot types stay under a foot.", "prefers": "Full sun and moving air; moderate water at the soil, not the leaves. Shade plus humidity mildews them.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/6/6e/Zinnienbl%C3%BCte_Zinnia_elegans_stack15_20190722-RM-7222254.jpg/1280px-Zinnienbl%C3%BCte_Zinnia_elegans_stack15_20190722-RM-7222254.jpg", "wiki": "https://en.wikipedia.org/wiki/Zinnia_elegans", "credit": "Wikimedia Commons · Zinnienblüte Zinnia elegans stack15 20190722-RM-7222254.jpg"}, {"id": "snapdragon", "commonName": "Snapdragon", "latin": "Antirrhinum majus", "family": "Plantaginaceae", "group": "bedding", "region": "Mediterranean; dwarf pot snaps and tall cutting types.", "fact": "The ‘snap’ is a bee door — only heavy bumblebees can pry the hinged mouth open. Children have done the same for centuries.", "feature": "Vertical racemes of two-lipped, dragon-mouthed flowers; dwarf pots are dense and branching.", "prefers": "Full sun in cool weather; even moisture. Heat above 80°F pauses bloom; wet, stagnant mix invites rust.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/6/6f/Antirrhinum_majus_BCBG_%2802%29.jpg/1280px-Antirrhinum_majus_BCBG_%2802%29.jpg", "wiki": "https://en.wikipedia.org/wiki/Antirrhinum_majus", "credit": "Wikimedia Commons · Antirrhinum majus BCBG (02).jpg"}, {"id": "dahlia", "commonName": "Dahlia", "latin": "Dahlia", "family": "Asteraceae", "group": "daisy", "region": "Mexico and Central America; dwarf ‘Gallery’ and ‘Dahlinova’ types are sold as patio pots.", "fact": "The Aztec grew them for food tubers as much as flowers. Modern pot dahlias are short-day sensitive and hide a true tuber.", "feature": "Layered composite heads from single to fully double, on opposite leaves with toothed leaflets.", "prefers": "Full sun; even moisture, never soggy. Cool nights help; deep shade or wet cold mix rots the tuber.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/a/ab/Dahlia_x_hybrida.jpg/1280px-Dahlia_x_hybrida.jpg", "wiki": "https://en.wikipedia.org/wiki/Dahlia", "credit": "Wikimedia Commons · Dahlia x hybrida.jpg"}, {"id": "bellflower", "commonName": "Bellflower", "latin": "Campanula", "family": "Campanulaceae", "group": "indoor", "region": "Northern Hemisphere, especially Europe; C. medium and C. carpatica are common pot types.", "fact": "Campanula means ‘little bell.’ Star-of-Bethlehem campanulas (C. isophylla) trail from hanging pots in cool rooms.", "feature": "Five-lobed bells or stars, usually blue-violet or white, on slender stems above a leafy mound.", "prefers": "Bright light and cool rooms; even moisture. Heat shuts bloom; dry peat crisps the thin leaves.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/3/3e/Campanula_medium_0.0_R.jpg/1280px-Campanula_medium_0.0_R.jpg", "wiki": "https://en.wikipedia.org/wiki/Campanula_medium", "credit": "Wikimedia Commons · Campanula medium 0.0 R.jpg"}, {"id": "calla-lily", "commonName": "Calla lily", "latin": "Zantedeschia", "family": "Araceae", "group": "lily", "region": "Southern Africa; colored callas are a major pot and cut crop.", "fact": "Not a lily. The ‘petal’ is a spathe wrapped around a spadix, like a peace lily’s elegant cousin. The sap is a skin irritant.", "feature": "A single sculptural spathe (white, yellow, pink, or near-black) above arrow-shaped, often spotted leaves.", "prefers": "Bright light; even moisture while in growth, then a dry rest. Cold wet rhizomes rot; deep shade hides the spathes.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a2/Zantedeschia_aethiopica_-1.jpg/1280px-Zantedeschia_aethiopica_-1.jpg", "wiki": "https://en.wikipedia.org/wiki/Zantedeschia_aethiopica", "credit": "Wikimedia Commons · Zantedeschia aethiopica -1.jpg"}, {"id": "potted-lily", "commonName": "Potted lily", "latin": "Lilium", "family": "Liliaceae", "group": "lily", "region": "Northern Hemisphere; Asiatic, Oriental, and LA hybrids forced in pots for Easter and summer.", "fact": "Easter lilies (L. longiflorum) are timed with cold storage so the trumpet opens for one Sunday. Pollen stains fabric permanently.", "feature": "Six tepals in a trumpet, bowl, or reflexed turk’s-cap; leaves whorled or scattered on an unbranched stem.", "prefers": "Cool bright light; even moisture. Heat shortens the display; dry pots abort buds. Outdoor after bloom if hardy.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/c/cc/ShoshanTzachor-2-wiki-Zachi-Evenor.jpg/1280px-ShoshanTzachor-2-wiki-Zachi-Evenor.jpg", "wiki": "https://en.wikipedia.org/wiki/Lilium_candidum", "credit": "Wikimedia Commons · ShoshanTzachor-2-wiki-Zachi-Evenor.jpg"}, {"id": "amaryllis", "commonName": "Amaryllis", "latin": "Hippeastrum", "family": "Amaryllidaceae", "group": "bulb", "region": "Tropical Americas; the holiday pot ‘amaryllis’ is Hippeastrum, not the South African Amaryllis belladonna.", "fact": "A large bulb can throw two scapes of four trumpets each, then a fan of leaves. It reblooms if given a dry autumn rest.", "feature": "Huge six-tepaled trumpets on a hollow scape; the true bulb sits with its neck above the soil.", "prefers": "Bright light; water after the spike shows, then regularly. A cold wet rest rots it; no rest means leaves, no flowers.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/0/08/Hippeastrum_reginae.jpg/1280px-Hippeastrum_reginae.jpg", "wiki": "https://en.wikipedia.org/wiki/Hippeastrum", "credit": "Wikimedia Commons · Hippeastrum reginae.jpg"}, {"id": "dendrobium", "commonName": "Dendrobium orchid", "latin": "Dendrobium", "family": "Orchidaceae", "group": "orchid", "region": "Asia to Australia; cane-type dens are a supermarket orchid second only to moth orchids.", "fact": "Many cane dendrobiums need a dry, cool, bright autumn to set canes that flower. Overwatering in winter is the usual death.", "feature": "Spray of moth-like flowers along a jointed cane; leaves are alternate on the cane, not a basal fan.", "prefers": "Bright light, even a little sun; dry between waterings. Warm wet winters keep it leafy; a cool dry spell sets spikes.", "image": "https://upload.wikimedia.org/wikipedia/commons/b/bb/Dendrobium_nobile_-_flower_view_01.jpg", "wiki": "https://en.wikipedia.org/wiki/Dendrobium_nobile", "credit": "Wikimedia Commons · Dendrobium nobile - flower view 01.jpg"}, {"id": "cymbidium", "commonName": "Cymbidium orchid", "latin": "Cymbidium", "family": "Orchidaceae", "group": "orchid", "region": "Asia and Australia; standard and miniature cymbidiums are cool-greenhouse show plants.", "fact": "Flower spikes can carry a dozen waxy blooms for two months. They need a 20°F night drop in autumn or they refuse to spike.", "feature": "Arching sprays of round, heavy-textured flowers above long, strap-like leaves from a pseudobulb.", "prefers": "Bright light and cool nights (50s°F) to set bloom; even moisture. Warm nights year-round mean foliage only.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/b/be/Cymbidium_iridioides-1-bsi-yercaud-salem-India.jpg/1280px-Cymbidium_iridioides-1-bsi-yercaud-salem-India.jpg", "wiki": "https://en.wikipedia.org/wiki/Cymbidium", "credit": "Wikimedia Commons · Cymbidium iridioides-1-bsi-yercaud-salem-India.jpg"}, {"id": "guzmania", "commonName": "Guzmania", "latin": "Guzmania", "family": "Bromeliaceae", "group": "bromeliad", "region": "Tropical Americas; a shade bromeliad sold for its long-lasting colored bracts.", "fact": "The ‘flower’ is a tower of bracts. The plant blooms once, then the mother slowly dies while pups take over — a bromeliad rule.", "feature": "A funnel of smooth green leaves holding a cup of water, topped by a red, orange, or yellow bract spike.", "prefers": "Bright shade or an east window; water in the cup or a barely moist mix. Direct sun burns; no rest period needed.", "image": "https://upload.wikimedia.org/wikipedia/commons/8/84/Bromeliaceae03.jpg", "wiki": "https://en.wikipedia.org/wiki/Guzmania_lingulata", "credit": "Wikimedia Commons · Bromeliaceae03.jpg"}, {"id": "vriesea", "commonName": "Vriesea", "latin": "Vriesea", "family": "Bromeliaceae", "group": "bromeliad", "region": "South American rainforests; flaming sword (V. splendens) is the usual pot type.", "fact": "The flattened, two-ranked bract spike can last months. Like other tank bromeliads, it drinks more from the cup than from soil.", "feature": "A sword of red or yellow bracts; many have cross-banded leaves, unlike the plain-green Guzmania.", "prefers": "Bright indirect light; keep the tank filled with fresh water. Soggy mix or noon sun is the usual failure.", "image": "https://upload.wikimedia.org/wikipedia/commons/b/b6/Bromelia1.jpg", "wiki": "https://en.wikipedia.org/wiki/Vriesea_splendens", "credit": "Wikimedia Commons · Bromelia1.jpg"}, {"id": "aechmea", "commonName": "Silver-vase bromeliad", "latin": "Aechmea fasciata", "family": "Bromeliaceae", "group": "bromeliad", "region": "Brazil; the silver urn plant of florists and mall planters.", "fact": "The pink inflorescence can last six months. Leaves are powdered with gray scales that catch fog and rain in the canopy.", "feature": "A silver-banded urn of stiff leaves and a shaving-brush spike of pink bracts with tiny blue flowers.", "prefers": "Bright indirect light or a little sun; water in the urn. It forgives dry mix more than wet mix; cold below 50°F spots leaves.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/2/23/Aechmea_fasciata2.jpg/1280px-Aechmea_fasciata2.jpg", "wiki": "https://en.wikipedia.org/wiki/Aechmea_fasciata", "credit": "Wikimedia Commons · Aechmea fasciata2.jpg"}, {"id": "gardenia", "commonName": "Gardenia", "latin": "Gardenia jasminoides", "family": "Rubiaceae", "group": "tropical", "region": "China and Japan; a famously fussy florist shrub grown for scent.", "fact": "Buds drop if nights are warm, water is hard, or the pot dries once. The perfume is among the most expensive in perfumery.", "feature": "Waxy, creamy double roses against extremely glossy opposite leaves; scent is strongest at evening.", "prefers": "Bright light, cool nights (60s°F), acidic water and mix. Heat, lime, or a dry spell drops every bud.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/5/54/Gardenia_jasminoides_flower_Argentina.jpg/1280px-Gardenia_jasminoides_flower_Argentina.jpg", "wiki": "https://en.wikipedia.org/wiki/Gardenia_jasminoides", "credit": "Wikimedia Commons · Gardenia jasminoides flower Argentina.jpg"}, {"id": "bougainvillea", "commonName": "Bougainvillea", "latin": "Bougainvillea", "family": "Nyctaginaceae", "group": "tropical", "region": "South America; a thorny patio vine whose color is in the bracts.", "fact": "True flowers are tiny and white, tucked inside three papery bracts. Color holds even as the bracts dry on the plant.", "feature": "Clusters of magenta, orange, white, or red bracts on arching, thorny canes with simple leaves.", "prefers": "Full baking sun; dry between waterings. Shade plus rich wet soil grows thorns and leaves, no bracts.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b9/Bugenwilla.D%C5%82ugo_kwitnaca_roslina.jpg/1280px-Bugenwilla.D%C5%82ugo_kwitnaca_roslina.jpg", "wiki": "https://en.wikipedia.org/wiki/Bougainvillea_glabra", "credit": "Wikimedia Commons · Bugenwilla.Długo kwitnaca roslina.jpg"}, {"id": "jasmine", "commonName": "Jasmine", "latin": "Jasminum", "family": "Oleaceae", "group": "tropical", "region": "Eurasia and Africa; Arabian and poet’s jasmine are sold as scented indoor vines.", "fact": "Night-scented jasmines advertise to moths. Not every plant labeled jasmine is Jasminum — star jasmine is a Trachelospermum.", "feature": "Pinwheel tubes of five to nine lobes in white or yellow, often in clusters, on twining stems.", "prefers": "Bright light or a cool sunny window; even moisture. Warm, dark rooms drop buds; a cool winter rest helps some species bloom.", "image": "https://upload.wikimedia.org/wikipedia/commons/6/6e/Jasminum_officinale_-_Bot._Mag._31%2C_1787.jpg", "wiki": "https://en.wikipedia.org/wiki/Jasminum_officinale", "credit": "Wikimedia Commons · Jasminum officinale - Bot. Mag. 31, 1787.jpg"}, {"id": "camellia", "commonName": "Camellia", "latin": "Camellia", "family": "Theaceae", "group": "shrub", "region": "East Asia; C. japonica and sasanqua are cool-greenhouse and patio shrubs. Tea is C. sinensis.", "fact": "A camellia bloom can shatter in a day if the pot is moved while opening. They set buds in summer and open in cool weather.", "feature": "Rose-form, peony-form, or single waxy flowers on glossy evergreen foliage; buds are fat and scaled.", "prefers": "Bright shade and cool air; even moisture in acidic mix. Heat, hard water, or a dry root ball blasts buds.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e9/Camellia_japonica_NBG.jpg/1280px-Camellia_japonica_NBG.jpg", "wiki": "https://en.wikipedia.org/wiki/Camellia_japonica", "credit": "Wikimedia Commons · Camellia japonica NBG.jpg"}, {"id": "lisianthus", "commonName": "Lisianthus", "latin": "Eustoma grandiflorum", "family": "Gentianaceae", "group": "bedding", "region": "American prairies and Mexico; a florist pot and cut flower that looks like a rose on a gentian.", "fact": "Prairie gentian is slow from seed and hates root disturbance — which is why it costs more than a petunia and lasts in a vase.", "feature": "Satiny, rose-like bells in white, lavender, or pink on blue-green, slightly succulent foliage.", "prefers": "Full sun; even moisture with sharp drainage. Cool nights help; wet, cold mix is fatal to seedlings and pots alike.", "image": "https://upload.wikimedia.org/wikipedia/commons/1/18/Eustoma_grandiflorum_purple_02.jpg", "wiki": "https://en.wikipedia.org/wiki/Eustoma_russellianum", "credit": "Wikimedia Commons · Eustoma grandiflorum purple 02.jpg"}, {"id": "cineraria", "commonName": "Cineraria", "latin": "Pericallis × hybrida", "family": "Asteraceae", "group": "indoor", "region": "Canary Islands parentage; a cool-season florist pot, not a houseplant for the long haul.", "fact": "A burst of daisy color for a few weeks in a cool room, then it is done. Treat it as a living bouquet.", "feature": "A dome of white-eyed daisies in electric blue, magenta, or bicolor above large, felted leaves.", "prefers": "Cool bright rooms (50–60°F); even moisture. Heat wilts it permanently; a dry pot collapses the whole head.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/d/da/Red_Cineraria_Pericallis_2.jpg/1280px-Red_Cineraria_Pericallis_2.jpg", "wiki": "https://en.wikipedia.org/wiki/Pericallis_%C3%97_hybrida", "credit": "Wikimedia Commons · Red Cineraria Pericallis 2.jpg"}, {"id": "gloxinia", "commonName": "Florist's gloxinia", "latin": "Sinningia speciosa", "family": "Gesneriaceae", "group": "indoor", "region": "Brazil; a velvety gesneriad grown from a tuber as a florist pot.", "fact": "Not a true Gloxinia. After bloom the tuber wants a dry rest, then it can be restarted — most gift plants are thrown away instead.", "feature": "Huge, velvety, ruffled bells in purple, red, or white above a rosette of hairy leaves.", "prefers": "Bright indirect light; even moisture from below. Cold water on leaves spots them; wet crowns rot the tuber.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/1/13/Florada_da_Glox%C3%ADnia.jpg/1280px-Florada_da_Glox%C3%ADnia.jpg", "wiki": "https://en.wikipedia.org/wiki/Sinningia_speciosa", "credit": "Wikimedia Commons · Florada da Gloxínia.jpg"}, {"id": "cape-primrose", "commonName": "Cape primrose", "latin": "Streptocarpus", "family": "Gesneriaceae", "group": "indoor", "region": "Southern Africa; a longer-lived, heat-tougher cousin of the African violet.", "fact": "Some species grow one giant leaf for life. Modern hybrids bloom in waves for years on a windowsill.", "feature": "Long, strap-like, puckered leaves and slender scapes of five-lobed, foxglove-like flowers.", "prefers": "Bright shade; even moisture, slightly dry between. Direct sun fries the leaves; soggy mix rots the crown.", "image": "https://upload.wikimedia.org/wikipedia/commons/0/06/Streptocarpus_rexii01.jpg", "wiki": "https://en.wikipedia.org/wiki/Streptocarpus_rexii", "credit": "Wikimedia Commons · Streptocarpus rexii01.jpg"}, {"id": "christmas-cactus", "commonName": "Christmas cactus", "latin": "Schlumbergera", "family": "Cactaceae", "group": "succulent", "region": "Coastal mountains of Brazil; a jungle cactus, not a desert one.", "fact": "It blooms after short days and cool nights. Thanksgiving cactus (S. truncata) has clawed segments; Christmas types are more rounded.", "feature": "Flattened, jointed green stems (no spines) and hanging tubular flowers in magenta, red, white, or peach.", "prefers": "Bright indirect light; even moisture while budding. A dry, cool autumn sets flowers; a dark, warm room skips the show.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/f/f1/Schlumbergera_truncata_%28Exotic_Flora_Plate_20%29.jpg/1280px-Schlumbergera_truncata_%28Exotic_Flora_Plate_20%29.jpg", "wiki": "https://en.wikipedia.org/wiki/Schlumbergera_truncata", "credit": "Wikimedia Commons · Schlumbergera truncata (Exotic Flora Plate 20).jpg"}, {"id": "coneflower", "commonName": "Coneflower", "latin": "Echinacea", "family": "Asteraceae", "group": "daisy", "region": "North American prairies; compact series are now sold as flowering patio pots.", "fact": "The spiny cone is a fortress of disc florets. Goldfinches work the seed heads; Echinacea extracts made it a pharmacy plant.", "feature": "Drooping or flat rays around a bristly orange-brown cone; coarse, hairy leaves.", "prefers": "Full sun; dryish, well-drained mix. Rich wet soil makes weak stems; shade removes the cones.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/8/8e/Echinacea_purpurea_Grandview_Prairie.jpg/1280px-Echinacea_purpurea_Grandview_Prairie.jpg", "wiki": "https://en.wikipedia.org/wiki/Echinacea_purpurea", "credit": "Wikimedia Commons · Echinacea purpurea Grandview Prairie.jpg"}, {"id": "black-eyed-susan", "commonName": "Black-eyed Susan", "latin": "Rudbeckia hirta", "family": "Asteraceae", "group": "daisy", "region": "Eastern and central North America; ‘Toto’ and ‘Becky’ types are common pot rudbeckias.", "fact": "A prairie biennial treated as an annual in pots. The dark cone is a nectar platform for bees and butterflies.", "feature": "Golden rays around a chocolate disc; sandpapery leaves and a stiff, branching habit.", "prefers": "Full sun; moderate water, drought-tolerant once set. Shade stretches it; wet winter pots rot the crown.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1f/Rudbeckia_hirta_kz03.jpg/1280px-Rudbeckia_hirta_kz03.jpg", "wiki": "https://en.wikipedia.org/wiki/Rudbeckia_hirta", "credit": "Wikimedia Commons · Rudbeckia hirta kz03.jpg"}, {"id": "coreopsis", "commonName": "Coreopsis", "latin": "Coreopsis", "family": "Asteraceae", "group": "daisy", "region": "North America; tickseed is a long-blooming pot and border daisy.", "fact": "Named for the tick-like seeds (koris + opsis). Deadheading doubles the bloom; many modern types are sterile and need none.", "feature": "Yellow, gold, or bicolor daisy heads on fine, sometimes thread-like foliage.", "prefers": "Full sun; lean, well-drained mix. Wet, fertile soil flops the stems; shade cuts flowering.", "image": "https://upload.wikimedia.org/wikipedia/commons/5/5d/Alois_Lunzer04.jpg", "wiki": "https://en.wikipedia.org/wiki/Coreopsis_grandiflora", "credit": "Wikimedia Commons · Alois Lunzer04.jpg"}, {"id": "blanket-flower", "commonName": "Blanket flower", "latin": "Gaillardia", "family": "Asteraceae", "group": "daisy", "region": "North and South America; a hot-color daisy of prairies and potted mixed bowls.", "fact": "Named for the French botanist Gaillard. The red-and-yellow banding reads like a trade blanket from a distance.", "feature": "Red, orange, and gold rays, often banded, around a fuzzy disc; gray-green, slightly hairy leaves.", "prefers": "Full sun and heat; dry, lean mix. Rich irrigation shortens its life; shade makes few heads.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/8/89/Gaillardia_in_Aspen_%2891273%29.jpg/1280px-Gaillardia_in_Aspen_%2891273%29.jpg", "wiki": "https://en.wikipedia.org/wiki/Gaillardia_pulchella", "credit": "Wikimedia Commons · Gaillardia in Aspen (91273).jpg"}, {"id": "aster", "commonName": "Aster", "latin": "Symphyotrichum", "family": "Asteraceae", "group": "daisy", "region": "North American meadows; Michaelmas daisies, now mostly moved out of the old Aster genus.", "fact": "New World ‘asters’ were split into Symphyotrichum and others after DNA work. The old name stuck in the trade.", "feature": "Many-rayed heads with yellow discs in purple, pink, or white, usually in autumn flushes.", "prefers": "Full sun; even moisture with good air. Shade plus still air brings mildew; drought crisps the lower leaves.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/8/85/Symphyotrichum_novi-belgii_97930086.jpg/1280px-Symphyotrichum_novi-belgii_97930086.jpg", "wiki": "https://en.wikipedia.org/wiki/Symphyotrichum_novi-belgii", "credit": "Wikimedia Commons · Symphyotrichum novi-belgii 97930086.jpg"}, {"id": "pentas", "commonName": "Pentas", "latin": "Pentas lanceolata", "family": "Rubiaceae", "group": "tropical", "region": "Africa and Yemen; Egyptian starcluster, a heat-proof butterfly pot plant.", "fact": "Each floret is a five-pointed star. Swallowtails work it in the hottest weather, when most bedding plants have quit.", "feature": "Domed clusters of starry tubes in red, pink, white, or lavender on hairy, lance-shaped leaves.", "prefers": "Full sun and heat; even moisture. Cool shade stalls it; it is not a windowsill plant below 60°F.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/9/9a/Penta.JPG/1280px-Penta.JPG", "wiki": "https://en.wikipedia.org/wiki/Pentas_lanceolata", "credit": "Wikimedia Commons · Penta.JPG"}, {"id": "angelonia", "commonName": "Angelonia", "latin": "Angelonia angustifolia", "family": "Plantaginaceae", "group": "bedding", "region": "Mexico and the Caribbean; sold as summer snapdragon for heat that real snaps cannot take.", "fact": "It looks like a snapdragon but keeps blooming at 95°F. Flowers have no hinged ‘mouth’ — the resemblance is only a silhouette.", "feature": "Upright spikes of small two-lipped flowers in purple, pink, or white on narrow, slightly sticky foliage.", "prefers": "Full sun and heat; moderate water. Cool wet springs slow it; it will not replace pansies in the chill.", "image": "https://upload.wikimedia.org/wikipedia/commons/a/af/Summersnapdragon.jpg", "wiki": "https://en.wikipedia.org/wiki/Angelonia_angustifolia", "credit": "Wikimedia Commons · Summersnapdragon.jpg"}, {"id": "fan-flower", "commonName": "Fan flower", "latin": "Scaevola aemula", "family": "Goodeniaceae", "group": "bedding", "region": "Australia; a salt-tolerant trailer for hot baskets.", "fact": "Each flower is a half-circle — five petals on one side, as if a fan were opened. The name Scaevola means ‘left-handed.’", "feature": "A cascade of lilac, blue, or white fan florets on succulent, toothed leaves.", "prefers": "Full sun; dryish mix and heat, including coastal wind. Shade plus wet peat is a slow decline.", "image": "https://upload.wikimedia.org/wikipedia/commons/3/3e/Scaevola_aemula_Botanical_Garden_Heidelberg.JPG", "wiki": "https://en.wikipedia.org/wiki/Scaevola_aemula", "credit": "Wikimedia Commons · Scaevola aemula Botanical Garden Heidelberg.JPG"}, {"id": "nemesia", "commonName": "Nemesia", "latin": "Nemesia", "family": "Scrophulariaceae", "group": "bedding", "region": "South Africa; a cool-season pot plant with a faint vanilla scent in some series.", "fact": "A snapdragon relative with a pouch at the base of the lower lip. Heat above the mid-70s is the usual summer shutdown.", "feature": "Small two-lipped, often bicolor flowers in dense sprays on a compact mound.", "prefers": "Full sun in cool weather; even moisture. Heat stops bloom; a hard dry-down is poorly tolerated.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/6/6e/%E9%BE%8D%E9%9D%A2%E8%8A%B1%28%E5%9B%8A%E8%B7%9D%E8%8A%B1%29_Nemesia_strumosa_KLM_-%E4%B8%8A%E6%B5%B7%E5%85%B1%E9%9D%92%E6%A3%AE%E6%9E%97%E5%85%AC%E5%9C%92_Shanghai%2C_China-_%289255261062%29.jpg/1280px-%E9%BE%8D%E9%9D%A2%E8%8A%B1%28%E5%9B%8A%E8%B7%9D%E8%8A%B1%29_Nemesia_strumosa_KLM_-%E4%B8%8A%E6%B5%B7%E5%85%B1%E9%9D%92%E6%A3%AE%E6%9E%97%E5%85%AC%E5%9C%92_Shanghai%2C_China-_%289255261062%29.jpg", "wiki": "https://en.wikipedia.org/wiki/Nemesia_strumosa", "credit": "Wikimedia Commons · 龍面花(囊距花) Nemesia strumosa KLM -上海共青森林公園 Shanghai, China- (9255261062).jpg"}, {"id": "bidens", "commonName": "Bidens", "latin": "Bidens ferulifolia", "family": "Asteraceae", "group": "daisy", "region": "Mexico and Arizona; a gold trailer used as a ‘spiller’ in mixed pots.", "fact": "Wild bidens (beggarticks) hitchhike with barbed seeds. The ornamental type is a self-cleaning gold daisy that barely stops.", "feature": "Small, bright-yellow daisy heads on ferny, finely cut foliage; a loose, trailing habit.", "prefers": "Full sun; moderate water, drought-tolerant. Shade makes it leafy; it handles heat better than nemesia or lobelia.", "image": "https://upload.wikimedia.org/wikipedia/commons/8/82/Bidens_ferulifolia-flowers.jpg", "wiki": "https://en.wikipedia.org/wiki/Bidens_ferulifolia", "credit": "Wikimedia Commons · Bidens ferulifolia-flowers.jpg"}, {"id": "diascia", "commonName": "Diascia", "latin": "Diascia", "family": "Scrophulariaceae", "group": "bedding", "region": "South Africa; twinspur, a cool-season trailer with two small spurs on each flower.", "fact": "Oil-collecting bees work the twin spurs in the wild. In pots it is a salmon, pink, or coral foam for spring.", "feature": "Racemes of five-lobed, spurred flowers on slender stems; a low, spreading mound.", "prefers": "Sun in cool weather; even moisture. Heat plus humidity melts it; it can rebloom if cut back when nights cool.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/1/14/Diascia_barberae_%C3%96BG_2012-07-08_%2804%29.jpg/1280px-Diascia_barberae_%C3%96BG_2012-07-08_%2804%29.jpg", "wiki": "https://en.wikipedia.org/wiki/Diascia_barberae", "credit": "Wikimedia Commons · Diascia barberae ÖBG 2012-07-08 (04).jpg"}, {"id": "wishbone", "commonName": "Wishbone flower", "latin": "Torenia fournieri", "family": "Linderniaceae", "group": "bedding", "region": "Asia; a shade annual whose stamens arch into a wishbone.", "fact": "The two stamens join at the tip in a wishbone shape — visible if you peek into the tube. A true shade bloomer.", "feature": "Tubular, two-lipped flowers, often with a yellow throat, on a compact, slightly sticky plant.", "prefers": "Bright shade or morning sun; even moisture. Full afternoon sun cooks it; drought stops bloom at once.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/4/45/Torenia_fournieri_in_Kudayathoor.jpg/1280px-Torenia_fournieri_in_Kudayathoor.jpg", "wiki": "https://en.wikipedia.org/wiki/Torenia_fournieri", "credit": "Wikimedia Commons · Torenia fournieri in Kudayathoor.jpg"}, {"id": "sweet-alyssum", "commonName": "Sweet alyssum", "latin": "Lobularia maritima", "family": "Brassicaceae", "group": "bedding", "region": "Mediterranean coasts; a honey-scented edging and pot spiller.", "fact": "A mustard-family plant, not a true Alyssum. The honey scent is strongest in cool weather and on white forms.", "feature": "Tiny four-petaled flowers in dense mats of white, purple, or apricot; fine foliage.", "prefers": "Sun or light shade in cool weather; even moisture. Heat opens gaps in the mat; a shear brings it back in fall.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a0/Smagliczka_nadmorska_1.jpg/1280px-Smagliczka_nadmorska_1.jpg", "wiki": "https://en.wikipedia.org/wiki/Lobularia_maritima", "credit": "Wikimedia Commons · Smagliczka nadmorska 1.jpg"}, {"id": "celosia", "commonName": "Celosia", "latin": "Celosia argentea", "family": "Amaranthaceae", "group": "bedding", "region": "Tropical Africa and Asia; cockscomb (cristata) and wheat (spicata) types are both pot crops.", "fact": "Cockscomb’s brain-like crest is a fasciated flower spike — a genetic pile-up of stems sold as a feature.", "feature": "Either a velvety, folded crest or a feathery plume in magenta, gold, or red; many have colorful foliage too.", "prefers": "Full sun and heat; moderate water. Cool wet weather stalls it; it is a summer, not a windowsill, plant.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/4/4d/Celosia_argentea_flowering_q1.jpg/1280px-Celosia_argentea_flowering_q1.jpg", "wiki": "https://en.wikipedia.org/wiki/Celosia_argentea", "credit": "Wikimedia Commons · Celosia argentea flowering q1.jpg"}, {"id": "gazania", "commonName": "Gazania", "latin": "Gazania", "family": "Asteraceae", "group": "daisy", "region": "South Africa; treasure flower, a sun-tracking daisy for hot, dry pots.", "fact": "Heads open only in sun and close by late afternoon and in cloud — a reliable weather vane on the patio.", "feature": "Large, often zoned daisy heads in orange, yellow, or pink above a rosette of felted, sometimes silver leaves.", "prefers": "Full sun; dry, lean mix. Shade keeps the flowers shut; wet cold mix rots the rosette.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/8/8b/Gazania_rigens-2.jpg/1280px-Gazania_rigens-2.jpg", "wiki": "https://en.wikipedia.org/wiki/Gazania_rigens", "credit": "Wikimedia Commons · Gazania rigens-2.jpg"}, {"id": "ageratum", "commonName": "Ageratum", "latin": "Ageratum houstonianum", "family": "Asteraceae", "group": "bedding", "region": "Mexico and Central America; floss flower, one of the few true-blue bedding pots.", "fact": "The ‘petals’ are actually thread-like disc florets — there are no rays. That is why the heads look like powder puffs.", "feature": "Fuzzy blue, lavender, or white puffs on a compact, hairy plant; leaves are heart-shaped and toothed.", "prefers": "Sun or light shade; even moisture. Heat is tolerated; drought browns the puffs. Not frost-hardy.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/1/15/Ageratum_houstonianum_%28alverson%29.jpg/1280px-Ageratum_houstonianum_%28alverson%29.jpg", "wiki": "https://en.wikipedia.org/wiki/Ageratum_houstonianum", "credit": "Wikimedia Commons · Ageratum houstonianum (alverson).jpg"}, {"id": "dwarf-sunflower", "commonName": "Dwarf sunflower", "latin": "Helianthus annuus", "family": "Asteraceae", "group": "daisy", "region": "North America; pot types such as ‘Sunspot’ and ‘Teddy Bear’ stay 1–2 feet.", "fact": "The head is a Fibonacci packing of hundreds of florets. Dwarf pots are still true sunflowers — they just skip the 10-foot stalk.", "feature": "A large yellow head with a brown or green disc on a short, stout stem; coarse, sandpapery leaves.", "prefers": "Full sun; even moisture in a deep pot. Shade leans the stem; a small pot starves the head.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/4/40/Sunflower_sky_backdrop.jpg/1280px-Sunflower_sky_backdrop.jpg", "wiki": "https://en.wikipedia.org/wiki/Common_sunflower", "credit": "Wikimedia Commons · Sunflower sky backdrop.jpg"}, {"id": "cosmos", "commonName": "Cosmos", "latin": "Cosmos bipinnatus", "family": "Asteraceae", "group": "daisy", "region": "Mexico; a cut-flower annual also sold in dwarf pot series.", "fact": "The name means ‘orderly beauty.’ Foliage is so finely cut it reads as green mist, which is why it mixes well in bowls.", "feature": "Open, satiny daisy heads in pink, white, or crimson on thread-like foliage; yellow-orange C. sulphureus is a sister species.", "prefers": "Full sun; lean mix, not too wet. Fertile soil makes a jungle of leaves and few flowers.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/9/9c/Cosmos_bipinnatus_pink%2C_Burdwan%2C_West_Bengal%2C_India_10_01_2013.jpg/1280px-Cosmos_bipinnatus_pink%2C_Burdwan%2C_West_Bengal%2C_India_10_01_2013.jpg", "wiki": "https://en.wikipedia.org/wiki/Cosmos_bipinnatus", "credit": "Wikimedia Commons · Cosmos bipinnatus pink, Burdwan, West Bengal, India 10 01 2013.jpg"}, {"id": "stock", "commonName": "Stock", "latin": "Matthiola incana", "family": "Brassicaceae", "group": "aromatic", "region": "Mediterranean; a cool-season scented spike for pots and cutting.", "fact": "Double-flowered stocks are sterile and scented like cloves. Growers rogue singles as seedlings by leaf color.", "feature": "Dense spikes of four-petaled (or fully double) flowers in white, pink, or lavender on gray-green foliage.", "prefers": "Full sun in cool weather; even moisture. Heat ends the spike; wet warm soil invites rot.", "image": "https://upload.wikimedia.org/wikipedia/commons/d/d6/Matthiola_incana6.jpg", "wiki": "https://en.wikipedia.org/wiki/Matthiola_incana", "credit": "Wikimedia Commons · Matthiola incana6.jpg"}, {"id": "wallflower", "commonName": "Wallflower", "latin": "Erysimum", "family": "Brassicaceae", "group": "aromatic", "region": "Europe and the Mediterranean; a cool-season pot with a sweet, carrying scent.", "fact": "Named for growing in stone walls. Bowles’s Mauve is the famous long-blooming shrublet; biennial types are the old florist pots.", "feature": "Four-petaled crosses in orange, yellow, or mauve on narrow, evergreen leaves.", "prefers": "Full sun and sharp drainage in cool weather. Heat plus wet peat is a short life; drought is tolerated in grit.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/9/91/Erysimum_cheiri3.jpg/1280px-Erysimum_cheiri3.jpg", "wiki": "https://en.wikipedia.org/wiki/Erysimum_cheiri", "credit": "Wikimedia Commons · Erysimum cheiri3.jpg"}, {"id": "nasturtium", "commonName": "Nasturtium", "latin": "Tropaeolum majus", "family": "Tropaeolaceae", "group": "bedding", "region": "Andes of South America; an edible-flower trailer for poor soil.", "fact": "Leaves and flowers taste like watercress (hence the salad name). The true botanical Nasturtium is watercress itself.", "feature": "A long-spurred, five-petaled helmet in orange, yellow, or red; round, shield-like leaves with the stem in the center.", "prefers": "Full sun; lean, dryish mix. Rich soil grows leaves, no flowers; shade does the same.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/8/87/Tropaeolum_majus_2005_G1.jpg/1280px-Tropaeolum_majus_2005_G1.jpg", "wiki": "https://en.wikipedia.org/wiki/Tropaeolum_majus", "credit": "Wikimedia Commons · Tropaeolum majus 2005 G1.jpg"}, {"id": "ranunculus", "commonName": "Persian buttercup", "latin": "Ranunculus asiaticus", "family": "Ranunculaceae", "group": "bulb", "region": "Eastern Mediterranean; a spring pot and cut flower grown from a claw-like tuber.", "fact": "Layer upon layer of tissue-paper petals. The ‘bulb’ is a true tuber that is planted claws down after a soak.", "feature": "Dense, rose-like doubles in almost every color except blue, on ferny, parsley-like foliage.", "prefers": "Cool bright light; even moisture. Heat above 70°F ends the show; wet warm soil rots the claws.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/2/23/Persian_Buttercup_01.jpg/1280px-Persian_Buttercup_01.jpg", "wiki": "https://en.wikipedia.org/wiki/Ranunculus_asiaticus", "credit": "Wikimedia Commons · Persian Buttercup 01.jpg"}, {"id": "crocus", "commonName": "Crocus", "latin": "Crocus", "family": "Iridaceae", "group": "bulb", "region": "Europe, North Africa, and Asia; Dutch hybrids and species crocus forced in shallow pots.", "fact": "Saffron is the dried stigmas of Crocus sativus — a different, autumn-blooming species. Spring pots are usually C. vernus.", "feature": "A goblet of six tepals from a true corm, with a showy orange stigma in the center; grass-like leaves with a silver midrib.", "prefers": "Cool bright light; modest water. Warm rooms open and finish the bloom in days; they want a winter chill to emerge.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e2/Crocus_vernus_with_bee.jpg/1280px-Crocus_vernus_with_bee.jpg", "wiki": "https://en.wikipedia.org/wiki/Crocus_vernus", "credit": "Wikimedia Commons · Crocus vernus with bee.jpg"}, {"id": "grape-hyacinth", "commonName": "Grape hyacinth", "latin": "Muscari", "family": "Asparagaceae", "group": "bulb", "region": "Mediterranean and western Asia; a small spring pot and bulb-bowl filler.", "fact": "Not a hyacinth. The florets are urn-shaped and packed like grapes. Some species smell like plum candy.", "feature": "A tight cone of tiny urn florets, usually cobalt blue, above a tuft of grassy leaves.", "prefers": "Cool bright light; modest water. Heat shortens the spike; they naturalize if planted out after the show.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/Muscari_armeniacum_4.jpg/1280px-Muscari_armeniacum_4.jpg", "wiki": "https://en.wikipedia.org/wiki/Muscari_armeniacum", "credit": "Wikimedia Commons · Muscari armeniacum 4.jpg"}, {"id": "freesia", "commonName": "Freesia", "latin": "Freesia", "family": "Iridaceae", "group": "bulb", "region": "South Africa; a scented pot and cut flower grown from a corm.", "fact": "The scent is a florist benchmark. Flowers line one side of a bent spike — a raceme that turns horizontal as it opens.", "feature": "A one-sided spray of tubular, flaring florets in white, yellow, pink, or violet; fans of blade-like leaves.", "prefers": "Cool bright light; even moisture. Heat fades scent and shortens stems; a dry summer rest is how corms reset.", "image": "https://upload.wikimedia.org/wikipedia/commons/4/42/Freesia.jpg", "wiki": "https://en.wikipedia.org/wiki/Freesia", "credit": "Wikimedia Commons · Freesia.jpg"}, {"id": "canna", "commonName": "Canna lily", "latin": "Canna", "family": "Cannaceae", "group": "lily", "region": "Tropical Americas; a bold patio rhizome, not a true lily.", "fact": "The ‘petals’ are modified stamens. Cannas were food plants (Queensland arrowroot) before they were bedding divas.", "feature": "Asymmetric, gladiolus-like flowers above huge paddle leaves, often bronze or striped.", "prefers": "Full sun, heat, and generous water. Cool shade makes a leafy spear and no bloom; dry pots crisp the margins.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1c/Cinnamon-bellied_flowerpiercer_%28Diglossa_baritula%29_male_on_Indian_shot_%28Canna_indica%29_Finca_El_Pilar.jpg/1280px-Cinnamon-bellied_flowerpiercer_%28Diglossa_baritula%29_male_on_Indian_shot_%28Canna_indica%29_Finca_El_Pilar.jpg", "wiki": "https://en.wikipedia.org/wiki/Canna_indica", "credit": "Wikimedia Commons · Cinnamon-bellied flowerpiercer (Diglossa baritula) male on Indian shot (Canna indica) Finca El Pilar.jpg"}, {"id": "alstroemeria", "commonName": "Alstroemeria", "latin": "Alstroemeria", "family": "Alstroemeriaceae", "group": "lily", "region": "South America; Peruvian lily, a pot and cut-flower rhizome.", "fact": "Leaves twist 180° as they grow, so the underside faces up — a botanical oddity. Inner tepals are streaked as nectar guides.", "feature": "Clusters of spotted, lily-like flowers on leafy stems; dwarf patio series stay under 12 inches.", "prefers": "Bright light, cool roots; even moisture. Heat plus a small black pot cooks the rhizome; dry soil aborts buds.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/6/6a/Alstroemeria_aurea_kz2.jpg/1280px-Alstroemeria_aurea_kz2.jpg", "wiki": "https://en.wikipedia.org/wiki/Alstroemeria_aurea", "credit": "Wikimedia Commons · Alstroemeria aurea kz2.jpg"}, {"id": "ixora", "commonName": "Ixora", "latin": "Ixora coccinea", "family": "Rubiaceae", "group": "tropical", "region": "Southern India and Sri Lanka; jungle geranium, a tropical patio shrub.", "fact": "Each floret is a long tube with four lobes — built for butterflies. Acid soil keeps foliage deep green; lime yellows it.", "feature": "Tight globes of red, orange, yellow, or pink stars on glossy opposite leaves.", "prefers": "Full tropical sun; even moisture and acidic mix. Cool nights below 50°F or alkaline water stall bloom.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/7/77/Ixora_coccinea.jpg/1280px-Ixora_coccinea.jpg", "wiki": "https://en.wikipedia.org/wiki/Ixora_coccinea", "credit": "Wikimedia Commons · Ixora coccinea.jpg"}, {"id": "crossandra", "commonName": "Crossandra", "latin": "Crossandra infundibuliformis", "family": "Acanthaceae", "group": "tropical", "region": "India and Sri Lanka; firecracker flower, an indoor tropical that blooms in warmth and humidity.", "fact": "The name means ‘funnel-shaped.’ It will bloom in a bright bathroom where African violets cook.", "feature": "Overlapping, salmon-orange (or yellow) fans from a stacked green spike; glossy, dark leaves.", "prefers": "Bright indirect light and warmth; even moisture and humidity. Cold drafts or dry air drop buds and leaves.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b9/Crossandra_infundibuliformis_kan
