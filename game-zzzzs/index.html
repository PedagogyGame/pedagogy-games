akambaram_Madhurawada_Visakhapatnam.JPG/1280px-Crossandra_infundibuliformis_kanakambaram_Madhurawada_Visakhapatnam.JPG", "wiki": "https://en.wikipedia.org/wiki/Crossandra_infundibuliformis", "credit": "Wikimedia Commons · Crossandra infundibuliformis kanakambaram Madhurawada Visakhapatnam.JPG"}, {"id": "crown-of-thorns", "commonName": "Crown of thorns", "latin": "Euphorbia milii", "family": "Euphorbiaceae", "group": "succulent", "region": "Madagascar; a thorny, nearly ever-blooming succulent shrub for sunny windows.", "fact": "The color is in bracts, like a poinsettia’s. Milky latex is irritating — a euphorbia rule. Thai hybrids have much larger bracts.", "feature": "Clusters of red, pink, or yellow bracts on fiercely spined, succulent stems with sparse leaves.", "prefers": "Full sun; dry between waterings. Shade plus wet soil rots it; it blooms more when slightly pot-bound and bright.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/7/77/Euphorbia_Milii_flowers.jpg/1280px-Euphorbia_Milii_flowers.jpg", "wiki": "https://en.wikipedia.org/wiki/Euphorbia_milii", "credit": "Wikimedia Commons · Euphorbia Milii flowers.jpg"}, {"id": "desert-rose", "commonName": "Desert rose", "latin": "Adenium obesum", "family": "Apocynaceae", "group": "succulent", "region": "Sahelian Africa and the Arabian Peninsula; a caudex succulent sold as a bonsai-like pot plant.", "fact": "The swollen trunk stores water. All parts are toxic. Flowers look like a plumeria on a fat, sculptural stem.", "feature": "A bottle-shaped caudex, sparse leaves, and five-petaled trumpets in pink, red, or white.", "prefers": "Full sun and heat; dry, gritty mix. Cold plus wet is fatal; it may drop leaves in a cool dry rest and still be alive.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/4/4a/Adenium_Obesum_Flower_Side_Macro_Mar22_D72_23052-58_ZS_P.jpg/1280px-Adenium_Obesum_Flower_Side_Macro_Mar22_D72_23052-58_ZS_P.jpg", "wiki": "https://en.wikipedia.org/wiki/Adenium_obesum", "credit": "Wikimedia Commons · Adenium Obesum Flower Side Macro Mar22 D72 23052-58 ZS P.jpg"}, {"id": "plumbago", "commonName": "Plumbago", "latin": "Plumbago auriculata", "family": "Plumbaginaceae", "group": "tropical", "region": "South Africa; Cape leadwort, a sky-blue patio climber.", "fact": "The calyx is sticky and hitchhikes on fur. True sky blue is rare in shrubs — this is why it is still grown despite the mess.", "feature": "Phlox-like clusters of pale-blue (or white) tubes on a scrambling, slightly sticky shrub.", "prefers": "Full sun; moderate water. Shade mutes the blue; frost cuts it to the ground in the margin of its range.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e1/Plumbago_auriculata_2718.jpg/1280px-Plumbago_auriculata_2718.jpg", "wiki": "https://en.wikipedia.org/wiki/Plumbago_auriculata", "credit": "Wikimedia Commons · Plumbago auriculata 2718.jpg"}, {"id": "cuphea", "commonName": "Cuphea", "latin": "Cuphea", "family": "Lythraceae", "group": "bedding", "region": "Mexico and Central America; Mexican heather (C. hyssopifolia) and cigar plant (C. ignea) are the pot types.", "fact": "Cigar plant’s tubular flowers look like lit cigars — red tubes with a white-and-purple ash tip — and hummingbirds mine them.", "feature": "Either tiny lilac stars on boxwood-like foliage, or long tubular ‘cigars’ on a loose mound.", "prefers": "Full sun to light shade; even moisture. Heat is welcome; cold wet mix is not. A fine indoor bloomer in a bright window.", "image": "https://upload.wikimedia.org/wikipedia/commons/6/63/Cuphea_hyssopifolia.jpg", "wiki": "https://en.wikipedia.org/wiki/Cuphea_hyssopifolia", "credit": "Wikimedia Commons · Cuphea hyssopifolia.jpg"}, {"id": "heliotrope", "commonName": "Heliotrope", "latin": "Heliotropium arborescens", "family": "Boraginaceae", "group": "aromatic", "region": "Peru; a Victorian favorite sold for a cherry-pie scent.", "fact": "The name means ‘turns with the sun.’ The vanilla-cherry perfume is why it survived as a pot plant despite the weedy look.", "feature": "Domed coils of tiny five-lobed florets in deep violet or white; dark, veined, wrinkled leaves.", "prefers": "Sun or light shade; even moisture. Heat plus drought wilts it; cool nights intensify scent.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/c/cb/Heliotropium_arborescens_%27Mini_Marine%27_Heliotrope_Flower_2500px.jpg/1280px-Heliotropium_arborescens_%27Mini_Marine%27_Heliotrope_Flower_2500px.jpg", "wiki": "https://en.wikipedia.org/wiki/Heliotropium_arborescens", "credit": "Wikimedia Commons · Heliotropium arborescens 'Mini Marine' Heliotrope Flower 2500px.jpg"}, {"id": "marguerite", "commonName": "Marguerite daisy", "latin": "Argyranthemum frutescens", "family": "Asteraceae", "group": "daisy", "region": "Canary Islands; a shrubby pot daisy, not a true Chrysanthemum.", "fact": "A woody subshrub, not an annual. It can live for years on a cool patio if not overwatered in winter.", "feature": "Classic white, pink, or yellow daisy heads on finely cut, almost ferny blue-green foliage.", "prefers": "Full sun and cool nights; moderate water. Heat pauses bloom; wet winter mix kills the wood.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c1/Argyranthemum_frutescens_subsp._canariae.JPG/1280px-Argyranthemum_frutescens_subsp._canariae.JPG", "wiki": "https://en.wikipedia.org/wiki/Argyranthemum_frutescens", "credit": "Wikimedia Commons · Argyranthemum frutescens subsp. canariae.JPG"}, {"id": "shasta-daisy", "commonName": "Shasta daisy", "latin": "Leucanthemum × superbum", "family": "Asteraceae", "group": "daisy", "region": "A Luther Burbank hybrid of European oxeyes; compact types are sold as patio pots.", "fact": "Burbank named it for California’s Mount Shasta. It is a Leucanthemum, split from the old Chrysanthemum dump-genus.", "feature": "Large white rays around a yellow disc on toothed, dark-green leaves; a classic ‘daisy’ silhouette.", "prefers": "Full sun; even moisture with drainage. Shade flops the stems; wet winters rot the crown.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/f/f5/Leucanthemum_x_superbum_%27Becky%27_in_NH.jpg/1280px-Leucanthemum_x_superbum_%27Becky%27_in_NH.jpg", "wiki": "https://en.wikipedia.org/wiki/Leucanthemum_%C3%97_superbum", "credit": "Wikimedia Commons · Leucanthemum x superbum 'Becky' in NH.jpg"}, {"id": "oxalis", "commonName": "Oxalis", "latin": "Oxalis triangularis", "family": "Oxalidaceae", "group": "succulent", "region": "South America; false shamrock, a bulbous indoor pot sold for purple leaves as much as flowers.", "fact": "Leaves fold down at night and in low light — a sleep movement. The plant is a true oxalis, related to wood sorrel, not a clover.", "feature": "Triangular, often deep-purple leaflets in threes and pale-pink five-petaled flowers on slender stalks.", "prefers": "Bright indirect light or a little sun; even moisture, then a dry rest if it goes dormant. Soggy mix rots the bulbs.", "image": "https://upload.wikimedia.org/wikipedia/commons/1/15/Oxalis_triangularis6.jpg", "wiki": "https://en.wikipedia.org/wiki/Oxalis_triangularis", "credit": "Wikimedia Commons · Oxalis triangularis6.jpg"}, {"id": "pocketbook", "commonName": "Pocketbook plant", "latin": "Calceolaria", "family": "Calceolariaceae", "group": "indoor", "region": "Central and South America; a cool florist pot whose flowers look like little slippers.", "fact": "Calceolaria means ‘little shoe.’ The inflated slipper is a landing pouch for pollinating bees — a few weeks of theater, not a houseplant.", "feature": "Pouched, slipper-like flowers in yellow, orange, or red, often spotted, above a rosette of soft leaves.", "prefers": "Cool bright rooms; even moisture. Heat above 65–70°F ends it; water on the crown starts rot.", "image": "https://upload.wikimedia.org/wikipedia/commons/3/38/L%27Illustration_horticole_%28Plate_528%29.jpg", "wiki": "https://en.wikipedia.org/wiki/Calceolaria_crenatiflora", "credit": "Wikimedia Commons · L'Illustration horticole (Plate 528).jpg"}, {"id": "persian-violet", "commonName": "Persian violet", "latin": "Exacum affine", "family": "Gentianaceae", "group": "indoor", "region": "Socotra (Yemen); a small scented gentian sold as a disposable indoor pot.", "fact": "Not a violet and not from Persia. The honey scent and yellow stamens on a blue disc are the giveaway. It is usually a one-season plant.", "feature": "A mound of small, shiny leaves covered in five-petaled blue or white flowers with a bright yellow center.", "prefers": "Bright indirect light; even moisture and humidity. Dry air or a dry pot drops buds; heat shortens the life.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e7/Flower-010.jpg/1280px-Flower-010.jpg", "wiki": "https://en.wikipedia.org/wiki/Exacum_affine", "credit": "Wikimedia Commons · Flower-010.jpg"}, {"id": "flowering-maple", "commonName": "Flowering maple", "latin": "Abutilon", "family": "Malvaceae", "group": "tropical", "region": "Tropics worldwide; parlor maple, a mallow with maple-like leaves, not a true maple.", "fact": "Related to hibiscus. The hanging bells were a Victorian parlor plant, and they still bloom on a bright windowsill all winter.", "feature": "Pendent, hibiscus-like bells in yellow, orange, red, or pink; leaves maple-shaped, sometimes variegated.", "prefers": "Bright light or a little sun; even moisture. Dry pots drop buds; deep shade makes a green vine and no bells.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/6/66/Redvein_Abutilon.jpg/1280px-Redvein_Abutilon.jpg", "wiki": "https://en.wikipedia.org/wiki/Callianthe_picta", "credit": "Wikimedia Commons · Redvein Abutilon.jpg"}, {"id": "globe-amaranth", "commonName": "Globe amaranth", "latin": "Gomphrena globosa", "family": "Amaranthaceae", "group": "bedding", "region": "Central America; a heat-proof pot and everlasting whose ‘petals’ are papery bracts.", "fact": "The clover-like balls dry on the stem and keep color for years. True flowers are tiny tubes hidden in the bracts.", "feature": "Clover-shaped globes in magenta, white, or orange on upright, slightly hairy plants.", "prefers": "Full sun and heat; dryish mix. Cool wet weather stalls it; it is an everlasting, not a windowsill plant.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/1/18/Gomphrena_globosa_All_Around_Purple_1zz.jpg/1280px-Gomphrena_globosa_All_Around_Purple_1zz.jpg", "wiki": "https://en.wikipedia.org/wiki/Gomphrena_globosa", "credit": "Wikimedia Commons · Gomphrena globosa All Around Purple 1zz.jpg"}, {"id": "english-daisy", "commonName": "English daisy", "latin": "Bellis perennis", "family": "Asteraceae", "group": "daisy", "region": "Europe; the lawn daisy, sold as a cool-season pot with double pompons.", "fact": "Bellis means ‘pretty.’ Double pot types are still the same species that dots English lawns — just selected for extra rays.", "feature": "Low rosettes and button or pompon heads in white, pink, or red with a yellow eye.", "prefers": "Sun or light shade in cool weather; even moisture. Heat ends the bloom; it is a spring pot, not a summer one.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/4/4b/Bellis_perennis_sl1.jpg/1280px-Bellis_perennis_sl1.jpg", "wiki": "https://en.wikipedia.org/wiki/Bellis_perennis", "credit": "Wikimedia Commons · Bellis perennis sl1.jpg"}, {"id": "oncidium", "commonName": "Oncidium", "latin": "Oncidium", "family": "Orchidaceae", "group": "orchid", "region": "Tropical Americas; dancing-lady orchids, including many Intergeneric ‘Oncidium alliance’ pots.", "fact": "The enlarged lower lip looks like a skirt in motion — hence dancing lady. Many yellow types are fragrant of vanilla or honey.", "feature": "Branching sprays of many small flowers with a wide lip, usually yellow with brown barring, from a pseudobulb.", "prefers": "Bright light, even a little sun; dry between waterings. Warm stagnant wet mix rots the bulbs; a brief dry rest after growth helps.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/3/37/Oncidium_sphacelatum03.jpg/1280px-Oncidium_sphacelatum03.jpg", "wiki": "https://en.wikipedia.org/wiki/Oncidium_sphacelatum", "credit": "Wikimedia Commons · Oncidium sphacelatum03.jpg"}]</script>
<script>
const FLOWERS = JSON.parse(document.getElementById("catalog").textContent);
const LETTERS = ["A","B","C","D"];
const HIGHLIGHT_MS = 3000;
const KEY = "bloom-bench-v1";
const $ = (id) => document.getElementById(id);
const app = $("app");

function shuffle(items) {
  const next = items.slice();
  for (let i = next.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [next[i], next[j]] = [next[j], next[i]];
  }
  return next;
}
function loadStats() {
  try {
    const parsed = JSON.parse(localStorage.getItem(KEY) || "null");
    return parsed || { best: {}, identified: [], plays: 0, lastStreak: 0 };
  } catch { return { best: {}, identified: [], plays: 0, lastStreak: 0 }; }
}
function saveStats(s) { localStorage.setItem(KEY, JSON.stringify(s)); }

function buildRound(size) {
  return shuffle(FLOWERS).slice(0, size).map((flower) => {
    const same = FLOWERS.filter(f => f.id !== flower.id && f.group === flower.group);
    const others = FLOWERS.filter(f => f.id !== flower.id && f.group !== flower.group);
    const lookalike = shuffle(same).slice(0, 1);
    const rest = shuffle(others).slice(0, 3 - lookalike.length);
    const distractors = shuffle(lookalike.concat(rest)).slice(0, 3);
    const choices = shuffle([{ flower, isCorrect: true }, ...distractors.map(d => ({ flower: d, isCorrect: false }))]);
    return { flower, choices };
  });
}

const state = {
  screen: "start",
  stats: loadStats(),
  size: 10,
  questions: [],
  index: 0,
  picked: null,
  score: 0,
  streak: 0,
  bestStreak: 0,
  correctIds: [],
  nextReady: false,
  imgFailed: false,
  guideQ: "",
  open: null,
};
let nextTimer = null;

function esc(s) {
  return String(s ?? "")
    .replace(/&/g, "\u0026amp;")
    .replace(/</g, "\u0026lt;")
    .replace(/>/g, "\u0026gt;")
    .replace(/"/g, "\u0026quot;")
    .replace(/'/g, "\u0026#39;");
}
function bestLine(best, total) { return best == null ? "No score yet" : "Best " + best + "/" + total; }

function chips() {
  const inPlay = state.screen === "play" && state.questions.length;
  $("chip-q").textContent = inPlay ? (state.index + 1) + "/" + state.questions.length : "—";
  $("chip-c").textContent = (inPlay || state.screen === "results") ? String(state.score) : "0";
  $("chip-s").textContent = String(inPlay ? state.streak : 0);
  $("chip-k").textContent = (state.stats.identified.length) + "/100";
}

function startRound(n) {
  if (nextTimer) clearTimeout(nextTimer);
  state.size = n;
  state.questions = buildRound(n);
  state.index = 0;
  state.picked = null;
  state.score = 0;
  state.streak = 0;
  state.bestStreak = 0;
  state.correctIds = [];
  state.nextReady = false;
  state.imgFailed = false;
  state.screen = "play";
  render();
}
function answer(i) {
  if (state.picked !== null) return;
  const q = state.questions[state.index];
  state.picked = i;
  const ok = q.choices[i].isCorrect;
  if (ok) {
    state.score += 1;
    state.streak += 1;
    state.bestStreak = Math.max(state.bestStreak, state.streak);
    state.correctIds.push(q.flower.id);
  } else {
    state.streak = 0;
  }
  state.nextReady = false;
  if (nextTimer) clearTimeout(nextTimer);
  nextTimer = setTimeout(() => { state.nextReady = true; render(); }, HIGHLIGHT_MS);
  render();
}
function goNext() {
  if (state.picked === null || !state.nextReady) return;
  if (state.index + 1 >= state.questions.length) {
    const prev = loadStats();
    const best = Object.assign({}, prev.best);
    best[state.size] = Math.max(best[state.size] || 0, state.score);
    state.stats = {
      best,
      identified: Array.from(new Set([...(prev.identified||[]), ...state.correctIds])),
      plays: (prev.plays || 0) + 1,
      lastStreak: Math.max(prev.lastStreak || 0, state.bestStreak),
    };
    saveStats(state.stats);
    state.screen = "results";
    render();
    return;
  }
  state.index += 1;
  state.picked = null;
  state.nextReady = false;
  state.imgFailed = false;
  render();
}

function renderStart() {
  const s = state.stats;
  return `
  <div class="grid2">
    <section class="card">
      <p class="kicker">Select a bench</p>
      <h2>Identify this flower.</h2>
      <p class="muted">Four names. One photograph from Wikimedia Commons. After you choose, the correct name is held for three seconds with the plant’s story — native range, the trait that gives it away, and whether it wants sun or shade, wet or dry.</p>
      <div class="plays">
        <button class="playbtn" data-act="play" data-n="10"><span><small>Ten pots</small><span>A short round</span></span><em>${esc(bestLine(s.best[10], 10))} →</em></button>
        <button class="playbtn" data-act="play" data-n="25"><span><small>Conservatory</small><span>Twenty-five flowers</span></span><em>${esc(bestLine(s.best[25], 25))} →</em></button>
        <button class="playbtn" data-act="play" data-n="100"><span><small>Full catalog</small><span>All one hundred</span></span><em>${esc(bestLine(s.best[100], 100))} →</em></button>
      </div>
      <p class="hint">Keyboard: 1–4 or A–D to answer · Enter for next · Esc home</p>
    </section>
    <section class="card">
      <p class="kicker">Bench notes</p>
      <h2>The show bench</h2>
      <p class="muted">These are the plants nurseries actually force and sell: moth orchids, poinsettias, pot mums, geraniums, African violets, and ninety-five more. Not a wildflora quiz — a florist’s eye. This file is the whole game: save it, open it offline (photos still need a network).</p>
      <dl class="stats">
        <div class="stat"><dt>Catalogued</dt><dd>100</dd></div>
        <div class="stat"><dt>Identified</dt><dd>${s.identified.length}</dd></div>
        <div class="stat"><dt>Benches</dt><dd>${s.plays}</dd></div>
        <div class="stat"><dt>Best streak</dt><dd>${s.lastStreak}</dd></div>
      </dl>
      <div class="stack">
        <button class="ghost" data-act="guide">Open the field guide</button>
      </div>
    </section>
  </div>`;
}

function renderPlay() {
  const q = state.questions[state.index];
  const f = q.flower;
  const revealed = state.picked !== null;
  const isCorrect = revealed && q.choices[state.picked].isCorrect;
  const progress = ((state.index + (revealed ? 1 : 0)) / state.questions.length) * 100;
  const choices = q.choices.map((c, i) => {
    const selected = state.picked === i;
    const showOk = revealed && c.isCorrect;
    const showBad = revealed && selected && !c.isCorrect;
    const cls = ["choice", showOk ? "ok" : "", showBad ? "bad" : "", revealed && !showOk && !showBad ? "dim" : ""].filter(Boolean).join(" ");
    return `<button class="${cls}" data-act="answer" data-i="${i}" ${revealed ? "disabled" : ""}>
      <span class="letter">${LETTERS[i]}</span>
      <span>${esc(c.flower.commonName)}</span>
    </button>`;
  }).join("");
  const facts = revealed ? `
    <h3>${esc(f.commonName)}</h3>
    <p class="latin">${esc(f.latin)}</p>
    <p class="verdict ${isCorrect ? "ok" : "bad"}">${isCorrect ? "Correct" : "Incorrect"}</p>
    <dl class="facts">
      <div><dt>Giveaway</dt><dd>${esc(f.feature)}</dd></div>
      <div><dt>Range</dt><dd>${esc(f.region)}</dd></div>
      <div><dt>Preferences</dt><dd>${esc(f.prefers)}</dd></div>
      <div><dt>Note</dt><dd>${esc(f.fact)}</dd></div>
    </dl>` : `<p class="muted" style="margin-top:0.75rem">Choose a name to reveal the plant, its native range, and whether it wants sun or shade, wet or dry.</p>`;
  const img = state.imgFailed
    ? `<div class="ph">Photograph unavailable</div>`
    : `<img src="${esc(f.image)}" alt="${revealed ? esc(f.commonName + " (" + f.latin + ")") : "Unidentified potted flower"}" referrerpolicy="no-referrer" onerror="window.__imgFail()">`;
  const last = state.index + 1 >= state.questions.length;
  return `
  <div class="grid2 play-grid">
    <section class="card ask">
      <div class="bar"><i style="width:${progress}%"></i></div>
      <p class="kicker" style="margin-top:1.15rem">Specimen ${state.index + 1} of ${state.questions.length}</p>
      <h2>Identify this flower.</h2>
      <p class="muted">Study the photograph, then select its common name.</p>
      <div class="choices">${choices}</div>
      <div class="row">
        <button class="ghost" data-act="home">Leave bench</button>
        <button class="primary" data-act="next" ${state.nextReady ? "" : "disabled"}>${last ? "See results" : "Next specimen"} →</button>
      </div>
    </section>
    <section class="card photo-card photo">
      <div class="mat"><div class="mat-inner">${img}</div></div>
      <div class="ident">
        <p class="label">Specimen identity</p>
        ${facts}
        <div class="credit">
          <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Photo: ${esc(f.credit)}</span>
          ${f.wiki ? `<a href="${esc(f.wiki)}" target="_blank" rel="noreferrer">Open reference ↗</a>` : ""}
        </div>
      </div>
    </section>
  </div>`;
}

function renderResults() {
  const pct = Math.round((state.score / state.questions.length) * 100);
  const line = pct >= 80 ? "Florist’s eye. The greenhouse would hire you."
    : pct >= 50 ? "A working bench. Walk the field guide, then sit another round."
    : "These plants hide in plain sight. Another ten pots will sharpen it.";
  return `
  <section class="card results">
    <p class="kicker">Bench closed</p>
    <h2>${state.score}/${state.questions.length}</h2>
    <p class="muted">${esc(line)}</p>
    <dl class="stats" style="grid-template-columns:1fr 1fr 1fr">
      <div class="stat"><dt>Accuracy</dt><dd>${pct}%</dd></div>
      <div class="stat"><dt>Best streak</dt><dd>${state.bestStreak}</dd></div>
      <div class="stat"><dt>Best ${state.size}</dt><dd>${state.stats.best[state.size] ?? state.score}</dd></div>
    </dl>
    <div class="stack">
      <button class="primary" data-act="again">Sit another round</button>
      <button class="ghost" data-act="guide">Field guide</button>
      <button class="ghost" data-act="home">Return to the station</button>
    </div>
  </section>`;
}

function renderGuide() {
  const needle = state.guideQ.trim().toLowerCase();
  const known = new Set(state.stats.identified);
  const list = FLOWERS.slice().sort((a,b) => a.commonName.localeCompare(b.commonName))
    .filter(f => !needle || f.commonName.toLowerCase().includes(needle) || f.latin.toLowerCase().includes(needle) || f.family.toLowerCase().includes(needle));
  const items = list.map(f => `
    <li><button data-act="open" data-id="${esc(f.id)}">
      <img src="${esc(f.image)}" alt="" referrerpolicy="no-referrer">
      <span><b>${esc(f.commonName)}</b><i>${esc(f.latin)}</i><small>${known.has(f.id) ? "Identified" : "Unseen on the bench"}</small></span>
    </button></li>`).join("");
  const modal = state.open ? (() => {
    const f = FLOWERS.find(x => x.id === state.open);
    if (!f) return "";
    return `<div class="modal" data-act="close">
      <div class="sheet" data-stop="1">
        <img src="${esc(f.image)}" alt="${esc(f.commonName)}" referrerpolicy="no-referrer">
        <h3>${esc(f.commonName)}</h3>
        <p class="latin">${esc(f.latin)}</p>
        <dl class="facts">
          <div><dt>Giveaway</dt><dd>${esc(f.feature)}</dd></div>
          <div><dt>Range</dt><dd>${esc(f.region)}</dd></div>
          <div><dt>Preferences</dt><dd>${esc(f.prefers)}</dd></div>
          <div><dt>Note</dt><dd>${esc(f.fact)}</dd></div>
        </dl>
        <button class="primary" style="width:100%;margin-top:1.15rem" data-act="close">Close</button>
      </div>
    </div>`;
  })() : "";
  return `
  <section class="card">
    <div class="row" style="margin-top:0">
      <div>
        <p class="kicker">Field guide</p>
        <h2>One hundred pots</h2>
      </div>
      <button class="navbtn" data-act="home">Back to the bench</button>
    </div>
    <input class="search" id="guide-search" value="${esc(state.guideQ)}" placeholder="Search common name, Latin, or family">
    <ul class="guide-list">${items}</ul>
  </section>${modal}`;
}

function render() {
  chips();
  if (state.screen === "start") app.innerHTML = renderStart();
  else if (state.screen === "play") app.innerHTML = renderPlay();
  else if (state.screen === "results") app.innerHTML = renderResults();
  else app.innerHTML = renderGuide();
}

window.__imgFail = () => { state.imgFailed = true; render(); };

app.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  if (t.dataset.stop && e.target.closest(".sheet") && !e.target.closest("[data-act='close']")) return;
  const act = t.dataset.act;
  if (act === "play") startRound(Number(t.dataset.n));
  else if (act === "answer") answer(Number(t.dataset.i));
  else if (act === "next") goNext();
  else if (act === "home") { state.screen = "start"; state.open = null; render(); }
  else if (act === "guide") { state.screen = "guide"; state.open = null; render(); }
  else if (act === "again") startRound(state.size);
  else if (act === "open") { state.open = t.dataset.id; render(); }
  else if (act === "close") { state.open = null; render(); }
});
app.addEventListener("input", (e) => {
  if (e.target.id === "guide-search") { state.guideQ = e.target.value; render(); $("guide-search").focus(); const el=$("guide-search"); el.selectionStart = el.selectionEnd = el.value.length; }
});
window.addEventListener("keydown", (e) => {
  if (e.target instanceof HTMLInputElement) return;
  if (state.screen === "play") {
    const map = { Digit1:0, Digit2:1, Digit3:2, Digit4:3, KeyA:0, KeyB:1, KeyC:2, KeyD:3 };
    if (e.code in map && state.picked === null) { e.preventDefault(); answer(map[e.code]); }
    if ((e.code === "Enter" || e.code === "Space") && state.nextReady) { e.preventDefault(); goNext(); }
  }
  if (e.code === "Escape") { state.screen = "start"; state.open = null; render(); }
});
render();
</script>
</body>
</html>
