<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Last Bus from Kelvin House</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --coal:#0d1014;
  --wall:#2a2118;
  --wall-cold:#1c2630;
  --lamp:#f2b45c;
  --lamp-dim:#a9763a;
  --brass:#a8783a;
  --screen:#86e8ff;
  --bone:#e8e0d2;
  --bone-dim:#9d968a;
  --nadia:#c05561;
  --ted:#d9a441;
  --wren:#6fb4a0;
  --serif:"EB Garamond",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:#06070a;
  color:var(--bone);
  font-family:var(--serif);
  font-size:19px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  display:flex;
  justify-content:center;
  min-height:100vh;
}
#app{width:100%;max-width:960px;display:flex;flex-direction:column}

#stage{position:relative;width:100%;background:#000;overflow:hidden}
#scene{display:block;width:100%;height:auto;max-width:100%}

#fade{
  position:absolute;inset:0;background:#000;opacity:0;
  transition:opacity .42s ease;pointer-events:none;
}

/* ---- head-up display ---- */
#hud{
  position:absolute;top:0;left:0;right:0;
  display:flex;justify-content:space-between;align-items:flex-start;
  padding:14px 18px;pointer-events:none;
  font-family:var(--mono);font-size:12px;letter-spacing:.04em;
  opacity:0;transition:opacity .6s ease;
}
#hud.on{opacity:1}
.gauge{display:flex;align-items:center;gap:9px;color:var(--bone-dim)}
#thermo{
  width:11px;height:62px;border:1px solid rgba(232,224,210,.32);
  border-radius:6px;position:relative;overflow:hidden;
  background:rgba(0,0,0,.45);
}
#mercury{
  position:absolute;left:0;right:0;bottom:0;
  background:linear-gradient(0deg,#d8613e,#f0a24a);
  transition:height .8s ease,background .8s ease;
}
#thermoBulb{
  width:17px;height:17px;border-radius:50%;
  border:1px solid rgba(232,224,210,.32);
  background:#d8613e;margin-top:-5px;
  transition:background .8s ease;
}
.thermoStack{display:flex;flex-direction:column;align-items:center}
#depth{display:flex;flex-direction:column;align-items:center;gap:2px;margin-right:4px}
#depth .roof{
  width:0;height:0;border-left:14px solid transparent;
  border-right:14px solid transparent;border-bottom:9px solid rgba(232,224,210,.26);
}
#depth .lvl{
  width:24px;height:7px;border:1px solid rgba(232,224,210,.26);
  background:rgba(0,0,0,.45);border-radius:1px;transition:background .5s ease,box-shadow .5s ease;
}
#depth .lvl.on{background:var(--lamp);border-color:var(--lamp);box-shadow:0 0 8px rgba(242,180,92,.6)}
#depth .ground{width:32px;height:2px;background:rgba(232,224,210,.22);margin-top:2px}
#clockBox{text-align:right}
#clockTime{font-size:17px;color:var(--bone);letter-spacing:.06em}
#clockNote{font-size:11px;color:var(--bone-dim)}

/* ---- caption card ---- */
#panel{
  background:linear-gradient(180deg,#14100c,#0a0908);
  border-top:1px solid rgba(168,120,58,.28);
  padding:22px 26px 26px;
  min-height:172px;
  display:flex;flex-direction:column;justify-content:space-between;gap:16px;
}
#speaker{
  font-family:var(--mono);font-size:11px;letter-spacing:.12em;
  color:var(--bone-dim);margin:0 0 5px;min-height:14px;
}
#speaker.nadia{color:var(--nadia)}
#speaker.ted{color:var(--ted)}
#speaker.wren{color:var(--wren)}
#speaker.machine{color:var(--screen)}
#narration{margin:0;max-width:64ch;font-size:19px;line-height:1.62}
#narration em{color:var(--lamp);font-style:italic}
#narration .term{
  font-family:var(--mono);font-size:.82em;letter-spacing:.03em;
  color:var(--screen);font-style:normal;
}
#choices{display:flex;flex-wrap:wrap;gap:10px}
button{
  font-family:var(--serif);font-size:17px;color:var(--bone);
  background:rgba(168,120,58,.09);
  border:1px solid rgba(168,120,58,.5);
  padding:9px 18px;border-radius:2px;cursor:pointer;
  transition:background .18s ease,border-color .18s ease,color .18s ease;
}
button:hover{background:rgba(242,180,92,.17);border-color:var(--lamp)}
button:focus-visible{outline:2px solid var(--screen);outline-offset:2px}
button.go{border-color:rgba(232,224,210,.45)}
button.go:hover{background:rgba(232,224,210,.12)}
button[disabled]{opacity:.38;cursor:default}
button[disabled]:hover{background:rgba(168,120,58,.09);border-color:rgba(168,120,58,.5)}

#hint{
  font-family:var(--mono);font-size:12px;color:var(--bone-dim);
  margin:0;min-height:15px;letter-spacing:.02em;
}
#hint.wrong{color:#d98a72}
#hint.right{color:var(--wren)}

#scene.clickable{cursor:pointer}

#voxbar{
  position:absolute;left:14px;bottom:12px;z-index:3;
  display:flex;gap:6px;align-items:center;
}
#vox,#voxpick{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;
  color:var(--bone-dim);background:rgba(8,10,14,.68);
  border:1px solid rgba(168,120,58,.38);border-radius:2px;
  padding:5px 9px;opacity:.62;transition:opacity .2s ease,color .2s ease;
}
#vox:hover,#voxpick:hover{opacity:1;color:var(--bone)}
#vox.off{color:#7d7468;border-color:rgba(120,110,95,.32)}
#voxpick{max-width:190px;cursor:pointer}
#voxpick option{background:#12100c;color:var(--bone)}
@media (max-width:640px){
  #voxbar{left:8px;bottom:8px}
  #vox,#voxpick{font-size:9.5px;padding:4px 6px}
  #voxpick{max-width:130px}
}

@media (max-width:640px){
  body{font-size:17px}
  #narration{font-size:17px}
  #panel{padding:16px 16px 20px;min-height:0}
  button{font-size:16px;padding:8px 14px}
  #hud{padding:9px 11px}
  #thermo{height:44px}
}
@media (prefers-reduced-motion:reduce){
  #fade{transition-duration:.01s}
}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="scene" width="960" height="600" aria-label="Kelvin House"></canvas>
    <div id="hud">
      <div class="gauge">
        <div id="depth" aria-hidden="true">
          <span class="roof"></span>
          <span class="lvl" data-l="3"></span>
          <span class="lvl" data-l="2"></span>
          <span class="lvl" data-l="1"></span>
          <span class="lvl" data-l="0"></span>
          <span class="ground"></span>
        </div>
        <div class="thermoStack">
          <div id="thermo"><div id="mercury" style="height:88%"></div></div>
          <div id="thermoBulb"></div>
        </div>
        <span id="thermoRead">92&deg;F</span>
      </div>
      <div id="clockBox">
        <div id="clockTime">5:40</div>
        <div id="clockNote">bus at 7:00</div>
      </div>
    </div>
    <div id="voxbar">
      <button id="vox" type="button" aria-pressed="false">narration off</button>
      <select id="voxpick" aria-label="narrator voice"></select>
    </div>
    <div id="fade"></div>
  </div>
  <div id="panel">
    <div>
      <p id="speaker"></p>
      <p id="narration"></p>
    </div>
    <p id="hint"></p>
    <div id="choices"></div>
  </div>
</div>
<script>
"use strict";
/* ============================================================
   THE LAST BUS FROM KELVIN HOUSE
   A house that is quietly a working model of something.
   ============================================================ */

var W = 960, H = 600;
var cv = document.getElementById('scene');
var cx = cv.getContext('2d');

var P = {
  coal:'#0d1014', lamp:'#f2b45c', lampDim:'#a9763a',
  brass:'#a8783a', brassLit:'#e9c380',
  screen:'#86e8ff', screenDeep:'#06202b', screenGrid:'#12475c',
  aurora1:'#5ef0a8', aurora2:'#8f7bf0', aurora3:'#43c7e8',
  ice:'#bfe4f2', ember:'#ff8a3d', emberHot:'#ffd08a',
  nadia:'#c05561', ted:'#d9a441', wren:'#6fb4a0',
  bone:'#e8e0d2', boneDim:'#9d968a'
};

/* ---------- small utilities ---------- */
function lerp(a,b,u){ return a+(b-a)*u; }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function TAU(){ return Math.PI*2; }
function wait(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }
function rnd(seed){ var x=Math.sin(seed*127.1)*43758.5453; return x-Math.floor(x); }

function rrect(g,x,y,w,h,r){
  g.beginPath();
  g.moveTo(x+r,y);
  g.arcTo(x+w,y,x+w,y+h,r);
  g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r);
  g.arcTo(x,y,x+w,y,r);
  g.closePath();
}

function glow(g,x,y,r,col,a){
  var gr = g.createRadialGradient(x,y,0,x,y,r);
  gr.addColorStop(0, col);
  gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.save();
  g.globalAlpha = (a===undefined?0.5:a);
  g.globalCompositeOperation = 'lighter';
  g.fillStyle = gr;
  g.fillRect(x-r,y-r,r*2,r*2);
  g.restore();
}

function vignette(g,strength){
  var gr = g.createRadialGradient(W/2,H/2,H*0.26,W/2,H/2,H*0.95);
  gr.addColorStop(0,'rgba(0,0,0,0)');
  gr.addColorStop(1,'rgba(0,0,0,'+(strength===undefined?0.82:strength)+')');
  g.fillStyle = gr;
  g.fillRect(0,0,W,H);
}

function motes(g,t,n,col,spread){
  g.save(); g.fillStyle = col;
  for(var i=0;i<n;i++){
    var s = rnd(i+7);
    var x = (rnd(i*3+1)*W + t*(6+s*10)) % (W+60) - 30;
    var y = H*0.22 + (rnd(i*5+2)*H*0.62) + Math.sin(t*0.5+i)*(spread||9);
    g.globalAlpha = 0.06 + s*0.16;
    g.beginPath(); g.arc(x,y,0.7+s*1.5,0,TAU()); g.fill();
  }
  g.restore();
}

/* ---------- typography on canvas ---------- */
function label(g,txt,x,y,size,col,align,mono){
  g.save();
  g.font = (mono===false? '500 ':'500 ')+size+'px '+(mono===false?
    '"EB Garamond",Georgia,serif' : '"IBM Plex Mono",monospace');
  g.fillStyle = col; g.textAlign = align||'left'; g.textBaseline='middle';
  g.fillText(txt,x,y);
  g.restore();
}

/* ---------- the three of them ---------- */
var CAST = {
  wren:  {coat:'#4f8f7e', lit:'#7cc3ae', trim:'#2c5a4e', leg:'#33423e',
          skin:'#e9c6a2', hair:'#7a5333', hat:'#6fb4a0'},
  ted:   {coat:'#b3832a', lit:'#e0ad4c', trim:'#77530f', leg:'#4b3a24',
          skin:'#e3ba8c', hair:'#3a2a18', hat:'#7d6438'},
  nadia: {coat:'#9c3f4a', lit:'#c96470', trim:'#63242c', leg:'#2b2029',
          skin:'#d8a87e', hair:'#221912', hat:null}
};
var BYCOLOR = {};
BYCOLOR[P.wren]='wren'; BYCOLOR[P.ted]='ted'; BYCOLOR[P.nadia]='nadia';

function limbPath(g,ox,oy,a1,l1,a2,l2){
  var jx=ox+Math.sin(a1)*l1, jy=oy+Math.cos(a1)*l1;
  var ex=jx+Math.sin(a1+a2)*l2, ey=jy+Math.cos(a1+a2)*l2;
  g.beginPath(); g.moveTo(ox,oy); g.lineTo(jx,jy); g.lineTo(ex,ey);
  return {jx:jx,jy:jy,ex:ex,ey:ey,ea:a1+a2};
}

function person(g,x,y,h,who,tt,o){
  o=o||{};
  var sil=!who, C=who?CAST[who]:null, sc=o.silCol||'#05080c';
  var coat = sil?sc:C.coat, lit=sil?sc:C.lit, trim=sil?sc:C.trim;
  var leg  = sil?sc:C.leg,  skin=sil?sc:C.skin, hair=sil?sc:C.hair;
  var dark = sil?sc:'#1c1511';
  var shade= sil?sc:'rgba(0,0,0,0.26)';
  var pose = o.pose||'idle';
  var ph   = (o.phase===undefined)? tt*1.6 : o.phase;

  /* each of them moves differently */
  var pr = who==='wren'  ? {bob:1.7,fid:1.9,rate:1.30}
         : who==='ted'   ? {bob:1.1,fid:1.2,rate:0.95}
         :                 {bob:0.6,fid:0.45,rate:0.70};

  var S={hipDrop:0,lean:0,headTilt:0,headTurn:0,
         legA:[0.05,-0.05],kneeA:[0.05,0.05],
         armA:[0.16,-0.16],elbowA:[0.20,0.20],hemK:1,lead:1};

  if(pose==='walk'){
    var p=ph;
    S.legA =[Math.sin(p)*0.66, Math.sin(p+Math.PI)*0.66];
    S.kneeA=[Math.max(0,-Math.sin(p))*0.95+0.04, Math.max(0,-Math.sin(p+Math.PI))*0.95+0.04];
    S.armA =[Math.sin(p+Math.PI)*0.50, Math.sin(p)*0.50];
    S.elbowA=[0.34,0.34];
    S.hipDrop=-Math.abs(Math.cos(p))*0.024+0.014;
    S.lean=0.055; S.headTilt=-0.035;
    S.headTurn=Math.sin(p*0.5)*0.12;
    S.hemK=1+Math.sin(p)*0.35;
  } else if(pose==='run'){
    var q=ph;
    S.legA =[Math.sin(q)*0.95, Math.sin(q+Math.PI)*0.95];
    S.kneeA=[Math.max(0,-Math.sin(q))*1.45+0.08, Math.max(0,-Math.sin(q+Math.PI))*1.45+0.08];
    S.armA =[Math.sin(q+Math.PI)*0.85, Math.sin(q)*0.85];
    S.elbowA=[0.95,0.95];
    S.hipDrop=-Math.abs(Math.cos(q))*0.040+0.022;
    S.lean=0.20; S.headTilt=-0.10;
    S.hemK=1+Math.sin(q)*0.7;
  } else if(pose==='tumble'){
    var f=ph;
    S.legA =[0.95+Math.sin(f*1.7)*0.62, -0.80+Math.sin(f*1.9+1)*0.66];
    S.kneeA=[0.75+Math.sin(f*2.3)*0.55, 0.55+Math.sin(f*2.1+2)*0.55];
    S.armA =[1.70+Math.sin(f*2.2)*0.75, -1.65+Math.sin(f*2.5+1.5)*0.75];
    S.elbowA=[-0.55+Math.sin(f*3.1)*0.6, 0.55+Math.sin(f*2.8)*0.6];
    S.headTilt=Math.sin(f*1.3)*0.34;
    S.lean=Math.sin(f*1.1)*0.14;
  } else if(pose==='land'){
    var k=clamp(o.rise===undefined?0:o.rise,0,1);
    var e=k*k*(3-2*k);
    S.hipDrop=lerp(0.335,0,e);
    S.legA =[lerp(1.30,0.06,e), lerp(0.98,-0.06,e)];
    S.kneeA=[lerp(-1.05,0.05,e), lerp(-0.82,0.05,e)];
    S.armA =[lerp(-1.30,0.16,e), lerp(1.22,-0.16,e)];
    S.elbowA=[lerp(0.55,0.20,e), lerp(-0.45,0.20,e)];
    S.lean=lerp(-0.24,0,e)+Math.sin(tt*2)*0.012*e;
    S.headTilt=lerp(0.30,0,e);
    S.hemK=lerp(1.5,1,e);
  } else if(pose==='reach'){
    var rd=o.reachDir===undefined?-1:o.reachDir;
    var up=rd<0?0:1;
    S.armA=[0.18,-0.18]; S.elbowA=[0.22,0.22];
    S.armA[up]=rd*2.55; S.elbowA[up]=rd*0.22;
    S.lead=up;
    S.legA=[0.09,-0.07]; S.kneeA=[0.06,0.06];
    S.headTilt=-0.14+Math.sin(ph*1.2)*0.02; S.headTurn=rd*0.22;
    S.hipDrop=-0.020+Math.sin(ph*1.2)*0.005;
  } else if(pose==='point'){
    var pd=o.reachDir===undefined?-1:o.reachDir;
    var pu=pd<0?0:1;
    S.armA=[0.16,-0.16]; S.elbowA=[0.22,0.22];
    S.armA[pu]=pd*1.50; S.elbowA[pu]=pd*0.16;
    S.lead=pu;
    S.headTilt=-0.06; S.headTurn=pd*0.34;
  } else if(pose==='lookup'){
    S.headTilt=-0.46+Math.sin(ph*0.5)*0.035;
    S.armA=[0.30,-0.34]; S.elbowA=[0.42,0.42];
    S.hipDrop=-Math.sin(ph*0.7)*0.006;
    S.lean=-0.045;
  } else if(pose==='crouch'){
    S.hipDrop=0.150;
    S.legA=[0.42,-0.36]; S.kneeA=[-0.72,-0.66];
    S.armA=[0.55,-0.30]; S.elbowA=[0.55,0.62];
    S.lean=0.16; S.headTilt=0.06;
  } else {
    var b=Math.sin(ph*0.80*pr.rate), sh=Math.sin(ph*0.31*pr.rate);
    S.hipDrop=-b*0.0065*pr.bob;
    S.lean=sh*0.020;
    S.legA=[0.055+sh*0.030,-0.055+sh*0.030];
    S.kneeA=[0.05,0.05];
    S.armA=[0.155+Math.sin(ph*0.52*pr.rate)*0.055*pr.fid,
           -0.155-Math.sin(ph*0.52*pr.rate+1)*0.055*pr.fid];
    S.elbowA=[0.21,0.21];
    S.headTurn=Math.sin(ph*0.23*pr.rate+1.7)*0.34*pr.fid;
    S.headTilt=Math.sin(ph*0.19*pr.rate)*0.05;
    S.hemK=1+sh*0.10;
  }
  if(o.mix){ for(var kk in o.mix){ S[kk]=o.mix[kk]; } }

  /* relative wind, for coats and hair in free fall */
  var wx=0, wy=0;
  if(o.wind!==undefined){
    var wa=o.wind;
    wx=Math.sin(wa)*(o.windK||0.09); wy=-Math.cos(wa)*(o.windK||0.09);
  }

  g.save();
  g.translate(x,y);
  if(o.lean) g.rotate(o.lean);
  g.scale(h,h);

  if(!o.noShadow){
    g.fillStyle='rgba(0,0,0,'+(0.34*(o.shadow===undefined?1:o.shadow))+')';
    g.beginPath(); g.ellipse(0,0.014,0.205,0.048,0,0,TAU()); g.fill();
  }

  var hipY=-0.455+S.hipDrop, shY=-0.755+S.hipDrop, nkY=-0.795+S.hipDrop;
  var TH=0.205, SHN=0.195, UA=0.158, FA=0.150;

  function doLeg(i,near){
    var rootX=(i? 0.052 : -0.052);
    g.save();
    g.lineCap='round'; g.lineJoin='round';
    var L=limbPath(g,rootX,hipY,S.legA[i],TH,S.kneeA[i],SHN);
    g.strokeStyle=near?leg:'#000'; g.globalAlpha=near?1:0.55;
    g.lineWidth=0.092; g.stroke();
    g.globalAlpha=1;
    if(near){
      g.strokeStyle='rgba(255,255,255,0.07)'; g.lineWidth=0.030;
      limbPath(g,rootX,hipY,S.legA[i],TH,S.kneeA[i],SHN); g.stroke();
    }
    g.save(); g.translate(L.ex,L.ey); g.rotate(-L.ea*0.55);
    g.fillStyle=near?dark:'#0d0a08';
    rrect(g,-0.052,-0.020,0.128,0.086,0.026); g.fill();
    if(near){ g.fillStyle='rgba(255,255,255,0.10)'; rrect(g,-0.052,-0.020,0.128,0.020,0.010); g.fill(); }
    g.restore();
    g.restore();
  }

  function doArm(i,near){
    var rootX=(i? 0.140 : -0.140);
    g.save(); g.lineCap='round'; g.lineJoin='round';
    var A=limbPath(g,rootX,shY+0.030,S.armA[i],UA,S.elbowA[i],FA);
    g.strokeStyle=near?coat:'#000'; g.globalAlpha=near?1:0.5;
    g.lineWidth=0.066; g.stroke();
    g.globalAlpha=1;
    if(near){
      g.strokeStyle='rgba(0,0,0,0.16)'; g.lineWidth=0.020;
      limbPath(g,rootX,shY+0.030,S.armA[i],UA,S.elbowA[i],FA); g.stroke();
    }
    g.fillStyle = (who==='wren')? trim : skin;
    if(!near) g.fillStyle='#0d0a08';
    g.beginPath(); g.arc(A.ex,A.ey,0.031,0,TAU()); g.fill();
    g.restore();
    return A;
  }

  /* far side first */
  var LEAD=S.lead, BACK=1-S.lead;
  doLeg(BACK,false);
  var farArm=null;
  if(!o.hideFarArm) farArm=doArm(BACK,false);

  /* the coat */
  var hem = who==='nadia'? -0.13 : (who==='ted'? -0.435 : -0.295);
  hem += S.hipDrop*0.55;
  var hh = who==='nadia'? 0.215 : (who==='ted'? 0.168 : 0.192);
  var hs = 0.150;
  var swayX = S.lean*0.55 + wx*1.5;
  var swayY = wy*1.1;
  function coatPath(){
    g.beginPath();

  coatPath(); g.fillStyle=coat; g.fill();

    for(var ln=0;ln<4;ln++){ g.beginPath(); g.moveTo(-0.036,-0.02+ln*0.028); g.lineTo(0.036,-0.02+ln*0.028); g.stroke(); }
    g.restore();

  if(who==='ted'&&!o.noProp&&nearArm&&pose!=='tumble'&&pose!=='land'){
    g.save(); g.translate(nearArm.ex,nearArm.ey+0.012);

  if(!sil){

  var hwx=wx*1.6, hwy=wy*1.6;
  if(who==='nadia'){

    g.beginPath(); g.arc(0,0,0.044,0,TAU()); g.fill(); g.restore();
    g.fillStyle='rgba(255,255,255,0.10)';
    g.beginPath(); g.ellipse(turn-0.026,ht-0.058,0.040,0.030,0.5,0,TAU()); g.fill();
  } else if(who==='ted'){
    g.fillStyle=hair;
    g.beginPath(); g.ellipse(turn,ht-0.038,0.082,0.058,0,Math.PI,0); g.fill();

    g.beginPath();

  } else if(who==='wren'){

  } else if(sil){

  if(!sil && h>78){
    var blink = (Math.sin(ph*0.37+ (who==='wren'?0:who==='ted'?2:4))>0.985)?1:0;
    g.fillStyle='#2b201a';

      g.beginPath(); g.ellipse(turn+0.028,ht+0.006,0.011,0.013,0,0,TAU()); g.fill();
    }
    if(h>118){

      var mouthOpen = (pose==='tumble')?0.020:0;
      if(mouthOpen){
        g.fillStyle='rgba(90,50,44,0.75)';
        g.beginPath(); g.ellipse(turn,ht+0.052,0.020,0.026,0,0,TAU()); g.fill();
      } else {
        g.beginPath(); g.moveTo(turn-0.018,ht+0.048); g.lineTo(turn+0.018,ht+0.048); g.stroke();
      }
      g.strokeStyle='rgba(0,0,0,0.30)'; g.lineWidth=0.010;
      g.beginPath(); g.moveTo(turn-0.044,ht-0.024); g.lineTo(turn-0.016,ht-0.028); g.stroke();
      g.beginPath(); g.moveTo(turn+0.016,ht-0.028); g.lineTo(turn+0.044,ht-0.024); g.stroke();

}

/* the three of them arriving, and settling */
var CASTORDER=['wren','ted','nadia'];
function castAt(g,t,marks,o){
  o=o||{};
  var e=t-(GAME.viewT0||0);
  for(var i=0;i<3;i++){
    var m=marks[i], who=CASTORDER[i];
    if(o.mode==='fallen'){
      var rise=clamp((e-0.5-i*0.45)/1.5,0,1);
      person(g,m[0],m[1],m[2],who,t,{pose:'land',rise:rise,phase:t*1.6+i*2.1});
      continue;
    }
    var start=-70-i*86, span=1.35+i*0.20;
    var u=clamp(e/span,0,1);
    var ez=1-Math.pow(1-u,2.4);
    var px=lerp(start,m[0],ez);
    var walking=u<0.995;
    person(g,px,m[1],m[2],who,t,{
      pose: walking?'walk':(o.pose||'idle'),
      phase: walking? (e*7.6+i*1.9) : (t*1.6+i*2.1)
    });
  }
}
function shadowPool(g,x,y,rx,a){

  var gr = g.createRadialGradient(x,y,0,x,y,rx);
  gr.addColorStop(0,'rgba(0,0,0,'+(a||0.5)+')');
  gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle = gr;
  g.beginPath(); g.ellipse(x,y,rx,rx*0.30,0,0,TAU()); g.fill();
  g.restore();
}

/* ---------- the room as a box ---------- */
function floorSpan(y,hz,bx,bw){
  var u=(y-hz)/(H-hz);
  return [lerp(bx,0,u), lerp(bx+bw,W,u)];
}

function perspTiles(g,hz,bx,bw,cA,cB,rows,cols){
  for(var r=0;r<rows;r++){
    var y0=hz+(H-hz)*Math.pow(r/rows,1.8);
    var y1=hz+(H-hz)*Math.pow((r+1)/rows,1.8);
    var s0=floorSpan(y0,hz,bx,bw), s1=floorSpan(y1,hz,bx,bw);
    for(var c=0;c<cols;c++){
      var u0=c/cols,u1=(c+1)/cols;
      g.fillStyle=((r+c)%2)?cA:cB;
      g.beginPath();
      g.moveTo(lerp(s0[0],s0[1],u0),y0); g.lineTo(lerp(s0[0],s0[1],u1),y0);
      g.lineTo(lerp(s1[0],s1[1],u1),y1); g.lineTo(lerp(s1[0],s1[1],u0),y1);
      g.closePath(); g.fill();
    }
  }
}

function damask(g,x,y,w,h,col,alpha,sz){
  g.save(); g.globalAlpha=alpha; g.fillStyle=col; sz=sz||38;
  var row=0;
  for(var yy=y+sz*0.5; yy<y+h; yy+=sz){
    for(var xx=x+(row%2?sz*0.5:0)+sz*0.5; xx<x+w; xx+=sz){
      g.beginPath(); g.ellipse(xx,yy,sz*0.13,sz*0.24,0,0,TAU()); g.fill();
      g.beginPath(); g.ellipse(xx-sz*0.20,yy+sz*0.08,sz*0.10,sz*0.045,-0.7,0,TAU()); g.fill();
      g.beginPath(); g.ellipse(xx+sz*0.20,yy+sz*0.08,sz*0.10,sz*0.045,0.7,0,TAU()); g.fill();
      g.beginPath(); g.ellipse(xx,yy-sz*0.30,sz*0.05,sz*0.08,0,0,TAU()); g.fill();
    }
    row++;
  }
  g.restore();
}

function corniceBand(g,x,y,w,col){
  g.fillStyle=col; g.fillRect(x,y,w,13);
  g.fillStyle='rgba(255,255,255,0.11)'; g.fillRect(x,y,w,4);
  g.fillStyle='rgba(0,0,0,0.40)'; g.fillRect(x,y+13,w,5);
  g.fillStyle='rgba(0,0,0,0.28)';
  for(var i=x+5;i<x+w-4;i+=15){ g.fillRect(i,y+5,7,7); }
}

function dadoPanels(g,x,y,w,h,base,trim,n){
  g.fillStyle=base; g.fillRect(x,y,w,h);
  var pw=w/n;
  for(var i=0;i<n;i++){
    var px=x+i*pw+9;
    g.strokeStyle='rgba(255,255,255,0.10)'; g.lineWidth=2.2;
    g.strokeRect(px,y+14,pw-18,h-30);
    g.strokeStyle='rgba(0,0,0,0.42)'; g.lineWidth=1.5;
    g.strokeRect(px+3,y+17,pw-24,h-36);
  }
  g.fillStyle=trim; g.fillRect(x,y-8,w,11);
  g.fillStyle='rgba(255,255,255,0.13)'; g.fillRect(x,y-8,w,3);
  g.fillStyle='rgba(0,0,0,0.35)'; g.fillRect(x,y+h-5,w,6);
}

function sideRails(g,ty,hz,bx,bw,fracs,col,lw){
  g.save(); g.strokeStyle=col; g.lineWidth=lw||2.2;
  for(var i=0;i<fracs.length;i++){
    var f=fracs[i], backY=lerp(ty,hz,f), edgeY=lerp(0,H,f);
    g.beginPath(); g.moveTo(0,edgeY); g.lineTo(bx,backY); g.stroke();
    g.beginPath(); g.moveTo(W,edgeY); g.lineTo(bx+bw,backY); g.stroke();
  }
  g.restore();
}

function sideStiles(g,ty,hz,bx,bw,n,col,lw){
  g.save(); g.strokeStyle=col; g.lineWidth=lw||1.8;
  for(var i=1;i<=n;i++){
    var u=1-Math.pow(1-i/(n+1),2.1);
    g.beginPath();
    g.moveTo(lerp(0,bx,u),lerp(0,ty,u)); g.lineTo(lerp(0,bx,u),lerp(H,hz,u)); g.stroke();
    g.beginPath();
    g.moveTo(lerp(W,bx+bw,u),lerp(0,ty,u)); g.lineTo(lerp(W,bx+bw,u),lerp(H,hz,u)); g.stroke();
  }
  g.restore();
}

function ceilingBeams(g,ty,bx,bw,col,n){
  g.save(); g.strokeStyle=col; g.lineWidth=9;
  for(var i=1;i<=n;i++){
    var u=i/(n+1);
    g.beginPath(); g.moveTo(lerp(0,W,u),0); g.lineTo(lerp(bx,bx+bw,u),ty); g.stroke();
  }
  g.strokeStyle='rgba(0,0,0,0.45)'; g.lineWidth=11;
  g.beginPath(); g.moveTo(0,0); g.lineTo(bx,ty); g.stroke();
  g.beginPath(); g.moveTo(W,0); g.lineTo(bx+bw,ty); g.stroke();
  g.restore();
}

function roomShell(g,o){
  o = o||{};
  var ty=o.ty||128, hz=o.hz||392, bx=o.bx||188, bw=o.bw||584;
  var wallA=o.wallA||'#2e2418', wallB=o.wallB||'#17120c';
  var floor=o.floor||'#241c13';
  g.fillStyle='#05060a'; g.fillRect(0,0,W,H);

  g.fillStyle=o.ceil||'#0b0906';
  g.beginPath(); g.moveTo(0,0); g.lineTo(W,0); g.lineTo(bx+bw,ty); g.lineTo(bx,ty); g.closePath(); g.fill();

  var lg=g.createLinearGradient(0,0,bx,0);
  lg.addColorStop(0,'#08070a'); lg.addColorStop(1,wallB);
  g.fillStyle=lg;
  g.beginPath(); g.moveTo(0,0); g.lineTo(bx,ty); g.lineTo(bx,hz); g.lineTo(0,H); g.closePath(); g.fill();
  var rg=g.createLinearGradient(W,0,bx+bw,0);
  rg.addColorStop(0,'#08070a'); rg.addColorStop(1,wallB);
  g.fillStyle=rg;
  g.beginPath(); g.moveTo(W,0); g.lineTo(bx+bw,ty); g.lineTo(bx+bw,hz); g.lineTo(W,H); g.closePath(); g.fill();

  var bg=g.createLinearGradient(0,ty,0,hz);
  bg.addColorStop(0,wallB); bg.addColorStop(0.55,wallA); bg.addColorStop(1,wallB);
  g.fillStyle=bg; g.fillRect(bx,ty,bw,hz-ty);

  if(o.paper){ damask(g,bx,ty,bw,hz-ty,o.paper.col,o.paper.alpha,o.paper.sz); }
  if(o.beams){ ceilingBeams(g,ty,bx,bw,o.beams,4); }

  /* the floor */
  var ft=o.floorType||'boards';
  if(ft==='tile'){
    perspTiles(g,hz,bx,bw,o.tileA||'#241c16',o.tileB||'#171210',9,12);
  } else {
    var fg=g.createLinearGradient(0,hz,0,H);
    fg.addColorStop(0,floor); fg.addColorStop(1,'#050608');
    g.fillStyle=fg;
    g.beginPath(); g.moveTo(bx,hz); g.lineTo(bx+bw,hz); g.lineTo(W,H); g.lineTo(0,H); g.closePath(); g.fill();
    g.save(); g.strokeStyle='rgba(0,0,0,0.34)'; g.lineWidth=1.3;
    for(var i=0;i<=12;i++){
      var u=i/12;
      g.beginPath(); g.moveTo(bx+bw*u,hz); g.lineTo(lerp(0,W,u),H); g.stroke();
    }
    for(var r2=1;r2<5;r2++){
      var yy=hz+(H-hz)*Math.pow(r2/5,1.8);
      var sp=floorSpan(yy,hz,bx,bw);
      g.beginPath(); g.moveTo(sp[0],yy); g.lineTo(sp[1],yy); g.stroke();
    }
    g.restore();
  }

  /* skirting and panelling */
  if(o.dado){
    var dh=o.dado.h||86;
    dadoPanels(g,bx,hz-dh,bw,dh,o.dado.col,o.dado.trim,o.dado.n||7);
    sideRails(g,ty,hz,bx,bw,[(hz-dh-ty)/(hz-ty),1],'rgba(0,0,0,0.42)',3);
    sideRails(g,ty,hz,bx,bw,[(hz-dh-ty)/(hz-ty)-0.012],'rgba(255,255,255,0.09)',2);
  }
  if(o.stiles!==false){
    sideStiles(g,ty,hz,bx,bw,o.stiles||4,'rgba(0,0,0,0.34)',2);
    sideStiles(g,ty,hz,bx,bw,o.stiles||4,'rgba(255,255,255,0.05)',1);
  }
  if(o.cornice){
    corniceBand(g,bx,ty,bw,o.cornice);
    sideRails(g,ty,hz,bx,bw,[0.005,0.048],'rgba(0,0,0,0.40)',3);
  }
  return {ty:ty,hz:hz,bx:bx,bw:bw};
}

/* ---------- Victorian fittings ---------- */
function gasolier(g,x,yTop,t,s,arms){
  arms=arms||4; s=s||1;
  var drop=84*s;
  g.save();
  g.strokeStyle='#3a2c18'; g.lineWidth=3.4*s;
  g.beginPath(); g.moveTo(x,yTop); g.lineTo(x,yTop+drop); g.stroke();
  g.fillStyle='#6b5227';
  g.beginPath(); g.ellipse(x,yTop+drop,17*s,6*s,0,0,TAU()); g.fill();
  g.beginPath(); g.ellipse(x,yTop+drop*0.45,9*s,13*s,0,0,TAU()); g.fill();
  for(var i=0;i<arms;i++){
    var a=(i/arms)*TAU()+0.4;
    var ax=x+Math.cos(a)*46*s, ay=yTop+drop+Math.abs(Math.sin(a))*5*s;
    g.strokeStyle='#6b5227'; g.lineWidth=2.8*s;
    g.beginPath(); g.moveTo(x,yTop+drop);
    g.quadraticCurveTo((ax+x)/2,yTop+drop+18*s,ax,ay); g.stroke();
    var f=0.86+Math.sin(t*5.7+i*1.7)*0.08+Math.sin(t*2.1+i)*0.05;
    glow(g,ax,ay-10*s,60*s,P.lamp,0.26*f);
    g.strokeStyle='rgba(214,228,232,0.26)'; g.lineWidth=1.5*s;
    g.beginPath(); g.ellipse(ax,ay-11*s,11*s,14*s,0,0,TAU()); g.stroke();
    g.fillStyle='rgba(255,226,170,'+(0.86*f)+')';
    g.beginPath(); g.ellipse(ax,ay-11*s,6.5*s,9.5*s,0,0,TAU()); g.fill();
  }
  g.restore();
}

function giltFrame(g,x,y,w,h){
  g.fillStyle='#5c4620'; rrect(g,x-12,y-12,w+24,h+24,3); g.fill();
  g.fillStyle='#8a6a2e'; rrect(g,x-7,y-7,w+14,h+14,2); g.fill();

  g.fillStyle='rgba(0,0,0,0.38)'; g.fillRect(x-7,y+h+3,w+14,4);
}

function portraitOf(g,x,y,w,h,seed){
  giltFrame(g,x,y,w,h);
  var bg=g.createLinearGradient(x,y,x,y+h);
  bg.addColorStop(0,'#2b2318'); bg.addColorStop(1,'#100e09');
  g.fillStyle=bg; g.fillRect(x,y,w,h);
  g.fillStyle='#372d20';
  g.beginPath();
  g.moveTo(x+w*0.18,y+h); g.quadraticCurveTo(x+w*0.5,y+h*0.46,x+w*0.82,y+h);
  g.closePath(); g.fill();
  g.fillStyle='rgba(226,204,166,'+(0.20+rnd(seed)*0.10)+')';
  g.beginPath(); g.ellipse(x+w/2,y+h*0.40,w*0.13,h*0.13,0,0,TAU()); g.fill();
  g.fillStyle='rgba(0,0,0,0.30)';
  g.beginPath(); g.ellipse(x+w/2,y+h*0.33,w*0.15,h*0.08,0,Math.PI,0); g.fill();
}

function panelDoor(g,x,y,w,h,col){
  g.fillStyle=col||'#1c1510'; g.fillRect(x,y,w,h);
  g.strokeStyle='rgba(0,0,0,0.55)'; g.lineWidth=2.4; g.strokeRect(x,y,w,h);
  var pads=[[0.12,0.05,0.76,0.27],[0.12,0.37,0.76,0.22],[0.12,0.64,0.76,0.30]];
  for(var i=0;i<3;i++){
    var q=pads[i];
    g.strokeStyle='rgba(255,255,255,0.10)'; g.lineWidth=2;
    g.strokeRect(x+w*q[0],y+h*q[1],w*q[2],h*q[3]);
    g.strokeStyle='rgba(0,0,0,0.45)'; g.lineWidth=1.4;
    g.strokeRect(x+w*q[0]+3,y+h*q[1]+3,w*q[2]-6,h*q[3]-6);
  }
  g.fillStyle=P.brass;
  g.beginPath(); g.arc(x+w*0.85,y+h*0.50,4.5,0,TAU()); g.fill();
}

function drapes(g,x,y,w,h,col,dk){
  g.save();
  var n=6;
  for(var side=0;side<2;side++){
    var bx0 = side? x+w*0.70 : x-w*0.02, bw0=w*0.32;
    for(var i=0;i<n;i++){
      var xx=bx0+bw0*(i/n), nw=bw0/n;
      g.fillStyle=(i%2)?col:dk;
      g.beginPath();
      g.moveTo(xx,y);
      g.quadraticCurveTo(xx+nw*0.7,y+h*0.55,xx+(side?-1:1)*bw0*0.10,y+h);
      g.lineTo(xx+nw+(side?-1:1)*bw0*0.10,y+h);
      g.quadraticCurveTo(xx+nw*1.7,y+h*0.55,xx+nw,y);
      g.closePath(); g.fill();
    }
  }
  g.fillStyle=dk; g.fillRect(x-12,y-18,w+24,26);
  g.fillStyle=col;
  for(var s2=0;s2<8;s2++){
    g.beginPath(); g.arc(x-6+s2*(w+12)/7,y+8,7,0,Math.PI); g.fill();
  }
  g.restore();
}

function rugPersp(g,hz,bx,bw,yA,yB,c1,c2,c3){
  var sA=floorSpan(yA,hz,bx,bw), sB=floorSpan(yB,hz,bx,bw);
  function q(u0,u1,i0,i1,col){
    var a0=lerp(sA[0],sA[1],u0), a1=lerp(sA[0],sA[1],u1);
    var b0=lerp(sB[0],sB[1],i0), b1=lerp(sB[0],sB[1],i1);
    g.beginPath(); g.moveTo(a0,yA); g.lineTo(a1,yA); g.lineTo(b1,yB); g.lineTo(b0,yB);
    g.closePath(); g.fillStyle=col; g.fill();
  }
  q(0.16,0.84,0.16,0.84,c1);
  q(0.20,0.80,0.20,0.80,c2);
  q(0.24,0.76,0.24,0.76,c1);
  g.save();
  g.globalAlpha=0.5; g.fillStyle=c3;
  var mid=(yA+yB)/2, sm=floorSpan(mid,hz,bx,bw);
  g.beginPath(); g.ellipse(lerp(sm[0],sm[1],0.5),mid,(sm[1]-sm[0])*0.17,(yB-yA)*0.19,0,0,TAU()); g.fill();
  g.globalAlpha=0.35;
  for(var d=0;d<6;d++){
    var u=0.30+d*0.08;
    g.beginPath(); g.ellipse(lerp(sm[0],sm[1],u),mid,7,4,0,0,TAU()); g.fill();
  }
  g.restore();
}

function brickArch(g,cx,cy,r,th,col){
  g.save();
  g.strokeStyle=col||'#3a2a1a'; g.lineWidth=th;
  g.beginPath(); g.arc(cx,cy,r,Math.PI,0); g.stroke();
  g.strokeStyle='rgba(0,0,0,0.45)'; g.lineWidth=1.3;
  for(var i=0;i<=13;i++){
    var a=Math.PI+(i/13)*Math.PI;
    g.beginPath();
    g.moveTo(cx+Math.cos(a)*(r-th/2),cy+Math.sin(a)*(r-th/2));
    g.lineTo(cx+Math.cos(a)*(r+th/2),cy+Math.sin(a)*(r+th/2));
    g.stroke();
  }
  g.restore();
}

function ironPlate(g,x,y,w,h,col){
  g.fillStyle=col||'#1d2229'; g.fillRect(x,y,w,h);
  g.strokeStyle='rgba(0,0,0,0.5)'; g.lineWidth=2; g.strokeRect(x,y,w,h);
  g.fillStyle='rgba(190,205,215,0.20)';
  for(var i=x+11;i<x+w-6;i+=26){
    g.beginPath(); g.arc(i,y+9,3,0,TAU()); g.fill();
    g.beginPath(); g.arc(i,y+h-9,3,0,TAU()); g.fill();
  }
  g.fillStyle='rgba(255,255,255,0.05)'; g.fillRect(x,y,w,3);
}

function cabinet(g,x,y,w,h,t){
  g.fillStyle='#2a1c12'; g.fillRect(x,y,w,h);
  g.strokeStyle='rgba(0,0,0,0.55)'; g.lineWidth=2.4; g.strokeRect(x,y,w,h);
  g.fillStyle='#3a2716'; g.fillRect(x-6,y-11,w+12,13);
  g.fillStyle='rgba(255,220,160,0.14)'; g.fillRect(x-6,y-11,w+12,3);
  var cols=3, cw=(w-20)/cols;
  for(var c=0;c<cols;c++){
    var gx=x+10+c*cw;
    g.fillStyle='rgba(120,160,175,0.13)'; g.fillRect(gx,y+10,cw-8,h-22);
    g.strokeStyle='#4a3620'; g.lineWidth=2; g.strokeRect(gx,y+10,cw-8,h-22);
    g.strokeStyle='rgba(0,0,0,0.35)'; g.lineWidth=1;
    g.beginPath(); g.moveTo(gx+(cw-8)/2,y+10); g.lineTo(gx+(cw-8)/2,y+h-12); g.stroke();
    for(var sh=1;sh<3;sh++){
      var sy=y+10+(h-22)*sh/3;
      g.beginPath(); g.moveTo(gx,sy); g.lineTo(gx+cw-8,sy); g.stroke();
      g.fillStyle=P.brass;
      for(var it=0;it<3;it++){
        g.beginPath(); g.arc(gx+9+it*((cw-26)/2),sy-5,4,0,TAU()); g.fill();
      }
    }
    g.fillStyle='rgba(210,235,245,0.06)';
    g.beginPath(); g.moveTo(gx,y+10); g.lineTo(gx+cw-8,y+10); g.lineTo(gx,y+h-12); g.closePath(); g.fill();
  }
}

function marbleFireplace(g,x,y,w,h,t,lit){
  g.fillStyle='#2b2b30'; g.fillRect(x,y,w,h);
  g.fillStyle='#3a3a41'; g.fillRect(x-14,y-16,w+28,18);
  g.fillStyle='rgba(255,255,255,0.13)'; g.fillRect(x-14,y-16,w+28,4);
  g.fillStyle='#24242a'; g.fillRect(x+w*0.16,y+h*0.13,w*0.68,h*0.87);
  g.fillStyle='#0b0b0d'; g.fillRect(x+w*0.20,y+h*0.18,w*0.60,h*0.82);
  g.strokeStyle='rgba(255,255,255,0.07)'; g.lineWidth=1.2;
  for(var i=0;i<5;i++){
    g.beginPath();
    g.moveTo(x+rnd(i)*w,y); g.lineTo(x+rnd(i+3)*w,y+h); g.stroke();
  }
  if(lit){
    var f=0.8+Math.sin(t*6.1)*0.14;
    glow(g,x+w*0.5,y+h*0.72,w*1.1,P.ember,0.30*f);
    g.fillStyle='rgba(255,150,60,'+(0.5*f)+')';
    g.beginPath(); g.ellipse(x+w*0.5,y+h*0.84,w*0.22,h*0.12,0,0,TAU()); g.fill();
  }
  g.fillStyle=P.brass;
  g.fillRect(x+w*0.17,y+h*0.96,w*0.66,5);
}

function shelfClutter(g,x,y,w,t,seed){
  for(var i=0;i<9;i++){
    var bx2=x+6+i*((w-12)/9), hh=10+rnd(seed+i)*22;
    g.fillStyle=['#6b3a2a','#3c5a4a','#5a4a2a','#2f3a4a'][i%4];
    g.fillRect(bx2,y-hh,((w-12)/9)-5,hh);
    g.fillStyle='rgba(255,255,255,0.10)';
    g.fillRect(bx2,y-hh,2,hh);
  }
}
/* ---------- brick texture on the back wall ---------- */
function bricks(g,x,y,w,h,col,alpha){
  g.save(); g.globalAlpha = alpha===undefined?0.30:alpha;
  g.strokeStyle = col||'#000'; g.lineWidth = 1;
  var bh = 15, bw = 38, row = 0;
  for(var yy=y; yy<y+h; yy+=bh){
    g.beginPath(); g.moveTo(x,yy); g.lineTo(x+w,yy); g.stroke();
    var off = (row%2)? bw/2 : 0;
    for(var xx=x+off; xx<x+w; xx+=bw){
      g.beginPath(); g.moveTo(xx,yy); g.lineTo(xx,Math.min(yy+bh,y+h)); g.stroke();
    }
    row++;
  }
  g.restore();
}

/* ---------- first-person: a pool of lamplight on one thing ---------- */
function detailFrame(g,t,tint){
  g.fillStyle = tint||'#0a0806'; g.fillRect(0,0,W,H);
  var gr = g.createRadialGradient(W/2,H*0.50,40,W/2,H*0.50,H*0.86);
  gr.addColorStop(0,'rgba(60,44,26,0.55)');
  gr.addColorStop(0.5,'rgba(24,18,12,0.24)');
  gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0,0,W,H);
  motes(g,t,26,'#f2b45c',6);
}

/* ---------- the stair button ---------- */
function stairButton(g,x,y,r,lit,t){
  g.save();
  // plate
  g.fillStyle = '#1b1610';
  rrect(g,x-r*1.9,y-r*1.9,r*3.8,r*3.8,r*0.4); g.fill();
  g.strokeStyle = 'rgba(168,120,58,0.55)'; g.lineWidth = 1.6; g.stroke();
  // rivets
  g.fillStyle = 'rgba(168,120,58,0.5)';
  var c=[[-1,-1],[1,-1],[-1,1],[1,1]];
  for(var i=0;i<4;i++){
    g.beginPath(); g.arc(x+c[i][0]*r*1.45,y+c[i][1]*r*1.45,r*0.13,0,TAU()); g.fill();
  }
  // bezel
  g.beginPath(); g.arc(x,y,r*1.08,0,TAU());
  g.fillStyle = '#0e0c09'; g.fill();
  g.strokeStyle = P.brass; g.lineWidth = 2; g.stroke();
  // lens
  if(lit){
    var pulse = 0.72+Math.sin(t*3.1)*0.20;
    glow(g,x,y,r*5.5,P.screen,0.42*pulse);
    var lg2 = g.createRadialGradient(x,y-r*0.2,0,x,y,r);
    lg2.addColorStop(0,'#eaffff'); lg2.addColorStop(0.5,P.screen); lg2.addColorStop(1,'#1d7d9c');
    g.fillStyle = lg2;
  } else {
    var dg = g.createRadialGradient(x,y-r*0.2,0,x,y,r);
    dg.addColorStop(0,'#2a2b2c'); dg.addColorStop(1,'#101112');
    g.fillStyle = dg;
  }
  g.beginPath(); g.arc(x,y,r*0.86,0,TAU()); g.fill();
  g.restore();
}

/* ---------- lamps and sconces ---------- */
function sconce(g,x,y,t,scale,col){
  var s = scale||1, c = col||P.lamp;
  var f = 0.88+Math.sin(t*6.3+x)*0.05+Math.sin(t*2.1+x*0.3)*0.05;
  glow(g,x,y,120*s,c,0.30*f);
  g.save();
  g.fillStyle = '#100d09';
  g.beginPath(); g.moveTo(x-7*s,y+13*s); g.lineTo(x+7*s,y+13*s); g.lineTo(x+3*s,y-3*s); g.lineTo(x-3*s,y-3*s); g.closePath(); g.fill();
  g.fillStyle = c; g.globalAlpha = 0.85*f;
  g.beginPath(); g.ellipse(x,y-2*s,4.5*s,7*s,0,0,TAU()); g.fill();
  g.restore();
}

/* ============================================================
   THE FOUR SCREENS
   The only cold light in the house. Found, never presented.
   ============================================================ */

function screenFrame(g,t,x,y,w,h,title){
  g.save();
  glow(g,x+w/2,y+h/2,Math.max(w,h)*0.92,P.screen,0.16);
  g.fillStyle='#04141c';
  rrect(g,x-9,y-9,w+18,h+18,6); g.fill();
  g.strokeStyle='rgba(134,232,255,0.30)'; g.lineWidth=1.4; g.stroke();
  g.fillStyle='#04161f';
  rrect(g,x,y,w,h,3); g.fill();
  g.save();
  rrect(g,x,y,w,h,3); g.clip();
  // grid
  g.strokeStyle='rgba(18,71,92,0.85)'; g.lineWidth=1;
  for(var gx=x; gx<x+w; gx+=26){ g.beginPath(); g.moveTo(gx,y); g.lineTo(gx,y+h); g.stroke(); }
  for(var gy=y; gy<y+h; gy+=26){ g.beginPath(); g.moveTo(x,gy); g.lineTo(x+w,gy); g.stroke(); }
  g.restore();
  if(title){ label(g,title,x+10,y+15,12,'rgba(134,232,255,0.72)'); }
  g.restore();
}

function scanlines(g,x,y,w,h,t){
  g.save();
  rrect(g,x,y,w,h,3); g.clip();
  g.globalAlpha=0.055; g.fillStyle='#000';
  for(var yy=y+(t*26%4); yy<y+h; yy+=4){ g.fillRect(x,yy,w,2); }
  g.globalAlpha=0.05; g.fillStyle=P.screen;
  g.fillRect(x, y + ((t*70)%(h+140)) - 70, w, 46);
  g.restore();
}

/* ---- SCREEN 1 : the columns, and the twist inside them ---- */
function screenColumns(g,t,x,y,w,h,twists){
  screenFrame(g,t,x,y,w,h,'FIG. I  —  THE STANDING CELLS');
  g.save(); rrect(g,x,y,w,h,3); g.clip();

  var n = 4;
  var colW = w*0.115, gap = (w-40)/n;
  var top = y+46, bot = y+h-52;

  for(var i=0;i<n;i++){
    var cxp = x+22+gap*(i+0.5);
    var tw = twists? twists[i] : 1;
    // cylinder body
    var cg = g.createLinearGradient(cxp-colW/2,0,cxp+colW/2,0);
    cg.addColorStop(0,'rgba(12,58,76,0.95)');
    cg.addColorStop(0.45,'rgba(30,120,152,0.85)');
    cg.addColorStop(1,'rgba(10,46,62,0.95)');
    g.fillStyle=cg;
    g.beginPath();
    g.ellipse(cxp,top,colW/2,colW*0.20,0,Math.PI,0);
    g.lineTo(cxp+colW/2,bot); 
    g.ellipse(cxp,bot,colW/2,colW*0.20,0,0,Math.PI);
    g.lineTo(cxp-colW/2,top); g.closePath(); g.fill();
    g.strokeStyle='rgba(134,232,255,0.34)'; g.lineWidth=1; g.stroke();

    // the helix: this is the whole point of the picture
    var turns = 3.1, steps = 130;
    for(var pass=0; pass<2; pass++){
      g.beginPath();
      for(var s=0;s<=steps;s++){
        var u = s/steps;
        var yy = lerp(bot,top,u);
        var ang = u*turns*TAU()*tw - t*2.0*tw + pass*Math.PI;
        var xx = cxp + Math.sin(ang)*colW*0.42;
        var depth = Math.cos(ang);
        if(s===0) g.moveTo(xx,yy); else g.lineTo(xx,yy);
        if(s===steps) break;
      }
      g.strokeStyle = pass? 'rgba(134,232,255,0.30)' : 'rgba(190,246,255,0.92)';
      g.lineWidth = pass?1.4:2.2; g.stroke();
    }
    // travelling bead, so the direction of the twist is unmistakable
    var bu = (t*0.30 + i*0.17) % 1;
    var bang = bu*turns*TAU()*tw - t*2.0*tw;
    var bx2 = cxp+Math.sin(bang)*colW*0.42, by2 = lerp(bot,top,bu);
    glow(g,bx2,by2,17,'#ffffff',0.75);
    g.fillStyle='#eaffff'; g.beginPath(); g.arc(bx2,by2,3.1,0,TAU()); g.fill();

    // twist marker underneath
    g.save();
    g.translate(cxp,bot+26);
    g.strokeStyle = 'rgba(134,232,255,0.85)'; g.lineWidth=1.8;
    g.beginPath(); g.arc(0,0,9,0.5,0.5+Math.PI*1.4,tw<0); g.stroke();
    var aa = tw>0? 0.5+Math.PI*1.4 : 0.5;
    var ax = Math.cos(aa)*9, ay = Math.sin(aa)*9;
    g.beginPath(); g.moveTo(ax,ay);
    g.lineTo(ax-tw*4.5, ay-5.5); g.lineTo(ax+tw*2.2, ay+5.5); g.closePath();
    g.fillStyle='rgba(134,232,255,0.9)'; g.fill();
    g.restore();
  }
  // rotation axis
  g.strokeStyle='rgba(134,232,255,0.22)'; g.setLineDash([5,7]); g.lineWidth=1.2;
  g.beginPath(); g.moveTo(x+w-26,y+30); g.lineTo(x+w-26,y+h-30); g.stroke();
  g.setLineDash([]);
  label(g,'axis',x+w-32,y+h-20,10,'rgba(134,232,255,0.5)','right');
  g.restore();
  scanlines(g,x,y,w,h,t);
}

/* ---- SCREEN 2 : one organised direction out of many ---- */
function screenDipole(g,t,x,y,w,h,order){
  screenFrame(g,t,x,y,w,h,'FIG. II  —  THE SUM OF ALL NEEDLES');
  g.save(); rrect(g,x,y,w,h,3); g.clip();
  var cxp=x+w*0.5, cyp=y+h*0.52, R=h*0.155;
  var o = clamp(order===undefined?1:order,0,1);

  // field lines
  var Ls=[1.55,2.15,2.95,3.95];
  for(var li=0;li<Ls.length;li++){
    for(var side=-1;side<=1;side+=2){
      g.beginPath(); var started=false;
      for(var th=0.02; th<Math.PI; th+=0.018){
        var r = Ls[li]*Math.sin(th)*Math.sin(th);
        if(r<1.0){ started=false; continue; }
        var px = cxp + side*r*Math.sin(th)*R;
        var py = cyp - r*Math.cos(th)*R;
        if(!started){ g.moveTo(px,py); started=true; } else g.lineTo(px,py);
      }
      g.strokeStyle='rgba(134,232,255,'+(0.13+0.34*o)+')';
      g.lineWidth=1.5; g.stroke();
    }
  }
  // flow along one line
  for(var d=0; d<9; d++){
    var u=((t*0.13 + d/9)%1);
    var th2 = 0.30 + u*(Math.PI-0.60);
    var L2 = 2.95;
    var r2 = L2*Math.sin(th2)*Math.sin(th2);
    if(r2<1.0) continue;
    for(var sd=-1; sd<=1; sd+=2){
      var px2 = cxp + sd*r2*Math.sin(th2)*R, py2 = cyp - r2*Math.cos(th2)*R;
      g.fillStyle='rgba(190,246,255,'+(0.75*o)+')';
      g.beginPath(); g.arc(px2,py2,2.1,0,TAU()); g.fill();
    }
  }
  // the body
  var bg2=g.createRadialGradient(cxp-R*0.3,cyp-R*0.4,R*0.1,cxp,cyp,R);
  bg2.addColorStop(0,'#1d6d8b'); bg2.addColorStop(1,'#06212c');
  g.fillStyle=bg2; g.beginPath(); g.arc(cxp,cyp,R,0,TAU()); g.fill();
  g.strokeStyle='rgba(134,232,255,0.6)'; g.lineWidth=1.3; g.stroke();
  // the axis
  g.save();
  g.strokeStyle='rgba(255,255,255,'+(0.25+0.6*o)+')'; g.lineWidth=2.4;
  g.setLineDash([7,6]);
  g.beginPath(); g.moveTo(cxp,cyp-R*1.75); g.lineTo(cxp,cyp+R*1.75); g.stroke();
  g.setLineDash([]); g.restore();

  // the disagreeing needles around the edge
  for(var i2=0;i2<20;i2++){
    var a2 = (i2/20)*TAU()+0.17;
    var rr2 = h*0.40 + (rnd(i2)*0.06)*h;
    var nx = cxp+Math.cos(a2)*rr2*1.35, ny = cyp+Math.sin(a2)*rr2*0.80;
    if(nx<x+14||nx>x+w-14||ny<y+26||ny>y+h-14) continue;
    var chaotic = (rnd(i2*3)-0.5)*TAU() + Math.sin(t*1.7+i2)*0.5;
    var ang3 = lerp(chaotic, -Math.PI/2, o);
    g.save(); g.translate(nx,ny); g.rotate(ang3);
    g.strokeStyle='rgba(134,232,255,0.72)'; g.lineWidth=1.6;
    g.beginPath(); g.moveTo(0,6); g.lineTo(0,-6); g.stroke();
    g.fillStyle='#ff9a7d'; g.beginPath(); g.arc(0,-6,2.1,0,TAU()); g.fill();
    g.restore();
  }
  g.restore();
  scanlines(g,x,y,w,h,t);
}

/* ---- SCREEN 3 : the whole house as one circuit ---- */
function screenCircuit(g,t,x,y,w,h,highlight){
  screenFrame(g,t,x,y,w,h,'FIG. III  —  THE LONG CIRCUIT');
  g.save(); rrect(g,x,y,w,h,3); g.clip();
  var L=x+w*0.20, R2=x+w*0.80, TOP=y+h*0.20, BOT=y+h*0.80;

  // house outline in section
  g.strokeStyle='rgba(134,232,255,0.26)'; g.lineWidth=1.2;
  g.strokeRect(x+w*0.13,TOP-18,w*0.74,(BOT+18)-(TOP-18));
  for(var f=1;f<4;f++){
    var fy = lerp(TOP-18,BOT+18,f/4);
    g.beginPath(); g.moveTo(x+w*0.13,fy); g.lineTo(x+w*0.87,fy); g.stroke();
  }
  // the source, down in the cellar
  g.fillStyle='rgba(30,120,152,0.55)';
  g.beginPath(); g.ellipse((L+R2)/2,BOT,w*0.16,h*0.055,0,0,TAU()); g.fill();
  label(g,'source',(L+R2)/2,BOT+h*0.10,11,'rgba(134,232,255,0.55)','center');

  // the three candidate runs
  var runs=[
    {x:L,  ok:false, br:0.42},
    {x:(L+R2)/2, ok:true, br:0},
    {x:R2, ok:false, br:0.68}
  ];
  for(var i=0;i<runs.length;i++){
    var r=runs[i], on = (highlight===undefined)? r.ok : (highlight===i);
    g.strokeStyle = on? 'rgba(190,246,255,0.95)':'rgba(134,232,255,0.22)';
    g.lineWidth = on?2.6:1.6;
    g.beginPath(); g.moveTo(r.x,BOT); g.lineTo(r.x,TOP); g.stroke();
    if(r.br>0){
      var byy = lerp(BOT,TOP,r.br);
      g.save(); g.strokeStyle='#0a1418'; g.lineWidth=5.5;
      g.beginPath(); g.moveTo(r.x-9,byy); g.lineTo(r.x+9,byy); g.stroke();
      g.restore();
      g.strokeStyle='rgba(255,138,61,0.85)'; g.lineWidth=1.6;
      g.beginPath(); g.moveTo(r.x-7,byy-5); g.lineTo(r.x+7,byy+5);
      g.moveTo(r.x-7,byy+5); g.lineTo(r.x+7,byy-5); g.stroke();
    }
  }
  // the roof return
  g.strokeStyle='rgba(134,232,255,0.34)'; g.lineWidth=1.6;
  g.beginPath(); g.moveTo(L,TOP); g.lineTo(R2,TOP); g.stroke();

  // the conducting floor: the resistive end of it all
  var flg=g.createLinearGradient(0,BOT-6,0,BOT+6);
  flg.addColorStop(0,'rgba(134,232,255,0)');
  flg.addColorStop(0.5,'rgba(134,232,255,0.42)');
  flg.addColorStop(1,'rgba(134,232,255,0)');
  g.fillStyle=flg; g.fillRect(x+w*0.13,BOT-6,w*0.74,12);

  // current, running the whole loop
  var path=[[ (L+R2)/2,BOT],[ (L+R2)/2,TOP],[R2,TOP],[R2,BOT],[(L+R2)/2,BOT]];
  var segs=[];
  var total=0;
  for(var s=0;s<path.length-1;s++){
    var dx=path[s+1][0]-path[s][0], dy=path[s+1][1]-path[s][1];
    var len=Math.hypot(dx,dy); segs.push({a:path[s],b:path[s+1],len:len}); total+=len;
  }
  for(var d2=0; d2<14; d2++){
    var u2=((t*0.16 + d2/14)%1)*total, acc=0, pt=null;
    for(var s2=0;s2<segs.length;s2++){
      if(u2<=acc+segs[s2].len){
        var uu=(u2-acc)/segs[s2].len;
        pt=[lerp(segs[s2].a[0],segs[s2].b[0],uu), lerp(segs[s2].a[1],segs[s2].b[1],uu)];
        break;
      }
      acc+=segs[s2].len;
    }
    if(!pt) continue;
    glow(g,pt[0],pt[1],13,P.screen,0.5);
    g.fillStyle='#eaffff'; g.beginPath(); g.arc(pt[0],pt[1],2.4,0,TAU()); g.fill();
  }
  g.restore();
  scanlines(g,x,y,w,h,t);
}

/* ---- SCREEN 4 : the thing itself, at last ---- */
function screenMagnetosphere(g,t,x,y,w,h,opt){
  opt = opt||{};
  screenFrame(g,t,x,y,w,h,opt.title||'FIG. IV  —  THE WHOLE ARRANGEMENT');
  g.save(); rrect(g,x,y,w,h,3); g.clip();
  var ex=x+w*0.40, ey=y+h*0.52, R=h*0.085;
  var press = opt.pressure===undefined? 0.35+Math.sin(t*0.6)*0.35 : opt.pressure;
  var r0 = (w*0.30)*(1-0.30*press);

  // the wind
  for(var i=0;i<16;i++){
    var wy = y+14+ (i/16)*(h-28) + Math.sin(t*1.2+i)*3;
    var wu = ((t*(0.20+press*0.28) + i*0.061)%1);
    var wx = x+6 + wu*(w*0.30);
    var far = Math.abs(wy-ey)>h*0.30;
    g.strokeStyle='rgba(255,176,110,'+(0.16+press*0.34)*(far?1:0.5)+')';
    g.lineWidth=1.3;
    g.beginPath(); g.moveTo(wx,wy); g.lineTo(wx+13,wy); g.stroke();
  }

  // magnetopause (Shue-ish)
  function mpPoint(th){
    var r = r0*Math.pow(2/(1+Math.cos(th)),0.58);
    return [ex - r*Math.cos(th), ey + r*Math.sin(th)];
  }
  for(var sgn=-1; sgn<=1; sgn+=2){
    g.beginPath();
    for(var th=0; th<2.55; th+=0.03){
      var p=mpPoint(th); var px=p[0], py=ey+sgn*(p[1]-ey);
      if(th===0) g.moveTo(px,py); else g.lineTo(px,py);
    }
    g.strokeStyle='rgba(134,232,255,'+(0.55+press*0.35)+')'; g.lineWidth=2.1; g.stroke();
  }
  // bow shock
  for(var sgn2=-1; sgn2<=1; sgn2+=2){
    g.beginPath();
    for(var th2=0; th2<2.4; th2+=0.04){
      var r3=(r0*1.34)*Math.pow(2/(1+Math.cos(th2)),0.72);
      var px3=ex-r3*Math.cos(th2), py3=ey+sgn2*r3*Math.sin(th2);
      if(th2===0) g.moveTo(px3,py3); else g.lineTo(px3,py3);
    }
    g.strokeStyle='rgba(255,176,110,0.26)'; g.lineWidth=1.3; g.setLineDash([6,6]); g.stroke(); g.setLineDash([]);
  }
  // tail lobes
  g.strokeStyle='rgba(134,232,255,0.30)'; g.lineWidth=1.3;
  for(var lb=1; lb<=3; lb++){
    var off=lb*h*0.055;
    g.beginPath();
    g.moveTo(ex+R*1.1, ey-off*0.6); 
    g.bezierCurveTo(ex+w*0.14, ey-off, ex+w*0.26, ey-off, x+w-8, ey-off);
    g.stroke();
    g.beginPath();
    g.moveTo(ex+R*1.1, ey+off*0.6);
    g.bezierCurveTo(ex+w*0.14, ey+off, ex+w*0.26, ey+off, x+w-8, ey+off);
    g.stroke();
  }

  // dayside and tail reconnection points
  var rc = opt.recon===undefined? (0.5+0.5*Math.sin(t*1.5)) : opt.recon;
  var dp = mpPoint(0.0);
  if(rc>0.15){
    glow(g,dp[0],dp[1],26*rc,'#ffd08a',0.55*rc);
    g.strokeStyle='rgba(255,208,138,'+rc+')'; g.lineWidth=2;
    g.beginPath();
    g.moveTo(dp[0]-9,dp[1]-9); g.lineTo(dp[0]+9,dp[1]+9);
    g.moveTo(dp[0]-9,dp[1]+9); g.lineTo(dp[0]+9,dp[1]-9); g.stroke();
    var tx=ex+w*0.30;
    glow(g,tx,ey,24*rc,'#ffd08a',0.5*rc);
    g.strokeStyle='rgba(255,208,138,'+rc+')';
    g.beginPath();
    g.moveTo(tx-9,ey-9); g.lineTo(tx+9,ey+9);
    g.moveTo(tx-9,ey+9); g.lineTo(tx+9,ey-9); g.stroke();
  }
  // returning flux
  if(opt.cycle!==false){
    for(var d3=0; d3<10; d3++){
      var u3=((t*0.19 + d3/10)%1);
      var px4, py4;
      if(u3<0.5){ var uu2=u3/0.5; px4=lerp(dp[0],ex+w*0.30,uu2); py4=ey-h*0.20*Math.sin(uu2*Math.PI)-h*0.02; }
      else { var uu3=(u3-0.5)/0.5; px4=lerp(ex+w*0.30,ex+R*1.3,uu3); py4=ey+h*0.10*Math.sin(uu3*Math.PI); }
      g.fillStyle='rgba(190,246,255,0.85)';
      g.beginPath(); g.arc(px4,py4,2.2,0,TAU()); g.fill();
    }
  }
  // the ring current
  var ring = opt.ring===undefined? (0.35+0.35*Math.sin(t*0.8+1)) : opt.ring;
  if(ring>0.03){
    g.save();
    g.strokeStyle='rgba(255,138,61,'+(0.30+ring*0.6)+')';
    g.lineWidth=2+ring*4.5;
    g.beginPath(); g.ellipse(ex,ey,R*2.25,R*0.78,0,0,TAU()); g.stroke();
    glow(g,ex,ey,R*3.6,'#ff8a3d',0.20*ring);
    for(var rp=0; rp<7; rp++){
      var ra=((t*-0.5 + rp/7)%1)*TAU();
      g.fillStyle='rgba(255,196,130,'+(0.5+ring*0.5)+')';
      g.beginPath(); g.arc(ex+Math.cos(ra)*R*2.25, ey+Math.sin(ra)*R*0.78, 2.2,0,TAU()); g.fill();
    }
    g.restore();
  }
  // the body
  var eg=g.createRadialGradient(ex-R*0.35,ey-R*0.4,R*0.1,ex,ey,R);
  eg.addColorStop(0,'#2a86a6'); eg.addColorStop(1,'#05202a');
  g.fillStyle=eg; g.beginPath(); g.arc(ex,ey,R,0,TAU()); g.fill();
  g.strokeStyle='rgba(134,232,255,0.7)'; g.lineWidth=1.2; g.stroke();

  if(opt.labels){
    label(g,'pressure',x+12,y+h-16,11,'rgba(255,176,110,0.7)');
    label(g,'boundary',ex-r0-4,ey-h*0.30,11,'rgba(134,232,255,0.75)','right');
  }
  g.restore();
  scanlines(g,x,y,w,h,t);
}

/* ============================================================
   FURNISHINGS — drawn once, used in wide shots and close-ups
   ============================================================ */

function ironStove(g,x,y,w,h,t,heat){
  var f = 0.72+Math.sin(t*7.3)*0.10+Math.sin(t*3.1+1)*0.14;
  if(heat>0.02) glow(g,x+w*0.5,y+h*0.58,w*1.55*heat,P.ember,0.40*heat*f);
  g.save();
  g.fillStyle='#131009'; rrect(g,x,y+h*0.10,w,h*0.90,6); g.fill();
  g.strokeStyle='#2f2419'; g.lineWidth=2; g.stroke();
  // crown
  g.fillStyle='#181209'; rrect(g,x-w*0.06,y,w*1.12,h*0.13,4); g.fill();
  // flue
  g.fillStyle='#161109'; g.fillRect(x+w*0.38,y-h*0.55,w*0.20,h*0.56);
  g.strokeStyle='#2f2419'; g.strokeRect(x+w*0.38,y-h*0.55,w*0.20,h*0.56);
  // legs
  g.fillStyle='#120e08';
  g.fillRect(x+w*0.06,y+h,w*0.10,h*0.11); g.fillRect(x+w*0.84,y+h,w*0.10,h*0.11);
  // firebox
  var fx=x+w*0.17, fy=y+h*0.34, fw=w*0.66, fh=h*0.36;
  g.fillStyle='#070503'; rrect(g,fx,fy,fw,fh,3); g.fill();
  if(heat>0.02){
    var eg=g.createLinearGradient(0,fy,0,fy+fh);
    eg.addColorStop(0,'rgba(255,208,138,'+(0.85*heat*f)+')');
    eg.addColorStop(1,'rgba(255,90,20,'+(0.55*heat*f)+')');
    g.fillStyle=eg; rrect(g,fx+2,fy+2,fw-4,fh-4,2); g.fill();
  }
  // grate bars
  g.strokeStyle='#0a0705'; g.lineWidth=2.4;
  for(var i=1;i<6;i++){
    g.beginPath(); g.moveTo(fx+fw*i/6,fy); g.lineTo(fx+fw*i/6,fy+fh); g.stroke();
  }
  g.strokeStyle='#3a2d1e'; g.lineWidth=1.6; rrect(g,fx,fy,fw,fh,3); g.stroke();
  // a cold rim so the shape still reads with the fire out
  g.strokeStyle='rgba(196,170,126,0.28)'; g.lineWidth=1.6;
  g.beginPath(); g.moveTo(x+w*0.02,y+h*0.12); g.lineTo(x+w*0.02,y+h*0.98); g.stroke();
  g.beginPath(); g.moveTo(x-w*0.05,y+h*0.015); g.lineTo(x+w*1.06,y+h*0.015); g.stroke();
  g.restore();
}

function glassColumn(g,x,y,w,h,t,freeze,threads){
  g.save();
  // liquid
  var lg=g.createLinearGradient(x,0,x+w,0);
  lg.addColorStop(0,'rgba(16,44,58,0.92)');
  lg.addColorStop(0.4,'rgba(34,86,108,0.80)');
  lg.addColorStop(1,'rgba(12,34,46,0.92)');
  g.fillStyle=lg; rrect(g,x,y,w,h,w*0.30); g.fill();

  var iceTop = y+h-(h*0.10+h*0.34*freeze);
  // rising filaments — the whole point of the thing
  if(threads>0.02){
    g.save();
    rrect(g,x,y,w,h,w*0.30); g.clip();
    for(var i=0;i<9;i++){
      var seed=rnd(i*2+1);
      var bx=x+w*(0.12+0.76*seed);
      var u=((t*(0.16+seed*0.16)+seed)%1);
      var yy=lerp(iceTop, y+h*0.06, u);
      var amp=w*0.10*Math.sin(u*Math.PI);
      g.beginPath();
      for(var s=0;s<=16;s++){
        var su=s/16, sy=lerp(iceTop,yy,su);
        var sx=bx+Math.sin(su*4.2+t*1.7+i)*amp;
        if(s===0) g.moveTo(sx,sy); else g.lineTo(sx,sy);
      }
      g.strokeStyle='rgba(190,240,255,'+(0.55*threads*(1-u*0.55))+')';
      g.lineWidth=1.5; g.stroke();
      glow(g,bx+Math.sin(4.2+t*1.7+i)*amp,yy,9,'#cfeeff',0.32*threads);
    }
    g.restore();
  }
  // the freezing plate
  var ig=g.createLinearGradient(0,iceTop,0,y+h);
  ig.addColorStop(0,'rgba(198,232,246,0.92)');
  ig.addColorStop(1,'rgba(120,170,192,0.95)');
  g.fillStyle=ig;
  g.save(); rrect(g,x,y,w,h,w*0.30); g.clip();
  g.beginPath();
  g.moveTo(x,iceTop+Math.sin(t*0.9)*1.2);
  for(var s2=0;s2<=10;s2++){
    g.lineTo(x+w*s2/10, iceTop+Math.sin(t*0.9+s2*0.8)*1.8);
  }
  g.lineTo(x+w,y+h); g.lineTo(x,y+h); g.closePath(); g.fill();
  g.restore();
  // glass
  g.strokeStyle='rgba(200,230,240,0.45)'; g.lineWidth=2;
  rrect(g,x,y,w,h,w*0.30); g.stroke();
  g.strokeStyle='rgba(255,255,255,0.22)'; g.lineWidth=3;
  g.beginPath(); g.moveTo(x+w*0.22,y+h*0.10); g.lineTo(x+w*0.22,y+h*0.82); g.stroke();
  // brass collars
  g.fillStyle='#7d5a2b';
  g.fillRect(x-3,y-8,w+6,11); g.fillRect(x-3,y+h-3,w+6,11);
  g.restore();
}

function brickColumn(g,x,yTop,yBot,w,t,spin,lit){
  var ew = w*0.5, eh = w*0.17;
  g.save();
  var cg=g.createLinearGradient(x-w/2,0,x+w/2,0);
  cg.addColorStop(0,'#150f0a'); cg.addColorStop(0.42,lit?'#4a3520':'#2e2114'); cg.addColorStop(1,'#120d08');
  g.fillStyle=cg;
  g.beginPath();
  g.ellipse(x,yTop,ew,eh,0,Math.PI,0);
  g.lineTo(x+ew,yBot); g.ellipse(x,yBot,ew,eh,0,0,Math.PI); g.lineTo(x-ew,yTop);
  g.closePath(); g.fill();
  // banding that turns, so you can see it is moving
  g.save();
  g.beginPath();
  g.moveTo(x-ew,yTop); g.lineTo(x+ew,yTop); g.lineTo(x+ew,yBot); g.lineTo(x-ew,yBot); g.closePath();
  g.clip();
  for(var b=0;b<7;b++){
    var by = lerp(yTop,yBot,(b+0.5)/7);
    var ph = t*spin*0.9 + b*0.42;
    var bx = x + Math.sin(ph)*ew*0.62;
    g.globalAlpha = 0.34+0.30*Math.cos(ph);
    g.fillStyle = lit? '#6b4c26':'#3d2c1a';
    g.beginPath(); g.ellipse(bx,by,ew*0.30,eh*1.5,0,0,TAU()); g.fill();
  }
  g.restore();
  // cap
  g.fillStyle=lit?'#563d22':'#332514';
  g.beginPath(); g.ellipse(x,yTop,ew,eh,0,0,TAU()); g.fill();
  g.strokeStyle='rgba(0,0,0,0.5)'; g.lineWidth=1.2; g.stroke();
  g.restore();
}

/* ---------- smaller things, and better light ---------- */
function lampPool(g,x,y,rx,ry,col,a){
  var gr=g.createRadialGradient(x,y,0,x,y,rx);
  gr.addColorStop(0,col); gr.addColorStop(1,'rgba(0,0,0,0)');
  g.save(); g.globalAlpha=a===undefined?0.16:a; g.globalCompositeOperation='lighter';
  g.fillStyle=gr;
  g.beginPath(); g.ellipse(x,y,rx,ry,0,0,TAU()); g.fill();
  g.restore();
}

function cobweb(g,x,y,r,dir){
  g.save(); g.translate(x,y); g.scale(dir||1,1);
  g.strokeStyle='rgba(210,215,220,0.13)'; g.lineWidth=1;
  for(var i=0;i<=5;i++){
    var a=(i/5)*(Math.PI/2);
    g.beginPath(); g.moveTo(0,0); g.lineTo(Math.cos(a)*r,Math.sin(a)*r); g.stroke();
  }
  for(var k=1;k<=4;k++){
    var rr=r*k/4;
    g.beginPath();
    for(var j=0;j<=5;j++){
      var a2=(j/5)*(Math.PI/2);
      var px=Math.cos(a2)*rr, py=Math.sin(a2)*rr;
      if(j===0) g.moveTo(px,py); else g.quadraticCurveTo(px*0.86,py*0.86,px,py);
    }
    g.stroke();
  }
  g.restore();
}

function chainDrop(g,x,yTop,len,s){
  s=s||1;
  g.save(); g.strokeStyle='#39424c'; g.lineWidth=2.4*s;
  for(var i=0;i<len/(7*s);i++){
    var yy=yTop+i*7*s;
    g.beginPath(); g.ellipse(x,yy,3.2*s,4.2*s,0,0,TAU()); g.stroke();
  }
  g.restore();
}

function hangingLantern(g,x,yTop,t,s,len){
  s=s||1; len=len||46;
  var sw=Math.sin(t*0.7+x*0.01)*3*s;
  chainDrop(g,x,yTop,len,s);
  var ly=yTop+len, lx=x+sw;
  g.save();
  g.strokeStyle='#4a3a22'; g.lineWidth=2*s;
  g.beginPath(); g.moveTo(x,ly); g.lineTo(lx,ly+6*s); g.stroke();
  g.fillStyle='#2a2117';
  g.beginPath(); g.moveTo(lx-11*s,ly+8*s); g.lineTo(lx+11*s,ly+8*s);
  g.lineTo(lx+8*s,ly+2*s); g.lineTo(lx-8*s,ly+2*s); g.closePath(); g.fill();
  g.fillRect(lx-10*s,ly+30*s,20*s,6*s);
  var f=0.84+Math.sin(t*6.4+x)*0.10;
  glow(g,lx,ly+20*s,86*s,P.lamp,0.26*f);
  g.fillStyle='rgba(255,226,170,'+(0.30*f)+')';
  g.fillRect(lx-9*s,ly+8*s,18*s,22*s);
  g.fillStyle='rgba(255,236,190,'+(0.9*f)+')';
  g.beginPath(); g.ellipse(lx,ly+20*s,4*s,7*s,0,0,TAU()); g.fill();
  g.strokeStyle='#4a3a22'; g.lineWidth=1.6*s;
  g.strokeRect(lx-9*s,ly+8*s,18*s,22*s);
  g.beginPath(); g.moveTo(lx,ly+8*s); g.lineTo(lx,ly+30*s); g.stroke();
  g.restore();
}

function fireIrons(g,x,y,s){
  s=s||1;
  g.save(); g.strokeStyle='#5c5348'; g.lineWidth=2.4*s; g.lineCap='round';
  g.beginPath(); g.moveTo(x,y); g.lineTo(x,y-52*s); g.stroke();
  g.beginPath(); g.arc(x,y-56*s,5*s,0,TAU()); g.stroke();
  for(var i=0;i<3;i++){
    var ix=x+8*s+i*7*s;
    g.strokeStyle='#4e463c'; g.lineWidth=2*s;
    g.beginPath(); g.moveTo(ix,y); g.lineTo(ix+2*s,y-46*s); g.stroke();
  }
  g.beginPath(); g.moveTo(x+8*s,y); g.lineTo(x+26*s,y); g.stroke();
  g.restore();
}

function stoneSink(g,x,y,w,h){
  g.fillStyle='#2b2a26'; g.fillRect(x,y,w,h);
  g.fillStyle='rgba(255,255,255,0.10)'; g.fillRect(x,y,w,4);
  g.fillStyle='#14150f'; g.fillRect(x+6,y+5,w-12,h-12);
  g.fillStyle='rgba(120,160,175,0.12)'; g.fillRect(x+6,y+h-14,w-12,8);
  g.strokeStyle=P.brass; g.lineWidth=3;
  g.beginPath(); g.moveTo(x+w*0.5,y-26); g.lineTo(x+w*0.5,y-8);
  g.lineTo(x+w*0.5-13,y-8); g.stroke();
  g.fillStyle='#1a1812'; g.fillRect(x-4,y+h,w+8,7);
}

function mothsAt(g,x,y,t,n,s){
  s=s||1; n=n||3;

    var mx=x+Math.cos(t*spd+ph)*r*1.6, my=y+Math.sin(t*spd*1.7+ph)*r*0.65;

    g.save(); g.translate(mx,my);
    g.fillStyle='rgba(228,212,176,0.50)';
    g.beginPath(); g.ellipse(-2.3*s,0,2.5*s,(0.9+flap*2.4)*s,-0.5,0,TAU()); g.fill();
    g.beginPath(); g.ellipse( 2.3*s,0,2.5*s,(0.9+flap*2.4)*s, 0.5,0,TAU()); g.fill();
    g.fillStyle='rgba(58,48,36,0.75)'; g.fillRect(-0.8*s,-2*s,1.6*s,4.2*s);
    g.restore();
  }
}

function spiderThread(g,x,yTop,t,len){
  len=len||150;
  var drop=yTop+len*0.5+Math.sin(t*0.33+x*0.01)*len*0.44;
  g.save();
  g.strokeStyle='rgba(212,218,224,0.13)'; g.lineWidth=1;
  g.beginPath(); g.moveTo(x,yTop); g.lineTo(x,drop); g.stroke();
  g.fillStyle='rgba(16,14,12,0.92)';
  g.beginPath(); g.ellipse(x,drop,3.4,2.7,0,0,TAU()); g.fill();
  g.strokeStyle='rgba(16,14,12,0.85)'; g.lineWidth=1;
  for(var i=0;i<4;i++){
    var a=0.45+i*0.34;
    g.beginPath(); g.moveTo(x,drop); g.lineTo(x-Math.cos(a)*8,drop+Math.sin(a)*5-2.5); g.stroke();
    g.beginPath(); g.moveTo(x,drop); g.lineTo(x+Math.cos(a)*8,drop+Math.sin(a)*5-2.5); g.stroke();
  }
  g.restore();
}

function mouseRun(g,x0,x1,y,t,seed){

  if(ph>0.26) return;
  var u=ph/0.26, mx=lerp(x0,x1,u), bob=Math.abs(Math.sin(u*52))*1.7;
  g.save(); g.translate(mx,y-bob); g.scale(x1>x0?1:-1,1);
  g.fillStyle='#2b241c';
  g.beginPath(); g.ellipse(0,0,7,3.5,0,0,TAU()); g.fill();
  g.beginPath(); g.arc(6,-1.3,2.8,0,TAU()); g.fill();
  g.beginPath(); g.arc(4.4,-3.8,1.9,0,TAU()); g.fill();
  g.strokeStyle='#2b241c'; g.lineWidth=1.2;
  g.beginPath(); g.moveTo(-6,0); g.quadraticCurveTo(-14,-2,-17,2); g.stroke();
  g.restore();
}

  g.beginPath(); g.moveTo(-21*s,-17*s-br); g.lineTo(-19*s,-23*s-br); g.lineTo(-14.5*s,-16*s-br); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(-13*s,-16.5*s-br); g.lineTo(-10*s,-22*s-br); g.lineTo(-8*s,-15*s-br); g.closePath(); g.fill();
  g.strokeStyle='#8a5530'; g.lineWidth=4.6*s; g.lineCap='round';
  g.beginPath(); g.moveTo(17*s,-5*s); g.quadraticCurveTo(28*s,3*s,10*s,2*s); g.stroke();
  g.fillStyle='#b3763f';
  g.beginPath(); g.ellipse(-3*s,-12*s-br,14*s,4.6*s,-0.13,0,TAU()); g.fill();
  g.fillStyle='rgba(236,208,168,0.55)';
  g.beginPath(); g.ellipse(4*s,-4*s,11*s,2.8*s,0,0,TAU()); g.fill();
  g.strokeStyle='rgba(70,40,22,0.45)'; g.lineWidth=1.3*s;
  for(var st5=0;st5<3;st5++){

  }
  g.restore();
}

function glassDome(g,x,y,w,h,kind){
  g.fillStyle='#2a1c12'; rrect(g,x-w*0.62,y,w*1.24,h*0.13,3); g.fill();

    g.beginPath(); g.arc(x+w*0.16,y-h*0.53,w*0.10,0,TAU()); g.fill();
    g.fillStyle='#96702c';
    g.beginPath(); g.moveTo(x+w*0.25,y-h*0.54); g.lineTo(x+w*0.36,y-h*0.51); g.lineTo(x+w*0.25,y-h*0.48); g.closePath(); g.fill();

    g.beginPath(); g.arc(x+w*0.19,y-h*0.55,1.3,0,TAU()); g.fill();
  } else {
    for(var i=0;i<7;i++){
      var a=-Math.PI/2+(i-3)*0.33;
      g.strokeStyle='#33482f'; g.lineWidth=1.5;
      g.beginPath(); g.moveTo(x,y-h*0.06);
      g.lineTo(x+Math.cos(a)*w*0.30,y-h*0.06+Math.sin(a)*h*0.46); g.stroke();

    }
  }
  g.save();

  g.beginPath(); g.arc(x+w*0.5,y+h*0.5,Math.min(w,h)*0.22,0,TAU()); g.stroke();
  g.restore();
  g.restore();
}

/* ---------- the sky, used three times only ---------- */
function auroraSky(g,t,inten,yTop){
  g.save();
  g.globalCompositeOperation='lighter';
  var curtains=[
    {seed:0.0, col:'94,240,168', amp:34, hgt:150, spd:0.30},
    {seed:2.4, col:'67,199,232', amp:52, hgt:116, spd:0.21},
    {seed:5.1, col:'143,123,240', amp:28, hgt:92,  spd:0.38}
  ];
  for(var c=0;c<curtains.length;c++){
    var cu=curtains[c];
    for(var i=0;i<=190;i++){
      var u=i/190, x=u*W;
      var yy=yTop + Math.sin(u*3.4+t*cu.spd+cu.seed)*cu.amp
                  + Math.sin(u*8.1+t*cu.spd*1.7+cu.seed)*cu.amp*0.42
                  + c*16;
      var hh=cu.hgt*(0.55+0.45*Math.sin(u*11+t*0.8+cu.seed))*inten;
      if(hh<=1) continue;
      var a=(0.040+0.046*Math.sin(u*13+t*1.3+cu.seed))*inten;
      if(a<=0) continue;
      a*= Math.min(1, Math.min(u,1-u)*7);
      var gr=g.createLinearGradient(0,yy,0,yy+hh);
      gr.addColorStop(0,'rgba('+cu.col+',0)');
      gr.addColorStop(0.35,'rgba('+cu.col+','+a+')');
      gr.addColorStop(1,'rgba('+cu.col+',0)');
      g.fillStyle=gr;
      g.fillRect(x-14,yy,29,hh);
    }
  }
  g.restore();
}

function starfield(g,t,n,yMax){
  g.save();
  for(var i=0;i<n;i++){
    var x=rnd(i*1.7)*W, y=rnd(i*2.9)*(yMax||H*0.6);
    var tw=0.35+0.65*Math.abs(Math.sin(t*(0.6+rnd(i)*1.6)+i));
    g.fillStyle='rgba(224,232,244,'+(0.22+tw*0.55)*(0.4+rnd(i*5)*0.6)+')';
    g.beginPath(); g.arc(x,y,0.6+rnd(i*3)*1.1,0,TAU()); g.fill();
  }
  g.restore();
}

/* ============================================================
   THE VOICES
   Read by the browser. No network, nothing to download.
   ============================================================ */
var SPEECH = (typeof window!=='undefined' && window.speechSynthesis) ? window.speechSynthesis : null;
var VOX = {
  on:false, token:0, primed:false, loaded:false, userSet:false,
  list:[], chosen:null, best:null, bestScore:0, audio:null,
  prof:{
    narrator:{voice:null,rate:0.94,pitch:1.02},
    nadia:   {voice:null,rate:0.97,pitch:1.08},
    wren:    {voice:null,rate:1.06,pitch:1.34},
    ted:     {voice:null,rate:1.00,pitch:0.80}
  }
};

function voxActive(){ return !!((SPEECH||voxProvider()) && VOX.on); }

var elVox=document.getElementById('vox');
var elPick=document.getElementById('voxpick');
function voxLabel(){
  if(!elVox) return;
  if(!SPEECH && !voxProvider()){
    elVox.textContent='no voice available'; elVox.className='off'; elVox.disabled=true;
    if(elPick) elPick.style.display='none';
    return;
  }
  elVox.textContent = VOX.on? 'narration on' : 'narration off';
  elVox.className = VOX.on? '' : 'off';
  try{ elVox.setAttribute('aria-pressed', VOX.on? 'true':'false'); }catch(e){}
  if(elPick) elPick.style.display = VOX.on? '' : 'none';
}
function voxFillPicker(){
  if(!elPick || !VOX.list || !VOX.list.length) return;
  if(elPick.dataset && elPick.dataset.n==String(VOX.list.length)) return;
  elPick.innerHTML='';
  for(var i=0;i<VOX.list.length;i++){
    var v=VOX.list[i];
    var o=document.createElement('option');
    o.value=String(i);
    o.textContent=(v.name||'voice '+i).replace(/\s*\(.*?\)\s*/g,' ').trim().slice(0,30);
    if(v===VOX.chosen) o.selected=true;
    elPick.appendChild(o);
  }
  if(elPick.dataset) elPick.dataset.n=String(VOX.list.length);
}
if(elPick){
  elPick.addEventListener('click',function(e){ e.stopPropagation(); });
  elPick.addEventListener('change',function(e){
    e.stopPropagation();
    var v=VOX.list[parseInt(elPick.value,10)];
    if(!v) return;
    var F=VOX.list.filter(function(x){ return voxSex(x)==='f' && voxScore(x)>-100; });
    var M=VOX.list.filter(function(x){ return voxSex(x)==='m' && voxScore(x)>-100; });
    if(F.indexOf(v)<0) F=[v].concat(F);
    voxAssign(v,F,M.length?M:VOX.list);
    voxStop();
    VOX.on=true; VOX.userSet=true; voxLabel();
    voxPrime(); voxAside('This is the narrator.',null);
  });
}

/* ------------------------------------------------------------------
   A hosted voice can be plugged in from outside. Define, before this
   script runs:

       window.KelvinVoice = {
         speak: function (text, who) {     // who: narrator|wren|ted|nadia
           //  ... call whatever service you like ...
           return Promise.resolve(audioUrlOrBlob);
         }
       };

   and every line goes through it instead of the browser. If the call
   fails the browser voice picks the line up, so nothing ever stalls.
   A published artifact cannot reach outside hosts, so on claude.ai
   this stays unset and the browser voice is used.
   ------------------------------------------------------------------ */
function voxProvider(){
  return (typeof window!=='undefined' && window.KelvinVoice && window.KelvinVoice.speak)
    ? window.KelvinVoice : null;
}

var FEM=['ava','samantha','allison','serena','zoe','joanna','emma','aria','jenny',
         'michelle','sonia','libby','nicky','noelle','kate','clara','amber','salli',
         'kimberly','karen','moira','tessa','fiona','catherine','susan','zira','hazel',
         'female','woman'];
var MAS=['daniel','alex','oliver','arthur','guy','ryan','david','mark','james',
         'matthew','joey','brian','christopher','eric','george','liam','tom','male','man'];
var JUNK=['espeak','albert','bad news','bahh','bells','boing','bubbles','cellos',
          'deranged','good news','jester','organ','superstar','trinoids','whisper',
          'wobble','zarvox','grandma','grandpa','rocko','shelley','sandy','flo','eddy',
          'reed','junior','ralph','kathy','bruce','vicki','victoria','agnes','princess',
          'fred','compact','pipe organ'];

function voxScore(v){
  var n=(v.name||'').toLowerCase(), sc=0;
  for(var j=0;j<JUNK.length;j++) if(n.indexOf(JUNK[j])>=0) return -200;
  if(n.indexOf('natural')>=0)  sc+=95;
  if(n.indexOf('neural')>=0)   sc+=95;
  if(n.indexOf('premium')>=0)  sc+=85;
  if(n.indexOf('enhanced')>=0) sc+=62;
  if(n.indexOf('online')>=0)   sc+=42;
  if(v.localService===false)   sc+=30;
  for(var i=0;i<FEM.length;i++) if(n.indexOf(FEM[i])>=0){ sc+=48-i; break; }
  for(var k=0;k<MAS.length;k++) if(n.indexOf(MAS[k])>=0){ sc+=30-k; break; }
  if(/en-gb/i.test(v.lang||'')) sc+=6;
  if(/en-us/i.test(v.lang||'')) sc+=5;
  return sc;
}
function voxSex(v){
  var n=(v.name||'').toLowerCase();
  for(var i=0;i<FEM.length;i++) if(n.indexOf(FEM[i])>=0) return 'f';
  for(var k=0;k<MAS.length;k++) if(n.indexOf(MAS[k])>=0) return 'm';
  return '?';
}

function voxPickVoices(){
  if(!SPEECH) return;
  var all=[];
  try{ all=SPEECH.getVoices()||[]; }catch(e){ return; }
  if(!all.length) return;
  var en=all.filter(function(v){ return /^en(-|_|$)/i.test(v.lang||''); });
  if(!en.length) en=all;
  en=en.slice().sort(function(x,y){ return voxScore(y)-voxScore(x); });
  VOX.list=en;

  var F=en.filter(function(v){ return voxSex(v)==='f' && voxScore(v)>-100; });
  var M=en.filter(function(v){ return voxSex(v)==='m' && voxScore(v)>-100; });
  var ok=en.filter(function(v){ return voxScore(v)>-100; });
  if(!F.length) F=ok.length?ok:en;
  VOX.best=F[0]||en[0];
  VOX.bestScore=voxScore(VOX.best);
  voxAssign(VOX.chosen||VOX.best, F, M.length?M:ok);
  if(!VOX.userSet) VOX.on = VOX.bestScore>=40;
  voxFillPicker();
  voxLabel();
  VOX.loaded=true;
}

function voxAssign(nar,F,M){
  VOX.chosen=nar;
  var rest=F.filter(function(v){ return v!==nar; });
  var nad=rest[0]||nar, wr=rest[1]||rest[0]||nar, boy=(M&&M[0])||null;
  if(boy===nar) boy=(M&&M[1])||null;
  VOX.prof.narrator.voice=nar; VOX.prof.narrator.rate=0.92; VOX.prof.narrator.pitch=1.00;
  VOX.prof.nadia.voice=nad;
  VOX.prof.nadia.pitch=(nad===nar)?1.16:1.06; VOX.prof.nadia.rate=(nad===nar)?1.00:0.96;
  VOX.prof.wren.voice=wr;
  VOX.prof.wren.pitch=(wr===nar||wr===nad)?1.42:1.28; VOX.prof.wren.rate=1.05;
  VOX.prof.ted.voice=boy||nar;
  VOX.prof.ted.pitch=boy?0.84:0.58; VOX.prof.ted.rate=boy?0.98:0.94;
}

voxLabel();
if(SPEECH){
  voxPickVoices();
  try{ SPEECH.onvoiceschanged=voxPickVoices; }catch(e){}
  setTimeout(voxPickVoices,400);
  setTimeout(voxPickVoices,1600);
}

function voxPrime(){
  if(!SPEECH || VOX.primed) return;
  VOX.primed=true;
  try{
    var u=new SpeechSynthesisUtterance(' ');
    u.volume=0; SPEECH.speak(u);
  }catch(e){}
}

function voxStop(){
  VOX.token++;
  if(VOX.audio){ try{ VOX.audio.pause(); }catch(e){} VOX.audio=null; }
  if(SPEECH){ try{ SPEECH.cancel(); }catch(e){} }
}

var VOXSCRATCH=null;
function plainOf(html){
  if(!VOXSCRATCH) VOXSCRATCH=document.createElement('div');
  VOXSCRATCH.innerHTML=String(html||'');
  return (VOXSCRATCH.textContent||'').replace(/\s+/g,' ').trim();
}

/* split a line into what the narrator says and what the character says */
function segmentize(txt,who){
  var out=[], re=/[\u201C"]([^\u201D"]*)[\u201D"]/g, last=0, m;
  while((m=re.exec(txt))!==null){
    if(m.index>last){
      var pre=txt.slice(last,m.index).trim();
      if(pre) out.push({t:pre,w:null});
    }
    var q=(m[1]||'').trim();
    if(q) out.push({t:q,w:who||null});
    last=re.lastIndex;
  }
  var tail=txt.slice(last).trim();
  if(tail) out.push({t:tail,w:null});
  if(!out.length && txt) out.push({t:txt,w:null});
  /* keep each utterance short; some browsers cut long ones off */
  var chopped=[];
  for(var i=0;i<out.length;i++){
    var seg=out[i];
    if(seg.t.length<=190){ chopped.push(seg); continue; }
    var parts=[], acc='', chars=seg.t.split('');
    for(var c=0;c<chars.length;c++){
      acc+=chars[c];
      if('.!?;'.indexOf(chars[c])>=0 && chars[c+1]===' '){ parts.push(acc); acc=''; c++; }
    }
    if(acc) parts.push(acc);
    var buf='';
    for(var j=0;j<parts.length;j++){
      if((buf+' '+parts[j]).trim().length>190 && buf){ chopped.push({t:buf.trim(),w:seg.w}); buf=parts[j]; }
      else buf=(buf+' '+parts[j]).trim();
    }
    if(buf) chopped.push({t:buf,w:seg.w});
  }
  return chopped;
}

function voxEstimate(segs){
  var words=0;
  for(var i=0;i<segs.length;i++){ words+=segs[i].t.split(/\s+/).length; }
  return words/2.85*1000 + segs.length*260 + 500;
}

function voxSpeak(segs,done){
  if(!voxActive() || !segs || !segs.length){ if(done) done(); return; }
  var tok=++VOX.token, i=0;
  function after(seg){ if(tok===VOX.token) setTimeout(next, seg.w?240:150); }
  function browserSay(seg){
    var pr=VOX.prof[seg.w||'narrator']||VOX.prof.narrator, u;
    try{ u=new SpeechSynthesisUtterance(seg.t); }catch(e){ after(seg); return; }
    if(pr.voice) u.voice=pr.voice;
    u.rate=pr.rate; u.pitch=pr.pitch; u.volume=1;
    u.onend=function(){ after(seg); };
    u.onerror=function(){ if(tok===VOX.token) setTimeout(next,80); };
    try{ SPEECH.speak(u); }catch(e){ after(seg); }
  }
  function next(){
    if(tok!==VOX.token) return;
    if(i>=segs.length){ if(done) done(); return; }
    var seg=segs[i++];
    var prov=voxProvider();
    if(prov){
      var fell=false;
      var back=function(){ if(!fell){ fell=true; browserSay(seg); } };
      try{
        Promise.resolve(prov.speak(seg.t, seg.w||'narrator')).then(function(src){
          if(tok!==VOX.token) return;
          if(!src){ back(); return; }
          var url=(typeof src==='string')? src : URL.createObjectURL(src);
          var au=new Audio(url); VOX.audio=au;
          au.onended=function(){ after(seg); };
          au.onerror=back;
          var pl=au.play();
          if(pl&&pl.catch) pl.catch(back);
        }, back);
      }catch(e){ back(); }
      return;
    }
    browserSay(seg);
  }
  next();
}

/* say a line out loud without it driving any timing */
function voxAside(html,who){
  if(!voxActive()) return;
  voxSpeak(segmentize(plainOf(html),who||null),null);
}


function drawPlayhead(g,t){
  var u = SCENE.dur? clamp((Date.now()-SCENE.t0)/SCENE.dur,0,1) : 0;
  var x=W-46, y=H-40, r=15;
  g.save();
  g.globalAlpha=0.85;
  g.strokeStyle='rgba(232,224,210,0.20)'; g.lineWidth=2.4;
  g.beginPath(); g.arc(x,y,r,0,TAU()); g.stroke();
  g.strokeStyle='rgba(232,224,210,0.62)'; g.lineWidth=2.4; g.lineCap='round';
  g.beginPath(); g.arc(x,y,r,-Math.PI/2,-Math.PI/2+u*TAU()); g.stroke();
  var pu=0.55+0.45*Math.sin(t*3.0);
  g.strokeStyle='rgba(232,224,210,'+(0.35+0.45*pu)+')'; g.lineWidth=2.2;
  g.beginPath(); g.moveTo(x-4,y-6); g.lineTo(x+4,y); g.lineTo(x-4,y+6); g.stroke();
  g.restore();
}

function loop(){
  GAME.t = (performance.now()-T0)/1000;
  cx.clearRect(0,0,W,H);
  try{ if(GAME.view) GAME.view(cx,GAME.t); }catch(e){ /* keep the house standing */ }
  try{ if(SCENE.list) drawPlayhead(cx,GAME.t); }catch(e){}
  requestAnimationFrame(loop);
}

var pending=0, chain=Promise.resolve();
function isBusy(){ return pending>0; }
function tr(fn,dur){
  var d=(dur||0.42)*1000+40;
  pending++;
  chain = chain.then(function(){
    elFade.style.transitionDuration=(dur||0.42)+'s';
    elFade.style.opacity=1;
    return wait(d).then(function(){
      try{ fn(); }catch(e){}
      elFade.style.opacity=0;
      return wait(d);
    });
  }).then(function(){ pending--; }, function(){ pending--; });
  return chain;
}

function say(sp,txt,cls){
  elSpk.textContent = sp||'';
  elSpk.className = cls||'';
  elNar.innerHTML = txt||'';
}
function hint(txt,cls){ elHint.textContent=txt||''; elHint.className=cls||''; }
function choices(list){
  elCho.innerHTML='';
  for(var i=0;i<list.length;i++){
    (function(c){
      var b=document.createElement('button');
      b.textContent=c.label;
      if(c.cls) b.className=c.cls;
      b.onclick=function(){ if(!isBusy()) c.fn(b); };
      elCho.appendChild(b);
    })(list[i]);
  }
}
function setView(fn,hs){
  GAME.view=fn; GAME.viewT0=GAME.t;
  GAME.hotspots=hs||null;

}

/* ---- the two dials ---- */
function setClock(){
  var m=Math.max(0,GAME.clock);
  var now=1140-m;
  var hh=Math.floor(now/60), mm=now%60;
  var h12=hh>12?hh-12:hh;
  elTime.textContent=h12+':'+(mm<10?'0':'')+mm;
}
var LEVEL_OF=[0,0,0,1,1,2,2,3,3];
function setDepth(i){
  var lv=LEVEL_OF[i]===undefined?0:LEVEL_OF[i];
  var bars=document.querySelectorAll('#depth .lvl');
  for(var k=0;k<bars.length;k++){
    var b=bars[k];
    if(String(lv)===b.getAttribute('data-l')) b.className='lvl on'; else b.className='lvl';
  }
}
function setThermo(f){
  var pct=clamp((f+12)/112,0,1)*100;
  elMerc.style.height=pct.toFixed(1)+'%';
  var col = f>70? '#d8613e' : f>44? '#d89a4e' : f>26? '#89a9c2' : '#8fd4ec';
  elMerc.style.background='linear-gradient(0deg,'+col+',#f0a24a)';
  elBulb.style.background=col;
  elRead.innerHTML=Math.round(f)+'&deg;F';
}

function exitView(g,t,room,idx){
  var keepT0=GAME.viewT0;
  GAME.viewT0=-999;              /* they are already in the room, not arriving */
  room.wide(g,t,GAME.st);
  GAME.viewT0=keepT0;
  // the opening
  var spots=[
    {x:660,y:250,w:120,h:150}, {x:200,y:250,w:130,h:150}, {x:404,y:140,w:150,h:60},
    {x:690,y:230,w:110,h:170}, {x:430,y:300,w:110,h:92}, {x:250,y:210,w:120,h:190},
    {x:210,y:324,w:150,h:68},  {x:300,y:200,w:170,h:210}, {x:440,y:400,w:110,h:70}
  ];
  var s=spots[idx%spots.length];
  g.save();
  g.fillStyle='#000'; g.fillRect(s.x,s.y,s.w,s.h);
  g.save();
  g.beginPath(); g.rect(s.x,s.y,s.w,s.h); g.clip();
  // a slice of stair, different each time
  var v=idx%3;
  g.fillStyle='#120e0a';
  if(v===0){
    for(var i=0;i<6;i++){
      g.fillStyle=i%2?'#161009':'#1e160d';
      g.fillRect(s.x, s.y+s.h-(i+1)*18 - (idx%2)*4, s.w, 12);
    }
  } else if(v===1){
    g.strokeStyle='rgba(168,120,58,0.45)'; g.lineWidth=5;
    g.beginPath(); g.moveTo(s.x+10,s.y+s.h); g.lineTo(s.x+s.w-14,s.y+18); g.stroke();
    for(var j=0;j<5;j++){
      g.fillStyle='#1a130b';
      g.fillRect(s.x+10+j*(s.w/6), s.y+s.h-16-j*(s.h/7), s.w/5, 9);
    }
  } else {
    g.fillStyle='#14100b';
    for(var k=0;k<7;k++){ g.fillRect(s.x+4, s.y+s.h-(k+1)*15, s.w*(0.5+0.07*k), 10); }
  }
  glow(g,s.x+s.w*0.5,s.y+s.h*0.2,s.w*1.3,'#c9a463',0.20);
  g.restore();
  g.strokeStyle='rgba(168,120,58,0.55)'; g.lineWidth=2.4;
  g.strokeRect(s.x,s.y,s.w,s.h);
  g.restore();
  glow(g,s.x+s.w/2,s.y+s.h/2,s.w*1.1,P.lamp,0.14);
}

/* ============================================================
   THE HOUSE FROM OUTSIDE, AND THE PLACES THAT ARE NOT ROOMS
   ============================================================ */
function houseExterior(g,t,o){
  o=o||{};
  var sg=g.createLinearGradient(0,0,0,H);
  sg.addColorStop(0,'#02040a'); sg.addColorStop(0.55,'#060d15'); sg.addColorStop(1,'#0a1016');
  g.fillStyle=sg; g.fillRect(0,0,W,H);
  starfield(g,t,130,380);
  auroraSky(g,t,o.aurora===undefined?1:o.aurora,110);
  // ridge
  g.fillStyle='#04070b';
  g.beginPath(); g.moveTo(0,430);
  for(var i=0;i<=14;i++){ g.lineTo(i*70, 430-Math.abs(Math.sin(i*1.31))*64-rnd(i)*22); }
  g.lineTo(W,H); g.lineTo(0,H); g.closePath(); g.fill();
  // snow
  var fg=g.createLinearGradient(0,452,0,H);
  fg.addColorStop(0,'#0e141b'); fg.addColorStop(1,'#141b23');
  g.fillStyle=fg;
  g.beginPath(); g.moveTo(0,478);
  g.bezierCurveTo(240,458,700,492,W,466); g.lineTo(W,H); g.lineTo(0,H); g.closePath(); g.fill();

  // the house
  var hx=o.hx===undefined?318:o.hx, hy=o.hy||470, s=o.s||1;
  g.save(); g.translate(hx,hy); g.scale(s,s);
  g.fillStyle='#05080c';
  g.fillRect(-140,-150,280,150);                      // main block
  g.beginPath(); g.moveTo(-158,-150); g.lineTo(0,-232); g.lineTo(158,-150); g.closePath(); g.fill();
  g.fillRect(96,-262,74,262);                          // tower
  g.beginPath(); g.moveTo(84,-262); g.lineTo(133,-312); g.lineTo(182,-262); g.closePath(); g.fill();
  g.fillRect(-116,-266,20,42); g.fillRect(28,-274,20,50); // chimneys
  // the railed walk at the top of the tower
