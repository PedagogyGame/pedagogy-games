function fallView(g,t){
  var u=clamp((t-(GAME.fallT0||0))/2.35,0,1);
  var e=u*u*(3-2*u);
  var d=760*u+3600*u*u;
  var sp=0.35+2.9*u;

  g.save();
  var shake=u>0.865? (1-(u-0.865)/0.135)*13 : 0;
  if(shake>0) g.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);

  g.fillStyle='#020408'; g.fillRect(-20,-20,W+40,H+40);

  var throat=lerp(0.78,0.32,e);
  var lx=W*0.5-W*throat*0.5, rx=W*0.5+W*throat*0.5;
  var lb=W*0.5-40, rb=W*0.5+40;

  /* the shaft below, going down into nothing */
  var shg=g.createLinearGradient(0,H*0.24,0,H+20);
  shg.addColorStop(0,'#120c08'); shg.addColorStop(1,'#000');
  g.fillStyle=shg;
  g.beginPath(); g.moveTo(lx,-20); g.lineTo(rx,-20); g.lineTo(rb,H+20); g.lineTo(lb,H+20);
  g.closePath(); g.fill();

  /* the walls: hard-edged strata, stretched by speed, never smeared */
  for(var side=0;side<2;side++){
    g.save();
    g.beginPath();
    if(side===0){ g.moveTo(-20,-20); g.lineTo(lx,-20); g.lineTo(lb,H+20); g.lineTo(-20,H+20); }
    else        { g.moveTo(W+20,-20); g.lineTo(rx,-20); g.lineTo(rb,H+20); g.lineTo(W+20,H+20); }
    g.closePath(); g.clip();
    var wg=g.createLinearGradient(side?W:0,0,side?rx:lx,0);
    wg.addColorStop(0,'#33261a'); wg.addColorStop(0.55,'#170f09'); wg.addColorStop(1,'#080504');
    g.fillStyle=wg; g.fillRect(-20,-20,W+40,H+40);
    for(var i=0;i<30;i++){
      var yy=(((i*64)-d*0.9)%(H+240))-120;
      if(yy<-130) yy+=H+240;
      var th=(3+rnd(i*3.1)*9)*(1+sp*0.55);
      g.fillStyle='rgba(0,0,0,'+(0.30+rnd(i)*0.38)+')';
      g.beginPath();
      g.moveTo(-20,yy); g.lineTo(W+20,yy-11); g.lineTo(W+20,yy-11+th); g.lineTo(-20,yy+th);
      g.closePath(); g.fill();
      if(i%3===0){
        g.fillStyle='rgba(196,164,112,'+(0.10+rnd(i*7)*0.10)+')';
        g.fillRect(-20,yy+th,W+40,1.4);
      }
    }
    /* jutting rock, elongated by the speed but still sharp */
    for(var k=0;k<9;k++){
      var sy=(((k*150)-d*0.9)%(H+300))-150;
      if(sy<-160) sy+=H+300;
      var sx=side? rx+rnd(k*5)*66 : lx-rnd(k*5)*66;
      var rw=11+rnd(k)*15, rh=(7+rnd(k*2)*9)*(1+sp*1.35);
      g.fillStyle='#070605';
      g.beginPath();
      g.moveTo(sx-rw,sy); g.lineTo(sx-rw*0.35,sy-rh); g.lineTo(sx+rw*0.6,sy-rh*0.55);
      g.lineTo(sx+rw,sy+rh*0.30); g.lineTo(sx-rw*0.2,sy+rh); g.closePath(); g.fill();
      g.fillStyle='rgba(186,152,100,0.22)';
      g.beginPath();
      g.moveTo(sx-rw,sy); g.lineTo(sx-rw*0.35,sy-rh); g.lineTo(sx-rw*0.2,sy-rh*0.75); g.closePath(); g.fill();
    }
    g.restore();
  }

  /* the way in, receding */
  var oe=Math.pow(u,0.48);
  var oy=lerp(-6,104,oe), ow=lerp(300,22,oe), oh=ow*0.34;
  glow(g,W*0.5,oy+oh*0.2,ow*2.4,P.lamp,0.44*(1-oe*0.78));
  g.fillStyle='rgba(255,216,156,'+(0.94*(1-oe*0.52))+')';
  g.beginPath(); g.ellipse(W*0.5,oy,ow*0.5,oh*0.5,0,0,TAU()); g.fill();
  g.strokeStyle='rgba(0,0,0,0.75)'; g.lineWidth=3*(1-oe*0.6)+1;
  g.beginPath(); g.ellipse(W*0.5,oy,ow*0.5,oh*0.5,0,0,TAU()); g.stroke();
  for(var sl=0;sl<3;sl++){
    g.fillStyle='rgba(0,0,0,'+(0.55-sl*0.12)+')';
    g.fillRect(W*0.5-ow*0.5+ow*(0.18+sl*0.28),oy-oh*0.5,ow*0.05,oh);
  }

  /* coal and splinters, crisp, faster than they are */
  for(var c=0;c<36;c++){
    var cy=(((c*91)-d*1.6)%(H+320))-160;
    if(cy<-170) cy+=H+320;
    var cx2=lerp(lb-40,rb+40,rnd(c*2.7));
    var cs=2+rnd(c*4.4)*7;
    g.save();
    g.translate(cx2,cy); g.rotate(t*(1+rnd(c)*4)+c); g.scale(1,1+sp*0.5);
    g.fillStyle='#0b0a09';
    g.beginPath();
    g.moveTo(-cs,0); g.lineTo(-cs*0.3,-cs); g.lineTo(cs,-cs*0.2); g.lineTo(cs*0.4,cs); g.closePath(); g.fill();
    g.fillStyle='rgba(206,176,126,0.30)';
    g.beginPath(); g.moveTo(-cs,0); g.lineTo(-cs*0.3,-cs); g.lineTo(-cs*0.1,-cs*0.6); g.closePath(); g.fill();
    g.restore();
  }

  /* speed lines: thin, bright, hard-edged */
  for(var wl=0;wl<30;wl++){
    var wy=(((wl*41)-d*2.35)%(H+200))-100;
    if(wy<-110) wy+=H+200;
    var wx2=lerp(lb-120,rb+120,rnd(wl*3.3));
    var wlen=26+sp*78+rnd(wl*9)*40;
    g.strokeStyle='rgba(236,226,206,'+((0.07+0.16*rnd(wl*8))*Math.min(1,u*2.6))+')';
    g.lineWidth=1;
    g.beginPath(); g.moveTo(wx2,wy); g.lineTo(wx2,wy+wlen); g.stroke();
  }

  /* the three of them: one crisp body each, with a trail of air behind it */
  var cast=[
    {who:'wren', bx:0.31, sp:2.45, ph:0.0, h:108},
    {who:'ted',  bx:0.53, sp:-1.95,ph:1.9, h:116},
    {who:'nadia',bx:0.72, sp:1.65, ph:3.6, h:112}
  ];
  for(var f=0;f<3;f++){
    var q=cast[f];
    var drift=Math.sin(t*1.25+q.ph)*0.055 + (0.5-q.bx)*e*0.30;
    var fx=W*(q.bx+drift);
    var slam=u>0.855? Math.pow((u-0.855)/0.145,2)*330 : 0;
    var fy=H*(0.28+0.17*Math.sin(t*1.55+q.ph))+e*54+slam;
    var rot=q.sp*t*1.35+q.ph;
    var fade=u>0.90? 1-(u-0.90)/0.10 : 1;
    var rgb=hexRGB(CAST[q.who].coat);

    /* a few hard streaks of their own colour, not a smudge */
    var tstr=Math.pow(clamp((u-0.12)/0.5,0,1),1.3);
    if(tstr>0.02){
      for(var st3=0;st3<5;st3++){
        var so=(st3-2)*q.h*0.085 + Math.sin(t*2+st3+f)*q.h*0.03;
        var slen=(26+u*140)*(0.55+rnd(st3*7+f)*0.75);
        g.strokeStyle='rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+','+(0.30*tstr*fade)+')';
        g.lineWidth=1.6;
        g.beginPath(); g.moveTo(fx+so,fy-q.h*0.40); g.lineTo(fx+so,fy-q.h*0.40-slen); g.stroke();
      }
    }

    /* light from the hatch, still catching them */
    glow(g,fx,fy-q.h*0.30,q.h*0.85,'#ffd7a0',0.09*(1-oe*0.55)*fade);

    g.save();
    g.globalAlpha=fade;
    person(g,fx,fy,q.h,q.who,t,{
      pose:'tumble', phase:t*3.4+q.ph, lean:rot,
      wind:-rot, windK:0.15, noShadow:true
    });
    g.restore();
  }

  /* the bottom of it */
  if(u>0.855){
    var k2=(u-0.855)/0.145;
    glow(g,W*0.5,H*0.92,780*k2,'#8a5f31',0.60*k2*(1-k2*0.5));
    for(var b2=0;b2<52;b2++){
      var ba=Math.PI+(b2/52)*Math.PI+rnd(b2)*0.26;
      var brr=Math.pow(k2,0.6)*(150+rnd(b2*3)*430);
      g.fillStyle='rgba(152,128,92,'+(0.48*(1-k2*0.85))+')';
      g.beginPath();
      g.arc(W*0.5+Math.cos(ba)*brr,H*0.95+Math.sin(ba)*brr*0.50,6+rnd(b2*5)*26,0,TAU());
      g.fill();
    }
    for(var ck=0;ck<22;ck++){
      var ca=Math.PI+(ck/22)*Math.PI+rnd(ck*7)*0.3;
      var cr=Math.pow(k2,0.5)*(120+rnd(ck*2)*380);
      g.save();
      g.translate(W*0.5+Math.cos(ca)*cr,H*0.95+Math.sin(ca)*cr*0.55);
      g.rotate(t*5+ck); g.fillStyle='rgba(11,10,9,'+(0.85*(1-k2))+')';
      var cz=3+rnd(ck*4)*9;
      g.beginPath(); g.moveTo(-cz,0); g.lineTo(0,-cz); g.lineTo(cz,0); g.lineTo(0,cz); g.closePath(); g.fill();
      g.restore();
    }
    g.fillStyle='rgba(0,0,0,'+(k2*k2*0.96)+')'; g.fillRect(-20,-20,W+40,H+40);
  }
  g.restore();
  vignette(g,0.70);
}

  // the three, silhouetted in it
  var dw=clamp((t-(GAME.viewT0||0))/3.4,0,1);
  person(g,lerp(360,452,dw),548,150,null,t,{pose:'walk',phase:t*6.1,     silCol:'#05080c',shadow:0.3});
  person(g,lerp(452,522,dw),556,160,null,t,{pose:'walk',phase:t*6.1+2.1, silCol:'#05080c',shadow:0.3});
  person(g,lerp(536,588,dw),546,154,null,t,{pose:'walk',phase:t*6.1+4.2, silCol:'#05080c',shadow:0.3});
  vignette(g,0.72);
}

function busView(g,t){
  houseExterior(g,t,{hx:210,s:0.72,windows:function(){return false;}});
  // the bus, and its lights
  g.save();
  var bx=620+Math.sin(t*0.4)*4;
  g.fillStyle='#161d24'; rrect(g,bx,452,250,74,8); g.fill();
  g.fillStyle='#22303c'; g.fillRect(bx+14,462,60,30); g.fillRect(bx+86,462,60,30); g.fillRect(bx+158,462,60,30);
  g.fillStyle='#0b0f13';
  g.beginPath(); g.arc(bx+54,528,15,0,TAU()); g.fill();
  g.beginPath(); g.arc(bx+196,528,15,0,TAU()); g.fill();
  glow(g,bx-6,494,150,'#ffe7bd',0.42);
  g.fillStyle='#ffe7bd'; g.beginPath(); g.arc(bx+4,494,7,0,TAU()); g.fill();
  g.restore();
  var bw=clamp((t-(GAME.viewT0||0))/4.2,0,1);
  person(g,lerp(420,556,bw),524,64,'wren', t,{pose:bw<0.98?'run':'idle',phase:t*10.5});
  person(g,lerp(452,588,bw),528,68,'ted',  t,{pose:bw<0.98?'run':'idle',phase:t*10.5+2.1});
  person(g,lerp(388,524,bw),520,66,'nadia',t,{pose:bw<0.98?'run':'idle',phase:t*10.5+4.2});
  vignette(g,0.62);
}

/* ============================================================
   RUNNING IT
   ============================================================ */
function holdFor(txt){
  var n=String(txt||'').replace(/<[^>]+>/g,' ').split(/\s+/).length;
  return clamp(1500+n*290,2400,11000);
}

function playScene(list,onDone){
  SCENE.list=list; SCENE.i=-1; SCENE.onDone=onDone;
  sceneStep();
}
function sceneStep(){
  if(SCENE.timer){ clearTimeout(SCENE.timer); SCENE.timer=null; }
  voxStop();
  SCENE.i++;
  if(!SCENE.list) return;
  if(SCENE.i>=SCENE.list.length){
    var d=SCENE.onDone; SCENE.list=null; SCENE.onDone=null; SCENE.dur=0;
    if(d) d();
    return;
  }
  var m=SCENE.list[SCENE.i];
  tr(function(){
    if(m.on) m.on();
    setView(m.v);
    say(m.sp||'', m.txt||'', m.cls||'');
    hint(''); choices([]);
    SCENE.t0=Date.now();
    var base=m.hold||holdFor(m.txt);
    if(voxActive() && m.txt){
      var segs=segmentize(plainOf(m.txt), m.vo||null);
      SCENE.dur=Math.max(base, voxEstimate(segs));
      SCENE.plain=segs;
      voxSpeak(segs,sceneStep);
      SCENE.timer=setTimeout(sceneStep, SCENE.dur+4000);
    } else {
      SCENE.dur=base;
      SCENE.timer=setTimeout(sceneStep,SCENE.dur);
    }
  });
}
function sceneSkip(){ if(SCENE.list) sceneStep(); }

function advance(){ GAME.beat++; runBeat(); }

function nextRoom(){
  GAME.clock-=7; setClock();
  if(GAME.clock<=0){ lose(); return; }
  if(GAME.room+1<ROOMS.length) enterRoom(GAME.room+1);
}

function enterRoom(i){
  GAME.room=i; GAME.beat=0; GAME.qi=0; GAME.solved=false;
  var room=ROOMS[i];
  GAME.st={heat:0.05,freeze:0.38,threads:0.12,aligned:false,magAngle:-1.15,screenFound:false};
  if(room.play && room.play.init) room.play.init(GAME.st);
  setThermo(room.f); setDepth(i);
  runBeat();
}

var BEATS=['story','play','quiz','close'];

/* the button-hunt is voiced by Wren the first time she finds one, and at the
   three later moments where she has something of her own to say. In between
   the narrator carries it, so the running gag does not become a recital. */
var WREN_SPEAKS={furnace:1, compass:1, shutters:1, roof:1};
function voiceOf(name){
  var n=String(name||'').toLowerCase();
  return (n==='wren'||n==='ted'||n==='nadia')? n : null;
}

function runBeat(){
  var room=ROOMS[GAME.room], beat=BEATS[GAME.beat], sc=SCRIPT[room.id];
  hint('');

  if(beat==='story'){
    playScene([
      {v:function(g,t){ room.wide(g,t,GAME.st); },
       sp:room.level+'  \u2014  '+room.name, txt:sc.enter.txt, vo:null},
      {v:function(g,t){ wrenView(g,t,room,false); },
       sp:sc.wren.sp, cls:'wren', txt:sc.wren.txt,
       vo: WREN_SPEAKS[room.id]? 'wren' : null},
      {v:function(g,t){ room.detail(g,t,'a',GAME.st); },
       sp:sc.a.sp, cls:sc.a.sp.toLowerCase(), txt:sc.a.txt, vo:voiceOf(sc.a.sp)},
      {v:function(g,t){ room.detail(g,t,'b',GAME.st); },
       on:function(){ GAME.st.screenFound=true; },
       sp:sc.b.sp, cls:sc.b.sp.toLowerCase(), txt:sc.b.txt, vo:voiceOf(sc.b.sp)}
    ], advance);

  } else if(beat==='play'){
    tr(function(){
      setView(function(g,t){ room.play.draw(g,t,GAME.st); }, room.play.hotspots);
      say('', room.play.prompt);
      hint(room.play.hint);
      choices([]);
      voxAside(room.play.prompt,null);
    });

  } else if(beat==='quiz'){
    tr(runQuiz);

  } else if(beat==='close'){
    if(room.id==='roof'){ reveal(); return; }
    playScene([
      {v:function(g,t){ buttonCloseView(g,t,room); },
       txt:'The lens fills with cold blue light, and somewhere behind them the house lets go of something it had been holding shut.',
       hold:3000},
      {v:function(g,t){ exitView(g,t,room,GAME.room); }, txt:sc.exit.txt}
    ], nextRoom);
  }
}

function runQuiz(){
  var room=ROOMS[GAME.room];
  var qs=(Object.prototype.toString.call(room.quiz)==='[object Array]')?room.quiz:[room.quiz];
  var q=qs[GAME.qi];
  setView(function(g,t){ huddleView(g,t,room,false); });
  say('The three of them, at the button', q.q);
  hint('');
  voxAside(q.q,null);
  var opts=[];
  for(var i=0;i<q.a.length;i++){
    (function(idx,txt){
      opts.push({label:txt,fn:function(b){
        if(idx===q.right){
          GAME.qi++;
          var done=GAME.qi>=qs.length;
          voxStop();
          var body='<span class="term">'+txt+'</span> &mdash; '+q.after;
          playScene([
            {v:function(g,t){ huddleView(g,t,room,done); }, txt:body, vo:null}
          ], done? advance : runQuiz);
        } else {
          voxStop(); b.disabled=true;
          GAME.clock-=3; setClock();
          hint('No. Three minutes gone.','wrong');
          if(GAME.clock<=0) lose();
        }
      }});
    })(i,q.a[i]);
  }
  choices(opts);
}

elVox.addEventListener('click',function(e){
  e.stopPropagation();
  if(!SPEECH && !voxProvider()) return;
  VOX.on=!VOX.on; VOX.userSet=true; voxLabel();
  if(VOX.on){ voxPrime(); voxAside('Narration on.',null); }
  else {
    voxStop();
    if(SCENE.list){
      if(SCENE.timer) clearTimeout(SCENE.timer);
      var spent=Date.now()-SCENE.t0;
      var m2=SCENE.list[SCENE.i];
      var left=Math.max(1100,(m2.hold||holdFor(m2.txt))-spent);
      SCENE.dur=spent+left;
      SCENE.timer=setTimeout(sceneStep,left);
    }
  }
});

function stageTap(){
  if(SCENE.list){ sceneSkip(); return true; }
  return false;
}
cv.addEventListener('click',function(e){
  if(stageTap()) return;
  if(isBusy() || !GAME.hotspots) return;
  var r=cv.getBoundingClientRect();
  var x=(e.clientX-r.left)*(W/r.width);
  var y=(e.clientY-r.top)*(H/r.height);
  for(var i=0;i<GAME.hotspots.length;i++){
    var h=GAME.hotspots[i];
    if(x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h){ onHotspot(h.id); return; }
  }
});
document.getElementById('panel').addEventListener('click',function(e){
  if(e.target && e.target.tagName==='BUTTON') return;
  stageTap();
});
document.addEventListener('keydown',function(e){
  if(e.key===' '||e.key==='Enter'){
    if(SCENE.list){ e.preventDefault(); sceneSkip(); }
    return;
  }
  var n=parseInt(e.key,10);
  if(n>=1&&n<=6 && !isBusy()){
    var bs=elCho.getElementsByTagName('button');
    if(bs[n-1] && !bs[n-1].disabled){ e.preventDefault(); bs[n-1].click(); }
  }
});

function onHotspot(id){
  var room=ROOMS[GAME.room], pl=room.play;
  var res=pl.click(id,GAME.st)||{};
  if(room.id==='compass') GAME.st.magAngle=pl.ang;
  if(res.ok===true){
    GAME.solved=true;
    GAME.hotspots=null; cv.classList.remove('clickable');
    var keep=GAME.view;
    playScene([{v:keep, txt:res.msg, hold:Math.max(2200,holdFor(res.msg)*0.8)}], advance);
    return;
  }
  if(res.msg) hint(res.msg, res.ok===false?'wrong':'');
}

/* ---- the reveal ---- */
function reveal(){
  playScene([
    {v:ledgerView, sp:'Nadia', cls:'nadia', vo:'nadia',
     txt:'She reads it out with the lamp on the page, and her voice goes flat and careful the way it does when she is not sure she has understood. Then she stops at the long word and reads it again.'},
    {v:ledgerView, sp:'', cls:'',
     txt:'<em>Geo.</em> Earth. It sits there on the page in the builder&rsquo;s own hand, and it does not mean the house.'},
    {v:function(g,t){ screenMagnetosphere(g,t,90,90,780,420,{labels:true}); }, sp:'Ted', cls:'ted',
     vo:'ted', txt:'&ldquo;The furnace was the middle of it.&rdquo; He says it slowly. &ldquo;The pillars. The drum. That&rsquo;s the inside of the <em>ground</em>. And we climbed up out of it through the floors, and the shutters, and came out in the sky.&rdquo;'},
    {v:function(g,t){ ROOMS[8].wide(g,t,GAME.st); }, sp:'Wren', cls:'wren',
     vo:'wren', txt:'&ldquo;It&rsquo;s been doing it over our heads all night.&rdquo; She has not taken her eyes off the sky since they came out. &ldquo;That&rsquo;s the end of it. We&rsquo;ve been walking around inside the whole thing.&rdquo;'},
    {v:function(g,t){ ROOMS[8].wide(g,t,GAME.st); }, sp:'', cls:'',
     txt:'Nobody says anything for a while, which is unlike all three of them. Then Nadia looks at her watch, and the evening comes back all at once.'}
  ], descend);
}

/* ---- the way out ---- */
function descend(){
  playScene([
    {v:function(g,t){ corridorView(g,t,{}); }, sp:'',
     txt:'The hatch at the foot of the tower opens onto a corridor. Wallpaper. Two closed doors. A runner carpet. After the last five hours it is almost insulting how ordinary it is.'},
    {v:function(g,t){ corridorView(g,t,{}); }, sp:'',
     txt:'The stairs at the end are just stairs. Nobody presses anything. Nobody is thrown anywhere. They go down them at a walk, holding the rail, like people leaving a museum.'},
    {v:function(g,t){ corridorView(g,t,{hole:true}); }, sp:'Ted', cls:'ted', vo:'ted',
     txt:'The hole they fell through is still open in the floor of the front hall, with the rug folded back beside it. Ted goes the long way round it and along the wall, with his back to the panelling. Nobody laughs at him. Everybody does the same.'},
    {v:doorwayView, sp:'',
     txt:'The front door is not locked, and never was. Outside there is snow and a road and eighteen degrees below zero, and above the road the sky is still going.'}
  ], win);
}

var TERMS=[
  'compositional convection','the Curie point','convection columns','helicity',
  'the tangent cylinder','core-mantle boundary heat flux','the Coriolis force',
  'the axial dipole','field-aligned currents','the Dungey cycle','the magnetopause',
  'magnetic reconnection','the ring current','and a geodynamo'
];
function win(){
  tr(function(){
    setView(busView);
    elHud.classList.remove('on');
    say('', 'The bus is idling at the turning with its lights on, because the driver has been doing this road for nineteen years and knows exactly how long people take to come down off that hill. Behind them the house is completely dark, except that it is not, quite.');
    hint('');
    voxAside('The bus is idling at the turning with its lights on, because the driver has been doing this road for nineteen years and knows exactly how long people take to come down off that hill.',null);
    choices([{label:'What the house was',cls:'go',fn:function(){
      voxStop();
      say('Kelvin House, and what it is a model of',
        'Fourteen things the builder named, in the order they were found: '+TERMS.join(', ')+'. Every one of them is a working part of the Earth&rsquo;s magnetic field &mdash; from the freezing at the centre that drives the whole machine, out to the boundary where the solar wind decides how far it may reach.');
      voxAside(elNar.textContent,null);
      choices([{label:'One last page',cls:'go',fn:function(){
        voxStop();
        playScene([
          {v:loreView, sp:'The last thing in the builder\u2019s hand', vo:null,
           txt:'So sometimes some ununiformity is uniformity.', hold:7000}
        ], function(){
          choices([{label:'Again',cls:'go',fn:function(){ location.reload(); }}]);
        });
      }}]);
    }}]);
  });
}

function lose(){
  if(SCENE.timer){ clearTimeout(SCENE.timer); SCENE.timer=null; }
  voxStop(); SCENE.list=null; SCENE.dur=0;
  var room=ROOMS[GAME.room]||ROOMS[0];
  GAME.hotspots=null; cv.classList.remove('clickable');
  setView(function(g,t){ room.wide(g,t,GAME.st); });
  say('', 'Seven o&rsquo;clock.');
  hint(''); choices([]);
  elHud.classList.remove('on');
  setTimeout(function(){
    elFade.style.transitionDuration='7s';
    elFade.style.opacity=1;
  },1800);
  setTimeout(function(){
    say('','');
    choices([{label:'Again',cls:'go',fn:function(){ location.reload(); }}]);
  },11000);
}

/* ---- the beginning ---- */
function start(){
  setView(titleView);
  say('', 'There is one bus out of here before the road closes for the winter, and it leaves at seven. It is twenty past five. The three of you have an hour and forty minutes, and somebody has left the front door of the big house standing open.');
  hint('');
  choices([{label:'Go in',cls:'go',fn:function(){
    voxPrime();
    playScene([
      {v:hallView, vo:null, txt:'The hall is warm and quiet and full of maps. Lamps are lit, which means somebody lit them. There is a table with nothing on it, a carpet in the middle of the floor, and no sound at all from anywhere in the house.'},
      {v:fallView, on:function(){ GAME.fallT0=GAME.t; },
       txt:'The carpet is not on top of anything.', hold:3000}
    ], function(){
      GAME.clock=80; setClock();
      elHud.classList.add('on');
      enterRoom(0);
    });
  }}]);
}

setClock();
setThermo(92);
loop();
start();
</script>
