<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hive Mind — A Beekeeping Vocabulary Game</title>
<style>
  :root{
    --bg:#fdf8ee; --bg2:#fffdf8; --panel:#ffffff; --ink:#2b2317; --ink-soft:#6d6152;
    --line:#e8dcc6; --amber:#d99518; --amber-dk:#a86f0a; --amber-soft:#fbeccd;
    --good:#3f8f5c; --good-soft:#e2f2e7; --bad:#c1503f; --bad-soft:#fbe6e2;
    --shadow:0 1px 2px rgba(60,42,10,.06), 0 8px 24px rgba(60,42,10,.07);
    --radius:14px;
  }
  html[data-theme="dark"]{
    --bg:#161310; --bg2:#1d1916; --panel:#221d18; --ink:#f2e9da;
    --ink-soft:#a2957f; --line:#332c24; --amber:#e8ab33; --amber-dk:#f0c163; --amber-soft:#382d17;
    --good:#6cbf88; --good-soft:#1e3226; --bad:#e2806e; --bad-soft:#38211c;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  body{
    margin:0; font:16px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink);
    background-image:
      radial-gradient(circle at 12px 10px, rgba(217,149,24,.055) 9px, transparent 10px),
      radial-gradient(circle at 42px 34px, rgba(217,149,24,.055) 9px, transparent 10px);
    background-size:60px 48px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:940px; margin:0 auto; padding:20px 18px 64px}

  /* ---------- header ---------- */
  header.top{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:14px}
  .logo{width:42px;height:42px;flex:0 0 auto}
  h1{font-size:24px; margin:0; letter-spacing:-.02em}
  h1 span{color:var(--amber-dk); font-weight:800}
  .tagline{color:var(--ink-soft); font-size:13.5px; margin:2px 0 0}
  .top-actions{margin-left:auto; display:flex; gap:8px}

  button{font:inherit; cursor:pointer; border-radius:10px; border:1px solid var(--line);
    background:var(--panel); color:var(--ink); padding:9px 14px; transition:.14s ease;}
  button:hover{border-color:var(--amber); transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  button:disabled{opacity:.45; cursor:default; transform:none}
  .btn-primary{background:var(--amber); border-color:var(--amber); color:#2b2007; font-weight:650}
  .btn-primary:hover{background:var(--amber-dk); border-color:var(--amber-dk); color:#fff}
  .btn-ghost{background:transparent}
  .icon-btn{padding:8px 11px; font-size:15px; line-height:1}

  /* ---------- tabs ---------- */
  nav.modes{display:flex; gap:6px; background:var(--bg2); border:1px solid var(--line);
    padding:6px; border-radius:var(--radius); margin-bottom:14px; overflow-x:auto}
  nav.modes button{border:0; background:transparent; padding:9px 14px; border-radius:9px;
    white-space:nowrap; color:var(--ink-soft); font-weight:550; font-size:14.5px}
  nav.modes button:hover{background:var(--amber-soft); color:var(--ink); transform:none}
  nav.modes button[aria-selected="true"]{background:var(--amber); color:#2b2007; font-weight:700}

  /* ---------- toolbar ---------- */
  .toolbar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:16px;
    font-size:13.5px; color:var(--ink-soft)}
  .chips{display:flex; gap:6px; flex-wrap:wrap}
  .chip{border:1px solid var(--line); background:var(--panel); border-radius:999px;
    padding:5px 12px; font-size:13px; color:var(--ink-soft)}
  .chip[aria-pressed="true"]{background:var(--amber-soft); border-color:var(--amber);
    color:var(--ink); font-weight:600}
  .chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;
    vertical-align:1px}
  select{font:inherit; font-size:13.5px; padding:7px 10px; border-radius:9px;
    border:1px solid var(--line); background:var(--panel); color:var(--ink)}
  .spacer{flex:1}

  /* ---------- panel ---------- */
  .panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:22px; min-height:340px; display:flex; flex-direction:column}
  .center{align-items:center; justify-content:center; text-align:center}
  .muted{color:var(--ink-soft)}
  .small{font-size:13px}
  .kicker{text-transform:uppercase; letter-spacing:.09em; font-size:11.5px;
    font-weight:700; color:var(--amber-dk)}

  /* ---------- scorebar ---------- */
  .scorebar{display:flex; gap:18px; align-items:center; flex-wrap:wrap;
    margin-bottom:16px; padding-bottom:14px; border-bottom:1px solid var(--line)}
  .stat{display:flex; flex-direction:column; line-height:1.15}
  .stat b{font-size:19px; font-variant-numeric:tabular-nums}
  .stat span{font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-soft)}
  .bar{flex:1 1 120px; height:7px; background:var(--amber-soft); border-radius:99px; overflow:hidden;
    min-width:90px}
  .bar i{display:block; height:100%; background:var(--amber); border-radius:99px; transition:width .3s}

  /* ---------- flashcard ---------- */
  .card-stage{perspective:1400px; width:100%; max-width:520px; margin:8px auto 18px}
  .card{position:relative; width:100%; min-height:230px; transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.4,.2,.2,1); cursor:pointer}
  .card.flipped{transform:rotateY(180deg)}
  .face{position:absolute; inset:0; backface-visibility:hidden; border-radius:var(--radius);
    border:1.5px solid var(--line); padding:26px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; gap:10px}
  .face.front{background:linear-gradient(160deg,var(--amber-soft),var(--panel))}
  .face.back{transform:rotateY(180deg); background:var(--panel)}
  .face .term{font-size:27px; font-weight:750; letter-spacing:-.02em}
  .face .def{font-size:16.5px; color:var(--ink); max-width:42ch}
  .flip-hint{font-size:11.5px; color:var(--ink-soft); position:absolute; bottom:12px;
    left:0; right:0; text-align:center}

  /* ---------- quiz ---------- */
  .prompt{font-size:20px; line-height:1.45; text-align:center; max-width:56ch;
    margin:6px auto 22px; font-weight:520}
  .options{display:grid; gap:10px; grid-template-columns:1fr 1fr; width:100%}
  .opt{text-align:left; padding:14px 16px; border-radius:11px; font-size:15px; line-height:1.4}
  .opt:hover:not(:disabled){background:var(--amber-soft)}
  .opt.correct{background:var(--good-soft); border-color:var(--good); font-weight:650}
  .opt.wrong{background:var(--bad-soft); border-color:var(--bad)}
  .feedback{margin-top:16px; padding:12px 15px; border-radius:11px; font-size:14.5px;
    border:1px solid var(--line); background:var(--bg2); width:100%}
  .feedback.ok{background:var(--good-soft); border-color:var(--good)}
  .feedback.no{background:var(--bad-soft); border-color:var(--bad)}

  /* ---------- match ---------- */
  .match-grid{display:grid; gap:9px; grid-template-columns:repeat(4,1fr); width:100%}
  .tile{min-height:82px; padding:11px; border-radius:11px; font-size:13.2px; line-height:1.35;
    text-align:left; display:flex; align-items:center; border:1px solid var(--line);
    background:var(--panel)}
  .tile.term{font-weight:700; background:var(--amber-soft); font-size:14px}
  .tile[aria-pressed="true"]{border-color:var(--amber); box-shadow:0 0 0 2px var(--amber) inset}
  .tile.matched{opacity:.3; pointer-events:none; border-style:dashed}
  .tile.miss{animation:shake .34s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}
    75%{transform:translateX(5px)}}

  /* ---------- type ---------- */
  .type-input{width:100%; max-width:420px; font:inherit; font-size:18px; padding:13px 15px;
    border-radius:11px; border:1.5px solid var(--line); background:var(--bg2); color:var(--ink);
    text-align:center}
  .type-input:focus{outline:none; border-color:var(--amber)}
  .mask{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.28em;
    font-size:19px; color:var(--amber-dk); margin-top:14px; min-height:26px}

  /* ---------- stats ---------- */
  table{width:100%; border-collapse:collapse; font-size:14.5px}
  th,td{text-align:left; padding:9px 10px; border-bottom:1px solid var(--line)}
  th{font-size:11.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-soft)}
  td.num{text-align:right; font-variant-numeric:tabular-nums}
  .minibar{height:6px; background:var(--amber-soft); border-radius:99px; overflow:hidden;
    width:110px; display:inline-block; vertical-align:middle}
  .minibar i{display:block;height:100%;background:var(--amber)}

  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:center}
  .end-list{width:100%; max-width:560px; text-align:left; margin-top:14px}
  .end-list li{margin-bottom:9px; font-size:14.5px}
  .end-list b{color:var(--amber-dk)}
  footer{margin-top:22px; text-align:center; font-size:12.5px; color:var(--ink-soft)}

  @media (max-width:620px){
    .options{grid-template-columns:1fr}
    .match-grid{grid-template-columns:repeat(2,1fr)}
    h1{font-size:20px}
    .panel{padding:16px}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <svg class="logo" viewBox="0 0 100 100" aria-hidden="true">
      <polygon points="50,6 88,28 88,72 50,94 12,72 12,28" fill="none" stroke="#d99518" stroke-width="6"/>
      <polygon points="50,26 71,38 71,62 50,74 29,62 29,38" fill="#d99518" opacity=".22"/>
      <circle cx="50" cy="50" r="9" fill="#d99518"/>
    </svg>
    <div>
      <h1>Hive <span>Mind</span></h1>
      <p class="tagline">A beekeeping vocabulary game — 21 terms, four ways to play.</p>
    </div>
    <div class="top-actions">
      <button class="icon-btn btn-ghost" id="themeBtn" title="Toggle light/dark">☾</button>
    </div>
  </header>

  <nav class="modes" role="tablist" id="modeTabs">
    <button role="tab" data-mode="learn"  aria-selected="true">🗂 Flashcards</button>
    <button role="tab" data-mode="quiz"   aria-selected="false">❓ Quiz</button>
    <button role="tab" data-mode="match"  aria-selected="false">🔗 Match</button>
    <button role="tab" data-mode="type"   aria-selected="false">⌨️ Name It</button>
    <button role="tab" data-mode="stats"  aria-selected="false">📊 Progress</button>
  </nav>

  <div class="toolbar" id="toolbar">
    <span class="small" style="font-weight:600">Categories:</span>
    <div class="chips" id="catChips"></div>
    <div class="spacer"></div>
    <label class="small" for="dirSel" id="dirLabel">Ask me:</label>
    <select id="dirSel">
      <option value="d2t">Definition → Term</option>
      <option value="t2d">Term → Definition</option>
      <option value="mix">Mix it up</option>
    </select>
  </div>

  <main class="panel" id="panel"></main>

  <footer>Terms drawn from your glossary. Nothing is saved between sessions — reload for a clean slate.</footer>
</div>

<script>
"use strict";

/* ============================================================
   1. THE GLOSSARY
   ============================================================ */
const CATS = {
  parts:   {name:"Hive Parts",     color:"#d99518"},
  gear:    {name:"Tools & Gear",   color:"#8a6bb5"},
  product: {name:"Bee Products",   color:"#3f8f5c"},
  season:  {name:"Season & Cycle", color:"#3f7d9f"},
  behavior:{name:"Bee Behavior",   color:"#c98a3f"},
  health:  {name:"Colony Health",  color:"#c1503f"}
};

const TERMS = [
  {t:"Bee space", c:"parts",
   d:"A gap of roughly ¼ to ⅜ inch that bees generally leave free of comb or propolis.",
   s:"The ¼–⅜ inch gap bees leave open", alt:["beespace","bee-space"]},

  {t:"Queen excluder", c:"parts",
   d:"A grid allowing workers to pass while generally preventing the queen from entering honey supers.",
   s:"Grid that keeps the queen out of the supers", alt:["excluder"]},

  {t:"Bottom board", c:"parts",
   d:"The floor and lower entrance structure of a hive.",
   s:"The hive floor and lower entrance", alt:["bottomboard","floor"]},

  {t:"Burr comb", c:"parts",
   d:"Unwanted comb built outside the intended frame arrangement or between hive components.",
   s:"Stray comb built where it shouldn't be", alt:["brace comb","burr","burrcomb","bracecomb"]},

  {t:"Smoker", c:"gear",
   d:"A bellows-operated device producing cool smoke to reduce defensive behavior during hive work.",
   s:"Bellows device making cool calming smoke", alt:["bee smoker"]},

  {t:"Hive tool", c:"gear",
   d:"A metal pry-and-scrape tool used to separate hive parts, lift frames, and remove wax or propolis.",
   s:"Metal pry-and-scrape bar for hive work", alt:["hivetool"]},

  {t:"Veil", c:"gear",
   d:"Protective clothing used to reduce stings, especially around the face and body.",
   s:"Protective clothing against stings", alt:["bee suit","beesuit","suit","veil / bee suit"]},

  {t:"Extractor", c:"gear",
   d:"A centrifugal device that removes honey from comb while leaving the comb largely intact.",
   s:"Spinner that pulls honey without wrecking comb", alt:["honey extractor"]},

  {t:"Nectar", c:"product",
   d:"Sugar-rich floral liquid collected by bees and processed into honey.",
   s:"Sugary flower liquid that becomes honey", alt:[]},

  {t:"Pollen", c:"product",
   d:"Protein- and nutrient-rich flower material collected by bees as a major food source.",
   s:"Protein-rich flower dust the bees collect", alt:[]},

  {t:"Bee bread", c:"product",
   d:"Stored pollen mixed with nectar or honey and biologically altered within the comb.",
   s:"Fermented pollen stored in the comb", alt:["beebread"]},

  {t:"Propolis", c:"product",
   d:"Plant resin collected by bees and used to seal, reinforce, and protect the hive.",
   s:"Sticky plant resin used to seal the hive", alt:["bee glue","beeglue"]},

  {t:"Capped honey", c:"product",
   d:"Ripened honey sealed inside cells with wax.",
   s:"Ripe honey sealed under wax", alt:["capped"]},

  {t:"Cappings", c:"product",
   d:"Wax covers removed from honey cells before extraction.",
   s:"Wax lids sliced off before extracting", alt:["capping"]},

  {t:"Nectar flow", c:"season",
   d:"A period when abundant floral nectar is available and colonies rapidly store honey.",
   s:"The boom period of abundant nectar", alt:["honey flow","honeyflow","flow","nectarflow"]},

  {t:"Dearth", c:"season",
   d:"A period when little nectar or pollen is available to forage.",
   s:"The lean stretch with little to forage", alt:[]},

  {t:"Robbing", c:"behavior",
   d:"Bees entering another colony to steal its stored honey.",
   s:"Bees raiding another colony's honey", alt:["rob"]},

  {t:"Bearding", c:"behavior",
   d:"Bees clustering outside the hive, commonly because of heat, congestion, or ventilation conditions.",
   s:"Bees hanging outside the hive in the heat", alt:["beard"]},

  {t:"Varroa mite", c:"health",
   d:"A parasitic mite that reproduces in honey-bee colonies and spreads damaging viruses.",
   s:"Parasitic mite that spreads bee viruses", alt:["varroa","mite","varroa destructor"]},

  {t:"Mite load", c:"health",
   d:"A measurement or estimate of the level of Varroa infestation in a colony.",
   s:"How heavily mites have infested a colony", alt:["mite count","mitecount","miteload"]},

  {t:"Winter cluster", c:"season",
   d:"The compact group bees form in cold weather to conserve and generate heat.",
   s:"The tight winter huddle that makes heat", alt:["cluster"]}
];

/* ============================================================
   2. STATE
   ============================================================ */
const S = {
  mode:"learn",
  cats:new Set(Object.keys(CATS)),
  dir:"d2t",
  seen:{},              // term -> {right, wrong}
  quiz:null, learn:null, match:null, type:null
};
TERMS.forEach(t => S.seen[t.t] = {right:0, wrong:0});

const $  = s => document.querySelector(s);
const el = (tag, cls, txt) => { const n=document.createElement(tag);
  if(cls) n.className=cls; if(txt!=null) n.textContent=txt; return n; };
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const pool = () => TERMS.filter(t => S.cats.has(t.c));
const norm = s => s.toLowerCase().replace(/[^a-z0-9]/g,"");
const accepts = t => [t.t, ...t.alt].map(norm);
const dirNow = () => S.dir==="mix" ? (Math.random()<.5?"d2t":"t2d") : S.dir;
const record = (t, ok) => { S.seen[t.t][ok?"right":"wrong"]++; };

/* ============================================================
   3. CHROME: theme, tabs, category chips
   ============================================================ */
$("#themeBtn").onclick = () => {
  const h=document.documentElement;
  const dark = h.getAttribute("data-theme")==="dark";
  h.setAttribute("data-theme", dark?"light":"dark");
  $("#themeBtn").textContent = dark ? "☾" : "☀";
};

function buildChips(){
  const box=$("#catChips"); box.innerHTML="";
  Object.entries(CATS).forEach(([k,v])=>{
    const b=el("button","chip");
    b.innerHTML = `<span class="dot" style="background:${v.color}"></span>${v.name}`;
    b.setAttribute("aria-pressed", S.cats.has(k));
    b.onclick=()=>{
      if(S.cats.has(k)){ if(S.cats.size>1) S.cats.delete(k); }
      else S.cats.add(k);
      buildChips(); render(true);
    };
    box.appendChild(b);
  });
  const all=el("button","chip","All");
  all.onclick=()=>{ S.cats=new Set(Object.keys(CATS)); buildChips(); render(true); };
  box.appendChild(all);
}

$("#modeTabs").onclick = e => {
  const b=e.target.closest("button[data-mode]"); if(!b) return;
  [...$("#modeTabs").children].forEach(x=>x.setAttribute("aria-selected", x===b));
  S.mode=b.dataset.mode; render(true);
};
$("#dirSel").onchange = e => { S.dir=e.target.value; render(true); };

/* ============================================================
   4. RENDER ROUTER
   ============================================================ */
function render(reset){
  const p=$("#panel"); p.innerHTML=""; p.className="panel";
  const showDir = (S.mode==="quiz"||S.mode==="learn");
  $("#dirSel").style.display = showDir ? "" : "none";
  $("#dirLabel").style.display = showDir ? "" : "none";
  if(S.mode==="learn") return renderLearn(p, reset);
  if(S.mode==="quiz")  return renderQuiz(p, reset);
  if(S.mode==="match") return renderMatch(p, reset);
  if(S.mode==="type")  return renderType(p, reset);
  if(S.mode==="stats") return renderStats(p);
}

/* ============================================================
   5. FLASHCARDS
   ============================================================ */
function renderLearn(p, reset){
  if(reset || !S.learn || !S.learn.deck.length){
    S.learn = {deck:shuffle(pool()), i:0, flipped:false, known:new Set()};
  }
  const L=S.learn;
  const deck=L.deck.filter(t=>!L.known.has(t.t));
  if(!deck.length){
    p.classList.add("center");
    p.append(
      el("div","kicker","Deck cleared"),
      el("h2",null,"🍯 You worked through every card."),
      el("p","muted","Nice. Reset the deck to run it again, or jump into the Quiz to prove it.")
    );
    const r=el("div","row"); const b=el("button","btn-primary","Reset deck");
    b.onclick=()=>render(true); r.appendChild(b); p.appendChild(r);
    return;
  }
  if(L.i>=deck.length) L.i=0;
  const t=deck[L.i];
  const d = dirNow()==="t2d" ? "t2d" : "d2t";

  // scorebar
  const sb=el("div","scorebar");
  sb.append(statBlock(L.i+1+" / "+deck.length,"Card"),
            statBlock(L.known.size,"Set aside"),
            statBlock(CATS[t.c].name,"Category"));
  const bar=el("div","bar"); const fill=el("i");
  fill.style.width = Math.round(L.known.size/L.deck.length*100)+"%";
  bar.appendChild(fill); sb.appendChild(bar);
  p.appendChild(sb);

  // card
  const stage=el("div","card-stage");
  const card=el("div","card"+(L.flipped?" flipped":""));
  const front=el("div","face front"), back=el("div","face back");
  if(d==="d2t"){
    front.append(el("div","kicker","What's the term?"), el("div","def",t.d));
    back.append(el("div","kicker","Answer"), el("div","term",t.t),
                el("div","small muted",CATS[t.c].name));
  } else {
    front.append(el("div","kicker","Define it"), el("div","term",t.t));
    back.append(el("div","kicker","Definition"), el("div","def",t.d));
  }
  front.appendChild(el("div","flip-hint","click the card to flip"));
  card.append(front, back);
  card.onclick=()=>{ L.flipped=!L.flipped; card.classList.toggle("flipped"); };
  stage.appendChild(card); p.appendChild(stage);

  // controls
  const row=el("div","row");
  const prev=el("button",null,"‹ Back");
  prev.disabled = L.i===0;
  prev.onclick=()=>{ L.i--; L.flipped=false; render(); };
  const know=el("button",null,"✓ I know this");
  know.onclick=()=>{ L.known.add(t.t); record(t,true); L.flipped=false; render(); };
  const next=el("button","btn-primary","Next ›");
  next.onclick=()=>{ L.i=(L.i+1)%deck.length; L.flipped=false; render(); };
  const shuf=el("button","btn-ghost","🔀 Shuffle");
  shuf.onclick=()=>render(true);
  row.append(prev, know, next, shuf);
  p.appendChild(row);
  p.appendChild(el("p","small muted","Keyboard: ← → to move, Space to flip, K to set aside."));
}

function statBlock(v,label){
  const s=el("div","stat"); s.append(el("b",null,String(v)), el("span",null,label)); return s;
}

/* ============================================================
   6. QUIZ  (multiple choice, 10 questions)
   ============================================================ */
const ROUND=10;
function renderQuiz(p, reset){
  const av=pool();
  if(av.length<4){ return needMore(p,"Quiz needs at least 4 terms — turn on another category."); }
  if(reset || !S.quiz){
    S.quiz={q:0, score:0, streak:0, best:0, answered:false, missed:[],
            order:shuffle(av).slice(0,Math.min(ROUND,av.length)), opts:null, dir:null};
  }
  const Q=S.quiz;

  if(Q.q>=Q.order.length) return quizEnd(p,Q);

  const t=Q.order[Q.q];
  if(!Q.opts){
    Q.dir=dirNow();
    const wrong=shuffle(av.filter(x=>x.t!==t.t)).slice(0,3);
    Q.opts=shuffle([t,...wrong]);
  }

  const sb=el("div","scorebar");
  sb.append(statBlock(Q.q+1+" / "+Q.order.length,"Question"),
            statBlock(Q.score,"Correct"),
            statBlock(Q.streak,"Streak"),
            statBlock(Q.best,"Best streak"));
  const bar=el("div","bar"); const f=el("i");
  f.style.width=Math.round(Q.q/Q.order.length*100)+"%"; bar.appendChild(f); sb.appendChild(bar);
  p.appendChild(sb);

  p.appendChild(el("div","kicker",Q.dir==="d2t"?"Which term fits this definition?":"What does this term mean?"));
  p.appendChild(el("p","prompt", Q.dir==="d2t" ? t.d : t.t));

  const grid=el("div","options");
  Q.opts.forEach(o=>{
    const b=el("button","opt", Q.dir==="d2t" ? o.t : o.d);
    b.onclick=()=>{
      if(Q.answered) return;
      Q.answered=true;
      const ok = o.t===t.t;
      record(t, ok);
      if(ok){ Q.score++; Q.streak++; Q.best=Math.max(Q.best,Q.streak); }
      else { Q.streak=0; Q.missed.push(t); }
      [...grid.children].forEach((c,i)=>{
        c.disabled=true;
        if(Q.opts[i].t===t.t) c.classList.add("correct");
        else if(Q.opts[i]===o) c.classList.add("wrong");
      });
      const fb=el("div","feedback "+(ok?"ok":"no"));
      fb.innerHTML = ok
        ? `<b>Correct.</b> ${escapeHtml(t.t)} — ${escapeHtml(t.d)}`
        : `<b>Not quite.</b> The answer is <b>${escapeHtml(t.t)}</b> — ${escapeHtml(t.d)}`;
      p.appendChild(fb);
      const row=el("div","row"); row.style.marginTop="14px";
      const n=el("button","btn-primary", Q.q+1>=Q.order.length ? "See results ›" : "Next question ›");
      n.onclick=()=>{ Q.q++; Q.opts=null; Q.answered=false; render(); };
      row.appendChild(n); p.appendChild(row); n.focus();
    };
    grid.appendChild(b);
  });
  p.appendChild(grid);
}

function quizEnd(p,Q){
  p.classList.add("center");
  const pct=Math.round(Q.score/Q.order.length*100);
  const verdict = pct===100 ? "Perfect round. You could teach this."
    : pct>=80 ? "Strong. You've got the working vocabulary down."
    : pct>=50 ? "Solid start — a few terms still need a second pass."
    : "Early days. Run the flashcards, then come back.";
  p.append(el("div","kicker","Round complete"),
           el("h2",null,`${Q.score} / ${Q.order.length} — ${pct}%`),
           el("p","muted",verdict),
           el("p","small muted",`Longest streak: ${Q.best}`));
  if(Q.missed.length){
    const h=el("p","kicker","Worth reviewing"); h.style.marginBottom="4px";
    p.appendChild(h);
    const ul=el("ul","end-list");
    Q.missed.forEach(t=>{ const li=el("li");
      li.innerHTML=`<b>${escapeHtml(t.t)}</b> — ${escapeHtml(t.d)}`; ul.appendChild(li); });
    p.appendChild(ul);
  }
  const row=el("div","row"); row.style.marginTop="18px";
  const again=el("button","btn-primary","Play again");
  again.onclick=()=>render(true);
  const rev=el("button",null,"Review flashcards");
  rev.onclick=()=>switchMode("learn");
  row.append(again,rev); p.appendChild(row);
}

/* ============================================================
   7. MATCH  (pair terms to definitions against the clock)
   ============================================================ */
function renderMatch(p, reset){
  const av=pool();
  if(av.length<4) return needMore(p,"Match needs at least 4 terms — turn on another category.");
  const N=Math.min(6, av.length);
  if(reset || !S.match || S.match.done){
    const picks=shuffle(av).slice(0,N);
    S.match={picks, tiles:shuffle([
        ...picks.map(t=>({k:t.t, kind:"term", txt:t.t})),
        ...picks.map(t=>({k:t.t, kind:"def",  txt:t.s}))
      ]), sel:null, matched:new Set(), moves:0, t0:Date.now(), done:false, timer:null};
  }
  const M=S.match;

  const sb=el("div","scorebar");
  const timeStat=statBlock("0:00","Time");
  sb.append(statBlock(M.matched.size+" / "+N,"Pairs"), statBlock(M.moves,"Attempts"), timeStat);
  p.appendChild(sb);
  if(M.timer) clearInterval(M.timer);
  M.timer=setInterval(()=>{
    if(!document.body.contains(timeStat)){ clearInterval(M.timer); return; }
    const s=Math.floor((Date.now()-M.t0)/1000);
    timeStat.querySelector("b").textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
  },500);

  p.appendChild(el("p","small muted","Click a term, then the definition that belongs to it."));

  const grid=el("div","match-grid");
  M.tiles.forEach((tile,idx)=>{
    const b=el("button","tile "+(tile.kind==="term"?"term":""), tile.txt);
    b.setAttribute("aria-pressed","false");
    if(M.matched.has(tile.k)) b.classList.add("matched");
    b.onclick=()=>{
      if(M.matched.has(tile.k)) return;
      if(M.sel===null){ M.sel=idx; b.setAttribute("aria-pressed","true"); return; }
      if(M.sel===idx){ M.sel=null; b.setAttribute("aria-pressed","false"); return; }
      const a=M.tiles[M.sel], other=grid.children[M.sel];
      M.moves++;
      if(a.k===tile.k && a.kind!==tile.kind){
        M.matched.add(tile.k);
        b.classList.add("matched"); other.classList.add("matched");
        other.setAttribute("aria-pressed","false");
        const obj=M.picks.find(x=>x.t===tile.k); if(obj) record(obj,true);
        M.sel=null;
        sb.children[0].querySelector("b").textContent=M.matched.size+" / "+N;
        sb.children[1].querySelector("b").textContent=M.moves;
        if(M.matched.size===N){
          M.done=true; clearInterval(M.timer);
          const secs=Math.round((Date.now()-M.t0)/1000);
          const fb=el("div","feedback ok");
          const acc=Math.round(N/M.moves*100);
          const rating = acc>=90 ? "Clean sweep." : acc>=60 ? "Good board." : "Got there.";
          fb.innerHTML=`<b>${rating} All ${N} pairs matched</b> in ${secs}s across ${M.moves} attempts (${acc}% accuracy).`;
          const bottom=p.querySelector("#matchBottom");
          p.insertBefore(fb, bottom);
          bottom.querySelector("button").className="btn-primary";
          bottom.querySelector("button").textContent="Play a new board ›";
        }
      } else {
        const obj=M.picks.find(x=>x.t===a.k); if(obj) record(obj,false);
        b.classList.add("miss"); other.classList.add("miss");
        setTimeout(()=>{ b.classList.remove("miss"); other.classList.remove("miss"); },340);
        other.setAttribute("aria-pressed","false");
        M.sel=null;
        sb.children[1].querySelector("b").textContent=M.moves;
      }
    };
    grid.appendChild(b);
  });
  p.appendChild(grid);

  const row=el("div","row"); row.style.marginTop="16px"; row.id="matchBottom";
  const nb=el("button","btn-ghost","🔀 New board"); nb.onclick=()=>render(true);
  row.appendChild(nb); p.appendChild(row);
}

/* ============================================================
   8. NAME IT  (type the term from its definition)
   ============================================================ */
function renderType(p, reset){
  const av=pool();
  if(!av.length) return needMore(p,"Turn on at least one category.");
  if(reset || !S.type || S.type.i>=S.type.order.length){
    S.type={order:shuffle(av).slice(0,Math.min(ROUND,av.length)), i:0, score:0,
            points:0, hints:0, streak:0, best:0, missed:[]};
  }
  const T=S.type;
  if(T.i>=T.order.length) return typeEnd(p,T);
  const t=T.order[T.i];

  const sb=el("div","scorebar");
  sb.append(statBlock(T.i+1+" / "+T.order.length,"Term"),
            statBlock(T.points,"Points"),
            statBlock(T.streak,"Streak"),
            statBlock(T.best,"Best"));
  p.appendChild(sb);

  p.appendChild(el("div","kicker","Name the term"));
  p.appendChild(el("p","prompt",t.d));

  const wrapRow=el("div","row");
  const input=el("input","type-input");
  input.type="text"; input.placeholder="type the term…"; input.autocomplete="off";
  wrapRow.appendChild(input); p.appendChild(wrapRow);

  const mask=el("div","mask"); mask.style.textAlign="center"; p.appendChild(mask);
  let revealed=0;
  const letters=t.t.replace(/[^A-Za-z]/g,"");
  const drawMask=()=>{
    if(!revealed){ mask.textContent=""; return; }
    mask.textContent = t.t.split("").map((ch,i)=>{
      if(ch===" ") return " ";
      return i<revealed ? ch : "•";
    }).join("");
  };

  const row=el("div","row"); row.style.marginTop="18px";
  const sub=el("button","btn-primary","Check");
  const hint=el("button",null,"💡 Hint (−1)");
  const skip=el("button","btn-ghost","Skip");
  row.append(sub,hint,skip); p.appendChild(row);

  const done = (ok, msg) => {
    record(t, ok);
    if(ok){ T.score++; T.streak++; T.best=Math.max(T.best,T.streak);
            T.points += Math.max(1, 3-revealed); }
    else { T.streak=0; T.missed.push(t); }
    input.disabled=sub.disabled=hint.disabled=skip.disabled=true;
    const fb=el("div","feedback "+(ok?"ok":"no"));
    fb.innerHTML = msg;
    p.appendChild(fb);
    const r2=el("div","row"); r2.style.marginTop="14px";
    const n=el("button","btn-primary", T.i+1>=T.order.length?"See results ›":"Next ›");
    n.onclick=()=>{ T.i++; render(); };
    r2.appendChild(n); p.appendChild(r2); n.focus();
  };

  sub.onclick=()=>{
    const v=norm(input.value);
    if(!v){ input.focus(); return; }
    const ok = accepts(t).includes(v);
    done(ok, ok
      ? `<b>Yes — ${escapeHtml(t.t)}.</b> ${escapeHtml(t.d)}`
      : `<b>The term is ${escapeHtml(t.t)}.</b> ${escapeHtml(t.d)}`);
  };
  hint.onclick=()=>{
    revealed=Math.min(revealed+1, t.t.length);
    T.hints++; drawMask(); input.focus();
    if(revealed>=t.t.length) hint.disabled=true;
  };
  skip.onclick=()=>done(false, `<b>Skipped — the term is ${escapeHtml(t.t)}.</b> ${escapeHtml(t.d)}`);
  input.onkeydown=e=>{ if(e.key==="Enter") sub.click(); };
  setTimeout(()=>input.focus(),40);
}

function typeEnd(p,T){
  p.classList.add("center");
  p.append(el("div","kicker","Round complete"),
           el("h2",null,`${T.score} / ${T.order.length} named`),
           el("p","muted",`${T.points} points · ${T.hints} hint${T.hints===1?"":"s"} used · best streak ${T.best}`));
  if(T.missed.length){
    const ul=el("ul","end-list");
    T.missed.forEach(t=>{ const li=el("li");
      li.innerHTML=`<b>${escapeHtml(t.t)}</b> — ${escapeHtml(t.d)}`; ul.appendChild(li); });
    p.append(el("p","kicker","Worth reviewing"), ul);
  }
  const row=el("div","row"); row.style.marginTop="18px";
  const again=el("button","btn-primary","Play again"); again.onclick=()=>render(true);
  row.appendChild(again); p.appendChild(row);
}

/* ============================================================
   9. PROGRESS
   ============================================================ */
function renderStats(p){
  let R=0,W=0;
  TERMS.forEach(t=>{ R+=S.seen[t.t].right; W+=S.seen[t.t].wrong; });
  const sb=el("div","scorebar");
  sb.append(statBlock(R+W,"Answers this session"),
            statBlock(R,"Correct"),
            statBlock((R+W)?Math.round(R/(R+W)*100)+"%":"—","Accuracy"));
  p.appendChild(sb);

  if(!(R+W)){
    p.appendChild(el("p","muted","Play a round and your term-by-term accuracy shows up here."));
  }

  // per category
  const catRows=Object.entries(CATS).map(([k,v])=>{
    let r=0,w=0;
    TERMS.filter(t=>t.c===k).forEach(t=>{ r+=S.seen[t.t].right; w+=S.seen[t.t].wrong; });
    return {name:v.name, color:v.color, r, w, n:TERMS.filter(t=>t.c===k).length};
  });
  p.appendChild(el("div","kicker","By category"));
  const t1=el("table");
  t1.innerHTML="<thead><tr><th>Category</th><th>Terms</th><th>Mastery</th><th class='num'>Right</th><th class='num'>Wrong</th></tr></thead>";
  const tb1=el("tbody");
  catRows.forEach(c=>{
    const pct=(c.r+c.w)?Math.round(c.r/(c.r+c.w)*100):0;
    const tr=el("tr");
    tr.innerHTML=`<td><span class="dot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${c.color};margin-right:8px"></span>${c.name}</td>
      <td class="num">${c.n}</td>
      <td><span class="minibar"><i style="width:${pct}%"></i></span> <span class="small muted">${(c.r+c.w)?pct+"%":"—"}</span></td>
      <td class="num">${c.r}</td><td class="num">${c.w}</td>`;
    tb1.appendChild(tr);
  });
  t1.appendChild(tb1); p.appendChild(t1);

  // trouble terms
  const trouble=TERMS.filter(t=>S.seen[t.t].wrong>0)
    .sort((a,b)=>S.seen[b.t].wrong-S.seen[a.t].wrong).slice(0,8);
  if(trouble.length){
    const h=el("div","kicker","Terms tripping you up"); h.style.marginTop="22px";
    p.appendChild(h);
    const t2=el("table");
    t2.innerHTML="<thead><tr><th>Term</th><th>Definition</th><th class='num'>Missed</th></tr></thead>";
    const tb2=el("tbody");
    trouble.forEach(t=>{ const tr=el("tr");
      tr.innerHTML=`<td><b>${escapeHtml(t.t)}</b></td><td class="small">${escapeHtml(t.s)}</td>
        <td class="num">${S.seen[t.t].wrong}</td>`; tb2.appendChild(tr); });
    t2.appendChild(tb2); p.appendChild(t2);
  }

  const row=el("div","row"); row.style.marginTop="20px";
  const rs=el("button","btn-ghost","Reset session stats");
  rs.onclick=()=>{ TERMS.forEach(t=>S.seen[t.t]={right:0,wrong:0}); render(true); };
  const gl=el("button",null,"📖 Show full glossary");
  gl.onclick=()=>showGlossary(p);
  row.append(rs,gl); p.appendChild(row);
}

function showGlossary(p){
  if(p.querySelector("#gloss")) { p.querySelector("#gloss").remove(); return; }
  const box=el("div"); box.id="gloss"; box.style.marginTop="18px";
  box.appendChild(el("div","kicker","All 21 terms"));
  const t=el("table");
  t.innerHTML="<thead><tr><th>Term</th><th>Definition</th><th>Category</th></tr></thead>";
  const tb=el("tbody");
  TERMS.forEach(x=>{ const tr=el("tr");
    tr.innerHTML=`<td style="white-space:nowrap"><b>${escapeHtml(x.t)}</b></td>
      <td class="small">${escapeHtml(x.d)}</td>
      <td class="small muted">${CATS[x.c].name}</td>`; tb.appendChild(tr); });
  t.appendChild(tb); box.appendChild(t); p.appendChild(box);
}

/* ============================================================
   10. HELPERS
   ============================================================ */
function needMore(p,msg){
  p.classList.add("center");
  p.append(el("h2",null,"Not enough terms"), el("p","muted",msg));
}
function switchMode(m){
  S.mode=m;
  [...$("#modeTabs").children].forEach(x=>x.setAttribute("aria-selected", x.dataset.mode===m));
  render(true);
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,
  c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

document.addEventListener("keydown", e=>{
  if(S.mode!=="learn") return;
  if(e.target.tagName==="INPUT") return;
  const card=$(".card"); if(!card) return;
  if(e.key===" "){ e.preventDefault(); card.click(); }
  if(e.key==="ArrowRight"){ const b=[...document.querySelectorAll("button")]
    .find(x=>x.textContent.startsWith("Next")); if(b) b.click(); }
  if(e.key==="ArrowLeft"){ const b=[...document.querySelectorAll("button")]
    .find(x=>x.textContent.startsWith("‹")); if(b && !b.disabled) b.click(); }
  if(e.key.toLowerCase()==="k"){ const b=[...document.querySelectorAll("button")]
    .find(x=>x.textContent.startsWith("✓")); if(b) b.click(); }
});

buildChips();
render(true);
</script>
