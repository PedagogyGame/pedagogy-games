<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Chinese Word Study · 501–600</title>
<style>
:root{--ink:#1a1420;--muted:#6a5c68;--paper:#f6f0ea;--panel:#faf5ef;--line:#d4c6c8;--deep:#120e16;--good:#3a2a52;--bad:#8a3228;--gold:#c9b06a;--jade:#3a2a52;--cinnabar:#8e3b55}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(1100px 640px at 12% -8%,rgba(176,58,50,.26),transparent 54%),linear-gradient(180deg,#120e16 0%,#d5e0d6 46%,#1a1420 100%);color:var(--ink);font-family:Georgia,"Times New Roman","Noto Serif SC","Songti SC",serif;overflow:hidden}
.app{height:100vh;display:grid;grid-template-rows:auto 1fr;gap:0}
.topbar{min-height:58px;display:flex;align-items:center;gap:14px;padding:8px 18px;background:linear-gradient(90deg,#120e16,#3a2a52 42%,#8e3b55 78%,#120e16);color:#f6f0ea;border-bottom:3px solid #c9b06a;box-shadow:0 1px 0 #3a1814}
.brand{font-size:18px;font-weight:700;letter-spacing:.06em;white-space:nowrap}.brand small{font-size:12px;font-weight:400;opacity:.72;margin-left:8px}
.progress{flex:1;max-width:460px;height:7px;background:rgba(255,255,255,.14);border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:linear-gradient(90deg,#c9b06a,#8e3b55);width:1%;transition:width .25s ease}
.stat{font-size:13px;opacity:.9;white-space:nowrap}.topbtn{border:1px solid rgba(198,163,90,.55);background:transparent;color:#f6f0ea;border-radius:4px;padding:7px 10px;cursor:pointer}
.main{min-height:0;display:grid;grid-template-columns:minmax(400px,46%) 1fr;gap:18px;padding:18px}
.quiz{min-height:0;background:rgba(244,248,243,.98);border:3px solid #3a2a52;box-shadow:inset 0 0 0 7px #f3e8ec,inset 0 0 0 8px #c9b06a,0 18px 50px rgba(14,22,19,.32);border-radius:2px;padding:20px 24px 16px;display:flex;flex-direction:column;overflow:auto}
.rankline{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.12em}
.character{text-align:center;font-family:"Noto Serif SC","Songti SC","STSong",serif;font-size:clamp(78px,9.2vw,128px);line-height:.95;margin:10px 0 2px;color:#1a1420;text-shadow:0 1px 0 #fff;letter-spacing:.04em}
.pinyin{text-align:center;font-size:clamp(22px,2.4vw,36px);font-style:italic;color:#8e3b55;margin:0 0 8px}
.front-pinyin{display:none}.prompt{text-align:center;font-size:15px;margin:2px 0 10px;color:#6a5c68}
button{font:600 13px/1.1 Georgia,serif;letter-spacing:.03em}
.controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:3px 0 8px}.controls .nav{display:flex;gap:6px;margin-right:6px}
.ghost,.action{padding:9px 12px;border-radius:4px;cursor:pointer}.ghost{border:1px solid #3a2a52;background:#f6f0ea;color:#120e16}.action{border:1px solid #5a2418;background:#8e3b55;color:#fff}
.reveal{border-top:1px solid #d4c6c8;padding-top:10px;margin-top:2px;animation:fade .18s ease}
.reveal-head{margin-bottom:6px}.reveal-pinyin{font-size:clamp(26px,2.7vw,40px);font-style:italic;color:#8e3b55;font-weight:700}
.glosses{font-size:clamp(20px,2vw,30px);line-height:1.25;margin:4px 0 8px;color:#1a1420}.glosses b{color:#8e3b55}
.wordtitle,.extitle,.chartitle{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#6a5c68;margin:10px 0 5px;font-weight:700}
.charlist{display:flex;gap:8px;flex-wrap:wrap}
.charchip{background:#f3e8ec;border:1px solid #d4c6c8;border-radius:4px;padding:7px 10px;min-width:92px;box-shadow:inset 0 0 0 1px rgba(198,163,90,.35)}
.charchip .wzh{font-family:"Noto Serif SC","Songti SC",serif;font-size:28px;font-weight:700;line-height:1;color:#8e3b55}
.charchip .wpy{font-size:13px;font-style:italic;color:#3a2a52}.charchip .wen{font-size:12px;color:#5a4c54}
.examples{display:grid;gap:6px}
.example{padding:7px 10px;background:#f6f0ea;border-left:4px solid #3a2a52;border-radius:3px;line-height:1.24}
.example-zh{font-family:"Noto Serif SC","Songti SC",serif;font-size:clamp(18px,1.6vw,24px)}
.example-py{font-size:clamp(13px,1.05vw,16px);font-style:italic;color:#8e3b55;margin-top:2px}
.example-en{font-size:clamp(13px,1vw,16px);color:#4a3c44;margin-top:2px}
.example em{font-style:normal;font-weight:800;color:#8e3b55;background:#ead4c4;border-radius:3px;padding:0 .06em}
.flipcard{margin-top:3px;border:1px solid #c9b06a;border-radius:3px;padding:12px 14px;background:#f6f0ea}
.flipcard h3{margin:0 0 7px;font-size:13px;color:#3a2a52;text-transform:uppercase;letter-spacing:.1em}
.english-list{font-size:clamp(22px,2vw,32px);line-height:1.25;margin:4px 0 10px}
.flipcard .reveal-pinyin{margin:0 0 6px}
.further{border:1px solid #3a2a52;background:transparent;color:#3a2a52;border-radius:4px;padding:8px 11px;cursor:pointer}
.imagepane{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;background:rgba(14,22,19,.95);border:3px solid #3a2a52;border-radius:2px;overflow:hidden;box-shadow:inset 0 0 0 7px rgba(198,163,90,.28),0 18px 50px rgba(14,22,19,.34)}
.imagepane:before{content:"";position:absolute;inset:9px;border:1px solid rgba(198,163,90,.55);border-radius:1px;pointer-events:none}
.art{display:block;max-width:94%;max-height:90%;width:auto;height:auto;object-fit:contain;filter:saturate(1.02) contrast(1.03);box-shadow:0 8px 32px rgba(0,0,0,.32);transition:opacity .35s ease,transform .35s ease}.art.wide{max-width:98%;max-height:84%}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@media(max-width:900px){body{overflow:auto}.app{height:auto;min-height:100vh}.main{grid-template-columns:1fr;grid-template-rows:auto minmax(360px,55vh)}.quiz{overflow:visible}.imagepane{min-height:420px}.topbar{flex-wrap:wrap}.progress{order:3;flex-basis:100%;max-width:none}}
@media(max-width:520px){.main{padding:9px;gap:9px}.quiz{padding:14px}.brand small{display:none}.character{font-size:72px}.topbar{padding:8px 10px}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">词语 501–600 <small>most common words</small></div>
    <div class="progress"><i id="progressFill"></i></div>
    <div class="stat" id="cardStat"></div>
    <button class="topbtn" id="shuffleBtn">Shuffle</button>
    <button class="topbtn" id="resetBtn">Reset order</button>
  </header>
  <main class="main">
    <section class="quiz">
      <div class="rankline"><span id="rankLabel"></span></div>
      <div class="character" id="char"></div>
      <div class="pinyin front-pinyin" id="pinyin" aria-hidden="true"></div>
      <div class="prompt">Recognize the word first. Reveal for dictionary English, each character, and three fully translated examples.</div>
      <div class="controls">
        <div class="nav"><button class="ghost" id="prevBtn">← Previous</button><button class="ghost" id="nextBtn">Next →</button></div>
        <button class="action" id="revealBtn">Reveal</button>
        <button class="ghost" id="flipBtn">Flip</button>
      </div>
      <div id="detailArea"></div>
    </section>
    <section class="imagepane" id="imagePane">
      <img class="art" id="art" alt="Study image">
    </section>
  </main>
</div>
<script>
const BANK = [{"rank":501,"word":"按照","pinyin":"àn zhào","en":["according to","in accordance with"],"chars":[{"ch":"按","py":"àn","en":"press; according"},{"ch":"照","py":"zhào","en":"according to; shine"}],"examples":[{"zh":"按照老规矩办事。","pinyin":"àn zhào lǎo guī ju bàn shì.","en":"Handle affairs according to the old rule."},{"zh":"按照他的话去做。","pinyin":"àn zhào tā de huà qù zuò.","en":"Go and do it according to his words."},{"zh":"桥是按照旧图修的。","pinyin":"qiáo shì àn zhào jiù tú xiū de.","en":"The bridge was mended according to the old drawing."}]},{"rank":502,"word":"由于","pinyin":"yóu yú","en":["due to","because of"],"chars":[{"ch":"由","py":"yóu","en":"from; due to"},{"ch":"于","py":"yú","en":"at; in"}],"examples":[{"zh":"由于下雨，路很难走。","pinyin":"yóu yú xià yǔ, lù hěn nán zǒu.","en":"Due to the rain the road is hard to walk."},{"zh":"由于人手不够，桥还没修好。","pinyin":"yóu yú rén shǒu bú gòu, qiáo hái méi xiū hǎo.","en":"Because of too few hands the bridge is not yet mended."},{"zh":"由于天晚，他们住了下来。","pinyin":"yóu yú tiān wǎn, tā men zhù le xia lai.","en":"Because it was late they stayed the night."}]},{"rank":503,"word":"随着","pinyin":"suí zhe","en":["along with","as"],"chars":[{"ch":"随","py":"suí","en":"follow"},{"ch":"着","py":"zhe","en":"aspect particle"}],"examples":[{"zh":"随着天色变暗，风也大了。","pinyin":"suí zhe tiān sè biàn àn, fēng yě dà le.","en":"As the sky darkened, the wind grew as well."},{"zh":"随着日子过去，孩子长大了。","pinyin":"suí zhe rì zi guò qù, hái zi zhǎng dà le.","en":"As the days passed, the child grew up."},{"zh":"随着河水上涨，桥更危险。","pinyin":"suí zhe hé shuǐ shàng zhǎng, qiáo gèng wēi xiǎn.","en":"As the river rose, the bridge grew more dangerous."}]},{"rank":504,"word":"似乎","pinyin":"sì hū","en":["seem","as if"],"chars":[{"ch":"似","py":"sì","en":"resemble"},{"ch":"乎","py":"hū","en":"particle"}],"examples":[{"zh":"天似乎要下雨。","pinyin":"tiān sì hū yào xià yǔ.","en":"The sky seems about to rain."},{"zh":"他似乎并不着急。","pinyin":"tā sì hū bìng bù zháo jí.","en":"He does not seem anxious."},{"zh":"这座桥似乎比从前窄。","pinyin":"zhè zuò qiáo sì hū bǐ cóng qián zhǎi.","en":"This bridge seems narrower than before."}]},{"rank":505,"word":"是否","pinyin":"shì fǒu","en":["whether","if or not"],"chars":[{"ch":"是","py":"shì","en":"be"},{"ch":"否","py":"fǒu","en":"not; or not"}],"examples":[{"zh":"还不知道他是否能来。","pinyin":"hái bù zhī dào tā shì fǒu néng lái.","en":"It is not yet known whether he can come."},{"zh":"先问清楚路是否走得通。","pinyin":"xiān wèn qīng chu lù shì fǒu zǒu de tōng.","en":"First ask clearly whether the road can be taken."},{"zh":"是否下雨，明天才能见。","pinyin":"shì fǒu xià yǔ, míng tiān cái néng jiàn.","en":"Whether it will rain can only be seen tomorrow."}]},{"rank":506,"word":"并且","pinyin":"bìng qiě","en":["and also","moreover"],"chars":[{"ch":"并","py":"bìng","en":"and; together"},{"ch":"且","py":"qiě","en":"and; moreover"}],"examples":[{"zh":"他把信送到了，并且带回了回音。","pinyin":"tā bǎ xìn sòng dào le, bìng qiě dài huí le huí yīn.","en":"He delivered the letter and also brought back a reply."},{"zh":"桥要加宽，并且要把石头换新。","pinyin":"qiáo yào jiā kuān, bìng qiě yào bǎ shí tou huàn xīn.","en":"The bridge must be widened and also given new stone."},{"zh":"他会种地，并且会修车。","pinyin":"tā huì zhòng dì, bìng qiě huì xiū chē.","en":"He can farm, and also mend carts."}]},{"rank":507,"word":"以及","pinyin":"yǐ jí","en":["as well as","and"],"chars":[{"ch":"以","py":"yǐ","en":"take; by"},{"ch":"及","py":"jí","en":"reach; and"}],"examples":[{"zh":"村里的老人以及孩子都来了。","pinyin":"cūn lǐ de lǎo rén yǐ jí hái zi dōu lái le.","en":"The village elders as well as the children all came."},{"zh":"把米以及盐都带上。","pinyin":"bǎ mǐ yǐ jí yán dōu dài shang.","en":"Bring the rice as well as the salt."},{"zh":"桥、路以及井都要照看。","pinyin":"qiáo, lù yǐ jí jǐng dōu yào zhào kàn.","en":"The bridge, the road, as well as the well, must all be looked after."}]},{"rank":508,"word":"任何","pinyin":"rèn hé","en":["any","whatever"],"chars":[{"ch":"任","py":"rèn","en":"any; let"},{"ch":"何","py":"hé","en":"what"}],"examples":[{"zh":"任何人都不能把井填了。","pinyin":"rèn hé rén dōu bù néng bǎ jǐng tián le.","en":"No person whatever may fill in the well."},{"zh":"这件事比任何话都要紧。","pinyin":"zhè jiàn shì bǐ rèn hé huà dōu yào jǐn.","en":"This matter is more urgent than any words."},{"zh":"任何一条路都能到河边。","pinyin":"rèn hé yì tiáo lù dōu néng dào hé biān.","en":"Any of the roads will reach the river."}]},{"rank":509,"word":"整个","pinyin":"zhěng gè","en":["whole","entire"],"chars":[{"ch":"整","py":"zhěng","en":"whole"},{"ch":"个","py":"gè","en":"measure word"}],"examples":[{"zh":"整个村子都来修桥。","pinyin":"zhěng gè cūn zi dōu lái xiū qiáo.","en":"The whole village came to mend the bridge."},{"zh":"雨下了整个下午。","pinyin":"yǔ xià le zhěng gè xià wǔ.","en":"The rain fell the entire afternoon."},{"zh":"他把整个意思说清楚了。","pinyin":"tā bǎ zhěng gè yì si shuō qīng chu le.","en":"He stated the whole meaning clearly."}]},{"rank":510,"word":"如此","pinyin":"rú cǐ","en":["so","such","in this way"],"chars":[{"ch":"如","py":"rú","en":"like; as"},{"ch":"此","py":"cǐ","en":"this"}],"examples":[{"zh":"事情如此紧急，不能再等。","pinyin":"shì qing rú cǐ jǐn jí, bù néng zài děng.","en":"The matter is so urgent it cannot wait."},{"zh":"他待人如此厚道。","pinyin":"tā dài rén rú cǐ hòu dao.","en":"He treats people so kindly."},{"zh":"路如此难走，还是走河边吧。","pinyin":"lù rú cǐ nán zǒu, hái shi zǒu hé biān ba.","en":"The road is so hard; better take the riverbank."}]},{"rank":511,"word":"此外","pinyin":"cǐ wài","en":["besides","in addition"],"chars":[{"ch":"此","py":"cǐ","en":"this"},{"ch":"外","py":"wài","en":"outside"}],"examples":[{"zh":"要带米，此外还要带盐。","pinyin":"yào dài mǐ, cǐ wài hái yào dài yán.","en":"Bring rice; besides that, bring salt as well."},{"zh":"桥要修，此外路也要垫平。","pinyin":"qiáo yào xiū, cǐ wài lù yě yào diàn píng.","en":"The bridge must be mended; besides, the road must be leveled."},{"zh":"此外没有别的话要说。","pinyin":"cǐ wài méi yǒu bié de huà yào shuō.","en":"Besides this there is nothing else to say."}]},{"rank":512,"word":"总之","pinyin":"zǒng zhī","en":["in short","in a word"],"chars":[{"ch":"总","py":"zǒng","en":"overall"},{"ch":" const IMAGES = ["img/01-forbidden-city.jpg", "img/02-baidi-calligraphy.jpg", "img/03-oracle-scapula.jpg", "img/04-plowing-ox.jpg", "img/05-loom-weaver.jpg", "img/06-bronze-pair.jpg", "img/07-terracotta.jpg", "img/08-jiayuguan.jpg", "img/09-nanjing-wall.jpg", "img/10-fengxian-buddha.jpg", "img/11-dong-village.jpg", "img/12-rice-terraces.jpg", "img/13-fenghuang-river.jpg", "img/14-hotpot.jpg", "img/15-cobbler.jpg"];
let order = BANK.map((_,i)=>i), pos=0, state='front';
const $=id=>document.getElementById(id);
function current(){return BANK[order[pos]]}
function safe(t){return String(t).replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>').replace(/"/g,'"').replace(/'/g,'&#039;')}
function mark(sentence,w){return safe(sentence).split(safe(w)).join('<em>'+safe(w)+'</em>')}
function imageForPosition(){const n=IMAGES.length||1;return Math.floor(pos*n/BANK.length)%n}
function setImage(){const idx=imageForPosition(), img=$('art');img.style.opacity=.15;setTimeout(()=>{img.src=IMAGES[idx]; img.onload=()=>{img.classList.toggle('wide',img.naturalWidth/img.naturalHeight>1.75);img.style.opacity=1}},90)}
function renderDetail(mode){const c=current(), d=$('detailArea'); if(mode==='front'){d.innerHTML='';return}
 if(mode==='flip'){d.innerHTML=`<div class="flipcard"><h3>Pinyin + English</h3><div class="reveal-pinyin">${safe(c.pinyin)}</div><div class="english-list">${c.en.map(safe).join(' · ')}</div><button class="further" id="furtherBtn">Reveal further</button></div>`;$('furtherBtn').onclick=()=>{state='revealed';renderDetail('revealed')};return}
 const chars=c.chars.map(w=>`<div class="charchip"><div class="wzh">${safe(w.ch)}</div><div class="wpy">${safe(w.py)}</div><div class="wen">${safe(w.en)}</div></div>`).join('');
 const ex=c.examples.map(x=>`<div class="example"><div class="example-zh">${mark(x.zh,c.word)}</div><div class="example-py">${safe(x.pinyin)}</div><div class="example-en">${safe(x.en)}</div></div>`).join('');
 d.innerHTML=`<div class="reveal"><div class="reveal-head"><div class="reveal-pinyin">${safe(c.pinyin)}</div><p class="glosses"><b>${safe(c.word)}</b> — ${c.en.map(safe).join('; ')}</p></div><div class="chartitle">Characters in this word</div><div class="charlist">${chars}</div><div class="extitle">Example sentences</div><div class="examples">${ex}</div></div>`}
function render(changeImage=true){const c=current();$('char').textContent=c.word;$('pinyin').textContent='';$('rankLabel').textContent=`Word frequency #${c.rank}`;$('cardStat').textContent=`${pos+1} / ${BANK.length}`;$('progressFill').style.width=((pos+1)/BANK.length*100)+'%';state='front';renderDetail('front');if(changeImage)setImage()}
function move(delta){const oldImg=imageForPosition();pos=Math.max(0,Math.min(BANK.length-1,pos+delta));render(imageForPosition()!==oldImg)}
$('prevBtn').onclick=()=>move(-1);$('nextBtn').onclick=()=>move(1);
$('revealBtn').onclick=()=>{state='revealed';renderDetail('revealed')};$('flipBtn').onclick=()=>{state='flip';renderDetail('flip')};
$('shuffleBtn').onclick=()=>{for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}pos=0;render(true)};
$('resetBtn').onclick=()=>{order=BANK.map((_,i)=>i);pos=0;render(true)};
render(true);
</script>
