<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astrology Lexicon Challenge</title>
<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: url('AdobeStock_430818761.jpeg') no-repeat center center fixed;
        background-size: cover;
        font-family: 'Courier New', Courier, monospace;
        color: #fff;
    }
    .glass-panel {
        background: rgba(20, 15, 40, 0.6);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 15px;
        padding: 40px;
        width: 80%;
        max-width: 600px;
        text-align: center;
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    .stats {
        display: flex;
        justify-content: space-between;
        font-size: 1.2rem;
        margin-bottom: 20px;
        color: #b3a0e5;
    }
    .definition {
        font-size: 1.5rem;
        margin-bottom: 30px;
        line-height: 1.4;
    }
    input[type="text"] {
        width: 80%;
        padding: 10px;
        font-size: 1.2rem;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid #b3a0e5;
        color: #fff;
        border-radius: 5px;
        text-align: center;
        outline: none;
    }
    input[type="text"]:focus {
        border-color: #fff;
    }
</style>
</head>
<body>

<div class="glass-panel">
    <div class="stats">
        <span id="scoreDisplay">Core Level: 100%</span>
        <span id="timerDisplay">Time: 15s</span>
    </div>
    <div class="definition" id="definitionText">Loading...</div>
    <input type="text" id="answerInput" placeholder="Type the term..." autocomplete="off">
</div>
