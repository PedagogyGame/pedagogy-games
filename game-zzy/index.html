<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astrology Lexicon Challenge</title>
<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: url('image.png') no-repeat center center fixed;
        background-size: cover;
        font-family: 'Courier New', Courier, monospace;
        color: #fff;
        overflow: hidden;
    }
    
    /* Dynamic Particle Background */
    .particle-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
    }
    .particle {
        position: absolute;
        bottom: -10px;
        width: 3px;
        height: 3px;
        background: #fff;
        border-radius: 50%;
        box-shadow: 0 0 8px #b3a0e5, 0 0 12px #fff;
        animation: floatUp linear infinite;
    }
    @keyframes floatUp {
        0% { transform: translateY(0) scale(0.8); opacity: 0; }
        10% { opacity: 0.8; }
        90% { opacity: 0.5; }
        100% { transform: translateY(-100vh) scale(1.2); opacity: 0; }
    }

    /* Core UI */
    .glass-panel {
        position: relative;
        z-index: 1;
        background: rgba(15, 10, 30, 0.65);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(179, 160, 229, 0.3);
        border-radius: 20px;
        padding: 45px;
        width: 85%;
        max-width: 750px;
        text-align: center;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(179, 160, 229, 0.1);
    }
    .header-bar {
        display: flex;
        justify-content: space-between;
        font-size: 1.3rem;
        margin-bottom: 20px;
        color: #d1c4e9;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 1px;
    }
    .symbol-display {
        font-size: 4.5rem;
        margin-bottom: 10px;
        text-shadow: 0 0 20px rgba(255, 255, 255, 0.9);
        animation: pulse 2s infinite alternate;
    }
    @keyframes pulse {
        0% { transform: scale(1); text-shadow: 0 0 15px rgba(255,255,255,0.7); }
        100% { transform: scale(1.05); text-shadow: 0 0 25px rgba(179,160,229,1); }
    }
    .difficulty-badge {
        font-size: 0.85rem;
        padding: 5px 12px;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid;
        margin-bottom: 25px;
        display: inline-block;
        text-transform: uppercase;
        letter-spacing: 2px;
    }
    .definition {
        font-size: 1.5rem;
        margin-bottom: 35px;
        line-height: 1.6;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
        min-height: 90px;
    }
    input[type="text"] {
        width: 85%;
        padding: 16px;
        font-size: 1.4rem;
        background: rgba(0, 0, 0, 0.4);
        border: 2px solid #b3a0e5;
        color: #fff;
        border-radius: 10px;
        text-align: center;
        outline: none;
        transition: all 0.3s ease;
        text-transform: lowercase;
        box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    }
    input[type="text"]:focus {
        border-color: #d1c4e9;
        background: rgba(255, 255, 255, 0.1);
        box-shadow: 0 0 20px rgba(179, 160, 229, 0.6), inset 0 0 10px rgba(0,0,0,0.5);
    }
    .feedback {
        margin-top: 25px;
        height: 25px;
        font-size: 1.2rem;
        font-weight: bold;
        letter-spacing: 1px;
    }
</style>
</head>
<body>

<div class="particle-container" id="particles"></div>

<div class="glass-panel">
    <div class="header-bar">
        <span id="scoreDisplay">Core Integrity: 100%</span>
        <span id="timerDisplay">Time: --s</span>
    </div>
    <div class="symbol-display" id="symbolDisplay">✨</div>
    <div id="difficultyBadge" class="difficulty-badge">Loading Sequence...</div>
    <div class="definition" id="definitionText">Initializing...</div>
    <input type="text" id="answerInput" placeholder="input term and execute..." autocomplete="off">
    <div class="feedback" id="feedbackText"></div>
</div>

<script>
    // Particle Generator
    function initParticles() {
        const container = document.getElementById('particles');
        for (let i = 0; i < 60; i++) {
            let particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + 'vw';
            particle.style.animationDuration = (Math.random() * 8 + 4) + 's';
            particle.style.animationDelay = Math.random() * 5 + 's';
            container.appendChild(particle);
        }
    }
    initParticles();

    // Vocabulary Database
    const vocabulary = [
        { term: "zodiac", symbol: "🌌", difficulty: "easy", definition: "The belt of sky divided into 12 signs through which planets are interpreted as moving." },
        { term: "sun sign", symbol: "☉", difficulty: "easy", definition: "The sign occupied by the Sun at birth; represents the core ego and overarching identity." },
        { term: "moon sign", symbol: "☽", difficulty: "easy", definition: "The sign occupied by the Moon at birth; associated with emotions, inner needs, and habits." },
        { term: "ascendant", symbol: "🌅", difficulty: "medium", definition: "The sign rising on the eastern horizon at birth; dictates outward personality and first impressions." },
        { term: "natal chart", symbol: "🗺️", difficulty: "medium", definition: "A 360-degree map of the sky calculated for the exact date, time, and location of a person's birth." },
        { term: "house", symbol: "🏠", difficulty: "medium", definition: "One of 12 sectors of the chart that represent different areas of everyday life." },
        { term: "planet", symbol: "🪐", difficulty: "easy", definition: "The principal celestial bodies used as symbolic points of energetic influence." },
        { term: "midheaven", symbol: "⛰️", difficulty: "hard", definition: "The highest chart point; linked to public life, career, reputation, and life direction." },
        { term: "imum coeli", symbol: "🌱", difficulty: "hard", definition: "The lowest point in the chart; associated with home, roots, family, and private life." },
        { term: "descendant", symbol: "🤝", difficulty: "medium", definition: "The point opposite the Ascendant; associated with partnerships and one-to-one relationships." },
        { term: "chart ruler", symbol: "👑", difficulty: "hard", definition: "The specific planet traditionally associated with governing the Ascendant." },
        { term: "element", symbol: "🔥", difficulty: "easy", definition: "The four fundamental qualities of the signs: Fire, Earth, Air, and Water." },
        { term: "modality", symbol: "⚙️", difficulty: "medium", definition: "The three behavioral modes of expression: Cardinal, Fixed, and Mutable." },
        { term: "polarity", symbol: "☯️", difficulty: "medium", definition: "The grouping of signs into masculine (yang) and feminine (yin) categories." },
        { term: "domicile", symbol: "🏰", difficulty: "hard", definition: "When a planet occupies the natural sign it rules and feels completely at home." },
        { term: "exaltation", symbol: "⭐", difficulty: "hard", definition: "A sign placement regarded as especially favorable, elevated, or strong for a planet." },
        { term: "detriment", symbol: "⛓️", difficulty: "hard", definition: "A sign opposite a planet’s rulership, where its energy is viewed as struggling." },
        { term: "fall", symbol: "🍂", difficulty: "hard", definition: "A sign opposite a planet’s exaltation, traditionally interpreted as a difficult placement." },
        { term: "aspect", symbol: "📐", difficulty: "medium", definition: "The angular relationship between two chart placements that shows how their energies interact." },
        { term: "conjunction", symbol: "☌", difficulty: "medium", definition: "Two planets positioned close together (~0° apart); strongly blends their energies." },
        { term: "sextile", symbol: "⚹", difficulty: "medium", definition: "Planets ~60° apart; offers opportunity and cooperative energy." },
        { term: "square", symbol: "□", difficulty: "medium", definition: "Planets ~90° apart; produces friction, challenges, and a drive to act." },
        { term: "trine", symbol: "△", difficulty: "medium", definition: "Planets ~120° apart; indicates ease, harmonious flow, and natural talent." },
        { term: "opposition", symbol: "☍", difficulty: "medium", definition: "Planets ~180° apart; creates tension, highlights polarities, and demands balance." },
        { term: "orb", symbol: "⭕", difficulty: "hard", definition: "The allowed degree of distance from an exact aspect for the connection to still be considered active." },
        { term: "transit", symbol: "🚀", difficulty: "medium", definition: "The current, real-time movement of planets interacting with a natal chart." },
        { term: "retrograde", symbol: "☡", difficulty: "medium", definition: "The apparent backward motion of a planet; associated with delays or review." },
        { term: "ephemeris", symbol: "📖", difficulty: "hard", definition: "A mathematical table or database showing the calculated positions of celestial bodies over time." },
        { term: "lunar nodes", symbol: "☊", difficulty: "hard", definition: "Mathematical points where the Moon’s orbit crosses the ecliptic; associated with karmic direction." },
        { term: "synastry", symbol: "💞", difficulty: "hard", definition: "The practice of mathematically comparing two different natal charts to analyze compatibility." }
    ];

    let currentTermIndex = 0;
    let score = 100;
    let timeAllotted = 15;
    let timeLeft = 0;
    let timerInterval;
    let isProcessing = false;

    vocabulary.sort(() => Math.random() - 0.5);

    const ui = {
        score: document.getElementById('scoreDisplay'),
        timer: document.getElementById('timerDisplay'),
        symbol: document.getElementById('symbolDisplay'),
        badge: document.getElementById('difficultyBadge'),
        definition: document.getElementById('definitionText'),
        input: document.getElementById('answerInput'),
        feedback: document.getElementById('feedbackText')
    };

    function loadTerm() {
        if (currentTermIndex >= vocabulary.length) {
            endGame("Challenge Complete. Lexicon Mastered.");
            return;
        }
        
        isProcessing = false;
        const currentData = vocabulary[currentTermIndex];
        
        ui.definition.innerText = currentData.definition;
        ui.symbol.innerText = currentData.symbol;
        ui.badge.innerText = `Class: ${currentData.difficulty}`;
        
        const colors = { easy: "#a8e6cf", medium: "#ffd3b6", hard: "#ff8b94" };
        ui.badge.style.color = colors[currentData.difficulty];
        ui.badge.style.borderColor = colors[currentData.difficulty];

        ui.input.value = '';
        ui.input.style.borderColor = "#b3a0e5";
        ui.input.focus();
        
        timeAllotted = (currentData.difficulty === "hard" || currentData.term.length > 9) ? 20 : 15;
        timeLeft = timeAllotted;
        
        startTimer();
    }

    function startTimer() {
        clearInterval(timerInterval);
        ui.timer.innerText = `Time: ${timeLeft}s`;
        
        timerInterval = setInterval(() => {
            timeLeft--;
            ui.timer.innerText = `Time: ${timeLeft}s`;
            
            ui.timer.style.color = (timeLeft <= 5) ? "#ff8b94" : "#d1c4e9";

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                handleAnswer(false, true);
            }
        }, 1000);
    }

    function handleAnswer(isCorrect, isTimeout = false) {
        if (isProcessing) return;
        isProcessing = true;
        clearInterval(timerInterval);
        
        const currentData = vocabulary[currentTermIndex];
        const penalties = { easy: 30, medium: 25, hard: 20 };
        
        if (isCorrect) {
            const speedBonusActive = (timeLeft >= timeAllotted - 5);
            if (speedBonusActive) score += 10;
            
            ui.feedback.innerText = speedBonusActive ? "Match confirmed. +10% Speed Bonus" : "Match confirmed.";
            ui.feedback.style.color = "#a8e6cf";
            ui.input.style.borderColor = "#a8e6cf";
            currentTermIndex++;
            
        } else {
            const penalty = penalties[currentData.difficulty];
            score -= penalty; 
            
            if (isTimeout) {
                ui.feedback.innerText = `Timeout. -${penalty}% Integrity`;
            } else {
                ui.feedback.innerText = `Data mismatch. -${penalty}% Integrity`;
                ui.input.style.borderColor = "#ff8b94";
            }
            ui.feedback.style.color = "#ff8b94";
        }
        
        ui.score.innerText = `Core Integrity: ${score}%`;
        
        if (score <= 0) {
            ui.score.innerText = `Core Integrity: 0%`;
            endGame("Integrity Depleted. Simulation Terminated.");
        } else if (isCorrect || isTimeout) {
            setTimeout(() => {
                ui.feedback.innerText = "";
                loadTerm();
            }, 1200);
        } else {
            setTimeout(() => {
                isProcessing = false;
                startTimer();
                ui.input.style.borderColor = "#b3a0e5";
                ui.feedback.innerText = "";
            }, 1000);
        }
    }

    function endGame(message) {
        clearInterval(timerInterval);
        ui.definition.innerText = message;
        ui.symbol.innerText = "🛑";
        ui.badge.style.display = 'none';
        ui.input.style.display = 'none';
        ui.timer.innerText = "";
        ui.feedback.innerText = "";
    }

    ui.input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            const userAnswer = ui.input.value.trim().toLowerCase();
            const correctAnswer = vocabulary[currentTermIndex].term.toLowerCase();
            if (userAnswer !== "") {
                handleAnswer(userAnswer === correctAnswer);
            }
        }
    });

    loadTerm();
</script>
</body>
</html>
