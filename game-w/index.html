<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="A self-contained timed anatomy vocabulary challenge for ear, nose, and throat study.">
  <title>ENT Definition Stage</title>
  <style>


:root { --ink:#e9edf0; --muted:#8f999f; --deep:#090c0e; --panel:#111619; --line:#283238; --cyan:#61e3dc; --coral:#ff755f; --gold:#e6b85c; }
* { box-sizing:border-box; }
html,body { margin:0; min-height:100%; background:var(--deep); }
body { color:var(--ink); font-family:Arial,Helvetica,sans-serif; }
button,input { font:inherit; } button { color:inherit; }
.stage-shell { min-height:100vh; overflow:hidden; background:radial-gradient(circle at 50% 28%,#182024 0,#0d1113 40%,#080a0b 75%); }
.topbar { height:62px; padding:0 3.2vw; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; border-bottom:1px solid #22292d; background:#07090ad6; }
.wordmark { font-family:Georgia,serif; letter-spacing:.02em; font-size:16px; }
.wordmark span { display:inline-grid; place-items:center; width:34px; height:24px; margin-right:10px; border:1px solid var(--cyan); color:var(--cyan); font-family:Arial,sans-serif; font-size:10px; letter-spacing:.14em; }
.session-meta,.sound-button { color:#778188; font-size:9px; letter-spacing:.22em; }.sound-button { justify-self:end; }
.stage { position:relative; min-height:calc(100vh - 132px); padding:26px 5vw 108px; isolation:isolate; }
.stage-kicker { margin:0 0 14px 7.4vw; color:#677178; font-size:9px; letter-spacing:.24em; }
.anatomy-row { width:min(1120px,84vw); margin:0 auto; display:grid; grid-template-columns:repeat(5,1fr); border:1px solid #30383d; background:#0d1214; box-shadow:0 28px 80px #0009; }
.anatomy-panel { position:relative; min-width:0; padding:11px 10px 9px; border-right:1px solid #283036; color:#748087; transition:background .35s,color .35s,box-shadow .35s; }
.anatomy-panel:last-child { border-right:0; }.anatomy-panel.active { color:var(--cyan); background:linear-gradient(180deg,#142426,#101719); box-shadow:inset 0 -2px var(--cyan),0 0 32px #44d5ce17; }
.anatomy-panel svg { display:block; width:100%; height:100px; overflow:visible; }.anatomy-panel>span { display:block; border-top:1px solid #293136; padding-top:8px; font-size:9px; letter-spacing:.18em; text-transform:uppercase; }
.panel-index { position:absolute; top:8px; left:9px; color:#4d575d; font-size:8px; letter-spacing:.12em; }
.line,.accent,.warm,.guide,.arrow,.dot { fill:none; stroke:#cbd3d6; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; vector-effect:non-scaling-stroke; }
.accent { stroke:var(--cyan); }.warm { stroke:var(--coral); }.guide { stroke:#68757b; stroke-dasharray:3 4; }.dot { fill:var(--gold); stroke:none; }.arrow { stroke:var(--gold); }
.anatomy-panel.active .line { stroke:#f0f6f6; filter:drop-shadow(0 0 5px #fff2); }.anatomy-panel.active .accent { filter:drop-shadow(0 0 5px #61e3dc88); }.anatomy-panel.active .warm { filter:drop-shadow(0 0 5px #ff755f77); }
.game-console { position:relative; z-index:5; width:min(720px,72vw); margin:34px auto 0; padding:22px 28px 19px; border:1px solid #3a454a; background:linear-gradient(145deg,#161c1ffa,#0c1012fa); box-shadow:0 26px 70px #000b,inset 0 1px #ffffff0a; }
.game-console::before { content:""; position:absolute; inset:-1px; pointer-events:none; border-top:1px solid #85929845; }.console-head { display:flex; justify-content:space-between; align-items:flex-start; }
.micro-label,form label { color:#7d898f; font-size:8px; letter-spacing:.23em; }.difficulty { margin-top:8px; color:#a2abb0; font-size:8px; letter-spacing:.14em; }
.level { display:inline-block; width:6px; height:6px; margin-right:5px; border-radius:50%; background:var(--gold); box-shadow:0 0 8px #e6b85c66; }.level-30 { background:var(--coral); }.level-20 { background:var(--cyan); }
.timer { display:flex; align-items:baseline; gap:7px; color:var(--cyan); }.timer span { font-family:Georgia,serif; font-size:34px; line-height:1; font-variant-numeric:tabular-nums; }.timer small { color:#7b858b; font-size:7px; letter-spacing:.2em; }.timer.urgent { color:var(--coral); animation:pulse 1s infinite; }
.timer-track { height:2px; margin:16px 0 22px; background:#2a3236; }.timer-track div { height:100%; background:var(--cyan); transition:width .9s linear; }
blockquote { min-height:76px; margin:0 0 22px; max-width:620px; font-family:Georgia,serif; font-size:clamp(18px,2vw,24px); line-height:1.42; letter-spacing:-.01em; }
form label { display:block; margin-bottom:7px; }.answer-row { display:grid; grid-template-columns:1fr auto; gap:8px; }.answer-row input { min-width:0; height:46px; padding:0 15px; border:1px solid #445158; outline:none; background:#0a0e10; color:#f5f7f8; font-size:15px; transition:border .2s,box-shadow .2s; }
.answer-row input:focus { border-color:var(--cyan); box-shadow:0 0 0 3px #61e3dc12; }.answer-row input::placeholder { color:#4f5b61; }
.answer-row button,.primary-action { height:46px; padding:0 19px; border:1px solid var(--cyan); background:#163331; color:var(--cyan); cursor:pointer; font-size:9px; font-weight:bold; letter-spacing:.17em; }.answer-row button span { margin-left:10px; font-size:13px; }.answer-row button:hover,.primary-action:hover { background:#204642; }
.answer-row button:disabled { cursor:default; opacity:.72; background:#132220; }
.feedback { min-height:18px; padding-top:11px; color:#778188; font-size:10px; letter-spacing:.05em; }.feedback.correct { color:var(--cyan); }.feedback.wrong { color:var(--coral); }.game-console.correct { border-color:#61e3dc77; }.game-console.wrong { border-color:#ff755f77; }.primary-action { width:100%; margin-top:5px; }
.presenter { position:absolute; z-index:2; left:calc(50% - min(610px,45vw)); top:238px; width:72px; height:230px; opacity:.52; transform:scale(.88); transform-origin:bottom; }
.presenter-head { position:absolute; left:22px; top:0; width:31px; height:38px; border-radius:46% 52% 48% 47%; background:#485157; box-shadow:inset -5px 0 #343b3f; }.presenter-body { position:absolute; left:8px; top:34px; width:55px; height:155px; border-radius:23px 20px 8px 8px; background:linear-gradient(90deg,#252b2f,#444c51 58%,#252a2e); clip-path:polygon(22% 0,76% 0,100% 34%,81% 100%,16% 100%,0 37%); }
.presenter-arm { position:absolute; left:49px; top:53px; width:58px; height:9px; border-radius:7px; background:#3f484d; transform:rotate(-24deg); transform-origin:left center; }.stylus { position:absolute; left:99px; top:31px; width:47px; height:1px; background:#9aa5aa; transform:rotate(-24deg); }
.stage-floor { position:absolute; z-index:-1; left:-10%; right:-10%; bottom:0; height:30%; transform:perspective(500px) rotateX(58deg); transform-origin:bottom; background:linear-gradient(#151a1d,#080a0b); border-top:1px solid #31383c; }
.audience { position:absolute; z-index:8; left:8%; right:8%; bottom:-39px; display:flex; justify-content:space-between; align-items:flex-end; opacity:.66; filter:blur(3px); }.audience i { display:block; width:112px; height:88px; border-radius:50% 50% 0 0; background:#030404; }.audience i:nth-child(2){width:86px;height:70px}.audience i:nth-child(3){width:126px;height:96px}.audience i:nth-child(4){width:94px;height:77px}
.scorebar { position:relative; z-index:10; min-height:70px; padding:0 3.2vw; display:grid; grid-template-columns:auto minmax(110px,1fr) auto auto; gap:24px; align-items:center; border-top:1px solid #2a3236; background:#090c0e; }.score-group { display:flex; align-items:baseline; gap:12px; }.score-group span,.legend,.scorebar button { color:#68737a; font-size:8px; letter-spacing:.17em; }.score-group strong { color:var(--cyan); font-family:Georgia,serif; font-size:28px; font-weight:normal; }.session-progress { height:2px; background:#283034; }.session-progress span { display:block; height:100%; background:var(--gold); transition:width .35s; }
.legend { display:flex; gap:18px; }.legend span { white-space:nowrap; }.legend i { display:inline-block; width:5px; height:5px; margin-right:5px; border-radius:50%; }.bonus-dot{background:var(--cyan)}.risk-dot{background:var(--coral)}.scorebar button { border:1px solid #313a3f; padding:10px 12px; background:transparent; cursor:pointer; }.scorebar button:hover { color:#cdd4d7; border-color:#68757b; }
@keyframes pulse { 50% { opacity:.55; } }
@media (max-width:900px) { .topbar{grid-template-columns:1fr auto}.session-meta{display:none}.stage{padding-inline:18px}.anatomy-row{width:100%;grid-template-columns:repeat(5,minmax(130px,1fr));overflow-x:auto}.anatomy-panel{min-width:140px}.game-console{width:min(660px,92vw)}.presenter{display:none}.scorebar{grid-template-columns:auto 1fr auto}.legend{display:none} }
@media (max-width:560px) { .topbar{height:54px;padding-inline:15px}.sound-button{font-size:7px}.wordmark{font-size:13px}.stage{min-height:calc(100vh - 122px);padding-top:16px;padding-bottom:86px}.stage-kicker{margin-left:0}.anatomy-panel svg{height:76px}.anatomy-panel{min-width:122px}.game-console{width:100%;margin-top:20px;padding:18px 16px 16px}.timer span{font-size:29px}blockquote{min-height:105px;font-size:18px}.answer-row{grid-template-columns:1fr}.answer-row button{width:100%}.scorebar{min-height:68px;padding:8px 14px;gap:12px;grid-template-columns:auto 1fr}.session-progress{display:none}.scorebar button{justify-self:end}.score-group strong{font-size:23px} }
@media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none!important; transition:none!important; } }

  [hidden]{display:none!important}
  </style>
</head>
<body>
  <main class="stage-shell">
    <header class="topbar">
      <div class="wordmark"><span>ENT</span> Definition Stage</div>
      <div class="session-meta">SESSION 01 · CLINICAL FOUNDATIONS</div>
      <div class="sound-button">KEYBOARD READY</div>
    </header>

    <section class="stage" aria-label="Anatomy lecture game stage">
      <div class="stage-kicker">ANATOMICAL RECALL / LIVE STUDY</div>
      <div class="anatomy-row" aria-label="Ear, nose, and throat anatomy overview">
        <div class="anatomy-panel" data-system="overview" aria-label="Head and neck anatomy panel">
          <div class="panel-index">01</div>
          <svg viewBox="0 0 190 118" role="img" aria-hidden="true"><path class="line" d="M43 95c-8-17-7-48 2-66 10-19 34-21 48-9 9 8 10 18 7 28-3 11 6 17 12 21 5 4 6 14 1 21"/><path class="accent" d="M52 43h34l12 12-8 13H65"/><path class="warm" d="M86 67c3 16 2 25 10 33M105 70v32"/><circle class="dot" cx="88" cy="56" r="3"/><path class="guide" d="M91 56h49"/></svg>
          <span>Head &amp; neck</span>
        </div>
        <div class="anatomy-panel" data-system="ear" aria-label="Ear anatomy panel">
          <div class="panel-index">02</div>
          <svg viewBox="0 0 190 118" role="img" aria-hidden="true"><path class="line" d="M35 54c-6-28 34-31 38-5 2 15-15 21-20 9-3-7 6-14 12-7"/><path class="accent" d="M69 54h25l8-8 8 10 9-7"/><path class="warm" d="M122 45c21-2 24 20 11 30-10 8-28 0-23-13 4-10 20-8 20 2"/><path class="line" d="M133 77l13 22M130 42c8-18 25-16 19-1M139 48c14-9 19 5 9 12"/></svg>
          <span>Ear</span>
        </div>
        <div class="anatomy-panel" data-system="nose" aria-label="Nose and sinus anatomy panel">
          <div class="panel-index">03</div>
          <svg viewBox="0 0 190 118" role="img" aria-hidden="true"><path class="line" d="M49 90c8-13 13-27 14-51 0-14 20-23 35-14l19 20-12 45"/><path class="accent" d="M67 49c18-12 34-10 44 0M69 60c19-9 31-7 39 0M70 70c15-5 26-4 35 2"/><path class="warm" d="M85 28c2 15 2 35 0 57"/><path class="guide" d="M45 77c22 12 47 13 80 5"/></svg>
          <span>Nose &amp; sinus</span>
        </div>
        <div class="anatomy-panel" data-system="throat" aria-label="Larynx anatomy panel">
          <div class="panel-index">04</div>
          <svg viewBox="0 0 190 118" role="img" aria-hidden="true"><path class="line" d="M78 21c14 12 18 25 11 37-8 13-7 27 4 45M111 23c-13 13-16 25-8 38 8 12 7 27-3 42"/><path class="accent" d="M83 52l25 1M82 61l27 1"/><path class="warm" d="M88 75h16M88 82h16M89 89h14M90 96h12"/><path class="guide" d="M109 56h39"/><circle class="dot" cx="105" cy="57" r="3"/></svg>
          <span>Larynx</span>
        </div>
        <div class="anatomy-panel" data-system="pathway" aria-label="Sound pathway anatomy panel">
          <div class="panel-index">05</div>
          <svg viewBox="0 0 190 118" role="img" aria-hidden="true"><path class="guide" d="M19 56c11-17 20 17 31 0s20 17 31 0"/><path class="accent" d="M86 34v45M96 40v33"/><circle class="warm" cx="116" cy="56" r="11"/><path class="line" d="M127 56h16l17-18M143 56l17 18"/><path class="arrow" d="M25 91h124"/></svg>
          <span>Sound pathway</span>
        </div>
      </div>

      <div class="presenter" aria-hidden="true"><div class="presenter-head"></div><div class="presenter-body"></div><div class="presenter-arm"></div><div class="stylus"></div></div>

      <section id="game-console" class="game-console playing" aria-live="polite">
        <div class="console-head">
          <div><span id="prompt-count" class="micro-label"></span><div id="difficulty" class="difficulty"></div></div>
          <div id="timer" class="timer"><span id="time-value">15</span><small>SECONDS</small></div>
        </div>
        <div class="timer-track"><div id="timer-fill"></div></div>
        <blockquote id="definition"></blockquote>
        <form id="answer-form">
          <label for="term-answer">TYPE THE CORRECT TERM</label>
          <div class="answer-row"><input id="term-answer" autocomplete="off" spellcheck="false" placeholder="Your answer…"><button id="submit-button" type="submit">SUBMIT <span>↵</span></button></div>
        </form>
        <button id="restart-main" class="primary-action" type="button" hidden>Begin a new session</button>
        <div id="feedback" class="feedback playing">Identify the term before the timer closes.</div>
      </section>

      <div class="stage-floor"></div><div class="audience" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    </section>

    <footer class="scorebar">
      <div class="score-group"><span>OPTOMETRIST MATERIAL</span><strong id="score">100%</strong></div>
      <div class="session-progress"><span id="progress"></span></div>
      <div class="legend"><span><i class="bonus-dot"></i> BONUS: &gt;5 SEC EARLY · HARDEST &lt;15 SEC</span><span><i class="risk-dot"></i> MISSED −20–30%</span></div>
      <button id="reset-button" type="button">RESET SESSION</button>
    </footer>
  </main>

  <script>
  (() => {
    "use strict";
    const TERMS = [{"term":"Aerodigestive tract","definition":"The shared upper passages for breathing and swallowing, from nose and mouth through the pharynx and larynx.","penalty":20,"system":"overview","aliases":[]},{"term":"Respiratory epithelium","definition":"The ciliated, mucus-producing lining of the airway, sinuses, and middle ear.","penalty":25,"system":"overview","aliases":[]},{"term":"Mucociliary clearance","definition":"Coordinated ciliary transport of the mucus blanket, continuously sweeping trapped particles out of the airways and sinuses.","penalty":30,"system":"overview","aliases":[]},{"term":"Pharyngeal (branchial) arches","definition":"Paired embryonic structures that give rise to the bones, muscles, and nerves of the head and neck.","penalty":30,"system":"overview","aliases":["Branchial arches","Pharyngeal arches"]},{"term":"Waldeyer's ring","definition":"The circle of lymphoid tissue guarding the upper pharynx: adenoid, tubal, palatine, and lingual tonsils.","penalty":30,"system":"overview","aliases":[]},{"term":"Deep neck spaces","definition":"Fascia-bounded compartments of the neck that determine how infections spread.","penalty":30,"system":"overview","aliases":[]},{"term":"Flexible nasolaryngoscopy","definition":"In-office endoscopy passed through the nose to inspect the nasal cavity, pharynx, and larynx.","penalty":25,"system":"overview","aliases":[]},{"term":"Outer ear","definition":"The pinna and ear canal; collects and funnels sound to the eardrum.","penalty":20,"system":"ear","aliases":[]},{"term":"Middle ear","definition":"The air-filled, ossicle-containing space between eardrum and inner ear, ventilated by the Eustachian tube.","penalty":20,"system":"ear","aliases":[]},{"term":"Inner ear","definition":"The fluid-filled labyrinth housing the cochlea for hearing and vestibular organs for balance.","penalty":20,"system":"ear","aliases":[]},{"term":"Tympanic membrane","definition":"The eardrum; converts arriving sound waves into mechanical vibration.","penalty":20,"system":"ear","aliases":["Eardrum"]},{"term":"Ossicular chain","definition":"Malleus, incus, and stapes; the linked bones carrying eardrum vibration to the cochlea.","penalty":25,"system":"ear","aliases":["Ossicles"]},{"term":"Impedance matching","definition":"The middle ear's mechanical amplification that overcomes the energy loss of sound passing from air into cochlear fluid.","penalty":30,"system":"pathway","aliases":[]},{"term":"Eustachian tube dysfunction","definition":"Failure of the tube connecting middle ear to nasopharynx to ventilate and equalize pressure.","penalty":25,"system":"ear","aliases":["ETD"]},{"term":"Cochlea","definition":"The spiral inner-ear organ that converts fluid vibration into neural signals.","penalty":20,"system":"ear","aliases":[]},{"term":"Hair cells","definition":"The cochlea's non-regenerating mechanosensors; inner cells transduce sound into nerve signals, while outer cells amplify it.","penalty":25,"system":"ear","aliases":[]},{"term":"Tonotopy","definition":"The orderly mapping of sound frequency to position: high frequencies at the cochlear base, low at the apex.","penalty":30,"system":"pathway","aliases":[]},{"term":"Conductive hearing loss","definition":"Loss caused by blocked or impaired sound transmission through the outer or middle ear.","penalty":20,"system":"ear","aliases":[]},{"term":"Sensorineural hearing loss","definition":"Loss caused by damage to the cochlea or auditory nerve.","penalty":20,"system":"ear","aliases":[]},{"term":"Pure-tone threshold","definition":"The softest level, in decibels, at which a given frequency is reliably heard.","penalty":30,"system":"pathway","aliases":[]},{"term":"Audiogram","definition":"The chart of pure-tone thresholds across frequencies for each ear, by air and bone conduction.","penalty":20,"system":"pathway","aliases":[]},{"term":"Air-bone gap","definition":"Air-conduction thresholds worse than bone-conduction thresholds; the audiometric signature of a conductive component.","penalty":30,"system":"pathway","aliases":[]},{"term":"Tympanometry","definition":"Measurement of eardrum mobility against varying canal pressure; detects fluid, perforation, and pressure problems.","penalty":25,"system":"pathway","aliases":[]},{"term":"Otoacoustic emissions","definition":"Faint sounds generated by healthy outer hair cells; the basis of newborn hearing screening.","penalty":30,"system":"pathway","aliases":[]},{"term":"Auditory brainstem response","definition":"Evoked electrical potentials tracking sound through the nerve and brainstem; objective testing requiring no participation.","penalty":30,"system":"pathway","aliases":["ABR"]},{"term":"Weber test","definition":"A midline tuning-fork test in which sound lateralizes toward a conductive loss and away from a sensorineural loss.","penalty":25,"system":"pathway","aliases":[]},{"term":"Rinne test","definition":"Comparison of air versus bone conduction at one ear; bone louder than air indicates conductive loss.","penalty":25,"system":"pathway","aliases":[]},{"term":"Acute otitis media","definition":"Acute infection of the middle ear with an inflamed, bulging eardrum.","penalty":20,"system":"ear","aliases":["AOM"]},{"term":"Otitis media with effusion","definition":"Non-infected middle-ear fluid, typically from Eustachian tube dysfunction, causing hearing loss without acute illness.","penalty":25,"system":"ear","aliases":["OME"]},{"term":"Cholesteatoma","definition":"A destructive growth of keratinizing squamous epithelium in the middle ear or mastoid that erodes bone.","penalty":25,"system":"ear","aliases":[]},{"term":"Otosclerosis","definition":"Abnormal bone remodeling that fixes the stapes footplate, producing progressive conductive loss.","penalty":25,"system":"ear","aliases":[]},{"term":"Presbycusis","definition":"Age-related, bilateral, high-frequency sensorineural hearing loss.","penalty":20,"system":"ear","aliases":[]},{"term":"Ototoxicity","definition":"Inner-ear damage caused by drugs such as aminoglycosides, cisplatin, and loop diuretics.","penalty":25,"system":"ear","aliases":[]},{"term":"Tinnitus","definition":"Perception of sound in the absence of an external source.","penalty":20,"system":"ear","aliases":[]},{"term":"Retrocochlear lesion","definition":"Pathology of the auditory nerve or brainstem beyond the cochlea; the reason asymmetric findings prompt imaging.","penalty":30,"system":"pathway","aliases":[]},{"term":"Vestibular schwannoma","definition":"A benign tumor of the eighth nerve's Schwann cells; the classic cause of unilateral sensorineural loss and tinnitus.","penalty":30,"system":"ear","aliases":[]},{"term":"Vestibular labyrinth","definition":"The inner-ear balance apparatus: semicircular canals plus otolith organs.","penalty":25,"system":"ear","aliases":[]},{"term":"Semicircular canals","definition":"Three mutually perpendicular fluid-filled loops sensing rotational head movement.","penalty":20,"system":"ear","aliases":[]},{"term":"Otolith organs","definition":"The utricle and saccule; crystal-weighted sensors of linear acceleration and gravity.","penalty":30,"system":"ear","aliases":[]},{"term":"Vestibulo-ocular reflex","definition":"Eye movements equal and opposite to head motion, keeping gaze stable.","penalty":30,"system":"pathway","aliases":["VOR"]},{"term":"Vertigo","definition":"The false sensation of motion, usually spinning; classified as peripheral in the inner ear or central in the brain.","penalty":20,"system":"ear","aliases":[]},{"term":"Nystagmus","definition":"Rhythmic involuntary eye oscillation; its pattern localizes vestibular pathology.","penalty":20,"system":"ear","aliases":[]},{"term":"Benign paroxysmal positional vertigo (BPPV)","definition":"Brief spells of vertigo triggered by head position changes, caused by displaced otoconia.","penalty":30,"system":"ear","aliases":["BPPV"]},{"term":"Canalithiasis","definition":"Free-floating otoconia within a semicircular canal; the usual mechanism of BPPV.","penalty":30,"system":"ear","aliases":[]},{"term":"Endolymphatic hydrops","definition":"Pathologic excess of endolymph distending the inner ear.","penalty":30,"system":"ear","aliases":[]},{"term":"Ménière's disease","definition":"Episodic vertigo with fluctuating hearing loss, tinnitus, and ear fullness, attributed to endolymphatic hydrops.","penalty":25,"system":"ear","aliases":[]},{"term":"Paranasal sinuses","definition":"The maxillary, ethmoid, frontal, and sphenoid air-filled cavities that drain into the nasal cavity.","penalty":20,"system":"nose","aliases":[]},{"term":"Ostiomeatal complex","definition":"The shared drainage channel for the maxillary, frontal, and anterior ethmoid sinuses; its blockage is the key event in sinusitis.","penalty":30,"system":"nose","aliases":[]},{"term":"Turbinates","definition":"Scroll-shaped nasal structures that warm, humidify, and filter inspired air.","penalty":20,"system":"nose","aliases":[]},{"term":"Nasal septum","definition":"The midline wall of cartilage and bone dividing the nasal cavity.","penalty":20,"system":"nose","aliases":[]},{"term":"Septal deviation","definition":"A bent septum narrowing one or both nasal airways.","penalty":20,"system":"nose","aliases":[]},{"term":"Allergic rhinitis","definition":"IgE-mediated inflammation of the nasal mucosa producing sneezing, runny nose, congestion, and itch.","penalty":20,"system":"nose","aliases":[]},{"term":"Rhinosinusitis","definition":"Inflammation of the nasal and sinus mucosa; acute if under four weeks, chronic if twelve weeks or more.","penalty":25,"system":"nose","aliases":[]},{"term":"Nasal polyps","definition":"Benign, edematous mucosal outgrowths arising from chronic sinonasal inflammation.","penalty":20,"system":"nose","aliases":[]},{"term":"Epistaxis","definition":"Nosebleed; anterior bleeds are common and accessible, while posterior bleeds are arterial and harder to control.","penalty":20,"system":"nose","aliases":[]},{"term":"Kiesselbach's plexus","definition":"The vascular confluence on the anterior septum; the usual site of anterior nosebleeds.","penalty":30,"system":"nose","aliases":["Kiesselbach plexus"]},{"term":"Olfaction","definition":"The sense of smell, mediated by olfactory epithelium and the first cranial nerve.","penalty":20,"system":"nose","aliases":[]},{"term":"Anosmia","definition":"Complete loss of the sense of smell.","penalty":20,"system":"nose","aliases":[]},{"term":"Functional endoscopic sinus surgery (FESS)","definition":"Endoscopic widening of the sinuses' natural drainage pathways while preserving mucosa.","penalty":30,"system":"nose","aliases":["FESS"]},{"term":"Supraglottis","definition":"The laryngeal region above the vocal folds, including the epiglottis.","penalty":25,"system":"throat","aliases":[]},{"term":"Glottis","definition":"The vocal folds and the opening between them.","penalty":20,"system":"throat","aliases":[]},{"term":"Subglottis","definition":"The larynx below the vocal folds down to the trachea; the narrowest point of the pediatric airway.","penalty":25,"system":"throat","aliases":[]},{"term":"Vocal folds","definition":"The paired, layered vibrating structures that produce voice and close to protect the airway.","penalty":20,"system":"throat","aliases":[]},{"term":"Vestibular (false) folds","definition":"The folds above the true vocal folds; protective rather than phonatory.","penalty":30,"system":"throat","aliases":["False folds","Vestibular folds"]},{"term":"Phonation","definition":"Voice production: exhaled air driving vocal fold vibration.","penalty":20,"system":"throat","aliases":[]},{"term":"Mucosal wave","definition":"The rippling motion of the vocal fold's cover over its body during vibration; the essential feature of healthy voice.","penalty":30,"system":"throat","aliases":[]},{"term":"Videostroboscopy","definition":"Strobe-lit endoscopy that renders the mucosal wave visible in apparent slow motion.","penalty":30,"system":"throat","aliases":[]},{"term":"Recurrent laryngeal nerve","definition":"The vagus branch supplying nearly all intrinsic laryngeal muscles; a critical landmark in neck and chest surgery.","penalty":30,"system":"throat","aliases":["RLN"]},{"term":"Vocal fold paralysis","definition":"Fold immobility from nerve injury, causing breathy voice, aspiration risk, or airway compromise.","penalty":20,"system":"throat","aliases":[]},{"term":"Dysphonia","definition":"Any disorder or impairment of the voice.","penalty":20,"system":"throat","aliases":[]},{"term":"Stridor","definition":"High-pitched breathing noise from turbulent flow through a narrowed airway; its timing in the breath cycle localizes the obstruction.","penalty":25,"system":"throat","aliases":[]},{"term":"Laryngopharyngeal reflux","definition":"Gastric contents reaching the larynx and pharynx, causing hoarseness, throat clearing, and globus, often without heartburn.","penalty":30,"system":"throat","aliases":["LPR"]},{"term":"Tracheostomy","definition":"A surgically created opening in the anterior trachea for breathing.","penalty":20,"system":"throat","aliases":[]},{"term":"Nasopharynx","definition":"The pharynx behind the nose and above the palate; contains the adenoid and Eustachian tube openings.","penalty":20,"system":"throat","aliases":[]},{"term":"Oropharynx","definition":"The pharynx behind the mouth: tonsils, tongue base, and soft palate.","penalty":20,"system":"throat","aliases":[]},{"term":"Hypopharynx","definition":"The lowest pharynx, behind the larynx, ending at the esophageal inlet.","penalty":30,"system":"throat","aliases":[]},{"term":"Deglutition","definition":"Swallowing, proceeding through oral, pharyngeal, and esophageal phases.","penalty":30,"system":"throat","aliases":[]},{"term":"Dysphagia","definition":"Difficulty swallowing, localized as oropharyngeal or esophageal.","penalty":20,"system":"throat","aliases":[]},{"term":"Laryngeal penetration","definition":"Swallowed material entering the laryngeal vestibule but remaining above the vocal folds.","penalty":30,"system":"throat","aliases":[]},{"term":"Aspiration","definition":"Swallowed material passing below the vocal folds into the airway.","penalty":20,"system":"throat","aliases":[]},{"term":"Adenotonsillar hypertrophy","definition":"Enlargement of adenoids and tonsils obstructing the airway; the leading cause of pediatric sleep apnea.","penalty":20,"system":"throat","aliases":[]},{"term":"Obstructive sleep apnea","definition":"Repetitive collapse of the upper airway during sleep, causing pauses in breathing and oxygen drops.","penalty":20,"system":"throat","aliases":["OSA"]},{"term":"Squamous cell carcinoma","definition":"Malignancy of the mucosal squamous lining; the dominant head and neck cancer.","penalty":20,"system":"overview","aliases":[]},{"term":"HPV-associated oropharyngeal carcinoma","definition":"P16-positive cancer of the tonsil or tongue base with distinctly better prognosis and its own staging.","penalty":30,"system":"overview","aliases":[]},{"term":"Cervical lymph node levels","definition":"The numbered regional map from I to VI of neck nodes guiding cancer staging and surgery.","penalty":30,"system":"overview","aliases":[]},{"term":"Neck dissection","definition":"Surgical removal of cervical lymph nodes, ranging from radical to selective.","penalty":20,"system":"overview","aliases":[]},{"term":"TNM staging","definition":"Cancer classification by tumor extent, nodal involvement, and distant metastasis.","penalty":30,"system":"overview","aliases":["TNM"]},{"term":"Fine-needle aspiration","definition":"Needle sampling of a mass for cytologic diagnosis; the first-line test for neck masses.","penalty":20,"system":"overview","aliases":["FNA"]},{"term":"Parotid gland","definition":"The largest salivary gland, through which the facial nerve passes, dividing it into superficial and deep lobes.","penalty":20,"system":"overview","aliases":[]},{"term":"Facial nerve","definition":"The seventh cranial nerve, motor supply to the muscles of facial expression; central to ear and parotid surgery.","penalty":20,"system":"overview","aliases":[]},{"term":"Facial palsy","definition":"Facial muscle weakness; peripheral lesions involve the forehead, while central lesions spare it.","penalty":20,"system":"overview","aliases":[]}];
    const $ = (id) => document.getElementById(id);
    const panels = [...document.querySelectorAll(".anatomy-panel")];
    const consoleEl = $("game-console"), form = $("answer-form"), input = $("term-answer"), submit = $("submit-button");
    let order = TERMS.map((_, index) => index), round = 0, score = 100, timeLeft = 15, status = "playing", timerId = 0, advanceId = 0;

    const normalize = (value) => value.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
    const current = () => TERMS[order[round] ?? order[0]];
    const secondsFor = (term) => term.penalty === 20 ? 15 : term.penalty === 25 ? 20 : 25;
    const shuffle = (items) => {
      const next = [...items];
      for (let i = next.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [next[i], next[j]] = [next[j], next[i]]; }
      return next;
    };

    function paintTimer() {
      $("time-value").textContent = String(timeLeft).padStart(2, "0");
      $("timer-fill").style.width = ((timeLeft / secondsFor(current())) * 100) + "%";
      $("timer").classList.toggle("urgent", timeLeft <= 5);
    }

    function setFeedback(kind, message) {
      $("feedback").className = "feedback " + kind;
      $("feedback").textContent = message;
      consoleEl.className = "game-console " + kind;
    }

    function render() {
      const term = current();
      $("prompt-count").textContent = "PROMPT " + String(round + 1).padStart(2, "0") + " / " + String(TERMS.length).padStart(2, "0");
      const label = term.penalty === 20 ? "FOUNDATIONAL" : term.penalty === 25 ? "INTERMEDIATE" : "OBSCURE";
      $("difficulty").innerHTML = '<i class="level level-' + term.penalty + '"></i> ' + label + " · " + secondsFor(term) + " SEC · −" + term.penalty + "% RISK";
      $("definition").textContent = term.definition;
      $("score").textContent = score + "%";
      $("progress").style.width = ((round / TERMS.length) * 100) + "%";
      panels.forEach((panel) => panel.classList.toggle("active", panel.dataset.system === term.system));
      paintTimer();
    }

    function startTimer() {
      clearInterval(timerId);
      timerId = setInterval(() => {
        if (status !== "playing") return;
        timeLeft -= 1;
        paintTimer();
        if (timeLeft <= 0) markWrong(true);
      }, 1000);
    }

    function markWrong(timedOut) {
      if (status !== "playing") return;
      status = "wrong";
      clearInterval(timerId);
      const term = current();
      score = Math.max(0, score - term.penalty);
      $("score").textContent = score + "%";
      input.disabled = true;
      submit.type = "button"; submit.disabled = true; submit.innerHTML = "ADVANCING <span>…</span>";
      setFeedback("wrong", (timedOut ? "Time." : "Not quite.") + " The term was " + term.term + ". −" + term.penalty + "%");
      clearTimeout(advanceId); advanceId = setTimeout(nextRound, 2400);
    }

    function finish() {
      status = "finished";
      clearInterval(timerId);
      form.hidden = true;
      $("restart-main").hidden = false;
      $("progress").style.width = "100%";
      setFeedback("finished", score <= 0 ? "The session has ended. Reset and return stronger." : "Complete set mastered. Excellent recall.");
    }

    function nextRound() {
      clearTimeout(advanceId);
      if (round + 1 >= order.length || score <= 0) { finish(); return; }
      round += 1; timeLeft = secondsFor(current()); status = "playing";
      input.value = ""; input.disabled = false; submit.disabled = false; submit.type = "submit"; submit.innerHTML = "SUBMIT <span>↵</span>";
      setFeedback("playing", "Identify the term before the timer closes.");
      render(); startTimer(); setTimeout(() => input.focus(), 40);
    }

    function submitAnswer(event) {
      event.preventDefault();
      if (status !== "playing" || !input.value.trim()) return;
      const term = current();
      const accepted = [term.term, ...term.aliases].map(normalize);
      if (!accepted.includes(normalize(input.value))) { markWrong(false); return; }
      status = "correct"; clearInterval(timerId);
      const quick = term.penalty === 30 ? timeLeft > 10 : timeLeft > 5;
      const restored = quick ? Math.min(10, 100 - score) : 0;
      if (restored > 0) score = Math.min(100, score + 10);
      $("score").textContent = score + "%";
      input.disabled = true; submit.type = "button"; submit.disabled = true; submit.innerHTML = "ADVANCING <span>…</span>";
      const message = quick ? (restored > 0 ? "Correct. Fast recall restores +" + restored + "%." : "Correct. Full strength maintained at 100%.") : "Correct. Precise recall.";
      setFeedback("correct", message);
      clearTimeout(advanceId); advanceId = setTimeout(nextRound, 1100);
    }

    function restart() {
      clearTimeout(advanceId);
      order = shuffle(TERMS.map((_, index) => index)); round = 0; score = 100; timeLeft = secondsFor(current()); status = "playing";
      form.hidden = false; $("restart-main").hidden = true; input.value = ""; input.disabled = false; submit.disabled = false; submit.type = "submit"; submit.innerHTML = "SUBMIT <span>↵</span>";
      setFeedback("playing", "Identify the term before the timer closes.");
      render(); startTimer(); setTimeout(() => input.focus(), 40);
    }

    form.addEventListener("submit", submitAnswer);
    $("reset-button").addEventListener("click", restart);
    $("restart-main").addEventListener("click", restart);
    render(); startTimer(); input.focus();
  })();
  </script>
