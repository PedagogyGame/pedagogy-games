<title>Chinese Character Study · 1301–1400</title>
<style>
:root{--ink:#241b16;--muted:#74665c;--paper:#f4efe5;--panel:#fbf8f1;--line:#c7b8a3;--deep:#3b2017;--good:#285c3c;--bad:#8a2f27;--gold:#9a7440}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(1200px 700px at 12% -10%,rgba(255,248,230,.4),transparent 52%),linear-gradient(180deg,#c3b7a2 0%,#d6cebc 42%,#b9ad97 100%);color:var(--ink);font-family:Georgia,"Times New Roman","Noto Serif SC","Songti SC",serif;overflow:hidden}
.app{height:100vh;display:grid;grid-template-rows:auto 1fr;gap:0}
.topbar{min-height:58px;display:flex;align-items:center;gap:14px;padding:8px 18px;background:rgba(28,22,17,.96);color:#f8f1e5;border-bottom:2px solid #c4a46a}
.brand{font-size:18px;font-weight:700;letter-spacing:.05em;white-space:nowrap}.brand small{font-size:12px;font-weight:400;opacity:.7;margin-left:8px}
.progress{flex:1;max-width:460px;height:7px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:#d9b578;width:1%;transition:width .25s ease}
.stat{font-size:13px;opacity:.88;white-space:nowrap}.topbtn{border:1px solid rgba(255,255,255,.28);background:transparent;color:white;border-radius:8px;padding:7px 10px;cursor:pointer}
.main{min-height:0;display:grid;grid-template-columns:minmax(390px,46%) 1fr;gap:18px;padding:18px}
.quiz{min-height:0;background:rgba(252,248,239,.97);border:1.5px solid #6e5744;box-shadow:inset 0 0 0 5px #f3eadc,0 16px 48px rgba(40,28,18,.22);border-radius:6px;padding:18px 22px 16px;display:flex;flex-direction:column;overflow:auto}
.rankline{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.09em}
.character{text-align:center;font-family:"Noto Serif SC","Songti SC","STSong",serif;font-size:clamp(92px,11vw,164px);line-height:.95;margin:8px 0 0;color:#20130e;text-shadow:0 1px 0 #fff}
.pinyin{text-align:center;font-size:clamp(24px,2.6vw,39px);font-style:italic;color:#6f3827;margin:0 0 8px}
.front-pinyin{display:none}.prompt{text-align:center;font-size:16px;margin:2px 0 8px;color:#77675b}
button{font:600 13px/1.1 Georgia,serif;letter-spacing:.03em}
.controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:3px 0 7px}.controls .nav{display:flex;gap:6px;margin-right:6px}.ghost,.action{padding:9px 12px;border-radius:8px;cursor:pointer}.ghost{border:1px solid #b4a38e;background:#f6f0e5;color:#3e3028}.action{border:1px solid #6c4933;background:#6c4933;color:#fff}
.reveal{border-top:1px solid #d7caba;padding-top:9px;margin-top:2px;animation:fade .18s ease}.reveal-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:5px}.reveal-pinyin{font-size:clamp(27px,2.8vw,42px);font-style:italic;color:#6f3827;font-weight:700}.definition{font-size:20px;margin:0}.definition b{color:#6d3b27}.wordtitle,.extitle{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:#7a685a;margin:9px 0 4px;font-weight:700}.wordlist{display:flex;gap:6px;flex-wrap:wrap}.wordchip{background:#eee4d4;border:1px solid #d1c0a8;border-radius:7px;padding:5px 8px;line-height:1.18}.wordchip .wzh{font-family:"Noto Serif SC","Songti SC",serif;font-size:19px;font-weight:700}.wordchip .wpy{font-size:13px;font-style:italic;color:#754635}.wordchip .wen{font-size:12px;color:#66594f}.examples{display:grid;gap:5px}.example{padding:6px 9px;background:#f3ede2;border-left:3px solid #aa8558;border-radius:5px;line-height:1.22}.example-zh{font-family:"Noto Serif SC","Songti SC",serif;font-size:clamp(19px,1.65vw,25px)}.example-py{font-size:clamp(14px,1.1vw,17px);font-style:italic;color:#744b39;margin-top:2px}.example-en{font-size:clamp(13px,1vw,16px);color:#4f463f;margin-top:2px}.example em{font-style:normal;font-weight:800;color:#8d2f21;background:#ead9bf;border-radius:3px;padding:0 .05em}
.flipcard{margin-top:3px;border:1px solid #b6a58d;border-radius:10px;padding:12px 14px;background:#f4ecdd}.flipcard h3{margin:0 0 7px;font-size:15px;color:#6d594b;text-transform:uppercase;letter-spacing:.08em}.english-list{font-size:clamp(22px,2vw,32px);line-height:1.2;margin:4px 0 10px}.flipcard .reveal-pinyin{margin:0 0 6px}.further{border:1px solid #6c4933;background:transparent;color:#6c4933;border-radius:8px;padding:8px 11px;cursor:pointer}
.imagepane{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;background:rgba(24,18,14,.9);border:1.5px solid #4a3728;border-radius:6px;overflow:hidden;box-shadow:inset 0 0 0 7px rgba(239,220,184,.14),0 16px 48px rgba(40,28,18,.24)}
.imagepane:before{content:"";position:absolute;inset:9px;border:1px solid rgba(239,220,184,.3);border-radius:2px;pointer-events:none}.art{display:block;max-width:94%;max-height:90%;width:auto;height:auto;object-fit:contain;filter:saturate(.98) contrast(1.02);box-shadow:0 8px 32px rgba(0,0,0,.28);transition:opacity .35s ease,transform .35s ease}.art.wide{max-width:98%;max-height:84%}
.imagecount{position:absolute;right:18px;bottom:14px;color:rgba(255,255,255,.72);font:12px/1.2 Georgia,serif;letter-spacing:.08em;background:rgba(0,0,0,.28);padding:5px 8px;border-radius:99px}.rotate-note{position:absolute;left:18px;bottom:14px;color:rgba(255,255,255,.64);font:12px/1.2 Georgia,serif}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@media(max-width:900px){body{overflow:auto}.app{height:auto;min-height:100vh}.main{grid-template-columns:1fr;grid-template-rows:auto minmax(360px,55vh)}.quiz{overflow:visible}.imagepane{min-height:420px}.topbar{flex-wrap:wrap}.progress{order:3;flex-basis:100%;max-width:none}}
@media(max-width:520px){.main{padding:9px;gap:9px}.quiz{padding:14px}.brand small{display:none}.character{font-size:104px}.example{font-size:20px}.topbar{padding:8px 10px}.stat.scoreStat{display:none}}
</style>
</head>

  </main>
</div>

:"contract"},{"zh":"畏缩","pinyin":"wèi suō","en":"cower"}],"examples":[{"zh":"请把图片缩小一点。","pinyin":"qǐng bǎ tú piàn suō xiǎo yì diǎn.","en":"Please shrink the picture a little."},{"zh":"工期缩短了两周。","pinyin":"gōng qī suō duǎn le liǎng zhōu.","en":"The work period was shortened by two weeks."},{"zh":"遇到困难不要畏缩。","pinyin":"yù dào kùn nan bú yào wèi suō.","en":"Do not cower when you meet difficulty."}]},{"rank":1305,"char":"罢","pinyin":"bà","meanings":["stop","dismiss","finish"],"words":[{"zh":"罢工","pinyin":"bà gōng","en":"go on strike"},{"zh":"罢休","pinyin":"bà xiū","en":"give up"},{"zh":"罢免","pinyin":"bà miǎn","en":"recall from office"},{"zh":"作罢","pinyin":"zuò bà","en":"drop the matter"}],"examples":[{"zh":"工人举行罢工。","pinyin":"gōng rén jǔ xíng bà gōng.","en":"The workers went on strike."},{"zh":"不达目的决不罢休。","pinyin":"bù dá mù dì jué bù bà xiū.","en":"He will not give up until the aim is reached."},{"zh":"这件事只好作罢。","pinyin":"zhè jiàn shì zhǐ hǎo zuò bà.","en":"This matter had to be dropped."}]},{"rank":1306,"char":"聚","pinyin":"jù","meanings":["gather","assemble"],"words":[{"zh":"聚集","pinyin":"jù jí","en":"gather"},{"zh":"聚会","pinyin":"jù huì","en":"get-together"},{"zh":"聚餐","pinyin":"jù cān","en":"dine together"},{"zh":"团聚","pinyin":"tuán jù","en":"reunite"}],"examples":[{"zh":"广场上聚集了许多人。","pinyin":"guǎng chǎng shàng jù jí le hěn duō rén.","en":"Many people gathered in the square."},{"zh":"朋友们周末聚会。","pinyin":"péng you men zhōu mò jù huì.","en":"Friends get together on the weekend."},{"zh":"春节是家人团聚的日子。","pinyin":"Chūn jié shì jiā rén tuán jù de rì zi.","en":"Spring Festival is a day of family reunion."}]},{"rank":1307,"char":"径","pinyin":"jìng","meanings":["path","directly","diameter"],"words":[{"zh":"路径","pinyin":"lù jìng","en":"path"},{"zh":"直径","pinyin":"zhí jìng","en":"diameter"},{"zh":"途径","pinyin":"tú jìng","en":"way; channel"},{"zh":"捷径","pinyin":"jié jìng","en":"shortcut"}],"examples":[{"zh":"请沿这条路径走。","pinyin":"qǐng yán zhè tiáo lù jìng zǒu.","en":"Please walk along const IMAGES = ["img/01-kai-shu-page.jpg", "img/02-woodblock-boat.jpg", "img/03-water-wheel.jpg", "img/04-plowing-ox.jpg", "img/05-winnowing.jpg", "img/06-blue-phoenix.jpg", "img/07-bartholomew-map.jpg", "img/08-dragon-brocade.jpg", "img/09-market-carrier.jpg", "img/10-lakeside-city.jpg"];
let order = BANK.map((_,i)=>i), pos=0, state='front';
const $=id=>document.getElementById(id);
function norm(s){return (s||'').toLowerCase().replace(/[’'.,!?()\-_/]+/g,' ').replace(/\s+/g,' ').trim()}
function current(){return BANK[order[pos]]}
function safe(t){return String(t).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function mark(sentence,ch){return safe(sentence).split(safe(ch)).join('<em>'+safe(ch)+'</em>')}
function imageForPosition(){const n=IMAGES.length||1;return Math.floor(pos*n/BANK.length)%n}
function setImage(){const idx=imageForPosition(), img=$('art');img.style.opacity=.15;setTimeout(()=>{img.src=IMAGES[idx]; img.onload=()=>{img.classList.toggle('wide',img.naturalWidth/img.naturalHeight>1.75);img.style.opacity=1}},90)}
function renderDetail(mode){const c=current(), d=$('detailArea'); if(mode==='front'){d.innerHTML='';return}
 if(mode==='flip'){d.innerHTML=`<div class="flipcard"><h3>Pinyin + English</h3><div class="reveal-pinyin">${safe(c.pinyin)}</div><div class="english-list">${c.meanings.map(safe).join(' · ')}</div><button class="further" id="furtherBtn">Reveal further</button></div>`;$('furtherBtn').onclick=()=>{state='revealed';renderDetail('revealed')};return}
 const words=c.words.map(w=>`<div class="wordchip"><div class="wzh">${mark(w.zh,c.char)}</div><div class="wpy">${safe(w.pinyin)}</div><div class="wen">${safe(w.en)}</div></div>`).join('');
 const ex=c.examples.map(x=>`<div class="example"><div class="example-zh">${mark(x.zh,c.char)}</div><div class="example-py">${safe(x.pinyin)}</div><div class="example-en">${safe(x.en)}</div></div>`).join('');
 d.innerHTML=`<div class="reveal"><div class="reveal-head"><div class="reveal-pinyin">${safe(c.pinyin)}</div><p class="definition"><b>${safe(c.char)}</b> — ${c.meanings.map(safe).join('; ')}</p></div><div class="wordtitle">Common words &amp; phrases</div><div class="wordlist">${words}</div><div class="extitle">Example sentences</div><div class="examples">${ex}</div></div>`}
function render(changeImage=true){const c=current();$('char').textContent=c.char;$('pinyin').textContent='';$('rankLabel').textContent=`Frequency rank #${c.rank}`;$('cardStat').textContent=`${pos+1} / ${BANK.length}`;$('progressFill').style.width=((pos+1)/BANK.length*100)+'%';state='front';renderDetail('front');if(changeImage)setImage()}
function move(delta){const oldImg=imageForPosition();pos=Math.max(0,Math.min(BANK.length-1,pos+delta));render(imageForPosition()!==oldImg)}
$('prevBtn').onclick=()=>move(-1);$('nextBtn').onclick=()=>move(1);
$('revealBtn').onclick=()=>{state='revealed';renderDetail('revealed')};$('flipBtn').onclick=()=>{state='flip';renderDetail('flip')};
$('shuffleBtn').onclick=()=>{for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}pos=0;render(true)};
$('resetBtn').onclick=()=>{order=BANK.map((_,i)=>i);pos=0;render(true)};
render(true);
</script>
