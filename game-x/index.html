 movements that align the eyes for different distances.","Binocular Vision & Eye Movement","medium"],["Saccade","Rapid eye movement that redirects the fovea.","Binocular Vision & Eye Movement","medium"],["Smooth pursuit","Continuous tracking movement that follows a moving target.","Binocular Vision & Eye Movement","medium"],["Fixation","Holding gaze steady on a target.","Binocular Vision & Eye Movement","easy"],["Phoria","Latent misalignment revealed only when fusion is disrupted.","Binocular Vision & Eye Movement","hard"],["Tropia (strabismus)","Manifest ocular misalignment.","Binocular Vision & Eye Movement","hard"],["Suppression","Cortical ignoring of one eye’s input.","Binocular Vision & Eye Movement","medium"],["Amblyopia","Developmental reduction of acuity from abnormal early visual experience.","Binocular Vision & Eye Movement","medium"],["Diplopia","Double vision.","Binocular Vision & Eye Movement","medium"],["Visual acuity","Ability to resolve fine spatial detail.","Clinical Assessment & Metrics","easy"],["Visual field","Full extent of space seen while fixating.","Clinical Assessment & Metrics","easy"],["Scotoma","Localized area of reduced or absent vision.","Clinical Assessment & Metrics","medium"],["Intraocular pressure (IOP)","Fluid pressure inside the eye.","Clinical Assessment & Metrics","medium"],["Fundus","Interior posterior surface of the eye visible on examination.","Clinical Assessment & Metrics","medium"],["Cup-to-disc ratio","Metric of optic nerve head excavation.","Clinical Assessment & Metrics","medium"],["Pupillary light reflex","Constriction of the pupil in response to light.","Clinical Assessment & Metrics","medium"],["Relative afferent pupillary defect (RAPD)","Asymmetric pupillary response indicating afferent pathway damage.","Clinical Assessment & Metrics","hard"],["Cycloplegia","Pharmacologic paralysis of accommodation.","Clinical Assessment & Metrics","hard"],["Optical coherence tomography (OCT)","High-resolution cross-sectional imaging of the retina.","Clinical Assessment & Metrics","medium"],["Glaucoma","Progressive optic neuropathy often linked to intraocular pressure.","Key Pathological Mechanisms","easy"],["Cataract","Opacification of the crystalline lens.","Key Pathological Mechanisms","easy"],["Age-related macular degeneration (AMD)","Degenerative disease of the central retina.","Key Pathological Mechanisms","medium"],["Diabetic retinopathy","Microvascular damage to the retina from diabetes.","Key Pathological Mechanisms","medium"],["Retinal detachment","Separation of the neurosensory retina from the RPE.","Key Pathological Mechanisms","medium"],["Keratoconus","Progressive corneal thinning and irregular steepening.","Key Pathological Mechanisms","medium"],["Uveitis","Inflammation of the uveal tract.","Key Pathological Mechanisms","medium"],["Dry eye disease","Tear-film instability and ocular surface damage.","Key Pathological Mechanisms","medium"],["Neovascularization","Pathologic growth of new blood vessels.","Key Pathological Mechanisms","hard"],["Macular edema","Fluid accumulation in the macula.","Key Pathological Mechanisms","medium"]
].map(([term,definition,category,difficulty])=>({term,definition,category,difficulty}));
const penalty={easy:30,medium:25,hard:20}, tone={easy:"Foundational",medium:"Focused",hard:"Hardest 25%"};
let deck=[],index=0,score=100,secondsLeft=15,startedAt=Date.now(),timerId=null,correct=0,missed=[],streak=0,finished=false;
const $=id=>document.getElementById(id);
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function norm(s){return s.trim().replace(/\s+/g," ").toLocaleLowerCase()}
function clamp(n){return Math.max(0,Math.min(100,Math.round(n)))}
function current(){return deck[index]} function total(t=current()){return t&&t.difficulty==="hard"?20:15} function bonus(t=current()){return t&&t.difficulty==="hard"?13:10}
function render(){const t=current();$("term-count").textContent=TERMS.length+" terms";$("score").textContent=score+"%";$("progress").style.width=(((index+1)/deck.length)*100)+"%";if(!t)return finish();$("category").textContent=t.category;$("difficulty").textContent=`${tone[t.difficulty]} · ${total(t)}s · −${penalty[t.difficulty]}%`;$("definition").textContent=t.definition;$("question-number").textContent=`Question ${index+1}/${deck.length}`;$("streak").textContent=`Streak ${streak}`;$("accuracy").textContent=`Accuracy ${index>0?Math.round((correct/index)*100):100}%`;$("answer").value="";$("answer").focus()}
function startTimer(){clearInterval(timerId);secondsLeft=total();startedAt=Date.now();$("seconds").textContent=secondsLeft;$("timer-label").textContent="sec";$("timer").classList.remove("urgent");timerId=setInterval(()=>{const elapsed=Math.floor((Date.now()-startedAt)/1000);secondsLeft=Math.max(total()-elapsed,0);$("seconds").textContent=secondsLeft;$("timer").classList.toggle("urgent",secondsLeft<=5);if(secondsLeft<=0){clearInterval(timerId);wrong(true)}},200)}
function next(msg){$("feedback").textContent=msg;index++;if(index>=deck.length){finish();return}render();startTimer()}
function wrong(timedOut=false){if(finished)return;const t=current();score=clamp(score-penalty[t.difficulty]);missed.push(t);streak=0;next(`${timedOut?"Time.":"Incorrect."} Correct term: ${t.term}`)}
function finish(){finished=true;clearInterval(timerId);$("seconds").textContent="Done";$("timer-label").textContent="round";$("timer").classList.remove("urgent");$("progress").style.width="100%";$("play-area").innerHTML=`<section class="finish-card"><p class="eyebrow">Round complete</p><h2>${score}% cellular integrity</h2><p>You answered ${correct} of ${deck.length} correctly. Missed terms: ${missed.length===0?"none":missed.map(x=>x.term).join(", ")}.</p><button type="button" id="restart">Play again</button></section>`;$("restart").addEventListener("click",init)}
function init(){deck=shuffle(TERMS);index=0;score=100;correct=0;missed=[];streak=0;finished=false;$("play-area").innerHTML=`<div class="question-meta"><span id="category"></span><span id="difficulty"></span></div><article class="definition-card"><p id="definition"></p></article><form class="answer-form" id="answer-form"><label for="answer">Correct term</label><input id="answer" autocomplete="off" spellcheck="false" placeholder="Type the exact vocabulary term…" /><button type="submit">Submit</button></form><p class="feedback" id="feedback" aria-live="polite">Type the exact term. Capitalization does not matter.</p><div class="mini-stats"><span id="question-number"></span><span id="streak">Streak 0</span><span id="accuracy">Accuracy 100%</span></div>`;$("answer-form").addEventListener("submit",submit);render();startTimer()}
function submit(e){e.preventDefault();if(finished)return;const t=current(),elapsed=Math.floor((Date.now()-startedAt)/1000);if(norm($("answer").value)!==norm(t.term)){wrong(false);return}correct++;streak++;if(elapsed<=bonus(t))score=clamp(score+10);next(elapsed<=bonus(t)?"Correct. Speed bonus protected your cellular integrity.":"Correct.")}
init();
</script>
</body>
</html>
