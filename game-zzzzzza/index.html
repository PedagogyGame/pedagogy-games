<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />

<title>Chinese Character Study · 3001–3100</title>
<style>
:root{--ink:#2a2014;--muted:#8a7860;--paper:#f7f1e4;--panel:#faf5ea;--line:#e0d0b4;--deep:#3a2c18;--good:#6a5030;--bad:#8a2f27;--gold:#c9a040}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(1200px 700px at 12% -10%,rgba(200,150,70,.32),transparent 52%),linear-gradient(180deg,#3a3020 0%,#e4d8c4 42%,#2a2418 100%);color:var(--ink);font-family:Georgia,"Times New Roman","Noto Serif SC","Songti SC",serif;overflow:hidden}
.app{height:100vh;display:grid;grid-template-rows:auto 1fr;gap:0}
.topbar{min-height:58px;display:flex;align-items:center;gap:14px;padding:8px 18px;background:rgba(36,28,16,.96);color:#f4ead8;border-bottom:2px solid #c9a040}
.brand{font-size:18px;font-weight:700;letter-spacing:.05em;white-space:nowrap}.brand small{font-size:12px;font-weight:400;opacity:.7;margin-left:8px}
.progress{flex:1;max-width:460px;height:7px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:#c9a040;width:1%;transition:width .25s ease}
.stat{font-size:13px;opacity:.88;white-space:nowrap}.topbtn{border:1px solid rgba(255,255,255,.28);background:transparent;color:white;border-radius:8px;padding:7px 10px;cursor:pointer}
.main{min-height:0;display:grid;grid-template-columns:minmax(390px,46%) 1fr;gap:18px;padding:18px}
.quiz{min-height:0;background:rgba(250,245,234,.97);border:2px solid #8a6840;box-shadow:inset 0 0 0 6px #ece4d4,0 16px 48px rgba(36,28,16,.26);border-radius:4px;padding:18px 22px 16px;display:flex;flex-direction:column;overflow:auto}
.rankline{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.09em}
.character{text-align:center;font-family:"Noto Serif SC","Songti SC","STSong",serif;font-size:clamp(92px,11vw,164px);line-height:.95;margin:8px 0 0;color:#2a2014;text-shadow:0 1px 0 #fff}
.pinyin{text-align:center;font-size:clamp(24px,2.6vw,39px);font-style:italic;color:#8a6840;margin:0 0 8px}
.front-pinyin{display:none}.prompt{text-align:center;font-size:16px;margin:2px 0 8px;color:#8a7860}
button{font:600 13px/1.1 Georgia,serif;letter-spacing:.03em}
.controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:3px 0 7px}.controls .nav{display:flex;gap:6px;margin-right:6px}.ghost,.action{padding:9px 12px;border-radius:8px;cursor:pointer}.ghost{border:1px solid #b0a088;background:#f4ead8;color:#3a2c18}.action{border:1px solid #8a6840;background:#8a6840;color:#fff}
.reveal{border-top:1px solid #d8cbb8;padding-top:9px;margin-top:2px;animation:fade .18s ease}.reveal-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:5px}.reveal-pinyin{font-size:clamp(27px,2.8vw,42px);font-style:italic;color:#8a6840;font-weight:700}.definition{font-size:20px;margin:0}.definition b{color:#4a3824}.wordtitle,.extitle{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:#8a7860;margin:9px 0 4px;font-weight:700}.wordlist{display:flex;gap:6px;flex-wrap:wrap}.wordchip{background:#f0e8d8;border:1px solid #d8ccb8;border-radius:7px;padding:5px 8px;line-height:1.18}.wordchip .wzh{font-family:"Noto Serif SC","Songti SC",serif;font-size:19px;font-weight:700}.wordchip .wpy{font-size:13px;font-style:italic;color:#7a6048}.wordchip .wen{font-size:12px;color:#6a5e52}.examples{display:grid;gap:5px}.example{padding:6px 9px;background:#f7f1e4;border-left:3px solid #8a6840;border-radius:5px;line-height:1.22}.example-zh{font-family:"Noto Serif SC","Songti SC",serif;font-size:clamp(19px,1.65vw,25px)}.example-py{font-size:clamp(14px,1.1vw,17px);font-style:italic;color:#7a6048;margin-top:2px}.example-en{font-size:clamp(13px,1vw,16px);color:#5a4e42;margin-top:2px}.example em{font-style:normal;font-weight:800;color:#8d2f21;background:#e8dcc8;border-radius:3px;padding:0 .05em}
.flipcard{margin-top:3px;border:1px solid #b0a090;border-radius:4px;padding:12px 14px;background:#f7f1e4}.flipcard h3{margin:0 0 7px;font-size:15px;color:#7a6048;text-transform:uppercase;letter-spacing:.08em}.english-list{font-size:clamp(22px,2vw,32px);line-height:1.2;margin:4px 0 10px}.flipcard .reveal-pinyin{margin:0 0 6px}.further{border:1px solid #8a6840;background:transparent;color:#8a6840;border-radius:8px;padding:8px 11px;cursor:pointer}
.imagepane{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;background:rgba(28,22,14,.94);border:2px solid #3a2c18;border-radius:4px;overflow:hidden;box-shadow:inset 0 0 0 7px rgba(201,160,64,.22),0 16px 48px rgba(36,28,16,.3)}
.imagepane:before{content:"";position:absolute;inset:8px;border:1px solid rgba(201,160,64,.5);border-radius:3px;pointer-events:none}.art{display:block;max-width:94%;max-height:90%;width:auto;height:auto;object-fit:contain;filter:saturate(.98) contrast(1.02);box-shadow:0 8px 32px rgba(0,0,0,.28);transition:opacity .35s ease,transform .35s ease}.art.wide{max-width:98%;max-height:84%}

@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@media(max-width:900px){body{overflow:auto}.app{height:auto;min-height:100vh}.main{grid-template-columns:1fr;grid-template-rows:auto minmax(360px,55vh)}.quiz{overflow:visible}.imagepane{min-height:420px}.topbar{flex-wrap:wrap}.progress{order:3;flex-basis:100%;max-width:none}}
@media(max-width:520px){.main{padding:9px;gap:9px}.quiz{padding:14px}.brand small{display:none}.character{font-size:104px}.example{font-size:20px}.topbar{padding:8px 10px}.stat.scoreStat{display:none}}
</style>
</head>

冽","pinyin":"lǐn liè","en":"piercingly cold"},{"zh":"威风凛凛","pinyin":"wēi fēng lǐn lǐn","en":"awe-inspiring"}],"examples":[{"zh":"北风凛冽，路上行人很少。","pinyin":"běi fēng lǐn liè, lù shàng xíng rén hěn shǎo.","en":"The north wind was piercing; few people were on the road."}]},{"rank":3015,"char":"绎","pinyin":"yì","meanings":["unravel","deduce"],"words":[{"zh":"演绎","pinyin":"yǎn yì","en":"deduce; perform"},{"zh":"络绎","pinyin":"luò yì","en":"in an endless stream"}],"examples":[{"zh":"客人络绎不绝。","pinyin":"kè rén luò yì bù jué.","en":"Guests came in an endless stream."}]},{"rank":3016,"char":"庶","pinyin":"shù","meanings":["common people","so that"],"words":[{"zh":"庶民","pinyin":"shù mín","en":"common people"},{"zh":"富庶","pinyin":"fù shù","en":"rich and populous"}],"examples":[{"zh":"这一带土地肥沃，人烟富庶。","pinyin":"zhè yí dài tǔ dì féi wò, rén yān fù shù.","en":"This region has rich soil and is well populated."}]},{"rank":3017,"char":"脯","pinyin":"pú","meanings":["chest","dried meat"],"words":[{"zh":"胸脯","pinyin":"xiōng pú","en":"chest"},{"zh":"果脯","pinyin":"guǒ fǔ","en":"candied fruit"}],"examples":[{"zh":"他拍着胸脯说没问题。","pinyin":"tā pāi zhe xiōng pú shuō méi wèn tí.","en":"He slapped his chest and said there was no problem."},{"zh":"桌上摆着一碟果脯。","pinyin":"zhuō shàng bǎi zhe yì dié guǒ fǔ.","en":"A dish of candied fruit sat on the table."}]},{"rank":3018,"char":"迭","pinyin":"dié","meanings":["alternate","repeatedly"],"words":[{"zh":"更迭","pinyin":"gēng dié","en":"succeed one another"},{"zh":"高潮迭起","pinyin":"gāo cháo dié qǐ","en":"climax after climax"}],"examples":[{"zh":"朝中人事更迭很快。","pinyin":"cháo zhōng rén shì gēng dié hěn kuài.","en":"Personnel at court changed in quick succession."}]},{"rank":3019,"char":"睦","pinyin":"mù","meanings":["friendly","harmonious"],"words":[{"zh":"和睦","pinyin":"hé mù","en":"harmonious"},{"zh":"睦邻","pinyin":"mù lín","en":"good-neighborly"}],"examples":[{"zh":"两家相处一向和睦。","pinyin":"liǎng jiā xiāng chǔ yí xiàng hé mù.","en":"The two families have always gotten along."}]
