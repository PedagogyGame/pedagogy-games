<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Chinese Word Study · 901–1000</title>
<style>
:root{--ink:#1a100c;--muted:#6a4e42;--paper:#f6efe6;--panel:#faf4ea;--line:#d4c0a8;--deep:#140c08;--good:#6a3020;--bad:#8a3228;--gold:#d4a84a;--jade:#6a3020;--cinnabar:#b42c24}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(1100px 640px at 12% -8%,rgba(180,44,36,.28),transparent 54%),linear-gradient(180deg,#140c08 0%,#e0d0b8 46%,#1a100c 100%);color:var(--ink);font-family:Georgia,"Times New Roman","Noto Serif SC","Songti SC",serif;overflow:hidden}
.app{height:100vh;display:grid;grid-template-rows:auto 1fr;gap:0}
.topbar{min-height:58px;display:flex;align-items:center;gap:14px;padding:8px 18px;background:linear-gradient(90deg,#140c08,#6a3020 42%,#b42c24 78%,#140c08);color:#f6efe6;border-bottom:3px solid #d4a84a;box-shadow:0 1px 0 #2a1410}
.brand{font-size:18px;font-weight:700;letter-spacing:.06em;white-space:nowrap}.brand small{font-size:12px;font-weight:400;opacity:.72;margin-left:8px}
.progress{flex:1;max-width:460px;height:7px;background:rgba(255,255,255,.14);border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:linear-gradient(90deg,#d4a84a,#b42c24);width:1%;transition:width .25s ease}
.stat{font-size:13px;opacity:.9;white-space:nowrap}.topbtn{border:1px solid rgba(212,168,74,.55);background:transparent;color:#f6efe6;border-radius:4px;padding:7px 10px;cursor:pointer}
.main{min-height:0;display:grid;grid-template-columns:minmax(400px,46%) 1fr;gap:18px;padding:18px}
.quiz{min-height:0;background:rgba(250,245,234,.98);border:3px solid #6a3020;box-shadow:inset 0 0 0 7px #f3eadc,inset 0 0 0 8px #d4a84a,0 18px 50px rgba(18,14,10,.32);border-radius:2px;padding:20px 24px 16px;display:flex;flex-direction:column;overflow:auto}
.rankline{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.12em}
.character{text-align:center;font-family:"Noto Serif SC","Songti SC","STSong",serif;font-size:clamp(78px,9.2vw,128px);line-height:.95;margin:10px 0 2px;color:#1a100c;text-shadow:0 1px 0 #fff;letter-spacing:.04em}
.pinyin{text-align:center;font-size:clamp(22px,2.4vw,36px);font-style:italic;color:#b42c24;margin:0 0 8px}
.front-pinyin{display:none}.prompt{text-align:center;font-size:15px;margin:2px 0 10px;color:#6a5c48}
button{font:600 13px/1.1 Georgia,serif;letter-spacing:.03em}
.controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:3px 0 8px}.controls .nav{display:flex;gap:6px;margin-right:6px}
.ghost,.action{padding:9px 12px;border-radius:4px;cursor:pointer}.ghost{border:1px solid #6a3020;background:#f6efe6;color:#140c08}.action{border:1px solid #5a1810;background:#b42c24;color:#fff}
.reveal{border-top:1px solid #d4c0a8;padding-top:10px;margin-top:2px;animation:fade .18s ease}
.reveal-head{margin-bottom:6px}.reveal-pinyin{font-size:clamp(26px,2.7vw,40px);font-style:italic;color:#b42c24;font-weight:700}
.glosses{font-size:clamp(20px,2vw,30px);line-height:1.25;margin:4px 0 8px;color:#1a100c}.glosses b{color:#b42c24}
.wordtitle,.extitle,.chartitle{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#6a5c48;margin:10px 0 5px;font-weight:700}
.charlist{display:flex;gap:8px;flex-wrap:wrap}
.charchip{background:#f3eadc;border:1px solid #d4c0a8;border-radius:4px;padding:7px 10px;min-width:92px;box-shadow:inset 0 0 0 1px rgba(212,168,74,.35)}
.charchip .wzh{font-family:"Noto Serif SC","Songti SC",serif;font-size:28px;font-weight:700;line-height:1;color:#b42c24}
.charchip .wpy{font-size:13px;font-style:italic;color:#6a3020}.charchip .wen{font-size:12px;color:#5a4c3e}
.examples{display:grid;gap:6px}
.example{padding:7px 10px;background:#f6efe6;border-left:4px solid #6a3020;border-radius:3px;line-height:1.24}
.example-zh{font-family:"Noto Serif SC","Songti SC",serif;font-size:clamp(18px,1.6vw,24px)}
.example-py{font-size:clamp(13px,1.05vw,16px);font-style:italic;color:#b42c24;margin-top:2px}
.example-en{font-size:clamp(13px,1vw,16px);color:#4a3a2e;margin-top:2px}
.example em{font-style:normal;font-weight:800;color:#b42c24;background:#ead4c0;border-radius:3px;padding:0 .06em}
.flipcard{margin-top:3px;border:1px solid #d4a84a;border-radius:3px;padding:12px 14px;background:#f6efe6}
.flipcard h3{margin:0 0 7px;font-size:13px;color:#6a3020;text-transform:uppercase;letter-spacing:.1em}
.english-list{font-size:clamp(22px,2vw,32px);line-height:1.25;margin:4px 0 10px}
.flipcard .reveal-pinyin{margin:0 0 6px}
.further{border:1px solid #6a3020;background:transparent;color:#6a3020;border-radius:4px;padding:8px 11px;cursor:pointer}
.imagepane{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;background:rgba(18,14,10,.95);border:3px solid #6a3020;border-radius:2px;overflow:hidden;box-shadow:inset 0 0 0 7px rgba(212,168,74,.28),0 18px 50px rgba(18,14,10,.34)}
.imagepane:before{content:"";position:absolute;inset:9px;border:1px solid rgba(212,168,74,.55);border-radius:1px;pointer-events:none}
.art{display:block;max-width:94%;max-height:90%;width:auto;height:auto;object-fit:contain;filter:saturate(1.02) contrast(1.03);box-shadow:0 8px 32px rgba(0,0,0,.32);transition:opacity .35s ease,transform .35s ease}.art.wide{max-width:98%;max-height:84%}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@media(max-width:900px){body{overflow:auto}.app{height:auto;min-height:100vh}.main{grid-template-columns:1fr;grid-template-rows:auto minmax(360px,55vh)}.quiz{overflow:visible}.imagepane{min-height:420px}.topbar{flex-wrap:wrap}.progress{order:3;flex-basis:100%;max-width:none}}
@media(max-width:520px){.main{padding:9px;gap:9px}.quiz{padding:14px}.brand small{display:none}.character{font-size:72px}.topbar{padding:8px 10px}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">词语 901–1000 <small>most common words</small></div>

      <div class="controls">
        <div class="nav"><button class="ghost" id="prevBtn">← Previous</button><button class="ghost" id="nextBtn">Next →</button></div>

    <section class="imagepane" id="imagePane">
      <img class="art" id="art" alt="Study image">
    </section>
  </main>
</div>
<script>
const BANK = [{"rank":901,"word":"醒来","pinyin":"xǐng lái","en":["wake up","come to"],"chars":[{"ch":"醒","py":"xǐng","en":"wake"},{"ch":"来","py":"lái","en":"come"}],"examples":[{"zh":"鸡一叫他就醒来了。","pinyin":"jī yì jiào tā jiù xǐng lái le.","en":"The moment the cock crowed he woke up."},{"zh":"孩子夜里哭，母亲立刻醒来。","pinyin":"hái zi yè li kū, mǔ qin lì kè xǐng lái.","en":"The child cried at night, and the mother woke at once."},{"zh":"雨打在窗上，把老人打醒来了。","pinyin":"yǔ dǎ zài chuāng shang, bǎ lǎo rén dǎ xǐng lái le.","en":"Rain striking the window woke the old man."}]},{"rank":902,"word":"童年","pinyin":"tóng nián","en":["childhood"],"chars":[{"ch":"童","py":"tóng","en":"child"},{"ch":"年","py":"nián","en":"year"}],"examples":[{"zh":"他的童年是在这座桥边过的。","pinyin":"tā de tóng nián shì zài zhè zuò qiáo bian guò de.","en":"His childhood was spent beside this bridge."},{"zh":"老人一提起童年，眼里就亮。","pinyin":"lǎo rén yì tí qǐ tóng nián, yǎn li jiù liàng.","en":"The moment the old man mentions childhood, his eyes brighten."},{"zh":"这口井看着他们的童年长大。","pinyin":"zhè kǒu jǐng kàn zhe tā men de tóng nián zhǎng dà.","en":"This well watched their childhood grow up."}]},{"rank":903,"word":"青年","pinyin":"qīng nián","en":["youth","young person"],"chars":[{"ch":"青","py":"qīng","en":"green; young"},{"ch":"年","py":"nián","en":"year"}],"examples":[{"zh":"村里的青年都来修桥。","pinyin":"cūn lǐ de qīng nián dōu lái xiū qiáo.","en":"The young people of the village all came to mend the bridge."},{"zh":"他还是青年的时候就学会了石匠活。","pinyin":"tā hái shi qīng nián de shí hou jiù xué huì le shí jiang huó.","en":"While still a youth he learned the stonemason's work."},{"zh":"几个青年夜里轮流看水。","pinyin":"jǐ ge qīng nián yè li lún liú kàn shuǐ.","en":"A few young people take turns watching the water at night."}]},{"rank":904,"word":"老年","pinyin":"lǎo nián","en":["old age"],"chars":[{"ch":"老","py":"lǎo","en":"old"},{"ch":"年","py":"nián","en":"year"}],"examples":[{"zh":"到了老年，他还天天去井边坐。","pinyin":"dào le lǎo nián, tā hái tiān tiān qù jǐng bian zuò.","en":"In old age he still goes every day to sit by the well."},{"zh":"老年的日子要过得稳。","pinyin":"lǎo nián de rì zi yào guò de wěn.","en":"The days of old age must be lived steadily."},{"zh":"村里把老年的人照顾得很好。","pinyin":"cūn lǐ bǎ lǎo nián de rén zhào gù de hěn hǎo.","en":"The village looks after the aged very well."}]},{"rank":905,"word":"婴儿","pinyin":"yīng ér","en":["infant","baby"],"chars":[{"ch":"婴","py":"yīng","en":"infant"},{"ch":"儿","py":"ér","en":"child"}],"examples":[{"zh":"屋里新添了一个婴儿。","pinyin":"wū li xīn tiān le yí ge yīng ér.","en":"A new infant has been added to the house."},{"zh":"婴儿一哭，母亲就把他抱到灯下。","pinyin":"yīng ér yì kū, mǔ qin jiù bǎ tā bào dào dēng xià.","en":"The moment the baby cries, the mother takes him to the lamp."},{"zh":"把婴儿放在暖和的被窝里。","pinyin":"bǎ yīng ér fàng zài nuǎn huo de bèi wō li.","en":"Put the infant in the warm bedding."}]},{"rank":906,"word":"少年","pinyin":"shào nián","en":["youth","lad"],"chars":[{"ch":"少","py":"shào","en":"young"},{"ch":"年","py":"nián","en":"year"}],"examples":[{"zh":"那个少年能独自把牛牵过桥。","pinyin":"nà ge shào nián néng dú zì bǎ niú qiān guò qiáo.","en":"That lad can lead the ox across the bridge by himself."},{"zh":"少年们最爱在河边摸鱼。","pinyin":"shào nián men zuì ài zài hé bian mō yú.","en":"The lads most love feeling for fish by the river."},{"zh":"先生说这个少年将来能识很多字。","pinyin":"xiān sheng shuō zhè ge shào nián jiāng lái néng shí hěn duō zì.","en":"The schoolmaster said this youth will know many characters one day."}]},{"rank":907,"word":"中年","pinyin":"zhōng nián","en":["middle age"],"chars":[{"ch":"中","py":"zhōng","en":"middle"},{"ch":"年","py":"nián","en":"year"}],"examples":[{"zh":"他到了中年，肩上的活更重了。","pinyin":"tā dào le zhōng nián, jiān shang de huó gèng zhòng le.","en":"In middle age the work on his shoulders grew heavier."},{"zh":"村里几个中年人商量着把井淘一淘。","pinyin":"cūn lǐ jǐ ge zhōng nián rén shāng liang zhe bǎ jǐng táo yi táo.","en":"A few middle-aged people in the village are talking of cleaning out the well."},{"zh":"中年的力气还在，正是出力的时候。","pinyin":"zhōng nián de lì qi hái zài, zhèng shì chū lì de shí hou.","en":"The strength of middle age is still there; it is the time to labor."}]},{"rank":908,"word":"寿命","pinyin":"shòu mìng","en":["lifespan","length of life"],"chars":[{"ch":"寿","py":"shòu","en":"longevity"},{"ch":"命","py":"mìng","en":"life; fate"}],"examples":[{"zh":"老人说这口井的寿命比村里最老的人还长。","pinyin":"lǎo rén shuō zhè kǒu jǐng de shòu mìng bǐ cūn lǐ zuì lǎo de rén hái cháng.","en":"The old man said this well's lifespan is longer than the oldest person in the village."},{"zh":"这种木头的寿命够做两代人的梁。","pinyin":"zhè zhǒng mù tou de shòu mìng gòu zuò liǎng dài rén de liáng.","en":"The lifespan of this timber is enough for a beam through two generations."},{"zh":"人的寿命不由自己定，日子却要自己过。","pinyin":"rén de shòu mìng bù yóu zì jǐ dìng, rì zi què yào zì jǐ guò.","en":"A person's length of life is not set by himself, yet the days must be lived by himself."}]},{"rank":909,"word":"疾病","pinyin":"jí bìng","en":["illness","disease"],"chars":[{"ch":"疾","py":"jí","en":"sickness"},{"ch":"病","py":"bìng","en":"illness"}],"examples":[{"zh":"今年村里的疾病比往年少。","pinyin":"jīn nián cūn lǐ de jí bìng bǐ wǎng nián shǎo.","en":"This year illness in the village is less than in years past."},{"zh":"老人最怕冬季的疾病。","pinyin":"lǎo rén zuì pà dōng jì de jí bìng.","en":"The old man most fears illness in winter."},{"zh":"井水干净，疾病就少。","pinyin":"jǐng shuǐ gān jìng, jí bìng jiù shǎo.","en":"When the well water is clean, illness is scarce."}]},{"rank":910,"word":"药物","pinyin":"yào wù","en":["medicine","drug"],"chars":[{"ch":"药","py":"yào","en":"medicine"},{"ch":"物","py":"wù","en":"thing"}],"examples":[{"zh":"这种病要到县里才能买到药物。","pinyin":"zhè zhǒng bìng yào dào xiàn lǐ cái néng mǎi dào yào wù.","en":"For this kind of illness medicine can only be bought at the county."},{"zh":"草药也是药物，村里人信这个。","pinyin":"cǎo yào yě shì yào wù, cūn lǐ rén xìn zhè ge.","en":"Herbs are medicine too; the villagers trust that."},{"zh":"他把药物用油纸包好，怕受潮。","pinyin":"tā bǎ yào wù yòng yóu zhǐ bāo hǎo, pà shòu cháo.","en": de zhuān yè.","en":"Growing rice is the specialty of this region."}]},{"rank":998,"word":"培训","pinyin":"péi xùn","en":["train","training"],"chars":[{"ch":"培","py":"péi","en":"cultivate"},{"ch":"训","py":"xùn","en":"instruct"}],"examples":[{"zh":"县里办了三天农技培训。","pinyin":"xiàn lǐ bàn le sān tiān nóng jì péi xùn.","en":"The county ran three days of farming-skill training."},{"zh":"他去县城参加修剪果树的培训。","pinyin":"tā qù xiàn chéng cān jiā xiū jiǎn guǒ shù de péi xùn.","en":"He went to the county seat for training in pruning fruit trees."},{"zh":"培训回来，他把新法子讲给大家听。","pinyin":"péi xùn huí lai, tā bǎ xīn fǎ zi jiǎng gěi dà jiā tīng.","en":"Back from the training, he explained the new methods to everyone."}]},{"rank":999,"word":"训练","pinyin":"xùn liàn","en":["drill","train"],"chars":[{"ch":"训","py":"xùn","en":"instruct"},{"ch":"练","py":"liàn","en":"practice"}],"examples":[{"zh":"民兵每隔十天训练一次。","pinyin":"mín bīng měi gé shí tiān xùn liàn yí cì.","en":"The militia drills once every ten days."},{"zh":"孩子的嗓子要天天训练。","pinyin":"hái zi de sǎng zi yào tiān tiān xùn liàn.","en":"The child's voice must be trained every day."},{"zh":"这种力气活本身就是训练。","pinyin":"zhè zhǒng lì qi huó běn shēn jiù shì xùn liàn.","en":"This kind of heavy work is itself a training."}]},{"rank":1000,"word":"教材","pinyin":"jiào cái","en":["teaching material","textbook"],"chars":[{"ch":"教","py":"jiào","en":"teach"},{"ch":"材","py":"cái","en":"material"}],"examples":[{"zh":"新学期的教材从县里运来了。","pinyin":"xīn xué qī de jiào cái cóng xiàn lǐ yùn lai le.","en":"The teaching materials for the new term have been brought from the county."},{"zh":"这本教材把本地的桥也写进去了。","pinyin":"zhè běn jiào cái bǎ běn dì de qiáo yě xiě jìn qu le.","en":"This textbook has even written the local bridge into it."},{"zh":"教材不够，两个孩子合看一本。","pinyin":"jiào cái bú gòu, liǎng ge hái zi hé kàn yì běn.","en":"There are not enough textbooks; two children share one."}]}];
const IMAGES = ["img/01-forbidden-moat.jpg", "img/02-dazheng-hall.jpg", "img/03-hotel-lobby.jpg", "img/04-canal-view.jpg", "img/05-red-lanterns.jpg", "img/06-bonsai-court.jpg", "img/07-woburn-garden.jpg", "img/08-pavilion-garden.jpg", "img/09-moon-gate.jpg", "img/10-ancestral-hall.jpg", "img/11-canopy-bed.jpg"];
let order = BANK.map((_,i)=>i), pos=0, state='front';
const $=id=>document.getElementById(id);
function current(){return BANK[order[pos]]}
function safe(t){return String(t).replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>').replace(/"/g,'"').replace(/'/g,'&#039;')}
function mark(sentence,w){return safe(sentence).split(safe(w)).join('<em>'+safe(w)+'</em>')}
function imageForPosition(){const n=IMAGES.length||1;return Math.floor(pos*n/BANK.length)%n}
function setImage(){const idx=imageForPosition(), img=$('art');img.style.opacity=.15;setTimeout(()=>{img.src=IMAGES[idx]; img.onload=()=>{img.classList.toggle('wide',img.naturalWidth/img.naturalHeight>1.75);img.style.opacity=1}},90)}
function renderDetail(mode){const c=current(), d=$('detailArea'); if(mode==='front'){d.innerHTML='';return}
 if(mode==='flip'){d.innerHTML=`<div class="flipcard"><h3>Pinyin + English</h3><div class="reveal-pinyin">${safe(c.pinyin)}</div><div class="english-list">${c.en.map(safe).join(' · ')}</div><button class="further" id="furtherBtn">Reveal further</button></div>`;$('furtherBtn').onclick=()=>{state='revealed';renderDetail('revealed')};return}
 const chars=c.chars.map(w=>`<div class="charchip"><div class="wzh">${safe(w.ch)}</div><div class="wpy">${safe(w.py)}</div><div class="wen">${safe(w.en)}</div></div>`).join('');
 const ex=c.examples.map(x=>`<div class="example"><div class="example-zh">${mark(x.zh,c.word)}</div><div class="example-py">${safe(x.pinyin)}</div><div class="example-en">${safe(x.en)}</div></div>`).join('');
 d.innerHTML=`<div class="reveal"><div class="reveal-head"><div class="reveal-pinyin">${safe(c.pinyin)}</div><p class="glosses"><b>${safe(c.word)}</b> — ${c.en.map(safe).join('; ')}</p></div><div class="chartitle">Characters in this word</div><div class="charlist">${chars}</div><div class="extitle">Example sentences</div><div class="examples">${ex}</div></div>`}
function render(changeImage=true){const c=current();$('char').textContent=c.word;$('pinyin').textContent='';$('rankLabel').textContent=`Word frequency #${c.rank}`;$('cardStat').textContent=`${pos+1} / ${BANK.length}`;$('progressFill').style.width=((pos+1)/BANK.length*100)+'%';state='front';renderDetail('front');if(changeImage)setImage()}
function move(delta){const oldImg=imageForPosition();pos=Math.max(0,Math.min(BANK.length-1,pos+delta));render(imageForPosition()!==oldImg)}
$('prevBtn').onclick=()=>move(-1);$('nextBtn').onclick=()=>move(1);
$('revealBtn').onclick=()=>{state='revealed';renderDetail('revealed')};$('flipBtn').onclick=()=>{state='flip';renderDetail('flip')};
$('shuffleBtn').onclick=()=>{for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}pos=0;render(true)};
$('resetBtn').onclick=()=>{order=BANK.map((_,i)=>i);pos=0;render(true)};
render(true);
</script>
