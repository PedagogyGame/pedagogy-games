<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Chinese Character Study · 2101–2200</title>
<style>
:root{--ink:#1a2228;--muted:#5c6870;--paper:#eef2f4;--panel:#f2f5f6;--line:#b4c0c4;--deep:#1c2830;--good:#2a5c3c;--bad:#8a2f27;--gold:#b8a878}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(1200px 700px at 12% -10%,rgba(160,190,200,.32),transparent 52%),linear-gradient(180deg,#4e5c64 0%,#c4ccd0 42%,#3a4850 100%);color:var(--ink);font-family:Georgia,"Times New Roman","Noto Serif SC","Songti SC",serif;overflow:hidden}
.app{height:100vh;display:grid;grid-template-rows:auto 1fr;gap:0}
.topbar{min-height:58px;display:flex;align-items:center;gap:14px;padding:8px 18px;background:rgba(20,32,40,.96);color:#e8eef0;border-bottom:2px solid #b8a878}
.brand{font-size:18px;font-weight:700;letter-spacing:.05em;white-space:nowrap}.brand small{font-size:12px;font-weight:400;opacity:.7;margin-left:8px}
.progress{flex:1;max-width:460px;height:7px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:#b8a878;width:1%;transition:width .25s ease}
.stat{font-size:13px;opacity:.88;white-space:nowrap}.topbtn{border:1px solid rgba(255,255,255,.28);background:transparent;color:white;border-radius:8px;padding:7px 10px;cursor:pointer}
.main{min-height:0;display:grid;grid-template-columns:minmax(390px,46%) 1fr;gap:18px;padding:18px}
.quiz{min-height:0;background:rgba(244,248,246,.97);border:2px solid #3d5260;box-shadow:inset 0 0 0 6px #dce4e8,0 16px 48px rgba(20,32,40,.26);border-radius:4px;padding:18px 22px 16px;display:flex;flex-direction:column;overflow:auto}
.rankline{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.09em}
.character{text-align:center;font-family:"Noto Serif SC","Songti SC","STSong",serif;font-size:clamp(92px,11vw,164px);line-height:.95;margin:8px 0 0;color:#1a2228;text-shadow:0 1px 0 #fff}
.pinyin{text-align:center;font-size:clamp(24px,2.6vw,39px);font-style:italic;color:#3d5260;margin:0 0 8px}
.front-pinyin{display:none}.prompt{text-align:center;font-size:16px;margin:2px 0 8px;color:#5c6870}
button{font:600 13px/1.1 Georgia,serif;letter-spacing:.03em}
.controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:3px 0 7px}.controls .nav{display:flex;gap:6px;margin-right:6px}.ghost,.action{padding:9px 12px;border-radius:8px;cursor:pointer}.ghost{border:1px solid #8aa8ac;background:#e8eef0;color:#243038}.action{border:1px solid #3d5260;background:#3d5260;color:#fff}
.reveal{border-top:1px solid #c5d4d2;padding-top:9px;margin-top:2px;animation:fade .18s ease}.reveal-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:5px}.reveal-pinyin{font-size:clamp(27px,2.8vw,42px);font-style:italic;color:#3d5260;font-weight:700}.definition{font-size:20px;margin:0}.definition b{color:#2a4a4c}.wordtitle,.extitle{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:#5c6870;margin:9px 0 4px;font-weight:700}.wordlist{display:flex;gap:6px;flex-wrap:wrap}.wordchip{background:#e4eeec;border:1px solid #c3d4d0;border-radius:7px;padding:5px 8px;line-height:1.18}.wordchip .wzh{font-family:"Noto Serif SC","Songti SC",serif;font-size:19px;font-weight:700}.wordchip .wpy{font-size:13px;font-style:italic;color:#4a5c68}.wordchip .wen{font-size:12px;color:#4f5e5c}.examples{display:grid;gap:5px}.example{padding:6px 9px;background:#eef2f4;border-left:3px solid #3d5260;border-radius:5px;line-height:1.22}.example-zh{font-family:"Noto Serif SC","Songti SC",serif;font-size:clamp(19px,1.65vw,25px)}.example-py{font-size:clamp(14px,1.1vw,17px);font-style:italic;color:#4a5c68;margin-top:2px}.example-en{font-size:clamp(13px,1vw,16px);color:#4f463f;margin-top:2px}.example em{font-style:normal;font-weight:800;color:#8d2f21;background:#d7e4de;border-radius:3px;padding:0 .05em}
.flipcard{margin-top:3px;border:1px solid #9ab0b0;border-radius:4px;padding:12px 14px;background:#eef2f4}.flipcard h3{margin:0 0 7px;font-size:15px;color:#4a5c68;text-transform:uppercase;letter-spacing:.08em}.english-list{font-size:clamp(22px,2vw,32px);line-height:1.2;margin:4px 0 10px}.flipcard .reveal-pinyin{margin:0 0 6px}.further{border:1px solid #3d5260;background:transparent;color:#3d5260;border-radius:8px;padding:8px 11px;cursor:pointer}
.imagepane{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;background:rgba(16,24,30,.94);border:2px solid #1c2830;border-radius:4px;overflow:hidden;box-shadow:inset 0 0 0 7px rgba(196,163,106,.22),0 16px 48px rgba(20,32,40,.3)}
.imagepane:before{content:"";position:absolute;inset:8px;border:1px solid rgba(196,163,106,.5);border-radius:3px;pointer-events:none}.art{display:block;max-width:94%;max-height:90%;width:auto;height:auto;object-fit:contain;filter:saturate(.98) contrast(1.02);box-shadow:0 8px 32px rgba(0,0,0,.28);transition:opacity .35s ease,transform .35s ease}.art.wide{max-width:98%;max-height:84%}

@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@media(max-width:900px){body{overflow:auto}.app{height:auto;min-height:100vh}.main{grid-template-columns:1fr;grid-template-rows:auto minmax(360px,55vh)}.quiz{overflow:visible}.imagepane{min-height:420px}.topbar{flex-wrap:wrap}.progress{order:3;flex-basis:100%;max-width:none}}
@media(max-width:520px){.main{padding:9px;gap:9px}.quiz{padding:14px}.brand small{display:none}.character{font-size:104px}.example{font-size:20px}.topbar{padding:8px 10px}.stat.scoreStat{display:none}}
</style>
</head>
<body>

  <header class="topbar">

    </section>
  </main>
</div>

ān yàn.","en":"The flowers in the garden are blooming in very bright colors."},{"zh":"五月的艳阳照在田野上。","pinyin":"wǔ yuè de yàn yáng zhào zài tián yě shàng.","en":"The bright May sun shone on the fields."}]},{"rank":2105,"char":"臭","pinyin":"chòu","meanings":["stinking","smelly"],"words":[{"zh":"臭味","pinyin":"chòu wèi","en":"stink"},{"zh":"口臭","pinyin":"kǒu chòu","en":"bad breath"},{"zh":"臭名","pinyin":"chòu míng","en":"bad name"},{"zh":"臭气","pinyin":"chòu qì","en":"foul smell"}],"examples":[{"zh":"垃圾堆发出难闻的臭味。","pinyin":"lā jī duī fā chū nán wén de chòu wèi.","en":"The garbage heap gave off a foul stink."},{"zh":"房间里有一股臭气。","pinyin":"fáng jiān lǐ yǒu yì gǔ chòu qì.","en":"There is a foul smell in the room."}]},{"rank":2106,"char":"纤","pinyin":"xiān","meanings":["fine","fiber"],"words":[{"zh":"纤维","pinyin":"xiān wéi","en":"fiber"},{"zh":"纤细","pinyin":"xiān xì","en":"slender"},{"zh":"化纤","pinyin":"huà xiān","en":"chemical fiber"},{"zh":"光纤","pinyin":"guāng xiān","en":"optical fiber"}],"examples":[{"zh":"这种布的纤维很结实。","pinyin":"zhè zhǒng bù de xiān wéi hěn jié shi.","en":"The fiber of this cloth is very strong."},{"zh":"她的手指十分纤细。","pinyin":"tā de shǒu zhǐ shí fēn xiān xì.","en":"Her fingers are extremely slender."}]},{"rank":2107,"char":"玑","pinyin":"jī","meanings":["irregular pearl"],"words":[{"zh":"珠玑","pinyin":"zhū jī","en":"pearls; fine words"},{"zh":"璇玑","pinyin":"xuán jī","en":"armillary sphere"}],"examples":[{"zh":"他出口便是珠玑。","pinyin":"tā chū kǒu biàn shì zhū jī.","en":"What he says is like pearls."},{"zh":"古人用璇玑观测星象。","pinyin":"gǔ rén yòng xuán jī guān cè xīng xiàng.","en":"The ancients used an armillary sphere to observe the stars."}]},{"rank":2108,"char":"棵","pinyin":"kē","meanings":["measure word for plants"],"words":[{"zh":"一棵","pinyin":"yì kē","en":"one plant"},{"zh":"几棵","pinyin":"jǐ kē","en":"several plants"},{"zh":"树棵","pinyin":"shù kē","en":"tree count"}],"examples":[{"zh":"院里种了三棵枣树。","pinyin":"yuàn lǐ zhòng le sān kē zǎo shù.","en":"Three jujube trees were planted in the courtyard."},{"zh":"路边只剩下一棵老柳。","pinyin":"lù biān zhǐ shèng xià yì kē lǎo liǔ.","en":"Only one old willow is left by the road."}]},{"rank":2109,"char":"趁","pinyin":"chèn","meanings":["take advantage of"],"words":[{"zh":"趁机","pinyin":"chèn jī","en":"seize the chance"},{"zh":"趁早","pinyin":"chèn zǎo","en":"as soon as possible"},{"zh":"趁势","pinyin":"chèn shì","en":"follow the momentum"},{"zh":"趁热","pinyin":"chèn rè","en":"while hot"}],"examples":[{"zh":"趁天还亮，我们把活干完。","pinyin":"chèn tiān hái liàng, wǒ men bǎ huó gàn wán.","en":"While it is still light, we will finish the work."},{"zh":"这事得趁早办。","pinyin":"zhè shì děi chèn zǎo bàn.","en":"This matter should be done as soon as possible."}]},{"rank":2110,"char":"匠","pinyin":"jiàng","meanings":["craftsman"],"words":[{"zh":"工匠","pinyin":"gōng jiàng","en":"craftsman"},{"zh":"木匠","pinyin":"mù jiàng","en":"carpenter"},{"zh":"铁匠","pinyin":"tiě jiàng","en":"blacksmith"},{"zh":"匠心","pinyin":"jiàng xīn","en":"ingenuity"}],"examples":[{"zh":"村里还住着几位老工匠。","pinyin":"cūn lǐ hái zhù zhe jǐ wèi lǎo gōng jiàng.","en":"A few old craftsmen still live in the village."},{"zh":"这座桥的设计很有匠心。","pinyin":"zhè zuò qiáo de shè jì hěn yǒu jiàng xīn.","en":"The design of this bridge shows real ingenuity."}]},{"rank":2111,"char":"盈","pinyin":"yíng","meanings":["full","surplus"],"words":[{"zh":"盈利","pinyin":"yíng lì","en":"make a profit"},{"zh":"丰盈","pinyin":"fēng yíng","en":"plentiful"},{"zh":"盈亏","pinyin":"yíng kūi","en":"profit and loss"},{"zh":"笑盈盈","pinyin":"xiào yíng yíng","en":"beaming with smiles"}],"examples":[{"zh":"今年公司首次实现盈利。","pinyin":"jīn nián gōng sī shǒu cì shí xiàn yíng lì.","en":"This year the company made a profit for the first time."},{"zh":"她笑盈盈地走了过来。","pinyin":"tā xiào yíng yíng de zǒu le guò lái.","en":"She came over beaming with smiles."}]},{"rank":2112,"char":"翁","pinyin":"wēng","meanings":["old man","Weng, a surname"],"words":[{"zh":"老翁","pinyin":"lǎo wēng","en":"old man"},{"zh":"渔翁","pinyin":"yú wēng","en":"old fisher function safe(t){return String(t).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}

function setImage(){const idx=imageForPosition(), img=$('art');img.style.opacity=.15;setTimeout(()=>{img.src=IMAGES[idx]; img.onload=()=>{img.classList.toggle('wide',img.naturalWidth/img.naturalHeight>1.75);img.style.opacity=1}},90)}
function renderDetail(mode){const c=current(), d=$('detailArea'); if(mode==='front'){d.innerHTML='';return}
