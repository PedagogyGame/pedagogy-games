<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>哪边</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d0f14;color:#e8e4d9;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;justify-content:center;min-height:100vh}
#app{width:100%;max-width:520px;display:flex;flex-direction:column;min-height:100vh}
.screen{flex:1;display:flex;flex-direction:column;padding:16px;gap:14px;overflow-y:auto}
h1{font-size:34px;font-weight:500;letter-spacing:2px}
.sub{color:#8b8577;font-size:14px;line-height:1.6}
.btn{background:#1b1f27;border:1px solid #3a3f4a;color:#e8e4d9;padding:14px 18px;border-radius:8px;font-size:17px;cursor:pointer;font-family:inherit;text-align:center;transition:background .12s}
.btn:hover{background:#252a34}
.btn:active{background:#2e3440}
.card{background:#1b1f27;border:1px solid #3a3f4a;border-radius:8px;padding:16px;cursor:pointer;font-size:26px;text-align:center;letter-spacing:1px;transition:background .12s,border-color .12s}
.card:hover{background:#252a34;border-color:#5a6070}
.card.wrong{background:#3a1c1c;border-color:#7a3333}
.card.right{background:#1c3a2a;border-color:#337a55}
.cards{display:flex;flex-direction:column;gap:10px}
.hud{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#8b8577;padding:0 2px}
.strikes{letter-spacing:4px;color:#c96a5a}
.quiet{color:#6f6a5e;font-size:13px;line-height:1.6;padding:10px 4px;text-align:center;font-style:italic}
@keyframes scrollx{from{transform:translateX(-280px)}to{transform:translateX(0)}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(-360deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-.5px)}}
@keyframes pointin{0%{transform:rotate(30deg);opacity:0}35%{opacity:1}100%{transform:rotate(0);opacity:1}}
@keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(-1.4deg)}}
@keyframes flick{0%,100%{opacity:.85}50%{opacity:1}}
.wheel{animation:spin .42s linear infinite;transform-box:fill-box;transform-origin:center}
.car{animation:bob .5s ease-in-out infinite}
.arm{animation:pointin .55s cubic-bezier(.22,.9,.28,1) both}
.armsway{animation:sway 3.4s ease-in-out infinite;transform-box:fill-box}
.skipnote{font-size:11px;color:#5c5749;text-align:center;letter-spacing:.5px}
.line{background:#151920;border-left:2px solid #4a5568;padding:12px 14px;font-size:22px;letter-spacing:1px}
.line .py{display:block;font-size:12px;color:#7a7466;letter-spacing:.5px;margin-top:5px}
.gate{display:flex;flex-direction:column;gap:8px}
.you{font-size:11px;color:#6b6559;text-transform:uppercase;letter-spacing:1px}
select{background:#1b1f27;border:1px solid #3a3f4a;color:#e8e4d9;padding:13px;border-radius:8px;font-size:17px;width:100%;font-family:inherit}
.pin{font-size:12px;color:#7a7466;text-align:center;letter-spacing:.5px;min-height:16px}
.tog{font-size:12px;color:#6b6559;text-align:center;cursor:pointer;padding:4px}
.big{font-size:44px;letter-spacing:3px;text-align:center;padding:20px 0}
.mid{text-align:center;font-size:16px;color:#8b8577;line-height:1.7}
</style>

<body>
<div id="app"></div>
<script>
var app=document.getElementById('app');
var pinyinOn=false;

/* Browser voices vary wildly by machine. Rank every installed Chinese
   voice and keep the best one, preferring named neural/premium voices
   over the tinny "compact" fallbacks. */
var VOICE=null,ZHV=[];
function rankVoice(v){
  var n=(v.name||'').toLowerCase(),l=(v.lang||'').replace('_','-').toLowerCase(),s=0;
  var PREF=['xiaoxiao','yunxi','yunyang','xiaoyi','tingting','ting-ting','yaoyao',
            'huihui','kangkang','mei-jia','meijia','sinji','google 普通话',
            'google mandarin','google chinese','普通话','中文'];
  for(var i=0;i<PREF.length;i++){if(n.indexOf(PREF[i])>=0){s+=120-i*4;break;}}
  if(/(neural|natural|premium|enhanced|siri)/.test(n))s+=70;
  if(l.indexOf('zh-cn')===0)s+=45;else if(l.indexOf('zh')===0)s+=10;
  if(!v.localService)s+=25;
  if(n.indexOf('compact')>=0)s-=60;
  return s;
}
function pickVoice(){
  var all=[];
  try{all=speechSynthesis.getVoices()||[];}catch(e){return;}
  ZHV=all.filter(function(v){return v.lang&&v.lang.replace('_','-').toLowerCase().indexOf('zh')===0;});
  ZHV.sort(function(a,b){return rankVoice(b)-rankVoice(a);});
  if(ZHV.length&&(!VOICE||ZHV.indexOf(VOICE)<0))VOICE=ZHV[0];
}
function setVoice(i){VOICE=ZHV[+i]||VOICE;say('你好');}
/* say(text, slow, done) — `done` fires when the voice has actually finished.
   Screens used to advance on a fixed timer, so any sentence longer than the
   timer got cut off mid-word by the next screen's speechSynthesis.cancel().
   The fallback timer only exists for browsers that never report onend, and
   is short when there is no Chinese voice installed at all. */
function say(t,slow,done){
  var fired=false,tm=null;
  function fin(){if(fired)return;fired=true;if(tm)clearTimeout(tm);if(done)done();}
  try{
    if(!VOICE)pickVoice();
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(t);
    u.lang='zh-CN';
    u.rate=slow?0.62:0.82;
    u.pitch=1.0;u.volume=1;
    if(VOICE)u.voice=VOICE;
    if(done){u.onend=fin;u.onerror=fin;}
    speechSynthesis.speak(u);
    if(done)tm=setTimeout(fin,VOICE?(900+t.length*430):420);
  }catch(e){if(done)tm=setTimeout(fin,420);}
}
if(window.speechSynthesis){speechSynthesis.getVoices();pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}

var DIR={
  left:{zh:['左转','左拐'],py:['zuǒ zhuǎn','zuǒ guǎi']},
  right:{zh:['右转','右拐'],py:['yòu zhuǎn','yòu guǎi']},
  straight:{zh:['一直走'],py:['yìzhí zǒu']},
  that:{zh:['那边'],py:['nàbiān']}
};
/* 转 is standard everywhere; 拐 is colloquial and leans northern.
   Oscillate rather than fix, so the player meets both registers. */
function dirZh(d){var a=DIR[d].zh;return a[Math.floor(Math.random()*a.length)];}
/* keep characters and pinyin on the same register — showing 右拐 under
   yòu zhuǎn would be teaching the wrong thing */
function dirPair(d){var i=Math.floor(Math.random()*DIR[d].zh.length);return [DIR[d].zh[i],DIR[d].py[i]];}
/* agreement: 对 and 是 both mean yes here. 不是 is the refusal. */
var AGREE=['对','是'];
function agreeZh(){return AGREE[Math.floor(Math.random()*AGREE.length)];}

var COUNTRIES=[['韩国','Hánguó','South Korea'],['日本','Rìběn','Japan'],['美国','Měiguó','United States'],
['俄罗斯','Éluósī','Russia'],['越南','Yuènán','Vietnam'],['马来西亚','Mǎláixīyà','Malaysia'],
['新加坡','Xīnjiāpō','Singapore'],['菲律宾','Fēilǜbīn','Philippines'],['蒙古','Ménggǔ','Mongolia'],
['泰国','Tàiguó','Thailand'],['加拿大','Jiānádà','Canada'],['澳大利亚','Àodàlìyà','Australia'],
['印度','Yìndù','India'],['德国','Déguó','Germany'],['英国','Yīngguó','United Kingdom'],
['法国','Fǎguó','France'],['印度尼西亚','Yìndùníxīyà','Indonesia'],['意大利','Yìdàlì','Italy'],
['哈萨克斯坦','Hāsàkèsītǎn','Kazakhstan'],['缅甸','Miǎndiàn','Myanmar']];

 start:{p:[140,196],lm:null,go:{straight:'j1'}},
 j1 :{p:[140,172],lm:'车站',  pt:'right',   go:{straight:'j2',left:'k1'}, dead:{right:[176,172]}},
 k1 :{p:[104,172],lm:'小卖部',pt:'straight',go:{straight:'k2'},  dead:{left:[72,172]}},

 goal:{p:[86,28],lm:null,go:{}}
};

var S={};
function reset(){
  S={name:'',country:null,at:'start',strikes:0,mins:0,busy:false,cards:{},pt:{},ask:{},side:{},seed:{},seen:{},order:null,dest:null,driveT:null};
  rollPointing();
}
/* The driver is a real driver: mostly right, sometimes wrong, and never
   wrong in the same place twice running. Rolled fresh each game so the
   route can't be memorised — you have to read the cards. */
var RIGHT_RATE=0.62;
var ASK_RATE=0.40;   /* he only speaks up when he actually has a doubt */
function rollPointing(){
  S.pt={};S.ask={};S.side={};S.seed={};
  for(var id in NODES){
    var n=NODES[id];
    if(!n.pt)continue;
    var viable=[],dead=[];
    for(var d in n.go)viable.push(d);
    for(var d2 in (n.dead||{}))dead.push(d2);
    var pool=(Math.random()<RIGHT_RATE||!dead.length)?viable:dead;
    if(!pool.length)pool=viable;
    S.pt[id]=pool[Math.floor(Math.random()*pool.length)];
    S.ask[id]=Math.random()<ASK_RATE;
    S.side[id]=Math.random()<0.5?'left':'right';
    S.seed[id]=1+Math.floor(Math.random()*2000000);
  }
}
function curAsk(){return !!S.ask[S.at];}
function curSide(){return S.side[S.at]||'right';}
function curSeed(){return S.seed[S.at]||7;}
function curPt(){return S.pt[S.at]||NODES[S.at].pt;}
reset();

/* Traffic. A block takes three or four minutes depending on the lights,
   which averages 3.5 — enough that the long way round can cost you the
   restaurant, but only if you also guess wrong somewhere. */
function blockTime(){return 3+(Math.random()<0.5?0:1);}
var DEAD_MIN=11;
var OPEN_MIN=21*60+40;   /* 21:40 — you get in the cab */
var CLOSE_MIN=22*60+30;  /* 22:30 — the shutter comes down */
function nowMin(){return OPEN_MIN+S.mins;}
function isLate(){return nowMin()>CLOSE_MIN;}
function minsLeft(){return CLOSE_MIN-nowMin();}
function clockStr(){
  var t=Math.round(nowMin());
  var h=Math.floor(t/60)%24,m=Math.floor(t%60);
  return (h<10?'0':'')+h+':'+(m<10?'0':'')+m;
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}

function L(zh,py){
  return '<div class="line" onclick="say(\''+zh+'\')">'+zh+
    (pinyinOn?'<span class="py">'+py+'</span>':'')+'</div>';
}

/* ---------- title ---------- */
/* Voice quality is entirely down to what the machine has installed,
   so let the player audition them rather than guessing for them. */
function voicePicker(){
  pickVoice();
  if(ZHV.length<2)return ZHV.length
    ? '<div class="tog" onclick="say(\'你好\')">voice: '+esc(ZHV[0].name)+' — tap to test</div>'
    : '<div class="tog">no Chinese voice installed — see note below</div>';
  var h='<div class="gate" style="gap:6px"><select id="vc" onchange="setVoice(this.value)">';
  for(var i=0;i<ZHV.length;i++)
    h+='<option value="'+i+'"'+(ZHV[i]===VOICE?' selected':'')+'>'+esc(ZHV[i].name)+'</option>';
  return h+'</select><div class="tog" onclick="say(\'哪边\')">tap to hear 哪边</div></div>';
}

function title(){
  app.innerHTML='<div class="screen" style="justify-content:center;gap:22px">'+
   '<h1 style="text-align:center">哪边</h1>'+
   '<div class="mid">Beijing, 2010. A taxi. Somewhere across the city<br>that shuts at 22:30. You do not speak Chinese.</div>'+
   '<div class="sub" style="text-align:center">Every answer is in characters. The map shows you where to go — the words are how you say it. Those are the same problem.</div>'+
   '<div class="btn" onclick="reset();gate(0)">开始</div>'+
   voicePicker()+
   '<div class="tog" onclick="pinyinOn=!pinyinOn;title()">pinyin: '+(pinyinOn?'on':'off')+'</div></div>';
}

/* ---------- the car ----------
   Drawn once in local coordinates: 82 long, roof at y=0, tyres touching
   y=38.5. Both the kerbside scene and the driving scene place it from
   here, so there is only ever one car to improve. */
function taxi(ox,oy,sc,opt){
  opt=opt||{};
  var s='<g transform="translate('+ox+','+oy+') scale('+sc+')"'+(opt.bob?' class="car"':'')+'>';
  s+='<ellipse cx="41" cy="39.5" rx="43" ry="4" fill="#000" opacity=".5"/>';
  /* headlight throw */
  if(opt.lights)
    s+='<path d="M-1 18.5 L-40 11 L-44 20 L-40 29 L-1 22.5 Z" fill="url(#beam)"/>';
  /* body shell */
  s+='<path d="M0 26 Q0 18 6 16 L23 14 L35 0 L61 0 L71 13 L77 16 Q82 18 82 26 L82 30 L0 30 Z" fill="#1f6b52"/>';
  s+='<path d="M35 0 L61 0 L64 2 L33 2 Z" fill="#287d61"/>';
  /* champagne lower body — the Beijing two-tone */
  s+='<path d="M1 21 L81 21 L81 30 L1 30 Z" fill="#e8dcc0"/>';
  s+='<rect x="1" y="20.4" width="80" height="1.2" fill="#f7efdb" opacity=".8"/>';
  s+='<rect x="1" y="27.4" width="80" height="1" fill="#cfc3a6" opacity=".7"/>';
  /* glasshouse */
  s+='<path d="M37 2 L60 2 L69 12 L27 12 Z" fill="#0d1a19"/>';
  s+='<path d="M37 2 L60 2 L69 12 L27 12 Z" fill="none" stroke="#3f8f74" stroke-width=".8"/>';
  s+='<path d="M39 3.4 L47 3.4 L41 10.6 L31.5 10.6 Z" fill="#173129" opacity=".85"/>';
  s+='<rect x="47" y="2" width="2" height="10" fill="#1f6b52"/>';
  s+='<path d="M62 3 L67.5 11 L58 11 L58 3 Z" fill="#12241f"/>';
  /* people inside */
  if(opt.driver) s+='<circle cx="38" cy="8" r="2.6" fill="#2c3742"/>';
  if(opt.rider)  s+='<circle cx="60" cy="8" r="2.6" fill="#33404f"/>';
  /* trim, seams, handles */
  s+='<rect x="27" y="12" width="42" height="1" fill="#9fb3aa" opacity=".45"/>';
  s+='<line x1="47" y1="13" x2="47" y2="30" stroke="#18523f" stroke-width="1.1"/>';
  s+='<line x1="24" y1="14.5" x2="24" y2="21" stroke="#18523f" stroke-width=".9"/>';
  s+='<rect x="40" y="16" width="6.5" height="1.8" rx=".9" fill="#cbbf9f"/>';
  s+='<rect x="51" y="16" width="6.5" height="1.8" rx=".9" fill="#cbbf9f"/>';
  s+='<path d="M33 12.5 l-4.5 1.5 l0 2.4 l4.5 -1.6 z" fill="#1a5a45"/>';   /* wing mirror */
  s+='<line x1="58" y1="1" x2="62" y2="-6" stroke="#2a3a34" stroke-width=".8"/>'; /* aerial */
  /* checker band + fleet decal */
  for(var q=0;q<11;q++)
    s+='<rect x="'+(26+q*3.2)+'" y="24.6" width="1.6" height="1.8" fill="'+(q%2?'#1f6b52':'#b8ab8c')+'"/>';
  s+='<rect x="52" y="22.6" width="15" height="1.4" rx=".5" fill="#b8ab8c" opacity=".6"/>';
  /* lamps + plates */
  s+='<rect x="-.5" y="17" width="4.5" height="4.6" rx="1.6" fill="#ffe6a8" opacity=".92"/>';
  s+='<rect x="78" y="17" width="4" height="4.6" rx="1.5" fill="#ff6b4a" opacity=".92"/>';
  s+='<rect x="72" y="25" width="7.5" height="3" rx=".6" fill="#e6d68f"/>';
  s+='<rect x="2" y="25" width="7.5" height="3" rx=".6" fill="#e6d68f" opacity=".75"/>';
  s+='<rect x="0" y="22.5" width="6" height="1.4" fill="#7d8f86" opacity=".5"/>';
  /* arches cut, then wheels dropped in */
  var W1=14,W2=66;
  s+='<path d="M'+(W1-11)+' 31 a11 11 0 0 1 22 0 z" fill="'+(opt.bg||'#0a0c10')+'"/>';
  s+='<path d="M'+(W2-11)+' 31 a11 11 0 0 1 22 0 z" fill="'+(opt.bg||'#0a0c10')+'"/>';
  s+='<path d="M'+(W1-11)+' 31 a11 11 0 0 1 22 0" fill="none" stroke="#17553f" stroke-width="1.5"/>';
  s+='<path d="M'+(W2-11)+' 31 a11 11 0 0 1 22 0" fill="none" stroke="#17553f" stroke-width="1.5"/>';
  for(var k=0;k<2;k++){

    s+='<circle cx="'+cx+'" cy="30" r="4.6" fill="#2b333d"/>';

    s+='<circle cx="'+cx+'" cy="30" r="4.6" fill="none" stroke="#49525f" stroke-width=".8"/>';
    for(var a=0;a<4;a++){
      var th=a*Math.PI/4;
      s+='<line x1="'+(cx-4.2*Math.cos(th)).toFixed(2)+'" y1="'+(30-4.2*Math.sin(th)).toFixed(2)+
         '" x2="'+(cx+4.2*Math.cos(th)).toFixed(2)+'" y2="'+(30+4.2*Math.sin(th)).toFixed(2)+

  s+='<text x="51" y="-1.8" fill="#3a2f10" font-size="5.6" text-anchor="middle" font-weight="700">TAXI</text>';
  if(opt.fumes)
    s+='<circle cx="86" cy="28" r="3" fill="#8fa39a" opacity=".16"/><circle cx="92" cy="26" r="4.5" fill="#8fa39a" opacity=".09"/>';
  return s+'</g>';
}

function cab(step){
  var d=dest(),r=rnd(4471);
  var s='<svg viewBox="0 0 280 132" style="width:100%;height:auto;background:#0a0c10;border:1px solid #262b34;border-radius:8px">';
  s+='<defs>'+
     '<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">'+
       '<stop offset="0" stop-color="#0a0e15"/><stop offset=".62" stop-color="#111823"/>'+
       '<stop offset="1" stop-color="#1d2a33"/></linearGradient>'+
     '<radialGradient id="lampg"><stop offset="0" stop-color="#ffcf8a" stop-opacity=".34"/>'+
       '<stop offset="1" stop-color="#ffcf8a" stop-opacity="0"/></radialGradient>'+
     '<radialGradient id="signg"><stop offset="0" stop-color="#ff5540" stop-opacity=".34"/>'+
       '<stop offset="1" stop-color="#ff5540" stop-opacity="0"/></radialGradient>'+
     '<radialGradient id="moong"><stop offset="0" stop-color="#e8b830" stop-opacity=".26"/>'+
       '<stop offset="1" stop-color="#e8b830" stop-opacity="0"/></radialGradient>'+
     '<linearGradient id="beam" x1="1" y1="0" x2="0" y2="0">'+
       '<stop offset="0" stop-color="#ffe0a0" stop-opacity=".26"/>'+
       '<stop offset="1" stop-color="#ffe0a0" stop-opacity="0"/></linearGradient>'+
     '</defs>';
  s+='<rect x="0" y="0" width="280" height="98" fill="url(#sky)"/>';
  s+='<circle cx="30" cy="17" r="20" fill="url(#moong)"/>';
  s+='<circle cx="30" cy="17" r="3.6" fill="#f0c94a" opacity=".5"/>';
  /* --- shop row behind, with lit frontages and hanging signboards --- */
  var bx=104;
  while(bx<280){
    var bw=24+Math.floor(r()*22),bh=34+Math.floor(r()*38);
    if(bx+bw>280)bw=280-bx;
    s+='<rect x="'+bx+'" y="'+(88-bh)+'" width="'+bw+'" height="'+bh+'" fill="#111821"/>';
    s+='<rect x="'+bx+'" y="'+(88-bh)+'" width="'+bw+'" height="1.4" fill="#242f3c"/>';
    for(var wy=88-bh+6;wy<76;wy+=8)
      for(var wx=bx+4;wx<bx+bw-5;wx+=8)

    s+='<rect x="'+(bx+2)+'" y="79" width="'+(bw-4)+'" height="9" fill="#1d1611"/>';

  s+='<ellipse cx="112" cy="20" rx="16" ry="20" fill="url(#lampg)"/>';
  /* --- pavement, kerb, road --- */

/* ---------- gate ---------- */
/* You choose where you are going. All four are real destinations and the
   game takes you to whichever one you name. They are chosen to share
   characters: 饭馆 and 旅馆 differ by one, 火车站 carries the 车 from the
   first question and the 站 you will pass on the road. */
var DESTS=[
 ['饭馆','fànguǎn','the restaurant','厨房关门','Six tables, one fluorescent tube, plastic stools.<br>The knife-cut noodles are still going.','The shutter is down. The red sign is off.'],
 ['旅馆','lǚguǎn','the guesthouse','前台关门','A narrow lobby, a thermos of hot water,<br>and a key on a wooden fob.','The desk is dark. Nobody answers the bell.'],
 ['火车站','huǒchēzhàn','the railway station','末班车','The concourse is still lit. There is a train<br>on the board and time to buy a ticket.','The last train has gone. The gates are chained.'],
 ['机场','jīchǎng','the airport','值机关闭','Departures is quiet but open.<br>The desk takes your bag without a word.','Check-in closed while you were on the ring road.']
];
function dest(){return S.dest||DESTS[0];}

/* Every step is a real choice. Distractors are near-misses, not noise:
   the wrong vehicles all contain 车, the wrong verbs all start 我,
   and 我要去车站 is a place you will meet again out on the road. */
var GATE=[
 {q:'The driver waits by the kerb. What is this vehicle called?',zh:'出租车',
  opts:[['出租车','chūzūchē','taxi'],['公共汽车','gōnggòng qìchē','bus'],
        ['自行车','zìxíngchē','bicycle'],['火车','huǒchē','train']]},
 {q:'Greet him.',zh:'你好',
  opts:[['你好','nǐ hǎo','hello'],['再见','zàijiàn','goodbye'],
        ['谢谢','xièxie','thank you'],['对不起','duìbuqǐ','sorry']]},
 {q:'You are about to tell him your name. Which one opens that sentence?',zh:'我叫',name:true,
  opts:[['我叫','wǒ jiào','my name is'],['我是','wǒ shì','I am'],
        ['我要','wǒ yào','I want'],['我去','wǒ qù','I go']]},
 {q:'Now tell him where you are from.',zh:'我是',country:true,
  opts:[['我是…人','wǒ shì … rén','I am a … person'],['我叫…人','wǒ jiào … rén','—'],
        ['我去…人','wǒ qù … rén','—'],['我要…人','wǒ yào … rén','—']]},
 {q:'Where do you want to go tonight? Tell him. Whichever you name is where he will take you.',dest:true,zh:'我要去',
  opts:DESTS.map(function(d){return ['我要去'+d[0],'wǒ yào qù '+d[1],d[2]];})}
];
function gateHead(i){
  return '<div class="hud"><span>'+(i+1)+' / 5</span><span>'+clockStr()+'</span></div>'+cab(i);
}
function gate(i){
  if(i>=GATE.length)return knowWay();
  var g=GATE[i];
  if(!S.order)S.order={};
  if(!S.order[i]){
    var idx=g.opts.map(function(_,k){return k;});
    idx.sort(function(){return Math.random()-.5});
    S.order[i]=idx;
  }
  var body='<div class="screen">'+gateHead(i)+
    '<div class="sub">'+g.q+'</div><div class="cards">';
  for(var j=0;j<S.order[i].length;j++){
    var o=g.opts[S.order[i][j]];
    body+='<div class="card" onclick="gatePick('+i+','+S.order[i][j]+',this)">'+o[0]+
      (pinyinOn?'<div class="pin" style="margin:3px 0 0">'+o[1]+'</div>':'')+'</div>';
  }
  body+='</div><div class="pin" id="gt"></div>'+
    '<div class="tog" onclick="pinyinOn=!pinyinOn;gate('+i+')">pinyin: '+(pinyinOn?'on':'off')+'</div></div>';
  app.innerHTML=body;
}
function gatePick(i,k,el){
  if(S.busy)return;
  var g=GATE[i],o=g.opts[k];
  var correct=g.dest?true:(o[0].indexOf(g.zh)===0);
  if(g.dest)S.dest=DESTS[k];
  if(!correct){
    say(o[0].replace('…',''));
    el.className='card wrong';
    document.getElementById('gt').textContent=o[0]+' — '+o[1]+' — '+o[2];
    setTimeout(function(){el.className='card';},900);
    return;
  }
  S.busy=true;el.className='card right';
  document.getElementById('gt').textContent=o[0]+' — '+o[1]+' — '+o[2];
  say(o[0].replace('…',''),false,function(){
    setTimeout(function(){
      S.busy=false;
      if(g.name)return gateName(i);
      if(g.country)return gateCountry(i);
      gate(i+1);
    },260);
  });
}
function gateName(i){
  app.innerHTML='<div class="screen">'+gateHead(i)+
    '<div class="sub">Say it.</div><div class="big">我叫…</div>'+
    '<div class="pin">'+(pinyinOn?'wǒ jiào … — ':'')+'my name is…</div>'+
    '<div class="gate"><input id="nm" class="btn" style="text-align:left" placeholder="your name" value="'+esc(S.name)+'">'+
    '<div class="btn" onclick="S.name=(document.getElementById(\'nm\').value||\'Ben\');say(\'我叫\'+S.name,false,function(){gate('+(i+1)+')})">说</div></div></div>';
}
function gateCountry(i){
  var body='<div class="screen">'+gateHead(i)+
    '<div class="sub">Which country?</div><div class="big">我是…人</div>'+
    '<div class="pin">'+(pinyinOn?'wǒ shì … rén — ':'')+'I am from…</div><div class="gate"><select id="ct">';
  for(var k=0;k<COUNTRIES.length;k++)body+='<option value="'+k+'">'+COUNTRIES[k][0]+' — '+COUNTRIES[k][2]+'</option>';
  body+='</select><div class="btn" onclick="pickCountry('+(i+1)+')">说</div></div></div>';
  app.innerHTML=body;
}
function pickCountry(n){
  var k=+document.getElementById('ct').value;
  S.country=COUNTRIES[k];
  say('我是'+S.country[0]+'人',false,function(){gate(n);});
}

/* ---------- scene ---------- */
/* His right arm, seen from the back seat. The arm is one eased curve from
   shoulder to wrist; the hand is a closed fist with a SHORT index finger.
   The finger used to be sixty per cent the length of the whole arm, which
   is why it read as a tentacle rather than a hand. */
function hand(dir){
  var A={
    left:    {c:'C 97 93, 95 76, 91 66', wx:91,  wy:66, a:-140},
    right:   {c:'C 106 100, 122 92, 138 82', wx:138, wy:82, a:-26},
    straight:{c:'C 99 96, 109 83, 115 72', wx:115, wy:72, a:-64}
  }[dir];
  var th=A.a*Math.PI/180;
  var ux=Math.cos(th), uy=Math.sin(th);
  var fx=A.wx+ux*5.5, fy=A.wy+uy*5.5;          /* knuckles */
  var tx=A.wx+ux*15.5, ty=A.wy+uy*15.5;        /* fingertip — short */
  var thx=A.wx-uy*4.2, thy=A.wy+ux*4.2;        /* thumb, across the fist */
  var d='M88 104 '+A.c;
  var s='<g class="arm" style="transform-box:view-box;transform-origin:88px 104px">';
  s+='<g class="armsway" style="transform-box:view-box;transform-origin:88px 104px">';
  /* sleeve, dark edge under a lighter top so the arm has a little roundness */
  s+='<path d="'+d+'" fill="none" stroke="#0a0e14" stroke-width="11.5" stroke-linecap="round"/>';
  s+='<path d="'+d+'" fill="none" stroke="#2b3644" stroke-width="8.5" stroke-linecap="round"/>';
  s+='<path d="'+d+'" fill="none" stroke="#3a4757" stroke-width="3.4" stroke-linecap="round" opacity=".5"/>';
  /* wrist */
  s+='<circle cx="'+A.wx.toFixed(1)+'" cy="'+A.wy.toFixed(1)+'" r="3.6" fill="#a9825f"/>';
  /* fist */
  s+='<ellipse cx="'+((A.wx+fx)/2).toFixed(1)+'" cy="'+((A.wy+fy)/2).toFixed(1)+
     '" rx="5.6" ry="4.9" fill="#c49a7c" transform="rotate('+A.a.toFixed(0)+' '+
     ((A.wx+fx)/2).toFixed(1)+' '+((A.wy+fy)/2).toFixed(1)+')"/>';
  s+='<circle cx="'+thx.toFixed(1)+'" cy="'+thy.toFixed(1)+'" r="2.4" fill="#b88d6e"/>';
  /* index finger, short */
  s+='<line x1="'+fx.toFixed(1)+'" y1="'+fy.toFixed(1)+'" x2="'+tx.toFixed(1)+'" y2="'+ty.toFixed(1)+
     '" stroke="#c9a184" stroke-width="3.6" stroke-linecap="round"/>';
  s+='<circle cx="'+tx.toFixed(1)+'" cy="'+ty.toFixed(1)+'" r="1.8" fill="#dcb69a"/>';
  /* two knuckle creases so the fist reads as a fist */
  s+='<circle cx="'+(fx-ux*1.6-uy*2.2).toFixed(1)+'" cy="'+(fy-uy*1.6+ux*2.2).toFixed(1)+'" r="1.15" fill="#a9825f" opacity=".75"/>';
  s+='<circle cx="'+(fx-ux*1.6+uy*2.2).toFixed(1)+'" cy="'+(fy-uy*1.6-ux*2.2).toFixed(1)+'" r="1.15" fill="#a9825f" opacity=".75"/>';
  return s+'</g></g>';
}

/* A deterministic little RNG so a junction looks the same every time you
   re-render it (the pinyin toggle redraws the scene) but different from
   its neighbours. */
function rnd(seed){
  var s=(seed||1)%2147483647; if(s<=0)s+=2147483646;
  var f=function(){s=s*16807%2147483647;return (s-1)/2147483646;};
  f();f();f();f();          /* warm up: the first draws off a small seed are correlated */
  return f;
}

/* Buildings down both sides of the road. Each side independently rolls a
   chance of being open ground instead — a hoarded-off lot or a low wall —
   because a city that is built up everywhere reads as false, and the
   empty stretches are what make the dense ones feel like somewhere. */
function skyline(seed){
  var r=rnd(seed),HOR=72,s='';
  s+='<rect x="26" y="44" width="228" height="28" fill="#1a222d" opacity=".40"/>';   /* smog */
  /* far blocks closing off the end of the street, so the road runs into a
     city rather than into nothing */
  for(var fx=104;fx<178;){
    var fw=7+Math.floor(r()*11),fh=7+Math.floor(r()*13);
    s+='<rect x="'+fx+'" y="'+(HOR-fh)+'" width="'+fw+'" height="'+fh+'" fill="#131a24"/>';
    if(r()<0.5)s+='<rect x="'+(fx+2)+'" y="'+(HOR-fh+3)+'" width="2" height="2.5" fill="#e0bd68" opacity=".45"/>';
    fx+=fw+2;
  }
  var bands=[[27,112],[168,253]];
  for(var b=0;b<bands.length;b++){
    var x0=bands[b][0],x1=bands[b][1];
    if(r()<0.20){                                   /* open ground */
      s+='<rect x="'+x0+'" y="'+(HOR-7)+'" width="'+(x1-x0)+'" height="7" fill="#141b25"/>';
      for(var f=x0+2;f<x1-5;f+=10)
        s+='<rect x="'+f+'" y="'+(HOR-13)+'" width="7" height="6" fill="#1d2733"/>';
      if(r()<0.5){
        var cx=x0+10+r()*(x1-x0-24);
        s+='<rect x="'+cx.toFixed(1)+'" y="'+(HOR-30)+'" width="3" height="23" fill="#1a222d"/>';
        s+='<rect x="'+(cx-7).toFixed(1)+'" y="'+(HOR-32)+'" width="17" height="3" fill="#1a222d"/>';
      }
      continue;
    }
    var x=x0;
    while(x<x1-9){
      var w=10+Math.floor(r()*16); if(x+w>x1)w=x1-x;
      var h=13+Math.floor(r()*40),y=HOR-h;
      var shade=['#0d131c','#111925','#151e2a'][Math.floor(r()*3)];
      s+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+shade+'"/>';
      s+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="1.5" fill="#242f3d"/>';
      for(var wy=y+4;wy<HOR-4;wy+=6)
        for(var wx=x+3;wx<x+w-3;wx+=6)
          if(r()<0.40)
            s+='<rect x="'+wx+'" y="'+wy+'" width="2.5" height="3" fill="#f0c96a" opacity="'+(0.3+r()*0.5).toFixed(2)+'"/>';
      if(h>40&&r()<0.45)
        s+='<circle cx="'+(x+w/2)+'" cy="'+(y-3)+'" r="1.6" fill="#ff5a4a" opacity=".8"/>';
      x+=w+1+Math.floor(r()*3);
    }
  }
  return s;
}

/* Landmark signs: big, lit, unmissable. Left or right of the road so the
   pointing finger has something to point AT. */
function sign(side,txt){
  var x=(side==='left')?70:214, y=19;
  var w=txt.length*16+14, h=25;
  var s='';
  s+='<line x1="'+x+'" y1="'+(y+h)+'" x2="'+x+'" y2="94" stroke="#2e3642" stroke-width="2.5"/>';
  s+='<ellipse cx="'+x+'" cy="'+(y+h/2)+'" rx="'+(w/2+26)+'" ry="30" fill="#ff5033" opacity=".13"/>';
  s+='<ellipse cx="'+x+'" cy="'+(y+h/2)+'" rx="'+(w/2+12)+'" ry="20" fill="#ff5540" opacity=".18"/>';
  s+='<rect x="'+(x-w/2-4)+'" y="'+(y-4)+'" width="'+(w+8)+'" height="'+(h+8)+'" rx="4" fill="#ff6a4a" opacity=".30"/>';
  s+='<rect x="'+(x-w/2)+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="3" fill="#d42a1e" stroke="#ffb3a0" stroke-width="2"/>';
  s+='<text x="'+x+'" y="'+(y+18)+'" fill="#fff6ea" font-size="16" text-anchor="middle" font-weight="600">'+txt+'</text>';
  s+='<circle cx="'+(x-w/2+5)+'" cy="'+(y+h+7)+'" r="2" fill="#ffd9a0" opacity=".8"/>';
  s+='<circle cx="'+(x+w/2-5)+'" cy="'+(y+h+7)+'" r="2" fill="#ffd9a0" opacity=".8"/>';
  return s;
}

function scene(pt,lm,lmSide,asking,seed){
  seed=seed||curSeed();
  var s='<svg viewBox="0 0 280 170" style="width:100%;height:auto;background:#0a0c10;border:1px solid #262b34;border-radius:8px">';

  /* --- through the windscreen --- */
  s+='<rect x="26" y="16" width="228" height="88" rx="5" fill="#141b26"/>';
  s+=skyline(seed);
  s+='<rect x="26" y="72" width="228" height="32" fill="#2a2118"/>';
  s+='<path d="M112 104 L130 74 h20 l18 30 z" fill="#3d3226"/>';
  s+='<line x1="140" y1="104" x2="140" y2="86" stroke="#c9b27a" stroke-width="2.5" opacity=".55"/>';
  s+='<circle cx="42" cy="28" r="10" fill="#e8b830" opacity=".14"/>';

/* ---------- the drive between junctions ----------
   Every street in the network gets its own city, generated from a hash of
   the edge you took, so the same turn always looks the same and no two
   look alike. Four layers move at four speeds; the car stays put and the
   world slides past it. */
function hashSeed(str){
  var h=2166136261;
  for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=(h*16777619)>>>0;}
  return (h%1900000)+1;
}
function loop(content,dur){
  return '<g style="animation:scrollx '+dur+'s linear infinite">'+content+
         '<g transform="translate(280,0)">'+content+'</g></g>';
}
/* ---------- the pieces a Beijing street is made of ----------
   Each returns [svg, width]. Streets are assembled from these according to
   an archetype, so two streets differ in kind and not merely in the width
   of their boxes. `lt` is how late it is, 0..1 — the city shutters as the
   evening runs out, which is the same clock that decides whether you eat. */

function win_(r,x,y,w,h,lt,p){
  var s='';
  for(var wy=y;wy<y+h;wy+=7)
    for(var wx=x;wx<x+w;wx+=7){
      /* both draws happen whether or not the light is on, so a street keeps
         its exact shape as the evening goes and only goes dark */
      var op=(0.24+r()*0.5).toFixed(2), on=r()<(p||0.5)*(1-0.42*lt);
      if(on) s+='<rect x="'+wx.toFixed(1)+'" y="'+wy.toFixed(1)+'" width="3.2" height="4" fill="#dcb75e" opacity="'+op+'"/>';
    }
  return s;
}
/* a shophouse: lit frontage, signboard, shutters once it is late */
function elShop(r,x,b,lt){
  var w=20+Math.floor(r()*26),h=26+Math.floor(r()*40),s='';
  s+='<rect x="'+x+'" y="'+(b-h)+'" width="'+w+'" height="'+h+'" fill="#141c26"/>';
  s+='<rect x="'+x+'" y="'+(b-h)+'" width="'+w+'" height="1.4" fill="#26313f"/>';
  s+=win_(r,x+4,b-h+5,w-9,h-18,lt,0.5);
  /* every random is drawn before the branch: the same street must look
     like the same street later on, only darker */
  var openRoll=r(), lanternRoll=r(), signRoll=r(), signH=r(), signCol=r();
  var open=openRoll<0.66*(1-0.55*lt);
  if(open){
    s+='<rect x="'+(x+1.5)+'" y="'+(b-11)+'" width="'+(w-3)+'" height="11" fill="#1d1611"/>';
    s+='<rect x="'+(x+1.5)+'" y="'+(b-11)+'" width="'+(w-3)+'" height="11" fill="#e8a850" opacity=".18"/>';
    s+='<rect x="'+(x+1.5)+'" y="'+(b-11.6)+'" width="'+(w-3)+'" height="1.2" fill="#f0b968" opacity=".55"/>';
    if(lanternRoll<0.4)for(var q=0;q<2;q++)
      s+='<circle cx="'+(x+5+q*(w-10))+'" cy="'+(b-13)+'" r="2.4" fill="#d8402c" opacity=".85"/>';
  }else{
    s+='<rect x="'+(x+1.5)+'" y="'+(b-11)+'" width="'+(w-3)+'" height="11" fill="#10161d"/>';
    for(var sy=b-10;sy<b;sy+=2.2)
      s+='<rect x="'+(x+2)+'" y="'+sy.toFixed(1)+'" width="'+(w-4)+'" height="1.1" fill="#1a222b"/>';
  }
  if(signRoll<0.55){
    var sh=9+Math.floor(signH*15);
    s+='<rect x="'+(x+w-6.5)+'" y="'+(b-13-sh)+'" width="5" height="'+sh+'" rx="1" fill="'+(signCol<0.5?'#8c2c22':'#1f5a4a')+'" opacity="'+(0.55+0.35*(1-lt)).toFixed(2)+'"/>';

      var ph=13+r()*3;
      s+='<line x1="'+(x-1).toFixed(1)+'" y1="'+(base-6)+'" x2="'+(x-2).toFixed(1)+'" y2="'+base+'" stroke="#1a222c" stroke-width="1.8"/>';
      s+='<line x1="'+(x+1).toFixed(1)+'" y1="'+(base-6)+'" x2="'+(x+2).toFixed(1)+'" y2="'+base+'" stroke="#1a222c" stroke-width="1.8"/>';
      s+='<path d="M'+(x-3).toFixed(1)+' '+(base-ph)+' q3 -2 6 0 l1 '+(ph-6).toFixed(1)+' l-8 0 z" fill="#1f2833"/>';
      s+='<circle cx="'+x.toFixed(1)+'" cy="'+(base-ph-2.6)+'" r="2.8" fill="#28323d"/>';
      x+=18+r()*30;
    }
  }
  return s;
}

function street(from,dir){
  var seed=hashSeed(from+'>'+dir);
  var pick=rnd(seed+31337);
  var arch=ARCH[Math.floor(pick()*ARCH.length)];
  /* how late it is, 0..1 — the city shutters as your evening runs out */
  var lt=Math.max(0,Math.min(1,S.mins/(CLOSE_MIN-OPEN_MIN)));
  var haze=0.16+pick()*0.30;                  /* some nights you can see further */
  var wires=pick()<0.45, cross=pick()<0.3;

  var far=stripFar(rnd(seed),96,arch,lt);
  var mid=stripMid(rnd(seed+7919),108,arch,lt);
  var near=stripNear(rnd(seed+104729),116,arch,lt);
  var dash='';
  for(var i=0;i<10;i++) dash+='<rect x="'+(i*28)+'" y="131" width="16" height="2.6" rx="1" fill="#4a463a" opacity=".85"/>';

  var s='<svg viewBox="0 0 280 150" style="width:100%;height:auto;background:#0a0c10;border:1px solid #262b34;border-radius:8px">';
  s+='<defs>'+
     '<linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">'+
       '<stop offset="0" stop-color="#090d14"/><stop offset=".6" stop-color="#101823"/>'+
       '<stop offset="1" stop-color="#1e2b35"/></linearGradient>'+
     '<linearGradient id="haze2" x1="0" y1="0" x2="0" y2="1">'+
       '<stop offset="0" stop-color="#26323f" stop-opacity="0"/>'+
       '<stop offset="1" stop-color="#26323f" stop-opacity="'+haze.toFixed(2)+'"/></linearGradient>'+
     '<radialGradient id="lg2"><stop offset="0" stop-color="#ffcf8a" stop-opacity=".30"/>'+
       '<stop offset="1" stop-color="#ffcf8a" stop-opacity="0"/></radialGradient>'+
     '<linearGradient id="beam" x1="1" y1="0" x2="0" y2="0">'+
       '<stop offset="0" stop-color="#ffe0a0" stop-opacity=".26"/>'+
       '<stop offset="1" stop-color="#ffe0a0" stop-opacity="0"/></linearGradient>'+
     '</defs>';
  s+='<rect x="0" y="0" width="280" height="116" fill="url(#sky2)"/>';
  s+='<g opacity=".8">'+loop(far,15)+'</g>';
  s+='<rect x="0" y="48" width="280" height="60" fill="url(#haze2)"/>';   /* smog eats the far layer */
  s+=loop(mid,5.4);
  /* overhead cabling, the thing every photograph of this city has in it */
  if(wires){
    var wv='<path d="M-10 30 Q70 38 150 30 T310 30" fill="none" stroke="#0d131a" stroke-width="1"/>'+
           '<path d="M-10 35 Q70 45 150 35 T310 35" fill="none" stroke="#0d131a" stroke-width=".8"/>';
    s+='<g opacity=".85">'+loop(wv,5.4)+'</g>';
  }
  s+='<rect x="0" y="108" width="280" height="8" fill="#171e27"/>';
  s+='<rect x="0" y="108" width="280" height="1.4" fill="#28323e"/>';
  s+='<rect x="0" y="116" width="280" height="34" fill="#1b1a17"/>';
  s+='<rect x="0" y="116" width="280" height="2" fill="#2c2b25"/>';
  /* a cycle lane divider on the wider roads */
  if(arch==='arterial'||arch==='residential')
    s+=loop('<rect x="0" y="121" width="280" height="1" fill="#3a382f" opacity=".5"/>',5.4);
  s+=loop(near,2.5);
  /* road furniture that scrolls with the tarmac */
  var rf='';
  if(cross){ for(var c=0;c<6;c++) rf+='<rect x="'+(190+c*7)+'" y="118" width="4" height="30" fill="#4a463a" opacity=".5"/>'; }
  rf+='<circle cx="64" cy="140" r="4" fill="#141310" opacity=".8"/>';
  rf+='<circle cx="222" cy="127" r="3.2" fill="#141310" opacity=".7"/>';
  s+=loop(rf,0.95);
  s+=loop(dash,0.95);
  s+=taxi(91,96,1.2,{spin:true,bob:true,lights:true,driver:true,rider:true,fumes:true,bg:'#1b1a17'});
  s+='<rect x="0" y="146" width="280" height="4" fill="#141310" opacity=".8"/>';
  return s+'</svg>';
}
function driveScene(from,dir){
  var h='<div class="screen" style="gap:10px" onclick="skipDrive()">'+
    '<div class="hud"><span class="strikes">'+(S.strikes?'✕'.repeat(S.strikes):'')+
    '</span><span>'+clockStr()+' — '+dest()[3]+' 22:30</span></div>'+
    street(from,dir)+
    (function(){var pr=dirPair(dir);return L(pr[0],pr[1]);})()+
    '<div class="skipnote">tap to skip</div></div>';
  app.innerHTML=h;
  if(S.driveT)clearTimeout(S.driveT);
  S.driveT=setTimeout(function(){S.driveT=null;drive();},2600);
}
function skipDrive(){
  if(S.driveT){clearTimeout(S.driveT);S.driveT=null;drive();}
}

/* ---------- drive ---------- */
function drive(){
  var n=NODES[S.at];
  if(S.at==='goal')return win();
  if(S.at==='start'){S.at='j1';return drive();}
  var opts=[];
  for(var d in n.go)opts.push({dir:d,ok:true});
  for(var d2 in (n.dead||{}))opts.push({dir:d2,ok:false});
  opts.sort(function(){return Math.random()-.5});
  var asking=curAsk();
  if(asking)say('哪边');
  var h='<div class="screen" style="gap:10px"><div class="hud"><span class="strikes">'+
    (S.strikes?'✕'.repeat(S.strikes):'')+'</span><span>'+clockStr()+' — '+dest()[3]+' 22:30'+
    (minsLeft()<=12?' <b style="color:#e0765a">('+Math.max(0,Math.round(minsLeft()))+')</b>':'')+
    '</span></div>'+
    map()+scene(curPt(),n.lm,curSide(),asking,curSeed())+
    (asking
      ? L('哪边？','nǎbiān?')
      : '<div class="quiet">The car slows at the junction.<br>He is waiting for you to say something.</div>')+
    '<div class="cards">';
  S.cards={};
  if(n.lm)S.seen[n.lm]=(S.seen[n.lm]||0)+1;
  for(var i=0;i<opts.length;i++){
    var o=opts[i];
    /* If he asked, you agree or correct him. If he didn't, there is
       nothing to agree with — you just say the direction. */
    var txt=asking
      ? ((o.dir===curPt())?agreeZh():'不是')+'，'+dirZh(o.dir)
      : dirZh(o.dir);
    S.cards[o.dir]=txt;
    h+='<div class="card" onclick="answer(\''+o.dir+'\','+o.ok+',this)">'+txt+'</div>';
  }
  h+='</div><div class="tog" onclick="pinyinOn=!pinyinOn;drive()">pinyin: '+(pinyinOn?'on':'off')+'</div></div>';
  app.innerHTML=h;
}

function answer(dir,ok,el){
  if(S.busy)return;S.busy=true;
  var n=NODES[S.at];
  el.className='card '+(ok?'right':'wrong');
  say((S.cards&&S.cards[dir])||dirZh(dir),false,function(){
    S.busy=false;
    if(ok){S.mins+=blockTime();var f=S.at;S.at=n.go[dir];driveScene(f,dir);}
    else{
      S.strikes++;S.mins+=DEAD_MIN;
      if(S.strikes>=2)return over();
      deadEnd();
    }
  });
}

function deadEnd(){
  say('不对');
  app.innerHTML='<div class="screen" style="justify-content:center;gap:18px">'+
    '<div class="hud"><span class="strikes">✕</span><span>'+clockStr()+'</span></div>'+
    '<div class="big">不对</div>'+
    '<div class="mid">The street ends at a wall of blue hoarding.<br>He reverses out without a word.</div>'+
    '<div class="sub" style="text-align:center">One more and he gives up.</div>'+
    '<div class="btn" onclick="drive()">继续</div></div>';
}

function over(){
  say('游戏结束');
  app.innerHTML='<div class="screen" style="justify-content:center;gap:18px">'+
    '<div class="big">游戏结束</div>'+
    '<div class="mid">He stops asking. He takes a turn you did not choose,<br>pulls up at a dead end, and waits for you to get out.</div>'+
    '<div class="btn" onclick="title()">再来</div>'+review()+'</div>';
}

function review(){
  var V=[['哪边','nǎbiān','which way — what he asks you'],
         ['那边','nàbiān','that way — one tone apart from 哪边'],
         ['左转','zuǒ zhuǎn','left'],['左拐','zuǒ guǎi','left, colloquial'],
         ['右转','yòu zhuǎn','right'],['右拐','yòu guǎi','right, colloquial'],
         ['一直走','yìzhí zǒu','straight on'],
         ['对','duì','right / correct'],['是','shì','yes'],['不是','bú shì','no — never said alone']];
  var d=dest();
  V.push([d[0],d[1],d[2]+' — where you asked to go']);
  var h='<div style="border-top:1px solid #262b34;margin-top:6px;padding-top:12px">'+
        '<div class="you" style="text-align:center;margin-bottom:8px">tonight\'s words</div>';
  for(var i=0;i<V.length;i++){
    h+='<div onclick="say(\''+V[i][0]+'\')" style="display:flex;justify-content:space-between;'+
       'align-items:baseline;padding:5px 2px;cursor:pointer;border-bottom:1px solid #171b22">'+
       '<span style="font-size:19px">'+V[i][0]+'</span>'+
       '<span style="font-size:11px;color:#6b6559;text-align:right">'+V[i][1]+' · '+V[i][2]+'</span></div>';
  }
  var lm=[];
  for(var k in S.seen) lm.push(k+' ×'+S.seen[k]);
  if(lm.length) h+='<div class="pin" style="margin-top:10px">landmarks passed: '+lm.join('   ')+'</div>';
  return h+'</div>';
}

function win(){
  var late=isLate(),d=dest();
  say(late?'关门了':'到了');
  var mins=Math.max(1,Math.round(-minsLeft()));
  app.innerHTML='<div class="screen" style="justify-content:center;gap:18px">'+
    '<div class="big">'+(late?'关门了':'到了')+'</div>'+
    '<div class="sub" style="text-align:center">'+d[0]+' — '+d[2]+'</div>'+
    '<div class="mid">'+(late
      ? d[5]+'<br>You were '+mins+' minute'+(mins===1?'':'s')+' late.'
      : d[4])+'</div>'+
    '<div class="sub" style="text-align:center">'+clockStr()+' · '+S.strikes+' strike'+(S.strikes===1?'':'s')+'</div>'+
    '<div class="btn" onclick="title()">再来</div>'+review()+'</div>';
}

title();
</script>
</body>
</html>
