<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Behind the Bar — A Barista Terminology Shift</title>
<style>
/* ============================================================
   BEHIND THE BAR
   A single-file, self-contained café game.
   Everything is hand-drawn SVG + CSS. No images, no libraries.
   ============================================================ */

:root{
  --ink:#2b1a10;
  --ink-soft:#5c4433;
  --paper:#fdf6e8;
  --cream:#f3e3c8;
  --crema:#c98f4e;
  --crema-lt:#e8c48f;
  --brass:#d8a441;
  --wood:#7a4a29;
  --wood-dk:#4a2a16;
  --accent:#c2542f;
  --accent-dk:#963c1e;
  --good:#3f8f5c;
  --bad:#c0432f;
}

*{box-sizing:border-box;}
html,body{
  margin:0;padding:0;height:100%;
  background:#140a05;
  font-family:"Nunito","Segoe UI",Tahoma,Verdana,sans-serif;
  color:var(--ink);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
body{
  display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(ellipse at 50% 40%, #33200f 0%, #150b04 70%);
}

/* ---------- The game frame: fixed 1000x620 stage, letterboxed ---------- */
.stage{
  position:relative;
  width:min(100vw, calc(100vh * 1000 / 620));
  height:min(100vh, calc(100vw * 620 / 1000));
  container-type:size;
  overflow:hidden;
  border-radius:min(1.6vw,18px);
  box-shadow:0 30px 90px rgba(0,0,0,.7), 0 0 0 3px rgba(0,0,0,.5);
  background:#2a1a10;
  user-select:none;
  touch-action:manipulation;
}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;}

/* Overlay layer — coordinates map 1:1 with the SVG viewBox in % */
.overlay{
  position:absolute;inset:0;
  font-size:2.05cqw;
  pointer-events:none;
}
.overlay > *{pointer-events:auto;}

/* ---------------------------- HUD ---------------------------- */
.hud{
  position:absolute;top:0;left:0;right:0;
  display:flex;justify-content:space-between;align-items:flex-start;
  padding:1.4cqw 1.8cqw;
  z-index:6;
}
.plate{
  background:linear-gradient(180deg, rgba(31,18,10,.86), rgba(20,11,6,.88));
  border:0.16cqw solid rgba(216,164,65,.45);
  border-radius:0.9cqw;
  color:var(--cream);
  padding:0.7cqw 1.1cqw;
  backdrop-filter:blur(3px);
  box-shadow:0 0.5cqw 1.4cqw rgba(0,0,0,.4);
}
.shift-title{
  font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  font-size:.82em;color:var(--brass);
  display:flex;align-items:center;gap:.5em;
}
.shift-sub{font-size:.78em;opacity:.8;margin-top:.15em;letter-spacing:.02em;}
.hud-right{display:flex;align-items:center;gap:0.8cqw;}
.lives{display:flex;gap:0.45cqw;align-items:center;}
.life{
  width:2.5cqw;height:2.5cqw;
  transition:transform .45s cubic-bezier(.34,1.56,.64,1), opacity .45s, filter .45s;
}
.life.lost{opacity:.22;filter:grayscale(1) brightness(.6);transform:rotate(-38deg) translateY(.4cqw) scale(.85);}
.iconbtn{
  width:2.9cqw;height:2.9cqw;border:none;cursor:pointer;
  border-radius:50%;
  background:linear-gradient(180deg,#3a2415,#241408);
  border:0.15cqw solid rgba(216,164,65,.45);
  display:grid;place-items:center;color:var(--brass);
  padding:0;transition:transform .12s, background .2s;
}
.iconbtn:hover{background:linear-gradient(180deg,#4c3019,#2d1a0b);}
.iconbtn:active{transform:scale(.9);}
.iconbtn svg{width:55%;height:55%;}

/* Progress rail */
.rail{
  position:absolute;left:1.8cqw;right:1.8cqw;top:7.4cqw;height:0.55cqw;
  background:rgba(0,0,0,.42);border-radius:1cqw;overflow:hidden;z-index:5;
  box-shadow:inset 0 0 0 .1cqw rgba(216,164,65,.22);
}
.rail-fill{
  height:100%;width:0%;border-radius:1cqw;
  background:linear-gradient(90deg,var(--accent),var(--brass),var(--crema-lt));
  transition:width .5s cubic-bezier(.4,0,.2,1);
  box-shadow:0 0 1cqw rgba(216,164,65,.7);
}

/* ------------------------- Speech bubble ------------------------- */
.bubble{
  position:absolute;
  left:47%;bottom:57%;
  transform:translate(-50%, 0) scale(.4);
  transform-origin:50% 120%;
  width:42cqw;max-width:42cqw;
  background:linear-gradient(180deg,#fffdf6,#f6ead3);
  border:0.28cqw solid #2b1a10;
  border-radius:1.3cqw;
  padding:1.2cqw 1.5cqw 1.3cqw;
  text-align:center;
  box-shadow:0 1cqw 2.4cqw rgba(0,0,0,.45);
  opacity:0;
  transition:opacity .28s, transform .38s cubic-bezier(.34,1.56,.64,1);
  z-index:4;
}
.bubble.show{opacity:1;transform:translate(-50%,0) scale(1);}
.bubble:after,.bubble:before{
  content:"";position:absolute;bottom:-1.9cqw;left:46%;
  border-style:solid;
}
.bubble:before{
  border-width:2cqw 1.3cqw 0 1.3cqw;
  border-color:#2b1a10 transparent transparent transparent;
}
.bubble:after{
  bottom:-1.45cqw;
  border-width:1.6cqw 1cqw 0 1cqw;
  border-color:#f8eeda transparent transparent transparent;
  left:46.35%;
}
.cust-name{
  font-size:.78em;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  color:var(--accent-dk);margin-bottom:.35em;
}
.cust-line{font-size:.82em;color:var(--ink-soft);font-style:italic;margin-bottom:.5em;}
.definition{
  font-size:1.12em;font-weight:800;line-height:1.28;color:var(--ink);
}
.definition:before{content:"“";opacity:.5;}
.definition:after{content:"”";opacity:.5;}

/* ------------------------- Answer dock ------------------------- */
.dock{
  position:absolute;left:50%;bottom:2.4cqw;transform:translateX(-50%) translateY(300%);
  width:58cqw;
  display:flex;flex-direction:column;align-items:center;gap:0.7cqw;
  transition:transform .45s cubic-bezier(.34,1.4,.64,1), opacity .3s;
  opacity:0;z-index:7;
}
.dock.show{transform:translateX(-50%) translateY(0);opacity:1;}
.prompt{
  font-size:.82em;font-weight:800;letter-spacing:.18em;text-transform:uppercase;
  color:var(--crema-lt);text-shadow:0 .2cqw .5cqw rgba(0,0,0,.8);
}
.answer-row{display:flex;gap:0.7cqw;width:100%;}
#answerInput{
  flex:1;min-width:0;
  padding:1cqw 1.4cqw;
  font-size:max(1.05em,16px);font-family:inherit;font-weight:700;
  border-radius:0.9cqw;
  border:0.25cqw solid #2b1a10;
  background:linear-gradient(180deg,#fffdf5,#f3e6cd);
  color:var(--ink);outline:none;
  box-shadow:0 .6cqw 1.6cqw rgba(0,0,0,.45), inset 0 .2cqw .4cqw rgba(255,255,255,.7);
}
#answerInput::placeholder{color:#a9906f;font-weight:600;font-style:italic;}
#answerInput:focus{border-color:var(--accent);box-shadow:0 0 0 .35cqw rgba(194,84,47,.35), 0 .6cqw 1.6cqw rgba(0,0,0,.45);}
#answerInput:disabled{opacity:.75;}
.btn{
  cursor:pointer;border:none;font-family:inherit;
  border-radius:0.9cqw;
  padding:1cqw 1.8cqw;
  font-weight:900;font-size:1em;letter-spacing:.04em;
  color:#fff5e2;
  background:linear-gradient(180deg,#d4613a,#a03d1e);
  border-bottom:0.45cqw solid #6f2711;
  box-shadow:0 .6cqw 1.6cqw rgba(0,0,0,.45);
  transition:transform .1s, filter .2s;
  white-space:nowrap;
}
.btn:hover{filter:brightness(1.1);}
.btn:active{transform:translateY(.25cqw);border-bottom-width:.2cqw;}
.btn:disabled{filter:grayscale(.6) brightness(.8);cursor:not-allowed;}
.btn.ghost{
  background:linear-gradient(180deg,#4a3120,#2c1a0d);
  border-bottom-color:#170c05;color:var(--crema-lt);
}

/* ------------------------- Feedback toast ------------------------- */
.toast{
  position:absolute;left:47%;bottom:58%;transform:translateX(-50%) translateY(1.2cqw);
  padding:0.8cqw 1.6cqw;border-radius:0.8cqw;
  font-weight:900;font-size:1em;
  opacity:0;transition:opacity .25s, transform .35s cubic-bezier(.34,1.56,.64,1);
  z-index:8;text-align:center;pointer-events:none;
  border:0.2cqw solid rgba(0,0,0,.5);
  box-shadow:0 .8cqw 2cqw rgba(0,0,0,.5);
  max-width:70cqw;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.good{background:linear-gradient(180deg,#5fbf82,#2f7a4c);color:#f2fff6;}
.toast.bad{background:linear-gradient(180deg,#e0705a,#a5311d);color:#fff2ee;}
.toast small{display:block;font-weight:700;font-size:.78em;opacity:.92;margin-top:.15em;}

/* Streak chip */
.streak{
  position:absolute;left:1.8cqw;top:9.2cqw;
  font-size:.82em;font-weight:900;letter-spacing:.05em;
  color:#ffdca0;text-shadow:0 .2cqw .5cqw #000;
  opacity:0;transform:translateY(-.6cqw);transition:opacity .3s, transform .3s;
  z-index:5;
}
.streak.show{opacity:1;transform:translateY(0);}

/* ------------------------- Modals ------------------------- */
.modal{
  position:absolute;inset:0;z-index:20;
  display:grid;place-items:center;
  background:radial-gradient(ellipse at 50% 45%, rgba(30,16,8,.72), rgba(10,5,2,.94));
  backdrop-filter:blur(4px);
  opacity:0;pointer-events:none;transition:opacity .4s;
}
.modal.show{opacity:1;pointer-events:auto;}
.card{
  width:62cqw;max-width:62cqw;
  background:linear-gradient(180deg,#fdf6e8,#efdcbd);
  border:0.35cqw solid #2b1a10;
  border-radius:1.6cqw;
  padding:2.6cqw 3cqw;
  text-align:center;
  box-shadow:0 2cqw 5cqw rgba(0,0,0,.6);
  transform:scale(.88) translateY(1.5cqw);
  transition:transform .45s cubic-bezier(.34,1.5,.64,1);
  position:relative;overflow:hidden;
}
.modal.show .card{transform:scale(1) translateY(0);}
.card:before{
  content:"";position:absolute;inset:0.5cqw;border-radius:1.1cqw;
  border:0.14cqw dashed rgba(43,26,16,.28);pointer-events:none;
}
.card h2{
  margin:0 0 .3em;font-size:2.1em;font-weight:900;letter-spacing:-.01em;
  color:var(--ink);line-height:1.05;
}
.card .kicker{
  font-size:.8em;font-weight:900;letter-spacing:.24em;text-transform:uppercase;
  color:var(--accent-dk);margin-bottom:.5em;
}
.card p{margin:0 auto .8em;font-size:.95em;line-height:1.5;color:var(--ink-soft);max-width:44cqw;}
.card .hint{font-size:.8em;font-style:italic;color:#8a7157;}
.rules{
  display:flex;justify-content:center;gap:1.6cqw;margin:1.2cqw 0 1.6cqw;flex-wrap:wrap;
}
.rule{
  display:flex;flex-direction:column;align-items:center;gap:.35em;
  width:11cqw;font-size:.76em;font-weight:700;color:var(--ink-soft);line-height:1.25;
}
.rule svg{width:4.6cqw;height:4.6cqw;}
.stats{display:flex;justify-content:center;gap:1.2cqw;margin:1.2cqw 0;flex-wrap:wrap;}
.stat{
  background:linear-gradient(180deg,#fffaf0,#e8d5b4);
  border:0.2cqw solid #b8905c;border-radius:1cqw;
  padding:.8cqw 1.4cqw;min-width:9cqw;
}
.stat .n{font-size:1.5em;font-weight:900;color:var(--ink);line-height:1;}
.stat .l{font-size:.68em;text-transform:uppercase;letter-spacing:.12em;color:#8a7157;margin-top:.3em;font-weight:800;}
.missed{
  margin:0 auto 1.2cqw;max-height:12cqw;overflow-y:auto;
  text-align:left;font-size:.76em;line-height:1.5;
  background:rgba(43,26,16,.06);border-radius:.7cqw;padding:.8cqw 1.1cqw;
  max-width:46cqw;color:var(--ink-soft);
}
.missed b{color:var(--accent-dk);}
.card-actions{display:flex;gap:.9cqw;justify-content:center;flex-wrap:wrap;}

/* portrait nudge */
.rotate-note{
  position:fixed;inset:auto 0 1.5vh 0;text-align:center;color:#c9a877;
  font-size:3.2vw;display:none;z-index:60;pointer-events:none;
}
@media (max-aspect-ratio: 3/4){ .rotate-note{display:block;} }

/* ============================================================
   SVG scene animations
   ============================================================ */
.dust{animation:dustFloat linear infinite;}
@keyframes dustFloat{
  0%{transform:translate(0,0);opacity:0;}
  15%{opacity:.85;}
  85%{opacity:.5;}
  100%{transform:translate(26px,-120px);opacity:0;}
}
.steam{animation:steamRise ease-out infinite;transform-box:fill-box;transform-origin:50% 100%;}
@keyframes steamRise{
  0%{transform:translateY(0) scale(.5);opacity:0;}
  18%{opacity:.55;}
  100%{transform:translateY(-64px) scale(1.9);opacity:0;}
}
.lampglow{animation:flicker 5.5s ease-in-out infinite;}
@keyframes flicker{
  0%,100%{opacity:.5;}
  42%{opacity:.62;}
  47%{opacity:.44;}
  62%{opacity:.6;}
}
.plantleaf{transform-box:fill-box;transform-origin:50% 100%;animation:sway 6s ease-in-out infinite;}
@keyframes sway{0%,100%{transform:rotate(-2.5deg);}50%{transform:rotate(3deg);}}

/* -------- Character rig -------- */
.charSlot{transition:transform 1.05s cubic-bezier(.42,0,.3,1);}
.charSlot.fast{transition:transform .72s cubic-bezier(.5,0,.6,1);}
.charBody{transform-box:fill-box;transform-origin:50% 100%;}
.char.walking .charBody{animation:bodyBob .46s ease-in-out infinite;}
@keyframes bodyBob{
  0%,100%{transform:translateY(0) rotate(-.6deg);}
  50%{transform:translateY(-4px) rotate(.6deg);}
}
.char:not(.walking) .charBody{animation:breathe 3.4s ease-in-out infinite;}
@keyframes breathe{
  0%,100%{transform:translateY(0) scaleY(1);}
  50%{transform:translateY(-1.4px) scaleY(1.012);}
}
.legA,.legB,.armA,.armB{transform-box:fill-box;transform-origin:50% 6%;}
.char.walking .legA{animation:swingA .46s ease-in-out infinite;}
.char.walking .legB{animation:swingB .46s ease-in-out infinite;}
.char.walking .armA{animation:swingB .46s ease-in-out infinite;}
.char.walking .armB{animation:swingA .46s ease-in-out infinite;}
@keyframes swingA{0%,100%{transform:rotate(19deg);}50%{transform:rotate(-19deg);}}
@keyframes swingB{0%,100%{transform:rotate(-19deg);}50%{transform:rotate(19deg);}}
.char:not(.walking) .armA{animation:armIdleA 4s ease-in-out infinite;}
.char:not(.walking) .armB{animation:armIdleB 4.6s ease-in-out infinite;}
@keyframes armIdleA{0%,100%{transform:rotate(1.5deg);}50%{transform:rotate(-2.5deg);}}
@keyframes armIdleB{0%,100%{transform:rotate(-1.5deg);}50%{transform:rotate(2.5deg);}}

.headPivot{transform-box:fill-box;transform-origin:50% 92%;animation:headIdle 5.2s ease-in-out infinite;}
@keyframes headIdle{
  0%,100%{transform:rotate(-1.6deg);}
  50%{transform:rotate(2.2deg);}
}
.eyeL,.eyeR{transform-box:fill-box;transform-origin:50% 50%;animation:blink 5.4s infinite;}
.eyeR{animation-delay:.04s;}
@keyframes blink{
  0%,95.5%,100%{transform:scaleY(1);}
  96.8%,98.4%{transform:scaleY(.08);}
}
.char.mood-happy .eyeL,.char.mood-happy .eyeR{animation:none;}

/* expression switching */
.fx{display:none;}
.char.mood-neutral .fx-neutral,
.char.mood-happy   .fx-happy,
.char.mood-sad     .fx-sad,
.char.mood-rage    .fx-rage{display:inline;}

.char.mood-happy .charBody{animation:hop .62s cubic-bezier(.28,1.5,.5,1);}
@keyframes hop{
  0%{transform:translateY(0) scale(1,1);}
  22%{transform:translateY(0) scale(1.06,.93);}
  50%{transform:translateY(-16px) scale(.97,1.05);}
  78%{transform:translateY(0) scale(1.05,.95);}
  100%{transform:translateY(0) scale(1,1);}
}
.char.mood-sad .charBody{animation:slump .6s ease-out forwards;}
@keyframes slump{
  0%{transform:translateY(0) rotate(0);}
  100%{transform:translateY(6px) rotate(-1.6deg) scaleY(.975);}
}
.char.mood-rage .charBody{animation:rageShake .32s linear infinite;}
@keyframes rageShake{
  0%,100%{transform:translate(0,0) rotate(0);}
  20%{transform:translate(-4px,-2px) rotate(-1.6deg);}
  40%{transform:translate(4px,1px) rotate(1.6deg);}
  60%{transform:translate(-3px,2px) rotate(-1.2deg);}
  80%{transform:translate(3px,-1px) rotate(1.2deg);}
}
.rageTint{opacity:0;transition:opacity .35s;}
.char.mood-rage .rageTint{opacity:.55;}
.angerMark{transform-box:fill-box;transform-origin:50% 50%;animation:pulseMark .55s ease-in-out infinite;}
@keyframes pulseMark{0%,100%{transform:scale(1);}50%{transform:scale(1.28);}}
.rageSteam{animation:rageSteamRise .85s ease-out infinite;transform-box:fill-box;transform-origin:50% 100%;}
@keyframes rageSteamRise{
  0%{transform:translateY(0) scale(.4);opacity:0;}
  25%{opacity:.85;}
  100%{transform:translateY(-46px) scale(1.7);opacity:0;}
}

/* reward particles */
.spark{transform-box:fill-box;transform-origin:50% 50%;animation:sparkUp 1.1s ease-out forwards;}
@keyframes sparkUp{
  0%{transform:translateY(0) scale(.2) rotate(0);opacity:0;}
  18%{opacity:1;transform:translateY(-10px) scale(1.1) rotate(10deg);}
  100%{transform:translateY(-84px) scale(.7) rotate(-24deg);opacity:0;}
}
.servedCup{animation:slideCup 1.05s cubic-bezier(.3,.9,.4,1) forwards;}
@keyframes slideCup{
  0%{transform:translate(-190px,26px) scale(.85) rotate(-8deg);opacity:0;}
  22%{opacity:1;}
  100%{transform:translate(0,0) scale(1) rotate(0);opacity:1;}
}
.doorSwing{transform-box:fill-box;transform-origin:0% 50%;}
.doorSwing.open{animation:doorOpen 1.1s ease-in-out;}
@keyframes doorOpen{
  0%{transform:scaleX(1);}
  30%{transform:scaleX(.55);}
  100%{transform:scaleX(1);}
}
.bell{transform-box:fill-box;transform-origin:50% 0%;}
.bell.ring{animation:bellRing .9s ease-out;}
@keyframes bellRing{
  0%{transform:rotate(0);}
  15%{transform:rotate(24deg);}
  32%{transform:rotate(-19deg);}
  50%{transform:rotate(13deg);}
  68%{transform:rotate(-8deg);}
  85%{transform:rotate(4deg);}
  100%{transform:rotate(0);}
}
.machineFlash{opacity:0;}
.machineFlash.on{animation:mFlash .8s ease-out;}
@keyframes mFlash{0%{opacity:0;}30%{opacity:.9;}100%{opacity:0;}}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;}
  .charSlot{transition-duration:.2s !important;}
}
</style>
</head>
<body>

<div class="stage" id="stage">

<!-- ==================== THE CAFÉ ==================== -->
<svg id="scene" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
 <defs>
   <linearGradient id="wallG" x1="0" y1="0" x2="0" y2="1">
     <stop offset="0%" stop-color="#6d4a30"/>
     <stop offset="45%" stop-color="#8a5f3d"/>
     <stop offset="100%" stop-color="#5e3d26"/>
   </linearGradient>
   <linearGradient id="floorG" x1="0" y1="0" x2="0" y2="1">
     <stop offset="0%" stop-color="#4a2c18"/>
     <stop offset="100%" stop-color="#2d1a0e"/>
   </linearGradient>
   <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
     <stop offset="0%" stop-color="#bfe0ec"/>
     <stop offset="55%" stop-color="#e6dcc0"/>
     <stop offset="100%" stop-color="#f2d9a8"/>
   </linearGradient>
   <linearGradient id="counterTopG" x1="0" y1="0" x2="0" y2="1">
     <stop offset="0%" stop-color="#a9703f"/>
     <stop offset="30%" stop-color="#8a5730"/>
     <stop offset="100%" stop-color="#5f3a1e"/>
   </linearGradient>
   <linearGradient id="counterFrontG" x1="0" y1="0" x2="0" y2="1">
     <stop offset="0%" stop-color="#4e2f19"/>
     <stop offset="55%" stop-color="#3b2312"/>
     <stop offset="100%" stop-color="#22130a"/>
   </linearGradient>
   <linearGradient id="chromeG" x1="0" y1="0" x2="1" y2="0">
     <stop offset="0%" stop-color="#8e9298"/>
     <stop offset="16%" stop-color="#e9edf1"/>
     <stop offset="38%" stop-color="#b6bcc4"/>
     <stop offset="62%" stop-color="#eef2f6"/>
     <stop offset="85%" stop-color="#9aa0a8"/>
     <stop offset="100%" stop-color="#767b82"/>
   </linearGradient>
   <linearGradient id="brassG" x1="0" y1="0" x2="1" y2="1">
     <stop offset="0%" stop-color="#f0cd77"/>
     <stop offset="50%" stop-color="#c99a3c"/>
     <stop offset="100%" stop-color="#8f6a1f"/>
   </linearGradient>
   <radialGradient id="lampG" cx="50%" cy="20%" r="70%">
     <stop offset="0%" stop-color="#ffe6ae" stop-opacity=".95"/>
     <stop offset="55%" stop-color="#ffca77" stop-opacity=".35"/>

/* ============================================================
   2. AUDIO — tiny WebAudio synth, no assets
   ============================================================ */
const Sound = (() => {
  let ctx = null, on = true;
  function ac(){
    if(!ctx){ try{ ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
    if(ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function tone(freq, start, dur, type, vol, glideTo){
    const c = ac(); if(!c || !on) return;
    const t0 = c.currentTime + start;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t0);
    if(glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || .12, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0 + dur + .05);
  }
  function noise(start, dur, vol, freq){
    const c = ac(); if(!c || !on) return;
    const t0 = c.currentTime + start;
    const len = Math.floor(c.sampleRate * dur);
    const buf = c.createBuffer(1, len, c.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * (1 - i/len);
    const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter(); f.type="bandpass"; f.frequency.value = freq||900; f.Q.value=.8;
    const g = c.createGain(); g.gain.value = vol || .1;
    src.connect(f); f.connect(g); g.connect(c.destination);
    src.start(t0);
  }
  return {
    toggle(){ on = !on; if(on) ac(); return on; },
    isOn(){ return on; },
    prime(){ ac(); },
    bell(){ tone(1568,0,.5,"sine",.09); tone(2093,.06,.45,"sine",.06); tone(1319,.13,.5,"sine",.05); },
    correct(){ tone(523.25,0,.18,"triangle",.13); tone(659.25,.09,.18,"triangle",.12); tone(783.99,.18,.34,"triangle",.13); tone(1046.5,.26,.4,"sine",.07); },
    wrong(){ tone(196,0,.26,"sawtooth",.09,138); tone(146,.04,.3,"square",.05); noise(0,.16,.05,420); },
    rage(){ tone(110,0,.85,"sawtooth",.13,62); tone(82,.05,.9,"square",.09,52); noise(0,.6,.09,260); tone(240,.1,.5,"sawtooth",.05,90); },

    steam(){ noise(0,.55,.045,1500); },
    type(){ tone(880+Math.random()*180,0,.03,"square",.02); }
  };
})();

function shadeOf(hex){
  const n = parseInt(hex.slice(1),16);
  let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  r=Math.round(r*.82); g=Math.round(g*.8); b=Math.round(b*.79);
  return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

/* parallax */
(function parallax(){
  const far = $("parallaxFar"), lamps = $("lamps"), win = $("window");
  const stage = $("stage");
  stage.addEventListener("pointermove", e=>{
    const r = stage.getBoundingClientRect();
    const dx = ((e.clientX - r.left)/r.width - .5);
    const dy = ((e.clientY - r.top)/r.height - .5);
    far.style.transform   = `translate(${dx*-9}px, ${dy*-5}px)`;
    win.style.transform   = `translate(${dx*-13}px, ${dy*-7}px)`;
    lamps.style.transform = `translate(${dx*-18}px, 0px)`;
  });
})();

function spark(x, y, glyph, color){
  const t = document.createElementNS(SVGNS,"text");
  t.setAttribute("x", x); t.setAttribute("y", y);
  t.setAttribute("text-anchor","middle");
  t.setAttribute("font-size", 28 + Math.random()*22);
  t.setAttribute("fill", color);
  t.setAttribute("class","spark");
  t.style.animationDelay = (Math.random()*.28).toFixed(2)+"s";
  t.textContent = glyph;
  fxLayer.appendChild(t);
  setTimeout(()=>t.remove(), 1600);
}

function burst(kind){
  const cx = 470, cy = 330;
  if(kind === "good"){
    const glyphs = ["★","♥","✦","☕","✓","★","✦"];
    for(let i=0;i<14;i++)
      spark(cx + (Math.random()-.5)*230, cy + (Math.random()-.5)*90,
            glyphs[i%glyphs.length], ["#ffd873","#ff9a8a","#fff3d0","#c8f0d4","#ffe9a8"][i%5]);
  } else {
    for(let i=0;i<7;i++)
      spark(cx + (Math.random()-.5)*200, cy + (Math.random()-.5)*70, "✕", "#ff7a63");
  }
}

function ringBell(){

let deck = [], nameDeck = [], idx = 0, lives = MAX_LIVES;
let correct = 0, wrong = 0, streak = 0, bestStreak = 0;
let missed = [], locked = true, currentChar = null, currentTerm = null;

function normalize(s){ return String(s).toLowerCase().replace(/[^a-z0-9]/g,""); }
function acceptable(term){
  const set = new Set([normalize(term)]);
  if(term.includes("/")) term.split("/").forEach(p=>set.add(normalize(p)));
  // a couple of forgiving synonyms
  const extra = {
    "Under-extracted":["underextraction","under extracted","under"],
    "Over-extracted":["overextraction","over extracted","over"],
    "Pour-over":["pourover","pour over","filter"],
    "Single-origin":["singleorigin","single origin"],
    "Washed / natural":["washedandnatural","washednatural","processing","processingmethods"],
    "Dial in":["dialingin","dialledin","dialedin"],
    "Group head":["grouphead","group"],
    "Shot time":["shottime","extractiontime"],
    "Brew ratio":["brewratio","ratio"],
    "Grind size":["grindsize","grind"],
    "Batch brew":["batchbrew","batch"],
    "Puck prep":["puckprep","prep"],
    "Flat white":["flatwhite"],
    "Steam wand":["steamwand","wand"]
  };
  (extra[term]||[]).forEach(v=>set.add(normalize(v)));
  return set;
}

function shuffle(a){
  const x = a.slice();
  for(let i=x.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [x[i],x[j]]=[x[j],x[i]]; }
  return x;
}

function renderLives(){
  livesEl.innerHTML = "";
  for(let i=0;i<MAX_LIVES;i++){
    const s = document.createElementNS(SVGNS,"svg");
    s.setAttribute("viewBox","0 0 24 24");
    s.setAttribute("class","life"+(i>=lives?" lost":""));
    s.innerHTML = `<path d="M4 4h13v3h2a3 3 0 0 1 0 6h-2v1a6 6 0 0 1-6 6H10a6 6 0 0 1-6-6V4zm13 5v2h2a1 1 0 0 0 0-2h-2z" fill="#e8c48f"/><path d="M2 21h19v2H2z" fill="#c2542f"/>`;
    livesEl.appendChild(s);
  }
}

function setToast(html, kind){
  toast.className = "toast show " + kind;
  toast.innerHTML = html;
}
function hideToast(){ toast.className = "toast"; }

function setStreak(){
  if(streak >= 3){ streakEl.textContent = "🔥 " + streak + " in a row"; streakEl.classList.add("show"); }
  else streakEl.classList.remove("show");
}

/* ---- customer choreography ---- */
const FAR  = {x: 884, y: 412, s: 0.60};
const NEAR = {x: 468, y: 598, s: 1.26};
const EXIT = {x: -220, y: 604, s: 1.30};

function placeSlot(slot, p, fast){
  slot.classList.toggle("fast", !!fast);
  slot.style.transform = `translate(${p.x}px, ${p.y}px) scale(${p.s})`;
}

function spawnCustomer(){
  charLayer.innerHTML = "";
  const slot = document.createElementNS(SVGNS,"g");
  slot.setAttribute("class","charSlot");
  slot.innerHTML = buildCharacter();
  charLayer.appendChild(slot);
  const char = slot.querySelector(".char");
  placeSlot(slot, FAR);
  char.classList.add("walking");
  ringBell();
  // walk to the bar on the next frame so the transition applies
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    placeSlot(slot, NEAR);
  }));
  setTimeout(()=>char.classList.remove("walking"), 1080);
  return {slot, char};
}

function setMood(m){
  if(!currentChar) return;
  currentChar.char.classList.remove("mood-neutral","mood-happy","mood-sad","mood-rage");
  currentChar.char.classList.add("mood-"+m);
}

function walkOff(){
  if(!currentChar) return;
  const {slot, char} = currentChar;
  char.classList.add("walking");
  placeSlot(slot, EXIT, true);
}

function begin(){
  deck = shuffle(TERMS.map((_,i)=>i));
  nameDeck = shuffle(NAMES);
  idx = 0; lives = MAX_LIVES; correct = 0; wrong = 0;
  streak = 0; bestStreak = 0; missed = [];
  renderLives();
  railFill.style.width = "0%";
  hideModal();
  setTimeout(nextCustomer, 380);
}

function nextCustomer(){
  if(idx >= deck.length){ endShift(true); return; }
  locked = true;
  hideToast();
  const [term, def] = TERMS[deck[idx]];
  currentTerm = term;

  $("shiftSub").textContent = `Order ${idx+1} of ${deck.length}`;
  railFill.style.width = ((idx/deck.length)*100).toFixed(1)+"%";

  currentChar = spawnCustomer();
  setMood("neutral");

  $("custName").textContent = nameDeck[idx % nameDeck.length];
  $("custLine").textContent = LINES[Math.floor(Math.random()*LINES.length)];
  $("definition").textContent = def;

  setTimeout(()=>{
    bubble.classList.add("show");
    dock.classList.add("show");
    answerInput.value = "";
    answerInput.disabled = false;
    serveBtn.disabled = false;
    locked = false;
    if(window.matchMedia("(pointer:fine)").matches) answerInput.focus();
  }, 900);
}

function judge(raw){
  if(locked) return;
  locked = true;
  answerInput.disabled = true;
  serveBtn.disabled = true;
  bubble.classList.remove("show");

  const ok = normalize(raw).length > 0 && acceptable(currentTerm).has(normalize(raw));

  if(ok){
    correct++; streak++; bestStreak = Math.max(bestStreak, streak);
    setMood("happy");
    setToast(`Perfect — <b>${currentTerm}</b>.<small>Order up. They're delighted.</small>`, "good");
    Sound.correct();
    burst("good");
    pullShot();
    serveCupAnim();
    setStreak();
    setTimeout(()=>{ walkOff(); }, 1250);
    setTimeout(()=>{ hideToast(); idx++; nextCustomer(); }, 2000);
  } else {
    wrong++; streak = 0; lives--; setStreak();
    missed.push([currentTerm, TERMS[deck[idx]][1]]);
    renderLives();
    if(lives <= 0){
      setMood("rage");
      setToast(`It was <b>${currentTerm}</b>.<small>That was the last straw.</small>`, "bad");
      Sound.rage();
      burst("bad");
      setTimeout(()=>{ endShift(false); }, 2600);
    } else {
      setMood("sad");
      setToast(`Not quite — it was <b>${currentTerm}</b>.<small>${lives} cup${lives===1?"":"s"} left.</small>`, "bad");
      Sound.wrong();
      setTimeout(()=>{ walkOff(); }, 1450);
      setTimeout(()=>{ hideToast(); idx++; nextCustomer(); }, 2200);
    }
  }
}

function missedList(){
  if(!missed.length) return "";
  return `<div class="missed">${missed.map(m=>`<div><b>${m[0]}</b> — ${m[1]}</div>`).join("")}</div>`;
}

function endShift(survived){
  bubble.classList.remove("show");
  dock.classList.remove("show");
  hideToast();
  railFill.style.width = survived ? "100%" : railFill.style.width;

  if(survived){
    const pct = Math.round((correct/TERMS.length)*100);
    let kicker, title, blurb;
    if(pct === 100){ kicker="Flawless service"; title="Perfect Shift"; blurb="Forty customers, forty smiles. You could run this bar in your sleep."; }
    else if(pct >= 85){ kicker="Closing time"; title="Excellent Shift"; blurb="The regulars are asking for you by name. A couple of terms to tighten up and you're untouchable."; }
    else if(pct >= 65){ kicker="Closing time"; title="Solid Shift"; blurb="You held the bar together. Review the ones that got away and run it back."; }
    else { kicker="Closing time"; title="Shift Survived"; blurb="Rough morning, but nobody walked out. The list below is your homework."; }
    Sound.win();
    showModal(`
      <div class="kicker">${kicker}</div>
      <h2>${title}</h2>
      <p>${blurb}</p>
      <div class="stats">
        <div class="stat"><div class="n">${correct}/${TERMS.length}</div><div class="l">Served right</div></div>
        <div class="stat"><div class="n">${pct}%</div><div class="l">Accuracy</div></div>
        <div class="stat"><div class="n">${bestStreak}</div><div class="l">Best streak</div></div>
        <div class="stat"><div class="n">${lives}</div><div class="l">Cups left</div></div>
      </div>
      ${missedList()}
      <div class="card-actions">
        <button class="btn" id="againBtn">Run another shift</button>
      </div>
    `);
    $("againBtn").addEventListener("click", startScreen);
  } else {
    showModal(`
      <div class="kicker">Shift ended early</div>
      <h2>They stormed out</h2>
      <p>Three orders came back wrong and the last customer lost it completely. You served <b>${correct}</b> ${correct===1?"person":"people"} correctly before the bar went sideways.</p>
      <div class="stats">
        <div class="stat"><div class="n">${correct}</div><div class="l">Served right</div></div>
        <div class="stat"><div class="n">${idx+1}</div><div class="l">Orders taken</div></div>
        <div class="stat"><div class="n">${bestStreak}</div><div class="l">Best streak</div></div>
      </div>
      ${missedList()}
      <div class="card-actions">
        <button class="btn" id="retryBtn">Clock back in</button>
      </div>
    `);
    $("retryBtn").addEventListener("click", startScreen);
  }
}

answerForm.addEventListener("submit", e=>{
  e.preventDefault();
  judge(answerInput.value);
});
answerInput.addEventListener("keydown", e=>{
  if(e.key.length === 1) Sound.type();
});

$("soundBtn").addEventListener("click", ()=>{
  const on = Sound.toggle();
  $("soundIcon").innerHTML = on
    ? `<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 2.2v2.1a7.8 7.8 0 0 1 0 15.4v2.1A9.9 9.9 0 0 0 14 2.2z"/>`
    : `<path d="M3 9v6h4l5 5V4L7 9H3zm18.6 1.8-1.4-1.4L17.8 12l-2.4-2.6-1.4 1.4L16.4 13.4 14 15.8l1.4 1.4 2.4-2.4 2.4 2.4 1.4-1.4-2.4-2.4 2.4-2.6z"/>`;
  if(on) Sound.bell();
});

document.addEventListener("keydown", e=>{
  if(e.key === "Enter" && modal.classList.contains("show")){
    const b = card.querySelector(".btn");
    if(b) b.click();
  }
});

/* boot */
renderLives();
startScreen();
</script>
