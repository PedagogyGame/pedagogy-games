<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Behind the Bar — Barista Terms Shift</title>
<style>
  :root{
    --cream:#f4ead9;
    --paper:#fffaf0;
    --espresso:#3b2418;
    --espresso-dark:#241109;
    --crema:#c9985a;
    --crema-light:#e8c48f;
    --accent:#b5502f;
    --accent-dark:#8c3a1f;
    --good:#4c8c5b;
    --bad:#c0432f;
    --rage:#7a1f1f;
    --shadow: 0 10px 30px rgba(36,17,9,0.35);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: radial-gradient(circle at 20% 10%, #5b3a26, #2a160c 70%);
    color: var(--espresso);
    overflow-x:hidden;
  }
  .stage{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .cafe{
    width:100%;
    max-width:640px;
    background: var(--paper);
    border-radius:22px;
    box-shadow: var(--shadow);
    border: 6px solid var(--espresso-dark);
    position:relative;
    overflow:hidden;
  }
  .header{
    background: linear-gradient(135deg, var(--espresso) 0%, var(--espresso-dark) 100%);
    color: var(--cream);
    padding:16px 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .header h1{
    margin:0;
    font-size:1.15rem;
    letter-spacing:0.5px;
  }
  .header .sub{
    font-size:0.75rem;
    opacity:0.75;
    margin-top:2px;
  }
  .lives{
    display:flex;
    gap:6px;
    font-size:1.4rem;
  }
  .life{
    transition: transform 0.3s, opacity 0.3s, filter 0.3s;
  }
  .life.lost{
    opacity:0.25;
    filter: grayscale(1);
    transform: scale(0.8) rotate(-15deg);
  }
  .progress-wrap{
    background: var(--crema-light);
    height:8px;
    width:100%;
  }
  .progress-bar{
    background: linear-gradient(90deg, var(--accent), var(--crema));
    height:100%;
    width:0%;
    transition: width 0.4s ease;
  }
  .scene{
    padding:26px 24px 20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    min-height:420px;
  }
  .counter-scene{
    width:100%;
    background: linear-gradient(180deg, #efe0c4 0%, #e2cba4 100%);
    border-radius:16px;
    padding:20px 18px;
    border: 2px solid #c9a877;
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
  }
  .customer{
    font-size:4.2rem;
    line-height:1;
    transition: transform 0.25s ease;
    filter: drop-shadow(0 6px 8px rgba(0,0,0,0.2));
  }
  .customer.bump{ animation: bump 0.4s ease; }
  @keyframes bump{
    0%{transform:scale(1);}
    30%{transform:scale(1.15) rotate(-3deg);}
    60%{transform:scale(0.95) rotate(2deg);}
    100%{transform:scale(1);}
  }
  .customer.rage{ animation: shake 0.5s ease; }
  @keyframes shake{
    0%,100%{transform:translateX(0) rotate(0);}
    20%{transform:translateX(-8px) rotate(-4deg);}
    40%{transform:translateX(8px) rotate(4deg);}
    60%{transform:translateX(-6px) rotate(-3deg);}
    80%{transform:translateX(6px) rotate(3deg);}
  }
  .bubble{
    position:relative;
    background:#fff;
    border-radius:14px;
    padding:14px 16px;
    max-width:420px;
    text-align:center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    border: 2px solid var(--espresso);
    font-size:1.02rem;
    min-height:44px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .bubble:after{
    content:"";
    position:absolute;
    top:-14px;
    left:50%;
    transform:translateX(-50%);
    border-width:0 10px 14px 10px;
    border-style:solid;
    border-color:transparent transparent #fff transparent;
  }
  .bubble.outline:after{
    border-color: transparent transparent var(--espresso) transparent;
  }
  .prompt-label{
    font-size:0.78rem;
    text-transform:uppercase;
    letter-spacing:1.2px;
    color:var(--accent-dark);
    font-weight:700;
    margin-top:4px;
  }
  form{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
  }
  .answer-row{
    display:flex;
    gap:8px;
    width:100%;
    max-width:420px;
  }
  input[type=text]{
    flex:1;
    padding:12px 14px;
    border-radius:10px;
    border:2px solid var(--espresso);
    font-size:1rem;
    outline:none;
    background:#fffef9;
    color:var(--espresso);
  }
  input[type=text]:focus{
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(181,80,47,0.2);
  }
  button{
    cursor:pointer;
    border:none;
    border-radius:10px;
    padding:12px 18px;
    font-weight:700;
    font-size:0.95rem;
    background: var(--accent);
    color:#fff;
    transition: background 0.2s, transform 0.1s;
  }
  button:hover{ background: var(--accent-dark); }
  button:active{ transform: scale(0.97); }
  button:disabled{ opacity:0.5; cursor:not-allowed; }
  .feedback{
    min-height:26px;
    font-weight:700;
    font-size:0.95rem;
    text-align:center;
  }
  .feedback.good{ color: var(--good); }
  .feedback.bad{ color: var(--bad); }
  .footer-stats{
    display:flex;
    justify-content:space-between;
    width:100%;
    max-width:420px;
    font-size:0.8rem;
    color:#6b543f;
  }
  .end-screen{
    text-align:center;
    padding:30px 20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
  }
  .end-emoji{ font-size:4.5rem; }
  .end-title{ font-size:1.4rem; font-weight:800; margin:0; }
  .end-sub{ font-size:0.95rem; color:#5a4632; max-width:380px; }
  .stat-grid{
    display:flex;
    gap:18px;
    margin:6px 0 4px;
  }
  .stat{
    background: var(--cream);
    border-radius:12px;
    padding:10px 16px;
    min-width:80px;
    border: 2px solid var(--crema);
  }
  .stat .num{ font-size:1.3rem; font-weight:800; color:var(--espresso); }
  .stat .lbl{ font-size:0.68rem; text-transform:uppercase; letter-spacing:0.6px; color:#7a6349; }
  .start-screen{
    text-align:center;
    padding:32px 22px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
  }
  .start-screen h2{ margin:0; font-size:1.3rem; }
  .start-screen p{ margin:0; font-size:0.92rem; color:#5a4632; max-width:400px; line-height:1.5; }
  .hint{
    font-size:0.75rem;
    color:#8a7157;
    font-style:italic;
  }
  .steam{
    position:absolute;
    font-size:1.1rem;
    opacity:0;
  }
  .reveal{
    font-size:0.85rem;
    color:#5a4632;
    background:#f6ecd8;
    border-radius:8px;
    padding:6px 10px;
    border:1px dashed var(--crema);
  }
</style>
</head>
<body>
<div class="stage">
  <div class="cafe">
    <div class="header">
      <div>
        <h1>☕ Behind the Bar</h1>
        <div class="sub" id="headerSub">Barista Terms Shift — 40 orders</div>
      </div>
      <div class="lives" id="lives"></div>
    </div>
    <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>

    <div id="root"></div>
  </div>
</div>

<script>
const TERMS = [
  ["Dial in", "Adjust espresso until extraction tastes right"],
  ["Dose", "Dry coffee used for a shot"],
  ["Yield", "Liquid espresso produced"],
  ["Brew ratio", "Dose-to-beverage relationship"],
  ["Shot time", "Duration of espresso extraction"],
  ["Grind size", "Fineness/coarseness of ground coffee"],
  ["Extraction", "Dissolving flavor compounds from coffee"],
  ["Under-extracted", "Insufficient extraction; often sharp/sour"],
  ["Over-extracted", "Excessive extraction; often bitter/drying"],
  ["Channeling", "Water finding uneven paths through espresso"],
  ["Puck", "Compressed coffee bed in the basket"],
  ["Puck prep", "Preparing grounds before extraction"],
  ["Distribution", "Evenly spreading grounds in basket"],
  ["Tamp", "Compressing espresso grounds"],
  ["Portafilter", "Handled espresso basket holder"],
  ["Basket", "Perforated insert holding espresso grounds"],
  ["Group head", "Machine component delivering brewing water"],
  ["Purge", "Briefly run water or steam to clear equipment"],
  ["Flush", "Run water through the group head"],
  ["Backflush", "Clean espresso machine internally"],
  ["Steam wand", "Tube used to texture milk"],
  ["Microfoam", "Extremely fine-textured steamed milk foam"],
  ["Stretching", "Introducing air into steaming milk"],
  ["Rolling", "Circulating milk while steaming"],
  ["Texture", "Milk's finished foam consistency"],
  ["Crema", "Foam layer on fresh espresso"],
  ["Ristretto", "Shorter espresso extraction"],
  ["Lungo", "Longer espresso extraction"],
  ["Americano", "Espresso diluted with hot water"],
  ["Cortado", "Espresso with a small amount of steamed milk"],
  ["Flat white", "Espresso drink with thin microfoam"],
  ["Macchiato", "Espresso marked with a little milk"],
  ["Dry", "Drink made with more foam"],
  ["Wet", "Drink made with more steamed milk"],
  ["Batch brew", "Coffee brewed in larger automatic batches"],
  ["Pour-over", "Manually brewed filter coffee"],
  ["Bloom", "Initial wetting and degassing of coffee"],
  ["Single-origin", "Coffee originating from one defined source"],
  ["Blend", "Coffee combining multiple origins/lots"],
  ["Washed / natural", "Major coffee-processing methods"]
];

const MAX_LIVES = 3;

// Customer order lines keyed loosely to flavor the scene — picked per question index.
const CUSTOMER_LINES = [
  "walks up, tapping the counter.",
  "leans in, squinting at the menu board.",
  "sets a laptop down and orders without looking up.",
  "is in a hurry, glancing at their watch.",
  "smiles and asks a curious question.",
  "looks confused about a receipt.",
  "points at the espresso machine.",
  "is a regular, already knows the drill.",
  "just walked in from the rain.",
  "is training to be a barista themself."
];

function normalize(s){
  return s.toLowerCase().replace(/[^a-z0-9]/g, "");
}

function acceptableAnswers(term){
  const variants = new Set();
  variants.add(normalize(term));
  if(term.includes("/")){
    term.split("/").forEach(part => variants.add(normalize(part)));
  }
  if(term.includes(" ")){
    variants.add(normalize(term.replace(/\s+/g, "")));
  }
  return variants;
}

let order = [];
let idx = 0;
let lives = MAX_LIVES;
let correctCount = 0;
let wrongCount = 0;
let answered = false;

const root = document.getElementById("root");
const livesEl = document.getElementById("lives");
const progressBar = document.getElementById("progressBar");
const headerSub = document.getElementById("headerSub");

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function renderLives(){
  livesEl.innerHTML = "";
  for(let i = 0; i < MAX_LIVES; i++){
    const span = document.createElement("span");
    span.className = "life" + (i >= lives ? " lost" : "");
    span.textContent = "☕";
    livesEl.appendChild(span);
  }
}

function renderStart(){
  headerSub.textContent = "Barista Terms Shift — 40 orders";
  root.innerHTML = `
    <div class="start-screen">
      <div class="customer" style="font-size:3.6rem;">🧑‍🍳☕</div>
      <h2>Your shift is starting</h2>
      <p>A customer describes what they need in plain terms. You read the definition and type the correct barista term to serve them right. Get it wrong three times and the last customer will <strong>not</strong> be happy.</p>
      <p class="hint">Answers are checked loosely — capitalization, spacing, and hyphens don't matter.</p>
      <button id="startBtn">Open the shop ☕</button>
    </div>
  `;
  document.getElementById("startBtn").addEventListener("click", startGame);
}

function startGame(){
  order = shuffle(TERMS.map((t, i) => i));
  idx = 0;
  lives = MAX_LIVES;
  correctCount = 0;
  wrongCount = 0;
  renderLives();
  progressBar.style.width = "0%";
  nextQuestion();
}

function nextQuestion(){
  answered = false;
  if(idx >= order.length){
    renderWin();
    return;
  }
  const [term, definition] = TERMS[order[idx]];
  headerSub.textContent = `Order ${idx + 1} of ${order.length}`;
  progressBar.style.width = `${(idx / order.length) * 100}%`;

  const line = CUSTOMER_LINES[idx % CUSTOMER_LINES.length];

  root.innerHTML = `
    <div class="scene">
      <div class="counter-scene">
        <div class="customer" id="customerFace">🙂</div>
        <div class="bubble outline">A customer ${line}<br><strong style="display:block;margin-top:6px;">"${definition}."</strong></div>
        <div class="prompt-label">What's the term?</div>
        <form id="answerForm" autocomplete="off">
          <div class="answer-row">
            <input type="text" id="answerInput" placeholder="Type the barista term..." autofocus />
            <button type="submit">Serve it</button>
          </div>
        </form>
        <div class="feedback" id="feedback"></div>
        <div class="footer-stats">
          <span>✅ ${correctCount} correct</span>
          <span>❌ ${wrongCount} missed</span>
        </div>
      </div>
    </div>
  `;

  const form = document.getElementById("answerForm");
  const input = document.getElementById("answerInput");
  input.focus();

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    if(answered) return;
    submitAnswer(term, definition, input.value);
  });
}

function submitAnswer(term, definition, raw){
  answered = true;
  const face = document.getElementById("customerFace");
  const feedback = document.getElementById("feedback");
  const input = document.getElementById("answerInput");
  const btn = document.querySelector("#answerForm button");
  input.disabled = true;
  btn.disabled = true;

  const accepted = acceptableAnswers(term);
  const given = normalize(raw);
  const isCorrect = given.length > 0 && accepted.has(given);

  if(isCorrect){
    correctCount++;
    face.textContent = "😄";
    face.classList.add("bump");
    feedback.textContent = `Nailed it — "${term}." The customer's happy!`;
    feedback.className = "feedback good";
  } else {
    wrongCount++;
    lives--;
    renderLives();
    const isFinalStrike = lives <= 0;
    if(isFinalStrike){
      face.textContent = "🤬";
      face.classList.add("rage");
      feedback.innerHTML = `Not quite — it was "${term}." That was the last straw!`;
    } else {
      face.textContent = "☹️";
      face.classList.add("bump");
      feedback.innerHTML = `Not quite — it was "<strong>${term}</strong>."`;
    }
    feedback.className = "feedback bad";
  }

  setTimeout(() => {
    if(lives <= 0){
      renderLose();
    } else {
      idx++;
      nextQuestion();
    }
  }, isCorrect ? 1000 : 1700);
}

function renderWin(){
  progressBar.style.width = "100%";
  headerSub.textContent = "Shift complete";
  const pct = Math.round((correctCount / TERMS.length) * 100);
  let title, sub, emoji;
  if(pct === 100){
    emoji = "🏆"; title = "Perfect Shift!";
    sub = "Every single customer walked out smiling. You know this bar cold.";
  } else if(pct >= 80){
    emoji = "😄"; title = "Great Shift!";
    sub = "Most customers left happy. A little more practice and you'll be flawless.";
  } else {
    emoji = "🙂"; title = "Shift Complete";
    sub = "You made it through the whole shift. Review the misses and run it back.";
  }
  root.innerHTML = `
    <div class="end-screen">
      <div class="end-emoji">${emoji}</div>
      <h2 class="end-title">${title}</h2>
      <p class="end-sub">${sub}</p>
      <div class="stat-grid">
        <div class="stat"><div class="num">${correctCount}/${TERMS.length}</div><div class="lbl">Correct</div></div>
        <div class="stat"><div class="num">${pct}%</div><div class="lbl">Accuracy</div></div>
      </div>
      <button id="againBtn">Run another shift</button>
    </div>
  `;
  document.getElementById("againBtn").addEventListener("click", () => {
    renderLives();
    renderStart();
  });
}

function renderLose(){
  headerSub.textContent = "Shift ended early";
  root.innerHTML = `
    <div class="end-screen">
      <div class="end-emoji">🤬</div>
      <h2 class="end-title">The customer stormed out!</h2>
      <p class="end-sub">Three orders came back wrong and this last one lost it. You served ${correctCount} customer${correctCount === 1 ? "" : "s"} correctly before the shift went sideways.</p>
      <div class="stat-grid">
        <div class="stat"><div class="num">${correctCount}</div><div class="lbl">Correct</div></div>
        <div class="stat"><div class="num">${idx + 1}</div><div class="lbl">Orders taken</div></div>
      </div>
      <button id="retryBtn">Clock back in</button>
    </div>
  `;
  document.getElementById("retryBtn").addEventListener("click", () => {
    renderLives();
    renderStart();
  });
}

renderLives();
renderStart();
</script>
</body>
</html>
