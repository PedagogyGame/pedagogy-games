<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Chinese Word Study · 401–500</title>
<style>
:root{--ink:#141c18;--muted:#5c6e64;--paper:#eef3ec;--panel:#f4f8f3;--line:#c5d4c8;--deep:#0e1613;--good:#1f5a52;--bad:#8a3228;--gold:#c6a35a;--jade:#1f5a52;--cinnabar:#b03a32}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(1100px 640px at 12% -8%,rgba(176,58,50,.26),transparent 54%),linear-gradient(180deg,#0e1613 0%,#d5e0d6 46%,#141c18 100%);color:var(--ink);font-family:Georgia,"Times New Roman","Noto Serif SC","Songti SC",serif;overflow:hidden}
.app{height:100vh;display:grid;grid-template-rows:auto 1fr;gap:0}
.topbar{min-height:58px;display:flex;align-items:center;gap:14px;padding:8px 18px;background:linear-gradient(90deg,#0e1613,#1f5a52 42%,#b03a32 78%,#0e1613);color:#eef3ec;border-bottom:3px solid #c6a35a;box-shadow:0 1px 0 #3a1814}
.brand{font-size:18px;font-weight:700;letter-spacing:.06em;white-space:nowrap}.brand small{font-size:12px;font-weight:400;opacity:.72;margin-left:8px}
.progress{flex:1;max-width:460px;height:7px;background:rgba(255,255,255,.14);border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:linear-gradient(90deg,#c6a35a,#b03a32);width:1%;transition:width .25s ease}
.stat{font-size:13px;opacity:.9;white-space:nowrap}.topbtn{border:1px solid rgba(198,163,90,.55);background:transparent;color:#eef3ec;border-radius:4px;padding:7px 10px;cursor:pointer}
.main{min-height:0;display:grid;grid-template-columns:minmax(400px,46%) 1fr;gap:18px;padding:18px}
.quiz{min-height:0;background:rgba(244,248,243,.98);border:3px solid #1f5a52;box-shadow:inset 0 0 0 7px #e7efe8,inset 0 0 0 8px #c6a35a,0 18px 50px rgba(14,22,19,.32);border-radius:2px;padding:20px 24px 16px;display:flex;flex-direction:column;overflow:auto}
.rankline{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.12em}
.character{text-align:center;font-family:"Noto Serif SC","Songti SC","STSong",serif;font-size:clamp(78px,9.2vw,128px);line-height:.95;margin:10px 0 2px;color:#141c18;text-shadow:0 1px 0 #fff;letter-spacing:.04em}
.pinyin{text-align:center;font-size:clamp(22px,2.4vw,36px);font-style:italic;color:#b03a32;margin:0 0 8px}
.front-pinyin{display:none}.prompt{text-align:center;font-size:15px;margin:2px 0 10px;color:#5c6e64}
button{font:600 13px/1.1 Georgia,serif;letter-spacing:.03em}
.controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:3px 0 8px}.controls .nav{display:flex;gap:6px;margin-right:6px}
.ghost,.action{padding:9px 12px;border-radius:4px;cursor:pointer}.ghost{border:1px solid #1f5a52;background:#eef3ec;color:#0e1613}.action{border:1px solid #5a2418;background:#b03a32;color:#fff}
.reveal{border-top:1px solid #c5d4c8;padding-top:10px;margin-top:2px;animation:fade .18s ease}
.reveal-head{margin-bottom:6px}.reveal-pinyin{font-size:clamp(26px,2.7vw,40px);font-style:italic;color:#b03a32;font-weight:700}
.glosses{font-size:clamp(20px,2vw,30px);line-height:1.25;margin:4px 0 8px;color:#141c18}.glosses b{color:#b03a32}
.wordtitle,.extitle,.chartitle{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#5c6e64;margin:10px 0 5px;font-weight:700}
.charlist{display:flex;gap:8px;flex-wrap:wrap}
.charchip{background:#e7efe8;border:1px solid #c5d4c8;border-radius:4px;padding:7px 10px;min-width:92px;box-shadow:inset 0 0 0 1px rgba(198,163,90,.35)}
.charchip .wzh{font-family:"Noto Serif SC","Songti SC",serif;font-size:28px;font-weight:700;line-height:1;color:#b03a32}
.charchip .wpy{font-size:13px;font-style:italic;color:#1f5a52}.charchip .wen{font-size:12px;color:#4a5c54}
.examples{display:grid;gap:6px}
.example{padding:7px 10px;background:#eef3ec;border-left:4px solid #1f5a52;border-radius:3px;line-height:1.24}
.example-zh{font-family:"Noto Serif SC","Songti SC",serif;font-size:clamp(18px,1.6vw,24px)}
.example-py{font-size:clamp(13px,1.05vw,16px);font-style:italic;color:#b03a32;margin-top:2px}
.example-en{font-size:clamp(13px,1vw,16px);color:#3a4c44;margin-top:2px}
.example em{font-style:normal;font-weight:800;color:#b03a32;background:#e4d4b0;border-radius:3px;padding:0 .06em}
.flipcard{margin-top:3px;border:1px solid #c6a35a;border-radius:3px;padding:12px 14px;background:#eef3ec}
.flipcard h3{margin:0 0 7px;font-size:13px;color:#1f5a52;text-transform:uppercase;letter-spacing:.1em}
.english-list{font-size:clamp(22px,2vw,32px);line-height:1.25;margin:4px 0 10px}
.flipcard .reveal-pinyin{margin:0 0 6px}
.further{border:1px solid #1f5a52;background:transparent;color:#1f5a52;border-radius:4px;padding:8px 11px;cursor:pointer}
.imagepane{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;background:rgba(14,22,19,.95);border:3px solid #1f5a52;border-radius:2px;overflow:hidden;box-shadow:inset 0 0 0 7px rgba(198,163,90,.28),0 18px 50px rgba(14,22,19,.34)}
.imagepane:before{content:"";position:absolute;inset:9px;border:1px solid rgba(198,163,90,.55);border-radius:1px;pointer-events:none}
.art{display:block;max-width:94%;max-height:90%;width:auto;height:auto;object-fit:contain;filter:saturate(1.02) contrast(1.03);box-shadow:0 8px 32px rgba(0,0,0,.32);transition:opacity .35s ease,transform .35s ease}.art.wide{max-width:98%;max-height:84%}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@media(max-width:900px){body{overflow:auto}.app{height:auto;min-height:100vh}.main{grid-template-columns:1fr;grid-template-rows:auto minmax(360px,55vh)}.quiz{overflow:visible}.imagepane{min-height:420px}.topbar{flex-wrap:wrap}.progress{order:3;flex-basis:100%;max-width:none}}
@media(max-width:520px){.main{padding:9px;gap:9px}.quiz{padding:14px}.brand small{display:none}.character{font-size:72px}.topbar{padding:8px 10px}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">词语 401–500 <small>most common words</small></div>
    <div class="progress"><i id="progressFill"></i></div>
    <div class="stat" id="cardStat"></div>
    <button class="topbtn" id="shuffleBtn">Shuffle</button>
    <button class="topbtn" id="resetBtn">Reset order</button>
  </header>
  <main class="main">
    <section class="quiz">
      <div class="rankline"><span id="rankLabel"></span></div>
      <div class="character" id="char"></div>
      <div class="pinyin front-pinyin" id="pinyin" aria-hidden="true"></div>
      <div class="prompt">Recognize the word first. Reveal for dictionary English, each character, and three fully translated examples.</div>
      <div class="controls">
        <div class="nav"><button class="ghost" id="prevBtn">← Previous</button><button class="ghost" id="nextBtn">Next →</button></div>
        <button class="action" id="revealBtn">Reveal</button>
        <button class="ghost" id="flipBtn">Flip</button>
      </div>
      <div id="detailArea"></div>
    </section>
    <section class="imagepane" id="imagePane">
      <img class="art" id="art" alt="Study image">
    </section>
  </main>
</div>
<script>
const BANK = [{"rank":401,"word":"这么","pinyin":"zhè me","en":["so","this (degree)","in this way"],"chars":[{"ch":"这","py":"zhè","en":"this"},{"ch":"么","py":"me","en":"particle"}],"examples":[{"zh":"路没有这么远。","pinyin":"lù méi yǒu zhè me yuǎn.","en":"The road is not so far."},{"zh":"他从来没有见过这么大的雨。","pinyin":"tā cóng lái méi yǒu jiàn guo zhè me dà de yǔ.","en":"He had never seen so great a rain."},{"zh":"这么多人来修桥。","pinyin":"zhè me duō rén lái xiū qiáo.","en":"So many people have come to mend the bridge."}]},{"rank":402,"word":"那些","pinyin":"nà xiē","en":["those"],"chars":[{"ch":"那","py":"nà","en":"that"},{"ch":"些","py":"xiē","en":"some; several"}],"examples":[{"zh":"那些树是去年栽的。","pinyin":"nà xiē shù shì qù nián zāi de.","en":"Those trees were planted last year."},{"zh":"把那些旧信收起来。","pinyin":"bǎ nà xiē jiù xìn shōu qǐ lái.","en":"Put those old letters away."},{"zh":"那些日子过得很慢。","pinyin":"nà xiē rì zi guò de hěn màn.","en":"Those days passed very slowly."}]},{"rank":403,"word":"哪个","pinyin":"nǎ ge","en":["which"],"chars":[{"ch":"哪","py":"nǎ","en":"which"},{"ch":"个","py":"ge","en":"measure word"}],"examples":[{"zh":"哪个孩子把碗打破了？","pinyin":"nǎ ge hái zi bǎ wǎn dǎ pò le?","en":"Which child broke the bowl?"},{"zh":"你喜欢哪个颜色？","pinyin":"nǐ xǐ huan nǎ ge yán sè?","en":"Which color do you like?"},{"zh":"哪个村子离河更近？","pinyin":"nǎ ge cūn zi lí hé gèng jìn?","en":"Which village is nearer the river?"}]},{"rank":404,"word":"几个","pinyin":"jǐ ge","en":["several","how many"],"chars":[{"ch":"几","py":"jǐ","en":"several; how many"},{"ch":"个","py":"ge","en":"measure word"}],"examples":[{"zh":"村里来了几个人。","pinyin":"cūn lǐ lái le jǐ ge rén.","en":"Several people have come to the village."},{"zh":"你要几个馒头？","pinyin":"nǐ yào jǐ ge mán tou?","en":"How many steamed buns do you want?"},{"zh":"过了几个月，桥才修好。","pinyin":"guò le jǐ ge yuè, qiáo cái xiū hǎo.","en":"After several months the bridge was at last mended."}]},{"rank":405,"word":"多少","pinyin":"duō shao","en":["how many","how much"],"chars":[{"ch":"多","py":"duō","en":"many"},{"ch":"少","py":"shao","en":"few (in 多少)"}],"examples":[{"zh":"这袋米有多少斤？","pinyin":"zhè dài mǐ yǒu duō shao jīn?","en":"How many catties is this sack of rice?"},{"zh":"你知道要走多少路吗？","pinyin":"nǐ zhī dào yào zǒu duō shao lù ma?","en":"Do you know how much road there is to walk?"},{"zh":"多少钱能买这一匹布？","pinyin":"duō shao qián néng mǎi zhè yì pǐ bù?","en":"How much money will buy this bolt of cloth?"}]},{"rank":406,"word":"左右","pinyin":"zuǒ yòu","en":["about","around","left and right"],"chars":[{"ch":"左","py":"zuǒ","en":"left"},{"ch":"右","py":"yòu","en":"right"}],"examples":[{"zh":"他四十岁左右。","pinyin":"tā sì shí suì zuǒ yòu.","en":"He is about forty."},{"zh":"桥的左右都种了柳树。","pinyin":"qiáo de zuǒ yòu dōu zhòng le liǔ shù.","en":"Willows are planted to the left and right of the bridge."},{"zh":"再过一个月左右就能收麦。","pinyin":"zài guò yí ge yuè zuǒ yòu jiù néng shōu mài.","en":"In about another month the wheat can be brought in."}]},{"rank":407,"word":"以上","pinyin":"yǐ shàng","en":["above","more than"],"chars":[{"ch":"以","py":"yǐ","en":"take; by"},{"ch":"上","py":"shàng","en":"up; above"}],"examples":[{"zh":"六十岁以上的老人不必下田。","pinyin":"liù shí suì yǐ shàng de lǎo rén bú bì xià tián.","en":"Elders of sixty and above need not go to the fields."},{"zh":"水位在石头以上。","pinyin":"shuǐ wèi zài shí tou yǐ shàng.","en":"The water stands above the stone."},{"zh":"十里以上的路，今天走不完。","pinyin":"shí lǐ yǐ shàng de lù, jīn tiān zǒu bù wán.","en":"A road of more than ten li cannot be finished today."}]},{"rank":408,"word":"以下","pinyin":"yǐ xià","en":["below","under"],"chars":[{"ch":"以","py":"yǐ","en":"take; by"},{"ch":"下","py":"xià","en":"down; below"}],"examples":[{"zh":"桥以下的水很急。","pinyin":"qiáo yǐ xià de shuǐ hěn jí.","en":"The water below the bridge is very swift."},{"zh":"三岁以下的孩子不用干活。","pinyin":"sān suì yǐ xià de hái zi bú yòng gàn huó.","en":"Children under three need not work."},{"zh":"山腰以下都是田。","pinyin":"shān yāo yǐ xià dōu shì tián.","en":"Below the mountainside it is all fields."}]},{"rank":409,"word":"之间","pinyin":"zhī jiān","en":["between","among"],"chars":[{"ch":"之","py":"zhī","en":"of; it"},{"ch":"间","py":"jiān","en":"interval; between"}],"examples":[{"zh":"两村之间有一条河。","pinyin":"liǎng cūn zhī jiān yǒu yì tiáo hé.","en":"Between the two villages there is a river."},{"zh":"父子之间不必说太多。","pinyin":"fù zǐ zhī jiān bú bì shuō tài duō.","en":"Between father and son there is no need to say much."},{"zh":"雨停了，云之间露出一点蓝。","pinyin":"yǔ tíng le, yún zhī jiān lù chū yì diǎn lán.","en":"The rain stopped; a little blue showed between the clouds."}]},{"rank":410,"word":"方面","pinyin":"fāng miàn","en":["aspect","respect","side"],"chars":[{"ch":"方","py":"fāng","en":"direction; side"},{"ch":"面","py":"miàn","en":"face; side"}],"examples":[{"zh":"这件事在钱的方面并不难。","pinyin":"zhè jiàn shì zài qián de fāng miàn bìng bù nán.","en":"In the matter of money this is not hard."},{"zh":"他在种地方面很有经验。","pinyin":"tā zài zhòng dì fāng miàn hěn yǒu jīng yàn.","en":"He has much experience in the aspect of farming."},{"zh":"从身体方面说，他已经年老了。","pinyin":"cóng shēn tǐ fāng miàn shuō, tā yǐ jīng nián lǎo le.","en":"In respect of the body, he is already old."}]},{"rank":411,"word":"周围","pinyin":"zhōu wéi","en":["surroundings","around"],"chars":[{"ch":"周","py":"zhōu","en":"around; cycle"},{"ch":"围","py":"wéi","en":"enclose"}],"examples":[{"zh":"井的周围种了几棵树。","pinyin":"jǐng de zhōu wéi zhòng le jǐ kē shù.","en":"Several trees are planted around the well."},{"zh":"村子周围都是田。","pinyin":"cūn zi zhōu wéi dōu shì tián.","en":"All around the village are fields."},{"zh":"看看周围，一个人也没有。","pinyin":"kàn kan zhōu wéi, yí ge rén yě méi yǒu.","en":"Look around; there is not a single person."}]},{"rank":412,"word":"附近","pinyin":"fù jìn","en":["nearby","vicinity"],"chars":[{"ch":"附","py":"fù","en":"attach; near"},{"ch":"近","py":"jìn","en":"near"}],"examples":[{"zh":"附近没有别的村子。","pinyin":"fù jìn méi yǒu bié de cūn zi.","en":"There is no other village nearby."},{"zh":"他住在桥附近。","pinyin":"tā zhù zài qiáo fù jìn.","en":"He lives near const IMAGES = ["img/01-kaiyuan-temple.jpg", "img/02-rongguo-paifang.jpg", "img/03-zhou-inscription.jpg", "img/04-jade-cong.jpg", "img/05-dagger-axe.jpg", "img/06-bronze-axes.jpg", "img/07-zhaoyun-statue.jpg", "img/08-chengdu-old.jpg", "img/09-longxing-hall.jpg", "img/10-dujiangyan.jpg", "img/11-cave-buddha.jpg", "img/12-sichuan-brocade.jpg", "img/13-hanging-temple.jpg", "img/14-yueyang-tower.jpg", "img/15-embroidery.jpg"];
let order = BANK.map((_,i)=>i), pos=0, state='front';
const $=id=>document.getElementById(id);
function current(){return BANK[order[pos]]}
function safe(t){return String(t).replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>').replace(/"/g,'"').replace(/'/g,'&#039;')}
function mark(sentence,w){return safe(sentence).split(safe(w)).join('<em>'+safe(w)+'</em>')}
function imageForPosition(){const n=IMAGES.length||1;return Math.floor(pos*n/BANK.length)%n}
function setImage(){const idx=imageForPosition(), img=$('art');img.style.opacity=.15;setTimeout(()=>{img.src=IMAGES[idx]; img.onload=()=>{img.classList.toggle('wide',img.naturalWidth/img.naturalHeight>1.75);img.style.opacity=1}},90)}
function renderDetail(mode){const c=current(), d=$('detailArea'); if(mode==='front'){d.innerHTML='';return}
 if(mode==='flip'){d.innerHTML=`<div class="flipcard"><h3>Pinyin + English</h3><div class="reveal-pinyin">${safe(c.pinyin)}</div><div class="english-list">${c.en.map(safe).join(' · ')}</div><button class="further" id="furtherBtn">Reveal further</button></div>`;$('furtherBtn').onclick=()=>{state='revealed';renderDetail('revealed')};return}
 const chars=c.chars.map(w=>`<div class="charchip"><div class="wzh">${safe(w.ch)}</div><div class="wpy">${safe(w.py)}</div><div class="wen">${safe(w.en)}</div></div>`).join('');
 const ex=c.examples.map(x=>`<div class="example"><div class="example-zh">${mark(x.zh,c.word)}</div><div class="example-py">${safe(x.pinyin)}</div><div class="example-en">${safe(x.en)}</div></div>`).join('');
 d.innerHTML=`<div class="reveal"><div class="reveal-head"><div class="reveal-pinyin">${safe(c.pinyin)}</div><p class="glosses"><b>${safe(c.word)}</b> — ${c.en.map(safe).join('; ')}</p></div><div class="chartitle">Characters in this word</div><div class="charlist">${chars}</div><div class="extitle">Example sentences</div><div class="examples">${ex}</div></div>`}
function render(changeImage=true){const c=current();$('char').textContent=c.word;$('pinyin').textContent='';$('rankLabel').textContent=`Word frequency #${c.rank}`;$('cardStat').textContent=`${pos+1} / ${BANK.length}`;$('progressFill').style.width=((pos+1)/BANK.length*100)+'%';state='front';renderDetail('front');if(changeImage)setImage()}
function move(delta){const oldImg=imageForPosition();pos=Math.max(0,Math.min(BANK.length-1,pos+delta));render(imageForPosition()!==oldImg)}
$('prevBtn').onclick=()=>move(-1);$('nextBtn').onclick=()=>move(1);
$('revealBtn').onclick=()=>{state='revealed';renderDetail('revealed')};$('flipBtn').onclick=()=>{state='flip';renderDetail('flip')};
$('shuffleBtn').onclick=()=>{for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}pos=0;render(true)};
$('resetBtn').onclick=()=>{order=BANK.map((_,i)=>i);pos=0;render(true)};
render(true);
</script>
