<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Skydiving 101</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=B612:wght@400;700&family=B612+Mono:wght@400;700&family=Saira+Condensed:wght@600;800&display=swap">

<style>
/* ===========================================================
   Skydiving 101 — manifest board, jump view, quiz, field guide
   =========================================================== */
:root{
  /* layout: a manifest board. The load sheet sits on the left, the decision in hand on the right, then one sky-sized canvas for the jump. */
  --bg:#e8eff6; --panel:#ffffff; --panel2:#f1f6fa; --ink:#0f2236; --muted:#52677b; --line:#c5d2de;
  --sky:#1c6cb3; --sky-ink:#ffffff; --sock:#e8590c; --sock-ink:#1d0d02;
  --good:#1c8553; --warn:#a36a00; --bad:#c2332c;
  --display:"Saira Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --body:"B612","Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"B612 Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#07131f; --panel:#0e2033; --panel2:#132940; --ink:#e5edf5; --muted:#8da3b8; --line:#243c54;
    --sky:#5aaeee; --sky-ink:#05203a; --sock:#ff8b3d; --sock-ink:#1d0d02;
    --good:#4cc38a; --warn:#e6b23e; --bad:#f2675f; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#07131f; --panel:#0e2033; --panel2:#132940; --ink:#e5edf5; --muted:#8da3b8; --line:#243c54;
  --sky:#5aaeee; --sky-ink:#05203a; --sock:#ff8b3d; --sock-ink:#1d0d02;
  --good:#4cc38a; --warn:#e6b23e; --bad:#f2675f; color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none !important}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--body); font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
button,input{font-family:inherit; font-size:inherit; color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--sky); outline-offset:2px}

#app{max-width:1180px; margin:0 auto; padding-inline:16px; padding-block:14px 48px}

/* ---------------- header ---------------- */
.top{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:8px 24px; border-bottom:2px solid var(--ink); margin-bottom:22px}
.brand{display:flex; align-items:center; gap:10px; padding-bottom:8px}
.brand h1{margin:0; font-family:var(--display); font-weight:800; font-size:30px; line-height:1; letter-spacing:.04em; text-transform:uppercase}
.dial{width:34px; height:34px; flex:none}
.dial-face{fill:var(--panel); stroke:var(--ink); stroke-width:2.5}
.dial-low{fill:none; stroke:var(--sock); stroke-width:3.5}
.dial-hand{fill:none; stroke:var(--ink); stroke-width:2.5; stroke-linecap:round}
.dial-hub{fill:var(--ink)}
.tabs{display:flex; gap:2px}
.tab{
  border:0; background:none; padding:8px 14px 9px; color:var(--muted);
  font-family:var(--display); font-weight:600; font-size:18px; letter-spacing:.07em; text-transform:uppercase;
  border-bottom:4px solid transparent; margin-bottom:-2px;
}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink); border-bottom-color:var(--sock)}

/* ---------------- type shared by every view ---------------- */
.eyebrow{margin:0 0 4px; font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
.view h2{margin:0 0 10px; font-family:var(--display); font-weight:800; font-size:clamp(30px,5vw,44px); line-height:1.02; letter-spacing:.02em; text-transform:uppercase; text-wrap:balance}
.view h3{margin:26px 0 6px; font-family:var(--display); font-weight:600; font-size:21px; letter-spacing:.06em; text-transform:uppercase}
.view h4{margin:16px 0 6px; font-family:var(--mono); font-weight:700; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
.lede{margin:0 0 16px; max-width:62ch; font-size:16px}
.hint{margin:0 0 10px; max-width:66ch; color:var(--muted)}
.fine{margin:14px 0 0; max-width:66ch; color:var(--muted); font-size:13px}
.row{display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-top:16px}
.row .fine{margin:0}

.btn{
  padding:9px 18px 10px; border:2px solid var(--ink); border-radius:3px; background:transparent; color:var(--ink);
  font-family:var(--display); font-weight:600; font-size:19px; line-height:1.1; letter-spacing:.07em; text-transform:uppercase;
}
.btn:hover:not(:disabled){background:var(--ink); color:var(--bg)}
.btn.go{background:var(--sock); border-color:var(--sock); color:var(--sock-ink)}
.btn.go:hover:not(:disabled){background:var(--ink); border-color:var(--ink); color:var(--bg)}
.btn:disabled{opacity:.4}
.btn kbd{margin-left:6px; padding:1px 5px; border:1px solid currentColor; border-radius:3px; font-family:var(--mono); font-size:11px; letter-spacing:0; opacity:.75; vertical-align:2px}
.link{padding:0; border:0; background:none; color:var(--sky); text-decoration:underline; font-size:inherit}

/* ---------------- the board: load sheet + stage ---------------- */
.board{display:grid; grid-template-columns:minmax(0,1fr); gap:24px}
@media (min-width:900px){ .board{grid-template-columns:330px minmax(0,1fr); gap:36px; align-items:start} }
.stage{min-width:0}

.sheet{background:var(--panel); border:1px solid var(--line); border-radius:3px; min-width:0}
.sheet-head{display:flex; justify-content:space-between; gap:12px; padding:8px 14px; background:var(--ink); color:var(--bg);
  font-family:var(--display); font-weight:600; font-size:19px; letter-spacing:.08em; text-transform:uppercase}
.sheet-dz{margin:0; padding:10px 14px 2px; font-family:var(--display); font-weight:800; font-size:26px; line-height:1.05; letter-spacing:.02em; text-transform:uppercase}
.sheet section{padding:10px 14px 12px; border-top:1px solid var(--line)}
.sheet section:first-of-type{border-top:0}
.view .sheet h3{margin:0 0 4px; font-family:var(--mono); font-weight:700; font-size:11px; letter-spacing:.14em; color:var(--sock)}
.sheet dl{margin:0; display:grid; gap:3px}
.sheet dl div{display:flex; justify-content:space-between; align-items:baseline; gap:12px}
.sheet dt{color:var(--muted); flex:none}
.sheet dd{margin:0; font-family:var(--mono); font-size:13px; font-weight:700; text-align:right; font-variant-numeric:tabular-nums}

/* gear check */
.gear{list-style:none; margin:0; padding:0; display:grid; gap:6px; max-width:760px}
.gear-row{
  width:100%; display:grid; grid-template-columns:11.5rem minmax(0,1fr); gap:4px 14px; text-align:left;
  padding:10px 12px; background:var(--panel); border:2px solid var(--line); border-radius:3px; font-size:14px;
}
.gear-row b{font-family:var(--display); font-weight:600; font-size:18px; letter-spacing:.05em; text-transform:uppercase; line-height:1.2}
.gear-row:hover:not(:disabled){border-color:var(--ink)}
.gear-row[aria-pressed="true"]{border-color:var(--sock); background:color-mix(in srgb, var(--sock) 12%, var(--panel))}
.gear-row.was-bad{border-color:var(--bad)}
.gear-row:disabled{opacity:1}
@media (max-width:560px){ .gear-row{grid-template-columns:minmax(0,1fr)} }
.note{margin:14px 0 0; max-width:66ch; padding:10px 12px; border:2px solid var(--line); border-radius:3px; background:var(--panel)}
.note.t-good{border-color:var(--good)} .note.t-warn{border-color:var(--warn)} .note.t-bad{border-color:var(--bad)}

/* plan */
.opts{display:grid; grid-template-columns:repeat(auto-fill,minmax(128px,1fr)); gap:8px}
.opt{
  display:grid; grid-template-columns:auto 1fr; align-items:baseline; column-gap:6px; row-gap:1px; text-align:left;
  padding:8px 10px 9px; background:var(--panel); border:2px solid var(--line); border-radius:3px;
}
.opt b{font-family:var(--display); font-weight:800; font-size:30px; line-height:1; font-variant-numeric:tabular-nums}
.opt span{font-family:var(--mono); font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em}
.opt i{grid-column:1 / -1; font-style:normal; font-family:var(--mono); font-size:12px; color:var(--muted)}
.opt:hover{border-color:var(--ink)}
.opt[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--bg)}
.opt[aria-pressed="true"] span,.opt[aria-pressed="true"] i{color:inherit; opacity:.8}

.plan2{display:grid; grid-template-columns:minmax(0,1fr); gap:0 32px}
@media (min-width:760px){ .plan2{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); align-items:start} }
.plan2 > div{min-width:0}
.card{padding:12px 14px; background:var(--panel); border:1px solid var(--line); border-radius:3px}
.card p{margin:0 0 8px; max-width:62ch}
.card-title{font-family:var(--display); font-weight:800; font-size:22px; letter-spacing:.04em; text-transform:uppercase; line-height:1.1}
.card .card-foot{margin:0; padding-top:8px; border-top:1px dashed var(--line); color:var(--muted); font-size:13px}
.keys{margin-top:22px; max-width:760px}
.keys summary{cursor:pointer; font-family:var(--display); font-weight:600; font-size:19px; letter-spacing:.06em; text-transform:uppercase}
.keys table{min-width:0; margin-top:8px}
.keys tbody th{font-size:15px; color:var(--muted); width:8.5rem}
.keys td:nth-child(2){white-space:nowrap; width:5.5rem}
kbd{padding:1px 6px; border:1px solid var(--muted); border-radius:3px; font-family:var(--mono); font-size:12px; white-space:nowrap}
.winds{list-style:none; margin:0; padding:0; display:grid; gap:2px}
.winds li{display:grid; grid-template-columns:22px 1fr auto; align-items:center; gap:8px; font-family:var(--mono); font-size:12px}
.winds svg{width:18px; height:18px; fill:var(--sock)}
.winds b{font-variant-numeric:tabular-nums}

/* ---------------- the jump ---------------- */
.airbox{width:100%; height:min(60vw, calc(100vh - 200px)); height:min(60vw, calc(100dvh - 200px)); min-height:300px; border-radius:3px; overflow:hidden; background:#2f6ea8}
@media (max-width:700px){ .airbox{height:min(118vw, calc(100vh - 268px)); height:min(118vw, calc(100dvh - 268px))} }
.airbox canvas{display:block; width:100%; height:100%; outline-offset:-3px}
.airbar{display:grid; gap:8px; padding-block:10px}
.airtop{display:flex; justify-content:space-between; align-items:flex-start; gap:16px}
#air-msg{margin:0; min-height:3em; max-width:90ch; min-width:0}
.airbtns{flex:none; display:flex; gap:14px}
.airbtns .link{font-family:var(--mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase}
.ctl{display:flex; flex-wrap:wrap; gap:8px; min-height:48px}
.ctl .btn{flex:1 1 130px; min-height:48px; user-select:none; -webkit-user-select:none; touch-action:none; -webkit-touch-callout:none}
.ctl .btn.sm{flex:1 1 74px; padding-inline:8px}
@media (max-width:700px){
  .airtop{flex-direction:column-reverse; gap:4px}
  .airbtns{align-self:flex-end}
  #air-msg{min-height:2.9em; font-size:13.5px; line-height:1.4}
  .ctl{gap:6px}
  .ctl kbd{display:none}
  .ctl .btn{min-height:46px; font-size:17px}
  .ctl .btn.sm{flex:1 1 60px}
  .ctl-check .btn{flex:1 1 44%}
}
.ctl .btn[aria-pressed="true"]{background:var(--ink); color:var(--bg)}
.ctl-freefall .btn.go,.ctl-canopy .btn.go{flex:2 1 150px}

/* ---------------- debrief ---------------- */
.verdict{border-top:8px solid var(--muted); padding-top:12px; margin-bottom:14px}
.verdict.t-good{border-top-color:var(--good)} .verdict.t-warn{border-top-color:var(--warn)} .verdict.t-bad{border-top-color:var(--bad)}
.verdict .sub{margin:0; max-width:62ch; font-size:16px}
.total{margin:10px 0 0; display:flex; align-items:baseline; gap:8px}
.total b{font-family:var(--display); font-weight:800; font-size:64px; line-height:.9; font-variant-numeric:tabular-nums}
.total span{font-family:var(--mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.why{margin:0 0 4px; padding-left:20px; max-width:66ch}
.why li{margin-bottom:4px}

.logline{display:flex; flex-wrap:wrap; border:1px solid var(--ink); border-radius:3px; overflow:hidden; background:var(--panel); margin-bottom:18px}
.logline div{flex:1 1 104px; padding:6px 9px 7px; min-width:0; box-shadow:1px 0 0 var(--line), 0 1px 0 var(--line)}
.logline span{display:block; font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
.logline b{font-family:var(--mono); font-size:13px; overflow-wrap:anywhere}

.score{display:grid; border-top:1px solid var(--line)}
.score-row{display:grid; grid-template-columns:9.5rem 3.4rem minmax(0,1fr); gap:4px 12px; align-items:baseline; padding:8px 0; border-bottom:1px solid var(--line)}
.score-label{font-family:var(--display); font-weight:600; font-size:18px; letter-spacing:.05em; text-transform:uppercase; line-height:1.2}
.pts{font-family:var(--mono); font-weight:700; font-variant-numeric:tabular-nums; text-align:right}
.pts.full{color:var(--good)} .pts.part{color:var(--warn)} .pts.zero{color:var(--bad)}
.score-note{font-size:14px}
@media (max-width:620px){
  .score-row{grid-template-columns:minmax(0,1fr) auto}
  .score-note{grid-column:1 / -1}
}

.after{display:grid; grid-template-columns:minmax(0,1fr); gap:20px; margin-top:22px}
@media (min-width:760px){ .after{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); align-items:start} }
.prof{margin:0 0 20px; min-width:0}
.prof canvas{display:block; width:100%; height:clamp(200px, 30vw, 300px); border:1px solid var(--line); border-radius:3px}
.prof figcaption{margin-top:6px; font-family:var(--mono); font-size:11px; color:var(--muted); display:flex; flex-wrap:wrap; gap:4px 14px}
.prof figcaption span{display:inline-flex; align-items:center; gap:6px; white-space:nowrap}
.mini{margin:0; min-width:0}
.mini canvas{display:block; width:100%; aspect-ratio:16 / 11; border:1px solid var(--line); border-radius:3px}
.mini figcaption{margin-top:6px; font-family:var(--mono); font-size:11px; color:var(--muted); display:flex; flex-wrap:wrap; gap:4px 14px}
.mini figcaption span{display:inline-flex; align-items:center; gap:6px; white-space:nowrap}
.k{display:inline-block; flex:none; width:16px; height:0; border-top:3px solid var(--muted)}
.k-ff{border-top-style:dashed; border-top-color:var(--muted)}
.k-can{border-top-color:#d9a900}
.k-exit{width:9px; height:9px; border:0; background:linear-gradient(45deg,transparent 42%,var(--ink) 42% 58%,transparent 58%),linear-gradient(-45deg,transparent 42%,var(--ink) 42% 58%,transparent 58%)}
.k-ideal{width:10px; height:10px; border:2.5px solid var(--good); border-radius:50%}
.view .facts h3{margin-top:0}
.facts dl{margin:0; display:grid; gap:10px}
.facts dt{font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
.facts dd{margin:0}

/* ---------------- quiz ---------------- */
.quiz{max-width:760px}
.quiz-head{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:8px 16px; margin-bottom:10px}
.quiz-head .eyebrow{margin:0}
.view .quiz h2{font-size:clamp(24px,3.6vw,32px); text-transform:none; letter-spacing:.01em; line-height:1.12; margin-bottom:16px}
.pips{display:flex; gap:4px}
.pip{width:16px; height:6px; background:var(--line)}
.pip.now{background:var(--ink)} .pip.ok{background:var(--good)} .pip.no{background:var(--bad)}
.q-opts{display:grid; gap:8px}
.q-opt{
  display:grid; grid-template-columns:1.7rem minmax(0,1fr); gap:10px; align-items:baseline; text-align:left; width:100%;
  padding:11px 14px; background:var(--panel); border:2px solid var(--line); border-radius:3px; font-size:15px;
}
.q-key{font-family:var(--display); font-weight:800; font-size:20px; color:var(--muted)}
.q-opt:hover:not(:disabled){border-color:var(--ink)}
.q-opt:disabled{opacity:1}
.q-opt.right{border-color:var(--good); background:color-mix(in srgb, var(--good) 14%, var(--panel))}
.q-opt.wrong{border-color:var(--bad); background:color-mix(in srgb, var(--bad) 12%, var(--panel))}
.q-why{margin-top:16px; padding-top:14px; border-top:1px dashed var(--muted); max-width:66ch}
.q-why p{margin:0 0 14px}
.review{margin:0; padding:0; list-style:none; display:grid; gap:12px; max-width:66ch}
.review b{display:block}
.review span{color:var(--muted)}

/* ---------------- field guide ---------------- */
.guide{max-width:980px}
.nums{margin:0; display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); column-gap:28px}
.nums div{display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:6px 0; border-bottom:1px solid var(--line)}
.nums dt{min-width:0}
.nums dd{margin:0; font-family:var(--mono); font-weight:700; font-size:13px; text-align:right; flex:none; max-width:55%}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; min-width:560px; font-size:14px}
th,td{text-align:left; vertical-align:top; padding:7px 12px 7px 0; border-bottom:1px solid var(--line)}
thead th{font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); border-bottom-color:var(--ink)}
tbody th{font-family:var(--display); font-weight:600; font-size:17px; letter-spacing:.04em; text-transform:uppercase; white-space:nowrap}
td{font-variant-numeric:tabular-nums}
.how{margin:0; display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:12px 28px}
.how dt{font-family:var(--display); font-weight:600; font-size:19px; letter-spacing:.04em; text-transform:uppercase; line-height:1.2}
.how dd{margin:0; color:var(--muted)}
.filter{display:grid; gap:4px; max-width:340px; margin-bottom:6px}
.filter label{font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
.filter input{padding:8px 10px; border:2px solid var(--line); border-radius:3px; background:var(--panel)}
.gloss-group dl{margin:0; display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:10px 28px}
.gloss-group dt{font-family:var(--display); font-weight:600; font-size:19px; letter-spacing:.04em; text-transform:uppercase; line-height:1.2}
.gloss-group dd{margin:0; color:var(--muted)}

@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} }
</style>

<div id="app">
  <header class="top">
    <div class="brand">
      <!-- an altimeter face, needle at pull altitude -->
      <svg class="dial" viewBox="0 0 40 40" aria-hidden="true">
        <circle class="dial-face" cx="20" cy="20" r="17.5"/>
        <path class="dial-low" d="M20 5.5 A14.5 14.5 0 0 1 34 16.2"/>
        <path class="dial-hand" d="M20 20 L32.6 13.4"/>
        <circle class="dial-hub" cx="20" cy="20" r="2.4"/>
      </svg>
      <h1>Skydiving 101</h1>
    </div>
    <nav class="tabs" aria-label="Sections">
      <button type="button" class="tab on" data-tab="jump" aria-pressed="true">Jump</button>
      <button type="button" class="tab" data-tab="quiz" aria-pressed="false">Quiz</button>
      <button type="button" class="tab" data-tab="guide" aria-pressed="false">Field guide</button>
    </nav>
  </header>

  <main>
    <!-- ================= JUMP ================= -->
    <section id="view-jump" class="view">
      <div class="board" id="board">
        <aside class="sheet" id="sheet" aria-label="Load sheet"></aside>
        <div class="stage" id="stage"></div>
      </div>
      <div class="air" id="air" hidden>
        <div class="airbox"><canvas id="sky" tabindex="0" aria-label="The jump, seen from a camera off to one side"></canvas></div>
        <div class="airbar">
          <div class="airtop"><p id="air-msg" aria-live="polite"></p><span class="airbtns"><button type="button" class="link" id="air-mute">Sound on</button><button type="button" class="link" id="air-pause">Pause</button></span></div>
          <div id="air-ctl" class="ctl"></div>
        </div>
      </div>
    </section>

    <!-- ================= QUIZ ================= -->
    <section id="view-quiz" class="view" hidden></section>

    <!-- ================= FIELD GUIDE ================= -->
    <section id="view-guide" class="view" hidden></section>
  </main>
</div>

<script>
/* ============================================================
   glossary.js — the 60 terms, grouped the way jumpers meet them
   ============================================================ */
(function () {
  'use strict';
  var SD = window.SD = window.SD || {};

  SD.GROUPS = ['Gear', 'Dropzone', 'Freefall', 'Canopy', 'Emergencies', 'Culture'];

  // t: term, g: group, d: definition (kept short enough to work as a quiz option)
  SD.GLOSSARY = [
    { t: 'Rig', g: 'Gear', d: 'The complete parachute system: harness, container, main, reserve and AAD.' },
    { t: 'Main', g: 'Gear', d: 'The primary canopy you plan to land under on every jump.' },
    { t: 'Reserve', g: 'Gear', d: 'The backup canopy, repacked by a certified rigger every 180 days in the US.' },
    { t: 'AAD', g: 'Gear', d: 'A small computer that fires the reserve if you are still at freefall speed around 750 ft.' },
    { t: 'RSL', g: 'Gear', d: 'A lanyard that pulls the reserve pin as a cut-away main leaves.' },

  }
  var clamp = function (v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; };
  var lerp = function (a, b, t) { return a + (b - a) * t; };
  var hyp = function (x, y) { return Math.sqrt(x * x + y * y); };
  // smallest angle between two compass bearings, 0..180
  function angDiff(a, b) { var d = Math.abs(a - b) % 360; return d > 180 ? 360 - d : d; }

  // ---- atmosphere --------------------------------------------------
  function isaC(h) { return 15 - 1.9812 * h / 1000; }
  // density relative to sea-level standard; dT is the day's offset from standard, in °C
  function densityRatio(hMsl, dT) {
    var tk = isaC(hMsl) + 273.15;
    return Math.pow(tk / 288.15, 5.2559) * 288.15 / (tk + dT);
  }
  // how much faster everything moves through this air than at sea level
  function speedFactor(hMsl, dT) { return 1 / Math.sqrt(densityRatio(hMsl, dT)); }
  function densityAltitude(elev, tempC) { return elev + 120 * (tempC - isaC(elev)); }

  // ---- speeds, in ft/s -----------------------------------------------
  // belly-to-earth: 110 mph for a 200 lb exit weight at sea level
  function terminal(weight, hMsl, dT) { return 110 * MPH * Math.sqrt(weight / 200) * speedFactor(hMsl, dT); }
  // canopy airspeed: 25 mph at a wing loading of 1.0 at sea level
  function canopyAir(wl, hMsl, dT) { return 25 * MPH * Math.sqrt(wl) * speedFactor(hMsl, dT); }

  // ---- wind ------------------------------------------------------------
  // a wind "from" dir blows toward dir + 180; x is east, y is north
  function windXY(spdMph, dirFrom) {
    var r = dirFrom * Math.PI / 180;

  // layers: [{alt, vx, vy}] sorted by altitude AGL
  function windVec(layers, alt) {

    else for (i = 1; i < n; i++) if (alt <= layers[i].alt) { a = layers[i - 1]; b = layers[i]; break; }
    var t = a === b ? 0 : (alt - a.alt) / (b.alt - a.alt);
    return { x: lerp(a.vx, b.vx, t), y: lerp(a.vy, b.vy, t) };
  }

  // ---- whole-jump estimates, used by the planner and the debrief ---------
  function simFreefall(sc, fromAlt, toAlt) {
    var alt = fromAlt, v = 0, t = 0, x = 0, y = 0, dt = 0.05, vmax = 0, vt, w;
    while (alt > toAlt && t < 600) {
      vt = terminal(sc.jumper.exitWeight, alt + sc.dz.elev, sc.dT);
      v += G * (1 - (v * v) / (vt * vt)) * dt;
      alt -= v * dt;
      w = windVec(sc.wind.layers, alt);
      x += w.x * dt; y += w.y * dt; t += dt;
      if (v > vmax) vmax = v;
    }
    return { time: t, x: x, y: y, v: v, vmax: vmax };
  }
  // where the wind alone carries an open canopy between two heights
  function simCanopyDrift(sc, wl, fromAlt, toAlt) {
    var alt = fromAlt, t = 0, x = 0, y = 0, dt = 0.5, w;
    while (alt > toAlt && t < 3000) {
      w = windVec(sc.wind.layers, alt);
      x += w.x * dt; y += w.y * dt; t += dt;
      alt -= canopyAir(wl, alt + sc.dz.elev, sc.dT) / GLIDE * dt;
    }
    return { time: t, x: x, y: y };
  }
  // fly straight at the target from here: height left on arrival, or -1 if it cannot be reached
  function arrivalAlt(sc, wl, x, y, alt) {
    var dt = 0.5, d, va, w;
    while (alt > 0) {
      d = hyp(x, y);
      if (d < 80) return alt;
      va = canopyAir(wl, alt + sc.dz.elev, sc.dT);
      w = windVec(sc.wind.layers, alt);
      x += (-x / d * va + w.x) * dt;
      y += (-y / d * va + w.y) * dt;
      alt -= va / GLIDE * dt;
    }
    return -1;
  }

  SD.PHYS = {
    MPH: MPH, G: G, GLIDE: GLIDE,
    rng: rng, clamp: clamp, lerp: lerp, hyp: hyp, angDiff: angDiff,
    isaC: isaC, densityRatio: densityRatio, speedFactor: speedFactor, densityAltitude: densityAltitude,
    terminal: terminal, canopyAir: canopyAir,
    windXY: windXY, windVec: windVec,
    simFreefall: simFreefall, simCanopyDrift: simCanopyDrift, arrivalAlt: arrivalAlt
  };
})();
</script>

<script>
/* ============================================================
   scenario.js — rolls the day's conditions, knows the rules,
   writes the dive plan and marks the jump afterwards
   ============================================================ */
(function () {
  'use strict';
  var SD = window.SD, P = SD.PHYS, RAD = Math.PI / 180;

  // minOpen and decide are USPA figures, and so is the 14 mph student wind limit.
  // The other wind limits and every wing-loading ceiling are this game's house rules.
  var LICENSES = {
    Student: { key: 'Student', name: 'Student', a: 'a student', jumps: [6, 24], wind: 14, wl: 1.0, minOpen: 3000, decide: 2500 },
    A: { key: 'A', name: 'A license', a: 'an A license', jumps: [25, 49], wind: 18, wl: 1.0, minOpen: 3000, decide: 2500 },
    B: { key: 'B', name: 'B license', a: 'a B license', jumps: [50, 199], wind: 22, wl: 1.1, minOpen: 2500, decide: 1800 },
    C: { key: 'C', name: 'C license', a: 'a C license', jumps: [200, 499], wind: 25, wl: 1.3, minOpen: 2500, decide: 1800 },
    D: { key: 'D', name: 'D license', a: 'a D license', jumps: [500, 4000], wind: 28, wl: 1.6, minOpen: 2500, decide: 1800 }
  };

  var DZS = [
    { name: 'Saltmarsh Field', elev: 30, top: 13500, plane: 'Twin Otter', temp: [8, 32], pal: 'coast' },
    { name: 'Four Corners Farm', elev: 1100, top: 13500, plane: 'Cessna Caravan', temp: [-2, 35], pal: 'prairie' },
    { name: 'Dry Lake', elev: 2700, top: 12000, plane: 'PAC 750', temp: [10, 42], pal: 'desert' },
    { name: 'Ridgeline', elev: 5300, top: 12500, plane: 'Twin Otter', temp: [-4, 34], pal: 'dry' }
  ];

  var SIZES = [280, 260, 230, 210, 190, 170, 150, 135, 120, 107, 97, 84];

  var COLORS = [
    ['#e8590c', '#16324a', '#f4f1ea'], ['#d7263d', '#f4f1ea', '#1b1b1e'], ['#2a9d8f', '#1f3b4d', '#e9c46a'],
    ['#6a4c93', '#f4f1ea', '#1982c4'], ['#f2c14e', '#1b1b1e', '#d7263d'], ['#2f6fed', '#f4f1ea', '#ff7a1a']
  ];

  // effect: what happens in the air if the fault boards the plane with you.
  // 'caught' faults are found by another jumper on the ride up.
  var GEAR = [
    { k: 'aad', name: 'AAD', ok: 'Switched on. The display reads 0.', bad: 'The display is blank.',
      lesson: 'An AAD that is off cannot fire the reserve for you.', effect: 'aad', miss: 'You jumped with no automatic backup.' },
    { k: 'chest', name: 'Chest strap', ok: 'Threaded through the friction adapter and back, loose end stowed.',
      bad: 'Passed around the buckle without going through the friction adapter.',
      lesson: 'A misrouted chest strap can slide open on deployment and let you out of the harness.', effect: 'caught' },
    { k: 'rings', name: 'Three-ring release', ok: 'Big, middle and small ring stacked in order. The white loop goes over the small ring only.',
      bad: 'The white loop is routed through the middle ring as well as the small one.',
      lesson: 'A misassembled three-ring may not release in a cutaway, or may let go by itself.', effect: 'caught' },
    { k: 'rsl', name: 'RSL', ok: 'Shackle clipped to the riser ring.', bad: 'Shackle hanging loose, not clipped to the riser.',
      lesson: 'Unclipped, it cannot pull the reserve pin after a cutaway.', effect: 'rsl', miss: 'After a cutaway the reserve would wait for your hand.' },
    { k: 'pin', name: 'Main closing pin', ok: 'Pin fully seated, closing loop tight and clean.', bad: 'The closing loop is frayed more than halfway through.',
      lesson: 'A worn loop can let the main out early, including in the door of the plane.', effect: 'caught' },
    { k: 'alti', name: 'Altimeter', ok: 'Needle on 0 on the ground.', bad: 'Reads 700 ft while you stand on the ground.',
      lesson: 'An altimeter that is not zeroed reads high all the way down.', effect: 'alti', miss: 'Every altitude you saw in the air was 700 ft too high.' },
    { k: 'pc', name: 'Pilot chute', ok: 'Handle in reach at the bottom of the container, bridle tucked away.',
      bad: 'Handle pushed deep into the pouch. You can barely feel it.',
      lesson: 'A handle you cannot find costs seconds, at about 170 ft per second.', effect: 'hardpull', miss: 'You lost about two seconds finding the handle.' },
    { k: 'legs', name: 'Leg straps', ok: 'Both snug, flat and even, loose ends stowed.', bad: 'The right strap is twisted and much looser than the left.',
      lesson: 'Uneven leg straps load the harness crooked on opening and make the canopy hard to fly straight.', effect: 'caught' },
    { k: 'card', name: 'Reserve packing card', ok: 'Repacked 6 weeks ago. Seal intact.', bad: 'Last repacked 9 months ago.',
      lesson: 'A US reserve is out of date after 180 days and may not be jumped.', effect: 'caught' }
  ];

  // fps: descent rate while it lasts. fix: clearing it works. total: nothing is out at all.
  var MALS = {
    twists: { name: 'Line twists', fix: true, sink: 1.15, clear: 4,
      see: 'The canopy is square and flying straight, but the lines are wound together above your risers. The toggles will not steer.',
      doing: 'Spreading the risers and kicking the twists out.',
      why: 'Line twists on a docile canopy that is flying straight can be kicked out.' },
    cells: { name: 'Closed end cells', fix: true, sink: 1.05, clear: 2.5,
      see: 'The canopy is open and flying straight. The two end cells are folded shut and the slider is stuck halfway down.',
      doing: 'Pumping the brakes.',
      why: 'Closed end cells and a hung slider are nuisances. Pumping the brakes opens them.' },
    lineOver: { name: 'Line-over', fix: false, fps: 51, clear: 3,
      see: 'One line runs over the top of the canopy and pinches it into a bow-tie. It is turning and will not fly straight.',
      doing: 'Pumping the brakes.',
      why: 'A line-over that keeps turning is not landable. Cut away.' },
    spin: { name: 'Spinning line twists', fix: false, fps: 73, clear: 3,
      see: 'The lines are twisted and the canopy is diving in a spin. The horizon is whirling.',
      doing: 'Kicking against the spin.',
      why: 'Twists on a small, heavily loaded canopy spin up faster than you can kick. Cut away.' },
    bagLock: { name: 'Bag lock', fix: false, fps: 132, clear: 3,
      see: 'You felt a tug but there is no canopy. The bag is trailing above you, still closed.',
      doing: 'Shaking the risers.',
      why: 'A bag lock will not clear. Cut away and pull the reserve.' },
    pcTow: { name: 'Pilot chute in tow', fix: false, total: true, clear: 3,
      see: 'You threw the pilot chute and nothing happened. You are still at freefall speed with it trailing behind you.',
      doing: 'Reaching back and trying again.',
      why: 'Nothing is out, so there is nothing to tangle with. Go to the reserve, with or without cutting away first.' },
    // only ever caused by opening on top of another jumper
    wrap: { name: 'Canopy wrap', fix: false, fps: 62, clear: 3,
      see: 'You opened right beside your partner and flew into the other canopy. Its fabric is wound through your lines and both of you are going down.',
      doing: 'Pulling fabric off the lines.',
      why: 'A wrap comes from opening without separation. With height in hand, cut away from it.' }
  };
  var GOOD_SEE = 'It is there, it is square and the slider is down. The lines run straight.';

  var POINTS = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
  function compass(dir) { return POINTS[Math.round(((dir % 360) + 360) % 360 / 22.5) % 16]; }
  function ft(n) { return Math.round(n).toLocaleString('en-US') + ' ft'; }
  function miles(d) { return d < 900 ? ft(Math.round(d / 10) * 10) : (d / 5280).toFixed(1) + ' mi'; }
  function bearing(x, y) { return (Math.atan2(x, y) * 180 / Math.PI + 360) % 360; }
  function windText(sc) {
    var g = sc.wind.ground;
    if (g.gust < 2) return 'calm';
    return (g.gust > g.spd ? g.spd + ' gusting ' + g.gust : g.spd) + ' mph';
  }

  // ---- rolling a day ---------------------------------------------------
  function roll(rnd, seed) {
    var pick = function (arr) { return arr[Math.floor(rnd() * arr.length)]; };
    var key = pick(['Student', 'Student', 'A', 'A', 'B', 'B', 'C', 'D']);
    var L = LICENSES[key];
    var jumps = Math.round(L.jumps[0] + Math.pow(rnd(), key === 'D' ? 2.4 : 1) * (L.jumps[1] - L.jumps[0]));
    var body = Math.round(105 + rnd() * 135), gear = key === 'Student' ? 30 : 25;
    var dz = pick(DZS);
    var tempC = Math.round(P.lerp(dz.temp[0], dz.temp[1], rnd()));

    // wind: mostly light, sometimes not; it veers a little with height and now and then reverses aloft
    var r = rnd(), spd;
    if (r < 0.22) spd = rnd() * 5; else if (r < 0.52) spd = 5 + rnd() * 5;
    else if (r < 0.78) spd = 10 + rnd() * 5; else if (r < 0.94) spd = 15 + rnd() * 7; else spd = 22 + rnd() * 8;
    spd = Math.round(spd);
    var gust = spd + (rnd() < 0.45 ? 0 : Math.round(2 + rnd() * (spd > 12 ? 9 : 5)));
    var dir = Math.round(rnd() * 35) * 10, shear = rnd() < 0.12;
    var layers = [{ alt: 0, spd: spd, dir: dir }], ps = spd, pd = dir;
    [3000, 6000, 9000, 12000, 18000].forEach(function (alt) {
      ps = P.clamp(ps + (alt === 3000 ? 3 + rnd() * 8 + spd * 0.3 : rnd() * 11 - 1), 0, 75);
      pd = pd + rnd() * 20 - 6 + (shear && alt === 6000 ? 150 + rnd() * 60 : 0);
      layers.push({ alt: alt, spd: Math.round(ps), dir: ((Math.round(pd / 5) * 5) % 360 + 360) % 360 });
    });

    // the side camera looks across the ground wind, so the landing is always seen in profile
    var fwd = (dir + (rnd() < 0.5 ? 90 : 270)) % 360;
    var view = { fwd: fwd, sin: Math.sin(fwd * RAD), cos: Math.cos(fwd * RAD) };
    layers.forEach(function (l) {
      var v = P.windXY(l.spd, l.dir);
      l.vx = v.x; l.vy = v.y;
      l.wu = v.x * view.cos - v.y * view.sin; l.wv = v.x * view.sin + v.y * view.cos;
    });

    // sky
    var cloud = { cover: 'Clear', base: 0 };
    r = rnd();
    if (r >= 0.42 && r < 0.62) cloud = { cover: rnd() < 0.5 ? 'Few' : 'Scattered', base: pick([3000, 4500, 6000, 8000]) };
    else if (r >= 0.62) cloud = { cover: rnd() < 0.6 ? 'Broken' : 'Overcast', base: pick([2500, 3500, 4500, 6000, 8000, 10500, 12000, 15000]) };

    // aircraft
    var top = dz.elev < 1500 && rnd() < 0.14 ? 18000 : dz.top;
    var oxygen = top + dz.elev > 15000 ? rnd() < 0.55 : false;
    var exits = top === 18000 ? [18000, 13500, 9000, 5000] : [top, 9000, 5000];

    // canopy rack: always holds at least one size inside the ceiling
    var weight = body + gear, idx = 0, i;
    for (i = 0; i < SIZES.length; i++) if (weight / SIZES[i] <= L.wl) idx = i;
    var start = P.clamp(idx - 1 - Math.floor(rnd() * 3), 0, SIZES.length - 5);

    // gear: six items on the bench, at most one of them wrong
    var pool = GEAR.slice(), items = [], j;
    while (items.length < 6) { j = Math.floor(rnd() * pool.length); items.push(pool.splice(j, 1)[0]); }
    var fault = rnd() < 0.55 ? Math.floor(rnd() * 6) : -1;

    // what the main will do when it opens
    var mal = null;
    if (rnd() < 0.34) {
      r = rnd();
      mal = r < 0.32 ? 'twists' : r < 0.47 ? 'cells' : r < 0.67 ? 'lineOver' : r < 0.82 ? 'bagLock' : r < 0.93 ? 'pcTow' : 'spin';
    }
    r = rnd();

    return {
      seed: seed, lic: L,
      jumper: { jumps: jumps, body: body, gear: gear, exitWeight: weight },
      dz: { name: dz.name, elev: dz.elev, tempC: tempC, pal: dz.pal, da: Math.round(P.densityAltitude(dz.elev, tempC) / 100) * 100 },
      dT: tempC - P.isaC(dz.elev),
      wind: { ground: { spd: spd, gust: gust, dir: dir }, layers: layers },
      view: view,
      cloud: cloud,
      light: r < 0.55 ? 'day' : r < 0.8 ? 'late' : 'sunset',
      aircraft: { name: dz.plane, top: top, oxygen: oxygen, exits: exits, load: 1 + Math.floor(rnd() * 14) },
      rack: SIZES.slice(start, start + 5),
      gear: { items: items, fault: fault },
      mal: mal,
      layout: Math.round(rnd() * 35) * 10,
      colors: pick(COLORS),
      rolls: { heading: rnd() * 360, entangle: rnd(), gust: rnd() * 6.28, twist: rnd(), wrap: rnd(), sig: Math.floor(rnd() * 6), side: rnd() < 0.5 ? 1 : -1 }
    };
  }

  function make(seed) {
    var wantNoGo = P.rng(seed)() < 0.24, sc, i;
    for (i = 0; i < 60; i++) {
      sc = roll(P.rng(seed * 131 + i * 7919 + 1), seed);
      if (assess(sc).go !== wantNoGo) break;
    }
    return sc;
  }

  // ---- the rules ---------------------------------------------------------
  function exitStatus(sc, alt) {
    var msl = alt + sc.dz.elev, c = sc.cloud;
    var layer = c.cover === 'Broken' || c.cover === 'Overcast';
    var gap = msl >= 10000 ? 1000 : 500;

    return { alt: alt, msl: msl, cloud: cloud, oxygen: oxygen, ok: !cloud && !oxygen };
  }
  function assess(sc) {
    var L = sc.lic, g = sc.wind.ground, reasons = [];
    var legal = sc.aircraft.exits.filter(function (a) { return exitStatus(sc, a).ok; });
    if (g.gust > L.wind) {
      reasons.push('Ground wind ' + windText(sc) + ' is over the ' + L.wind + ' mph limit for ' +
        (L.key === 'Student' ? 'students.' : L.a + ' here.'));
    }
    if (!legal.length) {
      reasons.push(sc.cloud.cover + ' cloud at ' + ft(sc.cloud.base) + ' leaves no exit that stays clear of it, and you may not jump through cloud.');
    }
    return { go: !reasons.length, reasons: reasons, legal: legal };
  }
  // the malfunction this rig will actually throw, given the canopy chosen
  function malFor(sc, wl) {
    var m = sc.mal;
    if (m === 'spin' && wl < 1.25) m = 'twists';
    if (m === 'twists' && wl >= 1.5) m = 'spin';
    return m;
  }

  // ---- jump run and the dive plan ---------------------------------------------
  // jump run is flown along the camera's left-right axis, into whatever the wind is doing at exit height
  function runFor(sc, exitAlt) {
    var ls = sc.wind.layers, w = P.windVec(ls.map(function (l) { return { alt: l.alt, vx: l.wu, vy: l.wv }; }), exitAlt);
    var dir = Math.abs(w.x) > 4 ? (w.x > 0 ? -1 : 1) : (ls[0].wu > 0 ? -1 : 1);
    var air = 145 * P.speedFactor(exitAlt + sc.dz.elev, sc.dT) * 0.92;
    return { dir: dir, air: air, gs: Math.max(45, air + dir * w.x), head: -dir * w.x };
  }
  function dive(sc, exitAlt) {
    var k = sc.lic.key;
    if (exitAlt <= 5000) {
      return { type: 'hop', pullAlt: exitAlt - 600, breakAlt: 0, who: '', title: 'Hop-n-pop',
        text: 'A low exit. Leave stable, belly to the wind, and pitch within five seconds. No tracking, no tricks.' };
    }
    if (k === 'Student') {
      return { type: 'aff', pullAlt: 5500, breakAlt: 0, who: 'Sam', title: 'AFF with Sam',
        text: 'Your instructor Sam holds on through freefall and gives hand signals. Answer each one. Wave off and pull at 5,500 ft. If you have not pulled by 3,800 ft, Sam pulls for you.' };
    }
    var brk = { A: 5500, B: 5000, C: 4500, D: 4500 }[k], pull = { A: 4000, B: 3500, C: 3000, D: 3000 }[k], swoop = k === 'C' || k === 'D';
    return { type: 'twoWay', pullAlt: pull, breakAlt: brk, who: 'Rae', swoop: swoop, title: '2-way with Rae',
      text: (swoop ? 'Rae leaves first as the base. Dive down to her, stop level, then ' : 'Rae leaves with you. Match her fall rate, slide in level and ') +
        'dock gently: each dock you hold is a point. At ' + ft(brk) + ' break off, turn away and track. Pull at ' + ft(pull) + ' with clear air around you.' };
  }

  // ---- marking the jump ----------------------------------------------------
  function grade(sc, plan, r) {
    var L = sc.lic, rows = [], as = assess(sc), g = sc.wind.ground;
    var wl = sc.jumper.exitWeight / plan.size;
    var airMph = P.canopyAir(wl, sc.dz.elev, sc.dT) / P.MPH;
    var dv = dive(sc, plan.exitAlt), run = runFor(sc, plan.exitAlt), d = r.dive || {};
    var got, note, i;
    function add(label, pts, max, text) { rows.push({ label: label, got: P.clamp(Math.round(pts), 0, max), max: max, note: text }); }
    function along(x, y) {      // where a point sits on jump run, relative to the DZ
      var u = (x * sc.view.cos - y * sc.view.sin) * run.dir;
      return Math.abs(u) < 500 ? 'right over the DZ' : miles(Math.abs(u)) + (u > 0 ? ' past the DZ' : ' short of the DZ');
    }

    // the call
    if (as.go) add('The call', 10, 10, 'Jumpable: wind ' + windText(sc) + ' against a ' + L.wind + ' mph limit, with a legal exit on offer.');
    else add('The call', 0, 10, 'This was a day to stay down. ' + as.reasons.join(' '));

    // gear check
    var f = sc.gear.fault, pk = plan.gearPick, it = f >= 0 ? sc.gear.items[f] : null;
    if (f < 0) add('Gear check', pk < 0 ? 10 : 7, 10, pk < 0 ? 'Nothing was wrong and you did not invent a problem.' : 'That item was fine. Re-doing it cost a minute and nothing else.');
    else if (pk === f) add('Gear check', 10, 10, 'Caught it. ' + it.name + ': ' + it.lesson);
    else add('Gear check', 0, 10, 'Missed. ' + it.name + ': ' + it.bad + ' ' + it.lesson + ' ' +
      (it.effect === 'caught' ? 'Another jumper spotted it on the ride up.' : it.miss));

    // canopy
    var wls = wl.toFixed(2);
    if (wl > L.wl + 0.005) {
      add('Canopy choice', 8 - (wl - L.wl) * 20, 8, 'A ' + plan.size + ' puts you at ' + wls + ', over this game\'s ' + L.wl.toFixed(1) +
        ' ceiling for ' + L.a + '. Speed, and the height a turn costs, both climb with wing loading.');
    } else if (airMph < g.gust + 2 && g.gust >= 8) {
      add('Canopy choice', 4, 8, 'A ' + plan.size + ' at ' + wls + ' is docile, but it flies at about ' + Math.round(airMph) +
        ' mph and the wind was gusting ' + g.gust + '. You had almost no drive into it.');
    } else {
      add('Canopy choice', 8, 8, 'A ' + plan.size + ' at ' + wls + ': inside the ' + L.wl.toFixed(1) + ' ceiling for ' + L.a +
        ', and its ' + Math.round(airMph) + ' mph airspeed beat the wind.');
    }

    // exit altitude
    var es = exitStatus(sc, plan.exitAlt), bad = [];

/* ============================================================

  // the coach on a 2-way: holds a slot, backs off after each dock, breaks off on time
  function stepPartner(h) {

    pt.t += h;

    } else {
      vt = base * (1 + pt.rate + clamp(pt.dz * 0.004, -0.05, 0.05));

  // AFF hand signals: answer each one inside six seconds

    c = sg.cur;

  // ---- controls -------------------------------------------------------------------

    if (a < 0.01 || (J.canopy && J.phase !== 'reserve') || J.over || J.phase === 'ride' || J.phase === 'down') return;
    ux = -hu / sp; uy = -J.vz / sp; len = 14 + sp * 0.22;
    ctx.strokeStyle = 'rgba(255,255,255,' + a.toFixed(3) + ')'; ctx.lineWidth = 1.3; ctx.beginPath();
    for (i = 0; i < J.streaks.length; i++) {
      s = J.streaks[i];
      if (!J.paused) { s.x += ux * dt * sp * 0.006 * s.k; s.y += uy * dt * sp * 0.006 * s.k; }
      if (s.y < -0.05) { s.y = 1.05; s.x = Math.random(); } else if (s.y > 1.05) { s.y = -0.05; s.x = Math.random(); }
      if (s.x < -0.05) s.x = 1.05; else if (s.x > 1.05) s.x = -0.05;
      ctx.moveTo(s.x * W, s.y * H); ctx.lineTo(s.x * W + ux * len * s.k, s.y * H + uy * len * s.k);

  }

  // ---- instruments ------------------------------------------------------------------------
  function hud(cam, v, m) {
    var sc = J.sc, ph = J.phase, R = clamp(m * 0.105, 40, 60), cx = 12 + R, cy = H - 12 - R, i, a, shown = Math.max(0, J.alt + J.altiErr), dv = J.dv;
    var ang = function (alt) { return -Math.PI / 2 + alt / 12000 * TAU; };
    var flying = J.canopy && ph !== 'reserve' && ph !== 'down', narrow = W < 560;

    // analog altimeter: one turn of the needle is 12,000 ft
    ctx.fillStyle = '#f4f1ea'; ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.fill();
    ctx.lineWidth = R * 0.13;
    ctx.strokeStyle = '#d23c33'; ctx.beginPath(); ctx.arc(cx, cy, R * 0.86, ang(0), ang(2500)); ctx.stroke();
    ctx.strokeStyle = '#e8b21e'; ctx.beginPath(); ctx.arc(cx, cy, R * 0.86, ang(2500), ang(3500)); ctx.stroke();
    ctx.strokeStyle = '#0b1620'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.stroke();
    for (i = 0; i < 12; i++) {
      a = ang(i * 1000);
      ctx.lineWidth = 2; ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * R * 0.8, cy + Math.sin(a) * R * 0.8); ctx.lineTo(cx + Math.cos(a) * R * 0.94, cy + Math.sin(a) * R * 0.94); ctx.stroke();
      text(String(i), cx + Math.cos(a) * R * 0.62, cy + Math.sin(a) * R * 0.62, Math.round(R * 0.22), 'center', '#0b1620');
    }
    a = ang(shown % 12000);
    ctx.strokeStyle = '#0b1620'; ctx.lineWidth = 3.5; ctx.lineCap = 'round'; ctx.beginPath();
    ctx.moveTo(cx - Math.cos(a) * R * 0.14, cy - Math.sin(a) * R * 0.14); ctx.lineTo(cx + Math.cos(a) * R * 0.76, cy + Math.sin(a) * R * 0.76); ctx.stroke();
    ctx.lineCap = 'butt'; ctx.fillStyle = '#0b1620'; ctx.beginPath(); ctx.arc(cx, cy, R * 0.08, 0, TAU); ctx.fill();
    if (narrow) { panel(12, cy - R - 34, 2 * R, 28); text((Math.round(shown / 10) * 10).toLocaleString('en-US') + ' ft', 12 + R, cy - R - 20, 14, 'center'); }
    else { panel(cx + R + 8, cy + R - 30, 112, 30); text((Math.round(shown / 10) * 10).toLocaleString('en-US') + ' ft', cx + R + 112, cy + R - 14, 17, 'right'); }

    // speeds, and the wind as the canopy feels it
    var w = P.windVec(J.layers, J.alt), ws = P.hyp(w.x, w.y), lines = [], y, hr, along;
    if (ph === 'ride') lines.push(['OVER GROUND', Math.round(J.run.gs / MPH) + ' mph']);
    else if (flying) {
      hr = J.heading * RAD; along = w.x * Math.sin(hr) + w.y * Math.cos(hr);
      lines.push(['OVER GROUND', Math.round(P.hyp(J.gx, J.gy) / MPH) + ' mph']); lines.push(['SINK', Math.round(J.vz) + ' ft/s']);
      if (ws > 3) lines.push([along < -2 ? 'HEADWIND' : along > 2 ? 'TAILWIND' : 'CROSSWIND', Math.round((Math.abs(along) > 2 ? Math.abs(along) : ws) / MPH) + ' mph']);
    } else if (ph !== 'down') { lines.push(['FALL', Math.round(J.vz / MPH) + ' mph']); if (Math.abs(J.hu + J.thr) > 12) lines.push(['ACROSS', Math.round(Math.abs(J.hu + J.thr) / MPH) + ' mph']); }
    if (J.S > 1.05 && !J.over && ph !== 'down') lines.push(['TIME', '×' + (Math.round(J.S * 10) / 10)]);
    y = H - 12 - lines.length * 22;
    if (lines.length) panel(W - 172, y - 4, 160, lines.length * 22 + 6);
    for (i = 0; i < lines.length; i++) { text(lines[i][0], W - 164, y + 11 + i * 22, 11, 'left', '#a9bccd'); text(lines[i][1], W - 20, y + 11 + i * 22, 15, 'right'); }

    // phase and clock
    var label = { ride: 'JUMP RUN', freefall: 'FREEFALL', deploy: 'OPENING', check: 'CANOPY CHECK', reserve: 'RESERVE', canopy: J.canopy === 'reserve' ? 'UNDER RESERVE' : 'UNDER CANOPY', down: 'ON THE GROUND' }[ph];
    var secs = Math.floor(J.t), clock = Math.floor(secs / 60) + ':' + (secs % 60 < 10 ? '0' : '') + (secs % 60);
    panel(12, 12, 176, 30); text(label, 20, 27, 12, 'left', '#ffb27a'); text(clock, 180, 27, 14, 'right');

    // the job in hand, under the phase box
    var job = '';
    if (ph === 'ride') {
      a = J.run.dir * J.run.u;
      job = Math.abs(a) < 260 ? 'OVER THE DZ' : (Math.abs(a) / MI).toFixed(2) + ' mi ' + (a < 0 ? 'SHORT OF' : 'PAST') + ' THE DZ';
    } else if (ph === 'freefall') {
      if (dv.type === 'twoWay') job = J.alt > dv.breakAlt ? 'DOCKS ' + J.r.dive.docks + ' · BREAK-OFF ' + (dv.breakAlt / 1000) + 'k' : 'TRACK AWAY · ' + SC.ft(Math.round(Math.abs(J.pt.du) / 10) * 10) + ' CLEAR · PULL ' + (dv.pullAlt / 1000) + 'k';
      else if (dv.type === 'aff') job = 'SIGNALS ' + J.r.dive.sigOk + '/' + J.r.dive.sigN + ' · PULL AT 5.5k';
      else job = 'PITCH WITHIN 5 s';
    }
    if (job) { ctx.font = '700 11px ' + FONT; a = ctx.measureText(job).width + 16; panel(12, 46, Math.max(176, a), 24); text(job, 20, 58, 11, 'left'); }
    if (ph === 'ride') {                  // the exit light by the door
      panel(12, 74, 104, 26);
      ctx.fillStyle = J.run.green ? '#3ecf6a' : '#d23c33'; ctx.beginPath(); ctx.arc(26, 87, 7, 0, TAU); ctx.fill();
      text(J.run.green ? 'GREEN' : 'RED', 40, 87, 12, 'left');
    }

    minimap(cam, v, m, ws, w);

    // height above the ground for the last few seconds
    if (flying && J.alt < 250 && !J.over) {
      panel(W / 2 - 66, H * 0.13 - 24, 132, 48);
      text(Math.round(J.alt) + ' ft', W / 2, H * 0.13, 28, 'center', J.alt < 20 ? '#ffb27a' : '#fff');
    }
    if (J.toastT > 0 && !J.over) {
      i = narrow ? 11 : 13; ctx.font = '700 ' + i + 'px ' + FONT; a = Math.min(W - 16, ctx.measureText(J.toast).width + 24);
      ctx.globalAlpha = clamp(J.toastT / 0.4, 0, 1);
      panel(W / 2 - a / 2, H * 0.56 - 15, a, 30);
      ctx.save(); rr(W / 2 - a / 2, H * 0.56 - 15, a, 30, 5); ctx.clip(); text(J.toast, W / 2, H * 0.56, i, 'center', '#ffb27a'); ctx.restore();
      ctx.globalAlpha = 1;
    }
    if (ph === 'freefall' && dv.type === 'aff' && J.alt < 5300 && !J.sig.cur) { panel(W / 2 - 74, H * 0.62, 148, 30); text('SAM: PULL!', W / 2, H * 0.62 + 15, 16, 'center', '#ff8f86'); }
    if (narrow && ph === 'check') return;
  }

  // the overhead map: the same ground seen from above, with the camera's far side at the top
  function minimap(cam, v, m, ws, w) {
    var sc = J.sc, S = Math.round(clamp(m * 0.25, 92, 150)), x0 = W - 12 - S, y0 = 12, d = P.hyp(J.x, J.y), mc, f, p, q, a, wu, wv, yw;
    if (!J.mm) { J.mm = document.createElement('canvas'); J.mmT = 0; }
    f = Math.max(6, (d * 1.25 + 700) * 2 / S);
    if (--J.mmT <= 0 || Math.abs(J.mmF - f) > f * 0.12 || P.hyp(J.x - J.mmX, J.y - J.mmY) > f * 14) {
      J.mmT = 12; J.mmF = f; J.mmX = J.x; J.mmY = J.y;
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      if (J.mm.width !== S * dpr) { J.mm.width = S * dpr; J.mm.height = S * dpr; }
      mc = J.mm.getContext('2d'); mc.setTransform(dpr, 0, 0, dpr, 0, 0);
      WD.draw(mc, S, S, { x: J.x, y: J.y, fpp: f }, sc);
    }
    mc = { x: J.mmX, y: J.mmY, fpp: J.mmF };
    ctx.save(); rr(x0, y0, S, S, 6); ctx.clip();
    ctx.drawImage(J.mm, x0, y0, S, S);
    ctx.fillStyle = 'rgba(8,20,33,.18)'; ctx.fillRect(x0, y0, S, S);
    // jump run, the target, the partner
    p = WD.toScreen(mc, S, S, 0, 0, sc);
    ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 1; ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.moveTo(x0, y0 + p.y); ctx.lineTo(x0 + S, y0 + p.y); ctx.stroke(); ctx.setLineDash([]);
    ctx.strokeStyle = '#ff8b3d'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x0 + p.x, y0 + p.y, 5, 0, TAU); ctx.stroke();
    q = WD.toScreen(mc, S, S, J.x, J.y, sc);
    if (J.pt && J.pt.on && J.pt.mode !== 'canopy') { ctx.fillStyle = J.pt.col; ctx.beginPath(); ctx.arc(x0 + q.x + J.pt.du / mc.fpp, y0 + q.y, 2.5, 0, TAU); ctx.fill(); }
    // you, pointing the way you face or fly
    yw = (J.canopy ? J.heading - sc.view.fwd : J.phase === 'ride' ? (J.run.dir > 0 ? 90 : 270) : J.yaw) * RAD;
    ctx.save(); ctx.translate(x0 + q.x, y0 + q.y); ctx.rotate(yw);
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#0b1620'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(0, -7); ctx.lineTo(5, 6); ctx.lineTo(0, 3); ctx.lineTo(-5, 6); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
    ctx.restore();
    ctx.strokeStyle = 'rgba(8,20,33,.85)'; ctx.lineWidth = 2; rr(x0, y0, S, S, 6); ctx.stroke();
    // the wind where you are, drawn on the map and written under it
    wu = w.x * sc.view.cos - w.y * sc.view.sin; wv = w.x * sc.view.sin + w.y * sc.view.cos;
    if (ws > 2) {
      a = Math.atan2(wu, wv);
      ctx.save(); ctx.translate(x0 + 16, y0 + 16); ctx.rotate(a);
      ctx.fillStyle = '#ff8b3d'; ctx.strokeStyle = 'rgba(8,20,33,.8)'; ctx.lineWidth = 1; ctx.beginPath();
      ctx.moveTo(0, -11); ctx.lineTo(6, -2); ctx.lineTo(2, -2); ctx.lineTo(2, 10); ctx.lineTo(-2, 10); ctx.lineTo(-2, -2); ctx.lineTo(-6, -2); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
    }
    panel(x0, y0 + S + 4, S, 22);
    text('WIND ' + Math.round(ws / MPH) + ' mph ' + (Math.abs(wu) < 3 ? '' : wu > 0 ? '→' : '←'), x0 + S / 2, y0 + S + 15, 11, 'center');
    // north, so the briefing's compass bearings still mean something
    a = -sc.view.fwd * RAD;
    text('N', x0 + S - 12 + Math.sin(a) * 0, y0 + 12, 9, 'center', '#fff');
    ctx.save(); ctx.translate(x0 + S - 12, y0 + 26); ctx.rotate(a); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(0, 6); ctx.lineTo(0, -6); ctx.moveTo(-3, -2); ctx.lineTo(0, -6); ctx.lineTo(3, -2); ctx.stroke(); ctx.restore();
  }

  function drawBanner(label, at) {
    var tw, y = H * at;
    ctx.font = '700 17px ' + FONT; tw = Math.min(W - 24, ctx.measureText(label).width + 40);
    panel(W / 2 - tw / 2, y - 22, tw, 44);
    ctx.save(); rr(W / 2 - tw / 2, y - 22, tw, 44, 5); ctx.clip();
    text(label, W / 2, y, 17, 'center', J.r.level >= 2 ? '#ff8f86' : '#fff');
    ctx.restore();
  }

  SD.JUMP = { start: start, stop: stop, decide: decide, pause: pause, tick: tick, input: input, live: function () { return J; } };
})();
</script>

<script>
/* ============================================================
   quiz.js — ten questions a round: four from the glossary,
   six from the written bank, at least one from every category
   ============================================================ */
(function () {
  'use strict';
  var SD = window.SD;
  var CATS = ['Safety', 'Air and physics', 'Gear', 'Training and procedures'];
  var el = null, qs = [], at = 0, marks = [], picked = -1, onJump = null;

  function shuffle(a) {
    var i, j, t;
    for (i = a.length - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };

  function fromBank(q) {
    return { c: q.c, q: q.q, x: q.x, rev: q.a[0] + '. ' + q.x, opts: shuffle(q.a.map(function (t, i) { return { t: t, ok: i === 0 }; })) };
  }
  // a glossary entry becomes "what does it mean" or, when the definition does not give the word away, "which term is this"
  function fromGlossary(e) {
    var same = SD.GLOSSARY.filter(function (o) { return o !== e && o.g === e.g; });
    var others = shuffle(same.length >= 3 ? same : SD.GLOSSARY.filter(function (o) { return o !== e; })).slice(0, 3);
    var gives = e.d.toLowerCase().indexOf(e.t.split(/[ \/]/)[0].toLowerCase()) >= 0;
    var reverse = !gives && Math.random() < 0.45;
    var opts = [{ t: reverse ? e.t : e.d, ok: true }].concat(others.map(function (o) { return { t: reverse ? o.t : o.d, ok: false }; }));
    return {
      c: 'Lingo',
      q: reverse ? 'Which term is this? “' + e.d + '”' : 'Someone at the DZ says “' + e.t.toLowerCase() + '”. What do they mean?',
      x: e.t + ': ' + e.d, rev: e.t + ': ' + e.d, opts: shuffle(opts)
    };
  }
  function build() {
    var pool = shuffle(SD.QUESTIONS.slice()), take = [], rest = [];
    CATS.forEach(function (c) {
      var i;
      for (i = 0; i < pool.length; i++) if (pool[i].c === c) { take.push(pool.splice(i, 1)[0]); break; }
    });
    rest = pool.slice(0, 2);
    qs = shuffle(take.concat(rest).map(fromBank).concat(shuffle(SD.GLOSSARY.slice()).slice(0, 4).map(fromGlossary)));
    at = 0; marks = []; picked = -1;
  }

  function pips() {
    var out = '', i;
    for (i = 0; i < qs.length; i++) out += '<i class="pip' + (i < marks.length ? (marks[i] ? ' ok' : ' no') : i === at ? ' now' : '') + '"></i>';
    return '<div class="pips" aria-hidden="true">' + out + '</div>';
  }
  function render() {
    if (at >= qs.length) return renderEnd();
    var q = qs[at], done = picked >= 0;
    el.innerHTML = '<div class="quiz">' +
      '<div class="quiz-head"><p class="eyebrow">Question ' + (at + 1) + ' of ' + qs.length + ' · ' + q.c + '</p>' + pips() + '</div>' +
      '<h2>' + esc(q.q) + '</h2>' +
      '<div class="q-opts">' + q.opts.map(function (o, i) {
        var cls = 'q-opt' + (done ? (o.ok ? ' right' : i === picked ? ' wrong' : '') : '');
        return '<button type="button" class="' + cls + '" data-i="' + i + '"' + (done ? ' disabled' : '') + '><span class="q-key">' + 'ABCD'.charAt(i) + '</span><span>' + esc(o.t) + '</span></button>';
      }).join('') + '</div>' +
      (done ? '<div class="q-why"><p><b>' + (q.opts[picked].ok ? 'Right.' : 'Not this time.') + '</b> ' + esc(q.x) + '</p>' +
        '<button type="button" class="btn go" id="q-next">' + (at + 1 < qs.length ? 'Next question' : 'See the result') + '</button></div>' : '') +
      '</div>';
    if (done) { var n = document.getElementById('q-next'); if (n) n.focus({ preventScroll: true }); }
  }
  function renderEnd() {
    var right = marks.filter(Boolean).length, by = {}, miss = [], best;
    qs.forEach(function (q, i) {
      by[q.c] = by[q.c] || [0, 0]; by[q.c][1]++;
      if (marks[i]) by[q.c][0]++; else miss.push(q);
    });
    try { best = +localStorage.getItem('sd101.quiz') || 0; if (right > best) { best = right; localStorage.setItem('sd101.quiz', String(right)); } } catch (e) { best = right; }
    var line = right === qs.length ? 'A clean sheet.' : right >= 8 ? 'Solid. You know your numbers.' :
      right >= 5 ? 'Getting there. The field guide has the ones you missed.' : 'Read the field guide, then come back.';
    el.innerHTML = '<div class="quiz">' +
      '<p class="eyebrow">Quiz complete · best so far ' + best + ' of ' + qs.length + '</p>' +
      '<h2>' + right + ' of ' + qs.length + '</h2><p class="lede">' + line + '</p>' +
      '<div class="score">' + Object.keys(by).map(function (c) {
        var g = by[c][0], m = by[c][1];
        return '<div class="score-row"><span class="score-label">' + c + '</span><span class="pts ' + (g === m ? 'full' : g ? 'part' : 'zero') + '">' + g + '/' + m + '</span><span class="score-note"></span></div>';
      }).join('') + '</div>' +
      (miss.length ? '<h3>Worth another look</h3><ul class="review">' + miss.map(function (q) {
        return '<li><b>' + esc(q.q) + '</b><span>' + esc(q.rev) + '</span></li>';
      }).join('') + '</ul>' : '') +
      '<div class="row"><button type="button" class="btn go" data-q="again">Ten more</button><button type="button" class="btn" data-q="jump">Go and jump</button></div>' +
      '</div>';
  }

  function answer(i) {
    if (picked >= 0 || at >= qs.length || !qs[at].opts[i]) return;
    picked = i; marks.push(qs[at].opts[i].ok); render();
  }
  function next() { if (picked < 0) return; at++; picked = -1; render(); }

  function mount(node, opts) {
    el = node; onJump = opts && opts.jump;
    el.addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('button') : null;
      if (!b) return;
      if (b.hasAttribute('data-i')) answer(+b.getAttribute('data-i'));
      else if (b.id === 'q-next') next();
      else if (b.getAttribute('data-q') === 'again') { build(); render(); }
      else if (b.getAttribute('data-q') === 'jump' && onJump) onJump();
    });
    window.addEventListener('keydown', function (e) {
      if (el.hidden || e.metaKey || e.ctrlKey || e.altKey) return;
      var k = e.key.toLowerCase(), i = '1234'.indexOf(k) >= 0 ? '1234'.indexOf(k) : 'abcd'.indexOf(k);
      if (k.length === 1 && i >= 0 && picked < 0) { answer(i); e.preventDefault(); }
    });
    build(); render();
  }

  SD.QUIZ = { mount: mount };
})();
</script>

<script>
/* ============================================================
   main.js — boot, tabs, the load sheet, the stages before and
   after the jump, the field guide
   ============================================================ */
(function () {
  'use strict';
  var SD = window.SD, P = SD.PHYS, SC = SD.SCEN, WD = SD.WORLD;
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var num = function (n) { return Math.round(n).toLocaleString('en-US'); };
  var deg = function (d) { return ('00' + Math.round(d)).slice(-3) + '°'; };
  var MONO = '"B612 Mono", ui-monospace, Menlo, monospace';

  var sc = null, plan = null, stage = 'call', tab = 'jump', result = null, graded = null, gearDone = false;

  // ---- tabs ---------------------------------------------------------------
  function showTab(name) {
    tab = name;
    ['jump', 'quiz', 'guide'].forEach(function (t) { $('view-' + t).hidden = t !== name; });
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (b) {
      var on = b.getAttribute('data-tab') === name;
      b.classList.toggle('on', on); b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });

  }
  function redraw() { if (stage === 'debrief' && result) { drawProfile(); drawMini(); } }

  // ---- the load sheet -----------------------------------------------------------
  function sec(title, rows) {
    return '<section><h3>' + title + '</h3><dl>' + rows.map(function (r) { return '<div><dt>' + r[0] + '</dt><dd>' + r[1] + '</dd></div>'; }).join('') + '</dl></section>';
  }
  function renderSheet() {
    var j = sc.jumper, d = sc.dz, g = sc.wind.ground, a = sc.aircraft, c = sc.cloud;
    var aloft = sc.wind.layers.filter(function (l) { return l.alt > 0 && l.alt <= Math.max(12000, a.top); }).reverse();
    $('sheet').innerHTML =
      '<div class="sheet-head"><span>Load ' + ('0' + a.load).slice(-2) + '</span><span>' + esc(a.name) + '</span></div>' +
      '<p class="sheet-dz">' + esc(d.name) + '</p>' +
      sec('You', [['License', sc.lic.name], ['Jump number', num(j.jumps + 1)], ['Body weight', j.body + ' lb'], ['Gear', j.gear + ' lb'], ['Exit weight', j.exitWeight + ' lb']]) +
      sec('Field', [['Elevation', num(d.elev) + ' ft MSL'], ['Temperature', d.tempC + '°C / ' + Math.round(d.tempC * 9 / 5 + 32) + '°F'], ['Density altitude', num(d.da) + ' ft']]) +
      sec('Wind', [['Ground', g.gust < 2 ? 'Calm' : SC.windText(sc) + ' from ' + deg(g.dir) + ' ' + SC.compass(g.dir)]].concat(aloft.map(function (l) {

    ctx.fillStyle = '#fff'; ctx.font = '700 10px ' + MONO; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('N', W - 18, 40);

  function bestScore(now) {
    var best = now;
    try { best = Math.max(now, +localStorage.getItem('sd101.jump') || 0); localStorage.setItem('sd101.jump', String(best)); } catch (e) { best = now; }
    return best;
  }

  // ---- the field guide --------------------------------------------------------------------------
  function renderGuide() {
    var NUMS = [
      ['Minimum opening, students and A license', '3,000 ft'], ['Minimum opening, B to D license', '2,500 ft'], ['Minimum opening, tandem', '5,000 ft'],
      ['Decision altitude, students and A license', '2,500 ft'], ['Decision altitude, B to D license', '1,800 ft'], ['No cutaway below about', '1,000 ft'],
      ['AAD fires at about', '750 ft'], ['Height a main needs to open', '500 to 1,000 ft'], ['Student ground-wind limit', '14 mph'],
      ['Oxygen required above', '15,000 ft MSL'], ['Reserve repack, US', 'Every 180 days'], ['Pattern: downwind, base, final', '1,000 / 600 / 300 ft'],
      ['Start the flare at', '10 to 15 ft'], ['Licenses A, B, C, D', '25 / 50 / 200 / 500 jumps'], ['Wing loading', 'Exit weight ÷ canopy area'],
      ['Belly terminal velocity', 'About 120 mph'], ['First 1,000 ft of freefall', 'About 10 s, then 5.5 s per 1,000 ft'], ['Air temperature', '2°C colder per 1,000 ft'],
      ['Wind drift', 'Speed × time: 60 mph is a mile a minute'], ['Cloud', 'Never jump into or through it']
    ];
    var FLY = [
      ['Spotting', 'Jump run is flown into the wind. Leave upwind of the DZ by as far as the wind will carry you back: more wind, later exit.'],
      ['Fall rate', 'Arch harder and you sink; flatten out and you float. Matching another jumper\'s fall rate comes before anything else.'],
      ['Docking', 'Get level first, then close the last few feet slowly. A dock is taken, never hit: closing speed is what funnels formations.'],
      ['The burble', 'Directly above another body the air is dead. Fly over someone and you drop onto them.'],
      ['Break-off', 'At the planned altitude, turn away from the others and track. Separation is what keeps canopies from opening into each other.'],
      ['Wave off and pull', 'Stop tracking, wave off, then pitch from a stable arch. Pulling while unstable invites line twists.'],
      ['Brakes and front risers', 'Half brakes slow the wing and steepen its path into a headwind. Front risers dive it and build speed. Neither belongs near the ground.'],
      ['The glide point', 'The spot on the ground that neither rises nor sinks in your view is where the canopy is taking you. The game marks it with a small ring.'],
      ['PLF', 'If the landing is going to be hard, put feet and knees together and roll.']
    ];
    var L = SC.LICENSES, M = SC.MALS, DV = { Student: 'AFF: signals, pull at 5,500 ft', A: '2-way: break off 5,500, pull 4,000', B: '2-way: break off 5,000, pull 3,500', C: '2-way from above: break off 4,500, pull 3,000', D: '2-way from above: break off 4,500, pull 3,000' };
    var ACT = { twists: 'Kick them out', cells: 'Pump the brakes', lineOver: 'Cut away, then reserve', spin: 'Cut away, then reserve', bagLock: 'Cut away, then reserve', pcTow: 'Reserve, with or without a cutaway', wrap: 'Cut away, height permitting' };
    $('view-guide').innerHTML = '<div class="guide">' +
      '<p class="eyebrow">Read this before the quiz</p><h2>Field guide</h2>' +
      '<p class="lede">The numbers and words the quiz asks about, and that the jump expects you to use without being told.</p>' +
      '<h3>Numbers to know</h3><dl class="nums">' + NUMS.map(function (n) { return '<div><dt>' + n[0] + '</dt><dd>' + n[1] + '</dd></div>'; }).join('') + '</dl>' +
      '<h3>Limits and dive plans by license</h3><div class="tablewrap"><table><thead><tr><th>License</th><th>Jumps</th><th>Wind limit</th><th>Loading ceiling</th><th>Minimum opening</th><th>Decision altitude</th><th>The dive</th></tr></thead><tbody>' +
      Object.keys(L).map(function (k) {
        var l = L[k];
        return '<tr><th>' + l.name + '</th><td>' + (k === 'Student' ? 'under 25' : num(l.jumps[0]) + '+') + '</td><td>' + l.wind + ' mph</td><td>' + l.wl.toFixed(1) + '</td><td>' + num(l.minOpen) + ' ft</td><td>' + num(l.decide) + ' ft</td><td>' + DV[k] + '</td></tr>';
      }).join('') + '</tbody></table></div>' +
      '<p class="fine">Opening and decision altitudes are USPA figures, and so is the 14 mph student wind limit. The other wind limits, every loading ceiling and the dive plans are this game\'s house rules, set in line with common practice. Compare the gust, not the average, with the wind limit. Any exit from 5,000 ft is a hop-n-pop.</p>' +
      '<h3>Flying the jump</h3><dl class="how">' + FLY.map(function (n) { return '<div><dt>' + n[0] + '</dt><dd>' + n[1] + '</dd></div>'; }).join('') + '</dl>' +
      '<h3>Reading what is over your head</h3><div class="tablewrap"><table><thead><tr><th>Problem</th><th>What you see</th><th>What to do</th></tr></thead><tbody>' +
      Object.keys(M).map(function (k) { return '<tr><th>' + M[k].name + '</th><td>' + M[k].see + '</td><td>' + ACT[k] + '</td></tr>'; }).join('') + '</tbody></table></div>' +
      '<h3>Glossary</h3><div class="filter"><label for="g-filter">Find a term</label><input type="search" id="g-filter" placeholder="burble, flare, spot…" autocomplete="off"></div>' +
      '<div id="gloss"></div></div>';
    renderGloss('');
  }
  function renderGloss(q) {
    q = q.trim().toLowerCase();
    var html = SD.GROUPS.map(function (g) {
      var items = SD.GLOSSARY.filter(function (e) { return e.g === g && (!q || (e.t + ' ' + e.d).toLowerCase().indexOf(q) >= 0); });
      if (!items.length) return '';
      return '<section class="gloss-group"><h4>' + g + '</h4><dl>' + items.map(function (e) { return '<div><dt>' + esc(e.t) + '</dt><dd>' + esc(e.d) + '</dd></div>'; }).join('') + '</dl></section>';
    }).join('');
    $('gloss').innerHTML = html || '<p class="fine">No term matches “' + esc(q) + '”.</p>';
  }

  // ---- wiring ---------------------------------------------------------------------------------------
  function door() {
    show('air');
    if (SD.AUDIO) SD.AUDIO.start();
    SD.JUMP.start({ canvas: $('sky'), msg: $('air-msg'), ctl: $('air-ctl'), pause: $('air-pause'), mute: $('air-mute'), sc: sc, plan: plan, done: function (r) {
      SD.JUMP.stop(); result = r; graded = SC.grade(sc, plan, r);
      window.scrollTo(0, 0); show('debrief');
    } });
    try { $('sky').focus({ preventScroll: true }); } catch (e) {}
    $('air').scrollIntoView({ block: 'start' });
  }

  function onStageClick(e) {
    var b = e.target.closest ? e.target.closest('button') : null, act, i;
    if (!b || b.disabled) return;
    act = b.getAttribute('data-act');
    if (b.hasAttribute('data-gear')) { i = +b.getAttribute('data-gear'); plan.gearPick = plan.gearPick === i ? -1 : i; show('gear'); }
    else if (b.hasAttribute('data-size')) { plan.size = +b.getAttribute('data-size'); pressed(b); syncPlan(); }
    else if (b.hasAttribute('data-exit')) { plan.exitAlt = +b.getAttribute('data-exit'); pressed(b); syncPlan(); }
    else if (act === 'go') show('gear');
    else if (act === 'nogo') show(SC.assess(sc).go ? 'wrong' : 'right');
    else if (act === 'force') show('gear');
    else if (act === 'guide') showTab('guide');
    else if (act === 'gear-fix') { gearDone = true; show('gear'); }
    else if (act === 'gear-ok') { plan.gearPick = -1; gearDone = true; show('gear'); }
    else if (act === 'to-plan') show('plan');
    else if (act === 'door') door();
    else if (act === 'new') newDay();
    else if (act === 'retry') { newDay(sc.seed); }
    else if (act === 'quiz') showTab('quiz');
  }
  function pressed(b) {
    Array.prototype.forEach.call(b.parentNode.children, function (o) { o.setAttribute('aria-pressed', o === b ? 'true' : 'false'); });
  }

  function boot(data) {
    data = data || {};
    document.querySelector('.tabs').addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('.tab') : null;
      if (b) showTab(b.getAttribute('data-tab'));
    });
    $('stage').addEventListener('click', onStageClick);
    $('view-guide').addEventListener('input', function (e) { if (e.target.id === 'g-filter') renderGloss(e.target.value); });
    window.addEventListener('resize', redraw);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(redraw);

    renderGuide();
    SD.QUIZ.mount($('view-quiz'), { jump: function () { showTab('jump'); } });
    newDay(data.seed);
    var h = (location.hash || '').slice(1);
    showTab(data.tab || (h === 'quiz' || h === 'guide' ? h : 'jump'));
  }

  // keep the day and the tab when the page is republished under an open viewer
  var hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(function () { return { seed: sc && sc.seed, tab: tab }; });
  if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
})();
</script>
