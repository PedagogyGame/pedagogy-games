<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Chinese Word Study · 701–800</title>
<style>
:root{--ink:#1c1610;--muted:#6a5e4e;--paper:#f6f0e4;--panel:#faf5ea;--line:#d4c6a8;--deep:#120e0a;--good:#5c4020;--bad:#8a3228;--gold:#d4b05a;--jade:#5c4020;--cinnabar:#c24e24}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(1100px 640px at 12% -8%,rgba(194,78,36,.28),transparent 54%),linear-gradient(180deg,#120e0a 0%,#e0d4c0 46%,#1c1610 100%);color:var(--ink);font-family:Georgia,"Times New Roman","Noto Serif SC","Songti SC",serif;overflow:hidden}
.app{height:100vh;display:grid;grid-template-rows:auto 1fr;gap:0}
.topbar{min-height:58px;display:flex;align-items:center;gap:14px;padding:8px 18px;background:linear-gradient(90deg,#120e0a,#5c4020 42%,#c24e24 78%,#120e0a);color:#f6f0e4;border-bottom:3px solid #d4b05a;box-shadow:0 1px 0 #3a1814}
.brand{font-size:18px;font-weight:700;letter-spacing:.06em;white-space:nowrap}.brand small{font-size:12px;font-weight:400;opacity:.72;margin-left:8px}
.progress{flex:1;max-width:460px;height:7px;background:rgba(255,255,255,.14);border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:linear-gradient(90deg,#d4b05a,#c24e24);width:1%;transition:width .25s ease}
.stat{font-size:13px;opacity:.9;white-space:nowrap}.topbtn{border:1px solid rgba(212,176,90,.55);background:transparent;color:#f6f0e4;border-radius:4px;padding:7px 10px;cursor:pointer}
.main{min-height:0;display:grid;grid-template-columns:minmax(400px,46%) 1fr;gap:18px;padding:18px}
.quiz{min-height:0;background:rgba(250,245,234,.98);border:3px solid #5c4020;box-shadow:inset 0 0 0 7px #f3ead8,inset 0 0 0 8px #d4b05a,0 18px 50px rgba(18,14,10,.32);border-radius:2px;padding:20px 24px 16px;display:flex;flex-direction:column;overflow:auto}
.rankline{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.12em}
.character{text-align:center;font-family:"Noto Serif SC","Songti SC","STSong",serif;font-size:clamp(78px,9.2vw,128px);line-height:.95;margin:10px 0 2px;color:#1c1610;text-shadow:0 1px 0 #fff;letter-spacing:.04em}
.pinyin{text-align:center;font-size:clamp(22px,2.4vw,36px);font-style:italic;color:#c24e24;margin:0 0 8px}
.front-pinyin{display:none}.prompt{text-align:center;font-size:15px;margin:2px 0 10px;color:#6a5c68}
button{font:600 13px/1.1 Georgia,serif;letter-spacing:.03em}
.controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:3px 0 8px}.controls .nav{display:flex;gap:6px;margin-right:6px}
.ghost,.action{padding:9px 12px;border-radius:4px;cursor:pointer}.ghost{border:1px solid #5c4020;background:#f6f0e4;color:#120e0a}.action{border:1px solid #5a2410;background:#c24e24;color:#fff}
.reveal{border-top:1px solid #d4c6a8;padding-top:10px;margin-top:2px;animation:fade .18s ease}
.reveal-head{margin-bottom:6px}.reveal-pinyin{font-size:clamp(26px,2.7vw,40px);font-style:italic;color:#c24e24;font-weight:700}
.glosses{font-size:clamp(20px,2vw,30px);line-height:1.25;margin:4px 0 8px;color:#1c1610}.glosses b{color:#c24e24}
.wordtitle,.extitle,.chartitle{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#6a5c68;margin:10px 0 5px;font-weight:700}
.charlist{display:flex;gap:8px;flex-wrap:wrap}
.charchip{background:#f3ead8;border:1px solid #d4c6a8;border-radius:4px;padding:7px 10px;min-width:92px;box-shadow:inset 0 0 0 1px rgba(212,176,90,.35)}
.charchip .wzh{font-family:"Noto Serif SC","Songti SC",serif;font-size:28px;font-weight:700;line-height:1;color:#c24e24}
.charchip .wpy{font-size:13px;font-style:italic;color:#5c4020}.charchip .wen{font-size:12px;color:#5a4c3e}
.examples{display:grid;gap:6px}
.example{padding:7px 10px;background:#f6f0e4;border-left:4px solid #5c4020;border-radius:3px;line-height:1.24}
.example-zh{font-family:"Noto Serif SC","Songti SC",serif;font-size:clamp(18px,1.6vw,24px)}
.example-py{font-size:clamp(13px,1.05vw,16px);font-style:italic;color:#c24e24;margin-top:2px}
.example-en{font-size:clamp(13px,1vw,16px);color:#4a3a2e;margin-top:2px}
.example em{font-style:normal;font-weight:800;color:#c24e24;background:#ead4c0;border-radius:3px;padding:0 .06em}
.flipcard{margin-top:3px;border:1px solid #d4b05a;border-radius:3px;padding:12px 14px;background:#f6f0e4}
.flipcard h3{margin:0 0 7px;font-size:13px;color:#5c4020;text-transform:uppercase;letter-spacing:.1em}
.english-list{font-size:clamp(22px,2vw,32px);line-height:1.25;margin:4px 0 10px}
.flipcard .reveal-pinyin{margin:0 0 6px}
.further{border:1px solid #5c4020;background:transparent;color:#5c4020;border-radius:4px;padding:8px 11px;cursor:pointer}
.imagepane{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;background:rgba(18,14,10,.95);border:3px solid #5c4020;border-radius:2px;overflow:hidden;box-shadow:inset 0 0 0 7px rgba(212,176,90,.28),0 18px 50px rgba(18,14,10,.34)}
.imagepane:before{content:"";position:absolute;inset:9px;border:1px solid rgba(212,176,90,.55);border-radius:1px;pointer-events:none}
.art{display:block;max-width:94%;max-height:90%;width:auto;height:auto;object-fit:contain;filter:saturate(1.02) contrast(1.03);box-shadow:0 8px 32px rgba(0,0,0,.32);transition:opacity .35s ease,transform .35s ease}.art.wide{max-width:98%;max-height:84%}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@media(max-width:900px){body{overflow:auto}.app{height:auto;min-height:100vh}.main{grid-template-columns:1fr;grid-template-rows:auto minmax(360px,55vh)}.quiz{overflow:visible}.imagepane{min-height:420px}.topbar{flex-wrap:wrap}.progress{order:3;flex-basis:100%;max-width:none}}
@media(max-width:520px){.main{padding:9px;gap:9px}.quiz{padding:14px}.brand small{display:none}.character{font-size:72px}.topbar{padding:8px 10px}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">词语 701–800 <small>most common words</small></div>
    <div class="progress"><i id="progressFill"></i></div>
    <div class="stat" id="cardStat"></div>
    <button class="topbtn" id="shuffleBtn">Shuffle</button>
    <button class="topbtn" id="resetBtn">Reset order</button>
  </header>
  <main class="main">
    <section class="quiz">
      <div class="rankline"><span id="rankLabel"></span></div>
      <div class="character" id="char"></div>
      <div class="pinyin front-pinyin" id="pinyin" aria-hidden="true"></div>
      <div class="prompt">Recognize the word first. Reveal for dictionary English, each character, and three fully translated examples.</div>
      <div class="controls">
        <div class="nav"><button class="ghost" id="prevBtn">← Previous</button><button class="ghost" id="nextBtn">Next →</button></div>
        <button class="action" id="revealBtn">Reveal</button>
        <button class="ghost" id="flipBtn">Flip</button>
      </div>
      <div id="detailArea"></div>
    </section>
    <section class="imagepane" id="imagePane">
      <img class="art" id="art" alt="Study image">
    </section>
  </main>
</div>
<script>
const BANK = [{"rank":701,"word":"对于","pinyin":"duì yú","en":["regarding","toward"],"chars":[{"ch":"对","py":"duì","en":"toward; correct"},{"ch":"于","py":"yú","en":"at; in"}],"examples":[{"zh":"对于修桥的事，村里还没拿定主意。","pinyin":"duì yú xiū qiáo de shì, cūn lǐ hái méi ná dìng zhǔ yi.","en":"Regarding the mending of the bridge, the village has not yet made up its mind."},{"zh":"对于外来的人，老人并不见外。","pinyin":"duì yú wài lái de rén, lǎo rén bìng bú jiàn wài.","en":"Toward outsiders the old man is not distant."},{"zh":"对于这口井，大家都十分爱惜。","pinyin":"duì yú zhè kǒu jǐng, dà jiā dōu shí fēn ài xī.","en":"Regarding this well, everyone is extremely careful."}]},{"rank":702,"word":"作为","pinyin":"zuò wéi","en":["as","in the capacity of"],"chars":[{"ch":"作","py":"zuò","en":"do; act as"},{"ch":"为","py":"wéi","en":"as; be"}],"examples":[{"zh":"他作为村长，不能不管这座桥。","pinyin":"tā zuò wéi cūn zhǎng, bù néng bù guǎn zhè zuò qiáo.","en":"As village head, he cannot leave this bridge untended."},{"zh":"这袋米作为给老人的心意。","pinyin":"zhè dài mǐ zuò wéi gěi lǎo rén de xīn yì.","en":"This sack of rice is given as a token to the old man."},{"zh":"作为邻居，他该来帮一把。","pinyin":"zuò wéi lín jū, tā gāi lái bāng yì bǎ.","en":"As a neighbor, he ought to come and lend a hand."}]},{"rank":703,"word":"变成","pinyin":"biàn chéng","en":["become","turn into"],"chars":[{"ch":"变","py":"biàn","en":"change"},{"ch":"成","py":"chéng","en":"become"}],"examples":[{"zh":"这场雨把路变成了泥。","pinyin":"zhè chǎng yǔ bǎ lù biàn chéng le ní.","en":"This rain has turned the road into mud."},{"zh":"孩子几年不见，变成了大人。","pinyin":"hái zi jǐ nián bú jiàn, biàn chéng le dà rén.","en":"The child, unseen for a few years, has become a grown person."},{"zh":"那座破桥变成了新桥。","pinyin":"nà zuò pò qiáo biàn chéng le xīn qiáo.","en":"That broken bridge has become a new one."}]},{"rank":704,"word":"能够","pinyin":"néng gòu","en":["be able to","can"],"chars":[{"ch":"能","py":"néng","en":"can"},{"ch":"够","py":"gòu","en":"enough; able"}],"examples":[{"zh":"今天能够把谷收完就好。","pinyin":"jīn tiān néng gòu bǎ gǔ shōu wán jiù hǎo.","en":"If we can finish bringing in the grain today, that will do."},{"zh":"他能够独自把牛牵回来。","pinyin":"tā néng gòu dú zì bǎ niú qiān huí lai.","en":"He is able to lead the ox back by himself."},{"zh":"这座桥能够再撑一年。","pinyin":"zhè zuò qiáo néng gòu zài chēng yì nián.","en":"This bridge can hold another year."}]},{"rank":705,"word":"刚才","pinyin":"gāng cái","en":["just now","a moment ago"],"chars":[{"ch":"刚","py":"gāng","en":"just"},{"ch":"才","py":"cái","en":"just; only then"}],"examples":[{"zh":"刚才那阵风把帽子吹跑了。","pinyin":"gāng cái nà zhèn fēng bǎ mào zi chuī pǎo le.","en":"That gust just now blew the hat away."},{"zh":"他刚才还在井边。","pinyin":"tā gāng cái hái zài jǐng biān.","en":"He was still by the well a moment ago."},{"zh":"刚才下过一阵雨。","pinyin":"gāng cái xià guo yí zhèn yǔ.","en":"A shower of rain fell just now."}]},{"rank":706,"word":"本来","pinyin":"běn lái","en":["originally","in the first place"],"chars":[{"ch":"本","py":"běn","en":"origin; this"},{"ch":"来","py":"lái","en":"come"}],"examples":[{"zh":"这座桥本来就不结实。","pinyin":"zhè zuò qiáo běn lái jiù bù jié shi.","en":"This bridge was not sturdy in the first place."},{"zh":"他本来想今天就走。","pinyin":"tā běn lái xiǎng jīn tiān jiù zǒu.","en":"He originally meant to go today."},{"zh":"井水本来是甜的。","pinyin":"jǐng shuǐ běn lái shì tián de.","en":"The well water was originally sweet."}]},{"rank":707,"word":"多么","pinyin":"duō me","en":["how","so"],"chars":[{"ch":"多","py":"duō","en":"much"},{"ch":"么","py":"me","en":"particle"}],"examples":[{"zh":"这口井多么深啊。","pinyin":"zhè kǒu jǐng duō me shēn a.","en":"How deep this well is."},{"zh":"孩子走了多么远的路。","pinyin":"hái zi zǒu le duō me yuǎn de lù.","en":"How far the child has walked."},{"zh":"乡亲待人多么厚道。","pinyin":"xiāng qin dài rén duō me hòu dao.","en":"How kindly the villagers treat people."}]},{"rank":708,"word":"那样","pinyin":"nà yàng","en":["like that","that way"],"chars":[{"ch":"那","py":"nà","en":"that"},{"ch":"样","py":"yàng","en":"kind; way"}],"examples":[{"zh":"桥不能修成那样窄。","pinyin":"qiáo bù néng xiū chéng nà yàng zhǎi.","en":"The bridge must not be mended that narrow."},{"zh":"他那样说，大家都不信。","pinyin":"tā nà yàng shuō, dà jiā dōu bú xìn.","en":"He spoke like that, and no one believed it."},{"zh":"天阴成那样，快下雨了。","pinyin":"tiān yīn chéng nà yàng, kuài xià yǔ le.","en":"The sky has clouded over like that; rain is near."}]},{"rank":709,"word":"这边","pinyin":"zhè biān","en":["this side","over here"],"chars":[{"ch":"这","py":"zhè","en":"this"},{"ch":"边","py":"biān","en":"side"}],"examples":[{"zh":"桥这边的路比较好走。","pinyin":"qiáo zhè biān de lù bǐ jiào hǎo zǒu.","en":"The road on this side of the bridge is easier to walk."},{"zh":"把牲口赶到河这边来。","pinyin":"bǎ shēng kou gǎn dào hé zhè biān lai.","en":"Drive the livestock over to this side of the river."},{"zh":"老人坐在堂屋这边。","pinyin":"lǎo rén zuò zài táng wū zhè biān.","en":"The old man sits on this side of the main room."}]},{"rank":710,"word":"那边","pinyin":"nà biān","en":["that side","over there"],"chars":[{"ch":"那","py":"nà","en":"that"},{"ch":"边","py":"biān","en":"side"}],"examples":[{"zh":"河那边有几户人家。","pinyin":"hé nà biān yǒu jǐ hù rén jiā.","en":"On that side of the river there are a few households."},{"zh":"把牛牵到山那边去吃草。","pinyin":"bǎ niú qiān dào shān nà biān qù chī cǎo.","en":"Lead the ox to that side of the mountain to graze."},{"zh":"信送到镇那边就行。","pinyin":"xìn sòng dào zhèn nà biān jiù xíng.","en":"It will do to take the letter over to that side of town."}]},{"rank":711,"word":"到处","pinyin":"dào chù","en":["everywhere"],"chars":[{"ch":"到","py":"dào","en":"arrive; to"},{"ch":"处","py":"chù","en":"place"}],"examples":[{"zh":"雨后到处都是泥。","pinyin":"yǔ hòu dào chù dōu shì ní.","en":"After the rain there is mud everywhere."},{"zh":"他到处打听那位木匠。","pinyin":"tā dào chù dǎ ting nà wèi mù jiang.","en":"He inquired everywhere after that carpenter."},{"zh":"村里到处能听见鸡叫。","pinyin":"cūn lǐ dào chù néng tīng jian jī jiào.","en":"Cockcrow can be heard everywhere in the village."}]},{"rank":712,"word":"一边","pinyin":"yì biān","en":["one const IMAGES = ["img/01-chestnut-cart.jpg", "img/02-textile-market.jpg", "img/03-pack-carriers.jpg", "img/04-night-alley.jpg", "img/05-night-market.jpg", "img/06-lantern-canal.jpg", "img/07-phoenix-town-dusk.jpg", "img/08-hill-path.jpg", "img/09-frost-path.jpg", "img/10-yangtze.jpg", "img/11-stone-bridge.jpg", "img/12-tulou-village.jpg", "img/13-wende-bridge.jpg", "img/14-hutong-lane.jpg", "img/15-night-riverside.jpg"];
let order = BANK.map((_,i)=>i), pos=0, state='front';
const $=id=>document.getElementById(id);
function current(){return BANK[order[pos]]}
function safe(t){return String(t).replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>').replace(/"/g,'"').replace(/'/g,'&#039;')}
function mark(sentence,w){return safe(sentence).split(safe(w)).join('<em>'+safe(w)+'</em>')}
function imageForPosition(){const n=IMAGES.length||1;return Math.floor(pos*n/BANK.length)%n}
function setImage(){const idx=imageForPosition(), img=$('art');img.style.opacity=.15;setTimeout(()=>{img.src=IMAGES[idx]; img.onload=()=>{img.classList.toggle('wide',img.naturalWidth/img.naturalHeight>1.75);img.style.opacity=1}},90)}
function renderDetail(mode){const c=current(), d=$('detailArea'); if(mode==='front'){d.innerHTML='';return}
 if(mode==='flip'){d.innerHTML=`<div class="flipcard"><h3>Pinyin + English</h3><div class="reveal-pinyin">${safe(c.pinyin)}</div><div class="english-list">${c.en.map(safe).join(' · ')}</div><button class="further" id="furtherBtn">Reveal further</button></div>`;$('furtherBtn').onclick=()=>{state='revealed';renderDetail('revealed')};return}
 const chars=c.chars.map(w=>`<div class="charchip"><div class="wzh">${safe(w.ch)}</div><div class="wpy">${safe(w.py)}</div><div class="wen">${safe(w.en)}</div></div>`).join('');
 const ex=c.examples.map(x=>`<div class="example"><div class="example-zh">${mark(x.zh,c.word)}</div><div class="example-py">${safe(x.pinyin)}</div><div class="example-en">${safe(x.en)}</div></div>`).join('');

function render(changeImage=true){const c=current();$('char').textContent=c.word;$('pinyin').textContent='';$('rankLabel').textContent=`Word frequency #${c.rank}`;$('cardStat').textContent=`${pos+1} / ${BANK.length}`;$('progressFill').style.width=((pos+1)/BANK.length*100)+'%';state='front';renderDetail('front');if(changeImage)setImage()}
function move(delta){const oldImg=imageForPosition();pos=Math.max(0,Math.min(BANK.length-1,pos+delta));render(imageForPosition()!==oldImg)}
$('prevBtn').onclick=()=>move(-1);$('nextBtn').onclick=()=>move(1);
