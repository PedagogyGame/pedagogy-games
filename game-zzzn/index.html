<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1720">
  <title>Highway 40 Radio Run</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #08131a;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 52% 42%, transparent 25%, rgba(2, 8, 12, .14) 75%, rgba(0, 0, 0, .38) 100%),
        linear-gradient(180deg, rgba(255,255,255,.025), transparent 35%);
      mix-blend-mode: multiply;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .scene-label {
      position: fixed;
      z-index: 3;
      top: max(18px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 13px 8px 10px;
      color: rgba(235, 244, 246, .88);
      background: rgba(7, 16, 21, .36);
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 999px;
      box-shadow: 0 8px 30px rgba(0,0,0,.18);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      font-size: clamp(10px, 1.15vw, 13px);
      font-weight: 650;
      letter-spacing: .13em;
      text-transform: uppercase;
      opacity: 0;
      animation: label-in 4.8s ease both;
      pointer-events: none;
    }

    .scene-label .route {
      display: grid;
      place-items: center;
      width: 31px;
      height: 25px;
      color: white;
      background: #236940;
      border: 2px solid rgba(255,255,255,.92);
      border-radius: 6px 6px 9px 9px;
      font-family: Georgia, serif;
      font-size: 12px;
      letter-spacing: 0;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.13);
    }

    @keyframes label-in {
      0%, 8% { opacity: 0; transform: translate(-50%, -7px); }
      18%, 72% { opacity: 1; transform: translate(-50%, 0); }
      100% { opacity: .35; transform: translate(-50%, 0); }
    }

    @media (max-width: 640px) {
      .scene-label { top: 10px; }
      .scene-label .route { width: 28px; height: 23px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .scene-label { animation: none; opacity: .5; }
    }
  </style>
</head>
<body>
  <canvas id="scene" role="img" aria-label="Animated over-the-shoulder view of a truck driver cruising east on Highway 40 through Missouri farmland, woodland, suburbs, and the St. Louis approach."></canvas>
  <div class="scene-label" aria-hidden="true">
    <span class="route">40</span>
    <span>Eastbound · Radio Run</span>
  </div>

  <script>
    (() => {
      "use strict";

      const canvas = document.querySelector("#scene");
      const ctx = canvas.getContext("2d", { alpha: false });
      const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

      let width = 0;
      let height = 0;
      let dpr = 1;
      let last = performance.now();
      let elapsed = 0;
      let roadTravel = 0;
      let pointerX = 0;
      let pointerY = 0;

      const vehicles = [
        { lane: -0.34, z: .30, speed: .72, color: "#bfc6c8", kind: "car" },
        { lane: .34, z: .54, speed: .48, color: "#8e2f2b", kind: "car" },
        { lane: -.34, z: .79, speed: .36, color: "#e6e3db", kind: "box" },
        { lane: .35, z: .90, speed: .27, color: "#335c72", kind: "car" },
        { lane: -.02, z: .67, speed: .31, color: "#d5a749", kind: "car" },
        { lane: .66, z: .42, speed: .88, color: "#f0f1ec", kind: "car" }
      ];

      const roadside = Array.from({ length: 46 }, (_, i) => ({
        side: i % 2 ? 1 : -1,
        z: ((i * .079) + .04) % 1,
        size: .7 + ((i * 37) % 10) / 15,
        type: i % 9 === 0 ? "lamp" : i % 6 === 0 ? "pole" : "tree"
      }));

      const cloudBands = Array.from({ length: 11 }, (_, i) => ({
        x: ((i * .143) + .06) % 1,
        y: .11 + ((i * 23) % 17) / 100,
        size: .55 + ((i * 31) % 9) / 10,
        speed: .0006 + (i % 4) * .00018,
        alpha: .13 + (i % 3) * .07
      }));

      const mod = (value, divisor = 1) => ((value % divisor) + divisor) % divisor;

      function resize() {
        dpr = Math.min(devicePixelRatio || 1, 2);
        width = innerWidth;
        height = innerHeight;
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      addEventListener("resize", resize, { passive: true });
      addEventListener("pointermove", (event) => {
        pointerX = (event.clientX / Math.max(width, 1) - .5) * 2;
        pointerY = (event.clientY / Math.max(height, 1) - .5) * 2;
      }, { passive: true });
      resize();

      function roundedRect(x, y, w, h, r) {
        const radius = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, radius);
      }

      function ellipse(x, y, rx, ry, fill, rotation = 0) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rotation);
        ctx.beginPath();
        ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
        ctx.fillStyle = fill;
        ctx.fill();
        ctx.restore();
      }

      function windshieldPath() {
        ctx.beginPath();
        ctx.moveTo(width * .075, height * .075);
        ctx.quadraticCurveTo(width * .5, height * .025, width * .93, height * .075);
        ctx.lineTo(width * .865, height * .695);
        ctx.quadraticCurveTo(width * .52, height * .735, width * .145, height * .69);
        ctx.closePath();
      }

      function project(z, lane = 0) {
        const horizonY = height * .385;
        const p = Math.max(0, Math.min(1, 1 - z));
        const eased = p * p;
        const roadHalf = width * (.025 + eased * .51);
        return {
          x: width * .545 + lane * roadHalf * 1.42,
          y: horizonY + eased * height * .58,
          scale: .04 + eased * 1.18,
          roadHalf
        };
      }

      function drawOutside() {
        const horizonY = height * .385;

        const journey = mod(elapsed / 24, 4);
        const segment = Math.floor(journey);
        const blend = journey - segment;
        const daylight = .5 + Math.sin(elapsed * .035) * .5;

        const sky = ctx.createLinearGradient(0, 0, 0, horizonY * 1.2);
        sky.addColorStop(0, daylight > .18 ? "#6f9fb5" : "#536f7c");
        sky.addColorStop(.5, daylight > .18 ? "#b7d4da" : "#91aab0");
        sky.addColorStop(1, daylight > .18 ? "#eadfce" : "#d0c6b7");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, width, horizonY + 12);

        const sunX = width * (.72 + Math.sin(elapsed * .02) * .07);
        const sunGlow = ctx.createRadialGradient(sunX, height * .18, 1, sunX, height * .18, height * .26);
        sunGlow.addColorStop(0, "rgba(255,248,218,.62)");
        sunGlow.addColorStop(.38, "rgba(255,235,191,.14)");
        sunGlow.addColorStop(1, "rgba(255,235,191,0)");
        ctx.fillStyle = sunGlow;
        ctx.fillRect(0, 0, width, horizonY);

        drawMovingSky();
        drawWorldBackdrop(segment, 1 - smoothStep(.58, 1, blend));
        drawWorldBackdrop((segment + 1) % 4, smoothStep(.58, 1, blend));

        const grass = ctx.createLinearGradient(0, horizonY, 0, height);
        grass.addColorStop(0, segment === 2 ? "#6d7f56" : "#77885c");
        grass.addColorStop(.42, segment === 3 ? "#5b6b48" : "#5e744a");
        grass.addColorStop(1, "#354a31");
        ctx.fillStyle = grass;
        ctx.fillRect(0, horizonY, width, height - horizonY);

        drawFieldBands(segment);

        ctx.fillStyle = "#26303a";
        ctx.beginPath();
        ctx.moveTo(width * .52, horizonY);
        ctx.lineTo(width * 1.13, height);
        ctx.lineTo(width * -.08, height);
        ctx.closePath();
        ctx.fill();

        const roadGlow = ctx.createLinearGradient(0, horizonY, 0, height);
        roadGlow.addColorStop(0, "rgba(255,255,255,.05)");
        roadGlow.addColorStop(.55, "rgba(255,255,255,.015)");
        roadGlow.addColorStop(1, "rgba(0,0,0,.16)");
        ctx.fillStyle = roadGlow;
        ctx.beginPath();
        ctx.moveTo(width * .52, horizonY);
        ctx.lineTo(width * 1.13, height);
        ctx.lineTo(width * -.08, height);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = "rgba(221,216,195,.82)";
        ctx.lineWidth = Math.max(1, width * .003);
        ctx.beginPath();
        ctx.moveTo(width * .503, horizonY);
        ctx.lineTo(width * -.05, height);
        ctx.moveTo(width * .537, horizonY);
        ctx.lineTo(width * 1.11, height);
        ctx.stroke();

        drawLaneDashes(-.335);
        drawLaneDashes(.335);

        ctx.strokeStyle = "rgba(143,146,139,.55)";
        ctx.lineWidth = Math.max(1, width * .0022);
        ctx.beginPath();
        ctx.moveTo(width * .49, horizonY + 4);
        ctx.lineTo(width * -.13, height * .85);
        ctx.moveTo(width * .55, horizonY + 4);
        ctx.lineTo(width * 1.16, height * .85);
        ctx.stroke();

        drawDistantTraffic();
        drawRoadside();
        drawJourneyLandmarks(segment);
        drawHighwaySign();
        drawTraffic();
        drawOverpass();
      }

      function smoothStep(edge0, edge1, value) {
        const x = Math.max(0, Math.min(1, (value - edge0) / (edge1 - edge0)));
        return x * x * (3 - 2 * x);
      }

      function drawMovingSky() {
        for (const cloud of cloudBands) {
          const x = mod(cloud.x + elapsed * cloud.speed, 1.25) * width - width * .12;
          const y = cloud.y * height;
          const w = width * .075 * cloud.size;
          const h = height * .011 * cloud.size;
          ellipse(x, y, w, h, `rgba(255,255,255,${cloud.alpha})`);
          ellipse(x + w * .44, y - h * .32, w * .64, h * .82, `rgba(255,255,255,${cloud.alpha * .82})`);
          ellipse(x - w * .42, y + h * .14, w * .52, h * .56, `rgba(255,255,255,${cloud.alpha * .64})`);
        }

        ctx.strokeStyle = "rgba(38,55,58,.42)";
        ctx.lineWidth = Math.max(1, width * .0012);
        for (let i = 0; i < 4; i++) {
          const bx = mod(.18 + i * .045 + elapsed * .0018, 1.05) * width;
          const by = height * (.23 + Math.sin(elapsed * .45 + i) * .008);
          ctx.beginPath();
          ctx.arc(bx, by, width * .006, Math.PI * 1.08, Math.PI * 1.82);
          ctx.arc(bx + width * .011, by, width * .006, Math.PI * 1.18, Math.PI * 1.92);
          ctx.stroke();
        }
      }

      function drawWorldBackdrop(segment, alpha) {
        if (alpha <= .001) return;
        const horizonY = height * .385;
        ctx.save();
        ctx.globalAlpha = alpha;

        if (segment === 0) {
          ctx.fillStyle = "#6e8060";
          ctx.beginPath();
          ctx.moveTo(0, horizonY + 8);
          for (let i = 0; i <= 10; i++) {
            const x = width * i / 10;
            const y = horizonY - height * (.018 + Math.sin(i * .9 + elapsed * .015) * .014);
            ctx.lineTo(x, y);
          }
          ctx.lineTo(width, horizonY + 20);
          ctx.closePath();
          ctx.fill();
          drawFarmHorizon();
        } else if (segment === 1) {
          ctx.fillStyle = "#4c684e";
          ctx.beginPath();
          ctx.moveTo(0, horizonY + 12);
          for (let i = 0; i <= 24; i++) {
            const x = width * i / 24;
            const crown = Math.abs(Math.sin(i * 2.17)) * height * .035;
            ctx.lineTo(x, horizonY - crown - height * .01);
          }
          ctx.lineTo(width, horizonY + 16);
          ctx.closePath();
          ctx.fill();
        } else if (segment === 2) {
          drawSuburbanHorizon();
        } else {
          drawCityHorizon();
        }
        ctx.restore();
      }

      function drawFarmHorizon() {
        const y = height * .365;
        const x = width * .23;
        ctx.fillStyle = "#874934";
        ctx.fillRect(x, y - height * .034, width * .052, height * .034);
        ctx.fillStyle = "#d3c6ab";
        ctx.beginPath();
        ctx.moveTo(x - width * .006, y - height * .034);
        ctx.lineTo(x + width * .026, y - height * .064);
        ctx.lineTo(x + width * .059, y - height * .034);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "#b8bbb0";
        ctx.fillRect(x + width * .071, y - height * .05, width * .019, height * .05);
        ellipse(x + width * .0805, y - height * .052, width * .0095, height * .007, "#d1d4c8");
      }

      function drawSuburbanHorizon() {
        const y = height * .388;
        const colors = ["#87908c", "#6f7c7e", "#95958a", "#747f78"];
        for (let i = 0; i < 18; i++) {
          const w = width * (.027 + (i % 4) * .008);
          const h = height * (.026 + (i % 5) * .008);
          const x = width * (i / 17) - w * .3;
          ctx.fillStyle = colors[i % colors.length];
          ctx.fillRect(x, y - h, w, h);
          ctx.fillStyle = "rgba(216,226,221,.32)";
          for (let j = 0; j < 3; j++) ctx.fillRect(x + w * (.15 + j * .28), y - h * .72, w * .12, h * .16);
        }

        const tx = width * .76;
        ctx.strokeStyle = "#697677";
        ctx.lineWidth = Math.max(2, width * .002);
        ctx.beginPath();
        ctx.moveTo(tx, y);
        ctx.lineTo(tx, y - height * .098);
        ctx.stroke();
        ellipse(tx, y - height * .1, width * .025, height * .018, "#839698");
        ctx.fillStyle = "rgba(240,242,235,.8)";
        ctx.font = `700 ${Math.max(5, width * .007)}px system-ui`;
        ctx.textAlign = "center";
        ctx.fillText("40", tx, y - height * .098);
      }

      function drawCityHorizon() {
        const y = height * .388;
        const center = width * .56;
        const widths = [.025,.036,.02,.052,.028,.042,.022,.035,.027,.046,.021,.033];
        for (let i = 0; i < widths.length; i++) {
          const x = width * (.27 + i * .042);
          const w = width * widths[i];
          const h = height * (.032 + ((i * 29) % 9) * .009);
          ctx.fillStyle = i % 2 ? "#68777b" : "#788486";
          ctx.fillRect(x, y - h, w, h);
          ctx.fillStyle = "rgba(225,232,225,.28)";
          for (let row = 0; row < 3; row++) {
            ctx.fillRect(x + w * .18, y - h * (.25 + row * .23), w * .15, Math.max(1, h * .055));
            ctx.fillRect(x + w * .64, y - h * (.25 + row * .23), w * .15, Math.max(1, h * .055));
          }
        }

        ctx.strokeStyle = "rgba(201,211,208,.95)";
        ctx.lineWidth = Math.max(2, width * .003);
        ctx.beginPath();
        ctx.moveTo(center - width * .034, y);
        ctx.bezierCurveTo(center - width * .03, y - height * .15, center - width * .012, y - height * .19, center, y - height * .194);
        ctx.bezierCurveTo(center + width * .012, y - height * .19, center + width * .03, y - height * .15, center + width * .034, y);
        ctx.stroke();
      }

      function drawFieldBands(segment) {
        if (segment === 2 || segment === 3) return;
        ctx.save();
        ctx.globalAlpha = segment === 0 ? .24 : .1;
        ctx.strokeStyle = segment === 0 ? "#c1aa66" : "#405e3d";
        ctx.lineWidth = Math.max(1, width * .0016);
        for (let i = 0; i < 13; i++) {
          const y = height * (.41 + i * .035);
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.quadraticCurveTo(width * .22, y - height * .03, width * .39, height * .39);
          ctx.moveTo(width, y);
          ctx.quadraticCurveTo(width * .82, y - height * .03, width * .65, height * .39);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawDistantTraffic() {
        for (let i = 0; i < 10; i++) {
          const z = .72 + mod(i * .073 - elapsed * .0028, .27);
          const lane = [-.66, -.33, 0, .33, .66][i % 5];
          const p = project(z, lane);
          ellipse(p.x - p.scale * 2, p.y - p.scale * 2, Math.max(1, p.scale * 2.1), Math.max(.6, p.scale), "rgba(192,49,38,.76)");
          ellipse(p.x + p.scale * 2, p.y - p.scale * 2, Math.max(1, p.scale * 2.1), Math.max(.6, p.scale), "rgba(192,49,38,.76)");
        }
      }

      function drawLaneDashes(lane) {
        for (let i = 0; i < 18; i++) {
          const z1 = mod(i / 18 - roadTravel, 1);
          const z2 = Math.min(1, z1 + .028);
          const a = project(z1, lane);
          const b = project(z2, lane);
          const w1 = Math.max(1, a.scale * width * .009);
          const w2 = Math.max(.6, b.scale * width * .009);
          ctx.fillStyle = "rgba(238,235,217,.93)";
          ctx.beginPath();
          ctx.moveTo(a.x - w1, a.y);
          ctx.lineTo(a.x + w1, a.y);
          ctx.lineTo(b.x + w2, b.y);
          ctx.lineTo(b.x - w2, b.y);
          ctx.closePath();
          ctx.fill();
        }
      }

      function drawRoadside() {
        const drift = elapsed * .055;
        for (const item of roadside) {
          const z = mod(item.z - drift, 1);
          const p = project(z, item.side * 1.32);
          if (p.y < height * .36) continue;
          if (item.type === "pole" || item.type === "lamp") {
            ctx.strokeStyle = "rgba(54,59,55,.72)";
            ctx.lineWidth = Math.max(1, p.scale * 2.2);
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p.x, p.y - height * .18 * p.scale);
            ctx.stroke();
            if (item.type === "lamp") {
              ctx.beginPath();
              ctx.moveTo(p.x, p.y - height * .18 * p.scale);
              ctx.lineTo(p.x - item.side * width * .018 * p.scale, p.y - height * .18 * p.scale);
              ctx.stroke();
              ellipse(p.x - item.side * width * .02 * p.scale, p.y - height * .178 * p.scale, Math.max(1, width * .006 * p.scale), Math.max(.7, height * .003 * p.scale), "rgba(238,226,181,.76)");
            }
            continue;
          }
          const treeH = height * .13 * p.scale * item.size;
          const treeW = treeH * .45;
          ctx.fillStyle = "rgba(51,57,40,.76)";
          ctx.fillRect(p.x - treeW * .07, p.y - treeH * .42, treeW * .14, treeH * .42);
          ellipse(p.x, p.y - treeH * .64, treeW, treeH * .5, "rgba(45,75,43,.92)");
          ellipse(p.x - treeW * .35, p.y - treeH * .52, treeW * .62, treeH * .37, "rgba(58,91,51,.9)");
          ellipse(p.x + treeW * .34, p.y - treeH * .49, treeW * .58, treeH * .35, "rgba(40,70,41,.88)");
        }
      }

      function drawJourneyLandmarks(segment) {
        const cycle = mod(elapsed, 29) / 29;
        const z = .94 - cycle * .9;
        if (z < .04) return;
        const side = segment % 2 ? -1 : 1;
        const p = project(z, side * 1.65);
        const s = p.scale * Math.min(width / 1150, height / 700);
        if (s < .03) return;

        if (segment === 0) drawBarn(p.x, p.y, s);
        else if (segment === 1) drawBillboard(p.x, p.y, s);
        else if (segment === 2) drawServiceStop(p.x, p.y, s);
        else drawOfficeCluster(p.x, p.y, s);
      }

      function drawBarn(x, y, s) {
        const w = 112 * s;
        const h = 66 * s;
        ctx.fillStyle = "#7e3f31";
        ctx.fillRect(x - w / 2, y - h, w, h);
        ctx.fillStyle = "#d3c6ac";
        ctx.beginPath();
        ctx.moveTo(x - w * .58, y - h);
        ctx.lineTo(x, y - h * 1.55);
        ctx.lineTo(x + w * .58, y - h);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = "rgba(238,224,198,.72)";
        ctx.lineWidth = Math.max(1, 3 * s);
        ctx.strokeRect(x - w * .18, y - h * .58, w * .36, h * .58);
        ctx.beginPath();
        ctx.moveTo(x - w * .18, y - h * .58);
        ctx.lineTo(x + w * .18, y);
        ctx.moveTo(x + w * .18, y - h * .58);
        ctx.lineTo(x - w * .18, y);
        ctx.stroke();
      }

      function drawBillboard(x, y, s) {
        const w = 128 * s;
        const h = 54 * s;
        ctx.strokeStyle = "#555f5e";
        ctx.lineWidth = Math.max(1, 4 * s);
        ctx.beginPath();
        ctx.moveTo(x - w * .31, y);
        ctx.lineTo(x - w * .31, y - h * .96);
        ctx.moveTo(x + w * .31, y);
        ctx.lineTo(x + w * .31, y - h * .96);
        ctx.stroke();
        roundedRect(x - w / 2, y - h * 1.55, w, h, 4 * s);
        ctx.fillStyle = "#d9c987";
        ctx.fill();
        ctx.strokeStyle = "#475556";
        ctx.lineWidth = Math.max(1, 2 * s);
        ctx.stroke();
        ctx.fillStyle = "#334c4b";
        ctx.font = `800 ${Math.max(5, 15 * s)}px system-ui`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("KEEP ROLLING", x, y - h * 1.24);
      }

      function drawServiceStop(x, y, s) {
        const w = 150 * s;
        const h = 44 * s;
        ctx.fillStyle = "#d6d3c7";
        ctx.fillRect(x - w / 2, y - h, w, h);
        ctx.fillStyle = "#315d69";
        ctx.fillRect(x - w * .56, y - h * 1.22, w * 1.12, h * .28);
        ctx.fillStyle = "#26383f";
        for (let i = 0; i < 4; i++) ctx.fillRect(x - w * .38 + i * w * .23, y - h * .7, w * .13, h * .37);
        ctx.strokeStyle = "#637171";
        ctx.lineWidth = Math.max(1, 3 * s);
        ctx.beginPath();
        ctx.moveTo(x + w * .65, y);
        ctx.lineTo(x + w * .65, y - h * 2.3);
        ctx.stroke();
        roundedRect(x + w * .49, y - h * 2.65, w * .32, h * .45, 3 * s);
        ctx.fillStyle = "#286445";
        ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.font = `700 ${Math.max(4, 10 * s)}px system-ui`;
        ctx.textAlign = "center";
        ctx.fillText("FUEL", x + w * .65, y - h * 2.42);
      }

      function drawOfficeCluster(x, y, s) {
        const w = 58 * s;
        for (let i = 0; i < 3; i++) {
          const bx = x + (i - 1) * w * .72;
          const bh = (72 + i * 24) * s;
          ctx.fillStyle = i % 2 ? "#6f7e82" : "#879296";
          ctx.fillRect(bx - w * .35, y - bh, w * .7, bh);
          ctx.fillStyle = "rgba(211,228,228,.45)";
          for (let row = 0; row < 5; row++) {
            ctx.fillRect(bx - w * .22, y - bh + bh * (.12 + row * .17), w * .14, Math.max(1, 4 * s));
            ctx.fillRect(bx + w * .08, y - bh + bh * (.12 + row * .17), w * .14, Math.max(1, 4 * s));
          }
        }
      }

      function drawHighwaySign() {
        const cycle = mod(elapsed + 8, 31) / 31;
        const z = .95 - cycle * .9;
        const p = project(Math.max(.05, z), 1.27);
        const scale = p.scale * Math.min(width / 1200, height / 720) * 1.5;
        const sw = 132 * scale;
        const sh = 70 * scale;
        if (sw < 8 || p.x > width * 1.05) return;

        ctx.strokeStyle = "#6f7471";
        ctx.lineWidth = Math.max(1, 4 * scale);
        ctx.beginPath();
        ctx.moveTo(p.x - sw * .32, p.y);
        ctx.lineTo(p.x - sw * .32, p.y - sh * 1.04);
        ctx.moveTo(p.x + sw * .32, p.y);
        ctx.lineTo(p.x + sw * .32, p.y - sh * 1.04);
        ctx.stroke();

        const sx = p.x - sw / 2;
        const sy = p.y - sh * 1.1;
        roundedRect(sx, sy, sw, sh, 5 * scale);
        ctx.fillStyle = "#286445";
        ctx.fill();
        ctx.strokeStyle = "rgba(242,247,239,.92)";
        ctx.lineWidth = Math.max(1, 2.4 * scale);
        ctx.stroke();

        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#fff";
        ctx.font = `700 ${Math.max(5, 14 * scale)}px system-ui`;
        ctx.fillText("US 40  EAST", p.x, sy + sh * .33);
        ctx.font = `600 ${Math.max(4, 10 * scale)}px system-ui`;
        ctx.fillText("ST. LOUIS", p.x, sy + sh * .68);
      }

      function drawTraffic() {
        for (let index = 0; index < vehicles.length; index++) {
          const vehicle = vehicles[index];
          const z = mod(vehicle.z - elapsed * (.010 + vehicle.speed * .012), 1);
          const laneDrift = Math.sin(elapsed * .17 + index * 2.3) * .018;
          const p = project(z, vehicle.lane + laneDrift);
          const s = p.scale * Math.min(width / 1100, height / 650);
          if (s < .05) continue;
          const carW = (vehicle.kind === "box" ? 62 : 52) * s;
          const carH = (vehicle.kind === "box" ? 70 : 38) * s;
          const x = p.x - carW / 2;
          const y = p.y - carH;

          ctx.save();
          ctx.shadowColor = "rgba(0,0,0,.32)";
          ctx.shadowBlur = 11 * s;
          ctx.shadowOffsetY = 5 * s;
          roundedRect(x, y, carW, carH, 7 * s);
          ctx.fillStyle = vehicle.color;
          ctx.fill();
          ctx.restore();

          if (vehicle.kind === "car") {
            roundedRect(x + carW * .16, y + carH * .13, carW * .68, carH * .3, 3 * s);
            ctx.fillStyle = "#33424a";
            ctx.fill();
          } else {
            ctx.fillStyle = "rgba(255,255,255,.16)";
            ctx.fillRect(x + carW * .09, y + carH * .11, carW * .82, carH * .05);
          }

          ellipse(x + carW * .18, y + carH * .78, carW * .08, carH * .075, "#b63129");
          ellipse(x + carW * .82, y + carH * .78, carW * .08, carH * .075, "#b63129");
          ctx.fillStyle = "rgba(245,239,211,.9)";
          ctx.fillRect(x + carW * .39, y + carH * .76, carW * .22, Math.max(1, carH * .07));
        }
      }

      function drawOverpass() {
        const cycle = mod(elapsed + 3, 41) / 41;
        const z = .97 - cycle * .95;
        if (z <= .025) return;
        const p = project(z, 0);
        const s = p.scale * Math.min(width / 1000, height / 620);
        const span = Math.max(width * .05, 520 * s);
        const deckH = Math.max(3, 26 * s);
        const deckY = p.y - Math.max(height * .035, 125 * s);

        ctx.fillStyle = "#697275";
        ctx.fillRect(p.x - span / 2, deckY, span, deckH);
        ctx.fillStyle = "#4d5659";
        ctx.fillRect(p.x - span / 2, deckY + deckH * .72, span, deckH * .45);
        ctx.fillStyle = "#777d7b";
        ctx.fillRect(p.x - span * .38, deckY + deckH, Math.max(4, 22 * s), p.y - deckY);
        ctx.fillRect(p.x + span * .36, deckY + deckH, Math.max(4, 22 * s), p.y - deckY);

        if (z < .11) {
          const shade = (1 - z / .11) * .25;
          ctx.fillStyle = `rgba(5,9,11,${shade})`;
          ctx.fillRect(0, 0, width, height);
        }
      }

      function drawGlass() {
        windshieldPath();
        const glass = ctx.createLinearGradient(0, 0, width, height);
        glass.addColorStop(0, "rgba(100,166,187,.055)");
        glass.addColorStop(.55, "rgba(255,255,255,.015)");
        glass.addColorStop(1, "rgba(38,83,102,.075)");
        ctx.fillStyle = glass;
        ctx.fill();

        ctx.save();
        windshieldPath();
        ctx.clip();
        ctx.strokeStyle = "rgba(255,255,255,.08)";
        ctx.lineWidth = width * .018;
        ctx.beginPath();
        ctx.moveTo(width * .58, height * -.02);
        ctx.lineTo(width * .74, height * .62);
        ctx.stroke();
        ctx.restore();
      }

      function drawCabFrame() {
        const roof = ctx.createLinearGradient(0, 0, 0, height * .2);
        roof.addColorStop(0, "#111a20");
        roof.addColorStop(1, "#25323a");
        ctx.fillStyle = roof;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(width, 0);
        ctx.lineTo(width * .93, height * .09);
        ctx.quadraticCurveTo(width * .5, height * .035, width * .075, height * .09);
        ctx.closePath();
        ctx.fill();

        const pillar = ctx.createLinearGradient(0, 0, width * .15, 0);
        pillar.addColorStop(0, "#10181d");
        pillar.addColorStop(.55, "#29373e");
        pillar.addColorStop(1, "#172228");
        ctx.fillStyle = pillar;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(width * .09, height * .06);
        ctx.lineTo(width * .17, height * .73);
        ctx.lineTo(0, height * .83);
        ctx.closePath();
        ctx.fill();

        const pillarRight = ctx.createLinearGradient(width, 0, width * .85, 0);
        pillarRight.addColorStop(0, "#0d151a");
        pillarRight.addColorStop(.55, "#2a373d");
        pillarRight.addColorStop(1, "#172228");
        ctx.fillStyle = pillarRight;
        ctx.beginPath();
        ctx.moveTo(width, 0);
        ctx.lineTo(width * .92, height * .06);
        ctx.lineTo(width * .85, height * .73);
        ctx.lineTo(width, height * .85);
        ctx.closePath();
        ctx.fill();

        drawMirror(width * .035, height * .27, 1);
        drawMirror(width * .91, height * .27, -1);
      }

      function drawMirror(x, y, direction) {
        const mw = Math.max(38, width * .062);
        const mh = Math.max(88, height * .235);
        ctx.save();
        ctx.translate(x, y);
        ctx.strokeStyle = "#11181c";
        ctx.lineWidth = Math.max(4, width * .006);
        ctx.beginPath();
        ctx.moveTo(direction > 0 ? mw * .28 : mw * .72, mh * .12);
        ctx.lineTo(direction > 0 ? mw * -.3 : mw * 1.3, mh * -.12);
        ctx.stroke();

        roundedRect(0, 0, mw, mh, mw * .18);
        ctx.fillStyle = "#0c1317";
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = "#3e4b51";
        ctx.stroke();

        roundedRect(mw * .09, mh * .06, mw * .82, mh * .86, mw * .12);
        const mirror = ctx.createLinearGradient(0, 0, mw, mh);
        mirror.addColorStop(0, "#8bb1bb");
        mirror.addColorStop(.55, "#607c83");
        mirror.addColorStop(1, "#273b42");
        ctx.fillStyle = mirror;
        ctx.fill();

        ctx.save();
        roundedRect(mw * .09, mh * .06, mw * .82, mh * .86, mw * .12);
        ctx.clip();
        ctx.fillStyle = "rgba(35,48,51,.72)";
        ctx.beginPath();
        ctx.moveTo(mw * .15, mh * .44);
        ctx.lineTo(mw * .82, mh * .68);
        ctx.lineTo(mw * .82, mh * .88);
        ctx.lineTo(mw * .15, mh * .88);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = "rgba(240,233,208,.65)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(mw * .48, mh * .54);
        ctx.lineTo(mw * .54, mh * .86);
        ctx.stroke();
        ctx.restore();
        ctx.restore();
      }

      function drawDashboard() {
        const dashY = height * .665;
        const dash = ctx.createLinearGradient(0, dashY, 0, height);
        dash.addColorStop(0, "#253239");
        dash.addColorStop(.12, "#111a1f");
        dash.addColorStop(.57, "#172127");
        dash.addColorStop(1, "#090f13");
        ctx.fillStyle = dash;
        ctx.beginPath();
        ctx.moveTo(0, height * .74);
        ctx.quadraticCurveTo(width * .42, height * .62, width, height * .72);
        ctx.lineTo(width, height);
        ctx.lineTo(0, height);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = "rgba(135,151,156,.2)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(width * .02, height * .737);
        ctx.quadraticCurveTo(width * .43, height * .635, width * .98, height * .716);
        ctx.stroke();

        drawGauge(width * .44, height * .79, Math.min(width, height) * .055, 1.8 + Math.sin(elapsed * .5) * .04, "65");
        drawGauge(width * .55, height * .785, Math.min(width, height) * .049, 2.25 + Math.sin(elapsed * .7) * .025, "RPM");

        const screenX = width * .65;
        const screenY = height * .755;
        const screenW = width * .115;
        const screenH = height * .095;
        roundedRect(screenX, screenY, screenW, screenH, 7);
        ctx.fillStyle = "#070c0f";
        ctx.fill();
        ctx.strokeStyle = "#33434a";
        ctx.lineWidth = 2;
        ctx.stroke();
        roundedRect(screenX + 5, screenY + 5, screenW - 10, screenH - 10, 4);
        const nav = ctx.createLinearGradient(screenX, screenY, screenX, screenY + screenH);
        nav.addColorStop(0, "#173646");
        nav.addColorStop(1, "#10242e");
        ctx.fillStyle = nav;
        ctx.fill();
        ctx.strokeStyle = "#62b6cb";
        ctx.lineWidth = Math.max(2, width * .0018);
        ctx.beginPath();
        ctx.moveTo(screenX + screenW * .12, screenY + screenH * .76);
        ctx.bezierCurveTo(screenX + screenW * .32, screenY + screenH * .25, screenX + screenW * .7, screenY + screenH * .72, screenX + screenW * .9, screenY + screenH * .28);
        ctx.stroke();
        ctx.fillStyle = "rgba(220,241,242,.74)";
        ctx.font = `600 ${Math.max(7, height * .012)}px system-ui`;
        ctx.textAlign = "left";
        ctx.fillText("US-40 E", screenX + 10, screenY + 17);

        for (let i = 0; i < 4; i++) {
          const vx = width * (.79 + i * .042);
          roundedRect(vx, height * .75, width * .026, height * .11, 5);
          ctx.fillStyle = "#080e11";
          ctx.fill();
          ctx.strokeStyle = "rgba(95,113,119,.5)";
          ctx.stroke();
          ctx.strokeStyle = "rgba(98,121,128,.38)";
          ctx.lineWidth = 1;
          for (let l = 0; l < 4; l++) {
            ctx.beginPath();
            ctx.moveTo(vx + width * .005, height * (.765 + l * .021));
            ctx.lineTo(vx + width * .021, height * (.765 + l * .021));
            ctx.stroke();
          }
        }
      }

      function drawGauge(x, y, r, needle, label) {
        const glow = ctx.createRadialGradient(x, y, r * .2, x, y, r * 1.15);
        glow.addColorStop(0, "rgba(78,153,157,.18)");
        glow.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(x, y, r * 1.25, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fillStyle = "#080d10";
        ctx.fill();
        ctx.lineWidth = Math.max(2, r * .06);
        ctx.strokeStyle = "#45545a";
        ctx.stroke();

        ctx.strokeStyle = "rgba(200,220,217,.7)";
        ctx.lineWidth = Math.max(1, r * .025);
        for (let i = 0; i < 11; i++) {
          const a = Math.PI * .75 + i / 10 * Math.PI * 1.5;
          ctx.beginPath();
          ctx.moveTo(x + Math.cos(a) * r * .72, y + Math.sin(a) * r * .72);
          ctx.lineTo(x + Math.cos(a) * r * .88, y + Math.sin(a) * r * .88);
          ctx.stroke();
        }

        ctx.strokeStyle = "#d98f4e";
        ctx.lineWidth = Math.max(2, r * .05);
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + Math.cos(needle) * r * .67, y + Math.sin(needle) * r * .67);
        ctx.stroke();
        ellipse(x, y, r * .08, r * .08, "#c8d1ce");

        ctx.fillStyle = "#a7b9b8";
        ctx.font = `650 ${Math.max(7, r * .2)}px system-ui`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(label, x, y + r * .46);
      }

      function drawDriver() {
        const bob = reduceMotion ? 0 : Math.sin(elapsed * 1.65) * height * .0018;
        const steer = reduceMotion ? 0 : Math.sin(elapsed * .55) * .026;
        const dx = width * (.215 + pointerX * .0025);
        const dy = height * .53 + bob;

        ctx.save();
        ctx.shadowColor = "rgba(0,0,0,.35)";
        ctx.shadowBlur = 24;

        ctx.fillStyle = "#11181c";
        ctx.beginPath();
        ctx.moveTo(width * .05, height);
        ctx.quadraticCurveTo(width * .08, height * .7, dx - width * .055, dy + height * .055);
        ctx.quadraticCurveTo(dx + width * .08, dy + height * .08, width * .36, height);
        ctx.closePath();
        ctx.fill();

        const jacket = ctx.createLinearGradient(width * .08, dy, width * .35, height);
        jacket.addColorStop(0, "#31444b");
        jacket.addColorStop(.48, "#26373d");
        jacket.addColorStop(1, "#172329");
        ctx.fillStyle = jacket;
        ctx.beginPath();
        ctx.moveTo(width * .075, height);
        ctx.quadraticCurveTo(width * .095, height * .67, dx - width * .035, dy + height * .06);
        ctx.quadraticCurveTo(dx + width * .085, dy + height * .055, width * .39, height);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = "rgba(166,187,190,.18)";
        ctx.lineWidth = Math.max(1, width * .002);
        ctx.beginPath();
        ctx.moveTo(dx + width * .005, dy + height * .07);
        ctx.quadraticCurveTo(dx + width * .02, height * .73, dx + width * .04, height);
        ctx.stroke();

        const neckX = dx + width * .005;
        ellipse(neckX, dy + height * .002, width * .022, height * .047, "#9c6d50", -.07);

        const skin = ctx.createLinearGradient(dx - width * .04, dy - height * .12, dx + width * .04, dy + height * .02);
        skin.addColorStop(0, "#c0916e");
        skin.addColorStop(.55, "#a9795a");
        skin.addColorStop(1, "#7e553f");
        ellipse(dx, dy - height * .07, width * .041, height * .066, skin, -.08);
        ellipse(dx + width * .038, dy - height * .065, width * .009, height * .017, "#9b6d53", -.08);

        ctx.fillStyle = "#17242a";
        ctx.beginPath();
        ctx.ellipse(dx - width * .004, dy - height * .121, width * .043, height * .024, -.07, Math.PI, Math.PI * 2);
        ctx.quadraticCurveTo(dx + width * .02, dy - height * .135, dx + width * .054, dy - height * .113);
        ctx.quadraticCurveTo(dx + width * .025, dy - height * .105, dx - width * .004, dy - height * .103);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = "rgba(40,30,25,.65)";
        ctx.lineWidth = Math.max(1, width * .0012);
        ctx.beginPath();
        ctx.moveTo(dx + width * .035, dy - height * .077);
        ctx.quadraticCurveTo(dx + width * .046, dy - height * .07, dx + width * .036, dy - height * .064);
        ctx.stroke();

        ctx.restore();

        const wheelX = width * .327;
        const wheelY = height * .805;
        const wheelR = Math.min(width * .105, height * .145);
        drawArms(dx, dy, wheelX, wheelY, wheelR, steer);
        drawSteeringWheel(wheelX, wheelY, wheelR, steer);
      }

      function drawArms(dx, dy, wheelX, wheelY, wheelR, steer) {
        ctx.lineCap = "round";
        ctx.strokeStyle = "#2a3b41";
        ctx.lineWidth = Math.max(12, width * .028);
        ctx.beginPath();
        ctx.moveTo(dx + width * .055, dy + height * .075);
        ctx.quadraticCurveTo(width * .28, height * .68, wheelX + wheelR * .48, wheelY - wheelR * .49);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(dx - width * .046, dy + height * .1);
        ctx.quadraticCurveTo(width * .19, height * .78, wheelX - wheelR * .55, wheelY - wheelR * .25);
        ctx.stroke();

        ellipse(wheelX + wheelR * .51, wheelY - wheelR * .5, wheelR * .13, wheelR * .095, "#ad7c5e", steer + .5);
        ellipse(wheelX - wheelR * .57, wheelY - wheelR * .24, wheelR * .13, wheelR * .095, "#ad7c5e", steer - .15);
        ctx.lineCap = "butt";
      }

      function drawSteeringWheel(x, y, r, rotation) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rotation);
        ctx.shadowColor = "rgba(0,0,0,.4)";
        ctx.shadowBlur = 12;
        ctx.strokeStyle = "#11191d";
        ctx.lineWidth = r * .13;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = "#28353a";
        ctx.lineWidth = r * .055;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = "#182227";
        for (const a of [-Math.PI / 2, Math.PI * .18, Math.PI * .82]) {
          ctx.save();
          ctx.rotate(a);
          roundedRect(-r * .07, -r * .03, r * .57, r * .06, r * .03);
          ctx.fill();
          ctx.restore();
        }
        ellipse(0, 0, r * .23, r * .23, "#1e2b30");
        ellipse(0, 0, r * .085, r * .085, "#536269");
        ctx.restore();
      }

      function drawForegroundDetails() {
        ctx.fillStyle = "rgba(4,9,12,.65)";
        ctx.beginPath();
        ctx.moveTo(0, height * .91);
        ctx.lineTo(width, height * .9);
        ctx.lineTo(width, height);
        ctx.lineTo(0, height);
        ctx.closePath();
        ctx.fill();

        const coffeeX = width * .82;
        const coffeeY = height * .895;
        ellipse(coffeeX, coffeeY, width * .03, height * .013, "rgba(0,0,0,.35)");
        roundedRect(coffeeX - width * .019, coffeeY - height * .075, width * .038, height * .07, 5);
        ctx.fillStyle = "#39474a";
        ctx.fill();
        roundedRect(coffeeX - width * .016, coffeeY - height * .07, width * .032, height * .018, 3);
        ctx.fillStyle = "#b9aa8c";
        ctx.fill();
      }

      function render(now) {
        const dt = Math.min(.05, (now - last) / 1000 || 0);
        last = now;
        elapsed += dt;
        if (!reduceMotion) roadTravel = (roadTravel + dt * .26) % 1;

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, width, height);

        ctx.save();
        const swayX = reduceMotion ? 0 : Math.sin(elapsed * .42) * width * .0017 + pointerX * width * .0018;
        const swayY = reduceMotion ? 0 : Math.sin(elapsed * .87) * height * .0009 + pointerY * height * .0006;
        ctx.translate(swayX, swayY);
        ctx.save();
        windshieldPath();
        ctx.clip();
        drawOutside();
        ctx.restore();
        drawGlass();
        drawCabFrame();
        drawDashboard();
        drawDriver();
        drawForegroundDetails();
        ctx.restore();

        requestAnimationFrame(render);
      }

      requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
