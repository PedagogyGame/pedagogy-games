<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Chinese Word Study · 601–700</title>
<style>
:root{--ink:#152018;--muted:#5a6a5c;--paper:#f4efe4;--panel:#f7f2e6;--line:#c8c0a4;--deep:#0e1612;--good:#2d4a3e;--bad:#8a3228;--gold:#d4b56a;--jade:#2d4a3e;--cinnabar:#c07828}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(1100px 640px at 12% -8%,rgba(192,120,40,.26),transparent 54%),linear-gradient(180deg,#0e1612 0%,#d5e0d0 46%,#152018 100%);color:var(--ink);font-family:Georgia,"Times New Roman","Noto Serif SC","Songti SC",serif;overflow:hidden}
.app{height:100vh;display:grid;grid-template-rows:auto 1fr;gap:0}
.topbar{min-height:58px;display:flex;align-items:center;gap:14px;padding:8px 18px;background:linear-gradient(90deg,#0e1612,#2d4a3e 42%,#c07828 78%,#0e1612);color:#f4efe4;border-bottom:3px solid #d4b56a;box-shadow:0 1px 0 #3a1814}
.brand{font-size:18px;font-weight:700;letter-spacing:.06em;white-space:nowrap}.brand small{font-size:12px;font-weight:400;opacity:.72;margin-left:8px}
.progress{flex:1;max-width:460px;height:7px;background:rgba(255,255,255,.14);border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:linear-gradient(90deg,#d4b56a,#c07828);width:1%;transition:width .25s ease}
.stat{font-size:13px;opacity:.9;white-space:nowrap}.topbtn{border:1px solid rgba(212,181,106,.55);background:transparent;color:#f4efe4;border-radius:4px;padding:7px 10px;cursor:pointer}
.main{min-height:0;display:grid;grid-template-columns:minmax(400px,46%) 1fr;gap:18px;padding:18px}
.quiz{min-height:0;background:rgba(247,242,230,.98);border:3px solid #2d4a3e;box-shadow:inset 0 0 0 7px #f3ead8,inset 0 0 0 8px #d4b56a,0 18px 50px rgba(14,22,18,.32);border-radius:2px;padding:20px 24px 16px;display:flex;flex-direction:column;overflow:auto}
.rankline{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.12em}
.character{text-align:center;font-family:"Noto Serif SC","Songti SC","STSong",serif;font-size:clamp(78px,9.2vw,128px);line-height:.95;margin:10px 0 2px;color:#152018;text-shadow:0 1px 0 #fff;letter-spacing:.04em}
.pinyin{text-align:center;font-size:clamp(22px,2.4vw,36px);font-style:italic;color:#c07828;margin:0 0 8px}
.front-pinyin{display:none}.prompt{text-align:center;font-size:15px;margin:2px 0 10px;color:#6a5c68}
button{font:600 13px/1.1 Georgia,serif;letter-spacing:.03em}
.controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:3px 0 8px}.controls .nav{display:flex;gap:6px;margin-right:6px}
.ghost,.action{padding:9px 12px;border-radius:4px;cursor:pointer}.ghost{border:1px solid #2d4a3e;background:#f4efe4;color:#0e1612}.action{border:1px solid #5a3a18;background:#c07828;color:#fff}
.reveal{border-top:1px solid #c8c0a4;padding-top:10px;margin-top:2px;animation:fade .18s ease}
.reveal-head{margin-bottom:6px}.reveal-pinyin{font-size:clamp(26px,2.7vw,40px);font-style:italic;color:#c07828;font-weight:700}
.glosses{font-size:clamp(20px,2vw,30px);line-height:1.25;margin:4px 0 8px;color:#152018}.glosses b{color:#c07828}
.wordtitle,.extitle,.chartitle{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#6a5c68;margin:10px 0 5px;font-weight:700}
.charlist{display:flex;gap:8px;flex-wrap:wrap}
.charchip{background:#f3ead8;border:1px solid #c8c0a4;border-radius:4px;padding:7px 10px;min-width:92px;box-shadow:inset 0 0 0 1px rgba(212,181,106,.35)}
.charchip .wzh{font-family:"Noto Serif SC","Songti SC",serif;font-size:28px;font-weight:700;line-height:1;color:#c07828}
.charchip .wpy{font-size:13px;font-style:italic;color:#2d4a3e}.charchip .wen{font-size:12px;color:#4a5c4e}
.examples{display:grid;gap:6px}
.example{padding:7px 10px;background:#f4efe4;border-left:4px solid #2d4a3e;border-radius:3px;line-height:1.24}
.example-zh{font-family:"Noto Serif SC","Songti SC",serif;font-size:clamp(18px,1.6vw,24px)}
.example-py{font-size:clamp(13px,1.05vw,16px);font-style:italic;color:#c07828;margin-top:2px}
.example-en{font-size:clamp(13px,1vw,16px);color:#3a4a3e;margin-top:2px}
.example em{font-style:normal;font-weight:800;color:#c07828;background:#eadcc4;border-radius:3px;padding:0 .06em}
.flipcard{margin-top:3px;border:1px solid #d4b56a;border-radius:3px;padding:12px 14px;background:#f4efe4}
.flipcard h3{margin:0 0 7px;font-size:13px;color:#2d4a3e;text-transform:uppercase;letter-spacing:.1em}
.english-list{font-size:clamp(22px,2vw,32px);line-height:1.25;margin:4px 0 10px}
.flipcard .reveal-pinyin{margin:0 0 6px}
.further{border:1px solid #2d4a3e;background:transparent;color:#2d4a3e;border-radius:4px;padding:8px 11px;cursor:pointer}
.imagepane{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;background:rgba(14,22,18,.95);border:3px solid #2d4a3e;border-radius:2px;overflow:hidden;box-shadow:inset 0 0 0 7px rgba(212,181,106,.28),0 18px 50px rgba(14,22,18,.34)}
.imagepane:before{content:"";position:absolute;inset:9px;border:1px solid rgba(212,181,106,.55);border-radius:1px;pointer-events:none}
.art{display:block;max-width:94%;max-height:90%;width:auto;height:auto;object-fit:contain;filter:saturate(1.02) contrast(1.03);box-shadow:0 8px 32px rgba(0,0,0,.32);transition:opacity .35s ease,transform .35s ease}.art.wide{max-width:98%;max-height:84%}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@media(max-width:900px){body{overflow:auto}.app{height:auto;min-height:100vh}.main{grid-template-columns:1fr;grid-template-rows:auto minmax(360px,55vh)}.quiz{overflow:visible}.imagepane{min-height:420px}.topbar{flex-wrap:wrap}.progress{order:3;flex-basis:100%;max-width:none}}
@media(max-width:520px){.main{padding:9px;gap:9px}.quiz{padding:14px}.brand small{display:none}.character{font-size:72px}.topbar{padding:8px 10px}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">词语 601–700 <small>most common words</small></div>
    <div class="progress"><i id="progressFill"></i></div>
    <div class="stat" id="cardStat"></div>
    <button class="topbtn" id="shuffleBtn">Shuffle</button>
    <button class="topbtn" id="resetBtn">Reset order</button>
  </header>
  <main class="main">
    <section class="quiz">
      <div class="rankline"><span id="rankLabel"></span></div>
      <div class="character" id="char"></div>
      <div class="pinyin front-pinyin" id="pinyin" aria-hidden="true"></div>
      <div class="prompt">Recognize the word first. Reveal for dictionary English, each character, and three fully translated examples.</div>
      <div class="controls">
        <div class="nav"><button class="ghost" id="prevBtn">← Previous</button><button class="ghost" id="nextBtn">Next →</button></div>
        <button class="action" id="revealBtn">Reveal</button>
        <button class="ghost" id="flipBtn">Flip</button>
      </div>
      <div id="detailArea"></div>
    </section>
    <section class="imagepane" id="imagePane">
      <img class="art" id="art" alt="Study image">
    </section>
  </main>
</div>
<script>
const BANK = [{"rank":601,"word":"专门","pinyin":"zhuān mén","en":["specially","for a special purpose"],"chars":[{"ch":"专","py":"zhuān","en":"special; expert"},{"ch":"门","py":"mén","en":"door; class"}],"examples":[{"zh":"他专门来修这座桥。","pinyin":"tā zhuān mén lái xiū zhè zuò qiáo.","en":"He came specially to mend this bridge."},{"zh":"这把刀是专门切肉的。","pinyin":"zhè bǎ dāo shì zhuān mén qiē ròu de.","en":"This knife is made specially for cutting meat."},{"zh":"她专门照看村里的老人。","pinyin":"tā zhuān mén zhào kàn cūn lǐ de lǎo rén.","en":"She looks after the village elders as her special charge."}]},{"rank":602,"word":"亲自","pinyin":"qīn zì","en":["in person","personally"],"chars":[{"ch":"亲","py":"qīn","en":"personal; kin"},{"ch":"自","py":"zì","en":"self"}],"examples":[{"zh":"村长亲自来看桥。","pinyin":"cūn zhǎng qīn zì lái kàn qiáo.","en":"The village head came in person to look at the bridge."},{"zh":"这封信要亲自交到他手里。","pinyin":"zhè fēng xìn yào qīn zì jiāo dào tā shǒu li.","en":"This letter must be placed in his hand in person."},{"zh":"他亲自下田插秧。","pinyin":"tā qīn zì xià tián chā yāng.","en":"He went down to the field in person to transplant rice."}]},{"rank":603,"word":"悄悄","pinyin":"qiāo qiāo","en":["quietly","on the quiet"],"chars":[{"ch":"悄","py":"qiāo","en":"quiet"},{"ch":"悄","py":"qiāo","en":"quiet"}],"examples":[{"zh":"孩子悄悄走进屋。","pinyin":"hái zi qiāo qiāo zǒu jìn wū.","en":"The child walked quietly into the house."},{"zh":"他悄悄把米送到邻居家。","pinyin":"tā qiāo qiāo bǎ mǐ sòng dào lín jū jiā.","en":"He quietly carried the rice to the neighbor's house."},{"zh":"夜里风悄悄停了。","pinyin":"yè li fēng qiāo qiāo tíng le.","en":"In the night the wind quietly stopped."}]},{"rank":604,"word":"赶快","pinyin":"gǎn kuài","en":["hurry","quickly"],"chars":[{"ch":"赶","py":"gǎn","en":"hurry; catch"},{"ch":"快","py":"kuài","en":"fast"}],"examples":[{"zh":"天要下雨，赶快收谷。","pinyin":"tiān yào xià yǔ, gǎn kuài shōu gǔ.","en":"Rain is coming; hurry and bring in the grain."},{"zh":"赶快把信送到镇上。","pinyin":"gǎn kuài bǎ xìn sòng dào zhèn shang.","en":"Hurry and take the letter to town."},{"zh":"桥要塌，赶快让人绕路。","pinyin":"qiáo yào tā, gǎn kuài ràng rén rào lù.","en":"The bridge is about to fall; hurry and send people around."}]},{"rank":605,"word":"赶紧","pinyin":"gǎn jǐn","en":["hastily","at once"],"chars":[{"ch":"赶","py":"gǎn","en":"hurry"},{"ch":"紧","py":"jǐn","en":"urgent; tight"}],"examples":[{"zh":"他赶紧去井边打水。","pinyin":"tā gǎn jǐn qù jǐng biān dǎ shuǐ.","en":"He went at once to draw water at the well."},{"zh":"火着了，赶紧喊人。","pinyin":"huǒ zháo le, gǎn jǐn hǎn rén.","en":"The fire caught; call people at once."},{"zh":"她赶紧把孩子抱进屋。","pinyin":"tā gǎn jǐn bǎ hái zi bào jìn wū.","en":"She hastily carried the child into the house."}]},{"rank":606,"word":"只好","pinyin":"zhǐ hǎo","en":["have no choice but to","can only"],"chars":[{"ch":"只","py":"zhǐ","en":"only"},{"ch":"好","py":"hǎo","en":"good"}],"examples":[{"zh":"雨太大，只好改日再走。","pinyin":"yǔ tài dà, zhǐ hǎo gǎi rì zài zǒu.","en":"The rain is too heavy; we can only go another day."},{"zh":"桥断了，只好绕路。","pinyin":"qiáo duàn le, zhǐ hǎo rào lù.","en":"The bridge is broken; we have no choice but to go around."},{"zh":"米不够，只好先煮粥。","pinyin":"mǐ bú gòu, zhǐ hǎo xiān zhǔ zhōu.","en":"There is not enough rice; we can only cook porridge first."}]},{"rank":607,"word":"尽量","pinyin":"jǐn liàng","en":["as much as possible","to the best of one's ability"],"chars":[{"ch":"尽","py":"jǐn","en":"to the utmost"},{"ch":"量","py":"liàng","en":"amount; capacity"}],"examples":[{"zh":"尽量把桥修结实。","pinyin":"jǐn liàng bǎ qiáo xiū jié shi.","en":"Mend the bridge as solidly as possible."},{"zh":"尽量少用灯油。","pinyin":"jǐn liàng shǎo yòng dēng yóu.","en":"Use as little lamp oil as possible."},{"zh":"他尽量把话说得慢些。","pinyin":"tā jǐn liàng bǎ huà shuō de màn xie.","en":"He tried as much as possible to speak more slowly."}]},{"rank":608,"word":"大约","pinyin":"dà yuē","en":["approximately","about"],"chars":[{"ch":"大","py":"dà","en":"big"},{"ch":"约","py":"yuē","en":"about; appoint"}],"examples":[{"zh":"从村到镇大约要走两个时辰。","pinyin":"cóng cūn dào zhèn dà yuē yào zǒu liǎng gè shí chen.","en":"From the village to town takes about two double-hours on foot."},{"zh":"这袋米大约有三十斤。","pinyin":"zhè dài mǐ dà yuē yǒu sān shí jīn.","en":"This sack of rice is about thirty jin."},{"zh":"桥大约是去年修的。","pinyin":"qiáo dà yuē shì qù nián xiū de.","en":"The bridge was mended about last year."}]},{"rank":609,"word":"差不多","pinyin":"chà bu duō","en":["almost","more or less"],"chars":[{"ch":"差","py":"chà","en":"lack; differ"},{"ch":"不","py":"bu","en":"not"},{"ch":"多","py":"duō","en":"much"}],"examples":[{"zh":"谷子差不多收完了。","pinyin":"gǔ zi chà bu duō shōu wán le.","en":"The millet is almost all brought in."},{"zh":"两条路差不多一样远。","pinyin":"liǎng tiáo lù chà bu duō yí yàng yuǎn.","en":"The two roads are more or less equally far."},{"zh":"天差不多黑了。","pinyin":"tiān chà bu duō hēi le.","en":"The sky is almost dark."}]},{"rank":610,"word":"总共","pinyin":"zǒng gòng","en":["altogether","in total"],"chars":[{"ch":"总","py":"zǒng","en":"total"},{"ch":"共","py":"gòng","en":"together"}],"examples":[{"zh":"村里总共来了二十个人修桥。","pinyin":"cūn lǐ zǒng gòng lái le èr shí gè rén xiū qiáo.","en":"Altogether twenty people from the village came to mend the bridge."},{"zh":"这些米总共不够三天吃。","pinyin":"zhè xie mǐ zǒng gòng bú gòu sān tiān chī.","en":"This rice altogether will not last three days."},{"zh":"路总共只有五里。","pinyin":"lù zǒng gòng zhǐ yǒu wǔ lǐ.","en":"The road is only five li in total."}]},{"rank":611,"word":"各自","pinyin":"gè zì","en":["each","respective"],"chars":[{"ch":"各","py":"gè","en":"each"},{"ch":"自","py":"zì","en":"self"}],"examples":[{"zh":"散了会，各自回家。","pinyin":"sàn le huì, gè zì huí jiā.","en":"When the meeting broke up, each went home."},{"zh":"两家各自管各自的田。","pinyin":"liǎng jiā gè zì guǎn gè zì de tián.","en":"The two households each tend their own fields."},{"zh":"夜里各自把门闩好。","pinyin":"yè li gè zì bǎ mén shuān hǎo.","en":"At night each bolts their own door."}]},{"rank":612,"word":"陆续","pinyin":"lù xù","en":["one after another","in successi const IMAGES = ["img/01-qingzhou-pagoda.jpg", "img/02-old-pagoda.jpg", "img/03-huashan-peak.jpg", "img/04-jiuzhai-falls.jpg", "img/05-detian-falls.jpg", "img/06-suzhou-garden.jpg", "img/07-guanyin-temple.jpg", "img/08-cave-buddha.jpg", "img/09-canyon-temple.jpg", "img/10-hanging-temple.jpg", "img/11-qingcheng-temple.jpg", "img/12-canal-boats.jpg", "img/13-huxinting-night.jpg", "img/14-ink-landscape.jpg", "img/15-hui-bridge.jpg"];
let order = BANK.map((_,i)=>i), pos=0, state='front';
const $=id=>document.getElementById(id);
function current(){return BANK[order[pos]]}
function safe(t){return String(t).replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>').replace(/"/g,'"').replace(/'/g,'&#039;')}
function mark(sentence,w){return safe(sentence).split(safe(w)).join('<em>'+safe(w)+'</em>')}
function imageForPosition(){const n=IMAGES.length||1;return Math.floor(pos*n/BANK.length)%n}
function setImage(){const idx=imageForPosition(), img=$('art');img.style.opacity=.15;setTimeout(()=>{img.src=IMAGES[idx]; img.onload=()=>{img.classList.toggle('wide',img.naturalWidth/img.naturalHeight>1.75);img.style.opacity=1}},90)}
function renderDetail(mode){const c=current(), d=$('detailArea'); if(mode==='front'){d.innerHTML='';return}
 if(mode==='flip'){d.innerHTML=`<div class="flipcard"><h3>Pinyin + English</h3><div class="reveal-pinyin">${safe(c.pinyin)}</div><div class="english-list">${c.en.map(safe).join(' · ')}</div><button class="further" id="furtherBtn">Reveal further</button></div>`;$('furtherBtn').onclick=()=>{state='revealed';renderDetail('revealed')};return}
 const chars=c.chars.map(w=>`<div class="charchip"><div class="wzh">${safe(w.ch)}</div><div class="wpy">${safe(w.py)}</div><div class="wen">${safe(w.en)}</div></div>`).join('');
 const ex=c.examples.map(x=>`<div class="example"><div class="example-zh">${mark(x.zh,c.word)}</div><div class="example-py">${safe(x.pinyin)}</div><div class="example-en">${safe(x.en)}</div></div>`).join('');
 d.innerHTML=`<div class="reveal"><div class="reveal-head"><div class="reveal-pinyin">${safe(c.pinyin)}</div><p class="glosses"><b>${safe(c.word)}</b> — ${c.en.map(safe).join('; ')}</p></div><div class="chartitle">Characters in this word</div><div class="charlist">${chars}</div><div class="extitle">Example sentences</div><div class="examples">${ex}</div></div>`}
function render(changeImage=true){const c=current();$('char').textContent=c.word;$('pinyin').textContent='';$('rankLabel').textContent=`Word frequency #${c.rank}`;$('cardStat').textContent=`${pos+1} / ${BANK.length}`;$('progressFill').style.width=((pos+1)/BANK.length*100)+'%';state='front';renderDetail('front');if(changeImage)setImage()}
function move(delta){const oldImg=imageForPosition();pos=Math.max(0,Math.min(BANK.length-1,pos+delta));render(imageForPosition()!==oldImg)}
$('prevBtn').onclick=()=>move(-1);$('nextBtn').onclick=()=>move(1);
$('revealBtn').onclick=()=>{state='revealed';renderDetail('revealed')};$('flipBtn').onclick=()=>{state='flip';renderDetail('flip')};
$('shuffleBtn').onclick=()=>{for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}pos=0;render(true)};
$('resetBtn').onclick=()=>{order=BANK.map((_,i)=>i);pos=0;render(true)};
render(true);
</script>
