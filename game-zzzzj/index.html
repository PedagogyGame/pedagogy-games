<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pneumatic Despatch — a working model, c. 1925</title>
<style>
:root{
  --soot:#14181b; --panel:#1c2226; --panel2:#232b30; --rule:#39444a;
  --paper:#e9e3d4; --paper-dim:#a8a293;
  --patina:#4e9c8c;          /* oxidised copper — the coolers */
  --brass:#c7a24a;
  --druck:#b8402f;           /* Druckluft — compressed air */
  --saug:#3e7ea6;            /* Saugluft — rarefied air */
  --font-d:"Iowan Old Style",Georgia,"Times New Roman",serif;
  --font-u:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --font-b:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--soot);color:var(--paper);
  font-family:var(--font-b);overflow:hidden;-webkit-font-smoothing:antialiased}
canvas{display:block}
#stage{position:fixed;inset:0}

/* ---------- loading ---------- */
#boot{position:fixed;inset:0;background:var(--soot);z-index:90;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .6s}
#boot h1{font-family:var(--font-d);font-weight:400;font-size:clamp(22px,3.4vw,38px);
  letter-spacing:.02em;margin:0;text-align:center}
#boot .sub{font-family:var(--font-u);font-size:11px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--patina)}
#gauge{width:190px;height:190px;border-radius:50%;border:2px solid var(--rule);
  position:relative;display:grid;place-items:center;background:
  radial-gradient(circle at 50% 40%,#232b30,#161b1e)}
#gauge .needle{position:absolute;width:2px;height:74px;background:var(--druck);
  bottom:50%;transform-origin:50% 100%;transform:rotate(-130deg);
  transition:transform .25s cubic-bezier(.4,1.6,.5,1)}
#gauge .hub{width:12px;height:12px;border-radius:50%;background:var(--brass);position:absolute}
#gauge .rd{position:absolute;bottom:34px;font-family:var(--font-u);font-size:11px;
  color:var(--paper-dim);letter-spacing:.1em}
#gauge .tick{position:absolute;width:1px;height:9px;background:var(--rule);
  top:8px;left:50%;transform-origin:50% 87px}

/* ---------- left rail: the parts schedule ---------- */
#rail{position:fixed;left:0;top:0;bottom:0;width:326px;background:var(--panel);
  border-right:1px solid var(--rule);display:flex;flex-direction:column;z-index:20;
  transition:transform .3s ease}
#rail.closed{transform:translateX(-326px)}
#rail header{padding:16px 18px 12px;border-bottom:1px solid var(--rule)}
#rail h1{font-family:var(--font-d);font-weight:400;font-size:19px;margin:0 0 3px;line-height:1.2}
#rail .tag{font-family:var(--font-u);font-size:10px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--patina)}
.section{padding:12px 18px;border-bottom:1px solid var(--rule)}
.section h2{font-family:var(--font-u);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--paper-dim);margin:0 0 9px;font-weight:400}
.row{display:flex;flex-wrap:wrap;gap:6px}
button{font-family:var(--font-b);font-size:12px;color:var(--paper);background:var(--panel2);
  border:1px solid var(--rule);padding:6px 10px;border-radius:2px;cursor:pointer;
  transition:background .15s,border-color .15s,color .15s}
button:hover{background:#2c353b;border-color:var(--brass)}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
button.on{background:#31403f;border-color:var(--patina);color:#cdece4}
button.wide{flex:1 1 auto}
#search{width:100%;background:#12171a;border:1px solid var(--rule);color:var(--paper);
  padding:8px 10px;font-size:13px;border-radius:2px;font-family:var(--font-b)}
#search::placeholder{color:#6d7378}
#index{flex:1;overflow-y:auto;padding:6px 0 40px}
#index::-webkit-scrollbar{width:9px}
#index::-webkit-scrollbar-thumb{background:#333d43;border-radius:9px}
.cat{font-family:var(--font-u);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--patina);padding:14px 18px 6px;position:sticky;top:0;background:var(--panel)}
.item{display:grid;grid-template-columns:34px 1fr;gap:8px;padding:5px 18px;cursor:pointer;
  font-size:13px;line-height:1.35;border-left:2px solid transparent}
.item:hover{background:#242c31;border-left-color:var(--brass)}
.item.sel{background:#2a3439;border-left-color:var(--patina)}
.item .no{font-family:var(--font-u);font-size:10.5px;color:#6f7a80;padding-top:2px}
.item .de{display:block;font-size:11.5px;color:var(--paper-dim);font-style:italic}

/* ---------- info plate ---------- */
#plate{position:fixed;right:16px;top:16px;width:330px;max-height:calc(100% - 32px);
  overflow-y:auto;background:var(--panel);border:1px solid var(--rule);border-radius:2px;
  z-index:20;padding:0 0 14px;box-shadow:0 18px 44px rgba(0,0,0,.55)}
#plate .bar{height:4px;background:var(--rule)}
#plate .body{padding:14px 16px 0}
#plate .no{font-family:var(--font-u);font-size:10px;letter-spacing:.16em;color:var(--brass)}
#plate h3{font-family:var(--font-d);font-weight:400;font-size:20px;margin:5px 0 2px;line-height:1.15}
#plate .de{font-family:var(--font-d);font-style:italic;font-size:14px;color:var(--patina);margin:0 0 10px}
#plate p{font-size:13.4px;line-height:1.58;color:#cfcabb;margin:0 0 10px}
#plate .meta{font-family:var(--font-u);font-size:10.5px;color:var(--paper-dim);
  border-top:1px solid var(--rule);padding-top:9px;margin-top:4px;letter-spacing:.04em}
#plate .close{position:absolute;right:8px;top:10px;background:none;border:none;color:#767f85;
  font-size:17px;padding:2px 7px}
#plate .close:hover{color:var(--paper);background:none}
.pill{display:inline-block;font-family:var(--font-u);font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;padding:3px 7px;border-radius:2px;margin:0 5px 8px 0}
.pill.d{background:rgba(184,64,47,.18);color:#e4a094;border:1px solid rgba(184,64,47,.5)}
.pill.s{background:rgba(62,126,166,.18);color:#9cc6de;border:1px solid rgba(62,126,166,.5)}
.pill.n{background:#2a3237;color:var(--paper-dim);border:1px solid var(--rule)}

/* ---------- hover tag ---------- */
#tag{position:fixed;pointer-events:none;z-index:30;background:rgba(20,24,27,.94);
  border:1px solid var(--brass);border-left-width:3px;padding:5px 9px;border-radius:2px;
  font-size:12.5px;display:none;max-width:250px;line-height:1.3}
#tag .de{font-family:var(--font-d);font-style:italic;font-size:11.5px;color:var(--patina)}

/* ---------- tour ---------- */
#tour{position:fixed;left:calc(50% + 163px);transform:translateX(-50%);bottom:16px;z-index:25;
  background:var(--panel);border:1px solid var(--rule);border-radius:2px;
  padding:11px 14px;display:none;width:min(620px,calc(100% - 380px));
  box-shadow:0 14px 34px rgba(0,0,0,.5)}
#rail.closed ~ #tour{width:min(620px,calc(100% - 60px));left:50%}
#tour .hd{display:flex;align-items:baseline;gap:10px;margin-bottom:5px}
#tour .step{font-family:var(--font-u);font-size:10px;letter-spacing:.16em;color:var(--brass)}
#tour .ti{font-family:var(--font-d);font-size:16px}
#tour p{margin:0 0 9px;font-size:13px;line-height:1.5;color:#cfcabb}
#tour .nav{display:flex;gap:7px;align-items:center}

/* ---------- hints ---------- */
#hint{position:fixed;bottom:14px;left:346px;z-index:15;font-family:var(--font-u);
  font-size:10.5px;color:#6f7a80;letter-spacing:.05em;transition:left .3s,opacity .3s}
#hint.hide{opacity:0}
#rail.closed ~ #hint{left:60px}
#railtog{position:fixed;left:336px;top:16px;z-index:22;transition:left .3s;
  font-family:var(--font-u);font-size:11px;letter-spacing:.1em}
#rail.closed ~ #railtog{left:12px}
#scalebar{position:fixed;bottom:44px;left:346px;z-index:15;transition:left .3s}
#rail.closed ~ #scalebar{left:60px}
#scalebar .ln{width:120px;height:1px;background:#6f7a80;position:relative}
#scalebar .ln:before,#scalebar .ln:after{content:"";position:absolute;width:1px;height:6px;
  background:#6f7a80;bottom:0}
#scalebar .ln:after{right:0}
#scalebar span{font-family:var(--font-u);font-size:10px;color:#6f7a80}

@media (max-width:900px){
  #rail{width:290px}#rail.closed{transform:translateX(-290px)}
  #railtog{left:300px}#hint{display:none}#scalebar{left:310px}
  #plate{width:calc(100% - 32px);max-height:44%;top:auto;bottom:12px;right:16px}
  #tour{width:calc(100% - 32px);bottom:12px;left:50%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="stage"></div>

<div id="boot">
  <div id="gauge"><div class="needle" id="bootNeedle"></div><div class="hub"></div>
    <div class="rd" id="bootRd">0 lb</div></div>
  <h1>Pneumatic Despatch</h1>
  <div class="sub" id="bootMsg">raising pressure&hellip;</div>
</div>

<aside id="rail">
  <header>
    <h1>Pneumatic Despatch</h1>
    <div class="tag">City installation &middot; c. 1925</div>
  </header>

  <div class="section">
    <h2>View</h2>
    <div class="row">
      <button class="wide" data-view="whole">Whole system</button>
      <button class="wide" data-view="machine">Machine station</button>
      <button class="wide" data-view="street">Street section</button>
      <button class="wide" data-view="district">District office</button>
      <button class="wide" data-view="rail">Mail terminal</button>
      <button class="wide" data-view="store">Store cash system</button>
    </div>
  </div>

  <div class="section">
    <h2>Show</h2>
    <div class="row">
      <button class="on wide" data-layer="walls">Building walls</button>
      <button class="on wide" data-layer="soil">Soil</button>
      <button class="on wide" data-layer="air">Air current</button>
      <button class="on wide" data-layer="carriers">Carriers</button>
      <button class="on wide" data-layer="labels">Station names</button>
      <button class="wide" id="tourBtn">Guided tour</button>
    </div>
  </div>

  <div class="section">
    <h2>Find a part</h2>
    <input id="search" placeholder="felt, sluice, Fahrrohr, oakum&hellip;" autocomplete="off">
  </div>

  <div id="index"></div>
</aside>

<button id="railtog">&#9776; INDEX</button>

<div id="plate" style="display:none">
  <div class="bar" id="plateBar"></div>
  <button class="close" id="plateClose">&times;</button>
  <div class="body">
    <div class="no" id="plateNo"></div>
    <h3 id="plateName"></h3>
    <div class="de" id="plateDe"></div>
    <div id="platePills"></div>
    <div id="plateDesc"></div>
    <div class="meta" id="plateMeta"></div>
  </div>
</div>

<div id="tag"><div id="tagName"></div><div class="de" id="tagDe"></div></div>

<div id="tour">
  <div class="hd"><span class="step" id="tourStep"></span><span class="ti" id="tourTitle"></span></div>
  <p id="tourText"></p>
  <div class="nav">
    <button id="tourPrev">&larr; Back</button>
    <button id="tourNext">Next &rarr;</button>
    <button id="tourEnd">Leave tour</button>
  </div>
</div>

<div id="hint">DRAG orbit &middot; RIGHT-DRAG or SHIFT-DRAG pan &middot; SCROLL zoom &middot; W A S D move &middot; HOVER any part &middot; CLICK to pin</div>
<div id="scalebar"><div class="ln"></div><span id="scaleTxt">20 m</span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =====================================================================
   PNEUMATIC DESPATCH — pedagogical model, c. 1925
   1 unit = 1 metre.  Ground (street) level = y 0.
   ===================================================================== */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f1316);
scene.fog = new THREE.Fog(0x0f1316, 210, 540);

const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 900);
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('stage').appendChild(renderer.domElement);

/* ---------------- lighting: low winter sun + boiler-room glow ------- */
scene.add(new THREE.HemisphereLight(0x9fb6c4, 0x2b2620, 0.55));
const sun = new THREE.DirectionalLight(0xffe6c0, 1.15);
sun.position.set(-70, 95, 60);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
const sc = sun.shadow.camera;
sc.left=-110; sc.right=110; sc.top=110; sc.bottom=-110; sc.near=10; sc.far=280;
sun.shadow.bias = -0.0007;
sc.updateProjectionMatrix();
scene.add(sun);
const fill = new THREE.DirectionalLight(0x7f9ab0, 0.35);
fill.position.set(60, 40, -80); scene.add(fill);
/* furnace glow in the machine room */
const furnace = new THREE.PointLight(0xff7326, 2.2, 26, 2);
furnace.position.set(-52, -4.2, 26); scene.add(furnace);

/* ---------------- orbit / fly controls ----------------------------- */
class Controls{
  constructor(cam, dom){
    this.cam=cam; this.dom=dom;
    this.target=new THREE.Vector3(0,0,0);
    this.tgtD=this.target.clone();
    this.sph=new THREE.Spherical(150, 1.02, 0.72);
    this.sphD=this.sph.clone();
    this.min=3; this.max=380;
    this.keys={}; this.drag=null; this.px=0; this.py=0; this.enabled=true;
    dom.addEventListener('contextmenu', e=>e.preventDefault());
    dom.addEventListener('pointerdown', e=>{
      dom.setPointerCapture(e.pointerId);
      this.drag = (e.button===2 || e.shiftKey) ? 'pan' : 'orbit';
      this.px=e.clientX; this.py=e.clientY;
    });
    dom.addEventListener('pointermove', e=>{
      if(!this.drag) return;
      const dx=e.clientX-this.px, dy=e.clientY-this.py;
      this.px=e.clientX; this.py=e.clientY;
      if(this.drag==='orbit'){
        this.sphD.theta -= dx*0.0042;
        this.sphD.phi   -= dy*0.0042;
        this.sphD.phi = Math.max(0.04, Math.min(Math.PI-0.04, this.sphD.phi));
      }else{
        this.pan(-dx, dy);
      }
    });
    const stop=e=>{ this.drag=null; };
    dom.addEventListener('pointerup', stop);
    dom.addEventListener('pointercancel', stop);
    dom.addEventListener('wheel', e=>{
      e.preventDefault();
      const k = Math.exp(e.deltaY*0.0011);
      this.sphD.radius = Math.max(this.min, Math.min(this.max, this.sphD.radius*k));
    }, {passive:false});
    addEventListener('keydown', e=>{
      if(e.target.tagName==='INPUT') return;
      this.keys[e.code]=true;
    });
    addEventListener('keyup', e=>{ this.keys[e.code]=false; });
  }
  pan(dx, dy){
    const s = this.sphD.radius*0.0016;
    const right = new THREE.Vector3(), up = new THREE.Vector3();
    this.cam.matrix.extractBasis(right, up, new THREE.Vector3());
    this.tgtD.addScaledVector(right, dx*s).addScaledVector(up, dy*s);
  }
  frame(pos, radius){
    this.tgtD.copy(pos);
    this.sphD.radius = Math.max(this.min, Math.min(this.max, radius));
  }
  update(dt){
    const k = this.keys, sp = this.sphD.radius*1.1*dt;
    if(k.KeyW||k.ArrowUp)   this.forward(sp);
    if(k.KeyS||k.ArrowDown) this.forward(-sp);
    if(k.KeyA||k.ArrowLeft) this.strafe(-sp);
    if(k.KeyD||k.ArrowRight)this.strafe(sp);
    if(k.KeyQ) this.tgtD.y -= sp*0.7;
    if(k.KeyE) this.tgtD.y += sp*0.7;
    const e = 1-Math.pow(0.0008, dt);
    this.target.lerp(this.tgtD, e);
    this.sph.radius += (this.sphD.radius-this.sph.radius)*e;
    this.sph.theta  += (this.sphD.theta -this.sph.theta )*e;
    this.sph.phi    += (this.sphD.phi   -this.sph.phi   )*e;
    const p = new THREE.Vector3().setFromSpherical(this.sph).add(this.target);
    this.cam.position.copy(p);
    this.cam.lookAt(this.target);
  }
  forward(d){
    const f = new THREE.Vector3().subVectors(this.target, this.cam.position);
    f.y=0; f.normalize(); this.tgtD.addScaledVector(f, d);
  }
  strafe(d){
    const r = new THREE.Vector3();
    this.cam.matrix.extractBasis(r, new THREE.Vector3(), new THREE.Vector3());
    r.y=0; r.normalize(); this.tgtD.addScaledVector(r, d);
  }
}
const controls = new Controls(camera, renderer.domElement);

/* ---------------- materials ---------------------------------------- */
const M = (c,o={}) => new THREE.MeshStandardMaterial(Object.assign({color:c},o));
const mat = {
  castIron : M(0x4d5155,{roughness:.82,metalness:.45}),
  ironDark : M(0x33383c,{roughness:.85,metalness:.4}),
  steel    : M(0x8d959c,{roughness:.42,metalness:.85}),
  brass    : M(0xb98f3f,{roughness:.3,metalness:.95}),
  copper   : M(0x9c5a2c,{roughness:.35,metalness:.9}),
  patina   : M(0x4e9c8c,{roughness:.66,metalness:.35}),
  lead     : M(0x8b9097,{roughness:.6,metalness:.6}),
  felt     : M(0x8a5334,{roughness:.98,metalness:0}),
  leather  : M(0x54301f,{roughness:.9,metalness:.02}),
  gutta    : M(0x2c2724,{roughness:.75,metalness:.05}),
  alum     : M(0xc3c8cc,{roughness:.35,metalness:.8}),
  wood     : M(0x6b4a2c,{roughness:.85,metalness:0}),
  brick    : M(0x8a5b46,{roughness:.95,metalness:0}),
  brickDk  : M(0x6d4535,{roughness:.95,metalness:0}),
  stone    : M(0xb5aa97,{roughness:.9,metalness:0}),
  stoneDk  : M(0x958b79,{roughness:.9,metalness:0}),
  concrete : M(0x9b978d,{roughness:.95,metalness:0}),
  paving   : M(0x585d60,{roughness:.98,metalness:0}),
  soil     : M(0x4a3d30,{roughness:1,metalness:0}),
  soilTop  : M(0x5c4c3b,{roughness:1,metalness:0}),
  glass    : M(0xa9cbdb,{roughness:.12,metalness:.1,transparent:true,opacity:.3}),
  druck    : M(0xb8402f,{roughness:.55,metalness:.5}),
  saug     : M(0x3e7ea6,{roughness:.55,metalness:.5}),
  enamel   : M(0xe0dccd,{roughness:.5,metalness:.05}),
  red      : M(0x912e22,{roughness:.7,metalness:.2}),
  green    : M(0x2f4f42,{roughness:.8,metalness:.15}),
  cloth    : M(0x3d4a52,{roughness:1,metalness:0}),
  oakum    : M(0x6e6046,{roughness:1,metalness:0}),
  fibre    : M(0x9a8358,{roughness:.95,metalness:0}),
  rubber   : M(0x24262a,{roughness:.95,metalness:0}),
  water    : M(0x2b4450,{roughness:.25,metalness:.2,transparent:true,opacity:.75})
};

/* ---------------- registry & groups -------------------------------- */
const parts = [];            // {no,name,de,cat,desc,meta,mode,mesh}
const pickables = [];
const G = {};
['buildings','walls','machine','stations','tubes','under','soil','carriers','air','store','street','labels']
  .forEach(k=>{ G[k]=new THREE.Group(); G[k].name=k; scene.add(G[k]); });

let partNo = 0;
/**
 * Register a mesh as an identifiable part of the model.
 * o = {name, de, cat, desc, meta, mode:'druck'|'saug'|null}
 */
function P(mesh, o){
  partNo++;
  const rec = Object.assign({no:String(partNo).padStart(3,'0'), mesh}, o);
  mesh.userData.rec = rec;
  if(mesh.material && mesh.material.isMaterial){
    mesh.material = mesh.material.clone();
    rec.baseEmissive = mesh.material.emissive ? mesh.material.emissive.clone() : null;
  }
  mesh.castShadow = true; mesh.receiveShadow = true;
  parts.push(rec); pickables.push(mesh);
  return mesh;
}
/* child meshes that share a part's identity (no separate index entry) */
function alias(mesh, host){
  mesh.userData.rec = host.userData.rec;
  mesh.castShadow = true; mesh.receiveShadow = true;
  pickables.push(mesh); return mesh;
}

/* ---------------- geometry helpers --------------------------------- */
function box(w,h,d,m,x,y,z,parent){
  const b = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), m);
  b.position.set(x,y,z); (parent||scene).add(b); return b;
}
function cyl(rt,rb,h,m,x,y,z,parent,seg){
  const c = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg||20), m);
  c.position.set(x,y,z); (parent||scene).add(c); return c;
}
function sph(r,m,x,y,z,parent){
  const s = new THREE.Mesh(new THREE.SphereGeometry(r,18,14), m);
  s.position.set(x,y,z); (parent||scene).add(s); return s;
}
function torus(r,t,m,x,y,z,parent){
  const o = new THREE.Mesh(new THREE.TorusGeometry(r,t,10,26), m);
  o.position.set(x,y,z); (parent||scene).add(o); return o;
}
const RX = (o,a)=>{o.rotation.x=a;return o;};
const RY = (o,a)=>{o.rotation.y=a;return o;};
const RZ = (o,a)=>{o.rotation.z=a;return o;};
const V = (x,y,z)=>new THREE.Vector3(x,y,z);

/* a run of tube through waypoints; returns {mesh, curve} */
function tubeRun(pts, r, m, parent, seg, radial){
  const curve = new THREE.CatmullRomCurve3(pts.map(p=>p.clone()), false, 'catmullrom', 0.06);
  const g = new THREE.TubeGeometry(curve, seg||Math.max(32, pts.length*14), r, radial||14, false);
  const mesh = new THREE.Mesh(g, m);
  (parent||scene).add(mesh);
  return {mesh, curve};
}
/* flanged / bell-and-spigot collars repeated along a straight run */
function collars(from, to, every, r, m, parent){
  const d = new THREE.Vector3().subVectors(to, from);
  const len = d.length(), n = Math.floor(len/every);
  const out=[];
  for(let i=1;i<=n;i++){
    const p = from.clone().addScaledVector(d.clone().normalize(), i*every);
    const c = new THREE.Mesh(new THREE.CylinderGeometry(r,r,0.09,16), m);
    c.position.copy(p);
    c.quaternion.setFromUnitVectors(V(0,1,0), d.clone().normalize());
    (parent||scene).add(c); out.push(c);
  }
  return out;
}

function shell(o){
  const g  = new THREE.Group(); G.buildings.add(g);   // slabs, columns, basement
  const gw = new THREE.Group(); G.walls.add(gw);      // the enclosing walls only
  const w = o.x1-o.x0, d = o.z1-o.z0, cx=(o.x0+o.x1)/2, cz=(o.z0+o.z1)/2;
  let y = o.base || 0;
  const slabs=[];
  // basement floor
  if(o.basement){
    box(w+.6,.5,d+.6, mat.concrete, cx, o.basement-.25, cz, g).receiveShadow=true;
    const bw1 = box(.5,-o.basement,d, mat.brickDk, o.x0-.25, o.basement/2, cz, gw);
    const bw2 = box(w,-o.basement,.5, mat.brickDk, cx, o.basement/2, o.z0-.25, gw);
    slabs.push(bw1,bw2);
  }
  o.storeys.forEach((h,i)=>{
    const slab = box(w+.5,.42,d+.5, mat.concrete, cx, y-.21, cz, g);
    slab.receiveShadow = true; slabs.push(slab);
    // far walls only — the near two faces are cut away
    const wallW = box(.55,h,d, o.mat||mat.stone, o.x0-.27, y+h/2, cz, gw);
    const wallD = box(w,h,.55, o.mat||mat.stone, cx, y+h/2, o.z0-.27, gw);
    slabs.push(wallW, wallD);
    // windows punched in the far walls
    for(let t=o.z0+3; t<o.z1-2; t+=4.2){
      box(.16,h*.5,1.5, mat.glass, o.x0-.02, y+h*.56, t, gw);
      box(.3,.24,1.9, o.matDk||mat.stoneDk, o.x0-.3, y+h*.30, t, gw);
    }
    for(let t=o.x0+3; t<o.x1-2; t+=4.2){
      box(1.5,h*.5,.16, mat.glass, t, y+h*.56, o.z0-.02, gw);
      box(1.9,.24,.3, o.matDk||mat.stoneDk, t, y+h*.30, o.z0-.3, gw);
    }
    // cut-edge pilasters, so the section reads as deliberate
    box(.55,h,.9, o.matDk||mat.stoneDk, o.x1-.27, y+h/2, o.z0+.45, gw);
    box(.9,h,.55, o.matDk||mat.stoneDk, o.x0+.45, y+h/2, o.z1-.27, gw);
    box(.8,h,.8, o.matDk||mat.stoneDk, o.x1-.4, y+h/2, o.z1-.4, gw);
    // interior columns
    for(let a=o.x0+5; a<o.x1-3; a+=7)
      for(let b=o.z0+5; b<o.z1-3; b+=7)
        box(.42,h,.42, o.matDk||mat.stoneDk, a, y+h/2, b, g);
    y += h;
  });
  // cornice + roof
  box(w+1.4,.5,d+1.4, o.matDk||mat.stoneDk, cx, y+.2, cz, gw);
  box(w,.3,d, mat.ironDark, cx, y+.5, cz, gw);
  return {g, gw, top:y, cx, cz};
}

function run(key, pts, r, m, info, parent){
  const t = tubeRun(pts, r, m, parent||G.tubes, Math.max(48, pts.length*16), 14);
  P(t.mesh, info);
  const pr = tubeRun(pts, Math.max(r+0.11, 0.16), proxyMat, parent||G.tubes, 48, 8);
  pr.mesh.castShadow = pr.mesh.receiveShadow = false;
  pr.mesh.userData.rec = t.mesh.userData.rec;
  pickables.push(pr.mesh);
  ROUTES[key] = t.curve;
  return t;
}

function usTerminal(x,y,z,ry,full){

    meta:'swing-tube on trunnions'}) : alias(sendMesh, parts.find(p=>p.name==='8-inch transmitter').mesh);
  if(full){
    P(RZ(cyl(.1,.1,1.0, mat.steel, .7, .45, 0, g, 12), Math.PI/2), {
      name:'Trunnions', de:'', cat:'Sending apparatus',
      desc:'The two pivots the swinging tube section turns on. Small, and the reason the whole scheme works: the moving part is a piece of the tube itself, so there is nothing extra to seal.', meta:''});
    P(box(.34,.34,.34, mat.brass, 1.35, .45, 0, g), {
      name:'Circuit closer', de:'', cat:'Signalling',
      desc:'A passing carrier physically closes an electrical contact beside the tube. That current locks the transmitters at intermediate stations for a set number of seconds, so nobody can inject a canister in front of one already running. The carrier is thus its own signalman.',
      meta:'the pneumatic block system'});
  }
  const recMesh = box(1.0,1.2,1.0, mat.castIron, -1.1, .5, 0, g);
  const recHost = full ? P(recMesh, {
    name:'8-inch closed receiver', de:'', cat:'Receiving apparatus',
    desc:'Harder to build than the sender, because it must do three things nearly at once: stop the carrier, keep the system\u2019s air in, and hand the carrier to the operator. Twenty-one pounds of steel arriving at thirty-five miles an hour has to be brought to rest in a few feet without hurting anybody.',
    meta:'stop \u00b7 seal \u00b7 deliver'}) : alias(recMesh, parts.find(p=>p.name==='8-inch closed receiver').mesh);
  if(full){
    P(box(.36,.16,1.05, mat.steel, -1.1, .95, 0, g), {
      name:'Exhaust slots', de:'', cat:'Receiving apparatus',
      desc:'Slots cut in the tube just short of the stopping chamber. The driving air escapes sideways through them into a side passage while the carrier runs on into the blind chamber beyond — so the air is taken away from the carrier before the carrier has to be taken out of the air.',

    P(box(.7,.7,.7, mat.steel, -1.1, 1.35, 0, g), {

      desc:'The blind end. Air trapped in front of the canister compresses and brings it to rest as a spring would. Some receivers then tilted the entire tube section about forty degrees and let gravity roll the carrier out — a large cast-iron pneumatically-worked mechanical hand.',
      meta:'or: tilting receiver'});
    P(box(.3,.12,.9, mat.brass, -1.6, .72, 0, g), {
      name:'Receiver sluice gate', de:'', cat:'Receiving apparatus',
      desc:'Once the carrier has stopped, pneumatic pressure drives a piston that opens this gate and lets it out onto the table. Then the gate shuts and the line is ready for the next.',
      meta:''});
    P(RZ(box(1.2,.08,1.4, mat.wood, -2.1, .28, .3, g), -.22), {
      name:'Discharge table', de:'', cat:'Receiving apparatus',
      desc:'Where the mail actually reappears. Beyond this point everything is hands, sacks and sorting frames — the tube saved the journey across the city, not the labour at either end.',
      meta:''});
  }
  return g;
}

G.moving = new THREE.Group(); scene.add(G.moving);
const movers = [];
const dotTex = (()=>{ const c=document.createElement('canvas'); c.width=c.height=64;
  const x=c.getContext('2d'); const g=x.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0,'rgba(255,225,150,.95)'); g.addColorStop(.4,'rgba(255,170,60,.35)');
  g.addColorStop(1,'rgba(255,140,40,0)'); x.fillStyle=g; x.fillRect(0,0,64,64);
  return new THREE.CanvasTexture(c); })();

function carrier(routeKey, kind, offset, speed){
  const curve = ROUTES[routeKey]; if(!curve) return;
  const len = curve.getLength();
  const g = new THREE.Group(); G.moving.add(g);
  let body;
  if(kind==='us'){
    body = cyl(.089,.089,.61, mat.steel, 0,0,0, g, 18);
    sph(.088, mat.steel, 0,.31,0, g);
    cyl(.093,.093,.05, mat.fibre, 0,.16,0, g, 18);
    cyl(.093,.093,.05, mat.fibre, 0,-.16,0, g, 18);
  }else if(kind==='berlin'){
    body = cyl(.0285,.0285,.19, mat.alum, 0,0,0, g, 12);
    cyl(.029,.029,.13, mat.leather, 0,0,0, g, 12);
  }else{
    body = cyl(.0286,.0286,.20, mat.gutta, 0,0,0, g, 12);
    cyl(.0295,.0295,.03, mat.felt, 0,.09,0, g, 12);
  }
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({map:dotTex, transparent:true,
    blending:THREE.AdditiveBlending, depthTest:false, opacity:.85}));
  halo.scale.set(1.1,1.1,1); halo.renderOrder = 900; g.add(halo);
  movers.push({g, curve, t:offset, v:speed/len});
  return g;
}
carrier('cto_dpo','berlin', .05, 11);
carrier('cto_dpo','berlin', .48, 11);
for(let i=0;i<6;i++) carrier('dpo_cto','berlin', .30 + i*0.006, 10);   /* a train of Büchsen */
carrier('cto_exc','london', .62, 9);

  desc:'Berlin could send eight or ten B\u00fcchsen together as a train rather than one at a time, and Paris pushed trains of six to ten with a wooden, iron-clad piston fitted with a cup-leather seal, each carrier labelled for its own station. Look at the return tube from the district office in this model: the carriers are running in a group, not singly.',
  meta:'Berlin 8\u201310 \u00b7 Paris 6\u201310 behind a piston'});

G.air.visible = true;
const arrows = [];
function airFlow(routeKey, colour, reverse, n, speed, size){
  const curve = ROUTES[routeKey]; if(!curve) return;
  const len = curve.getLength();
  const s = size || .17;
  const m = M(colour,{emissive:colour, emissiveIntensity:.7, roughness:.5});
  for(let i=0;i<n;i++){
    const c = new THREE.Mesh(new THREE.ConeGeometry(s, s*3, 10), m);
    c.castShadow = false;
    G.air.add(c);
    arrows.push({m:c, curve, t:i/n, v:speed/len, rev:reverse});
  }
}

const ray = new THREE.Raycaster();
ray.params.Line = {threshold:0.1};
const ptr = new THREE.Vector2(-5,-5);
let hovered = null, selected = null, needPick = false;
const tag = document.getElementById('tag'), tagName = document.getElementById('tagName'),
      tagDe = document.getElementById('tagDe');
const HOVER = new THREE.Color(0x6b5316), SEL = new THREE.Color(0x1f5a4e);

renderer.domElement.addEventListener('pointermove', e=>{
  ptr.x = (e.clientX/innerWidth)*2-1;
  ptr.y = -(e.clientY/innerHeight)*2+1;
  tag.style.left = Math.min(e.clientX+16, innerWidth-262)+'px';
  tag.style.top  = (e.clientY+16)+'px';
  needPick = true;
});
renderer.domElement.addEventListener('pointerleave', ()=>{ setHover(null); });

function emis(rec, colour){
  if(!rec) return;
  const walk = o=>{ if(o.material && o.material.emissive) o.material.emissive.copy(colour); };
  walk(rec.mesh); rec.mesh.traverse(walk);
}
function setHover(rec){
  if(hovered === rec) return;
  if(hovered && hovered !== selected) emis(hovered, hovered.baseEmissive || new THREE.Color(0));
  hovered = rec;
  if(rec){
    if(rec !== selected) emis(rec, HOVER);
    tagName.textContent = rec.name;
    tagDe.textContent = rec.de || '';
    tagDe.style.display = rec.de ? 'block' : 'none';
    tag.style.display = 'block';
    document.body.style.cursor = 'pointer';
  }else{
    tag.style.display = 'none';
    document.body.style.cursor = 'default';
  }
}
function pick(){
  needPick = false;
  ray.setFromCamera(ptr, camera);
  const hits = ray.intersectObjects(pickables, false);
  for(const h of hits){
    if(h.object.visible && h.object.parent && h.object.parent.visible){
      const rec = h.object.userData.rec;
      if(rec){ setHover(rec); return; }
    }
  }
  setHover(null);
}

const plate = document.getElementById('plate');
function select(rec, fly){
  if(selected && selected !== rec) emis(selected, selected.baseEmissive || new THREE.Color(0));
  selected = rec;
  if(!rec){ plate.style.display='none'; return; }
  emis(rec, SEL);
  document.getElementById('plateNo').textContent = 'PART ' + rec.no;
  document.getElementById('plateName').textContent = rec.name;
  const de = document.getElementById('plateDe');
  de.textContent = rec.de || ''; de.style.display = rec.de ? 'block' : 'none';
  const pills = document.getElementById('platePills');
  let ph = `<span class="pill n">${rec.cat}</span>`;
  if(rec.mode==='druck') ph += '<span class="pill d">Druckluft</span>';
  if(rec.mode==='saug')  ph += '<span class="pill s">Saugluft</span>';
  pills.innerHTML = ph;
  document.getElementById('plateDesc').innerHTML = '<p>'+rec.desc+'</p>';
  document.getElementById('plateMeta').textContent = rec.meta || '';
  document.getElementById('plateMeta').style.display = rec.meta ? 'block' : 'none';
  document.getElementById('plateBar').style.background =
    rec.mode==='druck' ? 'var(--druck)' : rec.mode==='saug' ? 'var(--saug)' : 'var(--patina)';
  plate.style.display = 'block';
  document.querySelectorAll('.item').forEach(el=>
    el.classList.toggle('sel', el.dataset.no === rec.no));
  if(fly) flyTo(rec);
}
function flyTo(rec){
  const b = new THREE.Box3().setFromObject(rec.mesh);
  const c = b.getCenter(new THREE.Vector3());
  const r = Math.max(b.getSize(new THREE.Vector3()).length()*1.6, 2.2);
  controls.frame(c, Math.min(r+2.5, 140));
}
let downAt = null;
renderer.domElement.addEventListener('pointerdown', e=>{ downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('click', e=>{
  if(downAt && Math.hypot(e.clientX-downAt[0], e.clientY-downAt[1]) > 5) return;
  if(hovered) select(hovered, false); else select(null);
});
renderer.domElement.addEventListener('dblclick', ()=>{ if(hovered) select(hovered, true); });
document.getElementById('plateClose').onclick = ()=>select(null);

/* ---------- the parts schedule ------------------------------------- */
const CAT_ORDER = ['Carriers','Tubes & underground','Sending apparatus','Receiving apparatus',
  'Air machinery','Steam plant','Air storage & conditioning','Control hardware','Signalling',
  'Store cash system','Buildings & context','Street & context'];
const index = document.getElementById('index');
function buildIndex(filter){
  index.innerHTML = '';
  const f = (filter||'').trim().toLowerCase();
  CAT_ORDER.forEach(cat=>{
    const list = parts.filter(p=>p.cat===cat && (!f ||
      (p.name+' '+(p.de||'')+' '+p.desc+' '+(p.meta||'')).toLowerCase().includes(f)));
    if(!list.length) return;
    const h = document.createElement('div'); h.className='cat'; h.textContent=cat;
    index.appendChild(h);
    list.forEach(p=>{
      const d = document.createElement('div');
      d.className='item'; d.dataset.no = p.no;
      d.innerHTML = `<span class="no">${p.no}</span><span>${p.name}` +
        (p.de?`<span class="de">${p.de}</span>`:'') + `</span>`;
      d.onclick = ()=>select(p, true);
      d.onmouseenter = ()=>{ if(p!==selected) emis(p, HOVER); };
      d.onmouseleave = ()=>{ if(p!==selected) emis(p, p.baseEmissive||new THREE.Color(0)); };
      index.appendChild(d);
    });
  });
  if(!index.children.length)
    index.innerHTML = '<div style="padding:22px 18px;color:#8b9298;font-size:13px">'+
      'No part matches that. Try a material (felt, oakum, brass), a function (cushion, sluice, block) '+
      'or a German term (Fahrrohr, B\u00fcchse, Saugluft).</div>';
}

/* ---------- guided tour --------------------------------------------- */
const TOUR = [
  {t:'A city solved a problem with air', p:null, v:'whole',
   x:'Five buildings, one machine station and about a mile of pipe. Everything you can see was built to answer a single question: how do you get a piece of paper across a crowded city faster than a man can walk it? Between about 1853 and the 1930s the answer was compressed air. Follow the tour, or simply fly around and put the mouse on anything.'},
  {t:'The carrier is a loose piston', p:'Rohrpostb\u00fcchse',
   x:'Start with the thing that moves. It is a can with a soft collar round it that very nearly touches the bore. Raise the pressure behind it and lower it in front, and the difference pushes it along. That is the entire physics of the technology; everything else in this model exists to produce, control, store or survive that pressure difference.'},
  {t:'Two kinds of air, piped separately', p:'Compressed-air main',
   x:'A city network needs both. Red mains carry Druckluft — compressed air — outward; blue mains carry Saugluft, rarefied air, back. Now compare this pipe with the little tube beside it that the carrier actually travels in. The message pipe is the small one. Most of the buried iron here is not carrying messages at all; it is carrying the means of moving them.'},
  {t:'Where the pressure difference is manufactured', p:'Air compressor, high-pressure end', v:'machine',
   x:'Coal, boiler, compound engine, compressor and vacuum pump on one bedplate — the Luftpumpmaschine. Then a cooler, because compressed air comes out hot; then a separator, because hot air cooled drops its water; then a reservoir, because a piston compressor delivers in thumps rather than in a stream. Each machine in this row exists because of the one before it.'},
  {t:'Every station is an air-lock', p:'Sending chamber', v:'district',
   x:'You cannot open a tube that is under pressure. So the clerk loads into a short chamber, seals it, and only then turns the air-change cock to let the line take the carrier. Atmosphere, chamber, valve, pressurised tube. The American version does the same thing differently: a piece of the tube itself swings out on trunnions to be loaded.'},
  {t:'Under the roadway', p:'Lead street tube', v:'street',
   x:'Lead pipe drawn smooth with a heated mandrel and wiped at the joints, threaded inside a cast-iron duct about two feet down. Beside it, the American 8-inch cast-iron main with its lead-and-oakum joints. Every joint must be flush inside: one ridge and the traffic of a whole district stops. Every curve must be broad: a long carrier cannot turn a plumbing elbow.'},
  {t:'Stopping it again without breaking it', p:'Catching chamber and air cushion',
   x:'Twenty-one pounds of steel at thirty-five miles an hour has to be brought to rest in a few feet. Slots let the driving air escape sideways; the carrier runs on into a blind chamber where the air trapped ahead compresses and acts as a spring. Then a sluice gate opens and the mail rolls onto a table, where hands take over again.'},
  {t:'Nobody can see inside a pipe', p:'Circuit closer',
   x:'So the pneumatic system was wired throughout. A passing carrier closes a contact; that current locks the transmitters up the line for a few seconds, exactly as a railway block system does, and lets many carriers share one pipe safely. Bells, annunciators, telephones and time-locks are as much a part of this technology as the compressors are.'},
  {t:'Three countries, three different machines', p:'8-inch mail canister',
   x:'The same principle, built for three different jobs. London ran small tubes to shift telegram forms to its telegraphists. Berlin ran a genuine public Stadtrohrpost — you could hand in a letter and have it blown across town. America went the other way and built a bulk conveyor, with tubes wide enough to swallow six hundred letters at once. Set the carriers side by side on the stand and the difference in ambition is obvious.'},
  {t:'And the version everyone actually saw', p:'Cashier\u2019s cage', v:'store',
   x:'Not mail at all: cash. Brass tubes, a rotary blower, one building, and a cashier in a cage at the centre of a radial system. Telephones and teletypewriters killed the city networks — America shut its postal tubes at the end of 1953 as obsolete and excessively expensive — but the store tube survived, and its descendants still run in hospitals and banks today.'}
];
let tourAt = -1;
const tourEl = document.getElementById('tour');
function showTour(i){
  tourAt = Math.max(0, Math.min(TOUR.length-1, i));
  const s = TOUR[tourAt];
  tourEl.style.display = 'block';
  document.getElementById('tourStep').textContent = `${tourAt+1} / ${TOUR.length}`;
  document.getElementById('tourTitle').textContent = s.t;
  document.getElementById('tourText').textContent = s.x;
  if(s.v && !s.p){ const v = VIEWS[s.v]; controls.frame(v[0], v[1]); }
  if(s.p){
    const rec = parts.find(p=>p.name===s.p);
    if(rec) select(rec, true);
  }
  document.getElementById('hint').classList.add('hide');
  document.getElementById('tourPrev').disabled = tourAt===0;
  document.getElementById('tourNext').textContent = tourAt===TOUR.length-1 ? 'Finish' : 'Next \u2192';
}
document.getElementById('tourBtn').onclick = ()=>{
  if(tourEl.style.display==='block'){ endTour(); } else { showTour(0);
    document.getElementById('tourBtn').classList.add('on'); }
};
document.getElementById('tourNext').onclick = ()=>{
  if(tourAt===TOUR.length-1) endTour(); else showTour(tourAt+1); };
document.getElementById('tourPrev').onclick = ()=>showTour(tourAt-1);
document.getElementById('tourEnd').onclick = ()=>endTour();
function endTour(){
  tourEl.style.display='none'; tourAt=-1;
  document.getElementById('hint').classList.remove('hide');
  document.getElementById('tourBtn').classList.remove('on');
}
addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT') return;
  if(tourAt>=0 && e.code==='BracketRight') showTour(tourAt+1);
  if(e.code==='Escape'){ if(tourAt>=0) endTour(); else select(null); }
});

/* ---------- resize & scale bar -------------------------------------- */
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
const scaleTxt = document.getElementById('scaleTxt');
function updateScale(){
  const d = controls.sph.radius;
  const worldPerPx = 2*Math.tan(camera.fov*Math.PI/360)*d/innerHeight;
  const m = worldPerPx*120;
  scaleTxt.textContent = m < 1 ? (m*100).toFixed(0)+' cm'
                       : m < 10 ? m.toFixed(1)+' m' : m.toFixed(0)+' m';
}

/* ---------- main loop ------------------------------------------------ */
const clock = new THREE.Clock();
const up = V(0,1,0), q = new THREE.Quaternion();
function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  controls.update(dt);
  if(G.moving.visible) for(const c of movers){
    c.t = (c.t + c.v*dt) % 1;
    const p = c.curve.getPointAt(c.t), tn = c.curve.getTangentAt(c.t);
    c.g.position.copy(p);
    q.setFromUnitVectors(up, tn); c.g.quaternion.copy(q);
  }
  if(G.air.visible) for(const a of arrows){
    a.t = (a.t + a.v*dt) % 1;
    const p = a.curve.getPointAt(a.t);
    const tn = a.curve.getTangentAt(a.t);
    if(a.rev) tn.negate();
    a.m.position.copy(p);
    q.setFromUnitVectors(up, tn); a.m.quaternion.copy(q);
  }
  if(needPick) pick();
  updateScale();
  renderer.render(scene, camera);
}

/* ---------- raise pressure, then open ------------------------------- */
const boot = document.getElementById('boot'), needle = document.getElementById('bootNeedle'),
      rd = document.getElementById('bootRd'), bmsg = document.getElementById('bootMsg');
const bootSteps = ['raising steam','starting the compressor','charging the receiver','line clear'];
let bp = 0;
const bootTimer = setInterval(()=>{
  bp++;
  const lb = Math.min(bp*1.1, 10);
  needle.style.transform = `rotate(${-130 + lb*26}deg)`;
  rd.textContent = lb.toFixed(1)+' lb';
  bmsg.textContent = bootSteps[Math.min(Math.floor(bp/2.6), 3)];
  if(bp>=9){
    clearInterval(bootTimer);
    boot.style.opacity = 0;
    setTimeout(()=>boot.remove(), 700);
  }
}, 190);

controls.sphD.theta = 0.72; controls.sphD.phi = 1.02;
