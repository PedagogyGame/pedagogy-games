<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taste Level - Prototype</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --runway-color: #1a1a1a;
            --text-main: #f0f0f0;
            --text-muted: #888888;
            --accent: #ffffff;
            --stamp-red: #c01010;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* --- RUNWAY SCENE (Independent Timeline) --- */
        #scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            z-index: 1;
            perspective: 1000px;
        }

        #runway {
            width: 300px;
            height: 100%;
            background-color: var(--runway-color);
            border-left: 1px solid #333;
            border-right: 1px solid #333;
            position: relative;
            transform: rotateX(20deg) scale(1.2);
            transform-origin: bottom center;
        }

        .model-abstraction {
            position: absolute;
            top: -10%;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--text-muted);
            box-shadow: 0 20px 30px rgba(0,0,0,0.8);
            animation: walkRunway 24s infinite linear;
        }

        .model-abstraction::after {
            content: attr(data-look);
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        @keyframes walkRunway {
            0% { top: -10%; transform: translateX(-50%) scale(0.5); opacity: 0; }
            5% { opacity: 1; }
            45% { top: 85%; transform: translateX(-50%) scale(1.2); }
            50% { top: 85%; transform: translateX(-50%) scale(1.2); } /* Pause & Pivot */
            95% { top: -10%; transform: translateX(-50%) scale(0.5); opacity: 1;}
            100% { top: -10%; transform: translateX(-50%) scale(0.5); opacity: 0; }
        }

        /* --- UI LAYER (Independent Timeline) --- */
        #ui-layer {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 1200px;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
        }

        #top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        #taste-container {
            text-align: right;
        }

        #taste-label {
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        #taste-value {
            font-size: 24px;
            font-weight: 300;
        }

        #quiz-container {
            width: 400px;
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid #333;
            padding: 30px;
            pointer-events: auto;
            margin-bottom: auto;
            margin-top: auto;
        }

        #timer-bar {
            height: 2px;
            background-color: var(--accent);
            width: 100%;
            margin-bottom: 20px;
            transform-origin: left;
        }

        #question-difficulty {
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        #question-text {
            font-size: 18px;
            line-height: 1.4;
            font-weight: 300;
            margin-bottom: 30px;
        }

        .option-btn {
            display: block;
            width: 100%;
            background: transparent;
            border: 1px solid #333;
            color: var(--text-main);
            padding: 15px 20px;
            text-align: left;
            font-size: 14px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover {
            border-color: var(--accent);
        }

        .option-btn.correct { background: var(--accent); color: #000; }
        .option-btn.incorrect { border-color: #444; color: #555; }

        /* --- ENDGAME SEQUENCES --- */
        #stamp-layer {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            opacity: 0;
            background: rgba(0,0,0,0);
            transition: background 3s ease 2s; /* Fade to black delay */
        }

        #uninvited-stamp {
            color: var(--stamp-red);
            font-size: 120px;
            font-family: "Times New Roman", Times, serif;
            font-weight: bold;
            text-transform: uppercase;
            border: 10px solid var(--stamp-red);
            padding: 20px 40px;
            transform: scale(3) rotate(-15deg);
            opacity: 0;
            mix-blend-mode: screen;
            /* Faux ink texture */
            mask-image: url('data:image/svg+xml;utf8,<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="1.5" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noise)" opacity="0.8"/></svg>');
            -webkit-mask-image: url('data:image/svg+xml;utf8,<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noise)" opacity="0.5"/></svg>');
        }

        .stamp-active #stamp-layer { opacity: 1; }
        .stamp-active #uninvited-stamp {
            animation: stampDown 0.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        .stamp-active.fade-black #stamp-layer {
            background: rgba(0,0,0,1);
        }
        .stamp-active #ui-layer {
            opacity: 0;
            transition: opacity 0.3s;
        }

        @keyframes stampDown {
            0% { transform: scale(3) rotate(-15deg); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: scale(1) rotate(-15deg); opacity: 0.85; }
        }
    </style>
</head>
<body>

    <!-- Independent Runway Animation -->
    <div id="scene">
        <div id="runway">
            <div class="model-abstraction" data-look="Look 01: Column"></div>
        </div>
    </div>

    <!-- UI Overlay -->
    <div id="ui-layer">
        <div id="top-bar">
            <div>
                <!-- Spacer for aesthetic balance -->
            </div>
            <div id="taste-container">
                <div id="taste-label">Taste Level</div>
                <div id="taste-value">100</div>
            </div>
        </div>

        <div id="quiz-container">
            <div id="timer-bar"></div>
            <div id="question-difficulty">Level I — Familiar</div>
            <div id="question-text">Loading...</div>
            <div id="options"></div>
        </div>
    </div>

    <!-- Rejection Overlay -->
    <div id="stamp-layer">
        <div id="uninvited-stamp">Uninvited</div>
    </div>

    <script>
        // 10-term mock database covering all three difficulty tiers
        const lexicon = [
            { term: "Silhouette", def: "The garment's total outline on the body.", diff: 1, diffLabel: "Level I — Familiar", distractors: ["Drape", "Ease", "Contour"] },
            { term: "Monochrome", def: "A look composed chiefly of one color.", diff: 1, diffLabel: "Level I — Familiar", distractors: ["Tonal dressing", "Color blocking", "Ombré"] },
            { term: "Drape", def: "The way cloth falls, folds, and moves.", diff: 1, diffLabel: "Level I — Familiar", distractors: ["Hand", "Ease", "Grainline"] },
            { term: "Bias cut", def: "Fabric cut diagonally to its grain, creating stretch and fluidity.", diff: 2, diffLabel: "Level II — Professional", distractors: ["Princess seam", "Twill", "Gore"] },
            { term: "Ease", def: "Extra room built beyond body measurements for motion or style.", diff: 2, diffLabel: "Level II — Professional", distractors: ["Volume", "Scale", "Fit"] },
            { term: "Grainline", def: "Thread direction in cloth that governs hang, stretch, and stability.", diff: 2, diffLabel: "Level II — Professional", distractors: ["Nap", "Twill", "Bias cut"] },
            { term: "Hand", def: "Tactile quality of a fabric: crisp, dry, soft, plush, or papery.", diff: 2, diffLabel: "Level II — Professional", distractors: ["Texture", "Weight", "Luster"] },
            { term: "Armscye", def: "The shaped armhole where a sleeve joins the garment.", diff: 3, diffLabel: "Level III — Specialist", distractors: ["Yoke", "Dart", "Princess seam"] },
            { term: "Godet", def: "Inserted wedge that gives a garment controlled movement and fullness.", diff: 3, diffLabel: "Level III — Specialist", distractors: ["Gore", "Pleat", "Peplum"] },
            { term: "Canvassing", def: "Internal jacket structure that molds chest and lapel shape.", diff: 3, diffLabel: "Level III — Specialist", distractors: ["Interfacing", "Tailoring", "Bonded fabric"] }
        ];

        let taste = 100;
        let currentQuestion = null;
        let timer = null;
        let timeRemaining = 15;
        let questionActive = false;
        let usedQuestions = [];

        const elements = {
            tasteVal: document.getElementById('taste-value'),
            qText: document.getElementById('question-text'),
            qDiff: document.getElementById('question-difficulty'),
            options: document.getElementById('options'),
            timerBar: document.getElementById('timer-bar')
        };

        function initGame() {
            usedQuestions = [];
            nextQuestion();
            requestAnimationFrame(updateTimerVisual);
        }

        function nextQuestion() {
            if (taste <= 0) return;
            
            if (usedQuestions.length === lexicon.length) {
                usedQuestions = []; // Reset pool for prototype looping
            }

            // Pick random unused question
            let available = lexicon.filter(q => !usedQuestions.includes(q.term));
            currentQuestion = available[Math.floor(Math.random() * available.length)];
            usedQuestions.push(currentQuestion.term);

            // Setup UI
            elements.qDiff.textContent = currentQuestion.diffLabel;
            elements.qText.textContent = `Which term best describes: "${currentQuestion.def}"`;
            
            // Build options array (1 correct + 3 distractors) and shuffle
            let ops = [currentQuestion.term, ...currentQuestion.distractors];
            ops.sort(() => Math.random() - 0.5);

            elements.options.innerHTML = '';
            ops.forEach(op => {
                let btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = op;
                btn.onclick = () => handleAnswer(op, btn);
                elements.options.appendChild(btn);
            });

            timeRemaining = 15;
            questionActive = true;
            clearInterval(timer);
            timer = setInterval(() => {
                timeRemaining -= 0.1;
                if (timeRemaining <= 0) {
                    handleAnswer(null, null); // Timeout counts as wrong
                }
            }, 100);
        }

        function updateTimerVisual() {
            if (questionActive && timeRemaining > 0) {
                const pct = (timeRemaining / 15) * 100;
                elements.timerBar.style.transform = `scaleX(${pct / 100})`;
                
                // Visual cue for recovery window ending
                if (timeRemaining <= 5 && taste < 100) {
                     elements.timerBar.style.backgroundColor = '#555'; // Subdued after 10s
                } else {
                     elements.timerBar.style.backgroundColor = 'var(--accent)';
                }
            }
            if (taste > 0) requestAnimationFrame(updateTimerVisual);
        }

        function handleAnswer(selectedStr, btnNode) {
            if (!questionActive) return;
            questionActive = false;
            clearInterval(timer);

            const isCorrect = selectedStr === currentQuestion.term;
            
            // Reveal correct answer visually
            Array.from(elements.options.children).forEach(btn => {
                if (btn.textContent === currentQuestion.term) btn.classList.add('correct');
                else if (btn === btnNode) btn.classList.add('incorrect');
                btn.style.pointerEvents = 'none';
            });

            if (isCorrect) {
                // Recovery bonus (+10) if answered within first 10 seconds (timeRemaining > 5)
                if (timeRemaining > 5 && taste < 100) {
                    taste = Math.min(100, taste + 10);
                }
            } else {
                // Penalties based on difficulty
                const penalty = currentQuestion.diff === 1 ? 20 : (currentQuestion.diff === 2 ? 25 : 30);
                taste -= penalty;
                if (taste <= 0) taste = 0;
            }

            elements.tasteVal.textContent = taste;

            if (taste === 0) {
                triggerRejection();
            } else {
                setTimeout(nextQuestion, 1500); // Brief pause before next question
            }
        }

        function triggerRejection() {
            // Disconnect UI
            elements.timerBar.style.transform = `scaleX(0)`;
            
            // Trigger Stamp
            setTimeout(() => {
                document.body.classList.add('stamp-active');
                
                // Sound effect approximation (optional, using Web Audio API for a dull thud)
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(100, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } catch(e) {}

                // Fade room to black after the stamp settles
                setTimeout(() => {
                    document.body.classList.add('fade-black');
                }, 2000);

            }, 500);
        }

        // Start execution
        initGame();
    </script>
</body>
</html>
