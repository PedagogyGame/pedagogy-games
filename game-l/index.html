<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taste Level - Realism Environment Prototype</title>
    <style>
        :root {
            /* Palette: Serious, restrained, professional */
            --bg-color: #030303; /* Deep, architectural shadow */
            --runway-color: #1a1a1a; /* Warm grey concrete */
            --stage-wings: #0f0f0f;
            --text-main: #f0f0f0;
            --text-muted: #666666;
            --text-accent: #ffffff;
            
            /* Lighting: Controlled Studio Environment */
            --spotlight-core: #fffeef; /* 4200K (Warm Neutral White) */
            --crowd-tint: rgba(10, 10, 10, 0.9);
            --camera-flash: #ffffff;
            
            /* Game Mechanics */
            --stamp-red: #c01010;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            perspective: 2000px; /* High Balcony Perspective */
        }

        /* --- THE ROOM & ENVIRONMENT (WebGL Simulation) --- */
        #scene {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: flex-end; /* View looks down the axis */
            overflow: hidden;
        }

        /* Runway Surface (Deals with layout and initial perspective) */
        #runway {
            width: 320px; /* Approximately 2.8m virtual width */
            height: 120%; /* Extends well past the balcony */
            background-color: var(--runway-color);
            background-image: 
                radial-gradient(ellipse at 50% 70%, #2a2a2a 0%, #1a1a1a 80%);
            border-left: 2px solid #222;
            border-right: 2px solid #222;
            position: relative;
            transform: rotateX(55deg) translateY(100px); /* Primary perspective shift */
            transform-origin: bottom center;
            box-shadow: 0 -20px 100px 20px rgba(0,0,0,0.9);
        }

        /* The Spotlight Effect over the runway */
        #runway::after {
            content: '';
            position: absolute;
            top: -100%; left: 0; width: 100%; height: 300%;
            background: 
                radial-gradient(ellipse at 50% 50%, var(--spotlight-core) 0%, rgba(255,255,255,0) 60%),
                radial-gradient(ellipse at 50% 10%, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 80%);
            mix-blend-mode: overlay;
            pointer-events: none;
            opacity: 0.6;
            filter: blur(10px);
        }

        /* Background Architecture (Stage wings, audience dark) */
        #background-stage {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, #000000 0%, #080808 30%, #030303 100%);
            z-index: 0;
            pointer-events: none;
        }

        /* TURNAROUND SPOT (Far End) */
        #turnaround {
            position: absolute;
            bottom: 30px; /* Far end, near foreground in our perspective */
            left: 50%; transform: translateX(-50%) rotateX(-55deg);
            width: 150px; height: 150px;
            background: radial-gradient(circle, var(--spotlight-core) 0%, rgba(255,255,255,0) 70%);
            mix-blend-mode: overlay;
            opacity: 0.3;
        }

        /* --- CROWD & CAMERA CREW (Pure CSS Elements) --- */
        .crowd-row {
            position: absolute;
            width: 600px;
            height: 100%;
            top: 0;
            background-color: var(--bg-color);
            pointer-events: none;
            display: flex;
            justify-content: space-around;
            filter: blur(1px); /* Keep background soft */
        }
        .crowd-left { left: calc(50% - 620px); transform: rotateX(55deg) translateY(100px) rotateY(-5deg); }
        .crowd-right { right: calc(50% - 620px); transform: rotateX(55deg) translateY(100px) rotateY(5deg); }

        /* Abstract Spectator Silhouette */
        .spectator {
            width: 30px; height: 100%;
            background-color: #0d0d0d;
            border-radius: 15px 15px 0 0;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            position: relative;
        }
        .spectator::after {
            content: '';
            position: absolute;
            top: -20px; left: 50%; transform: translateX(-50%);
            width: 18px; height: 18px; border-radius: 50%;
            background-color: #0d0d0d;
        }

        /* Camera Men & Women (Placed at the end of the runway) */
        #camera-pit {
            position: absolute;
            bottom: -50px; left: 50%; transform: translateX(-50%) rotateX(-55deg);
            width: 400px; height: 150px;
            display: flex; justify-content: space-between; align-items: flex-end;
            pointer-events: none;
            opacity: 0.8;
            filter: blur(0.5px);
        }
        .cameraman {
            width: 40px; height: 100px;
            background: #0d0d0d;
            border-radius: 5px 5px 0 0;
            position: relative;
        }
        /* The Camera Lens abstraction */
        .cameraman::after {
            content: '';
            position: absolute;
            top: 10px; left: 10px;
            width: 20px; height: 20px;
            border-radius: 50%;
            background: #000;
            border: 2px solid #222;
        }

        /* Periodically Flash Animation */
        #flash-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--camera-flash);
            z-index: 5;
            opacity: 0;
            pointer-events: none;
        }
        @keyframes cameraFlash {
            0% { opacity: 0; }
            5% { opacity: 0.9; }
            10% { opacity: 0; }
            100% { opacity: 0; }
        }

        /* --- REFINED MODEL REPRESENTATION (CSS Approximation) --- */
        .model-abstraction {
            position: absolute;
            top: -10%; /* Backstage */
            left: 50%;
            transform: translateX(-50%) scale(0.6);
            width: 50px; /* Slender proportional scaling */
            height: 120px;
            background: radial-gradient(ellipse at 50% 20%, #ddd 0%, #aaa 100%);
            border-radius: 25px 25px 5px 5px;
            box-shadow: 0 50px 100px rgba(0,0,0,0.8);
            opacity: 0;
            animation: walkLoop 24s infinite linear;
            transition: opacity 0.5s;
        }
        
        .model-abstraction::after {
            content: attr(data-look);
            position: absolute;
            bottom: -30px; left: 50%; transform: translateX(-50%) rotateX(-55deg);
            white-space: nowrap;
            font-size: 10px;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-muted);
            mix-blend-mode: overlay;
        }

        /* The keyframe animation for the approach and receding */
        @keyframes walkLoop {
            0%   { top: -10%; transform: translateX(-50%) scale(0.6); opacity: 0; }
            2%   { opacity: 1; }
            45%  { top: 88%; transform: translateX(-50%) scale(1.3); } /* Turnaround Point */
            50%  { top: 88%; transform: translateX(-50%) scale(1.3); } /* Pivot/Pause */
            98%  { top: -10%; transform: translateX(-50%) scale(0.6); opacity: 1; }
            100% { top: -10%; transform: translateX(-50%) scale(0.6); opacity: 0; }
        }

        /* Specific visual IDs for the 3 model archetypes for the prototype loop */
        #model-column { background: linear-gradient(180deg, #111 0%, #111 100%); width: 45px; } /* Matte black Column */
        #model-a-line { background: linear-gradient(180deg, #ddd 0%, #bbb 100%); border-radius: 10px 10px 5px 5px; } /* Grey A-line */
        #model-hourglass { background: linear-gradient(180deg, #333 0%, #111 50%, #333 100%); width: 50px; border-radius: 25px 25px 25px 25px; } /* Cenched Waist structure */

        /* --- THE UI LAYER (HTML Editorial HUD) --- */
        #ui-layer {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 1200px;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
        }

        #top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        /* Upgraded Confidence Gauge */
        #taste-container {
            width: 150px;
            text-align: right;
        }
        #taste-label {
            font-size: 11px;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 8px;
        }
        #confidence-gauge {
            width: 100%;
            height: 4px;
            background-color: #222;
            position: relative;
            transform-origin: right;
        }
        #confidence-fill {
            position: absolute;
            top: 0; right: 0; width: 100%; height: 100%;
            background-color: var(--text-accent);
            transition: width 0.3s ease-out;
        }
        #taste-value {
            font-size: 32px;
            font-weight: 200; /* Editorial thickness */
            font-family: "Georgia", serif;
            margin-top: 4px;
        }

        #quiz-container {
            width: 420px;
            background: rgba(3, 3, 3, 0.9);
            backdrop-filter: blur(15px);
            border: 1px solid #222;
            padding: 40px;
            pointer-events: auto;
            margin-bottom: auto;
            margin-top: auto;
            transform: translateY(-20px); /* Adjust spacing */
            box-shadow: 0 20px 80px rgba(0,0,0,0.7);
        }

        #timer-bar {
            height: 1px; /* Minimalist */
            background-color: var(--text-muted);
            width: 100%;
            margin-bottom: 25px;
            transform-origin: left;
        }

        #question-difficulty {
            font-size: 10px;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        #question-text {
            font-size: 20px;
            line-height: 1.5;
            font-weight: 300;
            font-family: "Georgia", serif;
            margin-bottom: 40px;
        }

        .option-btn {
            display: block;
            width: 100%;
            background: transparent;
            border: 1px solid #222;
            color: var(--text-main);
            padding: 18px 25px;
            text-align: left;
            font-size: 14px;
            letter-spacing: 1px;
            font-weight: 300;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover {
            border-color: var(--text-muted);
            background: rgba(255,255,255,0.03);
        }

        .option-btn.correct { background: var(--text-accent); color: #000; border-color: var(--text-accent); }
        .option-btn.incorrect { border-color: #333; color: #444; }

        /* --- ENDGAME REJECTION --- */
        #stamp-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 100;
            display: flex; justify-content: center; align-items: center;
            pointer-events: none;
            opacity: 0;
            background: rgba(0,0,0,0);
            transition: background 3s ease 1s; /* Long fade-black delay */
        }

        #uninvited-stamp {
            color: var(--stamp-red);
            font-size: 130px;
            font-family: "Times New Roman", Times, serif;
            font-weight: bold;
            text-transform: uppercase;
            border: 12px solid var(--stamp-red);
            padding: 25px 50px;
            transform: scale(4) rotate(-18deg);
            opacity: 0;
            mix-blend-mode: color-dodge; /* Interacts with the dark background */
        }

        .stamp-active #stamp-layer { opacity: 1; }
        .stamp-active #uninvited-stamp {
            animation: stampDown 0.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        .stamp-active.fade-black #stamp-layer {
            background: rgba(0,0,0,1);
        }
        .stamp-active #ui-layer {
            opacity: 0;
            transition: opacity 0.5s;
        }

        @keyframes stampDown {
            0% { transform: scale(4) rotate(-18deg); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: scale(1) rotate(-18deg); opacity: 0.9; }
        }
    </style>
</head>
<body>

    <!-- 1. Environmental Simulation -->
    <div id="background-stage"></div>
    
    <div id="flash-layer"></div>
    
    <div id="scene">
        
        <!-- Audience: Silhouettes -->
        <div class="crowd-row crowd-left">
            <div class="spectator"></div><div class="spectator"></div><div class="spectator"></div><div class="spectator"></div>
            <div class="spectator"></div><div class="spectator"></div><div class="spectator"></div><div class="spectator"></div>
        </div>
        <div class="crowd-row crowd-right">
            <div class="spectator"></div><div class="spectator"></div><div class="spectator"></div><div class="spectator"></div>
            <div class="spectator"></div><div class="spectator"></div><div class="spectator"></div><div class="spectator"></div>
        </div>

        <div id="runway">
            <div id="turnaround"></div>
            
            <!-- 2. The Models (Independent Timeline) -->
            <!-- Model 1 (e.g. Look 01) -->
            <div id="model-column" class="model-abstraction" data-look="Look 01: Column"></div>
            
            <!-- Model 2 (offset) -->
            <div id="model-a-line" class="model-abstraction" data-look="Look 02: Romantic A-Line" style="animation-delay: 8s;"></div>
            
            <!-- Model 3 (offset) -->
            <div id="model-hourglass" class="model-abstraction" data-look="Look 05: Defined Hourglass" style="animation-delay: 16s;"></div>
            
        </div>

        <!-- 3. Camera Crew Pit -->
        <div id="camera-pit">
            <div class="cameraman"></div>
            <div class="cameraman"></div>
            <div class="cameraman"></div>
            <div class="cameraman"></div>
        </div>
    </div>

    <!-- 4. UI Layer (HTML Editorial HUD) -->
    <div id="ui-layer">
        <div id="top-bar">
            <div><!-- Spacer --></div>
            <div id="taste-container">
                <div id="taste-label">Confidence Gauge</div>
                <div id="confidence-gauge">
                    <div id="confidence-fill"></div>
                </div>
                <div id="taste-value">100</div>
            </div>
        </div>

        <div id="quiz-container">
            <div id="timer-bar"></div>
            <div id="question-difficulty">Loading...</div>
            <div id="question-text">Taste Level Examination</div>
            <div id="options"></div>
        </div>
    </div>

    <!-- 5. Rejection Overlay -->
    <div id="stamp-layer">
        <div id="uninvited-stamp">Uninvited</div>
    </div>

    <script>
        // Updated mock database covering different types (Form, Cut, Textile, Style)
        const lexicon = [
            { term: "Column", def: "Long, straight, narrow vertical shape.", diff: 1, diffLabel: "Form - Familiar", distractors: ["Sheath", "Shift", "Cocoon"] },
            { term: "Fit-and-flare", def: "Fitted through the torso, widening below the waist.", diff: 1, diffLabel: "Form - Familiar", distractors: ["Mermaid", "A-line", "Hourglass"] },
            { term: "Drape", def: "The way cloth falls, folds, and moves.", diff: 1, diffLabel: "Foundational - Familiar", distractors: ["Hand", "Ease", "Bias cut"] },
            { term: "Minimalist", def: "Reduced ornament, simplified palette, and emphasis on cut.", diff: 1, diffLabel: "Aesthetic - Familiar", distractors: ["Classic", "Quiet Luxury", "Refinement"] },
            
            { term: "Dart", def: "Tapered sewn wedge that shapes flat fabric around the body.", diff: 2, diffLabel: "Tailoring - Professional", distractors: ["Yoke", "Princess seam", "Twill"] },
            { term: "Bias cut", def: "Fabric cut diagonally to its grain, creating stretch and fluidity.", diff: 2, diffLabel: "Tailoring - Professional", distractors: ["Grainline", "Gore", "Dart"] },
            { term: "Bouclé", def: "Nubby, looped yarn or fabric with tactile irregularity.", diff: 2, diffLabel: "Material - Professional", distractors: ["Tweed", "Jacquard", "Linen"] },
            
            { term: "Armscye", def: "The shaped armhole where a sleeve joins the garment.", diff: 3, diffLabel: "Tailoring - Specialist", distractors: ["Dart", "Shoulder line", "Yoke"] },
            { term: "Gore", def: "Shaped panel inserted to create skirt flare.", diff: 3, diffLabel: "Cut - Specialist", distractors: ["Godet", "Dart", "Paneling"] },
            { term: "Passementerie", def: "Decorative braid, cord, fringe, tassel, or elaborate trim.", diff: 3, diffLabel: "Ornament - Specialist", distractors: ["Topstitching", "Appliqué", "Embrodiery"] }
        ];

        let taste = 100;
        let currentQuestion = null;
        let timer = null;
        let timeRemaining = 15;
        let questionActive = false;
        let usedQuestions = [];

        const elements = {
            tasteVal: document.getElementById('taste-value'),
            confidenceFill: document.getElementById('confidence-fill'),
            qText: document.getElementById('question-text'),
            qDiff: document.getElementById('question-difficulty'),
            options: document.getElementById('options'),
            timerBar: document.getElementById('timer-bar'),
            flash: document.getElementById('flash-layer')
        };

        function initGame() {
            usedQuestions = [];
            nextQuestion();
            requestAnimationFrame(updateTimerVisual);
            startCameraFlashes();
        }

        // Simulates the physical environment's random flashes
        function startCameraFlashes() {
            if (taste <= 0) return;
            const delay = 3000 + (Math.random() * 8000); // 3-11 seconds random interval
            setTimeout(() => {
                elements.flash.style.animation = 'cameraFlash 0.3s ease-out forwards';
                // Trigger thud sound effect approximation for flash
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(80, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.start(); osc.stop(ctx.currentTime + 0.1);
                } catch(e) {}

                // Reset flash
                setTimeout(() => { elements.flash.style.animation = 'none'; }, 300);
                startCameraFlashes();
            }, delay);
        }

        function nextQuestion() {
            if (taste <= 0) return;
            
            if (usedQuestions.length === lexicon.length) { usedQuestions = []; }

            let available = lexicon.filter(q => !usedQuestions.includes(q.term));
            currentQuestion = available[Math.floor(Math.random() * available.length)];
            usedQuestions.push(currentQuestion.term);

            elements.qDiff.textContent = currentQuestion.diffLabel;
            elements.qText.textContent = `Identify the professional term for: "${currentQuestion.def}"`;
            
            let ops = [currentQuestion.term, ...currentQuestion.distractors];
            ops.sort(() => Math.random() - 0.5);

            elements.options.innerHTML = '';
            ops.forEach(op => {
                let btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = op;
                btn.onclick = () => handleAnswer(op, btn);
                elements.options.appendChild(btn);
            });

            timeRemaining = 15;
            questionActive = true;
            clearInterval(timer);
            timer = setInterval(() => {
                timeRemaining -= 0.1;
                if (timeRemaining <= 0) { handleAnswer(null, null); }
            }, 100);
        }

        function updateTimerVisual() {
            if (questionActive && timeRemaining > 0) {
                const pct = (timeRemaining / 15) * 100;
                elements.timerBar.style.transform = `scaleX(${pct / 100})`;
                
                // Recovery Window visual (10s bonus)
                if (timeRemaining <= 5 && taste < 100) {
                     elements.timerBar.style.backgroundColor = '#444'; // Subdued color after 10s
                } else {
                     elements.timerBar.style.backgroundColor = '#aaa'; // Active/neutral
                }
            }
            if (taste > 0) requestAnimationFrame(updateTimerVisual);
        }

        function handleAnswer(selectedStr, btnNode) {
            if (!questionActive) return;
            questionActive = false;
            clearInterval(timer);

            const isCorrect = selectedStr === currentQuestion.term;
            
            Array.from(elements.options.children).forEach(btn => {
                if (btn.textContent === currentQuestion.term) btn.classList.add('correct');
                else if (btn === btnNode) btn.classList.add('incorrect');
                btn.style.pointerEvents = 'none';
            });

            if (isCorrect) {
                // Recovery bonus (+10) if answered fast (timeRemaining > 5s)
                if (timeRemaining > 5 && taste < 100) {
                    taste = Math.min(100, taste + 10);
                }
            } else {
                // Penalties by tier (Level I, II, III)
                const penalty = currentQuestion.diff === 1 ? 20 : (currentQuestion.diff === 2 ? 25 : 30);
                taste = Math.max(0, taste - penalty);
            }

            elements.tasteVal.textContent = taste;
            elements.confidenceFill.style.width = `${taste}%`;

            if (taste === 0) {
                triggerRejection();
            } else {
                setTimeout(nextQuestion, 1600); // Editorial pause
            }
        }

        function triggerRejection() {
            elements.timerBar.style.transform = `scaleX(0)`;
            
            // Wait slightly, then execute the brutal stamp
            setTimeout(() => {
                document.body.classList.add('stamp-active');
                
                // Physical stamping sound thud
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(110, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    gain.gain.setValueAtTime(1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.start(); osc.stop(ctx.currentTime + 0.4);
                } catch(e) {}

                // Final fade-to-black sequence
                setTimeout(() => {
                    document.body.classList.add('fade-black');
                }, 2000);

            }, 600);
        }

        // Execute initialization
        initGame();
    </script>
</body>
</html>
