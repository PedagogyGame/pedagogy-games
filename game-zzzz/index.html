<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#201813" />
<title>Courtroom Etiquette</title>
<style>
:root{
  --ivory:#eee4d2;
  --paper:#d7c7ad;
  --muted:#9f927f;
  --gold:#c8a36a;
  --gold2:#e5cca0;
  --panel:rgba(23,18,15,.91);
  --panel2:rgba(31,24,20,.84);
  --line:rgba(230,205,163,.34);
  --red:#8d3037;
  --green:#79ad83;
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#17110d;color:var(--ivory);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit}
#game,#scene{position:fixed;inset:0;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
#vignette,#grain{position:absolute;inset:0;pointer-events:none}
#vignette{z-index:4;background:radial-gradient(ellipse at 50% 48%,transparent 42%,rgba(6,4,3,.08) 67%,rgba(5,3,2,.48) 115%)}
#grain{z-index:5;opacity:.035;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.08) 0,rgba(255,255,255,.08) 1px,transparent 1px,transparent 4px);mix-blend-mode:soft-light}
#brand{position:absolute;z-index:20;left:30px;top:25px;pointer-events:none;text-shadow:0 2px 14px rgba(0,0,0,.72);transition:opacity .7s ease}
#brand .kicker{font-size:9px;letter-spacing:.36em;text-transform:uppercase;color:#c8b89f;margin-bottom:5px}
#brand h1{font-family:Georgia,"Times New Roman",serif;font-weight:500;font-size:clamp(26px,3vw,44px);letter-spacing:-.03em;margin:0}
#begin{position:absolute;z-index:26;left:50%;bottom:28px;transform:translateX(-50%);padding:13px 25px 12px;border:1px solid rgba(232,205,159,.6);border-radius:5px;color:#efe3cd;background:linear-gradient(180deg,rgba(87,63,42,.94),rgba(45,31,23,.96));box-shadow:0 10px 30px rgba(0,0,0,.38),inset 0 1px rgba(255,255,255,.09);letter-spacing:.15em;text-transform:uppercase;font-size:10px;cursor:pointer;transition:transform .18s ease,border-color .18s ease,opacity .5s ease,background .18s ease}
#begin:hover{transform:translateX(-50%) translateY(-2px);border-color:var(--gold2);background:linear-gradient(180deg,rgba(102,75,49,.97),rgba(49,34,25,.98))}
#hotspot{position:absolute;display:none;z-index:32;width:min(330px,calc(100vw - 28px));padding:15px 17px 16px;border:1px solid rgba(222,195,148,.48);border-radius:5px;background:rgba(26,20,16,.94);box-shadow:0 15px 45px rgba(0,0,0,.46),inset 0 1px rgba(255,255,255,.05);backdrop-filter:blur(10px);pointer-events:none}
#hotspot .term{font-family:Georgia,"Times New Roman",serif;font-size:20px;color:#efdfc4;margin-bottom:5px}
#hotspot .def{font-size:12px;line-height:1.52;color:#c8bcaa}
#quiz{position:absolute;inset:0;z-index:40;display:none;pointer-events:none}
#quiz.visible{display:block}
#juryMeter{position:absolute;top:25px;left:50%;width:min(420px,calc(100vw - 190px));transform:translateX(-50%);opacity:0;transition:opacity .65s ease}
#juryMeter.visible{opacity:1}
#juryMeterLabel{text-align:center;margin-bottom:7px;color:rgba(239,229,212,.72);font-size:9px;letter-spacing:.34em;text-transform:uppercase;text-shadow:0 2px 8px #000}
#meterTrack{position:relative;height:8px;border-radius:999px;border:1px solid rgba(255,255,255,.13);background:rgba(17,13,11,.72);box-shadow:0 4px 18px rgba(0,0,0,.48),inset 0 1px 4px rgba(0,0,0,.7)}
#meterSpectrum{position:absolute;inset:0;border-radius:inherit;background:linear-gradient(90deg,#651c25 0%,#8c2e37 12%,#9a4a48 25%,#9d7168 38%,#857c72 50%,#738675 62%,#649170 75%,#61a175 88%,#9cd6a4 100%)}
#meterMarker{position:absolute;left:50%;top:50%;width:14px;height:14px;transform:translate(-50%,-50%);border-radius:50%;background:#cfc4b0;border:2px solid rgba(44,32,25,.8);box-shadow:0 0 0 3px rgba(255,255,255,.08),0 0 16px rgba(235,219,190,.35);transition:left .6s cubic-bezier(.2,.7,.2,1),background .45s ease,box-shadow .45s ease}
#questionPanel{position:absolute;right:28px;bottom:26px;width:min(470px,calc(100vw - 36px));pointer-events:auto;opacity:0;transform:translateY(12px);transition:opacity .48s ease,transform .48s ease}
#questionPanel.visible{opacity:1;transform:none}
#card{overflow:hidden;border:1px solid var(--line);border-radius:6px;background:linear-gradient(145deg,rgba(35,28,23,.95),rgba(19,16,14,.94));box-shadow:0 18px 60px rgba(0,0,0,.48),inset 0 1px rgba(255,255,255,.05);backdrop-filter:blur(14px)}
#timerRail{height:4px;background:rgba(255,255,255,.055)}
#timerFill{height:100%;width:100%;background:linear-gradient(90deg,#86aa91,#c9ad70,#9a4a4e);transform-origin:left}
#cardBody{padding:19px 21px 18px}
#meta{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
#difficulty{font-size:9px;letter-spacing:.23em;text-transform:uppercase;color:#b4a793}
#qnum{font-size:10px;color:#82776b;font-variant-numeric:tabular-nums}
#definition{min-height:58px;margin-bottom:16px;color:#efe5d6;font-family:Georgia,"Times New Roman",serif;font-size:clamp(17px,1.8vw,23px);line-height:1.32}
#answers{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.answer{min-height:49px;padding:10px 12px;border:1px solid rgba(201,184,156,.2);border-radius:4px;background:rgba(255,255,255,.045);color:#d8cec0;text-align:left;font-size:12px;line-height:1.3;cursor:pointer;transition:background .16s ease,border-color .16s ease,transform .16s ease}
.answer:hover:not(:disabled){background:rgba(205,181,139,.11);border-color:rgba(220,197,154,.48);transform:translateY(-1px)}
.answer.correct{background:rgba(74,132,91,.23);border-color:rgba(109,181,130,.66);color:#d9f0df}
.answer.wrong{background:rgba(146,58,60,.24);border-color:rgba(194,91,93,.66);color:#f0d5d4}
.answer:disabled{cursor:default}
#feedback{min-height:20px;padding-top:10px;font-size:11px;color:#b8ad9e}
#feedback.good{color:#acd4b6}#feedback.bad{color:#d8a29f}
#fade{position:absolute;inset:0;z-index:100;background:#050403;opacity:0;pointer-events:none;transition:opacity 1.35s ease}
#fade.black{opacity:1}
#end{position:absolute;inset:0;z-index:110;display:flex;flex-direction:column;justify-content:center;align-items:center;opacity:0;pointer-events:none;transition:opacity .9s ease}
#end.visible{opacity:1;pointer-events:auto}
#end .small{font-size:9px;letter-spacing:.32em;text-transform:uppercase;color:#7e7468;margin-bottom:10px}
#endTitle{margin:0 0 20px;font-family:Georgia,"Times New Roman",serif;font-size:clamp(35px,6vw,68px);font-weight:400;color:#e3d6c0}
#restart{padding:11px 18px;border:1px solid rgba(216,195,157,.42);border-radius:4px;background:rgba(255,255,255,.04);color:#bdb0a0;letter-spacing:.18em;text-transform:uppercase;font-size:9px;cursor:pointer}
#restart:hover{border-color:rgba(216,195,157,.78);color:#eadcc5}
@media(max-width:720px){#brand{left:16px;top:16px}#brand h1{font-size:27px}#juryMeter{top:16px;left:auto;right:16px;width:45vw;transform:none}#questionPanel{left:13px;right:13px;bottom:13px;width:auto}#answers{grid-template-columns:1fr}#cardBody{padding:15px}#definition{min-height:0;font-size:17px}#begin{bottom:17px}}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="game">
  <div id="scene"></div>
  <div id="vignette"></div>
  <div id="grain"></div>
  <div id="brand"><div class="kicker">Pedagogy Game</div><h1>Courtroom Etiquette</h1></div>
  <button id="begin">Begin Proceedings</button>
  <div id="hotspot"><div class="term"></div><div class="def"></div></div>
  <div id="quiz">
    <div id="juryMeter">
      <div id="juryMeterLabel">Jury Persuasion</div>
      <div id="meterTrack"><div id="meterSpectrum"></div><div id="meterMarker"></div></div>
    </div>
    <div id="questionPanel">
      <div id="card">
        <div id="timerRail"><div id="timerFill"></div></div>
        <div id="cardBody">
          <div id="meta"><span id="difficulty"></span><span id="qnum"></span></div>
          <div id="definition"></div>
          <div id="answers"></div>
          <div id="feedback"></div>
        </div>
      </div>
    </div>
  </div>
  <div id="fade"></div>
  <div id="end"><div class="small">Courtroom Etiquette</div><h2 id="endTitle"></h2><button id="restart">Enter Court Again</button></div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =========================================================
   SCENE
   ========================================================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x887664);
scene.fog = new THREE.FogExp2(0x887664, 0.0125);

const camera = new THREE.PerspectiveCamera(47, innerWidth / innerHeight, 0.1, 120);
camera.position.set(0.8, 5.2, 13.6);

const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.07;
document.querySelector('#scene').appendChild(renderer.domElement);

/* =========================================================
   EXPLORATION CAMERA
   Fixed-seat exploration: free zoom toward cursor, limited swivel.
   Clicking identifies objects but never moves the camera.
   ========================================================= */
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.15, -2.7);
controls.enableDamping = false;
controls.enableZoom = true;
controls.enablePan = true;
controls.screenSpacePanning = true;
controls.zoomToCursor = true;
controls.minDistance = 4.5;
controls.maxDistance = 23;
controls.minPolarAngle = THREE.MathUtils.degToRad(53);
controls.maxPolarAngle = THREE.MathUtils.degToRad(83);
controls.minAzimuthAngle = THREE.MathUtils.degToRad(-36);
controls.maxAzimuthAngle = THREE.MathUtils.degToRad(36);
controls.rotateSpeed = 0.42;
controls.panSpeed = 0.68;
controls.zoomSpeed = 0.85;
controls.addEventListener('change',()=>{
  controls.target.x = THREE.MathUtils.clamp(controls.target.x,-4.8,4.8);
  controls.target.y = THREE.MathUtils.clamp(controls.target.y,1.0,4.5);
  controls.target.z = THREE.MathUtils.clamp(controls.target.z,-7.0,4.2);
});

/* =========================================================
   MATERIALS
   ========================================================= */
const M = {
  walnut:new THREE.MeshStandardMaterial({color:0x4b2e22,roughness:.43,metalness:.02}),
  walnut2:new THREE.MeshStandardMaterial({color:0x684431,roughness:.50}),
  darkwood:new THREE.MeshStandardMaterial({color:0x281712,roughness:.52}),
  brass:new THREE.MeshStandardMaterial({color:0xa98548,roughness:.33,metalness:.58}),
  carpet:new THREE.MeshStandardMaterial({color:0x514641,roughness:.96}),
  aisle:new THREE.MeshStandardMaterial({color:0x5b504a,roughness:.96}),
  wall:new THREE.MeshStandardMaterial({color:0xb7a58e,roughness:.9}),
  plaster:new THREE.MeshStandardMaterial({color:0xd7cab7,roughness:.95}),
  leather:new THREE.MeshStandardMaterial({color:0x2d2521,roughness:.72}),
  paper:new THREE.MeshStandardMaterial({color:0xd9d1c2,roughness:.92}),
  black:new THREE.MeshStandardMaterial({color:0x161413,roughness:.78}),
  blueFabric:new THREE.MeshStandardMaterial({color:0x273b4b,roughness:.85}),
  invisible:new THREE.MeshBasicMaterial({transparent:true,opacity:.001,depthWrite:false})
};

/* =========================================================
   LIGHTING
   ========================================================= */
scene.add(new THREE.HemisphereLight(0xf5e5c8,0x2d241f,1.45));
const sun = new THREE.DirectionalLight(0xffe0b3,3.1);
sun.position.set(-7.5,11,6.5); sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048); sun.shadow.camera.left=-12; sun.shadow.camera.right=12; sun.shadow.camera.top=13; sun.shadow.camera.bottom=-10;
scene.add(sun);
const benchGlow = new THREE.SpotLight(0xffd8a3,38,27,Math.PI/5.2,.68,1.15);
benchGlow.position.set(0,7.4,-2.6); benchGlow.target.position.set(0,2.1,-8.7); scene.add(benchGlow,benchGlow.target);
const juryGlow = new THREE.PointLight(0xffd6aa,7.5,12,1.45); juryGlow.position.set(-6.0,4.0,-2.3); scene.add(juryGlow);

/* =========================================================
   GEOMETRY HELPERS
   ========================================================= */
function meshBox(w,h,d,mat){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.castShadow=true; m.receiveShadow=true; return m; }
function addBox(parent,w,h,d,mat,x=0,y=0,z=0,rx=0,ry=0,rz=0){ const m=meshBox(w,h,d,mat); m.position.set(x,y,z); m.rotation.set(rx,ry,rz); parent.add(m); return m; }
function box(w,h,d,mat,x=0,y=0,z=0,rx=0,ry=0,rz=0){ const m=meshBox(w,h,d,mat); m.position.set(x,y,z); m.rotation.set(rx,ry,rz); scene.add(m); return m; }
function addCylinder(parent,r,h,mat,x=0,y=0,z=0,segments=18){ const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,segments),mat); m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; parent.add(m); return m; }
function woodPanel(x,y,z,w,h,ry=0){ const g=new THREE.Group(); g.position.set(x,y,z); g.rotation.y=ry; addBox(g,w,h,.09,M.walnut2); const t=.06; addBox(g,w-.12,t,.13,M.darkwood,0,h/2-.09,.04); addBox(g,w-.12,t,.13,M.darkwood,0,-h/2+.09,.04); addBox(g,t,h-.16,.13,M.darkwood,-w/2+.09,0,.04); addBox(g,t,h-.16,.13,M.darkwood,w/2-.09,0,.04); scene.add(g); return g; }

/* =========================================================
   HOTSPOTS
   ========================================================= */
const hotspotRoots=[];
function hotspot(object,label,definition){ object.userData.hotspot={label,definition}; hotspotRoots.push(object); return object; }

/* =========================================================
   COURTROOM ARCHITECTURE
   Generic U.S. trial courtroom: center bench, side jury box,
   attorney tables in the well, public gallery behind the bar.
   ========================================================= */
box(18,.3,23,M.carpet,0,-.18,0);
box(2.05,.012,22.2,M.aisle,0,.005,.3);
box(18,8.6,.36,M.wall,0,4.08,-10.15);
box(.36,8.6,23,M.wall,-9.08,4.08,0);
box(.36,8.6,23,M.wall,9.08,4.08,0);
box(18.25,.3,.45,M.plaster,0,7.82,-9.9);
box(.45,.3,23,M.plaster,-8.83,7.82,0);
box(.45,.3,23,M.plaster,8.83,7.82,0);

for(let x=-7.8;x<=7.8;x+=2.6) woodPanel(x,1.12,-9.92,2.45,2.08);
for(let z=-8.5;z<=9;z+=2.8){ woodPanel(-8.87,1.12,z,2.52,2.08,Math.PI/2); woodPanel(8.87,1.12,z,2.52,2.08,Math.PI/2); }

/* pilasters */
for(const x of [-6,-3,0,3,6]){ box(.22,5.1,.18,M.plaster,x,5.12,-9.88); box(.52,.18,.3,M.plaster,x,2.62,-9.84); box(.52,.18,.3,M.plaster,x,7.62,-9.84); }

/* windows */
function windowAssembly(x,z){ const g=new THREE.Group(); g.position.set(x,4.8,z); g.rotation.y=Math.PI/2; const glass=new THREE.Mesh(new THREE.PlaneGeometry(2.2,4.05),new THREE.MeshStandardMaterial({color:0xb7d2d2,transparent:true,opacity:.34,roughness:.18})); g.add(glass); addBox(g,2.45,.15,.18,M.darkwood,0,2.1,.03); addBox(g,2.45,.15,.18,M.darkwood,0,-2.1,.03); addBox(g,.15,4.3,.18,M.darkwood,-1.15,0,.03); addBox(g,.15,4.3,.18,M.darkwood,1.15,0,.03); addBox(g,.09,4.1,.14,M.darkwood,0,0,.04); addBox(g,2.25,.09,.14,M.darkwood,0,0,.04); scene.add(g); }
windowAssembly(-8.69,-6.7); windowAssembly(-8.69,-1.7); windowAssembly(-8.69,3.3);

/* rear courtroom entry / soundlock visual */
const entry = new THREE.Group(); entry.position.set(0,0,10.05);
addBox(entry,4.8,3.35,.18,M.darkwood,0,1.68,0);
addBox(entry,2.12,2.9,.12,new THREE.MeshStandardMaterial({color:0x503327,roughness:.6}),-1.15,1.46,-.11);
addBox(entry,2.12,2.9,.12,new THREE.MeshStandardMaterial({color:0x503327,roughness:.6}),1.15,1.46,-.11);
addCylinder(entry,.06,.10,M.brass,-.3,1.4,-.22,12); addCylinder(entry,.06,.10,M.brass,.3,1.4,-.22,12);
scene.add(entry);
hotspot(entry,'Courtroom Entry / Soundlock','Many formal courtrooms use a vestibule or soundlock at the public entrance to reduce noise and preserve courtroom acoustics.');

/* judge platform: approximately the visual relationship of a raised federal bench */
const judgePlatform = hotspot(box(8.5,.46,3.45,M.darkwood,0,.08,-8.35),'Dais','The raised platform supporting the judge’s bench.');

const judgeBench = new THREE.Group(); judgeBench.position.set(0,.45,-8.34);
addBox(judgeBench,5.35,1.92,1.28,M.walnut,0,1.36,0);
addBox(judgeBench,5.65,.18,1.56,M.darkwood,0,2.38,-.02);
for(let x=-2.18;x<=2.18;x+=1.09) addBox(judgeBench,.065,1.48,.09,M.darkwood,x,1.35,.64);
addBox(judgeBench,5.05,.09,.08,M.brass,0,.58,.665);
scene.add(judgeBench);
hotspot(judgeBench,'Judge’s Bench','The elevated desk from which the judge presides over the courtroom. “Approach the bench” means the attorneys come forward to speak with the judge.');

/* generic court seal */
function sealTexture(){ const c=document.createElement('canvas'); c.width=c.height=512; const ctx=c.getContext('2d'); ctx.fillStyle='#5c4328'; ctx.beginPath(); ctx.arc(256,256,220,0,Math.PI*2); ctx.fill(); ctx.strokeStyle='#c9a96d'; ctx.lineWidth=18; ctx.beginPath(); ctx.arc(256,256,202,0,Math.PI*2); ctx.stroke(); ctx.strokeStyle='#dbc398'; ctx.lineWidth=9; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(256,135);ctx.lineTo(256,340);ctx.moveTo(172,195);ctx.lineTo(340,195);ctx.moveTo(192,195);ctx.lineTo(160,260);ctx.moveTo(320,195);ctx.lineTo(352,260);ctx.stroke();ctx.beginPath();ctx.arc(160,270,48,0,Math.PI);ctx.stroke();ctx.beginPath();ctx.arc(352,270,48,0,Math.PI);ctx.stroke(); ctx.fillStyle='#e0cba4';ctx.font='bold 36px Georgia';ctx.textAlign='center';ctx.fillText('COURT',256,398); const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t; }
const seal=new THREE.Mesh(new THREE.CircleGeometry(1.18,64),new THREE.MeshStandardMaterial({map:sealTexture(),roughness:.55})); seal.position.set(0,5.22,-9.92); scene.add(seal); hotspot(seal,'Court Seal','A court seal or jurisdictional emblem commonly appears behind or near the judge’s bench. This game uses a generic, non-jurisdictional seal.');

/* flags, decorative not clickable */
function makeFlag(x,z,colors){ const g=new THREE.Group(); g.position.set(x,0,z); addCylinder(g,.035,5.6,M.brass,0,3.0,0,12); const cloth=new THREE.Mesh(new THREE.PlaneGeometry(1.15,2.2,1,1),new THREE.MeshStandardMaterial({color:colors[0],side:THREE.DoubleSide,roughness:.8})); cloth.position.set(.57,4.7,.02); g.add(cloth); scene.add(g); }
makeFlag(-3.65,-9.73,[0x314e73]); makeFlag(3.65,-9.73,[0x6d3a36]);

/* =========================================================
   FURNITURE
   ========================================================= */
function makeTable(w=3.6,d=1.35){ const g=new THREE.Group(); addBox(g,w,.14,d,M.walnut,0,1.12,0); for(const sx of [-w/2+.28,w/2-.28]) for(const sz of [-d/2+.22,d/2-.22]) addBox(g,.2,1.08,.2,M.darkwood,sx,.56,sz); addBox(g,w-.38,.09,.08,M.brass,0,1.05,d/2-.02); return g; }
function addTableMicrophone(parent,x,z){ const stem=new THREE.Mesh(new THREE.CylinderGeometry(.018,.018,.36,10),M.black); stem.position.set(x,1.36,z); stem.rotation.z=-.32; parent.add(stem); const head=new THREE.Mesh(new THREE.SphereGeometry(.055,12,8),M.black); head.position.set(x+.055,1.52,z); parent.add(head); }

/* Jury box at left, prosecution/plaintiff table placed nearer it; defense table right. */
const plaintiffTable=makeTable(3.75,1.38); plaintiffTable.position.set(-2.25,0,-1.15); addTableMicrophone(plaintiffTable,.8,-.15); scene.add(plaintiffTable);
hotspot(plaintiffTable,'Prosecution / Plaintiff’s Counsel Table','One of the attorney tables in the well. In a criminal case it may be used by the prosecution; in a civil case by the plaintiff’s side. Exact table assignments vary by courtroom.');
const defenseTable=makeTable(3.75,1.38); defenseTable.position.set(2.35,0,-.25); addTableMicrophone(defenseTable,-.75,-.1); scene.add(defenseTable);
hotspot(defenseTable,'Defense / Defendant’s Counsel Table','The attorney table used by the defendant and defense counsel. Exact placement varies by courtroom.');

/* papers + case folders */
for(const [x,z,r,c] of [[-2.6,-1.15,.1,0xd7d0c4],[-1.72,-1.0,-.12,0x8b6b45],[1.75,-.18,.08,0xd7d0c4],[2.72,-.1,-.11,0x795b3d]]) box(.65,.018,.88,new THREE.MeshStandardMaterial({color:c,roughness:.92}),x,1.205,z,0,r,0);

/* lectern */
const lectern=new THREE.Group(); lectern.position.set(-.15,0,-3.6); addBox(lectern,.76,1.18,.58,M.walnut,0,.59,0); const top=addBox(lectern,.9,.09,.68,M.darkwood,0,1.25,-.03); top.rotation.x=-.13; addBox(lectern,.06,.34,.06,M.brass,.27,1.46,-.1,0,0,-.25); scene.add(lectern);

const QUESTION_TIME=16000;
let persuasion=50,deck=[],current=null,questionStart=0,answerLocked=false,questionCount=0,quizActive=false;
const quiz=document.querySelector('#quiz'),questionPanel=document.querySelector('#questionPanel'),definitionEl=document.querySelector('#definition'),answersEl=document.querySelector('#answers'),feedbackEl=document.querySelector('#feedback'),difficultyEl=document.querySelector('#difficulty'),qnumEl=document.querySelector('#qnum'),timerFill=document.querySelector('#timerFill'),meterMarker=document.querySelector('#meterMarker'),juryMeter=document.querySelector('#juryMeter');
function shuffle(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r}
function tier(n){if(n<=20)return'Foundational';if(n<=40)return'Trial Language';if(n<=55)return'Procedure';if(n<=63)return'Evidence';return'Advanced'}
function refillDeck(){deck=[];for(const [a,b] of [[5,20],[21,40],[41,55],[56,63],[64,70]])deck.push(...shuffle(TERMS.filter(t=>t.n>=a&&t.n<=b)));}
function optionsFor(correct){const sameTier=shuffle(TERMS.filter(t=>t!==correct&&tier(t.n)===tier(correct.n)));const others=shuffle(TERMS.filter(t=>t!==correct&&!sameTier.includes(t)));return shuffle([correct,...sameTier.slice(0,3),...others].slice(0,4));}
function ask(){if(!quizActive)return;if(!deck.length)refillDeck();current=deck.shift();questionCount++;answerLocked=false;definitionEl.textContent=current.def;difficultyEl.textContent=tier(current.n);qnumEl.textContent=`QUESTION ${questionCount}`;feedbackEl.textContent='';feedbackEl.className='';answersEl.innerHTML='';for(const opt of optionsFor(current)){const b=document.createElement('button');b.className='answer';b.textContent=opt.term;b.addEventListener('click',()=>grade(opt,b));answersEl.appendChild(b)}questionStart=performance.now();timerFill.style.transform='scaleX(1)';}
function grade(selected,button,timedOut=false){if(answerLocked||!current)return;answerLocked=true;const elapsed=performance.now()-questionStart,correct=selected===current;const buttons=[...answersEl.querySelectorAll('.answer')];buttons.forEach(b=>{b.disabled=true;if(b.textContent===current.term)b.classList.add('correct')});if(!correct&&button)button.classList.add('wrong');let delta;if(correct){const quick=elapsed<=QUESTION_TIME/2;delta=5+(quick?3:0);feedbackEl.textContent=quick?`Correct · Quick answer +${delta}`:`Correct · +${delta}`;feedbackEl.className='good'}else{delta=current.n<=20?-15:-10;feedbackEl.textContent=timedOut?`Time · ${delta} · ${current.term}`:`Incorrect · ${delta} · ${current.term}`;feedbackEl.className='bad'}setPersuasion(persuasion+delta);if(persuasion<=0){setTimeout(triggerLoss,420);return}if(persuasion>=100){setTimeout(triggerWin,520);return}setTimeout(ask,1050);}

/* =========================================================
   JURY MOOD — score is not shown numerically.
   Mood changes in approximately 10-point bands.
   ========================================================= */
function scoreColor(s){if(s<20)return'#8e2832';if(s<30)return'#a44347';if(s<40)return'#a9675e';if(s<50)return'#948078';if(s<60)return'#c7bda9';if(s<70)return'#7f9680';if(s<80)return'#6f9e78';if(s<90)return'#70b17d';return'#a2d8a8'}
function setPersuasion(v){persuasion=THREE.MathUtils.clamp(Math.round(v),0,100);meterMarker.style.left=`${persuasion}%`;const c=scoreColor(persuasion);meterMarker.style.background=c;meterMarker.style.boxShadow=`0 0 0 3px rgba(255,255,255,.08),0 0 17px ${c}`;updateJuryMood();}
function updateJuryMood(){const band=Math.round(persuasion/10)*10;const mood=THREE.MathUtils.clamp((band-50)/50,-1,1);jurorFaces.forEach((j,i)=>{const variation=Math.sin(i*2.1)*.055;const m=THREE.MathUtils.clamp(mood+variation,-1,1);drawFace(j.faceData,m);j.head.rotation.x=-m*.018;j.torso.rotation.x=-m*.012;});}
setPersuasion(50);

/* =========================================================
   BEGIN PROCEEDINGS — locked camera behind defense side.
   Jury remains in the left half of frame and judge at front.
   ========================================================= */
const begin=document.querySelector('#begin'),brand=document.querySelector('#brand');let transition=null;
begin.addEventListener('click',startTrial);
function startTrial(){if(!explore)return;explore=false;if(selectedHelper){scene.remove(selectedHelper);selectedHelper=null}hotspotCard.style.display='none';begin.style.opacity='0';begin.style.pointerEvents='none';brand.style.opacity='.28';controls.enabled=false;transition={start:performance.now(),duration:1250,fromPos:camera.position.clone(),toPos:new THREE.Vector3(3.75,3.12,7.55),fromTarget:controls.target.clone(),toTarget:new THREE.Vector3(-1.7,1.92,-3.25)};quiz.classList.add('visible');setTimeout(()=>{juryMeter.classList.add('visible');questionPanel.classList.add('visible');quizActive=true;refillDeck();ask();wakeAudio();},1180);}
function updateTransition(now){if(!transition)return;const raw=(now-transition.start)/transition.duration,t=THREE.MathUtils.clamp(raw,0,1),e=t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;camera.position.lerpVectors(transition.fromPos,transition.toPos,e);const target=new THREE.Vector3().lerpVectors(transition.fromTarget,transition.toTarget,e);camera.lookAt(target);if(t>=1){transition=null;controls.enabled=false;}}

/* =========================================================
   END STATES
   ========================================================= */
let lossActive=false,lossStart=0;const strikes=new Set(),fade=document.querySelector('#fade'),end=document.querySelector('#end'),endTitle=document.querySelector('#endTitle');
function triggerLoss(){if(lossActive)return;quizActive=false;answerLocked=true;lossActive=true;questionPanel.classList.remove('visible');juryMeter.classList.remove('visible');lossStart=performance.now();strikes.clear();}
function animateLoss(now){if(!lossActive)return;const elapsed=(now-lossStart)/1000,times=[.1,.68,1.25];let rot=0;times.forEach((st,i)=>{const local=elapsed-st;if(local>=0&&local<.44){const p=local/.44;rot=p<.4?THREE.MathUtils.lerp(0,-1.42,p/.4):THREE.MathUtils.lerp(-1.42,.30,(p-.4)/.6)}if(elapsed>=st+.18&&!strikes.has(i)){playGavel();strikes.add(i)}});judge.userData.rightArm.rotation.x=rot;if(elapsed>1.85)fade.classList.add('black');if(elapsed>3.1){endTitle.textContent='Court Adjourned';end.classList.add('visible')}}
function triggerWin(){quizActive=false;answerLocked=true;questionPanel.classList.remove('visible');setTimeout(()=>{fade.classList.add('black');setTimeout(()=>{endTitle.textContent='Jury Persuaded';end.classList.add('visible')},1100)},800);}
let audio=null;function wakeAudio(){try{if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}catch(e){}}
function playGavel(){try{wakeAudio();if(!audio)return;const now=audio.currentTime,osc=audio.createOscillator(),gain=audio.createGain();osc.type='sine';osc.frequency.setValueAtTime(118,now);osc.frequency.exponentialRampToValueAtTime(55,now+.14);gain.gain.setValueAtTime(.62,now);gain.gain.exponentialRampToValueAtTime(.001,now+.25);osc.connect(gain);gain.connect(audio.destination);osc.start(now);osc.stop(now+.26);const buffer=audio.createBuffer(1,audio.sampleRate*.09,audio.sampleRate),ch=buffer.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=(Math.random()*2-1)*Math.pow(1-i/ch.length,3);const src=audio.createBufferSource(),filter=audio.createBiquadFilter(),ng=audio.createGain();src.buffer=buffer;filter.type='bandpass';filter.frequency.value=680;filter.Q.value=.7;ng.gain.value=.25;src.connect(filter);filter.connect(ng);ng.connect(audio.destination);src.start(now)}catch(e){}}
document.querySelector('#restart').addEventListener('click',()=>location.reload());

/* =========================================================
   LOOP
   ========================================================= */
function loop(now=performance.now()){requestAnimationFrame(loop);const t=clock.getElapsedTime();if(explore)controls.update();updateTransition(now);animatePeople(t);animateLoss(now);if(quizActive&&current&&!answerLocked){const remaining=Math.max(0,1-(now-questionStart)/QUESTION_TIME);timerFill.style.transform=`scaleX(${remaining})`;if(remaining<=0)grade(null,null,true)}renderer.render(scene,camera)}
loop();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
