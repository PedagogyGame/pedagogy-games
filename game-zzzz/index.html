<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#201813" />
<title>Courtroom Etiquette</title>
<style>
:root{
  --ivory:#eee4d2;
  --paper:#d7c7ad;
  --muted:#9f927f;
  --gold:#c8a36a;
  --gold2:#e5cca0;
  --panel:rgba(23,18,15,.91);
  --panel2:rgba(31,24,20,.84);
  --line:rgba(230,205,163,.34);
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#17110d;color:var(--ivory);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit}
#game,#scene{position:fixed;inset:0;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
#vignette,#grain{position:absolute;inset:0;pointer-events:none}
#vignette{z-index:4;background:radial-gradient(ellipse at 50% 48%,transparent 42%,rgba(6,4,3,.08) 67%,rgba(5,3,2,.48) 115%)}
#grain{z-index:5;opacity:.035;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.08) 0,rgba(255,255,255,.08) 1px,transparent 1px,transparent 4px);mix-blend-mode:soft-light}
#brand{position:absolute;z-index:20;left:30px;top:25px;pointer-events:none;text-shadow:0 2px 14px rgba(0,0,0,.72);transition:opacity .7s ease}
#brand .kicker{font-size:9px;letter-spacing:.36em;text-transform:uppercase;color:#c8b89f;margin-bottom:5px}
#brand h1{font-family:Georgia,"Times New Roman",serif;font-weight:500;font-size:clamp(26px,3vw,44px);letter-spacing:-.03em;margin:0}
#begin{position:absolute;z-index:26;left:50%;bottom:28px;transform:translateX(-50%);padding:13px 25px 12px;border:1px solid rgba(232,205,159,.6);border-radius:5px;color:#efe3cd;background:linear-gradient(180deg,rgba(87,63,42,.94),rgba(45,31,23,.96));box-shadow:0 10px 30px rgba(0,0,0,.38),inset 0 1px rgba(255,255,255,.09);letter-spacing:.15em;text-transform:uppercase;font-size:10px;cursor:pointer;transition:transform .18s ease,border-color .18s ease,opacity .5s ease,background .18s ease}
#begin:hover{transform:translateX(-50%) translateY(-2px);border-color:var(--gold2);background:linear-gradient(180deg,rgba(102,75,49,.97),rgba(49,34,25,.98))}
#hotspot{position:absolute;display:none;z-index:32;width:min(350px,calc(100vw - 28px));padding:15px 17px 16px;border:1px solid rgba(222,195,148,.48);border-radius:5px;background:rgba(26,20,16,.94);box-shadow:0 15px 45px rgba(0,0,0,.46),inset 0 1px rgba(255,255,255,.05);backdrop-filter:blur(10px);pointer-events:none}
#hotspot .term{font-family:Georgia,"Times New Roman",serif;font-size:20px;color:#efdfc4;margin-bottom:5px}
#hotspot .def{font-size:12px;line-height:1.52;color:#c8bcaa}
#quiz{position:absolute;inset:0;z-index:40;display:none;pointer-events:none}
#quiz.visible{display:block}
#juryMeter{position:absolute;top:25px;left:50%;width:min(420px,calc(100vw - 190px));transform:translateX(-50%);opacity:0;transition:opacity .65s ease}
#juryMeter.visible{opacity:1}
#juryMeterLabel{text-align:center;margin-bottom:7px;color:rgba(239,229,212,.72);font-size:9px;letter-spacing:.34em;text-transform:uppercase;text-shadow:0 2px 8px #000}
#meterTrack{position:relative;height:8px;border-radius:999px;border:1px solid rgba(255,255,255,.13);background:rgba(17,13,11,.72);box-shadow:0 4px 18px rgba(0,0,0,.48),inset 0 1px 4px rgba(0,0,0,.7)}
#meterSpectrum{position:absolute;inset:0;border-radius:inherit;background:linear-gradient(90deg,#651c25 0%,#8c2e37 12%,#9a4a48 25%,#9d7168 38%,#857c72 50%,#738675 62%,#649170 75%,#61a175 88%,#9cd6a4 100%)}
#meterMarker{position:absolute;left:50%;top:50%;width:14px;height:14px;transform:translate(-50%,-50%);border-radius:50%;background:#cfc4b0;border:2px solid rgba(44,32,25,.8);box-shadow:0 0 0 3px rgba(255,255,255,.08),0 0 16px rgba(235,219,190,.35);transition:left .6s cubic-bezier(.2,.7,.2,1),background .45s ease,box-shadow .45s ease}
#questionPanel{position:absolute;right:28px;bottom:26px;width:min(470px,calc(100vw - 36px));pointer-events:auto;opacity:0;transform:translateY(12px);transition:opacity .48s ease,transform .48s ease}
#questionPanel.visible{opacity:1;transform:none}
#card{overflow:hidden;border:1px solid var(--line);border-radius:6px;background:linear-gradient(145deg,rgba(35,28,23,.95),rgba(19,16,14,.94));box-shadow:0 18px 60px rgba(0,0,0,.48),inset 0 1px rgba(255,255,255,.05);backdrop-filter:blur(14px)}
#timerRail{height:4px;background:rgba(255,255,255,.055)}
#timerFill{height:100%;width:100%;background:linear-gradient(90deg,#86aa91,#c9ad70,#9a4a4e);transform-origin:left}
#cardBody{padding:19px 21px 18px}
#meta{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
#difficulty{font-size:9px;letter-spacing:.23em;text-transform:uppercase;color:#b4a793}
#qnum{font-size:10px;color:#82776b;font-variant-numeric:tabular-nums}
#definition{min-height:58px;margin-bottom:16px;color:#efe5d6;font-family:Georgia,"Times New Roman",serif;font-size:clamp(17px,1.8vw,23px);line-height:1.32}
#answers{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.answer{min-height:49px;padding:10px 12px;border:1px solid rgba(201,184,156,.2);border-radius:4px;background:rgba(255,255,255,.045);color:#d8cec0;text-align:left;font-size:12px;line-height:1.3;cursor:pointer;transition:background .16s ease,border-color .16s ease,transform .16s ease}
.answer:hover:not(:disabled){background:rgba(205,181,139,.11);border-color:rgba(220,197,154,.48);transform:translateY(-1px)}
.answer.correct{background:rgba(74,132,91,.23);border-color:rgba(109,181,130,.66);color:#d9f0df}
.answer.wrong{background:rgba(146,58,60,.24);border-color:rgba(194,91,93,.66);color:#f0d5d4}
.answer:disabled{cursor:default}
#feedback{min-height:20px;padding-top:10px;font-size:11px;color:#b8ad9e}
#feedback.good{color:#acd4b6}#feedback.bad{color:#d8a29f}
#fade{position:absolute;inset:0;z-index:100;background:#050403;opacity:0;pointer-events:none;transition:opacity 1.35s ease}
#fade.black{opacity:1}
#end{position:absolute;inset:0;z-index:110;display:flex;flex-direction:column;justify-content:center;align-items:center;opacity:0;pointer-events:none;transition:opacity .9s ease}
#end.visible{opacity:1;pointer-events:auto}
#end .small{font-size:9px;letter-spacing:.32em;text-transform:uppercase;color:#7e7468;margin-bottom:10px}
#endTitle{margin:0 0 20px;font-family:Georgia,"Times New Roman",serif;font-size:clamp(35px,6vw,68px);font-weight:400;color:#e3d6c0}
#restart{padding:11px 18px;border:1px solid rgba(216,195,157,.42);border-radius:4px;background:rgba(255,255,255,.04);color:#bdb0a0;letter-spacing:.18em;text-transform:uppercase;font-size:9px;cursor:pointer}
#restart:hover{border-color:rgba(216,195,157,.78);color:#eadcc5}
@media(max-width:720px){#brand{left:16px;top:16px}#brand h1{font-size:27px}#juryMeter{top:16px;left:auto;right:16px;width:45vw;transform:none}#questionPanel{left:13px;right:13px;bottom:13px;width:auto}#answers{grid-template-columns:1fr}#cardBody{padding:15px}#definition{min-height:0;font-size:17px}#begin{bottom:17px}}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="game">
  <div id="scene"></div>
  <div id="vignette"></div>
  <div id="grain"></div>
  <div id="brand"><div class="kicker">Pedagogy Game</div><h1>Courtroom Etiquette</h1></div>
  <button id="begin">Begin Proceedings</button>
  <div id="hotspot"><div class="term"></div><div class="def"></div></div>
  <div id="quiz">
    <div id="juryMeter">
      <div id="juryMeterLabel">Jury Persuasion</div>
      <div id="meterTrack"><div id="meterSpectrum"></div><div id="meterMarker"></div></div>
    </div>
    <div id="questionPanel">
      <div id="card">
        <div id="timerRail"><div id="timerFill"></div></div>
        <div id="cardBody">
          <div id="meta"><span id="difficulty"></span><span id="qnum"></span></div>
          <div id="definition"></div>
          <div id="answers"></div>
          <div id="feedback"></div>
        </div>
      </div>
    </div>
  </div>
  <div id="fade"></div>
  <div id="end"><div class="small">Courtroom Etiquette</div><h2 id="endTitle"></h2><button id="restart">Enter Court Again</button></div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =========================================================
   SCENE
   ========================================================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x887664);
scene.fog = new THREE.FogExp2(0x887664, 0.0125);

const camera = new THREE.PerspectiveCamera(47, innerWidth / innerHeight, 0.1, 120);
camera.position.set(0.8, 5.2, 13.6);

const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.07;
document.querySelector('#scene').appendChild(renderer.domElement);

/* =========================================================
   EXPLORATION CAMERA
   ========================================================= */
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.15, -2.7);
controls.enableDamping = false;
controls.enableZoom = true;
controls.enablePan = true;
controls.screenSpacePanning = true;
controls.zoomToCursor = true;
controls.minDistance = 4.5;
controls.maxDistance = 23;
controls.minPolarAngle = THREE.MathUtils.degToRad(53);
controls.maxPolarAngle = THREE.MathUtils.degToRad(83);
controls.minAzimuthAngle = THREE.MathUtils.degToRad(-36);
controls.maxAzimuthAngle = THREE.MathUtils.degToRad(36);
controls.rotateSpeed = 0.42;
controls.panSpeed = 0.68;
controls.zoomSpeed = 0.85;
controls.addEventListener('change',()=>{
  controls.target.x = THREE.MathUtils.clamp(controls.target.x,-4.8,4.8);
  controls.target.y = THREE.MathUtils.clamp(controls.target.y,1.0,4.5);
  controls.target.z = THREE.MathUtils.clamp(controls.target.z,-7.0,4.2);
});

/* =========================================================
   MATERIALS
   ========================================================= */
const M = {
  walnut:new THREE.MeshStandardMaterial({color:0x4b2e22,roughness:.43,metalness:.02}),
  walnut2:new THREE.MeshStandardMaterial({color:0x684431,roughness:.50}),
  darkwood:new THREE.MeshStandardMaterial({color:0x281712,roughness:.52}),
  brass:new THREE.MeshStandardMaterial({color:0xa98548,roughness:.33,metalness:.58}),
  carpet:new THREE.MeshStandardMaterial({color:0x514641,roughness:.96}),
  aisle:new THREE.MeshStandardMaterial({color:0x5b504a,roughness:.96}),
  wall:new THREE.MeshStandardMaterial({color:0xb7a58e,roughness:.9}),
  plaster:new THREE.MeshStandardMaterial({color:0xd7cab7,roughness:.95}),
  leather:new THREE.MeshStandardMaterial({color:0x2d2521,roughness:.72}),
  paper:new THREE.MeshStandardMaterial({color:0xd9d1c2,roughness:.92}),
  black:new THREE.MeshStandardMaterial({color:0x161413,roughness:.78}),
  blueFabric:new THREE.MeshStandardMaterial({color:0x273b4b,roughness:.85}),
  flagRed:new THREE.MeshStandardMaterial({color:0x722b30,roughness:.85}),
  flagBlue:new THREE.MeshStandardMaterial({color:0x28405e,roughness:.85}),
  flagPole:new THREE.MeshStandardMaterial({color:0x8c7149,roughness:.28,metalness:.55}),
  invisible:new THREE.MeshBasicMaterial({transparent:true,opacity:.001,depthWrite:false})
};

/* =========================================================
   LIGHTING
   ========================================================= */
scene.add(new THREE.HemisphereLight(0xf5e5c8,0x2d241f,1.45));
const sun = new THREE.DirectionalLight(0xffe0b3,3.1);
sun.position.set(-7.5,11,6.5); sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048); sun.shadow.camera.left=-12; sun.shadow.camera.right=12; sun.shadow.camera.top=13; sun.shadow.camera.bottom=-10;
scene.add(sun);
const benchGlow = new THREE.SpotLight(0xffd8a3,42,28,Math.PI/5.2,.68,1.15);
benchGlow.position.set(0,7.4,-2.6); benchGlow.target.position.set(0,2.25,-8.7); scene.add(benchGlow,benchGlow.target);
const juryGlow = new THREE.PointLight(0xffd6aa,7.5,12,1.45); juryGlow.position.set(-6.0,4.0,-2.3); scene.add(juryGlow);
const judgeFill = new THREE.PointLight(0xffe5c8,3.2,7.5,1.6); judgeFill.position.set(0,3.9,-7.7); scene.add(judgeFill);

/* =========================================================
   GEOMETRY HELPERS
   ========================================================= */
function meshBox(w,h,d,mat){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.castShadow=true; m.receiveShadow=true; return m; }
function addBox(parent,w,h,d,mat,x=0,y=0,z=0,rx=0,ry=0,rz=0){ const m=meshBox(w,h,d,mat); m.position.set(x,y,z); m.rotation.set(rx,ry,rz); parent.add(m); return m; }
function box(w,h,d,mat,x=0,y=0,z=0,rx=0,ry=0,rz=0){ const m=meshBox(w,h,d,mat); m.position.set(x,y,z); m.rotation.set(rx,ry,rz); scene.add(m); return m; }
function addCylinder(parent,r,h,mat,x=0,y=0,z=0,segments=18){ const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,segments),mat); m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; parent.add(m); return m; }
function woodPanel(x,y,z,w,h,ry=0){ const g=new THREE.Group(); g.position.set(x,y,z); g.rotation.y=ry; addBox(g,w,h,.09,M.walnut2); const t=.06; addBox(g,w-.12,t,.13,M.darkwood,0,h/2-.09,.04); addBox(g,w-.12,t,.13,M.darkwood,0,-h/2+.09,.04); addBox(g,t,h-.16,.13,M.darkwood,-w/2+.09,0,.04); addBox(g,t,h-.16,.13,M.darkwood,w/2-.09,0,.04); scene.add(g); return g; }

/* =========================================================
   HOTSPOTS
   ========================================================= */
const hotspotRoots=[];
function hotspot(object,label,definition){ object.userData.hotspot={label,definition}; hotspotRoots.push(object); return object; }

/* =========================================================
   COURTROOM ARCHITECTURE
   ========================================================= */
box(18,.3,23,M.carpet,0,-.18,0);
box(2.05,.012,22.2,M.aisle,0,.005,.3);
box(18,8.6,.36,M.wall,0,4.08,-10.15);
box(.36,8.6,23,M.wall,-9.08,4.08,0);
box(.36,8.6,23,M.wall,9.08,4.08,0);
box(18.25,.3,.45,M.plaster,0,7.82,-9.9);
box(.45,.3,23,M.plaster,-8.83,7.82,0);
box(.45,.3,23,M.plaster,8.83,7.82,0);

for(let x=-7.8;x<=7.8;x+=2.6) woodPanel(x,1.12,-9.92,2.45,2.08);
for(let z=-8.5;z<=9;z+=2.8){ woodPanel(-8.87,1.12,z,2.52,2.08,Math.PI/2); woodPanel(8.87,1.12,z,2.52,2.08,Math.PI/2); }
for(const x of [-6,-3,0,3,6]){ box(.22,5.1,.18,M.plaster,x,5.12,-9.88); box(.52,.18,.3,M.plaster,x,2.62,-9.84); box(.52,.18,.3,M.plaster,x,7.62,-9.84); }

/* coffered beams for more definition overhead */
for(const z of [-7.4,-2.9,1.6,6.1]) box(17.4,.12,.22,M.darkwood,0,7.12,z);
for(const x of [-6.2,-2.1,2.1,6.2]) box(.22,.12,22.2,M.darkwood,x,7.12,0.5);

function windowAssembly(x,z){ const g=new THREE.Group(); g.position.set(x,4.8,z); g.rotation.y=Math.PI/2; const glass=new THREE.Mesh(new THREE.PlaneGeometry(2.2,4.05),new THREE.MeshStandardMaterial({color:0xb7d2d2,transparent:true,opacity:.34,roughness:.18})); g.add(glass); addBox(g,2.45,.15,.18,M.darkwood,0,2.1,.03); addBox(g,2.45,.15,.18,M.darkwood,0,-2.1,.03); addBox(g,.15,4.3,.18,M.darkwood,-1.15,0,.03); addBox(g,.15,4.3,.18,M.darkwood,1.15,0,.03); addBox(g,.09,4.1,.14,M.darkwood,0,0,.04); addBox(g,2.25,.09,.14,M.darkwood,0,0,.04); scene.add(g); }
windowAssembly(-8.69,-6.7); windowAssembly(-8.69,-1.7); windowAssembly(-8.69,3.3);

const entry = new THREE.Group(); entry.position.set(0,0,10.05);
addBox(entry,4.8,3.35,.18,M.darkwood,0,1.68,0);
addBox(entry,2.12,2.9,.12,new THREE.MeshStandardMaterial({color:0x503327,roughness:.6}),-1.15,1.46,-.11);
addBox(entry,2.12,2.9,.12,new THREE.MeshStandardMaterial({color:0x503327,roughness:.6}),1.15,1.46,-.11);
addCylinder(entry,.06,.10,M.brass,-.3,1.4,-.22,12); addCylinder(entry,.06,.10,M.brass,.3,1.4,-.22,12);
scene.add(entry);
hotspot(entry,'Courtroom Entry / Soundlock','Many formal courtrooms use a vestibule or soundlock at the public entrance to reduce noise and preserve courtroom acoustics.');

/* flags behind the bench */
function makeFlag(x,z,colorMat){
  const g=new THREE.Group(); g.position.set(x,0,z);
  addCylinder(g,.04,4.3,M.flagPole,0,2.2,0,14);
  const finial=new THREE.Mesh(new THREE.SphereGeometry(.09,14,12),M.brass); finial.position.set(0,4.45,0); g.add(finial);
  const cloth = new THREE.Mesh(new THREE.PlaneGeometry(1.15,.78,8,6), colorMat); cloth.position.set(.58,3.65,.03); cloth.rotation.y = -.08; g.add(cloth);
  scene.add(g); return g;
}
const stateFlag = makeFlag(3.72,-9.05,M.flagRed); hotspot(stateFlag,'Flag','Courtrooms often display governmental flags behind or near the bench. This scene uses generic non-jurisdictional flags.');
makeFlag(-3.72,-9.05,M.flagBlue);

/* judge platform and bench */
const judgePlatform = hotspot(box(8.5,.46,3.45,M.darkwood,0,.08,-8.35),'Dais','The raised platform supporting the judge’s bench.');
const judgeBench = new THREE.Group(); judgeBench.position.set(0,.45,-8.34);
addBox(judgeBench,5.35,1.92,1.28,M.walnut,0,1.36,0);
addBox(judgeBench,5.65,.18,1.56,M.darkwood,0,2.38,-.02);
addBox(judgeBench,5.0,.22,.38,M.walnut2,0,.52,.48);
for(let x=-2.18;x<=2.18;x+=1.09) addBox(judgeBench,.065,1.48,.09,M.darkwood,x,1.35,.64);
addBox(judgeBench,5.05,.09,.08,M.brass,0,.58,.665);
/* bench props */
addBox(judgeBench,.55,.03,.45,M.paper,-1.25,2.48,.15);
addBox(judgeBench,.4,.16,.12,M.black,-.22,2.48,.18);
addBox(judgeBench,.05,.35,.05,M.black,.55,2.47,.2);
scene.add(judgeBench);
hotspot(judgeBench,'Judge’s Bench','The elevated desk from which the judge presides over the courtroom. “Approach the bench” means the attorneys come forward to speak with the judge.');

function sealTexture(){ const c=document.createElement('canvas'); c.width=c.height=512; const x=c.getContext('2d'); x.fillStyle='#5b4328'; x.beginPath(); x.arc(256,256,220,0,Math.PI*2); x.fill(); x.strokeStyle='#c4a56b'; x.lineWidth=18; x.beginPath(); x.arc(256,256,202,0,Math.PI*2); x.stroke(); x.strokeStyle='#d4bd8d'; x.lineWidth=9; x.beginPath(); x.moveTo(256,140); x.lineTo(256,340); x.moveTo(170,195); x.lineTo(342,195); x.moveTo(190,195); x.lineTo(160,260); x.moveTo(322,195); x.lineTo(352,260); x.stroke(); x.beginPath(); x.arc(160,270,48,0,Math.PI); x.stroke(); x.beginPath(); x.arc(352,270,48,0,Math.PI); x.stroke(); x.fillStyle='#dfc99f'; x.font='bold 38px Georgia'; x.textAlign='center'; x.fillText('COURT',256,395); const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t; }
const seal=new THREE.Mesh(new THREE.CircleGeometry(1.18,64),new THREE.MeshStandardMaterial({map:sealTexture(),roughness:.55})); seal.position.set(0,5.22,-9.92); scene.add(seal); hotspot(seal,'Court Seal','A court seal or jurisdictional emblem commonly appears behind or near the judge’s bench. This game uses a generic, non-jurisdictional seal.');

function table(width=3.6,depth=1.35){ const g=new THREE.Group(); addBox(g,width,.14,depth,M.walnut,0,1.15,0); addBox(g,width-.18,.05,depth-.18,M.walnut2,0,1.22,0); addBox(g,.22,1.08,.22,M.darkwood,-width/2+.28,.55,-depth/2+.22); addBox(g,.22,1.08,.22,M.darkwood,width/2-.28,.55,-depth/2+.22); addBox(g,.22,1.08,.22,M.darkwood,-width/2+.28,.55,depth/2-.22); addBox(g,.22,1.08,.22,M.darkwood,width/2-.28,.55,depth/2-.22); return g; }

const prosecutionTable=table(3.8,1.35); prosecutionTable.position.set(-2.15,0,-1.12); scene.add(prosecutionTable); hotspot(prosecutionTable,'Prosecution / Plaintiff’s Counsel Table','The table used by the prosecutor in a criminal case or plaintiff’s counsel in a civil case.');
const defenseTable=table(3.8,1.35); defenseTable.position.set(2.35,0,-.2); scene.add(defenseTable); hotspot(defenseTable,'Defense Counsel Table','The table used by defense counsel and the defendant.');

function faceTexture(mood=0, kind='neutral'){
  const canvas=document.createElement('canvas'); canvas.width=canvas.height=128; const ctx=canvas.getContext('2d');
  const tex=new THREE.CanvasTexture(canvas); tex.colorSpace=THREE.SRGBColorSpace;
  const obj={canvas,ctx,texture:tex}; drawFace(obj,mood,kind); return obj;
}
function drawFace(data,mood=0,kind='neutral'){
  const {ctx,texture}=data; ctx.clearRect(0,0,128,128); ctx.strokeStyle='#33251e'; ctx.lineCap='round';
  const isJudge = kind==='judge';
  ctx.lineWidth = isJudge?5:6;
  /* eyes */
  ctx.beginPath(); ctx.moveTo(34,54); ctx.lineTo(47,54); ctx.moveTo(81,54); ctx.lineTo(94,54); ctx.stroke();
  /* brows */
  const brow=mood*5; ctx.lineWidth=isJudge?4:5; ctx.beginPath();
  if(mood<-.1){ ctx.moveTo(31,37+Math.abs(brow)); ctx.lineTo(49,32); ctx.moveTo(79,32); ctx.lineTo(97,37+Math.abs(brow)); }
  else if(mood>.1){ ctx.moveTo(31,35); ctx.lineTo(49,32-brow*.2); ctx.moveTo(79,32-brow*.2); ctx.lineTo(97,35); }
  else { ctx.moveTo(31,35); ctx.lineTo(49,34); ctx.moveTo(79,34); ctx.lineTo(97,35); }
  ctx.stroke();
  /* nose */
  ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(64,56); ctx.lineTo(61,72); ctx.lineTo(67,72); ctx.stroke();
  /* mouth */
  ctx.lineWidth=isJudge?5:6; ctx.beginPath();
  const strength=Math.min(1,Math.abs(mood));
  if(mood>.08){ ctx.arc(64,69-strength*2,25,.12*Math.PI,.88*Math.PI); }
  else if(mood<-.08){ ctx.arc(64,94+strength*2,25,1.12*Math.PI,1.88*Math.PI); }
  else { ctx.moveTo(45,83); ctx.lineTo(83,83); }
  ctx.stroke();
  if(isJudge){
    /* glasses */
    ctx.lineWidth=3; ctx.strokeStyle='#1d1a18';
    ctx.strokeRect(26,46,24,16); ctx.strokeRect(78,46,24,16); ctx.beginPath(); ctx.moveTo(50,54); ctx.lineTo(78,54); ctx.stroke();
  }
  texture.needsUpdate=true;
}

function makeChair(x,z,ry=0,y=0, scale=1){ const g=new THREE.Group(); g.position.set(x,y,z); g.rotation.y=ry; addBox(g,.72*scale,.13,.7*scale,M.leather,0,.57*scale,0); addBox(g,.74*scale,.9*scale,.14,M.leather,0,1.0*scale,.3*scale); for(const sx of [-.27,.27]) for(const sz of [-.22,.22]) addBox(g,.09,.56*scale,.09,M.darkwood,sx*scale,.28*scale,sz*scale); scene.add(g); return g; }
function makeJudgeChair(x,z,y=0){
  const g=new THREE.Group(); g.position.set(x,y,z);
  addBox(g,1.1,.16,.92,M.leather,0,.72,0);

}

function makePerson({x=0,z=0,y=0,rotationY=0,seated=true,bodyColor=null,skin=null,robe=false,juror=false,faceKind='neutral',scale=1}={}){
  const p=new THREE.Group(); p.position.set(x,y,z); p.rotation.y=rotationY;
  const bodyMat=new THREE.MeshStandardMaterial({color:bodyColor??suitColors[Math.floor(Math.random()*suitColors.length)],roughness:.8});
  const skinMat=new THREE.MeshStandardMaterial({color:skin??skinTones[Math.floor(Math.random()*skinTones.length)],roughness:.74});
  const hairMat=new THREE.MeshStandardMaterial({color:[0x241913,0x4c3427,0x191919,0x5a4632,0x7a6a57][Math.floor(Math.random()*5)],roughness:.88});
  const bodyY=(seated?1.12:1.38)*scale, headY=(seated?2.0:2.35)*scale;

  const torso=new THREE.Mesh(new THREE.CapsuleGeometry((robe?.44:.37)*scale,(seated?.72:.94)*scale,5,10),bodyMat);
  torso.position.y=bodyY; torso.scale.z=.76; torso.castShadow=true; p.add(torso);
  if(!robe){const shirt=new THREE.Mesh(new THREE.BoxGeometry(.26*scale,.32*scale,.05*scale),new THREE.MeshStandardMaterial({color:0xd6d1c8,roughness:.8})); shirt.position.set(0,bodyY+.22*scale,.32*scale); p.add(shirt)}

  const neck = new THREE.Mesh(new THREE.CylinderGeometry(.07*scale,.08*scale,.12*scale,12),skinMat); neck.position.set(0,(headY-.17*scale),0.02*scale); p.add(neck);
  const head=new THREE.Mesh(new THREE.SphereGeometry(.285*scale,26,20),skinMat); head.position.y=headY; head.castShadow=true; p.add(head);
  const hair=new THREE.Mesh(new THREE.SphereGeometry(.292*scale,22,16,0,Math.PI*2,0,Math.PI*.54),hairMat); hair.position.y=headY+.055*scale; hair.castShadow=true; p.add(hair);

  const leftPivot=new THREE.Group(); leftPivot.position.set(-.37*scale,bodyY+.23*scale,0); p.add(leftPivot); const leftArm=new THREE.Mesh(new THREE.CapsuleGeometry(.095*scale,.48*scale,4,8),bodyMat); leftArm.position.y=-.28*scale; leftArm.rotation.z=-.08; leftPivot.add(leftArm);
  const rightPivot=new THREE.Group(); rightPivot.position.set(.37*scale,bodyY+.23*scale,0); p.add(rightPivot); const rightArm=new THREE.Mesh(new THREE.CapsuleGeometry(.095*scale,.48*scale,4,8),bodyMat); rightArm.position.y=-.28*scale; rightArm.rotation.z=.08; rightPivot.add(rightArm);

  const fd=faceTexture(0,faceKind);
  const face=new THREE.Mesh(new THREE.PlaneGeometry(.44*scale,.44*scale),new THREE.MeshBasicMaterial({map:fd.texture,transparent:true,depthWrite:false,side:THREE.DoubleSide}));
  face.position.set(0,headY,.279*scale); p.add(face);

  if(robe){
    const robeFront = new THREE.Mesh(new THREE.BoxGeometry(.54*scale,.95*scale,.04*scale), new THREE.MeshStandardMaterial({color:0x0d0d0d, roughness:.85}));
    robeFront.position.set(0,bodyY+.02*scale,.29*scale); p.add(robeFront);
    const collar = new THREE.Mesh(new THREE.BoxGeometry(.18*scale,.16*scale,.04*scale), new THREE.MeshStandardMaterial({color:0xe6e2d9, roughness:.8}));
    collar.position.set(0,bodyY+.43*scale,.31*scale); p.add(collar);
  }

  if(juror) jurorFaces.push({person:p,faceData:fd,head,torso});
  p.userData={...p.userData,rightArm:rightPivot,leftArm:leftPivot,head,torso,faceData:fd};
  scene.add(p); return p;
}

const hotspotCard=document.querySelector('#hotspot'),hotspotTerm=hotspotCard.querySelector('.term'),hotspotDef=hotspotCard.querySelector('.def');
function rootHotspot(obj){let n=obj;while(n){if(n.userData?.hotspot)return n;n=n.parent}return null}
renderer.domElement.addEventListener('pointerup',e=>{if(!explore)return;const rect=renderer.domElement.getBoundingClientRect();pointer.x=((e.clientX-rect.left)/rect.width)*2-1;pointer.y=-((e.clientY-rect.top)/rect.height)*2+1;raycaster.setFromCamera(pointer,camera);const hits=raycaster.intersectObjects(scene.children,true);let target=null;for(const hit of hits){const h=rootHotspot(hit.object);if(h){target=h;break}}if(selectedHelper){scene.remove(selectedHelper);selectedHelper.geometry?.dispose?.();selectedHelper.material?.dispose?.();selectedHelper=null}if(!target){hotspotCard.style.display='none';return}selectedHelper=new THREE.BoxHelper(target,0xe3bf79);selectedHelper.material.transparent=true;selectedHelper.material.opacity=.7;scene.add(selectedHelper);hotspotTerm.textContent=target.userData.hotspot.label;hotspotDef.textContent=target.userData.hotspot.definition;hotspotCard.style.display='block';const cw=350,m=14;let l=e.clientX+16,t=e.clientY+16;if(l+cw>innerWidth-m)l=e.clientX-cw-16;if(t+155>innerHeight)t=innerHeight-170;hotspotCard.style.left=`${Math.max(m,l)}px`;hotspotCard.style.top=`${Math.max(m,t)}px`;});

   QUIZ
   ========================================================= */
const QUESTION_TIME=16000;
let persuasion=50,deck=[],currentQuestion=null,questionStart=0,answerLocked=false,questionCount=0,quizActive=false;
const quiz=document.querySelector('#quiz'),questionPanel=document.querySelector('#questionPanel'),definitionEl=document.querySelector('#definition'),answersEl=document.querySelector('#answers'),feedbackEl=document.querySelector('#feedback'),difficultyEl=document.querySelector('#difficulty'),qnumEl=document.querySelector('#qnum'),timerFill=document.querySelector('#timerFill'),meterSpectrum=document.querySelector('#meterSpectrum'),meterMarker=document.querySelector('#meterMarker'),juryMeter=document.querySelector('#juryMeter');
function shuffle(a){const arr=[...a];for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function difficultyFor(n){ if(n<=20)return'Foundational'; if(n<=40)return'Trial Language'; if(n<=55)return'Procedure'; if(n<=63)return'Evidence'; return'Advanced'; }
function ensureDeck(){ if(!deck.length) deck=shuffle(TERMS); }
function optionsFor(correct){ const choices=[correct]; const others=shuffle(TERMS.filter(x=>x!==correct)); for(const item of others){ if(choices.length>=4) break; choices.push(item);} return shuffle(choices); }
function askQuestion(){ if(!quizActive) return; ensureDeck(); currentQuestion=deck.pop(); questionCount++; answerLocked=false; definitionEl.textContent=currentQuestion.def; difficultyEl.textContent=difficultyFor(currentQuestion.n); qnumEl.textContent=`QUESTION ${questionCount}`; feedbackEl.textContent=''; feedbackEl.className=''; answersEl.innerHTML=''; const opts=optionsFor(currentQuestion); opts.forEach(opt=>{ const b=document.createElement('button'); b.className='answer'; b.textContent=opt.term; b.addEventListener('click',()=>gradeAnswer(opt,b)); answersEl.appendChild(b); }); questionStart=performance.now(); timerFill.style.transform='scaleX(1)'; }
function gradeAnswer(selected,selectedButton,timedOut=false){ if(answerLocked||!currentQuestion) return; answerLocked=true; const elapsed=performance.now()-questionStart; const correct=selected===currentQuestion; const buttons=[...answersEl.querySelectorAll('.answer')]; buttons.forEach(b=>{ b.disabled=true; if(b.textContent===currentQuestion.term) b.classList.add('correct'); }); if(!correct && selectedButton) selectedButton.classList.add('wrong'); let delta; if(correct){ const quick=elapsed<=QUESTION_TIME/2; delta=5+(quick?3:0); feedbackEl.textContent=quick?`Correct · Quick answer +${delta}`:`Correct · +${delta}`; feedbackEl.className='good'; } else { delta=currentQuestion.n<=20?-15:-10; feedbackEl.textContent=timedOut?`Time · ${delta} · ${currentQuestion.term}`:`Incorrect · ${delta} · ${currentQuestion.term}`; feedbackEl.className='bad'; } setPersuasion(persuasion+delta); if(persuasion<=0){ setTimeout(triggerLoss,400); return; } if(persuasion>=100){ setTimeout(triggerWin,500); return; } setTimeout(askQuestion,1050); }
function meterColor(score){ if(score<25) return '#973943'; if(score<45) return '#a06960'; if(score<55) return '#d4c7af'; if(score<75) return '#7fa184'; return '#a2dda9'; }
function setPersuasion(v){ persuasion=THREE.MathUtils.clamp(Math.round(v),0,100); meterMarker.style.left=`${persuasion}%`; const color=meterColor(persuasion); meterMarker.style.background=color; meterMarker.style.boxShadow=`0 0 0 3px rgba(255,255,255,.08),0 0 17px ${color}`; updateJuryMood(); }
function updateJuryMood(){ const rounded=Math.round(persuasion/10)*10; let mood=(rounded-50)/50; mood=THREE.MathUtils.clamp(mood,-1,1); meterSpectrum.style.filter=`saturate(${1+Math.abs(mood)*.2})`; jurorFaces.forEach((j,i)=>{ const variation=Math.sin(i*2.13)*.06; drawFace(j.faceData,THREE.MathUtils.clamp(mood+variation,-1,1),'neutral'); }); }
setPersuasion(50);

/* =========================================================
   START TRIAL / LOCKED VIEW
   ========================================================= */
const begin=document.querySelector('#begin'),brand=document.querySelector('#brand'); let cameraTransition=null;
begin.addEventListener('click',beginTrial);
function beginTrial(){ if(!explore) return; explore=false; if(selectedHelper){scene.remove(selectedHelper); selectedHelper=null;} hotspotCard.style.display='none'; begin.style.opacity='0'; begin.style.pointerEvents='none'; brand.style.opacity='.32'; controls.enabled=false; cameraTransition={start:performance.now(),duration:1300,fromPosition:camera.position.clone(),toPosition:new THREE.Vector3(3.5,3.05,7.3),fromTarget:controls.target.clone(),toTarget:new THREE.Vector3(-1.35,2.05,-3.0)}; quiz.classList.add('visible'); setTimeout(()=>{juryMeter.classList.add('visible'); questionPanel.classList.add('visible'); quizActive=true; askQuestion(); wakeAudio();},1250); }

/* =========================================================
   LOSS / WIN
   ========================================================= */
let lossActive=false,lossStart=0,gavelHits=new Set(); const fade=document.querySelector('#fade'),end=document.querySelector('#end'),endTitle=document.querySelector('#endTitle');
function triggerLoss(){ if(lossActive) return; quizActive=false; answerLocked=true; lossActive=true; questionPanel.classList.remove('visible'); juryMeter.classList.remove('visible'); lossStart=performance.now(); gavelHits.clear(); }
function animateLoss(now){ if(!lossActive) return; const elapsed=(now-lossStart)/1000; const strikeTimes=[.15,.72,1.29]; let rotation=0; strikeTimes.forEach((s,index)=>{ const local=elapsed-s; if(local>=0 && local<.44){ const phase=local/.44; if(phase<.42) rotation=THREE.MathUtils.lerp(0,-1.35,phase/.42); else rotation=THREE.MathUtils.lerp(-1.35,.35,(phase-.42)/.58); } if(elapsed>=s+.20 && !gavelHits.has(index)){ playGavel(); gavelHits.add(index); } }); judge.userData.rightArm.rotation.x=rotation; if(elapsed>1.95) fade.classList.add('black'); if(elapsed>3.25){ endTitle.textContent='Court Adjourned'; end.classList.add('visible'); } }
function triggerWin(){ quizActive=false; answerLocked=true; questionPanel.classList.remove('visible'); updateJuryMood(); setTimeout(()=>{ fade.classList.add('black'); setTimeout(()=>{ endTitle.textContent='Jury Convinced'; end.classList.add('visible'); },1200); },850); }

/* =========================================================
   GAVEL AUDIO
   ========================================================= */
let audioContext=null;
function wakeAudio(){ try{ if(!audioContext) audioContext=new (window.AudioContext||window.webkitAudioContext)(); if(audioContext.state==='suspended') audioContext.resume(); }catch(e){} }
function playGavel(){ try{ wakeAudio(); if(!audioContext) return; const now=audioContext.currentTime; const osc=audioContext.createOscillator(), gain=audioContext.createGain(); osc.type='sine'; osc.frequency.setValueAtTime(115,now); osc.frequency.exponentialRampToValueAtTime(58,now+.13); gain.gain.setValueAtTime(.62,now); gain.gain.exponentialRampToValueAtTime(.001,now+.24); osc.connect(gain); gain.connect(audioContext.destination); osc.start(now); osc.stop(now+.25); const buffer=audioContext.createBuffer(1,audioContext.sampleRate*.09,audioContext.sampleRate), ch=buffer.getChannelData(0); for(let i=0;i<ch.length;i++) ch[i]=(Math.random()*2-1)*Math.pow(1-i/ch.length,3); const source=audioContext.createBufferSource(), filter=audioContext.createBiquadFilter(), ng=audioContext.createGain(); source.buffer=buffer; filter.type='bandpass'; filter.frequency.value=650; filter.Q.value=.7; ng.gain.value=.25; source.connect(filter); filter.connect(ng); ng.connect(audioContext.destination); source.start(now);}catch(e){} }

document.querySelector('#restart').addEventListener('click',()=>location.reload());

/* =========================================================
   MAIN LOOP
   ========================================================= */
function updateCameraTransition(now){ if(!cameraTransition) return; const raw=(now-cameraTransition.start)/cameraTransition.duration; const t=THREE.MathUtils.clamp(raw,0,1); const ease=t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2; camera.position.lerpVectors(cameraTransition.fromPosition,cameraTransition.toPosition,ease); const target=new THREE.Vector3().lerpVectors(cameraTransition.fromTarget,cameraTransition.toTarget,ease); camera.lookAt(target); if(t>=1){ cameraTransition=null; controls.enabled=false; } }
function animate(now=performance.now()){ requestAnimationFrame(animate); const t=clock.getElapsedTime(); if(explore) controls.update(); updateCameraTransition(now); animatePeople(t); animateLoss(now); if(quizActive && currentQuestion && !answerLocked){ const elapsed=now-questionStart; const remaining=Math.max(0,1-elapsed/QUESTION_TIME); timerFill.style.transform=`scaleX(${remaining})`; if(remaining<=0) gradeAnswer(null,null,true); } renderer.render(scene,camera); }
animate();
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
</script>
</body>
</html>
