<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Spell Crossing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700&family=Lexend:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #122033;
      --navy-2: #1b2c44;
      --cream: #f3eee4;
      --ink: #1a1f2b;
      --muted: #8b909c;
      --signal: #d24b3a;
      --go: #2f9e6b;
      --display: "Bricolage Grotesque", "Lexend", ui-sans-serif, system-ui, sans-serif;
      --sans: "Lexend", ui-sans-serif, system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--navy);
      color: var(--cream);
      font-family: var(--sans);
      overflow: hidden;
    }
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }
    button { font-family: inherit; cursor: pointer; }
    button:disabled { cursor: default; opacity: 0.65; }
    .hud { position: absolute; z-index: 5; pointer-events: none; }
    .hud * { pointer-events: auto; }
    #mute {
      top: 12px; right: 12px;
      width: 44px; height: 44px; border: 0; border-radius: 999px;
      background: rgba(18,32,51,.72); color: var(--cream); font-size: 18px;
    }
    #status {
      top: 12px; left: 50%; transform: translateX(-50%);
      background: rgba(18,32,51,.72); border-radius: 999px;
      padding: 6px 12px; font-size: 12px; letter-spacing: .04em; white-space: nowrap;
    }
    #picwrap {
      top: 56px; left: 12px; display: none; align-items: flex-start; gap: 12px;
    }
    #picwrap img {
      width: 112px; height: 112px; object-fit: cover; border-radius: 12px;
      background: var(--cream); padding: 6px; box-shadow: 0 10px 24px rgba(0,0,0,.28);
    }
    #timerbox {
      background: rgba(18,32,51,.8); border-radius: 12px; padding: 8px 12px;
    }
    #timerbox .label { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: rgba(243,238,228,.6); }
    #timerbox .num { font-family: var(--display); font-size: 28px; line-height: 1; }
    #bar { margin-top: 8px; height: 6px; width: 96px; background: rgba(243,238,228,.15); border-radius: 99px; overflow: hidden; }
    #bar > i { display: block; height: 100%; background: var(--cream); transform-origin: left; }
    #banner {
      top: 32%; left: 50%; transform: translate(-50%, -50%);
      display: none; text-align: center; max-width: 20rem; width: calc(100% - 24px);
      background: rgba(18,32,51,.92); border-radius: 12px; padding: 16px 20px;
    }
    #banner.ok { background: var(--go); padding: 8px 20px; border-radius: 999px; }
    #banner h2 { font-family: var(--display); margin: 0; font-size: 28px; }
    #banner p { margin: 8px 0 0; color: rgba(243,238,228,.75); }
    #form {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 6;
      padding: 12px; display: none;
    }
    #form .row {
      max-width: 32rem; margin: 0 auto; display: flex; gap: 8px;
      background: rgba(18,32,51,.85); border-radius: 12px; padding: 8px;
    }
    #guess {
      flex: 1; min-width: 0; height: 48px; border: 0; border-radius: 8px;
      background: var(--cream); color: var(--ink); font-family: var(--display);
      font-size: 18px; padding: 0 16px; outline: none;
    }
    #hop {
      height: 48px; border: 0; border-radius: 8px; padding: 0 18px;
      background: var(--cream); color: var(--ink); font-family: var(--display); font-size: 18px;
    }
    #hop:disabled { opacity: .45; }
    #overlay {
      position: absolute; inset: 0; z-index: 8;
      display: flex; align-items: flex-end; justify-content: center;
      background: rgba(18,32,51,.55); padding: 0 16px 40px;
    }
    @media (min-width: 640px) {
      #overlay { align-items: center; padding-bottom: 0; }
    }
    #card {
      width: 100%; max-width: 28rem; background: var(--navy-2);
      border-radius: 12px; padding: 24px; box-shadow: 0 16px 40px rgba(0,0,0,.28);
    }
    #card .kicker { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: rgba(243,238,228,.55); margin: 0; }
    #card h1, #card h2 { font-family: var(--display); margin: 8px 0 0; font-size: 36px; line-height: .95; }
    #card p { color: rgba(243,238,228,.75); line-height: 1.5; }
    #card ul { padding-left: 1.1rem; color: rgba(243,238,228,.7); }
    #card li { margin: 6px 0; }
    #go {
      margin-top: 24px; width: 100%; height: 48px; border: 0; border-radius: 8px;
      background: var(--cream); color: var(--ink); font-family: var(--display); font-size: 18px;
    }
    #stats { text-align: center; font-size: 12px; color: rgba(243,238,228,.5); margin: 12px 0 0; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
  </style>
</head>
<body>
  <canvas id="world" aria-hidden="true"></canvas>
  <button class="hud" id="mute" type="button" aria-label="Mute">♪</button>
  <div class="hud" id="status" hidden></div>
  <div class="hud" id="picwrap">
    <img id="pic" alt="Spell this picture" />
    <div id="timerbox">
      <div class="label">Time stopped</div>
      <div class="num" id="secs">20</div>
      <div id="bar"><i id="barfill"></i></div>
    </div>
  </div>
  <div class="hud" id="banner"></div>
  <form id="form">
    <label class="sr" for="guess">Type the word for the picture</label>
    <div class="row">
      <input id="guess" maxlength="14" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Type the word" enterkeyhint="go" />
      <button id="hop" type="submit">Hop</button>
    </div>
  </form>
  <div id="overlay">
    <div id="card"></div>
  </div>

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6d2b79f5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffle(items, rand) {
  const copy = items.slice();
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}
function dealRun(rand, n) {
  const pools = [1, 2, 3].map((t) => shuffle(WORDS.filter((w) => w.tier === t), rand));
  const out = [];
  for (let i = 0; i < n; i++) {
    const t = i < n * 0.4 ? 0 : i < n * 0.75 ? 1 : 2;
    const pool = pools[t].length ? pools[t] : pools.find((p) => p.length);
    if (pool && pool.length) out.push(pool.shift());
  }
  return out;
}
function normalize(value) {
  return value.normalize("NFKD").replace(/[\u0300-\u036f]/g, "").toLowerCase()
    .replace(/[''`]/g, "").replace(/[_./]/g, " ").replace(/[^a-z -]/g, "")
    .replace(/\s+/g, " ").trim();
}
function matches(guess, word) {
  const n = normalize(guess);
  if (!n) return false;
  const answers = [word.answer, ...word.variants].map(normalize);
  if (answers.includes(n)) return true;
  const closed = n.replace(/[ -]/g, "");
  return answers.some((a) => a.replace(/[ -]/g, "") === closed);
}
function stoopY(id) { return id * STRIP_H + 16; }
function trafficY(id) { return id * STRIP_H + STRIP_H * 0.62; }
function fleetFor(lane) {
  const key = lane === "bike" ? "B" : lane === "sideroad" ? "S" : "H";
  return FLEET.filter((s) => s.lanes.includes(key));
}

let ac = null, muted = false;
function unlockAudio() {
  if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
  if (ac.state === "suspended") ac.resume();
}
function beep(freq, dur, type, gain) {
  if (muted || !ac) return;
  const o = ac.createOscillator();
  const g = ac.createGain();
  o.type = type || "sine";
  o.frequency.value = freq;
  g.gain.value = gain || 0.05;
  o.connect(g); g.connect(ac.destination);
  o.start();
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
  o.stop(ac.currentTime + dur + 0.02);
}

const G = {
  mode: "title",
  words: [],
  wordIndex: 0,
  strip: 0,
  worldY: stoopY(0),
  hopFrom: 0, hopTo: 0, hopT: 0, hopArc: 0, squash: 1,
  timeLeft: ANSWER_TIME, hold: 0,
  vehicles: [], particles: [],
  elapsed: 0, trauma: 0, flash: 0,
  width: 390, lanesCleared: 0,
  save: { best: 0, wins: 0 },
  rand: Math.random,
};

try {
  const raw = JSON.parse(localStorage.getItem(SAVE_KEY) || "");
  G.save = { best: Number(raw.best) || 0, wins: Number(raw.wins) || 0 };
} catch {}

function writeSave() {
  localStorage.setItem(SAVE_KEY, JSON.stringify(G.save));
}

function makeVehicle(strip, dir, speed, spec, x) {
  const w = spec.w * (0.88 + G.rand() * 0.22);
  return {
    strip, x, dir, speed, w,
    kind: spec.kind,
    color: spec.color,
    hue: spec.lock ? 0 : (G.rand() < 0.4 ? 0 : HUES[Math.floor(G.rand() * HUES.length)]),
    flash: !!spec.flash,
    cars: 0,
  };
}

function spawnTraffic() {
  G.vehicles = [];
  const span = Math.max(G.width, 720);
  for (const strip of STRIPS) {
    if (!strip.hazard) continue;
    if (strip.kind === "train") {
      const cars = 3 + Math.floor(G.rand() * 3);
      G.vehicles.push({
        strip: strip.id, x: G.rand() * 120 - 40, dir: strip.dir, speed: strip.speed,
        w: 140 + cars * 86, kind: "train", color: "#c45c2a", hue: 0, flash: false, cars,
      });
      continue;
    }
    const lane = strip.kind === "bike" ? "bike" : strip.kind === "sideroad" ? "sideroad" : "highway";
    const pool = fleetFor(lane);
    const density = strip.kind === "bike" ? 150 : strip.kind === "sideroad" ? 220 : 180;
    const count = Math.max(4, Math.round(span / density));
    let x = G.rand() * 50 - 20;
    for (let i = 0; i < count; i++) {
      const spec = pool[Math.floor(G.rand() * pool.length)] || pool[0];
      const v = makeVehicle(strip.id, strip.dir, strip.speed, spec, x);
      G.vehicles.push(v);
      x += v.w + 30 + G.rand() * 90;
    }
  }
  keepGaps();
}

function keepGaps() {
  const minGap = 28;
  const groups = new Map();
  for (const v of G.vehicles) {
    const list = groups.get(v.strip);
    if (list) list.push(v); else groups.set(v.strip, [v]);
  }
  for (const list of groups.values()) {
    const dir = list[0].dir;
    if (dir > 0) {
      list.sort((a, b) => a.x - b.x);
      for (let i = list.length - 2; i >= 0; i--) {
        const limit = list[i + 1].x - list[i].w - minGap;
        if (list[i].x > limit) list[i].x = limit;
      }
    } else {
      list.sort((a, b) => b.x - a.x);
      for (let i = list.length - 2; i >= 0; i--) {
        const limit = list[i + 1].x + list[i + 1].w + minGap;
        if (list[i].x < limit) list[i].x = limit;
      }
    }
  }
}

function start() {
  G.rand = mulberry32((Math.random() * 0xffffffff) >>> 0);
  G.words = dealRun(G.rand, HAZARD_COUNT);
  G.wordIndex = 0;
  G.strip = 0;
  G.worldY = stoopY(0);
  G.lanesCleared = 0;
  G.particles = [];
  G.trauma = 0; G.flash = 0; G.hopArc = 0; G.squash = 1;
  spawnTraffic();
  enterNext();
}

function currentWord() { return G.words[G.wordIndex] || null; }

function enterNext() {
  const next = G.strip + 1;
  if (next > FINISH_ID) { win(); return; }
  if (STRIPS[next].hazard) {
    G.mode = "frozen";
    G.timeLeft = ANSWER_TIME;
    beep(880, 0.08, "sine", 0.04);
    return;
  }
  beginJump();
}

function beginJump() {
  if (G.strip + 1 > FINISH_ID) { win(); return; }
  G.mode = "jumping";
  G.hopFrom = stoopY(G.strip);
  G.hopTo = stoopY(G.strip + 1);
  G.hopT = 0;
  G.squash = 1.12;
  beep(523, 0.09, "triangle", 0.05);
  burst(G.width / 2, G.worldY, "#d8e7c8", 8);
}

function submit(text) {
  if (G.mode !== "frozen") return;
  const word = currentWord();
  if (!word) return;
  if (matches(text, word)) {
    G.mode = "correct";
    G.hold = CORRECT_HOLD;
    G.flash = 1;
    beep(659, 0.12, "sine", 0.06);
    beep(880, 0.18, "sine", 0.04);
    burst(G.width / 2, G.worldY, "#3dcc7a", 14);
  } else fail();
}

function fail() {
  G.mode = "incorrect";
  G.hold = REVEAL_TIME;
  G.flash = 1;
  G.trauma = 0.7;
  G.squash = 0.55;
  beep(180, 0.28, "sawtooth", 0.06);
  burst(G.width / 2, G.worldY, "#d24b3a", 18);
  if (G.lanesCleared > G.save.best) { G.save.best = G.lanesCleared; writeSave(); }
}

function win() {
  G.mode = "won";
  G.lanesCleared = HAZARD_COUNT;
  G.save.wins += 1;
  if (G.save.best < HAZARD_COUNT) G.save.best = HAZARD_COUNT;
  writeSave();
  beep(523, 0.12, "sine", 0.05);
  beep(659, 0.16, "sine", 0.05);
  beep(784, 0.28, "sine", 0.06);
}

function land() {
  G.strip += 1;
  G.worldY = stoopY(G.strip);
  G.hopArc = 0;
  G.squash = 0.82;
  if (STRIPS[G.strip].hazard) {
    G.lanesCleared += 1;
    G.wordIndex += 1;
  }
  if (G.strip >= FINISH_ID) { win(); return; }
  enterNext();
}

function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = G.rand() * Math.PI * 2;
    const s = 40 + G.rand() * 90;
    G.particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 30, life: 0.6, max: 0.6, size: 2 + G.rand() * 3, color });
  }
}

function stepTraffic(dt) {
  for (const v of G.vehicles) v.x += v.dir * v.speed * dt;
  for (const v of G.vehicles) {
    if (v.dir > 0 && v.x > G.width + 90) {
      const others = G.vehicles.filter((o) => o.strip === v.strip && o !== v);
      const left = others.reduce((m, o) => Math.min(m, o.x), 0);
      reroll(v);
      v.x = left - v.w - 32 - G.rand() * 40;
    } else if (v.dir < 0 && v.x + v.w < -90) {
      const others = G.vehicles.filter((o) => o.strip === v.strip && o !== v);
      const right = others.reduce((m, o) => Math.max(m, o.x + o.w), G.width);
      reroll(v);
      v.x = right + 32 + G.rand() * 40;
    }
  }
  keepGaps();
}

function reroll(v) {
  const strip = STRIPS[v.strip];
  if (strip.kind === "train") {
    v.cars = 3 + Math.floor(G.rand() * 3);
    v.w = 140 + v.cars * 86;
    return;
  }
  const lane = strip.kind === "bike" ? "bike" : strip.kind === "sideroad" ? "sideroad" : "highway";
  const pool = fleetFor(lane);
  const spec = pool[Math.floor(G.rand() * pool.length)] || pool[0];
  const next = makeVehicle(strip.id, strip.dir, strip.speed, spec, v.x);
  Object.assign(v, next);
}

function update(dt) {
  const c = Math.min(dt, 0.1);
  G.elapsed += c;
  G.trauma = Math.max(0, G.trauma - c * 1.8);
  G.flash = Math.max(0, G.flash - c * 2.4);
  G.squash += (1 - G.squash) * (1 - Math.exp(-12 * c));
  if (G.mode === "title") stepTraffic(c * 0.65);
  else if (G.mode === "frozen") {
    G.timeLeft -= c;
    if (G.timeLeft <= 0) { G.timeLeft = 0; fail(); }
  } else if (G.mode === "correct") {
    G.hold -= c;
    if (G.hold <= 0) beginJump();
  } else if (G.mode === "incorrect") {
    stepTraffic(c);
    G.hold -= c;
    if (G.hold <= 0) G.mode = "dead";
  } else if (G.mode === "jumping") {
    stepTraffic(c);
    G.hopT += c / JUMP_TIME;
    const t = Math.min(1, G.hopT);
    const eased = 1 - (1 - t) ** 3;
    G.worldY = G.hopFrom + (G.hopTo - G.hopFrom) * eased;
    G.hopArc = Math.sin(Math.PI * t) * 26;
    G.squash = t < 0.18 ? 0.78 : t < 0.55 ? 1.18 : 0.9;
    if (G.hopT >= 1) land();
  } else if (G.mode === "won") stepTraffic(c * 0.35);
  for (const p of G.particles) {
    p.life -= c; p.x += p.vx * c; p.y += p.vy * c; p.vy += 70 * c;
  }
  G.particles = G.particles.filter((p) => p.life > 0);
}

let camY = 0;
function worldToScreen(worldY, height) {
  return height * 0.7 - (worldY - camY);
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function shade(hex, deg) {
  if (!deg) return hex;
  return `hsl(${deg}, 55%, 48%)`;
}

function drawCarBody(ctx, x, y, w, h, color, cabin) {
  ctx.fillStyle = "#1a1a1a";
  ctx.beginPath(); ctx.arc(x + w * 0.22, y + h - 2, 6, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + w * 0.78, y + h - 2, 6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = color;
  roundRect(ctx, x, y + h * 0.38, w, h * 0.48, 4);
  ctx.fill();
  ctx.fillStyle = cabin || "#9fd4e8";
  roundRect(ctx, x + w * 0.22, y + h * 0.12, w * 0.46, h * 0.36, 3);
  ctx.fill();
}

function drawVehicle(ctx, v, y, frozen) {
  ctx.save();
  if (frozen) ctx.globalAlpha = 0.92;
  const h = v.kind === "moto" || v.kind === "bike" || v.kind === "scooter" || v.kind === "dirt" ? 34 : 32;
  const w = v.w;
  if (v.dir < 0) {
    ctx.translate(v.x + w / 2, y);
    ctx.scale(-1, 1);
    ctx.translate(-(v.x + w / 2), -y);
  }
  const col = v.hue ? shade(v.color, v.hue) : v.color;
  const top = y - h;
  if (v.kind === "train") {
    ctx.fillStyle = "#c45c2a";
    roundRect(ctx, v.x, top + 6, 70, h - 4, 4); ctx.fill();
    ctx.fillStyle = "#2a2a2a";
    roundRect(ctx, v.x + 8, top - 8, 22, 16, 2); ctx.fill();
    for (let i = 0; i < v.cars; i++) {
      const cx = v.x + 68 + i * 82;
      ctx.fillStyle = i % 2 ? "#6b5a4a" : "#3d6b8a";
      roundRect(ctx, cx, top + 8, 78, h - 8, 3); ctx.fill();
    }
  } else if (v.kind === "bus" || v.kind === "school") {
    ctx.fillStyle = col;
    roundRect(ctx, v.x, top, w, h, 5); ctx.fill();
    ctx.fillStyle = "#8ec8e4";
    for (let i = 0; i < 5; i++) ctx.fillRect(v.x + 16 + i * (w / 6), top + 6, w / 9, 10);
  } else if (v.kind === "semi") {
    ctx.fillStyle = col;
    roundRect(ctx, v.x, top + 4, 44, h - 4, 4); ctx.fill();
    ctx.fillStyle = "#d8d2c6";
    roundRect(ctx, v.x + 42, top + 8, w - 46, h - 10, 3); ctx.fill();
  } else if (v.kind === "mixer") {
    drawCarBody(ctx, v.x, top, w * 0.45, h, "#cfc9c0");
    ctx.fillStyle = "#d8d4cc";
    ctx.beginPath();
    ctx.ellipse(v.x + w * 0.72, top + h * 0.45, w * 0.22, h * 0.32, -0.4, 0, Math.PI * 2);
    ctx.fill();
  } else if (v.kind === "moto" || v.kind === "dirt") {
    ctx.fillStyle = "#1a1a1a";
    ctx.beginPath(); ctx.arc(v.x + 10, y - 6, 7, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(v.x + w - 10, y - 6, 7, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = col; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(v.x + 10, y - 8); ctx.lineTo(v.x + w - 12, y - 14); ctx.stroke();
    ctx.fillStyle = "#2f9e6b";
    ctx.beginPath(); ctx.arc(v.x + w * 0.45, y - 22, 7, 0, Math.PI * 2); ctx.fill();
  } else if (v.kind === "bike" || v.kind === "scooter") {
    ctx.fillStyle = "#1a1a1a";
    ctx.beginPath(); ctx.arc(v.x + 8, y - 5, 6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(v.x + w - 8, y - 5, 6, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = col; ctx.lineWidth = 2;
    ctx.strokeRect(v.x + 14, y - 16, 16, 8);
    ctx.fillStyle = "#3d8b6e";
    ctx.beginPath(); ctx.arc(v.x + w * 0.45, y - 22, 6, 0, Math.PI * 2); ctx.fill();
  } else {
    drawCarBody(ctx, v.x, top, w, h, col);
    if (v.kind === "taxi") {
      ctx.fillStyle = "#1a1a1a";
      ctx.fillRect(v.x + w * 0.4, top + 2, 12, 6);
    }
    if (v.kind === "fire") {
      ctx.fillStyle = "#f3eee4";
      ctx.fillRect(v.x + w * 0.7, top - 6, 6, 10);
    }
  }
  if (v.flash) {
    ctx.fillStyle = Math.sin(G.elapsed * 16) > 0 ? "#3d8cff" : "#ff4d3a";
    ctx.beginPath(); ctx.arc(v.x + w * 0.4, top + 4, 3.5, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function drawFrog(ctx, x, y, h) {
  const s = h / 64;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(G.squash * s, (2 - G.squash) * s);
  ctx.fillStyle = "rgba(20,28,36,0.25)";
  ctx.beginPath(); ctx.ellipse(0, -4, 22, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#3dcc6b";
  ctx.beginPath(); ctx.ellipse(0, -28, 26, 22, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#e8f3c8";
  ctx.beginPath(); ctx.ellipse(0, -24, 16, 14, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#3dcc6b";
  ctx.beginPath(); ctx.arc(-14, -48, 11, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(14, -48, 11, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.arc(-14, -48, 7.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(14, -48, 7.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#1a1f2b";
  ctx.beginPath(); ctx.arc(-13, -47, 3.4, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(13, -47, 3.4, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#1a1f2b"; ctx.lineWidth = 2; ctx.lineCap = "round";
  ctx.beginPath(); ctx.arc(0, -22, 8, 0.2, Math.PI - 0.2); ctx.stroke();
  ctx.fillStyle = "#2f9e6b";
  ctx.beginPath(); ctx.ellipse(-22, -10, 10, 6, -0.4, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(22, -10, 10, 6, 0.4, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawStrip(ctx, strip, top, width) {
  const h = STRIP_H;
  if (strip.kind === "grass" || strip.kind === "finish") {
    ctx.fillStyle = strip.kind === "finish" ? "#5fb45a" : "#4e9b48";
    ctx.fillRect(0, top, width, h);
    if (strip.id === 0) {
      ctx.fillStyle = "#d9d3c4"; ctx.fillRect(0, top + h - 18, width, 18);
      ctx.fillStyle = "#c7c0ae"; ctx.fillRect(0, top + h - 4, width, 4);
    }
    return;
  }
  if (strip.kind === "bike") {
    ctx.fillStyle = "#6f8a5e"; ctx.fillRect(0, top, width, h);
    ctx.strokeStyle = "rgba(243,238,228,0.7)";
    ctx.setLineDash([10, 12]); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, top + h / 2); ctx.lineTo(width, top + h / 2); ctx.stroke();
    ctx.setLineDash([]);
    return;
  }
  if (strip.kind === "train") {
    ctx.fillStyle = "#6a5a4c"; ctx.fillRect(0, top, width, h);
    ctx.strokeStyle = "#cfd5dc"; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, top + 22); ctx.lineTo(width, top + 22);
    ctx.moveTo(0, top + h - 22); ctx.lineTo(width, top + h - 22);
    ctx.stroke();
    return;
  }
  ctx.fillStyle = strip.kind === "sideroad" ? "#3f4654" : "#353c4a";
  ctx.fillRect(0, top, width, h);
  ctx.strokeStyle = "#e0c45a"; ctx.lineWidth = 3; ctx.setLineDash([16, 14]);
  ctx.beginPath(); ctx.moveTo(0, top + h / 2); ctx.lineTo(width, top + h / 2); ctx.stroke();
  ctx.setLineDash([]);
}

function draw(ctx, w, h) {
  const sky = ctx.createLinearGradient(0, 0, 0, h);
  sky.addColorStop(0, "#8ec8e4"); sky.addColorStop(1, "#dfe9c8");
  ctx.fillStyle = sky; ctx.fillRect(0, 0, w, h);
  const shake = G.trauma * G.trauma;
  ctx.save();
  if (shake > 0.002) ctx.translate((Math.random() * 2 - 1) * shake * 14, (Math.random() * 2 - 1) * shake * 10);
  for (const strip of STRIPS) {
    drawStrip(ctx, strip, worldToScreen((strip.id + 1) * STRIP_H, h), w);
  }
  const park = worldToScreen(STRIPS.length * STRIP_H + 140, h);
  ctx.fillStyle = "#4ea24a"; ctx.fillRect(0, park - 80, w, 220);
  const frozen = G.mode === "frozen" || G.mode === "correct";
  const drawn = G.vehicles.slice().sort((a, b) => b.strip - a.strip || a.x - b.x);
  for (const v of drawn) drawVehicle(ctx, v, worldToScreen(trafficY(v.strip), h), frozen);
  drawFrog(ctx, w / 2, worldToScreen(G.worldY, h) - G.hopArc, 64);
  for (const p of G.particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, worldToScreen(p.y, h), p.size, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (frozen) { ctx.fillStyle = "rgba(150,188,214,0.16)"; ctx.fillRect(0, 0, w, h); }
  ctx.restore();
  if (G.flash > 0) {
    ctx.globalAlpha = G.flash * 0.42;
    ctx.fillStyle = G.mode === "incorrect" || G.mode === "dead" ? "#d24b3a" : "#2f9e6b";
    ctx.fillRect(0, 0, w, h);
    ctx.globalAlpha = 1;
  }
}

function renderCard() {
  if (G.mode === "title") {
    card.innerHTML = `
      <p class="kicker">A Pedagogy Game</p>
      <h1>Spell Crossing</h1>
      <p>Traffic freezes while you spell. Type the picture, then hop as the street starts moving again. One miss — or a timeout — sends you back to the curb.</p>
      <ul>
        <li>Twenty seconds. Accuracy over speed.</li>
        <li>Accepted spellings like donut / doughnut count.</li>
        <li>Five crossings. Eighteen lanes. No continues.</li>
      </ul>
      <button id="go" type="button">Cross the street</button>
      <p id="stats">Best ${G.save.best} lanes · ${G.save.wins} clear runs</p>`;
    card.querySelector("#go").onclick = play;
    overlay.style.display = "flex";
  } else if (G.mode === "dead") {
    card.innerHTML = `
      <h2>Back to the curb</h2>
      <p>You cleared ${G.lanesCleared} of ${HAZARD_COUNT} lanes.</p>
      <button id="go" type="button">Try again</button>`;
    card.querySelector("#go").onclick = play;
    overlay.style.display = "flex";
  } else if (G.mode === "won") {
    card.innerHTML = `
      <h2>Far sidewalk</h2>
      <p>Every lane spelled. The street lets you through.</p>
      <button id="go" type="button">Cross again</button>`;
    card.querySelector("#go").onclick = play;
    overlay.style.display = "flex";
  } else {
    overlay.style.display = "none";
  }
}

let lastUi = "";
function syncUi() {
  const word = (G.mode === "frozen" || G.mode === "correct" || G.mode === "incorrect") ? currentWord() : null;
  const key = G.mode + "|" + (word && word.id) + "|" + Math.ceil(G.timeLeft) + "|" + G.lanesCleared;
  if (key === lastUi) return;
  lastUi = key;
  const answering = G.mode === "frozen";
  statusEl.hidden = G.mode === "title";
  if (!statusEl.hidden) {
    const next = STRIPS[G.strip + 1];
    statusEl.textContent = `${(next && next.zone) || "Curb"} · ${G.lanesCleared}/${HAZARD_COUNT}`;
  }
  picwrap.style.display = word ? "flex" : "none";
  if (word) {
    pic.src = word.image;
    secs.textContent = String(Math.ceil(G.timeLeft));
    barfill.style.transform = `scaleX(${Math.max(0, G.timeLeft / ANSWER_TIME)})`;
    document.getElementById("timerbox").style.display = answering ? "block" : "none";
  }
  if (G.mode === "correct") {
    banner.style.display = "block";
    banner.className = "hud ok";
    banner.innerHTML = "<h2>Correct</h2>";
  } else if (G.mode === "incorrect") {
    banner.style.display = "block";
    banner.className = "hud";
    banner.innerHTML = `<h2 style="color:var(--signal)">Incorrect</h2><p>The word was</p><h2>${currentWord() ? currentWord().answer : ""}</h2>`;
  } else {
    banner.style.display = "none";
  }
  form.style.display = answering ? "block" : "none";
  hopBtn.disabled = !guess.value.trim();
  if (answering) setTimeout(() => guess.focus(), 30);
  renderCard();
}

function play() {
  unlockAudio();
  G.width = canvas.parentElement ? canvas.parentElement.clientWidth : window.innerWidth;
  start();
  camY = G.worldY;
  guess.value = "";
  lastUi = "";
  syncUi();
}

form.addEventListener("submit", (e) => {
  e.preventDefault();
  unlockAudio();
  submit(guess.value);
  guess.value = "";
  lastUi = "";
  syncUi();
});
guess.addEventListener("input", () => {
  guess.value = guess.value.slice(0, MAX_CHARS);
  hopBtn.disabled = !guess.value.trim();
});
muteBtn.addEventListener("click", () => {
  muted = !muted;
  muteBtn.textContent = muted ? "×" : "♪";
  muteBtn.setAttribute("aria-label", muted ? "Unmute" : "Mute");
  if (!muted) unlockAudio();
});

spawnTraffic();
renderCard();

let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;
  const w = window.innerWidth;
  const h = window.innerHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (canvas.width !== Math.floor(w * dpr) || canvas.height !== Math.floor(h * dpr)) {
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
  }
  G.width = w;
  update(dt);
  camY += (G.worldY - camY) * (1 - Math.exp(-5.5 * dt));
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = true;
  draw(ctx, w, h);
  syncUi();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
  </script>
</body>
