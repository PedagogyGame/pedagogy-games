<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Chinese Word Study · 101–200</title>
<style>
:root{--ink:#121820;--muted:#4a6880;--paper:#eef3f8;--panel:#f4f8fb;--line:#b8c8d8;--deep:#182430;--good:#2a5080;--bad:#8a2f27;--gold:#c9a050;--vermilion:#a83828;--azure:#3a6a98}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(1100px 640px at 12% -10%,rgba(58,106,152,.42),transparent 56%),linear-gradient(180deg,#182430 0%,#d8c8b0 46%,#1c1410 100%);color:var(--ink);font-family:Georgia,"Times New Roman","Noto Serif SC","Songti SC",serif;overflow:hidden}
.app{height:100vh;display:grid;grid-template-rows:auto 1fr;gap:0}
.topbar{min-height:58px;display:flex;align-items:center;gap:14px;padding:8px 18px;background:linear-gradient(90deg,#182430,#3a6a98 42%,#a83828 78%,#182430);color:#f4e8d8;border-bottom:3px solid #c9a050;box-shadow:0 1px 0 #7a3020}
.brand{font-size:18px;font-weight:700;letter-spacing:.06em;white-space:nowrap}.brand small{font-size:12px;font-weight:400;opacity:.72;margin-left:8px}
.progress{flex:1;max-width:460px;height:7px;background:rgba(255,255,255,.14);border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:linear-gradient(90deg,#c9a050,#a83828);width:1%;transition:width .25s ease}
.stat{font-size:13px;opacity:.9;white-space:nowrap}.topbtn{border:1px solid rgba(201,160,80,.55);background:transparent;color:#f4e8d8;border-radius:4px;padding:7px 10px;cursor:pointer}
.main{min-height:0;display:grid;grid-template-columns:minmax(400px,46%) 1fr;gap:18px;padding:18px}
.quiz{min-height:0;background:rgba(244,248,251,.98);border:3px solid #a83828;box-shadow:inset 0 0 0 7px #e8eef4,inset 0 0 0 8px #c9a050,0 18px 50px rgba(18,24,32,.32);border-radius:2px;padding:20px 24px 16px;display:flex;flex-direction:column;overflow:auto}
.rankline{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.12em}
.character{text-align:center;font-family:"Noto Serif SC","Songti SC","STSong",serif;font-size:clamp(78px,9.2vw,128px);line-height:.95;margin:10px 0 2px;color:#121820;text-shadow:0 1px 0 #fff;letter-spacing:.04em}
.pinyin{text-align:center;font-size:clamp(22px,2.4vw,36px);font-style:italic;color:#a83828;margin:0 0 8px}
.front-pinyin{display:none}.prompt{text-align:center;font-size:15px;margin:2px 0 10px;color:#4a6880}
button{font:600 13px/1.1 Georgia,serif;letter-spacing:.03em}
.controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:3px 0 8px}.controls .nav{display:flex;gap:6px;margin-right:6px}
.ghost,.action{padding:9px 12px;border-radius:4px;cursor:pointer}.ghost{border:1px solid #3a6a98;background:#eef3f8;color:#182430}.action{border:1px solid #7a2418;background:#a83828;color:#fff}
.reveal{border-top:1px solid #b8c8d8;padding-top:10px;margin-top:2px;animation:fade .18s ease}
.reveal-head{margin-bottom:6px}.reveal-pinyin{font-size:clamp(26px,2.7vw,40px);font-style:italic;color:#a83828;font-weight:700}
.glosses{font-size:clamp(20px,2vw,30px);line-height:1.25;margin:4px 0 8px;color:#121820}.glosses b{color:#a83828}
.wordtitle,.extitle,.chartitle{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#4a6880;margin:10px 0 5px;font-weight:700}
.charlist{display:flex;gap:8px;flex-wrap:wrap}
.charchip{background:#e8eef4;border:1px solid #b8c8d8;border-radius:4px;padding:7px 10px;min-width:92px;box-shadow:inset 0 0 0 1px rgba(201,160,80,.35)}
.charchip .wzh{font-family:"Noto Serif SC","Songti SC",serif;font-size:28px;font-weight:700;line-height:1;color:#a83828}
.charchip .wpy{font-size:13px;font-style:italic;color:#3a6a98}.charchip .wen{font-size:12px;color:#4a5868}
.examples{display:grid;gap:6px}
.example{padding:7px 10px;background:#eef3f8;border-left:4px solid #3a6a98;border-radius:3px;line-height:1.24}
.example-zh{font-family:"Noto Serif SC","Songti SC",serif;font-size:clamp(18px,1.6vw,24px)}
.example-py{font-size:clamp(13px,1.05vw,16px);font-style:italic;color:#a83828;margin-top:2px}
.example-en{font-size:clamp(13px,1vw,16px);color:#3a4858;margin-top:2px}
.example em{font-style:normal;font-weight:800;color:#a83828;background:#f0d8c4;border-radius:3px;padding:0 .06em}
.flipcard{margin-top:3px;border:1px solid #c9a050;border-radius:3px;padding:12px 14px;background:#eef3f8}
.flipcard h3{margin:0 0 7px;font-size:13px;color:#3a6a98;text-transform:uppercase;letter-spacing:.1em}
.english-list{font-size:clamp(22px,2vw,32px);line-height:1.25;margin:4px 0 10px}
.flipcard .reveal-pinyin{margin:0 0 6px}
.further{border:1px solid #3a6a98;background:transparent;color:#3a6a98;border-radius:4px;padding:8px 11px;cursor:pointer}
.imagepane{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;background:rgba(18,24,32,.95);border:3px solid #a83828;border-radius:2px;overflow:hidden;box-shadow:inset 0 0 0 7px rgba(201,160,80,.28),0 18px 50px rgba(18,24,32,.34)}
.imagepane:before{content:"";position:absolute;inset:9px;border:1px solid rgba(201,160,80,.55);border-radius:1px;pointer-events:none}
.art{display:block;max-width:94%;max-height:90%;width:auto;height:auto;object-fit:contain;filter:saturate(1.02) contrast(1.03);box-shadow:0 8px 32px rgba(0,0,0,.32);transition:opacity .35s ease,transform .35s ease}.art.wide{max-width:98%;max-height:84%}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@media(max-width:900px){body{overflow:auto}.app{height:auto;min-height:100vh}.main{grid-template-columns:1fr;grid-template-rows:auto minmax(360px,55vh)}.quiz{overflow:visible}.imagepane{min-height:420px}.topbar{flex-wrap:wrap}.progress{order:3;flex-basis:100%;max-width:none}}
@media(max-width:520px){.main{padding:9px;gap:9px}.quiz{padding:14px}.brand small{display:none}.character{font-size:72px}.topbar{padding:8px 10px}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">词语 101–200 <small>most common words</small></div>
    <div class="progress"><i id="progressFill"></i></div>
    <div class="stat" id="cardStat"></div>
    <button class="topbtn" id="shuffleBtn">Shuffle</button>
    <button class="topbtn" id="resetBtn">Reset order</button>
  </header>
  <main class="main">
    <section class="quiz">
      <div class="rankline"><span id="rankLabel"></span></div>
      <div class="character" id="char"></div>
      <div class="pinyin front-pinyin" id="pinyin" aria-hidden="true"></div>
      <div class="prompt">Recognize the word first. Reveal for dictionary English, each character, and three fully translated examples.</div>
      <div class="controls">
        <div class="nav"><button class="ghost" id="prevBtn">← Previous</button><button class="ghost" id="nextBtn">Next →</button></div>
        <button class="action" id="revealBtn">Reveal</button>
        <button class="ghost" id="flipBtn">Flip</button>
      </div>
      <div id="detailArea"></div>
    </section>
    <section class="imagepane" id="imagePane">
      <img class="art" id="art" alt="Study image">
    </section>
  </main>
</div>
<script>
const BANK = [{"rank":101,"word":"昨天","pinyin":"zuó tiān","en":["yesterday"],"chars":[{"ch":"昨","py":"zuó","en":"yesterday"},{"ch":"天","py":"tiān","en":"day; sky"}],"examples":[{"zh":"昨天下了一夜的雨。","pinyin":"zuó tiān xià le yí yè de yǔ.","en":"It rained all night yesterday."},{"zh":"他昨天已经走了。","pinyin":"tā zuó tiān yǐ jīng zǒu le.","en":"He already left yesterday."},{"zh":"昨天的事不要再提。","pinyin":"zuó tiān de shì bú yào zài tí.","en":"Do not bring up yesterday's matter again."}]},{"rank":102,"word":"今年","pinyin":"jīn nián","en":["this year"],"chars":[{"ch":"今","py":"jīn","en":"this (time); now"},{"ch":"年","py":"nián","en":"year"}],"examples":[{"zh":"今年收成很好。","pinyin":"jīn nián shōu cheng hěn hǎo.","en":"This year's harvest is very good."},{"zh":"今年冬天来得早。","pinyin":"jīn nián dōng tiān lái de zǎo.","en":"Winter has come early this year."},{"zh":"我今年不打算出门。","pinyin":"wǒ jīn nián bú dǎ suàn chū mén.","en":"I do not plan to travel this year."}]},{"rank":103,"word":"以后","pinyin":"yǐ hòu","en":["after","later","from now on"],"chars":[{"ch":"以","py":"yǐ","en":"by; from"},{"ch":"后","py":"hòu","en":"after; behind"}],"examples":[{"zh":"雨停以后再走。","pinyin":"yǔ tíng yǐ hòu zài zǒu.","en":"Go after the rain has stopped."},{"zh":"以后有空再来坐。","pinyin":"yǐ hòu yǒu kòng zài lái zuò.","en":"Come and sit again later when you have time."},{"zh":"从今以后要小心火烛。","pinyin":"cóng jīn yǐ hòu yào xiǎo xīn huǒ zhú.","en":"From now on be careful with fire."}]},{"rank":104,"word":"以前","pinyin":"yǐ qián","en":["before","formerly","previously"],"chars":[{"ch":"以","py":"yǐ","en":"by; from"},{"ch":"前","py":"qián","en":"before; front"}],"examples":[{"zh":"以前这里没有桥。","pinyin":"yǐ qián zhè lǐ méi yǒu qiáo.","en":"Formerly there was no bridge here."},{"zh":"吃饭以前先洗手。","pinyin":"chī fàn yǐ qián xiān xǐ shǒu.","en":"Wash the hands before eating."},{"zh":"他以前住在山上。","pinyin":"tā yǐ qián zhù zài shān shàng.","en":"He used to live on the mountain."}]},{"rank":105,"word":"后来","pinyin":"hòu lái","en":["later","afterwards"],"chars":[{"ch":"后","py":"hòu","en":"after"},{"ch":"来","py":"lái","en":"come"}],"examples":[{"zh":"他先走了，后来我们才到。","pinyin":"tā xiān zǒu le, hòu lái wǒ men cái dào.","en":"He left first; afterwards we arrived."},{"zh":"后来天就晴了。","pinyin":"hòu lái tiān jiù qíng le.","en":"Later the sky cleared."},{"zh":"后来这件事就没人提了。","pinyin":"hòu lái zhè jiàn shì jiù méi rén tí le.","en":"Afterwards no one mentioned the matter."}]},{"rank":106,"word":"早上","pinyin":"zǎo shang","en":["morning"],"chars":[{"ch":"早","py":"zǎo","en":"early; morning"},{"ch":"上","py":"shang","en":"noun suffix (in 早上)"}],"examples":[{"zh":"早上雾很大。","pinyin":"zǎo shang wù hěn dà.","en":"The fog is heavy in the morning."},{"zh":"我们早上五点就起身。","pinyin":"wǒ men zǎo shang wǔ diǎn jiù qǐ shēn.","en":"We rose at five in the morning."},{"zh":"早上的茶最香。","pinyin":"zǎo shang de chá zuì xiāng.","en":"Morning tea is the most fragrant."}]},{"rank":107,"word":"中午","pinyin":"zhōng wǔ","en":["noon","midday"],"chars":[{"ch":"中","py":"zhōng","en":"middle"},{"ch":"午","py":"wǔ","en":"noon"}],"examples":[{"zh":"中午在树下歇一歇。","pinyin":"zhōng wǔ zài shù xià xiē yi xiē.","en":"Rest a while under the tree at noon."},{"zh":"中午的太阳很烈。","pinyin":"zhōng wǔ de tài yang hěn liè.","en":"The midday sun is fierce."},{"zh":"请中午以前送到。","pinyin":"qǐng zhōng wǔ yǐ qián sòng dào.","en":"Please deliver it before noon."}]},{"rank":108,"word":"小时","pinyin":"xiǎo shí","en":["hour"],"chars":[{"ch":"小","py":"xiǎo","en":"small"},{"ch":"时","py":"shí","en":"time; hour"}],"examples":[{"zh":"再等一个小时。","pinyin":"zài děng yí ge xiǎo shí.","en":"Wait another hour."},{"zh":"这段路要走两小时。","pinyin":"zhè duàn lù yào zǒu liǎng xiǎo shí.","en":"This stretch of road takes two hours to walk."},{"zh":"灯亮了一个小时。","pinyin":"dēng liàng le yí ge xiǎo shí.","en":"The lamp has been lit for an hour."}]},{"rank":109,"word":"分钟","pinyin":"fēn zhōng","en":["minute"],"chars":[{"ch":"分","py":"fēn","en":"divide; minute"},{"ch":"钟","py":"zhōng","en":"clock; hour"}],"examples":[{"zh":"再过五分钟就开船。","pinyin":"zài guò wǔ fēn zhōng jiù kāi chuán.","en":"The boat leaves in five minutes."},{"zh":"他只停了一分钟。","pinyin":"tā zhǐ tíng le yì fēn zhōng.","en":"He stopped for only a minute."},{"zh":"煮茶大约要三分钟。","pinyin":"zhǔ chá dà yuē yào sān fēn zhōng.","en":"Brewing the tea takes about three minutes."}]},{"rank":110,"word":"星期","pinyin":"xīng qī","en":["week"],"chars":[{"ch":"星","py":"xīng","en":"star"},{"ch":"期","py":"qī","en":"period; appointed time"}],"examples":[{"zh":"这个星期雨很多。","pinyin":"zhè ge xīng qī yǔ hěn duō.","en":"There has been much rain this week."},{"zh":"过一个星期再来。","pinyin":"guò yí ge xīng qī zài lái.","en":"Come again in a week."},{"zh":"一星期有七天。","pinyin":"yì xīng qī yǒu qī tiān.","en":"A week has seven days."}]},{"rank":111,"word":"这里","pinyin":"zhè lǐ","en":["here"],"chars":[{"ch":"这","py":"zhè","en":"this"},{"ch":"里","py":"lǐ","en":"inside; place"}],"examples":[{"zh":"这里风小一些。","pinyin":"zhè lǐ fēng xiǎo yì xiē.","en":"The wind is a little milder here."},{"zh":"把筐子放在这里。","pinyin":"bǎ kuāng zi fàng zài zhè lǐ.","en":"Put the basket here."},{"zh":"以前这里是一片田。","pinyin":"yǐ qián zhè lǐ shì yí piàn tián.","en":"This used to be a stretch of fields."}]},{"rank":112,"word":"那里","pinyin":"nà lǐ","en":["there"],"chars":[{"ch":"那","py":"nà","en":"that"},{"ch":"里","py":"lǐ","en":"inside; place"}],"examples":[{"zh":"那里有一口井。","pinyin":"nà lǐ yǒu yì kǒu jǐng.","en":"There is a well there."},{"zh":"你们先到那里等。","pinyin":"nǐ men xiān dào nà lǐ děng.","en":"You go there and wait first."},{"zh":"山后那里路比较平。","pinyin":"shān hòu nà lǐ lù bǐ jiào píng.","en":"The road is flatter there behind the mountain."}]},{"rank":113,"word":"哪里","pinyin":"nǎ lǐ","en":["where"],"chars":[{"ch":"哪","py":"nǎ","en":"which; where"},{"ch":"里","py":"lǐ","en":"inside; place"}],"examples":[{"zh":"你的家在哪里？","pinyin":"nǐ de jiā zài nǎ lǐ?","en":"Where is your home?"},{"zh":"哪里有茶馆？","pinyin":"nǎ lǐ yǒu chá guǎn?","en":"Where is there a teahouse?"},{"zh":"我不知道他把书放在哪里。","pinyin":"wǒ bù zhī dào tā bǎ shū fàng zài nǎ lǐ.","e const IMAGES = ["img/01-forbidden-moat.jpg", "img/02-night-canal.jpg", "img/03-colonial-street.jpg", "img/04-night-skyline.jpg", "img/05-palace-flowers.jpg", "img/06-qiandao-lake.jpg", "img/07-dazheng-hall.jpg", "img/08-mountain-rocks.jpg"];
let order = BANK.map((_,i)=>i), pos=0, state='front';
const $=id=>document.getElementById(id);
function current(){return BANK[order[pos]]}
function safe(t){return String(t).replace(/[&<>"']/g,m=>({'&':'&','<':'<','>':'>','"':'"',"'":'&#039;'}[m]))}
function mark(sentence,w){return safe(sentence).split(safe(w)).join('<em>'+safe(w)+'</em>')}
function imageForPosition(){const n=IMAGES.length||1;return Math.floor(pos*n/BANK.length)%n}
function setImage(){const idx=imageForPosition(), img=$('art');img.style.opacity=.15;setTimeout(()=>{img.src=IMAGES[idx]; img.onload=()=>{img.classList.toggle('wide',img.naturalWidth/img.naturalHeight>1.75);img.style.opacity=1}},90)}
function renderDetail(mode){const c=current(), d=$('detailArea'); if(mode==='front'){d.innerHTML='';return}
 if(mode==='flip'){d.innerHTML=`<div class="flipcard"><h3>Pinyin + English</h3><div class="reveal-pinyin">${safe(c.pinyin)}</div><div class="english-list">${c.en.map(safe).join(' · ')}</div><button class="further" id="furtherBtn">Reveal further</button></div>`;$('furtherBtn').onclick=()=>{state='revealed';renderDetail('revealed')};return}
 const chars=c.chars.map(w=>`<div class="charchip"><div class="wzh">${safe(w.ch)}</div><div class="wpy">${safe(w.py)}</div><div class="wen">${safe(w.en)}</div></div>`).join('');
 const ex=c.examples.map(x=>`<div class="example"><div class="example-zh">${mark(x.zh,c.word)}</div><div class="example-py">${safe(x.pinyin)}</div><div class="example-en">${safe(x.en)}</div></div>`).join('');
 d.innerHTML=`<div class="reveal"><div class="reveal-head"><div class="reveal-pinyin">${safe(c.pinyin)}</div><p class="glosses"><b>${safe(c.word)}</b> — ${c.en.map(safe).join('; ')}</p></div><div class="chartitle">Characters in this word</div><div class="charlist">${chars}</div><div class="extitle">Example sentences</div><div class="examples">${ex}</div></div>`}
function render(changeImage=true){const c=current();$('char').textContent=c.word;$('pinyin').textContent='';$('rankLabel').textContent=`Word frequency #${c.rank}`;$('cardStat').textContent=`${pos+1} / ${BANK.length}`;$('progressFill').style.width=((pos+1)/BANK.length*100)+'%';state='front';renderDetail('front');if(changeImage)setImage()}
function move(delta){const oldImg=imageForPosition();pos=Math.max(0,Math.min(BANK.length-1,pos+delta));render(imageForPosition()!==oldImg)}
$('prevBtn').onclick=()=>move(-1);$('nextBtn').onclick=()=>move(1);
$('revealBtn').onclick=()=>{state='revealed';renderDetail('revealed')};$('flipBtn').onclick=()=>{state='flip';renderDetail('flip')};
$('shuffleBtn').onclick=()=>{for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}pos=0;render(true)};
$('resetBtn').onclick=()=>{order=BANK.map((_,i)=>i);pos=0;render(true)};
render(true);
</script>
