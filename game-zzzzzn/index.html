<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Chinese Character Study · 1701–1800</title>
<style>
:root{--ink:#2a1c12;--muted:#7a6454;--paper:#f6f0e6;--panel:#fbf6ee;--line:#d2c0a8;--deep:#5c3a1c;--good:#2a5c3c;--bad:#8a2f27;--gold:#d4a45a}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(1200px 700px at 12% -10%,rgba(236,210,170,.40),transparent 52%),linear-gradient(180deg,#c4a888 0%,#e2d4bc 42%,#b08968 100%);color:var(--ink);font-family:Georgia,"Times New Roman","Noto Serif SC","Songti SC",serif;overflow:hidden}
.app{height:100vh;display:grid;grid-template-rows:auto 1fr;gap:0}
.topbar{min-height:58px;display:flex;align-items:center;gap:14px;padding:8px 18px;background:rgba(62,36,16,.96);color:#f8efe4;border-bottom:2px solid #d4a45a}
.brand{font-size:18px;font-weight:700;letter-spacing:.05em;white-space:nowrap}.brand small{font-size:12px;font-weight:400;opacity:.7;margin-left:8px}
.progress{flex:1;max-width:460px;height:7px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:#d4a45a;width:1%;transition:width .25s ease}
.stat{font-size:13px;opacity:.88;white-space:nowrap}.topbtn{border:1px solid rgba(255,255,255,.28);background:transparent;color:white;border-radius:8px;padding:7px 10px;cursor:pointer}
.main{min-height:0;display:grid;grid-template-columns:minmax(390px,46%) 1fr;gap:18px;padding:18px}
.quiz{min-height:0;background:rgba(244,248,246,.97);border:2px solid #8a5a32;box-shadow:inset 0 0 0 6px #f0e4d0,0 16px 48px rgba(62,36,16,.26);border-radius:4px;padding:18px 22px 16px;display:flex;flex-direction:column;overflow:auto}
.rankline{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.09em}
.character{text-align:center;font-family:"Noto Serif SC","Songti SC","STSong",serif;font-size:clamp(92px,11vw,164px);line-height:.95;margin:8px 0 0;color:#2a1c12;text-shadow:0 1px 0 #fff}
.pinyin{text-align:center;font-size:clamp(24px,2.6vw,39px);font-style:italic;color:#8a5a32;margin:0 0 8px}
.front-pinyin{display:none}.prompt{text-align:center;font-size:16px;margin:2px 0 8px;color:#7a6454}
button{font:600 13px/1.1 Georgia,serif;letter-spacing:.03em}
.controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:3px 0 7px}.controls .nav{display:flex;gap:6px;margin-right:6px}.ghost,.action{padding:9px 12px;border-radius:8px;cursor:pointer}.ghost{border:1px solid #8aa8ac;background:#f4eadc;color:#3a2418}.action{border:1px solid #8a5a32;background:#8a5a32;color:#fff}
.reveal{border-top:1px solid #c5d4d2;padding-top:9px;margin-top:2px;animation:fade .18s ease}.reveal-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:5px}.reveal-pinyin{font-size:clamp(27px,2.8vw,42px);font-style:italic;color:#8a5a32;font-weight:700}.definition{font-size:20px;margin:0}.definition b{color:#2a4a4c}.wordtitle,.extitle{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:#7a6454;margin:9px 0 4px;font-weight:700}.wordlist{display:flex;gap:6px;flex-wrap:wrap}.wordchip{background:#e4eeec;border:1px solid #c3d4d0;border-radius:7px;padding:5px 8px;line-height:1.18}.wordchip .wzh{font-family:"Noto Serif SC","Songti SC",serif;font-size:19px;font-weight:700}.wordchip .wpy{font-size:13px;font-style:italic;color:#7a4a3c}.wordchip .wen{font-size:12px;color:#4f5e5c}.examples{display:grid;gap:5px}.example{padding:6px 9px;background:#f6f0e6;border-left:3px solid #8a5a32;border-radius:5px;line-height:1.22}.example-zh{font-family:"Noto Serif SC","Songti SC",serif;font-size:clamp(19px,1.65vw,25px)}.example-py{font-size:clamp(14px,1.1vw,17px);font-style:italic;color:#7a4a3c;margin-top:2px}.example-en{font-size:clamp(13px,1vw,16px);color:#4f463f;margin-top:2px}.example em{font-style:normal;font-weight:800;color:#8d2f21;background:#d7e4de;border-radius:3px;padding:0 .05em}
.flipcard{margin-top:3px;border:1px solid #9ab0b0;border-radius:4px;padding:12px 14px;background:#f6f0e6}.flipcard h3{margin:0 0 7px;font-size:15px;color:#7a4a3c;text-transform:uppercase;letter-spacing:.08em}.english-list{font-size:clamp(22px,2vw,32px);line-height:1.2;margin:4px 0 10px}.flipcard .reveal-pinyin{margin:0 0 6px}.further{border:1px solid #8a5a32;background:transparent;color:#8a5a32;border-radius:8px;padding:8px 11px;cursor:pointer}
.imagepane{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;background:rgba(42,24,12,.94);border:2px solid #5c3418;border-radius:4px;overflow:hidden;box-shadow:inset 0 0 0 7px rgba(196,163,106,.22),0 16px 48px rgba(62,36,16,.3)}
.imagepane:before{content:"";position:absolute;inset:8px;border:1px solid rgba(196,163,106,.5);border-radius:3px;pointer-events:none}.art{display:block;max-width:94%;max-height:90%;width:auto;height:auto;object-fit:contain;filter:saturate(.98) contrast(1.02);box-shadow:0 8px 32px rgba(0,0,0,.28);transition:opacity .35s ease,transform .35s ease}.art.wide{max-width:98%;max-height:84%}

@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@media(max-width:900px){body{overflow:auto}.app{height:auto;min-height:100vh}.main{grid-template-columns:1fr;grid-template-rows:auto minmax(360px,55vh)}.quiz{overflow:visible}.imagepane{min-height:420px}.topbar{flex-wrap:wrap}.progress{order:3;flex-basis:100%;max-width:none}}
@media(max-width:520px){.main{padding:9px;gap:9px}.quiz{padding:14px}.brand small{display:none}.character{font-size:104px}.example{font-size:20px}.topbar{padding:8px 10px}.stat.scoreStat{display:none}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">汉字 1701–1800 <small>recognition + study</small></div>
    <div class="progress"><i id="progressFill"></i></div>
    <div class="stat" id="cardStat"></div>
    <button class="topbtn" id="shuffleBtn">Shuffle</button>
    <button class="topbtn" id="resetBtn">Reset order</button>
  </header>

  <main class="main">
    <section class="quiz">
      <div class="rankline"><span id="rankLabel"></span></div>
      <div class="character" id="char"></div>
      <div class="pinyin front-pinyin" id="pinyin" aria-hidden="true"></div>
      <div class="prompt">Recognize the character first. Reveal for pinyin, meanings, common words, and fully translated examples.</div>
      <div class="controls">
        <div class="nav"><button class="ghost" id="prevBtn">← Previous</button><button class="ghost" id="nextBtn">Next →</button></div>
        <button class="action" id="revealBtn">Reveal</button>
        <button class="ghost" id="flipBtn">Flip</button>
      </div>
      <div id="detailArea"></div>
    </section>

    <section class="imagepane" id="imagePane">
      <img class="art" id="art" alt="Chinese art and material culture study image">
    </section>
  </main>
</div>
<script>
const BANK = [{"rank":1701,"char":"琴","pinyin":"qín","meanings":["qin (zither)","musical instrument"],"words":[{"zh":"钢琴","pinyin":"gāng qín","en":"piano"},{"zh":"小提琴","pinyin":"xiǎo tí qín","en":"violin"},{"zh":"弹琴","pinyin":"tán qín","en":"play a stringed instrument"},{"zh":"琴声","pinyin":"qín shēng","en":"sound of a qin or piano"}],"examples":[{"zh":"她每天练习弹钢琴。","pinyin":"tā měi tiān liàn xí tán gāng qín.","en":"She practices piano every day."},{"zh":"大厅里响起了琴声。","pinyin":"dà tīng lǐ xiǎng qǐ le qín shēng.","en":"The sound of a qin rose in the hall."},{"zh":"弟弟正在学小提琴。","pinyin":"dì di zhèng zài xué xiǎo tí qín.","en":"Younger brother is learning the violin."}]},{"rank":1702,"char":"衰","pinyin":"shuāi","meanings":["decline","weaken","wane"],"words":[{"zh":"衰老","pinyin":"shuāi lǎo","en":"grow old; senile"},{"zh":"衰弱","pinyin":"shuāi ruò","en":"weak; feeble"},{"zh":"衰败","pinyin":"shuāi bài","en":"decline; decay"},{"zh":"兴衰","pinyin":"xīng shuāi","en":"rise and fall"}],"examples":[{"zh":"老人的身体渐渐衰老。","pinyin":"lǎo rén de shēn tǐ jiàn jiàn shuāi lǎo.","en":"The old person's body is gradually declining with age."},{"zh":"战后这个家族走向衰败。","pinyin":"zhàn hòu zhè gè jiā zú zǒu xiàng shuāi bài.","en":"After the war this clan went into decline."},{"zh":"历史记载了王朝的兴衰。","pinyin":"lì shǐ jì zǎi le wáng cháo de xīng shuāi.","en":"History records the rise and fall of dynasties."}]},{"rank":1703,"char":"瓶","pinyin":"píng","meanings":["bottle","vase","jar"],"words":[{"zh":"瓶子","pinyin":"píng zi","en":"bottle"},{"zh":"花瓶","pinyin":"huā píng","en":"vase"},{"zh":"水瓶","pinyin":"shuǐ píng","en":"water bottle"},{"zh":"瓶装","pinyin":"píng zhuāng","en":"bottled"}],"examples":[{"zh":"桌子上放着一个花瓶。","pinyin":"zhuō zi shàng fàng zhe yí gè huā píng.","en":"There is a vase on the table."},{"zh":"请把空瓶子扔掉。","pinyin":"qǐng bǎ kōng píng zi rēng diào.","en":"Please throw away the empty bottle."},{"zh":"他买了一瓶装矿泉水。","pinyin":"tā mǎi le yì píng zhuāng kuàng quán shuǐ.","en":"He bought a bottled mineral water."}]},{"rank":1704,"char":"恼","pinyin":"nǎo","meanings":["annoyed","angry","vexed"],"words":[{"zh":"烦恼","pinyin":"fán nǎo","en":"worry; vexation"},{"zh":"恼怒","pinyin":"nǎo nù","en":"become angry"},{"zh":"苦恼","pinyin":"kǔ nǎo","en":"distressed"},{"zh":"恼火","pinyin":"nǎo huǒ","en":"annoyed; furious"}],"examples":[{"zh":"为小事烦恼不值得。","pinyin":"wèi xiǎo shì fán nǎo bù zhí de.","en":"It is not worth worrying over small matters."},{"zh":"他的话让我很恼火。","pinyin":"tā de huà ràng wǒ hěn nǎo huǒ.","en":"His words made me very annoyed."},{"zh":"这件事让全家都很苦恼。","pinyin":"zhè jiàn shì ràng quán jiā dōu hěn kǔ nǎo.","en":"This matter has distressed the whole family."}]},{"rank":1705,"char":"燕","pinyin":"yàn","meanings":["swallow (bird)"],"words":[{"zh":"燕子","pinyin":"yàn zi","en":"swallow"},{"zh":"燕窝","pinyin":"yàn wō","en":"edible bird's nest"},{"zh":"海燕","pinyin":"hǎi yàn","en":"petrel"},{"zh":"燕山","pinyin":"Yān shān","en":"the Yan Mountains"}],"examples":[{"zh":"春天燕子从南方飞回来。","pinyin":"chūn tiān yàn zi cóng nán fāng fēi huí lai.","en":"In spring the swallows fly back from the south."},{"zh":"这道汤里有燕窝。","pinyin":"zhè dào tāng lǐ yǒu yàn wō.","en":"There is bird's nest in this soup."},{"zh":"海燕在浪尖上飞翔。","pinyin":"hǎi yàn zài làng jiān shàng fēi xiáng.","en":"The petrels fly at the crests of the waves."}]},{"rank":1706,"char":"仲","pinyin":"zhòng","meanings":["second among brothers","middle"],"words":[{"zh":"仲裁","pinyin":"zhòng cái","en":"arbitrate"},{"zh":"仲夏","pinyin":"zhòng xià","en":"midsummer"},{"zh":"伯仲","pinyin":"bó zhòng","en":"elder and second brothers; almost equal"},{"zh":"仲春","pinyin":"zhòng chūn","en":"the second month of spring"}],"examples":[{"zh":"双方同意把争端提交仲裁。","pinyin":"shuāng fāng tóng yì bǎ zhēng duān tí jiāo zhòng cái.","en":"Both sides agreed to submit the dispute to arbitration."},{"zh":"仲夏的夜晚十分炎热。","pinyin":"zhòng xià de yè wǎn shí fēn yán rè.","en":"Midsummer nights are extremely hot."},{"zh":"两人的棋艺在伯仲之间。","pinyin":"liǎng rén de qí yì zài bó zhòng zhī jiān.","en":"The two are almost equal in chess skill."}]},{"rank":1707,"char":"诱","pinyin":"yòu","meanings":["entice","lure","induce"],"words":[{"zh":"诱导","pinyin":"yòu dǎo","en":"guide; induce"},{"zh":"诱惑","pinyin":"yòu huò","en":"temptation"},{"zh":"引诱","pinyin":"yǐn yòu","en":"lure; entice"},{"zh":"诱骗","pinyin":"yòu piàn","en":"trick; decoy"}],"examples":[{"zh":"老师善于诱导学生思考。","pinyin":"lǎo shī shàn yú yòu dǎo xué shēng sī kǎo.","en":"The teacher is good at inducing students to think."},{"zh":"他抵挡住了金钱的诱惑。","pinyin":"tā dǐ dǎng zhù le jīn qián de yòu huò.","en":"He resisted the temptation of money."},{"zh":"不要用好处引诱别人。","pinyin":"bú yào yòng hǎo chu yǐn yòu bié rén.","en":"Do not lure others with benefits."}]},{"rank":1708,"char":"狼","pinyin":"láng","meanings":["wolf"],"words":[{"zh":"灰狼","pinyin":"huī láng","en":"grey wolf"},{"zh":"狼狗","pinyin":"láng gǒu","en":"wolfhound; German shepherd"},{"zh":"狼狈","pinyin":"láng bèi","en":"in a sorry plight"},{"zh":"狼吞虎咽","pinyin":"láng tūn hǔ yàn","en":"gobble up; wolf down"}],"examples":[{"zh":"森林里传来狼的叫声。","pinyin":"sēn lín lǐ chuán lái láng de jiào shēng.","en":"The howl of a wolf came from the forest."},{"zh":"他考试没准备，显得很狼狈。","pinyin":"tā kǎo shì méi zhǔn bèi, xiǎn de hěn láng bèi.","en":"He had not prepared for the exam and looked in a sorry plight."},{"zh":"孩子饿了，吃饭狼吞虎咽。","pinyin":"hái zi è le, chī fàn láng tūn hǔ yàn.","en":"The child was hungry and wolfed down the meal."}]},{"rank":1709,"char":"池","pinyin":"chí","meanings":["pond","pool","reservoir"],"words":[{"zh":"水池","pinyin":"shuǐ chí","en":"pond; pool"},{"zh":"池塘","pinyin":"chí táng","en":"pond"},{"zh":"电池","pinyin":"diàn chí","en":"battery"},{"zh":"游泳池","pinyin":"yóu yǒng chí","en":"swimming pool"}],"examples":[{"zh":"院子里有一个小池塘。","pinyin":"yuàn zi lǐ yǒu yí gè xiǎo chí táng.","en":"There is a small pond in the courtyard."},{"zh":"手电需要换电池。","pinyin":"shǒu diàn xū yào huàn diàn chí.","en":"The flashlight needs a new battery."},{"zh":"夏天我们常去游泳池。","pinyin":"xià tiān wǒ men cháng qù yóu yǒng chí.
