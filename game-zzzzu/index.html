function shuffle(arr) {
  return arr.map(v => ({ v, sort: Math.random() })).sort((a, b) => a.sort - b.sort).map(({ v }) => v);
}
function lighten(hex, amt) {
  const n = hex.replace("#", "");
  const num = parseInt(n, 16);
  const r = Math.min(255, ((num >> 16) & 255) + amt);
  const g = Math.min(255, ((num >> 8) & 255) + amt);
  const b = Math.min(255, (num & 255) + amt);
  return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}
function visualKey(b) {
  const v = b.visual;
  return [v.pattern, v.ears, v.tail, v.fur, v.face].join("|");
}
function familyToken(name) {
  if (name.includes("Rex")) return "rex";
  if (name.startsWith("Turkish")) return "turkish";
  if (name.startsWith("Rag")) return "rag";
  if (name.includes("Shorthair") && !name.includes("Oriental")) return "shorthair";
  return name.split(" ")[0];
}
function temperamentOptions(breed) {
  const keys = shuffle(Object.keys(CATEGORIES).filter(k => k !== breed.cat)).slice(0, 3);
  return shuffle([breed.cat, ...keys]).map(key => ({ key, label: CATEGORIES[key].short }));
}
function identityOptions(breed) {
  const others = BREEDS.filter(b => b.name !== breed.name);
  const ranked = others.map(b => ({
    b,
    score: (visualKey(b) === visualKey(breed) ? 0 : 3) + (familyToken(b.name) === familyToken(breed.name) ? 0 : 2) + Math.random()
  })).sort((a, c) => c.score - a.score);
  return shuffle([breed.name, ...ranked.slice(0, 3).map(x => x.b.name)]).map(name => ({ key: name, label: name }));
}
function lookFor(breed) {
  const v = breed.visual;
  const parts = [];
  if (v.fur === "none") parts.push("hairless wrinkled skin");
  else if (v.fur === "rex") parts.push("tightly waved rex coat");
  else if (v.fur === "long") parts.push("long coat");
  else parts.push("short coat");
  if (v.ears === "fold") parts.push("ears folded forward");
  else if (v.ears === "curl") parts.push("ears curled backward");
  else if (v.ears === "tufted") parts.push("lynx-tipped ear tufts");
  else if (v.ears === "large") parts.push("large ears");
  if (v.face === "brachy") parts.push("flat face");
  else if (v.face === "wedge") parts.push("wedge-shaped head");
  else if (v.face === "square") parts.push("square muzzle");
  if (v.tail === "none") parts.push("no tail");
  else if (v.tail === "bob") parts.push("pom-pom bobtail");
  else if (v.tail === "plumed") parts.push("plumed tail");
  if (v.pattern === "point") parts.push("darker points on face, ears, and tail");
  else if (v.pattern === "spotted") parts.push("leopard-like spots");
  else if (v.pattern === "tabby") parts.push("tabby markings");
  else if (v.pattern === "bicolor") parts.push("white body with colored patches");
  else if (v.pattern === "van") parts.push("white body with color on the head and tail");
  else if (v.pattern === "roan") parts.push("sparse roan coat and dark mask");
  else if (v.pattern === "ticked") parts.push("ticked agouti coat");
  else if (v.pattern === "hairless") parts.push("bare skin");
  return parts.join("; ");
}
function earPath(v, side) {
  const s = side === "L" ? 1 : -1;

  if (v.ears === "curl") return `M ${100 - s * 30} 82 C ${100 - s * 56} 70, ${100 - s * 48} 38, ${100 - s * 22} 64`;
  const h = v.ears === "large" ? 34 : v.ears === "tufted" ? 36 : 30;
  return `M ${100 - s * 30} 80 L ${100 - s * 48} ${80 - h} L ${100 - s * 16} 74 Z`;
}
function portraitSVG(breed, reveal) {
  const v = breed.visual;
  const id = breed.name.replace(/\s+/g, "-").toLowerCase();
  const point = v.pattern === "point";
  const spots = v.pattern === "spotted";
  const tabby = v.pattern === "tabby" || v.pattern === "ticked";
  const bicolor = v.pattern === "bicolor";
  const van = v.pattern === "van";
  const roan = v.pattern === "roan";
  const hairless = v.pattern === "hairless" || v.fur === "none";
  const rex = v.fur === "rex";
  const longFur = v.fur === "long";
  const faceRx = v.face === "wedge" ? 36 : v.face === "brachy" ? 48 : v.face === "square" ? 44 : 42;

  const muzzleY = v.face === "brachy" ? 130 : 124;
  const tailFill = point || van ? v.coat2 : v.coat;
  const tailD = v.tail === "bob" ? "M 138 168 C 158 156, 166 174, 150 180" : v.tail === "plumed" ? "M 132 170 C 168 150, 186 190, 148 206" : "M 132 168 C 170 140, 176 200, 146 198";
  const spotsBody = spots ? [0,1,2,3,4,5].map(i => `<ellipse cx="${74 + (i % 3) * 22}" cy="${174 + Math.floor(i / 3) * 14}" rx="7" ry="5.5" fill="${v.coat2}" opacity="0.85" />`).join("") : "";
  return `
    <div class="portrait">
      <svg viewBox="0 0 200 240" role="img" aria-label="${reveal ? breed.name : "Unidentified cat specimen"}">
        <defs>
          <radialGradient id="${id}-glow" cx="50%" cy="40%" r="60%">
            <stop offset="0%" stop-color="${v.coat}" stop-opacity="0.18" />

            <stop offset="0%" stop-color="${lighten(v.coat, 12)}" />
            <stop offset="100%" stop-color="${v.coat}" />
          </linearGradient>
        </defs>
        <rect width="200" height="240" fill="#1a2436" rx="12" />
        <ellipse cx="100" cy="118" rx="88" ry="96" fill="url(#${id}-glow)" />
        ${v.tail !== "none" ? `<path d="${tailD}" fill="${tailFill}" stroke="${v.coat2}" stroke-width="${v.tail === "plumed" || longFur ? 14 : v.tail === "bob" ? 9 : 10}" stroke-linecap="round" opacity="0.95" />` : ""}
        <ellipse cx="100" cy="186" rx="${longFur ? 58 : 50}" ry="${longFur ? 38 : 32}" fill="url(#${id}-fur)" />

        ${spotsBody}

        <path d="${earPath(v, "L")}" fill="${point || van ? v.coat2 : v.coat}" />
        <path d="${earPath(v, "R")}" fill="${point || van ? v.coat2 : v.coat}" />
        ${v.ears === "tufted" ? `<path d="M 56 48 L 52 28 L 64 50" stroke="${v.coat2}" stroke-width="2" fill="none" /><path d="M 144 48 L 148 28 L 136 50" stroke="${v.coat2}" stroke-width="2" fill="none" />` : ""}
        <ellipse cx="${v.ears === "fold" ? 72 : 62}" cy="${v.ears === "fold" ? 94 : 66}" rx="7" ry="9" fill="${v.coat2}" opacity="0.35" />
        <ellipse cx="${v.ears === "fold" ? 128 : 138}" cy="${v.ears === "fold" ? 94 : 66}" rx="7" ry="9" fill="${v.coat2}" opacity="0.35" />
        ${point ? `<ellipse cx="100" cy="116" rx="28" ry="22" fill="${v.coat2}" opacity="0.55" />` : ""}
        ${van ? `<ellipse cx="100" cy="88" rx="30" ry="18" fill="${v.coat2}" opacity="0.72" />` : ""}
        ${tabby ? `<path d="M 100 70 L 100 96" stroke="${v.coat2}" stroke-width="3" opacity="0.45" /><path d="M 88 74 L 94 96" stroke="${v.coat2}" stroke-width="2.5" opacity="0.4" /><path d="M 112 74 L 106 96" stroke="${v.coat2}" stroke-width="2.5" opacity="0.4" />` : ""}
        ${roan ? `<ellipse cx="78" cy="100" rx="12" ry="9" fill="${v.coat2}" opacity="0.5" /><ellipse cx="122" cy="100" rx="12" ry="9" fill="${v.coat2}" opacity="0.5" /><ellipse cx="100" cy="86" rx="18" ry="12" fill="${v.coat2}" opacity="0.42" />` : ""}
        ${hairless ? `<path d="M 78 96 Q 86 88 94 98" stroke="#b07a5a" stroke-width="1.4" fill="none" /><path d="M 106 98 Q 114 88 122 96" stroke="#b07a5a" stroke-width="1.4" fill="none" /><path d="M 86 130 Q 100 140 114 130" stroke="#b07a5a" stroke-width="1.2" fill="none" />` : ""}
        ${rex ? `<path d="M 70 100 Q 80 88 90 102 Q 100 86 110 102 Q 120 88 130 100" fill="none" stroke="${v.coat2}" stroke-width="1.6" opacity="0.55" />` : ""}
        <ellipse cx="82" cy="108" rx="${v.face === "brachy" ? 11 : 9}" ry="11" fill="#0b1220" />
        <ellipse cx="118" cy="108" rx="${v.face === "brachy" ? 11 : 9}" ry="11" fill="#0b1220" />
        <ellipse cx="82" cy="108" rx="6" ry="8" fill="${v.eyes}" />
        <ellipse cx="118" cy="108" rx="6" ry="8" fill="${v.eyes}" />
        <ellipse cx="80" cy="105" rx="2" ry="2.4" fill="#f8fafc" />
        <ellipse cx="116" cy="105" rx="2" ry="2.4" fill="#f8fafc" />
        <ellipse cx="100" cy="${muzzleY}" rx="${v.face === "brachy" ? 20 : 14}" ry="10" fill="${lighten(v.coat, 16)}" />
        <ellipse cx="100" cy="${muzzleY - 2}" rx="4.5" ry="3.2" fill="#c47a7a" />
        <path d="M 100 ${muzzleY + 1} Q 92 ${muzzleY + 10} 86 ${muzzleY + 6}" stroke="#3a2a2a" stroke-width="1.4" fill="none" />
        <path d="M 100 ${muzzleY + 1} Q 108 ${muzzleY + 10} 114 ${muzzleY + 6}" stroke="#3a2a2a" stroke-width="1.4" fill="none" />
        <path d="M 84 126 L 48 118" stroke="#cbd5e1" stroke-width="0.8" opacity="0.5" />
        <path d="M 84 130 L 46 130" stroke="#cbd5e1" stroke-width="0.8" opacity="0.5" />
        <path d="M 116 126 L 152 118" stroke="#cbd5e1" stroke-width="0.8" opacity="0.5" />
        <path d="M 116 130 L 154 130" stroke="#cbd5e1" stroke-width="0.8" opacity="0.5" />
        ${spots ? `<ellipse cx="74" cy="96" rx="4" ry="3.2" fill="${v.coat2}" opacity="0.7" /><ellipse cx="128" cy="94" rx="4" ry="3.2" fill="${v.coat2}" opacity="0.7" />` : ""}
      </svg>
    </div>`;
}

const state = {
  screen: "hub",
  mode: "temperament",
  deck: [],
  index: 0,
  score: 0,
  streak: 0,
  bestStreak: 0,
  answered: false,
  showDetail: false,
  picked: null,
  options: []
};

function begin(mode) {
  state.mode = mode;
  state.deck = shuffle(BREEDS.slice());
  state.index = 0;
  state.score = 0;
  state.streak = 0;
  state.bestStreak = 0;
  state.answered = false;
  state.showDetail = false;
  state.picked = null;
  state.screen = "play";
  deal();
  render();
}
function deal() {
  const breed = state.deck[state.index];
  state.options = state.mode === "temperament" ? temperamentOptions(breed) : identityOptions(breed);
  state.answered = false;
  state.showDetail = false;
  state.picked = null;
}
function choose(key) {
  if (state.answered) return;
  const breed = state.deck[state.index];
  const correct = state.mode === "temperament" ? breed.cat : breed.name;
  state.picked = key;
  state.answered = true;
  if (key === correct) {
    state.score += 1;
    state.streak += 1;
    state.bestStreak = Math.max(state.bestStreak, state.streak);
  } else {
    state.streak = 0;
  }
  render();
  setTimeout(() => { state.showDetail = true; render(); }, 550);
}
function next() {
  if (state.index + 1 >= state.deck.length) {
    state.screen = "end";
    render();
    return;
  }
  state.index += 1;
  deal();
  render();
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&" + "amp;", "<": "&" + "lt;", ">": "&" + "gt;", '"': "&" + "quot;", "'": "&#39;" }[c]));
}

function hub() {
  return `
    <div class="wrap">
      <p class="kicker">Feline Cognition Archive</p>
      <h1 class="title">Void Match</h1>
      <p class="muted" style="margin-top:1rem;max-width:36rem;line-height:1.6">Two quiz types. Type I names the breed and asks for temperament. Type II hides the name and asks you to identify the cat.</p>
      <div class="modes">
        <button class="mode" data-begin="temperament">
          <p class="kicker">Quiz type I</p>
          <h2>Temperament</h2>
          <p class="muted" style="margin-top:0.5rem;font-size:0.875rem;line-height:1.6">The breed is named. Choose the matching character profile.</p>
        </button>
        <button class="mode" data-begin="identity">
          <p class="kicker">Quiz type II</p>
          <h2>Name the cat</h2>
          <p class="muted" style="margin-top:0.5rem;font-size:0.875rem;line-height:1.6">Study the portrait. Choose the correct breed name.</p>
        </button>
      </div>
      <div class="note"><strong style="color:var(--fg)">Important. </strong>The single most common cats by far remain mixed-breed Domestic Shorthairs and Domestic Longhairs. Their personalities span the full range of the profiles in this archive.</div>
      <p class="subtle" style="margin-top:1.5rem">Keyboard: 1–4 to answer, Enter for next.</p>
      <p class="subtle" style="margin-top:0.75rem">This file is the whole game. Upload it to GitHub as <strong style="color:var(--muted)">index.html</strong> for GitHub Pages.</p>
    </div>`;
}

function end() {
  return `
    <div class="end">
      <p class="kicker">Archive complete</p>
      <h1 style="margin-top:0.75rem;font-size:2.25rem">${state.mode === "temperament" ? "Type I · Temperament" : "Type II · Name the cat"}</h1>
      <p style="margin-top:1.5rem;font-family:var(--display);font-size:2rem;font-variant-numeric:tabular-nums">${state.score}<span class="muted"> / ${state.deck.length}</span></p>
      <p class="muted" style="margin-top:0.5rem;font-size:0.875rem">Best streak ${state.bestStreak}</p>
      <div class="row">
        <button class="primary" data-again>Run this type again</button>
        <button class="secondary" data-hub>Choose type</button>
      </div>
    </div>`;
}

function play() {
  const breed = state.deck[state.index];
  const correct = state.mode === "temperament" ? breed.cat : breed.name;
  const isCorrect = state.picked === correct;
  const portraitFirst = state.mode === "identity";
  const progress = (state.index + (state.showDetail ? 1 : 0)) / state.deck.length;
  const title = state.mode === "temperament" || state.answered ? breed.name : "Unknown specimen";
  const prompt = state.mode === "temperament"
    ? "Which profile matches this breed’s commonly associated temperament?"
    : "Study the portrait, then choose this cat’s name.";
  let body = "";
  if (!state.showDetail) {
    body = state.options.map((opt, i) => {
      const mark = state.answered && opt.key === correct ? "ok" : state.answered && opt.key === state.picked && state.picked !== correct ? "bad" : "";
      return `<button class="opt ${mark}" data-choose="${esc(opt.key)}" ${state.answered ? "disabled" : ""}><span class="letter">${String.fromCharCode(65 + i)}</span><span>${esc(opt.label)}</span></button>`;
    }).join("");
  } else {
    body = `
      <div class="badge ${isCorrect ? "ok" : "bad"}">${isCorrect ? "Correct" : "Incorrect"}</div>
      ${state.mode === "identity" ? `<p style="margin-top:1rem">This cat is the <strong>${esc(breed.name)}</strong>.</p>` : ""}
      <div class="info">
        <p class="kicker">Temperament and behavior</p>
        <p style="margin-top:0.5rem;font-weight:500">${esc(CATEGORIES[breed.cat].name)}</p>
        <p class="muted" style="margin-top:0.5rem;font-size:0.875rem;line-height:1.6">${esc(CATEGORIES[breed.cat].full)}</p>
        <p class="muted" style="margin-top:0.75rem;padding-top:0.75rem;border-top:1px solid var(--line);font-size:0.875rem;line-height:1.6"><strong style="color:var(--fg)">Unique standout. </strong>${esc(breed.unique)}</p>
        ${state.mode === "identity" ? `<p class="muted" style="margin-top:0.75rem;padding-top:0.75rem;border-top:1px solid var(--line);font-size:0.875rem;line-height:1.6"><strong style="color:var(--fg)">Look for. </strong>${esc(lookFor(breed))}</p>` : ""}
      </div>
      <div style="margin-top:1rem;display:flex;justify-content:flex-end">
        <button class="primary" data-next>${state.index + 1 >= state.deck.length ? "Finish archive" : "Next breed"}</button>
      </div>`;
  }
  const qCard = `
    <section class="card" style="order:${portraitFirst ? 2 : 1}">
      <p class="kicker">${state.mode === "temperament" ? "Select the matching character profile" : "Select the breed name"}</p>
      <h2 style="margin-top:0.5rem;font-size:1.875rem">${esc(title)}</h2>
      <p class="muted" style="margin-top:0.5rem;font-size:0.875rem;line-height:1.6">${esc(prompt)}</p>
      <div style="margin-top:1.25rem">${body}</div>
    </section>`;
  const pCard = `
    <section class="card" style="order:${portraitFirst ? 1 : 2};display:flex;flex-direction:column;align-items:center">
      ${portraitSVG(breed, state.mode === "temperament" || state.answered)}
      <p class="kicker" style="margin-top:0.75rem">${state.mode === "identity" && !state.answered ? "Unidentified specimen" : "Breed identification"}</p>
      <p style="margin-top:0.25rem;font-family:var(--display);font-size:1.25rem">${state.mode === "identity" && !state.answered ? "Name this cat" : esc(breed.name)}</p>
    </section>`;
  return `
    <div class="play">
      <header class="bar">
        <div class="inner">
          <div style="display:flex;gap:0.75rem;align-items:flex-start">
            <button class="iconbtn" data-hub aria-label="Back to quiz types">←</button>
            <div>
              <p class="kicker">${state.mode === "temperament" ? "Type I · Temperament" : "Type II · Name the cat"}</p>
              <h1 style="font-size:1.5rem">Void Match</h1>
            </div>
          </div>
          <div class="stats">
            <div class="stat"><span>Question</span><b>${state.index + 1}/${state.deck.length}</b></div>
            <div class="stat"><span>Score</span><b>${state.score}</b></div>
            <div class="stat"><span>Streak</span><b>${state.streak}</b></div>
          </div>
        </div>
        <div class="progress"><span style="transform:scaleX(${progress})"></span></div>
      </header>
      <main class="grid">${qCard}${pCard}</main>
    </div>`;
}

function render() {
  const app = document.getElementById("app");
  app.innerHTML = state.screen === "hub" ? hub() : state.screen === "end" ? end() : play();
}

document.getElementById("app").addEventListener("click", (e) => {
  const t = e.target.closest("[data-begin],[data-choose],[data-next],[data-hub],[data-again]");
  if (!t) return;
  if (t.dataset.begin) begin(t.dataset.begin);
  else if (t.dataset.choose) choose(t.dataset.choose);
  else if (t.hasAttribute("data-next")) next();
  else if (t.hasAttribute("data-again")) begin(state.mode);
  else if (t.hasAttribute("data-hub")) { state.screen = "hub"; render(); }
});

window.addEventListener("keydown", (e) => {
  if (state.screen !== "play") return;
  if (state.answered && e.key === "Enter") { next(); return; }
  if (!state.answered && e.key >= "1" && e.key <= "4") {
    const i = Number(e.key) - 1;
    if (state.options[i]) choose(state.options[i].key);
  }
});

render();
  </script>
</body>
</html>
