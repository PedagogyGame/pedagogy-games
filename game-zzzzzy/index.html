<style>
:root{--ink:#241018;--muted:#786068;--paper:#f6eef2;--panel:#f9f2f5;--line:#d4b8c4;--deep:#3a1828;--good:#5c2a44;--bad:#8a2f27;--gold:#c07090}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(1200px 700px at 12% -10%,rgba(180,70,110,.32),transparent 52%),linear-gradient(180deg,#402830 0%,#d4c4cc 42%,#301820 100%);color:var(--ink);font-family:Georgia,"Times New Roman","Noto Serif SC","Songti SC",serif;overflow:hidden}

.progress{flex:1;max-width:460px;height:7px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:#c07090;width:1%;transition:width .25s ease}
.stat{font-size:13px;opacity:.88;white-space:nowrap}.topbtn{border:1px solid rgba(255,255,255,.28);background:transparent;color:white;border-radius:8px;padding:7px 10px;cursor:pointer}

button{font:600 13px/1.1 Georgia,serif;letter-spacing:.03em}

.imagepane{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;background:rgba(22,12,18,.94);border:2px solid #3a1828;border-radius:4px;overflow:hidden;box-shadow:inset 0 0 0 7px rgba(192,112,144,.22),0 16px 48px rgba(32,16,24,.3)}
.imagepane:before{content:"";position:absolute;inset:8px;border:1px solid rgba(192,112,144,.5);border-radius:3px;pointer-events:none}.art{display:block;max-width:94%;max-height:90%;width:auto;height:auto;object-fit:contain;filter:saturate(.98) contrast(1.02);box-shadow:0 8px 32px rgba(0,0,0,.28);transition:opacity .35s ease,transform .35s ease}.art.wide{max-width:98%;max-height:84%}

@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@media(max-width:900px){body{overflow:auto}.app{height:auto;min-height:100vh}.main{grid-template-columns:1fr;grid-template-rows:auto minmax(360px,55vh)}.quiz{overflow:visible}.imagepane{min-height:420px}.topbar{flex-wrap:wrap}.progress{order:3;flex-basis:100%;max-width:none}}
@media(max-width:520px){.main{padding:9px;gap:9px}.quiz{padding:14px}.brand small{display:none}.character{font-size:104px}.example{font-size:20px}.topbar{padding:8px 10px}.stat.scoreStat{display:none}}
</style>

lds to the principle of fairness in his work."},{"zh":"古人秉烛夜读。","pinyin":"gǔ rén bǐng zhú yè dú.","en":"The ancients held a candle and read at night."}]},{"rank":2810,"char":"哺","pinyin":"bǔ","meanings":["feed","nurture"],"words":[{"zh":"哺乳","pinyin":"bǔ rǔ","en":"nurse; mammal"},{"zh":"哺育","pinyin":"bǔ yù","en":"nurture; feed"}],"examples":[{"zh":"鸟类用虫子哺育幼鸟。","pinyin":"niǎo lèi yòng chóng zi bǔ yù yòu niǎo.","en":"Birds nurture their young with insects."},{"zh":"哺乳动物用乳汁喂养幼崽。","pinyin":"bǔ rǔ dòng wù yòng rǔ zhī wèi yǎng yòu zǎi.","en":"Mammals feed their young with milk."}]},{"rank":2811,"char":"矢","pinyin":"shǐ","meanings":["arrow"],"words":[{"zh":"弓矢","pinyin":"gōng shǐ","en":"bow and arrow"},{"zh":"矢志","pinyin":"shǐ zhì","en":"vow determinedly"}],"examples":[{"zh":"博物馆里陈列着古代弓矢。","pinyin":"bó wù guǎn lǐ chén liè zhe gǔ dài gōng shǐ.","en":"Ancient bows and arrows are displayed in the museum."},{"zh":"他矢志把这件事做完。","pinyin":"tā shǐ zhì bǎ zhè jiàn shì zuò wán.","en":"He is determined to see this matter through."}]},{"rank":2812,"char":"啪","pinyin":"pā","meanings":["slap; bang (sound)"],"words":[{"zh":"啪的一声","pinyin":"pā de yì shēng","en":"with a slap / bang"},{"zh":"啪啪","pinyin":"pā pā","en":"clap-clap; patter"}],"examples":[{"zh":"他啪的一声关上抽屉。","pinyin":"tā pā de yì shēng guan shàng chōu ti.","en":"He shut the drawer with a bang."},{"zh":"雨点啪啪打在窗上。","pinyin":"yǔ diǎn pā pā dǎ zài chuāng shàng.","en":"Raindrops patter on the window."}]},{"rank":2813,"char":"帜","pinyin":"zhì","meanings":["flag","banner"],"words":[{"zh":"旗帜","pinyin":"qí zhì","en":"banner; flag"},{"zh":"独树一帜","pinyin":"dú shù yì zhì","en":"a style of one's own"}],"examples":[{"zh":"广场上旗帜飘扬。","pinyin":"guǎng chǎng shàng qí zhì piāo yáng.","en":"Banners flutter over the square."},{"zh":"他的画风独树一帜。","pinyin":"tā de huà fēng dú shù yì zhì.","en":"His painting style is a school of its own."}]},{"rank":2814,"char":"邵","pinyin":"Shào","meanings":["Shao, a surname"],"words":[{"zh":"姓邵","pinyin":"xìng Shào","en": let order = BANK.map((_,i)=>i), pos=0, state='front';

function renderDetail(mode){const c=current(), d=$('detailArea'); if(mode==='front'){d.innerHTML='';return}
