<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Night Shift · Global OCC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&family=Saira+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --soil:#0e0b08; --panel:#1d1510; --rock:#382a1e; --rock-lit:#5a4230;
  --worklight:#ffab2e; --amber-dim:#8a5c1c; --phosphor:#9fd2ff; --phos-dim:#4d6c8a;
  --slurry:#c96a3a; --fault:#ff4d3d; --nominal:#6fd08c; --bone:#e8dfd4; --mute:#9a8974;
  --hivis:#d8e04a;
  --ore-dur:11s; --drill-dur:7s;
  --disp:"Saira Condensed",Impact,sans-serif;
  --data:"IBM Plex Mono",ui-monospace,monospace;
  --body:"IBM Plex Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--soil);color:var(--bone);font-family:var(--body);overflow-x:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:80;
  background:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px);background-size:100% 3px;
  mix-blend-mode:overlay}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--worklight);outline-offset:2px}
.ghost{background:transparent;border:1px solid var(--rock-lit);color:var(--worklight);
  font-family:var(--data);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  padding:5px 11px;border-radius:2px;transition:background .15s,color .15s}
.ghost:hover{background:var(--worklight);color:var(--soil)}
.ghost.on{background:var(--worklight);color:var(--soil)}

.rail{display:flex;align-items:center;gap:15px;flex-wrap:wrap;padding:8px 18px;
  border-bottom:1px solid var(--rock);background:#120c07;position:relative;z-index:50}
.brand{font-family:var(--disp);font-weight:800;font-size:17px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--worklight);line-height:1}
.brand small{display:block;font-size:8.5px;letter-spacing:.32em;color:var(--mute);font-weight:600}
.slot{font-family:var(--data);font-size:9px;letter-spacing:.13em;color:var(--mute);text-transform:uppercase}
.slot b{display:block;color:var(--bone);font-weight:500;font-size:11px;letter-spacing:.05em}
.spacer{flex:1}

/* ── room ── */
.room{position:relative;width:100%;line-height:0}
#scene{display:block;width:100%;height:auto}
.oredrift{animation:ore var(--ore-dur) linear infinite}
@keyframes ore{to{transform:translateX(-96px)}}
.spin{animation:spin var(--drill-dur) linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bob{animation:bob 4.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(6px)}}
.pulse{animation:pulse 3.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.flick{animation:flick 6.2s steps(1) infinite}
@keyframes flick{0%,88%{opacity:1}89%{opacity:.35}90%{opacity:1}93%{opacity:.6}94%,100%{opacity:1}}
.sip{animation:sip 9s ease-in-out infinite}
@keyframes sip{0%,72%,100%{transform:translate(0,0)}80%,88%{transform:translate(-3px,-9px)}}
.nod{animation:nod 7.5s ease-in-out infinite}
@keyframes nod{0%,84%,100%{transform:rotate(0)}90%{transform:rotate(-5deg)}}

.fg{position:absolute;bottom:-2px;width:220px;height:auto;pointer-events:none;z-index:30;
  filter:blur(2.6px);opacity:.95}
.fg.l{left:-34px} .fg.r{right:-34px}

/* ── your terminal (scaled down ~12%) ── */
.station{position:relative;z-index:20;max-width:890px;margin:-78px auto 0;padding:0 18px 40px;line-height:1.4}
.bezel{background:linear-gradient(#241a12,#1a120c);border:1px solid var(--rock-lit);
  border-radius:7px;padding:8px;box-shadow:0 -18px 60px rgba(255,171,46,.10),0 22px 60px rgba(0,0,0,.75)}
.crt{background:#0c0a07;border:1px solid #4a3626;border-radius:4px;padding:16px 18px 15px;position:relative;overflow:hidden}
.crt::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 100% at 50% 0%,rgba(159,210,255,.06),transparent 70%)}

.hud{display:flex;gap:16px;flex-wrap:wrap;align-items:baseline;
  border-bottom:1px solid var(--rock);padding-bottom:8px;margin-bottom:13px}
.hud .h{font-family:var(--data);font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.hud .h b{color:var(--phosphor);font-weight:500;font-size:11px;letter-spacing:.04em}
.hud .h b.up{color:var(--nominal)} .hud .h b.dn{color:var(--fault)}
.pips{display:flex;gap:3px}
.pips i{width:8px;height:3.5px;background:var(--rock);border-radius:1px}
.pips i.ok{background:var(--nominal)} .pips i.no{background:var(--fault)}

.cue{font-family:var(--data);font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--slurry)}
.term{font-family:var(--disp);font-weight:800;font-size:clamp(26px,4.6vw,47px);line-height:.98;
  text-transform:uppercase;letter-spacing:.015em;margin:5px 0 3px;color:var(--bone)}
.termdef{font-size:clamp(15px,2.2vw,20px);line-height:1.4;margin:7px 0 5px;color:var(--bone);max-width:56ch}
.sub{font-family:var(--data);font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--amber-dim)}

.opts{display:flex;flex-direction:column;gap:6px;margin-top:13px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;
  background:#15100a;border:1px solid var(--rock);color:var(--bone);padding:9px 11px;
  border-radius:2px;font-size:13px;line-height:1.42;transition:border-color .13s,background .13s}
.opt:hover:not(:disabled){border-color:var(--worklight);background:#1d1509}
.opt kbd{font-family:var(--data);font-size:9px;color:var(--worklight);border:1px solid var(--rock-lit);
  border-radius:2px;padding:1px 5px;flex:0 0 auto;letter-spacing:.05em}
.opt:disabled{cursor:default;opacity:.4}
.opt.right{border-color:var(--nominal);background:rgba(111,208,140,.10);opacity:1}
.opt.right kbd{color:var(--nominal);border-color:var(--nominal)}
.opt.wrong{border-color:var(--fault);background:rgba(255,77,61,.10);opacity:1}
.opt.wrong kbd{color:var(--fault);border-color:var(--fault)}

.timer{height:2px;background:var(--rock);margin-top:13px;overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--worklight);transform-origin:left;
  animation:drain var(--wait,1700ms) linear forwards}
@keyframes drain{to{transform:scaleX(0)}}
.echo{font-family:var(--data);font-size:10px;letter-spacing:.05em;color:var(--mute);margin-top:9px;min-height:1.4em}
.echo b{color:var(--worklight);font-weight:500}

.report h2{font-family:var(--disp);font-weight:800;font-size:clamp(26px,4.8vw,45px);
  text-transform:uppercase;letter-spacing:.02em;margin:3px 0 0;line-height:.96}
.report h2 span{color:var(--worklight)}
.figs{display:flex;flex-wrap:wrap;gap:22px;margin:14px 0 17px;padding:11px 0;
  border-top:1px solid var(--rock);border-bottom:1px solid var(--rock)}
.figs div span{display:block;font-family:var(--data);font-size:8.5px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--mute)}
.figs div b{font-family:var(--disp);font-weight:700;font-size:25px;color:var(--phosphor)}
.misses{list-style:none;padding:0;margin:0 0 16px;max-height:268px;overflow:auto}
.misses li{border-left:2px solid var(--fault);padding:5px 0 5px 11px;margin-bottom:8px}
.misses strong{font-family:var(--data);font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--worklight);display:block}
.misses p{margin:2px 0 0;font-size:12.5px;line-height:1.5;color:#c4b8a9}

#gloss{position:fixed;top:0;right:0;height:100%;width:min(410px,92vw);z-index:90;background:#171009;
  border-left:1px solid var(--rock-lit);transform:translateX(102%);transition:transform .3s ease;
  overflow:auto;padding:18px 20px 40px;line-height:1.4}
#gloss.open{transform:none}
#gloss h3{font-family:var(--disp);font-weight:800;font-size:20px;text-transform:uppercase;
  letter-spacing:.1em;margin:0;color:var(--worklight)}
#gloss h4{font-family:var(--data);font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--slurry);margin:19px 0 6px;border-bottom:1px solid var(--rock);padding-bottom:4px}
#gloss dt{font-family:var(--data);font-size:11px;color:var(--bone);margin-top:8px}
#gloss dd{margin:2px 0 0;font-size:12px;line-height:1.5;color:var(--mute)}
#gloss .close{position:absolute;top:16px;right:18px}

@media (max-width:900px){ .station{margin-top:-40px} .fg{width:145px} }
@media (max-width:620px){ .fg{display:none} .station{margin-top:-20px;padding-bottom:28px} .crt{padding:14px} }
@media (prefers-reduced-motion:reduce){ *{animation:none !important} }
</style>
</head>

<script>
/* ════════ 45 terms ════════ */
const T=[
["Prufrock","TBC's in-house TBM series — the machine the whole operation is built around.","Machine"],
["TBM","Tunnel boring machine: the generic class of excavation machine.","Machine"],
["Godot","The first-generation off-the-shelf machine that set the baseline.","Machine"],
["Porpoising","Launching off the truck at grade and surfacing again at the far end, with no pits.","Machine"],
["Surface launch","Getting the machine cutting within roughly a day or two of arriving on site.","Machine"],
["Continuous mining","Erecting the liner while still boring, instead of stopping to build each ring.","Machine"],
["ZPIT","Zero People In Tunnel: normal mining runs remote, with nobody underground.","Machine"],
["The Monster","The trailer the machine mines itself onto for recovery and transport.","Machine"],
["Advance rate","Distance completed per week — the number the whole operation is judged on.","Machine"],
["Cutterhead","The rotating front face of the machine that does the excavating.","Machine"],
["Disc cutters","The individual cutting tools bolted to the rotating face.","Machine"],
["Erector","The arm that lifts and positions precast segments into the ring.","Machine"],
["Thrust cylinders","Hydraulic rams that push the machine forward off the last completed ring.","Machine"],
["Tail shield","The rear section of the shield, where the ring is built.","Machine"],
["Tunnel face","The live excavation front being cut.","Machine"],

["Precast segments","Concrete pieces bolted into rings to form the permanent lining.","Liner & muck"],
["Ring clocking","Rotating tapered rings against each other so the finished tunnel curves.","Liner & muck"],
["SNaILS","The in-house guidance system that computes alignment and ring clocking.","Liner & muck"],
["Liner truck","All-electric remote hauler that runs segments down to the face on tires.","Liner & muck"],
["Muck","Excavated material coming out of the hole.","Liner & muck"],
["Spoil","The civil-engineering word for excavated material, used interchangeably with muck.","Liner & muck"],
["Vertical cassette","Surface unit that stores and pays out conveyor belt as the drive lengthens.","Liner & muck"],
["Carry belt","The loaded outbound run of the conveyor; the empty side coming back is the return belt.","Liner & muck"],
["Belt boosters","Intermediate drives that keep long conveyor runs powered, roughly every mile and a half.","Liner & muck"],
["Grouting","Injecting material behind the segments to support and seal them.","Liner & muck"],
["EPDM gaskets","Rubber seals between segments that keep the tunnel watertight.","Liner & muck"],
["Annulus","The gap between the excavated bore and the outside of the installed liner.","Liner & muck"],
["12-foot diameter","The standard bore size — small diameter is where the cost comes out.","Liner & muck"],

["Loop","The all-electric, zero-emission underground transit system.","Loop & ops"],
["AEV","Autonomous electric vehicle — the cars that carry passengers through the tunnels.","Loop & ops"],
["Main artery","The primary high-speed tunnel connecting stations.","Loop & ops"],
["Station","Passenger entry and exit point, sometimes no bigger than two parking spaces.","Loop & ops"],
["OCC","The remote control center in Texas that runs the machine fleet.","Loop & ops"],
["Vertical integration","Machines, liners, vehicles and operations all designed and built in-house.","Loop & ops"],
["Porpoise test","A short proving tunnel every new machine runs before it deploys.","Loop & ops"],
["Bastrop","The Texas site where R&D, testing and manufacturing all happen.","Loop & ops"],

["Alignment","The planned path of the tunnel and the live guidance holding it there.","Geometry & safety"],
["Invert","The bottom of the tunnel cross-section.","Geometry & safety"],
["Crown","The top of the tunnel cross-section.","Geometry & safety"],
["Portal","The point where the tunnel meets daylight.","Geometry & safety"],
["Shaft","Vertical access into the works — porpoising exists to avoid needing them.","Geometry & safety"],
["Ventilation","Air handling, much simpler with electric plant and nobody underground.","Geometry & safety"],
["Fire life safety","Detection, evacuation and suppression systems for occupied tunnels.","Geometry & safety"],
["Soft-soil TBM","A machine built for soil rather than hard rock.","Geometry & safety"],
["Hyperloop","The vacuum-tube high-speed concept; test tunnels have served related work.","Geometry & safety"]
];

/* ════════ scene ════════ */
const NS="http://www.w3.org/2000/svg";
const el=(n,a)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e;};
const rnd=(a,b)=>a+Math.random()*(b-a);
const add=(p,n,a)=>{const e=el(n,a);p.appendChild(e);return e;};

/* wall screens */
function screenArt(g,x,y,w,h){
  add(g,"rect",{x,y,width:w,height:h,rx:2,fill:"#0b1520",stroke:"#31241a","stroke-width":1.6});
  const k=Math.floor(rnd(0,4)), c=Math.random()<.35?"#ffab2e":"#9fd2ff";
  if(k===0){let d="M"+(x+3)+" "+(y+h/2);

}

/* ════════ drill ════════ */
const $=s=>document.querySelector(s);
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);
let deck=[],idx=0,right=0,streak=0,best=0,ar=.40,rings=0,missed=[],locked=false,timer=null,runLen=20;

function makeQ(item){
  const reverse=Math.random()<.3, pool=T.filter(t=>t[0]!==item[0]);
  const same=shuffle(pool.filter(t=>t[2]===item[2])), rest=shuffle(pool.filter(t=>t[2]!==item[2]));
  const set=shuffle([item,...[...same,...rest].slice(0,3)]);
  return {reverse,item,opts:set,a:set.indexOf(item)};
}
function paint(){
  document.documentElement.style.setProperty("--ore-dur",(16-Math.min(13,ar*8.4)).toFixed(2)+"s");
  document.documentElement.style.setProperty("--drill-dur",(11-Math.min(9,ar*6)).toFixed(2)+"s");
  const h=document.getElementById("hudbits");
  if(h) h.innerHTML=`
    <div class="h">Correct <b>${right} / ${idx}</b></div>
    <div class="h">Streak <b class="${streak>2?'up':''}">${streak}</b></div>
    <div class="h">Advance rate <b class="${ar>=1?'up':ar<=.2?'dn':''}">${ar.toFixed(2)} mi/wk</b></div>
    <div class="h">Rings <b>${rings}</b></div>`;
  const t=52+idx*11;
  document.getElementById("clock").textContent=`0${1+Math.floor(t/60)}:${String(t%60).padStart(2,"0")}`;
}
function render(){
  if(idx>=deck.length) return report();
  const q=deck[idx];
  const head=q.reverse
    ? `<div class="cue">Term check · which term is this</div><p class="termdef">${q.item[1]}</p><div class="sub">${q.item[2]}</div>`
    : `<div class="cue">Term check · define it</div><h1 class="term">${q.item[0]}</h1><div class="sub">${q.item[2]}</div>`;
  $("#crt").innerHTML=`
    <div class="hud"><div id="hudbits" style="display:flex;gap:16px;flex-wrap:wrap"></div>
      <div class="spacer"></div>
      <div class="pips">${deck.map((_,i)=>`<i class="${i<idx?(deck[i].got?'ok':'no'):''}"></i>`).join("")}</div></div>
    ${head}
    <div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}"><kbd>${i+1}</kbd><span>${q.reverse?o[0]:o[1]}</span></button>`).join("")}</div>
    <div class="echo" id="echo"></div>`;
  paint(); locked=false;
  document.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>choose(+b.dataset.i)));
}
function choose(i){
  if(locked) return; locked=true;
  const q=deck[idx], ok=(i===q.a); q.got=ok;
  document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;
    if(+b.dataset.i===q.a) b.classList.add("right");
    else if(+b.dataset.i===i) b.classList.add("wrong");});
  if(ok){right++;streak++;best=Math.max(best,streak);ar=Math.min(1.6,ar+.085);rings+=14;}
  else {streak=0;ar=Math.max(.10,ar-.12);rings+=3;missed.push(q.item);}
  $("#echo").innerHTML = ok ? `<b>${q.item[0]}</b> — logged.` : `<b>${q.item[0]}</b> — ${q.item[1]}`;
  const wait=ok?1700:4200, bar=document.createElement("div");
  bar.className="timer"; bar.style.setProperty("--wait",wait+"ms"); bar.innerHTML="<i></i>";
  $("#crt").appendChild(bar);
  idx++; paint();
  timer=setTimeout(()=>{timer=null;render();},wait);
}
function report(){
  const p=Math.round(right/deck.length*100);
  const rank=p>=95?"Shift lead":p>=85?"Console qualified":p>=65?"Provisional":"Retrain";
  $("#crt").innerHTML=`<div class="report">
    <div class="cue">Shift report · console 07</div>
    <h2>Handover<br><span>${rank}</span></h2>
    <div class="figs">
      <div><span>Terms held</span><b>${right}/${deck.length}</b></div>
      <div><span>Accuracy</span><b>${p}%</b></div>
      <div><span>Best streak</span><b>${best}</b></div>
      <div><span>Advance rate</span><b>${ar.toFixed(2)}</b></div>
      <div><span>Rings set</span><b>${rings}</b></div></div>
    ${missed.length?`<div class="cue" style="margin-bottom:8px">Review before next shift</div>
      <ul class="misses">${missed.map(m=>`<li><strong>${m[0]}</strong><p>${m[1]}</p></li>`).join("")}</ul>`
      :`<p class="termdef">Every term held. The belt never slowed.</p>`}
    <button class="ghost" id="again">Start another shift</button></div>`;
  $("#again").addEventListener("click",start);
}
function start(){
  clearTimeout(timer);
  deck=shuffle(T).slice(0,runLen).map(makeQ);
  idx=0;right=0;streak=0;best=0;ar=.40;rings=0;missed=[];
  render();
}
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){$("#gloss").classList.remove("open");return;}
  if(/^[1-4]$/.test(e.key)&&!locked){const b=document.querySelector(`.opt[data-i="${+e.key-1}"]`);if(b)b.click();return;}
  if(e.code==="Space"&&timer){e.preventDefault();clearTimeout(timer);timer=null;render();}
});
$("#glossBtn").addEventListener("click",()=>$("#gloss").classList.toggle("open"));
$("#glossClose").addEventListener("click",()=>$("#gloss").classList.remove("open"));
