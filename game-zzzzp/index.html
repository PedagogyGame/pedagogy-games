<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Grand Virtual Woodshop - Free Navigation & Inspection</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #080a0e; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; overflow: hidden; width: 100vw; height: 100vh; }
  #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
  
  /* Header */
  header { position: absolute; top: 0; left: 0; width: 100%; padding: 14px 22px; display: flex; justify-content: space-between; align-items: center; background: linear-gradient(180deg, rgba(8,10,14,0.96) 0%, rgba(8,10,14,0.6) 75%, transparent 100%); z-index: 10; pointer-events: none; }
  .brand { pointer-events: auto; display: flex; align-items: center; gap: 12px; }
  .brand-icon { width: 42px; height: 42px; background: linear-gradient(135deg, #d4a373, #e76f51); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 22px; color: #111; box-shadow: 0 4px 14px rgba(231, 111, 81, 0.35); }
  .brand-text h1 { font-size: 1.2rem; font-weight: 800; color: #f8f9fa; letter-spacing: 0.5px; }
  .brand-text p { font-size: 0.7rem; color: #d4a373; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700; }
  .header-actions { pointer-events: auto; display: flex; gap: 10px; }
  .hud-btn { background: rgba(16,20,26,0.92); border: 1px solid rgba(212,163,115,0.35); color: #f8f9fa; padding: 7px 14px; border-radius: 6px; font-size: 0.78rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.2s; backdrop-filter: blur(8px); }
  .hud-btn:hover { background: #d4a373; color: #111; border-color: #d4a373; }
  .hud-btn.active { background: #2a9d8f; color: #fff; border-color: #2a9d8f; }

  /* Left Sidebar Navigation */
  .quick-nav { position: absolute; top: 76px; left: 16px; width: 250px; background: rgba(16,20,26,0.95); border: 1px solid rgba(212,163,115,0.3); border-radius: 10px; padding: 10px; z-index: 10; display: flex; flex-direction: column; gap: 4px; backdrop-filter: blur(12px); box-shadow: 0 8px 30px rgba(0,0,0,0.5); max-height: calc(100vh - 96px); overflow-y: auto; }
  .quick-nav::-webkit-scrollbar { width: 4px; }
  .quick-nav::-webkit-scrollbar-thumb { background: rgba(212,163,115,0.3); border-radius: 2px; }
  .nav-title { font-size: 0.72rem; font-weight: 800; color: #d4a373; text-transform: uppercase; letter-spacing: 1px; padding: 4px 6px; }
  .nav-btn { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); color: #ddd; padding: 6px 8px; border-radius: 6px; font-size: 0.73rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: space-between; transition: all 0.2s; text-align: left; }
  .nav-btn:hover, .nav-btn.active { background: rgba(212,163,115,0.18); border-color: #d4a373; color: #d4a373; transform: translateX(3px); }

  /* Right Control & Telemetry Panel */
  .control-panel { position: absolute; top: 76px; right: 16px; width: 330px; background: rgba(16,20,26,0.96); border: 1px solid rgba(212,163,115,0.35); border-radius: 10px; z-index: 10; display: none; flex-direction: column; backdrop-filter: blur(14px); box-shadow: 0 10px 40px rgba(0,0,0,0.6); animation: slideIn 0.25s ease; }
  @keyframes slideIn { from { transform: translateX(30px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  .panel-header { padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; justify-content: space-between; align-items: center; }
  .panel-header h2 { font-size: 0.95rem; font-weight: 800; color: #d4a373; }
  .close-btn { background: rgba(255,255,255,0.06); border: none; color: #999; width: 24px; height: 24px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; }
  .close-btn:hover { background: #e76f51; color: #fff; }
  .panel-body { padding: 14px; font-size: 0.8rem; line-height: 1.5; }
  .panel-desc { color: #aaa; margin-bottom: 10px; font-size: 0.76rem; }
  .control-box { background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.06); border-radius: 6px; padding: 10px; margin-bottom: 10px; }
  .control-box h4 { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1px; color: #f4a261; margin-bottom: 8px; }
  .detail-badge { background: rgba(212,163,115,0.12); border-left: 2px solid #d4a373; padding: 6px 8px; font-size: 0.72rem; color: #eee; margin-bottom: 8px; border-radius: 0 4px 4px 0; }
  .slider-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .slider-row:last-child { margin-bottom: 0; }
  .slider-row label { font-size: 0.74rem; color: #ccc; min-width: 95px; }
  .slider-row input[type="range"] { flex: 1; accent-color: #d4a373; cursor: pointer; }
  .slider-val { font-family: monospace; font-size: 0.74rem; font-weight: 700; color: #fff; min-width: 50px; text-align: right; }
  .action-btn { width: 100%; background: #d4a373; color: #111; border: none; padding: 9px; border-radius: 6px; font-weight: 700; font-size: 0.78rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 6px; transition: all 0.2s; }
  .action-btn:hover { background: #e76f51; color: #fff; }
  .action-btn.secondary { background: rgba(42, 157, 143, 0.2); border: 1px solid #2a9d8f; color: #2a9d8f; }
  .action-btn.secondary:hover { background: #2a9d8f; color: #fff; }

  /* 3D Tooltip */
  #hud-tooltip { position: absolute; pointer-events: none; background: rgba(16, 20, 26, 0.95); border: 1px solid #d4a373; padding: 6px 12px; border-radius: 6px; color: #fff; font-size: 0.78rem; font-weight: 700; box-shadow: 0 4px 14px rgba(0,0,0,0.5); display: none; z-index: 20; transform: translate(-50%, -140%); white-space: nowrap; }

  /* Bottom Controls Navigation Hint */
  #hint { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); background: rgba(14,17,22,0.88); border: 1px solid rgba(212,163,115,0.25); padding: 7px 18px; border-radius: 24px; font-size: 0.74rem; color: #ccc; z-index: 10; backdrop-filter: blur(8px); display: flex; gap: 12px; align-items: center; }
  .key-chip { background: rgba(255,255,255,0.12); padding: 2px 6px; border-radius: 4px; font-family: monospace; font-weight: 700; color: #fff; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div id="canvas-container"></div>
<div id="hud-tooltip">Hotspot</div>

<header>
  <div class="brand">
    <div class="brand-icon"><i class="fa-solid fa-tree"></i></div>
    <div class="brand-text">
      <h1>3D GRAND VIRTUAL WOODSHOP</h1>
      <p>12 Scaled Workstations &bull; Free-Fly Camera & Click Inspection</p>
    </div>
  </div>
  <div class="header-actions">
    <button class="hud-btn" onclick="focusStation('overview')"><i class="fa-solid fa-expand"></i> Room View</button>
    <button class="hud-btn" id="btn-sound" onclick="toggleAudio()"><i class="fa-solid fa-volume-high"></i> Sound ON</button>
  </div>
</header>

<!-- Left Station Selector -->
<aside class="quick-nav">
  <div class="nav-title"><i class="fa-solid fa-layer-group"></i> 12 Workstations</div>
  <button class="nav-btn" id="nav-miter" onclick="selectStation('miter')">
    <span>01. Miter Saw & Lumber</span> <i class="fa-solid fa-chevron-right"></i>
  </button>
  <button class="nav-btn" id="nav-jointer" onclick="selectStation('jointer')">
    <span>02. Face & Edge Jointer</span> <i class="fa-solid fa-chevron-right"></i>
  </button>
  <button class="nav-btn" id="nav-planer" onclick="selectStation('planer')">
    <span>03. Thickness Planer</span> <i class="fa-solid fa-chevron-right"></i>
  </button>
  <button class="nav-btn" id="nav-bandsaw" onclick="selectStation('bandsaw')">
    <span>04. Resaw Bandsaw</span> <i class="fa-solid fa-chevron-right"></i>
  </button>
  <button class="nav-btn" id="nav-drillpress" onclick="selectStation('drillpress')">
    <span>05. Floor Drill Press</span> <i class="fa-solid fa-chevron-right"></i>
  </button>
  <button class="nav-btn active" id="nav-tablesaw" onclick="selectStation('tablesaw')">
    <span>06. Cabinet Table Saw</span> <i class="fa-solid fa-chevron-right"></i>
  </button>
  <button class="nav-btn" id="nav-workbench" onclick="selectStation('workbench')">
    <span>07. Roubo Joinery Bench</span> <i class="fa-solid fa-chevron-right"></i>
  </button>
  <button class="nav-btn" id="nav-router" onclick="selectStation('router')">
    <span>08. Precision Router Table</span> <i class="fa-solid fa-chevron-right"></i>
  </button>
  <button class="nav-btn" id="nav-lathe" onclick="selectStation('lathe')">
    <span>09. Woodturning Lathe</span> <i class="fa-solid fa-chevron-right"></i>
  </button>
  <button class="nav-btn" id="nav-scrollsaw" onclick="selectStation('scrollsaw')">
    <span>10. Marquetry Scroll Saw</span> <i class="fa-solid fa-chevron-right"></i>
  </button>
  <button class="nav-btn" id="nav-assembly" onclick="selectStation('assembly')">
    <span>11. Assembly & Clamping</span> <i class="fa-solid fa-chevron-right"></i>
  </button>
  <button class="nav-btn" id="nav-finishing" onclick="selectStation('finishing')">
    <span>12. Sanding & Finishing</span> <i class="fa-solid fa-chevron-right"></i>
  </button>
</aside>

<!-- Right Inspection & Control Panel -->
<section class="control-panel" id="control-panel">
  <div class="panel-header">
    <h2 id="panel-title">Station Title</h2>
    <button class="close-btn" onclick="closePanel()"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <div class="panel-body" id="panel-content"></div>
</section>

<div id="hint">
  <span><span class="key-chip">W A S D</span> Walk / Fly</span>
  <span><span class="key-chip">Q / E</span> Down / Up</span>
  <span><span class="key-chip">Mouse Drag</span> Look & Orbit</span>
  <span><span class="key-chip">Click Machine</span> Inspect & Control</span>
</div>

<script>
window.addEventListener('DOMContentLoaded', () => {
  // 1. Scene, Camera, Renderer
  const container = document.getElementById('canvas-container');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0c10);
  scene.fog = new THREE.FogExp2(0x0a0c10, 0.015);

  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 140);
  camera.position.set(0, 15, 24);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio || 1);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.18;
  container.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.maxPolarAngle = Math.PI / 2 - 0.01;
  controls.minDistance = 0.5;
  controls.maxDistance = 60;
  controls.target.set(0, 1.4, 0);

  // Free-Fly Camera WASD Movement State
  const keyState = { w: false, a: false, s: false, d: false, q: false, e: false };
  window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (k === 'w' || e.key === 'ArrowUp') keyState.w = true;
    if (k === 's' || e.key === 'ArrowDown') keyState.s = true;
    if (k === 'a' || e.key === 'ArrowLeft') keyState.a = true;
    if (k === 'd' || e.key === 'ArrowRight') keyState.d = true;
    if (k === 'q' || e.key === 'Shift') keyState.q = true;
    if (k === 'e' || e.key === ' ') keyState.e = true;
  });

  window.addEventListener('keyup', (e) => {
    const k = e.key.toLowerCase();
    if (k === 'w' || e.key === 'ArrowUp') keyState.w = false;
    if (k === 's' || e.key === 'ArrowDown') keyState.s = false;
    if (k === 'a' || e.key === 'ArrowLeft') keyState.a = false;
    if (k === 'd' || e.key === 'ArrowRight') keyState.d = false;
    if (k === 'q' || e.key === 'Shift') keyState.q = false;
    if (k === 'e' || e.key === ' ') keyState.e = false;
  });

  // 2. Lighting
  const ambient = new THREE.AmbientLight(0xffeedd, 0.65);
  scene.add(ambient);

  const sun = new THREE.DirectionalLight(0xfff5e6, 0.95);
  sun.position.set(18, 28, 16);
  sun.castShadow = true;
  sun.shadow.mapSize.width = 2048;
  sun.shadow.mapSize.height = 2048;
  sun.shadow.bias = -0.0004;
  scene.add(sun);

  // 3. Procedural Textures & Materials
  function makeWoodTexture(baseHex, grainHex, freq) {
    const cv = document.createElement('canvas');
    cv.width = 256; cv.height = 256;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = baseHex; ctx.fillRect(0,0,256,256);
    ctx.fillStyle = grainHex;
    for (let y = 0; y < 256; y += 2) {
      ctx.globalAlpha = (Math.sin(y / freq) + 1) * 0.12;
      ctx.fillRect(0, y, 256, 2);
    }
    const t = new THREE.CanvasTexture(cv);
    t.wrapS = THREE.RepeatWrapping; t.wrapT = THREE.RepeatWrapping;
    return t;
  }

  function makeRulerTexture() {
    const cv = document.createElement('canvas');
    cv.width = 1024; cv.height = 128;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#d0d5dc'; ctx.fillRect(0,0,1024,128);
    ctx.fillStyle = '#1a1d22'; ctx.font = 'bold 16px monospace';
    for (let x = 10; x < 1014; x += 8) {
      const isInch = ((x - 10) % 80) === 0;
      const isHalf = ((x - 10) % 40) === 0;
      let h = 14;
      if (isInch) h = 40; else if (isHalf) h = 28;
      ctx.fillRect(x, 0, 2, h);
      if (isInch) {
        const val = Math.round((x - 10) / 80);
        ctx.fillText(String(val), x + 4, 36);
      }
    }
    return new THREE.CanvasTexture(cv);
  }

  const mapleTex = makeWoodTexture('#cfb285', '#9e7a4f', 14);
  const walnutTex = makeWoodTexture('#543d2b', '#302014', 12);
  const cherryTex = makeWoodTexture('#8f4a2b', '#5c2a14', 16);
  const pineTex = makeWoodTexture('#ddb87a', '#a67d3d', 18);
  const rulerTex = makeRulerTexture();

  const matMaple = new THREE.MeshStandardMaterial({ map: mapleTex, roughness: 0.65 });
  const matWalnut = new THREE.MeshStandardMaterial({ map: walnutTex, roughness: 0.7 });
  const matCherry = new THREE.MeshStandardMaterial({ map: cherryTex, roughness: 0.68 });
  const matPine = new THREE.MeshStandardMaterial({ map: pineTex, roughness: 0.75 });
  const matRuler = new THREE.MeshStandardMaterial({ map: rulerTex, metalness: 0.85, roughness: 0.2 });
  const matIron = new THREE.MeshStandardMaterial({ color: 0x22252a, roughness: 0.4, metalness: 0.75 });
  const matSteel = new THREE.MeshStandardMaterial({ color: 0x9499a0, roughness: 0.25, metalness: 0.9 });
  const matCabinetBlue = new THREE.MeshStandardMaterial({ color: 0x1e3d59, roughness: 0.55 });
  const matYellow = new THREE.MeshStandardMaterial({ color: 0xd48b28, roughness: 0.5 });
  const matRed = new THREE.MeshStandardMaterial({ color: 0xcc2929, roughness: 0.3 });
  const matGoldBlade = new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.95, roughness: 0.15 });
  const matLaser = new THREE.MeshBasicMaterial({ color: 0xff1111 });
  const matConduit = new THREE.MeshStandardMaterial({ color: 0xb5bcc7, metalness: 0.85, roughness: 0.3 });

  // 4. Room Environment (Floors, Walls, Trusses, Ducts, Electrical, Fan, Cleaners)
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(44, 34), new THREE.MeshStandardMaterial({ color: 0x20242a, roughness: 0.38, metalness: 0.12 }));
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);

  const grid = new THREE.GridHelper(42, 42, 0xd4a373, 0x2e343e);
  grid.position.y = 0.002;
  scene.add(grid);

  const wallMat = new THREE.MeshStandardMaterial({ color: 0x181b20, roughness: 0.85 });
  const backWall = new THREE.Mesh(new THREE.BoxGeometry(44, 8, 0.3), wallMat);
  backWall.position.set(0, 4, -14);
  backWall.receiveShadow = true;
  scene.add(backWall);

  const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.3, 8, 34), wallMat);
  leftWall.position.set(-22, 4, 0);
  leftWall.receiveShadow = true;
  scene.add(leftWall);

  const rightWall = new THREE.Mesh(new THREE.BoxGeometry(0.3, 8, 34), wallMat);
  rightWall.position.set(22, 4, 0);
  rightWall.receiveShadow = true;
  scene.add(rightWall);

  const cleatWall = new THREE.Mesh(new THREE.BoxGeometry(38, 2.8, 0.06), matPine);
  cleatWall.position.set(0, 2.8, -13.82);
  scene.add(cleatWall);

  for (let z = -12; z <= 12; z += 6) {
    const truss = new THREE.Mesh(new THREE.BoxGeometry(44, 0.25, 0.25), matPine);
    truss.position.set(0, 7.2, z);
    scene.add(truss);
  }

  // Ceiling Air Cleaners
  const airCleaners = [[-6.0, -3.0], [6.0, 4.0]];
  airCleaners.forEach(pos => {
    const unit = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.5, 0.9), matCabinetBlue);
    unit.position.set(pos[0], 6.8, pos);
    const grill = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.35, 0.02), matSteel);
    grill.position.set(pos[0], 6.8, pos + 0.46);
    scene.add(unit);
    scene.add(grill);
  });

  // Main Dust Collection Manifold & Drops
  const mainDuct = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.24, 40, 16), matSteel);
  mainDuct.rotation.z = Math.PI / 2;
  mainDuct.position.set(0, 6.2, -6.5);
  scene.add(mainDuct);

  const ductDrops = [
    [-14.5, -9.5], [-7.5, -9.5], [-1.0, -9.5], [5.5, -9.5], [12.0, -9.5],
    [17.0, -5.0], [-6.5, 0.0], [4.5, 0.0], [-14.5, 9.0], [-7.0, 9.0],
    [2.5, 9.0], [12.5, 9.0]
  ];
  ductDrops.forEach(pos => {
    const drop = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 4.2, 12), matSteel);
    drop.position.set(pos[0], 4.1, pos);
    scene.add(drop);
  });

  // Wall Electrical Outlets
  const outletPositions = [
    [-18, 1.2, -13.8], [-12, 1.2, -13.8], [-6, 1.2, -13.8], [0, 1.2, -13.8], [6, 1.2, -13.8], [12, 1.2, -13.8], [18, 1.2, -13.8],
    [-21.8, 1.2, -10], [-21.8, 1.2, -3],, [-21.8, 1.2, 11],
    [21.8, 1.2, -10], [21.8, 1.2, -3],, [21.8, 1.2, 11]
  ];
  outletPositions.forEach(op => {
    const box = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.2, 0.08), matConduit);
    box.position.set(op[0], op, op);
    const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.016, 6.0, 8), matConduit);
    pipe.position.set(op[0], 4.2, op);
    scene.add(box);
    scene.add(pipe);
  });

  // Corner Oscillating Fan
  const fanGroup = new THREE.Group();
  fanGroup.position.set(-19.5, 0, -12.0);
  const fanBase = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 0.08, 16), matIron);
  fanBase.position.y = 0.04;
  fanGroup.add(fanBase);
  const fanPole = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 2.0, 12), matSteel);
  fanPole.position.y = 1.04;
  fanGroup.add(fanPole);
  const fanMotor = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.35), matYellow);
  fanMotor.position.set(0, 2.05, 0);
  fanGroup.add(fanMotor);
  const fanCage = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.14, 16), matSteel);
  fanCage.rotation.x = Math.PI / 2;
  fanCage.position.set(0, 2.05, 0.2);
  fanGroup.add(fanCage);

  const fanBladesGroup = new THREE.Group();
  for (let b = 0; b < 3; b++) {
    const blade = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.42, 0.01), matIron);
    blade.rotation.z = b * (Math.PI * 2 / 3);
    blade.position.y = 0.18 * Math.cos(b * (Math.PI * 2 / 3));
    blade.position.x = -0.18 * Math.sin(b * (Math.PI * 2 / 3));
    fanBladesGroup.add(blade);
  }
  fanBladesGroup.position.set(0, 2.05, 0.2);
  fanGroup.add(fanBladesGroup);
  scene.add(fanGroup);

  // -------------------------------------------------------------
  // ALL 12 ENLARGED WORKSTATIONS (SCALED UP 1.4X)
  // -------------------------------------------------------------
  const SCALE = 1.4;
  const hotspots = [];

  // Station 01: Miter Saw & Lumber Rack
  const miterGroup = new THREE.Group();
  miterGroup.position.set(-14.5, 0, -10.5);
  miterGroup.scale.set(SCALE, SCALE, SCALE);

  for (let i = -1; i <= 1; i++) {
    const post = new THREE.Mesh(new THREE.BoxGeometry(0.12, 4.0, 0.16), matSteel);
    post.position.set(i * 1.5, 2.0, -1.8);
    miterGroup.add(post);
    for (let j = 1; j <= 3; j++) {
      const arm = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.06, 0.9), matSteel);
      arm.position.set(i * 1.5, j * 0.9 + 0.3, -1.35);
      miterGroup.add(arm);
    }
  }
  const lumber1 = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.08, 0.22), matWalnut);
  lumber1.position.set(0, 2.15, -1.35);

    if (hits.length > 0) {

      if (hoveredTarget !== obj) {
        hoveredTarget = obj;
        document.body.style.cursor = 'pointer';
        tooltip.style.display = 'block';

  window.setMiterAngle = function(val) {
    miterSawHeadGroup.rotation.y = (val * Math.PI) / 180;
    document.getElementById('val-miter-angle').innerHTML = val + '&deg;';
    playTone(320 + Math.abs(val) * 4, 0.02);
  };

  window.animateMiterCut = function() {
    playTone(240, 0.6);
    let start = Date.now();
    const origY = miterSawHeadGroup.position.y;
    function chop() {
      const el = (Date.now() - start) / 1000;
      if (el < 0.6) {
        miterSawHeadGroup.position.y = origY - Math.sin(el * Math.PI / 0.6) * 0.12;
        requestAnimationFrame(chop);
      } else {
        miterSawHeadGroup.position.y = origY;
      }
    }
    chop();
  };

  window.setJointerDepth = function(val) {
    const norm = val / 100;
    infeedBed.position.y = 0.78 - norm * 0.015;
    const label = document.getElementById('val-jointer-depth');
    if (label) label.textContent = norm > 0.5 ? '1/8"' : '1/16"';
    playTone(300 + val * 2, 0.02);
  };

  window.animateJointingPass = function() {
    playTone(420, 0.8);
    const board = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.05, 0.18), matWalnut);
    board.position.set(-1.0, 0.82, 0);
    jointerGroup.add(board);

    let start = Date.now();
    function feed() {
      const el = (Date.now() - start) / 1000;
      if (el < 1.2) {
        board.position.x = -1.0 + el * 1.6;
        jointerGuard.rotation.y = Math.sin(el * Math.PI / 1.2) * 0.6;
        requestAnimationFrame(feed);
      } else {
        jointerGuard.rotation.y = 0;
        jointerGroup.remove(board);
      }
    }
    feed();
  };

  window.setPlanerThickness = function(val) {
    const inches = (val / 100).toFixed(3);
    document.getElementById('val-planer-t').textContent = inches + '"';
    planerCutterHead.position.y = 0.88 + (val / 400) * 0.12;
    playTone(280 + val, 0.02);
  };

  window.animatePlanerPass = function() {
    playTone(360, 1.0);
    const pBoard = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.06, 0.22), matCherry);
    pBoard.position.set(0, 0.75, 0.8);
    planerGroup.add(pBoard);

    let start = Date.now();
    function feed() {
      const el = (Date.now() - start) / 1000;
      if (el < 1.4) {
        pBoard.position.z = 0.8 - el * 1.2;
        requestAnimationFrame(feed);
      } else {
        planerGroup.remove(pBoard);
      }
    }
    feed();
  };

  window.setBandsawGuide = function(val) {
    const norm = val / 140;
    bsGuidePost.position.y = 1.2 + norm * 0.4;
    document.getElementById('val-bs-guide').textContent = (val / 10).toFixed(1) + '"';
    playTone(340 + val * 2, 0.02);
  };

  window.animateBandsawCut = function() {
    playTone(460, 0.9);
    const curveBoard = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.06, 0.4), matMaple);
    curveBoard.position.set(0.12, 1.12, 0.4);
    bandsawGroup.add(curveBoard);

    let start = Date.now();
    function cut() {
      const el = (Date.now() - start) / 1000;
      if (el < 1.2) {
        curveBoard.position.z = 0.4 - el * 0.6;
        curveBoard.rotation.y = Math.sin(el * Math.PI) * 0.3;
        requestAnimationFrame(cut);
      } else {
        bandsawGroup.remove(curveBoard);
      }
    }
    cut();
  };

  window.setScrollSpeed = function(val) {
    document.getElementById('val-ss-spm').textContent = val + ' SPM';
    playTone(500 + val / 4, 0.02);
  };

  window.animateScrollCut = function() {
    playTone(620, 0.7);
    let start = Date.now();
    function reciprocate() {
      const el = (Date.now() - start) / 1000;
      if (el < 0.9) {
        ssBlade.position.y = 0.88 + Math.sin(el * 35) * 0.025;
        ssGear.rotation.y += 0.02;
        requestAnimationFrame(reciprocate);
      } else {
        ssBlade.position.y = 0.88;
      }
    }
    reciprocate();
  };

  window.setDrillQuill = function(val) {
    const norm = val / 100;
    dpChuck.position.y = 1.74 - norm * 0.12;
    dpHandleHub.rotation.x = norm * Math.PI;
    document.getElementById('val-dp-depth').textContent = (norm * 3.5).toFixed(2) + '"';
    playTone(380 + val * 2, 0.02);
  };

  window.animateDrillBore = function() {
    playTone(580, 0.8);
    let start = Date.now();
    function plunge() {
      const el = (Date.now() - start) / 1000;
      if (el < 1.0) {
        const stroke = Math.sin(el * Math.PI / 1.0) * 0.12;
        dpChuck.position.y = 1.74 - stroke;
        dpChuck.rotation.y += 0.4;
        requestAnimationFrame(plunge);
      } else {
        dpChuck.position.y = 1.74;
      }
    }
    plunge();
  };

  window.toggleSawPower = function() {
    isSawRunning = !isSawRunning;
    const btn = document.getElementById('btn-saw-power');
    if (btn) {
      btn.innerHTML = `<i class="fa-solid fa-bolt"></i> ${isSawRunning ? 'Stop 3HP Motor' : 'Start 3HP Motor'}`;
      btn.className = `action-btn ${isSawRunning ? 'secondary' : ''}`;
    }
    playTone(isSawRunning ? 180 : 120, 0.4);
  };

  window.setBladeHeight = function(val) {
    const norm = val / 100;
    sawBlade.position.y = 0.88 + norm * 0.12;
    document.getElementById('val-blade-h').textContent = (norm * 2.5).toFixed(2) + '"';
    playTone(380 + val * 2, 0.02);
  };

  window.setBladeTilt = function(deg) {
    sawBlade.rotation.x = (deg * Math.PI) / 180;
    document.getElementById('val-blade-tilt').innerHTML = deg + '&deg;';
    playTone(320 + deg * 4, 0.02);
  };

  window.setFencePos = function(val) {
    const norm = val / 100;
    fenceGroup.position.x = 0.12 + norm * 0.65;
    document.getElementById('val-fence-pos').textContent = (norm * 18).toFixed(1) + '"';
    playTone(280 + val * 3, 0.02);
  };

  window.setViseJaw = function(val) {
    const norm = val / 100;
    viseGroup.position.z = (1.0 - norm) * 0.12;
    document.getElementById('val-vise').textContent = norm > 0.8 ? 'Clamped' : (norm * 6).toFixed(1) + '"';
    playTone(260 + val * 2, 0.02);
  };

  window.pushHandPlane = function() {
    playTone(520, 0.35);
    const origZ = planeGroup.position.z;
    let start = Date.now();
    function step() {
      const el = (Date.now() - start) / 1000;
      if (el < 0.8) {
        planeGroup.position.z -= 0.015;
        requestAnimationFrame(step);
      } else {
        planeGroup.position.z = origZ;
      }
    }
    step();
  };

  window.setRouterBitHeight = function(val) {
    const norm = val / 150;
    rtBit.position.y = 0.91 + norm * 0.06;
    document.getElementById('val-rt-height').textContent = (val / 100).toFixed(3) + '"';
    playTone(600 + val * 2, 0.02);
  };

  window.animateRouterPass = function() {
    playTone(720, 0.85);
    const mBoard = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.04, 0.14), matPine);
    mBoard.position.set(0.8, 0.92, -0.05);
    routerGroup.add(mBoard);

    let start = Date.now();
    function route() {
      const el = (Date.now() - start) / 1000;
      if (el < 1.1) {
        mBoard.position.x = 0.8 - el * 1.5;
        rtBit.rotation.y += 0.5;
        requestAnimationFrame(route);
      } else {
        routerGroup.remove(mBoard);
      }
    }
    route();
  };

  window.toggleLathePower = function() {
    isLatheRunning = !isLatheRunning;
    const btn = document.getElementById('btn-lathe-power');
    if (btn) {
      btn.innerHTML = `<i class="fa-solid fa-bolt"></i> ${isLatheRunning ? 'Stop Spindle' : 'Start Lathe Spindle'}`;
      btn.className = `action-btn ${isLatheRunning ? 'secondary' : ''}`;
    }
    playTone(isLatheRunning ? 200 : 140, 0.4);
  };

  window.setLatheRPM = function(val) {
    document.getElementById('val-lathe-rpm').textContent = val + ' RPM';
    playTone(250 + val / 10, 0.02);
  };

  window.animateLatheCut = function() {
    if (!isLatheRunning) toggleLathePower();
    playTone(340, 0.8);
  };

  window.setClampForce = function(val) {
    document.getElementById('val-clamp-psi').textContent = val + ' LBS';
    playTone(280 + val / 5, 0.02);
  };

  window.animateClampSquare = function() {
    playTone(480, 0.6);
  };

  window.setDowndraftCFM = function(val) {
    document.getElementById('val-cfm').textContent = val + ' CFM';
    playTone(200 + val / 5, 0.02);
  };

  window.animateCardScraping = function() {
    playTone(640, 0.4);
  };

  // -------------------------------------------------------------
  // CAMERA TRANSITIONS & AUDIO SYNTHESIZER
  // -------------------------------------------------------------
  let isTransitioning = false;
  let camStart = new THREE.Vector3(), camEnd = new THREE.Vector3();
  let targetStart = new THREE.Vector3(), targetEnd = new THREE.Vector3();
  let transitionProgress = 0;

  function flyCameraTo(newCam, newTarget) {
    camStart.copy(camera.position);
    camEnd.set(newCam[0], newCam, newCam);
    targetStart.copy(controls.target);
    targetEnd.set(newTarget[0], newTarget, newTarget);
    transitionProgress = 0;
    isTransitioning = true;
  }

  window.focusStation = function(view) {
    if (view === 'overview') {
      closePanel();
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      flyCameraTo([0, 15, 24], [0, 1.4, 0]);
      playTone(360, 0.08);
    }
  };

  let isAudioOn = true;
  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }

  function playTone(freq, dur) {
    if (!isAudioOn) return;
    try {
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(freq * 0.5, audioCtx.currentTime + dur);
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur);
    } catch(e) {}
  }

  window.toggleAudio = function() {
    isAudioOn = !isAudioOn;
    const btn = document.getElementById('btn-sound');
    btn.innerHTML = `<i class="fa-solid ${isAudioOn ? 'fa-volume-high' : 'fa-volume-xmark'}"></i> Sound ${isAudioOn ? 'ON' : 'OFF'}`;
    btn.classList.toggle('active', isAudioOn);
  };

  // -------------------------------------------------------------
  // ANIMATION & REAL-TIME FREE-FLY LOOP
  // -------------------------------------------------------------
  let lastTime = 0;
  function animate(time) {
    requestAnimationFrame(animate);
    const delta = (time - lastTime) / 1000;
    lastTime = time;

    // Free-Flowing WASD Navigation Vector Processing
    if (!isTransitioning) {
      const moveSpeed = 14 * delta;
      const forward = new THREE.Vector3();
      camera.getWorldDirection(forward);
      forward.y = 0;
      forward.normalize();

      const side = new THREE.Vector3();
      side.crossVectors(camera.up, forward).normalize();

      if (keyState.w) {
        camera.position.addScaledVector(forward, moveSpeed);
        controls.target.addScaledVector(forward, moveSpeed);
      }
      if (keyState.s) {
        camera.position.addScaledVector(forward, -moveSpeed);
        controls.target.addScaledVector(forward, -moveSpeed);
      }
      if (keyState.a) {
        camera.position.addScaledVector(side, moveSpeed);
        controls.target.addScaledVector(side, moveSpeed);
      }
      if (keyState.d) {
        camera.position.addScaledVector(side, -moveSpeed);
        controls.target.addScaledVector(side, -moveSpeed);
      }
      if (keyState.e) {
        camera.position.y += moveSpeed * 0.8;
        controls.target.y += moveSpeed * 0.8;
      }
      if (keyState.q) {
        camera.position.y = Math.max(0.4, camera.position.y - moveSpeed * 0.8);
        controls.target.y = Math.max(0.2, controls.target.y - moveSpeed * 0.8);
      }
    }

    // Spin Table Saw Blade
    if (isSawRunning && sawBlade) {
      sawBlade.rotation.x += delta * 45;
    }

    // Spin Lathe Bowl Blank
    if (isLatheRunning && latheSpindleGroup) {
      latheSpindleGroup.rotation.x += delta * 35;
    }

    // Oscillate & Spin Corner Pedestal Fan
    if (fanBladesGroup) {
      fanBladesGroup.rotation.z += delta * 30;
      fanCage.rotation.y = Math.sin(time * 0.001) * 0.5;
      fanBladesGroup.rotation.y = Math.sin(time * 0.001) * 0.5;
    }

    // Smooth Camera Transition when inspecting stations
    if (isTransitioning) {
      transitionProgress += delta / 0.8;
      if (transitionProgress >= 1.0) {
        transitionProgress = 1.0;
        isTransitioning = false;
      }
      const t = transitionProgress < 0.5 ? 2 * transitionProgress * transitionProgress : -1 + (4 - 2 * transitionProgress) * transitionProgress;
      camera.position.lerpVectors(camStart, camEnd, t);
      controls.target.lerpVectors(targetStart, targetEnd, t);
    }

    controls.update();
    renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  animate(0);
});
</script>
</body>
