<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Woodshop Simulation</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #111418; color: #fff; font-family: sans-serif; overflow: hidden; width: 100vw; height: 100vh; }
  #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
  #ui-overlay { position: absolute; top: 16px; left: 16px; z-index: 10; pointer-events: none; }
  .title-card { background: rgba(20,24,30,0.9); padding: 12px 18px; border-radius: 8px; border: 1px solid #d4a373; pointer-events: auto; }
  .title-card h1 { font-size: 1.1rem; color: #d4a373; margin-bottom: 4px; }
  .title-card p { font-size: 0.8rem; color: #aaa; }
  #controls-card { position: absolute; top: 16px; right: 16px; z-index: 10; background: rgba(20,24,30,0.92); border: 1px solid #d4a373; border-radius: 8px; padding: 14px; width: 280px; }
  #controls-card h2 { font-size: 0.95rem; color: #f4a261; margin-bottom: 10px; }
  .control-row { margin-bottom: 10px; display: flex; flex-direction: column; gap: 4px; }
  .control-row label { font-size: 0.75rem; color: #ccc; display: flex; justify-content: space-between; }
  .control-row input[type="range"] { width: 100%; accent-color: #d4a373; cursor: pointer; }
  .btn { width: 100%; background: #d4a373; color: #111; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.8rem; margin-top: 6px; }
  .btn:hover { background: #e76f51; color: #fff; }
  .btn.active { background: #2a9d8f; color: #fff; }
  #hint { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 6px 14px; border-radius: 20px; font-size: 0.75rem; color: #aaa; z-index: 10; }
</style>
<!-- Three.js and OrbitControls via CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<div id="canvas-container"></div>

<div id="ui-overlay">
  <div class="title-card">
    <h1>3D Virtual Woodshop</h1>
    <p>Cabinet Table Saw & Roubo Workbench</p>
  </div>
</div>

<div id="controls-card">
  <h2>Machine Controls</h2>
  
  <div class="control-row">
    <button class="btn" id="btn-motor" onclick="toggleSawMotor()">Start Table Saw Motor</button>
  </div>
  
  <div class="control-row">
    <label><span>Blade Height</span><span id="txt-blade-h">1.2 in</span></label>
    <input type="range" min="0" max="100" value="50" oninput="updateBladeHeight(this.value)">
  </div>
  
  <div class="control-row">
    <label><span>Blade Tilt Angle</span><span id="txt-blade-tilt">0.0&deg;</span></label>
    <input type="range" min="0" max="45" value="0" oninput="updateBladeTilt(this.value)">
  </div>

  <div class="control-row">
    <label><span>Rip Fence Position</span><span id="txt-fence-pos">6.0 in</span></label>
    <input type="range" min="0" max="100" value="35" oninput="updateFencePosition(this.value)">
  </div>

  <hr style="border:0; border-top:1px solid #333; margin:10px 0;">

  <div class="control-row">
    <label><span>Roubo Leg Vise</span><span id="txt-vise">Clamped</span></label>
    <input type="range" min="0" max="100" value="75" oninput="updateLegVise(this.value)">
  </div>

  <div class="control-row">
    <button class="btn" onclick="pushHandPlane()">Take Hand Plane Shaving</button>
  </div>
</div>

<div id="hint">Click & Drag to Rotate Camera | Right-Click to Pan | Scroll to Zoom</div>

<script>
window.addEventListener('DOMContentLoaded', () => {
  // 1. Scene, Camera, Renderer
  const container = document.getElementById('canvas-container');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x14181f);
  scene.fog = new THREE.FogExp2(0x14181f, 0.03);

  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 7, 11);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio || 1);
  renderer.shadowMap.enabled = true;
  container.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.maxPolarAngle = Math.PI / 2 - 0.01;
  controls.target.set(0, 1.0, 0);

  // 2. Lighting
  const ambient = new THREE.AmbientLight(0xffeedd, 0.6);
  scene.add(ambient);

  const sun = new THREE.DirectionalLight(0xffffff, 0.85);
  sun.position.set(8, 15, 6);
  sun.castShadow = true;
  scene.add(sun);

  // Point lights over saw and bench
  const p1 = new THREE.PointLight(0xffaa55, 0.8, 8);
  p1.position.set(-2.8, 3.8, 0);
  scene.add(p1);

  const p2 = new THREE.PointLight(0xffaa55, 0.8, 8);
  p2.position.set(2.8, 3.8, 0);
  scene.add(p2);

  // 3. Procedural Canvas Textures
  function getWoodTex(c1, c2) {
    const cv = document.createElement('canvas');
    cv.width = 256; cv.height = 256;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = c1; ctx.fillRect(0,0,256,256);
    ctx.fillStyle = c2;
    for (let y = 0; y < 256; y += 3) {
      ctx.globalAlpha = (Math.sin(y / 8) + 1) * 0.12;
      ctx.fillRect(0, y, 256, 3);
    }
    const t = new THREE.CanvasTexture(cv);
    t.wrapS = THREE.RepeatWrapping; t.wrapT = THREE.RepeatWrapping;
    return t;
  }

  const mapleTex = getWoodTex('#cfb285', '#9e7a4f');
  const walnutTex = getWoodTex('#543d2b', '#302014');
  const pineTex = getWoodTex('#ddb87a', '#a67d3d');

  const matMaple = new THREE.MeshStandardMaterial({ map: mapleTex, roughness: 0.6 });
  const matWalnut = new THREE.MeshStandardMaterial({ map: walnutTex, roughness: 0.7 });
  const matPine = new THREE.MeshStandardMaterial({ map: pineTex, roughness: 0.75 });
  const matIron = new THREE.MeshStandardMaterial({ color: 0x22252a, roughness: 0.4, metalness: 0.7 });
  const matSteel = new THREE.MeshStandardMaterial({ color: 0x999ea6, roughness: 0.25, metalness: 0.9 });
  const matCabinetBlue = new THREE.MeshStandardMaterial({ color: 0x1e3d59, roughness: 0.6 });
  const matGoldBlade = new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.95, roughness: 0.15 });
  const matRed = new THREE.MeshStandardMaterial({ color: 0xcc2929, roughness: 0.3 });

  // 4. Room Environment
  // Floor
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(22, 16), new THREE.MeshStandardMaterial({ color: 0x252930, roughness: 0.4 }));
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);

  const grid = new THREE.GridHelper(20, 20, 0xd4a373, 0x383e47);
  grid.position.y = 0.002;
  scene.add(grid);

  // Walls
  const wallMat = new THREE.MeshStandardMaterial({ color: 0x1e2126, roughness: 0.9 });
  const backWall = new THREE.Mesh(new THREE.BoxGeometry(22, 6, 0.2), wallMat);
  backWall.position.set(0, 3, -8);
  scene.add(backWall);

  const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.2, 6, 16), wallMat);
  leftWall.position.set(-11, 3, 0);
  scene.add(leftWall);

  const rightWall = new THREE.Mesh(new THREE.BoxGeometry(0.2, 6, 16), wallMat);
  rightWall.position.set(11, 3, 0);
  scene.add(rightWall);

  // Wooden Tool Cleat Board
  const cleat = new THREE.Mesh(new THREE.BoxGeometry(18, 2, 0.05), matPine);
  cleat.position.set(0, 2.4, -7.85);
  scene.add(cleat);

  // Ceiling Trusses
  for (let z = -6; z <= 6; z += 4) {
    const truss = new THREE.Mesh(new THREE.BoxGeometry(22, 0.2, 0.2), matPine);
    truss.position.set(0, 5.8, z);
    scene.add(truss);
  }

  // Spiral Dust Collection Pipe
  const duct = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 20, 16), matSteel);
  duct.rotation.z = Math.PI / 2;
  duct.position.set(0, 5.0, -3.0);
  scene.add(duct);

  const drop1 = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 2.8, 12), matSteel);
  drop1.position.set(-2.8, 3.6, -3.0);
  scene.add(drop1);

  const drop2 = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 2.8, 12), matSteel);
  drop2.position.set(2.8, 3.6, -3.0);
  scene.add(drop2);

  // 5. Piece 1: 10" Cabinet Table Saw
  const sawGroup = new THREE.Group();
  sawGroup.position.set(-2.8, 0, 0);

  const sawCabinet = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.8, 0.9), matCabinetBlue);
  sawCabinet.position.set(0, 0.4, 0);
  sawCabinet.castShadow = true;
  sawGroup.add(sawCabinet);

  const sawTop = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.08, 1.0), matIron);
  sawTop.position.set(0, 0.84, 0);
  sawGroup.add(sawTop);

  const throatPlate = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.005, 0.38), matRed);
  throatPlate.position.set(0, 0.883, 0);
  sawGroup.add(throatPlate);

  // Saw Blade
  const bladeGeo = new THREE.CylinderGeometry(0.14, 0.14, 0.006, 32);
  const sawBlade = new THREE.Mesh(bladeGeo, matGoldBlade);
  sawBlade.rotation.z = Math.PI / 2;
  sawBlade.position.set(0, 0.94, 0);
  sawGroup.add(sawBlade);

  // Rip Fence Rail
  const fenceRail = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.06, 0.06), matSteel);
  fenceRail.position.set(0.25, 0.84, 0.53);
  sawGroup.add(fenceRail);

  // Rip Fence
  const fenceGroup = new THREE.Group();
  const fenceBody = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.09, 1.05), matSteel);
  const fenceLock = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.1, 12), matRed);
  fenceLock.rotation.x = Math.PI / 2;
  fenceLock.position.set(0, 0.05, 0.54);
  fenceGroup.add(fenceBody);
  fenceGroup.add(fenceLock);
  fenceGroup.position.set(0.35, 0.89, 0);
  sawGroup.add(fenceGroup);

  // Outfeed Table
  const outfeed = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.08, 1.4), matMaple);
  outfeed.position.set(0.1, 0.84, -1.2);
  sawGroup.add(outfeed);

  // Outfeed Legs
  const leg1 = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.8, 0.08), matSteel);
  leg1.position.set(-0.6, 0.4, -1.7);
  sawGroup.add(leg1);
  const leg2 = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.8, 0.08), matSteel);
  leg2.position.set(0.8, 0.4, -1.7);
  sawGroup.add(leg2);

  scene.add(sawGroup);

  // 6. Piece 2: French Roubo Workbench
  const benchGroup = new THREE.Group();
  benchGroup.position.set(2.8, 0, 0);

  const benchTop = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.16, 0.85), matMaple);
  benchTop.position.set(0, 0.85, 0);
  benchTop.castShadow = true;
  benchGroup.add(benchTop);

  // 4 Legs
  const bLegPositions = [[-0.9, -0.28], [0.9, -0.28], [-0.9, 0.28], [0.9, 0.28]];
  bLegPositions.forEach(p => {
    const bLeg = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.77, 0.13), matMaple);
    bLeg.position.set(p[0], 0.385, p);
    benchGroup.add(bLeg);
  });

  const bShelf = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.04, 0.6), matWalnut);
  bShelf.position.set(0, 0.2, 0);
  benchGroup.add(bShelf);

  // Leg Vise
  const viseGroup = new THREE.Group();
  const viseChop = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.72, 0.09), matWalnut);
  viseChop.position.set(-0.9, 0.44, 0.44);
  const viseHub = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.12, 16), matWalnut);
  viseHub.rotation.x = Math.PI / 2;
  viseHub.position.set(-0.9, 0.45, 0.52);
  const visePin = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.32, 12), matMaple);
  visePin.position.set(-0.9, 0.45, 0.58);
  viseGroup.add(viseChop);
  viseGroup.add(viseHub);
  viseGroup.add(visePin);
  benchGroup.add(viseGroup);

  // Clamped Board
  const clampedTimber = new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.32, 1.1), matWalnut);
  clampedTimber.position.set(-0.9, 0.94, 0.2);
  benchGroup.add(clampedTimber);

  // No. 4 Smoothing Hand Plane
  const planeGroup = new THREE.Group();
  const pBody = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.06, 0.08), matIron);
  const pTote = new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.09, 0.025), matWalnut);
  pTote.position.set(-0.08, 0.06, 0);
  const pKnob = new THREE.Mesh(new THREE.SphereGeometry(0.022, 12, 12), matWalnut);
  pKnob.position.set(0.08, 0.05, 0);
  const pIron = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.12, 0.006), matSteel);
  pIron.rotation.z = 0.5;
  pIron.position.set(-0.02, 0.07, 0);
  planeGroup.add(pBody); planeGroup.add(pTote); planeGroup.add(pKnob); planeGroup.add(pIron);
  planeGroup.position.set(0.1, 0.96, 0.1);
  benchGroup.add(planeGroup);

  // 12" Combination Square on bench
  const sqRule = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.008, 0.03), matSteel);
  const sqHead = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.016, 0.1), matIron);
  sqHead.position.set(-0.07, 0.008, 0.035);
  const squareGroup = new THREE.Group();
  squareGroup.add(sqRule); squareGroup.add(sqHead);
  squareGroup.position.set(0.6, 0.94, -0.15);
  squareGroup.rotation.y = -0.3;
  benchGroup.add(squareGroup);

  scene.add(benchGroup);

  // 7. Interactive State Variables & Window Handlers
  let isMotorOn = false;

  window.toggleSawMotor = function() {
    isMotorOn = !isMotorOn;
    const btn = document.getElementById('btn-motor');
    if (isMotorOn) {
      btn.textContent = 'Stop Motor (Active)';
      btn.classList.add('active');
    } else {
      btn.textContent = 'Start Table Saw Motor';
      btn.classList.remove('active');
    }
  };

  window.updateBladeHeight = function(val) {
    const norm = val / 100;
    sawBlade.position.y = 0.88 + norm * 0.12;
    document.getElementById('txt-blade-h').textContent = (norm * 2.5).toFixed(2) + ' in';
  };

  window.updateBladeTilt = function(deg) {
    sawBlade.rotation.x = (deg * Math.PI) / 180;
    document.getElementById('txt-blade-tilt').innerHTML = deg + '&deg;';
  };

  window.updateFencePosition = function(val) {
    const norm = val / 100;
    fenceGroup.position.x = 0.12 + norm * 0.65;
    document.getElementById('txt-fence-pos').textContent = (norm * 18).toFixed(1) + ' in';
  };

  window.updateLegVise = function(val) {
    const norm = val / 100;
    viseGroup.position.z = (1.0 - norm) * 0.12;
    document.getElementById('txt-vise').textContent = norm > 0.8 ? 'Clamped' : (norm * 6).toFixed(1) + ' in';
  };

  window.pushHandPlane = function() {
    const origZ = planeGroup.position.z;
    let start = Date.now();
    function step() {
      const el = (Date.now() - start) / 1000;
      if (el < 0.8) {
        planeGroup.position.z -= 0.015;
        requestAnimationFrame(step);
      } else {
        planeGroup.position.z = origZ;
      }
    }
    step();
  };

  // 8. Animation Loop
  let lastTime = 0;
  function animate(time) {
    requestAnimationFrame(animate);
    const delta = (time - lastTime) / 1000;
    lastTime = time;

    if (isMotorOn && sawBlade) {
      sawBlade.rotation.x += delta * 40;
    }

    controls.update();
    renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  animate(0);
});
</script>
</body>
</html>
