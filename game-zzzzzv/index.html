<!doctype html>
<html lang="en">
<head>

<title>Chinese Character Study · 2501–2600</title>
<style>
:root{--ink:#142028;--muted:#5c6870;--paper:#eef2f4;--panel:#f2f5f7;--line:#b4c0c8;--deep:#1c2830;--good:#2a5c3c;--bad:#8a2f27;--gold:#c9a050}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(1200px 700px at 12% -10%,rgba(80,150,180,.32),transparent 52%),linear-gradient(180deg,#2a4454 0%,#c0d0d8 42%,#1c3440 100%);color:var(--ink);font-family:Georgia,"Times New Roman","Noto Serif SC","Songti SC",serif;overflow:hidden}
.app{height:100vh;display:grid;grid-template-rows:auto 1fr;gap:0}
.topbar{min-height:58px;display:flex;align-items:center;gap:14px;padding:8px 18px;background:rgba(16,32,40,.96);color:#e4eef2;border-bottom:2px solid #c9a050}
.brand{font-size:18px;font-weight:700;letter-spacing:.05em;white-space:nowrap}.brand small{font-size:12px;font-weight:400;opacity:.7;margin-left:8px}
.progress{flex:1;max-width:460px;height:7px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:#c9a050;width:1%;transition:width .25s ease}
.stat{font-size:13px;opacity:.88;white-space:nowrap}.topbtn{border:1px solid rgba(255,255,255,.28);background:transparent;color:white;border-radius:8px;padding:7px 10px;cursor:pointer}
.main{min-height:0;display:grid;grid-template-columns:minmax(390px,46%) 1fr;gap:18px;padding:18px}
.quiz{min-height:0;background:rgba(242,245,247,.97);border:2px solid #3a5460;box-shadow:inset 0 0 0 6px #dce6ea,0 16px 48px rgba(16,32,40,.26);border-radius:4px;padding:18px 22px 16px;display:flex;flex-direction:column;overflow:auto}
.rankline{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.09em}
.character{text-align:center;font-family:"Noto Serif SC","Songti SC","STSong",serif;font-size:clamp(92px,11vw,164px);line-height:.95;margin:8px 0 0;color:#142028;text-shadow:0 1px 0 #fff}
.pinyin{text-align:center;font-size:clamp(24px,2.6vw,39px);font-style:italic;color:#3a5460;margin:0 0 8px}
.front-pinyin{display:none}.prompt{text-align:center;font-size:16px;margin:2px 0 8px;color:#5c6870}
button{font:600 13px/1.1 Georgia,serif;letter-spacing:.03em}
.controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:3px 0 7px}.controls .nav{display:flex;gap:6px;margin-right:6px}.ghost,.action{padding:9px 12px;border-radius:8px;cursor:pointer}.ghost{border:1px solid #8aa8ac;background:#e4eef2;color:#243440}.action{border:1px solid #3a5460;background:#3a5460;color:#fff}
.reveal{border-top:1px solid #c5d4d2;padding-top:9px;margin-top:2px;animation:fade .18s ease}.reveal-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:5px}.reveal-pinyin{font-size:clamp(27px,2.8vw,42px);font-style:italic;color:#3a5460;font-weight:700}.definition{font-size:20px;margin:0}.definition b{color:#2a4a4c}.wordtitle,.extitle{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:#5c6870;margin:9px 0 4px;font-weight:700}.wordlist{display:flex;gap:6px;flex-wrap:wrap}.wordchip{background:#e4eeec;border:1px solid #c3d4d0;border-radius:7px;padding:5px 8px;line-height:1.18}.wordchip .wzh{font-family:"Noto Serif SC","Songti SC",serif;font-size:19px;font-weight:700}.wordchip .wpy{font-size:13px;font-style:italic;color:#4a6470}.wordchip .wen{font-size:12px;color:#4f5e5c}.examples{display:grid;gap:5px}.example{padding:6px 9px;background:#eef2f4;border-left:3px solid #3a5460;border-radius:5px;line-height:1.22}.example-zh{font-family:"Noto Serif SC","Songti SC",serif;font-size:clamp(19px,1.65vw,25px)}.example-py{font-size:clamp(14px,1.1vw,17px);font-style:italic;color:#4a6470;margin-top:2px}.example-en{font-size:clamp(13px,1vw,16px);color:#4f463f;margin-top:2px}.example em{font-style:normal;font-weight:800;color:#8d2f21;background:#d7e4de;border-radius:3px;padding:0 .05em}
.flipcard{margin-top:3px;border:1px solid #9ab0b0;border-radius:4px;padding:12px 14px;background:#eef2f4}.flipcard h3{margin:0 0 7px;font-size:15px;color:#4a6470;text-transform:uppercase;letter-spacing:.08em}.english-list{font-size:clamp(22px,2vw,32px);line-height:1.2;margin:4px 0 10px}.flipcard .reveal-pinyin{margin:0 0 6px}.further{border:1px solid #3a5460;background:transparent;color:#3a5460;border-radius:8px;padding:8px 11px;cursor:pointer}
.imagepane{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;background:rgba(12,22,28,.94);border:2px solid #1c2830;border-radius:4px;overflow:hidden;box-shadow:inset 0 0 0 7px rgba(196,163,106,.22),0 16px 48px rgba(16,32,40,.3)}
.imagepane:before{content:"";position:absolute;inset:8px;border:1px solid rgba(196,163,106,.5);border-radius:3px;pointer-events:none}.art{display:block;max-width:94%;max-height:90%;width:auto;height:auto;object-fit:contain;filter:saturate(.98) contrast(1.02);box-shadow:0 8px 32px rgba(0,0,0,.28);transition:opacity .35s ease,transform .35s ease}.art.wide{max-width:98%;max-height:84%}

@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@media(max-width:900px){body{overflow:auto}.app{height:auto;min-height:100vh}.main{grid-template-columns:1fr;grid-template-rows:auto minmax(360px,55vh)}.quiz{overflow:visible}.imagepane{min-height:420px}.topbar{flex-wrap:wrap}.progress{order:3;flex-basis:100%;max-width:none}}
@media(max-width:520px){.main{padding:9px;gap:9px}.quiz{padding:14px}.brand small{display:none}.character{font-size:104px}.example{font-size:20px}.topbar{padding:8px 10px}.stat.scoreStat{display:none}}
</style>
</head>

</div>

gs":["chrysanthemum"],"words":[{"zh":"菊花","pinyin":"jú huā","en":"chrysanthemum"},{"zh":"菊展","pinyin":"jú zhǎn","en":"chrysanthemum show"},{"zh":"赏菊","pinyin":"shǎng jú","en":"enjoy chrysanthemums"}],"examples":[{"zh":"院子里开满了黄菊花。","pinyin":"yuàn zi lǐ kāi mǎn le huáng jú huā.","en":"The courtyard is full of yellow chrysanthemums."},{"zh":"秋天大家爱去公园赏菊。","pinyin":"qiū tiān dà jiā ài qù gōng yuán shǎng jú.","en":"In autumn everyone likes to go to the park to enjoy chrysanthemums."}]},{"rank":2510,"char":"鄙","pinyin":"bǐ","meanings":["rustic","despise","humble, of oneself"],"words":[{"zh":"卑鄙","pinyin":"bēi bǐ","en":"base"},{"zh":"鄙视","pinyin":"bǐ shì","en":"despise"},{"zh":"鄙人","pinyin":"bǐ rén","en":"this humble person"}],"examples":[{"zh":"这种做法十分卑鄙。","pinyin":"zhè zhǒng zuò fǎ shí fēn bēi bǐ.","en":"This kind of practice is quite base."},{"zh":"他从不鄙视体力劳动。","pinyin":"tā cóng bù bǐ shì tǐ lì láo dòng.","en":"He never despises physical labor."}]},{"rank":2511,"char":"魄","pinyin":"pò","meanings":["spirit","soul"],"words":[{"zh":"气魄","pinyin":"qì pò","en":"boldness of vision"},{"zh":"魄力","pinyin":"pò lì","en":"daring"},{"zh":"惊心动魄","pinyin":"jīng xīn dòng pò","en":"soul-stirring"}],"examples":[{"zh":"这项工程很有气魄。","pinyin":"zhè xiàng gōng chéng hěn yǒu qì pò.","en":"This project has great boldness of vision."},{"zh":"影片里有几个惊心动魄的场面。","pinyin":"yǐng piàn lǐ yǒu jǐ gè jīng xīn dòng pò de chǎng miàn.","en":"The film has several soul-stirring scenes."}]},{"rank":2512,"char":"兜","pinyin":"dōu","meanings":["pocket","wrap up"],"words":[{"zh":"衣兜","pinyin":"yī dōu","en":"pocket"},{"zh":"兜售","pinyin":"dōu shòu","en":"peddle"},{"zh":"兜风","pinyin":"dōu fēng","en":"go for a drive"}],"examples":[{"zh":"他把钥匙放进衣兜里。","pinyin":"tā bǎ yào shi fàng jìn yī dōu lǐ.","en":"He put the keys in his pocket."},{"zh":"周末开车去郊外兜风。","pinyin":"zhōu mò kāi chē qù jiāo wài dōu fēng.","en":"On the weekend they drove to the outskirts for a spin."}]},{"rank":2513,"char":"哄","pinyin":"hǒng","meanings":["coax","dec const IMAGES = ["img/01-cosmos-lake.jpg", "img/02-riverside-town.jpg", "img/03-wudi-paifang.jpg", "img/04-chenzhou-road.jpg", "img/05-river-city.jpg", "img/06-bend-aerial.jpg", "img/07-tianyue-gate.jpg", "img/08-lake-peninsula.jpg", "img/09-yueyang-tower.jpg", "img/10-night-market.jpg", "img/11-fengming-gate.jpg", "img/12-lotus-canal.jpg"];
let order = BANK.map((_,i)=>i), pos=0, state='front';
const $=id=>document.getElementById(id);
function norm(s){return (s||'').toLowerCase().replace(/[’'.,!?()\-_/]+/g,' ').replace(/\s+/g,' ').trim()}
function current(){return BANK[order[pos]]}
function safe(t){return String(t).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function mark(sentence,ch){return safe(sentence).split(safe(ch)).join('<em>'+safe(ch)+'</em>')}
function imageForPosition(){const n=IMAGES.length||1;return Math.floor(pos*n/BANK.length)%n}
function setImage(){const idx=imageForPosition(), img=$('art');img.style.opacity=.15;setTimeout(()=>{img.src=IMAGES[idx]; img.onload=()=>{img.classList.toggle('wide',img.naturalWidth/img.naturalHeight>1.75);img.style.opacity=1}},90)}
function renderDetail(mode){const c=current(), d=$('detailArea'); if(mode==='front'){d.innerHTML='';return}
 if(mode==='flip'){d.innerHTML=`<div class="flipcard"><h3>Pinyin + English</h3><div class="reveal-pinyin">${safe(c.pinyin)}</div><div class="english-list">${c.meanings.map(safe).join(' · ')}</div><button class="further" id="furtherBtn">Reveal further</button></div>`;$('furtherBtn').onclick=()=>{state='revealed';renderDetail('revealed')};return}
 const words=c.words.map(w=>`<div class="wordchip"><div class="wzh">${mark(w.zh,c.char)}</div><div class="wpy">${safe(w.pinyin)}</div><div class="wen">${safe(w.en)}</div></div>`).join('');
 const ex=c.examples.map(x=>`<div class="example"><div class="example-zh">${mark(x.zh,c.char)}</div><div class="example-py">${safe(x.pinyin)}</div><div class="example-en">${safe(x.en)}</div></div>`).join('');
 d.innerHTML=`<div class="reveal"><div class="reveal-head"><div class="reveal-pinyin">${safe(c.pinyin)}</div><p class="definition"><b>${safe(c.char)}</b> — ${c.meanings.map(safe).join('; ')}</p></div><div class="wordtitle">Common words &amp; phrases</div><div class="wordlist">${words}</div><div class="extitle">Example sentences</div><div class="examples">${ex}</div></div>`}
function render(changeImage=true){const c=current();$('char').textContent=c.char;$('pinyin').textContent='';$('rankLabel').textContent=`Frequency rank #${c.rank}`;$('cardStat').textContent=`${pos+1} / ${BANK.length}`;$('progressFill').style.width=((pos+1)/BANK.length*100)+'%';state='front';renderDetail('front');if(changeImage)setImage()}
function move(delta){const oldImg=imageForPosition();pos=Math.max(0,Math.min(BANK.length-1,pos+delta));render(imageForPosition()!==oldImg)}
$('prevBtn').onclick=()=>move(-1);$('nextBtn').onclick=()=>move(1);
$('revealBtn').onclick=()=>{state='revealed';renderDetail('revealed')};$('flipBtn').onclick=()=>{state='flip';renderDetail('flip')};
$('shuffleBtn').onclick=()=>{for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}pos=0;render(true)};
