<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chinese Character Flashcards</title>
<style>
:root{
  --ui:14px;
  --ink:#211610;
  --muted:#69584b;
  --accent:#873d25;
  --paper:rgba(248,242,232,.94);
  --paper2:rgba(252,248,240,.97);
  --line:rgba(65,43,28,.18);
  --btn:rgba(255,255,255,.68);
  --btnInk:#211610;
  --shadow:0 18px 52px rgba(32,19,10,.22);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:Georgia,"Times New Roman",serif;
  font-size:var(--ui);
  color:var(--ink);
  background:#d8cdb9;
  overflow:hidden;
}
.bg{position:fixed;inset:0;background-color:#d8cdb9;background-repeat:no-repeat;background-position:center;background-size:cover;transition:opacity 1.6s ease,transform 14s ease;filter:saturate(.98) contrast(1.04);will-change:opacity,transform,background-position}.bg.scroll{background-size:auto 100%;animation:scrollPan 48s linear infinite alternate}.bg.strip{background-size:auto 64%;background-repeat:no-repeat;background-position:center;background-color:#cdbd9c}.bg.cover{background-size:cover;background-position:center}.bg.contain{background-size:contain;background-repeat:no-repeat;background-position:center;background-color:#cdbd9c}@keyframes scrollPan{0%{background-position:8% center}100%{background-position:92% center}}
#bgA{opacity:1;transform:scale(1.06)}
#bgB{opacity:0;transform:scale(1.02)}
.atmosphere{position:fixed;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(255,250,241,.08),rgba(0,0,0,.035)),radial-gradient(circle at 18% 12%,rgba(255,255,255,.14),transparent 28%),radial-gradient(circle at 82% 85%,rgba(54,31,15,.10),transparent 34%)}
.shell{position:relative;z-index:3;height:100%;display:flex;flex-direction:column;padding:14px;gap:12px}
.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:10px 13px;border-radius:16px;background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(10px)}
.title{font-size:1.04rem;font-weight:700;letter-spacing:.025em}.count{justify-self:center;color:var(--accent);font-size:.86rem;letter-spacing:.08em;text-transform:uppercase}.topnav{justify-self:end;display:flex;gap:7px}
button{font:inherit;color:var(--btnInk);background:var(--btn);border:1px solid var(--line);border-radius:11px;padding:8px 12px;cursor:pointer;transition:transform .12s ease,background .12s ease,opacity .12s ease}button:hover:not(:disabled){transform:translateY(-1px)}button:disabled{opacity:.35;cursor:default}.primary{background:color-mix(in srgb,var(--accent) 13%,white 87%);border-color:color-mix(in srgb,var(--accent) 34%,transparent)}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.study{width:min(1160px,100%);height:min(770px,calc(100vh - 92px));display:grid;grid-template-columns:1fr 0fr;gap:0;align-items:center;justify-items:center;transition:grid-template-columns .34s cubic-bezier(.22,.74,.22,1),gap .34s ease}
.study.revealed{grid-template-columns:minmax(360px,.86fr) minmax(440px,1.14fr);gap:18px}
.cardColumn{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0;transition:transform .34s cubic-bezier(.22,.74,.22,1)}
.study:not(.revealed) .cardColumn{grid-column:1 / -1}
.study.revealed .cardColumn{grid-column:1}
.cardTop,.cardBottom{width:min(470px,94%);display:flex;justify-content:center;min-height:38px;align-items:center}
.cardScene{width:min(470px,94%);height:min(570px,66vh);perspective:1200px}
.flashcard{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .1s cubic-bezier(.24,.86,.30,1)}
.flashcard.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:28px;background:var(--paper2);border:1px solid var(--line);box-shadow:0 24px 66px rgba(31,17,7,.24);backface-visibility:hidden;display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden}
.face.back{transform:rotateY(180deg)}
.character{font-size:clamp(8rem,17vw,13rem);line-height:.9;font-weight:500;color:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.22)}
.answerPanel{grid-column:2;width:100%;height:min(650px,72vh);border-radius:22px;background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(12px);padding:18px 20px;overflow:auto;opacity:0;transform:translateX(28px) scale(.985);pointer-events:none;transition:opacity .25s ease,transform .34s cubic-bezier(.22,.74,.22,1)}
.study.revealed .answerPanel{opacity:1;transform:none;pointer-events:auto}
.answerHeader{display:grid;grid-template-columns:auto 1fr;column-gap:16px;align-items:center;padding-bottom:13px;border-bottom:1px solid var(--line)}
.answerChar{font-size:4.7rem;line-height:1}.answerPinyin{font-size:1.45rem;color:var(--accent);margin-bottom:4px}.answerMeaning{font-size:1.28rem;line-height:1.3}.sectionLabel{margin-top:16px;color:var(--accent);font-size:.78rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase}.words{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.word{padding:8px 10px;border:1px solid var(--line);background:rgba(255,255,255,.48);border-radius:999px;font-size:.94rem}.further{display:none}.answerPanel.furtherShown .further{display:block}.examples{display:grid;gap:10px;margin-top:8px}.example{padding:11px 12px;border:1px solid var(--line);background:rgba(255,255,255,.43);border-radius:14px}.zh{font-size:1.08rem;line-height:1.4}.py{color:var(--accent);font-style:italic;margin-top:3px}.en{color:var(--muted);margin-top:4px;line-height:1.4}
.revealFurtherRow{display:flex;justify-content:flex-start;margin-top:16px}.micro{font-size:.79rem;color:var(--muted);margin-top:9px;line-height:1.35}
@media(max-width:980px){body{overflow:auto}.shell{height:auto;min-height:100%}.study,.study.revealed{height:auto;grid-template-columns:1fr;gap:14px}.study:not(.revealed) .cardColumn,.study.revealed .cardColumn{grid-column:1}.answerPanel{grid-column:1;height:auto;min-height:390px}.cardScene{height:520px}.topbar{grid-template-columns:1fr auto}.count{justify-self:end}.topnav{grid-column:1/-1;justify-self:stretch}.topnav button{flex:1}}
</style>
</head>
<body>
<div id="bgA" class="bg"></div><div id="bgB" class="bg"></div><div class="atmosphere"></div>
<div class="shell">
  <header class="topbar">
    <div class="title">Chinese Character Flashcards</div>
    <div id="count" class="count">Card 1 of 100</div>
    <div class="topnav"><button id="prevTop">Previous</button><button id="nextTop">Next</button></div>
  </header>
  <main class="stage">
    <section id="study" class="study">
      <div class="cardColumn">
        <div class="cardTop"><button id="reveal" class="primary">Reveal</button></div>
        <div class="cardScene">
          <div id="flashcard" class="flashcard">
            <div id="front" class="face front"></div>
            <div id="back" class="face back"></div>
          </div>
        </div>
        <div class="cardBottom"><button id="flip">Flip</button></div>
      </div>
      <aside id="answer" class="answerPanel"></aside>
    </section>
  </main>
</div>

, {"zh": "为了健康，他戒烟了。", "py": "Wèile jiànkāng, tā jiè yān le.", "en": "For health, he quit smoking."}]}, {"id": 6, "char": "在", "pinyin": "zài", "meaning": "At, in, located at", "words": ["**现在** xiànzài (now)", "**存在** cúnzài (exist)", "**正在** zhèngzài (currently)"], "examples": [{"zh": "他在家里。", "py": "Tā zài jiā lǐ.", "en": "He is at home."}, {"zh": "现在几点了？", "py": "Xiànzài jǐ diǎn le?", "en": "What time is it now?"}, {"zh": "我正在看书。", "py": "Wǒ zhèngzài kàn shū.", "en": "I am currently reading a book."}]}, {"id": 7, "char": "人", "pinyin": "rén", "meaning": "Person, people", "words": ["**别人** biérén (others)", "**个人** gèrén (individual)", "**人类** rénlèi (humanity)"], "examples": [{"zh": "那个人是谁？", "py": "Nà gè rén shì shuí?", "en": "Who is that person?"}, {"zh": "不要打扰别人。", "py": "Bùyào dǎrǎo biérén.", "en": "Do not disturb others."}, {"zh": "这是我个人的看法。", "py": "Zhè shì wǒ gèrén de kànfǎ.", "en": "This is my personal view."}]}, {"id": 8, "char": "有", "pinyin": "yǒu", "meaning": "To have, there is", "words": ["**没有** méiyǒu (not have)", "**所有** suǒyǒu (all)", "**只有** zhǐyǒu (only)"], "examples": [{"zh": "我有一个问题。", "py": "Wǒ yǒu yí gè wèntí.", "en": "I have a question."}, {"zh": "他今天没有来。", "py": "Tā jīntiān méiyǒu lái.", "en": "He did not come today."}, {"zh": "所有人都同意了。", "py": "Suǒyǒu rén dōu tóngyì le.", "en": "Everyone agreed."}]}, {"id": 9, "char": "我", "pinyin": "wǒ", "meaning": "I, me", "words": ["**我们** wǒmen (we)", "**自我** zìwǒ (self)", "**我的** wǒde (my)"], "examples": [{"zh": "我喜欢喝茶。", "py": "Wǒ xǐhuān hē chá.", "en": "I like to drink tea."}, {"zh": "我们的学校很大。", "py": "Wǒmen de xuéxiào hěn dà.", "en": "Our school is very big."}, {"zh": "他在做自我介绍。", "py": "Tā zài zuò zìwǒ jièshào.", "en": "He is introducing himself."}]}, {"id": 10, "char": "他", "pinyin": "tā", "meaning": "He, him", "words": ["**他们** tāmen (they)", "**其他** qítā (other)", "**他的** tāde (his)"], "examples": [{"zh": "他是我哥哥。", "py": "Tā shì wǒ gēge.", "en": "He is my older brother."}, {"zh": "他们去哪里了？", "  const b=document.getElementById('furtherBtn');
 if(S.further){b.style.display='none'}
 b.addEventListener('click',()=>{S.further=true;E.answer.classList.add('furtherShown');b.style.display='none'});
}
function revealSame(){if(!S.revealed){S.revealed=true;S.further=false;render()}}
function flipSame(){
 if(!S.revealed){S.revealed=true;S.further=false}
 S.flipped=!S.flipped;
 render();
}
function go(delta){const n=S.index+delta;if(n<0||n>=DATA.length)return;S.index=n;S.revealed=false;S.further=false;S.flipped=false;render();rotateBg()}
function applyTheme(kind){
 const r=document.documentElement;
 if(kind==='dark'){
  r.style.setProperty('--ink','#fbf4ea');r.style.setProperty('--muted','#ddcfbf');r.style.setProperty('--paper','rgba(24,19,15,.90)');r.style.setProperty('--paper2','rgba(29,23,18,.96)');r.style.setProperty('--line','rgba(255,255,255,.18)');r.style.setProperty('--btn','rgba(255,255,255,.14)');r.style.setProperty('--btnInk','#fbf4ea');r.style.setProperty('--shadow','0 18px 52px rgba(0,0,0,.40)');
 }else{
  r.style.setProperty('--ink','#211610');r.style.setProperty('--muted','#69584b');r.style.setProperty('--paper','rgba(248,242,232,.95)');r.style.setProperty('--paper2','rgba(252,248,240,.98)');r.style.setProperty('--line','rgba(65,43,28,.18)');r.style.setProperty('--btn','rgba(255,255,255,.72)');r.style.setProperty('--btnInk','#211610');r.style.setProperty('--shadow','0 18px 52px rgba(32,19,10,.23)');
 }
}
function setBackdropLayer(layer,b){
 layer.className=`bg ${b.mode||'cover'}`;
 layer.style.backgroundImage=`url("${backdropUrl(b)}")`;
 layer.style.backgroundColor=b.color||'#cdbb93';
 layer.style.backgroundPosition=b.mode==='scroll'?'8% center':'center';
 // Force animation restart for each newly assigned scroll.
 layer.style.animation='none'; void layer.offsetWidth; layer.style.animation='';
}
function preloadBackdrop(b){const img=new Image();img.decoding='async';img.src=backdropUrl(b)}
function setBg(){
 setBackdropLayer(E.bgA,BACKDROPS[0]);
 setBackdropLayer(E.bgB,BACKDROPS[1]);
 applyTheme(BACKDROPS[0].theme);
 preloadBackdrop(BACKDROPS[1]);
}
function rotateBg(){
 S.bg=(S.bg+1)%BACKDROPS.length;
 const b=BACKDROPS[S.bg];
 const next=BACKDROPS[(S.bg+1)%BACKDROPS.length];
 if(S.showA){
  setBackdropLayer(E.bgB,b);E.bgB.style.opacity=1;E.bgA.style.opacity=0;E.bgB.style.transform='scale(1.018)';E.bgA.style.transform='scale(1.006)';
 }else{
  setBackdropLayer(E.bgA,b);E.bgA.style.opacity=1;E.bgB.style.opacity=0;E.bgA.style.transform='scale(1.018)';E.bgB.style.transform='scale(1.006)';
 }
 S.showA=!S.showA;applyTheme(b.theme);preloadBackdrop(next);
}
E.reveal.addEventListener('click',revealSame);E.flip.addEventListener('click',flipSame);E.prevTop.addEventListener('click',()=>go(-1));E.nextTop.addEventListener('click',()=>go(1));document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(-1);if(e.key==='ArrowRight')go(1);if(e.key.toLowerCase()==='r')revealSame();if(e.key.toLowerCase()==='f')flipSame()});
setBg();render();S.auto=setInterval(rotateBg,18000);
</script>
</body></html>
