<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Chinese Word Study · 801–900</title>
<style>
:root{--ink:#16141c;--muted:#6a5e72;--paper:#f4eef2;--panel:#faf4f7;--line:#d4c4cc;--deep:#100e16;--good:#3a4a68;--bad:#8a3228;--gold:#c9a06a;--jade:#3a4a68;--cinnabar:#8a3c5c}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(1100px 640px at 12% -8%,rgba(138,60,92,.28),transparent 54%),linear-gradient(180deg,#100e16 0%,#d8c8d0 46%,#16141c 100%);color:var(--ink);font-family:Georgia,"Times New Roman","Noto Serif SC","Songti SC",serif;overflow:hidden}
.app{height:100vh;display:grid;grid-template-rows:auto 1fr;gap:0}
.topbar{min-height:58px;display:flex;align-items:center;gap:14px;padding:8px 18px;background:linear-gradient(90deg,#100e16,#3a4a68 42%,#8a3c5c 78%,#100e16);color:#f4eef2;border-bottom:3px solid #c9a06a;box-shadow:0 1px 0 #2a1420}
.brand{font-size:18px;font-weight:700;letter-spacing:.06em;white-space:nowrap}.brand small{font-size:12px;font-weight:400;opacity:.72;margin-left:8px}
.progress{flex:1;max-width:460px;height:7px;background:rgba(255,255,255,.14);border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:linear-gradient(90deg,#c9a06a,#8a3c5c);width:1%;transition:width .25s ease}
.stat{font-size:13px;opacity:.9;white-space:nowrap}.topbtn{border:1px solid rgba(201,160,106,.55);background:transparent;color:#f4eef2;border-radius:4px;padding:7px 10px;cursor:pointer}
.main{min-height:0;display:grid;grid-template-columns:minmax(400px,46%) 1fr;gap:18px;padding:18px}
.quiz{min-height:0;background:rgba(250,245,234,.98);border:3px solid #3a4a68;box-shadow:inset 0 0 0 7px #f3e8ee,inset 0 0 0 8px #c9a06a,0 18px 50px rgba(18,14,10,.32);border-radius:2px;padding:20px 24px 16px;display:flex;flex-direction:column;overflow:auto}
.rankline{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.12em}
.character{text-align:center;font-family:"Noto Serif SC","Songti SC","STSong",serif;font-size:clamp(78px,9.2vw,128px);line-height:.95;margin:10px 0 2px;color:#16141c;text-shadow:0 1px 0 #fff;letter-spacing:.04em}
.pinyin{text-align:center;font-size:clamp(22px,2.4vw,36px);font-style:italic;color:#8a3c5c;margin:0 0 8px}
.front-pinyin{display:none}.prompt{text-align:center;font-size:15px;margin:2px 0 10px;color:#6a5c72}
button{font:600 13px/1.1 Georgia,serif;letter-spacing:.03em}
.controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:3px 0 8px}.controls .nav{display:flex;gap:6px;margin-right:6px}
.ghost,.action{padding:9px 12px;border-radius:4px;cursor:pointer}.ghost{border:1px solid #3a4a68;background:#f4eef2;color:#100e16}.action{border:1px solid #4a1830;background:#8a3c5c;color:#fff}
.reveal{border-top:1px solid #d4c4cc;padding-top:10px;margin-top:2px;animation:fade .18s ease}
.reveal-head{margin-bottom:6px}.reveal-pinyin{font-size:clamp(26px,2.7vw,40px);font-style:italic;color:#8a3c5c;font-weight:700}
.glosses{font-size:clamp(20px,2vw,30px);line-height:1.25;margin:4px 0 8px;color:#16141c}.glosses b{color:#8a3c5c}
.wordtitle,.extitle,.chartitle{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#6a5c72;margin:10px 0 5px;font-weight:700}
.charlist{display:flex;gap:8px;flex-wrap:wrap}
.charchip{background:#f3e8ee;border:1px solid #d4c4cc;border-radius:4px;padding:7px 10px;min-width:92px;box-shadow:inset 0 0 0 1px rgba(201,160,106,.35)}
.charchip .wzh{font-family:"Noto Serif SC","Songti SC",serif;font-size:28px;font-weight:700;line-height:1;color:#8a3c5c}
.charchip .wpy{font-size:13px;font-style:italic;color:#3a4a68}.charchip .wen{font-size:12px;color:#5a4c58}
.examples{display:grid;gap:6px}
.example{padding:7px 10px;background:#f4eef2;border-left:4px solid #3a4a68;border-radius:3px;line-height:1.24}
.example-zh{font-family:"Noto Serif SC","Songti SC",serif;font-size:clamp(18px,1.6vw,24px)}
.example-py{font-size:clamp(13px,1.05vw,16px);font-style:italic;color:#8a3c5c;margin-top:2px}
.example-en{font-size:clamp(13px,1vw,16px);color:#4a3a42;margin-top:2px}
.example em{font-style:normal;font-weight:800;color:#8a3c5c;background:#ead4dc;border-radius:3px;padding:0 .06em}
.flipcard{margin-top:3px;border:1px solid #c9a06a;border-radius:3px;padding:12px 14px;background:#f4eef2}
.flipcard h3{margin:0 0 7px;font-size:13px;color:#3a4a68;text-transform:uppercase;letter-spacing:.1em}
.english-list{font-size:clamp(22px,2vw,32px);line-height:1.25;margin:4px 0 10px}
.flipcard .reveal-pinyin{margin:0 0 6px}
.further{border:1px solid #3a4a68;background:transparent;color:#3a4a68;border-radius:4px;padding:8px 11px;cursor:pointer}
.imagepane{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;background:rgba(18,14,10,.95);border:3px solid #3a4a68;border-radius:2px;overflow:hidden;box-shadow:inset 0 0 0 7px rgba(201,160,106,.28),0 18px 50px rgba(18,14,10,.34)}
.imagepane:before{content:"";position:absolute;inset:9px;border:1px solid rgba(201,160,106,.55);border-radius:1px;pointer-events:none}
.art{display:block;max-width:94%;max-height:90%;width:auto;height:auto;object-fit:contain;filter:saturate(1.02) contrast(1.03);box-shadow:0 8px 32px rgba(0,0,0,.32);transition:opacity .35s ease,transform .35s ease}.art.wide{max-width:98%;max-height:84%}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@media(max-width:900px){body{overflow:auto}.app{height:auto;min-height:100vh}.main{grid-template-columns:1fr;grid-template-rows:auto minmax(360px,55vh)}.quiz{overflow:visible}.imagepane{min-height:420px}.topbar{flex-wrap:wrap}.progress{order:3;flex-basis:100%;max-width:none}}
@media(max-width:520px){.main{padding:9px;gap:9px}.quiz{padding:14px}.brand small{display:none}.character{font-size:72px}.topbar{padding:8px 10px}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">词语 801–900 <small>most common words</small></div>
    <div class="progress"><i id="progressFill"></i></div>

    <button class="topbtn" id="shuffleBtn">Shuffle</button>
    <button class="topbtn" id="resetBtn">Reset order</button>
  </header>
  <main class="main">
    <section class="quiz">

      <div class="character" id="char"></div>
      <div class="pinyin front-pinyin" id="pinyin" aria-hidden="true"></div>
      <div class="prompt">Recognize the word first. Reveal for dictionary English, each character, and three fully translated examples.</div>
      <div class="controls">
        <div class="nav"><button class="ghost" id="prevBtn">← Previous</button><button class="ghost" id="nextBtn">Next →</button></div>
        <button class="action" id="revealBtn">Reveal</button>
        <button class="ghost" id="flipBtn">Flip</button>
      </div>
      <div id="detailArea"></div>
    </section>
    <section class="imagepane" id="imagePane">
      <img class="art" id="art" alt="Study image">
    </section>
  </main>
</div>
<script>
const BANK = [{"rank":801,"word":"考虑","pinyin":"kǎo lǜ","en":["consider","think over"],"chars":[{"ch":"考","py":"kǎo","en":"examine"},{"ch":"虑","py":"lǜ","en":"consider"}],"examples":[{"zh":"修桥的事还得再考虑一夜。","pinyin":"xiū qiáo de shì hái děi zài kǎo lǜ yí yè.","en":"The mending of the bridge must be thought over another night."},{"zh":"他考虑把牛卖了换粮。","pinyin":"tā kǎo lǜ bǎ niú mài le huàn liáng.","en":"He is considering selling the ox to exchange for grain."},{"zh":"这件事不能只按自己的心意考虑。","pinyin":"zhè jiàn shì bù néng zhǐ àn zì jǐ de xīn yì kǎo lǜ.","en":"This matter cannot be considered only according to one's own wish."}]},{"rank":802,"word":"比如","pinyin":"bǐ rú","en":["for example","such as"],"chars":[{"ch":"比","py":"bǐ","en":"compare"},{"ch":"如","py":"rú","en":"like; as"}],"examples":[{"zh":"村里缺的东西很多，比如盐和铁钉。","pinyin":"cūn lǐ quē de dōng xi hěn duō, bǐ rú yán hé tiě dīng.","en":"The village lacks many things, for example salt and iron nails."},{"zh":"有的活孩子们也能干，比如放牛。","pinyin":"yǒu de huó hái zi men yě néng gàn, bǐ rú fàng niú.","en":"Some work the children can do as well, such as watching the cattle."},{"zh":"比如这场雨，谁也拦不住。","pinyin":"bǐ rú zhè chǎng yǔ, shéi yě lán bú zhù.","en":"Take this rain, for example: no one can hold it back."}]},{"rank":803,"word":"例如","pinyin":"lì rú","en":["for instance","e.g."],"chars":[{"ch":"例","py":"lì","en":"example"},{"ch":"如","py":"rú","en":"like; as"}],"examples":[{"zh":"有几样农具该换了，例如那把旧锄。","pinyin":"yǒu jǐ yàng nóng jù gāi huàn le, lì rú nà bǎ jiù chú.","en":"Several farm tools ought to be changed, for instance that old hoe."},{"zh":"村里出过能人，例如老石匠。","pinyin":"cūn lǐ chū guo néng rén, lì rú lǎo shí jiang.","en":"Able people have come from the village, for instance the old stonemason."},{"zh":"例如今年的旱，谁家都不好过。","pinyin":"lì rú jīn nián de hàn, shéi jiā dōu bù hǎo guò.","en":"This year's drought, for instance: no household has had an easy time."}]},{"rank":804,"word":"相当","pinyin":"xiāng dāng","en":["quite","rather","considerable"],"chars":[{"ch":"相","py":"xiāng","en":"mutual"},{"ch":"当","py":"dāng","en":"equal; serve as"}],"examples":[{"zh":"这座桥相当结实。","pinyin":"zhè zuò qiáo xiāng dāng jié shi.","en":"This bridge is quite sturdy."},{"zh":"他的力气相当大，一个人能扛梁。","pinyin":"tā de lì qi xiāng dāng dà, yí ge rén néng káng liáng.","en":"His strength is considerable; he can carry a beam alone."},{"zh":"井水相当甜，比河里的好喝。","pinyin":"jǐng shuǐ xiāng dāng tián, bǐ hé lǐ de hǎo hē.","en":"The well water is rather sweet, better to drink than the river's."}]},{"rank":805,"word":"加入","pinyin":"jiā rù","en":["join","become a member of"],"chars":[{"ch":"加","py":"jiā","en":"add"},{"ch":"入","py":"rù","en":"enter"}],"examples":[{"zh":"他加入了修桥的一伙人。","pinyin":"tā jiā rù le xiū qiáo de yì huǒ rén.","en":"He joined the group mending the bridge."},{"zh":"邻村也有人加入来帮忙。","pinyin":"lín cūn yě yǒu rén jiā rù lái bāng máng.","en":"People from the neighboring village also joined to help."},{"zh":"孩子长大了，也能加入收谷的行列。","pinyin":"hái zi zhǎng dà le, yě néng jiā rù shōu gǔ de háng liè.","en":"When the child grows up, he too can join the line bringing in the grain."}]},{"rank":806,"word":"成立","pinyin":"chéng lì","en":["found","establish"],"chars":[{"ch":"成","py":"chéng","en":"become; succeed"},{"ch":"立","py":"lì","en":"stand; set up"}],"examples":[{"zh":"村里成立了互助的班子。","pinyin":"cūn lǐ chéng lì le hù zhù de bān zi.","en":"The village established a mutual-help crew."},{"zh":"互助社是开春成立的。","pinyin":"hù zhù shè shì kāi chūn chéng lì de.","en":"The mutual-aid society was founded when spring opened."},{"zh":"没有人手，这个会成立不起来。","pinyin":"méi yǒu rén shǒu, zhè ge huì chéng lì bù qǐ lai.","en":"Without hands, this association cannot be established."}]},{"rank":807,"word":"表演","pinyin":"biǎo yǎn","en":["perform","performance"],"chars":[{"ch":"表","py":"biǎo","en":"show; surface"},{"ch":"演","py":"yǎn","en":"act; perform"}],"examples":[{"zh":"过年的戏台上有人表演。","pinyin":"guò nián de xì tái shang yǒu rén biǎo yǎn.","en":"On the new-year stage there are people performing."},{"zh":"孩子在学堂里表演了一段旧调。","pinyin":"hái zi zài xué tang li biǎo yǎn le yí duàn jiù diào.","en":"The child performed an old tune at the schoolhouse."},{"zh":"舞狮的表演把广场挤满了。","pinyin":"wǔ shī de biǎo yǎn bǎ guǎng chǎng jǐ mǎn le.","en":"The lion-dance performance packed the square."}]},{"rank":808,"word":"舞蹈","pinyin":"wǔ dǎo","en":["dance","dancing"],"chars":[{"ch":"舞","py":"wǔ","en":"dance"},{"ch":"蹈","py":"dǎo","en":"tread; dance"}],"examples":[{"zh":"灯下几个姑娘在练民间舞蹈。","pinyin":"dēng xià jǐ ge gū niang zài liàn mín jiān wǔ dǎo.","en":"Under the lamp a few girls are practicing a folk dance."},{"zh":"这种舞蹈是上辈传下来的。","pinyin":"zhè zhǒng wǔ dǎo shì shàng bèi chuán xia lai de.","en":"This kind of dance was handed down from the older generation."},{"zh":"他不会舞蹈，只会敲锣。","pinyin":"tā bú huì wǔ dǎo, zhǐ huì qiāo luó.","en":"He cannot dance; he can only beat the gong."}]},{"rank":809,"word":"舞台","pinyin":"wǔ tái","en":["stage"],"chars":[{"ch":"舞","py":"wǔ","en":"dance"},{"ch":"台","py":"tái","en":"platform"}],"examples":[{"zh":"广场上临时搭起一座舞台。","pinyin":"guǎng chǎng shang lín shí dā qǐ yí zuò wǔ tái.","en":"A stage was put up for the time being on the square."},{"zh":"孩子们挤到舞台前面看戏。","pinyin":"hái zi men jǐ dào wǔ tái qián mian kàn xì.","en":"The children squeezed up in front of the stage to watch the play."},{"zh":"舞台一拆，谷又摊回来晒。","pinyin":"wǔ tái yì chāi, gǔ yòu tān hui lai shài.","en":"Once the stage is taken down, the grain is spread again to sun."}]},{"rank":810,"word":"观众","pinyin":"guān zhòng","en":["audience","spectators"],"chars":[{"ch":"观","py":"guān","en":"watch"},{"ch":"众","py":"zhòng","en":"crowd"}],"examples":[{"zh":"戏还没开，观众已经站了一圈。","pinyin":"xì hái méi kāi, guān zhòng yǐ jīng zhàn le yì quān.","en":"The play had not yet begun, and the audience had already stood in a ring."},{"zh":"观众里有老人，也有孩子。","pinyin":"guān zhòng li yǒu lǎo rén, yě yǒu hái zi.","en":"In the audience there are old people and children too."},{"zh":"雨一来，观众都往屋檐下躲。","pinyin":"yǔ yì lái, guān zhòng dōu wǎng wū yán xià duǒ.","en ng yǒu yì běn pò jiù de zì diǎn.","en":"The schoolmaster has a worn dictionary."},{"zh":"不认得的字就去翻字典。","pinyin":"bú rèn de de zì jiù qù fān zì diǎn.","en":"Characters one does not know, one looks up in the dictionary."},{"zh":"这本字典是从城里捎回来的。","pinyin":"zhè běn zì diǎn shì cóng chéng lǐ shāo hui lai de.","en":"This dictionary was brought back from the city."}]},{"rank":899,"word":"拼音","pinyin":"pīn yīn","en":["pinyin","phonetic spelling"],"chars":[{"ch":"拼","py":"pīn","en":"put together"},{"ch":"音","py":"yīn","en":"sound"}],"examples":[{"zh":"先生先教拼音，再教汉字。","pinyin":"xiān sheng xiān jiāo pīn yīn, zài jiāo hàn zì.","en":"The schoolmaster teaches pinyin first, then the characters."},{"zh":"他用拼音把村名写给邮差。","pinyin":"tā yòng pīn yīn bǎ cūn míng xiě gěi yóu chai.","en":"He wrote the village name in pinyin for the postman."},{"zh":"拼音写熟了，认字就快。","pinyin":"pīn yīn xiě shú le, rèn zì jiù kuài.","en":"Once pinyin is written fluently, knowing characters comes quickly."}]},{"rank":900,"word":"作文","pinyin":"zuò wén","en":["composition","write a composition"],"chars":[{"ch":"作","py":"zuò","en":"write; make"},{"ch":"文","py":"wén","en":"writing"}],"examples":[{"zh":"先生出的题目是写家乡的桥，让孩子作文。","pinyin":"xiān sheng chū de tí mù shì xiě jiā xiāng de qiáo, ràng hái zi zuò wén.","en":"The schoolmaster's topic was the home-village bridge, and he had the children write a composition."},{"zh":"这篇作文把井边的事写得很真。","pinyin":"zhè piān zuò wén bǎ jǐng bian de shì xiě de hěn zhēn.","en":"This composition writes the matters by the well very truly."},{"zh":"他不爱作文，却爱把实话说出来。","pinyin":"tā bú ài zuò wén, què ài bǎ shí huà shuō chu lai.","en":"He does not like writing compositions, yet he likes to speak the truth."}]}];
const IMAGES = ["img/01-courtyard-lanterns.jpg", "img/02-lotus-pavilion.jpg", "img/03-hall-lanterns.jpg", "img/04-night-canal.jpg", "img/05-harbin-street.jpg", "img/06-night-skyline.jpg", "img/07-palace-flowers.jpg", "img/08-qiandao-islands.jpg", "img/09-mountain-peak.jpg", "img/10-culture-street.jpg", "img/11-apothecary-bar.jpg", "img/12-lantern-restaurant.jpg", "img/13-lion-dance.jpg", "img/14-ballet-blue.jpg", "img/15-switchback-road.jpg"];
let order = BANK.map((_,i)=>i), pos=0, state='front';
const $=id=>document.getElementById(id);
function current(){return BANK[order[pos]]}
function safe(t){return String(t).replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>').replace(/"/g,'"').replace(/'/g,'&#039;')}
function mark(sentence,w){return safe(sentence).split(safe(w)).join('<em>'+safe(w)+'</em>')}
function imageForPosition(){const n=IMAGES.length||1;return Math.floor(pos*n/BANK.length)%n}
function setImage(){const idx=imageForPosition(), img=$('art');img.style.opacity=.15;setTimeout(()=>{img.src=IMAGES[idx]; img.onload=()=>{img.classList.toggle('wide',img.naturalWidth/img.naturalHeight>1.75);img.style.opacity=1}},90)}
function renderDetail(mode){const c=current(), d=$('detailArea'); if(mode==='front'){d.innerHTML='';return}
 if(mode==='flip'){d.innerHTML=`<div class="flipcard"><h3>Pinyin + English</h3><div class="reveal-pinyin">${safe(c.pinyin)}</div><div class="english-list">${c.en.map(safe).join(' · ')}</div><button class="further" id="furtherBtn">Reveal further</button></div>`;$('furtherBtn').onclick=()=>{state='revealed';renderDetail('revealed')};return}
 const chars=c.chars.map(w=>`<div class="charchip"><div class="wzh">${safe(w.ch)}</div><div class="wpy">${safe(w.py)}</div><div class="wen">${safe(w.en)}</div></div>`).join('');
 const ex=c.examples.map(x=>`<div class="example"><div class="example-zh">${mark(x.zh,c.word)}</div><div class="example-py">${safe(x.pinyin)}</div><div class="example-en">${safe(x.en)}</div></div>`).join('');
 d.innerHTML=`<div class="reveal"><div class="reveal-head"><div class="reveal-pinyin">${safe(c.pinyin)}</div><p class="glosses"><b>${safe(c.word)}</b> — ${c.en.map(safe).join('; ')}</p></div><div class="chartitle">Characters in this word</div><div class="charlist">${chars}</div><div class="extitle">Example sentences</div><div class="examples">${ex}</div></div>`}
function render(changeImage=true){const c=current();$('char').textContent=c.word;$('pinyin').textContent='';$('rankLabel').textContent=`Word frequency #${c.rank}`;$('cardStat').textContent=`${pos+1} / ${BANK.length}`;$('progressFill').style.width=((pos+1)/BANK.length*100)+'%';state='front';renderDetail('front');if(changeImage)setImage()}
function move(delta){const oldImg=imageForPosition();pos=Math.max(0,Math.min(BANK.length-1,pos+delta));render(imageForPosition()!==oldImg)}
$('prevBtn').onclick=()=>move(-1);$('nextBtn').onclick=()=>move(1);
$('revealBtn').onclick=()=>{state='revealed';renderDetail('revealed')};$('flipBtn').onclick=()=>{state='flip';renderDetail('flip')};
$('shuffleBtn').onclick=()=>{for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}pos=0;render(true)};
$('resetBtn').onclick=()=>{order=BANK.map((_,i)=>i);pos=0;render(true)};
render(true);
</script>
