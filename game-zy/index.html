<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edu-Term: Override</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --term-green: #39ff14;
            --term-green-dim: rgba(57, 255, 20, 0.4);
            --term-red: #ff3333;
            --term-yellow: #ffcc00;
            --bg-color: #020202;
        }

        * { box-sizing: border-box; }

        body, html {
            margin: 0; padding: 0;
            background-color: #050505;
            color: var(--term-green);
            font-family: 'VT323', monospace;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #monitor {
            width: 100vw; height: 100vh;
            max-width: 1000px; max-height: 800px;
            position: relative;
            background-color: var(--bg-color);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.9), 0 0 20px rgba(57, 255, 20, 0.1);
            border: 2px solid #111;
        }

        #monitor::after {
            content: " "; display: block; position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 10; pointer-events: none;
        }

        #screen {
            padding: 40px; height: 100%;
            display: flex; flex-direction: column;
            position: relative; z-index: 2;
            text-shadow: 0 0 6px var(--term-green);
            animation: flicker 0.15s infinite alternate;
        }

        @keyframes flicker {
            0% { opacity: 0.95; }
            100% { opacity: 1; }
        }

        /* Critical alarm pulse */
        .alarm-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 51, 51, 0.1);
            z-index: 5; pointer-events: none;
            animation: pulseRed 1.5s infinite;
            display: none;
        }
        @keyframes pulseRed {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }

        header {
            display: flex; justify-content: space-between;
            border-bottom: 2px dashed var(--term-green-dim);
            padding-bottom: 15px; margin-bottom: 20px; font-size: 28px;
            position: relative; z-index: 6;
        }

        .stats-group { display: flex; gap: 30px; }

        .health-critical {
            color: var(--term-red) !important;
            text-shadow: 0 0 10px var(--term-red) !important;
            animation: textPulse 1s infinite;
        }
        @keyframes textPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        #definition-container {
            flex-grow: 1; display: flex; flex-direction: column;
            justify-content: center; position: relative; z-index: 6;
        }

        #difficulty-badge { font-size: 22px; margin-bottom: 10px; color: var(--term-green-dim); }
        #definition-box { font-size: 34px; line-height: 1.3; min-height: 130px; margin-bottom: 30px; }

        .cursor {
            display: inline-block; width: 15px; height: 30px;
            background-color: var(--term-green); vertical-align: bottom;
            animation: blink 1s step-end infinite;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        #timer-box { font-size: 32px; margin-bottom: 20px; display: flex; align-items: center; gap: 15px; position: relative; z-index: 6;}
        
        .input-line {
            display: flex; align-items: center; font-size: 36px;
            background: rgba(57, 255, 20, 0.05); padding: 10px;
            border-left: 4px solid var(--term-green); position: relative; z-index: 6;
        }
        .prompt { margin-right: 15px; }

        input[type="text"] {
            background: transparent; border: none; color: var(--term-green);
            font-family: 'VT323', monospace; font-size: 36px; width: 100%;
            text-shadow: 0 0 6px var(--term-green); outline: none;
        }

        #feedback { margin-top: 15px; font-size: 24px; height: 30px; position: relative; z-index: 6; }
        .warning { color: var(--term-red) !important; text-shadow: 0 0 8px var(--term-red) !important; }
        .caution { color: var(--term-yellow) !important; text-shadow: 0 0 8px var(--term-yellow) !important; }

        .flash-damage { animation: damageFlash 0.4s; }
        @keyframes damageFlash { 0% { background-color: rgba(255, 51, 51, 0.4); } 100% { background-color: transparent; } }

        #overlay-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color); z-index: 20; display: flex;
            flex-direction: column; justify-content: center; align-items: center; text-align: center;
        }

        button {
            background: transparent; border: 2px solid var(--term-green);
            color: var(--term-green); font-family: 'VT323', monospace; font-size: 32px;
            padding: 15px 30px; cursor: pointer; margin-top: 30px; text-shadow: 0 0 6px var(--term-green);
            transition: all 0.2s;
        }
        button:hover { background: var(--term-green); color: var(--bg-color); }

    </style>
</head>
<body>

    <div id="monitor">
        <div class="alarm-overlay" id="alarm"></div>
        <div id="screen">
            <!-- Main Game UI -->
            <div id="active-game" style="display: none; height: 100%;">
                <header>
                    <div>SYS_ID: K12-EDU</div>
                    <div class="stats-group">
                        <div id="score-display">TERMS: 0</div>
                        <div id="health-bar">INTEGRITY: 100%</div>
                    </div>
                </header>

                <div id="definition-container">
                    <div id="difficulty-badge">[ANALYZING DIFFICULTY...]</div>
                    <div id="definition-box"></div>
                </div>
                
                <div id="timer-box">
                    <span>T-MINUS:</span>
                    <span id="time-blocks">[██████████]</span> 
                    <span id="time-text">15.0s</span>
                </div>

                <div class="input-line">
                    <span class="prompt">root@edu:~$</span>
                    <input type="text" id="term-input" autocomplete="off" spellcheck="false" placeholder="AWAITING INPUT...">
                </div>
                <div id="feedback"></div>
            </div>

            <!-- Menus -->
            <div id="overlay-screen">
                <div id="boot-text" style="font-size: 28px; line-height: 1.5; margin-bottom: 40px; text-align: left; width: 80%;">
                    > INITIALIZING K-12 GLOSSARY PROTOCOL...<br>
                    > LOADING PEDAGOGY DATABASE... OK.<br>
                    > WARNING: SYSTEM INTEGRITY VOLATILE.<br>
                    > RAPID DATA ENTRY REQUIRED TO PREVENT CRITICAL FAILURE.
                </div>
                <h1 id="end-title" style="display:none; font-size: 64px; margin: 0 0 20px 0;">SYSTEM FAILURE</h1>
                <div id="end-stats" style="display:none; font-size: 32px; margin-bottom: 20px;"></div>
                <button id="start-btn" onclick="startGame()">INITIATE SEQUENCE</button>
            </div>
        </div>
    </div>

    <script>
        // --- GAME LOGIC ---
        const vocabDB = [
            { term: "FERPA", diff: "hard", def: "The federal statute governing the confidentiality of, and access to, student education records." },
            { term: "PII", diff: "easy", def: "Personally identifiable information; data by which an individual's identity may be directly or indirectly determined." },
            { term: "Title IX", diff: "easy", def: "The provision prohibiting sex-based discrimination in federally funded education programmes." },
            { term: "Mandated Reporter", diff: "medium", def: "A person whose profession legally obliges them to report suspected child abuse or neglect to designated authorities." },
            { term: "Due Process", diff: "medium", def: "The constitutional guarantee of fair procedure before a student is deprived of an educational right." },
            { term: "Child Find", diff: "medium", def: "The affirmative duty of a district to identify, locate, and evaluate all children who may require special education." },
            { term: "FAPE", diff: "easy", def: "Free Appropriate Public Education; the entitlement of a student with a disability to publicly funded instruction." },
            { term: "LRE", diff: "easy", def: "Least Restrictive Environment; the requirement that a student with a disability be educated alongside non-disabled peers." },
            { term: "IEP", diff: "easy", def: "Individualized Education Program; the legally binding written plan specifying goals and services." },
            { term: "BIP", diff: "easy", def: "Behavior Intervention Plan; a written plan designed to reduce a specified problem behavior." },
            { term: "FBA", diff: "easy", def: "Functional Behavior Assessment; a systematic inquiry into the antecedents and consequences of a behavior." },
            { term: "Scaffolding", diff: "medium", def: "Temporary support enabling a student to perform a task beyond their independent capacity." },
            { term: "Differentiation", diff: "hard", def: "The deliberate adjustment of content, process, or product to the varied readiness, interest, and need of students." },
            { term: "Wait Time", diff: "medium", def: "The pause a teacher allows after posing a question before a response is called for." },
            { term: "PBIS", diff: "easy", def: "Positive Behavioral Interventions and Supports; a tiered, school-wide framework for expected behavior." },
            { term: "Formative Assessment", diff: "hard", def: "Assessment conducted during learning for the purpose of informing and adjusting instruction." },
            { term: "Summative Assessment", diff: "hard", def: "Assessment administered at the conclusion of instruction to judge attainment." },
            { term: "LMS", diff: "easy", def: "Learning Management System; the platform hosting course materials and submissions." },
            { term: "SIS", diff: "easy", def: "Student Information System; the database of record for enrolment, attendance, and grades." },
            { term: "MTSS", diff: "easy", def: "Multi-Tiered System of Supports; an integrated framework matching escalating supports to demonstrated need." },
            { term: "SEL", diff: "easy", def: "Social and Emotional Learning; instruction in self-awareness, social awareness, and decision-making." },
            { term: "DOK", diff: "easy", def: "Depth of Knowledge; Webb's four-level scheme classifying tasks by the complexity of thinking required." }
        ];

        let health = 100, score = 0, currentTerm = {}, timeRemaining = 0, totalTime = 0, penaltyAmount = 20;
        let timerInterval, unusedTerms = [], isTyping = false;

        const ui = {
            monitor: document.getElementById('monitor'),
            alarm: document.getElementById('alarm'),
            healthBar: document.getElementById('health-bar'),
            score: document.getElementById('score-display'),
            defBox: document.getElementById('definition-box'),
            diffBadge: document.getElementById('difficulty-badge'),
            timeBlocks: document.getElementById('time-blocks'),
            timeText: document.getElementById('time-text'),
            termInput: document.getElementById('term-input'),
            feedback: document.getElementById('feedback'),
            activeGame: document.getElementById('active-game'),
            overlay: document.getElementById('overlay-screen'),
            bootText: document.getElementById('boot-text'),
            endTitle: document.getElementById('end-title'),
            endStats: document.getElementById('end-stats'),
            startBtn: document.getElementById('start-btn'),
            screen: document.getElementById('screen')
        };

        function startGame() {
            health = 100; score = 0; unusedTerms = [...vocabDB]; 
            
            ui.overlay.style.display = 'none';
            ui.bootText.style.display = 'none';
            ui.activeGame.style.display = 'flex';
            ui.termInput.disabled = false;
            
            updateStats();
            loadNextTerm();
        }

        function setDifficultyParams(diff) {
            if (diff === 'hard') { totalTime = 20; penaltyAmount = 30; ui.diffBadge.innerText = "[CLASS: ALPHA // HIGH COMPLEXITY // -30% PENALTY]"; ui.diffBadge.className = "warning"; }
            else if (diff === 'medium') { totalTime = 17; penaltyAmount = 25; ui.diffBadge.innerText = "[CLASS: BETA // MODERATE COMPLEXITY // -25% PENALTY]"; ui.diffBadge.className = "caution"; }
            else { totalTime = 15; penaltyAmount = 20; ui.diffBadge.innerText = "[CLASS: GAMMA // STANDARD COMPLEXITY // -20% PENALTY]"; ui.diffBadge.className = ""; }
            timeRemaining = totalTime;
        }

        function typeDefinition(text) {
            isTyping = true; ui.defBox.innerHTML = ''; ui.termInput.disabled = true;
            let i = 0;
            
            const typingInterval = setInterval(() => {
                ui.defBox.innerHTML = text.substring(0, i) + '<span class="cursor"></span>';
                i++;
                if (i > text.length) {
                    clearInterval(typingInterval);
                    isTyping = false; ui.termInput.disabled = false; ui.termInput.focus();
                    startTimer();
                }
            }, 25);
        }

        function loadNextTerm() {
            clearInterval(timerInterval);
            ui.termInput.value = ''; ui.feedback.innerText = ''; ui.termInput.disabled = true;
            if (unusedTerms.length === 0) unusedTerms = [...vocabDB];
            
            const randomIndex = Math.floor(Math.random() * unusedTerms.length);
            currentTerm = unusedTerms.splice(randomIndex, 1)[0];
            
            setDifficultyParams(currentTerm.diff);
            updateTimerDisplay();
            typeDefinition(`QUERY: ${currentTerm.def}`);
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeRemaining -= 0.1;
                updateTimerDisplay();
                if (timeRemaining <= 0) {
                    timeRemaining = 0;
                    handleIncorrect(`TIMEOUT! -${penaltyAmount}% INTEGRITY`);
                }
            }, 100);
        }

        function updateTimerDisplay() {
            ui.timeText.innerText = Math.max(0, timeRemaining).toFixed(1) + 's';
            const blocksRemaining = Math.ceil((timeRemaining / totalTime) * 20);
            
            let blockString = '[';
            for(let i=0; i<20; i++) blockString += (i < blocksRemaining) ? '█' : '░';
            blockString += ']';
            
            ui.timeBlocks.innerText = blockString;
            const timerBox = document.getElementById('timer-box');
            if (timeRemaining <= 5) timerBox.classList.add('warning');
            else timerBox.classList.remove('warning');
        }

        function updateStats() {
            ui.healthBar.innerText = `INTEGRITY: ${health}%`;
            ui.score.innerText = `TERMS: ${score}`;
            
            if(health <= 30) {
                ui.healthBar.classList.add('health-critical');
                ui.alarm.style.display = 'block';
            } else {
                ui.healthBar.classList.remove('health-critical');
                ui.alarm.style.display = 'none';
            }
        }

        function handleIncorrect(message) {
            clearInterval(timerInterval);
            health -= penaltyAmount; 
            if (health < 0) health = 0;
            
            ui.screen.classList.add('flash-damage');
            setTimeout(() => {
                ui.screen.classList.remove('flash-damage');
            }, 400);
            
            ui.feedback.innerText = `ERROR: ${message}. REQUIRED DATA: [ ${currentTerm.term.toUpperCase()} ]`;
            ui.feedback.classList.add('warning');
            
            updateStats();
            if (health <= 0) setTimeout(endGame, 1500);
            else { ui.termInput.disabled = true; setTimeout(loadNextTerm, 2500); }
        }

        function handleCorrect() {
            clearInterval(timerInterval);
            score++;
            
            const timeElapsed = totalTime - timeRemaining;
            if (timeElapsed <= 10) {
                health += 10;
                if (health > 100) health = 100;
                ui.feedback.innerText = `DATA ACCEPTED. RAPID ENTRY DETECTED: +10% INTEGRITY.`;
            } else {
                ui.feedback.innerText = `DATA ACCEPTED.`;
            }
            
            ui.feedback.classList.remove('warning');
            updateStats();
            ui.termInput.disabled = true;
            setTimeout(loadNextTerm, 1500);
        }

        function endGame() {
            ui.activeGame.style.display = 'none';
            ui.overlay.style.display = 'flex';
            ui.endTitle.style.display = 'block';
            ui.endStats.style.display = 'block';
            ui.endStats.innerHTML = `FINAL SCORE: ${score} TERMS DECODED`;
            ui.startBtn.innerText = "REBOOT SYSTEM";
            ui.alarm.style.display = 'none';
        }

        ui.termInput.addEventListener('keydown', function(e) {
            if(e.key === 'Enter' && !isTyping && ui.termInput.value.trim() !== '') {
                const playerGuess = ui.termInput.value.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
                const correctAnswer = currentTerm.term.toLowerCase().replace(/[^a-z0-9]/g, '');
                
                if (playerGuess === correctAnswer) handleCorrect();
                else handleIncorrect(`INVALID DATA ENTRY`);
            }
        });

        document.addEventListener('click', () => {
            if(ui.activeGame.style.display === 'flex' && !isTyping && health > 0) ui.termInput.focus();
        });
    </script>
</body>
</html>
