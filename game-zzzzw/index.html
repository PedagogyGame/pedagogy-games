<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Russian Пословицы (Proverbs) Masterclass</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100%;
            color: #333;
        }

        /* Background using the attached media */
        body {
            background-image: url('AdobeStock_279832628.jpeg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Glassmorphism container for readability over the image */
        #game-container {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 5px;
            font-size: 1.8em;
        }

        p.subtitle {
            font-size: 0.9em;
            color: #555;
            margin-bottom: 25px;
        }

        #question-box {
            margin-bottom: 20px;
        }

        #proverb-text {
            font-size: 1.5em;
            font-weight: bold;
            color: #d35400;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(211, 84, 0, 0.1);
            border-radius: 8px;
        }

        .option-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #ecf0f1;
            border: 2px solid #bdc3c7;
            border-radius: 6px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }

        .option-btn:hover {
            background: #d6dbdf;
        }

        .option-btn:disabled {
            cursor: not-allowed;
        }

        .correct {
            background: #d5f5e3 !important;
            border-color: #2ecc71 !important;
            color: #27ae60;
            font-weight: bold;
        }

        .wrong {
            background: #fadbd8 !important;
            border-color: #e74c3c !important;
            color: #c0392b;
        }

        #feedback-box {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #fdfefe;
            border-left: 5px solid #3498db;
            text-align: left;
            border-radius: 4px;
        }

        #feedback-box p {
            margin: 5px 0;
            font-size: 0.95em;
        }

        .label {
            font-weight: bold;
            color: #2980b9;
        }

        #next-btn {
            display: none;
            margin-top: 20px;
            padding: 10px 20px;
            background: #2980b9;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            cursor: pointer;
            width: 100%;
        }

        #next-btn:hover {
            background: #2471a3;
        }

        #score-display {
            margin-top: 20px;
            font-weight: bold;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

<div id="game-container">
    <h1>Russian Пословицы</h1>
    <p class="subtitle">Decode the working stock of Russian moral proverbs.</p>
    
    <div id="quiz-content">
        <div id="question-box">
            <div id="proverb-text">Loading...</div>
            <div id="options"></div>
        </div>

        <div id="feedback-box">
            <p><span class="label">Literal Translation:</span> <span id="fb-literal"></span></p>
            <p><span class="label">Working Meaning:</span> <span id="fb-meaning"></span></p>
            <p><span class="label">Usage Note:</span> <span id="fb-note"></span></p>
        </div>

        <button id="next-btn" onclick="nextQuestion()">Next Proverb</button>
        <div id="score-display">Score: <span id="score">0</span> / <span id="total">0</span></div>
    </div>
</div>

<script>
    // The canonical list updated based on your final advice
    const proverbs = [
        {
            russian: "Лучше синица в руках, чем журавль в небе",
            options: [
                "A bird in the hand is worth two in the bush.",
                "It is better to fly high than to stay on the ground.",
                "Do not hunt what you cannot eat.",
                "Small things are easily lost in the sky."
            ],
            correct: 0,
            literal: "A titmouse in the hands is better than a crane in the sky.",
            meaning: "Appreciate what you already have rather than risking it for a greater but uncertain reward.",
            note: "A foundational proverb of practical Russian risk assessment. Added as top priority."
        },
        {
            russian: "Слово не воробей, вылетит — не поймаешь",
            options: [
                "Birds always fly back to their nests.",
                "Words cannot be taken back once spoken.",
                "Do not waste your breath on a fool.",
                "A quiet voice travels the furthest."
            ],
            correct: 1,
            literal: "A word is not a sparrow, if it flies out, you won't catch it.",
            meaning: "Words have permanent consequences.",
            note: "Often clipped in speech to just 'Слово не воробей...'"
        },
        {
            russian: "Работа не волк, в лес не убежит",
            options: [
                "Work hard, because winter is coming.",
                "Work is dangerous, handle it with care.",
                "Work can wait; it won't disappear.",
                "A good worker is as fierce as a wolf."
            ],
            correct: 2,
            literal: "Work isn't a wolf, it won't run away into the forest.",
            meaning: "There is no need to rush to complete a task; put it off for a while.",
            note: "Tone: Highly ironic. This is used as an excuse to procrastinate, not as a genuine work ethic slogan."
        },
        {
            russian: "Рыба гниет с головы",
            options: [
                "A fish rots from the head.",
                "Old fish tastes bitter.",
                "Do not eat what you haven't caught.",
                "The water is dirtiest at the surface."
            ],
            correct: 0,
            literal: "A fish rots from the head.",
            meaning: "When an organization or society fails, leadership corruption or incompetence is to blame.",
            note: "Specifically targets leadership corruption, not just generic organizational failure."
        },
        {
            russian: "Горбатого могила исправит",
            options: [
                "A bad back aches when it rains.",
                "Only hard labor cures a bad attitude.",
                "The grave will fix the hunchback.",
                "Death is the great equalizer."
            ],
            correct: 2,
            literal: "The grave will fix the hunchback.",
            meaning: "A deeply fixed vice or character flaw will not change this side of the grave.",
            note: "Tone: Harsh and definitive. Much stronger than 'people rarely change.'"
        },
        {
            russian: "Слово — серебро, молчание — золото",
            options: [
                "Words cost money, silence is free.",
                "Speak clearly, or do not speak at all.",
                "Speech is silver, silence is golden.",
                "You can buy a secret with gold."
            ],
            correct: 2,
            literal: "A word is silver, silence is gold.",
            meaning: "Sometimes it is wiser to say nothing at all.",
            note: "Almost always clipped by Russians simply to 'Молчание — золото'."
        },
        {
            russian: "Первый блин всегда комом",
            options: [
                "The first pancake is always lumpy.",
                "Breakfast is the most important meal.",
                "Do not eat dough before it is baked.",
                "A hot pan makes a perfect meal."
            ],
            correct: 0,
            literal: "The first pancake is always a lump.",
            meaning: "The first attempt at anything usually goes badly, so don't get discouraged.",
            note: "Often offered as warm reassurance. Frequently clipped to 'Первый блин...'"
        },
        {
            russian: "Коней на переправе не меняют",
            options: [
                "Do not trade your horse for a donkey.",
                "Don't change horses mid-ford.",
                "A fast horse crosses the river first.",
                "Water washes away all tracks."
            ],
            correct: 1,
            literal: "They do not change horses at the river crossing.",
            meaning: "Do not alter your plans or switch leadership at a critical or dangerous moment.",
            note: "A major foundational proverb regarding consistency in a crisis."
        },
        {
            russian: "Сделал дело — гуляй смело",
            options: [
                "Walk boldly if you have nothing to hide.",
                "A good deed goes unpunished.",
                "Finish the job, then rest with a clear conscience.",
                "Do your work in the daylight."
            ],
            correct: 2,
            literal: "Having done the deed, stroll boldly.",
            meaning: "Once you have completed your responsibilities, you can relax without guilt.",
            note: "Used as firm, practical advice, especially to children and students."
        },
        {
            russian: "Насильно мил не будешь",
            options: [
                "Strength does not equal kindness.",
                "You cannot force affection or goodwill.",
                "A forced smile hides a bitter heart.",
                "Do not force others to do your work."
            ],
            correct: 1,
            literal: "By force, you will not be sweet (loved).",
            meaning: "You cannot force someone to like you, be loyal to you, or feel good will toward you.",
            note: "Broader than just romance; applies to all human relationships and loyalty."
        }
    ];

    let currentQuestionIndex = 0;
    let score = 0;

    const proverbText = document.getElementById("proverb-text");
    const optionsContainer = document.getElementById("options");
    const feedbackBox = document.getElementById("feedback-box");
    const nextBtn = document.getElementById("next-btn");
    const scoreDisplay = document.getElementById("score");
    const totalDisplay = document.getElementById("total");

    totalDisplay.innerText = proverbs.length;

    function loadQuestion() {
        // Reset UI
        feedbackBox.style.display = "none";
        nextBtn.style.display = "none";
        optionsContainer.innerHTML = "";
        
        const q = proverbs[currentQuestionIndex];
        proverbText.innerText = q.russian;

        q.options.forEach((option, index) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = option;
            btn.onclick = () => checkAnswer(index, btn);
            optionsContainer.appendChild(btn);
        });
    }

    function checkAnswer(selectedIndex, btnElement) {
        const q = proverbs[currentQuestionIndex];
        const buttons = document.querySelectorAll(".option-btn");
        
        // Disable all buttons
        buttons.forEach(btn => btn.disabled = true);

        // Check correctness
        if (selectedIndex === q.correct) {
            btnElement.classList.add("correct");
            score++;
            scoreDisplay.innerText = score;
        } else {
            btnElement.classList.add("wrong");
            buttons[q.correct].classList.add("correct");
        }

        // Show feedback
        document.getElementById("fb-literal").innerText = q.literal;
        document.getElementById("fb-meaning").innerText = q.meaning;
        document.getElementById("fb-note").innerText = q.note;
        feedbackBox.style.display = "block";
        nextBtn.style.display = "block";
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < proverbs.length) {
            loadQuestion();
        } else {
            document.getElementById("quiz-content").innerHTML = `
                <h2>Quiz Complete!</h2>
                <p>You scored ${score} out of ${proverbs.length}.</p>
                <p>You are well on your way to mastering the true moral canon of Russian пословицы.</p>
                <button id="next-btn" style="display:block;" onclick="location.reload()">Play Again</button>
            `;
        }
    }

    // Initialize game
    loadQuestion();
</script>

</body>
</html>
