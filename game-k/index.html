
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rendering Wizardry</title>
    <!-- Importing a pixel-art style font -->
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0a0f;
            --terminal-bg: #111;
            --terminal-border: #444;
            --text-green: #4ade80;
            --text-amber: #f59e0b;
            --text-red: #ef4444;
            --monitor-bg: #1e1e24;
            --tally-on: #ef4444;
            --tally-off: #333;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-color);
            font-family: 'VT323', monospace;
            overflow: hidden;
            color: #fff;
        }

        /* The Pixelated Soundstage Background */
        .soundstage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(20, 20, 25, 0.9), rgba(10, 10, 15, 0.95)),
                repeating-linear-gradient(45deg, #222 25%, transparent 25%, transparent 75%, #222 75%, #222),
                repeating-linear-gradient(45deg, #222 25%, #1a1a24 25%, #1a1a24 75%, #222 75%, #222);
            background-position: 0 0, 4px 4px, 4px 4px;
            background-size: 100% 100%, 8px 8px, 8px 8px;
            z-index: 1;
        }

        /* Video Village Monitors */
        .video-village {
            position: absolute;
            bottom: 5%;
            left: 5%;
            display: flex;
            gap: 20px;
            z-index: 5;
        }

        .monitor-rig {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .monitor {
            width: 200px;
            height: 140px;
            background-color: var(--monitor-bg);
            border: 6px solid #2a2a35;
            border-radius: 4px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.8), inset 0 0 15px rgba(0,0,0,0.9);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Simulating pixelated static/feed on the monitors */
        .monitor-feed {
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 2px, transparent 2px, transparent 4px);
            opacity: 0.8;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            color: rgba(255,255,255,0.3);
        }

        .tally-light {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: var(--tally-off);
            box-shadow: 0 0 2px #000;
        }

        .tally-on {
            background-color: var(--tally-on);
            box-shadow: 0 0 10px var(--tally-on), 0 0 20px var(--tally-on);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.8; }
            50% { opacity: 1; }
            100% { opacity: 0.8; }
        }

        .monitor-label {
            font-size: 1.2rem;
            color: #888;
            letter-spacing: 2px;
        }

        /* The Director's Terminal (Gameplay UI) */
        .terminal {
            position: absolute;
            bottom: 5%;
            right: 5%;
            width: 400px;
            background-color: var(--terminal-bg);
            border: 4px solid var(--terminal-border);
            border-radius: 4px;
            box-shadow: -5px 10px 25px rgba(0,0,0,0.9);
            z-index: 10;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .terminal-header {
            background-color: var(--terminal-border);
            padding: 5px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .term-title {
            font-size: 1.2rem;
            color: #aaa;
        }

        .term-question {
            font-size: 1.2rem;
            color: var(--text-green);
        }

        .terminal-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.5rem;
        }

        .timer {
            color: var(--text-green);
            font-size: 2rem;
        }

        .confidence-container {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 5px;
        }

        .confidence-label {
            font-size: 1.2rem;
            color: #aaa;
        }

        .confidence-bar {
            width: 150px;
            height: 12px;
            background-color: #222;
            border: 2px solid #555;
        }

        .confidence-fill {
            width: 100%;
            height: 100%;
            background-color: var(--text-green);
        }

        .definition {
            font-size: 1.6rem;
            line-height: 1.4;
            color: #ddd;
            min-height: 80px;
        }

        .input-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 2rem;
            color: var(--text-green);
        }

        .term-input {
            background: transparent;
            border: none;
            border-bottom: 2px solid var(--text-green);
            color: var(--text-green);
            font-family: 'VT323', monospace;
            font-size: 2rem;
            width: 100%;
            outline: none;
            text-transform: uppercase;
        }

        .term-input:focus {
            border-bottom: 2px solid #fff;
            color: #fff;
        }

        /* Scanline effect over the whole screen */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
            z-index: 100;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="soundstage"></div>
    <div class="scanlines"></div>

    <!-- Video Village Foreground -->
    <div class="video-village">
        <div class="monitor-rig">
            <div class="tally-light"></div>
            <div class="monitor">
                <div class="monitor-feed">CAM 1: MCU</div>
            </div>
            <div class="monitor-label">CAM 1</div>
        </div>
        
        <div class="monitor-rig">
            <div class="tally-light tally-on"></div>
            <div class="monitor">
                <div class="monitor-feed" style="color: rgba(255,255,255,0.7);">CAM 2: MASTER</div>
            </div>
            <div class="monitor-label" style="color: #fff;">CAM 2 (LIVE)</div>
        </div>

        <div class="monitor-rig">
            <div class="tally-light"></div>
            <div class="monitor">
                <div class="monitor-feed">CAM 3: OTS</div>
            </div>
            <div class="monitor-label">CAM 3</div>
        </div>
    </div>

    <!-- Gameplay UI Bottom Right -->
    <div class="terminal">
        <div class="terminal-header">
            <span class="term-title">SYS_DIR // VISUAL_COORD</span>
            <span class="term-question">21 / 75</span>
        </div>
        <div class="terminal-body">
            <div class="status-row">
                <div class="timer" id="game-timer">05.4s</div>
                <div class="confidence-container">
                    <span class="confidence-label">DIRECTOR CONFIDENCE</span>
                    <div class="confidence-bar">
                        <div class="confidence-fill"></div>
                    </div>
                </div>
            </div>

            <div class="definition">
                "A horizontal pivot of the camera from a fixed point."
            </div>

            <div class="input-row">
                <span>></span>
                <input type="text" class="term-input" autocomplete="off" autofocus spellcheck="false">
            </div>
        </div>
    </div>

</body>
</html>

```
