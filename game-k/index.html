<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rendering Wizardry - Live Soundstage</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            var(--bg-studio): #111214;
            --floor-studio: #232529;
            --set-wall: #7c5b45;
            --set-floor: #d2a679;
            --monitor-bezel: #22252a;
            --monitor-screen: #0a0a0f;
            --ui-text: #f4f4f5;
            --ui-highlight: #fbbf24;
            --tally-red: #ef4444;
            --tally-off: #3f3f46;
            --correct-green: #4ade80;
            --wrong-red: #f87171;
        }

        body, html {
            margin: 0; padding: 0; width: 100vw; height: 100vh;
            font-family: 'VT323', monospace; background-color: #111214;
            overflow: hidden; color: var(--ui-text); user-select: none;
        }

        /* --- STAGE ENVIRONMENT (PROGRAMMER ART) --- */
        .studio-background {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, #111214 40%, #000 40%, var(--floor-studio) 41%); z-index: 1;
        }

        .lighting-grid {
            position: absolute; top: 0; left: 0; width: 100%; height: 20%;
            background-image: repeating-linear-gradient(90deg, transparent 0, transparent 60px, #1a1c20 60px, #1a1c20 65px),
                              repeating-linear-gradient(0deg, transparent 0, transparent 30px, #1a1c20 30px, #1a1c20 35px);
            z-index: 5; box-shadow: inset 0 -20px 40px rgba(0,0,0,0.8);
        }

        .sitcom-set {
            position: absolute; top: 20%; left: 25%; width: 50%; height: 25%;
            background-color: var(--set-wall); border: 4px solid #5a4131;
            border-bottom: 20px solid var(--set-floor); box-shadow: inset 0 20px 50px rgba(0,0,0,0.5); z-index: 2; overflow: hidden;
        }

        .actor {
            position: absolute; bottom: 25px; width: 15px; height: 45px; background: #e2c09c;
            border-bottom: 25px solid #4a6fa5; border-radius: 10px 10px 0 0; z-index: 3;
            animation: act 4s infinite alternate ease-in-out;
        }
        .actor-1 { left: 40%; }
        .actor-2 { left: 55%; border-bottom-color: #5c804b; animation-delay: 1.5s; }

        @keyframes act {
            0% { transform: translateX(0) scaleY(1); }
            50% { transform: translateX(10px) scaleY(1.05); }
            100% { transform: translateX(-5px) scaleY(1); }
        }

        .camera-operator {
            position: absolute; top: 45%; width: 40px; height: 80px; background: #2a2a35; z-index: 10;
        }
        .cam-1 { left: 20%; transform: scale(0.9); }
        .cam-2 { left: 48%; transform: scale(1.1); z-index: 11; }
        .cam-3 { left: 75%; transform: scale(0.9); }

        /* --- UI: VIDEO VILLAGE --- */
        .video-village {
            position: absolute; bottom: 5%; left: 3%; display: flex; gap: 20px; z-index: 20;
        }
        .monitor-rig { display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .monitor {
            width: 200px; height: 140px; background-color: var(--monitor-screen);
            border: 8px solid var(--monitor-bezel); border-radius: 4px; position: relative;
        }
        .tally-light { width: 20px; height: 8px; border-radius: 2px; background-color: var(--tally-off); }
        .tally-on { background-color: var(--tally-red); box-shadow: 0 0 10px var(--tally-red); }
        .monitor-label { font-size: 1.3rem; color: #aaa; background: #111; padding: 2px 8px; border-radius: 4px; }

        /* --- GAMEPLAY TERMINAL --- */
        .terminal {
            position: absolute; bottom: 5%; right: 3%; width: 440px; background-color: var(--monitor-screen);
            border: 10px solid var(--monitor-bezel); border-radius: 6px; box-shadow: -10px 15px 35px rgba(0,0,0,0.9);
            z-index: 20; display: flex; flex-direction: column; transition: border-color 0.3s ease;
        }
        .terminal.correct { border-color: var(--correct-green); }
        .terminal.wrong { border-color: var(--wrong-red); }

        .terminal-header {
            background-color: #1a1c20; border-bottom: 2px solid #333; padding: 8px 15px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .term-title { font-size: 1.2rem; color: #888; }
        .term-question { font-size: 1.2rem; background: #333; padding: 2px 8px; border-radius: 4px; }

        .terminal-body { padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        .status-row { display: flex; justify-content: space-between; align-items: center; }
        .timer { color: var(--ui-highlight); font-size: 3rem; line-height: 1; }
        
        .category-label { color: #888; font-size: 1.1rem; text-transform: uppercase; margin-bottom: -10px; }
        .definition { font-size: 1.7rem; line-height: 1.2; min-height: 70px; }

        .input-row {
            display: flex; align-items: center; gap: 10px; background: #1a1c20;
            padding: 10px 15px; border-radius: 4px; border: 1px solid #333;
        }
        .input-prompt { color: var(--ui-highlight); font-size: 1.8rem; }
        .term-input {
            background: transparent; border: none; color: #fff; font-family: 'VT323', monospace;
            font-size: 1.8rem; width: 100%; outline: none; text-transform: uppercase;
        }
        .term-input::placeholder { color: #555; }
    </style>
</head>
<body>

    <div class="studio-background"></div>
    <div class="lighting-grid"></div>
    <div class="sitcom-set">
        <div class="actor actor-1"></div>
        <div class="actor actor-2"></div>
    </div>
    <div class="camera-operator cam-1"></div>
    <div class="camera-operator cam-2"></div>
    <div class="camera-operator cam-3"></div>

    <div class="video-village">
        <div class="monitor-rig">
            <div class="tally-light"></div>
            <div class="monitor"></div>
            <div class="monitor-label">CAM 1</div>
        </div>
        <div class="monitor-rig">
            <div class="tally-light tally-on"></div>
            <div class="monitor"></div>
            <div class="monitor-label" style="color:#fff;">CAM 2 (MASTER)</div>
        </div>
    </div>

    <div class="terminal" id="terminal-ui">
        <div class="terminal-header">
            <span class="term-title">SCENE: 4A | TAKE: 3</span>
            <span class="term-question" id="shot-counter">SHOT 1 / 3</span>
        </div>
        <div class="terminal-body">
            <div class="status-row">
                <div class="timer" id="game-timer">15.0s</div>
            </div>
            <div class="category-label" id="category">Composition & Layout</div>
            <div class="definition" id="definition">
                "What the eye is pulled to first; the visual center of interest."
            </div>
            <div class="input-row">
                <span class="input-prompt">INPUT:</span>
                <input type="text" class="term-input" id="answer-input" placeholder="ENTER TERM..." autocomplete="off" autofocus spellcheck="false">
            </div>
        </div>
    </div>

    <!-- GAME LOGIC -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputField = document.getElementById('answer-input');
            const defDisplay = document.getElementById('definition');
            const catDisplay = document.getElementById('category');
            const shotCounter = document.getElementById('shot-counter');
            const terminalUI = document.getElementById('terminal-ui');

            // Sample Vocabulary Database
            const gameData = [
                { term: "FOCAL POINT", category: "Composition & Layout", def: '"What the eye is pulled to first; the visual center of interest."' },
                { term: "PAN", category: "Camera Movements", def: '"Horizontal pivot from a fixed point."' },
                { term: "DUTCH ANGLE", category: "Camera Angles", def: '"Tilted horizon; unease, disorientation, tension."' }
            ];

            let currentIndex = 0;

            // Load the first question
            function loadQuestion() {
                defDisplay.textContent = gameData[currentIndex].def;
                catDisplay.textContent = gameData[currentIndex].category;
                shotCounter.textContent = `SHOT ${currentIndex + 1} / ${gameData.length}`;
                inputField.value = '';
                inputField.focus();
            }

            // Listen for the Enter Key
            inputField.addEventListener('keypress', function (e) {
                if (e.key === 'Enter') {
                    e.preventDefault(); // Stop default form submission behavior
                    
                    const playerAnswer = inputField.value.trim().toUpperCase();
                    const correctAnswer = gameData[currentIndex].term.toUpperCase();

                    if (playerAnswer === correctAnswer) {
                        // Correct Answer Logic
                        terminalUI.classList.add('correct');
                        inputField.style.color = 'var(--correct-green)';
                    } else {
                        // Wrong Answer Logic
                        terminalUI.classList.add('wrong');
                        inputField.style.color = 'var(--wrong-red)';
                        inputField.value = `CORRECT: ${correctAnswer}`;
                    }

                    // Wait 1.5 seconds, then move to next question
                    setTimeout(() => {
                        terminalUI.classList.remove('correct', 'wrong');
                        inputField.style.color = '';
                        currentIndex = (currentIndex + 1) % gameData.length; // Loop back to start
                        loadQuestion();
                    }, 1500);
                }
            });

            // Initialize Game
            loadQuestion();
        });
    </script>
</body>
</html>
