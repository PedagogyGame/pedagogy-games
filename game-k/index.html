<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rendering Wizardry - Live Soundstage</title>
    <!-- Pixel-art style font -->
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Film Production Palette */
            --bg-studio: #111214;
            --floor-studio: #232529;
            --set-wall: #7c5b45;
            --set-floor: #d2a679;
            --monitor-bezel: #22252a;
            --monitor-screen: #0a0a0f;
            --ui-text: #f4f4f5;
            --ui-highlight: #fbbf24;
            --tally-red: #ef4444;
            --tally-off: #3f3f46;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            font-family: 'VT323', monospace;
            background-color: var(--bg-studio);
            overflow: hidden;
            color: var(--ui-text);
            user-select: none;
        }

        /* --- STAGE ENVIRONMENT (BACKGROUND TO FOREGROUND) --- */

        /* Far Background: Dark studio walls, scaffolding, doors */
        .studio-background {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, var(--bg-studio) 40%, #000 40%, var(--floor-studio) 41%);
            z-index: 1;
        }

        /* Lighting Grid */
        .lighting-grid {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 20%;
            background-image: 
                repeating-linear-gradient(90deg, transparent 0, transparent 60px, #1a1c20 60px, #1a1c20 65px),
                repeating-linear-gradient(0deg, transparent 0, transparent 30px, #1a1c20 30px, #1a1c20 35px);
            z-index: 5;
            box-shadow: inset 0 -20px 40px rgba(0,0,0,0.8);
        }

        /* Studio Practical Lights */
        .fresnel-light {
            position: absolute;
            top: 15%; width: 20px; height: 30px;
            background: #333;
            border-bottom: 5px solid #fbbf24;
            box-shadow: 0 40px 100px 30px rgba(251, 191, 36, 0.15);
            z-index: 6;
        }
        .light-1 { left: 20%; }
        .light-2 { left: 50%; }
        .light-3 { left: 80%; }

        /* The Sitcom Set (Mid-Background) */
        .sitcom-set {
            position: absolute;
            top: 20%; left: 25%; width: 50%; height: 25%;
            background-color: var(--set-wall);
            border: 4px solid #5a4131;
            border-bottom: 20px solid var(--set-floor);
            box-shadow: inset 0 20px 50px rgba(0,0,0,0.5), 0 10px 30px rgba(0,0,0,0.9);
            z-index: 2;
            overflow: hidden;
        }
        
        /* Set Props */
        .set-couch {
            position: absolute; bottom: 20px; left: 30%;
            width: 120px; height: 40px; background: #8b3a3a;
            border-radius: 5px 5px 0 0;
        }
        .set-lamp {
            position: absolute; bottom: 20px; right: 20%;
            width: 8px; height: 60px; background: #333;
        }
        .set-lamp::after {
            content: ''; position: absolute; top: -15px; left: -10px;
            width: 28px; height: 20px; background: #fbbf24;
            border-radius: 3px;
        }

        /* --- ANIMATED CREW & CHARACTERS --- */

        /* Sitcom Actors */
        .actor {
            position: absolute; bottom: 25px;
            width: 15px; height: 45px;
            background: #e2c09c; /* Skin block */
            border-bottom: 25px solid #4a6fa5; /* Clothing block */
            border-radius: 10px 10px 0 0;
            z-index: 3;
            animation: act 4s infinite alternate ease-in-out;
        }
        .actor-1 { left: 40%; animation-delay: 0s; }
        .actor-2 { left: 55%; border-bottom-color: #5c804b; animation-delay: 1.5s; }

        @keyframes act {
            0% { transform: translateX(0) scaleY(1); }
            50% { transform: translateX(10px) scaleY(1.05); }
            100% { transform: translateX(-5px) scaleY(1); }
        }

        /* Swaying Boom Mic */
        .boom-pole {
            position: absolute; top: -10px; left: 45%;
            width: 4px; height: 120px;
            background: #444;
            transform-origin: top center;
            animation: sway 6s infinite ease-in-out;
            z-index: 4;
        }
        .boom-mic {
            position: absolute; bottom: -10px; left: -8px;
            width: 20px; height: 10px;
            background: #222; border-radius: 10px;
        }

        @keyframes sway {
            0% { transform: rotate(-10deg); }
            50% { transform: rotate(15deg); }
            100% { transform: rotate(-10deg); }
        }

        /* Camera Crew / Pedestals (Foreground-Mid) */
        .camera-operator {
            position: absolute; top: 45%;
            width: 40px; height: 80px;
            background: #2a2a35;
            z-index: 10;
        }
        .lens {
            position: absolute; top: 10px; right: -20px;
            width: 30px; height: 15px; background: #111;
            border-right: 4px solid #fff;
        }
        .operator-body {
            position: absolute; top: 20px; left: -25px;
            width: 25px; height: 60px; background: #555;
            border-radius: 10px 10px 0 0;
            animation: operate 3s infinite alternate;
        }
        
        .cam-1 { left: 20%; transform: scale(0.9); }
        .cam-2 { left: 48%; transform: scale(1.1); z-index: 11; }
        .cam-3 { left: 75%; transform: scale(0.9); }
        .cam-3 .lens { right: auto; left: -20px; border-right: none; border-left: 4px solid #fff; }
        .cam-3 .operator-body { left: 35px; }

        @keyframes operate {
            0% { transform: translateY(0); }
            100% { transform: translateY(3px); }
        }

        /* Running Intern with Drinks */
        .intern {
            position: absolute; top: 52%; left: -50px;
            width: 20px; height: 50px;
            background: #a36b5e; border-bottom: 25px solid #222;
            border-radius: 10px 10px 0 0;
            z-index: 9; /* Behind cameras, in front of stage */
            animation: run-intern 12s linear infinite;
        }
        .intern::after {
            content: '🥤';
            position: absolute; top: 10px; right: -15px;
            font-size: 1.2rem;
        }

        @keyframes run-intern {
            0% { left: -10%; transform: scaleX(1); }
            45% { left: 110%; transform: scaleX(1); }
            50% { left: 110%; transform: scaleX(-1); }
            95% { left: -10%; transform: scaleX(-1); }
            100% { left: -10%; transform: scaleX(1); }
        }

        /* --- UI: VIDEO VILLAGE & TERMINAL (FOREGROUND) --- */

        .video-village {
            position: absolute; bottom: 5%; left: 3%;
            display: flex; gap: 20px; z-index: 20;
        }

        .monitor-rig {
            display: flex; flex-direction: column; align-items: center; gap: 8px;
        }

        .monitor {
            width: 200px; height: 140px;
            background-color: var(--monitor-screen);
            border: 8px solid var(--monitor-bezel);
            border-radius: 4px;
            box-shadow: 0 15px 25px rgba(0,0,0,0.6), inset 0 0 10px rgba(0,0,0,0.8);
            position: relative; overflow: hidden;
        }

        /* Monitor 1: Rule of Thirds */
        .feed-thirds {
            width: 100%; height: 100%; background-color: #2b303a;
            background-image: 
                linear-gradient(to right, transparent 33%, rgba(255,255,255,0.3) 33%, rgba(255,255,255,0.3) 34%, transparent 34%, transparent 66%, rgba(255,255,255,0.3) 66%, rgba(255,255,255,0.3) 67%, transparent 67%),
                linear-gradient(to bottom, transparent 33%, rgba(255,255,255,0.3) 33%, rgba(255,255,255,0.3) 34%, transparent 34%, transparent 66%, rgba(255,255,255,0.3) 66%, rgba(255,255,255,0.3) 67%, transparent 67%);
        }

        /* Monitor 2: Live Sitcom Feed (matches physical set colors) */
        .feed-sitcom {
            width: 100%; height: 100%; background: var(--set-wall); position: relative;
        }
        .feed-sitcom::before {
            content: ''; position: absolute; bottom: 10px; left: 20px;
            width: 80px; height: 30px; background: #8b3a3a; border-radius: 2px;
        }

        /* Monitor 3: Color Bars */
        .feed-smpte {
            width: 100%; height: 100%;
            background: linear-gradient(to right, 
                #c0c0c0 14.2%, #c0c000 14.2% 28.5%, #00c0c0 28.5% 42.8%, 
                #00c000 42.8% 57.1%, #c000c0 57.1% 71.4%, #c00000 71.4% 85.6%, #0000c0 85.6%);
        }

        .camera-overlay {
            position: absolute; top: 4px; left: 6px; font-size: 1.1rem;
            color: rgba(255,255,255,0.8); text-shadow: 1px 1px 0 #000;
        }

        .tally-light {
            width: 20px; height: 8px; border-radius: 2px;
            background-color: var(--tally-off);
        }
        .tally-on {
            background-color: var(--tally-red);
            box-shadow: 0 0 10px var(--tally-red);
        }
        .monitor-label {
            font-size: 1.3rem; color: #aaa; background: #111;
            padding: 2px 8px; border-radius: 4px;
        }

        /* Gameplay Terminal */
        .terminal {
            position: absolute; bottom: 5%; right: 3%;
            width: 440px; background-color: var(--monitor-screen);
            border: 10px solid var(--monitor-bezel); border-radius: 6px;
            box-shadow: -10px 15px 35px rgba(0,0,0,0.9);
            z-index: 20; display: flex; flex-direction: column;
        }

        .terminal-header {
            background-color: #1a1c20; border-bottom: 2px solid #333;
            padding: 8px 15px; display: flex; justify-content: space-between; align-items: center;
        }
        .term-title { font-size: 1.2rem; color: #888; }
        .term-question { font-size: 1.2rem; background: #333; padding: 2px 8px; border-radius: 4px; }

        .terminal-body {
            padding: 20px; display: flex; flex-direction: column; gap: 20px;
        }

        .status-row { display: flex; justify-content: space-between; align-items: center; }
        .timer { color: var(--ui-highlight); font-size: 3rem; line-height: 1; }
        
        .confidence-container { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
        .confidence-label { font-size: 1rem; color: #888; }
        .confidence-bar { width: 140px; height: 12px; background-color: #222; border: 2px solid #444; padding: 2px; }
        .confidence-fill { width: 100%; height: 100%; background-color: var(--ui-highlight); }

        .category-label { color: #888; font-size: 1.1rem; text-transform: uppercase; margin-bottom: -10px; }
        .definition { font-size: 1.7rem; line-height: 1.2; min-height: 70px; }

        .input-row {
            display: flex; align-items: center; gap: 10px;
            background: #1a1c20; padding: 10px 15px;
            border-radius: 4px; border: 1px solid #333;
        }
        .input-prompt { color: var(--ui-highlight); font-size: 1.8rem; }
        .term-input {
            background: transparent; border: none; color: #fff;
            font-family: 'VT323', monospace; font-size: 1.8rem;
            width: 100%; outline: none; text-transform: uppercase;
        }
        .term-input::placeholder { color: #555; }

        /* Subtle scanlines for screens */
        .scanlines {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0) 50%, rgba(0,0,0,0.15) 50%);
            background-size: 100% 4px; z-index: 100; pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Environment Layer -->
    <div class="studio-background"></div>
    <div class="lighting-grid"></div>
    <div class="fresnel-light light-1"></div>
    <div class="fresnel-light light-2"></div>
    <div class="fresnel-light light-3"></div>

    <!-- Sitcom Set Layer -->
    <div class="sitcom-set">
        <div class="boom-pole"><div class="boom-mic"></div></div>
        <div class="set-couch"></div>
        <div class="set-lamp"></div>
        <div class="actor actor-1"></div>
        <div class="actor actor-2"></div>
    </div>

    <!-- Animated Crew Layer -->
    <div class="intern"></div>

    <div class="camera-operator cam-1">
        <div class="lens"></div>
        <div class="operator-body"></div>
    </div>
    <div class="camera-operator cam-2">
        <div class="lens"></div>
        <div class="operator-body"></div>
    </div>
    <div class="camera-operator cam-3">
        <div class="lens"></div>
        <div class="operator-body"></div>
    </div>

    <div class="scanlines"></div>

    <!-- Video Village Foreground -->
    <div class="video-village">
        <div class="monitor-rig">
            <div class="tally-light"></div>
            <div class="monitor">
                <div class="feed-thirds"></div>
                <div class="camera-overlay">CAM 1: MCU</div>
            </div>
            <div class="monitor-label">CAM 1</div>
        </div>
        
        <div class="monitor-rig">
            <div class="tally-light tally-on"></div>
            <div class="monitor">
                <div class="feed-sitcom"></div>
                <div class="camera-overlay" style="color:var(--tally-red);">CAM 2: LIVE</div>
            </div>
            <div class="monitor-label" style="color:#fff; border: 1px solid var(--tally-red);">CAM 2 (MASTER)</div>
        </div>

        <div class="monitor-rig">
            <div class="tally-light"></div>
            <div class="monitor">
                <div class="feed-smpte"></div>
                <div class="camera-overlay">CAM 3: OTS</div>
            </div>
            <div class="monitor-label">CAM 3</div>
        </div>
    </div>

    <!-- Director's Gameplay Terminal -->
    <div class="terminal">
        <div class="terminal-header">
            <span class="term-title">SCENE: 4A | TAKE: 3</span>
            <span class="term-question">SHOT 41 / 75</span>
        </div>
        <div class="terminal-body">
            <div class="status-row">
                <div class="timer" id="game-timer">11.2s</div>
                <div class="confidence-container">
                    <span class="confidence-label">DIRECTOR CONFIDENCE</span>
                    <div class="confidence-bar">
                        <div class="confidence-fill"></div>
                    </div>
                </div>
            </div>

            <div class="category-label">Composition & Layout</div>
            <div class="definition">
                "What the eye is pulled to first; the visual center of interest."
            </div>

            <div class="input-row">
                <span class="input-prompt">INPUT:</span>
                <input type="text" class="term-input" placeholder="ENTER TERM..." autocomplete="off" autofocus spellcheck="false">
            </div>
        </div>
    </div>

</body>
</html>
