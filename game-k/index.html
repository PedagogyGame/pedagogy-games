
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rendering Wizardry - Live Soundstage</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --monitor-bezel: #16181d;
            --monitor-screen: #050508;
            --ui-text: #f4f4f5;
            --ui-highlight: #fbbf24;
            --tally-red: #ef4444;
            --correct-green: #4ade80;
            --wrong-red: #f87171;
        }

        body, html {
            margin: 0; padding: 0; width: 100vw; height: 100vh;
            font-family: 'VT323', monospace; background-color: #090a0f;
            overflow: hidden; color: var(--ui-text); user-select: none;
        }

        /* Canvas fills the screen as the game world */
        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: block;
            z-index: 1;
        }

        /* CRT Scanlines overlay */
        .scanlines {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
            background-size: 100% 4px; z-index: 10; pointer-events: none;
        }

        /* Video Village Monitors (Bottom Left) */
        .video-village {
            position: absolute; bottom: 4%; left: 3%; display: flex; gap: 20px; z-index: 20;
            pointer-events: none;
        }
        .monitor-rig { display: flex; flex-direction: column; align-items: center; gap: 8px; }
        
        .monitor {
            width: 210px; height: 145px; background-color: var(--monitor-screen);
            border: 10px solid var(--monitor-bezel); border-radius: 6px; position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,0,0,0.9);
            overflow: hidden;
        }
        .monitor-label {
            font-size: 1.3rem; color: #a1a1aa; background: #18181b; padding: 2px 10px; border-radius: 4px;
            letter-spacing: 1px; border: 1px solid #27272a;
        }

        /* Gameplay Terminal (Bottom Right) */
        .terminal {
            position: absolute; bottom: 4%; right: 3%; width: 460px; background-color: var(--monitor-screen);
            border: 12px solid var(--monitor-bezel); border-radius: 8px; 
            box-shadow: -15px 25px 50px rgba(0,0,0,0.95), inset 0 0 25px rgba(0,0,0,0.8);
            z-index: 20; display: flex; flex-direction: column; transition: border-color 0.3s ease;
        }
        .terminal.correct { border-color: var(--correct-green); }
        .terminal.wrong { border-color: var(--wrong-red); }

        .terminal-header {
            background-color: #18181b; border-bottom: 2px solid #27272a; padding: 8px 15px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .term-title { font-size: 1.2rem; color: #71717a; letter-spacing: 1px; }
        .term-question { font-size: 1.2rem; background: #27272a; color: #f4f4f5; padding: 2px 8px; border-radius: 4px; }

        .terminal-body { padding: 22px; display: flex; flex-direction: column; gap: 20px; }
        .status-row { display: flex; justify-content: space-between; align-items: center; }
        .timer { color: var(--ui-highlight); font-size: 3.2rem; line-height: 1; text-shadow: 0 0 10px rgba(251,191,36,0.4); }
        
        .category-label { color: #71717a; font-size: 1.2rem; text-transform: uppercase; margin-bottom: -10px; letter-spacing: 1px; }
        .definition { font-size: 1.8rem; line-height: 1.25; min-height: 75px; color: #f4f4f5; }

        .input-row {
            display: flex; align-items: center; gap: 12px; background: #121316;
            padding: 12px 18px; border-radius: 6px; border: 1px solid #27272a;
        }
        .input-prompt { color: var(--ui-highlight); font-size: 2rem; }
        .term-input {
            background: transparent; border: none; color: #fff; font-family: 'VT323', monospace;
            font-size: 2rem; width: 100%; outline: none; text-transform: uppercase; letter-spacing: 1px;
        }
        .term-input::placeholder { color: #3f3f46; }
    </style>
</head>
<body>

    <!-- Pixel Art Canvas Rendered Soundstage -->
    <canvas id="gameCanvas"></canvas>
    <div class="scanlines"></div>

    <!-- Video Village UI -->
    <div class="video-village">
        <div class="monitor-rig">
            <div class="monitor-label">CAM 1</div>
        </div>
        <div class="monitor-rig">
            <div class="monitor-label" style="color:#fff; border-color: var(--tally-red);">CAM 2 (LIVE)</div>
        </div>
    </div>

    <!-- Gameplay Terminal -->
    <div class="terminal" id="terminal-ui">
        <div class="terminal-header">
            <span class="term-title">SCENE: 4A | TAKE: 3</span>
            <span class="term-question" id="shot-counter">SHOT 1 / 3</span>
        </div>
        <div class="terminal-body">
            <div class="status-row">
                <div class="timer" id="game-timer">15.0s</div>
            </div>
            <div class="category-label" id="category">Composition & Layout</div>
            <div class="definition" id="definition">
                "What the eye is pulled to first; the visual center of interest."
            </div>
            <div class="input-row">
                <span class="input-prompt">></span>
                <input type="text" class="term-input" id="answer-input" placeholder="ENTER TERM..." autocomplete="off" autofocus spellcheck="false">
            </div>
        </div>
    </div>

    <!-- GAME ENGINE & PIXEL ART RENDERER -->
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Helper to draw pixel blocks easily
        function drawRect(x, y, w, h, color) {
            ctx.fillStyle = color;
            ctx.fillRect(Math.floor(x), Math.floor(y), w, h);
        }

        // Detailed Pixel Character Sprite Renderer
        function drawCharacter(x, y, shirtColor, hairColor, hasClipboard = false) {
            // Shadow
            drawRect(x - 2, y + 36, 20, 6, 'rgba(0,0,0,0.4)');
            // Legs / Pants
            drawRect(x + 3, y + 26, 4, 12, '#18181b');
            drawRect(x + 9, y + 26, 4, 12, '#18181b');
            // Torso / Shirt
            drawRect(x, y + 12, 16, 16, shirtColor);
            drawRect(x + 2, y + 14, 12, 12, lightenColor(shirtColor, 20)); // shading
            // Head / Skin
            drawRect(x + 2, y + 3, 12, 10, '#fde047');
            // Hair / Hat
            drawRect(x + 2, y + 1, 12, 4, hairColor);

            if (hasClipboard) {
                drawRect(x - 4, y + 16, 6, 8, '#f8fafc'); // Clipboard prop
                drawRect(x - 3, y + 17, 4, 6, '#3b82f6');
            }
        }

        function lightenColor(hex, percent) {
            return hex; // placeholder simplified for clean rendering
        }

        let animTimer = 0;

        function renderScene() {
            animTimer += 0.05;

            // 1. Background Studio Walls & Floor
            ctx.fillStyle = '#090a0f';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#181a20';
            ctx.fillRect(0, canvas.height * 0.38, canvas.width, canvas.height * 0.62);

            // Studio Grid Lines on Floor
            ctx.strokeStyle = '#222630';
            ctx.lineWidth = 2;
            for (let i = 0; i < canvas.width; i += 80) {
                ctx.beginPath();
                ctx.moveTo(i, canvas.height * 0.38);
                ctx.lineTo(i - 200, canvas.height);
                ctx.stroke();
            }

            // 2. Overhead Lighting Grid & Truss
            ctx.fillStyle = '#27272a';
            ctx.fillRect(0, 0, canvas.width, 18);
            for (let i = 40; i < canvas.width; i += 120) {
                drawRect(i, 18, 12, canvas.height * 0.38, 'rgba(0,0,0,0.6)'); // light beams
            }

            // 3. Sitcom Set (Apartment Living Room Interior)
            const setX = canvas.width * 0.22;
            const setY = canvas.height * 0.2;
            const setW = canvas.width * 0.56;
            const setH = canvas.height * 0.22;

            // Set Walls
            drawRect(setX, setY, setW, setH, '#5c3a21');
            // Wooden Floor of Set
            drawRect(setX, setY + setH - 15, setW, 15, '#b08053');

            // Set Props: Couch
            drawRect(setX + setW * 0.3, setY + setH - 45, 130, 35, '#7f1d1d');
            drawRect(setX + setW * 0.3 + 10, setY + setH - 55, 110, 15, '#991b1b'); // couch back
            // Set Props: Painting & Plant
            drawRect(setX + 40, setY + 20, 50, 35, '#1e293b');
            drawRect(setX + setW - 70, setY + setH - 50, 25, 40, '#15803d'); // plant

            // Sitcom Actors on Set
            let actorBob = Math.sin(animTimer * 2) * 2;
            drawCharacter(setX + setW * 0.38, setY + setH - 55 + actorBob, '#2563eb', '#1e293b');
            drawCharacter(setX + setW * 0.58, setY + setH - 55 - actorBob, '#16a34a', '#b45309');

            // 4. Craft Services & Gear Table (Upper Left)
            const tableX = canvas.width * 0.08;
            const tableY = canvas.height * 0.35;
            drawRect(tableX, tableY, 120, 8, '#27272a');
            drawRect(tableX + 10, tableY + 8, 6, 20, '#090a0f');
            drawRect(tableX + 100, tableY + 8, 6, 20, '#090a0f');
            // Coffee Urn (Silver)
            drawRect(tableX + 20, tableY - 22, 18, 22, '#e4e4e7');
            drawRect(tableX + 38, tableY - 12, 4, 3, '#18181b'); // spout
            // Gear Case
            drawRect(tableX + 65, tableY - 16, 35, 16, '#18181b');

            // 5. Dozens of Background Workers & Crew
            drawCharacter(tableX - 20, tableY - 10, '#52525b', '#27272a');
            drawCharacter(tableX + 130, tableY - 10, '#71717a', '#3f3f46');
            
            // Pacing crew members
            let pace1 = (animTimer * 15) % (canvas.width * 0.4);
            drawCharacter(canvas.width * 0.15 + pace1, canvas.height * 0.32, '#0284c7', '#0f172a');

            // Assistant Director with Clipboard
            drawCharacter(canvas.width * 0.8, canvas.height * 0.36, '#334155', '#475569', true);

            // 6. Camera Crew & Director in Foreground
            // Camera 1
            drawCameraRig(canvas.width * 0.25, canvas.height * 0.45, false);
            // Camera 2 (Live Master)
            drawCameraRig(canvas.width * 0.48, canvas.height * 0.48, true);
            // Camera 3
            drawCameraRig(canvas.width * 0.72, canvas.height * 0.45, false);

            // Director pacing near video village
            let dirPace = Math.sin(animTimer) * 20;
            drawCharacter(canvas.width * 0.38 + dirPace, canvas.height * 0.52, '#0f172a', '#334155');

            requestAnimationFrame(renderScene);
        }

        function drawCameraRig(x, y, isLive) {
            // Pedestal stand
            drawRect(x + 15, y + 20, 12, 60, '#3f3f46');
            // Camera Body
            drawRect(x, y, 42, 28, '#1e293b');
            // Viewfinder & Tally Light
            drawRect(x + 10, y - 8, 14, 8, '#0f172a');
            drawRect(x + 32, y + 4, 6, 6, isLive ? '#ef4444' : '#27272a'); // Tally light
            // Lens
            drawRect(x + 42, y + 6, 25, 16, '#475569');
            // Operator behind camera
            drawCharacter(x - 20, y + 4, '#475569', '#fcd34d');
        }

        // Start render loop
        requestAnimationFrame(renderScene);

        // Game Logic
        document.addEventListener('DOMContentLoaded', () => {
            const inputField = document.getElementById('answer-input');
            const defDisplay = document.getElementById('definition');
            const catDisplay = document.getElementById('category');
            const shotCounter = document.getElementById('shot-counter');
            const terminalUI = document.getElementById('terminal-ui');

            const gameData = [
                { term: "FOCAL POINT", category: "Composition & Layout", def: '"What the eye is pulled to first; the visual center of interest."' },
                { term: "PAN", category: "Camera Movements", def: '"Horizontal pivot from a fixed point."' },
                { term: "DUTCH ANGLE", category: "Camera Angles", def: '"Tilted horizon; unease, disorientation, tension."' }
            ];

            let currentIndex = 0;

            function loadQuestion() {
                defDisplay.textContent = gameData[currentIndex].def;
                catDisplay.textContent = gameData[currentIndex].category;
                shotCounter.textContent = `SHOT ${currentIndex + 1} / ${gameData.length}`;
                inputField.value = '';
                inputField.focus();
            }

            inputField.addEventListener('keypress', function (e) {
                if (e.key === 'Enter') {
                    e.preventDefault(); 
                    const playerAnswer = inputField.value.trim().toUpperCase();
                    const correctAnswer = gameData[currentIndex].term.toUpperCase();

                    if (playerAnswer === correctAnswer) {
                        terminalUI.classList.add('correct');
                        inputField.style.color = 'var(--correct-green)';
                    } else {
                        terminalUI.classList.add('wrong');
                        inputField.style.color = 'var(--wrong-red)';
                        inputField.value = `CORRECT: ${correctAnswer}`;
                    }

                    setTimeout(() => {
                        terminalUI.classList.remove('correct', 'wrong');
                        inputField.style.color = '';
                        currentIndex = (currentIndex + 1) % gameData.length;
                        loadQuestion();
                    }, 1500);
                }
            });

            loadQuestion();
        });
    </script>
</body>
</html>
