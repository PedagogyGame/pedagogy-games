  box-shadow:0 28px 80px rgba(8,27,18,.42),inset 0 0 0 5px rgba(44,83,56,.05);
}
.intro-panel::before,.result-panel::before { content:""; position:absolute; left:0; top:22px; bottom:22px; width:4px; background:#a85839; }
.eyebrow { display:block; margin-bottom:11px; color:#9c593e; font-size:9px; font-weight:700; letter-spacing:.22em; }
.intro-panel h2,.result-panel h2 { margin:0; font:400 clamp(35px,4.2vw,64px)/.98 Georgia,serif; letter-spacing:-.04em; }
.intro-panel h2 em { color:#557549; font-weight:400; }
.intro-panel>p,.result-panel>p { max-width:530px; margin:18px 0; color:#4c5b4c; font:14px/1.65 Arial,sans-serif; }
.rules-row { display:flex; gap:10px; margin:22px 0; }
.rules-row div { min-width:110px; padding:10px 12px; border-left:1px solid #adb99c; }
.rules-row b { display:block; font:400 23px/1 Georgia,serif; color:#315b3e; }.rules-row span { display:block; margin-top:4px; color:#707b69; font-size:8px; text-transform:uppercase; letter-spacing:.12em; }
.primary-button { border:0; background:#244f38; color:#f6efce; padding:14px 18px; box-shadow:0 8px 20px rgba(16,54,34,.18); cursor:pointer; font-size:12px; font-weight:700; letter-spacing:.03em; transition:transform .2s ease,background .2s ease; }
.primary-button:hover { transform:translateY(-2px); background:#173d2b; }.primary-button span{margin-left:12px;color:#dcc76e;font-size:17px}
.intro-panel>small { display:block; margin-top:12px; color:#778173; font-size:9px; }

.question-dock {
  position:absolute;
  z-index:65;
  left:clamp(16px,3vw,48px);
  bottom:clamp(25px,4.5vh,58px);
  width:min(780px,calc(100vw - 32px));
  min-height:230px;
  padding:23px 122px 20px 27px;
  color:#163326;
  background:linear-gradient(135deg,rgba(255,251,236,.97),rgba(237,236,207,.95));
  border:1px solid rgba(255,255,245,.82);
  box-shadow:0 25px 80px rgba(7,27,18,.38),inset 0 0 0 5px rgba(45,82,55,.045);
  backdrop-filter:blur(10px);
}
.question-dock::before { content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;background:var(--timer-accent,#64a15c);transition:background .4s ease; }
.timer-green{--timer-accent:#5c9d61}.timer-yellow{--timer-accent:#d2aa3d}.timer-red{--timer-accent:#b94e38}
.question-meta { display:flex; align-items:center; gap:12px; }
.difficulty { padding:5px 7px; color:white; font-size:8px; font-weight:800; letter-spacing:.14em; border-radius:2px; }
.difficulty-easy{background:#507c55}.difficulty-medium{background:#a67a34}.difficulty-difficult{background:#894938}
.recall-label{font-size:8px;letter-spacing:.18em;color:#788070;font-weight:700}
.question-dock blockquote { margin:14px 0 17px; font:400 clamp(21px,2.15vw,32px)/1.12 Georgia,serif; letter-spacing:-.02em; }
.answer-form { position:relative; display:grid; grid-template-columns:1fr auto; gap:8px; }
.answer-form label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.answer-form input { min-width:0; padding:12px 14px; border:1px solid #aab29a; outline:0; background:rgba(255,255,249,.66); color:#173b2a; border-radius:2px; box-shadow:inset 0 2px 3px rgba(44,65,48,.06); }
.answer-form input:focus { border-color:#4f8058; box-shadow:0 0 0 3px rgba(79,128,88,.15); }
.answer-form button { border:0; padding:0 17px; background:#29513a;color:#f4f0d8;cursor:pointer;font-size:11px;font-weight:700; }
.answer-form button:disabled{opacity:.42;cursor:default}.answer-form button span{color:#d4c06d;margin-left:8px}
.answer-form small { grid-column:1/-1;color:#778171;font-size:8px;letter-spacing:.02em; }
.timer-wrap { position:absolute; right:20px; top:50%; width:82px; height:82px; transform:translateY(-50%); border-radius:50%; display:grid;place-items:center; }
.timer-wrap b { position:relative;z-index:2;font:400 31px/1 Georgia,serif;color:var(--timer-accent); }
.timer-caption{position:absolute;z-index:2;top:59px;font-size:6px;letter-spacing:.17em;color:#7b8274}
.timer-ring { position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--timer-accent) var(--timer-progress),rgba(55,78,59,.12) 0);mask:radial-gradient(circle,transparent 60%,#000 62%);-webkit-mask:radial-gradient(circle,transparent 60%,#000 62%); }
.feedback-line { display:flex;align-items:center;gap:12px;min-height:52px;border-top:1px solid #c8cbb6;padding-top:12px; }
.feedback-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#507e57;color:white;font-size:19px}.feedback-wrong .feedback-mark{background:#a54e39}
.feedback-line div{display:flex;flex-direction:column;gap:3px}.feedback-line b{font:400 18px Georgia,serif}.feedback-line small{color:#717b6d;font-size:9px}.feedback-line strong{margin-left:auto;color:#984d38;font:400 19px Georgia,serif}

.result-panel { width:min(660px,calc(100vw - 44px)); max-height:calc(100vh - 140px); overflow:auto; }
.result-panel h2 { font-size:clamp(34px,3.8vw,58px); }
.result-stats { display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:20px 0; }
.result-stats div{padding:11px;border:1px solid #bdc3a9;background:rgba(255,255,250,.34)}.result-stats b{display:block;font:400 23px Georgia,serif;color:#315b3e}.result-stats span{font-size:7px;text-transform:uppercase;letter-spacing:.12em;color:#77806e}
.review-list { margin:15px 0;border-top:1px solid #b7bda5;border-bottom:1px solid #b7bda5;padding:10px 0; }.review-list summary{cursor:pointer;font-size:10px;font-weight:700;letter-spacing:.08em;color:#445c47}.review-list>div{max-height:145px;overflow:auto;margin-top:8px}.review-list p{display:grid;grid-template-columns:140px 1fr;gap:10px;margin:0;padding:6px 3px;border-top:1px solid rgba(145,157,133,.22);font-size:10px}.review-list p span{color:#627061}
.result-lost::before{background:#7f4635}

.game-footer { position:absolute;z-index:58;left:0;right:0;bottom:0;height:25px;display:flex;justify-content:space-between;align-items:center;padding:0 17px;color:rgba(225,231,204,.54);background:rgba(12,34,24,.48);font-size:7px;text-transform:uppercase;letter-spacing:.18em; }
.footer-status i{display:inline-block;width:5px;height:5px;background:#9abc74;border-radius:50%;margin-right:5px;box-shadow:0 0 7px #9abc74}

@keyframes plant-breathe { 0%,100%{rotate:-.6deg}50%{rotate:.8deg} }
@keyframes hanging-sway { 0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.7deg)} }
@keyframes fan-spin { to{transform:rotate(360deg)} }
@keyframes mist-pulse { 0%,68%,100%{opacity:0;transform:scale(.8)}76%,90%{opacity:.7;transform:scale(1.1)} }
@keyframes keeper-work { from{rotate:-10deg}to{rotate:18deg} }
@keyframes keeper-urgency { from{translate:-1px 0}to{translate:1px -1px} }
@keyframes cat-roam { 0%,8%{transform:translate(0,0)}20%,28%{transform:translate(170px,-42px)}42%,50%{transform:translate(290px,-120px)}64%,70%{transform:translate(145px,-164px)}84%,92%{transform:translate(-40px,-72px)}100%{transform:translate(0,0)} }
@keyframes cat-mischief { from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-5px) rotate(3deg)} }
@keyframes locator-pulse { 0%{scale:.7;opacity:0}35%{opacity:.75}100%{scale:1.45;opacity:0} }
@keyframes sun-shift { from{translate:-5% 0;opacity:.7}to{translate:12% 0;opacity:1} }
@keyframes leaf-drop { 0%{translate:0 -20px;rotate:0;opacity:0}20%{opacity:.8}100%{translate:35px 110px;rotate:380deg;opacity:0} }
@keyframes greenhouse-jolt { 0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}60%{transform:translateX(3px)} }

@media (max-width: 900px) {
  .top-hud { height:88px;grid-template-columns:1fr 145px auto;padding:13px 17px; }
  .shift-progress{display:none}.brand-kicker{display:none}.brand-lockup h1{font-size:26px}
  .event-card{top:98px;right:14px;width:240px;padding:13px 15px}.event-card p{font-size:10px;margin:8px 0}.event-card h2{font-size:18px}
  .question-dock{bottom:25px;min-height:210px;width:calc(100vw - 28px);left:14px;padding:19px 102px 17px 20px}.question-dock blockquote{font-size:22px}.timer-wrap{right:12px;width:72px;height:72px}
  .station-label{display:none}.keeper-tool{display:none}.distance-label{display:none}
}

@media (max-width: 620px) {
  body{overflow:auto}.game-shell{min-height:780px}
  .top-hud{grid-template-columns:1fr 128px;padding:10px 12px}.sound-button{position:absolute;right:12px;top:67px;font-size:0;padding:8px}.sound-button span{font-size:11px;margin:0}.health-copy span{font-size:6px}.health-copy b{font-size:11px}
  .event-card{top:104px;left:12px;right:auto;width:calc(100vw - 24px);padding:10px 12px;background:rgba(18,47,33,.82)}.event-card p{display:none}.tool-readout{display:none}
  .greenhouse-scene{height:560px}.t-floor{inset:11% 0 4%}.glass-frame{inset:9% -2% 2%}.station{scale:.75}.plant{scale:.8}.hanging-zone{scale:.75}.cat{scale:.75}
  .question-dock{top:360px;bottom:auto;min-height:264px;padding:18px 18px 91px;width:calc(100vw - 20px);left:10px}.question-dock blockquote{font-size:22px;margin:12px 0}.timer-wrap{top:auto;bottom:8px;right:15px;transform:none;width:67px;height:67px}.timer-caption{top:49px}.answer-form{grid-template-columns:1fr}.answer-form button{height:39px}.answer-form small{display:none}
  .intro-panel,.result-panel{left:10px;bottom:auto;top:132px;width:calc(100vw - 20px);padding:23px;max-height:590px}.intro-panel h2{font-size:38px}.intro-panel>p{font-size:12px}.rules-row{gap:2px}.rules-row div{min-width:0;flex:1;padding:8px}.rules-row b{font-size:19px}.result-stats{grid-template-columns:repeat(2,1fr)}
  .game-footer{display:none}
}

@media (prefers-reduced-motion: reduce) {
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}
}
