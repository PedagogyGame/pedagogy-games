<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Chinese Character Study · 2001–2100</title>
<style>
:root{--ink:#24141c;--muted:#78605c;--paper:#f6eef0;--panel:#f9f2f4;--line:#ccb4b8;--deep:#381820;--good:#2a5c3c;--bad:#8a2f27;--gold:#c4a06a}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(1200px 700px at 12% -10%,rgba(230,170,180,.32),transparent 52%),linear-gradient(180deg,#8a5a68 0%,#d8c0c4 42%,#5c3a44 100%);color:var(--ink);font-family:Georgia,"Times New Roman","Noto Serif SC","Songti SC",serif;overflow:hidden}
.app{height:100vh;display:grid;grid-template-rows:auto 1fr;gap:0}
.topbar{min-height:58px;display:flex;align-items:center;gap:14px;padding:8px 18px;background:rgba(36,18,26,.96);color:#f4e8ec;border-bottom:2px solid #c4a06a}
.brand{font-size:18px;font-weight:700;letter-spacing:.05em;white-space:nowrap}.brand small{font-size:12px;font-weight:400;opacity:.7;margin-left:8px}
.progress{flex:1;max-width:460px;height:7px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:#c4a06a;width:1%;transition:width .25s ease}
.stat{font-size:13px;opacity:.88;white-space:nowrap}.topbtn{border:1px solid rgba(255,255,255,.28);background:transparent;color:white;border-radius:8px;padding:7px 10px;cursor:pointer}
.main{min-height:0;display:grid;grid-template-columns:minmax(390px,46%) 1fr;gap:18px;padding:18px}
.quiz{min-height:0;background:rgba(244,248,246,.97);border:2px solid #6b3a4c;box-shadow:inset 0 0 0 6px #ecdce0,0 16px 48px rgba(36,18,26,.26);border-radius:4px;padding:18px 22px 16px;display:flex;flex-direction:column;overflow:auto}
.rankline{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.09em}
.character{text-align:center;font-family:"Noto Serif SC","Songti SC","STSong",serif;font-size:clamp(92px,11vw,164px);line-height:.95;margin:8px 0 0;color:#24141c;text-shadow:0 1px 0 #fff}
.pinyin{text-align:center;font-size:clamp(24px,2.6vw,39px);font-style:italic;color:#6b3a4c;margin:0 0 8px}
.front-pinyin{display:none}.prompt{text-align:center;font-size:16px;margin:2px 0 8px;color:#78605c}
button{font:600 13px/1.1 Georgia,serif;letter-spacing:.03em}
.controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:3px 0 7px}.controls .nav{display:flex;gap:6px;margin-right:6px}.ghost,.action{padding:9px 12px;border-radius:8px;cursor:pointer}.ghost{border:1px solid #8aa8ac;background:#f4e8ec;color:#3a1c28}.action{border:1px solid #6b3a4c;background:#6b3a4c;color:#fff}
.reveal{border-top:1px solid #c5d4d2;padding-top:9px;margin-top:2px;animation:fade .18s ease}.reveal-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:5px}.reveal-pinyin{font-size:clamp(27px,2.8vw,42px);font-style:italic;color:#6b3a4c;font-weight:700}.definition{font-size:20px;margin:0}.definition b{color:#2a4a4c}.wordtitle,.extitle{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:#78605c;margin:9px 0 4px;font-weight:700}.wordlist{display:flex;gap:6px;flex-wrap:wrap}.wordchip{background:#e4eeec;border:1px solid #c3d4d0;border-radius:7px;padding:5px 8px;line-height:1.18}.wordchip .wzh{font-family:"Noto Serif SC","Songti SC",serif;font-size:19px;font-weight:700}.wordchip .wpy{font-size:13px;font-style:italic;color:#7a4a58}.wordchip .wen{font-size:12px;color:#4f5e5c}.examples{display:grid;gap:5px}.example{padding:6px 9px;background:#f6eef0;border-left:3px solid #6b3a4c;border-radius:5px;line-height:1.22}.example-zh{font-family:"Noto Serif SC","Songti SC",serif;font-size:clamp(19px,1.65vw,25px)}.example-py{font-size:clamp(14px,1.1vw,17px);font-style:italic;color:#7a4a58;margin-top:2px}.example-en{font-size:clamp(13px,1vw,16px);color:#4f463f;margin-top:2px}.example em{font-style:normal;font-weight:800;color:#8d2f21;background:#d7e4de;border-radius:3px;padding:0 .05em}
.flipcard{margin-top:3px;border:1px solid #9ab0b0;border-radius:4px;padding:12px 14px;background:#f6eef0}.flipcard h3{margin:0 0 7px;font-size:15px;color:#7a4a58;text-transform:uppercase;letter-spacing:.08em}.english-list{font-size:clamp(22px,2vw,32px);line-height:1.2;margin:4px 0 10px}.flipcard .reveal-pinyin{margin:0 0 6px}.further{border:1px solid #6b3a4c;background:transparent;color:#6b3a4c;border-radius:8px;padding:8px 11px;cursor:pointer}
.imagepane{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;background:rgba(28,14,20,.94);border:2px solid #381820;border-radius:4px;overflow:hidden;box-shadow:inset 0 0 0 7px rgba(196,163,106,.22),0 16px 48px rgba(36,18,26,.3)}
.imagepane:before{content:"";position:absolute;inset:8px;border:1px solid rgba(196,163,106,.5);border-radius:3px;pointer-events:none}.art{display:block;max-width:94%;max-height:90%;width:auto;height:auto;object-fit:contain;filter:saturate(.98) contrast(1.02);box-shadow:0 8px 32px rgba(0,0,0,.28);transition:opacity .35s ease,transform .35s ease}.art.wide{max-width:98%;max-height:84%}

@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@media(max-width:900px){body{overflow:auto}.app{height:auto;min-height:100vh}.main{grid-template-columns:1fr;grid-template-rows:auto minmax(360px,55vh)}.quiz{overflow:visible}.imagepane{min-height:420px}.topbar{flex-wrap:wrap}.progress{order:3;flex-basis:100%;max-width:none}}
@media(max-width:520px){.main{padding:9px;gap:9px}.quiz{padding:14px}.brand small{display:none}.character{font-size:104px}.example{font-size:20px}.topbar{padding:8px 10px}.stat.scoreStat{display:none}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">汉字 2001–2100 <small>recognition + study</small></div>
    <div class="progress"><i id="progressFill"></i></div>
    <div class="stat" id="cardStat"></div>
    <button class="topbtn" id="shuffleBtn">Shuffle</button>
    <button class="topbtn" id="resetBtn">Reset order</button>
  </header>

  <main class="main">
    <section class="quiz">
      <div class="rankline"><span id="rankLabel"></span></div>
      <div class="character" id="char"></div>
      <div class="pinyin front-pinyin" id="pinyin" aria-hidden="true"></div>
      <div class="prompt">Recognize the character first. Reveal for pinyin, meanings, common words, and fully translated examples.</div>
      <div class="controls">
        <div class="nav"><button class="ghost" id="prevBtn">← Previous</button><button class="ghost" id="nextBtn">Next →</button></div>
        <button class="action" id="revealBtn">Reveal</button>
        <button class="ghost" id="flipBtn">Flip</button>
      </div>
      <div id="detailArea"></div>
    </section>

    <section class="imagepane" id="imagePane">
      <img class="art" id="art" alt="Chinese art and material culture study image">
    </section>
  </main>
</div>
<script>

":"niǎo luǎn","en":"bird egg"},{"zh":"卵石","pinyin":"luǎn shí","en":"pebble"},{"zh":"产卵","pinyin":"chǎn luǎn","en":"lay eggs"}],"examples":[{"zh":"溪水里铺满了圆圆的卵石。","pinyin":"xī shuǐ lǐ pū mǎn le yuán yuán de luǎn shí.","en":"The stream bed is covered with round pebbles."},{"zh":"春天青蛙开始产卵。","pinyin":"chūn tiān qīng wā kāi shǐ chǎn luǎn.","en":"In spring the frogs begin to lay eggs."}]},{"rank":2009,"char":"氛","pinyin":"fēn","meanings":["atmosphere"],"words":[{"zh":"气氛","pinyin":"qì fēn","en":"atmosphere"},{"zh":"氛围","pinyin":"fēn wéi","en":"atmosphere; mood"},{"zh":"战氛","pinyin":"zhàn fēn","en":"atmosphere of war"},{"zh":"祥氛","pinyin":"xiáng fēn","en":"auspicious air"}],"examples":[{"zh":"会场的气氛十分热烈。","pinyin":"huì chǎng de qì fēn shí fēn rè liè.","en":"The atmosphere at the meeting was extremely lively."},{"zh":"烛光给房间添了温馨的氛围。","pinyin":"zhú guāng gěi fáng jiān tiān le wēn xīn de fēn wéi.","en":"Candlelight added a warm atmosphere to the room."}]},{"rank":2010,"char":"泄","pinyin":"xiè","meanings":["leak","divulge"],"words":[{"zh":"泄露","pinyin":"xiè lòu","en":"leak; disclose"},{"zh":"泄密","pinyin":"xiè mì","en":"divulge a secret"},{"zh":"发泄","pinyin":"fā xiè","en":"give vent to"},{"zh":"泄气","pinyin":"xiè qì","en":"lose heart; deflate"}],"examples":[{"zh":"这件事千万不能泄露。","pinyin":"zhè jiàn shì qiān wàn bù néng xiè lòu.","en":"This matter must not be leaked."},{"zh":"失败几次后他有些泄气。","pinyin":"shī bài jǐ cì hòu tā yǒu xiē xiè qì.","en":"After failing several times he was a bit deflated."}]},{"rank":2011,"char":"杆","pinyin":"gān","meanings":["pole","rod"],"words":[{"zh":"旗杆","pinyin":"qí gān","en":"flagpole"},{"zh":"栏杆","pinyin":"lán gān","en":"railing"},{"zh":"笔杆","pinyin":"bǐ gǎn","en":"penholder"},{"zh":"电线杆","pinyin":"diàn xiàn gān","en":"utility pole"}],"examples":[{"zh":"广场上竖着一根高旗杆。","pinyin":"guǎng chǎng shàng shù zhe yì gēn gāo qí gān.","en":"A tall flagpole stands in the square."},{"zh":"桥边的栏杆刚刷过漆。","pinyin":"qiáo biān de lán gān gāng shuā guò qī.","en":"The railing by the b
