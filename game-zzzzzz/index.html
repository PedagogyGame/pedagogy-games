<!doctype html>
<html lang="en">
<head>

<title>Chinese Character Study · 2901–3000</title>
<style>
:root{--ink:#121820;--muted:#5a6878;--paper:#eef3f6;--panel:#f3f7f9;--line:#b8c4d0;--deep:#182430;--good:#2a4c5c;--bad:#8a2f27;--gold:#c48848}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(1200px 700px at 12% -10%,rgba(70,130,170,.32),transparent 52%),linear-gradient(180deg,#243848 0%,#c4d0d8 42%,#182830 100%);color:var(--ink);font-family:Georgia,"Times New Roman","Noto Serif SC","Songti SC",serif;overflow:hidden}
.app{height:100vh;display:grid;grid-template-rows:auto 1fr;gap:0}
.topbar{min-height:58px;display:flex;align-items:center;gap:14px;padding:8px 18px;background:rgba(16,24,36,.96);color:#e4eef4;border-bottom:2px solid #c48848}
.brand{font-size:18px;font-weight:700;letter-spacing:.05em;white-space:nowrap}.brand small{font-size:12px;font-weight:400;opacity:.7;margin-left:8px}
.progress{flex:1;max-width:460px;height:7px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:#c48848;width:1%;transition:width .25s ease}
.stat{font-size:13px;opacity:.88;white-space:nowrap}.topbtn{border:1px solid rgba(255,255,255,.28);background:transparent;color:white;border-radius:8px;padding:7px 10px;cursor:pointer}
.main{min-height:0;display:grid;grid-template-columns:minmax(390px,46%) 1fr;gap:18px;padding:18px}
.quiz{min-height:0;background:rgba(243,247,249,.97);border:2px solid #3a5870;box-shadow:inset 0 0 0 6px #dce4e8,0 16px 48px rgba(16,24,36,.26);border-radius:4px;padding:18px 22px 16px;display:flex;flex-direction:column;overflow:auto}
.rankline{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.09em}
.character{text-align:center;font-family:"Noto Serif SC","Songti SC","STSong",serif;font-size:clamp(92px,11vw,164px);line-height:.95;margin:8px 0 0;color:#121820;text-shadow:0 1px 0 #fff}
.pinyin{text-align:center;font-size:clamp(24px,2.6vw,39px);font-style:italic;color:#3a5870;margin:0 0 8px}
.front-pinyin{display:none}.prompt{text-align:center;font-size:16px;margin:2px 0 8px;color:#5a6878}
button{font:600 13px/1.1 Georgia,serif;letter-spacing:.03em}

.flipcard{margin-top:3px;border:1px solid #9aadb0;border-radius:4px;padding:12px 14px;background:#eef3f6}.flipcard h3{margin:0 0 7px;font-size:15px;color:#4a6070;text-transform:uppercase;letter-spacing:.08em}.english-list{font-size:clamp(22px,2vw,32px);line-height:1.2;margin:4px 0 10px}.flipcard .reveal-pinyin{margin:0 0 6px}.further{border:1px solid #3a5870;background:transparent;color:#3a5870;border-radius:8px;padding:8px 11px;cursor:pointer}
.imagepane{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;background:rgba(12,18,24,.94);border:2px solid #182430;border-radius:4px;overflow:hidden;box-shadow:inset 0 0 0 7px rgba(196,140,80,.22),0 16px 48px rgba(16,24,36,.3)}

@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@media(max-width:900px){body{overflow:auto}.app{height:auto;min-height:100vh}.main{grid-template-columns:1fr;grid-template-rows:auto minmax(360px,55vh)}.quiz{overflow:visible}.imagepane{min-height:420px}.topbar{flex-wrap:wrap}.progress{order:3;flex-basis:100%;max-width:none}}
@media(max-width:520px){.main{padding:9px;gap:9px}.quiz{padding:14px}.brand small{display:none}.character{font-size:104px}.example{font-size:20px}.topbar{padding:8px 10px}.stat.scoreStat{display:none}}
</style>
</head>

</div>
