<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ancient Egypt 101</title>
    <style>
        :root {
            --power-color: #4CAF50;
            --bg-color: #1a1511;
            --text-color: #e6d7c3;
            --woozy-level: 0;
            --blur-level: 0px;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            background-color: #000;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #game-wrapper {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 100vh;
            max-height: 600px;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle, #2a221b 0%, #0a0806 100%);
            border: 2px solid #5c4a3d;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            border-radius: 10px;
            overflow: hidden;
            transition: transform 2s ease-in-out, opacity 2s ease-in-out;
        }

        /* The Woozy / Pallid Effect */
        #game-content {
            height: 100%;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            filter: grayscale(var(--woozy-level)) sepia(calc(var(--woozy-level) * 0.5)) blur(var(--blur-level));
            transition: filter 1s ease-out;
        }

        /* Tremor Animation */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .tremor {
            animation: shake 0.4s;
        }

        /* UI Elements */
        #top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #5c4a3d;
            padding-bottom: 10px;
        }

        #power-container {
            flex-grow: 1;
            margin: 0 20px;
            background: #333;
            height: 20px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #000;
        }

        #power-bar {
            height: 100%;
            width: 100%;
            background-color: var(--power-color);
            transition: width 0.5s ease-out, background-color 0.5s ease-out;
        }

        #timer {
            font-size: 24px;
            font-weight: bold;
            color: #ff9800;
        }

        /* Room & Question Content */
        #room-title {
            text-align: center;
            margin-top: 0;
            color: #d4af37;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #artifact-display {
            text-align: center;
            margin: 15px 0;
        }

        #artifact-image {
            max-width: 100%;
            height: 180px;
            border-radius: 8px;
            border: 2px solid #5c4a3d;
            box-shadow: 0 4px 8px rgba(0,0,0,0.6);
        }

        #definition-box {
            background: rgba(0, 0, 0, 0.4);
            padding: 15px;
            border-radius: 8px;
            font-size: 18px;
            text-align: center;
            margin-bottom: 20px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Input Area */
        #input-area {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        input[type="text"] {
            padding: 10px;
            font-size: 16px;
            border: 1px solid #5c4a3d;
            background: #111;
            color: #fff;
            border-radius: 5px;
            width: 60%;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #d4af37;
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover { background-color: #f1c40f; }

        #feedback {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            height: 24px;
        }

        /* Full Screen Overlays */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            background-color: #000;
            z-index: 10;
        }

        #win-screen {
            background: url('https://images.unsplash.com/photo-1604018318392-5d97f259695d?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80') center/cover;
            color: #fff;
            text-shadow: 2px 2px 8px #000;
        }
        
        #win-screen h1 { font-size: 48px; color: #d4af37; }

        #start-screen h1 { color: #d4af37; }
        .danger-text { color: #ff4c4c; font-size: 24px; margin-bottom: 20px; }

    </style>
</head>
<body>

<div id="game-wrapper">
    <!-- Start Screen -->
    <div id="start-screen" class="overlay" style="display: flex;">
        <h1>Ancient Egypt 101</h1>
        <p>Survive the 3 chambers by identifying the artifacts. Answer in under 10s for a bonus!</p>
        <button onclick="startGame()">Enter the Tomb</button>
    </div>

    <!-- Main Game UI -->
    <div id="game-content">
        <div id="top-bar">
            <div>Room <span id="room-indicator">1</span>/3</div>
            <div id="power-container">
                <div id="power-bar"></div>
            </div>
            <div id="timer">15s</div>
        </div>

        <h2 id="room-title">Chamber of Scribes</h2>
        
        <div id="artifact-display">
            <!-- Placeholders used to simulate visual elements related to the terms -->
            <img id="artifact-image" src="" alt="Artifact Visual">
        </div>

        <div id="definition-box">Loading...</div>

        <div id="input-area">
            <input type="text" id="answer-input" placeholder="Name the artifact..." autocomplete="off">
            <button onclick="submitAnswer()">Submit</button>
        </div>

        <div id="feedback"></div>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-screen" class="overlay">
        <h1 style="color:#ff4c4c;">You Perished</h1>
        <p id="death-message" class="danger-text"></p>
        <button onclick="location.reload()">Try Again</button>
    </div>

    <!-- Win Screen -->
    <div id="win-screen" class="overlay">
        <h1>Victory!</h1>
        <p style="font-size: 20px;">You have escaped the tomb with ancient knowledge.</p>
        <button onclick="location.reload()" style="margin-top:20px;">Play Again</button>
    </div>
</div>

<script>
    // 30 Artifacts Database, split logically. Difficulties assigned for penalty logic.
    const artifacts = [
        // ROOM 1
        { term: "Rosetta Stone", def: "Inscribed decree that enabled decipherment of hieroglyphs.", diff: "easy" },
        { term: "Narmer Palette", def: "Ceremonial palette depicting Egypt’s early royal unification.", diff: "hard" },
        { term: "Nefertiti Bust", def: "Painted limestone portrait of Queen Nefertiti.", diff: "medium" },
        { term: "Tutankhamun's Gold Mask", def: "Gold funerary mask covering the young pharaoh’s mummy.", diff: "easy" },
        { term: "Tutankhamun's Throne", def: "Elaborately decorated royal chair from his tomb.", diff: "medium" },
        { term: "Tutankhamun's Coffins", def: "Nested anthropoid coffins enclosing the king’s mummy.", diff: "medium" },
        { term: "Merneptah Stele", def: "Victory inscription containing an early reference to Israel.", diff: "hard" },
        { term: "Book of the Dead of Ani", def: "Famous illustrated papyrus of funerary spells.", diff: "medium" },
        { term: "Papyrus of Hunefer", def: "Funerary manuscript famous for its judgment scene.", diff: "hard" },
        { term: "Seated Scribe", def: "Famous Old Kingdom painted statue of a scribe.", diff: "easy" },
        // ROOM 2
        { term: "Khafre Enthroned", def: "Diorite statue portraying the pharaoh under Horus’s protection.", diff: "hard" },
        { term: "Menkaure Triads", def: "Sculptural groups showing Menkaure with deities.", diff: "hard" },
        { term: "Rahotep and Nofret", def: "Exceptionally preserved painted Old Kingdom statues.", diff: "hard" },
        { term: "Colossi of Memnon", def: "Enormous seated statues of Amenhotep III.", diff: "medium" },
        { term: "Dendera Zodiac", def: "Egyptian temple relief depicting the heavens and constellations.", diff: "medium" },
        { term: "Canopic jar", def: "Container traditionally used for embalmed internal organs.", diff: "easy" },
        { term: "Shabti", def: "Funerary figurine intended to work for the deceased. (Also known as Ushabti)", diff: "medium" },
        { term: "Scarab", def: "Beetle-shaped amulet associated with renewal and rebirth.", diff: "easy" },
        { term: "Heart scarab", def: "Funerary amulet protecting the heart during judgment.", diff: "medium" },
        { term: "Ankh", def: "Cross-shaped symbol representing life.", diff: "easy" },
        // ROOM 3
        { term: "Djed pillar", def: "Symbol representing stability and associated with Osiris.", diff: "medium" },
        { term: "Was scepter", def: "Staff symbolizing divine power and dominion.", diff: "medium" },
        { term: "Eye of Horus", def: "Protective symbol associated with restoration and wholeness.", diff: "easy" },
        { term: "Sistrum", def: "Sacred rattling musical instrument used in worship.", diff: "hard" },
        { term: "Menat", def: "Beaded ritual necklace associated especially with Hathor.", diff: "hard" },
        { term: "Faience", def: "Glazed silica material prized for brilliant blue-green objects.", diff: "hard" },
        { term: "Cartouche", def: "Oval enclosure surrounding a royal name.", diff: "easy" },
        { term: "False door", def: "Tomb feature through which the dead could symbolically receive offerings.", diff: "medium" },
        { term: "Senet board", def: "Board used for a famous Egyptian game with funerary symbolism.", diff: "medium" },
        { term: "Canopic chest", def: "Container protecting a set of canopic vessels.", diff: "easy" }
    ];

    const roomTitles = ["Chamber of Artifacts", "Hall of Monuments", "Vault of Symbols"];
    const deathScenes = [
        "A mummy lunges from the shadows! Your lamp shatters.",
        "You step on a pressure plate and plummet into a spiked pit!",
        "A giant venomous snake drops from the ceiling and strikes!"
    ];

    let currentRoom = 0;
    let currentQuestionIdx = 0;
    let power = 100;
    let timeLeft = 15;
    let timerInterval = null;
    let currentItem = null;

    // Listen for Enter key
    document.getElementById("answer-input").addEventListener("keypress", function(e) {
        if (e.key === "Enter") submitAnswer();
    });

    function startGame() {
        document.getElementById('start-screen').style.display = 'none';
        currentRoom = 0;
        currentQuestionIdx = 0;
        power = 100;
        updatePowerUI();
        loadQuestion();
    }

    function loadQuestion() {
        if (currentQuestionIdx >= 10) {
            currentRoom++;
            currentQuestionIdx = 0;
            if (currentRoom >= 3) {
                winGame();
                return;
            }
        }

        let globalIndex = (currentRoom * 10) + currentQuestionIdx;
        currentItem = artifacts[globalIndex];

        document.getElementById('room-indicator').innerText = currentRoom + 1;
        document.getElementById('room-title').innerText = roomTitles[currentRoom];
        document.getElementById('definition-box').innerText = currentItem.def;
        
        // Simulating the "little picture strongly related to that thing"
        let safeImageName = currentItem.term.replace(/[^a-zA-Z0-9]/g, '');
        document.getElementById('artifact-image').src = `https://placehold.co/400x200/2a221b/e6d7c3?text=${safeImageName}+Symbol`;

        document.getElementById('answer-input').value = "";
        document.getElementById('feedback').innerText = "";
        
        startTimer();
    }

    function startTimer() {
        clearInterval(timerInterval);
        timeLeft = 15;
        document.getElementById('timer').innerText = timeLeft + "s";
        
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft + "s";
            
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                processWrongAnswer("Time's up!");
            }
        }, 1000);
    }

    function normalizeString(str) {
        // Remove spaces, punctuation, make lowercase for forgiving matching
        return str.toLowerCase().replace(/[^a-z0-9]/g, '');
    }

    function isAnswerCorrect(input, actual) {
        let cleanInput = normalizeString(input);
        let cleanActual = normalizeString(actual);
        // Also check if they just typed the main keyword (e.g. "rosetta" for "rosetta stone")
        return cleanInput === cleanActual || (cleanInput.length > 3 && cleanActual.includes(cleanInput));
    }

    function submitAnswer() {
        if(timeLeft <= 0 || power <= 0) return;
        clearInterval(timerInterval);
        
        let input = document.getElementById('answer-input').value;
        if (isAnswerCorrect(input, currentItem.term)) {
            processCorrectAnswer();
        } else {
            processWrongAnswer("Incorrect! It was " + currentItem.term);
        }
    }

    function processCorrectAnswer() {
        let feedback = document.getElementById('feedback');
        feedback.style.color = "#4CAF50";
        
        // Bonus if answered within 10 seconds (meaning timeLeft is >= 5)
        if (timeLeft >= 5) {
            power = Math.min(100, power + 10);
            feedback.innerText = "Correct! +10% Speed Bonus!";
        } else {
            feedback.innerText = "Correct!";
        }
        
        updatePowerUI();
        setTimeout(() => {
            currentQuestionIdx++;
            loadQuestion();
        }, 1500);
    }

    function processWrongAnswer(msg) {
        let feedback = document.getElementById('feedback');
        feedback.style.color = "#ff4c4c";
        feedback.innerText = msg;
        
        triggerTremor();

        // Calculate penalty based on difficulty
        let penalty = 0;
        if (currentItem.diff === "easy") penalty = 35;
        else if (currentItem.diff === "medium") penalty = 30;
        else if (currentItem.diff === "hard") penalty = 25;

        power -= penalty;
        updatePowerUI();

        if (power <= 0) {
            setTimeout(loseGame, 1000);
        } else {
            setTimeout(() => {
                currentQuestionIdx++;
                loadQuestion();
            }, 2000);
        }
    }

    function triggerTremor() {
        const wrapper = document.getElementById('game-wrapper');
        wrapper.classList.remove('tremor');
        void wrapper.offsetWidth; // trigger reflow
        wrapper.classList.add('tremor');
    }

    function updatePowerUI() {
        // Prevent power from going below 0 visually
        let displayPower = Math.max(0, power);
        let powerBar = document.getElementById('power-bar');
        powerBar.style.width = displayPower + "%";

        // Change color based on health
        if (displayPower > 60) powerBar.style.backgroundColor = "#4CAF50";
        else if (displayPower > 30) powerBar.style.backgroundColor = "#ff9800";
        else powerBar.style.backgroundColor = "#f44336";

        // Apply woozy/pallid effect as power drops
        let lostPower = 100 - displayPower;
        let woozyLevel = lostPower / 100; // 0.0 to 1.0
        let blurLevel = (lostPower / 100) * 1.5; // max 1.5px blur
        
        document.documentElement.style.setProperty('--woozy-level', woozyLevel);
        document.documentElement.style.setProperty('--blur-level', blurLevel + 'px');
    }

    function loseGame() {
        clearInterval(timerInterval);
        document.getElementById('death-message').innerText = deathScenes[currentRoom];
        document.getElementById('game-over-screen').style.display = 'flex';
    }

    function winGame() {
        clearInterval(timerInterval);
        
        // Zoom out to aerial view effect
        let wrapper = document.getElementById('game-wrapper');
        wrapper.style.transform = "scale(0.1)";
        wrapper.style.opacity = "0";

        setTimeout(() => {
            wrapper.style.display = 'none';
            document.body.style.backgroundColor = "#87CEEB"; // Sky color behind aerial view
            document.getElementById('win-screen').style.display = 'flex';
            document.getElementById('win-screen').style.opacity = '0';
            
            // Fade in win screen
            setTimeout(() => {
                document.getElementById('win-screen').style.transition = "opacity 2s ease-in";
                document.getElementById('win-screen').style.opacity = '1';
            }, 100);
            
        }, 1800);
    }
</script>

</body>
</html>
