<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strong Winds and Rain</title>
    <style>
        :root {
            --ui-bg: rgba(10, 15, 22, 0.85);
            --ui-border: #523b26;
            --text-light: #e2e8f0;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020408;
            font-family: 'Times New Roman', serif;
            color: var(--text-light);
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            perspective: 1200px;
        }

        /* Dynamic Ocean & Ship Layer (Accurate Bobbing & Pitching) */
        #ocean-stage {
            position: absolute;
            top: -20%;
            left: -20%;
            width: 140%;
            height: 140%;
            background: url('https://images.unsplash.com/photo-1518355486847-814d3f324317?q=80&w=2000&auto=format&fit=crop') center/cover;
            filter: grayscale(0.7) contrast(1.4) brightness(0.35);
            animation: oceanRoll 9s infinite ease-in-out alternate;
            z-index: 1;
        }

        /* Detailed 3D Ship Deck and Bulwarks Silhouette (Forecastle View) */
        #ship-structure {
            position: absolute;
            bottom: -10vh;
            left: 50%;
            width: 130vw;
            height: 65vh;
            transform: translateX(-50%);
            transform-origin: bottom center;
            background: linear-gradient(0deg, #090c10 0%, #151a21 40%, rgba(21, 26, 33, 0.6) 75%, transparent 100%);
            /* Complex polygon carving out the wooden deck, railings, and bowsprit direction */
            clip-path: polygon(
                0% 100%, 
                100% 100%, 
                72% 25%, 
                55% 12%, 
                51% 5%, 
                49% 5%, 
                45% 12%, 
                28% 25%
            );
            animation: shipBob 9s infinite ease-in-out alternate;
            z-index: 2;
            box-shadow: inset 0 20px 30px rgba(0,0,0,0.9);
        }

        /* Wooden Plank Seams & Deck Highlights for Definition */
        #ship-structure::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                linear-gradient(90deg, transparent 49%, rgba(0,0,0,0.6) 50%, transparent 51%),
                radial-gradient(ellipse at 50% 0%, rgba(255,255,255,0.08) 0%, transparent 60%);
            opacity: 0.6;
            pointer-events: none;
        }

        /* Dense Atmospheric Blizzard / Whiteout Overlay */
        #whiteout-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 30%, rgba(220,230,240,0.3) 0%, rgba(150,165,185,0.75) 70%, rgba(100,115,135,0.9) 100%);
            z-index: 3;
            pointer-events: none;
            transition: opacity 5s ease;
        }

        /* High-Velocity Snow Particle Canvas */
        #snow-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 4;
            pointer-events: none;
        }

        /* UI Layer */
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        #question-box {
            background: var(--ui-bg);
            border: 3px solid var(--ui-border);
            padding: 30px;
            text-align: center;
            max-width: 650px;
            width: 90%;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.9);
            pointer-events: auto;
            backdrop-filter: blur(4px);
        }

        #timer {
            font-size: 3.5rem;
            font-weight: bold;
            margin-bottom: 5px;
            text-shadow: 2px 2px 6px #000;
        }

        .timer-green { color: #48bb78; }
        .timer-yellow { color: #ecc94b; }
        .timer-red { color: #f56565; }

        #definition {
            font-size: 1.5rem;
            margin-bottom: 25px;
            line-height: 1.4;
            font-style: italic;
            color: #cbd5e1;
        }

        #answer-input {
            width: 85%;
            padding: 12px;
            font-size: 1.3rem;
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid var(--ui-border);
            color: #fff;
            text-align: center;
            outline: none;
            font-family: inherit;
            border-radius: 6px;
            transition: all 0.3s;
        }

        #answer-input:focus {
            background: rgba(0, 0, 0, 0.7);
            border-color: #d69e2e;
            box-shadow: 0 0 15px rgba(214, 158, 46, 0.4);
        }

        /* Compass HUD */
        #hud {
            position: absolute;
            bottom: 35px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--ui-bg);
            padding: 18px 25px;
            border: 3px solid var(--ui-border);
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.8);
            pointer-events: auto;
        }

        #grip-bar-container {
            width: 320px;
            height: 22px;
            background: #111;
            border: 2px solid #333;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        #grip-bar {
            width: 100%;
            height: 100%;
            background: #48bb78;
            transition: width 0.3s ease, background-color 0.3s ease;
        }

        /* Cinematic End / Win Screens */
        #message-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 4, 8, 0.95);
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 3s ease, background 3s ease, color 3s ease;
        }
        
        #message-screen h1 { font-size: 4rem; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 4px; }
        #message-screen p { font-size: 1.6rem; font-style: italic; color: #94a3b8; }

        /* Realistic Wave Motion & Ship Bobbing Physics via Keyframes */
        @keyframes oceanRoll {
            0% { transform: rotate(-2.5deg) translateY(0px) scale(1); }
            50% { transform: rotate(2deg) translateY(-18px) scale(1.04); }
            100% { transform: rotate(-1.5deg) translateY(12px) scale(1); }
        }

        @keyframes shipBob {
            0% { transform: translateX(-50%) rotate(-2.5deg) translateY(0px) skewX(0deg); }
            33% { transform: translateX(-50%) rotate(1deg) translateY(-12px) skewX(1deg); }
            66% { transform: translateX(-50%) rotate(1.5deg) translateY(8px) skewX(-1deg); }
            100% { transform: translateX(-50%) rotate(-1.5deg) translateY(-4px) skewX(0deg); }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ocean-stage"></div>
        <div id="ship-structure"></div>
        <div id="whiteout-overlay"></div>
        <canvas id="snow-canvas"></canvas>
        
        <div id="ui-layer">
            <div id="question-box">
                <div id="timer" class="timer-green">0</div>
                <div id="definition">Hold fast to the compass...</div>
                <input type="text" id="answer-input" placeholder="Type psychological term & press Enter" autocomplete="off" autofocus>
            </div>

            <div id="hud">
                <div id="grip-bar-container">
                    <div id="grip-bar"></div>
                </div>
                <div>Compass Grip Strength: <span id="grip-text">100%</span></div>
            </div>
        </div>
    </div>

    <div id="message-screen">
        <h1 id="end-title">Game Over</h1>
        <p id="end-desc">Your grip failed, and the storm took you.</p>
    </div>

    <script>
        const termDatabase = [
            { term: "Conditioning", def: "Learning through association or consequences.", diff: "easy" },
            { term: "Reinforcement", def: "Consequence that increases behavior.", diff: "easy" },
            { term: "Extinction", def: "Weakening of a learned response.", diff: "easy" },
            { term: "Schema", def: "Mental framework organizing knowledge.", diff: "easy" },
            { term: "Attachment", def: "Enduring emotional bond with another.", diff: "easy" },
            { term: "Habituation", def: "Reduced response after repeated exposure.", diff: "easy" },
            { term: "Self-efficacy", def: "Belief in one’s ability to succeed.", diff: "easy" },
            { term: "Cognitive bias", def: "Systematic distortion in judgment.", diff: "easy" },

            { term: "Affect", def: "Experienced or expressed emotional state.", diff: "medium" },
            { term: "Cognition", def: "Mental processing of information.", diff: "medium" },
            { term: "Working memory", def: "Short-term mental workspace.", diff: "medium" },
            { term: "Attribution", def: "Explanation assigned to behavior or events.", diff: "medium" },
            { term: "Locus of control", def: "Where one locates control over outcomes.", diff: "medium" },
            { term: "Resilience", def: "Capacity to recover from adversity.", diff: "medium" },
            { term: "Projection", def: "Attributing one’s own impulses to others.", diff: "medium" },
            { term: "Rumination", def: "Repetitive dwelling on distressing thoughts.", diff: "medium" },

            { term: "Heuristic", def: "Fast mental shortcut for judgment.", diff: "hard" },
            { term: "Executive function", def: "Control of attention, planning, and inhibition.", diff: "hard" },
            { term: "Metacognition", def: "Thinking about one’s own thinking.", diff: "hard" },
            { term: "Neuroplasticity", def: "Brain’s capacity to reorganize itself.", diff: "hard" },
            { term: "Cognitive dissonance", def: "Tension from conflicting beliefs or behavior.", diff: "hard" },
            { term: "Priming", def: "Prior exposure influencing later response.", diff: "hard" },
            { term: "Sensitization", def: "Increased response after repeated stimulation.", diff: "hard" },
            { term: "Transference", def: "Redirecting past relationship feelings onto another.", diff: "hard" },
            { term: "Countertransference", def: "Therapist’s emotional reaction to a client.", diff: "hard" },
            { term: "Dissociation", def: "Disconnection among awareness, memory, or identity.", diff: "hard" },
            { term: "Psychometrics", def: "Measurement of psychological traits.", diff: "hard" },
            { term: "Construct", def: "Theoretical trait being measured or studied.", diff: "hard" },
            { term: "Reliability", def: "Consistency of a measurement.", diff: "hard" },
            { term: "Validity", def: "Whether a measure captures what it claims.", diff: "hard" }
        ];

        let grip = 100;
        let timeElapsed = 0;
        let currentQuestion = null;
        let timerInterval = null;
        let questionsRemaining = [...termDatabase]; 
        let winThreshold = 10;
        let score = 0;

        const gripBar = document.getElementById('grip-bar');
        const gripText = document.getElementById('grip-text');
        const timerDisplay = document.getElementById('timer');
        const definitionDisplay = document.getElementById('definition');
        const answerInput = document.getElementById('answer-input');
        const gameContainer = document.getElementById('game-container');
        const msgScreen = document.getElementById('message-screen');
        const oceanStage = document.getElementById('ocean-stage');
        const whiteoutOverlay = document.getElementById('whiteout-overlay');
        const shipStructure = document.getElementById('ship-structure');

        function updateGrip(amount) {
            grip += amount;
            if (grip > 100) grip = 100;
            if (grip < 0) grip = 0;

            gripBar.style.width = grip + '%';
            gripText.innerText = grip + '%';

            if (grip <= 50) gripBar.style.background = '#ecc94b';
            if (grip <= 25) gripBar.style.background = '#f56565';
            if (grip > 50) gripBar.style.background = '#48bb78';

            if (grip === 0) {
                endGame(false);
            }
        }

        function getPenalty(difficulty) {
            if (difficulty === 'easy') return -35;
            if (difficulty === 'medium') return -30;
            if (difficulty === 'hard') return -25;
            return -30;
        }

        function nextQuestion() {
            if (score >= winThreshold) {
                endGame(true);
                return;
            }

            if (questionsRemaining.length === 0) {
                questionsRemaining = [...termDatabase]; 
            }

            const rIndex = Math.floor(Math.random() * questionsRemaining.length);
            currentQuestion = questionsRemaining.splice(rIndex, 1)[0];

            definitionDisplay.innerText = `"${currentQuestion.def}"`;
            answerInput.value = '';
            answerInput.focus();

            resetTimer();
        }

        function resetTimer() {
            clearInterval(timerInterval);
            timeElapsed = 0;
            updateTimerDisplay();

            timerInterval = setInterval(() => {
                timeElapsed++;
                updateTimerDisplay();

                if (timeElapsed >= 15) {
                    handleMiss();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            timerDisplay.innerText = timeElapsed;
            timerDisplay.className = ''; 

            if (timeElapsed <= 7) {
                timerDisplay.classList.add('timer-green');
            } else if (timeElapsed === 8 || timeElapsed === 9) {
                timerDisplay.classList.add('timer-yellow');
            } else if (timeElapsed >= 10) {
                timerDisplay.classList.add('timer-red');
            }
        }

        function handleMiss() {
            clearInterval(timerInterval);
            const penalty = getPenalty(currentQuestion.diff);
            updateGrip(penalty);
            
            document.getElementById('question-box').style.borderColor = '#f56565';
            setTimeout(() => {
                document.getElementById('question-box').style.borderColor = 'var(--ui-border)';
                if (grip > 0) nextQuestion();
            }, 500);
        }

        function handleHit() {
            clearInterval(timerInterval);
            score++;
            
            document.getElementById('question-box').style.borderColor = '#48bb78';
            setTimeout(() => {
                document.getElementById('question-box').style.borderColor = 'var(--ui-border)';
                nextQuestion();
            }, 500);
        }

        answerInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const userAns = answerInput.value.trim().toLowerCase();
                const correctAns = currentQuestion.term.toLowerCase();

                if (userAns === correctAns) {
                    handleHit();
                } else {
                    handleMiss();
                }
            }
        });

        function endGame(won) {
            clearInterval(timerInterval);
            answerInput.disabled = true;

            if (won) {
                whiteoutOverlay.style.opacity = '0';
                document.getElementById('snow-canvas').style.opacity = '0';
                shipStructure.style.opacity = '0';
                
                oceanStage.style.background = "url('https://images.unsplash.com/photo-1498696884617-1f4f5a2a6136?q=80&w=2000&auto=format&fit=crop') center/cover";
                oceanStage.style.filter = "grayscale(0) contrast(1) brightness(1.2)";
                
                setTimeout(() => {
                    msgScreen.style.opacity = '1';
                    msgScreen.style.background = 'rgba(240, 244, 248, 0.92)';
                    msgScreen.style.color = '#0f172a';
                    document.getElementById('end-title').innerText = "The Storm Breaks";
                    document.getElementById('end-desc').innerText = "You held your grip through the gale. The horizon clears.";
                }, 3500);
            } else {
                gameContainer.style.filter = 'brightness(0)';
                
                setTimeout(() => {
                    msgScreen.style.opacity = '1';
                    document.getElementById('end-title').innerText = "Lost to the Deep";
                    document.getElementById('end-desc').innerText = "Your grip failed, and the freezing sea claimed you.";
                }, 2000);
            }
        }

        /* High-Performance Canvas Blizzard Effect */
        const canvas = document.getElementById('snow-canvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const particles = [];
        const particleCount = 1400; 

        for (let i = 0; i < particleCount; i++) {
            particles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                r: Math.random() * 3.5 + 0.8,
                d: Math.random() * particleCount,
                speedX: Math.random() * 10 + 6,
                speedY: Math.random() * 5 + 2
            });
        }

        function drawSnow() {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
            ctx.beginPath();
            
            for (let i = 0; i < particleCount; i++) {
                let p = particles[i];
                ctx.moveTo(p.x, p.y);
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2, true);
            }
            ctx.fill();
            updateSnow();
            requestAnimationFrame(drawSnow);
        }

        let angle = 0;
        function updateSnow() {
            angle += 0.01;
            for (let i = 0; i < particleCount; i++) {
                let p = particles[i];
                p.y += Math.cos(angle + p.d) + 1.2 + p.r / 2;
                p.x += Math.sin(angle) * 2.5 + p.speedX; 

                if (p.x > width + 5 || p.x < -5 || p.y > height) {
                    if (i % 3 > 0) {
                        particles[i] = { x: -5, y: Math.random() * height, r: p.r, d: p.d, speedX: p.speedX, speedY: p.speedY };
                    } else {
                        particles[i] = { x: Math.random() * width, y: -5, r: p.r, d: p.d, speedX: p.speedX, speedY: p.speedY };
                    }
                }
            }
        }

        drawSnow();
        setTimeout(nextQuestion, 2000);
    </script>
</body>
</html>
