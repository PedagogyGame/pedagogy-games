<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strong Winds and Rain</title>
    <style>
        :root {
            --ui-bg: rgba(0, 0, 0, 0.75);
            --ui-border: #6b4c30;
            --text-light: #e0e0e0;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050a10;
            font-family: 'Times New Roman', serif; /* Gives that 18th-century nautical feel */
            color: var(--text-light);
        }

        /* 3D Immersive Background Container */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            perspective: 1000px;
            transition: filter 3s ease;
        }

        /* The Ship's View (Rocking Animation) */
        #ship-view {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            background: url('https://images.unsplash.com/photo-1518355486847-814d3f324317?q=80&w=2000&auto=format&fit=crop') center/cover;
            animation: rockShip 8s infinite ease-in-out alternate;
            filter: grayscale(0.6) contrast(1.3) brightness(0.5);
            z-index: 1;
            transition: background 3s ease, filter 3s ease;
        }

        /* The Whiteout Overlay (75% Obscured) */
        #whiteout-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, rgba(200,210,220,0.85) 100%);
            z-index: 2;
            transition: opacity 5s ease;
        }

        /* Silhouette of the Ship's Bow */
        #ship-bow {
            position: absolute;
            bottom: -5vh; 
            left: 50%;
            width: 140vw; 
            height: 60vh;
            background: linear-gradient(to top, rgba(10, 12, 15, 0.95) 0%, rgba(20, 24, 28, 0.8) 50%, rgba(200, 210, 220, 0) 100%);
            clip-path: polygon(0% 100%, 100% 100%, 65% 20%, 52% 5%, 48% 5%, 35% 20%);
            transform-origin: bottom center;
            animation: rockBow 8s infinite ease-in-out alternate;
            z-index: 3;
            transition: opacity 5s ease;
        }

        #ship-bow::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 4px;
            height: 90%;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            transform: translateX(-50%);
        }

        /* Canvas for dynamic snow */
        #snow-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 4;
            pointer-events: none;
            transition: opacity 5s ease;
        }

        /* UI Layer */
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        /* The Compass / Grip HUD */
        #hud {
            position: absolute;
            bottom: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--ui-bg);
            padding: 20px;
            border: 3px solid var(--ui-border);
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            pointer-events: auto;
        }

        #grip-bar-container {
            width: 300px;
            height: 25px;
            background: #222;
            border: 2px solid #555;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        #grip-bar {
            width: 100%;
            height: 100%;
            background: #4caf50;
            transition: width 0.3s ease, background-color 0.3s ease;
        }

        /* Question Box */
        #question-box {
            background: var(--ui-bg);
            border: 2px solid var(--ui-border);
            padding: 30px;
            text-align: center;
            max-width: 650px;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
            pointer-events: auto;
            backdrop-filter: blur(2px);
        }

        #timer {
            font-size: 3.5rem;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px #000;
        }

        .timer-green { color: #4caf50; }
        .timer-yellow { color: #ffeb3b; }
        .timer-red { color: #f44336; }

        #definition {
            font-size: 1.6rem;
            margin-bottom: 25px;
            line-height: 1.4;
            font-style: italic;
        }

        #answer-input {
            width: 80%;
            padding: 12px;
            font-size: 1.3rem;
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--ui-border);
            color: white;
            text-align: center;
            outline: none;
            font-family: inherit;
        }

        #answer-input:focus {
            background: rgba(255,255,255,0.2);
            border-color: #c29b76;
        }

        /* Win / Lose Screens */
        #message-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 3s ease, background 3s ease, color 3s ease;
        }
        
        #message-screen h1 { font-size: 4rem; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 4px; }
        #message-screen p { font-size: 1.5rem; font-style: italic; }

        /* Animations */
        @keyframes rockShip {
            0% { transform: rotate(-3deg) translateY(0) scale(1); }
            50% { transform: rotate(2deg) translateY(-20px) scale(1.05); }
            100% { transform: rotate(-2deg) translateY(10px) scale(1); }
        }

        @keyframes rockBow {
            0% { transform: translateX(-50%) rotate(-3deg) translateY(0); }
            50% { transform: translateX(-50%) rotate(2deg) translateY(-10px); }
            100% { transform: translateX(-50%) rotate(-2deg) translateY(10px); }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ship-view"></div>
        <div id="whiteout-overlay"></div>
        <div id="ship-bow"></div>
        <canvas id="snow-canvas"></canvas>
        
        <div id="ui-layer">
            <div id="question-box">
                <div id="timer" class="timer-green">0</div>
                <div id="definition">Hold fast...</div>
                <input type="text" id="answer-input" placeholder="Type the term and press Enter" autocomplete="off" autofocus>
            </div>

            <div id="hud">
                <div id="grip-bar-container">
                    <div id="grip-bar"></div>
                </div>
                <div>Compass Grip Strength: <span id="grip-text">100%</span></div>
            </div>
        </div>
    </div>

    <div id="message-screen">
        <h1 id="end-title">Game Over</h1>
        <p id="end-desc">Your grip failed, and the storm took you.</p>
    </div>

    <script>
        // --- Term Database ---
        const termDatabase = [
            { term: "Conditioning", def: "Learning through association or consequences.", diff: "easy" },
            { term: "Reinforcement", def: "Consequence that increases behavior.", diff: "easy" },
            { term: "Extinction", def: "Weakening of a learned response.", diff: "easy" },
            { term: "Schema", def: "Mental framework organizing knowledge.", diff: "easy" },
            { term: "Attachment", def: "Enduring emotional bond with another.", diff: "easy" },
            { term: "Habituation", def: "Reduced response after repeated exposure.", diff: "easy" },
            { term: "Self-efficacy", def: "Belief in one’s ability to succeed.", diff: "easy" },
            { term: "Cognitive bias", def: "Systematic distortion in judgment.", diff: "easy" },

            { term: "Affect", def: "Experienced or expressed emotional state.", diff: "medium" },
            { term: "Cognition", def: "Mental processing of information.", diff: "medium" },
            { term: "Working memory", def: "Short-term mental workspace.", diff: "medium" },
            { term: "Attribution", def: "Explanation assigned to behavior or events.", diff: "medium" },
            { term: "Locus of control", def: "Where one locates control over outcomes.", diff: "medium" },
            { term: "Resilience", def: "Capacity to recover from adversity.", diff: "medium" },
            { term: "Projection", def: "Attributing one’s own impulses to others.", diff: "medium" },
            { term: "Rumination", def: "Repetitive dwelling on distressing thoughts.", diff: "medium" },

            { term: "Heuristic", def: "Fast mental shortcut for judgment.", diff: "hard" },
            { term: "Executive function", def: "Control of attention, planning, and inhibition.", diff: "hard" },
            { term: "Metacognition", def: "Thinking about one’s own thinking.", diff: "hard" },
            { term: "Neuroplasticity", def: "Brain’s capacity to reorganize itself.", diff: "hard" },
            { term: "Cognitive dissonance", def: "Tension from conflicting beliefs or behavior.", diff: "hard" },
            { term: "Priming", def: "Prior exposure influencing later response.", diff: "hard" },
            { term: "Sensitization", def: "Increased response after repeated stimulation.", diff: "hard" },
            { term: "Transference", def: "Redirecting past relationship feelings onto another.", diff: "hard" },
            { term: "Countertransference", def: "Therapist’s emotional reaction to a client.", diff: "hard" },
            { term: "Dissociation", def: "Disconnection among awareness, memory, or identity.", diff: "hard" },
            { term: "Psychometrics", def: "Measurement of psychological traits.", diff: "hard" },
            { term: "Construct", def: "Theoretical trait being measured or studied.", diff: "hard" },
            { term: "Reliability", def: "Consistency of a measurement.", diff: "hard" },
            { term: "Validity", def: "Whether a measure captures what it claims.", diff: "hard" }
        ];

        // --- Game State ---
        let grip = 100;
        let timeElapsed = 0;
        let currentQuestion = null;
        let timerInterval = null;
        let questionsRemaining = [...termDatabase]; 
        let winThreshold = 10; // 10 correct answers to weather the storm
        let score = 0;

        // --- DOM Elements ---
        const gripBar = document.getElementById('grip-bar');
        const gripText = document.getElementById('grip-text');
        const timerDisplay = document.getElementById('timer');
        const definitionDisplay = document.getElementById('definition');
        const answerInput = document.getElementById('answer-input');
        const gameContainer = document.getElementById('game-container');
        const msgScreen = document.getElementById('message-screen');
        const shipView = document.getElementById('ship-view');
        const whiteoutOverlay = document.getElementById('whiteout-overlay');
        const shipBow = document.getElementById('ship-bow');

        // --- Mechanics ---
        function updateGrip(amount) {
            grip += amount;
            if (grip > 100) grip = 100;
            if (grip < 0) grip = 0;

            gripBar.style.width = grip + '%';
            gripText.innerText = grip + '%';

            if (grip <= 50) gripBar.style.background = '#ffeb3b';
            if (grip <= 25) gripBar.style.background = '#f44336';
            if (grip > 50) gripBar.style.background = '#4caf50';

            if (grip === 0) {
                endGame(false);
            }
        }

        function getPenalty(difficulty) {
            if (difficulty === 'easy') return -35;
            if (difficulty === 'medium') return -30;
            if (difficulty === 'hard') return -25;
            return -30;
        }

        function nextQuestion() {
            if (score >= winThreshold) {
                endGame(true);
                return;
            }

            if (questionsRemaining.length === 0) {
                questionsRemaining = [...termDatabase]; 
            }

            const rIndex = Math.floor(Math.random() * questionsRemaining.length);
            currentQuestion = questionsRemaining.splice(rIndex, 1)[0];

            definitionDisplay.innerText = `"${currentQuestion.def}"`;
            answerInput.value = '';
            answerInput.focus();

            resetTimer();
        }

        function resetTimer() {
            clearInterval(timerInterval);
            timeElapsed = 0;
            updateTimerDisplay();

            timerInterval = setInterval(() => {
                timeElapsed++;
                updateTimerDisplay();

                if (timeElapsed >= 15) {
                    handleMiss();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            timerDisplay.innerText = timeElapsed;
            timerDisplay.className = ''; 

            if (timeElapsed <= 7) {
                timerDisplay.classList.add('timer-green');
            } else if (timeElapsed === 8 || timeElapsed === 9) {
                timerDisplay.classList.add('timer-yellow');
            } else if (timeElapsed >= 10) {
                timerDisplay.classList.add('timer-red');
            }
        }

        function handleMiss() {
            clearInterval(timerInterval);
            const penalty = getPenalty(currentQuestion.diff);
            updateGrip(penalty);
            
            document.getElementById('question-box').style.borderColor = '#f44336';
            setTimeout(() => {
                document.getElementById('question-box').style.borderColor = 'var(--ui-border)';
                if (grip > 0) nextQuestion();
            }, 500);
        }

        function handleHit() {
            clearInterval(timerInterval);
            score++;
            
            document.getElementById('question-box').style.borderColor = '#4caf50';
            setTimeout(() => {
                document.getElementById('question-box').style.borderColor = 'var(--ui-border)';
                nextQuestion();
            }, 500);
        }

        answerInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const userAns = answerInput.value.trim().toLowerCase();
                const correctAns = currentQuestion.term.toLowerCase();

                if (userAns === correctAns) {
                    handleHit();
                } else {
                    handleMiss();
                }
            }
        });

        // --- End Game Sequences ---
        function endGame(won) {
            clearInterval(timerInterval);
            answerInput.disabled = true;

            if (won) {
                whiteoutOverlay.style.opacity = '0';
                document.getElementById('snow-canvas').style.opacity = '0';
                shipBow.style.opacity = '0'; // Clear the dark bow
                
                // Switch to a calmer, sunnier ocean view
                shipView.style.background = "url('https://images.unsplash.com/photo-1498696884617-1f4f5a2a6136?q=80&w=2000&auto=format&fit=crop') center/cover";
                shipView.style.filter = "grayscale(0) contrast(1) brightness(1.2)";
                
                setTimeout(() => {
                    msgScreen.style.opacity = '1';
                    msgScreen.style.background = 'rgba(255,255,255,0.85)';
                    msgScreen.style.color = '#000';
                    document.getElementById('end-title').innerText = "The Storm Breaks";
                    document.getElementById('end-desc').innerText = "You held your grip. The horizon clears.";
                }, 3500);
            } else {
                gameContainer.style.filter = 'brightness(0)';
                
                setTimeout(() => {
                    msgScreen.style.opacity = '1';
                    document.getElementById('end-title').innerText = "Lost to the Deep";
                    document.getElementById('end-desc').innerText = "Your grip failed, and the sea claimed you.";
                }, 2000);
            }
        }

        // --- High-Performance Canvas Snow Effect ---
        const canvas = document.getElementById('snow-canvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const particles = [];
        const particleCount = 1200; 

        for (let i = 0; i < particleCount; i++) {
            particles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                r: Math.random() * 3 + 1,
                d: Math.random() * particleCount,
                speedX: Math.random() * 8 + 5,
                speedY: Math.random() * 4 + 2
            });
        }

        function drawSnow() {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
            ctx.beginPath();
            
            for (let i = 0; i < particleCount; i++) {
                let p = particles[i];
                ctx.moveTo(p.x, p.y);
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2, true);
            }
            ctx.fill();
            updateSnow();
            requestAnimationFrame(drawSnow);
        }

        let angle = 0;
        function updateSnow() {
            angle += 0.01;
            for (let i = 0; i < particleCount; i++) {
                let p = particles[i];
                p.y += Math.cos(angle + p.d) + 1 + p.r / 2;
                p.x += Math.sin(angle) * 2 + p.speedX; 

                if (p.x > width + 5 || p.x < -5 || p.y > height) {
                    if (i % 3 > 0) {
                        particles[i] = { x: -5, y: Math.random() * height, r: p.r, d: p.d, speedX: p.speedX, speedY: p.speedY };
                    } else {
                        particles[i] = { x: Math.random() * width, y: -5, r: p.r, d: p.d, speedX: p.speedX, speedY: p.speedY };
                    }
                }
            }
        }

        drawSnow();
        setTimeout(nextQuestion, 2000); // Small dramatic pause before starting
    </script>
</body>
</html>
