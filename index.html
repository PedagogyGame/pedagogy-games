<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedagogy Games</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 50px;
    }

    h1 {
      font-size: 3.2rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #ff00cc, #3333ff, #00ffcc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 30px rgba(255, 0, 204, 0.4);
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 1.15rem;
      opacity: 0.85;
      letter-spacing: 1px;
    }

    .arcade {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 28px;
      max-width: 900px;
      width: 100%;
    }

    .tile {
      aspect-ratio: 1;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #fff;
      position: relative;
      overflow: hidden;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      border: 3px solid rgba(255, 255, 255, 0.15);
    }

    .tile:hover {
      transform: translateY(-8px) scale(1.03);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55);
    }

    .tile::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.18) 0%, transparent 40%);
      pointer-events: none;
    }

    .icon {
      font-size: 4.5rem;
      margin-bottom: 12px;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
    }

    .title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }

    /* Individual game colors */
    .game-1 {
      background: linear-gradient(145deg, #ff416c, #ff4b2b);
    }

    .game-2 {
      background: linear-gradient(145deg, #00c6ff, #0072ff);
    }

    .game-3 {
      background: linear-gradient(145deg, #8E2DE2, #4A00E0);
    }

    .game-4 {
      background: linear-gradient(145deg, #11998e, #38ef7d);
    }

    footer {
      margin-top: 60px;
      opacity: 0.6;
      font-size: 0.9rem;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Pedagogy Games</h1>
    <p class="subtitle">Choose your challenge</p>
  </header>

  <div class="arcade">
    <!-- Game 1 -->
    <a href="game-1/" class="tile game-1">
      <div class="icon">🤖</div>
      <div class="title">AI Labs</div>
    </a>

    <!-- Game 2 -->
    <a href="game-2/" class="tile game-2">
      <div class="icon">🎻</div>
      <div class="title">Orchestra</div>
    </a>

    <!-- Game 3 -->
    <a href="game-3/" class="tile game-3">
      <div class="icon">🚀</div>
      <div class="title">Space Engineering</div>
    </a>

    <!-- Game 4 -->
    <a href="game-4/" class="tile game-4">
      <div class="icon">🌿</div>
      <div class="title">Greenhouse</div>
    </a>
  </div>

  <footer>
    Learn by playing
  </footer>
</body>
</html>
