<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedagogy Games - Arcade Terminal</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #050505;
      --grid-color: #1a0033;
      --neon-pink: #ff0055;
      --neon-blue: #00f3ff;
      --neon-green: #39ff14;
      --neon-purple: #b500ff;
      --neon-yellow: #ffea00;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-color);
      background-image: 
        linear-gradient(rgba(26, 0, 51, 0.8) 1px, transparent 1px),
        linear-gradient(90deg, rgba(26, 0, 51, 0.8) 1px, transparent 1px);
      background-size: 30px 30px;
      font-family: 'Orbitron', sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      position: relative;
    }

    /* CRT Scanline effect */
    body::after {
      content: " ";
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      z-index: 2;
      background-size: 100% 2px, 3px 100%;
      pointer-events: none;
    }

    header {
      text-align: center;
      margin-bottom: 60px;
      z-index: 3;
    }

    h1 {
      font-family: 'Press Start 2P', cursive;
      font-size: 2.5rem;
      color: #fff;
      text-transform: uppercase;
      text-shadow: 
        0 0 5px #fff,
        0 0 10px #fff,
        0 0 20px var(--neon-pink),
        0 0 40px var(--neon-pink),
        0 0 80px var(--neon-pink);
      margin-bottom: 20px;
      animation: pulsate 1.5s infinite alternate;
    }

    .subtitle {
      font-size: 1.2rem;
      letter-spacing: 4px;
      color: var(--neon-blue);
      text-shadow: 0 0 10px var(--neon-blue);
      text-transform: uppercase;
    }

    .arcade {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 35px;
      max-width: 1000px;
      width: 100%;
      z-index: 3;
    }

    .tile {
      aspect-ratio: 1;
      border-radius: 10px;
      background: rgba(10, 10, 10, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #fff;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
      backdrop-filter: blur(5px);
    }

    .tile::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 50%; height: 100%;
      background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0) 100%);
      transform: skewX(-25deg);
      transition: all 0.5s ease;
    }

    .tile:hover::before {
      left: 200%;
    }

    .tile:hover {
      transform: translateY(-10px) scale(1.05);
      background: #000;
    }

    .icon {
      font-size: 5rem;
      margin-bottom: 20px;
      transition: transform 0.3s ease;
    }

    .tile:hover .icon {
      transform: scale(1.2);
    }

    .title {
      font-size: 1.3rem;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;
      padding: 0 10px;
    }

    /* Game 1: AI Labs */
    .game-1 {
      border: 4px solid var(--neon-blue);
      box-shadow: 0 0 15px var(--neon-blue), inset 0 0 15px var(--neon-blue);
    }
    .game-1:hover {
      box-shadow: 0 0 30px var(--neon-blue), inset 0 0 30px var(--neon-blue);
    }
    .game-1 .title {
      color: var(--neon-blue);
      text-shadow: 0 0 8px var(--neon-blue);
    }

    /* Game 2: Orchestra */
    .game-2 {
      border: 4px solid var(--neon-yellow);
      box-shadow: 0 0 15px var(--neon-yellow), inset 0 0 15px var(--neon-yellow);
    }
    .game-2:hover {
      box-shadow: 0 0 30px var(--neon-yellow), inset 0 0 30px var(--neon-yellow);
    }
    .game-2 .title {
      color: var(--neon-yellow);
      text-shadow: 0 0 8px var(--neon-yellow);
    }

    /* Game 3: Space Engineering */
    .game-3 {
      border: 4px solid var(--neon-purple);
      box-shadow: 0 0 15px var(--neon-purple), inset 0 0 15px var(--neon-purple);
    }
    .game-3:hover {
      box-shadow: 0 0 30px var(--neon-purple), inset 0 0 30px var(--neon-purple);
    }
    .game-3 .title {
      color: var(--neon-purple);
      text-shadow: 0 0 8px var(--neon-purple);
    }

    /* Game 4: Horticulture 101 */
    .game-4 {
      border: 4px solid var(--neon-green);
      box-shadow: 0 0 15px var(--neon-green), inset 0 0 15px var(--neon-green);
    }
    .game-4:hover {
      box-shadow: 0 0 30px var(--neon-green), inset 0 0 30px var(--neon-green);
    }
    .game-4 .title {
      color: var(--neon-green);
      text-shadow: 0 0 8px var(--neon-green);
    }

    @keyframes pulsate {
      100% {
        text-shadow: 
          0 0 4px #fff,
          0 0 11px #fff,
          0 0 19px #fff,
          0 0 40px var(--neon-pink),
          0 0 80px var(--neon-pink),
          0 0 90px var(--neon-pink);
      }
      0% {
        text-shadow: 
          0 0 2px #fff,
          0 0 4px #fff,
          0 0 6px #fff,
          0 0 10px var(--neon-pink),
          0 0 45px var(--neon-pink),
          0 0 55px var(--neon-pink);
      }
    }

    footer {
      margin-top: 80px;
      font-family: 'Press Start 2P', cursive;
      font-size: 0.8rem;
      color: var(--neon-pink);
      text-shadow: 0 0 5px var(--neon-pink);
      z-index: 3;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Pedagogy</h1>
    <p class="subtitle">Insert Coin to Begin</p>
  </header>

  <div class="arcade">
    <!-- Game 1 -->
    <a href="game-1/" class="tile game-1">
      <div class="icon">💻</div>
      <div class="title">AI Labs</div>
    </a>

    <!-- Game 2 -->
    <a href="game-2/" class="tile game-2">
      <div class="icon">🎼</div>
      <div class="title">Orchestra</div>
    </a>

    <!-- Game 3 -->
    <a href="game-3/" class="tile game-3">
      <div class="icon">🛰️</div>
      <div class="title">Space Engineering</div>
    </a>

    <!-- Game 4 -->
    <a href="game-4/" class="tile game-4">
      <div class="icon">🌿</div>
      <div class="title">Horticulture 101</div>
    </a>
  </div>

  <footer>
    &gt; INSERT COIN _
  </footer>
</body>
</html>
