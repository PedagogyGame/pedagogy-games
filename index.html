    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-color);
      background-image: 
        linear-gradient(rgba(26, 0, 51, 0.4) 1px, transparent 1px),
        linear-gradient(90deg, rgba(26, 0, 51, 0.4) 1px, transparent 1px);
      background-size: 30px 30px;
      font-family: 'Orbitron', sans-serif;
      color: #ccc;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      position: relative;
    }

    /* CRT Scanline effect */
    body::after {
      content: " ";
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      z-index: 2;
      background-size: 100% 2px, 3px 100%;
      pointer-events: none;
    }

    header {
      text-align: center;
      margin-bottom: 50px;
      z-index: 3;
    }

    h1 {
      font-family: 'Press Start 2P', cursive;
      font-size: 1.8rem;
      color: #ddd;
      text-transform: uppercase;
      text-shadow: 
        0 0 2px #fff,
        0 0 5px var(--neon-pink);
      margin-bottom: 15px;
      animation: pulsate 3s infinite alternate;
    }

    .subtitle {
      font-size: 0.85rem;
      letter-spacing: 3px;
      color: var(--neon-blue);
      text-shadow: 0 0 3px var(--neon-blue);
      text-transform: uppercase;
    }

    .arcade {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 20px;
      max-width: 900px;
      width: 100%;
      z-index: 3;
    }

    .tile {
      aspect-ratio: 1;
      border-radius: 6px;
      background: rgba(15, 15, 15, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #bbb;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .tile::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 50%; height: 100%;
      background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0) 100%);
      transform: skewX(-25deg);
      transition: all 0.5s ease;
    }

    .tile:hover::before {
      left: 200%;
    }

    .tile:hover {
      transform: translateY(-3px) scale(1.02);
      background: #111;
      color: #fff;
    }

    .icon {
      font-size: 3rem;
      margin-bottom: 12px;
      transition: transform 0.3s ease;
      opacity: 0.9;
    }

    .tile:hover .icon {
      transform: scale(1.1);
      opacity: 1;
    }

    .title {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-align: center;
      padding: 0 8px;
    }
