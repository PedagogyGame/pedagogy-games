<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedagogy Games</title>
    <style>
        :root {
            --neon-blue: #0ff;
            --neon-pink: #f0f;
            --neon-green: #0f0;
            --bg-color: #050505;
        }

        body {
            background-color: var(--bg-color);
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        h1 {
            color: #fff;
            text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px var(--neon-blue), 0 0 40px var(--neon-blue), 0 0 80px var(--neon-blue);
            font-size: 3rem;
            text-align: center;
            margin-bottom: 2rem;
        }

        .arcade-menu {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            width: 80%;
            max-width: 500px;
        }

        .game-button {
            background: transparent;
            color: var(--neon-blue);
            border: 2px solid var(--neon-blue);
            padding: 15px 20px;
            font-size: 1.5rem;
            font-family: inherit;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 10px var(--neon-blue) inset, 0 0 10px var(--neon-blue);
            transition: all 0.2s ease-in-out;
        }

        .game-button:hover {
            background: var(--neon-blue);
            color: var(--bg-color);
            box-shadow: 0 0 20px var(--neon-blue) inset, 0 0 20px var(--neon-blue);
        }

        .game-button.game-c {
            color: var(--neon-pink);
            border-color: var(--neon-pink);
            box-shadow: 0 0 10px var(--neon-pink) inset, 0 0 10px var(--neon-pink);
        }

        .game-button.game-c:hover {
            background: var(--neon-pink);
            color: var(--bg-color);
            box-shadow: 0 0 20px var(--neon-pink) inset, 0 0 20px var(--neon-pink);
        }

        .module-container {
            display: none;
            width: 90%;
            max-width: 800px;
            border: 2px solid var(--neon-green);
            padding: 2rem;
            box-shadow: 0 0 15px var(--neon-green);
            text-align: center;
        }

        .active {
            display: block;
        }

        .back-button {
            margin-top: 2rem;
            background: transparent;
            color: #fff;
            border: 1px solid #fff;
            padding: 10px 15px;
            cursor: pointer;
            font-family: inherit;
            transition: 0.2s;
        }

        .back-button:hover {
            background: #fff;
            color: var(--bg-color);
        }
    </style>
</head>
<body>

    <div id="main-menu" class="arcade-menu active">
        <h1>PEDAGOGY GAMES</h1>
        <!-- Assuming Game A is already defined somewhere, here are B and C -->
        <button class="game-button" onclick="loadModule('module-b')">Game B: Ancient Egypt 101</button>
        <button class="game-button game-c" onclick="loadModule('module-c')">Game C: Culinary Arts 101</button>
    </div>

    <!-- GAME B CONTAINER -->
    <div id="module-b" class="module-container" style="border-color: var(--neon-blue); box-shadow: 0 0 15px var(--neon-blue);">
        <h2 style="color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-blue);">ANCIENT EGYPT 101</h2>
        <div id="game-b-content">
            <p>Insert Nile River navigation, pyramid engineering logic, or timeline events here...</p>
            <!-- Javascript logic will populate this -->
        </div>
        <button class="back-button" onclick="loadModule('main-menu')">Return to Arcade</button>
    </div>

    <!-- GAME C CONTAINER -->
    <div id="module-c" class="module-container" style="border-color: var(--neon-pink); box-shadow: 0 0 15px var(--neon-pink);">
        <h2 style="color: var(--neon-pink); text-shadow: 0 0 10px var(--neon-pink);">CULINARY ARTS 101</h2>
        <div id="game-c-content">
            <p>Insert ingredient mixing, temperature control, or recipe sequencing here...</p>
            <!-- Javascript logic will populate this -->
        </div>
        <button class="back-button" onclick="loadModule('main-menu')">Return to Arcade</button>
    </div>

    <script>
        function loadModule(moduleId) {
            // Hide all sections
            document.getElementById('main-menu').classList.remove('active');
            document.getElementById('module-b').classList.remove('active');
            document.getElementById('module-c').classList.remove('active');
            
            // Show target section
            document.getElementById(moduleId).classList.add('active');
        }
    </script>
</body>
</html>
