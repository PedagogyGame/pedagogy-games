<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>High-Fidelity Elevator Terminal</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050d1a; font-family: 'Courier New', monospace; }
        canvas { display: block; }
        #ui-overlay { position: absolute; top: 20px; left: 20px; color: #4facfe; pointer-events: none; }
        .label { background: rgba(5, 13, 26, 0.9); border: 1px solid #4facfe; padding: 12px; }
        .part-name { font-size: 16px; font-weight: bold; color: #ffffff; }
    </style>
</head>
<body>
    <div id="ui-overlay">
        <div class="label">
            <div id="part-name" class="part-name">Loading 3D Model...</div>
        </div>
    </div>

    <!-- Three.js, OrbitControls, and GLTFLoader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 4000);
        camera.position.set(100, 200, 300);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);

        // Lighting for a realistic model
        scene.add(new THREE.AmbientLight(0xffffff, 1.0));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(200, 500, 300);
        scene.add(dirLight);

        let interactables = [];
        const loader = new THREE.GLTFLoader();

        // THIS IS WHERE YOU LOAD YOUR REALISTIC EXTERNALLY BUILT MODEL
        loader.load('path_to_your_highly_detailed_elevator.glb', function (gltf) {
            const elevatorModel = gltf.scene;
            scene.add(elevatorModel);
            
            // Auto-populate interactables from your model's named meshes
            elevatorModel.traverse((child) => {
                if (child.isMesh) {
                    interactables.push(child);
                }
            });
            
            document.getElementById('part-name').innerText = "System Ready. Hover to scan.";
        }, undefined, function (error) {
            console.error('Error loading the model:', error);
            document.getElementById('part-name').innerText = "Model Load Failed.";
        });

        // Raycaster for your labels
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const nameLabel = document.getElementById('part-name');

        window.addEventListener('mousemove', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(interactables);

            if (intersects.length > 0) {
                // Pulls the name you gave the part in Blender/CAD
                nameLabel.innerText = intersects[0].object.name || "Unnamed Component"; 
                document.body.style.cursor = 'crosshair';
            } else {
                nameLabel.innerText = 'Scanning System...';
                document.body.style.cursor = 'default';
            }
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
