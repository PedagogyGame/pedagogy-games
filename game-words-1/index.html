<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Chinese Word Study · 1–100</title>
<style>
:root{--ink:#1c1210;--muted:#8a6050;--paper:#f8efe6;--panel:#fbf4ec;--line:#e0c8b0;--deep:#2a1814;--good:#8a4030;--bad:#8a2f27;--gold:#c45a30;--lacquer:#6a2418;--amber:#c9a050}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(1100px 640px at 10% -8%,rgba(196,90,48,.34),transparent 54%),linear-gradient(180deg,#3a2018 0%,#e8d0b8 44%,#1c100c 100%);color:var(--ink);font-family:Georgia,"Times New Roman","Noto Serif SC","Songti SC",serif;overflow:hidden}
.app{height:100vh;display:grid;grid-template-rows:auto 1fr;gap:0}
.topbar{min-height:58px;display:flex;align-items:center;gap:14px;padding:8px 18px;background:linear-gradient(90deg,#2a1410,#4a2018 40%,#2a1410);color:#f4e4d4;border-bottom:3px solid #c9a050;box-shadow:0 1px 0 #6a2418}
.brand{font-size:18px;font-weight:700;letter-spacing:.06em;white-space:nowrap}.brand small{font-size:12px;font-weight:400;opacity:.72;margin-left:8px}
.progress{flex:1;max-width:460px;height:7px;background:rgba(255,255,255,.14);border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:linear-gradient(90deg,#c9a050,#c45a30);width:1%;transition:width .25s ease}
.stat{font-size:13px;opacity:.9;white-space:nowrap}.topbtn{border:1px solid rgba(201,160,80,.55);background:transparent;color:#f4e4d4;border-radius:4px;padding:7px 10px;cursor:pointer}
.main{min-height:0;display:grid;grid-template-columns:minmax(400px,46%) 1fr;gap:18px;padding:18px}
.quiz{min-height:0;background:rgba(251,244,236,.98);border:3px solid #8a3020;box-shadow:inset 0 0 0 7px #f3e6d6,inset 0 0 0 8px #c9a050,0 18px 50px rgba(28,16,12,.32);border-radius:2px;padding:20px 24px 16px;display:flex;flex-direction:column;overflow:auto}
.rankline{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.12em}
.character{text-align:center;font-family:"Noto Serif SC","Songti SC","STSong",serif;font-size:clamp(78px,9.2vw,128px);line-height:.95;margin:10px 0 2px;color:#1c1210;text-shadow:0 1px 0 #fff;letter-spacing:.04em}
.pinyin{text-align:center;font-size:clamp(22px,2.4vw,36px);font-style:italic;color:#8a4030;margin:0 0 8px}
.front-pinyin{display:none}.prompt{text-align:center;font-size:15px;margin:2px 0 10px;color:#8a6050}
button{font:600 13px/1.1 Georgia,serif;letter-spacing:.03em}
.controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:3px 0 8px}.controls .nav{display:flex;gap:6px;margin-right:6px}
.ghost,.action{padding:9px 12px;border-radius:4px;cursor:pointer}.ghost{border:1px solid #c45a30;background:#f8efe6;color:#2a1814}.action{border:1px solid #6a2418;background:#8a4030;color:#fff}
.reveal{border-top:1px solid #e0c8b0;padding-top:10px;margin-top:2px;animation:fade .18s ease}
.reveal-head{margin-bottom:6px}.reveal-pinyin{font-size:clamp(26px,2.7vw,40px);font-style:italic;color:#8a4030;font-weight:700}
.glosses{font-size:clamp(20px,2vw,30px);line-height:1.25;margin:4px 0 8px;color:#1c1210}.glosses b{color:#6a2418}
.wordtitle,.extitle,.chartitle{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#8a6050;margin:10px 0 5px;font-weight:700}
.charlist{display:flex;gap:8px;flex-wrap:wrap}
.charchip{background:#f3e6d6;border:1px solid #e0c8b0;border-radius:4px;padding:7px 10px;min-width:92px;box-shadow:inset 0 0 0 1px rgba(201,160,80,.35)}
.charchip .wzh{font-family:"Noto Serif SC","Songti SC",serif;font-size:28px;font-weight:700;line-height:1;color:#6a2418}
.charchip .wpy{font-size:13px;font-style:italic;color:#8a4030}.charchip .wen{font-size:12px;color:#6a5040}
.examples{display:grid;gap:6px}
.example{padding:7px 10px;background:#f8efe6;border-left:4px solid #c45a30;border-radius:3px;line-height:1.24}
.example-zh{font-family:"Noto Serif SC","Songti SC",serif;font-size:clamp(18px,1.6vw,24px)}
.example-py{font-size:clamp(13px,1.05vw,16px);font-style:italic;color:#8a4030;margin-top:2px}
.example-en{font-size:clamp(13px,1vw,16px);color:#5a4034;margin-top:2px}
.example em{font-style:normal;font-weight:800;color:#8a2418;background:#f0d8c4;border-radius:3px;padding:0 .06em}
.flipcard{margin-top:3px;border:1px solid #c9a050;border-radius:3px;padding:12px 14px;background:#f8efe6}
.flipcard h3{margin:0 0 7px;font-size:13px;color:#8a4030;text-transform:uppercase;letter-spacing:.1em}
.english-list{font-size:clamp(22px,2vw,32px);line-height:1.25;margin:4px 0 10px}
.flipcard .reveal-pinyin{margin:0 0 6px}
.further{border:1px solid #8a4030;background:transparent;color:#8a4030;border-radius:4px;padding:8px 11px;cursor:pointer}
.imagepane{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;background:rgba(28,16,12,.95);border:3px solid #6a2418;border-radius:2px;overflow:hidden;box-shadow:inset 0 0 0 7px rgba(201,160,80,.28),0 18px 50px rgba(28,16,12,.34)}
.imagepane:before{content:"";position:absolute;inset:9px;border:1px solid rgba(201,160,80,.55);border-radius:1px;pointer-events:none}
.art{display:block;max-width:94%;max-height:90%;width:auto;height:auto;object-fit:contain;filter:saturate(1.02) contrast(1.03);box-shadow:0 8px 32px rgba(0,0,0,.32);transition:opacity .35s ease,transform .35s ease}.art.wide{max-width:98%;max-height:84%}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@media(max-width:900px){body{overflow:auto}.app{height:auto;min-height:100vh}.main{grid-template-columns:1fr;grid-template-rows:auto minmax(360px,55vh)}.quiz{overflow:visible}.imagepane{min-height:420px}.topbar{flex-wrap:wrap}.progress{order:3;flex-basis:100%;max-width:none}}
@media(max-width:520px){.main{padding:9px;gap:9px}.quiz{padding:14px}.brand small{display:none}.character{font-size:72px}.topbar{padding:8px 10px}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">词语 1–100 <small>most common words</small></div>
    <div class="progress"><i id="progressFill"></i></div>
    <div class="stat" id="cardStat"></div>
    <button class="topbtn" id="shuffleBtn">Shuffle</button>
    <button class="topbtn" id="resetBtn">Reset order</button>
  </header>
  <main class="main">
    <section class="quiz">
      <div class="rankline"><span id="rankLabel"></span></div>
      <div class="character" id="char"></div>
      <div class="pinyin front-pinyin" id="pinyin" aria-hidden="true"></div>
      <div class="prompt">Recognize the word first. Reveal for dictionary English, each character, and three fully translated examples.</div>
      <div class="controls">
        <div class="nav"><button class="ghost" id="prevBtn">← Previous</button><button class="ghost" id="nextBtn">Next →</button></div>
        <button class="action" id="revealBtn">Reveal</button>
        <button class="ghost" id="flipBtn">Flip</button>
      </div>
      <div id="detailArea"></div>
    </section>
    <section class="imagepane" id="imagePane">
      <img class="art" id="art" alt="Study image">
    </section>
  </main>
</div>
<script>
const BANK = [{"rank":1,"word":"我们","pinyin":"wǒ men","en":["we","us"],"chars":[{"ch":"我","py":"wǒ","en":"I; me"},{"ch":"们","py":"men","en":"plural marker"}],"examples":[{"zh":"我们明天去山上。","pinyin":"wǒ men míng tiān qù shān shàng.","en":"We are going up the mountain tomorrow."},{"zh":"老师问我们听懂了没有。","pinyin":"lǎo shī wèn wǒ men tīng dǒng le méi yǒu.","en":"The teacher asked whether we had understood."},{"zh":"这间屋子是我们的。","pinyin":"zhè jiān wū zi shì wǒ men de.","en":"This room is ours."}]},{"rank":2,"word":"什么","pinyin":"shén me","en":["what","whatever"],"chars":[{"ch":"什","py":"shén","en":"what (in 什么)"},{"ch":"么","py":"me","en":"interrogative particle"}],"examples":[{"zh":"这是什么？","pinyin":"zhè shì shén me?","en":"What is this?"},{"zh":"你在想什么？","pinyin":"nǐ zài xiǎng shén me?","en":"What are you thinking about?"},{"zh":"什么时候出发都可以。","pinyin":"shén me shí hou chū fā dōu kě yǐ.","en":"Any time is fine for setting out."}]},{"rank":3,"word":"自己","pinyin":"zì jǐ","en":["oneself","own"],"chars":[{"ch":"自","py":"zì","en":"self; from"},{"ch":"己","py":"jǐ","en":"oneself"}],"examples":[{"zh":"这件事得自己做。","pinyin":"zhè jiàn shì děi zì jǐ zuò.","en":"This matter has to be done by oneself."},{"zh":"他住在自己的房子里。","pinyin":"tā zhù zài zì jǐ de fáng zi lǐ.","en":"He lives in his own house."},{"zh":"我问了问自己，这样对不对。","pinyin":"wǒ wèn le wèn zì jǐ, zhè yàng duì bu duì.","en":"I asked myself whether this was right."}]},{"rank":4,"word":"没有","pinyin":"méi yǒu","en":["not have","there isn't","have not (done)"],"chars":[{"ch":"没","py":"méi","en":"not (have)"},{"ch":"有","py":"yǒu","en":"have; there is"}],"examples":[{"zh":"桌上没有茶。","pinyin":"zhuō shàng méi yǒu chá.","en":"There is no tea on the table."},{"zh":"我还没有看完那本书。","pinyin":"wǒ hái méi yǒu kàn wán nà běn shū.","en":"I have not finished that book yet."},{"zh":"村里没有学校。","pinyin":"cūn lǐ méi yǒu xué xiào.","en":"The village has no school."}]},{"rank":5,"word":"这个","pinyin":"zhè ge","en":["this","this one"],"chars":[{"ch":"这","py":"zhè","en":"this"},{"ch":"个","py":"ge","en":"general measure word"}],"examples":[{"zh":"这个字很难写。","pinyin":"zhè ge zì hěn nán xiě.","en":"This character is hard to write."},{"zh":"你看这个。","pinyin":"nǐ kàn zhè ge.","en":"Look at this one."},{"zh":"这个办法比较稳妥。","pinyin":"zhè ge bàn fǎ bǐ jiào wěn tuǒ.","en":"This method is relatively safe."}]},{"rank":6,"word":"可以","pinyin":"kě yǐ","en":["can","may","be allowed to"],"chars":[{"ch":"可","py":"kě","en":"can; but"},{"ch":"以","py":"yǐ","en":"by means of; in order to"}],"examples":[{"zh":"这里可以坐下。","pinyin":"zhè lǐ kě yǐ zuò xia.","en":"One may sit down here."},{"zh":"这本书你可以带走。","pinyin":"zhè běn shū nǐ kě yǐ dài zǒu.","en":"You may take this book away."},{"zh":"天气好，可以出门了。","pinyin":"tiān qì hǎo, kě yǐ chū mén le.","en":"The weather is fine; one can go out."}]},{"rank":7,"word":"他们","pinyin":"tā men","en":["they","them"],"chars":[{"ch":"他","py":"tā","en":"he; him"},{"ch":"们","py":"men","en":"plural marker"}],"examples":[{"zh":"他们住在河对岸。","pinyin":"tā men zhù zài hé duì àn.","en":"They live on the other bank of the river."},{"zh":"我看见他们从桥上走过。","pinyin":"wǒ kàn jiàn tā men cóng qiáo shàng zǒu guò.","en":"I saw them walk across the bridge."},{"zh":"他们的田已经犁过了。","pinyin":"tā men de tián yǐ jīng lí guò le.","en":"Their fields have already been plowed."}]},{"rank":8,"word":"因为","pinyin":"yīn wèi","en":["because","on account of"],"chars":[{"ch":"因","py":"yīn","en":"cause; because"},{"ch":"为","py":"wèi","en":"for; for the sake of"}],"examples":[{"zh":"因为下雨，路不好走。","pinyin":"yīn wèi xià yǔ, lù bù hǎo zǒu.","en":"Because it rained, the road is hard to walk."},{"zh":"他没有来，因为家里有事。","pinyin":"tā méi yǒu lái, yīn wèi jiā lǐ yǒu shì.","en":"He did not come, because there was a matter at home."},{"zh":"因为天黑，我们提前回去。","pinyin":"yīn wèi tiān hēi, wǒ men tí qián huí qù.","en":"Because it was dark, we went back early."}]},{"rank":9,"word":"已经","pinyin":"yǐ jīng","en":["already"],"chars":[{"ch":"已","py":"yǐ","en":"already; stop"},{"ch":"经","py":"jīng","en":"pass through; classic"}],"examples":[{"zh":"饭已经好了。","pinyin":"fàn yǐ jīng hǎo le.","en":"The rice is already ready."},{"zh":"他已经走了三天。","pinyin":"tā yǐ jīng zǒu le sān tiān.","en":"He has already been gone three days."},{"zh":"这事我已经说过了。","pinyin":"zhè shì wǒ yǐ jīng shuō guò le.","en":"I have already spoken of this matter."}]},{"rank":10,"word":"现在","pinyin":"xiàn zài","en":["now","at present"],"chars":[{"ch":"现","py":"xiàn","en":"appear; present"},{"ch":"在","py":"zài","en":"at; be at"}],"examples":[{"zh":"现在几点了？","pinyin":"xiàn zài jǐ diǎn le?","en":"What time is it now?"},{"zh":"他现在住在城里。","pinyin":"tā xiàn zài zhù zài chéng lǐ.","en":"He lives in the city at present."},{"zh":"现在风停了。","pinyin":"xiàn zài fēng tíng le.","en":"The wind has stopped now."}]},{"rank":11,"word":"知道","pinyin":"zhī dào","en":["know","be aware of"],"chars":[{"ch":"知","py":"zhī","en":"know"},{"ch":"道","py":"dào","en":"way; say"}],"examples":[{"zh":"我知道这条路。","pinyin":"wǒ zhī dào zhè tiáo lù.","en":"I know this road."},{"zh":"你知道他的名字吗？","pinyin":"nǐ zhī dào tā de míng zi ma?","en":"Do you know his name?"},{"zh":"这件事村里人都知道。","pinyin":"zhè jiàn shì cūn lǐ rén dōu zhī dào.","en":"Everyone in the village knows of this."}]},{"rank":12,"word":"如果","pinyin":"rú guǒ","en":["if","in the event that"],"chars":[{"ch":"如","py":"rú","en":"like; if"},{"ch":"果","py":"guǒ","en":"fruit; result"}],"examples":[{"zh":"如果下雨，我们就在家。","pinyin":"rú guǒ xià yǔ, wǒ men jiù zài jiā.","en":"If it rains, we shall stay at home."},{"zh":"如果你愿意，可以一起去。","pinyin":"rú guǒ nǐ yuàn yì, kě yǐ yì qǐ qù.","en":"If you are willing, we can go together."},{"zh":"如果不早起，就会误车。","pinyin":"rú guǒ bù zǎo qǐ, jiù huì wù chē.","en":"If one does not rise early, one will miss the coach."}]},{"rank":13,"word":"时候","pinyin":"shí hou","en":["time","moment","when"],"chars":[{"ch":"时","py":"shí","en":"time; hour"},{"ch":"候","py":"hou","en":"wait; time (in 时候)"}],"examples":[{"zh":"你什么时候回来？","pinyin":"nǐ shén me shí hou huí lái?","en":"When will you come back?"},{"zh function current(){return BANK[order[pos]]}
function safe(t){return String(t).replace(/[&<>"']/g,m=>({'&':'&','<':'<','>':'>','"':'"',"'":'&#039;'}[m]))}
function mark(sentence,w){return safe(sentence).split(safe(w)).join('<em>'+safe(w)+'</em>')}
function imageForPosition(){const n=IMAGES.length||1;return Math.floor(pos*n/BANK.length)%n}
function setImage(){const idx=imageForPosition(), img=$('art');img.style.opacity=.15;setTimeout(()=>{img.src=IMAGES[idx]; img.onload=()=>{img.classList.toggle('wide',img.naturalWidth/img.naturalHeight>1.75);img.style.opacity=1}},90)}
function renderDetail(mode){const c=current(), d=$('detailArea'); if(mode==='front'){d.innerHTML='';return}
 if(mode==='flip'){d.innerHTML=`<div class="flipcard"><h3>Pinyin + English</h3><div class="reveal-pinyin">${safe(c.pinyin)}</div><div class="english-list">${c.en.map(safe).join(' · ')}</div><button class="further" id="furtherBtn">Reveal further</button></div>`;$('furtherBtn').onclick=()=>{state='revealed';renderDetail('revealed')};return}
 const chars=c.chars.map(w=>`<div class="charchip"><div class="wzh">${safe(w.ch)}</div><div class="wpy">${safe(w.py)}</div><div class="wen">${safe(w.en)}</div></div>`).join('');
 const ex=c.examples.map(x=>`<div class="example"><div class="example-zh">${mark(x.zh,c.word)}</div><div class="example-py">${safe(x.pinyin)}</div><div class="example-en">${safe(x.en)}</div></div>`).join('');
 d.innerHTML=`<div class="reveal"><div class="reveal-head"><div class="reveal-pinyin">${safe(c.pinyin)}</div><p class="glosses"><b>${safe(c.word)}</b> — ${c.en.map(safe).join('; ')}</p></div><div class="chartitle">Characters in this word</div><div class="charlist">${chars}</div><div class="extitle">Example sentences</div><div class="examples">${ex}</div></div>`}
function render(changeImage=true){const c=current();$('char').textContent=c.word;$('pinyin').textContent='';$('rankLabel').textContent=`Word frequency #${c.rank}`;$('cardStat').textContent=`${pos+1} / ${BANK.length}`;$('progressFill').style.width=((pos+1)/BANK.length*100)+'%';state='front';renderDetail('front');if(changeImage)setImage()}
function move(delta){const oldImg=imageForPosition();pos=Math.max(0,Math.min(BANK.length-1,pos+delta));render(imageForPosition()!==oldImg)}
$('prevBtn').onclick=()=>move(-1);$('nextBtn').onclick=()=>move(1);
$('revealBtn').onclick=()=>{state='revealed';renderDetail('revealed')};$('flipBtn').onclick=()=>{state='flip';renderDetail('flip')};
$('shuffleBtn').onclick=()=>{for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}pos=0;render(true)};
$('resetBtn').onclick=()=>{order=BANK.map((_,i)=>i);pos=0;render(true)};
render(true);
</script>
</body>
</html>
