<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hall of Arms</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=EB+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#24180f; --parchment:#ead9b4; --parchment-deep:#d8c196;
  --gold:#c4a35a; --gold-soft:#e0c27a; --stone:#1a1612;
  --lamp:#e8a040; --muted:#6e5c45; --correct:#3d5c3a; --wrong:#6b2e24;
  --display:"Cinzel","Palatino Linotype",serif;
  --body:"EB Garamond","Palatino Linotype",serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--stone);color:var(--parchment);font-family:var(--body)}
button{font:inherit;cursor:pointer;color:inherit}
button:disabled{cursor:default;opacity:.35}
.wrap{position:relative;min-height:100dvh;overflow:hidden}
.hall-bg{position:absolute;inset:0;background:url("corridor-wide.jpg") 46% 62%/122% 122% no-repeat;animation:hall-wander 110s ease-in-out infinite}
@keyframes hall-wander{
  0%{background-position:46% 62%;transform:scale(1);filter:brightness(1)}
  20%{background-position:62% 50%;transform:scale(1.04);filter:brightness(1.03)}
  42%{background-position:50% 42%;transform:scale(1.09);filter:brightness(1.05)}
  64%{background-position:34% 52%;transform:scale(1.05);filter:brightness(1.02)}
  82%{background-position:42% 60%;transform:scale(1.02);filter:brightness(1)}
  100%{background-position:46% 62%;transform:scale(1);filter:brightness(1)}
}
.lamp{position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(ellipse 40% 48% at 16% 58%, rgb(232 176 88 / .16), transparent 64%),
  radial-gradient(ellipse 36% 44% at 86% 52%, rgb(232 168 72 / .12), transparent 66%),
  radial-gradient(ellipse 90% 50% at 50% 110%, rgb(0 0 0 / .55), transparent 70%);
  animation:flicker 2.6s ease-in-out infinite}
@keyframes flicker{0%,100%{opacity:.82}35%{opacity:1}62%{opacity:.88}80%{opacity:.96}}
.vignette{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 100px 20px rgb(8 6 4 / .48)}
.ui{position:relative;z-index:2;margin:0 auto;min-height:100dvh;max-width:32rem;padding:1.5rem 1rem 6rem;display:flex;flex-direction:column}
.plaque{width:100%;margin-top:auto;margin-bottom:1rem;padding:1.5rem 1.4rem;color:var(--ink);background:linear-gradient(180deg,rgb(246 236 210 / .9),rgb(226 205 164 / .86));box-shadow:0 0 0 1px rgb(196 163 90 / .4),0 18px 50px rgb(0 0 0 / .38),inset 0 1px 0 rgb(255 250 235 / .65)}
.kicker{font-family:var(--display);font-size:.7rem;letter-spacing:.35em;text-transform:uppercase;color:var(--gold);margin:0}
.gold-soft{color:var(--gold-soft);letter-spacing:.28em}
h1,h2{font-family:var(--display);font-weight:600;margin:.75rem 0 0;text-wrap:balance}
h1{font-size:clamp(2rem,6vw,3rem)}
.lede{margin:1rem auto 0;max-width:24rem;font-size:1.15rem;line-height:1.55;color:rgb(36 24 15 / .8)}
.row{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:2rem;justify-content:center}
.gold-btn,.ghost-btn{min-height:2.75rem;padding:0 1.25rem;font-family:var(--display);font-size:.875rem;letter-spacing:.08em;text-transform:uppercase;background:transparent;border:0}
.gold-btn{background:var(--ink);color:var(--parchment)}
.ghost-btn{color:rgb(36 24 15 / .8);box-shadow:0 0 0 1px rgb(36 24 15 / .22)}
.bay-link{min-height:2.75rem;background:none;border:0;font-family:var(--display);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:rgb(36 24 15 / .7)}
.bay-link:hover,.bay-link.on{color:var(--ink)}
.bay-link.on{color:var(--gold)}
.stats{margin-top:1.5rem;font-family:var(--display);font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.choice{display:flex;align-items:flex-start;gap:.75rem;width:100%;min-height:3rem;margin:0;padding:.75rem;text-align:left;background:rgb(216 193 150 / .4);border:0;box-shadow:0 0 0 1px rgb(36 24 15 / .16);color:var(--ink);font-size:1rem;line-height:1.35}
.choice:hover:not(:disabled){background:var(--parchment-deep)}
.choice .n{font-family:var(--display);font-size:.75rem;color:var(--gold);margin-top:.15rem}
.choice.correct{background:rgb(61 92 58 / .2);box-shadow:0 0 0 1px rgb(61 92 58 / .55)}
.choice.wrong{background:rgb(107 46 36 / .15);box-shadow:0 0 0 1px rgb(107 46 36 / .5)}
.choice.muted{opacity:.45}
.choices{list-style:none;margin:1.5rem 0 0;padding:0;display:flex;flex-direction:column;gap:.5rem}
.miss{margin-top:1.25rem;font-size:1rem;line-height:1.5;color:rgb(36 24 15 / .75)}
.center{text-align:center}
@media (prefers-reduced-motion:reduce){.hall-bg,.lamp{animation:none;transition:none;transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hall-bg" id="bg"></div>
  <div class="lamp"></div>
  <div class="vignette"></div>
  <div class="ui" id="ui"></div>
</div>
<script>
const GLOSSARY = [{"id": "heraldry", "term": "Heraldry", "cat": "Foundations", "def": "The system and study of armorial bearings: their design, description, inheritance, regulation, identification, and display."}, {"id": "armiger", "term": "Armiger", "cat": "Foundations", "def": "A person or corporate body entitled to bear particular arms. Sharing an armiger’s surname does not automatically convey that entitlement."}, {"id": "arms", "term": "Arms", "cat": "Foundations", "def": "The heraldic design belonging to an armiger. Strictly, the arms are the design borne on the shield; coat of arms is often used more broadly for the complete display."}, {"id": "achievement", "term": "Achievement of arms", "cat": "Foundations", "def": "The complete heraldic composition, potentially including the shield, helm, crest, mantling, motto, supporters, compartment, and other authorized additions."}, {"id": "armorial", "term": "Armorial", "cat": "Foundations", "def": "Pertaining to coats of arms; as a noun, a manuscript, book, register, or collection recording arms."}, {"id": "escutcheon", "term": "Escutcheon", "cat": "Foundations", "def": "The shield upon which arms are displayed, or a shield-shaped component within a larger heraldic design."}, {"id": "field", "term": "Field", "cat": "Foundations", "def": "The background surface of a shield upon which charges are placed."}, {"id": "charge", "term": "Charge", "cat": "Foundations", "def": "Any geometric figure, animal, object, plant, symbol, or other device placed on the field or upon another charge."}, {"id": "blazon", "term": "Blazon", "cat": "Foundations", "def": "The authoritative technical description of arms in heraldic language. The blazon, rather than one particular drawing, defines the design."}, {"id": "blazonry", "term": "Blazonry", "cat": "Foundations", "def": "The language, grammar, conventions, and practice of composing or interpreting blazons."}, {"id": "emblazon", "term": "Emblazon", "cat": "Foundations", "def": "To create—or the resulting creation of—a visual rendering from a blazon. Different artistic renderings may all be valid emblazonments of the same arms."}, {"id": "grant", "term": "Grant of arms", "cat": "Foundations", "def": "The formal creation and authorization of arms by a recognized heraldic authority, normally documented by letters patent."}, {"id": "matriculation", "term": "Matriculation", "cat": "Foundations", "def": "The official recording of arms or of a differenced version derived from existing arms; especially important for cadet branches in Scotland."}, {"id": "badge", "term": "Heraldic badge", "cat": "Foundations", "def": "A separate emblem associated with an armiger, household, organization, or following. It is distinct from both the shield and crest."}, {"id": "banner", "term": "Banner of arms", "cat": "Foundations", "def": "A flag that reproduces the armorial design of the shield across the entire cloth."}, {"id": "canting", "term": "Canting arms", "cat": "Foundations", "def": "Arms containing a visual pun or allusion to the armiger’s name, title, occupation, or estate."}, {"id": "augmentation", "term": "Augmentation of honour", "cat": "Foundations", "def": "A special addition to existing arms granted by a sovereign or heraldic authority to commemorate service, loyalty, or achievement."}, {"id": "tincture", "term": "Tincture", "cat": "Tinctures and furs", "def": "The collective heraldic term for metals, colours, and furs."}, {"id": "or", "term": "Or", "cat": "Tinctures and furs", "def": "Gold, normally represented by gold or yellow."}, {"id": "argent", "term": "Argent", "cat": "Tinctures and furs", "def": "Silver, normally represented by silver or white."}, {"id": "gules", "term": "Gules", "cat": "Tinctures and furs", "def": "Red."}, {"id": "azure", "term": "Azure", "cat": "Tinctures and furs", "def": "Blue."}, {"id": "sable", "term": "Sable", "cat": "Tinctures and furs", "def": "Black."}, {"id": "vert", "term": "Vert", "cat": "Tinctures and furs", "def": "Green."}, {"id": "purpure", "term": "Purpure", "cat": "Tinctures and furs", "def": "Purple."}, {"id": "fur", "term": "Fur", "cat": "Tinctures and furs", "def": "A patterned heraldic tincture historically derived from valuable animal pelts, principally ermine and vair."}, {"id": "ermine", "term": "Ermine", "cat": "Tinctures and furs", "def": "A fur represented by a white or silver field scattered with conventionalized black ermine-tail spots."}, {"id": "vair", "term": "Vair", "cat": "Tinctures and furs", "def": "A fur represented by alternating blue and white bell-shaped figures, historically based on squirrel pelts."}, {"id": "proper", "term": "Proper", "cat": "Tinctures and furs", "def": "Depicted in the object’s conventional natural colours rather than in a named heraldic tincture."}, {"id": "rule-tincture", "term": "Rule of tincture", "cat": "Tinctures and furs", "def": "The contrast convention that ordinarily discourages placing metal upon metal or colour upon colour. It concerns superimposition, not simple adjacency, and admits exceptions."}, {"id": "counterchanged", "term": "Counterchanged", "cat": "Tinctures and furs", "def": "Describes a charge crossing a divided field and reversing its tinctures as it passes from one section to the other."}, {"id": "ordinary", "term": "Ordinary", "cat": "Shield divisions", "def": "A major geometric charge such as a pale, fess, bend, chevron, chief, cross, or saltire. Subordinary conventionally denotes smaller geometric charges, although classifications vary."}, {"id": "partition", "term": "Partition", "cat": "Shield divisions", "def": "The division of a field into differently tinctured sections rather than the placement of a charge upon an undivided background."}, {"id": "per", "term": "Per", "cat": "Shield divisions", "def": "The word introducing a field division: per pale, per fess, per bend, per chevron, or per saltire."}, {"id": "line-division", "term": "Line of division", "cat": "Shield divisions", "def": "The shape of a boundary dividing a field or edging an ordinary, such as wavy, engrailed, invected, embattled, indented, or dancetty."}, {"id": "dexter-sinister", "term": "Dexter / sinister", "cat": "Shield divisions", "def": "The shield bearer’s right and left. Dexter therefore appears on the viewer’s left and sinister on the viewer’s right."}, {"id": "chief", "term": "Chief", "cat": "Shield divisions", "def": "The upper region of the shield; also a broad horizontal ordinary occupying that region."}, {"id": "base", "term": "Base", "cat": "Shield divisions", "def": "The lower region of the shield."}, {"id": "fess-point", "term": "Fess point", "cat": "Shield divisions", "def": "The conventional central point of the shield."}, {"id": "pale", "term": "Pale", "cat": "Shield divisions", "def": "A broad vertical ordinary running through the center of the shield."}, {"id": "fess", "term": "Fess", "cat": "Shield divisions", "def": "A broad horizontal ordinary crossing the shield’s center."}, {"id": "bend", "term": "Bend / bend sinister", "cat": "Shield divisions", "def": "Diagonal ordinaries. A bend runs from dexter chief to sinister base; a bend sinister runs in the opposite direction. A bend sinister does not automatically indicate illegitimacy."}, {"id": "chevron", "term": "Chevron", "cat": "Shield divisions", "def": "An inverted V-shaped ordinary resembling the rafters of a roof."}, {"id": "cross", "term": "Cross", "cat": "Shield divisions", "def": "An ordinary formed by intersecting vertical and horizontal bands."}, {"id": "saltire", "term": "Saltire", "cat": "Shield divisions", "def": "An X-shaped ordinary formed by two intersecting diagonal bands."}, {"id": "bordure", "term": "Bordure / orle / tressure", "cat": "Shield divisions", "def": "Related enclosing figures. A bordure follows the shield’s edge; an orle is inset from it; a tressure is a particularly narrow orle, sometimes doubled or ornamented."}, {"id": "canton", "term": "Canton / quarter", "cat": "Shield divisions", "def": "Rectangular figures normally occupying dexter chief. A quarter occupies approximately one-fourth of the field, while a canton is smaller."}, {"id": "quarterly", "term": "Quarterly", "cat": "Shield divisions", "def": "A field divided by vertical and horizontal lines into four or more numbered sections. This geometric description is distinct from genealogical quartering."}, {"id": "barry", "term": "Barry", "cat": "Shield divisions", "def": "Divided into an even number of equal horizontal sections of alternating tinctures. Separate horizontal charges are called bars."}, {"id": "paly", "term": "Paly", "cat": "Shield divisions", "def": "Divided into an even number of equal vertical sections of alternating tinctures. Separate narrow vertical charges are called pallets."}, {"id": "chequy", "term": "Chequy", "cat": "Shield divisions", "def": "Covered with an alternating checkerboard pattern of two tinctures."}, {"id": "in-position", "term": "In chief / in base / in pale / in fess / in bend", "cat": "Shield divisions", "def": "Positioning instructions meaning, respectively: in the upper field, in the lower field, vertically arranged, horizontally arranged, or diagonally arranged."}, {"id": "attitude", "term": "Attitude", "cat": "Animate charges", "def": "The standardized posture, action, or orientation in which an animal or bird is depicted."}, {"id": "postures", "term": "Rampant / passant / statant / sejant / couchant", "cat": "Animate charges", "def": "Respectively: rearing on a hind leg; walking with one forepaw raised; standing; sitting; and lying down with the head raised."}, {"id": "guardant", "term": "Guardant / reguardant", "cat": "Animate charges", "def": "Guardant means looking outward toward the viewer; reguardant means looking backward over the shoulder."}, {"id": "armed", "term": "Armed / langued / unguled", "cat": "Animate charges", "def": "Terms specifying the tinctures of claws or horns, the tongue, and the hooves."}, {"id": "displayed", "term": "Displayed", "cat": "Animate charges", "def": "A bird shown frontally with wings extended and legs spread, most famously an eagle displayed."}, {"id": "cadency", "term": "Cadency", "cat": "Inheritance", "def": "The system used to identify an armiger’s position within a family or line of descent."}, {"id": "differencing", "term": "Differencing", "cat": "Inheritance", "def": "Altering inherited arms to distinguish one bearer or branch from another. Differencing is broader than the use of standardized cadency marks."}, {"id": "brisure", "term": "Brisure", "cat": "Inheritance", "def": "An added device used to difference related arms, such as a label, crescent, mullet, martlet, annulet, or fleur-de-lis."}, {"id": "marshalling", "term": "Marshalling", "cat": "Inheritance", "def": "The general practice of combining multiple coats of arms to express marriage, descent, inheritance, alliance, territory, or office."}, {"id": "quartering", "term": "Quartering", "cat": "Inheritance", "def": "Marshalling inherited arms in numbered sections of a shield. Despite the name, quartering may involve considerably more than four sections."}, {"id": "impalement", "term": "Impalement", "cat": "Inheritance", "def": "Dividing a shield vertically and placing one coat in the dexter half and another in the sinister half, commonly to represent marriage or office."}, {"id": "inescutcheon", "term": "Inescutcheon", "cat": "Inheritance", "def": "A smaller shield placed within the principal shield and used as a charge or as part of a marshalled composition."}, {"id": "pretence", "term": "Escutcheon of pretence", "cat": "Inheritance", "def": "In traditional English marshalling, a small central shield bearing the arms of an heraldic heiress, placed over her husband’s arms."}, {"id": "crest", "term": "Crest", "cat": "Around the shield", "def": "The device positioned above the helm, historically represented as a three-dimensional object worn on the helmet. It is not a synonym for the complete coat of arms."}, {"id": "helm", "term": "Helm", "cat": "Around the shield", "def": "The helmet placed above the shield and beneath the crest. Its form and orientation may follow historical or jurisdictional conventions."}, {"id": "wreath", "term": "Wreath / torse", "cat": "Around the shield", "def": "The twisted band of cloth beneath the crest, usually shown in alternating tinctures."}, {"id": "mantling", "term": "Mantling", "cat": "Around the shield", "def": "The decorative cloth flowing from the helm, conventionally derived from the protective cloth worn over a medieval helmet."}, {"id": "supporters", "term": "Supporters", "cat": "Around the shield", "def": "Human, animal, or imaginary figures standing beside and appearing to support the shield. Entitlement to supporters is restricted in many jurisdictions."}, {"id": "compartment", "term": "Compartment", "cat": "Around the shield", "def": "The ground, platform, landscape, or other base upon which supporters stand."}, {"id": "motto", "term": "Motto", "cat": "Around the shield", "def": "A phrase associated with the armiger and usually displayed on a scroll. Its legal and hereditary status varies between heraldic jurisdictions."}];
const CATEGORIES = ["Foundations","Tinctures and furs","Shield divisions","Animate charges","Inheritance","Around the shield"];
const BAY_SHORT = {"Foundations":"Foundations","Tinctures and furs":"Tinctures","Shield divisions":"Divisions","Animate charges":"Charges","Inheritance":"Inheritance","Around the shield":"Around"};
const WALK_LENGTH=10, CIRCUIT_PER_BAY=2, TOTAL=GLOSSARY.length, CIRCUIT_LENGTH=CATEGORIES.length*CIRCUIT_PER_BAY;
const SAVE_KEY="hall-of-arms-save-v2";
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function emptySave(){return {bestWalk:0,bestCircuit:0,mastery:{}}}
function readSave(){
  try{const p=JSON.parse(localStorage.getItem(SAVE_KEY)||"null");if(p)return {bestWalk:+p.bestWalk||0,bestCircuit:+p.bestCircuit||0,mastery:p.mastery||{}}}catch(e){}
  return emptySave();
}
function writeSave(s){localStorage.setItem(SAVE_KEY,JSON.stringify(s))}
function writeBest(kind,score){const s=readSave();if(kind==="circuit")s.bestCircuit=Math.max(s.bestCircuit,score);else s.bestWalk=Math.max(s.bestWalk,score);writeSave(s)}
function recordAnswer(id,ok){const s=readSave();const prev=s.mastery[id]||{seen:0,hit:0};s.mastery[id]={seen:prev.seen+1,hit:prev.hit+(ok?1:0)};writeSave(s)}
function knownCount(){return Object.values(readSave().mastery).filter(m=>m.hit>=1).length}
function makeQuestion(answer,index){
  const same=GLOSSARY.filter(g=>g.cat===answer.cat&&g.id!==answer.id);
  const rest=GLOSSARY.filter(g=>g.id!==answer.id);
  const pool=same.length>=3?same:rest;
  return {answer,choices:shuffle([answer,...shuffle(pool).slice(0,3)]),kind:index%2===0?"term":"def"};
}
function makeWalk(length,cat){const source=cat?GLOSSARY.filter(g=>g.cat===cat):GLOSSARY;const n=Math.min(length,source.length);return shuffle(source).slice(0,n).map(makeQuestion)}
function makeCircuit(){return CATEGORIES.flatMap(cat=>shuffle(GLOSSARY.filter(g=>g.cat===cat)).slice(0,CIRCUIT_PER_BAY)).map(makeQuestion)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','"':'&quot;'}[c]||c})}

const S={screen:"gate",kind:"walk",bay:null,walk:[],index:0,picked:null,score:0,studyCat:null,studyIndex:0};
function gold(label,fn,extra=""){return `<button class="gold-btn" ${extra} data-act="${fn}">${label}</button>`}
function ghost(label,fn,extra=""){return `<button class="ghost-btn" ${extra} data-act="${fn}">${label}</button>`}

function render(){
  const save=readSave();
  const known=knownCount();
  
  const ui=document.getElementById("ui");
  if(S.screen==="gate"){
    ui.innerHTML=`<div class="plaque center">
      <p class="kicker">Fourteenth century · Saxony</p>
      <h1>Hall of Arms</h1>
      <p class="lede">Seventy-two terms of old heraldry, hung in a palas corridor.</p>
      <div class="row">${gold("Enter the hall","walk")}${ghost("The six bays","circuit")}${ghost("Study","study")}</div>
      <p class="kicker gold-soft" style="margin-top:1.5rem">Walk a bay</p>
      <div class="row" style="margin-top:.4rem">${CATEGORIES.map(c=>`<button class="bay-link" data-bay="${esc(c)}">${esc(BAY_SHORT[c])}</button>`).join("")}</div>
      <p class="stats">${known?known+" of "+TOTAL+" known · ":""}${save.bestWalk?"Walk "+save.bestWalk+"/"+WALK_LENGTH:""}${save.bestWalk&&save.bestCircuit?" · ":""}${save.bestCircuit?"Bays "+save.bestCircuit+"/"+CIRCUIT_LENGTH:""}</p>
    </div>`;
  } else if(S.screen==="quiz"){
    const q=S.walk[S.index];
    const prompt=q.kind==="term"?q.answer.term:q.answer.def;
    const hint=q.kind==="term"?"Choose the meaning":"Name the term";
    const missed=S.picked&&S.picked!==q.answer.id;
    ui.innerHTML=`<p class="center gold-soft kicker" style="margin-bottom:.75rem">Bay ${S.index+1} of ${S.walk.length} · ${S.score} true</p>
      <div class="plaque">
        <p class="kicker">${esc(q.answer.cat)} · ${hint}</p>
        <h2 style="font-size:${q.kind==="term"?"2rem":"1.25rem"};font-family:${q.kind==="term"?"var(--display)":"var(--body)"}">${esc(prompt)}</h2>
        <ol class="choices">${q.choices.map((c,i)=>{
          let st="idle"; if(S.picked){st=c.id===q.answer.id?"correct":c.id===S.picked?"wrong":"muted"}
          return `<li><button class="choice ${st}" data-choice="${esc(c.id)}" ${S.picked?"disabled":""}><span class="n">${i+1}</span><span>${esc(q.kind==="term"?c.def:c.term)}</span></button></li>`;
        }).join("")}</ol>
        ${missed?`<p class="miss"><strong>${esc(q.answer.term)}.</strong> ${esc(q.answer.def)}</p>`:""}
        ${S.picked?`<div class="row" style="justify-content:flex-end">${gold(S.index+1===S.walk.length?"Leave the hall":"Continue","next")}</div>`:""}
      </div>`;
  } else if(S.screen==="study"){
    const list=S.studyCat?GLOSSARY.filter(g=>g.cat===S.studyCat):GLOSSARY;
    const e=list[S.studyIndex]||list[0];
    ui.innerHTML=`<p class="center gold-soft kicker" style="margin-bottom:.75rem">Plaque ${S.studyIndex+1} of ${list.length}</p>
      <div class="plaque">
        <div class="row" style="justify-content:flex-start;margin-top:0">
          <button class="bay-link ${S.studyCat===null?"on":""}" data-study="">All</button>
          ${CATEGORIES.map(c=>`<button class="bay-link ${S.studyCat===c?"on":""}" data-study="${esc(c)}">${esc(BAY_SHORT[c])}</button>`).join("")}
        </div>
        <p class="kicker" style="margin-top:1rem">${esc(e.cat)}</p>
        <h2>${esc(e.term)}</h2>
        <p class="lede" style="margin-left:0;max-width:none">${esc(e.def)}</p>
        <div class="row" style="justify-content:space-between">${ghost("Return","gate")}<div class="row" style="margin:0">${ghost("Previous","prev",S.studyIndex===0?"disabled":"")}${gold("Next","next",S.studyIndex===list.length-1?"disabled":"")}</div></div>
      </div>`;
  } else {
    const total=S.walk.length, best=S.kind==="circuit"?save.bestCircuit:save.bestWalk;
    const ratio=S.score/total;
    const line=S.score===total?"The hall knows your step.":ratio>=.7?"The lamps stay with you.":ratio>=.4?"A fair beginning in oak and gold.":"Walk it again. The terms keep.";
    ui.innerHTML=`<div class="plaque center">
      <p class="kicker">${S.kind==="circuit"?"The six bays":"End of the corridor"}</p>
      <h2>${S.score}<span style="font-size:1.25rem;color:var(--muted)"> / ${total}</span></h2>
      <p class="lede">${line}</p>
      <p class="stats">Best ${best}/${total}${known?` · ${known} of ${TOTAL} known`:""}</p>
      <div class="row">${gold("Walk again","again")}${ghost("Study","study")}${ghost("Gate","gate")}</div>
    </div>`;
  }
  ui.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>act(b.dataset.act,b.disabled));
  ui.querySelectorAll("[data-bay]").forEach(b=>b.onclick=()=>begin("bay",b.dataset.bay));
  ui.querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>choose(b.dataset.choice));
  ui.querySelectorAll("[data-study]").forEach(b=>b.onclick=()=>{S.studyCat=b.dataset.study||null;S.studyIndex=0;render()});
}
function begin(kind,cat){S.kind=kind;S.bay=cat||null;S.walk=kind==="circuit"?makeCircuit():makeWalk(WALK_LENGTH,cat);S.index=0;S.picked=null;S.score=0;S.screen="quiz";render()}
function choose(id){if(S.picked||S.screen!=="quiz")return;const q=S.walk[S.index];S.picked=id;const ok=id===q.answer.id;if(ok)S.score++;recordAnswer(q.answer.id,ok);render()}
function act(name,disabled){
  if(disabled)return;
  if(name==="walk")return begin("walk");
  if(name==="circuit")return begin("circuit");
  if(name==="study"){S.studyCat=null;S.studyIndex=0;S.screen="study";return render()}
  if(name==="gate"){S.screen="gate";return render()}
  if(name==="again")return begin(S.kind,S.kind==="bay"?S.bay:undefined);
  if(name==="next"&&S.screen==="quiz"){
    if(S.index+1>=S.walk.length){writeBest(S.kind,S.score);S.screen="end";return render()}
    S.index++;S.picked=null;return render();
  }
  if(name==="next"&&S.screen==="study"){const list=S.studyCat?GLOSSARY.filter(g=>g.cat===S.studyCat):GLOSSARY;S.studyIndex=Math.min(list.length-1,S.studyIndex+1);return render()}
  if(name==="prev"){S.studyIndex=Math.max(0,S.studyIndex-1);return render()}
}
document.addEventListener("keydown",e=>{
  if(S.screen==="study"){
    if(e.key==="ArrowRight"){e.preventDefault();act("next")}
    if(e.key==="ArrowLeft"){e.preventDefault();act("prev")}
    return;
  }
  if(S.screen!=="quiz"||!S.walk[S.index])return;
  if(S.picked&&(e.key==="Enter"||e.key===" ")){e.preventDefault();act("next");return}
  const n=+e.key;if(n>=1&&n<=4&&!S.picked){const c=S.walk[S.index].choices[n-1];if(c)choose(c.id)}
});
render();
</script>
