<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bay Area Slang Simulator</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background-color: #87CEEB; 
            transition: background-color 3s ease;
        }

        /* --- THE WORLD ENVIRONMENT (PURE CSS ART) --- */
        #world-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            transition: all 3s ease;
        }

        /* Dynamic Sky Gradients */
        .sky-dawn { background: linear-gradient(to bottom, #4a6fa5, #ffb347); }
        .sky-day { background: linear-gradient(to bottom, #56ccf2, #2f80ed); }
        .sky-sunset { background: linear-gradient(to bottom, #2b1055, #f53844, #fdbb2d); }
        .sky-night { background: linear-gradient(to bottom, #0f2027, #203a43, #2c5364); }

        /* Sun / Moon */
        .celestial-body {
            position: absolute;
            border-radius: 50%;
            transition: all 4s ease-in-out;
            z-index: 2;
        }
        .sun {
            width: 120px; height: 120px;
            background: #FFD700;
            box-shadow: 0 0 60px #FF8C00;
            top: 20%; left: 30%;
        }
        .moon {
            width: 100px; height: 100px;
            background: #f1f2f6;
            box-shadow: 0 0 40px #dfe4ea;
            top: 15%; left: 40%;
            opacity: 0; 
        }

        /* Golden Gate Bridge Silhouette */
        .bridge-container {
            position: absolute;
            bottom: 35%;
            left: 5%;
            width: 45%;
            height: 150px;
            z-index: 3;
            opacity: 0.8;
            display: flex;
            align-items: flex-end;
            gap: 120px;
            transition: filter 3s ease;
        }
        .bridge-tower {
            width: 18px;
            height: 100%;
            background-color: #c0392b;
            border-top: 5px solid #a93226;
            box-shadow: inset -4px 0 0 rgba(0,0,0,0.2);
            position: relative;
        }
        .bridge-cable {
            position: absolute;
            width: 120px;
            height: 100px;
            border-bottom: 4px solid #c0392b;
            border-radius: 50%;
            bottom: 50px;
            left: 18px;
        }
        .bridge-deck {
            position: absolute;
            bottom: 30px;
            width: 120%;
            height: 6px;
            background-color: #922b21;
        }

        /* San Francisco Hills */
        .hill {
            position: absolute;
            border-radius: 50% 50% 0 0;
            transition: background 3s ease;
        }
        .hill-back {
            width: 120%; height: 60%;
            bottom: -10%; left: -10%;
            background: #2c3e50;
            z-index: 4;
        }
        .hill-mid {
            width: 110%; height: 50%;
            bottom: -5%; right: -20%;
            background: #34495e;
            z-index: 5;
        }

        /* Upgraded City Skyline */
        .skyline {
            position: absolute;
            bottom: 42%;
            right: 18%;
            display: flex;
            align-items: flex-end;
            gap: 8px;
            z-index: 4;
            transition: filter 3s ease;
        }
        
        .building { 
            background: #1a252f; 
            width: 45px; 
            position: relative;
            box-shadow: inset -5px 0 0 rgba(0,0,0,0.3);
            border-radius: 2px 2px 0 0;
        }
        /* Salesforce Tower */
        .salesforce {
            width: 40px; height: 240px;
            border-radius: 20px 20px 0 0;
            background: linear-gradient(to right, #2c3e50, #1a252f);
        }
        /* Transamerica Pyramid */
        .pyramid {
            width: 0; height: 0;
            border-left: 22px solid transparent;
            border-right: 22px solid transparent;
            border-bottom: 190px solid #1a252f;
            position: relative;
        }
        /* Coit Tower */
        .coit {
            width: 25px; height: 90px;
            background: #2c3e50;
            border-radius: 6px 6px 0 0;
            margin-left: 15px;
        }
        .coit::before {
            content: ''; position: absolute;
            top: -10px; left: 5px;
            width: 15px; height: 10px;
            background: #1a252f;
            border-radius: 3px 3px 0 0;
        }
        
        /* City Windows (Glow at Night) */
        .building-windows {
            position: absolute;
            top: 10px; left: 10%; width: 80%; height: 90%;
            background-image: radial-gradient(#34495e 2px, transparent 2px);
            background-size: 8px 12px;
            transition: background-image 3s ease;
        }
        .sky-night .building-windows {
            background-image: radial-gradient(#f1c40f 2px, transparent 2px);
        }

        /* The Painted Ladies Neighborhood */
        .neighborhood {
            position: absolute;
            bottom: 30%;
            left: 25%;
            display: flex;
            gap: 12px;
            z-index: 6;
            transform: rotate(-2deg); /* Follow the hill slope */
            transition: filter 3s ease;
        }
        
        .victorian {
            width: 50px;
            height: 70px;
            background-color: var(--house-color);
            position: relative;
            box-shadow: inset -4px -4px 0 rgba(0,0,0,0.1);
            border-radius: 2px;
        }
        /* Victorian Triangle Roofs */
        .victorian::before {
            content: '';
            position: absolute;
            top: -25px; left: -5px;
            width: 0; height: 0;
            border-left: 30px solid transparent;
            border-right: 30px solid transparent;
            border-bottom: 25px solid #34495e;
        }
        /* Bay Windows */
        .bay-window {
            position: absolute;
            bottom: 5px; left: 10px;
            width: 30px; height: 40px;
            background: #ecf0f1;
            border: 2px solid #bdc3c7;
            border-radius: 2px;
            display: flex;
            flex-wrap: wrap;
            padding: 2px;
            box-sizing: border-box;
            gap: 2px;
        }
        .house-pane {
            width: 10px; height: 15px;
            background: #95a5a6;
            transition: background 3s ease;
        }
        .sky-night .house-pane { background: #f1c40f; box-shadow: 0 0 5px #f1c40f;} /* Lights turn on */
        
        /* House Colors */
        .house1 { --house-color: #fab1a0; } /* Light Coral */
        .house2 { --house-color: #ffeaa7; } /* Pale Yellow */
        .house3 { --house-color: #81ecec; } /* Light Cyan */
        .house4 { --house-color: #a29bfe; } /* Soft Purple */
        .house5 { --house-color: #55efc4; } /* Mint Green */

        /* Foreground Track & Hill */
        .hill-front {
            width: 120%; height: 35%;
            bottom: -5%; left: -10%;
            background: #27ae60;
            z-index: 7;
            transform: rotate(-3deg);
        }
        .track {
            position: absolute;
            width: 100%; height: 8px;
            background: #7f8c8d;
            bottom: 22%;
            z-index: 8;
            transform: rotate(-3deg);
            border-top: 2px dashed #95a5a6;
        }

        /* Animated Trolley */
        .trolley {
            font-size: 4.5rem;
            position: absolute;
            bottom: 21%;
            left: -100px;
            z-index: 9;
            animation: driveAcross 16s linear infinite;
            filter: drop-shadow(4px 6px 8px rgba(0,0,0,0.4));
            transform: rotate(-3deg);
        }
        @keyframes driveAcross {
            0% { left: -150px; }
            100% { left: 110%; }
        }

        /* Karl the Fog */
        .fog-layer {
            position: absolute;
            bottom: 0; left: 0;
            width: 200%; height: 100%;
            background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.2) 20%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0.2) 80%, transparent 100%);
            animation: fogDrift 45s linear infinite;
            pointer-events: none;
            z-index: 10;
        }
        @keyframes fogDrift {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* Arcade Terminal CRT Scanlines */
        .scanlines {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px;
            z-index: 100;
            pointer-events: none;
        }

        /* --- THE UI (GLASSMORPHISM SIDEBAR) --- */
        #quiz-sidebar {
            position: absolute;
            top: 0; right: 0;
            width: 28%; 
            height: 100%;
            background: rgba(255, 255, 255, 0.75); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            box-shadow: -10px 0 30px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            padding: 40px 30px;
            box-sizing: border-box;
            overflow-y: auto;
            z-index: 50; 
            border-left: 1px solid rgba(255,255,255,0.5);
            transition: background 3s ease;
        }

        /* Night Mode UI Overrides */
        .night-ui #quiz-sidebar {
            background: rgba(26, 37, 47, 0.85);
            border-left: 1px solid rgba(0,0,0,0.5);
        }
        .night-ui h1, .night-ui #question-text { color: #ecf0f1; }
        .night-ui .option-btn { background: #34495e; color: #ecf0f1; border-color: #2c3e50; }
        .night-ui .option-btn:hover:not(:disabled) { background: #2c3e50; }

        h1 {
            font-size: 1.8rem;
            color: #2c3e50;
            margin-top: 0;
            border-bottom: 3px solid #e74c3c;
            padding-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 3s ease;
        }

        .stats-container {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-weight: bold;
            color: #7f8c8d;
            font-size: 1.1rem;
        }
        .high-score { color: #e67e22; }

        #timer-display {
            font-weight: bold;
            color: #e74c3c;
            margin-bottom: 25px;
            font-size: 1.3rem;
            background: rgba(255,255,255,0.9);
            padding: 8px 12px;
            border-radius: 6px;
            border: 2px solid #e74c3c;
            display: inline-block;
            text-align: center;
        }

        #question-text {
            font-size: 1.3rem;
            line-height: 1.6;
            color: #2c3e50;
            margin-bottom: 30px;
            font-weight: 600;
            transition: color 3s ease;
        }

        .option-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            background-color: rgba(255,255,255,0.9);
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: 500;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }

        .option-btn.correct { background-color: #2ecc71 !important; color: white !important; border-color: #27ae60 !important; }
        .option-btn.wrong { background-color: #e74c3c !important; color: white !important; border-color: #c0392b !important; }

        #next-btn {
            margin-top: auto;
            padding: 16px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            display: none; 
            box-shadow: 0 4px 10px rgba(52, 152, 219, 0.4);
        }
        #next-btn:hover { background-color: #2980b9; transform: translateY(-2px); }

        .hub-btn {
            margin-top: 20px;
            padding: 12px;
            background-color: #95a5a6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: background 0.3s;
        }
        .hub-btn:hover { background-color: #7f8c8d; }

        @media (max-width: 900px) {
            #quiz-sidebar { width: 100%; position: relative; backdrop-filter: none; background: #fff; }
            #world-container { position: fixed; height: 40vh; }
        }
    </style>
</head>
<body id="game-body" class="sky-day">

    <div class="scanlines"></div>

    <!-- The Pure CSS Art World -->
    <div id="world-container">
        
        <div class="celestial-body sun" id="sun"></div>
        <div class="celestial-body moon" id="moon"></div>
        
        <div class="bridge-container" id="bridge">
            <div class="bridge-tower"></div>
            <div class="bridge-cable"></div>
            <div class="bridge-tower"></div>
            <div class="bridge-deck"></div>
        </div>
        
        <!-- Expanded Skyline -->
        <div class="skyline" id="city">
            <div class="building" style="height: 120px;"><div class="building-windows"></div></div>
            <div class="building salesforce"><div class="building-windows"></div></div>
            <div class="building" style="height: 160px; width: 30px;"><div class="building-windows"></div></div>
            <div class="pyramid"></div>
            <div class="coit"></div>
        </div>

        <div class="hill hill-back" id="hill1"></div>
        <div class="hill hill-mid" id="hill2"></div>
        
        <!-- Painted Ladies Neighborhood -->
        <div class="neighborhood" id="town">
            <div class="victorian house1">
                <div class="bay-window"><div class="house-pane"></div><div class="house-pane"></div><div class="house-pane"></div><div class="house-pane"></div></div>
            </div>
            <div class="victorian house2">
                <div class="bay-window"><div class="house-pane"></div><div class="house-pane"></div><div class="house-pane"></div><div class="house-pane"></div></div>
            </div>
            <div class="victorian house3">
                <div class="bay-window"><div class="house-pane"></div><div class="house-pane"></div><div class="house-pane"></div><div class="house-pane"></div></div>
            </div>
            <div class="victorian house4">
                <div class="bay-window"><div class="house-pane"></div><div class="house-pane"></div><div class="house-pane"></div><div class="house-pane"></div></div>
            </div>
            <div class="victorian house5">
                <div class="bay-window"><div class="house-pane"></div><div class="house-pane"></div><div class="house-pane"></div><div class="house-pane"></div></div>
            </div>
        </div>
        
        <div class="hill hill-front" id="hill3"></div>
        <div class="track"></div>
        <div class="trolley">🚃</div>
        
        <div class="fog-layer"></div>
    </div>
    
    <!-- Glassmorphism Sidebar UI -->
    <div id="quiz-sidebar">
        <h1>Bay Area Lingo</h1>
        
        <div class="stats-container">
            <span id="score-display">Score: 0</span>
            <span class="high-score" id="highscore-display">High Score: 0</span>
        </div>
        
        <div id="timer-display">Time: 30s</div>
        <div id="question-text">Loading question...</div>
        
        <div id="options-container"></div>

        <button id="next-btn" onclick="nextQuestion()">Next Question</button>
        <a href="#" class="hub-btn">↩ Return to Arcade Hub</a>
    </div>

    <script>
        const dictionary = [
            { term: "The City", def: "San Francisco itself, particularly when speaking within the Bay Area." },
            { term: "SF", def: "Standard, widely accepted abbreviation for San Francisco." },
            { term: "San Fran", def: "Common shorthand outside the region, but often avoided or disliked by locals." },
            { term: "Frisco", def: "Historically rooted but contested nickname; embraced by some working-class and cultural communities and disliked by others." },
            { term: "The Bay / The Yay", def: "The broader San Francisco Bay Area. 'Yay Area' is a playful, hip-hop-influenced variation." },
            { term: "The East Bay", def: "Oakland, Berkeley, and surrounding communities east of San Francisco Bay." },
            { term: "The Peninsula", def: "Communities extending south from San Francisco toward Silicon Valley." },
            { term: "South Bay", def: "San Jose and neighboring Silicon Valley communities." },
            { term: "The Town / Oaktown", def: "Oakland. Commonly contrasted with San Francisco as 'The City.'" },
            { term: "415", def: "San Francisco, referenced through its best-known area code." },
            { term: "San Jo", def: "Informal abbreviation for San Jose." },
            { term: "B-Town", def: "Context-dependent nickname sometimes used for Berkeley or another nearby place beginning with B." },
            { term: "The Mission", def: "San Francisco’s Mission District." },
            { term: "The Richmond", def: "San Francisco’s Richmond District, not the separate city of Richmond." },
            { term: "The Sunset", def: "San Francisco’s Sunset District." },
            { term: "SoMa", def: "South of Market, a large district south of Market Street." },
            { term: "FiDi", def: "San Francisco’s Financial District." },
            { term: "North Beach", def: "Historic Italian-American neighborhood; primarily an urban neighborhood rather than a beach destination." },
            { term: "The Tenderloin / TL", def: "Central San Francisco neighborhood; 'TL' is common shorthand." },
            { term: "The Avenues", def: "The numbered avenues running through the Richmond and Sunset districts." },
            { term: "Bridge and tunnel", def: "Sometimes dismissive description of people who commute into San Francisco from outside the city." },
            { term: "Karl / Karl the Fog", def: "Personified nickname for San Francisco’s fog." },
            { term: "June Gloom", def: "Persistent coastal clouds and overcast during late spring and early summer." },
            { term: "Microclimate", def: "A small area with noticeably different weather from nearby areas—a constant feature of Bay Area life." },
            { term: "Muni", def: "San Francisco’s municipal transit system, including buses, light rail, streetcars, and cable cars." },
            { term: "BART", def: "Bay Area Rapid Transit, the regional rail network." },
            { term: "Caltrain", def: "Commuter and regional rail connecting San Francisco with the Peninsula, San Jose, and the South Bay." },
            { term: "Clipper", def: "The regional fare-payment system used across multiple Bay Area transit agencies." },
            { term: "No 'the' before freeways", def: "Saying 'take 101' or 'get on 880,' unlike the Southern California pattern of 'the 101.'" },
            { term: "Hella", def: "Very, extremely, or a large amount: 'It’s hella cold'." },
            { term: "Yee / Yeee", def: "Energetic expression of yes, agreement, approval, or excitement." },
            { term: "Tryna", def: "'Trying to'; it can also introduce an invitation: 'Tryna eat?'" },
            { term: "Finna", def: "About to or preparing to do something." },
            { term: "Fasho / Fa sho", def: "'For sure'; agreement, confirmation, or assurance." },
            { term: "Yadadamean", def: "'You know what I mean?'" },
            { term: "Dip", def: "To leave or depart, often quickly." },
            { term: "Swoop", def: "To pick someone up, usually in a car." },
            { term: "Smackin’ / Smacks", def: "Extremely tasty, especially when describing food." },
            { term: "Bootsie / Bootsy", def: "Lame, undesirable, low-quality, or unimpressive." },
            { term: "Hyphy", def: "High-energy Bay Area hip-hop movement and cultural style; also describes acting extremely energetic or wild." },
            { term: "Slap / Slaps", def: "Something excellent, particularly a song, beat, or piece of music." },
            { term: "Function", def: "A party, gathering, or social event." },
            { term: "Whip", def: "A car or other personal vehicle." },
            { term: "Scraper", def: "Customized older American car, frequently featuring oversized rims, prominent paint, and a loud system." },
            { term: "Sideshow", def: "Unauthorized street gathering where drivers perform doughnuts, burnouts, and other vehicle stunts." },
            { term: "Dubs", def: "The Golden State Warriors; depending on context, it can also mean twenty-inch wheels." }
        ];

        let availableQuestions = [...dictionary];
        let currentQuestionObj = null;
        let score = 0;
        let totalQuestionsShown = 0;
        let timerInterval;
        let timeLeft = 30;
        
        let highScore = localStorage.getItem('sf_slang_highscore') || 0;
        document.getElementById('highscore-display').innerText = `High Score: ${highScore}`;

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function updateEnvironment() {
            const body = document.getElementById('game-body');
            const sun = document.getElementById('sun');
            const moon = document.getElementById('moon');
            const hill1 = document.getElementById('hill1');
            const hill2 = document.getElementById('hill2');
            const hill3 = document.getElementById('hill3');
            const bridge = document.getElementById('bridge');
            const city = document.getElementById('city');
            const town = document.getElementById('town');
            
            const cyclePhase = Math.floor(totalQuestionsShown / 4) % 4;

            body.className = ''; 
            
            if (cyclePhase === 0) {
                // DAY
                body.classList.add('sky-day');
                sun.style.top = '10%'; sun.style.background = '#FFD700'; sun.style.boxShadow = '0 0 60px #FF8C00'; sun.style.opacity = '1';
                moon.style.opacity = '0';
                hill1.style.background = '#2c3e50'; hill2.style.background = '#34495e'; hill3.style.background = '#27ae60';
                bridge.style.filter = 'brightness(1)';
                city.style.filter = 'brightness(1)';
                town.style.filter = 'brightness(1)';
            } else if (cyclePhase === 1) {
                // SUNSET
                body.classList.add('sky-sunset');
                sun.style.top = '60%'; sun.style.background = '#e74c3c'; sun.style.boxShadow = '0 0 80px #c0392b'; sun.style.opacity = '1';
                moon.style.opacity = '0';
                hill1.style.background = '#1a252f'; hill2.style.background = '#2c3e50'; hill3.style.background = '#1e8449';
                bridge.style.filter = 'brightness(0.5) sepia(0.5)';
                city.style.filter = 'brightness(0.6) sepia(0.3)';
                town.style.filter = 'brightness(0.7) sepia(0.4)';
            } else if (cyclePhase === 2) {
                // NIGHT
                body.classList.add('sky-night');
                body.classList.add('night-ui'); 
                sun.style.opacity = '0';
                moon.style.opacity = '1';
                hill1.style.background = '#0a0a0a'; hill2.style.background = '#111'; hill3.style.background = '#0b5345';
                bridge.style.filter = 'brightness(0.2)';
                city.style.filter = 'brightness(0.3)';
                town.style.filter = 'brightness(0.4)';
            } else if (cyclePhase === 3) {
                // DAWN
                body.classList.add('sky-dawn');
                sun.style.top = '70%'; sun.style.background = '#f39c12'; sun.style.boxShadow = '0 0 50px #f1c40f'; sun.style.opacity = '1';
                moon.style.opacity = '0';
                hill1.style.background = '#212f3d'; hill2.style.background = '#283747'; hill3.style.background = '#1d8348';
                bridge.style.filter = 'brightness(0.7)';
                city.style.filter = 'brightness(0.8)';
                town.style.filter = 'brightness(0.8)';
            }
        }
        
        function startTimer() {
            timeLeft = 30;
            document.getElementById('timer-display').innerText = `Time: ${timeLeft}s`;
            clearInterval(timerInterval);
            
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-display').innerText = `Time: ${timeLeft}s`;
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleTimeout();
                }
            }, 1000);
        }

        function handleTimeout() {
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(btn => {
                btn.disabled = true;
                if (btn.innerText === currentQuestionObj.term) { btn.classList.add('correct'); }
            });
            score = 0; 
            updateScores();
            document.getElementById('next-btn').style.display = 'block';
        }

        function loadQuestion() {
            if (availableQuestions.length === 0) {
                availableQuestions = [...dictionary];
            }

            const poolIndex = Math.floor(Math.random() * availableQuestions.length);
            currentQuestionObj = availableQuestions[poolIndex];
            availableQuestions.splice(poolIndex, 1);

            let options = [currentQuestionObj.term];
            while (options.length < 4) {
                let randomTerm = dictionary[Math.floor(Math.random() * dictionary.length)].term;
                if (!options.includes(randomTerm)) { options.push(randomTerm); }
            }
            
            shuffleArray(options);

            document.getElementById('question-text').innerText = currentQuestionObj.def;
            document.getElementById('next-btn').style.display = 'none';
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = ''; 

            options.forEach(optionText => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = optionText;
                btn.onclick = () => checkAnswer(btn, optionText === currentQuestionObj.term);
                optionsContainer.appendChild(btn);
            });

            updateEnvironment();
            totalQuestionsShown++;
            startTimer();
        }

        function checkAnswer(selectedBtn, isCorrect) {
            clearInterval(timerInterval); 
            
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(btn => {
                btn.disabled = true;
                if (btn.innerText === currentQuestionObj.term) { btn.classList.add('correct'); }
            });

            if (isCorrect) {
                score++;
            } else {
                selectedBtn.classList.add('wrong');
                score = 0; 
            }

            updateScores();
            document.getElementById('next-btn').style.display = 'block';
        }
        
        function updateScores() {
            document.getElementById('score-display').innerText = `Score: ${score}`;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('sf_slang_highscore', highScore);
                document.getElementById('highscore-display').innerText = `High Score: ${highScore}`;
            }
        }

        function nextQuestion() { loadQuestion(); }

        loadQuestion();
    </script>
</body>
</html>
