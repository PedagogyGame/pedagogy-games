<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Design Vocab Racer</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #game-container {
            background-color: #2b2b2b;
            border: 4px solid #444;
            border-radius: 10px;
            padding: 30px;
            width: 800px;
            max-width: 90%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        #hud {
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            margin-bottom: 20px;
            font-weight: bold;
            color: #00ffcc;
        }
        #friend-case {
            background-color: #e6e6e6;
            color: #111;
            border: 8px solid #333;
            border-radius: 5px;
            padding: 40px 20px;
            margin: 20px auto;
            width: 80%;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.5);
            transform: rotate(-2deg);
        }
        #input-area {
            margin-top: 30px;
        }
        input[type="text"] {
            padding: 15px;
            font-size: 1.2rem;
            width: 60%;
            border: none;
            border-radius: 5px;
            outline: none;
        }
        button {
            padding: 15px 25px;
            font-size: 1.2rem;
            background-color: #00ffcc;
            color: #111;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #00ccaa;
        }
        #message-board {
            margin-top: 20px;
            font-size: 1.2rem;
            min-height: 30px;
            font-weight: bold;
        }
        .correct { color: #00ff00; }
        .incorrect { color: #ff3333; }
        .crash { color: #ff0000; font-size: 2rem; text-transform: uppercase; }
        
        #restart-btn {
            display: none;
            margin: 20px auto 0 auto;
            background-color: #ff3333;
            color: white;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="hud">
        <div id="score-display">Score: 0</div>
        <div id="timer-display">Time: 15s</div>
    </div>

    <div id="friend-case">
        <span id="definition-text">Press Start to Begin!</span>
    </div>

    <div id="input-area">
        <input type="text" id="answer-input" placeholder="Type the term here..." disabled autocomplete="off">
        <button id="submit-btn" disabled>Submit</button>
    </div>

    <div id="message-board"></div>
    <button id="restart-btn">Play Again</button>
</div>

<script>
    const vocabList = [
        { term: "Core loop", def: "Repeating actions forming the game's central experience." },
        { term: "Player fantasy", def: "Identity or experience the game lets players inhabit." },
        { term: "Mechanic", def: "Rule governing player interaction." },
        { term: "System", def: "Interacting set of game rules." },
        { term: "Dynamic", def: "Behavior emerging when systems operate together." },
        { term: "Affordance", def: "Design cue suggesting possible interaction." },
        { term: "Feedback", def: "Game response communicating consequences to players." },
        { term: "Telegraphing", def: "Signaling an action before it occurs." },
        { term: "Onboarding", def: "Teaching players how the game works." },
        { term: "Pacing", def: "Control of intensity and downtime." },
        { term: "Difficulty curve", def: "How challenge changes over time." },
        { term: "Progression", def: "Structured growth in power, options, or status." },
        { term: "Skill floor", def: "Minimum skill needed to participate effectively." },
        { term: "Skill ceiling", def: "Maximum mastery a system permits." },
        { term: "Level design", def: "Construction of navigable play spaces." },
        { term: "Encounter design", def: "Construction of individual challenges or confrontations." },
        { term: "Game economy", def: "System governing resources and exchange." },
        { term: "Faucet", def: "Mechanism introducing resources into an economy." },
        { term: "Sink", def: "Mechanism removing resources from an economy." },
        { term: "Balance", def: "Adjusting systems to produce intended tradeoffs." },
        { term: "Emergent gameplay", def: "Unscripted play arising from interacting systems." },
        { term: "Systemic design", def: "Designing rules that create many possible outcomes." },
        { term: "Game feel", def: "Immediate sensory quality of interaction." },
        { term: "Juice", def: "Extra audiovisual feedback making actions satisfying." },
        { term: "Hitstop", def: "Brief freeze emphasizing an impact." },
        { term: "Input latency", def: "Delay between input and game response." },
        { term: "Diegetic UI", def: "Interface existing inside the game world." },
        { term: "Ludonarrative dissonance", def: "Conflict between gameplay and story meaning." },
        { term: "Procedural generation", def: "Algorithmic creation of game content." },
        { term: "Rubber-banding", def: "Dynamically helping trailing competitors catch up." }
    ];

    const crashSequences = [
        "CRASH! You took the corner too fast and slammed into the guardrail!",
        "CRASH! An opponent PIT maneuvered you into a ditch!",
        "CRASH! You lost focus, spun out, and blew out two tires!",
        "CRASH! Engine failure! You pushed the car too hard and it burst into flames!",
        "CRASH! You hit an oil slick and barrel-rolled into the tire wall!",
        "CRASH! Head-on collision with a concrete barrier at 150mph!"
    ];

    let currentTerm = "";
    let score = 0;
    let mistakes = 0;
    let maxMistakes = 0; 
    let timer = 15;
    let timerInterval;
    let isPlaying = false;

    const defText = document.getElementById("definition-text");
    const inputField = document.getElementById("answer-input");
    const submitBtn = document.getElementById("submit-btn");
    const msgBoard = document.getElementById("message-board");
    const timerDisplay = document.getElementById("timer-display");
    const scoreDisplay = document.getElementById("score-display");
    const restartBtn = document.getElementById("restart-btn");

    function startGame() {
        score = 0;
        mistakes = 0;
        // Invisible weight: Randomize max mistakes between 4 and 6
        maxMistakes = Math.floor(Math.random() * 3) + 4; 
        isPlaying = true;
        
        inputField.disabled = false;
        submitBtn.disabled = false;
        restartBtn.style.display = "none";
        msgBoard.innerHTML = "";
        msgBoard.className = "";
        updateScore();
        
        inputField.focus();
        nextQuestion();
    }

    function nextQuestion() {
        if (!isPlaying) return;
        
        const randomIndex = Math.floor(Math.random() * vocabList.length);
        const selected = vocabList[randomIndex];
        
        currentTerm = selected.term;
        defText.innerHTML = `"${selected.def}"`;
        inputField.value = "";
        
        resetTimer();
    }

    function resetTimer() {
        clearInterval(timerInterval);
        timer = 15;
        timerDisplay.innerText = `Time: ${timer}s`;
        
        timerInterval = setInterval(() => {
            timer--;
            timerDisplay.innerText = `Time: ${timer}s`;
            
            if (timer <= 0) {
                clearInterval(timerInterval);
                handleMistake("Time's up!");
            }
        }, 1000);
    }

    function checkAnswer() {
        if (!isPlaying) return;
        
        const userAnswer = inputField.value.trim().toLowerCase();
        const correctAnswer = currentTerm.toLowerCase();

        if (userAnswer === correctAnswer) {
            score++;
            updateScore();
            showMessage(`Correct! It was "${currentTerm}".`, "correct");
            nextQuestion();
        } else {
            handleMistake(`Wrong! It was "${currentTerm}".`);
        }
    }

    function handleMistake(msg) {
        mistakes++;
        if (mistakes >= maxMistakes) {
            triggerCrash();
        } else {
            showMessage(msg + " Watch the road!", "incorrect");
            nextQuestion();
        }
    }

    function triggerCrash() {
        isPlaying = false;
        clearInterval(timerInterval);
        inputField.disabled = true;
        submitBtn.disabled = true;
        
        // Pick a random crash sequence
        const randomCrash = crashSequences[Math.floor(Math.random() * crashSequences.length)];
        
        defText.innerHTML = "GAME OVER";
        showMessage(randomCrash, "crash");
        restartBtn.style.display = "block";
    }

    function showMessage(text, className) {
        msgBoard.innerText = text;
        msgBoard.className = className;
    }

    function updateScore() {
        scoreDisplay.innerText = `Score: ${score}`;
    }

    // Event Listeners
    submitBtn.addEventListener("click", () => {
        if (!isPlaying) startGame();
        else checkAnswer();
    });

    inputField.addEventListener("keypress", (e) => {
        if (e.key === "Enter") {
            checkAnswer();
        }
    });

    restartBtn.addEventListener("click", startGame);

    // Initial State Setup
    inputField.disabled = true;
    submitBtn.disabled = false;
    submitBtn.innerText = "Start Engine";
    submitBtn.addEventListener("click", function startListener() {
        submitBtn.innerText = "Submit";
        submitBtn.removeEventListener("click", startListener);
        startGame();
    }, { once: true });

</script>
</body>
</html>
